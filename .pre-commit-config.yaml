repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0  # Use the latest stable version
    hooks:
      - id: black
        language_version: py313
        args: ["."]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      # Catches GitHub Actions errors that YAML parsing cannot: invalid context
      # references, bad `if:` expressions, unknown action inputs. A job-level
      # `if:` referencing the `matrix` context parses as valid YAML but makes
      # GitHub reject the whole workflow with a zero-job startup failure.
      # Uses the golang hook (not actionlint-docker) so pre-commit provisions
      # its own toolchain; the devcontainer has neither docker nor go on PATH.
      - id: actionlint

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (direct invocation)
        entry: markdownlint-cli2
        # Use the system language so pre-commit resolves the executable via PATH
        language: system
        args: ["--fix", "--config", ".markdownlint-cli2.yaml", "**/*.md"]
        # The args above already carry the glob, so pre-commit must not append
        # the staged filenames too: markdownlint-cli2 re-globs per argument, and
        # a commit staging ~100 markdown files hangs for over 10 minutes.
        # Linting the whole tree takes ~13s.
        pass_filenames: false
        files: \.(md|markdown)$

      - id: validate-notes-frontmatter
        name: Validate notes frontmatter
        entry: uv run python -c "from vultron.metadata.notes.loader import load_notes_registry; load_notes_registry()"
        language: system
        files: ^notes/.*\.md$
        exclude: ^notes/README\.md$
        pass_filenames: false

      - id: validate-incoming-learnings-frontmatter
        name: Validate incoming learnings frontmatter
        entry: uv run python -c "from vultron.metadata.history.incoming import validate_incoming_learnings; validate_incoming_learnings()"
        language: system
        files: ^plan/incoming/learnings/.*\.md$
        exclude: ^plan/incoming/learnings/README\.md$
        pass_filenames: false

      - id: validate-adr-frontmatter
        name: Validate ADR frontmatter
        entry: uv run python -c "from vultron.metadata.adr.loader import load_adr_registry; load_adr_registry()"
        language: system
        files: ^docs/adr/.*\.md$
        exclude: ^docs/adr/(index|README)\.md$
        pass_filenames: false

      - id: adr-index-sync
        name: ADR index and nav in sync
        entry: uv run python -m vultron.metadata.adr.index_gen --check
        language: system
        files: ^(docs/adr/.*\.md|mkdocs\.yml)$
        pass_filenames: false

      - id: demo-scenarios-sync
        name: Demo scenario artifacts in sync
        # The console script, not `python -m ...`: `__init__.py` re-exports from
        # `sync`, so `-m` runs the module twice as two distinct objects and
        # prints a RuntimeWarning on every commit. This also matches the command
        # every error message, README step and AGENTS.md entry names.
        entry: uv run demo-scenarios --check
        language: system
        # Three kinds of input make the committed artifacts stale, so all three
        # are watched (DEMOCI-11-005): the @scenario decorators in the scenario
        # modules, the renderers that turn them into tables and JSON, and the
        # artifacts themselves — the last so a hand-edit is caught too.
        #
        # Not covered: a commit that *only deletes* a scenario module and its
        # derived files. pre-commit's staged-file list excludes deletions, so no
        # pattern can match one; test_committed_artifacts_are_in_sync in
        # test/metadata/test_demo_scenario_artifacts.py is the backstop there.
        files: ^(vultron/demo/scenario/.*\.py|vultron/metadata/demo_scenarios/.*\.py|\.github/demo-scenarios\.json|test/ci/README-case-log-ratchet\.md|vultron/demo/scenario/README\.md)$
        pass_filenames: false

      - id: wire-context-sync
        name: JSON-LD @context in sync with wire vocabulary
        # Console script, not `python -m ...`: the package re-exports from
        # `sync`, so `-m` would run the module twice and print a RuntimeWarning.
        entry: uv run wire-context --check
        language: system
        # Two kinds of input make the artifact stale (VM-10-001/002): the wire
        # vocabulary classes (a new/renamed Vultron-namespace type, or a
        # changed _vocab_ns) and the committed file itself (a hand-edit).
        # test_committed_context_is_not_stale is the backstop for a deletion,
        # which pre-commit's staged-file list cannot match.
        files: ^(vultron/wire/as2/vocab/.*\.py|vultron/metadata/wire_context/.*\.py|docs/ns/context\.jsonld)$
        pass_filenames: false

      - id: flake8
        name: flake8 (with CC gate)
        # Routed through run-if-changed.sh so this whole-tree lint is skipped
        # when the sources, .flake8, and uv.lock are unchanged since the last
        # successful flake8 run (e.g. the run-linters pass just before commit).
        # Same cache key + inputs as the skills, so they share one cache entry.
        entry: .agents/skills/shared/run-if-changed.sh
        language: system
        args:
          ["flake8", "vultron/", "test/", ".flake8", "uv.lock", "--",
           "uv", "run", "flake8", "vultron/", "test/"]
        pass_filenames: false

      - id: spec-lint
        name: Spec registry linter
        entry: uv run python -m vultron.metadata.specs.lint specs/
        language: system
        files: ^specs/.*\.yaml$
        pass_filenames: false
