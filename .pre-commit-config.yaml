repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0  # Use the latest stable version
    hooks:
      - id: black
        language_version: py313
        args: ["."]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      # Catches GitHub Actions errors that YAML parsing cannot: invalid context
      # references, bad `if:` expressions, unknown action inputs. A job-level
      # `if:` referencing the `matrix` context parses as valid YAML but makes
      # GitHub reject the whole workflow with a zero-job startup failure.
      # Uses the golang hook (not actionlint-docker) so pre-commit provisions
      # its own toolchain; the devcontainer has neither docker nor go on PATH.
      - id: actionlint

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 (direct invocation)
        entry: markdownlint-cli2
        # Use the system language so pre-commit resolves the executable via PATH
        language: system
        args: ["--fix", "--config", ".markdownlint-cli2.yaml", "**/*.md"]
        files: \.(md|markdown)$

      - id: validate-notes-frontmatter
        name: Validate notes frontmatter
        entry: uv run python -c "from vultron.metadata.notes.loader import load_notes_registry; load_notes_registry()"
        language: system
        files: ^notes/.*\.md$
        exclude: ^notes/README\.md$
        pass_filenames: false

      - id: validate-incoming-learnings-frontmatter
        name: Validate incoming learnings frontmatter
        entry: uv run python -c "from vultron.metadata.history.incoming import validate_incoming_learnings; validate_incoming_learnings()"
        language: system
        files: ^plan/incoming/learnings/.*\.md$
        exclude: ^plan/incoming/learnings/README\.md$
        pass_filenames: false

      - id: validate-adr-frontmatter
        name: Validate ADR frontmatter
        entry: uv run python -c "from vultron.metadata.adr.loader import load_adr_registry; load_adr_registry()"
        language: system
        files: ^docs/adr/.*\.md$
        exclude: ^docs/adr/(index|README)\.md$
        pass_filenames: false

      - id: adr-index-sync
        name: ADR index and nav in sync
        entry: uv run python -m vultron.metadata.adr.index_gen --check
        language: system
        files: ^(docs/adr/.*\.md|mkdocs\.yml)$
        pass_filenames: false

      - id: flake8
        name: flake8 (with CC gate)
        entry: uv run flake8
        language: system
        args: ["vultron/", "test/"]
        pass_filenames: false

      - id: spec-lint
        name: Spec registry linter
        entry: uv run python -m vultron.metadata.specs.lint specs/
        language: system
        files: ^specs/.*\.yaml$
        pass_filenames: false
