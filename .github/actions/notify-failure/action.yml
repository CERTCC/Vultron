name: Notify CI failure
description: >-
  Files or closes a GitHub Issue for CI failures on push-to-main or
  scheduled workflows. In "notify" mode, creates a new issue or adds a
  comment to an existing open one. In "close" mode, closes any open failure
  issues for this workflow and records recovery. A workflow-specific label
  combined with ci:main-failure uniquely identifies each workflow's issue
  (CISEC-05-001, CISEC-05-002, CISEC-05-003).

inputs:
  mode:
    description: '"notify" to file/update a failure issue; "close" to close it.'
    required: true
  workflow-label:
    description: >-
      Workflow-specific label (e.g. ci:workflow-python-app). Combined with
      ci:main-failure to uniquely identify the failure issue for deduplication
      and targeted close on recovery (CISEC-05-003).
    required: true
  token:
    description: >-
      GitHub token with issues:write permission (pass secrets.GITHUB_TOKEN).
    required: true
  details-file:
    description: >-
      Optional path to a Markdown file whose text is appended to the new
      issue's body or to the update comment in "notify" mode, so a tracker
      can say what failed, not only that it did. A missing or empty file
      adds nothing.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Ensure ci:main-failure and workflow-specific labels exist
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        WORKFLOW_LABEL: ${{ inputs.workflow-label }}
      run: |
        set -euo pipefail
        # Idempotent: silently skip if a label already exists.
        gh label create "ci:main-failure" \
          --repo "$REPO" \
          --description "Bot-managed: CI failure on main or scheduled workflow" \
          --color "d73a4a" 2>/dev/null || true
        gh label create "$WORKFLOW_LABEL" \
          --repo "$REPO" \
          --description "CI failure alert for $WORKFLOW_LABEL" \
          --color "e4e669" 2>/dev/null || true

    - name: File, update, or close the failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        MODE: ${{ inputs.mode }}
        WORKFLOW_LABEL: ${{ inputs.workflow-label }}
        WORKFLOW_NAME: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REF: ${{ github.ref }}
        DETAILS_FILE: ${{ inputs.details-file }}
      run: |
        set -euo pipefail

        # What the caller says failed, if anything, set off by a blank line.
        DETAILS=""
        if [ -n "${DETAILS_FILE:-}" ] && [ -s "$DETAILS_FILE" ]; then
          DETAILS=$(printf '\n\n%s' "$(cat "$DETAILS_FILE")")
        fi

        # Collect all open issue numbers matching both labels, oldest first.
        # `gh issue list --label` goes through the search index, which lags
        # and once missed an open tracker, filing a duplicate (#5105); the
        # list-issues endpoint ANDs the labels against current data. The
        # call runs in a command substitution, not `mapfile < <(...)`, so
        # an API error fails the step under `set -e` instead of reading as
        # "no open tracker" and filing a duplicate.
        ISSUE_LIST=$(gh api --paginate \
          "repos/$REPO/issues?labels=ci:main-failure,$WORKFLOW_LABEL&state=open&sort=created&direction=asc&per_page=100" \
          --jq '.[] | select(.pull_request == null) | .number')
        mapfile -t ISSUE_NUMS < <(printf '%s' "$ISSUE_LIST")

        # `gh issue create` cannot set an issue type, and a label applied
        # with GITHUB_TOKEN never fires the label-to-issue-type workflow,
        # so the action sets the Bug type itself (CISEC-05-007), through the
        # helper shared with other bot-filed issues. It also repairs an
        # issue a failed assignment left untyped.
        ensure_type="$GITHUB_ACTION_PATH/../../scripts/ensure-issue-type.sh"
        # The theme label and Theme: line every open leaf issue needs
        # (PAD-02-014, PAD-02-018), set the same way on both arms, so an
        # issue an earlier run left without them is repaired. No parent: the
        # issue starts untriaged and `theme-fit` lists it for routing
        # (PAD-02-027).
        ensure_triage="$GITHUB_ACTION_PATH/../../scripts/ensure-issue-triage.sh"
        triage_args=(theme:test-and-ci
          "gets the $WORKFLOW_NAME workflow passing on main again.")

        if [ "$MODE" = "notify" ]; then
          if [ "${#ISSUE_NUMS[@]}" -gt 0 ]; then
            # Add a comment to the oldest open failure issue, and close any
            # others as its duplicates so one tracker remains (CISEC-05-003).
            gh issue comment "${ISSUE_NUMS[0]}" \
              --repo "$REPO" \
              --body "CI still failing — [run]($RUN_URL)$DETAILS"
            bash "$ensure_type" "$REPO" "${ISSUE_NUMS[0]}" Bug
            for NUM in "${ISSUE_NUMS[@]:1}"; do
              gh issue close "$NUM" \
                --repo "$REPO" \
                --duplicate-of "${ISSUE_NUMS[0]}" \
                --comment "Duplicate of #${ISSUE_NUMS[0]}, which tracks this failure."
            done
            bash "$ensure_triage" "$REPO" "${ISSUE_NUMS[0]}" "${triage_args[@]}"
          else
            # Create a new failure issue.
            BODY=$(printf \
              'The **%s** workflow failed on ref `%s`.\n[View run](%s)%s\n\nThis issue is closed automatically when the workflow next passes.' \
              "$WORKFLOW_NAME" "$REF" "$RUN_URL" "$DETAILS")
            ISSUE_URL=$(gh issue create \
              --repo "$REPO" \
              --title "CI failure: $WORKFLOW_NAME" \
              --body "$BODY" \
              --label "ci:main-failure" \
              --label "$WORKFLOW_LABEL")
            echo "Filed $ISSUE_URL"
            bash "$ensure_type" "$REPO" "${ISSUE_URL##*/}" Bug
            bash "$ensure_triage" "$REPO" "${ISSUE_URL##*/}" "${triage_args[@]}"
          fi
        elif [ "$MODE" = "close" ]; then
          for NUM in "${ISSUE_NUMS[@]}"; do
            gh issue close "$NUM" \
              --repo "$REPO" \
              --comment "CI is passing again — [run]($RUN_URL)"
          done
        else
          echo "::error::Unknown mode '$MODE'. Expected 'notify' or 'close'." >&2
          exit 1
        fi
