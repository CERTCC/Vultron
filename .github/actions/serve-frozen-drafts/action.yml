name: Serve frozen drafts
description: >
  Unpacks each released Protocol Specification draft's frozen archive, taken
  from its published GitHub Release, into `site/spec/draft-N/`, and writes a
  placeholder page there for a released draft whose release is not published
  yet (ADR-0188, DOCBW-08-028 to DOCBW-08-034). Shared by every workflow that
  serves the frozen drafts (deploy_site.yml, docs-build-check.yml and
  promote_release.yml's archive job), so the pull request check and the
  promote see the tree the deploy publishes (DOCBW-08-035, DOCBW-08-039).
  Run it after the shared build and before the publication checks
  (DOCBW-08-028). The publish workflow's rollback gate refuses a target
  commit without this action (DOCBW-08-038). The logic lives in
  .github/scripts/serve_frozen_drafts.py.

inputs:
  register-json:
    description: >-
      The drafts register, as `uv run drafts-register show` prints it. The
      publish workflow passes main's register (DOCBW-08-027). Empty reads the
      register of the checked-out commit, as the pull request check and the
      promote's archive job do.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The script only reads releases: every caller gives the job a read-only
    # token. A published release's assets never change, so a mismatch is
    # taken for a corrupt download and the pair is downloaded once more,
    # then fails the step, and so the run (CISEC-05). Each gh call also gets
    # retry.sh's bounded retry of a transient error.
    - name: Serve the frozen drafts into site/spec/
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        REGISTER_JSON: ${{ inputs.register-json }}
      run: |
        register="$RUNNER_TEMP/drafts-register.json"
        if [ -n "$REGISTER_JSON" ]; then
          printf '%s\n' "$REGISTER_JSON" > "$register"
        else
          # PYTHONPATH='' (quoted) is identical in effect to PYTHONPATH= but
          # distinguishable by shellcheck, which flags the bare form as SC1007.
          PYTHONPATH='' uv run drafts-register show > "$register"
        fi
        python3 -I .github/scripts/serve_frozen_drafts.py \
          --register "$register" --site site --repo "$REPO"
