name: Fetch the merge base
description: >
  On a pull request, make `origin/<base>` and `git merge-base origin/<base> HEAD`
  resolve without `fetch-depth: 0`, which fetches every branch's history and
  every tag; a hung full fetch was cancelled by the job cap with no test run
  (#6535, #6390).

  The caller checks out with `fetch-depth: 2`. On a `pull_request` event the
  checkout is GitHub's merge commit, whose first parent is the base tip it
  merged against, so that parent is the base: the action points
  `origin/<base>` at it and fetches nothing. A diff from it to `HEAD` is exactly
  what the pull request changes in the base.

  When `HEAD` is not a merge commit (a job that checks out the head commit
  itself), it runs `.github/scripts/fetch-merge-base.sh`, which deepens the
  checkout only as far as the real merge base. A job that reads each branch
  commit, not only the diff, calls that script directly.

  With no base ref (a push, a schedule or a dispatch) it does nothing.

inputs:
  base-ref:
    description: >
      The base branch name. Defaults to the pull request's base; empty skips
      the step.
    required: false
    default: ${{ github.base_ref }}

runs:
  using: composite
  steps:
    - name: Point the base ref at the merge base
      if: inputs.base-ref != ''
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        if git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
          git update-ref "refs/remotes/origin/${BASE_REF}" 'HEAD^1'
          echo "fetch-merge-base: origin/${BASE_REF} is the merge commit's first parent, $(git rev-parse 'HEAD^1')"
        else
          bash .github/scripts/fetch-merge-base.sh "$BASE_REF"
        fi
