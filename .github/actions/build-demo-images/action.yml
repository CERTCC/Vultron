name: Build demo images
description: >
  Builds the demo-integration Docker images via `docker buildx bake`.
  Used by demo-integration.yml for PR and push-to-main builds.

inputs:
  load:
    description: >
      Whether to pass --load so built images are available to the Docker
      daemon for a subsequent `docker compose up`.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Pull Docker Hub images through Google's public Docker Hub mirror
    # (#4450). Anonymous Docker Hub pulls share a per-runner quota, and a
    # spent quota failed the build with `429 Too Many Requests` before any
    # project code ran. The mirror needs no credential, so this works on fork
    # PRs too, and BuildKit falls back to Docker Hub if the mirror fails.
    # `driver-opts` covers the BuildKit image the builder runs in; the
    # `docker.io` mirror covers every image the build pulls (the Dockerfile's
    # `# syntax=` frontend and its `python` base). docker/Dockerfile is left
    # unchanged, so a local or devcontainer build still pulls from Docker Hub.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Build Docker images
      working-directory: docker
      shell: bash
      env:
        LOAD: ${{ inputs.load }}
      run: |
        args=(
          --allow=fs.read=..
          -f docker-compose-multi-actor.yml
        )
        if [[ "$LOAD" == "true" ]]; then
          args+=(--load)
        fi
        docker buildx bake "${args[@]}"
