# Spec registry linter — runs when specs/ changes.
#
# Validates ECA format enforcement (MS-13-004) and all other spec-lint hard
# errors. Kept separate from python-app.yml so spec-only PRs don't trigger
# the full test/lint suite unnecessarily, and so spec changes always get an
# independent status check. See CONCERN-1650.

name: Spec Check

on:
  push:
    branches: ["main"]
    paths:
      - "specs/**"
      - "vultron/metadata/specs/**"
      - "docs/reference/codebase/**"
      - ".github/workflows/spec-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "specs/**"
      - "vultron/metadata/specs/**"
      - "docs/reference/codebase/**"
      - ".github/workflows/spec-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-lint:
    name: Spec Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Run spec-lint
        # PYTHONPATH='' (quoted) is identical in effect to PYTHONPATH= but
        # distinguishable by shellcheck, which flags the bare form as SC1007.
        run: PYTHONPATH='' uv run spec-lint specs/

  # Run pytest tests that read the actual specs/ corpus.  Triggered alongside
  # spec-lint so a PR touching only specs/** goes red when it breaks the
  # coverage guard or the spec-lint test.  See Bug #2903.
  spec-tests:
    name: Spec Corpus Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR-only growth guards compare against the merge
          # base with origin/$GITHUB_BASE_REF and skip without it (#4315).
          fetch-depth: 0
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Run spec_corpus pytest suite
        run: uv run pytest -m spec_corpus --tb=short

  # Run the docs/reference/codebase/ path-existence ratchet.  Triggered
  # alongside spec-check so a PR touching only docs/reference/codebase/**
  # goes red when it introduces a phantom path citation.  See Issue #2552.
  docs-path-ratchet:
    name: Codebase Docs Path Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Run codebase docs path ratchet
        run: uv run pytest test/architecture/test_codebase_docs_paths.py --tb=short

  # CISEC-05-003 (#4874): one final job reports the run, so a passing job's
  # close step cannot close the issue a failing sibling just filed.
  notify:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: [spec-lint, spec-tests, docs-path-ratchet]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CISEC-05-006: file only on a genuine failure, never on cancellation
      # alone. No job here consumes another job's artifact, so every
      # `failure` in the aggregate is genuine. Do NOT add
      # `!contains(needs.*.result, 'cancelled')`: a newer push that cancels
      # one job after another has failed would then suppress the notification.
      - name: Notify CI failure
        if: contains(needs.*.result, 'failure')
        uses: ./.github/actions/notify-failure
        with:
          mode: notify
          workflow-label: ci:workflow-spec-check
          token: ${{ secrets.GITHUB_TOKEN }}
      # CISEC-05-002: a superseded run must not declare recovery, so the close
      # step keeps `!contains(needs.*.result, 'cancelled')`.
      - name: Close CI failure issue
        if: "!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')"
        uses: ./.github/actions/notify-failure
        with:
          mode: close
          workflow-label: ci:workflow-spec-check
          token: ${{ secrets.GITHUB_TOKEN }}
