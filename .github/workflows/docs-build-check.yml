name: Docs Build and Link Check
on:
  pull_request:
    # A pull request to publish runs this workflow through
    # docs-publish-check.yml instead, on every such pull request whatever it
    # changes (DOCBW-03-012). Ignoring publish here keeps it from running twice.
    branches-ignore:
      - publish
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'references.bib'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      # Pages render from these at build time (DOCBW-02-001, #3070): the API
      # reference is mkdocstrings over vultron/, the ActivityPub examples print
      # vultron/wire/as2/vocab/examples/, the spec pages render specs/*.yaml,
      # and the scenario table and What's New are vultron/metadata/ generators.
      # vultron/** also covers the gates themselves and what they read
      # (vultron/metadata/docs/: withheld.py, links.py, legacy_urls.py and its
      # baseline, path_boxes.py, built_site.py), so a PR editing only a gate
      # reruns it.
      - 'vultron/**'
      - 'specs/**'
      # Runs the built-site gates (DOCBW-03-005/007/008, DF-11-023).
      - '.github/actions/check-site-publication/**'
      # The shared build (DOCBW-06-004) and the environment it installs.
      - '.github/actions/build-site/**'
      - '.github/actions/setup-python-uv/**'
      - 'CONTRIBUTING.md'
      - 'ContributionInstructions.md'
      - 'LICENSE.md'
      - 'Acknowledgements.md'
      - '.github/workflows/docs-build-check.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-build-check:
    runs-on: ubuntu-latest
    # Observed: 1.5–4.5 min typical, one 16-min run, over the 15 latest successful
    # runs (2026-10-30). Cap at 20 min so a hang fails fast instead of holding a
    # runner until GitHub's 6-h limit (TB-14-006).
    timeout-minutes: 20
    steps:
      # Only loads the local actions: build-site re-checks out the repository
      # with the history and tags the build needs (DOCBW-06-004).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same build deploy_site.yml publishes: checkout, dependency set and
      # the strict mkdocs build all live in the action (DOCBW-06-004,
      # DOCBW-03-009, DOCBW-03-010).
      - name: Build Site
        uses: ./.github/actions/build-site

      # Runs against the built site above, so it must follow that step: no
      # withheld artifact was built, every internal reference resolves, and
      # every URL an earlier publish served still resolves. The same action
      # gates deploy_site.yml.
      - name: Check site publication
        uses: ./.github/actions/check-site-publication

      # DOCBW-03-012: a publish must not ship a page the continuity check above
      # does not know about, or a later publish could drop its URL unnoticed.
      # Runs on pull requests to publish only (through docs-publish-check.yml),
      # because on a pull request to main a new page is not yet due. It reads
      # the checked-out commit, which for a pull request is its merge result:
      # what publish will serve once the pull request merges. Kept out of the
      # check-site-publication action so deploy_site.yml and pull requests to
      # main do not run it.
      - name: Check every built page is recorded
        if: ${{ !cancelled() && github.base_ref == 'publish' }}
        run: |
          PYTHONPATH='' uv run docs-legacy-urls --require-recorded

      # The source gates: the ADR index and the docs source gates
      # (DOCBW-03-013, DOCBW-03-014). They read the docs/ sources, not the
      # built site, so they need only the environment the shared build set
      # up. They run last, each on !cancelled(): a failed build or built-site
      # check does not stop them, and a failed gate cannot skip a check after
      # it. Pre-commit runs them locally, but no workflow runs pre-commit,
      # and python-app.yml, which runs their committed-tree tests, does not
      # trigger on docs/** (#5084). Each is its own step so a failure names
      # its gate.
      - name: ADR index in sync, and no ADR in the nav
        if: ${{ !cancelled() }}
        run: |
          # PYTHONPATH='' (quoted) is identical in effect to PYTHONPATH= but
          # distinguishable by shellcheck, which flags the bare form as SC1007.
          PYTHONPATH='' uv run python -m vultron.metadata.adr.index_gen --check

      - name: Page frontmatter (DF-11-001)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run docs-frontmatter

      - name: Normative banner on exactly its pages (DF-12-006)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run docs-normative-banner

      - name: No nav section mixes protocol and implementation pages (DF-11-020)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run docs-nav-subjects

      - name: No page depends on a page above its level (DF-11-002)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run docs-level-order

      - name: Landing pages, reading-path boxes and coverage matrix in sync (DF-11-005)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run docs-site --check

      - name: Reading-path threads list only reader-facing pages (DF-11-016)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run docs-threads

      - name: No thread page depends on a later member's term (DF-11-024)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run docs-thread-order

      - name: Occasion table and message fragments in sync
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run msm-occasions --check

      - name: Demo scenario artifacts in sync (DEMOCI-11-005)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run demo-scenarios --check

      - name: JSON-LD context in sync with the wire vocabulary (VM-10-001)
        if: ${{ !cancelled() }}
        run: PYTHONPATH='' uv run wire-context --check
