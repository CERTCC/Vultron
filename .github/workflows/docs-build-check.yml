name: Docs Build and Link Check
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'references.bib'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      # Pages render from these at build time (DOCBW-02-001, #3070): the API
      # reference is mkdocstrings over vultron/, the ActivityPub examples print
      # vultron/wire/as2/vocab/examples/, the spec pages render specs/*.yaml,
      # and the scenario table and What's New are vultron/metadata/ generators.
      # vultron/** also covers the withheld-artifact declaration
      # (vultron/metadata/docs/withheld.py, DOCBW-03-005).
      - 'vultron/**'
      - 'specs/**'
      - 'CONTRIBUTING.md'
      - 'ContributionInstructions.md'
      - 'LICENSE.md'
      - 'Acknowledgements.md'
      - '.github/workflows/docs-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if docs/ changed
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF"...HEAD \
               | grep -q '^docs/'; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-sync-args: "--dev"

      - name: Check ADR index and nav are in sync
        run: |
          # PYTHONPATH='' (quoted) is identical in effect to PYTHONPATH= but
          # distinguishable by shellcheck, which flags the bare form as SC1007.
          PYTHONPATH='' uv run python -m vultron.metadata.adr.index_gen --check

      # --strict makes mkdocs.yml's `validation: warn` settings (dead in-page
      # anchors, pages missing from the nav) fail the job; without it they
      # print and the job stays green (DOCBW-03-008). Never add --quiet (DOCBW-03-009): it
      # hides the warnings --strict counts, so the build passes over them.
      - name: Build Site
        run: |
          uv run mkdocs build --strict --verbose --clean --config-file mkdocs.yml

      # Runs against the built site above, so it must follow that step. Verifies
      # the publication axis: every artifact declared withheld produced no files
      # in site/. The `docs/ns/` case is why this exists — the page claimed
      # `draft: true` and shipped anyway, because nothing compared the claim to
      # the output.
      - name: Check withheld artifacts are unpublished
        run: |
          PYTHONPATH='' uv run docs-withheld

      - name: Check links
        if: steps.filter.outputs.docs_changed == 'true'
        run: |
          uv run linkchecker site/index.html

