# Demo Integration — build and run the Vultron multi-actor demo on PRs and pushes.
#
# Kept separate from python-app.yml so that the Docker-compose build time
# does not block the unit-test and lint pipeline; both workflows run
# concurrently on PRs.  See specs/demo-ci.yaml DEMOCI-02-001.
#
# Triggers:
#   pull_request  — minimum PR validation set (3 scenarios, DEMOCI-06-002)
#   push to main  — full 8-scenario suite (DEMOCI-06-003, DEMOCI-05-001)
#   workflow_dispatch — full 8-scenario suite (for manual re-runs)
#
# Dependabot PRs are skipped — python-app.yml still guards broken deps.
# See DEMOCI-02-002, DEMOCI-02-003, DEMOCI-02-004.
#
# Concurrency: PR runs cancel in-progress superseded runs; on-main runs
# always run to completion (DEMOCI-02-011, DEMOCI-05-002).
#
# Job structure per matrix entry (DEMOCI-04-001 through DEMOCI-04-003):
#   demo           — builds images, runs docker-compose, uploads JSONL artifacts
#   invariant-harness  — downloads JSONL, runs pytest; needs: demo, if: always()
#
# This gives each scenario two independent pass/fail statuses on the PR so
# invariant failures are visible even when the demo job itself fails.
#
# Minimum PR set (DEMOCI-06-002): fv, fvcv-handoff, fcvcv
#   - fv covers the 4 universal event types (2-actor baseline)
#   - fvcv-handoff adds invite_actor_to_case + accept_invite_actor_to_case
#     + ownership-transfer protocol path
#   - fcvcv adds offer_case_participant and ≥3-actor invite/accept chains
# Full set adds: fvv, fvcv-extension, fccv-extension, fccv-handoff, fcv
#
# The matrix includes a boolean `full_suite_only` field. On pull_request events
# the job `if:` condition skips entries where full_suite_only==true, leaving
# only the 3-scenario minimum PR set running. On push/dispatch all 8 run.

name: Demo Integration

# Path filter for both pull_request and push triggers (DEMOCI-02-003).
# Covers all files whose changes can affect demo container behaviour or the
# invariant assertions that validate it. Excludes paths that cannot affect
# demo behaviour at runtime:
#   - vultron/metadata/** — pure tooling (spec/ADR/notes loaders, CLI entry
#     points); never imported by actor services or the demo runner container.
#   - vultron/bt/** — legacy simulation layer; vultron/demo/ is architecturally
#     prohibited from importing it (test/architecture/test_demo_no_bt_imports.py).
#   - docs/** — documentation only.
# The push and pull_request filters MUST match so any change validated
# pre-merge is also validated post-merge on main (DEMOCI-02-003).

on:
  pull_request:
    branches: ["main"]
    paths:
      - "vultron/**"
      - "!vultron/metadata/**"
      - "!vultron/bt/**"
      - "docker/**"
      - "integration_tests/**"
      # Invariant harness / CI test changes must re-run the demos that feed
      # them, else a broken assertion merges untested (see #1602 regression).
      - "test/ci/**"
      - "pyproject.toml"
      - "uv.lock"
      # Workflow and action changes must re-validate CI itself.
      - ".github/workflows/demo-integration.yml"
      - ".github/actions/build-demo-images/**"
  push:
    branches: ["main"]
    paths:
      - "vultron/**"
      - "!vultron/metadata/**"
      - "!vultron/bt/**"
      - "docker/**"
      - "integration_tests/**"
      - "test/ci/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/demo-integration.yml"
      - ".github/actions/build-demo-images/**"
  workflow_dispatch:

# DEMOCI-02-011: cancel superseded PR runs; never cancel on-main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write  # needed for docker buildx bake cache-to: type=gha

jobs:
  demo:
    name: "${{ matrix.demo }} Demo Integration"
    runs-on: ubuntu-latest
    # DEMOCI-02-009: 15-minute cap to prevent indefinite hangs.
    timeout-minutes: 15
    # DEMOCI-02-004: skip Dependabot PRs; python-app.yml guards broken deps.
    # DEMOCI-06-002: on pull_request, skip full-suite-only entries so only the
    # minimum 3-scenario PR validation set runs.
    if: >-
      !startsWith(github.head_ref, 'dependabot/') &&
      (github.event_name != 'pull_request' || matrix.full_suite_only != true)
    strategy:
      fail-fast: false
      matrix:
        # DEMOCI-06-002 minimum PR validation set (full_suite_only: false).
        # DEMOCI-06-003 additional scenarios (full_suite_only: true — push/dispatch only).
        include:
          - demo: fv
            test_file: test/ci/invariants/test_fv_invariants.py
            full_suite_only: false
          - demo: fvcv-handoff
            test_file: test/ci/invariants/test_fvcv_handoff_invariants.py
            full_suite_only: false
          - demo: fcvcv
            test_file: test/ci/invariants/test_fcvcv_invariants.py
            full_suite_only: false
          - demo: fvv
            test_file: test/ci/invariants/test_fvv_invariants.py
            full_suite_only: true
          - demo: fvcv-extension
            test_file: test/ci/invariants/test_fvcv_extension_invariants.py
            full_suite_only: true
          - demo: fccv-extension
            test_file: test/ci/invariants/test_fccv_extension_invariants.py
            full_suite_only: true
          - demo: fccv-handoff
            test_file: test/ci/invariants/test_fccv_handoff_invariants.py
            full_suite_only: true
          - demo: fcv
            test_file: test/ci/invariants/test_fcv_invariants.py
            full_suite_only: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # DEMOCI-02-007: Docker layer caching via Buildx GHA cache.
      # On push-to-main runs, write to the "demo-integration-main" scope so
      # new PR branches can read it as a warm fallback (DEMOCI-05-003).
      # On pull_request runs, write to "demo-integration" (visible only to
      # the same PR branch) and read "demo-integration-main" as a fallback so
      # a brand-new PR branch still gets a warm start.
      - name: Build Docker images
        uses: ./.github/actions/build-demo-images
        with:
          cache-scope: >-
            ${{ github.ref == 'refs/heads/main'
              && 'demo-integration-main'
              || 'demo-integration' }}
          cache-from-extra-scope: >-
            ${{ github.ref != 'refs/heads/main'
              && 'demo-integration-main'
              || '' }}

      # DEMOCI-02-005, DEMOCI-02-006: run demo; detect failure via
      # exit code of the demo-runner container.
      # DEMOCI-02-008: set DEBUG log level at CI runtime so actor containers
      # emit full tracebacks and state-machine detail.
      - name: Create devlogs directory
        run: mkdir -p devlogs

      - name: Run ${{ matrix.demo }} demo
        env:
          DEMO: ${{ matrix.demo }}
        run: |
          VULTRON_SERVER__LOG_LEVEL=DEBUG \
            docker compose -f docker/docker-compose-multi-actor.yml \
            up --abort-on-container-exit --exit-code-from demo-runner

      - name: Upload case log JSONL files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.demo }}-case-logs
          path: devlogs/
          retention-days: 30

      # DEMOCI-02-008: collect combined stream and per-service logs on failure.
      - name: Collect container logs
        if: failure()
        run: |
          COMPOSE_FILE=docker/docker-compose-multi-actor.yml
          mkdir -p /tmp/demo-logs
          docker compose -f "$COMPOSE_FILE" logs \
            > /tmp/demo-logs/combined.log 2>&1
          for svc in finder vendor coordinator case-actor actor5 actor6 demo-runner; do
            docker compose -f "$COMPOSE_FILE" logs "$svc" \
              > "/tmp/demo-logs/${svc}.log" 2>&1 || true
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.demo }}-container-logs
          path: /tmp/demo-logs/
          retention-days: 7

      # DEMOCI-02-010: always tear down containers and volumes.
      - name: Tear down containers and volumes
        if: always()
        run: |
          docker compose -f docker/docker-compose-multi-actor.yml down -v

  # DEMOCI-04-001, DEMOCI-04-002, DEMOCI-04-003: separate invariant-harness job
  # so invariant failures produce an independent pass/fail status on the PR even
  # when the demo job itself fails.
  invariant-harness:
    name: "${{ matrix.demo }} Invariant Harness"
    runs-on: ubuntu-latest
    # DEMOCI-04-002: always run after the demo job, even on demo failure.
    # DEMOCI-02-004: skip Dependabot PRs (demo is skipped, no artifact exists).
    # DEMOCI-06-002: mirror the demo job gate — skip full-suite-only entries on PR.
    needs: demo
    if: >-
      always() &&
      !startsWith(github.head_ref, 'dependabot/') &&
      (github.event_name != 'pull_request' || matrix.full_suite_only != true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: fv
            test_file: test/ci/invariants/test_fv_invariants.py
            full_suite_only: false
          - demo: fvcv-handoff
            test_file: test/ci/invariants/test_fvcv_handoff_invariants.py
            full_suite_only: false
          - demo: fcvcv
            test_file: test/ci/invariants/test_fcvcv_invariants.py
            full_suite_only: false
          - demo: fvv
            test_file: test/ci/invariants/test_fvv_invariants.py
            full_suite_only: true
          - demo: fvcv-extension
            test_file: test/ci/invariants/test_fvcv_extension_invariants.py
            full_suite_only: true
          - demo: fccv-extension
            test_file: test/ci/invariants/test_fccv_extension_invariants.py
            full_suite_only: true
          - demo: fccv-handoff
            test_file: test/ci/invariants/test_fccv_handoff_invariants.py
            full_suite_only: true
          - demo: fcv
            test_file: test/ci/invariants/test_fcv_invariants.py
            full_suite_only: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # DEMOCI-04-003: download the JSONL artifact produced by the demo job.
      - name: Download case log JSONL files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ matrix.demo }}-case-logs
          path: devlogs/

      # AC-925-1: run canonical-log invariant harness against JSONL artifacts.
      # Invariants not yet passing are marked xfail so the build stays green;
      # unexpected passes appear as XPASS (visible but not failing).
      # See test/ci/README-case-log-ratchet.md for the ratchet workflow.
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Run case-ledger invariant harness
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: uv run pytest "$TEST_FILE" -v --tb=short
