# Multi-stage CI pipeline: tests and linters run in parallel; build only
# proceeds when all checks pass.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
    paths:
      - vultron/**
      - test/**
      # ruff lints every tracked Python file, not only the package and tests
      # (IMPLTS-07-018), so any Python change must trigger the lint-ruff job.
      - '**/*.py'
      # Named explicitly in case ** does not descend into dot-directories.
      - '.agents/**/*.py'
      - pyproject.toml
      # The committed vocab examples are an input to
      # test/architecture/test_vocab_examples_current.py, which compares each
      # one byte for byte with a fresh generation. Without them here, a pull
      # request that hand-edits or half-regenerates an example and nothing
      # else runs no test at all (#5776).
      - docs/reference/examples/**
      # The crosswalk's CSAF version include must name the commit the CSAF
      # pin record names; test/metadata/test_csaf_pin.py compares them
      # (CSAF-05-001), so a pull request that edits only the include must
      # run it.
      - docs/reference/csaf_crosswalk/_csaf_version.md
      # The pinned local copy of the CSAF schemas and its pin record are JSON,
      # not Python: test/metadata/test_csaf_pin.py checks their digests and
      # test_regeneration_reproduces_the_committed_models regenerates from
      # them (CSAF-05-002/003), so a pull request that edits only them must
      # run those tests.
      - third_party/**
      # A Dependabot bump inside the existing version range touches only the
      # lockfile; demo-integration.yml skips Dependabot PRs on the premise that
      # this workflow still tests them (DEMOCI-02-004, #3610).
      - uv.lock
      - pyrightconfig.json
      # test/ci reads every workflow and the pre-commit config, so the pull
      # request that drops a gate's CI step, or adds a hook no workflow runs,
      # fails (DOCBW-03-015). The glob includes this file.
      - '.github/workflows/*.yml'
      - .pre-commit-config.yaml
      # test/ci/test_shell_script_portability.py reads every tracked shell
      # script, so a change to one must run the suite that polices it: a
      # `mapfile` added under .github/scripts/ would otherwise reach main with
      # every check green (#5698, the #4506 shape).
      - '**/*.sh'
      # Named explicitly in case ** does not descend into dot-directories.
      - '.agents/**/*.sh'
      - '.github/**/*.sh'
      - '.devcontainer/**/*.sh'
      # test/ci also reads the composite actions the workflows call, and
      # `actions-lint.yml` is the only other job a change to one triggers —
      # it runs actionlint, not pytest. So the notify-failure assertions
      # (CISEC-05-017, CISEC-05-018, CISEC-05-020) and the build-site step
      # order never ran on a pull request that edited only an action.
      - '.github/actions/**'
      # The demo drift tests under test/metadata/demo_scenarios/ compare the
      # committed ui/ artifacts and recordings with a fresh export, so a pull
      # request that edits only them must run those tests (#4728).
      - ui/src/data/**
      - ui/src/recordings/**
      # The hand-authored synthetic ledgers, which
      # test/demo_unit/test_recordings.py validates like the recordings.
      - ui/src/synthetic-ledgers/**
  pull_request:
    branches: [ "main" ]
    paths:
      - vultron/**
      - test/**
      # ruff lints every tracked Python file, not only the package and tests
      # (IMPLTS-07-018), so any Python change must trigger the lint-ruff job.
      - '**/*.py'
      # Named explicitly in case ** does not descend into dot-directories.
      - '.agents/**/*.py'
      - pyproject.toml
      # The committed vocab examples are an input to
      # test/architecture/test_vocab_examples_current.py; see the push filter.
      - docs/reference/examples/**
      # Compared with the CSAF pin record (CSAF-05-001); see the push filter.
      - docs/reference/csaf_crosswalk/_csaf_version.md
      # The pinned local copy and its pin record; see the push filter.
      - third_party/**
      - uv.lock
      - pyrightconfig.json
      # test/ci reads every workflow and the pre-commit config, so the pull
      # request that drops a gate's CI step, or adds a hook no workflow runs,
      # fails (DOCBW-03-015). The glob includes this file.
      - '.github/workflows/*.yml'
      - .pre-commit-config.yaml
      # test/ci/test_shell_script_portability.py reads every tracked shell
      # script, so a change to one must run the suite that polices it: a
      # `mapfile` added under .github/scripts/ would otherwise reach main with
      # every check green (#5698, the #4506 shape).
      - '**/*.sh'
      # Named explicitly in case ** does not descend into dot-directories.
      - '.agents/**/*.sh'
      - '.github/**/*.sh'
      - '.devcontainer/**/*.sh'
      # test/ci also reads the composite actions the workflows call, and
      # `actions-lint.yml` is the only other job a change to one triggers —
      # it runs actionlint, not pytest. So the notify-failure assertions
      # (CISEC-05-017, CISEC-05-018, CISEC-05-020) and the build-site step
      # order never ran on a pull request that edited only an action.
      - '.github/actions/**'
      # The demo drift and recording tests read these; see the push filter.
      - ui/src/data/**
      - ui/src/recordings/**
      - ui/src/synthetic-ledgers/**
  workflow_dispatch:

permissions:
  contents: read

# Cancel any in-progress run for the same ref and debounce rapid pushes to
# main so that back-to-back merges don't each spin up a full runner fleet.
# The sleep only applies on push; PR runs start immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared setup used by every job below.
# Each job installs deps independently (no shared filesystem across jobs).

jobs:

  # ── Stage 1a: Tests, in parallel parts ────────────────────────────────────
  # A pull-request round is this repository's merge gate (ADR-0126), so its
  # length sets how long every push waits. One runner ran the whole suite in
  # 7.2-12.5 minutes; each part below runs a disjoint slice of `test/` on its
  # own runner, so the round ends with the slowest part instead of the sum
  # (#5943).
  #
  # The parts partition `test/`: each named part lists the paths it claims, and
  # the `rest` part selects `test` while ignoring every claimed path. A new
  # test directory therefore runs in `rest` with no workflow edit, and
  # `test/ci/test_python_app_test_parts.py` fails when a claim and an ignore
  # disagree — the two ways a part would run twice or not at all (TB-11-002).
  # Keep every part inside this one matrix job: `build` and `notify` reach all
  # of them through `needs: test`, and a part split into its own job id is one
  # a `needs:` list can omit (TB-11-003).
  #
  # Do not gate a part with a job-level `if:` on `matrix`: that context does
  # not exist before matrix expansion, and the workflow fails at startup with
  # no jobs and no logs (DEMOCI-06-004).
  test:
    name: Tests (pytest) ${{ matrix.part }}
    runs-on: ubuntu-latest
    # A hang no per-test timeout can reach (a C call holding the GIL, a stuck
    # xdist controller) ends here, not at GitHub's 6-hour default. No part can
    # take longer than the whole suite did on one runner (12.5 minutes at the
    # worst observed, including the 60s main-push debounce), so 20 minutes is
    # well above any honest part and still fails a hang in minutes (TB-14-006,
    # #3603).
    timeout-minutes: 20
    strategy:
      # Every part reports: one red part must not hide a second one, and the
      # `needs.test.result` aggregate reads `failure` either way.
      fail-fast: false
      matrix:
        # `select` is the part's pytest path arguments. Group by cost, not by
        # collected test count: a count-balanced first attempt put
        # `test/architecture` and `test/metadata` in one part, and it took
        # 12m59s against 1m26s to 4m04s for the others, because those two
        # directories hold nearly every test that spawns a subprocess (a fresh
        # interpreter per module, a scratch git repository, a site build).
        # Spread across 29k tests by one `-n auto` session they were diluted;
        # alone on one runner they compete for the same cores. So keep those
        # two apart and give each lighter company, and rebalance from the
        # durations CI reports rather than from counts.
        include:
          - part: core
            select: test/core
          - part: arch
            select: test/architecture test/bt test/fuzzer test/support test/wire
          - part: meta
            select: test/adapters test/metadata
          # The catch-all. Its ignores are exactly the paths the parts above
          # claim, so everything else in `test/` — including a directory added
          # tomorrow and the test modules at the root of `test/` — runs here.
          - part: rest
            select: >-
              test
              --ignore=test/adapters
              --ignore=test/architecture
              --ignore=test/bt
              --ignore=test/core
              --ignore=test/fuzzer
              --ignore=test/metadata
              --ignore=test/support
              --ignore=test/wire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR-only growth guards in test/architecture/
          # compare against the merge base with origin/$GITHUB_BASE_REF and
          # skip when a shallow clone has none (SR-05-005, MS-12-007, #4315).
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Run this part of the pytest suite
        # -m "": unit and integration tiers both, so the parts together run
        # every collected test (TB-11-002).
        # -n auto: one xdist worker per runner CPU, sized by test/conftest.py
        # from the cgroup limits (test/support/xdist_workers.py).
        run: uv run pytest -m "" -n auto --tb=short ${{ matrix.select }}

  # ── Stage 1b: Linters (run in parallel with tests) ────────────────────────

  # ruff reads its scope from [tool.ruff] in pyproject.toml, so neither command
  # takes a path argument (IMPLTS-07-021, ADR-0094).
  lint-ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Observed: 13–77 s over the 15 latest runs (2026-10-29). Cap at 10 min so a
    # hung job fails fast instead of holding a runner until GitHub's 6-h limit
    # (TB-14-006).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Lint with ruff
        run: uv run ruff check
      - name: Check formatting with ruff
        # Runs even when the lint step fails, so one run reports both.
        if: ${{ !cancelled() }}
        run: uv run ruff format --check

  lint-mypy:
    name: Lint (mypy)
    runs-on: ubuntu-latest
    # Observed: 28–114 s over the 15 latest runs (2026-10-29; TB-14-006).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Type-check with mypy
        run: uv run mypy

  lint-pyright:
    name: Lint (pyright)
    runs-on: ubuntu-latest
    # Observed: 81–149 s over the 15 latest runs (2026-10-29). Cap at 10 min so a
    # hung job is cancelled in minutes, not after hours (#2076, TB-14-006).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Type-check with pyright
        run: uv run pyright

  # ── Stage 2: Build (only if all stage-1 jobs pass) ───────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint-ruff, lint-mypy, lint-pyright]
    # Observed: 24–33 s over the latest runs (2026-10-29; TB-14-006).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Build package
        run: uv build
      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vultron
          path: dist/vultron-*.tar.gz
          retention-days: 14

  # ── Notify: file or close a failure issue on push to main ────────────────
  notify:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: [test, lint-ruff, lint-mypy, lint-pyright, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Observed: 5–10 s over the latest runs (2026-10-29; TB-14-006).
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CISEC-05-006, #3249: file only on a genuine failure, never on
      # cancellation alone — a concurrency-superseded run with no failure has
      # nothing to report, because a newer run is authoritative.
      # A cancelled job reports `cancelled`, not `failure`, and no job here
      # consumes another job's artifact (CISEC-05-016), so every `failure` in
      # the aggregate is genuine. Do NOT add
      # `!contains(needs.*.result, 'cancelled')` (CISEC-05-015): a newer push
      # that cancels the lint jobs while the tests have already failed would
      # then suppress the notification (CISEC-05-014, #3293).
      - name: Notify CI failure
        if: contains(needs.*.result, 'failure')
        uses: ./.github/actions/notify-failure
        with:
          mode: notify
          workflow-label: ci:workflow-python-app
          token: ${{ secrets.GITHUB_TOKEN }}
      # CISEC-05-009, CISEC-05-010: a superseded run must not declare
      # recovery, so the close step keeps
      # `!contains(needs.*.result, 'cancelled')` — a cancelled job might have
      # failed had it run to completion.
      - name: Close CI failure issue
        if: "!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')"
        uses: ./.github/actions/notify-failure
        with:
          mode: close
          workflow-label: ci:workflow-python-app
          token: ${{ secrets.GITHUB_TOKEN }}
