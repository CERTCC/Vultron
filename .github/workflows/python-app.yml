# Multi-stage CI pipeline: tests and linters run in parallel; build only
# proceeds when all checks pass.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
    paths:
      - vultron/**
      - test/**
      # ruff lints every tracked Python file, not only the package and tests.
      - scripts/**
      - .agents/**/*.py
      - pyproject.toml
      # A Dependabot bump inside the existing version range touches only the
      # lockfile; demo-integration.yml skips Dependabot PRs on the premise that
      # this workflow still tests them (DEMOCI-02-004, #3610).
      - uv.lock
      - pyrightconfig.json
      - .github/workflows/python-app.yml
  pull_request:
    branches: [ "main" ]
    paths:
      - vultron/**
      - test/**
      # ruff lints every tracked Python file, not only the package and tests.
      - scripts/**
      - .agents/**/*.py
      - pyproject.toml
      - uv.lock
      - pyrightconfig.json
      - .github/workflows/python-app.yml
  workflow_dispatch:

permissions:
  contents: read

# Cancel any in-progress run for the same ref and debounce rapid pushes to
# main so that back-to-back merges don't each spin up a full runner fleet.
# The sleep only applies on push; PR runs start immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared setup used by every job below.
# Each job installs deps independently (no shared filesystem across jobs).

jobs:

  # ── Stage 1a: Tests ───────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Run full pytest suite
        run: uv run pytest -m "" --tb=short

  # ── Stage 1b: Linters (run in parallel with tests) ────────────────────────

  # ruff reads its scope from [tool.ruff] in pyproject.toml, so neither command
  # takes a path argument (IMPLTS-07-021, ADR-0094).
  lint-ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Lint with ruff
        run: uv run ruff check
      - name: Check formatting with ruff
        # Runs even when the lint step fails, so one run reports both.
        if: ${{ !cancelled() }}
        run: uv run ruff format --check

  lint-mypy:
    name: Lint (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Type-check with mypy
        run: uv run mypy

  lint-pyright:
    name: Lint (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/debounce-main-push
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Type-check with pyright
        run: uv run pyright

  # ── Stage 2: Build (only if all stage-1 jobs pass) ───────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint-ruff, lint-mypy, lint-pyright]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      - name: Build package
        run: uv build
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vultron
          path: dist/vultron-*.tar.gz
          retention-days: 14

  # ── Notify: file or close a failure issue on push to main ────────────────
  notify:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: [test, lint-ruff, lint-mypy, lint-pyright, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CISEC-05-006, #3249: file only on a genuine failure, never on
      # cancellation alone — a concurrency-superseded run with no failure has
      # nothing to report, because a newer run is authoritative.
      # A cancelled job reports `cancelled`, not `failure`, and no job here
      # consumes another job's artifact, so every `failure` in the aggregate
      # is genuine. Do NOT add `!contains(needs.*.result, 'cancelled')`: a
      # newer push that cancels the lint jobs while the tests have already
      # failed would then suppress the notification (#3293).
      - name: Notify CI failure
        if: contains(needs.*.result, 'failure')
        uses: ./.github/actions/notify-failure
        with:
          mode: notify
          workflow-label: ci:workflow-python-app
          token: ${{ secrets.GITHUB_TOKEN }}
      # CISEC-05-002: a superseded run must not declare recovery, so the close
      # step keeps `!contains(needs.*.result, 'cancelled')` — a cancelled job
      # might have failed had it run to completion.
      - name: Close CI failure issue
        if: "!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')"
        uses: ./.github/actions/notify-failure
        with:
          mode: close
          workflow-label: ci:workflow-python-app
          token: ${{ secrets.GITHUB_TOKEN }}
