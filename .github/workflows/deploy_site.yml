# Deploys the MkDocs site to GitHub Pages from main (ADR-0166, DOCBW-06-005).
name: Deploy static content to Pages

on:
  # Every merge to main deploys. The build and publication gates below are what
  # stand between a merge and Pages: a failed gate stops the upload, and the
  # live site stays at the last good deploy. No paths: filter, because pages
  # render from vultron/ and specs/ as well as docs/. No debounce either: the
  # pages concurrency group below already collapses a burst of merges into the
  # running deploy plus the newest one queued.
  push:
    branches: [main]

  # Manual runs. To roll back, choose a release tag under "Use workflow from":
  # that tag's own workflow, gates and baseline build that tag's site. The
  # github-pages environment's deployment rules decide which branches and
  # tags may deploy, and are the brake if deploys need stopping.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Only loads the local actions: build-site re-checks out the repository
      # with the history and tags the build needs (DOCBW-06-004).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same build docs-build-check.yml reviews: checkout, dependency set
      # and the strict mkdocs build all live in the action (DOCBW-06-004,
      # DOCBW-03-009, DOCBW-03-010).
      - name: Build Site
        uses: ./.github/actions/build-site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # This is the workflow that actually publishes, so it is the one the
      # publication checks have to gate. It must sit between Build Site and
      # Upload artifact: after the build so site/ exists, before the upload so
      # a withheld artifact, a dead internal reference, a dropped URL or an
      # unrecorded page cannot reach Pages. Same action as docs-build-check.yml
      # (DOCBW-03-006, DOCBW-03-007, DOCBW-03-008, DOCBW-03-012).
      - name: Check site publication
        uses: ./.github/actions/check-site-publication

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload entire repository
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Notify CI failure
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/notify-failure
        with:
          mode: notify
          workflow-label: ci:workflow-deploy-site
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Close CI failure issue
        if: success() && github.event_name == 'push'
        uses: ./.github/actions/notify-failure
        with:
          mode: close
          workflow-label: ci:workflow-deploy-site
          token: ${{ secrets.GITHUB_TOKEN }}
