# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default publish branch
  push:
    branches: [publish]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Only loads the local actions: build-site re-checks out the repository
      # with the history and tags the build needs (DOCBW-06-004).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same build docs-build-check.yml reviews: checkout, dependency set
      # and the strict mkdocs build all live in the action (DOCBW-06-004,
      # DOCBW-03-009, DOCBW-03-010).
      - name: Build Site
        uses: ./.github/actions/build-site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # This is the workflow that actually publishes, so it is the one the
      # publication checks have to gate. It must sit between Build Site and
      # Upload artifact: after the build so site/ exists, before the upload so
      # a withheld artifact, a dead internal reference or a dropped URL cannot
      # reach Pages. Same action as docs-build-check.yml (DOCBW-03-006,
      # DOCBW-03-007, DOCBW-03-008).
      - name: Check site publication
        uses: ./.github/actions/check-site-publication

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload entire repository
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Notify CI failure
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/notify-failure
        with:
          mode: notify
          workflow-label: ci:workflow-deploy-site
          token: ${{ secrets.GITHUB_TOKEN }}
          epic: ${{ vars.CI_FAILURE_EPIC }}
      - name: Close CI failure issue
        if: success() && github.event_name == 'push'
        uses: ./.github/actions/notify-failure
        with:
          mode: close
          workflow-label: ci:workflow-deploy-site
          token: ${{ secrets.GITHUB_TOKEN }}
