# A pull request that materially edits an ADR leaves its status on the epoch
# ADR-0120 computes for that date (MS-14-007, MS-14-009), moves a status ahead
# of its epoch only with a new status_override (MS-14-012), and one that gives
# a proposed ADR its first test-verified dependent flips it to
# accepted-provisional (MS-14-010). The dependent can arrive in a spec or a
# test file alone, so the job runs on those paths too.
#
# The check compares the pull request with its merge base, so it can fail
# only the pull request that made the change. The clock alone never fails a
# merge-blocking check; drift on ADRs a pull request did not touch is
# reported by adr-status-drift.yml.
#
# The same job refuses an unresolvable path or code symbol that the pull
# request adds to an ADR it edits (MS-15-006), against the same merge base.

name: ADR Lifecycle

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docs/adr/**"
      - "specs/**"
      - "test/**"
      - "vultron/metadata/adr/**"
      - ".github/workflows/adr-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adr-lifecycle-check:
    name: Edited ADRs Match Their Epoch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
      # Both checks judge the edit, never the record's existing text, so a
      # code change cannot fail either (ADR-0127). Each runs even when the
      # other fails, so a pull request sees every kind of fault at once.
      - name: Check the ADRs this pull request changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          mapfile -t adrs < <(git diff --name-only --diff-filter=AMR "$base" HEAD -- 'docs/adr/*.md')
          rc=0
          # MS-14-007/009/012: edited ADRs keep their status on the epoch.
          # MS-14-010: runs with no ADR changed, for a new dependent.
          PYTHONPATH='' uv run python -m vultron.metadata.adr.lifecycle --base "$base" "${adrs[@]}" || rc=1
          # MS-15-006: a reference the edit adds to an ADR resolves.
          if [ "${#adrs[@]}" -gt 0 ]; then
            PYTHONPATH='' uv run python -m vultron.metadata.adr.added_refs --base "$base" "${adrs[@]}" || rc=1
          fi
          exit "$rc"
