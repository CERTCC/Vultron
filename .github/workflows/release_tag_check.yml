# Checks each release tag pushed by hand (DOCBW-07-007). A `v*` tag whose
# commit carries no `publish-*` tag made by the publish workflow names a
# snapshot that was never on the site, so the run fails and `notify-failure`
# files a report. It only reports: it never blocks the tag and never moves or
# deletes it, which the tag ruleset would refuse anyway (#5545). A release tag
# the promote workflow pushes starts no workflow, so this one sees only tags
# pushed by hand. The logic lives in .github/scripts/release.py.
name: Release tag check

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    name: Check that the release names a publish
    runs-on: ubuntu-latest
    # A fetch and a tag lookup. Cap at 10 min so a hang fails fast instead of
    # holding a runner until GitHub's 6-h limit (TB-14-006).
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # main's copy of the script and of notify-failure, whatever commit the
      # tag names; full history and every tag, so the tag and its commit's
      # publish-* tags are present.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Check the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -I .github/scripts/release.py check \
            --tag "$TAG" --details-file unpublished-release.md

      - name: Notify CI failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          mode: notify
          workflow-label: ci:workflow-release-tag-check
          token: ${{ secrets.GITHUB_TOKEN }}
          details-file: unpublished-release.md
      # A later release tag that names a publish closes the report: the newest
      # release is then one that was on the site.
      - name: Close CI failure issue
        if: success()
        uses: ./.github/actions/notify-failure
        with:
          mode: close
          workflow-label: ci:workflow-release-tag-check
          token: ${{ secrets.GITHUB_TOKEN }}
