# Multi-Actor Vultron Demo — Docker Compose Configuration
#
# Defines the fixed cast every demo scenario runs on: five role-neutral actor
# services (actor0 … actor4) plus the dedicated case-actor service, each with
# its own DataLayer volume, health check, and network membership.
#
# ─── The cast (DEMOCI-11-020, DEMOCI-11-021) ──────────────────────────────
# Every registered scenario runs on these containers, in this order, with one
# actor id per container in every scenario.  The cast is defined once in the
# demo package (vultron/demo/helpers/cast.py); this file is the Docker side of
# the same table, and test/demo_unit/test_cast.py fails when the two disagree.
#
#   actor0   the first Reporter a scenario seats
#   actor1   the first Vendor a scenario seats
#   actor2   the first Coordinator a scenario seats
#   actor3   a character actor (Vendor2 in rvv/rvcv-*/rcvv-embargo,
#            Coordinator2 in rccv-*)
#   actor4   a character actor (the VendorDeployer in rcvcv)
#
# A scenario without one of the three fixed roles leaves that container unused
# (rv has no Coordinator, so actor2 idles).  A character actor's CVD role comes
# from the act that seats it — the role its Invite offers — so its container
# declares no VULTRON_ACTOR__DEFAULT_CASE_ROLES and carries no role-named actor
# id.  The three fixed-role containers do declare their role, because a case
# they own has to be owned as that role (CP-01-013).
#
# DEMO-MA-02-001: Each actor service has a /health/ready healthcheck.
# DEMO-MA-02-002: Dependent services (e.g., demo-runner) use
#                 condition: service_healthy for all actor dependencies.
# DEMO-MA-02-003: Port mappings, env vars, and network config are
#                 documented below and as inline comments.
#
# ─── Port mappings (host → container) ─────────────────────────────────────
# All actor services bind container port 7999 to an ephemeral host port
# chosen by Docker (host port 0 = auto-assign).  This avoids host port
# conflicts when a development stack is already running.
#
# Inter-container communication uses Docker service-name DNS on
# vultron-network and is unaffected by host port assignment.
#
# To inspect the assigned host port after startup:
#   docker compose -f docker-compose-multi-actor.yml port actor0 7999
#
# To pin a specific host port (e.g. for scripted host-side probing):
#   ACTOR0_HOST_PORT=17901 ./integration_tests/demo/run_multi_actor_integration_test.sh
#
# ─── Required environment variables ───────────────────────────────────────
#   PROJECT_NAME          Docker resource name prefix (default: vultron)
#   COMPOSE_PROJECT_NAME  Docker Compose project name   (default: vultron)
#
# ─── Per-service environment variables (set below) ────────────────────────
#   VULTRON_SERVER__BASE_URL
#                       Full base URL for this container's API server.
#                       Must use the Docker service name as hostname so that
#                       peer containers can route to it (e.g.,
#                       http://actor0:7999/api/v2/).
#                       Corresponds to ServerConfig.base_url in vultron/config.py.
#                       Uses pydantic-settings env_nested_delimiter='__'
#                       (for example: VULTRON_SERVER__BASE_URL).
#   VULTRON_DATABASE__DB_URL
#                       SQLAlchemy connection URL for the DataLayer
#                       (default: sqlite:////app/data/mydb.sqlite).
#                       Each service mounts a named volume at /app/data so
#                       the database persists across container restarts.
#                       Corresponds to DatabaseConfig.db_url in vultron/config.py.
#                       Uses pydantic-settings env_nested_delimiter='__'
#                       (for example: VULTRON_DATABASE__DB_URL).
#   VULTRON_ACTOR_ID    Deterministic full URI for the local actor (D5-1-G3).
#                       Pre-configured so peer containers can register each
#                       other without discovery.  The ID is stable across
#                       container restarts and across scenarios because it is
#                       derived from the service hostname, which is the cast
#                       slot's name (DEMOCI-11-020).
#   VULTRON_SEED_CONFIG Path inside the container to a YAML seed config file
#                       (docker/seed-configs/seed-<slot>.yaml).  Used by
#                       `vultron-demo seed` to register peer actors in the
#                       local DataLayer.
#
# ─── Networks ─────────────────────────────────────────────────────────────
#   vultron-network   Shared bridge network connecting all services.
#
# ─── Startup and seeding ──────────────────────────────────────────────────
# The API server containers (actor0 … actor4, case-actor) do NOT auto-seed
# actor records on startup. The `demo-runner` service resets the relevant
# containers and seeds actors automatically, producing a deterministic
# acceptance run with a single `docker compose up --abort-on-container-exit
# demo-runner` command. Manual seed commands remain available when debugging
# individual services. Each service's seed configuration is pre-built in
# docker/seed-configs/ and mounted read-only at /app/docker/seed-configs/.
#
# Example (after `docker compose -f docker-compose-multi-actor.yml up -d`):
#
#   docker compose -f docker-compose-multi-actor.yml run --rm \
#     -e VULTRON_API_BASE_URL=http://actor0:7999/api/v2 demo-runner \
#     vultron-demo seed
#
# See docker/README.md for full usage instructions.

# ── Shared actor-service template ─────────────────────────────────────────
# All six actor services are built from the same Dockerfile target and share
# the same health-check configuration.  Defining these once here and merging
# them with <<: *actor-service avoids redundant image builds and keeps the
# per-service stanzas focused on what actually differs (env, volumes, ports).
x-actor-service: &actor-service
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: api-dev
  image: ${PROJECT_NAME:-vultron}-api-dev:latest
  networks:
    - vultron-network
  healthcheck:
    # DEMO-MA-02-001: probe /health/ready to verify DataLayer connectivity.
    test: ["CMD", "curl", "-f", "http://localhost:7999/api/v2/health/ready"]
    interval: 2s
    timeout: 5s
    retries: 15
    # Startup budget, not a fixed delay (#4621): probes inside start_period do
    # not count toward retries, and the first success marks the container
    # healthy. Inside start_period Docker probes every start_interval (default
    # 5 s), not every interval, so start_interval is pinned to 2 s: a fast
    # runner is healthy within 2 s of the app being ready. A slow CI runner
    # spent about 31 s importing the app under the reloader, after the uv build
    # step, and outlasted the old 5 s start period plus 15 x 2 s retries
    # (~35 s). 90 s is about three times that cold start; with the retries,
    # Docker marks the container unhealthy after about 2 minutes, and
    # demo-runner's service_healthy wait fails.
    start_period: 90s
    start_interval: 2s

services:

  # ── Cast slot 0 — the first Reporter ────────────────────────────────────
  # Declares no default case roles: a Reporter's role comes from submitting
  # the report, and this container never owns a case.
  actor0:
    <<: *actor-service
    environment:
      - PYTHONPATH=/app
      # Identity: each container gets a unique base URL so peer actors can
      # derive inbox URLs using the Docker service name as hostname.
      - VULTRON_SERVER__BASE_URL=http://actor0:7999/api/v2/
      # DataLayer: persist the SQLite file under the named volume.
      - VULTRON_DATABASE__DB_URL=sqlite:////app/data/mydb.sqlite
      # Deterministic actor ID (D5-1-G3): fixed URI used by vultron-demo seed
      # so peer containers can pre-register this actor without discovery.
      - VULTRON_ACTOR_ID=http://actor0:7999/api/v2/actors/actor0
      # Seed config: registers local actor + peers on first seed run.
      - VULTRON_SEED_CONFIG=/app/docker/seed-configs/seed-actor0.yaml
      - VULTRON_SERVER__LOG_LEVEL=${VULTRON_SERVER__LOG_LEVEL:-INFO}
      # CP-08-003, CP-08-008: proposals go to the dedicated case-actor container.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2
    volumes:
      # Bind-mount application source so code changes take effect without
      # rebuilding the image.  uvicorn --reload picks them up automatically.
      - "../vultron:/app/vultron"
      - actor0-data:/app/data
    ports:
      # Ephemeral host port (auto-assigned by Docker) → container 7999.
      # Inter-container traffic uses http://actor0:7999 on vultron-network
      # and is unaffected by this mapping.  Set ACTOR0_HOST_PORT to pin a
      # specific host port for host-side access.
      - "${ACTOR0_HOST_PORT:-0}:7999"

  # ── Cast slot 1 — the first Vendor ──────────────────────────────────────
  actor1:
    <<: *actor-service
    environment:
      - PYTHONPATH=/app
      - VULTRON_SERVER__BASE_URL=http://actor1:7999/api/v2/
      - VULTRON_DATABASE__DB_URL=sqlite:////app/data/mydb.sqlite
      - VULTRON_ACTOR_ID=http://actor1:7999/api/v2/actors/actor1
      - VULTRON_SEED_CONFIG=/app/docker/seed-configs/seed-actor1.yaml
      - VULTRON_SERVER__LOG_LEVEL=${VULTRON_SERVER__LOG_LEVEL:-INFO}
      # DEMOMA-15-001: this cast slot always plays the first Vendor, so a case
      # it owns is owned as CVDRole.VENDOR (CP-01-013) and verify_fix_ready /
      # verify_fix_deployed can confirm the fix lifecycle precondition.
      - VULTRON_ACTOR__DEFAULT_CASE_ROLES=["vendor"]
      # CP-08-003, CP-08-008: case proposals go to the dedicated case-actor
      # container (DEMOMA-06-004).  Every actor container names the same one.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2
    volumes:
      - "../vultron:/app/vultron"
      - actor1-data:/app/data
    ports:
      # Ephemeral host port → container 7999.  Set ACTOR1_HOST_PORT to pin.
      - "${ACTOR1_HOST_PORT:-0}:7999"

  # ── Cast slot 2 — the first Coordinator ─────────────────────────────────
  actor2:
    <<: *actor-service
    environment:
      - PYTHONPATH=/app
      - VULTRON_SERVER__BASE_URL=http://actor2:7999/api/v2/
      - VULTRON_DATABASE__DB_URL=sqlite:////app/data/mydb.sqlite
      - VULTRON_ACTOR_ID=http://actor2:7999/api/v2/actors/actor2
      - VULTRON_SEED_CONFIG=/app/docker/seed-configs/seed-actor2.yaml
      - VULTRON_SERVER__LOG_LEVEL=${VULTRON_SERVER__LOG_LEVEL:-INFO}
      # CP-01-013: a Coordinator that owns a case holds CVDRole.COORDINATOR
      # there, the role its scenario steps are checked against (DEMOCI-11-013).
      - VULTRON_ACTOR__DEFAULT_CASE_ROLES=["coordinator"]
      # CP-08-003, CP-08-008: proposals go to the dedicated case-actor container.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2
    volumes:
      - "../vultron:/app/vultron"
      - actor2-data:/app/data
    ports:
      # Ephemeral host port → container 7999.  Set ACTOR2_HOST_PORT to pin.
      - "${ACTOR2_HOST_PORT:-0}:7999"

  # ── Cast slot 3 — a character actor ─────────────────────────────────────
  # Vendor2 in rvv, rvcv-* and rcvv-embargo; Coordinator2 in rccv-*.  Its CVD
  # role comes from the Invite that seats it (DEMOCI-11-021), so this stanza
  # names no role: neither in its actor id nor in default case roles.
  actor3:
    <<: *actor-service
    environment:
      - PYTHONPATH=/app
      - VULTRON_SERVER__BASE_URL=http://actor3:7999/api/v2/
      - VULTRON_DATABASE__DB_URL=sqlite:////app/data/mydb.sqlite
      - VULTRON_ACTOR_ID=http://actor3:7999/api/v2/actors/actor3
      - VULTRON_SEED_CONFIG=/app/docker/seed-configs/seed-actor3.yaml
      - VULTRON_SERVER__LOG_LEVEL=${VULTRON_SERVER__LOG_LEVEL:-INFO}
      # CP-08-003, CP-08-008: proposals go to the dedicated case-actor container.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2
    volumes:
      - "../vultron:/app/vultron"
      - actor3-data:/app/data
    ports:
      # Ephemeral host port → container 7999.  Set ACTOR3_HOST_PORT to pin.
      - "${ACTOR3_HOST_PORT:-0}:7999"

  # ── Cast slot 4 — a character actor ─────────────────────────────────────
  # The VendorDeployer (V2) in rcvcv, which holds both CVDRole.VENDOR and
  # CVDRole.DEPLOYER in that case and follows the full VFD fix path
  # (DEMOMA-19-001).  Both roles come from the Invite that seats it, so this
  # stanza names no role.
  actor4:
    <<: *actor-service
    environment:
      - PYTHONPATH=/app
      - VULTRON_SERVER__BASE_URL=http://actor4:7999/api/v2/
      - VULTRON_DATABASE__DB_URL=sqlite:////app/data/mydb.sqlite
      - VULTRON_ACTOR_ID=http://actor4:7999/api/v2/actors/actor4
      - VULTRON_SEED_CONFIG=/app/docker/seed-configs/seed-actor4.yaml
      - VULTRON_SERVER__LOG_LEVEL=${VULTRON_SERVER__LOG_LEVEL:-INFO}
      # CP-08-003, CP-08-008: proposals go to the dedicated case-actor container.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2
    volumes:
      - "../vultron:/app/vultron"
      - actor4-data:/app/data
    ports:
      # Ephemeral host port → container 7999.  Set ACTOR4_HOST_PORT to pin.
      - "${ACTOR4_HOST_PORT:-0}:7999"

  # ── CaseActor ─────────────────────────────────────────────────────────────
  # Hosts the CaseActor — the participant holding CVDRole.CASE_MANAGER — for
  # every case in every scenario (DEMOMA-06-004).  Each actor container's
  # VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL names this container, so a report
  # receiver's Create(CaseProposal) is delivered here, and this container's
  # DataLayer holds the canonical case and its ledger.
  #
  # Not a cast member: it plays no CVD role of its own choosing, so it takes
  # no cast slot number.
  #
  # One identity, many cases: http://case-actor:7999/api/v2/actors/case-actor
  # (#1872).  The demo-runner's reset wipes it with every other record, then
  # re-seeds it (seed_case_actor_identity), because no container auto-seeds.
  #
  # A pre-provisioned singleton is a stepping stone, not the end state: CaseActor
  # Spawning (#1092) replaces it with one spawned CaseActor process per case.
  case-actor:
    <<: *actor-service
    environment:
      - PYTHONPATH=/app
      - VULTRON_SERVER__BASE_URL=http://case-actor:7999/api/v2/
      - VULTRON_DATABASE__DB_URL=sqlite:////app/data/mydb.sqlite
      - VULTRON_ACTOR_ID=http://case-actor:7999/api/v2/actors/case-actor
      - VULTRON_SEED_CONFIG=/app/docker/seed-configs/seed-case-actor.yaml
      - VULTRON_SERVER__LOG_LEVEL=${VULTRON_SERVER__LOG_LEVEL:-INFO}
      # Points at itself (CP-08-008): the CaseActor it hosts is the one every
      # container proposes to.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2
    volumes:
      - "../vultron:/app/vultron"
      - case-actor-data:/app/data
    ports:
      # Host port → container port 7999 (for debugging from host only).
      # Ephemeral host port → container 7999.  Set CASE_ACTOR_HOST_PORT to pin.
      - "${CASE_ACTOR_HOST_PORT:-0}:7999"

  # ── Demo orchestration container ──────────────────────────────────────────
  # Runs the configured multi-actor acceptance workflow. The script resets
  # the participating containers to a clean baseline, seeds the required
  # actors, orchestrates the scenario, and verifies final state.
  #
  # DEMO-MA-02-002: All actor services are listed as dependencies with
  # condition: service_healthy so this container only starts after every
  # API server passes its /health/ready probe.
  demo-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo
    image: ${PROJECT_NAME:-vultron}-demo:latest
    depends_on:
      actor0:
        condition: service_healthy
      actor1:
        condition: service_healthy
      actor2:
        condition: service_healthy
      actor3:
        condition: service_healthy
      actor4:
        condition: service_healthy
      case-actor:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      # Base URL of each cast container, accessible via Docker network.  One
      # env var per cast slot (DEMOCI-11-020), read by ContainerSlot.url.
      - VULTRON_ACTOR0_BASE_URL=http://actor0:7999/api/v2
      - VULTRON_ACTOR1_BASE_URL=http://actor1:7999/api/v2
      - VULTRON_ACTOR2_BASE_URL=http://actor2:7999/api/v2
      - VULTRON_ACTOR3_BASE_URL=http://actor3:7999/api/v2
      - VULTRON_ACTOR4_BASE_URL=http://actor4:7999/api/v2
      - VULTRON_CASE_ACTOR_BASE_URL=http://case-actor:7999/api/v2
      # The CaseActor the actor containers propose to, so demo-side helpers
      # that ask "which CaseActor does a report go to?" answer as they do.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2
      # Run the selected multi-actor demo non-interactively. Override DEMO
      # at runtime (for example, DEMO=rvv) to switch scenarios.
      - DEMO=${DEMO:-rv}
      - DEVLOGS_DIR=/app/devlogs
    volumes:
      - "../vultron:/app/vultron"
      - "/app/.venv"
      - "../devlogs:/app/devlogs"
    networks:
      - vultron-network

networks:
  vultron-network:
    driver: bridge

# ─── Named volumes ────────────────────────────────────────────────────────
# One volume per actor service.  Each volume stores the SQLite database at
# /app/data/mydb.sqlite (controlled by VULTRON_DATABASE__DB_URL).
#
# To reset all actor state between demo runs:
#   docker compose -f docker-compose-multi-actor.yml down -v
volumes:
  actor0-data:
  actor1-data:
  actor2-data:
  actor3-data:
  actor4-data:
  case-actor-data:
