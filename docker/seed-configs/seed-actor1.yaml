# Manual seed configuration for the actor1 container of the fixed demo
# cast (DEMOCI-11-020).  Used by `vultron-demo seed`; the demo-runner
# seeds the same actors programmatically (vultron/demo/helpers/seeding.py).
#
# Cast slot 1: the first Vendor a scenario seats.

local_actor:
  name: Vendor
  actor_type: Organization
  id: http://actor1:7999/api/v2/actors/actor1

peers:
  - name: Reporter
    actor_type: Person
    id: http://actor0:7999/api/v2/actors/actor0
  - name: Coordinator
    actor_type: Service
    id: http://actor2:7999/api/v2/actors/actor2
  - name: Actor3
    actor_type: Organization
    id: http://actor3:7999/api/v2/actors/actor3
  - name: Actor4
    actor_type: Organization
    id: http://actor4:7999/api/v2/actors/actor4
  - name: CaseActor
    actor_type: Service
    id: http://case-actor:7999/api/v2/actors/case-actor
