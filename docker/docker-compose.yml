services:
  base:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    image: ${PROJECT_NAME}-base:latest

  dependencies:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dependencies
    image: ${PROJECT_NAME}-dependencies:latest
    depends_on:
      - base

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    image: ${PROJECT_NAME}-test:latest
    depends_on:
      - dependencies
    volumes:
      # Bind mount the vultron and test directories to allow for live code changes during development
      - "../vultron:/app/vultron"
      - "../test:/app/test"
      # create a volume for the virtual environment to persist between restarts that is not bind-mounted to the host
      - "/app/.venv"

  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: docs
    image: ${PROJECT_NAME}-docs:latest
    depends_on:
      - dependencies
    ports:
      - "8000:8000"

  vultrabot-demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: vultrabot_demo
    image: ${PROJECT_NAME}-vultrabot-demo:latest
    depends_on:
      - dependencies

  api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api-dev
    image: ${PROJECT_NAME}-api-dev:latest
    depends_on:
      - dependencies
    ports:
      - "7999:7999"
    volumes:
      - "../vultron:/app/vultron"
      # create a volume for the virtual environment to persist between restarts that is not bind-mounted to the host
      - "/app/.venv"
    environment:
      - PYTHONPATH=/app
      # The single server is its own CaseActor service: each vendor proposes
      # the case for a report it receives here (CP-08-001). The host matches
      # the server's default base URL, so the CaseActor's id is one it hosts.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://localhost:7999/api/v2
    networks:
      - vultron-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7999/api/v2/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15
      # Startup budget, not a fixed delay: see the actor healthcheck in
      # docker-compose-multi-actor.yml (#4621).
      start_period: 90s
      start_interval: 2s

  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: demo
    image: ${PROJECT_NAME}-demo:latest
    depends_on:
      api-dev:
        condition: service_healthy
    volumes:
      - "../vultron:/app/vultron"
      - "/app/.venv"
    environment:
      - PYTHONPATH=/app
      - VULTRON_API_BASE_URL=http://api-dev:7999/api/v2
      # The demo names the same CaseActor the api-dev server hosts. Demo
      # helpers take its identity from this variable only and fail without
      # it (CP-08-009), so it matches api-dev's value exactly.
      - VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://localhost:7999/api/v2
    networks:
      - vultron-network
    stdin_open: true
    tty: true

  shadow:
    # The case shadow tool: a read-only dashboard over one case at a time
    # (ADR-0190, ADR-0192). Start it with `docker compose up shadow` and open
    # http://127.0.0.1:8501. It reads the committed demo recordings by
    # default. With VULTRON_SHADOW__NODE_URL and VULTRON_SHADOW__NODE_ACTOR_ID
    # set, it follows a case live on a running demo node instead, such as
    # http://case-actor:7999/api/v2 and case-actor while the stack in
    # docker-compose-multi-actor.yml is up; see
    # docs/howto/run_the_case_shadow.md.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: shadow
    image: ${PROJECT_NAME}-shadow:latest
    depends_on:
      - dependencies
    ports:
      # Loopback only: the page shows embargoed case data (SHD-02-002).
      - "127.0.0.1:8501:8501"
    # No volumes: nothing the tool reads outlives the container (SHD-02-001).
    environment:
      - PYTHONPATH=/app
      - VULTRON_SHADOW__LEDGER_DIR=/app/ui/src/recordings
      # Passed through from the shell that runs `docker compose`, by name
      # only, so no value is ever written here (SHD-02-003). Unset in the
      # shell means unset in the container.
      - VULTRON_SHADOW__CONNECTOR
      - VULTRON_VINCE__BASE_URL
      - VULTRON_VINCE__API_TOKEN
      # The demo node and CASE_MANAGER the live Vultron case reader follows,
      # passed through by name the same way.
      - VULTRON_SHADOW__NODE_URL
      - VULTRON_SHADOW__NODE_ACTOR_ID
    # The demo stack's network, so the tool reaches a node by its service
    # name. Both Compose files share one project name (docker/.env), so
    # this is the network the demo nodes are on.
    networks:
      - vultron-network

networks:
  vultron-network:
    driver: bridge
