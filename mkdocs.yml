not_in_nav: |
  _*.md
  reference/vultron-spec/includes/*
  # Withheld from the built site entirely; see draft_docs below. Listed here so
  # `mkdocs serve`, which does render drafts, raises no omitted-file warning.
  ns/index.md
  # Withdrawn from the site: a tombstone that answers a live URL. See #3551.
  reference/ontology/index.md
  # A redirect stub: the case object moved to topics/case_lifecycle/case_model.md,
  # but older pages still link here.
  howto/case_object.md
  # Situation-titled entry pages, reached from the home page. Nav placement
  # belongs to the nav reorder (#3627).
  start/*.md
  _*/**/*.md
  includes/*
  *diagram*.md
  *table*.md
  *.ttl
  # The project working record (DF-11-003): published and linked, but kept out
  # of the reader-facing nav. about/project_record.md is its one nav entry, and
  # each group below is reached through the routing page that door links. A
  # new working-record page goes here and in WORKING_RECORD_PATTERNS
  # (vultron/metadata/docs/page_schema.py).
  about/contributing.md
  adr/*.md
  adr/archived/*.md
  reference/behaviors/*.md
  reference/case_states/*.md
  reference/code/**
  reference/specs/process.md
  reference/specs/project.md
  reference/user_stories/story_*.md
  reference/user_stories/traceability.md
  topics/behavior_logic/*_bt.md
  topics/behavior_logic/original_design.md
  # Maintainer- and agent-facing material, reached from none of the above.
  agents/*.md
  developer/**/*.md
  reference/codebase/**
validation:
  nav:
    # Emit a warning when a page exists but is missing from the nav and is not
    # declared in not_in_nav above. Surfaces future un-navved pages (e.g. new
    # ADRs) and fails the --strict build every site-building workflow runs
    # (DOCBW-03-009/011, #1304, #3051). Keep at `warn`: `info` is below what
    # --strict counts, so a downgrade turns the gate off silently.
    omitted_files: warn
  links:
    # Fail --strict (DOCBW-03-011) on a link to a #fragment that does not
    # exist on the target page. Default is `info`, which is silent in the
    # warning count: a page can ship dozens of dead in-page links and still
    # look clean. Note that this check only knows about heading anchors: the
    # per-requirement `<a id="clp-14-001">` anchors in the generated spec
    # tables are real and work in a browser, but linking to one still warns
    # here. Cite the requirement ID in the link text and point the href at its
    # group anchor (`#clp-14`).
    anchors: warn
draft_docs: |
  draft-*.md
  # Patterns are relative to docs_dir; `docs/developer/` was mis-anchored
  # (matched a nonexistent docs/docs/developer/) so these maintainer pages were
  # silently published. Exclude them from production builds per DOCBW-03-004
  # while `mkdocs serve` still renders them for local review.
  developer/
  # The Vultron vocabulary namespace is withheld: publishing the site would make
  # `https://certcc.github.io/Vultron/ns/context.jsonld` resolve for the first
  # time, and a namespace URI is a long-lived commitment. The gate on lifting
  # this is the term set settling, not the drift check — #2943 landed that check
  # (`wire-context --check`), but #3487 and #3488 still delete the `as_*` classes
  # the declared terms name, under an ADR-0099 that is `accepted-provisional`.
  # A draft pattern also withholds static files, so `context.jsonld` goes with
  # the page.
  ns/
theme:
  logo: 'assets/Software_Engineering_Institute_Unitmark_White.svg'
  name: 'material'
  custom_dir: 'overrides'
  features:
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.prune
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    scheme: 'cmu'
    accent: 'red'
  icon:
    repo: fontawesome/brands/github
plugins:
  - include-markdown:
      comments: false
  - mkdocstrings:
      enabled: !ENV [ENABLE_MKDOCSTRINGS, true]
      handlers:
        python:
          # The package lives at the repo root (vultron/); there is no src/.
          paths: [ '.' ]
          options:
            show_bases: true
            show_root_heading: true
            show_source: false
            heading_level: 2
  - markdown-exec
  - search
  # autorefs is declared explicitly so mkdocstrings does not auto-append it
  # after print-site, which would trip print-site's must-be-last check.
  - autorefs
  # Retired pages keep their old URL alive by redirecting to the page that
  # absorbed their content. Every URL a publish has served must resolve here or
  # be declared withdrawn in vultron/metadata/docs/withheld.py; the
  # `docs-legacy-urls` check (DOCBW-03-008) fails the build on one that does not.
  - redirects:
      redirect_maps:
