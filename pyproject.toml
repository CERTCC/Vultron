[build-system]
# Todo: Why would I want to use a different build system?
# SetupTools
requires = ["setuptools>=84.0.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"
# Flit
#requires = ["flit_core >=3.2,<4"]
#build-backend = "flit_core.buildapi"
# Hatchling
#requires = ["hatchling"]
#build-backend = "hatchling.build"
# PDM-Backend
#requires = ["pdm-backend"]
#build-backend = "pdm.backend"

[project]
name = "vultron"
authors = [
    { name = "Allen D. Householder", email="adh@cert.org" },
]
description = "A prototype implementation of the Vultron protocol."
readme = {file="README.md", content-type="text/markdown"}
requires-python = ">=3.12"
keywords =["vultron","cvd","vulnerability disclosure"]
license = {file="LICENSE.md"}
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.141.1",
    "isodate>=0.7.2",
    "markdown-exec>=1.12.3",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-print-site-plugin>=2.8",
    "mkdocs-redirects>=1.2.3",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=2.0.5",
    "mkdocstrings>=1.0.6",
    "networkx>=3.5",
    "pandas>=3.0.5",
    "pathspec>=0.12.1",
    "pydantic==2.13.5",
    "py-trees>=2.6.0",
    "scipy>=1.18.0",
    "uvicorn>=0.52.3",
    "click>=8.4.2",
    "griffelib>=2.1.0",
    "transitions>=0.9.3",
    "sqlmodel>=0.0.39",
    "pyyaml>=6.0",
    "python-frontmatter>=1.3.0",
    "pydantic-settings>=2.15.0",
    "httpx2",
]
dynamic = ["version",]

[project.scripts]
vultrabot_pacman="vultron.bt.base.demo.pacman:main"
vultrabot_robot="vultron.bt.base.demo.robot:main"
vultrabot_cvd="vultron.bt.base.demo.cvd:main"
vultrabot="vultron.bt.base.demo.cvd:main"
vultron-demo="vultron.demo.cli:main"
vultron-demo-report="vultron.demo.report:main"
spec-dump="vultron.metadata.specs.render:main_llm_json"
spec-dump-llm-json="vultron.metadata.specs.render:main_llm_json"
spec-lint="vultron.metadata.specs.lint:main"
spec-coverage="vultron.metadata.specs.coverage:main"
spec-backstop="vultron.metadata.specs.backstop:main"
adr-index="vultron.metadata.adr.index_gen:main"
docs-frontmatter="vultron.metadata.docs.page_frontmatter:main"
docs-level-order="vultron.metadata.docs.level_order:main"
demo-scenarios="vultron.metadata.demo_scenarios.sync:main"
docs-site="vultron.metadata.docs.site_sync:main"
bundle-fit="vultron.metadata.planning.bundle_fit:main"
wire-context="vultron.metadata.wire_context.sync:main"
docs-withheld="vultron.metadata.docs.withheld:main"
docs-links="vultron.metadata.docs.links:main"
docs-legacy-urls="vultron.metadata.docs.legacy_urls:main"
pr-size="vultron.metadata.planning.size_bands:main"
glossary-index="vultron.metadata.docs.glossary_index:main"
learnings-index="vultron.metadata.history.incoming:main"
append-history="vultron.metadata.history.cli:main"
show-history="vultron.metadata.history.show_history_cli:main"
backfill-implementation-history="vultron.metadata.history.backfill_implementation:main"


[project.urls]
"Homepage" = "https://certcc.github.io/Vultron"
"Project" = "https://github.com/CERTCC/Vultron"
"Bug Tracker" = "https://github.com/CERTCC/Vultron/issues"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["vultron*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["test*"]  # exclude packages matching these glob patterns (empty by default)
#namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools_scm]
# Only consider three-component release tags like 2026.9.0 or v2026.9.0
# (ADR-0006). No alpha/beta/rc suffix is recognized: pre-release labels are
# rejected by policy, and a two-component tag yields fallback_version.
# test/metadata/docs/test_tag_regex.py holds this pattern to the policy.
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
version_file = "vultron/_version.py"
# Fallback when no valid version tag is reachable (e.g. nearest tag is a
# non-semver snapshot or branch tag).  Prevents vcs_versioning AssertionError
# in `uv run` build environments.
fallback_version = "0.0.0+dev"
# Restrict git describe to semver-style tags (v<N>.*) so that branch/snapshot
# tags (e.g. snapshot-2026Q1, externally aliased as snapshot/Q1-2026) are
# never returned by git describe and never trigger a parse failure.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"

#[tools.setuptools.dynamic]

[tool.black]
line-length = 79
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313' ]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["."]
# Default run excludes integration tests (demo suite) so the fast unit-test
# suite stays under ~1 minute.  To run integration tests use one of:
#
#   uv run pytest -m integration          # integration tests only
#   uv run pytest -m ""                   # all tests (unit + integration)
#   uv run pytest test/demo/              # demo/integration tests only
#
# See AGENTS.md "Testing" section for full guidance.
addopts = "-ra -q -m 'not integration'"
# Unit-tier per-test timeout.  Raised 5 -> 30 in #2270.
#
# `timeout_method = "thread"` cannot cancel one test — it kills the whole pytest
# process, so a trip yields no summary line at all.  That makes a too-tight
# ceiling actively harmful: it converts a slow test into an uninformative
# aborted session.  At 5s the margin was thin enough that AST-walking
# architecture ratchets (~3.4s in isolation) tripped it nondeterministically
# under full-suite load, and four separate sessions re-diagnosed it as flakiness
# (ISSUE-1925, ISSUE-1988, ISSUE-2086, ISSUE-2237).
#
# Sized from measurement, not taste: the slowest unit test on an idle machine is
# ~3.1s (`test_real_specs_load` setup), so this is ~10x headroom.  An
# intermediate value of 20s was tried and still tripped once while a background
# graphify rebuild competed for CPU — contention on a loaded dev box or CI
# runner inflates these well beyond their idle cost.
#
# A generous ceiling costs nothing on a genuine hang: that test was never going
# to finish, and 30s is still far below the CI job timeout.  The suite stays fast
# because total runtime (~120s) is bounded by the tests, not by this ceiling.
#
# Integration tests get a wider tier; see `INTEGRATION_TIMEOUT_SECONDS` in
# `test/conftest.py`.
timeout = 30
timeout_method = "thread"
testpaths = [
    "test",
]
filterwarnings = [
    "error",
    # Both spec-gate warnings MUST be listed *after* "error" above, not before.
    # pytest applies these entries in list order through
    # warnings.filterwarnings(), which inserts each at index 0 — so a LATER
    # entry outranks an earlier one. An exemption placed before "error" is a
    # no-op. Both warnings report that a *spec* is wrong, so escalating them
    # would abort the very session that has to run to fix it. See
    # test/conftest.py pytest_collection_modifyitems, SR-05-002, SR-05-006, and
    # test_spec_marker_gate.py::TestWarningIsNotEscalated.
    "always::vultron.metadata.specs.UnknownSpecIdWarning",
    "always::vultron.metadata.specs.SpecRegistryUnavailableWarning",
    "ignore::DeprecationWarning:vultron.demo.scenario.three_actor_demo",
    "ignore:three_actor_demo.py is based on older code:DeprecationWarning",
    "ignore::DeprecationWarning:vultron.demo.scenario.multi_vendor_demo",
]
markers = [
    "integration: marks tests as integration tests (exercise the full HTTP stack; deselected by default)",
    "spec(spec_id): mark test as verifying a specific spec requirement ID",
    "case_ledger_invariants: marks tests as case-ledger invariant harness tests (require devlogs/ JSONL artifacts; skip when absent)",
    "executes_as(actor_id): the actor whose identity the test's behavior tree runs under; store fixtures open that actor's store (ADR-0073)",
    "spec_corpus: marks tests that load actual specs/ YAML files; run on specs/** path changes via spec-check.yml",
]

[tool.uv.workspace]
members = [
    "help",
]

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "codespell>=2.4.3",
    "flake8>=7.3.0",
    "graphifyy>=0.9.43",
    "isort>=7.0.0",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-timeout>=0.5",
    "pytest-xdist>=3.8.0",
    "types-networkx>=3.6.1.20260728",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.codespell]
# SG-37 mechanical floor (ADR-0092, DF-09-001). `builtin` REPLACES the default
# dictionaries: only en-GB spellings are checked, so `ignore-words-list` entries
# for `cna`/`ot` are defensive against a later widening of `builtin`.
# `write-changes` is deliberately NOT set here — it lives in the pre-commit hook
# args, so a manual `codespell docs/` is read-only and the hook's `files:` filter
# keeps codespell from rewriting this very config (see notes/documentation-strategy.md
# § "codespell is the mechanical floor for spelling").
builtin = "en-GB_to_en-US"
ignore-words-list = "cna,ot,dialogues"
# Tokens that must stay as written, because codespell has no notion of a code
# fence, an inline code span, a citation, or an include/link target:
#   py_trees.behaviour.Behaviour   third-party API name, in fences and inline code
#   Analysing an Email Corpus      cited paper title
#   6.2.5 Report Acknowledgement   ISO/IEC 29147:2018 clause title (cited)
#   National Cyber Security Centre proper noun (UK NCSC)
#   ../../Acknowledgements.md      include-markdown target (repo-root file)
ignore-regex = "py_trees\\.behaviour\\.Behaviour|Analysing an Email Corpus|6\\.2\\.5 Report Acknowledgement|National Cyber Security Centre|Acknowledgements\\.md"
# Paths as codespell sees them — no `./` prefix. Each directory pattern ends in
# `*` because codespell matches skip globs with fnmatch against the full path,
# and it sees two shapes: `docs/adr` while walking `codespell docs/`, and
# `docs/adr/0092-x.md` when the pre-commit hook passes staged filenames. A bare
# `docs/adr` matches only the first, and the hook then rewrites ADR prose.
skip = "docs/adr*,docs/reference/code*,docs/reference/case_states*,docs/reference/codebase*,docs/reference/draft-vultron-replication-spec.md,pyproject.toml"
