- page: general
  title: General
  mechanics: false
  occasions:
  - anchor: suggest-actor-to-case
    heading: Suggest actor to case
    when: a Participant suggests an actor that the case should include
    send: Offer(Actor)[target=VulnerabilityCase]
    send_to: the case manager
    sent_by: a participant
    distinguished_by: sender is not the case owner
    semantics: offer_actor_to_case
    shorthand: GI
    status: expansion
    description: Recommends an actor to the Case Manager for the case named by the target.
    seen_in:
    - path: howto/activitypub/activities/suggest_actor.md
      title: How to Suggest an Actor for a Case
    example: recommend_actor
  - anchor: request-invite-actor-to-case
    heading: Ask the Case Manager to invite an actor
    when: the Case Owner decides to invite an actor to the case
    send: Offer(Actor)[target=VulnerabilityCase]
    send_to: the case manager
    sent_by: a participant
    distinguished_by: sender is the case owner
    semantics: offer_actor_to_case
    status: expansion
    description: Asks the Case Manager to invite the actor named by the object to the case
      named by the target, with the roles in `suggestedRoles`. For an actor with no record
      on the case, or an invitee that has not answered, the Case Manager answers with the
      Stub Invite to that actor, not with an offer to the Case Owner.
    seen_in:
    - path: howto/activitypub/activities/invite_actor.md
      title: How to Invite an Actor to a Case
    example: request_invite_actor_to_case
  - anchor: offer-case-participant
    heading: Offer case participant
    when: the Case Manager presents a suggested actor to the Case Owner
    send: Offer(CaseParticipant)[target=VulnerabilityCase]
    send_to: a participant
    sent_by: the case manager
    semantics: offer_case_participant
    shorthand: GI
    status: expansion
    description: Forwards the recommendation as a proposed participant record, carrying the
      original recommendation's ID and the default roles it assigned.
    seen_in:
    - path: howto/activitypub/activities/suggest_actor.md
      title: How to Suggest an Actor for a Case
    example: offer_case_participant
  - anchor: accept-case-participant-offer
    heading: Accept case participant offer
    when: the Case Owner approves a suggested actor
    send: Accept(Offer(CaseParticipant)[target=VulnerabilityCase])
    send_to: the case manager
    sent_by: the case owner
    semantics: accept_offer_case_participant
    shorthand: GI
    status: expansion
    description: Accepts the proposed participant record. The Case Manager then invites the
      suggested actor.
    seen_in:
    - path: howto/activitypub/activities/suggest_actor.md
      title: How to Suggest an Actor for a Case
    example: accept_case_participant_offer
  - anchor: reject-case-participant-offer
    heading: Reject case participant offer
    when: the Case Owner declines a suggested actor
    send: Reject(Offer(CaseParticipant)[target=VulnerabilityCase])
    send_to: the case manager
    sent_by: the case owner
    semantics: reject_offer_case_participant
    shorthand: GI
    status: expansion
    description: Rejects the proposed participant record. The Case Manager tells the recommender.
    seen_in:
    - path: howto/activitypub/activities/suggest_actor.md
      title: How to Suggest an Actor for a Case
    example: reject_case_participant_offer
  - anchor: accept-actor-recommendation
    heading: Accept actor recommendation
    when: the Case Manager tells a recommender that the actor it suggested will be invited
    send: Accept(Offer(Actor)[target=VulnerabilityCase])
    send_to: a participant
    sent_by: the case manager
    semantics: accept_actor_recommendation
    shorthand: GI
    status: expansion
    description: Accepts the recommender's suggestion, with `inReplyTo` naming it. The Case
      Manager sends it once the Case Owner approves, or at once when the suggested actor is
      already invited or has joined.
    seen_in:
    - path: howto/activitypub/activities/suggest_actor.md
      title: How to Suggest an Actor for a Case
    example: accept_actor_recommendation
  - anchor: reject-actor-recommendation
    heading: Reject actor recommendation
    when: the Case Manager tells a recommender that the Case Owner declined the actor it suggested
    send: Reject(Offer(Actor)[target=VulnerabilityCase])
    send_to: a participant
    sent_by: the case manager
    semantics: reject_actor_recommendation
    shorthand: GI
    status: expansion
    description: Declines the recommender's suggestion, with `inReplyTo` naming it. The suggested
      actor is not invited.
    seen_in:
    - path: howto/activitypub/activities/suggest_actor.md
      title: How to Suggest an Actor for a Case
    example: reject_actor_recommendation
  - anchor: add-note-to-case
    heading: Add note to case
    when: a Participant posts a note to the case
    send: Add(Note)[target=VulnerabilityCase]
    send_to: the case manager
    sent_by: an active participant
    semantics: add_note_to_case
    shorthand: GI
    status: expansion
    description: 'Posts the note to the case named by the target, with the note carried inline
      as the object: the Case Manager stores the note, attaches it to the case and records
      the attachment in the case ledger. It is the one message that attaches a note: a received
      Create of a note is not a protocol message.'
    seen_in:
    - path: howto/activitypub/activities/status_updates.md
      title: How to Post a Status Update or a Case Note
    example: add_note_to_case
  - anchor: remove-note-from-case
    heading: Remove note from case
    when: a note's author or the Case Owner withdraws a note from the case
    send: Remove(Note)[target=VulnerabilityCase]
    send_to: the case manager
    sent_by: the case owner or the note's author
    semantics: remove_note_from_case
    shorthand: GI
    status: expansion
    description: Removes the note from the case named by the target.
    seen_in:
    - path: howto/activitypub/activities/status_updates.md
      title: How to Post a Status Update or a Case Note
    example: remove_note_from_case
- page: faults_and_acknowledgements
  title: Faults and acknowledgments
  mechanics: true
  occasions:
  - anchor: create-processing-fault
    heading: Create processing fault
    when: a Participant has received a message it cannot process
    send: Create(ProcessingFault)
    send_to: the case manager
    sent_by: not yet checked
    semantics: create_processing_fault
    status: evolved
    description: Tells the sender that its message was received but not understood, or understood
      but its processing failed on the receiver's internal error. It names the failed activity
      and a failure class, with no implementation diagnostics. This fault serves the not-understood
      purpose of the formal RE, EE, CE and GE messages.
    seen_in:
    - path: howto/activitypub/activities/error.md
      title: How to Report a Protocol Fault
    example: create_processing_fault
  - anchor: refusal-notice
    heading: Refusal notice
    when: the Case Manager has refused a participant's assertion because a precondition did
      not hold
    send: Reject(Activity)
    send_to: a participant
    sent_by: the case manager
    semantics: refusal_notice
    status: evolved
    description: Tells the participant that its assertion was received and understood but
      refused, so it had no effect. It carries the refused activity inline and names the refusing
      guard's reason. This notice serves the declined purpose of the formal RE, EE, CE and
      GE messages.
    seen_in: []
    example: refusal_notice
- page: ledger_replication
  title: Ledger replication
  mechanics: true
  occasions:
  - anchor: announce-case-ledger-entry
    heading: Announce case ledger entry
    when: the Case Manager has committed a case event to the case ledger
    send: Announce(CaseLedgerEntry)
    send_to: a participant
    sent_by: the case manager
    semantics: announce_case_ledger_entry
    status: none
    description: Fans out the newly committed ledger entry to each active participant.
    seen_in: []
    example: announce_case_ledger_entry
  - anchor: reject-case-ledger-entry
    heading: Reject case ledger entry
    when: a received ledger entry does not chain onto the Participant's own ledger
    send: Reject(CaseLedgerEntry)
    send_to: the case manager
    sent_by: an active participant, including one that has left the case
    semantics: reject_case_ledger_entry
    status: evolved
    description: Tells the Case Manager that the entry's previous hash does not match the
      sender's ledger tail, and the Case Manager replays every entry after the last accepted
      hash. This negative acknowledgment serves the purpose of the formal EK and CK messages.
    seen_in: []
    example: reject_case_ledger_entry
  - anchor: read-case-ledger-entry
    heading: Read case ledger entry
    when: a Participant checks that its ledger is current, such as after a restart
    send: Read(CaseLedgerEntry)
    send_to: the case manager
    sent_by: an active participant
    semantics: read_case_ledger_entry
    status: none
    description: States the last ledger entry the sender has applied. The Case Manager records
      it as the sender's acknowledged position and replays every entry after it.
    seen_in: []
    example: read_case_ledger_entry
