# The drafts register of the Vultron Protocol Specification (DOCBW-08-001).
#
# This file is the one source of each draft's version, status, date and
# release (ADR-0188). The status box (_status.md) and the status tables of the
# Revision Log (_drafts/draft-N.md) are generated from it: after an edit here,
# run `uv run docs-site --write` and commit the result (DOCBW-08-004/005).
#
# Each entry has:
#   version  draft-N; the drafts are numbered from draft-1 with no gap.
#   status   unreleased or released. At most one entry is unreleased, and it
#            is the highest-numbered: the current draft (work in progress).
#   date     as YYYY-MM-DD. An unreleased entry: the day the entry was added,
#            which is the day the draft before it was frozen. A released
#            entry: the date of the publish that froze the draft. The pages
#            of the current draft show the date of the publish that built
#            them, not this date (DOCBW-08-040).
#   release  released entries only: the v* tag of the release that carries
#            the draft. No two entries name the same tag.
#
# To freeze the current draft, run `uv run drafts-register release`. It marks
# the entry released with the next release tag and the date of the next
# scheduled publish, and regenerates the fragments (DOCBW-08-043). Merge that
# before the publish, then run the promote with an empty input on or after
# that day: it promotes the publish of that date (DOCBW-08-041/042). The tag
# then carries the register that names it. A released entry never changes
# afterwards: CI compares it with the entry at its release tag (DOCBW-08-003).
# Open the next draft as a new unreleased entry.
#
# draft-1's date, 2026-11-06, predates the rule: publish-2026-11-13.1 froze it.
drafts:
  - version: draft-1
    status: released
    date: 2026-11-06
    release: v2026.11.0
  - version: draft-2
    status: unreleased
    date: 2026-11-13
