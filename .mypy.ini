[mypy]
# Global mypy configurations
warn_return_any = True
warn_unused_configs = True
packages = vultron, test
exclude = (?x)(
          # ignore virtual environments
          ^\.venv$
          )

[mypy-vultron.*]
# Specific configurations for vultron package

[mypy-vultron.wire.csaf.models.*]
# Generated by `uv run csaf-models` and checked byte for byte against a fresh
# generation (CSAF-05-003). The generator writes a few schema defaults that do
# not match their declared types (a str default for an AnyUrl field), which
# Pydantic accepts and a hand edit cannot fix.
ignore_errors = True

[mypy-frontmatter]
ignore_missing_imports = True

[mypy-pytest_timeout]
# Ships no py.typed marker.  Imported by test/test_integration_timeout_tier.py
# to read the timeout each item actually resolved to, rather than trusting the
# ini value (#5597).
ignore_missing_imports = True

[mypy-test.*]
# Specific configurations for test modules