id: RSH
title: Received-Side Status Authorization
description: >
  Requirements for the two-gate authorization model governing how a CaseActor
  adopts an inbound participant's reported CaseStatus as canonical (StatusAdoptionGate)
  and whether to execute embargo teardown side-effects (EmbargoTeardownAuthorizationGate).
  Derived from ADR-0046 and IDEA-1836 planning session.
version: 0.1.0
scope:
- prototype
- production
tags:
- behavior-tree
- protocol
- state-machine
groups:
- id: RSH-01
  title: StatusAdoptionGate
  description: >
    Controls whether a participant's reported CaseStatus is adopted as
    canonical by the CaseActor.
  specs:
  - id: RSH-01-001
    priority: MUST
    kind: protocol
    statement: >
      `add_participant_status_tree` MUST include a StatusAdoptionGate node
      positioned after `AppendParticipantStatusNode` and before any
      canonicalization step.
    rationale: >
      StatusAdoptionGate of ADR-0046 — separates the "record the claim" step from the
      "adopt the claim as canonical" decision.
    verification: Inspection of `vultron/core/behaviors/status/` confirms `add_participant_status_tree` positions
      `StatusAdoptionGate` after `AppendParticipantStatusNode` and before any canonicalization step.
    stories:
    - story_2022_046
    - story_2022_088
  - id: RSH-01-002
    priority: MUST
    kind: protocol
    statement: >
      StatusAdoptionGate MUST be implemented as a Fallback with two children:
      (1) `CheckIsCaseOwnerNode` as a hard bypass and (2) a
      `CaseOwnerApprovesStatusUpdate` Evaluator call-out point.
    rationale: >
      CASE_OWNER reports are authoritative by definition (gospel bypass).
      Non-owner reports pass through a configurable approval gate per ADR-0046.
    verification: Inspection of `vultron/core/behaviors/status/` confirms `StatusAdoptionGate` is a Fallback node with
      `CheckIsCaseOwnerNode` as first child and `CaseOwnerApprovesStatusUpdate` as second child.
    stories:
    - story_2022_046
    - story_2022_088
  - id: RSH-01-003
    priority: MUST
    kind: protocol
    statement: >
      When StatusAdoptionGate passes, `add_participant_status_tree` MUST emit
      a self-addressed `Add(CaseStatus, VulnerabilityCase)` activity to the
      CaseActor acting as CASE_MANAGER.
    rationale: >
      The self-addressed Add(CaseStatus) threads the two gates together without
      coupling the trees directly. See ADR-0046 §"Self-addressed pattern".
    verification: Unit tests in `test/core/behaviors/status/test_add_participant_status_bt.py` confirm a self-addressed
      `Add(CaseStatus, VulnerabilityCase)` is emitted when `StatusAdoptionGate` passes.
    note: >
      Implementation pattern for obtaining the `CaseStatus` ID: read the
      `ParticipantStatus` record by `participant_status_id`, extract the
      embedded `.case_status` field (a `CaseStatus` object), persist it
      idempotently via `datalayer.create()` (catching `ValueError` on
      duplicate), then pass the resulting `case_status.id_` to the factory.
      If `.case_status` is absent on the `ParticipantStatus`, the node MUST
      return FAILURE (ISSUE-1841).
    stories:
    - story_2022_045
    - story_2022_088
  - id: RSH-01-004
    priority: MUST_NOT
    kind: protocol
    statement: >
      `add_participant_status_tree` MUST NOT directly execute embargo teardown
      or other canonical-state side-effects; these MUST occur only via the
      `add_case_status_tree` pipeline triggered by the self-addressed message.
    rationale: >
      Side-effects must run after the canonical write, which lives in
      `add_case_status_tree`. Running teardown in `add_participant_status_tree`
      would violate write-before-side-effect ordering.

- id: RSH-02
  title: EmbargoTeardownAuthorizationGate
  description: >
    Controls whether embargo teardown or other side-effects execute after a
    canonical CaseStatus write.
  specs:
  - id: RSH-02-001
    priority: MUST
    kind: protocol
    statement: >
      `add_case_status_tree` MUST include a `EmbargoTeardownAuthorizationGate` Evaluator
      call-out node positioned after `AppendCaseStatusToCaseNode` and before
      `ThreatTerminationBranchNode`.
    rationale: >
      EmbargoTeardownAuthorizationGate of ADR-0046 — provides a hook to gate side-effect execution
      independently of the canonical write authorization.
    verification: Inspection of `vultron/core/behaviors/status/` confirms `EmbargoTeardownAuthorizationGate` is positioned
      after `AppendCaseStatusToCaseNode` and before `ThreatTerminationBranchNode` in `add_case_status_tree`.
    stories:
    - story_2022_023
    - story_2022_026
  - id: RSH-02-002
    priority: MUST
    kind: protocol
    statement: >
      The default backend for `EmbargoTeardownAuthorizationGate` MUST be
      `RequireCaseOwnerApproval` — an Evaluator that performs an
      Offer/Accept/Reject round-trip with the Case Owner before permitting
      teardown side-effects. A permissive backend (e.g., `AlwaysSucceed`) MAY
      be configured for trusted-participant or demo deployments but MUST be
      explicitly configured. See RSH-07.
    rationale: >
      Conservative default for a security-significant gate per ADR-0025
      (security-significant gate exception) and ADR-0076. The prior default
      of `AlwaysSucceed` was a prototype-stage convenience; production-ready
      posture requires explicit operator opt-in for permissive behavior.
      Belt-and-suspenders: even though `StatusAdoptionGate` (RSH-07-001) has
      already obtained Case Owner approval before the self-addressed
      `Add(CaseStatus)` arrives here, an operator constructing
      `add_case_status_tree` outside the self-addressed pattern would otherwise
      inherit a permissive teardown gate with no explicit opt-in.
    verification: Inspection of `vultron/core/behaviors/status/` confirms the default backend for
      `EmbargoTeardownAuthorizationGate` is `RequireCaseOwnerApproval`, not `AlwaysSucceed`.

    lint_suppress:
    - missing_story_reference
- id: RSH-03
  title: ThreatTerminationBranchNode
  description: >
    Node that triggers embargo teardown on any of the three threat-signal
    CaseStatus flags.
  specs:
  - id: RSH-03-001
    priority: MUST
    kind: protocol
    statement: >
      `ThreatTerminationBranchNode` MUST trigger embargo teardown when the
      canonical CaseStatus carries CS.P (public awareness), CS.X (exploit
      public), or CS.A (attacks observed).
    rationale: >
      All three flags signal a breach of the conditions that justify an active
      embargo. Covering only CS.P (as the prior `PublicDisclosureBranchNode`
      did) leaves exploit and attack signals without a teardown trigger.
    verification: Unit tests in `test/core/behaviors/status/test_add_case_status_bt.py` confirm `ThreatTerminationBranchNode`
      triggers embargo teardown when `CaseStatus` carries CS.P, CS.X, or CS.A.
    stories:
    - story_2022_018
    - story_2022_019
    - story_2022_081
  - id: RSH-03-002
    priority: MUST_NOT
    kind: protocol
    statement: >
      `ThreatTerminationBranchNode` MUST NOT gate teardown on sender role
      (e.g., CASE_OWNER). Authorization is the responsibility of StatusAdoptionGate;
      by the time this node runs, the canonical write is already authorized.
    rationale: >
      Duplicating a CASE_OWNER gate here would prevent teardown when the
      self-addressed `Add(CaseStatus)` arrives from the CaseActor itself
      (sender = CASE_MANAGER, not CASE_OWNER).
  - id: RSH-03-003
    priority: MUST
    kind: protocol
    statement: >
      `PublicDisclosureBranchNode` MUST be removed from
      `add_participant_status_tree` and replaced by `ThreatTerminationBranchNode`
      in `add_case_status_tree`.
    rationale: >
      The node belongs in the tree that writes canonical state. Its presence
      in `add_participant_status_tree` predates the two-seam design and must
      be migrated as part of implementing RSH-01 and RSH-02.
    verification: Inspection of `vultron/core/behaviors/status/` confirms `PublicDisclosureBranchNode` is absent from
      `add_participant_status_tree` and `ThreatTerminationBranchNode` is present in `add_case_status_tree`.

    stories:
    - story_2022_081
- id: RSH-04
  title: CaseStatus Emission Authority and Outbound Emit Invariant
  description: >
    Specifies which actors may emit Add(CaseStatus) directly and mandates that
    every CaseActor-side EM or PXA state mutation is followed by a canonical
    CaseStatus ledger write. CaseStatus is the only protocol channel for
    communicating EM and PXA state changes across actors; omitting the emit
    leaves all participant replicas stale until the next round-trip.
  specs:
  - id: RSH-04-001
    priority: MUST
    kind: protocol
    statement: >
      Only the CaseActor (acting as CASE_MANAGER) MUST emit `Add(CaseStatus)`
      directly. All other participants MUST embed a suggested `CaseStatus`
      inside `Add(ParticipantStatus)` rather than sending `Add(CaseStatus)`
      independently.
    rationale: >
      CaseStatus encodes shared EM and PXA state for the entire case. Only the
      CaseActor holds the CASE_MANAGER role and is the authoritative writer of
      canonical case state (ADR-0046, CLP-09). Allowing participants to emit
      Add(CaseStatus) directly would bypass the two-seam authorization model.
    verification: Inspection of `vultron/core/behaviors/status/` confirms only the CASE_MANAGER emits `Add(CaseStatus)`
      directly; unit tests in `test/core/behaviors/status/test_add_participant_status_bt.py` cover the non-owner path.
    stories:
    - story_2022_045
    - story_2022_046
  - id: RSH-04-002
    priority: MUST
    kind: protocol
    statement: >
      Every BT node or tree that mutates EM state (Propose, Accept, Reject,
      Terminate, and all cascade variants) MUST immediately follow the
      state-mutation step with a write of the updated `CaseStatus` to the
      canonical case ledger.
    rationale: >
      EM state changes are only observable to remote actors via `CaseStatus`
      entries in `Announce(CaseLedgerEntry)` messages. A mutation without a
      subsequent ledger write leaves participant replicas with a stale EM state
      (observed in fv/fcv/fvv CI scenarios — see CONCERN-1667).
    verification: '`test/architecture/test_vfd_rm_pxa_write_sites.py` confirms every BT node that mutates EM state is
      immediately followed by a `CaseStatus` ledger write, with no uncovered write sites allowed.'
    stories:
    - story_2022_014
    - story_2022_045
  - id: RSH-04-003
    priority: MUST
    kind: protocol
    statement: >
      Every BT node or tree that mutates PXA state (public awareness, exploit
      public, attacks observed) MUST immediately follow the state-mutation step
      with a write of the updated `CaseStatus` to the canonical case ledger.
    rationale: >
      PXA state is participant-agnostic and shared across the case. The
      rationale mirrors RSH-04-002: omitting the ledger write leaves replicas
      stale and breaks the Avoid Surprise principle.
    verification: '`test/architecture/test_vfd_rm_pxa_write_sites.py` confirms every BT node that mutates PXA state is
      immediately followed by a `CaseStatus` ledger write, with no uncovered write sites allowed.'
    stories:
    - story_2022_045
    - story_2022_081
  - id: RSH-04-004
    priority: MUST
    kind: protocol
    statement: >
      The CaseStatus ledger write described in RSH-04-002 and RSH-04-003 MUST
      be implemented as a shared BT node (`EmitCaseStatusUpdateNode`) that
      writes the new `CaseStatus` directly to `case.case_statuses` and commits
      a canonical `CaseLedgerEntry`, then emits `Announce(CaseLedgerEntry)` for
      participant replica sync. It MUST NOT route through the inbox
      authorization seam (`add_case_status_tree`) — the CaseActor is always the
      authority for its own outbound state changes.
    rationale: >
      The inbox gate (StatusAdoptionGate → EmbargoTeardownAuthorizationGate) exists for evaluating external
      participant suggestions. The CaseActor writing its own EM/PXA transition
      is not a suggestion — it is an authoritative state change. Routing through
      the inbox loopback (as `EmitAddCaseStatusToSelfNode` does) inverts
      causality: the ledger write should precede the announce, not be triggered
      by a self-addressed inbox message. DRY: one shared node, not N inline
      patches per BT tree factory.
    verification: Inspection of `vultron/core/behaviors/` confirms `EmitCaseStatusUpdateNode` writes directly to
      `case.case_statuses` and emits `Announce(CaseLedgerEntry)` without routing through `add_case_status_tree`.
    note: >
      Implementation tracked in ISSUE-2175 (implement EmitCaseStatusUpdateNode,
      size:M). A follow-on refactor of `EmitAddCaseStatusToSelfNode` is tracked
      in ISSUE-2176 (size:S, blocked-by ISSUE-2175).
      The `EmitAddCaseStatusToSelfNode` kludge (inbound path) is acknowledged
      as a parallel refactor target: once `EmitCaseStatusUpdateNode` is in
      place, `EmitAddCaseStatusToSelfNode` should be refactored to use direct
      ledger writes as well. That refactor is blocked-by the impl issue.

    stories:
    - story_2022_045
    - story_2022_088
- id: RSH-05
  title: Per-Dimension Partial Accept (liberal accept)
  description: >
    An inbound `Add(ParticipantStatus, CaseParticipant)` carries a snapshot of
    several independent state machines (`rm`, `vfd`, `em`, `pxa`, `consent`).
    An inbound `Add(CaseStatus, Case)` carries independent EM and PXA dimensions.
    These requirements govern adjudicating each dimension on its own rather
    than accepting or discarding the snapshot as a unit.
    Derived from ISSUE-2235, ISSUE-2256, and epic ISSUE-2229 (Postel's maxim / liberal
    accept).
  specs:
  - id: RSH-05-001
    priority: MUST
    kind: protocol
    statement: >
      A CaseActor receiving an `Add(ParticipantStatus, CaseParticipant)` MUST
      adjudicate each state dimension of the reported status independently. An
      unacceptable value in one dimension MUST NOT cause the values reported in
      the other dimensions to be discarded.
    rationale: >
      RM, VFD, EM, PXA and PEC are independent state machines. A value that is
      unacceptable in one dimension carries no information about the others, so
      discarding the whole snapshot destroys state the receiver has no grounds
      to refuse. Liberal accept (ISSUE-2229): accept everything acceptable.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm an unacceptable
      `rm` value does not discard accepted VFD and PXA values from the same status snapshot.
    note: >
      Implemented by `FilterParticipantStatusDimensionsNode` in
      `vultron/core/behaviors/status/nodes/dimension_filter.py`, wired as a
      precondition guard of `add_participant_status_tree`. It supersedes and
      replaced `CheckParticipantRMNotClosedNode` (now removed), whose
      all-or-nothing RM refusal was the defect reported in ISSUE-2235.
    stories:
    - story_2022_045
    - story_2022_088
  - id: RSH-05-002
    priority: MUST
    kind: protocol
    statement: >
      When a dimension is refused, the receiver MUST record the participant's
      current value for that dimension alongside the accepted values from the
      other dimensions, as a single `ParticipantStatus`.
    rationale: >
      The recorded status must remain a coherent snapshot of the receiver's
      view of the participant. Omitting the refused dimension would leave it
      undefined; recording the asserted value would adopt a claim the receiver
      just refused.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py`
      confirm the refused dimension is replaced by the current value in the recorded `ParticipantStatus`.
    stories:
    - story_2022_045
    - story_2022_088
  - id: RSH-05-003
    priority: MUST
    kind: protocol
    statement: >
      A refused dimension MUST NOT prevent the StatusAdoptionGate emit (RSH-01-003) from
      running. The self-addressed `Add(CaseStatus)` MUST still be emitted
      whenever any dimension of the update was accepted.
    rationale: >
      EmbargoTeardownAuthorizationGate owns embargo teardown (RSH-01-004). Aborting the StatusAdoptionGate sequence
      on a refused dimension silently skipped teardown — the concrete failure
      reported in ISSUE-2235.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py`
      confirm a refused dimension does not suppress the self-addressed `Add(CaseStatus)` StatusAdoptionGate emit.
    stories:
    - story_2022_023
    - story_2022_088
  - id: RSH-05-004
    priority: MUST
    kind: protocol
    statement: >
      The canonical `CaseLedgerEntry` committed for a partially accepted status
      MUST snapshot the accepted portion, not the raw assertion.
    rationale: >
      The canonical projection is replicated to every participant and bound
      into the hash chain. Snapshotting the raw assertion would fan out a value
      the receiver refused, and each replica would apply it. Recording the
      accepted portion is also what makes the refusal visible: the canonical
      entry differs from what the sender asserted.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm the canonical
      `CaseLedgerEntry` contains accepted dimension values, not the raw asserted values.
    note: >
      Implemented via the `ledger_payload_object_override` blackboard contract
      read by `CommitCaseLedgerEntryNode`. The guard runs before
      `GuardedCommit` per CLP-10-006, so the adjudication is available at
      commit time. The guard is read-only with respect to the DataLayer.

      The override is a *patch* — `{"object_id": ..., "fields": {...}}` keyed by
      wire alias — merged onto the snapshot's existing `object`, not a
      replacement object. See RSH-05-009 for why.
    stories:
    - story_2022_045
    - story_2022_088
  - id: RSH-05-005
    priority: MUST
    kind: protocol
    statement: >
      A status update in which every refused dimension leaves the resulting
      snapshot indistinguishable from the participant's current state MUST be
      refused in full: nothing is appended and no canonical ledger entry is
      committed.
    rationale: >
      Such an assertion carries no acceptable information. Appending it would
      grow the participant's status history and the hash chain without
      recording any state change.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm a wholly
      refused status update is not appended and commits no canonical ledger entry.
    stories:
    - story_2022_045
  - id: RSH-05-006
    priority: MUST
    kind: protocol
    statement: >
      `RM.CLOSED` MUST be treated as terminal for the `rm` dimension only. A
      participant at `RM.CLOSED` MUST still have accepted values in other
      dimensions recorded.
    rationale: >
      A vendor that has closed its report management workflow may still deploy
      a fix (VFD) or observe public disclosure (PXA). Freezing the whole
      snapshot at RM closure discards real protocol state.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm a participant
      at `RM.CLOSED` still has accepted VFD dimension values recorded.
    stories:
    - story_2022_088
    - story_2022_107
  - id: RSH-05-007
    priority: MUST
    kind: protocol
    statement: >
      A participant applying an `Announce(CaseLedgerEntry)` for an
      `add_participant_status_to_participant` event MUST NOT let it move a
      replica's RM state backwards on the RM progress scale. The local value
      MUST be carried forward for that dimension; all other dimensions are
      applied as the entry describes them.
    rationale: >
      Monotonic visibility (see notes/sync-ledger-replication.md). The Case
      Actor is authoritative for which transition happened, but a replayed,
      reordered, or divergent entry would otherwise un-see progress the replica
      has already observed. Lateral moves at the same rank
      (`VALID` <-> `INVALID`) are re-adjudication, not regression, and are
      applied unchanged.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm applying an
      `Announce(CaseLedgerEntry)` never moves a replica's RM state backward on the RM progress scale.
    stories:
    - story_2022_045
    - story_2022_088
  - id: RSH-05-008
    priority: SHOULD
    kind: protocol
    statement: >
      The `em` dimension SHOULD NOT be adjudicated at StatusAdoptionGate; embargo state
      belongs to EmbargoTeardownAuthorizationGate (`add_case_status_tree`).
    rationale: >
      EM is per-case rather than per-participant and its authorization gate is
      the EmbargoTeardownAuthorizationGate (RSH-02-001). Adjudicating it in the StatusAdoptionGate guard
      would duplicate — and could contradict — EmbargoTeardownAuthorizationGate's decision.
    note: >
      EmbargoTeardownAuthorizationGate EM adjudication is tracked in ISSUE-2256.
  - id: RSH-05-009
    priority: MUST
    kind: protocol
    statement: >
      Adjudicating a received status MUST NOT change the shape of the
      `payload_snapshot.object` it records: the entry MUST carry the same wire
      fields an unadjudicated entry for the same activity would carry, with only
      the adjudicated dimension values rewritten.
    rationale: >
      Every replica and the case-ledger invariant harness read the snapshot's
      flat wire aliases (`rmState`, `vfdState`, `emConsentState`, `cvdRole`) and
      its nested `caseStatus` (CLP-07-001, CM-18-006). A whole-object
      replacement built in `vultron.core` would emit core dimension objects
      (`rm: {state}`) and silently drop every field the guard never adjudicated,
      because core MUST NOT import `vultron.wire` to convert (ADR-0009,
      ADR-0017). Publishing a field patch instead makes shape preservation
      structural rather than a property the guard has to remember to maintain.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm adjudicated
      ledger entries retain the same wire field shape as unadjudicated entries, with only dimension values patched.
    note: >
      The merge is one level deep, so a patched `caseStatus.pxaState` keeps the
      nested object's own `id` and remaining fields. A patched alias also drops
      any stale snake_case twin of the same field, so a consumer that prefers
      the snake_case spelling cannot read the value the receiver refused.
    stories:
    - story_2022_045
    - story_2022_106
  - id: RSH-05-010
    priority: MUST
    kind: protocol
    statement: >
      A producer of `ledger_payload_object_override` MUST write `None` to the
      key unconditionally at the start of every tick — before any early return
      — so that a stale value from a previous execution cannot bleed into the
      current one.
    rationale: >
      The py_trees blackboard is process-global. `BTBridge.execute_with_setup`
      does not reset application-level keys between runs, so a producer that
      only writes on its active path leaves the key at its previous value on
      every no-op tick. `CommitCaseLedgerEntryNode` would then apply that stale
      patch to a different payload snapshot. BT-17-003.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm a stale
      `ledger_payload_object_override` from a prior tick is cleared before the next tick executes.
    note: >
      Pattern: call the unconditional clear (e.g. `self._publish((), None)`) as
      the first statement in `update()`, before any conditional branch. Once
      the producer node is migrated to the typed-Ports base class (ISSUE-1808),
      the base class SHOULD auto-clear declared output ports in `initialise()`,
      making this obligation structural.
    lint_suppress:
    - missing_story_reference
  - id: RSH-05-011
    priority: MUST
    kind: protocol
    statement: >
      A producer of `ledger_payload_object_override` MUST include a
      `producer_type` field in the override dict. The required shape is
      `{"object_id": <id>, "producer_type": <str>, "fields": {<wire alias>: <value>}}`.
    rationale: >
      Multiple producers are anticipated (ISSUE-2256 adds EM adjudication in
      `EmbargoTeardownAuthorizationGate` as a second producer). Naming the
      source node in the dict enables targeted audit logging and per-producer
      diagnostics without out-of-band context. RSH-05-014 uses `producer_type`
      to emit a warning on unrecognized producers without failing the commit.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm every
      `ledger_payload_object_override` dict includes a `producer_type` field identifying the source node.
    stories:
    - story_2022_074
  - id: RSH-05-012
    priority: MUST
    kind: protocol
    statement: >
      The `fields` value of `ledger_payload_object_override` MUST contain only
      wire alias keys recognized by `CommitCaseLedgerEntryNode`. Publishing an
      unrecognized key is a protocol error.
    rationale: >
      The consumer hard-fails on any unrecognized alias (RSH-05-013). An unknown
      alias applied to the canonical snapshot would abort the commit, blocking
      the receive-side BT. Declaring this as a producer obligation means callers
      can validate at construction time rather than catching a runtime failure.
    verification: Inspection of `vultron/core/behaviors/case/nodes/lifecycle.py` confirms `CommitCaseLedgerEntryNode`
      validates `fields` keys against the `_SNAKE_TWINS` dict and hard-fails on unrecognized wire aliases.
    note: >
      The recognized aliases are those defined in `_SNAKE_TWINS` in
      `vultron/core/behaviors/case/nodes/lifecycle.py` — the module-level dict
      that maps each camelCase wire alias to its snake_case twin for
      `CommitCaseLedgerEntryNode`.
    stories:
    - story_2022_045
  - id: RSH-05-013
    priority: MUST
    kind: protocol
    statement: >
      `CommitCaseLedgerEntryNode` MUST raise a hard failure — not a warning —
      if the `fields` dict of `ledger_payload_object_override` contains a key
      that is not a recognized wire alias for the snapshot object type.
    rationale: >
      An unrecognized alias applied to the canonical snapshot would silently add
      unexpected content to the hash-chained ledger entry, which every replica
      and the invariant harness would then apply. Data integrity requires a hard
      stop; the correct response is to fix the producer (RSH-05-012), not to log
      and continue.
    verification: Unit tests in `test/core/behaviors/case/nodes/test_lifecycle.py` confirm `CommitCaseLedgerEntryNode` raises
      a hard failure (not a warning) when `fields` contains a key not present in `_SNAKE_TWINS`.
    stories:
    - story_2022_045
  - id: RSH-05-014
    priority: SHOULD
    kind: protocol
    statement: >
      `CommitCaseLedgerEntryNode` SHOULD emit a WARNING when
      `ledger_payload_object_override` carries an unrecognized `producer_type`
      value, and MUST NOT fail the commit on that basis alone.
    rationale: >
      An unrecognized `producer_type` may indicate a newer node type operating
      against an older consumer. Logging preserves auditability without
      blocking a structurally valid override. Field-name validation (RSH-05-013)
      is the data-integrity guard; `producer_type` is an audit hint only.
  - id: RSH-05-015
    priority: MUST
    kind: protocol
    statement: >
      A CaseActor receiving an `Add(CaseStatus, Case)` MUST adjudicate the EM
      and PXA dimensions of the reported case status independently. An
      unacceptable value in one dimension MUST NOT cause the value reported in
      the other dimension to be discarded.
    rationale: >
      EM and PXA are independent state machines within CaseStatus (parallel to
      RM, VFD, EM, PXA in ParticipantStatus). A value that is unacceptable in
      EM carries no information about PXA and vice versa. Discarding the whole
      snapshot destroys state the receiver has no grounds to refuse. Liberal
      accept (ISSUE-2229): accept everything acceptable.
    verification: >
      Unit tests for `add_case_status_tree` confirm that an unacceptable EM
      value does not discard an accepted PXA value from the same CaseStatus
      snapshot, and vice versa.
    note: >
      Implemented by the three-node sequence `FilterCsEmDimensionNode`,
      `FilterCsPxaDimensionNode`, and `FinalizeCsFilterNode` in
      `vultron/core/behaviors/status/nodes/cs_dimension_filter.py`, wired as
      precondition guards of `add_case_status_tree`. See ISSUE-2256.
    lint_suppress:
    - missing_story_reference
  - id: RSH-05-016
    priority: MUST
    kind: protocol
    statement: >
      When an EM or PXA dimension of a received `CaseStatus` is refused, the
      receiver MUST record the case's current value for that dimension alongside
      the accepted value from the other dimension, as a single `CaseStatus`.
    rationale: >
      The recorded status must remain a coherent snapshot of the receiver's
      view of the case. Omitting the refused dimension would leave it undefined;
      recording the asserted value would adopt a claim the receiver just refused.
      This is the CaseStatus parallel to RSH-05-002 for ParticipantStatus.
    verification: >
      Unit tests confirm that when the EM dimension is refused, the resulting
      recorded `CaseStatus` carries the case's current EM state, not the
      asserted EM state.
    note: >
      Implemented by `FilterCsEmDimensionNode` carrying forward `current_em`
      and `FilterCsPxaDimensionNode` carrying forward `current_pxa` in
      `vultron/core/behaviors/status/nodes/cs_dimension_filter.py`.
    lint_suppress:
    - missing_story_reference
  - id: RSH-05-017
    priority: MUST
    kind: protocol
    statement: >
      A received `CaseStatus` in which every refused dimension leaves the
      resulting snapshot indistinguishable from the case's current state MUST
      be refused in full: nothing is appended and no canonical ledger entry is
      committed.
    rationale: >
      Such an assertion carries no acceptable information. Appending it would
      grow the case's status history and the hash chain without recording any
      state change. This is the CaseStatus parallel to RSH-05-005 for
      ParticipantStatus.
    verification: >
      Unit tests confirm that a `CaseStatus` where both EM and PXA are refused
      and the result is indistinguishable from current state is rejected in full
      with no ledger entry committed.
    note: >
      Implemented by `FinalizeCsFilterNode.update()` returning `Status.FAILURE`
      when `(filtered.em.state, filtered.pxa.state) == (current.em.state,
      current.pxa.state)`.
    lint_suppress:
    - missing_story_reference
  - id: RSH-05-018
    priority: MUST
    kind: protocol
    statement: >
      When adjudicating the EM dimension of a received `Add(CaseStatus)`, the
      receiver MUST accept the asserted EM state if and only if it is identical
      to the current EM state or it is a valid EM state-machine transition from
      the current EM state, as determined by `is_valid_em_transition()`. Any
      other asserted EM value MUST be refused and the current EM value carried
      forward (RSH-05-016).
    rationale: >
      EM follows a directed state machine
      (NO_EMBARGO → PROPOSED ↔ ACTIVE ↔ REVISE → EXITED). Out-of-order or
      backward EM assertions do not correspond to legal protocol events; applying
      them would corrupt the canonical EM state shared by all participants.
      Using `is_valid_em_transition()` as the acceptance predicate ensures only
      structurally valid EM transitions are applied.
    verification: >
      Unit tests in `test/core/behaviors/status/test_add_case_status_bt.py`
      confirm that `FilterCsEmDimensionNode` accepts EM states that satisfy
      `is_valid_em_transition()` or are identical to the current EM state, and
      refuses all other asserted EM values by carrying the current value forward.
    note: >
      Implemented by `FilterCsEmDimensionNode.update()` in
      `vultron/core/behaviors/status/nodes/cs_dimension_filter.py`. The predicate
      is applied as `asserted_em != current_em and not is_valid_em_transition(current_em, asserted_em)`;
      an identity assertion (`asserted == current`) is always accepted without
      invoking `is_valid_em_transition()`.
    lint_suppress:
    - missing_story_reference
  - id: RSH-05-019
    priority: MUST
    kind: protocol
    statement: >
      When adjudicating the PXA dimension of a received `Add(CaseStatus)`, the
      receiver MUST accept the asserted PXA state if and only if it is identical
      to the current PXA state or it is a monotone forward move from the current
      PXA state, as determined by `is_monotonic_pxa_forward()`. Any other
      asserted PXA value MUST be refused and the current PXA value carried
      forward (RSH-05-016).
    rationale: >
      PXA state is monotone: bits only advance from unaware to aware (p→P,
      x→X, a→A) and never reverse. The received-side filter uses the weaker
      `is_monotonic_pxa_forward()` check — not the strict single-step adjacency
      `is_valid_pxa_transition()` that applies to local write nodes
      (CSB-16-002) — because a remote peer may have observed multiple PXA
      events between messages and report a combined advance that skips
      intermediate steps. Applying the strict check would refuse a valid
      multi-step advance from a peer that simply missed delivering earlier
      messages.
    verification: >
      Unit tests in `test/core/behaviors/status/test_add_case_status_bt.py`
      confirm that `FilterCsPxaDimensionNode` accepts PXA states that satisfy
      `is_monotonic_pxa_forward()` or are identical to the current PXA state,
      and refuses non-monotone-forward assertions by carrying the current value
      forward.
    note: >
      Implemented by `FilterCsPxaDimensionNode.update()` in
      `vultron/core/behaviors/status/nodes/cs_dimension_filter.py`. The predicate
      is `asserted_pxa != current_pxa and not is_monotonic_pxa_forward(current_pxa, asserted_pxa)`;
      CSB-16-002 strict single-step adjacency applies only to local write nodes,
      not to the received-side filter.
    lint_suppress:
    - missing_story_reference
  - id: RSH-05-020
    priority: MUST
    kind: protocol
    statement: >
      After adjudicating each dimension of a received
      `Add(ParticipantStatus, CaseParticipant)` independently, the receiver MUST
      evaluate the cross-machine entailments (RM↔VF and RM↔D per CSB-18-001,
      VF↔D per CSB-17-001) against the *effective* — post-adjudication — state,
      and MUST refuse each dimension those entailments disqualify, carrying the
      participant's current value for it forward (RSH-05-002). The receiver MUST
      evaluate the same entailment set the emit path evaluates.
    rationale: >
      Per-dimension adjudication cannot see a claim that is impossible only in
      combination: a fix that is ready or deployed entails a report the
      participant has already accepted, and a deployed fix entails a ready one.
      Before this requirement the receive path composed only VF↔D, so an
      assertion the actor would have refused to *emit* was accepted, recorded,
      hash-chained and replicated to every participant when it arrived from a
      peer instead (ISSUE-2906). Evaluating against the effective state — not
      the raw assertion — is what stops a refused `rm` from licensing the `vf`
      the sender paired with it. Requiring one shared evaluator rather than two
      equivalent ones is what keeps the emit and receive paths from silently
      diverging again.
      This is narrower than refusing a multi-step VF or D advance, which remains
      legal on the received path (CSB-16-001): the entailments refuse claims
      that no sequence of events could produce, not claims that skipped an
      intermediate report.
    verification: >
      Unit tests in
      `test/core/behaviors/status/test_partial_accept_participant_status.py`
      confirm that `vf=VF` and `d=D` asserted alongside a pre-acceptance
      effective `rm` are each refused with the current value carried forward,
      that the same values are accepted once `rm` has reached acceptance, that
      the entailment is evaluated against a carried-forward `rm` rather than a
      refused asserted one, that the refusal stays per-dimension, and that a
      dimension already refused upstream is not named twice.
    note: >
      Implemented by `_adjudicate_cross_machine_entailments()` in
      `vultron/core/behaviors/status/nodes/_adjudication.py`. The three rules
      are composed by `cross_machine_violations()` in
      `vultron/core/states/cross_machine_invariants.py`, which is also what
      `ValidateTriggerTransitionsNode._validate_entailments` calls on the emit
      path — the shared evaluator this requirement mandates. A single pass
      suffices: the only refusal these rules add is of a set F or D bit, and
      RM↔D already disqualifies `d` in every state where a newly refused `vf`
      would have made VF↔D fire.

      A `None` dimension is absent, not at its initial state (ADR-0075), so no
      entailment applies through it — a non-VENDOR participant asserting `d=D`
      is unconstrained by VF↔D. The replica-apply path
      (`ApplyParticipantStatusFromLedgerNode`) is out of scope: it applies
      CaseActor-authored canonical entries the CaseActor already adjudicated,
      and is governed by RSH-05-007.
    relationships:
    - rel_type: refines
      spec_id: RSH-05-001
    lint_suppress:
    - missing_story_reference

- id: RSH-06
  title: RM Anomaly Notification Policy (non-adjacent jumps and backward regressions)
  description: >
    When the receiver detects an RM transition anomaly — either a non-adjacent
    forward jump (sender skipped intermediate states) or a backward regression
    (sender reports a state earlier on the RM progress scale than the receiver
    has already observed) — it must act correctly *and* non-silently.  Because
    CVD is inherently asynchronous, anomalies are detected at receipt time
    (t₁ > t₀ when the event occurred), and silence at that point breaks
    observability for both parties.
    Derived from ISSUE-2258 and ADR-0067.
  specs:
  - id: RSH-06-001
    priority: MUST
    kind: protocol
    statement: >
      A CaseActor receiving an `Add(ParticipantStatus, CaseParticipant)` that
      carries a non-adjacent forward RM jump (i.e. `is_monotonic_rm_forward` is
      True but `is_valid_rm_transition` is False) MUST accept the reported `rm`
      state.
    rationale: >
      The sender is authoritative about its own RM progress. Refusing a
      non-adjacent forward jump would leave the receiver's replica permanently
      wrong, because the sender will not resend intermediate transitions it
      never reported. Liberal accept (ISSUE-2229): accept everything acceptable.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py`
      confirm a non-adjacent forward RM jump is accepted (not refused) without any dimension being discarded.
    note: >
      Implemented by `FilterParticipantStatusDimensionsNode._rm_is_acceptable()`
      in the production path and by `ValidateRMTransitionNode` in the standalone
      path. Both paths MUST accept with the same policy.
    stories:
    - story_2022_074
    - story_2022_088
  - id: RSH-06-002
    priority: MUST
    kind: protocol
    statement: >
      A CaseActor receiving an `Add(ParticipantStatus, CaseParticipant)` that
      carries a backward RM regression (i.e. the reported `rm` state is earlier
      on the RM progress scale than the receiver's current value) MUST refuse
      the `rm` dimension and carry the current value forward (RSH-05-002).
    rationale: >
      RM is monotonic: a sender cannot un-validate, un-accept, or un-close a
      report. A backward assertion indicates either a protocol error or a
      divergent replica state; neither should update the receiver's record.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm a backward
      RM regression refuses only the `rm` dimension while leaving other dimensions unaffected.
    note: >
      The refusal is per-dimension only (RSH-05-001). Other dimensions of the
      same status snapshot are still adjudicated and accepted if valid.
    stories:
    - story_2022_074
    - story_2022_088
  - id: RSH-06-003
    priority: MUST
    kind: protocol
    statement: >
      Neither a non-adjacent forward jump acceptance nor a backward regression
      refusal MUST be silent. In both cases the receiver MUST log a WARNING
      that names the sender, the observed `rm` state before and after, and
      identifies the anomaly type (gap or regression).
    rationale: >
      Because CVD is inherently asynchronous, protocol anomalies are detected
      at receipt time (t₁ > t₀ when the event occurred). Silent handling makes
      diagnosis impossible for both parties and breaks protocol observability.
    verification: Unit tests in `test/core/behaviors/status/test_partial_accept_participant_status.py` confirm both anomaly
      types emit a WARNING log naming the sender, the before/after `rm` states, and the anomaly type.
    stories:
    - story_2022_074
    - story_2022_077
  - id: RSH-06-004
    priority: SHOULD
    kind: protocol
    statement: >
      On the production `add_participant_status_tree` path (where a case context
      is available), the receiver SHOULD emit `Add(Note, VulnerabilityCase)`
      when an RM anomaly is detected, requesting the sender to clarify the
      path it took between the two observed states.
    rationale: >
      The original BT protocol design included an `RE` (Report Management Error)
      message type for exactly this scenario. Until `RE` is formalised in
      `MessageSemantics` (ADR-0049), `Add(Note, VulnerabilityCase)` is the
      pragmatic substitute. The note makes the anomaly visible at the protocol
      level, not just in local logs.
    note: >
      Implemented by `EmitRMGapNoteNode` in `effect_nodes` of
      `add_participant_status_tree`. The standalone `append_participant_status_tree`
      path (test-only, no production callers) has no case context; it MUST log
      (RSH-06-003) but MUST NOT attempt to emit a note.
  - id: RSH-06-005
    priority: MUST
    kind: protocol
    statement: >
      The `Add(Note, VulnerabilityCase)` emitted under RSH-06-004 MUST include:
      the sending actor's identifier, the `rm` state before the anomaly, the
      `rm` state after the anomaly, and a human-readable description identifying
      whether the anomaly was a non-adjacent forward jump or a backward
      regression.
    rationale: >
      Without these fields the note cannot be acted on by a human or an
      automated remediation process. The request for clarification is only
      meaningful if the recipient can identify what they are being asked to
      clarify.
    verification: Inspection of `vultron/core/behaviors/status/` confirms `EmitRMGapNoteNode` constructs the note payload
      with the sender's ID, before/after `rm` states, and an anomaly-type description.
    stories:
    - story_2022_039
    - story_2022_074
    - story_2022_077

- id: RSH-07
  title: Conservative Default Authorization Policy for Status Gates
  description: >
    Both StatusAdoptionGate and EmbargoTeardownAuthorizationGate MUST default to
    requiring explicit Case Owner authorization before allowing PXA assertion
    adoption or embargo teardown side-effects. Permissive backends are valid but
    MUST be explicitly configured.
    Derived from CONCERN-2092 and ADR-0076; the mechanism is amended by ADR-0080
    (CONCERN-2812, CONCERN-2809) — see RSH-07-004.
  specs:
  - id: RSH-07-001
    priority: MUST
    kind: protocol
    statement: >
      `StatusAdoptionGate` MUST default to requiring explicit Case Owner
      authorization before a non-owner participant's PXA assertion is adopted as
      canonical case state.
    rationale: >
      A permissive default (e.g., `AlwaysSucceed`) means any admitted
      participant — including a hostile or malfunctioning Observer admitted
      as a sentinel — can force PXA adoption and thereby trigger embargo
      teardown without any Case Owner confirmation. The default posture must
      be conservative; permissive behavior requires explicit opt-in. See ADR-0076.
      Amended by ADR-0080: the conservative default stands, but the mechanism is
      no longer an Evaluator that "waits for" a reply — see RSH-07-004.
    verification: >
      With the default bundle and a non-owner sender, no `Add(CaseStatus)` is
      emitted until Case Owner authorization is recorded in the case ledger.
    adr:
    - ADR-0076
    - ADR-0080
    lint_suppress:
    - missing_story_reference
  - id: RSH-07-002
    priority: MUST
    kind: protocol
    statement: >
      `EmbargoTeardownAuthorizationGate` MUST default to requiring explicit Case
      Owner authorization before embargo teardown side-effects execute. See also
      RSH-02-002.
    rationale: >
      Belt-and-suspenders: both gates default conservatively. See RSH-02-002
      rationale and ADR-0076 for full justification. Amended by ADR-0080 for the
      mechanism only; the conservative default is unchanged.
    verification: >
      With the default bundle, `ThreatTerminationBranchNode` does not execute until
      Case Owner authorization is recorded in the case ledger.
    adr:
    - ADR-0076
    - ADR-0080
    lint_suppress:
    - missing_story_reference
  - id: RSH-07-004
    priority: MUST
    kind: protocol
    statement: >
      Each status authorization gate MUST be composed as a conversation-state
      routing subtree per ASK-02-001, and MUST NOT be composed as a single-tick
      Evaluator call-out that answers the authorization question inline.
    rationale: >
      At the moment authorization is first needed, no answer exists, so an
      Evaluator asked "is this approved?" can only ever answer no. This is why
      `RequireCaseOwnerApprovalNode` returns `FAILURE` unconditionally and why the
      ADR-0046/ADR-0076 authorization model was unreachable by any pathway
      (CONCERN-2812). The gate instead routes on whether authorization has been
      recorded, refused, requested-and-outstanding, or never requested, emitting
      the request and terminating in the last case.
    verification: >
      Inspection confirms each gate is a routing subtree whose branches cover
      authorized, refused, outstanding, and not-yet-asked, and that no
      `CallOutBackendFactory` returns an unconditional `FAILURE` node as the
      conservative default.
    adr:
    - ADR-0080
    lint_suppress:
    - missing_story_reference
  - id: RSH-07-005
    priority: MUST_NOT
    kind: protocol
    statement: >
      A status authorization gate MUST NOT be satisfied by relaxing its default to a
      permissive backend in order to make a blocked path proceed.
    rationale: >
      `STATUS_AUTHORIZATION_PERMISSIVE` exists for trusted-participant and demo
      deployments (RSH-07-003). Using it to work around an unreachable gate
      converts a protocol guarantee into a configuration posture, which is the
      defect CONCERN-2092 filed in the first place.
    verification: >
      The production default bundle is the conservative one, and permissive
      injection sites are enumerated and documented.
    adr:
    - ADR-0076
    - ADR-0080
    lint_suppress:
    - missing_story_reference
  - id: RSH-07-003
    priority: MAY
    kind: protocol
    statement: >
      An implementation MAY configure a permissive backend (e.g.,
      `AlwaysSucceed`) for `CaseOwnerApprovesStatusUpdate` or
      `EmbargoTeardownAuthorizationGate` in deployments where all admitted
      participants are trusted and the operational overhead of Case Owner
      approval is unacceptable. Any such configuration MUST be explicit and
      documented.
    rationale: >
      Demo and trusted-participant deployments legitimately need automated
      sentinel behavior without ceremony. The conservative posture applies by
      default; permissive is an explicit operator choice with documented
      consequences. Other valid alternative backends include role-differentiated
      policy, probabilistic approval, and any `CallOutBackendFactory`-conformant
      implementation. See ADR-0076.
    lint_suppress:
    - missing_story_reference
