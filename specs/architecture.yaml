id: ARCH
title: Architecture
description: 'Defines the architectural constraints for the Vultron codebase. The system follows hexagonal architecture (Ports
  and Adapters): the core domain is isolated from all external systems, which interact through defined ports via thin adapters.
  Covers layer separation rules, the shared-base object hierarchy, domain model richness, and the fail-fast validation boundary.'
version: 1.0.0
scope:
- prototype
- production
tags:
- code-style
groups:
- id: ARCH-01
  title: Layer Separation
  specs:
  - id: ARCH-01-001
    priority: MUST_NOT
    kind: project
    statement: The `core/` package (or equivalent domain layer) MUST NOT import from `wire/`, `adapters/`, or any external
      framework
    rationale: Keeps domain logic replaceable without touching the wire or transport layer
    relationships:
    - rel_type: derives_from
      spec_id: CS-05-001
  - id: ARCH-01-002
    priority: MUST
    kind: architecture
    statement: Core functions MUST accept and return domain types only
  - id: ARCH-01-003
    priority: MUST_NOT
    kind: architecture
    statement: The `wire/` layer (AS2 parser, semantic extractor) MUST NOT contain handler logic, case management, or journal
      management
    rationale: Wire format concerns are structurally distinct from domain concerns; mixing them prevents future wire format
      substitution
  - id: ARCH-01-004
    priority: MUST
    kind: project
    statement: All ARCH-01-001 violations in `vultron/core/` MUST be remediated via dedicated driven ports. Each file with
      a core→wire import MUST be given a narrow driven port (following the `SyncActivityPort` or `TriggerActivityPort` pattern)
      or folded under an expanded shared port.
    rationale: Leaving core→wire import violations unfixed undermines the hexagonal boundary and prevents clean unit testing
      of core logic with mock adapters. See tracking issues for the current set of known violations.
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
      note: ARCH-01-001 is the general constraint; ARCH-01-004 requires that all violations be systematically remediated via
        driven ports.
  - id: ARCH-01-005
    priority: MUST_NOT
    kind: project
    statement: Production adapters (HTTP routes, CLI commands, MCP server, background workers) MUST NOT import from `vultron/demo/`.
      Demo-layer modules are not part of the production dependency graph and MUST be treated as test-only code for runtime
      purposes.
    rationale: The demo layer contains simplified, non-production implementations of actors and data handling. Importing it
      in production adapters silently pulls in demo behaviour and dummy data, and couples production code to a layer with
      no stability guarantees.
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
  - id: ARCH-01-006
    priority: MUST_NOT
    kind: project
    statement: Demo-layer modules (`vultron/demo/**`) MUST NOT import from the legacy simulator package (`vultron/bt/**`).
      The sole permitted exception is the unified demo CLI aggregator (`vultron/demo/cli.py`, mandated by DC-01-001), which
      surfaces the standalone `vultron/bt/`-based behaviour-tree demos (pacman, robot, cvd) as a sub-group. Demo *logic* modules
      (`vultron/demo/scenario/`, `vultron/demo/exchange/`, `vultron/demo/helpers/`, `vultron/demo/fuzzer/`) MUST remain free
      of any `vultron/bt/` import.
    rationale: '`vultron/demo/` demonstrates the production protocol; `vultron/bt/` is the frozen legacy custom-engine simulator
      slated for retirement (see `notes/codebase-structure.md` "Module Boundary"). Coupling demo logic to the legacy simulator
      undermines the decoupling `vultron/demo/fuzzer/` was created to achieve. `cli.py` is exempt as a thin aggregator entry
      point — the single documented bridge to the bt-tree demos. Derives from ADR-0009 (hexagonal).'
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
    adr:
    - ADR-0009
- id: ARCH-02
  title: SemanticIntent Enum
  specs:
  - id: ARCH-02-001
    priority: MUST
    kind: protocol
    statement: The `MessageSemantics` enum (`SemanticIntent`) MUST be defined in the domain layer, not in the wire layer
    verification: Inspection of `vultron/core/` confirms `MessageSemantics` (or `SemanticIntent`) is defined there,
      and no definition of this enum exists under `vultron/wire/`.
    lint_suppress:
    - missing_story_reference
- id: ARCH-03
  title: Semantic Extractor
  specs:
  - id: ARCH-03-001
    priority: MUST
    kind: protocol
    statement: 'AS2 vocabulary MUST be mapped to domain concepts in exactly one location: the semantic extractor'
    rationale: Isolates the single seam where wire format changes are absorbed
    verification: Inspection of `vultron/wire/` confirms that AS2-to-domain vocabulary mapping logic appears only in
      the semantic extractor module and in no other location.
    lint_suppress:
    - missing_story_reference
- id: ARCH-04
  title: Driven Adapter Injection
  specs:
  - id: ARCH-04-001
    priority: MUST
    kind: architecture
    statement: Driven adapters (persistence, delivery queue, DNS resolver, HTTP delivery) MUST be injected into core services
      via port interfaces
    rationale: Enables testing core logic with in-memory ports and swapping production backends without touching domain code
  - id: ARCH-04-002
    priority: MUST
    kind: project
    statement: >-
      `SyncActivityPort` MUST be defined as a `typing.Protocol` in
      `vultron/core/ports/sync_activity.py` with two fire-and-forget methods:
      `send_reject_log_entry(entry, tail_hash, actor_id, to)` and
      `send_announce_log_entry(entry, actor_id, to)`.
    rationale: 'The incremental fix for ARCH-01-001 violations in `received/sync.py` and `triggers/sync.py`. The "baton-pass"
      pattern: core hands domain objects to the port; the adapter handles wire conversion unidirectionally.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-04-001
      note: SyncActivityPort is the specific driven port for sync outbound activities
    - rel_type: implements
      spec_id: ARCH-01-001
      note: Eliminates wire imports from core sync use cases
  - id: ARCH-04-003
    priority: MUST
    kind: project
    statement: >-
      The concrete adapter (`SyncActivityAdapter`) MUST be implemented in
      `vultron/adapters/driven/sync_activity_adapter.py` and own the full
      domain → wire → persist → outbox pipeline.
    rationale: >-
      Concentrating the full domain → wire → persist → outbox pipeline in the
      adapter keeps wire concerns out of core and satisfies the baton-pass pattern.
    relationships:
    - rel_type: refines
      spec_id: ARCH-04-002
  - id: ARCH-04-004
    priority: MUST
    kind: project
    statement: Core use cases and BT nodes MUST call only the `SyncActivityPort` methods.
    rationale: >-
      Calling only port methods enforces the hexagonal boundary and enables
      testing core logic with mock adapters.
    relationships:
    - rel_type: refines
      spec_id: ARCH-04-002
  - id: ARCH-04-005
    priority: MUST_NOT
    kind: project
    statement: >-
      Core use cases and BT nodes MUST NOT import wire types (`CaseLedgerEntry`,
      `WireCaseLedgerEntry`) or wire factory functions (`announce_log_entry_activity`,
      `reject_log_entry_activity`).
    rationale: >-
      Wire type imports in core violate the hexagonal boundary; all wire concerns
      are handled exclusively by the SyncActivityAdapter.
    relationships:
    - rel_type: refines
      spec_id: ARCH-04-002
- id: ARCH-05
  title: Connector Plugins
  specs:
  - id: ARCH-05-001
    priority: MUST_NOT
    kind: project
    statement: Connector plugins (tracker integrations) MUST be discovered via Python entry points (`importlib.metadata`);
      the core MUST NOT import them directly
  - id: ARCH-05-002
    priority: MUST
    kind: project
    statement: Connector plugins MUST translate only — no case handling logic, authorization, or journal management belongs
      in a connector
- id: ARCH-06
  title: Wire Layer Replaceability
  specs:
  - id: ARCH-06-001
    priority: SHOULD
    kind: architecture
    statement: The wire layer (`wire/as2/`) SHOULD be replaceable as a unit without touching the core or adapter layers
- id: ARCH-07
  title: Handler Isolation
  specs:
  - id: ARCH-07-001
    priority: MUST_NOT
    kind: architecture
    statement: Handler functions MUST NOT re-invoke semantic extraction
- id: ARCH-08
  title: Driving Adapter Boundary
  specs:
  - id: ARCH-08-001
    priority: MUST
    kind: architecture
    statement: Driving adapters (HTTP inbox, CLI, MCP server) MUST invoke the wire pipeline before calling into the core
    rationale: Any driving adapter that needs to ingest AS2 can reuse the wire pipeline; there is no duplication
  - id: ARCH-08-002
    priority: MUST
    kind: architecture
    statement: A driving adapter MUST promote an incoming wire object to its most-specific domain type at the adapter boundary,
      before passing the object into the core. The core MUST NOT receive a bare `BaseObject` or generic `BaseModel` when a
      more specific type is determinable from the wire payload.
    rationale: Promoting at the boundary ("validate at edge") ensures that core handlers receive fully typed objects and never
      need to downcast or call `isinstance()` to recover type information that was present on the wire. Deferring promotion
      into the core violates the hexagonal principle that adapters adapt, cores compute.
    relationships:
    - rel_type: refines
      spec_id: ARCH-08-001
    - rel_type: implements
      spec_id: CS-10-001
- id: ARCH-12
  title: Shared-Base Object Hierarchy
  rationale: 'Per-class from_core()/to_core() methods on wire types (the original ARCH-12 design) were a workaround for
    independent parallel hierarchies. A shared-base approach eliminates the need for per-type translation stubs: both core
    and wire branches inherit from the same lenient root and field names align, so translation becomes a declarative
    operation over the core↔wire pairing registry rather than hand-written code on each wire class. ARCH-12-005 places that
    operation on the adapter side and forbids the per-class methods outright. See ADR-0017 Option D, ADR-0082, and concern
    #796.'
  specs:
  - id: ARCH-12-001
    priority: MUST
    kind: project
    statement: '`as_Base` MUST inherit from `VultronBase`; `as_Object` MUST inherit from `VultronObject`. `VultronBase` and
      `VultronObject` are the shared root for both the core and wire object hierarchies, and MUST live in a branch-neutral
      module that is neither core-branch nor wire-branch — not in `vultron/core/models/`.'
    rationale: A shared root ensures field names and semantics align across both branches, enabling model_validate() round-trips
      without per-type translation stubs. Hosting that shared root inside `vultron/core/models/` made every wire class a
      definitional ARCH-22 violation — the wire branch is *required* to inherit it, so the import can never be removed while
      it lives there. A branch-neutral home follows the ADR-0031 precedent that introduced `vultron/enums/` as a bottom-of-stack
      layer for cross-cutting definitions.
    adr:
    - ADR-0031
    - ADR-0082
    verification: '`issubclass(as_Base, VultronBase)` and `issubclass(as_Object, VultronObject)` are both True.'
  - id: ARCH-12-002
    priority: MUST
    kind: project
    statement: The shared base (`VultronBase` / `VultronObject`) MUST define all shared fields with the most lenient types
      (`str | None`, `Any | None`, `datetime | None`). Neither branch may introduce a field type in a way that is Pydantic-incompatible
      with the shared base.
    rationale: Lenient shared-base types allow both branches to narrow independently without MRO conflicts; Pydantic AfterValidator
      narrowing is valid in subclasses.
  - id: ARCH-12-003
    priority: MUST
    kind: project
    statement: 'The core branch MAY narrow inherited fields via Pydantic validators (e.g., `NonEmptyString | None`, required
      `datetime`). Core-branch types MUST NOT carry wire-specific concerns: `alias_generator=to_camel`, hardcoded AS2 `@context`
      namespace, or VOCABULARY registration are forbidden in core-branch types. Core-branch types MUST additionally resolve
      `extra="forbid"` through their `model_config`, so that an unrecognised key raises rather than being silently discarded.'
    verification: 'No `CoreObject` subclass declares `alias_generator` in its `model_config`, references `to_camel`, or assigns
      to `VOCABULARY`. Confirmed by `test_no_core_object_has_to_camel_alias_generator` and `test_all_vocabulary_are_as_base_subclasses`
      in `test/architecture/test_hierarchy_invariants.py`, both of which MUST NOT be marked `xfail`. A companion test asserts
      every `CoreObject` subclass resolves `extra="forbid"`, with no exemption list.'
    rationale: 'An `alias_generator` on a core type gives one `type_` two accepted key spellings, so whichever class reads a
      row decides what the data means (issue #2232). It is also insufficient for its intended purpose: a core `model_dump(by_alias=True)`
      cannot produce the wire shape for a type whose branches differ structurally, which is why a hand-patched `consent`→`emConsentState`
      rewrite accumulated in core. Core→wire rendering belongs behind the ARCH-20 driven port. `extra="forbid"` is required
      because Pydantic v2 defaults to `extra="ignore"`: handing a wire-shaped payload to a core type silently discards every
      key whose only spelling is snake_case, which is how a participant''s RM ladder was reset without a trace (issue #2232).
      Forbidding unknown keys is strictly stronger than rejecting camelCase spellings specifically — it also catches typos,
      renamed fields, and stale keys from an older schema.'
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-20-001
      note: ARCH-20 supplies the driven port that replaces the core-side aliasing this requirement forbids.
    - rel_type: depends_on
      spec_id: ARCH-23-005
      note: ARCH-23-005 supplies the round-trip cleanups (computed-field stripping, wire-name keys) without which `extra="forbid"`
        rejects the project''s own serialised output.
    adr:
    - ADR-0063
    - ADR-0082
  - id: ARCH-12-004
    priority: MUST_NOT
    kind: project
    statement: >-
      The wire branch MUST NOT carry domain validators. Wire-branch overrides exist solely for
      AS2 serialization shape (field aliases, `@context`, lenient `Any | None` types).
    rationale: >-
      `CORE_VOCABULARY` is the DataLayer primary reconstruction path (used by `_from_row()` in `SqliteDataLayer`);
      every entry must be a `CoreObject` subclass. `CORE_TYPE_MAP` is the fallback for `find_in_vocabulary()` in the
      wire registry layer, catching core types that are not `CoreObject` subclasses (e.g. `VultronOfferRecord`,
      `VultronPendingCaseInbox`). These types extend `VultronObject` directly and carry Vultron-specific domain state
      not representable via `CoreObject`. Contaminating `CORE_TYPE_MAP` with wire types (issue #2416) would silently
      allow wire-shaped objects to be reconstructed via `find_in_vocabulary()`, bypassing the `CORE_VOCABULARY` primary
      path and contradicting ARCH-12-003.
    verification: 'Confirmed by `test_no_wire_types_in_core_type_map` (imports wire vocab and asserts no `vultron.wire`
      module class appears in `CORE_TYPE_MAP`) and `test_vultron_object_direct_types_in_core_type_map` (asserts the five
      `VultronObject`-direct core types are reachable by class name and Literal value) in
      `test/architecture/test_hierarchy_invariants.py`. Both MUST NOT be marked `xfail`.'
  - id: ARCH-12-008
    priority: MUST
    kind: project
    statement: Wire-branch types MUST register in `VOCABULARY`.
    rationale: >-
      The `VOCABULARY` registry is the wire layer's type-dispatch table; omitting a wire type
      prevents correct AS2 vocabulary lookup and object reconstruction.
    relationships:
    - rel_type: refines
      spec_id: ARCH-12-004
  - id: ARCH-12-009
    priority: MUST
    kind: project
    statement: >-
      `CoreObject` subclasses MUST register in `CORE_VOCABULARY` as the DataLayer primary
      reconstruction path.
    rationale: >-
      `CORE_VOCABULARY` is used by `_from_row()` in `SqliteDataLayer`; every entry must be a
      `CoreObject` subclass to guarantee correct domain-object reconstruction from stored rows.
    relationships:
    - rel_type: refines
      spec_id: ARCH-12-004
  - id: ARCH-12-010
    priority: MUST
    kind: project
    statement: >-
      `VultronObject`-direct subclasses that do not extend `CoreObject` MUST register in
      `CORE_TYPE_MAP` as the wire-layer fallback path consulted by `find_in_vocabulary()`.
    rationale: >-
      `CORE_TYPE_MAP` is the fallback for `find_in_vocabulary()`, catching core types (e.g.
      `VultronOfferRecord`, `VultronPendingCaseInbox`) that extend `VultronObject` directly and
      carry domain state not representable via `CoreObject`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-12-004
  - id: ARCH-12-011
    priority: MUST_NOT
    kind: project
    statement: >-
      Wire-branch types MUST NOT register in either core registry (`CORE_VOCABULARY` or
      `CORE_TYPE_MAP`).
    rationale: >-
      Contaminating either core registry with wire types would allow wire-shaped objects to be
      reconstructed via `find_in_vocabulary()`, bypassing the `CORE_VOCABULARY` primary path and
      contradicting ARCH-12-003.
    relationships:
    - rel_type: refines
      spec_id: ARCH-12-004
  - id: ARCH-12-005
    priority: MUST
    kind: project
    statement: 'Core↔wire translation MUST be performed by the translator modules on the adapter side, driven by the declarative
      pairing registry (ARCH-23-001) and the declarative field map. Wire-branch classes MUST NOT carry projection logic:
      `from_core()` and `to_core()` methods on wire vocabulary classes are forbidden. A type whose branches differ structurally
      MAY supply a bespoke translator for that pairing, but the translator MUST live on the adapter side.'
    rationale: 'Projection logic on the wire class is what forced every wire module to import the core domain model, making
      ARCH-22 unachievable rather than merely unmet. Relocating it leaves wire classes as pure AS2 shape with no domain
      knowledge — which is what ADR-0017 asserted but never structurally enforced — and gives the adapter side, which is
      permitted to see both branches, sole ownership of translation. The previous formulation also produced measurable
      duplication: twelve hand-written `to_core()` overrides, six of which were pure boilerplate around the single per-type
      fact of which core class to validate against.'
    verification: 'A test asserts that no class under `vultron/wire/as2/vocab/` defines `from_core` or `to_core` in its own
      `__dict__`, and that no module under `vultron/wire/` calls either name. A round-trip test asserts that for every entry
      in the pairing registry (ARCH-23-001) `to_core(from_core(core_obj))` equals `core_obj`, and that the wire serialization
      is byte-identical to the pre-relocation output (ARCH-23-003).'
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-23-001
      note: The pairing registry supplies the core↔wire correspondence that the generic translator needs in place of a
        per-class `to_core()` override.
    adr:
    - ADR-0063
    - ADR-0082
  - id: ARCH-12-006
    priority: MUST
    kind: project
    statement: Actor `inbox` and `outbox` fields MUST be typed `str | None` in the shared base and core branch, carrying only
      the URI of the inbox or outbox endpoint. AS2 `OrderedCollection` wrapping is a wire-only serialization concern and MUST
      NOT appear in core-branch actor types.
    rationale: Domain logic only ever needs to route to the inbox URI; the full collection shape is an AS2 protocol concern,
      not a domain concern. This resolves the most structurally irreconcilable field-type conflict that blocked the original
      ARCH-12 from_core()/to_core() approach.
  - id: ARCH-12-007
    priority: MUST
    kind: project
    statement: All core domain objects that represent protocol-significant entities (cases, reports, participants, actors,
      log entries, embargo policies, etc.) MUST inherit from `CoreObject` (or `VultronObject` when CORE_VOCABULARY registration
      is not needed). Objects that exist solely as local configuration, transient dispatch envelopes, or internal processing
      records that are never shared across the wire MAY remain plain `BaseModel` subclasses; such classes MUST include a docstring
      explaining the rationale for not inheriting from the shared-base hierarchy.
    rationale: Consistent use of the shared-base hierarchy ensures that all protocol-significant domain objects share aligned
      field names, can be translated by the adapter-side translator without per-type projection code (ARCH-12-005), and are
      discoverable via CORE_VOCABULARY.
      Intentional BaseModel classes are the exception, not the default; requiring a documented rationale prevents accidental
      hierarchy bypass as the codebase evolves.
    verification: Static analysis or a test asserts that all classes in `vultron/core/models/` that contain protocol-significant
      fields (`id_`, `type_`, `published`, `attributed_to`) inherit from `CoreObject` or `VultronObject`. Intentional `BaseModel`
      subclasses are listed in a registry or identified by a marker mixin/comment pattern.
- id: ARCH-09
  title: Domain Model Richness Constraint
  specs:
  - id: ARCH-09-001
    priority: MUST
    kind: architecture
    statement: Core domain models MUST be as rich as or richer than their wire-layer counterparts
    rationale: A thinner core model forces piecemeal additions as handlers are implemented, causing boundary leakage and implementation
      drift
  - id: ARCH-09-002
    priority: MUST
    kind: project
    statement: Actor domain models (`CoreActor` and its concrete subclasses `VultronPerson`, `VultronOrganization`, `VultronService`,
      `VultronApplication`, `VultronGroup`) MUST be defined in `vultron/core/models/`. The wire layer (`vultron/wire/as2/`)
      MUST provide corresponding wire-branch actor types inheriting from the shared base (`VultronObject`) rather than re-exporting
      core types directly.
    rationale: 'Defining actor domain models in core enforces the hexagonal boundary. The re-export pattern (where wire re-exported
      core actors directly) was a transitional workaround introduced when field-type conflicts blocked diamond inheritance.
      The shared-base approach (ARCH-12) resolves those conflicts; wire actor types should become proper wire-branch types
      once the implementation epic following concern #796 is complete.'
    verification: Confirm that `VultronPerson`, `VultronOrganization`, `VultronService`, `VultronApplication`, and `VultronGroup`
      are defined in `vultron/core/models/actor.py`. Confirm that wire actor types in `vultron/wire/as2/vocab/objects/vultron_actor.py`
      inherit from `VultronObject` (or a subclass thereof) rather than re-exporting the core classes unchanged.
    relationships:
    - rel_type: refines
      spec_id: ARCH-09-001
    - rel_type: depends_on
      spec_id: ARCH-12-001
      note: ARCH-12 establishes the shared-base hierarchy; wire actor types must inherit from that shared base, not re-export
        core types.
- id: ARCH-10
  title: Fail-Fast Domain Objects
  specs:
  - id: ARCH-10-001
    priority: MUST
    kind: architecture
    statement: Domain events and domain models MUST validate required fields at construction time and fail immediately if
      required invariants are not satisfied
    rationale: Late validation masks missing data and makes debugging harder; fail-fast ensures errors surface at the point
      of construction
- id: ARCH-15
  title: Fail-Fast at Domain Operation Boundaries
  description: Governs relational invariants enforced at runtime entry points — use-case execute(), BT node update(), and
    helper functions that require non-None resolved values. Extends the construction-time fail-fast rule to cover checks that
    can only be performed at the point of invocation, not at object construction.
  specs:
  - id: ARCH-15-001
    priority: MUST
    kind: project
    statement: 'A BT node''s update() MUST return Status.FAILURE when a required blackboard key is absent or resolves to None.
      It MUST NOT return Status.SUCCESS in this case, as doing so misleads the enclosing BT sequence and silently drops protocol
      behavior (e.g., ledger entries not written).'
    rationale: 'Status.SUCCESS on a missing required input causes the BT sequence to continue as if the node succeeded, masking
      the failure and producing ledger gaps, dropped broadcasts, and mis-routed activities. See notes/domain-validation.md
      and ADR-0032.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-10-001
      note: Extends construction-time fail-fast to runtime BT node entry points.
    adr:
    - ADR-0032
  - id: ARCH-15-002
    priority: MUST
    kind: project
    statement: 'A helper function that requires a non-None ID MUST check the result and raise VultronValidationError (or UnroutableActivityError
      for routing failures) immediately. The strict guarantee lives in the caller or the helper itself — never deferred silently
      to downstream code.'
    rationale: 'Returning None from a helper that conceptually requires a valid ID moves the error from the point of failure
      to the point of use, making stack traces and logs point to the wrong location. See notes/domain-validation.md and ADR-0032.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-10-001
      note: Extends construction-time fail-fast to helper function entry points.
    adr:
    - ADR-0032
  - id: ARCH-15-003
    priority: MUST
    kind: project
    statement: 'The dispatcher MUST raise UnroutableActivityError when no case_id can be extracted from an inbound event.
      It MUST NOT return None and silently drop the activity from ledger indexing.'
    rationale: 'A silently dropped activity produces an invisible gap in the canonical case ledger and leaves no audit trail.
      The dispatcher caller must make an explicit decision about how to handle unroutable activities. See notes/domain-validation.md
      and ADR-0032.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-10-001
      note: Extends construction-time fail-fast to dispatcher routing entry points.
    adr:
    - ADR-0032
  - id: ARCH-15-004
    priority: MUST
    kind: architecture
    statement: 'Each domain helper function MUST have exactly one canonical copy. Layer-neutral helpers (no dependencies above
      `models/`) MUST live in `vultron/core/models/_helpers.py`. Use-case-specific helpers belong in `vultron/core/use_cases/_helpers.py`.
      Duplicate implementations of the same logic are prohibited.'
    rationale: 'Duplicate helper copies diverge silently over time. Two copies of _as_id() in use_cases/_helpers.py and services/embargo_lifecycle.py
      had already diverged in docstring accuracy. Three copies of the case-manager lookup produced inconsistent None-handling
      behavior across callers. See notes/domain-validation.md and ADR-0032.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-10-001
      note: Canonical-copy discipline is a prerequisite for consistent fail-fast enforcement.
    adr:
    - ADR-0032
- id: ARCH-11
  title: Port Inbound/Outbound Discrimination
  specs:
  - id: ARCH-11-001
    priority: SHOULD
    kind: architecture
    statement: Core ports SHOULD be organized into inbound (driving) and outbound (driven) categories
- id: ARCH-14
  title: Wire Vocabulary Object Naming Convention
  rationale: 'Wire vocabulary objects in `vultron/wire/as2/vocab/objects/` historically used bare domain names (e.g., `VulnerabilityCase`,
    `CaseParticipant`) that shadow identically-named core domain models. This causes persistent confusion: agents and developers
    grab the wrong class, reason about the wrong object, or inadvertently introduce wire-layer imports into core code. The
    `as_` prefix — already established for base ActivityStreams types (`as_Activity`, `as_Actor`, `as_Object`) — MUST be extended
    to all Vultron-specific wire vocabulary objects to make the layer boundary unambiguous at a glance.'
  specs:
  - id: ARCH-14-001
    priority: MUST
    kind: project
    statement: All Vultron-specific wire vocabulary classes defined in `vultron/wire/as2/vocab/objects/` MUST use the `as_`
      prefix (e.g., `as_VulnerabilityCase`, `as_CaseParticipant`, `as_CaseStatus`). This extends the existing `as_` naming
      convention — already applied to base ActivityStreams types (`as_Activity`, `as_Actor`, `as_Object`) — to all Vultron-specific
      wire objects in that package.
    rationale: Without the `as_` prefix, wire objects shadow identically-named core domain models, making it ambiguous which
      `VulnerabilityCase` a developer or agent is working with. The `as_` prefix makes the layer boundary unambiguous at a
      glance and enables automated detection of violations.
    verification: Architecture test in `test/architecture/` asserts that no class in `vultron/wire/as2/vocab/objects/` shares
      a name with any class in `vultron/core/models/`.
  - id: ARCH-14-002
    priority: MUST
    kind: project
    statement: The wire-layer base class for all Vultron-specific AS2 objects (currently `VultronAS2Object`) MUST be renamed
      `as_VultronObject`. This eliminates the redundant "AS2" qualifier (the `as_` prefix already connotes the wire layer)
      and aligns the base class name with ARCH-14-001.
    rationale: '`VultronAS2Object` does not follow the `as_` prefix convention. The "AS2" suffix is redundant when the `as_`
      prefix already signals the wire layer. Renaming to `as_VultronObject` makes the base class consistent with all subclasses.'
    verification: '`vultron/wire/as2/vocab/objects/base.py` exports `as_VultronObject`; no class named `VultronAS2Object`
      exists anywhere in the codebase.'
  - id: ARCH-14-003
    priority: MUST
    kind: project
    statement: '`TypeAlias` companion types (wire-layer reference unions, e.g., `VulnerabilityCaseRef`) MUST also use the
      `as_` prefix (e.g., `as_VulnerabilityCaseRef`, `as_CaseParticipantRef`).'
    rationale: 'Companion aliases that do not follow the `as_` naming convention undermine the goal of ARCH-14-001: an import
      of `VulnerabilityCaseRef` is just as ambiguous as importing `VulnerabilityCase` from the wire layer.'
    verification: No `TypeAlias` variable in `vultron/wire/as2/vocab/objects/` uses a name that matches a core model name
      without the `as_` prefix.
- id: ARCH-13
  title: DataLayer Scope Contract
  specs:
  - id: ARCH-13-001
    priority: MUST
    kind: project
    deprecated: true
    superseded_by: DL-07-002
    statement: This requirement is superseded by DL-07-002; there is no unscoped DataLayer to keep away from queue operations.
    rationale: >-
      The rule policed a hazard that ADR-0073 removed rather than mitigated. It distinguished a "shared"
      DataLayer from an actor-scoped one and forbade passing the former to queue operations; with every
      DataLayer belonging to exactly one actor, the distinction has no referent and the rule is vacuous.
      Retiring it is the point: the decision *deletes* guard rails instead of adding them.
    adr:
    - ADR-0073
  - id: ARCH-13-002
    priority: MUST
    kind: project
    deprecated: true
    superseded_by: DL-07-001
    statement: This requirement is superseded by DL-07-001; queue operations have no unscoped alternative to be required away from.
    rationale: >-
      Named `ActorScopedDataLayer`, a protocol refinement that existed only to mark the scoped case as
      distinct. With no unscoped mode the refinement was merged back into `DataLayer`, and queue rows no
      longer carry an `actor_id` column to address at all — the queue lives in its owner's store.
    adr:
    - ADR-0073
  - id: ARCH-13-003
    priority: MUST
    kind: project
    statement: >-
      The actor identity a DataLayer is opened under MUST be the actor's canonical URI — the value of
      `actor.id_` — and MUST NOT be a short ID, a URL path segment, or any other derived identifier.
      Where a request carries a path segment, it MUST be resolved to the canonical URI before the store
      is opened.
    rationale: >-
      Two spellings of one actor must not name two stores. This entry survives ADR-0073 — it is the
      reason `get_actor_dl` resolves the segment by computation before opening anything — but its
      wording did not: it referred to constructing an `ActorScopedDataLayer` and justified itself by
      `record_outbox_item` writing rows keyed by the string it received, and both of those are gone.
      The original failure mode was BUG-2026040901, where a queue written under the canonical URI was
      read under the short id and the activities vanished. That specific mechanism is now unreachable —
      queues are not keyed by an id string — but the requirement still binds, because the canonical URI
      is what *selects the store*, so a short id opens a different and empty one.
    relationships:
    - rel_type: refines
      spec_id: DL-07-006
    verification: >-
      `test/adapters/driving/fastapi/test_deps.py` asserts that `get_canonical_actor_dl` resolves a
      short path segment to the canonical URI and that the resulting store can read the outbox entries
      that actor's own writes went to.
    adr:
    - ADR-0073
  - id: ARCH-13-004
    priority: MUST
    kind: project
    deprecated: true
    superseded_by: DL-07-001
    statement: This requirement is superseded by DL-07-001; the two identities it required to match no longer both exist.
    rationale: >-
      It required the `actor_id` passed to `record_outbox_item` to equal the one used to construct the
      reading DataLayer. `record_outbox_item` is gone: every one of its call sites passed the executing
      actor's own id, so with a mandatory actor scope it was exactly `outbox_append`. With one identity
      instead of two there is nothing left to keep in agreement.
    adr:
    - ADR-0073
  - id: ARCH-13-005
    priority: SHOULD
    kind: project
    deprecated: true
    superseded_by: DL-07-002
    statement: This requirement is superseded by DL-07-002; the `ActorScopedDataLayer` protocol it asked for has been deleted.
    rationale: >-
      It asked for a Protocol refinement so type-checkers could enforce the scope boundary at
      signature level. The boundary is now enforced by construction instead — a DataLayer cannot exist
      unscoped — so the refinement had no referent and was merged back into `DataLayer`. Retired
      alongside ARCH-13-001/002/004 rather than kept as an unimplementable SHOULD.
    adr:
    - ADR-0073
- id: ARCH-16
  title: App State Isolation
  specs:
  - id: ARCH-16-001
    priority: MUST_NOT
    kind: project
    statement: '`create_app()` (or any equivalent application factory) MUST NOT mutate module-level singletons, global registries,
      or process-wide shared state. All per-application state MUST be scoped to the returned app instance or its lifespan
      context.'
    rationale: 'Mutating module-level singletons in `create_app()` makes test isolation impossible: the second call to `create_app()`
      in the same process inherits mutations from the first. This applies to vocabulary registries, DataLayer factories, BT
      bridges, actor caches, and any other mutable global. Discovered as a demo-layer issue (DEMOMA-01-004) but applies equally
      to all application factories.'
    relationships:
    - rel_type: implements
      spec_id: ARCH-04-001
- id: ARCH-17
  title: ASGIEmitter Base URL
  description: >-
    SUPERSEDED by ADR-0042 / outbox.yaml OX-12. The ASGIEmitter in-process delivery
    shortcut has been retired in favour of uniform HTTP delivery for all inter-actor
    communication. These requirements are retained for historical traceability only and
    no longer describe the delivery architecture; do not implement against them.
  specs:
  - id: ARCH-17-001
    priority: MUST
    kind: project
    statement: The `ASGIEmitter` base URL MUST contain only the scheme and netloc components (e.g., `https://example.org`).
      It MUST NOT include a path prefix, trailing slash, or mount-point segment. The emitter strips the mount prefix from
      request paths before constructing outbound URLs; a base URL that includes a prefix causes double-application.
    rationale: 'A base URL of `https://example.org/api` combined with a request path `/api/actors/…` produces `https://example.org/api/api/actors/…`.
      Root cause of bugs #557 and #558.'
  - id: ARCH-17-002
    priority: MUST
    kind: project
    statement: '`ASGIEmitter` MUST use a `contextvars.ContextVar[int]` reentrancy guard, not a `threading.Lock` or boolean
      flag, to detect and prevent re-entrant emission (an emitter call triggered by a handler that was itself invoked by an
      earlier emission). Re-entrant emission MUST raise `EmitterReentrancyError`.'
    rationale: A `threading.Lock` guard would deadlock when the re-entrant call happens on the same thread (common in async/ASGI
      contexts). A `ContextVar` is task-local and correctly tracks reentrancy per async task without thread-lock semantics.
    relationships:
    - rel_type: refines
      spec_id: ARCH-17-001
- id: ARCH-18
  title: Architecture Ratchet Discipline
  specs:
  - id: ARCH-18-001
    priority: MUST
    kind: process
    statement: 'Architecture boundary tests that enforce a `KNOWN_VIOLATIONS` allowlist MUST use a bidirectional equality
      assertion: `assert actual_violations == KNOWN_VIOLATIONS`. One-directional subset assertions (`assert actual ⊆ KNOWN`)
      are prohibited because they allow the violation count to grow silently.'
    rationale: A subset assertion says "we have at most these violations" but allows new ones to be added without failing
      the test. Bidirectional equality says "we have exactly these violations" — any addition fails immediately, and any removal
      must be reflected in the allowlist.
    relationships:
    - rel_type: implements
      spec_id: ARCH-10-001
  - id: ARCH-18-002
    priority: MUST
    kind: process
    statement: When a known architectural violation is resolved (the file or import is removed or refactored), the corresponding
      entry MUST be removed from the `KNOWN_VIOLATIONS` allowlist in the same commit that resolves the violation. Stale allowlist
      entries that no longer correspond to real violations MUST NOT be retained.
    rationale: Stale entries mask the true state of the architecture boundary. A "fixed" violation that remains in `KNOWN_VIOLATIONS`
      makes the ratchet appear tighter than it is and hides regression when a new violation with the same name is later introduced.
    relationships:
    - rel_type: refines
      spec_id: ARCH-18-001
- id: ARCH-19
  title: Outbound Delivery Pipeline
  specs:
  - id: ARCH-19-001
    priority: MUST
    kind: architecture
    statement: >-
      Outbound delivery MUST be modelled as a three-stage pipeline consisting
      of Emission, Transport delivery, and Recipient acceptance.
    rationale: 'Conflating stages (e.g., treating a transport timeout as a recipient rejection) leads to incorrect retry logic
      and protocol-state divergence. The three-stage model is the foundation for correct at-least-once delivery. Source: `notes/architecture-adapters.md`.'
  - id: ARCH-19-006
    priority: MUST_NOT
    kind: architecture
    statement: Each stage of the outbound delivery pipeline has distinct error semantics and MUST NOT be conflated with another stage.
    rationale: >-
      Treating a transport timeout (stage 2) as a recipient rejection (stage 3) leads to incorrect
      retry logic and protocol-state divergence.
    relationships:
    - rel_type: refines
      spec_id: ARCH-19-001
  - id: ARCH-19-002
    priority: MUST
    kind: architecture
    statement: 'Emission (stage 1) MUST be idempotent with respect to the outbox: writing the same activity ID twice MUST
      NOT create a duplicate outbox entry.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-19-001
  - id: ARCH-19-003
    priority: MUST
    kind: architecture
    statement: Transport delivery (stage 2) MUST be retried on transient network failures. The retry mechanism MUST be implemented
      in the outbox worker, not in the use-case or handler.
    relationships:
    - rel_type: refines
      spec_id: ARCH-19-001
  - id: ARCH-19-004
    priority: MUST_NOT
    kind: architecture
    statement: A transport delivery failure (stage 2 error) MUST NOT be interpreted as recipient rejection (stage 3 semantics).
      Delivery failure means the activity did not reach the recipient; it carries no information about whether the recipient
      would accept or reject the activity.
    relationships:
    - rel_type: refines
      spec_id: ARCH-19-001
  - id: ARCH-19-005
    priority: MUST
    kind: architecture
    statement: The outbox worker MUST record the delivery outcome (success, transient failure, or permanent failure) in the
      per-actor process log (Python `logging`) at the level prescribed in `specs/structured-logging.yaml`. Delivery outcomes
      MUST NOT be written to the canonical case ledger; the case ledger is exclusively for CaseActor-authored protocol-significant
      assertions (ADR-0019).
    rationale: 'ADR-0019 establishes strict separation: the canonical case ledger contains only CaseActor-authored protocol
      assertions; per-actor transport observability goes to the process log. Delivery outcomes (whether a network call succeeded)
      are operational diagnostics, not protocol-significant assertions.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-19-001
    adr:
    - ADR-0019
- id: ARCH-20
  title: Core-to-Wire Rendering Port
  description: Governs how core domain objects are rendered into wire-shaped (AS2 camelCase) JSON. Core legitimately needs
    a wire representation in one place — the `CaseLedgerEntry.payloadSnapshot`, which CLP-07-001 requires to be receiver-reconstitutable
    AS2 — but producing it by setting `alias_generator=to_camel` on the core type violates ARCH-12-003 and cannot express
    structural differences between the two branches. This group establishes a driven port as the single rendering seam.
  rationale: 'Eight `CoreObject` subclasses carried `alias_generator=to_camel` (issue #1991) solely so that core code could
    call `model_dump(by_alias=True)` when building ledger payload snapshots. The mechanism was both a layer violation and
    inadequate: `ParticipantStatus` nests `consent: PecDimension` where the wire shape carries a flat `emConsentState`, so
    core had to hand-patch the dumped dict — a partial, drifting reimplementation of `as_ParticipantStatus.from_core()`. ARCH-01-004
    prescribes driven ports as the remediation for core→wire needs. See ADR-0063.'
  specs:
  - id: ARCH-20-001
    priority: MUST
    kind: architecture
    statement: Core code that requires a wire-shaped representation of a **core-branch** object MUST obtain it through a driven
      port declared in `vultron/core/ports/`. Core MUST NOT produce that shape itself, whether by declaring an `alias_generator`
      on the core class, by calling `model_dump(by_alias=True)` on a core-branch instance, or by rewriting dumped keys into
      wire spellings. Dumping an already-wire-shaped object that core holds (e.g. a received activity being captured verbatim
      per CLP-07-001) is unaffected by this requirement.
    rationale: A single rendering seam keeps every fact about wire spelling (camelCase, flat `emConsentState`, the AS2 `@context`)
      out of core and behind the adapter-side translator that owns projection (ARCH-12-005). The requirement is scoped to core-branch
      objects because core legitimately handles wire objects on the verbatim-capture path; conflating the two would make this
      requirement unverifiable.
    verification: No `CoreObject` subclass declares an `alias_generator` (enforced by `test_no_core_object_has_to_camel_alias_generator`),
      so a `by_alias=True` dump of a core-branch instance can no longer yield wire spelling. Each remaining `by_alias=True`
      call site under `vultron/core/` is additionally reviewed to confirm its subject is a wire object, and annotated as such.
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-004
    adr:
    - ADR-0063
  - id: ARCH-20-002
    priority: MUST
    kind: project
    statement: The rendering port's adapter MUST produce its output by resolving the core object's wire counterpart through
      the declarative pairing registry (ARCH-23-001) and delegating the projection to the adapter-side translator for that
      pairing, then serialising with `by_alias=True`. The adapter MUST NOT reimplement field-name translation, and MUST NOT
      invoke a projection method on the wire class — those methods are forbidden by ARCH-12-005.
    rationale: 'The adapter-side translator is the authoritative projection and handles structural differences (nested `PecDimension`
      → flat `emConsentState`). Any second translation path will drift from it, which is the defect ADR-0063 removes. ADR-0063''s
      decision — that rendering happens behind this port — stands unchanged; only the mechanism moves, because a `from_core()`
      method on the wire class is what forced every wire module to import the core domain model (ARCH-22-001).'
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-001
    - rel_type: depends_on
      spec_id: ARCH-23-001
      note: The pairing registry is how the adapter resolves the wire counterpart now that name coincidence is forbidden.
    adr:
    - ADR-0063
    - ADR-0082
  - id: ARCH-20-003
    priority: MUST
    kind: project
    statement: When no wire counterpart exists for the supplied core object, the rendering port MUST raise `VultronValidationError`.
      It MUST NOT fall back to a core-shaped `model_dump`, return `None`, or emit a partially-rendered object.
    rationale: A silently core-shaped payload snapshot is unreconstitutable by receivers (CLP-07-001) and is indistinguishable
      from a correct one at the call site. Failing loudly is required by ARCH-15-002.
    relationships:
    - rel_type: refines
      spec_id: ARCH-15-002
    adr:
    - ADR-0063
  - id: ARCH-20-004
    priority: MUST
    kind: project
    statement: The rendering port MUST be injected into behavior-tree execution using the established mechanism — a constructor
      parameter on `BTBridge` published to the blackboard under a named key — in the same manner as `sync_port`. BT nodes and
      use-case helpers MUST NOT import an adapter directly or instantiate a default renderer.
    rationale: Consistency with `SyncActivityPort` keeps one injection idiom for driven ports. An import-time default would
      reintroduce the core→wire import the port exists to prevent (ARCH-01-001).
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
  - id: ARCH-20-005
    priority: MUST
    kind: project
    statement: Core-branch types MUST NOT declare a `to_json()`, `to_wire()`, or similarly-named method that emits wire-shaped
      output. Rendering is the port's responsibility, not a method on the domain object.
    rationale: '`CoreActor.to_json()` dumped with `by_alias=True` and had no callers; such a method is an always-available
      bypass of the port seam and will be picked up by the next agent that needs camelCase.'
    verification: No class under `vultron/core/models/` defines a method that calls `model_dump`/`model_dump_json` with `by_alias=True`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
  - id: ARCH-20-006
    priority: MUST
    kind: project
    statement: Driving adapters that serve AS2 documents over HTTP (e.g. `GET /actors/{id}`) MUST render the response from
      the corresponding `as_*` wire class. They MUST NOT dump a core-branch class with `by_alias=True` to synthesise an AS2
      document.
    rationale: The actor routes relied on the core actor classes' `alias_generator` to shape their external AS2 output, which
      is why removing that generator has an externally-visible blast radius. Routing through `as_*` classes makes the external
      contract depend on the wire layer that defines it.
    verification: The actor router constructs responses via wire vocabulary classes; no `by_alias=True` dump of a `CoreObject`
      subclass appears in `vultron/adapters/driving/`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
  - id: ARCH-20-007
    priority: MUST_NOT
    kind: project
    statement: >-
      Core code MUST NOT normalise a wire object into its core counterpart by dumping it with
      `by_alias=True` and revalidating through the core class ("dump-and-revalidate").
    rationale: 'Dump-and-revalidate only works while the core class tolerates wire spellings — precisely the ARCH-12-003 violation
      being removed. `FilterParticipantStatusDimensionsNode._to_core_status` documents this dependency explicitly ("The core
      model''s `_migrate_flat_fields` validator accepts that shape, so a dump-and-revalidate normalises both"), so the shim
      and this idiom must be retired together. It is also lossy in the general case: a core class that ignores an unknown key
      silently discards it.'
    verification: No module under `vultron/core/` constructs a core model via `CoreClass.model_validate(wire_obj.model_dump(by_alias=True, ...))`.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-20-001
    - rel_type: refines
      spec_id: SDO-03-005
    adr:
    - ADR-0063
  - id: ARCH-20-008
    priority: MUST
    kind: project
    statement: >-
      Core code that needs a wire object normalised into its core counterpart MUST obtain it
      through the `WireParsePort` declared in `vultron/core/ports/`, whose adapter performs the
      projection using the adapter-side translator for the pairing (ARCH-23-001).  Core MUST NOT
      duck-type the projection capability on the object it holds — `getattr(obj, "to_core", None)`
      and equivalents are prohibited.
    rationale: >-
      The adapter-side translator is the authoritative projection and handles structural
      differences (e.g. flat `emConsentState` → nested `PecDimension`).  Reaching it through a
      port avoids the lossy dump-and-revalidate path prohibited by ARCH-20-007 while keeping the
      dependency direction that ARCH-01-004 prescribes: duck-typing `to_core` was core reaching
      for a wire capability without declaring the dependency, and it stops working once the
      method is forbidden on wire classes (ARCH-12-005).
    verification: >-
      No module under `vultron/core/` contains `getattr(obj, "to_core", None)` or calls a
      `to_core` attribute; the parsing sites route through `WireParsePort`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-007
    - rel_type: depends_on
      spec_id: ARCH-23-001
    adr:
    - ADR-0063
    - ADR-0082
  - id: ARCH-20-009
    priority: MUST
    kind: project
    statement: >-
      When the wire type has no counterpart in the pairing registry, and therefore no translator
      reachable through `WireParsePort`, the normalised core object MUST be obtained
      already-normalised from the DataLayer port (DL-05-001).  It MUST NOT be synthesised in core
      by dump-and-revalidate.
    rationale: >-
      The DataLayer port returns objects that have already passed through the normalisation
      boundary, making dump-and-revalidate unnecessary and avoiding the prohibited idiom.  An
      absent pairing-registry entry is the successor to the absent `to_core()` override this
      requirement was originally written against: it is the declarative statement that no
      translation exists for that type.
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-007
    - rel_type: depends_on
      spec_id: ARCH-23-001
    adr:
    - ADR-0063
    - ADR-0082
- id: ARCH-21
  title: Post-Construction Mutation Safety
  description: >-
    Requirements governing validation of core domain objects after construction.
    Pydantic v2 validates at construction only, so attribute assignment and
    in-place collection mutation bypassed every type guarantee, allowing a
    wire-shaped object to occupy a core-typed field and be silently misread as
    absent (#2232, #2264). Codified by ADR-0064. Source: CONCERN-2261.
  specs:
  - id: ARCH-21-001
    priority: MUST
    kind: architecture
    statement: >-
      Every core domain model (a `pydantic.BaseModel` subclass defined under
      `vultron/core/models/`) MUST have `validate_assignment=True` in effect,
      whether set directly or inherited, so that attribute assignment is
      validated to the same standard as construction.
    rationale: >-
      Construction-time-only validation means the same value the constructor
      rejects is accepted by assignment. A wire-shaped object in a core-typed
      field does not raise when read — it reads as absent, and readers substitute
      an initial state, silently resetting a participant's ladder (#2232, #2264).
    adr:
    - ADR-0064
  - id: ARCH-21-002
    priority: MUST_NOT
    kind: architecture
    statement: >-
      `VultronBase` MUST NOT set `validate_assignment`. It is the shared base of
      both branches (ARCH-12-001) and `as_Base` inherits it, so the wire branch
      MUST remain lenient (ARCH-12-002). Enforcement belongs on the core branch
      only, applied below `VultronBase`.
    rationale: >-
      Setting the flag on the shared base is the one-line fix that looks correct
      and is not: it contradicts ARCH-12-002 and produced the largest measured
      blast radius (747 failed, 423 errors) because inbound wire data is
      legitimately loose.
    relationships:
    - rel_type: refines
      spec_id: ARCH-12-002
    adr:
    - ADR-0064
  - id: ARCH-21-003
    priority: MUST_NOT
    kind: architecture
    statement: >-
      No wire-layer class (under `vultron/wire/`) MUST have
      `validate_assignment` enabled. Strictness belongs at the wire-to-core
      projection, not on the wire types themselves.
    rationale: >-
      Inbound wire data is loose by contract. Enforcing strictness on the wire
      types would reject legitimate inbound payloads instead of projecting them
      (ADR-0062, ARCH-12-002).
    relationships:
    - rel_type: refines
      spec_id: ARCH-12-002
    adr:
    - ADR-0064
  - id: ARCH-21-004
    priority: MUST_NOT
    kind: project
    statement: >-
      A `mode="after"` model validator on a core model (under `vultron/core/`)
      MUST NOT assign to `self`. Values derived from other fields MUST be derived
      in a `mode="before"` validator, where the derived value is itself
      validated. Wire-layer validators are exempt, because the wire branch never
      enables `validate_assignment` (ARCH-21-003) and therefore cannot re-enter.
    rationale: >-
      `validate_assignment` re-runs every `mode="after"` validator on each
      assignment, so a validator that writes to `self` re-enters itself. Guarded
      validators terminate at depth 2; unguarded ones recurse until the stack is
      exhausted. Measured: enabling the flag before this rule holds aborts 400+
      tests with `RecursionError` and nothing else, masking every real type
      failure. Writing the field through `self.__dict__` was rejected as a remedy
      because it leaves the derived value unvalidated.
    adr:
    - ADR-0064
  - id: ARCH-21-005
    priority: SHOULD
    kind: project
    statement: >-
      An architecture test SHOULD enforce ARCH-21-001, ARCH-21-003 and
      ARCH-21-004, and SHOULD enumerate any remaining known violations as an
      exact set so that the set fails both when it grows and when a listed
      violation is fixed without being removed. Each such backlog SHOULD have a
      companion `xfail(strict=True)` goal test, so that emptying the backlog
      fails the build and forces the marker to be deleted. The test MUST complete
      within one second per scan.
    rationale: >-
      A `strict=False` xfail keeps passing after the work is done, so it never
      signals that it should be removed, and it gives no partial-progress signal
      — the failure mode observed on the long-dormant #1991 and #1992 markers. An
      exact set plus a strict goal test makes both drift and completion
      impossible to miss.
    adr:
    - ADR-0064

- id: ARCH-22
  title: Wire→Core Import Boundary Enforcement
  specs:
  - id: ARCH-22-001
    priority: MUST
    kind: project
    statement: >-
      Wire-layer code MUST NOT introduce new direct imports of
      `vultron.core.models.*` types beyond those enumerated in the
      wire→core ratchet test's KNOWN_VIOLATIONS set.  Translation between a
      core object and its wire counterpart MUST go through an explicit
      translation seam — the adapter-side translator for that pairing,
      resolved through the declarative pairing registry (ARCH-23-001) — and
      not by importing the core type into arbitrary wire modules.
    rationale: >-
      `VulnerabilityCase` and its siblings are the core domain model; direct
      import into wire-layer code couples the wire schema to the domain model
      in ways that bypass the ports-and-adapters boundary.  Each new
      unmediated import is a ratchet-set expansion that increases the blast
      radius of future domain-model refactors.  The adapter side is the one
      layer permitted to see both branches, so hosting the seam there keeps
      translation localized while leaving the wire branch importing nothing
      from core — which a per-class `from_core()` seam on the wire vocab
      objects could never do, and is why ARCH-12-005 now forbids it.
    adr:
    - ADR-0017
    - ADR-0032
    - ADR-0063
    - ADR-0082
  - id: ARCH-22-002
    priority: MUST
    kind: project
    statement: >-
      An architecture test MUST exist that scans all `vultron/wire/` source
      files for imports of `vultron.core.models`, enumerates the current
      known violations as an exact frozen set, and fails both when the set
      grows (new violation) and when a listed violation is resolved without
      being removed from the set.
    rationale: >-
      A ratchet test with an exact set gives a two-sided signal: new
      violations fail CI immediately, and a resolved violation that was
      accidentally kept in the set also fails CI — forcing the known set to
      track the true state of the codebase.  This mirrors the pattern already
      used in `test/architecture/test_core_no_wire_imports.py` and
      `test_core_no_adapter_imports.py`.
    adr:
    - ADR-0017
  - id: ARCH-22-003
    priority: SHOULD
    kind: project
    statement: >-
      The KNOWN_VIOLATIONS set in the wire→core ratchet test SHOULD shrink
      toward the declared structural exemption set, not toward empty.  The
      exemption set MUST be enumerated explicitly, naming for each entry the
      requirement that mandates it, and MUST contain exactly the entries
      enumerated here: the `find_in_core_type_map` import in
      `vultron/wire/as2/vocab/base/registry.py`, mandated by ARCH-12-010.
      Every other KNOWN_VIOLATIONS entry is a relocation target rather than an
      exemption, and clears only when the relocation that owns it lands — the
      shared-base imports when ARCH-12-001's branch-neutral module lands, the
      projection imports when ARCH-12-005's adapter-side translators land, the
      factory imports when AF-01-005's delegation lands, and the cross-cutting
      enum and semantic-extractor imports when their own relocations land.
      Until every one of those has landed, KNOWN_VIOLATIONS MUST remain a
      superset of the exemption set and the two-sided ratchet (ARCH-22-002)
      MUST stay in force.  The companion `xfail(strict=True)` goal test SHOULD
      assert equality with the exemption set, so that reaching it fails the
      build and forces the xfail marker to be deleted, signalling completion.
    rationale: >-
      Without a strict goal test the ratchet can reach its target silently and
      the xfail marker stays forever — the completion signal never fires.  But
      a goal test targeting *empty* asserts an unreachable state: ARCH-12-001
      requires wire classes to inherit the shared base, ARCH-12-010 requires
      `find_in_vocabulary()` to consult the core type map, and (before ADR-0082)
      ARCH-20-002 unconditionally required the rendering adapter to invoke a
      `from_core()` projection defined on the wire class.  An unreachable goal
      invites an implementer to violate a MUST in order to make it pass, which
      is worse than no goal test.  ADR-0082 removes two of the three structural
      causes by relocating the shared base and moving projection to the adapter
      side, leaving one justified exemption.  The exemption set is stated as an
      enumeration rather than a count because a count in a requirement drifts
      from the code the moment a relocation lands, and because the residue is
      only reachable after the relocations — asserting a member total today
      would be an arithmetic the ratchet cannot derive.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-12-005
      note: Moving projection off the wire classes is what clears the projection-import subset of KNOWN_VIOLATIONS.
    - rel_type: depends_on
      spec_id: AF-01-005
      note: Factory delegation is what clears `factories/actor.py` and `factories/case.py`, which a mandating MUST otherwise
        pins in place.
    adr:
    - ADR-0017
    - ADR-0082
- id: ARCH-23
  title: Core↔Wire Pairing Registry and Translator
  specs:
  - id: ARCH-23-001
    priority: MUST
    kind: project
    statement: >-
      A single declarative pairing registry MUST be the authoritative statement
      of core↔wire type correspondence.  Every mechanism that needs to resolve a
      core type to its wire counterpart, or a wire type to its core counterpart,
      MUST consult that registry.  Resolving a counterpart by name coincidence
      between `VOCABULARY` and `CORE_VOCABULARY` is forbidden.
    rationale: >-
      Before this requirement the pairing was stated four times and declared
      nowhere: implicitly by the bare-name collision that
      `As2WireRenderAdapter.render()` relied on, and explicitly by three
      hand-maintained copies — `_WIRE_ACTOR_TO_CORE` (actors only),
      `_NORMALIZE_WIRE_TO_CORE` (write path), and the chain of three registries
      behind `find_in_vocabulary()`.  An implicit index is also untestable:
      nothing asserted that a core type and its wire counterpart agreed on a
      name, so a rename broke rendering at runtime with "No wire counterpart"
      rather than at import or test time.
    verification: >-
      A test asserts the registry is complete in both directions: every
      `CORE_VOCABULARY` entry that has a wire counterpart appears in it, and
      every wire type claiming a core counterpart resolves through it.  A grep
      test asserts `_WIRE_ACTOR_TO_CORE` and `_NORMALIZE_WIRE_TO_CORE` no longer
      exist.
    adr:
    - ADR-0082
  - id: ARCH-23-002
    priority: MUST
    kind: project
    statement: >-
      Because the pairing registry is authoritative (ARCH-23-001), the wire
      `VOCABULARY` and core `CORE_VOCABULARY` registries MUST NOT be required to
      share key spellings.  Wire vocabulary registration keys MUST be distinct
      from core vocabulary keys so that no wire class shadows a core type.
    rationale: >-
      Fifteen wire classes shadowed a `CORE_VOCABULARY` entry, which is what made
      the `_NORMALIZE_WIRE_TO_CORE` persistence-boundary workaround necessary
      (issue #2232, ADR-0062).  Removing the shadowing was previously risky
      because the collision was load-bearing for counterpart resolution; once
      ARCH-23-001 makes the pairing explicit, disjoint keys are safe.
    verification: >-
      A test forces full registration first — registration is a submodule import side effect
      (VM-01-005), so it walks every submodule of the wire vocabulary package and of the core
      models package before reading either registry — then asserts that both registries are
      non-empty and cover their declared type counts, and only then asserts
      `set(VOCABULARY) & set(CORE_VOCABULARY) == set()`.  Asserting the disjointness without the
      population precondition passes vacuously: a bare
      `from vultron.wire.as2.vocab import VOCABULARY` yields an empty dict, so the intersection
      is empty for the wrong reason.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-23-001
      note: Disjoint keys are only safe once counterpart resolution no longer depends on the shared key.
    - rel_type: depends_on
      spec_id: VM-01-005
      note: Import-time registration is why the verification must force population before comparing the registries.
    adr:
    - ADR-0082
  - id: ARCH-23-003
    priority: MUST_NOT
    kind: project
    statement: >-
      Serialized AS2 output MUST NOT change as a result of any pairing-registry
      or vocabulary-key change.  The wire `"type"` value emitted on the wire is
      independent of the registry key under which a wire class is registered.
    rationale: >-
      The registry key is an internal lookup concern; the `type` field value is
      an external protocol commitment that receivers match on.  Conflating them
      is what made VM-01-004 read as though the key and the wire value must be
      the same string, when the code already derives the key from the class name
      and diverges for the five actor types.
    verification: >-
      A round-trip test asserts the serialized form of every wire type is
      byte-identical to its pre-change output.
    adr:
    - ADR-0082
  - id: ARCH-23-004
    priority: MUST
    kind: project
    statement: >-
      The set of AS2 reference-typed fields MUST be derived from the wire
      classes' type annotations.  It MUST NOT be restated as a hand-maintained
      collection, and per-field reference collapsing MUST NOT be open-coded in
      individual translation paths.
    rationale: >-
      This knowledge was stated three times: by the `as_ObjectRef` annotations
      (the truth), by `_AS_OBJECT_REF_FIELDS` in
      `vultron/adapters/driven/db_record.py` whose own comment described it as a
      restatement of those annotations, and by hand-written
      `_scalar_ref_id_or_value(...)` calls inside individual projection methods.
      Two of the three could drift from the first silently.
    verification: >-
      A grep test asserts `_AS_OBJECT_REF_FIELDS` no longer exists, and a test
      asserts the derived set matches the annotation-declared reference fields
      for every wire class.
    adr:
    - ADR-0082
  - id: ARCH-23-005
    priority: MUST
    kind: project
    statement: >-
      A serialize-then-validate round trip on a core object MUST reproduce that
      object.  Serialization MUST omit computed fields, and MUST emit wire-facing
      key names (`id`, `type`, `@context`) rather than Python field names
      (`id_`, `type_`, `context_`).  This applies to the persistence record
      round trip as well as to translation.
    rationale: >-
      `extra="forbid"` (ARCH-12-003) is only viable if the project can
      round-trip its own output.  Measured on the unit suite, the two blockers
      were `embargo_adherence` — a `@computed_field` per ADR-0056 that appears
      in `model_dump()` output but is not settable — with 1096 rejections, and
      `id_` with 110.  Neither was a wire-spelling problem; both were the
      project failing to re-read what it had just written.  `Record.from_obj()`
      calls `model_dump(mode="json", serialize_as_any=True)` with no `by_alias`,
      so persisted rows are keyed `id_`/`type_`, which is invisible only because
      unknown keys are currently ignored on read-back.
    verification: >-
      A test asserts `type(obj).model_validate(dump(obj)) == obj` for every
      `CORE_VOCABULARY` entry, and that no persisted row carries a
      trailing-underscore key.
    adr:
    - ADR-0056
    - ADR-0082
  - id: ARCH-23-006
    priority: MUST_NOT
    kind: project
    statement: >-
      Core-branch types MUST NOT appear in wire-branch field annotations.  The
      AS2-faithful reference union (`as_Object | as_Link | str`) is permitted and
      expected; adding a core type as a further union member is forbidden.
    rationale: >-
      `as_ObjectRef` carried `| CoreObject`, added as a migration convenience in
      PR #730, placing a core type inside a wire annotation and therefore inside
      the `object_` field of every transitive activity.  Besides violating
      ARCH-22-001, it makes a core-side validation guard unsafe to enforce
      loudly: `VultronValidationError` is not a `ValueError` subclass, so a guard
      firing while Pydantic resolves that union escapes the whole operation
      instead of being absorbed as a failed union branch.  The AS2 part of the
      union is not a defect — the standard permits a property to hold an
      embedded object or an IRI reference, and `rehydrate()` (VM-06-001) resolves
      it at a defined point.
    verification: >-
      A test asserts no wire-branch field annotation names a `CoreObject`
      subclass.
    relationships:
    - rel_type: refines
      spec_id: ARCH-22-001
      note: Names the specific annotation-level case of the wire→core import prohibition.
    adr:
    - ADR-0082
