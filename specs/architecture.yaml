id: ARCH
title: Architecture
description: 'Defines the architectural constraints for the Vultron codebase. The system follows hexagonal architecture (Ports
  and Adapters): the core domain is isolated from all external systems, which interact through defined ports via thin adapters.
  Covers layer separation rules, the core object hierarchy, domain model richness, and the fail-fast validation boundary.'
scope:
- prototype
- production
tags:
- code-style
groups:
- id: ARCH-01
  title: Layer Separation
  specs:
  - id: ARCH-01-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: The `core/` package (or equivalent domain layer) MUST NOT import from `wire/`, `adapters/`, or any external
      framework
    rationale: Keeps domain logic replaceable without touching the wire or transport layer
    adr:
    - ADR-0009
  - id: ARCH-01-002
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Core functions MUST accept and return domain types only
    rationale: >-
      Core logic reads the meaning of a message, not its encoding. If a core function
      takes or returns a wire type, core depends on the AS2 format, and a change to that
      format then changes core code. Domain types also arrive already validated
      (ARCH-08-002), so core does not need to check them again.
    adr:
    - ADR-0009
  - id: ARCH-01-003
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: The `wire/` layer (AS2 parser, semantic extractor) MUST NOT contain handler logic, case management, or journal
      management
    rationale: >-
      The wire layer encodes and decodes messages. Handler logic, case management and
      the case ledger are domain behavior, and they belong in core. If the wire layer
      holds domain logic, a change of wire format must also change that logic, and core
      then does not own its own rules. The wire layer may name core types in its
      annotations (ARCH-22-001), because AS2 is a serialization of the core model
      (ADR-0099). The rule thus limits what wire code does, not what it imports.
    adr:
    - ADR-0099
    - ADR-0009
  - id: ARCH-01-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      This codebase MUST fix each ARCH-01-001 violation in `vultron/core/` by moving
      its import behind a driven port.
    rationale: Leaving core→wire import violations unfixed undermines the hexagonal boundary and prevents clean unit testing
      of core logic with mock adapters. See tracking issues for the current set of known violations.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-001
      note: ARCH-01-001 is the general constraint; ARCH-01-004 requires that all violations be systematically remediated via
        driven ports.
    adr:
    - ADR-0009
  - id: ARCH-01-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      This codebase MUST give each core file that imports wire a narrow driven port in
      the `SyncActivityPort` or `TriggerActivityPort` pattern, or a wider shared port.
    rationale: >-
      A narrow port names only the calls that one file needs, so a test can replace it
      with a small mock adapter. A shared port serves several files that need the same
      calls, so the code does not grow many ports that are almost the same.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-004
    adr:
    - ADR-0009
  - id: ARCH-01-005
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Production adapters (HTTP routes, CLI commands, MCP server, background workers)
      MUST NOT import from `vultron/demo/`.
    rationale: The demo layer contains simplified, non-production implementations of actors and data handling. Importing it
      in production adapters silently pulls in demo behaviour and dummy data, and couples production code to a layer with
      no stability guarantees.
  - id: ARCH-01-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      This codebase MUST treat demo-layer modules as test-only code at runtime, outside
      the production dependency graph.
    rationale: >-
      Demo modules hold simplified actors and dummy data, and they have no stability
      promise. If a production process loads them by any route, it runs that code in
      production.
    relationships:
    - rel_type: extends
      spec_id: ARCH-01-005
  - id: ARCH-01-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Demo-layer modules (`vultron/demo/**`) MUST NOT import from the legacy simulator
      package (`vultron/bt/**`). The one exception is the unified demo CLI aggregator,
      `vultron/demo/cli.py` (DC-01-001).
    rationale: >-
      `vultron/demo/` demonstrates the production protocol, and `vultron/bt/` is the
      frozen legacy simulator that is to be retired (see `notes/codebase-structure.md`
      "Module Boundary"). `cli.py` is exempt as a thin aggregator: it is the one
      documented bridge to the bt-tree demos (pacman, robot, cvd), which it shows as a
      sub-group. Derives from ADR-0009 (hexagonal).
    adr:
    - ADR-0009
  - id: ARCH-01-009
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The demo logic modules (`vultron/demo/scenario/`, `vultron/demo/exchange/`,
      `vultron/demo/helpers/` and `vultron/demo/fuzzer/`) MUST stay free of any
      `vultron/bt/` import.
    rationale: >-
      The CLI aggregator is the one bridge to the legacy demos. If a logic module
      imports the legacy simulator, demo logic depends on code that is to be retired.
      That undoes the decoupling that `vultron/demo/fuzzer/` exists to give.
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-006
    adr:
    - ADR-0009
- id: ARCH-02
  title: SemanticIntent Enum
  specs:
  - id: ARCH-02-001
    priority: MUST
    kind: project
    statement: The `MessageSemantics` enum (`SemanticIntent`) MUST be defined in the domain layer, not in the wire layer
    rationale: >-
      Core code dispatches on `MessageSemantics`. If the enum is defined in the wire
      layer, core must import wire to dispatch, and ARCH-01-001 forbids that import. The
      semantic extractor in the wire layer can still produce the enum values, because
      the wire layer may import core models (ARCH-22-001).
    verification: Inspection of `vultron/core/` confirms `MessageSemantics` (or `SemanticIntent`) is defined there,
      and no definition of this enum exists under `vultron/wire/`.
    adr:
    - ADR-0009
- id: ARCH-03
  title: Semantic Extractor
  specs:
  - id: ARCH-03-001
    priority: MUST
    kind: project
    statement: 'AS2 vocabulary MUST be mapped to domain concepts in exactly one location: the semantic extractor'
    rationale: >-
      When one module maps AS2 vocabulary to domain concepts, a change in the wire
      format changes only that module. If a second module also does the mapping, the two
      can disagree, and one message can mean different things in different parts of the
      code. The semantic extractor reads the AS2 form, so it is in `vultron/wire/`,
      which may import core models (ARCH-22-001, ADR-0099).
    verification: Inspection of `vultron/wire/` confirms that AS2-to-domain vocabulary mapping logic appears only in
      the semantic extractor module and in no other location.
    adr:
    - ADR-0099
- id: ARCH-04
  title: Driven Adapter Injection
  specs:
  - id: ARCH-04-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Driven adapters (persistence, delivery queue, DNS resolver, HTTP delivery) MUST be injected into core services
      via port interfaces
    rationale: Enables testing core logic with in-memory ports and swapping production backends without touching domain code
  - id: ARCH-04-002
    priority: MUST
    kind: project
    statement: >-
      `SyncActivityPort` MUST be defined as a `typing.Protocol` in
      `vultron/core/ports/sync_activity.py` with fire-and-forget methods, one
      per sync activity it builds: `send_reject_log_entry(entry, tail_hash,
      actor_id, to)`, `send_genesis_replay_reject(case_id, copy_tail_hash,
      actor_id, to)`, `send_read_ledger_entry(case_id, ledger_position,
      actor_id, to)` and
      `send_announce_log_entry(entry, actor_id, to)`. `send_announce_log_entry`
      reports whether a row was queued (`bool`; `False` when an identical row was
      already pending, SYNC-15-012); callers need not use the result, and no other
      value crosses the port back into core.
    rationale: >-
      Sync use cases must send ledger activities, but core must not import wire types
      (ARCH-01-001). This port lets core give domain objects to an adapter, which builds
      and queues each wire activity. Core gets nothing back from the port except one
      `bool` from `send_announce_log_entry`. That value lets a replay count only the
      rows that it really queued (SYNC-15-011), with no core read of the outbox
      (DL-06-001). See ADR-0112.
    verification: >-
      `test/adapters/driven/test_sync_adapter_pending_dedup.py` exercises the boolean
      result of `send_announce_log_entry`; `test/core/behaviors/sync/nodes/test_replay.py`
      confirms `SendMissingEntriesNode` reaches the outbox only through the port.
    relationships:
    - rel_type: implements
      spec_id: ARCH-04-001
      note: SyncActivityPort is the specific driven port for sync outbound activities
    - rel_type: implements
      spec_id: ARCH-01-001
      note: Eliminates wire imports from core sync use cases
    - rel_type: uses_definition
      spec_id: SYNC-15-012
  - id: ARCH-04-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The concrete adapter (`SyncActivityAdapter`) MUST be implemented in
      `vultron/adapters/driven/sync_activity_adapter.py` and own the full
      domain → wire → persist → outbox pipeline.
    rationale: >-
      Concentrating the full domain → wire → persist → outbox pipeline in the
      adapter keeps wire concerns out of core and satisfies the baton-pass pattern.
  - id: ARCH-04-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Core use cases and BT nodes MUST call only the `SyncActivityPort` methods.
    rationale: >-
      Calling only port methods enforces the hexagonal boundary and enables
      testing core logic with mock adapters.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-04-002
  - id: ARCH-04-005
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Core use cases and BT nodes MUST NOT import wire types (`CaseLedgerEntry`,
      `WireCaseLedgerEntry`) or wire factory functions (`announce_log_entry_activity`,
      `reject_log_entry_activity`).
    rationale: >-
      Wire type imports in core violate the hexagonal boundary; all wire concerns
      are handled exclusively by the SyncActivityAdapter.
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
- id: ARCH-05
  title: Connector Plugins
  specs:
  - id: ARCH-05-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Core MUST NOT import a connector plugin (tracker integration) directly.
    rationale: >-
      A connector integrates one external tracker. If core imports a connector, core
      depends on that tracker's code, and ARCH-01-001 forbids a core dependency on any
      external system.
  - id: ARCH-05-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      This codebase MUST discover connector plugins through Python entry points
      (`importlib.metadata`).
    rationale: >-
      Each deployment installs a different set of connectors. Discovery through entry
      points lets a site add or remove a connector with no change to Vultron code.
    relationships:
    - rel_type: implements
      spec_id: ARCH-05-001
  - id: ARCH-05-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Connector plugins MUST translate only — no case handling logic, authorization, or journal management belongs
      in a connector
    rationale: >-
      A connector is an adapter: it translates between a tracker's format and Vultron
      domain types. Case logic, authorization and the case ledger belong in core, where
      one implementation serves every connector. If a connector holds any of them, two
      connectors can make different decisions for the same case, and a tracker becomes a
      way around the core rules.
- id: ARCH-06
  title: Wire Layer Replaceability
  specs:
  - id: ARCH-06-001
    priority: SHOULD
    kind: architecture
    statement: The wire layer (`wire/as2/`) SHOULD be replaceable as a unit without touching the core or adapter layers
    rationale: >-
      AS2 is one encoding of the protocol. If core or the adapters depend on the
      internals of the wire layer, a change of encoding must also change them. When the
      wire layer can be replaced as one unit, a change of encoding stays in that layer.
- id: ARCH-07
  title: Handler Isolation
  specs:
  - id: ARCH-07-001
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: Handler functions MUST NOT re-invoke semantic extraction
    rationale: >-
      Semantic extraction runs once, in the wire pipeline, before dispatch
      (ARCH-03-001), and the handler receives its result. If a handler runs extraction
      again, the two results can differ. The handler can then act on a meaning different
      from the one that selected it in the dispatcher.
- id: ARCH-08
  title: Driving Adapter Boundary
  specs:
  - id: ARCH-08-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Driving adapters (HTTP inbox, CLI, MCP server) MUST invoke the wire pipeline before calling into the core
    rationale: Any driving adapter that needs to ingest AS2 can reuse the wire pipeline; there is no duplication
  - id: ARCH-08-002
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      A driving adapter MUST promote an incoming wire object to its most-specific domain
      type before it passes the object into the core.
    rationale: Promoting at the boundary ("validate at edge") ensures that core handlers receive fully typed objects and never
      need to downcast or call `isinstance()` to recover type information that was present on the wire. Deferring promotion
      into the core violates the hexagonal principle that adapters adapt, cores compute.
    relationships:
    - rel_type: extends
      spec_id: ARCH-08-001
    - rel_type: refines
      spec_id: CS-10-001
  - id: ARCH-08-003
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      Code that calls into the core MUST NOT pass it a bare `BaseObject` or generic
      `BaseModel` when the wire payload determines a more specific type.
    rationale: >-
      A core handler that gets a generic object must downcast it, or call
      `isinstance()`, to recover a type that the wire payload already gave. Those checks
      then spread through core code, although that work belongs to the adapters.
    relationships:
    - rel_type: extends
      spec_id: ARCH-08-002
- id: ARCH-12
  title: Core Object Hierarchy
  rationale: >-
    The core classes are the object model, and AS2 is a serialization of them
    (ADR-0099). Core and the wire layer thus have separate roots, and each root holds
    only what its own branch needs. Two class hierarchies for one concept need
    translation code, and translation code drifts. These rules keep one class for each
    domain concept.
  specs:
  - id: ARCH-12-001
    priority: MUST_NOT
    kind: project
    statement: >-
      A wire-branch class MUST NOT inherit from a core class. `as_Base` stands on
      `pydantic.BaseModel` directly, so the wire branch inherits no core field, configuration,
      or registration hook. A domain type's `as_*` name is an alias of its core class
      (ARCH-25-003), not a subclass of it.
    rationale: >-
      If a wire class inherits from a core class, it also inherits core configuration
      and registration. A wire type can then register in a core registry, and the core
      root must stay lenient so that the wire class can parse loose inbound data. The
      wire base describes AS2 vocabulary that core does not model, and everything that
      core does model is the core class itself (ARCH-25-003). The two branches thus have
      nothing to share.
    adr:
    - ADR-0099
    verification: >-
      `test_wire_vocabulary_inherits_nothing_from_core` in
      `test/architecture/test_hierarchy_invariants.py` asserts no `VOCABULARY` class has a
      `vultron.core` class in its MRO, and `test_as_base_stands_directly_on_base_model` in
      `test/wire/as2/vocab/base/test_wire_base_hierarchy.py` pins `as_Base.__bases__`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-25-004
  - id: ARCH-12-002
    priority: MUST
    kind: project
    statement: >-
      Every core model MUST descend from one of exactly two root classes. `CoreRecord`
      carries identity only (`id_`, `type_`, `name`). It is the base for internal
      records never serialized as AS2, such as dead-letter and offer records.
      `CoreObject(CoreRecord)` is the one AS2 object root. It declares every AS2 Object
      field, unused ones included (ARCH-25-008).
    rationale: >-
      Some core types have an AS2 form, and others are internal records that never go on
      the wire. Two roots make this difference part of the type. The rendering port
      accepts a `CoreObject` and refuses a bare `CoreRecord` (ARCH-20-003), so an
      internal record cannot go into a delivered payload by mistake. A third level of
      root would add a distinction that no code uses.
    adr:
    - ADR-0099
    verification: >-
      `TestCoreRoots` in `test/architecture/test_hierarchy_invariants.py` asserts
      `CoreObject.__bases__ == (CoreRecord,)`, that `CoreRecord` declares only the identity
      fields, that the retired middle-level names are absent, and that both dead-letter records
      are `CoreRecord`s without `@context` or timestamps.
    relationships:
    - rel_type: refines
      spec_id: ARCH-25-019
    - rel_type: refines
      spec_id: ARCH-25-008
  - id: ARCH-12-003
    priority: MUST
    kind: project
    statement: >-
      Each core type MUST resolve `extra="forbid"` through its `model_config`, so that
      an unrecognised key raises and is not discarded.
    verification: >-
      `test/architecture/test_core_extra_forbid.py` asserts every `CoreObject` subclass
      resolves `extra="forbid"`, with no exemption list.
      `test/architecture/test_core_record_refuses_unknown_keys.py` asserts the same, and
      that an unknown key is refused and a dump round-trips, for every stored
      `CoreRecord`. Neither may be marked `xfail`.
    rationale: >-
      Pydantic v2 ignores unknown keys by default. Without `extra="forbid"`, a payload
      with an unknown key loses it with no error, and a participant's RM state can
      reset with no trace. The ban also catches typos, renamed fields and stale keys.
      A received activity reaches a core class only after `parse_activity` has handled
      its unknown keys, so the ban does not decide a peer's extension property
      (MV-11-004).
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-23-005
      note: ARCH-23-005 supplies the round-trip cleanups (computed-field stripping, wire-name keys) without which `extra="forbid"`
        rejects the project's own serialised output.
    adr:
    - ADR-0082
    - ADR-0099
  - id: ARCH-12-013
    priority: MUST
    kind: project
    statement: >-
      Each `CoreObject` subclass MUST carry the AS2 field spelling as its own
      serialization form, through the `alias_generator=to_camel` it inherits from
      `CoreObject` (ARCH-25-002). A `by_alias` dump of a core object is thus its AS2
      form.
    rationale: >-
      One spelling on one class makes the dump of a core object its AS2 form. The
      rendering port can then be a plain dump (ARCH-20-002), with no second translation
      that can drift.
    verification: >-
      `test_every_core_vocabulary_entry_spells_the_as2_envelope_in_camel_case` in
      `test/core/models/test_core_object.py` asserts the AS2 spelling of the shared
      envelope fields (`mediaType`, `startTime`, `endTime`, `attributedTo`,
      `inReplyTo`) for every `CORE_VOCABULARY` entry. It may not be marked `xfail`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-25-002
    adr:
    - ADR-0063
    - ADR-0099
  - id: ARCH-12-014
    priority: MUST_NOT
    kind: project
    statement: Core types MUST NOT register in the wire `VOCABULARY`.
    rationale: >-
      The wire `VOCABULARY` holds the classes for AS2 vocabulary that core does not
      model. If a core type registers there, a wire lookup can return a core class, and
      the wire and core registries no longer have disjoint keys (ARCH-23-002).
    verification: >-
      `test_all_vocabulary_are_as_base_subclasses` in
      `test/architecture/test_hierarchy_invariants.py` keeps core types out of
      `VOCABULARY`. It may not be marked `xfail`.
    adr:
    - ADR-0099
  - id: ARCH-12-015
    priority: MUST_NOT
    kind: project
    statement: >-
      Core types MUST NOT store `@context` as a serialized field. `CoreObject.context_`
      stays `exclude=True`, and the `by_alias` serializer of `CoreObject` supplies
      `@context` once (VM-10-001).
    rationale: >-
      `@context` belongs to the AS2 document, not to the stored state of an object. If
      a core type stores it as a field, the persistence dump carries it (ARCH-25-001),
      and nested objects can repeat it. One serializer that supplies it gives each AS2
      form exactly one `@context`.
    verification: >-
      `test_context_is_supplied_once_and_not_as_a_core_field` in
      `test/adapters/driven/test_wire_render_adapter.py` pins the `@context` rule. It may
      not be marked `xfail`.
    relationships:
    - rel_type: implements
      spec_id: VM-10-001
    adr:
    - ADR-0063
    - ADR-0099
  - id: ARCH-12-004
    priority: MUST_NOT
    kind: project
    statement: >-
      The wire branch MUST NOT carry domain validators. Wire-branch overrides exist solely for
      AS2 serialization shape (field aliases, `@context`, lenient `Any | None` types).
    rationale: >-
      Domain rules belong in core, where every reader of an object gets the same checks
      (ARCH-01-003). A wire class for AS2 vocabulary that core does not model must parse
      loose inbound data. A domain validator on it could refuse data that core accepts,
      or accept data that core refuses. The `as_*` name of a domain type is its core
      class (ARCH-25-003), so the domain validators of that class already apply when it
      is read from the wire.
    verification: 'Confirmed by `test_no_wire_types_in_core_type_map` (imports wire vocab and asserts no `vultron.wire`
      module class appears in `CORE_TYPE_MAP`) and `test_core_record_types_in_core_type_map` (discovers
      every `CoreRecord` that is not a `CoreObject`, including the dead-letter records
      `DeadLetterRecord` and the adapter''s `OutboxDeadLetterEntry`, and asserts each is reachable
      by class name and Literal value; the subject set is discovered, not listed) in
      `test/architecture/test_hierarchy_invariants.py`. Both MUST NOT be marked `xfail`.'
  - id: ARCH-12-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Wire-branch types MUST register in `VOCABULARY`.
    rationale: >-
      The `VOCABULARY` registry is the wire layer's type-dispatch table; omitting a wire type
      prevents correct AS2 vocabulary lookup and object reconstruction.
  - id: ARCH-12-009
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `CoreObject` subclasses MUST register in `CORE_VOCABULARY` as the DataLayer primary
      reconstruction path.
    rationale: >-
      `CORE_VOCABULARY` is used by `_from_row()` in `SqliteDataLayer`; every entry must be a
      `CoreObject` subclass to guarantee correct domain-object reconstruction from stored rows.
  - id: ARCH-12-010
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Each core type that extends `CoreRecord` but not `CoreObject` MUST register in
      `CORE_TYPE_MAP`, so that core code can find it by type string.
    rationale: >-
      `CORE_TYPE_MAP` catches core records (e.g. `VultronOfferRecord`,
      `VultronPendingCaseInbox`) that carry domain state with no AS2 shape and so are not
      `CoreObject`s.  Those types need a name-keyed lookup for core-layer and persistence
      callers.
  - id: ARCH-12-016
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      A wire-branch caller MUST NOT rely on `CORE_TYPE_MAP` as its path to resolve a
      type (VM-06-008).
    rationale: >-
      The records in `CORE_TYPE_MAP` do not need to answer the `type` lookup of a
      wire-branch caller. A hit there is a coincidence of naming, not a wire
      counterpart.
    relationships:
    - rel_type: extends
      spec_id: ARCH-12-010
  - id: ARCH-12-011
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Wire-branch types MUST NOT register in either core registry (`CORE_VOCABULARY` or
      `CORE_TYPE_MAP`).
    rationale: >-
      Contaminating either core registry with wire types would allow wire-shaped objects to be
      reconstructed via `find_in_vocabulary()`, bypassing the `CORE_VOCABULARY` primary path and
      contradicting ARCH-12-014.
  - id: ARCH-12-006
    priority: MUST
    kind: project
    statement: >-
      `CoreActor` and its subclasses MUST type the `inbox` and `outbox` fields as `str`,
      holding only the URI of the endpoint that the actor's profile states.
    rationale: >-
      Domain logic only ever needs to route to the inbox URI. The full collection shape
      is an AS2 protocol concern, not a domain concern.
    verification: >-
      `test/wire/as2/vocab/base/test_actor_endpoints.py::test_core_actor_reduces_an_addressed_arrival_to_the_url`
      asserts an addressed endpoint reduces to its URI on the core actor.
  - id: ARCH-12-017
    priority: MUST
    kind: project
    statement: >-
      `CoreActor` MUST hold `None` for an `inbox` or `outbox` that the actor's profile
      leaves absent or blank, never an address derived from `id_` (AKM-02-006).
    rationale: >-
      An address derived from the id would be a value nobody asserted (ADR-0159). A
      hosted actor states its own endpoints when it is created, so its profile carries
      both, as ActivityPub requires. Delivery derives an inbox address only when none is
      held (OX-12-009).
    verification: >-
      `test_core_actor_derives_no_endpoint_it_was_not_given` and
      `test_core_actor_reads_an_empty_endpoint_as_absent` in
      `test/wire/as2/vocab/base/test_actor_endpoints.py` assert an absent, `None` or
      blank endpoint stays absent.
    relationships:
    - rel_type: extends
      spec_id: ARCH-12-006
  - id: ARCH-12-018
    priority: MUST_NOT
    kind: project
    statement: >-
      Core-branch actor types MUST NOT carry the AS2 `OrderedCollection` wrapping of an
      endpoint.
    rationale: >-
      The collection wrapping is a wire-only serialization concern. Core routes to the
      endpoint URI and needs nothing else from the collection.
    verification: >-
      `test/wire/as2/vocab/base/test_actor_endpoints.py::test_core_actor_reduces_an_addressed_arrival_to_the_url`
      asserts that an endpoint arriving as an `OrderedCollection` reduces to its URI on
      the core actor.
    relationships:
    - rel_type: derives_from
      spec_id: ARCH-12-006
  - id: ARCH-12-007
    priority: MUST
    kind: project
    statement: >-
      Each protocol-significant core class, such as a case, report, participant or
      actor, MUST inherit from `CoreObject`, or from `CoreRecord` when it has no AS2
      shape.
    rationale: >-
      Consistent use of the core object hierarchy ensures that all protocol-significant
      domain objects share aligned field names, are rendered to AS2 form by the
      rendering port (ARCH-20-001) without per-type projection code, and are
      discoverable via `CORE_VOCABULARY`.
    verification: >-
      `TestCoreVocabularyHierarchy::test_all_core_vocabulary_are_core_object_subclasses`
      in `test/architecture/test_hierarchy_invariants.py` fails on a `CORE_VOCABULARY`
      class that does not inherit from `CoreObject`.
  - id: ARCH-12-019
    priority: MAY
    kind: project
    statement: >-
      A core class MAY stay a plain `BaseModel` subclass when it holds only local
      configuration, a transient dispatch envelope or an internal record. The record
      qualifies only if it is never shared across the wire.
    rationale: >-
      Such a class never goes on the wire and is never stored as a domain object, so
      the core object hierarchy gives it nothing but extra fields and registration.
  - id: ARCH-12-020
    priority: MUST
    kind: project
    statement: >-
      Each plain `BaseModel` subclass under `vultron/core/` MUST carry a docstring that
      says why it stays outside the core object hierarchy. A docstring inherited from a
      plain core base counts.
    rationale: >-
      A plain `BaseModel` class is the exception, not the default. A stated reason
      shows that the choice was made on purpose, so a class does not leave the
      hierarchy by accident as the codebase changes.
    verification: >-
      `test_every_plain_core_model_has_a_docstring` in
      `test/architecture/test_core_plain_models_documented.py` asserts that each class
      under `vultron/core/` that subclasses `BaseModel` but not `CoreRecord` has a
      docstring, its own or a plain core base's. Review confirms that the docstring
      gives the reason.
- id: ARCH-09
  title: Domain Model Richness Constraint
  specs:
  - id: ARCH-09-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Core domain models MUST be as rich as or richer than their wire-layer counterparts
    rationale: A thinner core model forces piecemeal additions as handlers are implemented, causing boundary leakage and implementation
      drift
  - id: ARCH-09-002
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST define the actor domain models in `vultron/core/models/`:
      `CoreActor` and its subclasses `VultronPerson`, `VultronOrganization`,
      `VultronService`, `VultronApplication` and `VultronGroup`.
    rationale: >-
      With the actor classes in core, core code uses them with no wire import, and the
      AS2 form of an actor is the serialization of its class (ADR-0099).
    verification: >-
      Inspection confirms that `VultronPerson`, `VultronOrganization`, `VultronService`,
      `VultronApplication` and `VultronGroup` are defined in
      `vultron/core/models/actor.py`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-09-001
  - id: ARCH-09-003
    priority: MUST_NOT
    kind: project
    statement: >-
      The wire layer (`vultron/wire/as2/`) MUST NOT define a second class for an actor
      domain model. Its `as_Vultron*` actor names alias the core classes (ARCH-25-003).
    rationale: >-
      An actor has one class, its core class (ARCH-25-003). If the wire layer defines a
      second actor class, the two can drift apart, and code can use the wrong one.
    verification: >-
      `test_every_wire_name_for_a_domain_type_is_its_core_class` in
      `test/architecture/test_hierarchy_invariants.py` asserts that every `as_<Name>`
      the wire layer binds for a core domain class, the actor classes included, is that
      class itself.
    relationships:
    - rel_type: refines
      spec_id: ARCH-25-003
- id: ARCH-10
  title: Fail-Fast Domain Objects
  specs:
  - id: ARCH-10-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Domain events and domain models MUST validate required fields at construction time and fail immediately if
      required invariants are not satisfied
    rationale: Late validation masks missing data and makes debugging harder; fail-fast ensures errors surface at the point
      of construction
    adr:
    - ADR-0032
- id: ARCH-15
  title: Fail-Fast at Domain Operation Boundaries
  description: Governs relational invariants enforced at runtime entry points — use-case execute(), BT node update(), and
    helper functions that require non-None resolved values. Extends the construction-time fail-fast rule to cover checks that
    can only be performed at the point of invocation, not at object construction.
  specs:
  - id: ARCH-15-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A BT node's `update()` MUST return `Status.FAILURE`, not `Status.SUCCESS`, when a
      required blackboard key is absent or resolves to `None`.
    rationale: 'Status.SUCCESS on a missing required input causes the BT sequence to continue as if the node succeeded, masking
      the failure and producing ledger gaps, dropped broadcasts, and mis-routed activities. See notes/domain-validation.md
      and ADR-0032.'
    adr:
    - ADR-0032
  - id: ARCH-15-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'A helper function that requires a non-None ID MUST check the result
      and raise VultronValidationError immediately. The strict guarantee lives in the
      caller or the helper itself — never deferred silently to downstream code.'
    rationale: 'Returning None from a helper that conceptually requires a valid ID moves the error from the point of failure
      to the point of use, making stack traces and logs point to the wrong location. See notes/domain-validation.md and ADR-0032.'
    adr:
    - ADR-0032
  - id: ARCH-15-004
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      Each domain helper function MUST have exactly one canonical copy, with no second
      implementation of the same logic.
    rationale: >-
      When one helper has two copies, a fix to one copy does not reach the other, and
      the copies drift apart in their behavior. Callers then get different answers to
      the same question, for example different handling of a missing value. One copy in
      a known place lets every caller share each fix. See notes/domain-validation.md and
      ADR-0032.
    adr:
    - ADR-0032
  - id: ARCH-15-005
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      A layer-neutral domain helper, one with no dependency above `models/`, MUST live
      in `vultron/core/models/_helpers.py`.
    rationale: >-
      A fixed place for each kind of helper lets a developer find the existing copy
      before writing a new one. A layer-neutral helper in `models/` can serve every
      layer above it. A use-case-specific helper belongs in
      `vultron/core/use_cases/_helpers.py`.
    relationships:
    - rel_type: implements
      spec_id: ARCH-15-004
    adr:
    - ADR-0032
- id: ARCH-11
  title: Port Inbound/Outbound Discrimination
  specs:
  - id: ARCH-11-001
    priority: SHOULD
    kind: architecture
    statement: Core ports SHOULD be organized into inbound (driving) and outbound (driven) categories
    rationale: >-
      Adapters call driving ports, and core calls driven ports. The two kinds have
      different rules for who implements them and who calls them. When the ports are
      grouped by direction, a reader can see which rules apply to a port, and can find a
      port that is in the wrong place.
- id: ARCH-14
  title: Wire Vocabulary Object Naming Convention
  rationale: >-
    A wire class with a bare domain name shadows the core model of the same name. A
    developer or agent can then use the wrong class, or add a wire import to core code.
    The `as_` prefix shows a wire class at a glance. The `as_*` name of a domain type is
    an alias of its core class (ARCH-25-003). The prefix still marks a separate wire
    class for AS2 vocabulary that core does not model.
  specs:
  - id: ARCH-14-001
    priority: MUST
    kind: project
    statement: All Vultron-specific wire vocabulary classes defined in `vultron/wire/as2/vocab/objects/` MUST use the `as_`
      prefix (e.g., `as_VulnerabilityCase`, `as_CaseParticipant`, `as_CaseStatus`). This extends the existing `as_` naming
      convention — already applied to base ActivityStreams types (`as_Activity`, `as_Actor`, `as_Object`) — to all Vultron-specific
      wire objects in that package.
    rationale: Without the `as_` prefix, wire objects shadow identically-named core domain models, making it ambiguous which
      `VulnerabilityCase` a developer or agent is working with. The `as_` prefix makes the layer boundary unambiguous at a
      glance and enables automated detection of violations.
    verification: Architecture test in `test/architecture/` asserts that no class in `vultron/wire/as2/vocab/objects/` shares
      a name with any class in `vultron/core/models/`.
  - id: ARCH-14-002
    priority: MUST
    kind: project
    statement: The wire-layer base class for all Vultron-specific AS2 objects MUST be named `as_VultronObject`. This carries
      the `as_` prefix ARCH-14-001 requires and drops the redundant "AS2" qualifier, since the prefix already connotes the
      wire layer.
    rationale: >-
      Every other wire class has the `as_` prefix (ARCH-14-001), so a base class without
      it breaks the convention that tells a reader which layer a class is in. The prefix
      already shows that the class is in the wire layer, so an "AS2" part in the name
      adds nothing.
    verification: '`vultron/wire/as2/vocab/objects/base.py` exports `as_VultronObject`; no class named `VultronAS2Object`
      exists anywhere in the codebase.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-14-001
  - id: ARCH-14-003
    priority: MUST
    kind: project
    statement: '`TypeAlias` companion types (wire-layer reference unions, e.g., `VulnerabilityCaseRef`) MUST also use the
      `as_` prefix (e.g., `as_VulnerabilityCaseRef`, `as_CaseParticipantRef`).'
    rationale: 'Companion aliases that do not follow the `as_` naming convention undermine the goal of ARCH-14-001: an import
      of `VulnerabilityCaseRef` is just as ambiguous as importing `VulnerabilityCase` from the wire layer.'
    verification: No `TypeAlias` variable in `vultron/wire/as2/vocab/objects/` uses a name that matches a core model name
      without the `as_` prefix.
- id: ARCH-13
  title: DataLayer Scope Contract
  specs:
  - id: ARCH-13-003
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST open a DataLayer under the actor's canonical URI, `actor.id_`,
      never under a short ID, a URL path segment or another derived identifier.
    rationale: >-
      Each actor has its own store, and the actor identity selects the store (ADR-0073).
      If two spellings of one actor identity reach the store factory, they open two
      different stores. Data written under one spelling is then missing under the other,
      and the actor reads an empty store. The canonical URI is the one spelling that
      every component knows.
    verification: >-
      `test/adapters/driving/fastapi/test_deps.py` asserts that the store `get_actor_dl`
      opens can read the outbox entries that the actor's own writes went to.
    adr:
    - ADR-0073
  - id: ARCH-13-006
    priority: MUST
    kind: project
    statement: >-
      A driving adapter MUST resolve a path segment in a request to the actor's
      canonical URI before it opens the store.
    rationale: >-
      A request names an actor by a path segment, which is not the canonical URI. The
      store factory then gets a second spelling of the actor identity unless the
      adapter resolves it first (ADR-0073).
    verification: >-
      `test/adapters/driving/fastapi/test_deps.py` asserts that `get_actor_dl` resolves
      a short path segment to the canonical URI.
      `test/adapters/driving/fastapi/routers/test_trigger_case.py` asserts the same
      through the `get_trigger_dl` chain of the trigger routes.
    relationships:
    - rel_type: implements
      spec_id: ARCH-13-003
    adr:
    - ADR-0073
- id: ARCH-16
  title: App State Isolation
  specs:
  - id: ARCH-16-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      `create_app()`, or any equivalent application factory, MUST NOT change
      module-level singletons, global registries or process-wide shared state.
    rationale: >-
      Tests and demos call `create_app()` more than one time in one process. If the
      factory changes module-level state, each new app inherits the changes that the
      first app made, and the tests are not isolated. This applies to vocabulary
      registries, DataLayer factories, BT bridges, actor caches and every other mutable
      global.
  - id: ARCH-16-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `create_app()` MUST scope all per-application state to the app instance it returns
      or to the lifespan context of that app.
    rationale: >-
      Each app then owns its own state. A second app in the same process starts clean,
      and the state of an app goes away with it.
    relationships:
    - rel_type: extends
      spec_id: ARCH-16-001
- id: ARCH-17
  title: ASGIEmitter Base URL
  description: >-
    SUPERSEDED by ADR-0042 / outbox.yaml OX-12. The ASGIEmitter in-process delivery
    shortcut has been retired in favour of uniform HTTP delivery for all inter-actor
    communication. These requirements are retained for historical traceability only and
    no longer describe the delivery architecture; do not implement against them.
  specs:
  - id: ARCH-17-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The `ASGIEmitter` base URL MUST hold only the scheme and netloc components (e.g.
      `https://example.org`), with no path prefix, trailing slash or mount-point segment.
    rationale: >-
      The emitter strips the mount prefix from request paths before it builds outbound
      URLs, so a prefix in the base URL is applied twice.
      A base URL with a path prefix, such as `https://example.org/api`, joined with a
      request path such as `/api/actors/…`, gives
      `https://example.org/api/api/actors/…`, which is an address that does not exist.
      The `ASGIEmitter` is removed (ADR-0042), so no code now depends on this
      requirement (see the group description).
  - id: ARCH-17-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `ASGIEmitter` MUST detect re-entrant emission with a `contextvars.ContextVar[int]`
      guard, not a `threading.Lock` or a boolean flag. A re-entrant emission is an
      emitter call from a handler that an earlier emission invoked.
    rationale: A `threading.Lock` guard would deadlock when the re-entrant call happens on the same thread (common in async/ASGI
      contexts). A `ContextVar` is task-local and correctly tracks reentrancy per async task without thread-lock semantics.
  - id: ARCH-17-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`ASGIEmitter` MUST raise `EmitterReentrancyError` on a re-entrant emission.'
    rationale: >-
      A re-entrant emission can loop with no end. A named error stops it and shows
      where it started.
    relationships:
    - rel_type: extends
      spec_id: ARCH-17-002
- id: ARCH-18
  title: Architecture Ratchet Discipline
  specs:
  - id: ARCH-18-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: 'Architecture boundary tests that enforce a `KNOWN_VIOLATIONS` allowlist MUST use a bidirectional equality
      assertion: `assert actual_violations == KNOWN_VIOLATIONS`. One-directional subset assertions (`assert actual ⊆ KNOWN`)
      are prohibited because they allow the violation count to grow silently.'
    rationale: A subset assertion says "we have at most these violations" but allows new ones to be added without failing
      the test. Bidirectional equality says "we have exactly these violations" — any addition fails immediately, and any removal
      must be reflected in the allowlist.
  - id: ARCH-18-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The commit that resolves a known architectural violation, by removing or
      refactoring the file or import, MUST remove its entry from the
      `KNOWN_VIOLATIONS` allowlist.
    rationale: >-
      The exact-set check (ARCH-18-001) fails as soon as a listed violation is gone. A
      removal in the same commit keeps the allowlist equal to the real violations at
      every commit.
    relationships:
    - rel_type: derives_from
      spec_id: ARCH-18-001
  - id: ARCH-18-006
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A `KNOWN_VIOLATIONS` allowlist MUST NOT keep an entry that no longer matches a
      real violation.
    rationale: >-
      Stale entries hide the true state of the architecture boundary. A fixed violation
      that stays listed makes the ratchet look tighter than it is. It also hides a
      regression when a new violation with the same name appears later.
    relationships:
    - rel_type: extends
      spec_id: ARCH-18-002
  - id: ARCH-18-003
    priority: MUST
    kind: process
    statement: >-
      Each non-empty ratchet baseline under `test/` MUST carry an `# owner: #N` comment
      that names the GitHub issue that owns driving it to its terminal value. A
      baseline is an allowlist, exclusion set or numeric ceiling not at its terminal
      value.
    rationale: >-
      A ratchet records what is exempt but not who retires it. When the issue that
      created a baseline closes with entries left, the debt becomes invisible and the
      test stays green. MS-10-006 already imposes this rule on the spec-corpus
      ceilings; this extends it to every baseline.
    verification: >-
      `test_every_non_empty_baseline_names_an_owner` in
      `test/architecture/test_ratchet_baselines_name_an_owner.py` scans `test/` for
      ratchet-named constants (`KNOWN_*`, `*_BASELINE`, `MAX_*`, `*_EXEMPTIONS`) and
      fails when one is non-empty and carries neither marker. It makes no network call.
      `test_a_non_empty_baseline_with_no_marker_fails` in
      `test/metadata/test_ratchet_markers.py` proves the check fires.
    lint_suppress:
    - phantom_path_ref
  - id: ARCH-18-007
    priority: MUST
    kind: process
    statement: >-
      A permanent-by-design baseline MUST carry a `# permanent: <reference>` comment,
      not an owner comment, citing the issue, ADR or spec requirement behind it.
    rationale: >-
      The permanent marker keeps a pinned exemption set from needing an invented owner.
      It also keeps the decision behind the set citable.
    verification: >-
      `test_a_permanent_marker_that_cites_nothing_fails` in
      `test/metadata/test_ratchet_markers.py` fails a `# permanent:` marker that cites
      nothing, and `test_every_non_empty_baseline_names_an_owner` in
      `test/architecture/test_ratchet_baselines_name_an_owner.py` applies that check to
      every baseline under `test/`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-18-003
  - id: ARCH-18-004
    priority: SHOULD
    kind: process
    statement: >-
      A CI job outside the merge path SHOULD query GitHub for the state of every issue
      that an `# owner: #N` comment cites.
    rationale: >-
      Only GitHub knows whether an owner is still open, so this check cannot
      run in the unit suite.
    verification: >-
      `test_runs_on_a_schedule_and_on_demand_never_on_pull_requests` in
      `test/ci/test_ratchet_baseline_owner_check.py` asserts the workflow runs outside
      the merge path, and inspection of the scheduled workflow confirms it reads issue
      state through the GitHub API.
    relationships:
    - rel_type: extends
      spec_id: ARCH-18-003
    lint_suppress:
    - phantom_path_ref
  - id: ARCH-18-008
    priority: SHOULD
    kind: process
    statement: >-
      When an owner issue that a baseline cites is closed, the ARCH-18-004 job SHOULD
      file or update one tracking issue that lists the affected baselines.
    rationale: >-
      One tracking issue gathers every baseline that lost its owner, so a person can
      find and re-own them in one place.
    verification: >-
      `test_one_tracking_issue_is_filed_or_updated_then_closed` and
      `test_the_tracking_issue_lists_the_report_the_script_wrote` in
      `test/ci/test_ratchet_baseline_owner_check.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-18-004
  - id: ARCH-18-009
    priority: MUST_NOT
    kind: process
    statement: The ARCH-18-004 job MUST NOT fail the build on a closed owner.
    rationale: >-
      Failing the build on it would turn `main` red when an unrelated issue closes,
      which no pull request caused. This is the same race a two-directional count pin
      produces when two pull requests land together.
    verification: >-
      `test_a_closed_owner_never_fails_the_build` in
      `test/ci/test_ratchet_baseline_owner_check.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-18-004
  - id: ARCH-18-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A **ratchet** is a baseline under `test/` that an `# owner: #N` issue drives to an
      empty set or a zero ceiling. A **pinned exemption set** is an exact set with no
      terminal value, kept equal to reality in both directions (ARCH-18-001,
      ARCH-18-002). Its entries are exempt by a recorded decision, not waiting for a
      fix. Only a ratchet counts as open debt. A pinned exemption set MUST carry the
      `# permanent:` marker of ARCH-18-007.
    rationale: >-
      Only a ratchet is open debt. A reader who counts open debt must thus know which
      exact sets are ratchets and which are permanent. Both kinds use the same equality
      check in both directions. The difference is whether an end state exists, so the
      marker must state it.
    relationships:
    - rel_type: refines
      spec_id: ARCH-18-007
    - rel_type: uses_definition
      spec_id: ARCH-18-001
    - rel_type: uses_definition
      spec_id: ARCH-18-002
  - id: ARCH-18-010
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The comment and module docstring of a pinned exemption set MUST call that
      constant a pinned exemption set, not a ratchet or a backlog.
    rationale: >-
      A reader who counts open debt reads the comment and the docstring. If they call a
      pinned set a ratchet or a backlog, the reader counts permanent exemptions as
      debt.
    relationships:
    - rel_type: extends
      spec_id: ARCH-18-005
  - id: ARCH-18-011
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A pinned exemption set entry that waits for a fix MUST move to its own ratchet
      constant with an `# owner: #N` marker.
    rationale: >-
      If a pinned set holds an entry that waits for a fix, that debt is hidden in a set
      that nobody plans to empty.
    relationships:
    - rel_type: extends
      spec_id: ARCH-18-005
- id: ARCH-19
  title: Outbound Delivery Pipeline
  specs:
  - id: ARCH-19-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      Outbound delivery MUST be modelled as a three-stage pipeline consisting
      of Emission, Transport delivery, and Recipient acceptance.
    rationale: 'Conflating stages (e.g., treating a transport timeout as a recipient rejection) leads to incorrect retry logic
      and protocol-state divergence. The three-stage model is the foundation for correct at-least-once delivery. Source: `notes/architecture-adapters.md`.'
  - id: ARCH-19-006
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: Each stage of the outbound delivery pipeline has distinct error semantics and MUST NOT be conflated with another stage.
    rationale: >-
      Treating a transport timeout (stage 2) as a recipient rejection (stage 3) leads to incorrect
      retry logic and protocol-state divergence.
    relationships:
    - rel_type: extends
      spec_id: ARCH-19-001
  - id: ARCH-19-002
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      Emission (stage 1) MUST be idempotent: a second write of the same activity ID
      creates no duplicate outbox entry.
    rationale: >-
      Emission can run again for the same activity, for example after a retry or a
      crash. If each run adds an outbox entry, the recipient gets the same activity more
      than one time, and each copy costs a delivery attempt. One entry for each activity
      ID makes a repeated emission safe.
    relationships:
    - rel_type: extends
      spec_id: ARCH-19-001
  - id: ARCH-19-003
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      This codebase MUST retry transport delivery (stage 2) after a transient network
      failure.
    rationale: >-
      Most network failures are temporary, so a retry usually delivers the activity.
    relationships:
    - rel_type: extends
      spec_id: ARCH-19-001
  - id: ARCH-19-007
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      The outbox worker, not a use case or a handler, MUST hold the retry mechanism for
      transport delivery.
    rationale: >-
      The outbox worker holds each queued activity, so it can retry with no need to run
      the use case again. A retry in a use case or a handler would block that work and
      repeat its protocol logic, although the work is complete when the activity is in
      the outbox.
    relationships:
    - rel_type: implements
      spec_id: ARCH-19-003
  - id: ARCH-19-004
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: A transport delivery failure (stage 2 error) MUST NOT be interpreted as recipient rejection (stage 3 semantics).
      Delivery failure means the activity did not reach the recipient; it carries no information about whether the recipient
      would accept or reject the activity.
    rationale: >-
      A failed delivery tells the sender only that the activity did not arrive. If the
      sender reads it as a rejection, it can change protocol state for a decision that
      the recipient never made. The sender and the recipient then disagree about the
      state of the case.
    relationships:
    - rel_type: derives_from
      spec_id: ARCH-19-001
  - id: ARCH-19-005
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      The outbox worker MUST record each delivery outcome in the per-actor process log
      (Python `logging`), at the level `specs/structured-logging.yaml` prescribes. An
      outcome is a success, a transient failure or a permanent failure.
    rationale: >-
      A delivery outcome is an operational diagnostic. Per-actor transport observability
      goes to the process log (ADR-0019), where an operator can see why an activity did
      not arrive.
    relationships:
    - rel_type: extends
      spec_id: ARCH-19-001
    adr:
    - ADR-0019
  - id: ARCH-19-008
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      The outbox worker MUST NOT write a delivery outcome to the canonical case
      ledger.
    rationale: >-
      The canonical case ledger holds only protocol-significant assertions that the
      CASE_MANAGER authors (ADR-0019). Whether a network call succeeded is an
      operational diagnostic, not such an assertion.
    relationships:
    - rel_type: extends
      spec_id: ARCH-19-005
    adr:
    - ADR-0019
- id: ARCH-20
  title: Core-to-Wire Rendering Port
  description: >-
    Governs how core domain objects are rendered into wire-shaped (AS2 camelCase) JSON. Core
    legitimately needs a wire representation in one place — the `CaseLedgerEntry.payloadSnapshot`,
    which CLP-07-011 requires to be receiver-reconstitutable AS2 — and this group makes a driven
    port the single seam that produces it. Under one object model (ADR-0099) the spelling lives
    on the core class (ARCH-25-002) and a dimension serializes to a bare state value (ARCH-25-005), so
    the port's adapter is a plain `by_alias` dump of the core object; what the group still
    guards is that core code reaches that dump only through the port.
  rationale: >-
    Core must not produce wire shapes itself. If core code renders its own camelCase
    output, that output is a second translation beside the spelling of the class, and
    the two can drift. A driven port is the remedy that ARCH-01-004 prescribes for each
    core need for a wire form, and it gives one place that decides what goes on the
    wire. See ADR-0063 and ADR-0099.
  specs:
  - id: ARCH-20-001
    priority: MUST
    kind: architecture
    statement: >-
      Core code that needs a wire-shaped form of a **core-branch** object MUST get it
      through a driven port in `vultron/core/ports/`, and never produce it itself.
      Producing it itself includes a `model_dump(by_alias=True)` call on a core-branch
      instance and a rewrite of dumped keys into wire spellings. The `alias_generator`
      a core object inherits (ARCH-12-013) is the mechanism behind the port, not a
      licence for core to dump directly. A dump of an `as_Base` wire vocabulary object
      with no core counterpart, such as `as_Link`, is outside this requirement. A
      domain type's `as_*` name is its core class, so it is not such an object. Nor is
      the activity a received handler holds, which the extractor rebuilds as a
      core-branch `VultronActivity`.
    rationale: >-
      A single rendering seam keeps the decision of what goes on the wire (which object, with
      which `@context`, failing closed on anything without an AS2 shape) in one adapter instead
      of at every call site that happens to need camelCase. The requirement is scoped to
      core-branch objects because core legitimately handles wire objects on the verbatim-capture
      path; conflating the two would make this requirement unverifiable.
    verification: >-
      `test/architecture/test_core_by_alias_dumps.py` counts the `by_alias=True` call sites under
      `vultron/core/` per file against an exact baseline, so a new site fails and a removed one
      must be ticked off. The baseline has been empty since #3930: every AS2 shape core needs,
      including a wire object's, comes from the port or from the AS2 JSON the trigger-activity
      port returns for an activity it built.
    relationships:
    - rel_type: extends
      spec_id: ARCH-01-004
    adr:
    - ADR-0063
    - ADR-0099
  - id: ARCH-20-002
    priority: MUST
    kind: project
    statement: >-
      The rendering port's adapter MUST produce its output as the core object's own
      `model_dump(by_alias=True, exclude_none=True, mode="json", serialize_as_any=True)`,
      with no field-name translation of its own.
    rationale: >-
      A second translation path could only drift from the class's own spelling, the
      defect ADR-0063 removes. `serialize_as_any=True`
      renders nested values by runtime type, as every other AS2 path does; without it an inline
      wire object holding an undeclared value type (an IRI `inbox`) is a serializer warning, not
      a rendering (#3930).
    verification: >-
      `test_render_is_the_core_objects_own_alias_dump` and
      `test_render_serialises_nested_values_by_their_runtime_type` in
      `test/adapters/driven/test_wire_render_adapter.py`, and the per-entry goldens in
      `test/adapters/driven/test_wire_render_goldens.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
    - ADR-0099
  - id: ARCH-20-010
    priority: MUST_NOT
    kind: project
    statement: >-
      The rendering port's adapter MUST NOT resolve a wire counterpart, through
      `WIRE_TYPE_MAP`, a pairing registry or a `from_core()` projection.
    rationale: >-
      Under one object model the core object is its own wire form (ARCH-25-001), so a
      counterpart lookup has nothing to find.
    verification: >-
      `test_render_adapter_does_not_resolve_a_wire_counterpart` in
      `test/adapters/driven/test_wire_render_adapter.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-20-002
    adr:
    - ADR-0063
    - ADR-0099
  - id: ARCH-20-003
    priority: MUST
    kind: project
    statement: >-
      The rendering port MUST raise `VultronValidationError` for an object with no AS2
      shape, and not return `None`, a core-shaped dump or a partial rendering. An object
      has no AS2 shape when it is not a `CoreObject`, such as a bare `CoreRecord` like
      an offer or dead-letter record. A missing separate wire class is not a failure.
    rationale: >-
      A payload snapshot in core shape cannot be rebuilt by a receiver (CLP-07-011), and
      at the call site it looks the same as a correct one. An error raised at once shows
      the problem where it starts (ARCH-15-002). The `CoreObject` check stops a
      bookkeeping record such as `VultronOfferRecord` from going into a delivered
      payload. Each core type is its own wire form, so a missing wire class is not a
      reason to refuse.
    verification: >-
      `test/adapters/driven/test_wire_render_adapter.py` asserts the port raises for a
      `CoreRecord` and renders every `CORE_VOCABULARY` entry.
    adr:
    - ADR-0063
    - ADR-0099
  - id: ARCH-20-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      This codebase MUST inject the rendering port into behavior-tree execution as it
      injects `sync_port`. That is a `BTBridge` constructor parameter, published to the
      blackboard under a named key.
    rationale: Consistency with `SyncActivityPort` keeps one injection idiom for driven ports.
    relationships:
    - rel_type: extends
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
  - id: ARCH-20-011
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      BT nodes and use-case helpers MUST NOT import an adapter directly or build a
      default renderer.
    rationale: >-
      An import-time default would bring back the core→wire import that the port exists
      to prevent (ARCH-01-001).
    relationships:
    - rel_type: extends
      spec_id: ARCH-20-004
    adr:
    - ADR-0063
  - id: ARCH-20-005
    priority: MUST
    kind: project
    statement: Core-branch types MUST NOT declare a `to_json()`, `to_wire()`, or similarly-named method that emits wire-shaped
      output. Rendering is the port's responsibility, not a method on the domain object.
    rationale: >-
      A rendering method on a domain object is always available, so any code that needs
      camelCase output can call it and go around the port. The port then stops being the
      one place that decides what goes on the wire (ARCH-20-001).
    verification: No class under `vultron/core/models/` defines a method that calls `model_dump`/`model_dump_json` with `by_alias=True`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
  - id: ARCH-20-006
    priority: MUST
    kind: project
    statement: >-
      A driving adapter MUST serialize each AS2 document it serves over HTTP from an AS2
      class. An AS2 document is an `application/activity+json` response, such as
      `GET /actors/{id}`. An AS2 class is a `CoreObject` subclass, which is its own wire
      form (ARCH-25-003), or an `as_Base` wire vocabulary class. A `by_alias` dump of any
      other model, a bare `CoreRecord` included, is not an AS2 document.
    rationale: >-
      A domain type has one class, so the AS2 form of a core actor or case is that
      class's own `by_alias` dump; there is no separate `as_*` class to route through.
      What still varies is whether a model has an AS2 shape at all. A `CoreObject`
      inherits the `alias_generator` and the `@context` serializer, and
      `test_promoted_core_classes_are_exactly_as2_representable` holds every subclass to
      a complete set of AS2 spellings. A bare `CoreRecord` such as `VultronOfferRecord`
      inherits neither, so dumping it by alias emits snake_case bookkeeping keys with no
      `@context` under an AS2 content type, which a peer cannot read. This is the HTTP
      edge's counterpart of the rendering port's `CoreObject` gate (ARCH-20-003).
    verification: >-
      `test_core_object_renders_as_its_own_as2_form` and
      `test_model_with_no_as2_form_is_refused` in
      `test/adapters/driving/fastapi/test_responses.py` assert that `AS2JSONResponse`
      serialises a `CoreObject` as its own AS2 form and raises for a bare `CoreRecord`.
      A route that passes `AS2JSONResponse` an already-dumped dict or list bypasses that
      gate, so inspection confirms that each such body in `vultron/adapters/driving/`,
      and each value or element of a keyed dict or list of objects, is the dump of a
      `CoreObject` or `as_Base` instance.
      `test_datalayer_contents_is_plain_json_not_as2` in
      `test/adapters/driving/fastapi/routers/test_datalayer_serialization.py` holds the
      whole-store dump, whose
      contents include bare `CoreRecord` rows, to `application/json`. A route that returns a plain dict without `AS2JSONResponse`
      (for example the `get_object` and `get_object_by_key` fallbacks and
      `get_objects` in `routers/datalayer.py`, or the demo ledger routes) serves
      `application/json`, not an AS2 document, and is outside this requirement.
    adr:
    - ADR-0063
    - ADR-0099
    relationships:
    - rel_type: uses_definition
      spec_id: ARCH-25-003
  - id: ARCH-20-007
    priority: MUST_NOT
    kind: project
    statement: >-
      Core code MUST NOT normalise a wire object into its core counterpart by dumping it with
      `by_alias=True` and revalidating through the core class ("dump-and-revalidate").
    rationale: >-
      The dump of a wire object holds the keys that the wire class emits, and the core
      class does not always declare them. Under `extra="forbid"` (ARCH-12-003), a key
      with no core field raises. Without it, the key is lost and gives no error. Either
      way, the result depends on which keys the two classes happen to share, not on a
      defined rule. `rehydrate()` and `project_wire_snapshot_to_core` are the defined
      paths (ARCH-20-008, ARCH-20-009).
    verification: No module under `vultron/core/` constructs a core model via `CoreClass.model_validate(wire_obj.model_dump(by_alias=True, ...))`.
    adr:
    - ADR-0063
  - id: ARCH-20-008
    priority: MUST
    kind: project
    statement: >-
      Core code MUST treat a core-branch instance of an inbound nested object as already
      canonical, and never duck-type a projection on it, such as
      `getattr(obj, "to_core", None)`.
    rationale: >-
      A domain type has one class (ARCH-25-003), so no object that core holds has a
      `to_core()` method. A duck-typed lookup for it always returns `None`, and the
      branch behind it is dead code that a reader can take for a live fallback. The ban
      also stops code from a second route to dump-and-revalidate (ARCH-20-007).
    verification: >-
      `test/architecture/test_core_no_to_core_duck_typing.py` fails on any line under
      `vultron/core/` that names a `to_core` attribute (`"to_core"` or `.to_core(`).
    relationships:
    - rel_type: extends
      spec_id: ARCH-20-007
    - rel_type: derives_from
      spec_id: ARCH-25-003
    adr:
    - ADR-0099
  - id: ARCH-20-012
    priority: MUST
    kind: project
    statement: >-
      Core code MUST rebuild an object from a snapshot `dict` only through
      `project_wire_snapshot_to_core` (`vultron/core/models/_helpers.py`).
    rationale: >-
      `rehydrate()` turns an ID into an object (VM-06-007), and the snapshot helper
      turns a dict into an object, so each case has one defined path.
    verification: >-
      `test_core_rebuilds_snapshots_only_through_the_projection` in
      `test/architecture/test_core_snapshot_rebuilds_are_projected.py` fails each
      `model_validate` call in `vultron/core/` whose value is neither a dict literal
      nor `project_wire_snapshot_to_core`, outside a pinned list of calls that read no
      snapshot.
    relationships:
    - rel_type: extends
      spec_id: ARCH-20-008
    adr:
    - ADR-0099
  - id: ARCH-20-009
    priority: MUST
    kind: project
    statement: >-
      Core MUST get a nested object named only by reference from the DataLayer port
      (DL-05-001), never by dump-and-revalidate or a fabricated placeholder. A reference
      is a bare IRI or a stub. Core gets the object as `rehydrate()` resolved it at
      ingress (VM-06-007), or by reading it back.
    rationale: >-
      The DataLayer port returns core objects that already passed validation, so a
      second derivation in core is not necessary. A derivation by dump-and-revalidate is
      also the idiom that ARCH-20-007 forbids. A fabricated placeholder states facts
      that no actor asserted. The store is thus the only source for an object that a
      message names only by reference.
    verification: >-
      `rehydrate()` refuses an unresolvable IRI in a model-only slot rather than fabricating a
      value (VM-06-007's tests), and no module under `vultron/core/` revalidates a
      `by_alias=True` dump through a core class (ARCH-20-007).
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-007
    - rel_type: uses_definition
      spec_id: DL-05-001
    adr:
    - ADR-0099
- id: ARCH-21
  title: Post-Construction Mutation Safety
  description: >-
    Requirements governing validation of core domain objects after construction.
    Pydantic v2 validates at construction only, so attribute assignment and
    in-place collection mutation bypassed every type guarantee, allowing a
    wire-shaped object to occupy a core-typed field and be silently misread as
    absent (#2232, #2264). Codified by ADR-0064. Source: CONCERN-2261.
  specs:
  - id: ARCH-21-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      Every core domain model (a `pydantic.BaseModel` subclass defined under
      `vultron/core/models/`) MUST have `validate_assignment=True` in effect,
      whether set directly or inherited, so that attribute assignment is
      validated to the same standard as construction.
    rationale: >-
      Construction-time-only validation means the same value the constructor
      rejects is accepted by assignment. A wire-shaped object in a core-typed
      field does not raise when read — it reads as absent, and readers substitute
      an initial state, silently resetting a participant's ladder (#2232, #2264).
    adr:
    - ADR-0064
  - id: ARCH-21-002
    priority: MUST_NOT
    kind: architecture
    statement: >-
      The wire branch MUST NOT inherit `validate_assignment` from core. The flag is set
      on the core record root `CoreRecord`, through `ValidatedAssignmentMixin`. The wire
      base `as_Base` thus stays off both core roots (ARCH-12-001), and inbound wire data
      stays lenient.
    rationale: >-
      Inbound wire data is loose by contract, and the wire classes must parse it. If the
      wire branch inherits `validate_assignment`, an assignment on a wire object fails
      on data that is valid on the wire, and many inbound paths fail. The flag is set on
      the core root, so the wire base must stay on its own root (ARCH-25-004) to keep
      the flag off the wire branch.
    verification: >-
      `test_core_roots_are_not_shared_with_the_wire_branch` and
      `test_wire_branch_does_not_enable_validate_assignment` in
      `test/architecture/test_validate_assignment_ratchet.py`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-12-001
    - rel_type: refines
      spec_id: ARCH-21-003
    adr:
    - ADR-0064
    - ADR-0099
  - id: ARCH-21-003
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      No wire-layer class (under `vultron/wire/`) MUST have
      `validate_assignment` enabled. Strictness belongs at the wire-to-core
      projection, not on the wire types themselves.
    rationale: >-
      Inbound wire data is loose by contract. Enforcing strictness on the wire
      types would reject legitimate inbound payloads instead of projecting them
      (ADR-0062, ARCH-12-001).
    adr:
    - ADR-0064
  - id: ARCH-21-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      A `mode="after"` model validator on a core model under `vultron/core/` MUST NOT
      assign to `self`. Wire-layer validators are exempt, because the wire branch never
      enables `validate_assignment` (ARCH-21-003) and so cannot re-enter.
    rationale: >-
      `validate_assignment` runs every `mode="after"` validator again on each
      assignment, so a validator that writes to `self` calls itself again. A guarded
      validator stops at depth 2, but an unguarded one recurses until the stack is full.
      The `RecursionError` then hides every real type failure.
    adr:
    - ADR-0064
  - id: ARCH-21-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A core model MUST derive a value from its other fields in a `mode="before"`
      validator, where the derived value is itself validated.
    rationale: >-
      A write through `self.__dict__` prevents the recursion of ARCH-21-004, but it
      leaves the derived value unvalidated. A `mode="before"` validator derives the
      value before validation, so the value is validated.
    relationships:
    - rel_type: extends
      spec_id: ARCH-21-004
    adr:
    - ADR-0064
  - id: ARCH-21-005
    priority: SHOULD
    kind: project
    statement: >-
      An architecture test SHOULD enforce ARCH-21-001, ARCH-21-003 and ARCH-21-004.
    rationale: >-
      These rules are about the shape of the code, so a scan of the code can check
      them on every test run, where a review can miss a new violation.
    adr:
    - ADR-0064
    relationships:
    - rel_type: verifies
      spec_id: ARCH-21-001
    - rel_type: verifies
      spec_id: ARCH-21-003
    - rel_type: verifies
      spec_id: ARCH-21-004
  - id: ARCH-21-007
    priority: SHOULD
    kind: project
    statement: >-
      The ARCH-21-005 test SHOULD list each remaining known violation in an exact set.
      The set then fails when it grows and when a listed violation is fixed but not
      removed.
    rationale: >-
      An exact set fails when it grows and when a fixed entry stays in it, so it makes
      drift visible.
    relationships:
    - rel_type: extends
      spec_id: ARCH-21-005
    adr:
    - ADR-0064
  - id: ARCH-21-008
    priority: SHOULD
    kind: project
    statement: >-
      Each such backlog SHOULD have a companion `xfail(strict=True)` goal test, so that
      emptying the backlog fails the build and forces the marker to be deleted.
    rationale: >-
      A `strict=False` xfail continues to pass after the work is done. It never shows
      that it can be removed, and it gives no signal of partial progress. A strict goal
      test fails when the set is empty, so the marker must then be deleted, and
      completion is visible.
    relationships:
    - rel_type: extends
      spec_id: ARCH-21-007
    adr:
    - ADR-0064
  - id: ARCH-21-009
    priority: MUST
    kind: project
    statement: Each scan of the ARCH-21-005 test MUST complete within one second.
    rationale: >-
      The time limit keeps the scan cheap enough to run in every test run.
    verification: >-
      `test_each_source_scan_completes_within_one_second` in
      `test/architecture/test_validate_assignment_ratchet.py` times each source scan
      in CPU seconds and fails one that takes a second or more.
    relationships:
    - rel_type: extends
      spec_id: ARCH-21-005
    adr:
    - ADR-0064

- id: ARCH-22
  title: Wire→Core Import Boundary Enforcement
  specs:
  - id: ARCH-22-001
    priority: MUST_NOT
    kind: project
    statement: >-
      Modules under `vultron/wire/` MUST NOT import anything under `vultron/core/`
      except `vultron/core/models/` and `vultron/core/states/`. The forbidden set
      includes `behaviors/`, `use_cases/`, `ports/`, `services/`, `predicates/`,
      `scoring/`, `case_states/`, `participants/`, `dispatcher.py` and
      `sync_helpers.py`. The permitted set is an allow-list, so a package added to
      `vultron/core/` later is forbidden until this requirement admits it. A
      TYPE_CHECKING-guarded import is exempt, because it is erased at runtime and can
      only appear in an annotation.
    rationale: >-
      AS2 is a serialization of the core object model, so the wire layer must name the
      classes that it serializes and the states that they carry. Hexagonal dependencies
      point inward, so the import that breaks the architecture is core to wire
      (ARCH-01-001), not this one. Core behavior must still stay out of the wire layer:
      if wire code calls a use case or a service, the wire layer cannot be replaced as
      one unit (ARCH-06-001). An allow-list makes each new core package forbidden until
      a person decides to admit it.
    verification: >-
      `test/architecture/test_wire_core_import_allowlist.py` scans every module
      under `vultron/wire/` and fails on any import outside
      `ALLOWED_CORE_PACKAGES`.
    adr:
    - ADR-0009
    - ADR-0099
    relationships:
    - rel_type: refines
      spec_id: ARCH-25-006
  - id: ARCH-22-002
    priority: MUST
    kind: project
    statement: >-
      An architecture test MUST enforce the ARCH-22-001 allow-list over every module
      under `vultron/wire/`.
    rationale: >-
      An allow-list that no test checks drifts as soon as one import slips in. A scan
      of every wire module catches each import that the allow-list does not admit.
    verification: >-
      `test_wire_imports_only_allow_listed_core_packages` in
      `test/architecture/test_wire_core_import_allowlist.py` walks the full AST of each
      wire module, and its detector-validation cases cover a TYPE_CHECKING-guarded
      import.
    adr:
    - ADR-0009
    - ADR-0099
    relationships:
    - rel_type: verifies
      spec_id: ARCH-22-001
  - id: ARCH-22-004
    priority: MUST
    kind: project
    statement: >-
      The ARCH-22-002 test MUST detect an import deferred into a function body, as well
      as a top-level one.
    rationale: >-
      Checking only module-level imports would miss a deferred import in a function
      body, which is a runtime dependency like any other.
    verification: >-
      The `deferred-import-in-function-body` case of `test_detector_flags_disallowed_import`
      in `test/architecture/test_wire_core_import_allowlist.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-22-002
    adr:
    - ADR-0009
    - ADR-0099
  - id: ARCH-22-005
    priority: MUST
    kind: project
    statement: >-
      The ARCH-22-002 test MUST key its scan on the importing directory,
      `vultron/wire/`, not on a blessed importing location.
    rationale: >-
      A rule phrased as "only this location may import core" is evaded by moving a
      file. Keyed on `vultron/wire/`, the rule follows the code.
    verification: >-
      `test_wire_imports_only_allow_listed_core_packages` in
      `test/architecture/test_wire_core_import_allowlist.py` scans every module under
      `vultron/wire/`, wherever it sits in that tree.
    relationships:
    - rel_type: extends
      spec_id: ARCH-22-002
    adr:
    - ADR-0009
    - ADR-0099
  - id: ARCH-22-006
    priority: MUST
    kind: project
    statement: >-
      The ARCH-22-002 test MUST state the permitted set as an allow-list, not as a list
      of forbidden packages or of known violations.
    rationale: >-
      A deny-list admits a newly added core package by default, which is the failure
      mode an allow-list removes.
    verification: >-
      `ALLOWED_CORE_PACKAGES` in `test/architecture/test_wire_core_import_allowlist.py`
      is the permitted set, and the `unknown-package-forbidden-by-default` case of
      `test_detector_flags_disallowed_import` in that file shows that a new core
      package is refused.
    relationships:
    - rel_type: extends
      spec_id: ARCH-22-002
    adr:
    - ADR-0009
    - ADR-0099
  - id: ARCH-22-003
    priority: SHOULD_NOT
    kind: project
    statement: >-
      The wire→core boundary test SHOULD NOT carry a `KNOWN_VIOLATIONS` set or a
      companion goal test.
    rationale: >-
      The boundary from wire to core is already clean under the ARCH-22-001
      allow-list. The test thus states an invariant and needs no target to converge
      on, and a violation set or an `xfail` marker would have no work to do.
    adr:
    - ADR-0082
    - ADR-0099
  - id: ARCH-22-007
    priority: SHOULD_NOT
    kind: project
    statement: >-
      A goal test SHOULD NOT assert a state that other requirements make unreachable.
    rationale: >-
      An unreachable goal invites an implementer to break a MUST so that the test
      passes. That is worse than no goal test.
    adr:
    - ADR-0082
    - ADR-0099
- id: ARCH-23
  title: Core↔Wire Vocabulary and Round-Trip Invariants
  specs:
  - id: ARCH-23-002
    priority: MUST
    kind: project
    statement: >-
      Wire vocabulary registration keys in `VOCABULARY` MUST be distinct from core vocabulary keys in
      `CORE_VOCABULARY` so that no wire class shadows a core type.
    rationale: >-
      If a wire class and a core class register under the same key, a lookup by that key
      can return the wrong class, and stored or received data can be rebuilt as a wire
      object. Disjoint keys keep each lookup unambiguous. They also stop a new wire
      class from shadowing a core type with no notice. See ADR-0099.
    verification: >-
      A test forces full registration first — registration is a submodule import side effect
      (VM-01-005), so it walks every submodule of the wire vocabulary package and of the core
      models package before reading either registry — then asserts that both registries are
      non-empty and cover their declared type counts, and only then asserts
      `set(VOCABULARY) & set(CORE_VOCABULARY) == set()`.  Asserting the disjointness without the
      population precondition passes vacuously: a bare
      `from vultron.wire.as2.vocab import VOCABULARY` yields an empty dict, so the intersection
      is empty for the wrong reason.
    adr:
    - ADR-0082
    - ADR-0099
  - id: ARCH-23-003
    priority: MUST_NOT
    kind: project
    statement: >-
      Serialized AS2 output MUST NOT change as a result of a vocabulary-key
      change.  The wire `"type"` value emitted on the wire is independent of
      the registry key under which a wire class is registered.
    rationale: >-
      The registry key is an internal lookup value. The `type` value is a commitment to
      receivers, which match on it. If a change to a key changes the output, a change
      inside Vultron breaks peers that did not change. The key and the wire value
      differ: the code derives the key from the class name (`as_Create`), which is not
      the `type` value (`Create`) (VM-01-004).
    verification: >-
      A round-trip test asserts the serialized form of every wire type is
      byte-identical to its pre-change output.
    adr:
    - ADR-0082
    - ADR-0099
  - id: ARCH-23-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST derive the set of AS2 reference-typed fields from the wire
      classes' type annotations, not restate it as a hand-maintained collection.
    rationale: >-
      The `as_ObjectRef` annotations already state which fields hold references. A
      hand-kept list states the same fact a second time. A second statement can drift
      from the annotations with no notice, and a field then serializes or persists in
      the wrong form. A set derived from the annotations stays correct when a field
      changes.
    verification: >-
      A grep test asserts `_AS_OBJECT_REF_FIELDS` no longer exists, and a test
      asserts the derived set matches the annotation-declared reference fields
      for every wire class.
    adr:
    - ADR-0082
    - ADR-0099
  - id: ARCH-23-008
    priority: MUST_NOT
    kind: project
    statement: >-
      A translation path MUST NOT open-code a per-field reference collapse.
    rationale: >-
      A reference collapse written into each translation path states again which fields
      hold references. That copy can drift from the annotations, and a field then
      serializes or persists in the wrong form.
    verification: >-
      `test_no_translation_path_lists_reference_fields_by_hand` in
      `test/architecture/test_no_hand_listed_reference_fields.py` fails a literal list
      of three or more AS2 reference field names under `vultron/wire/`,
      `vultron/adapters/` or `vultron/core/`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-23-004
    adr:
    - ADR-0082
    - ADR-0099
  - id: ARCH-23-005
    priority: MUST
    kind: project
    statement: >-
      A serialize-then-validate round trip on a core object MUST reproduce that object,
      on the persistence record round trip as well as in translation.
    rationale: >-
      The project must read back what it writes, both from its own store and from the
      AS2 form it sends.
    verification: >-
      `test_round_trip_is_exact_for_every_core_vocabulary_entry` in
      `test/architecture/test_core_extra_forbid.py` asserts
      `type(obj).model_validate(dump(obj)) == obj` for every `CORE_VOCABULARY` entry.
    adr:
    - ADR-0056
    - ADR-0082
    - ADR-0099
  - id: ARCH-23-009
    priority: MAY
    kind: project
    statement: >-
      Serialization MAY emit a computed field, such as
      `VulnerabilityCase.activeParticipants` on the AS2 `by_alias` path only, because
      CM-31-014 forbids storing it.
    rationale: >-
      A computed field gives a reader a value it would otherwise derive itself. It is
      derived from stored state, so emitting it adds nothing that can disagree with a
      correct object.
    verification: >-
      `test_computed_field_is_published_by_alias_and_never_stored` in
      `test/architecture/test_core_extra_forbid.py`.
    adr:
    - ADR-0056
    - ADR-0099
  - id: ARCH-23-010
    priority: MUST
    kind: project
    statement: >-
      Validation MUST discard a supplied computed-field value that equals the value
      derived from the object's own state.
    rationale: >-
      A computed field in a dump is a key that the model does not store, and
      `extra="forbid"` (ARCH-12-003) refuses an unknown key, so validation needs a rule
      for it. A correct producer always emits a value that agrees with the state, so
      validation can discard it safely.
    verification: >-
      `test_true_computed_bool_round_trips` in
      `test/architecture/test_core_extra_forbid.py` and
      `test_core_object_strips_computed_field_input` in
      `test/core/models/test_core_object.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-23-005
    adr:
    - ADR-0056
    - ADR-0099
  - id: ARCH-23-011
    priority: MUST
    kind: project
    statement: >-
      Validation MUST refuse a supplied computed-field value that contradicts the value
      derived from the object's own state, and not discard it.
    rationale: >-
      A value that contradicts the state cannot come from a correct producer, and a
      derived value that gates disclosure must fail closed. Validation thus refuses it
      and does not discard it.
    verification: >-
      `test_contradicted_computed_bool_raises_protocol_violation` and
      `test_all_computed_field_contradictions_named_in_one_error` in
      `test/architecture/test_core_extra_forbid.py` use a test-local subclass, since no
      production class declares a computed field. They assert that a contradicted
      value, under its field-name and camelCase spellings, raises an error that names
      every contradicted field.
    relationships:
    - rel_type: extends
      spec_id: ARCH-23-005
    adr:
    - ADR-0056
    - ADR-0099
  - id: ARCH-23-012
    priority: MUST
    kind: project
    statement: >-
      Serialization MUST emit the wire-facing key names `id`, `type` and `@context`, not
      the Python field names `id_`, `type_` and `context_`.
    rationale: >-
      Receivers use the wire key names (`id`, `type`, `@context`), and stored rows use
      `id` and `type` (ARCH-25-001). A dump that emits Python field names thus matches
      neither.
    verification: >-
      `test_from_obj_emits_wire_identity_keys_no_trailing_underscores` in
      `test/adapters/driven/test_db_record.py` asserts that no persisted row carries a
      trailing-underscore identity key.
    relationships:
    - rel_type: extends
      spec_id: ARCH-23-005
    adr:
    - ADR-0082
    - ADR-0099
  - id: ARCH-23-006
    priority: MUST
    kind: project
    statement: >-
      Each core class that a wire-branch annotation names for a protocol-significant
      message slot MUST be exactly AS2-representable. That is, each field it carries has
      a valid AS2 property spelling (ARCH-12-013), and it carries no field that cannot
      go on the wire.
    rationale: >-
      A class in a message slot goes on the wire as part of the message. If it has a
      field with no valid AS2 spelling, its AS2 form shows a Python name that a peer
      cannot read, or the class carries data that cannot be sent. Message slots name
      core classes directly (ARCH-25-003), so each such core class must be exactly
      AS2-representable. A core guard inside a wire union must fail only its branch of
      the union, so `VultronValidationError` inherits `ValueError`.
    verification: >-
      `test_promoted_core_classes_are_exactly_as2_representable` in
      `test/architecture/test_wire_no_core_object_annotations.py` asserts every `CORE_VOCABULARY` entry that is a
      `CoreObject` subclass serializes only AS2 property names — no Python snake_case field names reach the wire.
    adr:
    - ADR-0099
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-12-013
    - rel_type: refines
      spec_id: ARCH-25-016
  - id: ARCH-23-007
    priority: MUST
    kind: project
    statement: >-
      An actor endpoint collection built from a URI MUST carry no `published` or
      `updated` timestamp. Such a collection is the `inbox` or `outbox`
      `OrderedCollection` around the address the actor's profile states.
    rationale: >-
      An endpoint built from a URI is an address, not an object that this process
      authored, so it has no creation time (ADR-0103). The core actor keeps only the URI
      (ARCH-12-006). If each read builds the collection with a clock stamp, a stored
      actor reads back unequal to itself when a second passes between the write and the
      read.
    verification: >-
      In `test/wire/as2/vocab/base/test_actor_endpoints.py`,
      `test_endpoint_without_arrived_stamp_carries_no_clock_stamp` and
      `test_constructed_actor_endpoints_carry_no_clock_stamp` assert an endpoint built
      from a URI carries no stamp, and `test_actor_round_trips_across_a_clock_tick`
      asserts a stored actor round-trips across a clock tick.
    relationships:
    - rel_type: extends
      spec_id: ARCH-12-006
    adr:
    - ADR-0103
  - id: ARCH-23-013
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry a timestamp that arrives on an inbound actor endpoint
      collection as received.
    rationale: >-
      An inbound stamp is a claim of the sender, so the receiver keeps it as received
      (ADR-0103).
    verification: >-
      `test_endpoint_collection_keeps_the_time_it_arrived_with` in
      `test/wire/as2/vocab/base/test_actor_endpoints.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-23-007
    adr:
    - ADR-0103
- id: ARCH-24
  title: Case-Authority Determination
  specs:
  - id: ARCH-24-001
    priority: MUST
    kind: architecture
    statement: >-
      Determining which actor holds single-writer authority for a case MUST have
      exactly one implementation — a single role-authority resolver that reads
      `CaseParticipant.case_roles` — composed by both `behaviors/` and
      `use_cases/`. No duplicate or twin resolver may exist.
    rationale: >-
      Authority for a case decides who may commit to the case ledger. If more than one
      resolver answers that question, the resolvers can disagree, and two actors can
      each act as the authority. Tests that find a site that forgets the check do not
      stop two resolvers from drifting apart. One shared resolver gives the same answer
      at every site by construction.
    verification: >-
      A ratchet test asserts exactly one role-authority resolver module, imported
      by both `behaviors/` and `use_cases/` (no twin definition).
    adr:
    - ADR-0088
  - id: ARCH-24-002
    priority: MUST
    kind: architecture
    statement: >-
      The role-authority resolver MUST reside in a neutral layer below `behaviors/` and
      `use_cases/` that depends only on `models`, `ports` and `enums`. Resolving case
      authority thus needs no `behaviors → use_cases` import.
    rationale: >-
      Both `behaviors/` and `use_cases/` must resolve case authority. If the resolver is
      in one of them, the other must import it or keep its own copy. A `behaviors →
      use_cases` import breaks the layer rule (BTND-04-003), and a copy breaks
      ARCH-24-001. A neutral layer below both lets them share one resolver with no
      cross-layer import.
    verification: >-
      The ratchet in ARCH-24-001 additionally asserts no
      `behaviors → use_cases._helpers` role-resolution import.
    relationships:
    - rel_type: extends
      spec_id: ARCH-24-001
    - rel_type: refines
      spec_id: BTND-04-003
    adr:
    - ADR-0088
  - id: ARCH-24-003
    priority: MUST
    kind: architecture
    statement: >-
      Exactly one authority condition node MUST answer "is the executing actor the case
      authority".
    rationale: >-
      When several condition nodes each resolve authority, they can give different
      answers for the same actor and case. A negation decorator answers the opposite
      question with no second node.
    verification: >-
      A test asserts one authority condition node is the only thing resolving "am I
      the authority"; `CheckIsOwnCaseActorNode` / `CheckIsNotOwnCaseActorNode` are
      removed or aliased.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-24-001
    adr:
    - ADR-0088
  - id: ARCH-24-006
    priority: MUST
    kind: architecture
    statement: >-
      The authority condition node MUST call the single role-authority resolver
      (ARCH-24-001).
    rationale: >-
      A condition node that resolves authority by its own logic can disagree with the
      resolver. One node that calls the single resolver gives one answer.
    verification: >-
      Inspection of `CheckIsCaseManagerNode` in
      `vultron/core/behaviors/case/nodes/conditions.py` confirms that it calls
      `resolve_case_manager_id`, which `test_exactly_one_resolver_module` in
      `test/architecture/test_role_authority_resolver.py` pins to one module.
    relationships:
    - rel_type: extends
      spec_id: ARCH-24-003
    adr:
    - ADR-0088
  - id: ARCH-24-004
    priority: MUST_NOT
    kind: architecture
    statement: >-
      No protocol-logic module MUST branch on the `case-actor` name/URL shape (an
      `is_case_actor_identity` predicate or the `/actors/case-actor` substring) or
      on `Service`-hosting location to determine authority, recognition, or routing.
      Authority derives from the `CVDRole.CASE_MANAGER` role alone.
    rationale: >-
      A URL shape or a hosting location is incidental: it does not show who holds the
      `CVDRole.CASE_MANAGER` role. A hosting test can also fail during the bootstrap
      window, so the real authority can fail its own test and act as an ordinary
      participant on its own ledger (CM-02-012). The case replica holds the CASE_MANAGER
      participant from the moment it is seeded (CP-09-004), so the role gives a stable
      answer.
    verification: >-
      `test/architecture/test_role_authority_resolver.py` ratchets both halves:
      `test_no_protocol_logic_branches_on_the_case_actor_url` asserts no
      protocol-logic module compares, shape-tests or match-cases on the
      `case-actor` substring, the segment constant, or the identity
      `case_actor_identity()` builds, and
      `test_no_protocol_logic_resolves_authority_by_service_hosting` asserts none
      resolves the authority by scanning `Service` objects for a hosted case
      `context`. Each has a self-test that fires it on a known-bad snippet.
    relationships:
    - rel_type: extends
      spec_id: ARCH-24-001
    adr:
    - ADR-0088
  - id: ARCH-24-005
    priority: MUST_NOT
    kind: architecture
    statement: >-
      The store-consistency / anti-fork guard that gates which store may append
      canonical ledger entries (`DeclineForeignLedgerCommitNode` / `store_for_actor`)
      MUST NOT be conflated with authority determination; the two are distinct
      concerns.
    rationale: >-
      Once role-authority says "you may commit," the store guard refuses, by
      raising, to mint a canonical index in a store that is not the log's home
      (which would fork the hash chain, #2626; CLP-10-014). Authority (role) and
      "where the write may land" (store) are different jobs.
    verification: >-
      Inspection of `vultron/core/behaviors/sync/nodes/ledger_authority.py` and
      `vultron/core/behaviors/store_scope.py` confirms both are documented as
      store-consistency / anti-fork guards that never ask whether the executing
      actor is the authority, and that the role question is answered only by
      `CheckIsCaseManagerNode` via the single resolver (ARCH-24-001). The
      separation is structural rather than ratcheted: the guard reads a store
      name and never a role, so there is no role read to assert the absence of.
    adr:
    - ADR-0088
- id: ARCH-25
  title: One Object Model; AS2 Is a Serialization of It
  description: >-
    The decision-level rules of the one-object model: the core classes are the object model,
    and the ActivityStreams 2.0 (AS2) wire format is one of two ways those same classes are
    written out. Each requirement here states one consequence of that decision in full, so a
    reader needs no decision record to know the rule. Finer-grained requirements in ARCH-12,
    ARCH-20, ARCH-22, ARCH-23, SDO-01, MV-11 and VM-06 refine these; where one does, the
    statement it refines names it.
  rationale: >-
    The rules in this group are direct consequences of one decision: the core classes
    are the object model, and AS2 is a serialization of them (ADR-0099). They are kept
    together so that a reader can see that decision in one place. Each requirement that
    refines one of them names the rule that it refines. A spec, not a decision record,
    holds a constraint that future code must obey (ADR-0127).
  specs:
  - id: ARCH-25-001
    priority: MUST
    kind: project
    statement: >-
      The classes under `vultron/core/models/` MUST be the one object model, so no
      second set of classes models the same domain concept. A core object is written
      out in one of the two ways that ARCH-25-011 and ARCH-25-012 state, chosen by where
      it is going.
    rationale: >-
      Two class hierarchies for one domain concept need translation code between them,
      and that code drifts each time one side changes. A core concept and its AS2 form
      have the same fields with the same meaning, so one set of classes can carry both.
      A received activity is also kept as received evidence (VM-08-002, CLP-07-011);
      that copy is neither of the two serializations.
    verification: >-
      `test_core_object_derives_as2_spellings_and_accepts_field_names` in
      `test/architecture/test_hierarchy_invariants.py` asserts `CoreObject` derives the
      alias, keeps `populate_by_name`, and reads a field from both its AS2 spelling and
      its Python name, and `test_every_wire_name_for_a_domain_type_is_its_core_class` in
      the same file asserts no wire class models a core domain type a second time.
    adr:
    - ADR-0099
  - id: ARCH-25-011
    priority: MUST
    kind: project
    statement: >-
      For inter-actor delivery over HTTP, this codebase MUST write a core object as AS2
      through a `by_alias=True` dump, which emits camelCase field names and `@context`.
      AS2 is the HTTP transmission format only.
    rationale: >-
      The destination selects the serialization. Peers read AS2, so delivery to them
      uses the AS2 form of the class.
    verification: >-
      `test_core_object_context_is_emitted_on_the_as2_path_only` in
      `test/core/models/test_core_object.py` asserts `@context` appears on the
      `by_alias` dump and not on the persistence dump.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-001
    adr:
    - ADR-0099
  - id: ARCH-25-012
    priority: MUST
    kind: project
    statement: >-
      For persistence to the data layer, this codebase MUST write a core object by
      `model_dump(mode="json")` without `by_alias`, then `_rekey_wire_identity()`. That
      step renames only `id_`, `type_` and `context_` to `id`, `type` and `@context`, so
      no other stored field takes its AS2 spelling.
    rationale: >-
      The data layer stores a plain dump with renamed identity keys. Only the identity
      keys need the wire spelling, because stored rows are found by `id` and `type`.
    verification: >-
      `test_rekey_wire_identity_renames_only_identity_keys` in
      `test/adapters/driven/test_db_record.py` asserts the persistence path renames only
      the three identity keys, and
      `test_core_object_context_is_emitted_on_the_as2_path_only` in
      `test/core/models/test_core_object.py` asserts the persistence dump carries no
      `@context`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-001
    adr:
    - ADR-0099
  - id: ARCH-25-002
    priority: MUST
    kind: project
    statement: >-
      Each core field MUST have a Python-convention name (`in_reply_to`, not
      `inReplyTo`), with its AS2 spelling in its Pydantic alias. This codebase builds no
      parallel core-only naming scheme.
    rationale: >-
      Pydantic aliases already separate the Python spelling from the AS2 spelling, so a
      second naming scheme adds nothing.
    verification: >-
      `test_promoted_core_classes_are_exactly_as2_representable` in
      `test/architecture/test_wire_no_core_object_annotations.py` asserts no field of a
      promoted core class projects a snake_case Python name onto the wire, and
      `test_core_object_derives_as2_spellings_and_accepts_field_names` in
      `test/architecture/test_hierarchy_invariants.py` asserts a field reads from both
      its AS2 spelling and its Python name.
    adr:
    - ADR-0099
  - id: ARCH-25-013
    priority: MUST
    kind: project
    statement: >-
      The aliases MUST come from the `alias_generator=to_camel` declared once on
      `CoreObject` and inherited by every subclass, not enumerated per field or declared
      per class. An explicit alias is required only where the generator cannot produce
      the AS2 name. These are `id_`, `type_` and `context_`, since no generator yields
      `@context`. They also include a field whose name differs from its AS2 property,
      such as the status dimension field `rm`, spelled `rmState`. ARCH-12-013 refines
      this.
    rationale: >-
      If each class declares its own alias generator, one class can omit it and send
      `attributed_to` on the wire while its siblings send `attributedTo`. A peer then
      cannot read the payload, and nothing shows the error before that. One generator
      on `CoreObject`, inherited by every subclass, gives every class the same spelling
      rule.
    verification: >-
      `test_every_core_vocabulary_entry_derives_as2_spellings` in
      `test/architecture/test_hierarchy_invariants.py` asserts every core vocabulary
      entry inherits the alias generator.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-002
    adr:
    - ADR-0099
  - id: ARCH-25-014
    priority: MUST_NOT
    kind: project
    statement: Core code MUST NOT type an AS2 spelling.
    rationale: >-
      A spelling typed in core logic is a second copy of the alias. It drifts when the
      alias changes, and core then reads or writes a key that the class no longer uses.
    verification: >-
      `test/architecture/test_core_no_as2_spellings.py` asserts no module under
      `vultron/core/` types an AS2 spelling.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-002
    adr:
    - ADR-0099
  - id: ARCH-25-003
    priority: MUST
    kind: project
    statement: >-
      A domain type MUST have exactly one class, its core class. A wire-facing `as_*`
      name for a domain type is thus an alias of the core class, not a separate or
      derived class, so `as_VulnerabilityCase is VulnerabilityCase`.
    rationale: >-
      When a wire class and a core class model the same concept, code can use one in
      place of the other, and data can be misread. One class for each domain type makes
      that mistake impossible.
    verification: >-
      `test_every_wire_name_for_a_domain_type_is_its_core_class` in
      `test/architecture/test_hierarchy_invariants.py` asserts every `as_<Name>` the
      wire layer binds for a core domain class is that class itself.
    adr:
    - ADR-0099
  - id: ARCH-25-015
    priority: MUST
    kind: project
    statement: >-
      Message-shape classes MUST name core classes in their object slots
      (`object_: VulnerabilityReport`, `target: VulnerabilityCase`).
    rationale: >-
      A slot that names a core class carries the one class of that domain type, so
      core code reads the object it gets with no projection step.
    verification: >-
      `test_every_wire_name_for_a_domain_type_is_its_core_class` in
      `test/architecture/test_hierarchy_invariants.py` asserts every `as_<Name>` the
      wire layer binds for a core domain class is that class itself, so a message slot
      naming a domain type names its core class.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-003
    adr:
    - ADR-0099
  - id: ARCH-25-016
    priority: MUST
    kind: project
    statement: >-
      A core class that can appear in a message slot MUST be exactly AS2-representable.
      Each field it carries has a valid AS2 property spelling, and it carries no field
      that cannot go on the wire (ARCH-23-006). A core class that never appears in a
      message is not constrained by AS2.
    rationale: >-
      A class in a message slot goes on the wire, so it must be exactly
      AS2-representable. Records that never go on the wire, such as dead letters,
      pending-queue entries and offer records (`CoreRecord` subclasses), stay free of
      AS2 limits.
    verification: >-
      `test_promoted_core_classes_are_exactly_as2_representable` in
      `test/architecture/test_wire_no_core_object_annotations.py` asserts each promoted
      core class projects only AS2 spellings.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-003
    adr:
    - ADR-0099
  - id: ARCH-25-017
    priority: MUST_NOT
    kind: project
    statement: >-
      Core code MUST NOT look for a `to_core()` projection on an object it holds. With
      one class there is nothing to project.
    rationale: >-
      A lookup for a projection that cannot exist is dead code, and a reader can take
      it for a live fallback.
    verification: >-
      `test/architecture/test_core_no_to_core_duck_typing.py` asserts nothing looks for
      a `to_core()` projection.
    relationships:
    - rel_type: derives_from
      spec_id: ARCH-25-003
    adr:
    - ADR-0099
  - id: ARCH-25-004
    priority: MUST_NOT
    kind: project
    statement: >-
      The wire and core hierarchies MUST NOT share a root. ARCH-12-001 refines this.
    rationale: >-
      A shared root makes the wire branch inherit core configuration and registration.
      It also forces the core root to stay lenient so that the wire branch can parse
      loose inbound data. The wire and core branches have nothing to share
      (ARCH-12-001). Separate roots let core stay strict while inbound wire data stays
      lenient.
    verification: >-
      `test_wire_vocabulary_inherits_nothing_from_core` in
      `test/architecture/test_hierarchy_invariants.py` asserts no wire class inherits
      from either core root.
    adr:
    - ADR-0099
  - id: ARCH-25-018
    priority: MUST
    kind: project
    statement: >-
      `as_Base` MUST stand directly on `pydantic.BaseModel` and carry the AS2 envelope
      fields.
    rationale: >-
      A wire root on `pydantic.BaseModel` inherits no core configuration or
      registration hook, so the wire branch stays lenient for loose inbound data.
    verification: >-
      `test/wire/as2/vocab/base/test_wire_base_hierarchy.py` asserts `as_Base` stands
      directly on `pydantic.BaseModel`.
    relationships:
    - rel_type: implements
      spec_id: ARCH-25-004
    adr:
    - ADR-0099
  - id: ARCH-25-019
    priority: MUST
    kind: project
    statement: >-
      Core MUST have exactly two roots. One is a minimal record base carrying identity
      only (`id_`, `type_`, `name`) for records that are not AS2 objects, such as dead
      letters. The other is one object root carrying the AS2 object fields, `@context`
      and required timestamps. ARCH-12-002 refines this.
    rationale: >-
      Some core types are AS2 objects, and others are internal records that never go on
      the wire. Two roots let the type show that difference, and keep core strict on
      its own root.
    verification: >-
      `TestCoreRoots` in `test/architecture/test_hierarchy_invariants.py` asserts
      `CoreObject` stands directly on `CoreRecord`, that `CoreRecord` carries the
      identity fields only, and that the retired middle roots are not restored.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-004
    adr:
    - ADR-0099
  - id: ARCH-25-005
    priority: MUST
    kind: project
    statement: >-
      A status dimension object MUST write itself as its bare state value and read that
      bare value back, so `RmDimension` writes `"START"` and accepts `"START"`.
      SDO-01-004 refines this.
    rationale: >-
      A dimension object holds one data field, `state`. All its other members are
      behavior, and behavior does not serialize, so the bare state value is the full
      data of the object. When the dimension writes the bare value, its core form and
      its wire form are the same.
    verification: >-
      `test/core/models/test_dimension_bare_serialization.py` asserts the bare-value
      dump and that both the bare and the mapping form are read.
    adr:
    - ADR-0099
  - id: ARCH-25-020
    priority: MUST
    kind: project
    statement: >-
      Each status dimension class MUST declare its own serializer and reader, not leave
      them to a helper or a translator.
    rationale: >-
      A serializer and a reader on the class keep the rule in one place, so every path
      that dumps or reads a dimension gets the same form.
    verification: >-
      Inspection of `vultron/core/models/dimensions.py` confirms that the serializer and
      the reader are declared on the dimension classes, and
      `test/core/models/test_dimension_bare_serialization.py` asserts that a plain
      model dump of each dimension is its bare value.
    relationships:
    - rel_type: implements
      spec_id: ARCH-25-005
    adr:
    - ADR-0099
  - id: ARCH-25-021
    priority: MUST_NOT
    kind: project
    statement: >-
      The bare-value form MUST NOT change the AS2 wire form, since the enclosing field's
      alias (`rmState`) carries the spelling.
    rationale: >-
      The alias of the enclosing field keeps the published AS2 form unchanged for
      peers.
    verification: >-
      `test_enclosing_field_alias_carries_the_bare_state_on_the_wire` in
      `test/core/models/test_dimension_bare_serialization.py` pins the AS2 form to
      literal values (`rmState`, `emState` and `pxaState` each carry the bare state).
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-005
    adr:
    - ADR-0099
  - id: ARCH-25-006
    priority: MUST_NOT
    kind: project
    statement: >-
      The wire layer MUST NOT import anything under `vultron/core/` except the core
      object model (`vultron/core/models/`) and its state enumerations
      (`vultron/core/states/`). ARCH-22-001 names the forbidden packages.
    rationale: >-
      Hexagonal dependencies point inward: outer layers depend on inner layers
      (ADR-0009). The wire layer is outside core, so it may name the core types that it
      serializes. Core behavior must stay out of the wire layer, so that the wire layer
      stays replaceable as one unit.
    verification: >-
      `test/architecture/test_wire_core_import_allowlist.py` scans every module under
      `vultron/wire/` against the allow-list.
    adr:
    - ADR-0099
  - id: ARCH-25-022
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST express the ARCH-25-006 rule as an allow-list attached to the
      importing directory. Moving a file then cannot evade it, and a new core package is
      forbidden by default.
    rationale: >-
      An allow-list keyed on the importing directory still holds when a file moves, and
      it forbids a new core package until a person admits it.
    verification: >-
      `ALLOWED_CORE_PACKAGES` in `test/architecture/test_wire_core_import_allowlist.py`
      is the allow-list, and `test_wire_imports_only_allow_listed_core_packages` in that
      file applies it to every module under `vultron/wire/`.
    relationships:
    - rel_type: implements
      spec_id: ARCH-25-006
    adr:
    - ADR-0099
  - id: ARCH-25-023
    priority: MUST_NOT
    kind: project
    statement: Core MUST NOT import wire (ARCH-01-001).
    rationale: >-
      Hexagonal dependencies point inward, so the inner layer never depends on the
      encoding that an outer layer chose (ADR-0009).
    verification: >-
      `test/architecture/test_core_no_wire_imports.py` asserts core imports nothing from
      wire.
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
    adr:
    - ADR-0099
  - id: ARCH-25-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST decide each unrecognised key on inbound data at the parse edge,
      `parse_activity`, by one rule for every object at every depth. A near miss for a
      declared spelling, or a retired name, refuses the whole activity and names both
      spellings. Any other
      unknown key is set aside and reported once at `INFO` (MV-11-001 to MV-11-003). The
      report carries `activity_id`, the sender's `actor_id`, the field path and the key,
      and the activity proceeds on its declared fields.
    rationale: >-
      A key that spells a field Vultron reads was meant as that field. If Vultron
      continues without it, it loses data and gives no error, so a near miss refuses the
      activity. A key that Vultron does not read can be an extension of a peer, so
      Vultron reports it and does not refuse or lose the activity (ADR-0086). One rule
      in `parse_activity`, for every object at every depth, gives the same result
      whatever class an object resolves to.
    verification: >-
      `test/wire/as2/test_unknown_key_disposition.py` runs a foreign-key matrix over the
      positions an unknown key can arrive in (envelope, generic AS2 object, `Link`,
      untyped inline dict, inline domain object), asserting the key is set aside and
      reported once, and a near-miss matrix asserting a near miss is refused naming both
      spellings. `test/architecture/test_no_receive_path_reparse.py` asserts nothing on
      the receive path re-validates from the raw body.
    adr:
    - ADR-0099
  - id: ARCH-25-033
    priority: MUST_NOT
    kind: project
    statement: >-
      The class an object happens to resolve to MUST NOT decide an unrecognised key on
      it.
    rationale: >-
      One rule in `parse_activity` gives the same result whatever class an object
      resolves to. Were the class to decide, the same key would be set aside in one
      position and refuse the activity in another, and a peer could not predict either.
    verification: >-
      The foreign-key matrix in `test/wire/as2/test_unknown_key_disposition.py` arrives
      at the same disposition from every position an unknown key can reach (envelope,
      generic AS2 object, `Link`, untyped inline dict, inline domain object), so a
      class-dependent decision fails it.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-007
    adr:
    - ADR-0099
  - id: ARCH-25-024
    priority: MUST
    kind: project
    statement: >-
      Reading MUST be strict on declared fields, so the edge refuses a recognised field
      whose value violates its declared type.
    rationale: >-
      A declared field with a value of the wrong type is a defect of the sender. Read
      as a default or as absent, it would hide the defect and change protocol state
      with no trace.
    verification: >-
      `test_explicit_null_dimension_raises` in
      `test/core/models/test_dimension_bare_serialization.py` asserts a declared
      dimension field holding `null` is refused, not read as a default.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-007
    adr:
    - ADR-0099
  - id: ARCH-25-025
    priority: MUST
    kind: project
    statement: >-
      Every core class MUST reject an unknown key in in-process and stored data, where
      one is always a bug. The `CoreObject` base keeps `extra="forbid"` (ARCH-12-003),
      and no core class adds a loose extras field. Inbound data enters only through the
      parse edge (MV-11-004).
    rationale: >-
      Inside the process an unknown key is always a bug, so `CoreObject` keeps
      `extra="forbid"`. A loose extras field would let such a key pass with no error.
    verification: >-
      `test_unknown_key_raises_for_every_core_vocabulary_entry` and
      `test_every_core_object_forbids_extra_with_no_exemption_list` in
      `test/architecture/test_core_extra_forbid.py` assert every `CoreObject` subclass
      refuses an unknown key, with no exemption list.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-007
    adr:
    - ADR-0099
  - id: ARCH-25-026
    priority: MUST_NOT
    kind: project
    statement: >-
      The parse edge MUST NOT carry a set-aside key on the parsed object, so the
      received evidence (VM-08-002) is its only copy.
    rationale: >-
      A set-aside key on the parsed object would go on into core and the store, where
      `extra="forbid"` refuses it. The received evidence already keeps it for a reader
      who needs it.
    verification: >-
      `test_set_aside_key_survives_only_in_the_received_evidence` in
      `test/wire/as2/test_unknown_key_disposition.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-007
    - rel_type: uses_definition
      spec_id: VM-08-002
    adr:
    - ADR-0099
  - id: ARCH-25-008
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST declare every legitimate AS2 object and activity field on the
      core roots and on the wire `as_Object` base. That includes fields Vultron does not
      use, such as `bto`, `bcc`, `icon` and `image`. A recognised but ignored field is
      thus structurally distinct from an unknown one, and only an unknown key reaches
      the parse-edge partition of ARCH-25-007.
    rationale: >-
      A field that is declared but not used is known and can be ignored, so only a key
      that is truly unknown reaches the near-miss check.
    verification: >-
      `test_as2_vocabulary_properties_are_declared_on_both_roots` in
      `test/architecture/test_hierarchy_invariants.py` asserts a fixed list of the AS2 Object
      and Activity properties, `bto`, `bcc`, `icon` and `image` included, is declared on
      `CoreObject`, `as_Object`, `VultronActivity` and `as_TransitiveActivity`;
      `test_core_object_declares_every_as2_object_field` in the same file asserts every key
      the wire `as_Object` dumps is a declared `CoreObject` field;
      `test_vultron_activity_accepts_every_wire_activity_key` in
      `test/adapters/driving/fastapi/test_outbox_helpers.py` asserts the same of every wire
      activity against `VultronActivity`.
    adr:
    - ADR-0099
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-007
  - id: ARCH-25-027
    priority: MUST
    kind: project
    statement: >-
      A near-miss refusal MUST name the arriving key and the declared spelling it
      resembles.
    rationale: >-
      The refusal names both spellings, so the sender can correct the key.
    verification: >-
      `test_near_miss_is_refused_naming_both_spellings` in
      `test/wire/as2/test_unknown_key_disposition.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-008
    adr:
    - ADR-0099
  - id: ARCH-25-028
    priority: MUST
    kind: project
    statement: >-
      The parse edge MUST find a near miss only by MV-11-002's normalisation and the
      retired-name list, never by a similarity measure such as edit distance. That
      normalisation lowercases a key and removes every non-alphanumeric character.
    rationale: >-
      AS2 has many short property names that are one character apart, so an
      edit-distance measure would give many false matches. A fixed normalization and a
      list of retired names give a deterministic answer.
    verification: >-
      `test_normalisation_is_lowercase_and_strip_non_alphanumerics` in
      `test/wire/as2/test_unknown_key_disposition.py` pins the normalization, and
      `test_no_similarity_helper_in_the_parse_edge` in the same file asserts no
      similarity helper exists under `vultron/wire/as2/`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-008
    - rel_type: uses_definition
      spec_id: MV-11-002
    adr:
    - ADR-0099
  - id: ARCH-25-009
    priority: MUST
    kind: project
    statement: >-
      An object slot MUST hold the whole object, not an ID, once read. This is a
      prototype shortcut: it MUST NOT be read as a permanent architectural principle, and
      MUST be revisited before production.
    rationale: >-
      An embedded copy only delays the work of normalizing the data. It does not do that
      work. A production system is expected to use references, one backing store, and
      join objects where a relationship carries its own data.
    verification: >-
      `test_bare_id_in_scalar_object_slot_is_resolved` and
      `test_bare_id_in_list_object_slot_is_resolved` in
      `test/wire/as2/test_rehydration_materialisation.py` assert `rehydrate()`
      materialises a bare ID in a model-only slot.
    adr:
    - ADR-0099
    lint_suppress:
    # compound_statement: the second and third keywords qualify the first, not add
    # a duty: holding the whole object is a prototype rule to revisit before
    # production, and no separate check could verify that status on its own.
    - compound_statement
  - id: ARCH-25-029
    priority: MUST
    kind: project
    statement: >-
      `rehydrate()` in `vultron/wire/as2/rehydration.py` MUST be the sole owner of
      ID-to-object materialisation, and resolve a reference through the `DataLayer` it
      is given.
    rationale: >-
      `rehydrate()` holds the data layer, so it can resolve the real object. One owner
      gives every slot the same resolution rule.
    verification: >-
      `test_rehydrate_materialises_object_slots` and
      `test_rehydrate_materialises_from_a_bare_case_id` in
      `test/wire/as2/test_rehydration_materialisation.py` assert `rehydrate()` resolves
      references through the `DataLayer` it is given, and
      `test/architecture/test_core_no_to_core_duck_typing.py` asserts core keeps no
      second projection path.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-009
    adr:
    - ADR-0099
  - id: ARCH-25-030
    priority: MUST
    kind: project
    statement: >-
      `rehydrate()` MUST read off the slot's declared type whether an unresolvable
      reference is deferred or refused. A slot that admits `str` (every
      `ActivityStreamRef[T]`) keeps the IRI (VM-06-004), and a slot that admits a model
      and no `str` refuses (VM-06-007).
    rationale: >-
      The slot type already says whether an IRI is allowed, so the rule for an
      unresolved reference needs no second source.
    verification: >-
      `test_unresolvable_reference_in_object_slot_is_refused` and
      `test_uri_admitting_slot_is_left_for_the_defer_path` in
      `test/wire/as2/test_rehydration_materialisation.py`.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-029
    adr:
    - ADR-0099
  - id: ARCH-25-031
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT fabricate a placeholder object, an actor included, for an
      unresolved reference.
    rationale: >-
      A placeholder or a synthesized actor states facts that no actor asserted, and
      activity can then be attributed to the wrong actor.
    verification: >-
      `test_unresolvable_activity_id_is_kept_as_string` in
      `test/wire/as2/test_rehydration_materialisation.py` asserts a `case_activity`
      reference stays an IRI rather than an activity fabricated and attributed to the
      case owner.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-029
    adr:
    - ADR-0099
  - id: ARCH-25-010
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST keep the AS2 vocabulary and the formal protocol message set as
      separate artifacts, neither derived as a subset of the other. The mapping between
      them reconciles them: `MessageSemantics` and the semantic registry, described in
      `notes/message-type-reference.md`.
    rationale: >-
      AS2 can express more sentences than Vultron needs. The formal protocol has the
      opposite problem: it treats two messages as one. To propose an embargo and to
      propose a revision of one are the same sentence with different start and end
      states. Neither list is thus a subset of the other, and the mapping between them
      reconciles them (ADR-0083).
    verification: >-
      `test/test_message_semantics_mapping.py` (MSM-03 to MSM-05) asserts the formal
      shorthands map onto the semantic registry rather than onto AS2 types one-for-one,
      including one AS2 verb carrying several semantics and one shorthand spanning
      several activities.
    adr:
    - ADR-0099
  - id: ARCH-25-032
    priority: MUST
    kind: project
    statement: >-
      The message-shape classes, which subclass AS2 activity verbs, MUST live under
      `vultron/wire/`.
    rationale: >-
      A message-shape class is the AS2 encoding of a message, not its identity, so it
      belongs in the wire layer.
    verification: >-
      `test_every_wire_activity_class_lives_under_the_wire_package` in
      `test/architecture/test_hierarchy_invariants.py` asserts every `as_Activity`
      subclass defined under `vultron/` is defined in a `vultron.wire` module.
    relationships:
    - rel_type: extends
      spec_id: ARCH-25-010
    adr:
    - ADR-0099
