      `Add(CaseStatus)` from anyone else (RSH-04-005). Each form dispatches to
      its own entry (MSM-08-001).
    verification: >-
      `test/test_message_semantics_mapping.py` asserts that `CP` rides both
      the `Add(CaseStatus)` pattern and the `Add(ParticipantStatus)` pattern's
      embedded `caseStatus`. `test/test_semantic_registry_occasions.py` asserts
      that each occasion carrying `CP` dispatches only to its own entry and
      that its example carries its `pxaState` value.
    relationships:
