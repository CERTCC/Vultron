- id: MSM-04
  title: General Protocol Message Shorthands
  description: 'Normative shorthand-to-semantic mappings for General (non-state-machine) protocol messages, covering GI, GK,
    and GE. Unlike the RM, EM, and CS groups, the General shorthands map to wire activities by expansion: a single shorthand
    covers several distinct wire activities rather than collapsing several shorthands into one.'
  specs:
  - id: MSM-04-001
    priority: MUST
    kind: project
    statement: >-
      The note lifecycle MUST realize protocol shorthand `GI` (General Inquiry) as
      `MessageSemantics.ADD_NOTE_TO_CASE` and `MessageSemantics.REMOVE_NOTE_FROM_CASE`.
      Their AS2 wire forms are `Add(Note)[target=VulnerabilityCase]` (VAM-07-002) and
      `Remove(Note)[target=VulnerabilityCase]` (VAM-07-003). A received
      `Create(Note)` is not a protocol message (VAM-01-019). These are not the whole
      of `GI`: MSM-04-002 adds the actor-suggestion exchange.
    rationale: '`GI` is defined in the formal protocol as any message conveying non-state-change information, so it is
      inherently one-to-many on the wire. The `Add` and `Remove` split is a wire-layer
      artifact with no formal counterpart: the formal set models the inquiry, not the
      object lifecycle that carries it.'
    verification: >-
      Inspection of `vultron/semantic_registry/note.py` confirms both
      note-scoped entries are registered, and that no single `MessageSemantics`
      value is named for `GI`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-01-019
    - rel_type: derives_from
      spec_id: VAM-07-002
    - rel_type: derives_from
      spec_id: VAM-07-003
  - id: MSM-04-002
    priority: MUST
    kind: project
    statement: Protocol shorthand `GI` MUST additionally cover the actor-suggestion exchange, dispatching as
      `MessageSemantics.OFFER_ACTOR_TO_CASE`, `MessageSemantics.OFFER_CASE_PARTICIPANT`,
      `MessageSemantics.ACCEPT_OFFER_CASE_PARTICIPANT`, `MessageSemantics.REJECT_OFFER_CASE_PARTICIPANT`,
      `MessageSemantics.ACCEPT_ACTOR_RECOMMENDATION`, or `MessageSemantics.REJECT_ACTOR_RECOMMENDATION`.
    rationale: '`messages.md` lists "suggesting a potential Participant to be added to a case" among its `GI` examples, so
      actor suggestion is a `GI` expansion and MUST NOT be classified as case management. What the formal set models as one
      inquiry the implementation realizes as a multi-hop negotiation with its own accept and reject responses.'
    verification: >-
      Inspection of `vultron/semantic_registry/actor/recommendation.py` confirms the
      actor-suggestion entries are registered, and `docs/reference/formal_protocol/messages.md`
      lists participant suggestion as a `GI` example.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-04-001
    - rel_type: derives_from
      spec_id: VAM-04-010
    - rel_type: derives_from
      spec_id: VAM-04-002
    - rel_type: derives_from
      spec_id: VAM-04-003
  - id: MSM-04-003
    priority: MUST
    kind: project
    statement: Protocol shorthands `GK` (General Acknowledgement) and `GE` (General Error) MUST NOT be assigned dedicated
      `MessageSemantics` dispatch values; the purposes they name are served by the mechanisms specified in MSM-05.
    rationale: Recording these as plain absences invites the reading that the behaviour is unimplemented. It is implemented,
      on a different axis — see MSM-05-001 and MSM-05-002.
    verification: >-
      Inspection of the semantic registry confirms no entry is named for `GK` or
      `GE`, and that the MSM-05 mechanisms are registered.
    relationships:
    - rel_type: refines
      spec_id: MSM-05-001
    - rel_type: refines
      spec_id: MSM-05-002
- id: MSM-05
  title: Fault and Acknowledgement Mechanism Evolution
  description: 'Normative record of how the formal protocol''s per-model error and acknowledgement shorthands (RE, EE, CE, GE
    and RK, EK, CK, GK) are realized in the AS2 wire vocabulary. The formal set partitions both concerns by which state
    machine the message belonged to; the implementation partitions faults by failure mode and acknowledges replicated state
    cumulatively. These are orthogonal axes, so the shorthands have no one-to-one wire counterparts even though the
    behaviours they describe are implemented.'
  specs:
  - id: MSM-05-001
    priority: MUST
    kind: protocol
    statement: 'Fault reporting MUST be partitioned by failure mode rather than by state machine, using exactly three
      mechanisms: `Create(ProcessingFault)` when a message was received but not understood; `as:Reject` when a message was
      received and understood but declined; and `Add(Note)[target=VulnerabilityCase]`
      when the condition requires narrative explanation.'
    rationale: >-
      Failure mode is actionable to a receiver in a way that originating state machine
      is not. Not-understood calls for a format or version fix, declined calls for a
      protocol-level decision, and needs-explanation calls for a human. A partition by
      state machine (RE, EE, CE and GE) carries no such signal, so it would tell the
      sender only where the fault arose, not what to do about it.
    verification: >-
      Inspection of the semantic registry confirms `create_processing_fault`,
      the `as:Reject`-based entries, and the note-scoped entries are all registered.
    adr:
    - ADR-0083
    stories:
    - story_2026_011
  - id: MSM-05-002
    priority: MUST
    kind: protocol
    statement: >-
      Acknowledgement of replicated case-ledger state MUST be cumulative and implicit,
      through hash-chain continuity.
    rationale: A matching `prev_log_hash` already proves receipt of every prior entry, so per-message positive
      acknowledgement would be redundant. This is negative acknowledgement with gap-fill replay, structurally closer to a
      cumulative ACK or SACK scheme than to the formal per-message EK, CK and GK design. `RK` remains a real wire activity
      (MSM-01-008) because report submission is not ledger-replicated.
    verification: >-
      Inspection of the registry confirms it contains no per-message `EK`, `CK`, or
      `GK` entry.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-003
    stories:
    - story_2026_011
  - id: MSM-05-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiver whose `prev_log_hash` matches its local tail MUST NOT emit an
      acknowledgement.
    rationale: >-
      The match already acknowledges every prior entry (MSM-05-002), so a positive
      acknowledgement would only add traffic.
    verification: >-
      `test/test_message_semantics_mapping.py`
      (`test_ledger_acknowledgement_is_negative_and_cumulative`) confirms no
      acknowledgement semantic exists for ledger-replicated state.
    relationships:
    - rel_type: refines
      spec_id: MSM-05-002
    stories:
    - story_2026_045
  - id: MSM-05-008
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST emit `Reject(CaseLedgerEntry)` when an entry's `prev_log_hash`
      does not match its local tail. The CASE_MANAGER then replays all entries after the
      last accepted hash.
    rationale: >-
      The mismatch is the one event the sender cannot see for itself. The Reject names
      where the receiver's chain ends, so the replay fills the gap.
    verification: >-
      Inspection of `RejectLedgerEntryReceivedUseCase` in
      `vultron/core/use_cases/received/sync.py` confirms the mismatch-and-replay
      behaviour. `test/test_message_semantics_mapping.py`
      (`test_ledger_hash_mismatch_rejects_and_replays_from_last_accepted`) confirms
      the mismatch guard, the Reject emitter and the replaying use case are wired.
    relationships:
    - rel_type: extends
      spec_id: MSM-05-002
    stories:
    - story_2026_045
  - id: MSM-05-005
    priority: MUST
    kind: protocol
    statement: All protocol-significant activities MUST be committed to the canonical case ledger by the CASE_MANAGER
      before fan-out to participant actors. No protocol-significant activity bypasses the ledger replication path.
    rationale: >-
      The hash-chain acknowledgement model (MSM-05-002) is only complete if every activity a participant needs to
      acknowledge reaches them via an Announce(CaseLedgerEntry). Activities that bypassed the ledger would have no
      acknowledgement mechanism. Report submission (RS) is the only activity not carried by the ledger; it uses RK
      (MSM-01-008) instead, which is the intended exception rather than a gap.
    verification: >-
      Inspection of the CASE_MANAGER receive paths confirms that every inbound protocol
      activity results in at least one CaseLedgerEntry committed before Announce fan-out,
      except for Offer(VulnerabilityReport) which uses the RK path.
    stories:
    - story_2026_015
  - id: MSM-05-006
    priority: MAY
    kind: protocol
    statement: >-
      A conformant implementation MAY rely solely on Announce(CaseLedgerEntry) deliveries for liveness inference,
      without emitting a dedicated periodic heartbeat. Silence between Announce deliveries is therefore an
      accepted protocol property: a participant that is online but has received all entries is indistinguishable
      from one that is unreachable. This does not preclude a future revision adding a normative heartbeat requirement.
    rationale: >-
      The hash-chain NAK model (MSM-05-002) provides implicit acknowledgement only when
      new entries arrive. Between deliveries, silence and unreachability are
      observationally equivalent. Stating this as a deliberate MAY-level property tells
      implementers that the silence is expected behavior, not a defect they must detect
      or repair, while leaving room for a heartbeat mechanism should a deployment, such
      as a multi-node CASE_MANAGER cluster, need one.
    verification: >-
      No normative heartbeat requirement exists in specs/sync-ledger-replication.yaml;
      this entry records the absence as intentional.
    stories:
    - story_2026_011
  - id: MSM-05-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Implementations MUST NOT infer error semantics from the `as:Reject` verb alone,
      because `as:Reject` also carries legitimate protocol rejections, including closing a
      report and declining an embargo invitation, a case invitation, a case proposal or a
      case-ownership transfer.
    rationale: '`as:Reject` is overloaded across error reporting and ordinary protocol refusal. A receiver that treats every
      `as:Reject` as a fault will misclassify routine protocol traffic as errors.'
    verification: >-
      Inspection of the semantic registry confirms multiple non-error entries are
      keyed to `as:Reject` patterns.
    stories:
    - story_2026_011
  - id: MSM-05-004
    priority: MUST_NOT
    kind: process
    statement: Documentation MUST NOT describe the wire fault taxonomy as `RmError`, `EmError`, `CsError`, or `GmError`
      discriminated by `as:inReplyTo`; those types exist in no ontology file and no code.
    rationale: >-
      No ontology file and no code defines this taxonomy, so documentation that cites it
      leads implementers to a wire format that does not exist.
    note: >-
      `VultronError` in `vultron/errors.py` is a Python exception base class, unrelated
      to protocol wire-level error messages.
    verification: >-
      A grep for `RmError`, `EmError`, `CsError`, and `GmError` across `vultron/`
      and the whole of `docs/` returns no definitions and no documentation
      references. `ActivityPattern.in_reply_to_` has been removed from the
      codebase; the pattern matcher cannot match on a field that does not exist.
- id: MSM-06
  title: Message Type Reference Rendering
  description: Requirements governing the consolidated per-message-type reference pages under `docs/reference/messages/`, so
    that the shorthand-to-wire mapping presented to implementers cannot drift from this specification or from the semantic
    registry.
  specs:
  - id: MSM-06-001
    priority: MUST
    kind: process
    statement: >-
      The mapping tables in `docs/reference/messages/` MUST be committed
      `include-markdown` fragments generated from `SEMANTIC_REGISTRY`, committed with
      the occasion table YAML they are rendered from.
    rationale: 'Hand-maintained mapping tables drift silently, as the orphaned examples of issue 2904 showed. The tables
      are generated and committed rather than rendered at build time because they are mostly links, and MkDocs neither
      rewrites nor checks a `.md` link a `markdown_exec` block prints (ADR-0128).'
    verification: >-
      `uv run msm-occasions --check` exits 0.
    adr:
    - ADR-0128
  - id: MSM-06-005
    priority: MUST_NOT
    kind: process
    statement: >-
      A maintainer MUST NOT hand-write a mapping table in `docs/reference/messages/`,
      or render one by a build-time `markdown_exec` block.
    rationale: >-
      A hand-written table drifts from the registry, and MkDocs neither rewrites nor
      checks a `.md` link that a `markdown_exec` block prints (ADR-0128).
    verification: >-
      `test_no_message_page_renders_its_table_at_build_time` in
      `test/metadata/test_msm_occasions.py` fails when any page under
      `docs/reference/messages/` carries a `markdown_exec` block of its own, because
      each page includes its table and its occasion sections as fragments. A wire
      example inside an occasion section carries no link and is not a mapping table,
      so it may still render at build time.
    relationships:
    - rel_type: extends
      spec_id: MSM-06-001
    adr:
    - ADR-0128
  - id: MSM-06-006
    priority: MUST
    kind: process
    statement: >-
      A pre-commit `--check` hook MUST regenerate the occasion table YAML and every
      mapping fragment, and fail on any difference from the committed files. A
      committed fragment that nothing generates counts as a difference.
    rationale: >-
      A generated file that nothing compares with a fresh generation is a hand-edited
      one. The hook makes divergence fail at commit time.
    verification: >-
      `test_committed_occasion_artifacts_are_in_sync` in
      `test/metadata/test_msm_occasions.py` fails when the committed YAML or a
      fragment under `docs/reference/messages/_occasions/` differs from a fresh
      generation.
    relationships:
    - rel_type: verifies
      spec_id: MSM-06-001
    adr:
    - ADR-0128
  - id: MSM-06-002
    priority: MUST
    kind: process
    statement: >-
      Each `SEMANTIC_REGISTRY` entry MUST be designated to exactly one *primary* page
      under `docs/reference/messages/`. The exception is an entry explicitly exempted
      as a dispatcher fallback rather than a protocol message.
    rationale: 'Without a completeness check a new registry entry can be added without ever being documented, so every entry
      needs one page that owns it. A bare "exactly one page" rule would be unsatisfiable, because the mapping is many-to-many
      — see `docs/reference/messages/` for the entries that legitimately need a second home. A *primary* page keeps the
      completeness guarantee without contradicting MSM-06-003. The dispatch fallbacks are the intended exemptions.'
    verification: >-
      A ratchet test enumerates `SEMANTIC_REGISTRY` and asserts exactly one primary-page
      designation for every entry outside the declared exemption set.
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0083
  - id: MSM-06-007
    priority: MUST
    kind: process
    statement: >-
      Every `SEMANTIC_REGISTRY` entry that is not exempted as a dispatcher fallback MUST
      appear on its primary page.
    rationale: >-
      A designation that the page does not honour leaves the entry undocumented while
      the check passes.
    verification: >-
      A ratchet test enumerates `SEMANTIC_REGISTRY` and asserts that each non-exempt
      entry appears on its designated page.
    relationships:
    - rel_type: extends
      spec_id: MSM-06-002
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0083
  - id: MSM-06-008
    priority: MAY
    kind: process
    statement: >-
      A page other than an entry's primary page MAY cross-reference that
      `SEMANTIC_REGISTRY` entry.
    rationale: >-
      The mapping is many-to-many, so a reader on a related page can be pointed at an
      entry without that page owning it.
    adr:
    - ADR-0083
  - id: MSM-06-009
    priority: MUST
    kind: process
    statement: >-
      A page MUST cross-reference a `SEMANTIC_REGISTRY` entry where a collapse or an
      evolved mechanism gives the entry a second home on that page.
    rationale: >-
      A collapsed or evolved entry belongs to two message families, and a reader of
      the second family needs to find it there.
    verification: >-
      Review of the pages under `docs/reference/messages/` confirms each entry that a
      collapse or an evolved mechanism gives a second home is cross-referenced from it.
    adr:
    - ADR-0083
  - id: MSM-06-003
    priority: MUST
    kind: process
    statement: >-
      Each occasion section on a message page MUST state its entry's mapping status.
      The status is direct, collapse, expansion, evolved or none. A collapse maps
      several shorthands onto one wire activity. An expansion spreads one shorthand
      across several wire activities. An evolved mechanism moved onto a different axis
      (MSM-05).
    rationale: Reference material must state what is true, including divergence from the normative message set. Documentation
      that shows only direct mappings and omits the rest reads as a complete correspondence and misleads implementers about
      both the collapses and the evolved mechanisms. The status sits in each section, beside the formal definition it
      qualifies, rather than in a table column a sender does not need, so the
      occasion table need not carry it.
    verification: >-
      `test_every_section_links_its_mapping_status_to_its_definition` in
      `test/metadata/test_msm_occasions.py` asserts that every generated
      occasion section states its entry's status, linked to the definitions on
      `docs/reference/messages/index.md`.
  - id: MSM-06-010
    priority: MUST
    kind: process
    statement: >-
      The Message Types page MUST define each mapping status value.
    rationale: >-
      Each occasion section links its status to a definition, so the page has to hold
      one for every value.
    verification: >-
      `test_every_section_links_its_mapping_status_to_its_definition` in
      `test/metadata/test_msm_occasions.py` asserts that the page defines every
      `MappingStatus` value.
    relationships:
    - rel_type: extends
      spec_id: MSM-06-003
  - id: MSM-06-004
    priority: MUST
    kind: process
    statement: >-
      The Protocol Quick Reference's "Message Types at a Glance" section MUST include
      the whole occasion table and a table of the formal message set. Both are committed
      fragments generated from `SEMANTIC_REGISTRY` (MSM-06-001).
    rationale: A hand-written table has nothing comparing it with the registry, so it
      can give an emit trigger and a response for every shorthand, including the ones
      that faults and hash-chain acknowledgment replace on the wire. Generating both
      tables from the registry keeps the quick reference in step with the message pages.
    verification: >-
      `test_quick_reference_includes_the_generated_message_tables` in
      `test/metadata/test_msm_occasions.py` asserts that the section of
      `docs/reference/quick_reference.md` includes `lookup.md` and `shorthands.md`
      from the fragment directory.
    relationships:
    - rel_type: depends_on
      spec_id: MSM-06-001
    adr:
    - ADR-0128
  - id: MSM-06-011
    priority: MUST_NOT
    kind: process
    statement: >-
      The Protocol Quick Reference's "Message Types at a Glance" section MUST NOT carry
      a hand-written table.
    rationale: >-
      Beside the generated occasion table, a hand-written one would give a second,
      ungated answer to what is sent when.
    verification: >-
      `test_quick_reference_includes_the_generated_message_tables` in
      `test/metadata/test_msm_occasions.py` asserts that the section holds no table
      row of its own.
    relationships:
    - rel_type: extends
      spec_id: MSM-06-004
    adr:
    - ADR-0128
  - id: MSM-06-012
    priority: MUST
    kind: process
    statement: >-
      The formal message-set table MUST list each shorthand with the wire activities
      whose occasions carry it, or state that it has none.
    rationale: >-
      Some shorthands are replaced on the wire by faults or hash-chain acknowledgment,
      so the table says which have no wire activity rather than inventing one.
    verification: >-
      `test_shorthand_table_lists_every_shorthand_with_its_carriers` in
      `test/metadata/test_msm_occasions.py` asserts one row per `ProtocolShorthand`
      linking exactly the sections of the occasions that carry it, once per wire
      activity, or its family page's section on shorthands with no wire activity.
    relationships:
    - rel_type: extends
      spec_id: MSM-06-004
    adr:
    - ADR-0128
- id: MSM-07
  title: Participant Embargo Consent (PEC) State Machine Coupling to EM Wire Activities
  description: >-
    Normative record of how each EM wire activity drives the per-participant, per-embargo
    Participant Embargo Consent (PEC) rows as a side-effect, and which consent positions are
    derived rather than written. PEC is participant-local state tracking each actor's
    relationship to each embargo in the case's embargo register; its transitions are not
    independent protocol messages and have no formal shorthands in the 28-shorthand set. A
    participant's consent to an embargo is one row holding UNINVITED, INVITED, AGREED, DECLINED
    or TIMED_OUT; whether the participant is bound by the *current* active embargo is a lookup
    of the active embargo's row, and a lapse is read from the rows and the register when a
    longer embargo replaces the one the participant agreed to. Unlike RM state (self-reported by the participant) and VF/D state
    (self-reported by vendor/deployer), consent rows are set by the CASE_MANAGER (CM-28-003)
    based on observed participant behavior — incoming Accept/Reject wire activities and
    timer-enforced invitation expiry — and replayed on each replica. Normative authority:
    specs/case-management.yaml CM-18. Decisions: ADR-0048, ADR-0091, ADR-0118, ADR-0122.
  specs:
  - id: MSM-07-001
    priority: MUST
    kind: protocol
    statement: >-
      The Participant Embargo Consent (PEC) state machine MUST NOT be assigned any
      formal shorthand in the 28-shorthand protocol message set; all PEC transitions
      are either side-effects of EM wire activities (MSM-07-002 through MSM-07-005,
      MSM-07-008)
      or timer-based internal events (MSM-07-007) with no dedicated wire message or
      semantic type of their own. The CASE_MANAGER's `Create(EmbargoConsent)` and
      `Update(EmbargoConsent)`, which record a consent row it brings into existence or
      changes as its own ledger entry (CLP-07-013), are case-file record changes, not
      PEC transitions: they carry no shorthand, their ledger semantic types are
      `create_embargo_consent` and `update_embargo_consent`, and neither is handled on
      receipt (ADR-0140).
    rationale: >-
      PEC is participant-local state tracking each actor's relationship to the shared
      EM state, not a parallel message-driven machine. Extending the formal set with
      PEC-specific shorthands would imply dedicated wire messages where none exist and
      none are needed — the EM messages already carry the PEC signal as a side-effect.
      Documenting PEC as a side-effect is the faithful description of the design. A
      ledger entry's semantic type is the registry's label for its payload (ADR-0140),
      so the CASE_MANAGER's consent-row records need registry entries; they name the
      record, not a PEC trigger, and no receiver dispatches on them.
    verification: >-
      `test_no_semantics_or_registry_entry_is_named_for_a_pec_transition` in
      `test/test_message_semantics_mapping.py` confirms that no MessageSemantics member
      and no registry entry is named for a PEC transition, other than the two
      consent-row records, which it confirms carry no use case.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    stories:
    - story_2026_011
  - id: MSM-07-002
    priority: MUST
    kind: protocol
    statement: >-
      The wire activity INVITE_TO_EMBARGO_ON_CASE (EP wire form:
      Invite(EmbargoEvent)[context=VulnerabilityCase]) MUST apply the PEC INVITE trigger
      to the
      invited participant's row for the invited embargo, advancing it from UNINVITED, DECLINED
      or TIMED_OUT to INVITED.
    rationale: >-
      An embargo proposal is an invitation to consent; the EP wire activity conveys the invitation
      and the PEC rows record each participant's position on each embargo. A participant whose row
      is AGREED is unaffected by EP; INVITE is not legal from AGREED (CM-18-003), and a
      signatory asked about a revision has its row for the revision invited while its row for the
      active embargo stays AGREED (EP-09-004). The PEC trigger is applied via
      EmbargoLifecycle.record_embargo_invite() on the CASE_MANAGER as it relays the Invite, and on
      each replica as it replays the relay's ledger entry (EP-09-007).
    verification: >-
      Inspection of vultron/core/behaviors/embargo/nodes/relay.py, relay_effect.py and
      vultron/core/services/embargo_lifecycle/ confirms that relaying or replaying
      INVITE_TO_EMBARGO_ON_CASE applies PEC_Trigger.INVITE to the named invitee's row for the
      Invite's embargo via record_embargo_invite().
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-001
    stories:
    - story_2026_001
  - id: MSM-07-003
    priority: MUST
    kind: protocol
    statement: >-
      The wire activity ACCEPT_INVITE_TO_EMBARGO_ON_CASE (wire form:
      Accept(Invite(EmbargoEvent)[context=VulnerabilityCase])) is always its sender's own
      consent, the Case Owner's included. An actor applying it MUST apply the PEC AGREE
      trigger to the sender's row for the accepted embargo. The row advances from
      UNINVITED, INVITED, DECLINED or TIMED_OUT to AGREED. The accepted embargo may be
      the active embargo, a first proposal (EM PROPOSED) or a *proposed revision* of an
      embargo still in force. Only the accepted embargo's row is marked. A participant
      is a signatory exactly when its row for the active embargo is AGREED. So accepting
      a proposed revision binds the participant to nothing new until the owner
      activates it (MSM-07-008). An Accept from a DECLINED
      row is the participant changing its answer, so the row moves directly to AGREED
      with no re-invite first (CM-18-003). An Accept of an embargo that is neither the
      active embargo nor an open proposal records nothing (CM-18-003), and MSM-07-012
      refuses it.
    rationale: >-
      The Case Owner's decision for the case has its own activity (MSM-07-008,
      ADR-0122), so an Accept of an Invite means one thing whoever sends it and no
      handler branches on the sender to learn what it means. The PEC AGREE trigger is
      valid directly from UNINVITED because consent can be self-determined without an
      invitation (ADR-0048, ADR-0091, CM-18-003). Consent is per embargo (CM-10-001,
      ADR-0093, ADR-0122): an Accept is always a statement about the embargo it names,
      so it always marks that embargo's row and there is no first-proposal versus
      revision asymmetry to special-case.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` assert that a
      participant accepting the embargo in force, a first proposal and a proposed revision each
      marks exactly that embargo's row AGREED, that the Case Owner's Accept of an Invite
      records only its own consent, that a signatory accepting a proposed revision keeps
      its AGREED row for the active embargo, and that a DECLINED participant's Accept
      moves its row directly to AGREED.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_001
  - id: MSM-07-004
    priority: MUST
    kind: protocol
    statement: >-
      The wire activity REJECT_INVITE_TO_EMBARGO_ON_CASE (wire form:
      Reject(Invite(EmbargoEvent)[context=VulnerabilityCase])) is its sender's own consent
      whenever a participant sends it, the Case Owner included. Unless MSM-07-014
      refuses it, an actor applying it MUST apply the PEC DECLINE trigger to the
      sender's row for the rejected embargo. DECLINE is valid from UNINVITED, INVITED,
      AGREED or TIMED_OUT. A Reject of the active embargo from any row but AGREED
      refuses the terms in force and declines that row only. The CASE_MANAGER's own
      Reject of a proposal is not its consent but its abandonment (MSM-07-016).
    rationale: >-
      Symmetric with MSM-07-003: the Case Owner's rejection of a proposal for the case
      has its own activity (MSM-07-009, ADR-0122), so a Reject of an Invite is the
      sender's consent and nothing else. The PEC DECLINE trigger is valid directly from
      UNINVITED for symmetric reasons to AGREE (ADR-0048, ADR-0091, CM-18-003).
    verification: >-
      Inspection of vultron/core/use_cases/received/embargo/reject.py and
      vultron/core/services/embargo_lifecycle/consent.py confirms
      RejectInviteToEmbargoOnCaseReceivedUseCase applies
      EmbargoLifecycle.record_embargo_rejection, which declines the rejecting actor's row
      for the rejected embargo and applies the same rule to the Case Owner; unit tests in
      `test/core/services/embargo_lifecycle/test_consent.py` and `test_answers.py` assert
      the DECLINED row.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_001
  - id: MSM-07-005
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the Case Owner's Accept(EmbargoEvent)[target=VulnerabilityCase]
      (MSM-07-008) that replaces active embargo A with revision B. The register activates
      B and supersedes A, so the derived EM goes REVISE → ACTIVE, or stays REVISE while
      another proposal is open (EMB-18-005). Implementations MUST settle every
      participant's consent rows against B.
    rationale: >-
      Only the owner's acceptance changes the embargo on the case; other participants'
      accepts and rejects are recorded per embargo and inform that decision. When it
      replaces the embargo in force, each participant's standing has to be read again
      against the new terms (ADR-0093).
    note: >-
      The owner's row for B is AGREED unless it already is, and an owner whose row for B
      is DECLINED moves directly to AGREED with no re-invite first (MSM-07-008,
      CM-18-003). Activating B advances no one else: a participant holding an AGREED row
      for B is its signatory by lookup, whether it is the proposer or an early acceptor.
      The settlement's cases are MSM-07-019 and MSM-07-020.
    verification: >-
      Inspection of vultron/core/services/embargo_lifecycle/ confirms that
      decide_activation() names a CARRY_OVER row for each signatory of a replaced
      embargo that ends no later, and only the owner's row for a longer one. Unit tests
      in test/core/services/embargo_lifecycle/ (test_activation.py,
      test_activation_decision.py) assert both arms and the derived lapse.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-003
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_001
  - id: MSM-07-019
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the owner's activation of revision B in place of active embargo
      A, where B ends no later than A. The CASE_MANAGER MUST carry over every participant
      whose row for A is AGREED. It applies CARRY_OVER to that participant's row
      for B, a DECLINED row
      for B included (CM-18-003).
    rationale: >-
      Agreeing to N days is agreeing to every shorter period — the containment that
      makes shortest-wins safe (EP-04-003) — so a shorter revision asks nothing new of an
      existing signatory and carries them over, even one that declined B: its decline
      objected to losing time, not to keeping the embargo.
    note: >-
      Only participants whose row for A is AGREED are carried over. A participant that
      had lapsed from an earlier embargo stays lapsed until it is re-invited or agrees
      to B. A participant INVITED to A whose invitation B has made stale is handled by
      the stale-terms re-invite path (EMB-17), because its row for the now-SUPERSEDED A
      is frozen.
    verification: >-
      `test/core/services/embargo_lifecycle/test_activation.py`
      (`test_activate_embargo_replacing_a_longer_one_carries_signatories_over`) and
      `test/core/services/embargo_lifecycle/test_answers.py`
      (`test_owner_activating_a_shorter_revision_carries_every_signatory_over`) confirm
      every signatory of the replaced embargo is carried over to a shorter revision.
    relationships:
    - rel_type: refines
      spec_id: MSM-07-005
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_089
  - id: MSM-07-020
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule covers the owner's activation of revision B in place of active embargo
      A, where B ends later than A. Implementations MUST NOT write any consent row to
      lapse a participant. A participant whose row for B is not AGREED is not a
      signatory to B,
      and has lapsed if it had agreed to A (CM-18-001).
    rationale: >-
      Longer terms ask for more than the signatories of A promised, so only those who
      agreed to B are bound by B, and the rows say so without a write.
    verification: >-
      `test/core/services/embargo_lifecycle/test_activation.py`
      (`test_activate_embargo_replacing_a_shorter_one_lapses_non_acceptors`) and
      `test/core/services/embargo_lifecycle/test_answers.py`
      (`test_owner_activating_a_longer_revision_lapses_signatories_lacking_it`) confirm
      a longer revision writes only the owner's row and lapses the others by lookup.
    relationships:
    - rel_type: refines
      spec_id: MSM-07-005
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_089
  - id: MSM-07-021
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A revision proposal (EV, ACTIVE → REVISE, or a counter-revision REVISE → REVISE)
      MUST NOT change any participant's consent to the embargo in force.
    rationale: >-
      While a revision is merely proposed the prior embargo is still in force and every
      signatory to it is still bound by it, so nothing about their consent has changed
      (ADR-0093).
    verification: >-
      `test/core/services/embargo_lifecycle/test_proposals.py`
      (`test_propose_embargo_active_to_revise_lapses_nobody`,
      `test_propose_embargo_revise_to_revise_lapses_nobody`) confirm a revision
      proposal changes no participant's consent to the embargo in force.
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_089
  - id: MSM-07-022
    priority: MUST
    kind: protocol
    statement: >-
      When a participant proposes a revision, implementations MUST mark the proposer's
      row for the proposed embargo AGREED.
    rationale: >-
      Proposing terms is agreeing to them, so the proposer needs no Invite of its own
      proposal.
    verification: >-
      `test/core/services/embargo_lifecycle/test_creation.py`
      (`test_the_revision_is_consented_to_by_its_proposer_not_the_executor`) confirms
      the proposer's row for the proposed embargo is AGREED.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-021
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_089
  - id: MSM-07-023
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit each carried-over row as its own CASE_MANAGER
      `Update(EmbargoConsent)` ledger entry, after the Accept's entry. The owner's own
      row is what its Accept states, applied from the Accept's entry.
    rationale: >-
      The CASE_MANAGER decides the carry-over. Committing each carried-over row as its
      own entry keeps every replica's consent rows in step with the CASE_MANAGER's.
    note: >-
      No activity is sent to a participant for these consent writes beyond the ledger
      fan-out.
    verification: >-
      `test/core/use_cases/received/test_embargo_activation_copy.py`
      (`test_the_accept_then_one_update_per_carried_over_row`) confirms the Accept is
      followed by one `Update(EmbargoConsent)` entry per carried-over row.
    relationships:
    - rel_type: implements
      spec_id: MSM-07-019
    adr:
    - ADR-0124
    - ADR-0122
    stories:
    - story_2026_089
  - id: MSM-07-024
    priority: MUST
    kind: protocol
    statement: >-
      Every replica MUST copy the CASE_MANAGER's carried-over consent entries rather
      than run the carry-over itself (ADR-0124, CLP-07-013, CM-23-016).
    rationale: >-
      A replica that ran the containment comparison on its own state could reach a
      different answer from the CASE_MANAGER's.
    verification: >-
      `test/core/use_cases/received/test_ledger_replay_convergence.py`
      (`test_a_replica_carries_signatories_over_to_a_shorter_activated_revision`)
      confirms a replica's rows and register equal the CASE_MANAGER's after it copies
      the entries.
    relationships:
    - rel_type: depends_on
      spec_id: MSM-07-023
    adr:
    - ADR-0124
    stories:
    - story_2026_089
  - id: MSM-07-006
    priority: MUST
    kind: protocol
    statement: >-
      When an ET / REMOVE_EMBARGO_EVENT_FROM_CASE wire activity terminates the embargo
      register's ACTIVE entry, implementations MUST leave the case with no active
      embargo. The same step cancels every open proposal, so the derived EM becomes
      EXITED. No separate outbound wire activity is emitted; the participant position is
      derived from the case.
    rationale: >-
      A register with a TERMINATED entry accepts no further change (ADR-0122), so a
      terminated embargo can never be invited to again. That is a fact about the case,
      which every replica holds once it replays the teardown.
    verification: >-
      `test/core/use_cases/received/test_embargo_termination_copy.py`
      (`test_the_remove_is_committed_before_the_case_changes`) confirms the
      termination leaves the case with no active embargo.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-007
    adr:
    - ADR-0118
    - ADR-0122
    stories:
    - story_2026_095
  - id: MSM-07-025
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When an ET terminates the embargo register's ACTIVE entry, implementations MUST NOT
      write any participant's consent rows. With no active embargo no participant is a
      signatory and no row binds anyone. An Accept or Reject that arrives afterwards
      records nothing (EMB-17-004).
    rationale: >-
      The termination is a fact about the case, so it does not need copying onto each
      participant record as a terminal consent state. Leaving the rows as they were
      also keeps the history of who agreed to what, and every row of a final entry is
      frozen (CM-18-003).
    verification: >-
      Inspection confirms that the `TERMINATE` register step
      (vultron/core/models/embargo_apply/changes.py) writes no consent row.
      `test/core/use_cases/received/test_embargo_relay_replay.py`
      (`test_termination_leaves_nobody_a_signatory_in_every_store`) confirms the rows
      are unchanged and no participant is a signatory afterwards, on the CASE_MANAGER
      and on a replica.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-006
    adr:
    - ADR-0118
    - ADR-0122
    stories:
    - story_2026_095
  - id: MSM-07-007
    priority: MUST
    kind: protocol
    statement: >-
      The timer-based pocket-veto transition MUST be enforced lazily, with no outbound
      wire message for the consent change itself. That transition moves the row of the
      invitation whose deadline passed from INVITED to TIMED_OUT. A lapse has no
      timer path (CM-18-002): a
      lapsed participant is re-invited, and the deadline attaches to that invitation.
    rationale: >-
      Inaction cannot produce an outbound message because there is no actor-observable event to
      report. The expiry is a derived conclusion from (the row's rsvp_deadline,
      now). Requiring a
      wire message would demand the system speak on behalf of a participant who has said nothing,
      which contradicts the Actor Knowledge Model (AKM).
    verification: >-
      Inspection of vultron/core/services/embargo_lifecycle/ confirms detect_and_apply_expiry()
      applies PEC_Trigger.TIME_OUT without emitting an outbound wire activity, and that
      it applies it only to the named invitation's row, and only from INVITED.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-002
    adr:
    - ADR-0093
    - ADR-0118
    stories:
    - story_2026_001
  - id: MSM-07-026
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST author a case-ledger entry that records a pocket-veto expiry
      (CM-28-005), so the consent change is visible in the canonical ledger. No other
      protocol wire activity is required.
    rationale: >-
      The ledger entry is the record of the derived expiry, not a message sent by the
      silent participant. The entry already reaches every owner entitled to case
      content, so a second message would only duplicate it.
    note: >-
      The Case Owner learns of the expiry, as of an explicit refusal (MSM-07-004), from
      that entry. It gets the entry by its `Announce(CaseLedgerEntry)` fan-out while it
      is an active participant (CM-10-004), or from its own ledger when it holds the
      CASE_MANAGER role. No separate notification activity is sent to the owner; for an
      explicit refusal it would also be the acknowledgement EP-09-009 forbids.
    verification: >-
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py`
      (`test_the_expiry_is_committed_before_the_decision`,
      `test_the_owner_learns_of_both_from_the_fan_out_alone`) confirms the
      CASE_MANAGER commits the expiry's TIMED_OUT `Update(EmbargoConsent)` entry, that
      an active Case Owner without the CASE_MANAGER role is among its recipients, and
      that the commit emits no activity other than the Announce fan-out.
    relationships:
    - rel_type: derives_from
      spec_id: CM-28-005
    adr:
    - ADR-0093
    - ADR-0118
    stories:
    - story_2026_092
  - id: MSM-07-008
    priority: MUST
    kind: protocol
    statement: >-
      The wire activity ACTIVATE_EMBARGO_ON_CASE (wire form:
      Accept(EmbargoEvent)[target=VulnerabilityCase], the EmbargoEvent itself as
      the object) is
      the Case Owner's decision for the case. It MUST activate the named proposal's
      embargo register entry and supersede any entry in force in the same step. The
      derived EM becomes ACTIVE (EA, or EC for a revision).
    rationale: >-
      Giving the owner's decision its own activity retires the two-audience rule: an Accept of
      an Invite is always the sender's consent (MSM-07-003), and this activity is always the
      owner's decision for the case, so neither meaning depends on who sent the message
      (ADR-0122). When it replaces an embargo in force, the MSM-07-005 consent rule settles
      the rows.
    verification: >-
      Unit tests in `test/core/use_cases/received/` assert that the Case Owner's
      Accept(EmbargoEvent)[target=VulnerabilityCase] at the CASE_MANAGER activates
      the proposal and
      carries signatories over to a shorter revision, and that a replica replaying the
      committed entry converges.
    relationships:
    - rel_type: depends_on
      spec_id: VAM-05-008
    - rel_type: derives_from
      spec_id: EP-09-005
    - rel_type: depends_on
      spec_id: MSM-07-005
    - rel_type: refines
      spec_id: MSM-02-002
    - rel_type: refines
      spec_id: MSM-02-005
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-027
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST accept ACTIVATE_EMBARGO_ON_CASE only from the Case Owner. It
      refuses any other sender with REFUSED before any write (HP-01-006).
    rationale: >-
      Activating an embargo is the Case Owner's decision for the case (CM-02-005), so no
      other participant's activity may make it.
    verification: >-
      `test/core/use_cases/received/test_sender_entitlement.py`
      (`test_owner_embargo_decision_from_a_non_owner_is_refused`) confirms a non-owner
      sender is refused with nothing committed.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-008
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-028
    priority: MUST
    kind: protocol
    statement: >-
      ACTIVATE_EMBARGO_ON_CASE MUST mark the Case Owner's row for the activated embargo
      AGREED unless it already is. This includes a DECLINED row, since activating is the
      owner changing its answer (CM-18-003).
    rationale: >-
      The owner that activates terms is bound by them, so its own row has to say so,
      whatever it answered before.
    verification: >-
      `test/core/models/test_embargo_consent_move.py` (`test_the_owners_row_is_agreed`,
      `test_an_agreed_owner_moves_nothing`) and
      `test/core/use_cases/received/test_embargo_owner_decision.py`
      (`test_an_activation_the_owner_declined_changes_its_answer`) confirm the owner's
      row becomes AGREED, a DECLINED row with one ledger entry.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-008
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-029
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse ACTIVATE_EMBARGO_ON_CASE before committing it in two
      cases. One is a named embargo that is not an open proposal of the case. The other
      is CS that is public, exploited or attacked (EMB-02-002).
    rationale: >-
      Refusing a doomed activation before the commit keeps the ledger free of an entry
      that replicas, copying its step, would apply without the CASE_MANAGER's P/X/A check
      (CM-23-016).
    verification: >-
      `test/core/use_cases/received/test_embargo_owner_decision.py`
      (`test_a_decision_naming_no_open_proposal_is_refused_uncommitted`,
      `test_an_activation_with_pxa_set_is_refused_uncommitted`) confirms a non-open
      proposal and P/X/A are each refused with nothing committed.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-008
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-009
    priority: MUST
    kind: protocol
    statement: >-
      The wire activity REJECT_EMBARGO_PROPOSAL_ON_CASE (wire form:
      Reject(EmbargoEvent)[target=VulnerabilityCase], the EmbargoEvent itself as
      the object) is
      the Case Owner's decision for the case. It MUST reject the named proposal's
      embargo register entry. Once no other proposal is open, the derived EM becomes
      NONE (ER) or stays ACTIVE with the prior terms in force (EJ). It stays PROPOSED or
      REVISE while another proposal is open (EP-08-001).
    rationale: >-
      The owner's rejection decides the proposal for the case; whether the owner, as a
      participant, also refuses those terms is a separate Reject of the Invite (MSM-07-004).
      Keeping the two apart lets the owner keep the prior terms without declining them
      (ADR-0122).
    verification: >-
      Unit tests in `test/core/use_cases/received/` assert that the Case Owner's
      Reject(EmbargoEvent)[target=VulnerabilityCase] at the CASE_MANAGER rejects
      the proposal and
      leaves another open proposal open.
    relationships:
    - rel_type: depends_on
      spec_id: VAM-05-009
    - rel_type: derives_from
      spec_id: EP-09-005
    - rel_type: refines
      spec_id: MSM-02-004
    - rel_type: refines
      spec_id: MSM-02-006
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-030
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST accept REJECT_EMBARGO_PROPOSAL_ON_CASE only from the Case
      Owner. It refuses any other sender with REFUSED before any write (HP-01-006).
    rationale: >-
      Deciding a proposal for the case is the Case Owner's authority, so no other
      participant's activity may reject it for the case.
    verification: >-
      `test/core/use_cases/received/test_sender_entitlement.py`
      (`test_owner_embargo_decision_from_a_non_owner_is_refused`) confirms a non-owner
      sender is refused with nothing committed.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-009
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-031
    priority: MUST_NOT
    kind: protocol
    statement: >-
      REJECT_EMBARGO_PROPOSAL_ON_CASE MUST NOT change any participant's consent rows, the
      Case Owner's included.
    rationale: >-
      The owner's decision for the case is not its consent as a participant; that is a
      Reject of the Invite (MSM-07-004).
    verification: >-
      `test/core/use_cases/received/test_embargo_owner_decision.py`
      (`test_the_case_manager_applies_and_commits_the_owners_rejection`) confirms the
      rejection leaves every consent row unchanged, the owner's included.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-009
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-032
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers REJECT_EMBARGO_PROPOSAL_ON_CASE of the last open revision while
      CS is public, exploited or attacked. The CASE_MANAGER MUST also terminate the
      embargo in the same act (EMB-04-002). It trial-applies both steps before
      committing either. It
      commits the Reject's entry carrying the REJECT step, then its own ET
      `Remove(EmbargoEvent)` entry carrying the TERMINATE step. A refused termination
      commits neither.
    rationale: >-
      Reverting to the prior terms is not viable once disclosure has happened, so the
      rejection ends the embargo. Deciding both steps together means a replica copying
      both entries ends with the revision REJECTED and EM EXITED, as the CASE_MANAGER
      does.
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_the_owner_rejecting_a_revision_after_disclosure_ends_the_embargo`) and
      `test/core/use_cases/received/test_ledger_replay_convergence.py`
      (`test_a_replica_follows_the_owners_rejection_of_a_revision_after_disclosure`,
      `test_a_refused_termination_commits_neither_entry`) confirm the revision ends
      REJECTED and EM EXITED on the CASE_MANAGER and on a replica, the Reject's entry
      first, and that a refused termination commits neither entry.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-009
    - rel_type: depends_on
      spec_id: EMB-04-002
    adr:
    - ADR-0122
    stories:
    - story_2026_033
  - id: MSM-07-033
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse REJECT_EMBARGO_PROPOSAL_ON_CASE before committing it
      when the named embargo is not an open proposal of the case.
    rationale: >-
      There is nothing to decide, and a committed entry naming no open proposal would be
      applied by every replica that copies it.
    verification: >-
      `test/core/use_cases/received/test_embargo_owner_decision.py`
      (`test_a_decision_naming_no_open_proposal_is_refused_uncommitted`) confirms a
      non-open proposal is refused with nothing committed.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-009
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-010
    priority: MUST
    kind: protocol
    statement: >-
      The wire activity `Leave(EmbargoEvent)[context=VulnerabilityCase]` is a
      participant's withdrawal of its consent to the case's *active* embargo. For a
      sender whose row for that embargo is AGREED, the receiver MUST apply the PEC
      DECLINE trigger to that row. A Leave changes no register entry.
    rationale: >-
      Accept and Reject answer an Invite; leaving an embargo one is bound by is a
      different act, as `Leave(VulnerabilityCase)` is for leaving the case. A dedicated
      activity covers every signatory, including those made signatories with no Invite
      (CM-14-005, CM-11-001), and keeps a Reject from meaning refusal or withdrawal by
      the state of the case. The rejected alternatives are recorded in ADR-0122.
    verification: >-
      Inspection of the received-side handler for `Leave(EmbargoEvent)` confirms it
      declines the sender's AGREED row for the active embargo and changes no register
      entry.
    relationships:
    - rel_type: depends_on
      spec_id: VAM-05-011
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: VP-13-017
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_090
  - id: MSM-07-034
    priority: MUST
    kind: protocol
    statement: >-
      On a withdrawal (MSM-07-010), the receiver MUST also decline every open proposal's
      row that the sender had AGREED to. Every open proposal is a revision of the
      embargo withdrawn from (EP-08-004).
    rationale: >-
      An agreed revision left in place would make the withdrawer a signatory again as
      soon as the owner activated it (MSM-07-035).
    verification: >-
      `test/core/services/embargo_lifecycle/test_answers.py`
      (`test_withdrawal_from_the_active_embargo_leaves_its_revisions_too`) confirms the
      withdrawal declines the sender's agreed revision rows too.
    relationships:
    - rel_type: implements
      spec_id: MSM-07-035
    - rel_type: extends
      spec_id: MSM-07-010
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_090
  - id: MSM-07-035
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A DECLINED participant MUST NOT hold an AGREED row for an embargo that can become
      active without re-invitation.
    rationale: >-
      A participant that has withdrawn from an embargo has to be asked again before
      terms bind it, or its withdrawal would be undone by an activation it took no part
      in.
    verification: >-
      `test/core/services/embargo_lifecycle/test_answers.py`
      (`test_withdrawal_from_the_active_embargo_leaves_its_revisions_too`) confirms a
      withdrawer holds no AGREED row for an open revision afterwards.
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_090
  - id: MSM-07-036
    priority: MUST
    kind: protocol
    statement: >-
      The receiver MUST refuse a Leave(EmbargoEvent), with a reported reason, in three
      cases. Its embargo is not the active one, the sender's row for it is not AGREED, or
      the sender is the Case Owner. The Case Owner ends an embargo by terminating it
      (CM-02-005).
    rationale: >-
      Only a signatory of the embargo in force can withdraw from it, and the Case Owner
      holds the termination instead.
    verification: >-
      `test/core/use_cases/received/test_embargo_withdrawal.py`
      (`test_a_leave_of_an_embargo_not_in_force_is_refused_uncommitted`,
      `test_a_leave_from_a_row_that_is_not_agreed_is_refused_uncommitted`,
      `test_a_leave_from_the_case_owner_is_refused_uncommitted`) confirms each case is
      refused with a reported reason and nothing committed.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-010
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_090
  - id: MSM-07-011
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor that receives ACCEPT_INVITE_TO_EMBARGO_ON_CASE MUST NOT change any embargo
      register entry for it, whoever sent it, the Case Owner included.
    rationale: >-
      The Accept is the sender's consent (MSM-07-003), and the Case Owner's decision for
      the case is a separate activity (MSM-07-008, ADR-0122). If an Accept moved a register
      entry, one Participant's answer would decide the embargo for everyone (MSM-02-010).
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` assert that a
      participant's Accept of the embargo in force, of a first proposal and of a proposed
      revision moves no register entry, the Case Owner's Accept of an Invite included.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-003
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-012
    priority: MUST
    kind: protocol
    statement: >-
      An Accept may name an embargo the register does not hold, or holds in a final
      status. The CASE_MANAGER MUST refuse that Accept before committing it, with the
      refusal notice that reports the reason (CLP-05-001).
    rationale: >-
      An Accept of an embargo that is neither the active embargo nor an open proposal
      records nothing (CM-18-003): no row can move toward consent to terms that can no
      longer bind. Refusing it before the commit keeps it off the ledger, and the
      refusal notice tells the sender why its answer did not count.
    verification: >-
      `test/core/use_cases/received/test_embargo_refusal_notice.py` asserts that an Accept
      of a decided proposal and of an embargo the register does not hold are refused
      uncommitted, each with the refusal notice.
    relationships:
    - rel_type: supersedes
      spec_id: MSM-07-003
      note: In the case it names, the refusal replaces the AGREE
    - rel_type: depends_on
      spec_id: CLP-05-001
    adr:
    - ADR-0122
    stories:
    - story_2026_064
  - id: MSM-07-013
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor that receives REJECT_INVITE_TO_EMBARGO_ON_CASE from any sender but the
      CASE_MANAGER MUST NOT change any embargo register entry for it, the Case Owner's
      Reject included.
    rationale: >-
      Symmetric with MSM-07-011: the Reject is the sender's consent (MSM-07-004), and the
      Case Owner's rejection of a proposal for the case is a separate activity
      (MSM-07-009, ADR-0122). If a Reject moved a register entry, one Participant's
      answer would decide the embargo for everyone (MSM-02-010).
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` assert that a
      participant's Reject of a first proposal and of a proposed revision, the Case
      Owner's included, moves no register entry.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-004
    adr:
    - ADR-0122
    stories:
    - story_2026_087
  - id: MSM-07-014
    priority: MUST
    kind: protocol
    statement: >-
      An actor applying a Reject of the active embargo from the sender's AGREED row
      MUST refuse it, with a reported reason. That Reject is not consent withdrawal, which
      is `Leave(EmbargoEvent)` (MSM-07-010).
    rationale: >-
      Leaving an embargo one is bound by is a different act with its own activity
      (MSM-07-010, ADR-0122), so a Reject never has to be read against the case's state
      to tell a refusal from a withdrawal. The reported reason tells the signatory to
      send `Leave(EmbargoEvent)` if it means to withdraw (CLP-05-001).
    verification: >-
      `test/core/use_cases/received/test_embargo_withdrawal.py` asserts that a signatory's
      Reject of the active embargo is refused with a reported reason, and
      `test/core/services/embargo_lifecycle/test_consent.py`
      (`test_a_reject_of_the_active_embargo_from_an_agreed_row_is_refused`) asserts
      that EmbargoLifecycle.record_embargo_rejection refuses a Reject of the active
      embargo from an AGREED row.
    relationships:
    - rel_type: supersedes
      spec_id: MSM-07-004
      note: In the case it names, the refusal replaces the DECLINE
    adr:
    - ADR-0122
    stories:
    - story_2026_090
  - id: MSM-07-015
    priority: MUST
    kind: protocol
    statement: >-
      An actor that applies a Reject of a *proposed* embargo that is not active MUST
      leave the sender's row for the active embargo unchanged. A signatory's rejection
      of a proposed revision refuses those terms; it is not withdrawal from the embargo
      in force. When no embargo is in force (EM PROPOSED), a Reject of a proposal
      declines that proposal's row only. It withdraws from nothing, and the
      participant's AGREED rows for other open proposals stay AGREED.
    rationale: >-
      Consent is per embargo, so a signatory who refuses proposed terms is still bound
      by, and still consents to, the embargo that remains active; only the Case Owner
      decides whether the proposal replaces it (MSM-07-009, ADR-0122).
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` assert that a
      signatory rejecting a proposed revision keeps its AGREED row for the active
      embargo, and
      `test/core/services/embargo_lifecycle/test_pec.py`
      (`test_record_actor_rejection_withdrawal_declines_every_agreed_proposal`) asserts
      that a Reject of one open revision leaves the participant's rows for the active
      embargo and for the other open proposals unchanged, and
      `test_a_reject_of_one_proposal_keeps_the_other_agreed_proposals` in the same file
      covers EM PROPOSED with two AGREED proposals.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-004
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2026_090
  - id: MSM-07-016
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER's own Reject of a proposal is its abandonment of the proposal
      (EMB-16-001). A replica MUST tell it from a participant's Reject by the payload's
      `actor` (ADR-0152).
    rationale: >-
      A CASE_MANAGER act with a participant's verb and object carries the participant's
      semantic type (ADR-0152), so the CASE_MANAGER's abandonment and a participant's
      refusal share one. The abandonment cancels the proposal, and is ER (MSM-02-006);
      the refusal declines only the sender's row (MSM-07-004). Only the `actor` tells
      them apart.
    verification: >-
      `test_a_reject_is_the_abandonment_only_from_the_case_manager` in
      `test/core/behaviors/sync/nodes/test_embargo_abandonment_effect.py` routes the two
      Rejects.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-004
    - rel_type: depends_on
      spec_id: MSM-07-017
    - rel_type: refines
      spec_id: MSM-02-006
    adr:
    - ADR-0152
    stories:
    - story_2026_072
  - id: MSM-07-017
    priority: MUST
    kind: protocol
    statement: >-
      A CASE_MANAGER can hold an embargo stake of its own (EP-09-002). It MUST record a
      change of its own consent as its `Update(EmbargoConsent)` of the row. MSM-07-018
      bans recording it as a Reject(Invite(EmbargoEvent)).
    rationale: >-
      The CASE_MANAGER's own consent is the row it changes (CLP-07-013). Recording it as
      an Update keeps every CASE_MANAGER-sent Reject an abandonment (MSM-07-016), so a
      replica never has to guess which one the CASE_MANAGER meant.
    verification: >-
      `test_the_managers_own_reject_is_its_update_of_the_row` in
      `test/core/use_cases/received/test_embargo_proposal_answer_copy.py`
      asserts the CASE_MANAGER's own Reject commits only its
      `Update(EmbargoConsent)` and the replica copies the DECLINED row.
    adr:
    - ADR-0152
    stories:
    - story_2026_001
  - id: MSM-07-018
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A CASE_MANAGER MUST NOT send or commit a Reject(Invite(EmbargoEvent)) as a change
      of its
      own consent.
    rationale: >-
      Every CASE_MANAGER-sent Reject is its abandonment of the proposal (MSM-07-016,
      ADR-0152). A Reject sent as its consent would cancel the proposal for everyone.
    verification: >-
      `test_the_managers_own_reject_is_its_update_of_the_row` in
      `test/core/use_cases/received/test_embargo_proposal_answer_copy.py`
      asserts the CASE_MANAGER's own Reject commits only its
      `Update(EmbargoConsent)`, never the Reject.
    relationships:
    - rel_type: extends
      spec_id: MSM-07-017
    adr:
    - ADR-0152
    stories:
    - story_2026_001
- id: MSM-08
  title: Occasions
  description: >-
    Requirements for the occasion, the unit of the message lookup table: a situation in
    a case that a sender conveys with a wire activity, sometimes narrowed by a
    distinguishing field value, state context or sender standing (glossary, Messaging
    and Protocol). One `SEMANTIC_REGISTRY` entry has one or more occasions. Occasions
    are declared on the entry, and the lookup table and the per-occasion reference
    sections are renderings of them. Decision: ADR-0128.
  specs:
  - id: MSM-08-001
    priority: MUST
    kind: process
    statement: >-
      Every `SEMANTIC_REGISTRY` entry outside the dispatcher-fallback exemptions
      (MSM-06-002) MUST declare at least one occasion.
    rationale: The lookup table is complete only if every wire activity has a row.
    verification: >-
      A test enumerates `SEMANTIC_REGISTRY` and asserts every non-exempt entry has at
      least one occasion.
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-015
    priority: MUST
    kind: process
    statement: >-
      Each occasion MUST state when it applies, a stable anchor ID, a description and
      the example that renders it.
    rationale: >-
      These are the fields the lookup table and the occasion section render, so an
      occasion without one leaves a gap in the reference.
    verification: >-
      A unit test asserts that an occasion missing one of these fields fails at
      construction.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-001
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-016
    priority: MUST
    kind: process
    statement: >-
      Construction of a non-exempt `SEMANTIC_REGISTRY` entry with no occasion MUST fail.
    rationale: >-
      A construction-time failure makes a new registry entry without an occasion
      impossible, not merely detectable, so completeness does not depend on a ratchet
      someone remembers to extend.
    verification: >-
      A unit test constructs a `SemanticEntry` with no occasion and asserts it raises.
    relationships:
    - rel_type: implements
      spec_id: MSM-08-001
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-002
    priority: MUST
    kind: process
    statement: >-
      An occasion's distinguisher MUST be a field value, a state context or a sender
      standing.
    rationale: '"Distinguished by" is what tells two occasions of one wire activity
      apart when they share an addressee (MSM-08-009), such as vendor awareness and fix
      ready on `Add(ParticipantStatus)`. A free-text distinguisher can name a value no
      implementation sends. Some occasions differ only in who sends them: the
      Case Owner''s request to invite an actor and a participant''s suggestion are one
      `Offer(Actor)`, and the CASE_MANAGER answers them differently (CM-17-007,
      CM-16-003).'
    verification: >-
      A unit test asserts that an occasion's distinguisher is one of the three kinds.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: depends_on
      spec_id: MSM-08-010
    adr:
    - ADR-0128
  - id: MSM-08-017
    priority: MUST
    kind: process
    statement: >-
      A field-value distinguisher MUST be a member of that field's enum.
    rationale: >-
      Typing the value against the enum makes a renamed or retired value fail at
      construction, rather than name a value no implementation sends.
    verification: >-
      A unit test asserts that an occasion whose field value is not a member of the
      field's enum fails at construction.
    relationships:
    - rel_type: refines
      spec_id: MSM-08-002
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-018
    priority: MUST
    kind: process
    statement: >-
      A state-context distinguisher MUST name a state machine, and states that are
      members of that machine's state enum.
    rationale: >-
      Typing the states against the machine's enum makes a renamed or retired state
      fail at construction.
    verification: >-
      A unit test asserts that an occasion whose state context names a state outside
      its machine's enum fails at construction.
    relationships:
    - rel_type: refines
      spec_id: MSM-08-002
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-019
    priority: MUST
    kind: process
    statement: >-
      A sender-standing distinguisher MUST name a `SenderEntitlementKind` member and
      whether the sender holds it.
    rationale: >-
      The sender's standing is typed by the entitlement kinds a receiver already checks
      (HP-01-009), so it has one vocabulary and its wording comes from the kind
      (MSM-08-010).
    verification: >-
      A unit test asserts that an occasion whose sender standing names no
      `SenderEntitlementKind` member fails at construction.
    relationships:
    - rel_type: refines
      spec_id: MSM-08-002
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-003
    priority: MUST
    kind: process
    statement: >-
      Each occasion's example MUST dispatch to the occasion's own `SEMANTIC_REGISTRY`
      entry.
    rationale: >-
      An example that dispatches elsewhere would show the reader a different wire
      activity from the one the occasion describes.
    verification: >-
      A parametrized test over every occasion asserts that its example matches exactly
      the occasion's own entry pattern.
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-020
    priority: MUST
    kind: process
    statement: >-
      An occasion whose distinguisher is a field value MUST have an example that carries
      that field value.
    rationale: Dispatch alone does not tell occasions of one entry apart. Vendor
      awareness, fix readiness and fix deployed all dispatch to
      `Add(ParticipantStatus)`, so one shared example would dispatch correctly for
      each yet show two of them a status value that is not theirs. No example can carry
      a state context, such as the receiver's EM state or the CASE_MANAGER's register
      status of the named embargo.
    verification: >-
      A parametrized test over every occasion with a field-value distinguisher asserts
      that the example carries that field value.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-003
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-004
    priority: MUST
    kind: process
    statement: >-
      Occasion anchor IDs MUST be unique across `SEMANTIC_REGISTRY`.
    rationale: The table links each row to its details by anchor. A duplicate anchor
      links two rows to one section.
    verification: >-
      A test asserts anchor uniqueness across the registry.
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-021
    priority: MUST
    kind: process
    statement: >-
      Each occasion anchor MUST resolve to exactly one section on the entry's message
      page.
    rationale: >-
      A table row links to its details by anchor, so the anchor has to land on one
      section.
    verification: >-
      A test over the message pages asserts that each anchor resolves to exactly one
      section.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-004
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-022
    priority: MUST
    kind: process
    statement: >-
      A row of the lookup table MUST reference every occasion section.
    rationale: >-
      An unreferenced section is reference content no reader can reach from the table.
    verification: >-
      A test over the message pages asserts that each occasion section is referenced
      by a table row.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-004
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-005
    priority: MUST
    kind: process
    statement: >-
      The lookup table's "Sent by" value MUST be derived from the side of the sender
      entitlement that the occasion's received use case declares (HP-01-007,
      HP-01-008). That side is the one matching the occasion's addressee (MSM-08-009),
      and the value is worded from its entitlement kinds (MSM-08-010).
    rationale: 'The entitlement is the rule a receiver applies, so it is what another
      implementation must satisfy, and deriving it means it cannot drift from the code.
      It is often broader than the CVD convention: any active participant may announce
      that a fix is ready, though in practice a vendor does. Positions such as the
      invitee are entitlement kinds (HP-01-009), so they appear in the derived value.'
    verification: >-
      A test asserts that each rendered "Sent by" value equals the wording of the kinds on
      the declared rule's side for the occasion's addressee.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: depends_on
      spec_id: HP-01-007
    - rel_type: depends_on
      spec_id: HP-01-008
    adr:
    - ADR-0115
    - ADR-0128
    - ADR-0129
  - id: MSM-08-023
    priority: MUST
    kind: process
    statement: >-
      The lookup table's "Sent by" value MUST state an exempt use case as not yet
      checked.
    rationale: >-
      An exempt use case declares no rule to derive the value from, so the table says
      so rather than imply one.
    verification: >-
      A test asserts that the rendered "Sent by" value of an exemption is the
      not-yet-checked wording.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-005
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0115
    - ADR-0128
  - id: MSM-08-024
    priority: MUST
    kind: process
    statement: >-
      The lookup table's "Sent by" value MUST state an entry with no received use case
      as internal to the CASE_MANAGER (SE-05-002).
    rationale: >-
      An entry with no received use case is an act the CASE_MANAGER role performs on
      its own case, whichever actor holds that role. No receiver handles it, though it
      may still be committed to the case ledger, so "not handled" would misread it as
      an unsupported message.
    verification: >-
      A test asserts that the rendered "Sent by" value of an entry with no received use
      case is the "internal to the CASE_MANAGER" wording.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-005
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-025
    priority: MAY
    kind: process
    statement: >-
      An occasion MAY add the CVD roles that usually send it.
    rationale: >-
      The usual-role note gives the CVD convention without replacing the entitlement
      rule.
    adr:
    - ADR-0128
  - id: MSM-08-026
    priority: MUST
    kind: process
    statement: >-
      Each usual-sender CVD role that an occasion adds MUST be a value of `CVDRole`.
    rationale: >-
      Typing the role against the enum keeps the note to roles the protocol defines.
    verification: >-
      A test asserts that every usual-role value is a `CVDRole` member.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-025
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-006
    priority: MUST
    kind: process
    statement: >-
      The mapping status that MSM-06-003 requires MUST be derived from the occasions and
      their shorthands.
    rationale: 'A declared status is a second copy of what the shorthands already say,
      and the two disagreed: `EP` was tagged as expanding to `Create(Event)` and
      `Announce(EmbargoEvent)`, where MSM-02-001 maps it to `Invite(EmbargoEvent)` alone.'
    verification: >-
      A unit test builds an entry whose occasions carry one shorthand, an entry whose
      occasions carry several distinct shorthands, one shorthand spread across several
      entries, and an entry with no shorthand, and asserts the derived status is direct,
      collapse, expansion and none respectively. Several occasions sharing one shorthand
      on one entry derive direct, not collapse.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: MSM-06-003
    adr:
    - ADR-0128
  - id: MSM-08-027
    priority: MUST_NOT
    kind: process
    statement: >-
      A `SEMANTIC_REGISTRY` entry MUST NOT declare its mapping status, except as
      MSM-08-028 allows.
    rationale: >-
      A declared status drifts from the shorthands it should be derived from
      (MSM-08-006).
    verification: >-
      Inspection of `SemanticEntry` confirms it has no mapping-status field.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-006
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-028
    priority: MAY
    kind: process
    statement: >-
      An occasion MAY declare a mechanism that evolved per MSM-05.
    rationale: >-
      An evolved mechanism has no shorthand to count, so it alone is declared.
    verification: >-
      A unit test builds an occasion that declares an evolved mechanism and asserts the
      derived status is evolved.
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-007
    priority: MUST
    kind: process
    statement: >-
      An occasion's "when" text MUST describe the sender's situation. This holds for
      protocol mechanics and for a `Create` that precedes an `Add`, as well as for CVD
      events.
    rationale: 'One grammar lets a reader scan the "When…" column by situation.'
    verification: >-
      Review of each occasion confirms the "when" text names the sender's situation.
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-029
    priority: MUST
    kind: process
    statement: >-
      Every occasion's prose fields MUST follow the documentation style guide
      (DF-09-001), use the glossary's canonical terms (DF-09-002) and address no reader.
    rationale: 'The prose lives in Python, outside the reach of DF-09-001 as written,
      yet renders on reference pages and in how-to guides; a fragment with more than one
      host must satisfy the rules of each (DF-09-012), so it can use neither the how-to
      "you" nor reference-only phrasing.'
    verification: >-
      The generated occasion fragments under `docs/` are `lint-docs` targets
      (DF-09-007).
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: extends
      spec_id: DF-09-001
    - rel_type: depends_on
      spec_id: DF-09-012
    adr:
    - ADR-0128
  - id: MSM-08-008
    priority: MUST
    kind: process
    statement: A lookup-table row's details link MUST name the formal protocol message
      and its shorthand when the occasion has a shorthand that expands to no other
      entry, and otherwise the plain-English heading of the occasion's section.
    rationale: DF-09-010 requires reader-facing docs to name a protocol activity by its
      formal name and code paired with its wire form. The row supplies the wire form in
      "Send", so the link text supplies the name, for example "Fix Readiness (CF)".
      Where one shorthand expands across several entries, as `GI` does, DF-09-010 lets
      the plain-English heading stand in, since the formal name would label every row
      of the expansion alike.
    verification: >-
      A test over the generated table asserts that each details link text equals the
      formal message name and shorthand for an occasion whose shorthand expands to no
      other entry, and the section heading for an expansion or an occasion with no
      shorthand.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: depends_on
      spec_id: DF-09-010
    adr:
    - ADR-0128
  - id: MSM-08-009
    priority: MUST
    kind: process
    statement: >-
      Each occasion MUST declare its addressee as one of the sides a sender entitlement
      can have. The sides are the CASE_MANAGER, a participant, or an actor outside any
      case for an activity sent before a case exists.
    rationale: 'An emitter looks up its own situation. One wire activity can carry two
      occasions with different senders: a participant proposing an embargo sends
      `Invite(EmbargoEvent)` to the CASE_MANAGER, and the CASE_MANAGER asking a
      participant about
      a proposal sends `Invite(EmbargoEvent)` to that participant. Both match one
      registry entry
      and one use case, so only the addressee tells the two rows which side of the rule
      gives their sender. See ADR-0129.'
    verification: >-
      A test over every non-exempt occasion asserts that its addressee is a side of its
      use case's declared rule.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: depends_on
      spec_id: HP-01-024
    adr:
    - ADR-0129
  - id: MSM-08-030
    priority: MUST
    kind: process
    statement: >-
      The lookup table MUST render an occasion's addressee as the row's "Send to" value.
    rationale: >-
      The addressee is what tells two rows of one wire activity apart, so the reader
      has to see it.
    verification: >-
      A test over every non-exempt occasion asserts that the rendered "Send to" value
      names its addressee.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-009
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0129
  - id: MSM-08-031
    priority: MUST
    kind: process
    statement: >-
      Construction MUST fail for an occasion of a non-exempt use case whose addressee is
      not a side of that use case's declared rule.
    rationale: >-
      An addressee the rule lacks would give the row a sender no receiver admits.
    verification: >-
      A unit test asserts that an occasion naming a side its rule lacks fails.
    relationships:
    - rel_type: implements
      spec_id: MSM-08-009
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0129
  - id: MSM-08-010
    priority: MUST
    kind: process
    statement: >-
      Each entitlement kind MUST declare the wording a "Sent by" value uses for it and
      the glossary term that defines it.
    rationale: A wording table kept apart from the kinds is a second copy that drifts when
      a kind is added. Declaring the wording on the kind makes a new kind incomplete until
      it can be rendered and defined. See ADR-0129.
    verification: >-
      A test asserts that every entitlement kind has non-empty wording and a glossary
      term.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: depends_on
      spec_id: HP-01-009
    adr:
    - ADR-0129
  - id: MSM-08-032
    priority: MUST
    kind: process
    statement: >-
      The glossary term that an entitlement kind declares MUST exist in the glossary.
    rationale: >-
      A term that the glossary lacks defines nothing for the reader.
    verification: >-
      A test asserts that each declared term is present in
      `docs/reference/glossary.md`.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-010
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0129
  - id: MSM-08-033
    priority: MUST
    kind: process
    statement: >-
      The addressee kind's wording MUST name the request from the object type of the
      activity being answered.
    rationale: >-
      The addressee kind serves every request type but an Invite, so its wording takes
      the request from the answered activity's object type to stay identified ("the
      addressee of the case proposal") without a kind per request.
    verification: >-
      A test asserts that the addressee wording for the case proposal answers names the
      case proposal.
    relationships:
    - rel_type: refines
      spec_id: MSM-08-010
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0129
  - id: MSM-08-011
    priority: MUST
    kind: process
    statement: >-
      Each occasion that shares a `SEMANTIC_REGISTRY` entry and an addressee with
      another occasion MUST declare a distinguisher.
    rationale: The lookup table is how a receiver finds which occasion an activity is.
      Two same-addressee occasions with no distinguisher render as two rows only prose
      separates, so a receiver cannot tell which one an activity is.
    verification: >-
      A unit test asserts that a registry with two occasions on one entry and one
      addressee fails when either has no distinguisher, and that `msm-occasions
      --check` passes on `SEMANTIC_REGISTRY`.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: depends_on
      spec_id: MSM-08-002
    - rel_type: depends_on
      spec_id: MSM-08-009
    adr:
    - ADR-0128
  - id: MSM-08-034
    priority: MUST
    kind: process
    statement: >-
      The distinguishers of occasions that share a `SEMANTIC_REGISTRY` entry and an
      addressee MUST differ.
    rationale: >-
      Two equal distinguishers tell the rows apart no better than none.
    verification: >-
      A unit test asserts that a registry with two such occasions fails when both
      declare the same distinguisher.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-011
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-035
    priority: MUST_NOT
    kind: process
    statement: >-
      Two such distinguishers of one kind on one field, state machine or entitlement
      kind MUST NOT overlap. Two field values or state contexts overlap when they share
      a field value or a state. Two sender standings overlap unless they differ in
      whether the sender holds the kind.
    rationale: >-
      Distinguishers that overlap, such as EM `NONE` and `PROPOSED` against `PROPOSED`,
      still let one activity match two rows. Different fields or machines are not
      compared, since one activity may carry both values by design.
    verification: >-
      A unit test asserts that a registry fails when two such occasions are state
      contexts on one machine that share a state.
    relationships:
    - rel_type: extends
      spec_id: MSM-08-034
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-036
    priority: MUST
    kind: process
    statement: >-
      Construction of a registry that breaks MSM-08-011, MSM-08-034 or MSM-08-035 MUST
      fail.
    rationale: >-
      A construction-time failure makes an ambiguous lookup table impossible, not merely
      detectable.
    verification: >-
      The unit tests of MSM-08-011, MSM-08-034 and MSM-08-035 build each broken
      registry and assert it fails.
    relationships:
    - rel_type: implements
      spec_id: MSM-08-011
    lint_suppress:
    - phantom_path_ref
    adr:
    - ADR-0128
  - id: MSM-08-012
    priority: MUST
    kind: process
    statement: >-
      Each occasion whose activity moves a protocol state machine MUST declare each
      transition it carries, as a trigger of that machine.
    rationale: >-
      An occasion is the bridge from a formal protocol message to its wire form, and
      without a link its effect is prose that can drift from the transition table
      actors' moves are held to (#5172). One occasion may carry several: a
      Case Owner's embargo activation moves the case's EM and the owner's PEC
      consent row (MSM-07-008). An occasion that moves no machine, such as a note, a ledger
      replication, an acknowledgment or an error, declares none.
    verification: >-
      A unit test asserts that every declared trigger is a member of its machine's
      trigger enum and appears in that machine's statechart (SM-11-001), and that an
      occasion with an RM, EM or CS shorthand other than an acknowledgment or an error
      declares a transition.
    relationships:
    - rel_type: depends_on
      spec_id: SM-11-001
    adr:
    - ADR-0162
  - id: MSM-08-013
    priority: MUST
    kind: process
    statement: >-
      Each declared transition MUST state whose state it moves: the sender's, the
      receiver's or the case's.
    rationale: >-
      No rule on the machine alone gives it. SM-10-001 has a received RM move update
      the sender's status, but a report submission moves the receiver's RM, and a
      participant's public-state observation is adopted into the case's state, so a
      derivation would hide special cases in generator code. Another implementer reads
      this fact off the table.
    verification: >-
      A unit test asserts that no occasion declares the case's state for RM, VF, D or
      PEC (a PEC row belongs to one participant), and none declares a participant's
      state for EM or PXA. SM-10-003 scopes RM and VFD; SM-10-004 scopes EM and PXA.
    relationships:
    - rel_type: depends_on
      spec_id: MSM-08-012
    - rel_type: depends_on
      spec_id: SM-10-003
    - rel_type: depends_on
      spec_id: SM-10-004
    adr:
    - ADR-0162
  - id: MSM-08-014
    priority: MUST
    kind: process
    statement: >-
      An occasion section's statement of the state change its activity causes MUST be
      generated from the occasion's declared transition.
    rationale: >-
      A hand-typed effect in the description is the drift MSM-08-012 removes. The
      generated line names the machine, whose state moves, and the source and
      destination states the chart gives for the trigger.
    verification: >-
      `msm-occasions --check` fails when a committed section differs from a fresh
      generation, and a unit test asserts that no occasion description holds an
      effect sentence, matched as a verb such as "moves" or "sets" followed within the
      sentence by an RM, EM or CS state name.
    relationships:
    - rel_type: depends_on
      spec_id: MSM-08-013
    adr:
    - ADR-0162
