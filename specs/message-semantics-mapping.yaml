    - story_2022_103
    - story_2022_081
  - id: MSM-03-004
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `CP` (Public Aware) MUST have the semantic type
      `ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` when a participant
      reports it, which it does only in the `CaseStatus` that its
      `Add(ParticipantStatus)[target=CaseParticipant]` embeds (RSH-04-001), and
