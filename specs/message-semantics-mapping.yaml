id: MSM
title: Protocol Shorthand to MessageSemantics Mapping
description: 'Authoritative normative bridge from protocol message shorthand labels (RS, EP, CV, etc.) used in behavioral
  conformance specs to their MessageSemantics enum values and corresponding AS2 wire-format specifications. Each entry provides
  one row in the three-hop chain: shorthand to MessageSemantics enum value to AS2 wire form. The correspondence is
  many-to-many in both directions: several shorthands may collapse onto one wire
  activity (CV/CF onto vfState, CP/CX/CA onto
  pxaState, EV onto EP), and one shorthand may expand across several wire
  activities (GI, ER). Shorthands with
  no dedicated dispatch value are the protocol-layer error and acknowledgment signals; these are not unimplemented — the
  purposes they name are served by mechanisms partitioned on a different axis, specified normatively in MSM-05.'
scope:
- prototype
- production
tags:
- messaging
- protocol
- documentation
groups:
- id: MSM-01
  title: RM Protocol Message Shorthands
  description: Normative shorthand-to-semantic mappings for Report Management (RM) protocol messages, covering RS, RI, RV,
    RD, RA, RC, RE, and RK.
  specs:
  - id: MSM-01-001
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RS` (Report Submission) MUST have the semantic type
      `SUBMIT_REPORT`; its AS2 wire form is `Offer(VulnerabilityReport)` per VAM-02-002.
    rationale: >-
      Report submission opens a CVD exchange, so a recipient on any implementation must
      recognize it as a report submission and not some other activity. `Offer` fits
      because the reporter puts the report before the recipient for a decision, which
      the recipient's RV, RI or RC then answers by naming that Offer.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.SUBMIT_REPORT`
      is paired with an `ActivityPattern` matching `Offer(VulnerabilityReport)` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-002
    stories:
    - story_2022_012
    - story_2022_038
  - id: MSM-01-002
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RI` (Report Invalid) MUST have the semantic type
      `INVALIDATE_REPORT`; its AS2 wire form is
      `TentativeReject(Offer(VulnerabilityReport))` per VAM-02-005. This is the direct
      report recipient's RI; a participant that joined through an Invite sends RI as the
      full-case Invite reply of VAM-04-013.
    rationale: >-
      Invalidating a report answers the reporter's Offer, so the reply names it.
      `TentativeReject` marks the decision as reversible, since an invalid report can
      become valid when new information arrives, and keeps RI distinct from the final
      `Reject` of RC. A participant that joined through an Invite has no Offer to
      answer, so its RI rides the Invite reply instead.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.INVALIDATE_REPORT`
      is paired with an `ActivityPattern` matching
      `TentativeReject(Offer(VulnerabilityReport))` in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-005
    adr:
    - ADR-0121
    stories:
    - story_2022_101
    - story_2022_006
  - id: MSM-01-003
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RV` (Report Valid) MUST have the semantic type
      `VALIDATE_REPORT`; its AS2 wire form is
      `Accept(Offer(VulnerabilityReport))` per VAM-02-004. This is the direct report
      recipient's RV; a participant that joined through an Invite sends RV as the
      full-case Invite reply of VAM-04-012.
    rationale: >-
      Validating a report answers the reporter's Offer, so the reply names it, and
      `Accept` says the recipient takes the report as a real vul to handle. Report
      validity is a separate decision from engaging in the case (RA), so RV needs its
      own form. A participant that joined through an Invite has no Offer to answer, so
      its RV rides the Invite reply instead.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.VALIDATE_REPORT`
      is paired with an `ActivityPattern` matching `Accept(Offer(VulnerabilityReport))`
      in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-004
    adr:
    - ADR-0121
    stories:
    - story_2022_101
    - story_2022_006
  - id: MSM-01-004
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RD` (Report/Case Deferred) MUST have the semantic type
      `DEFER_CASE`; its AS2 wire form is `Ignore(VulnerabilityCase)` per VAM-03-004.
    rationale: A deferred report indicates the receiving actor will not engage with the case at this time. The wire representation
      uses `Ignore(VulnerabilityCase)` rather than a report-level verb because deferral is a case-participation decision,
      not a report-validity judgment.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.DEFER_CASE` is
      paired with an `ActivityPattern` matching `Ignore(VulnerabilityCase)` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-03-004
    stories:
    - story_2022_006
    - story_2022_086
  - id: MSM-01-005
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RA` (Report/Case Accepted) MUST have the semantic type
      `ENGAGE_CASE`; its AS2 wire form is `Join(VulnerabilityCase)` per VAM-03-003.
    rationale: Accepting a report means the receiving actor commits to engaging with the vulnerability case. The wire verb
      `Join` captures the case-participation decision, symmetric with `Ignore` for `RD`.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.ENGAGE_CASE` is
      paired with an `ActivityPattern` matching `Join(VulnerabilityCase)` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-03-003
    stories:
    - story_2022_006
    - story_2022_013
  - id: MSM-01-006
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RC` (Report Closed) MUST have the semantic type
      `CLOSE_REPORT`; its AS2 wire form is
      `Reject(Offer(VulnerabilityReport))` per VAM-02-006. This is the direct report
      recipient's RC; a participant that joined through an Invite sends RC as the
      full-case Invite reply of VAM-04-014.
    rationale: >-
      Closing a report answers the reporter's Offer, so the reply names it. `Reject` is
      final, which tells the reporter the report will not be reconsidered and keeps RC
      distinct from the reversible `TentativeReject` of RI. A participant that joined
      through an Invite has no Offer to answer, so its RC rides the Invite reply
      instead.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.CLOSE_REPORT`
      is paired with an `ActivityPattern` matching `Reject(Offer(VulnerabilityReport))`
      in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-006
    adr:
    - ADR-0121
    stories:
    - story_2022_006
    - story_2022_101
  - id: MSM-01-007
    priority: MUST
    kind: project
    statement: Protocol shorthand `RE` (Report Management Error) has no dedicated `MessageSemantics` dispatch value and no
      entry in `SEMANTIC_REGISTRY`; report-management error conditions MUST instead be reported through the
      failure-mode mechanisms specified in MSM-05-001.
    rationale: '`RE` names an error condition scoped to report management. The implementation does not partition faults by
      state machine, so there is no `RE`-shaped wire form; it partitions by failure mode instead — not understood, declined,
      or needing explanation (MSM-05-001). Read this entry as "mapped onto a different axis", not as "unimplemented".'
    relationships:
    - rel_type: refines
      spec_id: MSM-05-001
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `RE`; a unit test asserts this absence to prevent
      unintended additions.
    adr:
    - ADR-0083
  - id: MSM-01-008
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RK` (Report Management Acknowledgment) MUST have the semantic
      type `ACK_REPORT`; its AS2 wire form is `Read(Offer(VulnerabilityReport))` per
      VAM-02-003.
    rationale: >-
      A reporter needs to know its report arrived before any validity decision is made.
      `Read` acknowledges receipt of the Offer without judging it. Report submission
      happens before any case ledger exists, so no hash-chain acknowledgement covers it
      (MSM-05-002) and it needs this explicit one.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.ACK_REPORT` is
      paired with an `ActivityPattern` matching `Read(Offer(VulnerabilityReport))` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-003
    stories:
    - story_2022_016
    - story_2022_002
- id: MSM-02
  title: EM Protocol Message Shorthands
  description: Normative shorthand-to-semantic mappings for Embargo Management (EM) protocol messages, covering EP, EA, EV,
    EJ, EC, ER, ET, EE, and EK. The formal message set models the case's view of the
    embargo, so an acceptance or rejection shorthand names the Case Owner's decision
    that makes its EM transition, not each Participant's answer to the Invite.
    Embargo revision shorthands (EV, EJ, EC) share wire formats with their
    initial-proposal counterparts (EP, ER, EA); the distinction is contextual rather
    than structural.
  specs:
  - id: MSM-02-001
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `EP` (Embargo Proposed) MUST have the semantic type
      `INVITE_TO_EMBARGO_ON_CASE`; its AS2 wire form is
      `Invite(EmbargoEvent)[context=VulnerabilityCase]` per VAM-05-005.
    rationale: >-
      Proposing an embargo asks each participant to consent to the proposed terms, which
      is what `Invite` expresses; the `Event` is the proposed embargo. The `context`
      names the case, so a receiver can tie the proposal to that case's EM state. One
      wire form lets every implementation recognize a proposal.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.INVITE_TO_EMBARGO_ON_CASE` is paired with an `ActivityPattern`
      matching `Invite(EmbargoEvent)[context=VulnerabilityCase]` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-005
    stories:
    - story_2026_085
    - story_2022_010
  - id: MSM-02-002
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `EA` (Embargo Accepted) MUST have the semantic type
      `ACTIVATE_EMBARGO_ON_CASE`; its AS2 wire form is
      `Accept(EmbargoEvent)[target=VulnerabilityCase]` per VAM-05-008, the Case Owner's
      decision that moves EM from PROPOSED to ACTIVE (MSM-07-008).
    rationale: >-
      EA names the EM transition PROPOSED to ACTIVE, and only the Case Owner's decision
      makes it. A Participant's `Accept(Invite(EmbargoEvent))` records that Participant's
      consent (MSM-07-003) and moves no register entry, so mapping EA to it would name a
      message that never makes EA's transition. The consent answers are what the Case
      Owner weighs before it decides (MSM-02-010).
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.ACTIVATE_EMBARGO_ON_CASE` is paired with an `ActivityPattern`
      matching `Accept(EmbargoEvent)[target=VulnerabilityCase]` in `SEMANTIC_REGISTRY`, and
      `test/test_semantic_activity_patterns.py` asserts that it is told apart from the
      Accept of the Invite.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-008
    stories:
    - story_2026_087
    - story_2022_023
  - id: MSM-02-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Protocol shorthand `EV` (Embargo Revision Proposed) MUST dispatch as `MessageSemantics.INVITE_TO_EMBARGO_ON_CASE`;
      its AS2 wire form is `Invite(EmbargoEvent)[context=VulnerabilityCase]` per
      VAM-05-005 — identical to `EP`. The revision context
      is inferred from the presence of an active embargo.
    rationale: EV, EJ, and EC are aliases for EP, ER, and EA at the wire layer (`vultron/bt/messaging/states.py`). The distinction
      between initial proposal and revision proposal is not encoded in the AS2 activity structure; implementations MUST infer
      it from local EM state.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-005
  - id: MSM-02-004
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `EJ` (Embargo Revision Rejected) MUST have the semantic type
      `REJECT_EMBARGO_PROPOSAL_ON_CASE`; its AS2 wire form is
      `Reject(EmbargoEvent)[target=VulnerabilityCase]` per VAM-05-009, the Case Owner's
      decision that returns EM from REVISE to ACTIVE with the prior terms in force
      (MSM-07-009).
    rationale: >-
      EJ names the EM transition REVISE to ACTIVE, and only the Case Owner's rejection
      of the revision makes it; a Participant's `Reject(Invite(EmbargoEvent))` of the revision
      declines that Participant's consent row and nothing else (MSM-07-004). EJ shares
      its wire form with the Case Owner's ER, and the receiver's EM state tells the two
      apart, as MSM-02-003 does for EV.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.REJECT_EMBARGO_PROPOSAL_ON_CASE` is paired with an
      `ActivityPattern` matching `Reject(EmbargoEvent)[target=VulnerabilityCase]` in
      `SEMANTIC_REGISTRY`, and `test/test_semantic_activity_patterns.py` asserts that it
      is told apart from the Reject of the Invite.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-009
    stories:
    - story_2026_087
    - story_2022_007
  - id: MSM-02-005
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `EC` (Embargo Revision Accepted) MUST have the semantic type
      `ACTIVATE_EMBARGO_ON_CASE`; its AS2 wire form is
      `Accept(EmbargoEvent)[target=VulnerabilityCase]` per VAM-05-008, the Case Owner's
      decision that replaces the active embargo with the revision and moves EM from
      REVISE to ACTIVE (MSM-07-008).
    rationale: >-
      EC names the EM transition REVISE to ACTIVE, and only the Case Owner's activation
      of the revision makes it; a Participant's `Accept(Invite(EmbargoEvent))` of the revision
      records that Participant's consent and binds it to nothing new (MSM-07-003). EC
      shares its wire form with EA, and the receiver's EM state tells the two apart, as
      MSM-02-003 does for EV.
    verification: >-
      Inspection of `vultron/wire/` confirms that EC shares the
      `ACTIVATE_EMBARGO_ON_CASE` semantic with EA, and
      `test/test_semantic_activity_patterns.py` asserts that it is told apart from the
      Accept of the Invite.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-008
    stories:
    - story_2026_087
    - story_2022_023
  - id: MSM-02-006
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `ER` (Embargo Rejected) MUST have the semantic type
      `REJECT_EMBARGO_PROPOSAL_ON_CASE`, with AS2 wire form
      `Reject(EmbargoEvent)[target=VulnerabilityCase]` per VAM-05-009, for the Case Owner's
      decision that rejects a proposal, and the semantic type
      `REJECT_INVITE_TO_EMBARGO_ON_CASE`, with AS2 wire form
      `Reject(Invite(EmbargoEvent)[context=VulnerabilityCase])` per VAM-05-007, for the
      CASE_MANAGER's abandonment of a proposal (EMB-16-001); either moves EM from
      PROPOSED to NONE once no other proposal is open.
    rationale: >-
      ER names the EM transition PROPOSED to NONE, and two activities make it: the Case
      Owner's rejection of the proposal (MSM-07-009) and the CASE_MANAGER's abandonment,
      which cancels the proposal once the case is public, exploited or attacked. A
      Participant's `Reject(Invite(EmbargoEvent))` declines only that Participant's
      consent row
      (MSM-07-004), and a replica tells it from the abandonment by the payload's `actor`
      (ADR-0152).
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.REJECT_EMBARGO_PROPOSAL_ON_CASE` is paired with an
      `ActivityPattern` matching `Reject(EmbargoEvent)[target=VulnerabilityCase]` and
      `MessageSemantics.REJECT_INVITE_TO_EMBARGO_ON_CASE` with one matching
      `Reject(Invite(EmbargoEvent)[context=VulnerabilityCase])` in `SEMANTIC_REGISTRY`;
      `test/core/behaviors/embargo/nodes/test_abandon.py` asserts the CASE_MANAGER's
      abandonment.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-009
    - rel_type: derives_from
      spec_id: VAM-05-007
    stories:
    - story_2026_087
    - story_2022_007
  - id: MSM-02-007
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `ET` (Embargo Terminated) MUST have the semantic type `REMOVE_EMBARGO_EVENT_FROM_CASE`;
      its AS2 wire form is `Remove(EmbargoEvent)` per VAM-05-003.
    rationale: >-
      Ending an embargo takes the embargo event off the case, which is what `Remove`
      expresses. A verb distinct from `Reject` keeps the end of an active embargo apart
      from a refusal of a proposal, so every participant knows the embargo has ended
      and binds no one.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.REMOVE_EMBARGO_EVENT_FROM_CASE` is paired with an
      `ActivityPattern` matching `Remove(EmbargoEvent)` in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-003
    stories:
    - story_2026_095
    - story_2022_015
  - id: MSM-02-008
    priority: MUST
    kind: project
    statement: Protocol shorthand `EE` (Embargo Management Error) has no dedicated `MessageSemantics` dispatch value and no
      entry in `SEMANTIC_REGISTRY`; embargo-management error conditions MUST instead be reported through the
      failure-mode mechanisms specified in MSM-05-001.
    rationale: >-
      Symmetric with MSM-01-007 (`RE`): faults are partitioned by failure mode rather
      than by state machine, so no embargo-scoped error wire form exists.
    note: >-
      Tests SHOULD assert that `EE` is absent from `MessageSemantics` and the semantic
      registry to catch unintended additions.
    relationships:
    - rel_type: refines
      spec_id: MSM-05-001
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `EE`; a unit test asserts this absence to prevent
      unintended additions.
    adr:
    - ADR-0083
  - id: MSM-02-009
    priority: MUST
    kind: project
    statement: Protocol shorthand `EK` (Embargo Management Acknowledgment) has no dedicated `MessageSemantics` dispatch value
      and no entry in `SEMANTIC_REGISTRY`; acknowledgement of embargo state carried on the case ledger MUST instead
      follow the cumulative hash-chain mechanism specified in MSM-05-002.
    rationale: >-
      Per-message positive acknowledgement is redundant for ledger-replicated state: a
      matching `prev_log_hash` already proves receipt of every prior entry (MSM-05-002).
    note: >-
      Tests SHOULD assert that `EK` is absent from `MessageSemantics` and the semantic
      registry.
    relationships:
    - rel_type: refines
      spec_id: MSM-05-002
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `EK`; a unit test asserts this absence to prevent
      unintended additions.
    adr:
    - ADR-0083
  - id: MSM-02-010
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An implementation MUST NOT apply the EM transition of EA, EC, ER or EJ on
      receipt of a Participant's
      `Accept(Invite(EmbargoEvent)[context=VulnerabilityCase])` or
      `Reject(Invite(EmbargoEvent)[context=VulnerabilityCase])`, because that activity
      is the
      sender's consent to one embargo (MSM-07-003, MSM-07-004), and the transition is
      made only by the activity MSM-02-002, MSM-02-004, MSM-02-005 or MSM-02-006 maps the
      shorthand to. The CASE_MANAGER's own `Reject(Invite(EmbargoEvent))` is not its consent
      but its abandonment of the proposal, which MSM-02-006 maps to ER (EMB-16-001).
    rationale: >-
      The formal message set models the case's view of the embargo, not each
      Participant's answer to each proposal: Participant Embargo Consent (PEC) is a
      finer layer over EM that it does not describe (MSM-07-001). One formal message can
      take several activities in practice: Participants answer the Invite, and the Case
      Owner decides for the case in light of those answers. Reading an answer as the
      case's transition would let one Participant decide for everyone.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` assert that a
      Participant's Accept or Reject of an embargo Invite, the Case Owner's included,
      changes only the sender's consent row and moves no register entry, both for a
      first proposal (EM PROPOSED) and for a proposed revision (EM REVISE).
    relationships:
    - rel_type: refines
      spec_id: MSM-07-001
    adr:
    - ADR-0122
    stories:
    - story_2026_087
- id: MSM-03
  title: CS Protocol Message Shorthands
  description: 'Normative shorthand-to-semantic mappings for CVD Case State (CS) protocol messages, covering CV, CF, CD, CP,
    CX, CA, CE, and CK. CS status shorthands are split across two semantics by dimension scope, because the CS hypercube mixes
    participant-scoped and case-scoped dimensions: the participant-scoped V/F/D dimensions (CV, CF, CD) dispatch as
    ADD_PARTICIPANT_STATUS_TO_PARTICIPANT and are encoded in the ParticipantStatus payload, while the case-scoped P/X/A
    dimensions (CP, CX, CA) dispatch as ADD_CASE_STATUS_TO_CASE and are encoded in the CaseStatus payload. There are no
    case-level V/F/D states (ADR-0075). In both groups the specific state transition is encoded in the object payload rather
    than in the activity type.'
  specs:
  - id: MSM-03-001
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CV` (Vendor Aware) MUST have the semantic type `ADD_PARTICIPANT_STATUS_TO_PARTICIPANT`;
      its AS2 wire form is `Add(ParticipantStatus)[target=CaseParticipant]` per VAM-08-004. The `ParticipantStatus` payload
      encodes vendor awareness in the `vfState` field, advancing the
      vendor-path ladder from `vf` to `Vf`.
    rationale: 'The V dimension is participant-scoped, not case-scoped: it records whether a *specific* vendor is aware. Per
      ADR-0075 there is no case-level V/F/D state, and a case-level `Add(CaseStatus)` cannot express which vendor became
      aware, which is the purpose of the V dimension in MPCVD.'
    verification: >-
      Inspection of `vultron/semantic_registry/status.py` confirms that
      `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` is paired with an
      `ActivityPattern` matching `Add(ParticipantStatus)[target=CaseParticipant]`, and
      that `as_ParticipantStatus` declares `vf` (`vfState`) while `as_CaseStatus` does
      not.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-004
    adr:
    - ADR-0083
    - ADR-0075
    stories:
    - story_2022_062
    - story_2022_081
    - story_2026_011
  - id: MSM-03-002
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CF` (Fix Ready) MUST have the semantic type `ADD_PARTICIPANT_STATUS_TO_PARTICIPANT`;
      its AS2 wire form is `Add(ParticipantStatus)[target=CaseParticipant]` per VAM-08-004. The `ParticipantStatus` payload
      encodes fix readiness in the `vfState` field, advancing the vendor-path
      ladder from `Vf` to `VF`.
    rationale: >-
      The F dimension shares the participant-scoped vendor-path sub-machine with V
      (`CS_vf`: `vf` → `Vf` → `VF`), so fix readiness is recorded against the specific
      vendor that produced the fix. Same scope reasoning as MSM-03-001.
    verification: >-
      Inspection of `vultron/semantic_registry/status.py` confirms that
      `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` maps to
      `Add(ParticipantStatus)[target=CaseParticipant]`, and that fix readiness is
      carried by `as_ParticipantStatus.vf` rather than by any `as_CaseStatus`
      field.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-004
    adr:
    - ADR-0083
    stories:
    - story_2022_107
    - story_2022_062
    - story_2022_081
  - id: MSM-03-003
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CD` (Fix Deployed) MUST have the semantic type `ADD_PARTICIPANT_STATUS_TO_PARTICIPANT`;
      its AS2 wire form is `Add(ParticipantStatus)[target=CaseParticipant]` per VAM-08-004. The `ParticipantStatus` payload
      encodes deployment in the `dState` field, advancing the deployer-path
      ladder from `d` to `D`.
    rationale: 'The D dimension is participant-scoped on the *deployer*, and ADR-0075 split it into its own sub-machine
      (`CS_d`) precisely because its scope differs from the vendor path.
      `as_ParticipantStatus.d` is `None` for
      non-DEPLOYER participants (structurally enforced).'
    verification: >-
      Inspection of `vultron/semantic_registry/status.py` confirms that
      `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` maps to
      `Add(ParticipantStatus)[target=CaseParticipant]`, and that deployment is
      carried by `as_ParticipantStatus.d` rather than by any `as_CaseStatus`
      field.
    relationships:
