id: MSM
title: Protocol Shorthand to MessageSemantics Mapping
description: 'Authoritative normative bridge from protocol message shorthand labels (RS, EP, CV, etc.) used in behavioral
  conformance specs to their MessageSemantics enum values and corresponding AS2 wire-format specifications. Each entry provides
  one row in the three-hop chain: shorthand to MessageSemantics enum value to AS2 wire form. The correspondence is
  many-to-many in both directions: several shorthands may collapse onto one wire activity (CV/CF onto vf_state, CP/CX/CA onto
  pxa_state, EV/EJ/EC onto EP/ER/EA), and one shorthand may expand across several wire activities (GI). Shorthands with
  no dedicated dispatch value are the protocol-layer error and acknowledgment signals; these are not unimplemented — the
  purposes they name are served by mechanisms partitioned on a different axis, specified normatively in MSM-05.'
scope:
- prototype
- production
tags:
- messaging
- protocol
- documentation
groups:
- id: MSM-01
  title: RM Protocol Message Shorthands
  description: Normative shorthand-to-semantic mappings for Report Management (RM) protocol messages, covering RS, RI, RV,
    RD, RA, RC, RE, and RK.
  specs:
  - id: MSM-01-001
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `RS` (Report Submission) MUST dispatch as `MessageSemantics.SUBMIT_REPORT`; its AS2 wire
      form is `Offer(VulnerabilityReport)` per VAM-02-002.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.SUBMIT_REPORT`
      is paired with an `ActivityPattern` matching `Offer(VulnerabilityReport)` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-002
    stories:
    - story_2022_012
    - story_2022_038
  - id: MSM-01-002
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RI` (Report Invalid) MUST dispatch as
      `MessageSemantics.INVALIDATE_REPORT`; its AS2 wire form is
      `TentativeReject(Offer(VulnerabilityReport))` per VAM-02-005. This is the direct
      report recipient's RI; a participant that joined through an Invite sends RI as the
      full-case Invite reply of VAM-04-013.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.INVALIDATE_REPORT`
      is paired with an `ActivityPattern` matching
      `TentativeReject(Offer(VulnerabilityReport))` in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-005
    adr:
    - ADR-0121
    stories:
    - story_2022_101
    - story_2022_006
  - id: MSM-01-003
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RV` (Report Valid) MUST dispatch as
      `MessageSemantics.VALIDATE_REPORT`; its AS2 wire form is
      `Accept(Offer(VulnerabilityReport))` per VAM-02-004. This is the direct report
      recipient's RV; a participant that joined through an Invite sends RV as the
      full-case Invite reply of VAM-04-012.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.VALIDATE_REPORT`
      is paired with an `ActivityPattern` matching `Accept(Offer(VulnerabilityReport))`
      in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-004
    adr:
    - ADR-0121
    stories:
    - story_2022_101
    - story_2022_006
  - id: MSM-01-004
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `RD` (Report/Case Deferred) MUST dispatch as `MessageSemantics.DEFER_CASE`; its AS2 wire
      form is `Ignore(VulnerabilityCase)` per VAM-03-004.
    rationale: A deferred report indicates the receiving actor will not engage with the case at this time. The wire representation
      uses `Ignore(VulnerabilityCase)` rather than a report-level verb because deferral is a case-participation decision,
      not a report-validity judgment.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.DEFER_CASE` is
      paired with an `ActivityPattern` matching `Ignore(VulnerabilityCase)` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-03-004
    stories:
    - story_2022_006
    - story_2022_086
  - id: MSM-01-005
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `RA` (Report/Case Accepted) MUST dispatch as `MessageSemantics.ENGAGE_CASE`; its AS2 wire
      form is `Join(VulnerabilityCase)` per VAM-03-003.
    rationale: Accepting a report means the receiving actor commits to engaging with the vulnerability case. The wire verb
      `Join` captures the case-participation decision, symmetric with `Ignore` for `RD`.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.ENGAGE_CASE` is
      paired with an `ActivityPattern` matching `Join(VulnerabilityCase)` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-03-003
    stories:
    - story_2022_006
    - story_2022_013
  - id: MSM-01-006
    priority: MUST
    kind: protocol
    statement: >-
      Protocol shorthand `RC` (Report Closed) MUST dispatch as
      `MessageSemantics.CLOSE_REPORT`; its AS2 wire form is
      `Reject(Offer(VulnerabilityReport))` per VAM-02-006. This is the direct report
      recipient's RC; a participant that joined through an Invite sends RC as the
      full-case Invite reply of VAM-04-014.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.CLOSE_REPORT`
      is paired with an `ActivityPattern` matching `Reject(Offer(VulnerabilityReport))`
      in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-006
    adr:
    - ADR-0121
    stories:
    - story_2022_006
    - story_2022_101
  - id: MSM-01-007
    priority: MUST
    kind: project
    statement: Protocol shorthand `RE` (Report Management Error) has no dedicated `MessageSemantics` dispatch value and no
      entry in `SEMANTIC_REGISTRY`; report-management error conditions MUST instead be reported through the
      failure-mode mechanisms specified in MSM-05-001.
    rationale: '`RE` names an error condition scoped to report management. The implementation does not partition faults by
      state machine, so there is no `RE`-shaped wire form; it partitions by failure mode instead — not understood, declined,
      or needing explanation (MSM-05-001). Read this entry as "mapped onto a different axis", not as "unimplemented".'
    relationships:
    - rel_type: refines
      spec_id: MSM-05-001
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `RE`; a unit test asserts this absence to prevent
      unintended additions.
  - id: MSM-01-008
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `RK` (Report Management Acknowledgment) MUST dispatch as `MessageSemantics.ACK_REPORT`;
      its AS2 wire form is `Read(Offer(VulnerabilityReport))` per VAM-02-003.
    verification: >-
      Inspection of `vultron/wire/` confirms that `MessageSemantics.ACK_REPORT` is
      paired with an `ActivityPattern` matching `Read(Offer(VulnerabilityReport))` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-02-003
    stories:
    - story_2022_016
    - story_2022_002
- id: MSM-02
  title: EM Protocol Message Shorthands
  description: Normative shorthand-to-semantic mappings for Embargo Management (EM) protocol messages, covering EP, EA, EV,
    EJ, EC, ER, ET, EE, and EK. Embargo revision shorthands (EV, EJ, EC) share wire formats with their initial-proposal counterparts
    (EP, ER, EA); the distinction is contextual rather than structural.
  specs:
  - id: MSM-02-001
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `EP` (Embargo Proposed) MUST dispatch as `MessageSemantics.INVITE_TO_EMBARGO_ON_CASE`; its
      AS2 wire form is `Invite(Event)[context=VulnerabilityCase]` per VAM-05-005.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.INVITE_TO_EMBARGO_ON_CASE` is paired with an `ActivityPattern`
      matching `Invite(Event)[context=VulnerabilityCase]` in
      `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-005
    stories:
    - story_2022_014
    - story_2022_010
  - id: MSM-02-002
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `EA` (Embargo Accepted) MUST dispatch as `MessageSemantics.ACCEPT_INVITE_TO_EMBARGO_ON_CASE`;
      its AS2 wire form is `Accept(Invite(Event)[context=VulnerabilityCase])` per VAM-05-006.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.ACCEPT_INVITE_TO_EMBARGO_ON_CASE` is paired with an
      `ActivityPattern` matching `Accept(Invite(Event)[context=VulnerabilityCase])`
      in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-006
    stories:
    - story_2022_014
    - story_2022_023
  - id: MSM-02-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Protocol shorthand `EV` (Embargo Revision Proposed) MUST dispatch as `MessageSemantics.INVITE_TO_EMBARGO_ON_CASE`;
      its AS2 wire form is `Invite(Event)[context=VulnerabilityCase]` per VAM-05-005 — identical to `EP`. The revision context
      is inferred from the presence of an active embargo.
    rationale: EV, EJ, and EC are aliases for EP, ER, and EA at the wire layer (`vultron/bt/messaging/states.py`). The distinction
      between initial proposal and revision proposal is not encoded in the AS2 activity structure; implementations MUST infer
      it from local EM state.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-005
  - id: MSM-02-004
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `EJ` (Embargo Revision Rejected) MUST dispatch as `MessageSemantics.REJECT_INVITE_TO_EMBARGO_ON_CASE`;
      its AS2 wire form is `Reject(Invite(Event)[context=VulnerabilityCase])` per VAM-05-007 — identical to `ER`.
    rationale: EJ is an alias for ER at the wire layer. See MSM-02-003 rationale.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.REJECT_INVITE_TO_EMBARGO_ON_CASE` maps to
      `Reject(Invite(Event)[context=VulnerabilityCase])` in
      `SEMANTIC_REGISTRY`, and EJ is processed as an alias for ER when
      the receiver is in EM REVISE.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-007
    stories:
    - story_2022_014
    - story_2022_007
  - id: MSM-02-005
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `EC` (Embargo Revision Accepted) MUST dispatch as `MessageSemantics.ACCEPT_INVITE_TO_EMBARGO_ON_CASE`;
      its AS2 wire form is `Accept(Invite(Event)[context=VulnerabilityCase])` per VAM-05-006 — identical to `EA`.
    rationale: EC is an alias for EA at the wire layer. See MSM-02-003 rationale.
    verification: >-
      Inspection of `vultron/wire/` confirms that EC shares the
      `ACCEPT_INVITE_TO_EMBARGO_ON_CASE` semantic with EA at the wire layer, with
      the revision context inferred from the receiver's EM REVISE state.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-006
    stories:
    - story_2022_014
    - story_2022_023
  - id: MSM-02-006
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `ER` (Embargo Rejected) MUST dispatch as `MessageSemantics.REJECT_INVITE_TO_EMBARGO_ON_CASE`;
      its AS2 wire form is `Reject(Invite(Event)[context=VulnerabilityCase])` per VAM-05-007.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.REJECT_INVITE_TO_EMBARGO_ON_CASE` is paired with an
      `ActivityPattern` matching `Reject(Invite(Event)[context=VulnerabilityCase])`
      in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-007
    stories:
    - story_2022_014
    - story_2022_007
  - id: MSM-02-007
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `ET` (Embargo Terminated) MUST dispatch as `MessageSemantics.REMOVE_EMBARGO_EVENT_FROM_CASE`;
      its AS2 wire form is `Remove(Event)` per VAM-05-003.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.REMOVE_EMBARGO_EVENT_FROM_CASE` is paired with an
      `ActivityPattern` matching `Remove(Event)` in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-05-003
    stories:
    - story_2022_014
    - story_2022_015
  - id: MSM-02-008
    priority: MUST
    kind: project
    statement: Protocol shorthand `EE` (Embargo Management Error) has no dedicated `MessageSemantics` dispatch value and no
      entry in `SEMANTIC_REGISTRY`; embargo-management error conditions MUST instead be reported through the
      failure-mode mechanisms specified in MSM-05-001.
    rationale: 'Symmetric with MSM-01-007 (`RE`): faults are partitioned by failure mode rather than by state machine, so no
      embargo-scoped error wire form exists. Tests SHOULD assert that `EE` is absent from `MessageSemantics` and the semantic
      registry to catch unintended additions.'
    relationships:
    - rel_type: refines
      spec_id: MSM-05-001
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `EE`; a unit test asserts this absence to prevent
      unintended additions.
  - id: MSM-02-009
    priority: MUST
    kind: project
    statement: Protocol shorthand `EK` (Embargo Management Acknowledgment) has no dedicated `MessageSemantics` dispatch value
      and no entry in `SEMANTIC_REGISTRY`; acknowledgement of embargo state carried on the case ledger MUST instead
      follow the cumulative hash-chain mechanism specified in MSM-05-002.
    rationale: 'Per-message positive acknowledgement is redundant for ledger-replicated state: a matching `prev_log_hash`
      already proves receipt of every prior entry (MSM-05-002). Tests SHOULD assert that `EK` is absent from
      `MessageSemantics` and the semantic registry.'
    relationships:
    - rel_type: refines
      spec_id: MSM-05-002
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `EK`; a unit test asserts this absence to prevent
      unintended additions.
- id: MSM-03
  title: CS Protocol Message Shorthands
  description: 'Normative shorthand-to-semantic mappings for CVD Case State (CS) protocol messages, covering CV, CF, CD, CP,
    CX, CA, CE, and CK. CS status shorthands are split across two semantics by dimension scope, because the CS hypercube mixes
    participant-scoped and case-scoped dimensions: the participant-scoped V/F/D dimensions (CV, CF, CD) dispatch as
    ADD_PARTICIPANT_STATUS_TO_PARTICIPANT and are encoded in the ParticipantStatus payload, while the case-scoped P/X/A
    dimensions (CP, CX, CA) dispatch as ADD_CASE_STATUS_TO_CASE and are encoded in the CaseStatus payload. There are no
    case-level V/F/D states (ADR-0075). In both groups the specific state transition is encoded in the object payload rather
    than in the activity type.'
  specs:
  - id: MSM-03-001
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CV` (Vendor Aware) MUST dispatch as `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT`;
      its AS2 wire form is `Add(ParticipantStatus)[target=CaseParticipant]` per VAM-08-004. The `ParticipantStatus` payload
      encodes vendor awareness in the `vf_state` field (`CS_vf`), advancing the vendor-path ladder from `vf` to `Vf`.
    rationale: 'The V dimension is participant-scoped, not case-scoped: it records whether a *specific* vendor is aware. Per
      ADR-0075 there is no case-level V/F/D state, and a case-level `Add(CaseStatus)` cannot express which vendor became
      aware, which is the purpose of the V dimension in MPCVD. Corrected from an earlier revision that mapped `CV` to
      `ADD_CASE_STATUS_TO_CASE` with a nonexistent `vendor_aware` payload field; see ADR-0083.'
    verification: >-
      Inspection of `vultron/semantic_registry/status.py` confirms that
      `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` is paired with an
      `ActivityPattern` matching `Add(ParticipantStatus)[target=CaseParticipant]`, and
      that `as_ParticipantStatus` declares `vf_state` while `as_CaseStatus` does not.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-004
    stories:
    - story_2022_062
    - story_2022_081
    - story_2022_088
  - id: MSM-03-002
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CF` (Fix Ready) MUST dispatch as `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT`;
      its AS2 wire form is `Add(ParticipantStatus)[target=CaseParticipant]` per VAM-08-004. The `ParticipantStatus` payload
      encodes fix readiness in the `vf_state` field (`CS_vf`), advancing the vendor-path ladder from `Vf` to `VF`.
    rationale: 'The F dimension shares the participant-scoped vendor-path sub-machine with V (`CS_vf`: `vf` → `Vf` → `VF`),
      so fix readiness is recorded against the specific vendor that produced the fix. Same scope reasoning as MSM-03-001.
      Corrected from an earlier revision that mapped `CF` to `ADD_CASE_STATUS_TO_CASE` with a nonexistent `fix_ready` payload
      field; see ADR-0083.'
    verification: >-
      Inspection of `vultron/semantic_registry/status.py` confirms that
      `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` maps to
      `Add(ParticipantStatus)[target=CaseParticipant]`, and that fix readiness is
      carried by `as_ParticipantStatus.vf_state` rather than by any `as_CaseStatus`
      field.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-004
    stories:
    - story_2022_107
    - story_2022_062
    - story_2022_081
  - id: MSM-03-003
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CD` (Fix Deployed) MUST dispatch as `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT`;
      its AS2 wire form is `Add(ParticipantStatus)[target=CaseParticipant]` per VAM-08-004. The `ParticipantStatus` payload
      encodes deployment in the `d_state` field (`CS_d`), advancing the deployer-path ladder from `d` to `D`.
    rationale: 'The D dimension is participant-scoped on the *deployer*, and ADR-0075 split it into its own sub-machine
      (`CS_d`) precisely because its scope differs from the vendor path. `as_ParticipantStatus.d_state` is `None` for
      non-DEPLOYER participants (structurally enforced). Corrected from an earlier revision that mapped `CD` to
      `ADD_CASE_STATUS_TO_CASE` with a nonexistent `fix_deployed` payload field; see ADR-0083.'
    verification: >-
      Inspection of `vultron/semantic_registry/status.py` confirms that
      `MessageSemantics.ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` maps to
      `Add(ParticipantStatus)[target=CaseParticipant]`, and that deployment is
      carried by `as_ParticipantStatus.d_state` rather than by any `as_CaseStatus`
      field.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-004
    stories:
    - story_2022_107
    - story_2022_103
    - story_2022_081
  - id: MSM-03-004
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CP` (Public Aware) MUST dispatch as `MessageSemantics.ADD_CASE_STATUS_TO_CASE`; its AS2
      wire form is `Add(CaseStatus)[target=VulnerabilityCase]` per VAM-08-002. The `CaseStatus` payload encodes the `public_aware`
      state flag.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.ADD_CASE_STATUS_TO_CASE` maps to
      `Add(CaseStatus)[target=VulnerabilityCase]`, and the `public_aware` flag is
      encoded in the `CaseStatus` payload sent with CP.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-002
    stories:
    - story_2022_069
    - story_2022_081
  - id: MSM-03-005
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CX` (Exploit Published) MUST dispatch as `MessageSemantics.ADD_CASE_STATUS_TO_CASE`; its
      AS2 wire form is `Add(CaseStatus)[target=VulnerabilityCase]` per VAM-08-002. The `CaseStatus` payload encodes the `exploit_published`
      state flag.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.ADD_CASE_STATUS_TO_CASE` maps to
      `Add(CaseStatus)[target=VulnerabilityCase]`, and the `exploit_published` flag
      is encoded in the `CaseStatus` payload sent with CX.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-002
    stories:
    - story_2022_018
    - story_2022_081
  - id: MSM-03-006
    priority: MUST
    kind: protocol
    statement: Protocol shorthand `CA` (Attacks Observed) MUST dispatch as `MessageSemantics.ADD_CASE_STATUS_TO_CASE`; its
      AS2 wire form is `Add(CaseStatus)[target=VulnerabilityCase]` per VAM-08-002. The `CaseStatus` payload encodes the `attacks_observed`
      state flag.
    verification: >-
      Inspection of `vultron/wire/` confirms that
      `MessageSemantics.ADD_CASE_STATUS_TO_CASE` maps to
      `Add(CaseStatus)[target=VulnerabilityCase]`, and the `attacks_observed` flag
      is encoded in the `CaseStatus` payload sent with CA.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-08-002
    stories:
    - story_2022_019
    - story_2022_081
  - id: MSM-03-007
    priority: MUST
    kind: project
    statement: Protocol shorthand `CE` (Case State Error) has no dedicated `MessageSemantics` dispatch value and no entry
      in `SEMANTIC_REGISTRY`; case-state error conditions MUST instead be reported through the failure-mode
      mechanisms specified in MSM-05-001.
    rationale: 'Symmetric with MSM-01-007 (`RE`): faults are partitioned by failure mode rather than by state machine, so no
      case-state-scoped error wire form exists. Tests SHOULD assert that `CE` is absent from `MessageSemantics` and the
      semantic registry.'
    relationships:
    - rel_type: refines
      spec_id: MSM-05-001
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `CE`; a unit test asserts this absence to prevent
      unintended additions.
  - id: MSM-03-008
    priority: MUST
    kind: project
    statement: Protocol shorthand `CK` (Case State Acknowledgment) has no dedicated `MessageSemantics` dispatch value and
      no entry in `SEMANTIC_REGISTRY`; acknowledgement of case-state changes carried on the case ledger MUST instead
      follow the cumulative hash-chain mechanism specified in MSM-05-002.
    rationale: 'Symmetric with MSM-02-009 (`EK`): case-state changes are ledger-replicated, so hash-chain continuity already
      acknowledges them cumulatively and a per-message ack would be redundant. Tests SHOULD assert that `CK` is absent from
      `MessageSemantics` and the semantic registry.'
    relationships:
    - rel_type: refines
      spec_id: MSM-05-002
    verification: >-
      Inspection of `vultron/core/models/events/base.py` and
      `vultron/semantic_registry/` confirms that no `MessageSemantics` member and no
      registry entry names `CK`; a unit test asserts this absence to prevent
      unintended additions.
- id: MSM-04
  title: General Protocol Message Shorthands
  description: 'Normative shorthand-to-semantic mappings for General (non-state-machine) protocol messages, covering GI, GK,
    and GE. Unlike the RM, EM, and CS groups, the General shorthands map to wire activities by expansion: a single shorthand
    covers several distinct wire activities rather than collapsing several shorthands into one.'
  specs:
  - id: MSM-04-001
    priority: MUST
    kind: project
    statement: The note lifecycle MUST realize protocol shorthand `GI` (General Inquiry) as
      `MessageSemantics.CREATE_NOTE`, `MessageSemantics.ADD_NOTE_TO_CASE`, and
      `MessageSemantics.REMOVE_NOTE_FROM_CASE`; their AS2 wire forms are `Create(Note)` per VAM-07-001,
      `Add(Note)[target=VulnerabilityCase]` per VAM-07-002, and `Remove(Note)[target=VulnerabilityCase]` per VAM-07-003.
      These are not the whole of `GI` — MSM-04-002 adds the actor-suggestion exchange.
    rationale: '`GI` is defined in the formal protocol as any message conveying non-state-change information, so it is
      inherently one-to-many on the wire. The `Create` then `Add` split is a wire-layer artifact with no formal counterpart:
      the formal set models the inquiry, not the object lifecycle that carries it.'
    verification: >-
      Inspection of `vultron/semantic_registry/note.py` confirms all three
      note-scoped entries are registered, and that no single `MessageSemantics`
      value is named for `GI`.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-07-001
    - rel_type: derives_from
      spec_id: VAM-07-002
    - rel_type: derives_from
      spec_id: VAM-07-003
  - id: MSM-04-002
    priority: MUST
    kind: project
    statement: Protocol shorthand `GI` MUST additionally cover the actor-suggestion exchange, dispatching as
      `MessageSemantics.OFFER_ACTOR_TO_CASE`, `MessageSemantics.OFFER_CASE_PARTICIPANT`,
      `MessageSemantics.ACCEPT_OFFER_CASE_PARTICIPANT`, or `MessageSemantics.REJECT_OFFER_CASE_PARTICIPANT`.
    rationale: '`messages.md` lists "suggesting a potential Participant to be added to a case" among its `GI` examples, so
      actor suggestion is a `GI` expansion and MUST NOT be classified as case management. What the formal set models as one
      inquiry the implementation realizes as a multi-hop negotiation with its own accept and reject responses.'
    verification: >-
      Inspection of `vultron/semantic_registry/actor.py` confirms the four
      actor-suggestion entries are registered, and `docs/reference/formal_protocol/messages.md`
      lists participant suggestion as a `GI` example.
    relationships:
    - rel_type: derives_from
      spec_id: VAM-04-001
    - rel_type: derives_from
      spec_id: VAM-04-010
    - rel_type: derives_from
      spec_id: VAM-04-002
    - rel_type: derives_from
      spec_id: VAM-04-003
  - id: MSM-04-003
    priority: MUST
    kind: protocol
    statement: Protocol shorthands `GK` (General Acknowledgement) and `GE` (General Error) MUST NOT be assigned dedicated
      `MessageSemantics` dispatch values; the purposes they name are served by the mechanisms specified in MSM-05.
    rationale: Recording these as plain absences invites the reading that the behaviour is unimplemented. It is implemented,
      on a different axis — see MSM-05-001 and MSM-05-002.
    verification: >-
      Inspection of the semantic registry confirms no entry is named for `GK` or
      `GE`, and that the MSM-05 mechanisms are registered.
    relationships:
    - rel_type: refines
      spec_id: MSM-05-001
    - rel_type: refines
      spec_id: MSM-05-002
    lint_suppress:
    - missing_story_reference
- id: MSM-05
  title: Fault and Acknowledgement Mechanism Evolution
  description: 'Normative record of how the formal protocol''s per-model error and acknowledgement shorthands (RE, EE, CE, GE
    and RK, EK, CK, GK) are realized in the AS2 wire vocabulary. The formal set partitions both concerns by which state
    machine the message belonged to; the implementation partitions faults by failure mode and acknowledges replicated state
    cumulatively. These are orthogonal axes, so the shorthands have no one-to-one wire counterparts even though the
    behaviours they describe are implemented.'
  specs:
  - id: MSM-05-001
    priority: MUST
    kind: protocol
    statement: 'Fault reporting MUST be partitioned by failure mode rather than by state machine, using exactly three
      mechanisms: `Create(ProcessingFault)` when a message was received but not understood; `as:Reject` when a message was
      received and understood but declined; and `Create(Note)` or `Add(Note)[target=VulnerabilityCase]` when the condition
      requires narrative explanation.'
    rationale: 'Failure mode is actionable to a receiver in a way that originating state machine is not. Not-understood calls
      for a format or version fix, declined calls for a protocol-level decision, and needs-explanation calls for a human. The
      formal RE, EE, CE and GE partition carries no such signal, which is why it was not reproduced.'
    verification: >-
      Inspection of the semantic registry confirms `create_processing_fault`,
      the `as:Reject`-based entries, and the note-scoped entries are all registered.
    lint_suppress:
    - missing_story_reference
  - id: MSM-05-002
    priority: MUST
    kind: project
    statement: 'Acknowledgement of replicated case-ledger state MUST be cumulative and implicit via hash-chain continuity. A
      receiver whose `prev_log_hash` matches its local tail MUST NOT emit an acknowledgement, and MUST emit
      `Reject(CaseLedgerEntry)` on a mismatch, whereupon the CASE_MANAGER replays all entries after the last accepted hash.'
    rationale: A matching `prev_log_hash` already proves receipt of every prior entry, so per-message positive
      acknowledgement would be redundant. This is negative acknowledgement with gap-fill replay, structurally closer to a
      cumulative ACK or SACK scheme than to the formal per-message EK, CK and GK design. `RK` remains a real wire activity
      (MSM-01-008) because report submission is not ledger-replicated.
    verification: >-
      Inspection of `RejectLedgerEntryReceivedUseCase` in
      `vultron/core/use_cases/received/sync.py` confirms the mismatch-and-replay
      behaviour, and the registry contains no per-message `EK`, `CK`, or `GK` entry.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-003
  - id: MSM-05-005
    priority: MUST
    kind: protocol
    statement: All protocol-significant activities MUST be committed to the canonical case ledger by the CASE_MANAGER
      before fan-out to participant actors. No protocol-significant activity bypasses the ledger replication path.
    rationale: >-
      The hash-chain acknowledgement model (MSM-05-002) is only complete if every activity a participant needs to
      acknowledge reaches them via an Announce(CaseLedgerEntry). Activities that bypassed the ledger would have no
      acknowledgement mechanism. Report submission (RS) is the only activity not carried by the ledger; it uses RK
      (MSM-01-008) instead, which is the intended exception rather than a gap.
    verification: >-
      Inspection of the CASE_MANAGER receive paths confirms that every inbound protocol
      activity results in at least one CaseLedgerEntry committed before Announce fan-out,
      except for Offer(VulnerabilityReport) which uses the RK path.
    lint_suppress:
    - missing_story_reference
  - id: MSM-05-006
    priority: MAY
    kind: protocol
    statement: >-
      A conformant implementation MAY rely solely on Announce(CaseLedgerEntry) deliveries for liveness inference,
      without emitting a dedicated periodic heartbeat. Silence between Announce deliveries is therefore an
      accepted protocol property: a participant that is online but has received all entries is indistinguishable
      from one that is unreachable. This does not preclude a future revision adding a normative heartbeat requirement.
    rationale: >-
      The hash-chain NAK model (MSM-05-002) provides implicit acknowledgement only when new entries arrive.
      Between deliveries, silence and unreachability are observationally equivalent. Documenting this as a
      deliberate MAY-level property (rather than a defect) closes the liveness question raised by CONCERN-3006
      without foreclosing a future heartbeat mechanism (CaseActorHeartbeat is already sketched in
      notes/sync-ledger-replication.md for the multi-node CASE_MANAGER cluster design).
    verification: >-
      No normative heartbeat requirement exists in specs/sync-ledger-replication.yaml;
      this entry records the absence as intentional.
    lint_suppress:
    - missing_story_reference
  - id: MSM-05-003
    priority: MUST_NOT
    kind: protocol
    statement: Implementations MUST NOT infer error semantics from the `as:Reject` verb alone, because `as:Reject` also
      carries legitimate protocol rejections including `close_report`, `reject_invite_to_embargo_on_case`,
      `reject_invite_actor_to_case`, `reject_case_proposal`, and `reject_case_ownership_transfer`.
    rationale: '`as:Reject` is overloaded across error reporting and ordinary protocol refusal. A receiver that treats every
      `as:Reject` as a fault will misclassify routine protocol traffic as errors.'
    verification: >-
      Inspection of the semantic registry confirms multiple non-error entries are
      keyed to `as:Reject` patterns.
    lint_suppress:
    - missing_story_reference
  - id: MSM-05-004
    priority: MUST_NOT
    kind: process
    statement: Documentation MUST NOT describe the wire fault taxonomy as `RmError`, `EmError`, `CsError`, or `GmError`
      discriminated by `as:inReplyTo`; those types exist in no ontology file and no code.
    rationale: '`docs/howto/activitypub/activities/error.md` previously depicted this taxonomy, and it was never built.
      Citing it leads implementers to a wire format that does not exist. Note also the name note: `VultronError` in
      `vultron/errors.py` is a Python exception base class, unrelated to protocol wire-level error messages.'
    verification: >-
      A grep for `RmError`, `EmError`, `CsError`, and `GmError` across `vultron/`
      and the whole of `docs/` returns no definitions and no documentation
      references. `ActivityPattern.in_reply_to_` has been removed from the
      codebase; the pattern matcher cannot match on a field that does not exist.
- id: MSM-06
  title: Message Type Reference Rendering
  description: Requirements governing the consolidated per-message-type reference pages under `docs/reference/messages/`, so
    that the shorthand-to-wire mapping presented to implementers cannot drift from this specification or from the semantic
    registry.
  specs:
  - id: MSM-06-001
    priority: MUST
    kind: process
    statement: The shorthand-to-wire-form mapping tables in `docs/reference/messages/` MUST be rendered at build time from
      the MSM spec registry joined against `SEMANTIC_REGISTRY`, and MUST NOT be hand-written markdown.
    rationale: 'Hand-maintained mapping tables drift silently. The orphaned example JSON files under
      `docs/reference/examples/` and the failing example blocks tracked by issue 2904 are what that drift looks like once
      it has accumulated. Rendering from the registries makes divergence impossible rather than merely detectable.'
    verification: >-
      Inspection of `docs/reference/messages/*.md` confirms each mapping table is
      produced by a `markdown_exec` block reading the spec and semantic registries,
      following the `docs/reference/specs/*.md` pattern.
    lint_suppress:
    - phantom_path_ref
  - id: MSM-06-002
    priority: MUST
    kind: process
    statement: Every `SEMANTIC_REGISTRY` entry MUST be designated to exactly one *primary* page under
      `docs/reference/messages/` and MUST appear on that page, or be explicitly exempted as a dispatcher fallback rather
      than a protocol message. An entry MAY additionally be cross-referenced from other pages, and MUST be where a
      collapse or an evolved mechanism gives it a second home.
    rationale: 'Without a completeness check a new registry entry can be added without ever being documented, so every entry
      needs one page that owns it. A bare "exactly one page" rule would be unsatisfiable, because the mapping is many-to-many
      — see `notes/message-type-reference.md` for the entries that legitimately need a second home. A *primary* page keeps the
      completeness guarantee without contradicting MSM-06-003. The dispatch fallbacks are the intended exemptions.'
    verification: >-
      A ratchet test enumerates `SEMANTIC_REGISTRY` and asserts exactly one primary-page
      designation for every entry outside the declared exemption set, and that the entry
      appears on its designated page.
    lint_suppress:
    - phantom_path_ref
  - id: MSM-06-003
    priority: MUST
    kind: process
    statement: Each mapping row MUST carry a status indicating whether the relationship is direct, a collapse of several
      shorthands onto one wire activity, an expansion of one shorthand across several wire activities, or a mechanism that
      evolved onto a different axis per MSM-05.
    rationale: Reference material must state what is true, including divergence from the normative message set. A table that
      shows only direct mappings and omits the rest reads as a complete correspondence and misleads implementers about both
      the collapses and the evolved mechanisms.
    verification: >-
      Inspection of the rendered pages confirms a status column is present and
      populated for every row.
- id: MSM-07
  title: Participant Embargo Consent (PEC) State Machine Coupling to EM Wire Activities
  description: >-
    Normative record of how each EM wire activity drives the per-participant, per-embargo
    Participant Embargo Consent (PEC) rows as a side-effect, and which consent positions are
    derived rather than written. PEC is participant-local state tracking each actor's
    relationship to each embargo in the case's embargo register; its transitions are not
    independent protocol messages and have no formal shorthands in the 28-shorthand set. A
    participant's consent to an embargo is one row holding UNINVITED, INVITED, AGREED, DECLINED
    or TIMED_OUT; whether the participant is bound by the *current* active embargo is a lookup
    of the active embargo's row, and a lapse is read from the rows and the register when a
    longer embargo replaces the one the participant agreed to. Unlike RM state (self-reported by the participant) and VF/D state
    (self-reported by vendor/deployer), consent rows are set by the CASE_MANAGER (CM-28-003)
    based on observed participant behavior — incoming Accept/Reject wire activities and
    timer-enforced invitation expiry — and replayed on each replica. Normative authority:
    specs/case-management.yaml CM-18. Decisions: ADR-0048, ADR-0091, ADR-0118, ADR-0122.
  specs:
  - id: MSM-07-001
    priority: MUST
    kind: project
    statement: >-
      The Participant Embargo Consent (PEC) state machine MUST NOT be assigned any
      formal shorthand in the 28-shorthand protocol message set; all PEC transitions
      are either side-effects of EM wire activities (MSM-07-002 through MSM-07-005,
      MSM-07-008)
      or timer-based internal events (MSM-07-007) with no dedicated wire message or
      dispatch value of their own.
    rationale: >-
      PEC is participant-local state tracking each actor's relationship to the shared
      EM state, not a parallel message-driven machine. Extending the formal set with
      PEC-specific shorthands would imply dedicated wire messages where none exist and
      none are needed — the EM messages already carry the PEC signal as a side-effect.
      Documenting PEC as a side-effect is the faithful description of the design.
    verification: >-
      A grep for PEC-specific entries across vultron/core/models/events/base.py and
      vultron/semantic_registry/ confirms no MessageSemantics member and no registry
      entry is named exclusively for a PEC transition.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
  - id: MSM-07-002
    priority: MUST
    kind: project
    statement: >-
      The wire activity INVITE_TO_EMBARGO_ON_CASE (EP wire form:
      Invite(Event)[context=VulnerabilityCase]) MUST apply the PEC INVITE trigger to the
      invited participant's row for the invited embargo, advancing it from UNINVITED, DECLINED
      or TIMED_OUT to INVITED.
    rationale: >-
      An embargo proposal is an invitation to consent; the EP wire activity conveys the invitation
      and the PEC rows record each participant's position on each embargo. A participant whose row
      is AGREED is unaffected by EP; INVITE is not legal from AGREED (CM-18-003), and a
      signatory asked about a revision has its row for the revision invited while its row for the
      active embargo stays AGREED (EP-09-004). The PEC trigger is applied via
      EmbargoLifecycle.record_embargo_invite() on the CASE_MANAGER as it relays the Invite, and on
      each replica as it replays the relay's ledger entry (EP-09-007).
    verification: >-
      Inspection of vultron/core/behaviors/embargo/nodes/relay.py, relay_effect.py and
      vultron/core/services/embargo_lifecycle/ confirms that relaying or replaying
      INVITE_TO_EMBARGO_ON_CASE applies PEC_Trigger.INVITE to the named invitee's row for the
      Invite's embargo via record_embargo_invite().
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-001
  - id: MSM-07-003
    priority: MUST
    kind: project
    statement: >-
      The wire activity ACCEPT_INVITE_TO_EMBARGO_ON_CASE (EA wire form:
      Accept(Invite(Event)[context=VulnerabilityCase])) is always the sending actor's own
      consent, whoever sends it, the case owner included: it MUST apply the PEC AGREE
      trigger to the sender's row for the accepted embargo, advancing it from UNINVITED,
      INVITED or TIMED_OUT to AGREED, and MUST NOT change any embargo register entry. The
      rule is the same whether the accepted embargo is the case's active embargo, a first
      proposal (EM PROPOSED) or a *proposed revision* of an embargo still in force: the
      accepted embargo's row is marked, and only that row. A participant is a signatory
      exactly when the row for the active embargo is AGREED, so accepting a proposed
      revision binds the participant to nothing new until the owner activates it
      (MSM-07-008). A participant whose row for the accepted embargo is DECLINED records
      nothing — AGREE is not legal from DECLINED (CM-18-003), so it is re-invited first —
      and neither does one whose row's register entry is final (CM-18-003).
    rationale: >-
      The case owner's decision for the case has its own activity (MSM-07-008, ADR-0122), so
      an Accept of an Invite means one thing whoever sends it and no handler branches on the
      sender to learn what it means. The PEC AGREE trigger is valid directly from UNINVITED
      because consent can be self-determined without an invitation (ADR-0048, ADR-0091,
      CM-18-003). Consent is per embargo (CM-10-001, ADR-0093, ADR-0122): an Accept is always
      a statement about the embargo it names, so it always marks that embargo's row and there
      is no first-proposal versus revision asymmetry to special-case.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` assert that a
      participant accepting the embargo in force, a first proposal and a proposed revision each
      marks exactly that embargo's row AGREED and moves no register entry, that the case
      owner's Accept of an Invite records only its own consent, that a signatory accepting a
      proposed revision keeps its AGREED row for the active embargo, and that a DECLINED
      participant's Accept records nothing.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-002
    adr:
    - ADR-0093
    - ADR-0122
  - id: MSM-07-004
    priority: MUST
    kind: project
    statement: >-
      The wire activity REJECT_INVITE_TO_EMBARGO_ON_CASE (ER wire form:
      Reject(Invite(Event)[context=VulnerabilityCase])) is always the sending actor's own
      consent, whoever sends it, the case owner included: it MUST apply the PEC DECLINE
      trigger to the sender's row for the rejected embargo (valid from UNINVITED, INVITED,
      AGREED or TIMED_OUT) and MUST NOT change any embargo register entry, except that a
      Reject of the case's *active* embargo from an AGREED row is not consent withdrawal
      and MUST be refused with a reported reason: withdrawal is `Leave(EmbargoEvent)`
      (MSM-07-010). A Reject of the active embargo from any other row refuses the terms in
      force and declines that row only. Rejecting a *proposed*
      embargo that is not active declines that embargo's row only and MUST leave the
      participant's row for the active embargo unchanged — a signatory's rejection of a
      proposed revision refuses those terms; it is not withdrawal from the embargo in force.
      When no embargo is in force (EM PROPOSED) a Reject of a proposal declines that
      proposal's row only: it withdraws from nothing, and other open proposals the
      participant agreed to stay AGREED.
    rationale: >-
      Symmetric with MSM-07-003: the case owner's rejection of a proposal for the case has its
      own activity (MSM-07-009, ADR-0122), so a Reject of an Invite is the sender's consent
      and nothing else. The PEC DECLINE trigger is valid directly from UNINVITED for symmetric
      reasons to AGREE (ADR-0048, ADR-0091, CM-18-003). Leaving an embargo one is bound
      by is a different act with its own activity (MSM-07-010, ADR-0122), so a Reject never
      has to be read against the case's state to tell a refusal from a withdrawal. Consent
      is per embargo, so a
      signatory who refuses proposed terms is still bound by, and still consents to, the
      embargo that remains active; only the case owner decides whether the proposal replaces
      it.
    verification: >-
      Inspection of vultron/core/use_cases/received/embargo/reject.py and
      vultron/core/services/embargo_lifecycle/consent.py confirms
      RejectInviteToEmbargoOnCaseReceivedUseCase applies
      EmbargoLifecycle.record_embargo_rejection, which declines the rejecting actor's row for
      the rejected embargo, refuses a Reject of the active embargo from an AGREED row,
      applies the same rule to the case owner, and moves no
      register entry.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-006
    adr:
    - ADR-0093
    - ADR-0122
  - id: MSM-07-005
    priority: MUST
    kind: project
    statement: >-
      When the case owner's Accept(Event)[target=VulnerabilityCase] (MSM-07-008) replaces
      active embargo A with revision B (the register activates B and supersedes A, so the
      derived EM goes REVISE → ACTIVE),
      implementations MUST settle every participant's consent rows against B:
      if B ends no later than A, every participant whose row for A is AGREED MUST be carried
      over by applying CARRY_OVER to its row for B, a DECLINED row for B included
      (CM-18-003); if B ends later than A, implementations MUST NOT write any row to lapse
      anyone — a participant whose row for B is not AGREED is not a signatory to B and has
      lapsed if it had agreed to A (CM-18-001). The owner's row for B is AGREED unless it
      already is, and an owner whose row for B is DECLINED cannot activate it: AGREE refuses
      DECLINED, so the activation is refused and the owner is invited again first (ADR-0122).
      Activating B advances no one else: a participant holding an AGREED row for B is its
      signatory by lookup, whether it is the proposer or an early acceptor. Only participants
      whose row for A is AGREED are carried over: a participant that had lapsed from an
      earlier embargo stays lapsed until it is re-invited or agrees to B, and a participant
      INVITED to A whose invitation B has made stale is handled by the stale-terms re-invite
      path (EMB-17), because its row for the now-SUPERSEDED A is frozen. A revision proposal
      (EV, ACTIVE → REVISE, or a counter-revision REVISE → REVISE) MUST NOT change any
      participant's consent to the embargo in force, and the proposer's row for the proposed
      embargo MUST be marked AGREED. The carry-over MUST run whether the transition is driven locally or observed
      from the wire. No separate outbound wire activity is emitted for these per-participant
      consent writes; they are an internal side-effect of the activation.
    rationale: >-
      A participant has lapsed when the active embargo was replaced by longer terms it has not
      agreed to. While a revision is merely proposed the prior embargo is still in force and
      every signatory to it is still bound by it, so nothing about their consent has changed
      (ADR-0093). Agreeing to N days is agreeing to every shorter period — the containment that
      makes shortest-wins safe (EP-04-003) — so a shorter revision asks nothing new of an
      existing signatory and carries them over, even one that declined B: its decline objected
      to losing time, not to keeping the embargo. Longer terms ask for more than they promised,
      so only those who agreed to B are bound by B, and the rows say so without a write. Only
      the owner's acceptance changes the embargo on the case; other participants' accepts and
      rejects are recorded per embargo and inform that decision. Running the carry-over in the
      observed path too keeps every replica's consent rows in step with the CASE_MANAGER's.
    verification: >-
      Inspection of vultron/core/services/embargo_lifecycle/ confirms that
      propose_embargo() answers only the proposer's row for the proposed id (every other
      participant's new row is UNINVITED), and that activate_embargo() applies CARRY_OVER to
      a revision that ends no later than the replaced embargo and writes only the owner's row
      for a longer one. Unit tests
      in test/core/services/embargo_lifecycle/ assert both arms, the derived lapse, and the
      no-op on proposal.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-003
    adr:
    - ADR-0093
    - ADR-0122
  - id: MSM-07-006
    priority: MUST
    kind: project
    statement: >-
      When an ET / REMOVE_EMBARGO_EVENT_FROM_CASE wire activity terminates the embargo
      register's ACTIVE entry (cancelling every open proposal in the same step, so the derived
      EM becomes EXITED), implementations MUST leave the case with no active embargo and MUST
      NOT write any participant's consent rows: with no active embargo
      no participant is a signatory and no row binds anyone, and an Accept or Reject that
      arrives afterwards records nothing (EMB-17-004). No separate outbound wire activity is
      emitted; the participant position is derived from the case.
    rationale: >-
      A register with a TERMINATED entry accepts no further change (ADR-0122 invariant 4), so a
      terminated embargo can never be invited to again. That is a fact about the case, which every replica holds once it replays the
      teardown, so it does not need to be copied onto each participant record as the terminal
      state it was before ADR-0122 (ADR-0118). Leaving the rows as they were also keeps the
      history of who agreed to what, and every row of a final entry is frozen (CM-18-003).
    verification: >-
      Inspection of vultron/core/services/embargo_lifecycle/ confirms that
      terminate_active_embargo() writes no consent row. Unit tests in
      test/core/services/embargo_lifecycle/ assert the rows are unchanged and no participant is
      a signatory afterwards, and a per-actor-store test asserts the same on the CASE_MANAGER
      and on a replica.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: MSM-02-007
    adr:
    - ADR-0118
    - ADR-0122
  - id: MSM-07-007
    priority: MUST
    kind: project
    statement: >-
      The timer-based pocket-veto transition — INVITED to TIMED_OUT on the row of the
      invitation whose deadline passed — MUST be enforced lazily with no outbound wire message emitted for the consent
      change itself. A lapse has no timer path (CM-18-002): a lapsed participant is re-invited, and
      the deadline attaches to that invitation. The CASE_MANAGER MUST author a case-ledger entry
      recording the expiry (CM-28-005) so the consent change is visible in the canonical ledger, but
      no additional protocol wire activity is required.
    rationale: >-
      Inaction cannot produce an outbound message because there is no actor-observable event to
      report. The expiry is a derived conclusion from (the row's rsvp_deadline, now); the ledger entry
      is the record of that conclusion, not a message sent by the silent participant. Requiring a
      wire message would demand the system speak on behalf of a participant who has said nothing,
      which contradicts the Actor Knowledge Model (AKM).
    verification: >-
      Inspection of vultron/core/services/embargo_lifecycle/ confirms detect_and_apply_expiry()
      applies PEC_Trigger.TIME_OUT without emitting an outbound wire activity, that a
      CASE_MANAGER-authored ledger entry is written per CM-28-005, and that
      detect_and_apply_expiry() applies it only to the named invitation's row, and only from
      INVITED.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-002
    - rel_type: derives_from
      spec_id: CM-28-005
    adr:
    - ADR-0093
  - id: MSM-07-008
    priority: MUST
    kind: project
    statement: >-
      The wire activity ACTIVATE_EMBARGO_ON_CASE (wire form:
      Accept(Event)[target=VulnerabilityCase], the EmbargoEvent itself as the object) is the
      case owner's decision for the case and MUST be accepted only from the case owner; any
      other sender MUST be refused with REFUSED before any write (HP-01-006). It MUST
      activate the named proposal's embargo register entry and supersede any entry in force
      in the same step, so the derived EM becomes ACTIVE (EA, or EC for a revision); MUST
      mark the owner's row for the activated embargo AGREED unless it already is; and, when
      it replaces an embargo in force, MUST apply the MSM-07-005 consent rule. It MUST be
      refused before it is committed when the named embargo is not an open proposal of the
      case, when CS is public, exploited or attacked (EMB-02-002), or when the owner's row for
      the proposal is DECLINED (the owner is invited again first, CM-18-003).
    rationale: >-
      Giving the owner's decision its own activity retires the two-audience rule: an Accept of
      an Invite is always the sender's consent (MSM-07-003), and this activity is always the
      owner's decision for the case, so neither meaning depends on who sent the message
      (ADR-0122). Refusing a doomed activation before the commit keeps the ledger free of an
      entry that replicas, replaying in OBSERVED mode, would apply without the CASE_MANAGER's
      P/X/A check.
    verification: >-
      Unit tests in `test/core/use_cases/received/` assert that the case owner's
      Accept(EmbargoEvent, target=Case) at the CASE_MANAGER activates the proposal, records
      the owner's AGREED row and carries signatories over to a shorter revision, that a
      replica replaying the committed entry converges, and that a non-owner sender, a
      non-open proposal, P/X/A and a DECLINED owner are each refused with nothing committed.
    relationships:
    - rel_type: derives_from
      spec_id: EP-09-005
    - rel_type: depends_on
      spec_id: MSM-07-005
    adr:
    - ADR-0122
  - id: MSM-07-009
    priority: MUST
    kind: project
    statement: >-
      The wire activity REJECT_EMBARGO_PROPOSAL_ON_CASE (wire form:
      Reject(Event)[target=VulnerabilityCase], the EmbargoEvent itself as the object) is the
      case owner's decision for the case and MUST be accepted only from the case owner; any
      other sender MUST be refused with REFUSED before any write (HP-01-006). It MUST reject
      the named proposal's embargo register entry, so the derived EM becomes NONE (ER) or
      stays ACTIVE with the prior terms in force (EJ) once no other proposal is open, and
      stays PROPOSED or REVISE while another is (EP-08-001); it MUST NOT change any
      participant's consent rows, the owner's included. When it rejects the last open
      revision while CS is public, exploited or attacked, the embargo MUST be terminated
      instead (EMB-04-002). It MUST be refused before it is committed when the named embargo
      is not an open proposal of the case.
    rationale: >-
      The owner's rejection decides the proposal for the case; whether the owner, as a
      participant, also refuses those terms is a separate Reject of the Invite (MSM-07-004).
      Keeping the two apart lets the owner keep the prior terms without declining them
      (ADR-0122).
    verification: >-
      Unit tests in `test/core/use_cases/received/` assert that the case owner's
      Reject(EmbargoEvent, target=Case) at the CASE_MANAGER rejects the proposal with no
      consent row changed, leaves another open proposal open, terminates the embargo when it
      rejects the last revision after disclosure, and that a non-owner sender or a non-open
      proposal is refused with nothing committed.
    relationships:
    - rel_type: derives_from
      spec_id: EP-09-005
    - rel_type: depends_on
      spec_id: EMB-04-002
    adr:
    - ADR-0122
  - id: MSM-07-010
    priority: MUST
    kind: project
    statement: >-
      The wire activity `Leave(EmbargoEvent)[context=VulnerabilityCase]` is a
      participant's withdrawal of its consent to the case's *active* embargo. For a
      sender whose row for that embargo is AGREED, the receiver MUST apply the PEC
      DECLINE trigger to that row and MUST also decline every open proposal's row the
      sender had AGREED to: every open proposal is a revision of the embargo withdrawn
      from (EP-08-004), and a DECLINED participant MUST NOT hold an AGREED row for an
      embargo that can become active without re-invitation. The receiver MUST refuse
      with a reported reason a Leave whose embargo is not the active one, whose sender's
      row for it is not AGREED, or whose sender is the case owner, which ends an
      embargo by terminating it (CM-02-005). A Leave changes no register entry.
    rationale: >-
      Accept and Reject answer an Invite; leaving an embargo one is bound by is a
      different act, as `Leave(VulnerabilityCase)` is for leaving the case. A dedicated
      activity covers every signatory, including those made signatories with no Invite
      (CM-14-005, CM-11-001), and keeps a Reject from meaning refusal or withdrawal by
      the state of the case. The rejected alternatives are recorded in ADR-0122.
    verification: >-
      Inspection of the received-side handler for `Leave(EmbargoEvent)` confirms it
      declines the sender's AGREED row for the active embargo and its agreed open
      proposals, refuses the three cases named in the statement with a reported reason,
      and changes no register entry.
    relationships:
    - rel_type: derives_from
      spec_id: CM-18-003
    - rel_type: refines
      spec_id: VP-13-017
    adr:
    - ADR-0093
    - ADR-0122
