id: MS
title: Meta-Specification Style Guide
description: Normative rules for authoring specification files in this project. Covers file structure, requirement format,
  IDs, writing rules, cross-references, lifecycle, quality criteria, and the delineation between spec files and ADRs.
scope:
- prototype
- production
tags:
- documentation
- tooling
groups:
- id: MS-01
  title: File Structure
  specs:
  - id: MS-01-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each spec file MUST focus on a single topic of concern and be largely independent of other spec files.
    rationale: Focused files are easier to navigate and maintain.
    tags:
    - documentation
  - id: MS-01-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each spec file MUST group its requirements by category.
    rationale: Grouping by category improves navigation and traceability.
    tags:
    - documentation
  - id: MS-01-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each requirement group MUST address a single, cohesive area of concern.
    rationale: >-
      A group with one area of concern lets a reader load only the requirements a
      task needs. A group that mixes areas makes a reader load rules that do not
      apply, or miss the ones that do.
    relationships:
    - rel_type: refines
      spec_id: MS-01-002
    tags:
    - documentation
- id: MS-02
  title: Priority Levels
  specs:
  - id: MS-02-001
    priority: SHOULD
    kind: process
    statement: >-
      A requirement's `statement:` SHOULD hold the RFC 2119 keyword that its
      `priority:` field names.
    rationale: The `priority:` field is the authoritative record of requirement strength; inline keywords aid readability
      but are advisory.
    tags:
    - documentation
  - id: MS-02-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Each spec entry MUST have a `priority:` field whose value is one of the RFC
      2119 keywords, written `MUST`, `MUST_NOT`, `SHOULD`, `SHOULD_NOT` or `MAY`.
    rationale: The `priority:` field is the machine-readable record of requirement strength. The Pydantic schema enum is the
      implementation of this normative requirement, not its source.
    tags:
    - documentation
  - id: MS-02-003
    priority: MUST
    kind: process
    statement: >-
      Any spec requirement, lint check, ratchet, or tool that selects requirements by
      priority MUST treat a negative keyword as the same tier as its positive: `MUST_NOT`
      with `MUST`, and `SHOULD_NOT` with `SHOULD`.
    rationale: >-
      RFC 2119 makes MUST NOT the same absolute strength as MUST, and SHOULD NOT the same
      strength as SHOULD; a prohibition is no less binding than an obligation. A gate that
      names only the positive keyword silently drops every prohibition. See
      `notes/spec-authoring-rules.md` for the gaps this left in the corpus.
    verification: >-
      Review: a spec requirement that selects by priority names the tier, or explicitly
      excludes the negative form and says why. Code gates are checked mechanically under
      MS-02-004.
    exceptions:
    - SR-11-003 stays MUST-only until every protocol MUST_NOT it would newly flag has
      been adjudicated (#3601) and given a user story (#2717); flipping it earlier needs
      new suppressions, which MS-12-007 forbids.
    relationships:
    - rel_type: refines
      spec_id: MS-02-002
    tags:
    - documentation
    - tooling
  - id: MS-02-004
    priority: MUST
    kind: process
    statement: >-
      Code that selects spec requirements by priority MUST obtain the MS-02-003 tiering
      from a single shared definition on `RFC2119Priority`, not by comparing against
      individual enum members.
    rationale: >-
      Selecting with `== RFC2119Priority.MUST` is easy to write and fails silently, and
      each hand-written member list (`backstop/_model.py` has one) re-decides which
      members count. One shared definition means the tiering is decided once. Display
      code that maps each member to a label is not a selection and is out of scope.
    verification: >-
      A unit test in `test/metadata/specs/` asserts the shared tier definition maps each
      of the five priorities to its tier. A static check fails if a priority-selecting
      comparison in `vultron/metadata/specs/` or `scripts/` tests equality or membership
      against individual `RFC2119Priority` members or priority strings instead of the
      shared definition. The SR-11-003 selector is allowlisted while the MS-02-003
      exception stands.
    relationships:
    - rel_type: refines
      spec_id: MS-02-003
    tags:
    - documentation
    - tooling
- id: MS-03
  title: Requirement Format
  specs:
  - id: MS-03-001
    priority: MUST
    kind: process
    statement: Each spec entry MUST contain exactly one normative statement.
    verification: >-
      `spec-lint --changed-since <ref>` fails each requirement whose statement the
      branch adds or changes and that holds more than one RFC 2119 keyword outside
      backticks (MS-03-007). `test/metadata/specs/test_statement_style.py` covers
      it.
    rationale: Atomic requirements are independently testable and traceable.
    tags:
    - documentation
  - id: MS-03-008
    priority: MUST
    kind: process
    statement: >-
      An author MUST split a compound or multi-condition requirement into separate
      entries.
    rationale: >-
      Two obligations under one ID cannot be verified, cited or retired apart. A
      compound requirement that stays whole keeps that fault, so the author splits
      it rather than only rewording it.
    verification: >-
      `spec-lint --list-compound` lists each compound requirement that is still to
      split, by spec file.
      `test/metadata/specs/test_statement_style.py::TestListCompound` covers the
      listing.
    relationships:
    - rel_type: implements
      spec_id: MS-03-001
    tags:
    - documentation
  - id: MS-03-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Every requirement MUST have a unique ID.
    rationale: IDs enable stable cross-referencing.
    tags:
    - documentation
  - id: MS-03-003
    priority: SHOULD
    kind: process
    statement: Each sentence of a requirement's `statement:` SHOULD hold at most 25 words.
    verification: >-
      `spec-lint --changed-since <ref>` warns on each longer sentence in a
      statement the branch adds or changes, counting a code span as one word;
      `test/metadata/specs/test_statement_style.py` checks the count and the
      warning.
    rationale: >-
      A short sentence is read once and understood. A long one hides its actor,
      its condition or its obligation, and an implementer who misreads a
      requirement builds the wrong behavior.
    tags:
    - documentation
  - id: MS-03-004
    priority: SHOULD
    kind: process
    statement: >-
      A `statement:` SHOULD use the active voice and name the actor that holds
      the obligation, such as the CASE_MANAGER, a participant, `spec-lint`, or
      this codebase.
    rationale: >-
      A passive requirement does not say who must act, so each reader supplies
      an actor, and two implementations can each leave the obligation to the
      other.
    tags:
    - documentation
  - id: MS-03-005
    priority: SHOULD
    kind: process
    statement: >-
      A `statement:` SHOULD state an action with its plain verb, such as
      "remove", not with a noun phrase such as "the removal of".
    rationale: >-
      A noun phrase buries the action and adds words, which makes the sentence
      longer and its obligation harder to find.
    tags:
    - documentation
  - id: MS-03-006
    priority: SHOULD
    kind: process
    statement: >-
      A plain-language rewrite of a `statement:` SHOULD keep its domain terms and
      its RFC 2119 keywords as written.
    rationale: >-
      Domain terms are defined in the glossary and RFC 2119 keywords set the
      requirement's priority. A simpler word in their place changes what the
      requirement means, which a rewrite for plain language must not do.
    tags:
    - documentation
  - id: MS-03-007
    priority: MUST
    kind: process
    statement: >-
      `spec-lint --changed-since <ref>` MUST fail each requirement whose
      `statement:` the branch adds or changes and that holds more than one RFC
      2119 keyword outside backticks. A requirement whose `lint_suppress:` lists
      `compound_statement` with its reason in a YAML comment is exempt.
    verification: >-
      `test/metadata/specs/test_statement_style.py` builds branches that add or
      reword a compound statement, quote a second keyword in backticks, suppress
      the check with and without a reason, and change only a compound
      requirement's `rationale:` or `relationships:`, and checks which of them
      fail. In CI, `test/architecture/test_spec_statement_guard.py` fails a pull
      request that adds or rewords a compound statement with no reasoned
      suppression.
    rationale: >-
      The corpus holds a backlog of compound requirements, so a corpus-wide error
      would fail every branch. Checking only the statements a branch writes holds
      new text to MS-03-001 without forcing a branch that edits another field to
      split a requirement it did not reword.
    tags:
    - documentation
    - tooling
    relationships:
    - rel_type: verifies
      spec_id: MS-03-001
- id: MS-04
  title: Requirement IDs
  specs:
  - id: MS-04-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirement IDs MUST follow the format `PREFIX-NN-NNN` where PREFIX is the file-level prefix, NN is a two-digit
      group number, and NNN is a three-digit requirement number.
    rationale: Consistent format enables automated validation.
    tags:
    - documentation
  - id: MS-04-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirement IDs MUST be globally unique across all spec files.
    rationale: Uniqueness prevents ambiguous cross-references.
    tags:
    - documentation
    relationships:
    - rel_type: implements
      spec_id: SR-01-006
  - id: MS-04-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A requirement ID MUST be stable: once it is assigned, nobody renumbers it.
    rationale: Stable IDs preserve traceability in git history.
    tags:
    - documentation
  - id: MS-04-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Superseded requirements MUST be removed entirely rather than left in place as deprecated.
    rationale: >-
      A deprecated requirement that stays in the file confuses agents and implementers.
      The file does not tell them if the obligation still applies. The `deprecated` and
      `superseded_by` fields in the spec schema are not a sanctioned lifecycle state, so
      they do not remove this confusion.
    tags:
    - documentation
    relationships:
    - rel_type: refines
      spec_id: MS-04-003
  - id: MS-04-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The group part of a requirement ID MUST match the ID of the group that holds
      it, so that `HP-01-001` lives in group `HP-01`.
    rationale: Mismatched prefixes break navigability and cross-reference accuracy.
    tags:
    - documentation
    relationships:
    - rel_type: implements
      spec_id: SR-01-013
- id: MS-05
  title: Writing Rules
  specs:
  - id: MS-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A requirement's `statement:` MUST state its obligation without an inline prose
      explanation.
    rationale: >-
      An explanation inside the statement mixes the reason with the obligation, so a
      reader cannot tell which words bind. The `rationale:` field holds the reason.
    tags:
    - documentation
  - id: MS-05-006
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: A requirement's `statement:` MUST be concise.
    rationale: Concise statements reduce ambiguity.
    relationships:
    - rel_type: extends
      spec_id: MS-05-001
    tags:
    - documentation
  - id: MS-05-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: A requirement MUST be specific.
    rationale: Specificity makes requirements testable.
    tags:
    - documentation
  - id: MS-05-007
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A requirement MUST NOT use a vague term, such as 'appropriate' or 'robust',
      unless it explicitly defines the term.
    rationale: >-
      A vague term lets each reader supply a different meaning, so two
      implementations can both claim to obey the requirement and still differ. A
      defined term has one meaning.
    relationships:
    - rel_type: refines
      spec_id: MS-05-002
    tags:
    - documentation
  - id: MS-05-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each requirement MUST be testable.
    rationale: Untestable requirements cannot be verified.
    tags:
    - documentation
  - id: MS-05-008
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Where measurable acceptance criteria apply, a requirement MUST provide them.
    rationale: >-
      A measurable criterion tells the tester when the requirement is met. Without
      one, a reviewer and an implementer can disagree on whether a test proves the
      requirement.
    relationships:
    - rel_type: extends
      spec_id: MS-05-003
    tags:
    - documentation
  - id: MS-05-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A requirement MUST be declarative: it states what the system does, not how,
      unless the how is itself normative.
    rationale: Declarative requirements avoid constraining implementation unnecessarily.
    tags:
    - documentation
  - id: MS-05-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A requirement written to guard against an implementation mistake MUST state
      the domain truth the mistake violates, in the vocabulary of its kind. It
      states that truth instead of a prohibition of the mistake, or a correction of
      the mistake in another kind's vocabulary.
    rationale: >-
      A bare prohibition makes the mistake look like a possible design, and it gives an
      implementer no target. The positive truth is a design that an implementer can
      follow, and the regression test verifies it. RSH-08-001 is the example: an
      assertion that a participant makes about itself is about that participant, not
      about another actor. A recurring mistake violated that truth (ADR-0089). The
      rationale names the mistake as the problem that the requirement prevents. The
      requirement has no marker, tag or field that identifies it as a guard. A guard
      with no domain truth behind it is not `protocol` (MS-12-003), or it is only a
      regression test.
    tags:
    - documentation
- id: MS-07
  title: Cross-References and Sources
  specs:
  - id: MS-07-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Cross-references between spec entries MUST use the `relationships:` list with a `rel_type` field (one of the
      defined vocabulary terms) and a `spec_id` field referencing the target requirement ID.
    rationale: Structured cross-references in the `relationships:` field enable automated graph analysis and linting of dangling
      references.
    tags:
    - documentation
  - id: MS-07-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Source attribution MUST appear only in the file header, not repeated on individual requirements.
    rationale: Per-requirement sources create maintenance overhead.
    tags:
    - documentation
- id: MS-08
  title: File Naming
  specs:
  - id: MS-08-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Each spec file other than `specs/README.md` MUST have a `kebab-case.yaml`
      name.
    rationale: Consistent naming enables glob patterns and automated tooling.
    tags:
    - documentation
    relationships:
    - rel_type: implements
      spec_id: SR-01-001
  - id: MS-08-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The file `specs/README.md` MUST stay a Markdown file.
    rationale: >-
      The README is the index of the spec corpus that a person reads first, and
      Markdown renders on the code host. The spec loaders read only YAML files, so a
      Markdown README stays outside the corpus they load.
    relationships:
    - rel_type: extends
      spec_id: MS-08-001
    tags:
    - documentation
- id: MS-09
  title: Lifecycle of Requirements
  specs:
  - id: MS-09-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Superseded requirements MUST be removed from spec files rather than marked deprecated or left in place with
      an annotation.
    rationale: >-
      A deprecated requirement that stays in place is noise for agents and can cause
      incorrect behavior. An agent that reads the corpus cannot tell a retired
      obligation from a live one. A spec states the current understanding. Git and the
      implementation history (MS-09-002) keep the text that it replaced. The
      `deprecated` and `superseded_by` fields in the spec schema are not a sanctioned
      lifecycle state.
    tags:
    - documentation
  - id: MS-09-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The removal of a requirement MUST be recorded in the implementation history so there is an audit trail.
    rationale: Audit trail preserves context for future maintainers.
    tags:
    - documentation
  - id: MS-09-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A requirement ID MUST NOT be reused. Once an ID is removed (MS-09-001), no
      later requirement in any spec file carries it. A rule that replaces the
      removed one gets a new ID.
    rationale: >-
      Citations outlive requirements: code comments, tests, ADRs, PR bodies and history entries
      cite IDs. A reused ID silently re-points every one of those at a rule they never meant, and
      the reuse of CM-11-005 with the opposite force (found in the 2026-10-02 audit) did exactly
      that. A new ID costs nothing; a stale citation that still resolves is undetectable.
    relationships:
    - rel_type: refines
      spec_id: MS-09-001
    tags:
    - documentation
  - id: MS-09-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The text of every removed requirement MUST be kept in an archive of retired
      requirements, one file per requirement ID. The archive is the folder
      `plan/retired-specs/`, outside `specs/` and laid out like `plan/history/`.
    rationale: >-
      MS-09-001 keeps retired text out of the specs so it cannot be mistaken for current
      obligation, but git history is a poor place to look up what a cited ID used to say. One file
      per ID gives a citation something to resolve to.
    relationships:
    - rel_type: depends_on
      spec_id: MS-09-001
    - rel_type: depends_on
      spec_id: MS-09-002
    tags:
    - documentation
  - id: MS-09-009
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A loader or agent that reads the spec corpus MUST NOT load the archive of
      retired requirements in `plan/retired-specs/`.
    rationale: >-
      Retired text in agent context can be mistaken for a current obligation. The
      archive sits outside `specs/`, which is the only directory the spec loaders
      read, so no loader can see it.
    relationships:
    - rel_type: uses_definition
      spec_id: MS-09-005
    tags:
    - documentation
  - id: MS-09-006
    priority: MUST
    kind: process
    statement: >-
      `uv run spec-retire <ID>` MUST move the item's final text from its spec file to
      `plan/retired-specs/<ID>.md`, with the retiring issue or PR, the date and any
      replacement ID.
    rationale: >-
      Doing a retirement by hand means three separate edits, and the one that gets skipped is
      the one that leaves the audit trail or a stale citation behind. One command makes the
      whole retirement.
    verification: >-
      `test_retire_moves_item_to_archive` in `test/metadata/specs/test_retire.py`
      retires an item in a scratch repository and checks the archive file.
    relationships:
    - rel_type: implements
      spec_id: MS-09-005
    tags:
    - documentation
    - tooling
  - id: MS-09-010
    priority: MUST
    kind: process
    statement: >-
      `uv run spec-retire <ID>` MUST record the removal in the implementation history
      (MS-09-002).
    rationale: >-
      A retirement done by hand often skips the history entry, and then no audit
      trail shows why the ID went away. When the command writes the entry, every
      retirement leaves one.
    verification: >-
      `test_retire_records_history_and_lists_cross_references` in
      `test/metadata/specs/test_retire.py` checks the history entry, and
      `test_retire_rolls_back_when_history_write_fails` checks that a failed write
      leaves the spec file unchanged.
    relationships:
    - rel_type: implements
      spec_id: MS-09-002
    tags:
    - documentation
    - tooling
  - id: MS-09-011
    priority: MUST
    kind: process
    statement: >-
      `uv run spec-retire <ID>` MUST list every remaining citation of the ID that
      MS-09-003 requires repointing.
    rationale: >-
      A citation of a removed ID still resolves in a reader's head, so nobody sees it
      go stale. The list gives the author each citation to repoint in the same
      change.
    verification: >-
      `test_retire_records_history_and_lists_cross_references` in
      `test/metadata/specs/test_retire.py` checks the listed citations.
    relationships:
    - rel_type: extends
      spec_id: MS-09-006
    tags:
    - documentation
    - tooling
  - id: MS-09-012
    priority: MUST
    kind: process
    statement: >-
      `uv run spec-retire <ID>` MUST change nothing when the ID is already archived,
      is not declared, or the spec files would no longer load without it.
    rationale: >-
      A retirement that stops part way leaves an archive with no history, or a spec
      corpus that does not load. Refusing the whole retirement keeps the corpus and
      the archive in step.
    verification: >-
      `test_retire_refuses_archived_id_and_changes_nothing`,
      `test_retire_refuses_unknown_id_and_unknown_replacement` and
      `test_retire_restores_file_when_group_would_be_left_empty` in
      `test/metadata/specs/test_retire.py` check each refusal.
    relationships:
    - rel_type: extends
      spec_id: MS-09-006
    tags:
    - documentation
    - tooling
  - id: MS-09-007
    priority: MUST
    kind: process
    statement: >-
      `spec-lint` MUST fail on a `deprecated:` or `superseded_by:` key on any requirement in
      `specs/`, and on any requirement ID that is both declared in `specs/` and present in
      `plan/retired-specs/`.
    rationale: >-
      MS-09-001 and MS-09-004 are rules a human forgets; the corpus already held both
      violations (deprecated-in-place entries, and CM-11-005 reused with the opposite force)
      before anything checked for them.
    verification: >-
      `test/metadata/specs/test_retire.py` lints a scratch corpus carrying each key and a
      re-declared archived ID and expects exit 1; `test_live_specs_do_not_reuse_or_deprecate`
      holds the real corpus to the same rule.
    relationships:
    - rel_type: implements
      spec_id: MS-09-004
    tags:
    - documentation
    - tooling
  - id: MS-09-008
    priority: MUST
    kind: process
    statement: >-
      The text that `uv run spec-retire <ID>` archives (MS-09-006) MUST be the item's
      last published text: its block at the merge base of `HEAD` and the base branch,
      which is `origin/$GITHUB_BASE_REF`, else `origin/main`, unless `--base` names
      another. When the item is not declared at that merge base, or the merge base
      cannot be resolved, the tool changes nothing.
    rationale: >-
      A branch can change a requirement and then retire it. The archive must then keep
      the text that was published, not the change that nobody approved. The merge base
      holds the last published text. An item that is not at the merge base was never
      published, so you delete it; you do not retire it. If the tool cannot find the
      merge base, it cannot find the published text, so it stops and does not guess.
    verification: >-
      `test/metadata/specs/test_retire.py`, in the tests marked
      `@pytest.mark.spec("MS-09-008")`:
      `test_retire_archives_base_text_when_block_edited_on_branch` and
      `test_retire_finds_base_text_in_another_spec_file` check that the archive holds
      the merge-base text of an item edited or moved on the branch;
      `test_retire_defaults_base_to_github_base_ref` and
      `test_retire_uses_explicit_base` check the choice of base branch;
      `test_retire_refuses_id_absent_on_base_and_changes_nothing`,
      `test_retire_refuses_unresolvable_base_and_changes_nothing`,
      `test_retire_refuses_unreadable_base_tree_and_changes_nothing` and
      `test_cli_passes_base_and_reports_refusal` check that each refusal leaves the
      spec file, the archive and the history unchanged.
    relationships:
    - rel_type: refines
      spec_id: MS-09-006
    tags:
    - documentation
    - tooling
  - id: MS-09-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Cross-references to a removed requirement MUST be updated to point to the replacement requirement.
    rationale: Dangling cross-references break traceability.
    tags:
    - documentation
- id: MS-10
  title: Quality Criteria
  specs:
  - id: MS-10-001
    priority: SHOULD
    kind: process
    statement: Spec files SHOULD be scannable via priority-grouped layout.
    rationale: Priority grouping lets readers quickly find the most critical requirements.
    tags:
    - documentation
  - id: MS-10-002
    priority: SHOULD
    kind: process
    statement: >-
      Spec files SHOULD be traceable via stable IDs and cross-references that the
      requirements graph lets a reader follow from either end.
    rationale: Traceability supports change impact analysis.
    tags:
    - documentation
  - id: MS-10-003
    priority: MUST
    kind: process
    statement: >-
      Every `priority: MUST` or `priority: MUST_NOT` requirement MUST include a
      `verification:` field.
    rationale: >-
      An implementer cannot reliably build to a requirement that no test can check. A
      MUST requirement with no `verification:` field gives reviewers and agents no
      contract. MS-05-003 makes every requirement testable, and this rule uses the same
      tier. Thus the linter checks the field where that rule is strongest. MS-02-003
      puts MUST_NOT in scope, because a prohibition that nothing checks is the same gap.
      MS-10-005 through MS-10-008 apply the rule to one requirement at a time while the
      backlog decreases.
    verification: >-
      `spec-lint` exits 1 on any MUST or MUST_NOT requirement that has neither a
      `verification:` field nor a `verification_debt:` marker; unit tests in
      `test/metadata/specs/test_verification.py` prove it for both keywords.
    relationships:
    - rel_type: refines
      spec_id: MS-05-003
    tags:
    - documentation
    - tooling
  - id: MS-10-005
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST print, in its default output, one summary line for each kind
      that has an owner entry (MS-10-021) or a `verification_debt:` marker. The line
      gives the number of `priority: MUST` or `priority: MUST_NOT` requirements of
      that kind that carry a marker, tallied by the issue each marker names.
    rationale: >-
      MS-05-008 and MS-10-003 require measurable acceptance criteria for MUST and
      MUST_NOT requirements. A count for each kind keeps the backlog easy to read and
      shows the progress of each backfill.
    verification: >-
      `test_lint_one_summary_line_per_kind_computed_from_markers` and
      `test_lint_kind_with_owner_entry_prints_its_line_even_at_zero_markers` in
      `test/metadata/specs/test_lint.py`, and
      `test_debt_by_kind_groups_markers_and_tallies_owners` and
      `test_summary_names_every_owner_including_those_at_zero` in
      `test/metadata/specs/test_verification.py`, check one line per kind with the
      correct per-owner tally.
    relationships:
    - rel_type: implements
      spec_id: MS-05-003
    - rel_type: implements
      spec_id: MS-10-003
    - rel_type: depends_on
      spec_id: MS-10-006
    - rel_type: uses_definition
      spec_id: MS-10-021
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-019
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST compute each MS-10-005 summary line from the markers, not read
      it from a committed count.
    rationale: >-
      A committed count is right only on the pull request that sets it. Each
      concurrent pull request that adds or removes a marker makes it wrong. A count
      that spec-lint computes from the markers has no shared number to race on.
    verification: >-
      `test_summary_does_not_depend_on_any_committed_count` in
      `test/metadata/specs/test_verification.py` and
      `test_lint_one_summary_line_per_kind_computed_from_markers` in
      `test/metadata/specs/test_lint.py` check that the line follows the markers.
    relationships:
    - rel_type: extends
      spec_id: MS-10-005
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-020
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST print the marked requirement IDs only when an opt-in flag asks
      for them, and never one line per marked requirement by default.
    rationale: >-
      One warning for each unverified requirement gives so many lines that a new
      instance is not visible. A reader who needs the IDs asks for them.
    verification: >-
      `test_lint_default_output_has_no_per_item_unverified_lines`,
      `test_lint_list_unverified_prints_ids_under_their_kind`,
      `test_main_list_unverified_flag` and `test_main_default_does_not_list_ids` in
      `test/metadata/specs/test_lint.py`, and
      `test_listing_is_opt_in_and_names_each_marker` in
      `test/metadata/specs/test_verification.py`, check the default output and the
      opt-in listing.
    relationships:
    - rel_type: extends
      spec_id: MS-10-005
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-006
    priority: MUST
    kind: process
    statement: >-
      Until it gains a `verification:` field, each `priority: MUST` or
      `priority: MUST_NOT` requirement MUST carry a `verification_debt:` marker. The
      marker names, in `#N` form, the open issue that owns verifying the
      requirement.
    rationale: >-
      The marker gives each unverified requirement a tracked path to verification. A
      count that must equal the live value is correct on the pull request that sets
      it, and incorrect on all other open pull requests. A rule for each item has no
      shared number, so two pull requests conflict only when they edit the same
      requirement.
    verification: >-
      spec-lint fails a MUST-tier requirement with neither field (MS-10-022), and
      `test_live_corpus_has_no_per_item_verification_failure` in
      `test/metadata/specs/test_verification.py` holds the live corpus to the rule.
    relationships:
    - rel_type: implements
      spec_id: MS-10-003
    - rel_type: refines
      spec_id: MS-02-003
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-021
    priority: MUST
    kind: process
    statement: >-
      The issue that a `verification_debt:` marker names MUST be listed as an owner of
      its requirement's kind in the one owner table under `vultron/metadata/specs/`.
    rationale: >-
      Each kind has its own backlog, and the owner table says which issues own it.
      A marker that names any other issue adds debt to a backlog that never took it
      on. The table holds issue references and no counts, so the verification of a
      requirement does not change the table.
    verification: >-
      `test_owner_table_entries_are_non_empty_issue_references` and
      `test_relabel_that_keeps_the_old_kinds_marker_fails` in
      `test/metadata/specs/test_verification.py` check the table's entries and the
      failure for a marker whose issue does not own its kind (MS-10-022).
    relationships:
    - rel_type: extends
      spec_id: MS-10-006
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-022
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST fail each requirement, one at a time, that breaks the marker
      rules of MS-10-006 and MS-10-021. It fails a `MUST`-tier requirement with
      neither field, and a requirement with both, a stale marker. It also fails a
      marker below the `MUST` tier, and a marker naming an issue that does not own
      its kind.
    rationale: >-
      A per-item failure names the requirement to fix, and it has no shared number
      for concurrent pull requests to race on. A stale marker hides a verified
      requirement in the backlog, and a marker below the MUST tier counts debt that
      MS-10-003 does not require.
    verification: >-
      `test_must_tier_with_neither_field_fails`,
      `test_must_tier_with_both_fields_fails_as_stale`,
      `test_marker_below_the_must_tier_fails` and
      `test_relabel_that_keeps_the_old_kinds_marker_fails` in
      `test/metadata/specs/test_verification.py`, and
      `test_lint_unmarked_unverified_must_tier_is_hard_error` in
      `test/metadata/specs/test_lint.py`, check each per-item failure.
    relationships:
    - rel_type: verifies
      spec_id: MS-10-006
    - rel_type: verifies
      spec_id: MS-10-021
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-023
    priority: MUST
    kind: process
    statement: >-
      A pull-request check MUST fail a pull request that closes an owner issue that a
      `verification_debt:` marker or the owner table still names.
    rationale: >-
      Usually, the backfill pull request that says `Closes #N` closes the owner
      issue. A failure on that pull request affects no other pull request. It also
      finds a backfill that claims to be complete but leaves requirements unverified.
    verification: >-
      `test_pr_closing_an_owner_that_markers_still_name_fails` and
      `test_closing_pr_lookup_failure_is_an_error` in
      `test/metadata/specs/test_verification.py`, and
      `test_lint_check_closing_pr_fails_a_pr_closing_an_owner_in_use` in
      `test/metadata/specs/test_lint.py`, check the verdict.
      `test_closing_pr_check_fails_the_pr_on_every_pull_request` in
      `test/ci/test_verification_debt_owner_check.py` checks that
      `.github/workflows/verification-debt-owners.yml` runs it through
      `--check-closing-pr` on pull requests.
    relationships:
    - rel_type: verifies
      spec_id: MS-10-006
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-024
    priority: MUST
    kind: process
    statement: >-
      A scheduled check MUST run at least hourly and report each marker or owner
      entry that names a closed issue. It reports through one tracking issue and
      does not fail the build.
    rationale: >-
      When a person closes an owner issue manually, no pull request causes the
      change. A build failure would then make every open pull request fail, so the
      scheduled check reports it instead (ARCH-18-004).
    verification: >-
      `test_closed_owner_fails_and_open_owner_passes` and
      `test_lookup_failure_is_an_error_not_a_pass` in
      `test/metadata/specs/test_verification.py`, and
      `test_lint_check_debt_owners_fails_on_a_closed_owner` and
      `test_lint_check_debt_owners_ignores_unrelated_lint_errors` in
      `test/metadata/specs/test_lint.py`, check the report.
      `test_open_owner_check_reports_and_never_fails_the_build` and
      `test_open_owner_check_runs_at_least_hourly` in
      `test/ci/test_verification_debt_owner_check.py` check that
      `.github/workflows/verification-debt-owners.yml` runs `--check-debt-owners`
      hourly and never fails the build.
    relationships:
    - rel_type: verifies
      spec_id: MS-10-006
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-007
    priority: MUST
    kind: process
    statement: >-
      An owner issue that no `verification_debt:` marker names MUST leave the owner
      table (MS-10-021), and a kind's entry leaves with its last owner.
    rationale: >-
      A backlog can stay at zero only if nothing can increase it again. When the
      entry for a kind is removed, spec-lint accepts no marker of that kind
      (MS-10-026), so the end state is permanent. The pull request that closes the
      owner issue fails until the entry is removed, so the removal must occur.
    verification: >-
      `test_pr_closing_an_idle_owner_must_also_remove_it_from_the_table` in
      `test/metadata/specs/test_verification.py` checks that a pull request closing
      an owner no marker names fails while the table still lists it.
    tracking_issue: '#3612'
    relationships:
    - rel_type: depends_on
      spec_id: MS-10-006
    - rel_type: uses_definition
      spec_id: MS-10-021
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-025
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST report an owner issue that no `verification_debt:` marker names.
    rationale: >-
      The report shows which owner must leave the table (MS-10-007). spec-lint
      reports it but does not fail. Two pull requests that each verify some of the
      last requirements of that owner pass alone, but together they would make
      `main` fail.
    verification: >-
      `test_owner_no_marker_names_is_reported_not_failed` and
      `test_idle_owners_lists_every_unnamed_owner_in_issue_order` in
      `test/metadata/specs/test_verification.py` check the report.
    relationships:
    - rel_type: extends
      spec_id: MS-10-007
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-026
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST treat as a hard error a `verification_debt:` marker on any
      requirement of a kind that has no owner entry.
    rationale: >-
      MS-10-022 already fails an unverified requirement with no marker. With no
      marker allowed, an unverified MUST or MUST_NOT of that kind can only pass by
      gaining a `verification:` field. While an owner remains, the growth guard
      (MS-10-016) fails a pull request that adds a marker.
    verification: >-
      `test_marker_on_a_kind_with_no_owner_entry_fails` and
      `test_verified_items_of_a_finished_kind_pass` in
      `test/metadata/specs/test_verification.py`, and
      `test_lint_marker_on_a_kind_with_no_owner_entry_is_hard_error` and
      `test_lint_verified_must_tier_passes_without_owner_entry` in
      `test/metadata/specs/test_lint.py`, check that a marked MUST and a marked
      MUST_NOT each fail and that verified items pass.
    relationships:
    - rel_type: refines
      spec_id: MS-10-022
    - rel_type: implements
      spec_id: MS-10-003
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-008
    priority: MUST
    kind: process
    statement: >-
      A change that moves a `priority: MUST` or `priority: MUST_NOT` requirement carrying a
      `verification_debt:` marker from one kind to another MUST replace the marker with a
      `verification:` field in the same change.
    rationale: >-
      Each kind's backlog has its own owner. Re-pointing a relabelled requirement's marker
      at the destination kind's owner would add debt to a backlog that never took it on,
      which is the growth the marker exists to forbid.
    verification: >-
      spec-lint fails on a marker naming an issue that does not own its requirement's
      kind, so a relabel that keeps its old marker fails; a fixture test in
      `test/metadata/specs/test_verification.py` proves it. A relabel that re-points the
      marker at the destination kind's owner is a new marker for that owner, which the
      growth guard (MS-10-016, `test/architecture/test_verification_debt_guard.py`)
      rejects.
    relationships:
    - rel_type: refines
      spec_id: MS-10-006
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0101
  - id: MS-10-009
    priority: MUST
    kind: process
    statement: >-
      A `verification:` clause MUST name a check that exists and that inspects the
      property its requirement's statement asserts. Naming a tool or test that merely
      runs near the property does not satisfy this requirement: a build, lint or
      type-check that never examines the artifact the statement constrains, or a test
      that does not exist, is not verification.
    rationale: >-
      A verification clause is a claim about the test suite, and a false claim looks the
      same as a true one. This failure has several forms. A clause can cite a build for
      a property that the build does not examine, such as a strict docs build named for
      links that it does not see. A clause can describe a test that does not exist, or
      name the wrong component. A requirement can also have no check that enforces it,
      and then only some of the code obeys it. MS-15-001 makes sure that a path
      resolves, not that a check examines the property. See
      `notes/spec-authoring-rules.md`.
    verification: >-
      Checked at spec review: for each new or changed `verification:` clause the
      reviewer asks whether the named check would fail if the requirement were violated,
      and reports a FAIL when it would not (`.agents/skills/pr-triage`). The existence
      of a named path is enforced by MS-15-001, of a named test by MS-10-010, and of
      a protocol requirement's marker in a named test by MS-10-011.
    relationships:
    - rel_type: refines
      spec_id: MS-10-003
    - rel_type: depends_on
      spec_id: MS-15-001
    tags:
    - documentation
    - tooling
  - id: MS-10-004
    priority: SHOULD
    kind: process
    statement: >-
      A spec entry SHOULD need only `id`, `priority`, `kind`, `statement` and
      `rationale` (MS-10-012) to be complete.
    rationale: Requiring optional fields on every entry creates boilerplate that discourages keeping specs current.
    tags:
    - documentation
  - id: MS-10-018
    priority: SHOULD
    kind: process
    statement: >-
      An author SHOULD add an optional field, such as `tags` or `relationships`, only
      when it gives clear value, not by default.
    rationale: >-
      An optional field added by habit is noise that a reader must check and a
      maintainer must keep current. A wrong `relationships:` entry also gives the
      impact walk a wrong answer.
    relationships:
    - rel_type: extends
      spec_id: MS-10-004
    tags:
    - documentation
  - id: MS-10-010
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST report as a hard error each test a `verification:` clause
      names that does not exist: a pytest node (`<file>.py::<name>`) whose names
      do not resolve, in order, in that file; and a bare `test_<name>` token that
      no test file or test directory the clause names defines, or, when the clause
      names none, that no file under `test/` or `integration_tests/` defines.
    rationale: >-
      A named test that does not exist looks the same as a test that exists, and
      MS-15-001 resolves only the file. spec-lint looks for the name only where the
      clause points, so it also finds a test that moved to a different module.
    verification: >-
      `test/metadata/specs/test_verification_refs.py::TestUnresolvedTestRefs`
      covers a resolved name, an unresolved name, a name defined only in a module
      other than the one named, and node paths;
      `test/metadata/specs/test_real_specs.py::test_real_specs_lint_no_hard_errors`
      holds the live corpus to none.
    relationships:
    - rel_type: refines
      spec_id: MS-10-009
    - rel_type: depends_on
      spec_id: MS-15-001
    tags:
    - documentation
    - tooling
  - id: MS-10-011
    priority: MUST
    kind: process
    statement: >-
      When the `verification:` clause of a `kind: protocol` or `kind: foundation`
      requirement names test files, at least one of them MUST carry
      `@pytest.mark.spec("<ID>")` for that requirement.
    rationale: >-
      A clause pointing at a test that does not carry the marker claims a check
      the coverage report cannot see.
    verification: >-
      `test/metadata/specs/test_verification_refs.py::TestNamedTestsLackMarker`.
    relationships:
    - rel_type: refines
      spec_id: MS-10-009
    - rel_type: refines
      spec_id: SR-05-004
    tags:
    - documentation
    - tooling
  - id: MS-10-027
    priority: MUST
    kind: process
    statement: >-
      `spec-lint --changed-since <ref>` MUST report each requirement that the branch
      adds or changes and that breaks MS-10-011.
    rationale: >-
      The corpus has a backlog, so a corpus-wide error would fail every branch.
      Checking what a branch touches holds each new or changed requirement to the
      rule.
    verification: >-
      `test/metadata/specs/test_branch_checks.py::TestChangedMarkers`.
    relationships:
    - rel_type: verifies
      spec_id: MS-10-011
    tags:
    - documentation
    - tooling
  - id: MS-10-028
    priority: MUST
    kind: process
    statement: >-
      A pull-request growth guard MUST fail on each requirement that a pull request
      adds to the set that breaks MS-10-011.
    rationale: >-
      An author can skip `spec-lint --changed-since`. The guard runs in CI on every
      pull request, so the set of requirements that break the rule cannot grow.
    verification: >-
      `test_no_pr_adds_a_named_test_without_its_marker` in
      `test/architecture/test_spec_coverage_ratchet.py`.
    relationships:
    - rel_type: verifies
      spec_id: MS-10-011
    tags:
    - documentation
    - tooling
  - id: MS-10-012
    priority: MUST
    kind: process
    statement: >-
      Every requirement MUST carry a `rationale:` that explains why the requirement
      is necessary given current conditions: the problem it prevents or the property
      it guarantees.
    rationale: >-
      A requirement with no written reason can only be obeyed or guessed at. When it
      conflicts with another requirement, nobody can weigh the two, and when its
      reason lapses, nobody can see that it should be retired. User stories give a
      reason only where they exist (SR-11), so for most project and process
      requirements the rationale is the only place the reason can live.
    verification: >-
      `test/metadata/specs/test_schema.py::test_statement_spec_rationale_omitted_rejected`
      and `test_statement_spec_rationale_none_rejected` check that the schema
      refuses a requirement with no rationale (SR-02-009), so a spec file that
      holds one fails to load.
    relationships:
    - rel_type: refines
      spec_id: SR-02-009
    tags:
    - documentation
    - tooling
  - id: MS-10-013
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A `rationale:` MUST NOT narrate how its requirement came about, such as its
      prior wording, a reverted change, or the issues and pull requests behind it.
      That history belongs in the decision record the `adr:` field cites, the
      version-control log, or the project history.
    rationale: >-
      A narrated history answers what happened, not why the rule holds, and it reads
      as a standing endorsement of the earlier state it describes. A reader then
      has to reconstruct the current reason from the story, and the story goes
      stale with every later edit, while a stated reason stays true for as long as
      the requirement does.
    relationships:
    - rel_type: refines
      spec_id: MS-10-012
    tags:
    - documentation
  - id: MS-10-015
    priority: SHOULD
    kind: process
    statement: >-
      The project SHOULD provide two advisory reports, each filterable by spec file
      and neither failing the build: requirements whose ID a live decision record's
      body names while their `adr:` field does not cite that record, and rationales
      that match patterns of history narration.
    rationale: >-
      A requirement a decision record names is often one that record motivates, so a
      missing `adr:` link is a likely gap in the trace from rule to reason. History
      narration is easy to recognize but has false positives, such as an issue cited
      as evidence, so both lists are worklists for a person to judge rather than
      gates. A per-file filter lets one task work through its own spec files.
    verification: >-
      `test/metadata/specs/test_rationale.py` covers both reports, the per-file
      filter, and the `spec-rationale` command line exiting 0.
    relationships:
    - rel_type: derives_from
      spec_id: MS-10-012
    - rel_type: derives_from
      spec_id: MS-10-013
    - rel_type: derives_from
      spec_id: MS-11-004
    tags:
    - documentation
    - tooling
  - id: MS-10-016
    priority: MUST
    kind: process
    statement: >-
      A PR-only growth guard MUST fail a pull request that gives a requirement a
      `verification_debt:` marker its merge-base version lacked. A marker naming a
      different issue there counts as a new marker. A marker removed, or moved with its
      requirement to another file, does not. Nor does the same marker on a new ID whose
      own `relationships:` name a requirement that carried it at the merge base. The
      guard lists each such requirement and compares against no committed count.
    rationale: >-
      spec-lint judges each marker alone, so it passes a new unverified requirement that
      arrives with a marker. It also passes a relabel that re-points its marker at the
      destination kind's owner, which MS-10-008 forbids. Either adds debt to a backlog
      that may only shrink. Splitting a compound requirement (MS-03-001) adds none: it
      moves one unverified obligation to a new ID, which links back to the original.
      Comparing per-item sets with the merge base leaves no committed number for
      concurrent pull requests to race on (#3984).
    verification: >-
      `test/architecture/test_verification_debt_guard.py::test_no_pr_adds_a_verification_debt_marker`
      runs the guard on the live corpus, and the `test_debt_*` tests in
      `test/metadata/specs/test_growth_guard.py` cover a marker added to a new or a
      verified requirement, a removed marker, an edited marked requirement, a marker
      moved to another file, a relabel that keeps or re-points its marker, a split
      child or grandchild that keeps or re-points its parent's marker, a child of a
      verified or newly marked parent, an existing ID that gains a link, and a
      skipped run with no base ref that logs its reason.
    relationships:
    - rel_type: refines
      spec_id: MS-10-007
    - rel_type: refines
      spec_id: MS-10-008
    tags:
    - documentation
    - tooling
  - id: MS-10-017
    priority: SHOULD
    kind: process
    statement: >-
      A `rationale:` SHOULD read as Simplified Technical English in spirit: short
      sentences, a constrained vocabulary, the active voice and no jargon. Its
      domain terms are the ones `CONTEXT.md` and `docs/reference/glossary.md`
      define, even where an STE-approved word could replace one.
    rationale: >-
      For most project and process requirements, the rationale is the only
      written reason. A reader who is new to the project must understand it.
      Short, plain sentences are easy to read and to translate. One term for
      each concept lets a reader find the same idea in specs, docs and code. An
      STE swap gives a second word for the concept and breaks that link, so the
      glossary term or spec term stays: "create a case", not "make a case".
    relationships:
    - rel_type: refines
      spec_id: MS-10-012
    tags:
    - documentation
- id: MS-11
  title: Spec vs. ADR Delineation
  specs:
  - id: MS-11-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec file MUST capture testable requirements: what the system does, stated
      with RFC 2119 keywords, so that the spec defines the system's intended
      behaviour.
    rationale: >-
      A requirement that a test can check gives implementers and reviewers one
      contract. RFC 2119 keywords state how binding each requirement is.
    tags:
    - documentation
  - id: MS-11-009
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec file MUST NOT record the reason for choosing one approach over another.
    rationale: >-
      Mixing decision rationale into spec files blurs the distinction between
      requirements and design history, making both harder to maintain and trace. A
      decision record holds that reason (MS-11-002).
    relationships:
    - rel_type: extends
      spec_id: MS-11-001
    tags:
    - documentation
  - id: MS-11-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: An Architecture Decision Record (ADR) MUST be created whenever a meaningful alternative was evaluated and
      rejected. The primary signal for an ADR is the presence of options considered and discarded — "we weighed X, Y, and Z
      and chose X because …"
    rationale: If no real fork existed, there is no decision to record. An ADR without evaluated alternatives is just prose
      documentation and belongs in notes/ instead.
    tags:
    - documentation
  - id: MS-11-003
    priority: SHOULD
    kind: process
    statement: When a significant architectural decision generates recurring testable requirements, both an ADR and a spec
      entry SHOULD be created. The ADR captures the why (context, options, consequences); the spec captures the what
      (requirements agents and reviewers must satisfy going forward).
    rationale: The two documents serve different audiences. The ADR is for human reviewers asking "why was this chosen?";
      the spec is for implementation agents asking "what must I do?". Collapsing them into one document serves neither well.
    tags:
    - documentation
  - id: MS-11-004
    priority: SHOULD
    kind: process
    statement: >-
      A spec entry that an ADR-backed decision motivated SHOULD reference the ADR in
      its rationale field.
    rationale: Bidirectional cross-references make it possible to trace a requirement back to its decision rationale and
      forward from a decision to its testable consequences.
    tags:
    - documentation
  - id: MS-11-010
    priority: SHOULD
    kind: process
    statement: >-
      An ADR SHOULD list the spec IDs that it generated in its "More Information"
      section.
    rationale: >-
      The list lets a reader go from a decision to its testable consequences. With
      MS-11-004, the trace runs in both directions.
    tags:
    - documentation
  - id: MS-11-005
    priority: SHOULD
    kind: process
    statement: When the correct approach is uncontested and no alternative was seriously considered, a spec entry alone is
      sufficient. An ADR SHOULD NOT be created merely to document an obvious or unchallenged choice.
    rationale: Writing ADRs for trivial decisions adds noise to the decision log and devalues the records that capture
      genuine trade-offs.
    tags:
    - documentation
  - id: MS-11-006
    priority: SHOULD
    kind: process
    statement: When a decision is a one-time structural or process choice with no recurring testable requirements (e.g.,
      "use CalVer for project versioning", "pin CI actions to full commit SHAs"), an ADR alone is sufficient. A spec entry
      SHOULD NOT be created if there is no per-change requirement for agents to check.
    rationale: Not every decision produces enforceable requirements. Creating spec entries for binary one-time choices
      inflates the spec corpus without providing testable value.
    tags:
    - documentation
  - id: MS-11-007
    priority: MUST_NOT
    kind: process
    statement: >-
      This rule covers spec files, `notes/` files, and code comments and docstrings
      under `vultron/` and `test/`. Such a file MUST NOT resolve its meaning by
      naming a numbered part inside a decision record's body. A numbered part is a
      record ID with a detail, rule, step, option, part, invariant or section (§)
      number. Examples are a record's "Rule N" and "invariant N". A decision record that
      cites a numbered part of another record is out of scope: that is history
      citing history. Any "detail" followed by a number counts, even a bare "detail
      N" a sentence after the record was named. The other part words count only
      with a record ID nearby, because a numbered step of a procedure is ordinary
      prose.
    rationale: >-
      A part number is defined nowhere but the record body, so a citation of one makes the body load-bearing and forces
      every reader to load it, which ADR-0127 removes from routine agent context. A rule stated in a requirement is
      checked by its verification clause; a rule left in a body ages with nothing to say it has. The shape is not
      specific to one word: a rule, option or decision-part number points into a body exactly as a detail number does.
      Agents read code comments as often as spec files, so the citation shape is equally harmful there.
    verification: >-
      `test_no_file_names_a_numbered_decision_part` in `test/metadata/test_no_decision_record_part_citations.py`
      selects candidate lines with one `git grep` over every tracked or untracked file under `specs/`, `notes/`,
      `vultron/`, and `test/` (excluding the test file itself, whose detector-case strings contain citation shapes by
      design), whatever its suffix, and fails on a numbered-part citation, including one split across a line break;
      it fails rather than skips when git is unavailable or the scan covers no files. Its detector cases show it
      catches each citation shape that was converted and passes a requirement-ID citation and numbered-procedure text.
    adr:
    - ADR-0127
    tags:
    - documentation
  - id: MS-11-011
    priority: MUST
    kind: process
    statement: >-
      A file that MS-11-007 covers MUST state a decision-record rule where the reader
      already is, or cite the requirement that states it. It cites the record only as
      provenance for why.
    rationale: >-
      A reader can then act on the rule without loading the record body, which
      ADR-0127 removes from routine agent context. A rule stated in a requirement is
      checked by its verification clause, and the record still shows why the rule
      exists.
    verification: >-
      Review: at spec and code review, the reviewer checks that a changed file
      states a decision-record rule in place or cites its requirement. The detector
      cases of `test_no_file_names_a_numbered_decision_part` in
      `test/metadata/test_no_decision_record_part_citations.py` show that a
      requirement-ID citation passes.
    relationships:
    - rel_type: extends
      spec_id: MS-11-007
    adr:
    - ADR-0127
    tags:
    - documentation
  - id: MS-11-008
    priority: MUST
    kind: process
    statement: >-
      `deepen-context`, the routine context-loading skill, MUST route through
      decision records by the generated title index and by the `adr:` edges of
      requirements. It reads those edges in the record-to-requirements direction.
    rationale: >-
      A record body is history. Its description of the code becomes out of date with
      each refactor, but the decision stays valid. When an agent loads the body as
      routine context, it uses working memory on claims that are no longer true
      (ADR-0127).
    verification: >-
      `test_step2_routes_by_title_index_and_adr_edges` in
      `test/metadata/test_routine_context_skips_adr_bodies.py` reads
      `.agents/skills/deepen-context/SKILL.md` and asserts its Step 2 names
      `docs/adr/index.md`, `spec-dump --adr` and the prose-only grep.
    relationships:
    - rel_type: refines
      spec_id: MS-11-007
    adr:
    - ADR-0127
    tags:
    - documentation
  - id: MS-11-012
    priority: MUST
    kind: process
    statement: >-
      `deepen-context` MUST carry a written list of the skills that read
      decision-record bodies in full, with the reason each one needs them. The list
      names at least decision auditing, record authoring, the learning workflow,
      issue planning and pull-request triage.
    rationale: >-
      A written list of exceptions prevents a reader from taking the routing rule of
      MS-11-008 to mean "never read a record". The skills it names make a record
      their object of work, so they need its full text.
    verification: >-
      `test_exception_list_names_each_required_skill_with_a_reason` in
      `test/metadata/test_routine_context_skips_adr_bodies.py` asserts the exception
      table lists each required skill with a reason.
    relationships:
    - rel_type: extends
      spec_id: MS-11-008
    adr:
    - ADR-0127
    tags:
    - documentation
  - id: MS-11-013
    priority: MUST_NOT
    kind: process
    statement: >-
      A skill kept in this repository and not on the MS-11-012 list MUST NOT tell an
      agent to read a decision-record body.
    rationale: >-
      A skill off the list that reads record bodies brings back the routine loading
      that MS-11-008 removes. The list is the only way to add an exception.
    verification: >-
      `test_no_routine_skill_instructs_reading_a_record_body` in
      `test/metadata/test_routine_context_skips_adr_bodies.py` scans every skill
      file under `.agents/skills/` off the list for a reading verb whose object is a
      record path, a full record, a record body, a record ID, or "ADR(s)" or
      "decision record(s)" other than the index, a title, the template or a status.
      Its detector cases show it catches plain forms such as "read the relevant
      ADRs", and passes routing instructions.
    relationships:
    - rel_type: uses_definition
      spec_id: MS-11-012
    adr:
    - ADR-0127
    tags:
    - documentation
  - id: MS-11-014
    priority: MUST
    kind: process
    statement: >-
      Each skill on the MS-11-012 list kept in this repository MUST weigh what it
      reads by the shared guidance on when a record is challengeable.
    rationale: >-
      A record can be provisional or uncertain. A skill that weighs what it reads
      treats such a record as provisional or uncertain, and not as settled fact.
    verification: >-
      `test_each_in_repo_exception_skill_weighs_what_it_reads` in
      `test/metadata/test_routine_context_skips_adr_bodies.py` asserts that each
      in-repository listed skill points at
      `.agents/skills/shared/weighing-decision-records.md`.
    relationships:
    - rel_type: uses_definition
      spec_id: MS-11-012
    adr:
    - ADR-0127
    tags:
    - documentation
- id: MS-12
  title: SpecKind Classification Decision Tree
  description: Rules for assigning a `kind` value to a new or reclassified spec. Who must obey a rule decides its kind.
    Split a spec that mixes kinds first, then stop at the first matching question.
  specs:
  - id: MS-12-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: When a spec is about how the project is run — CI configuration, GitHub workflow, agent conventions, documentation
      standards, or spec authoring rules — the spec MUST be classified as `process`.
    rationale: >-
      Rules about how the project is run apply only to the maintainers and agents of
      this repository. The behavior of an implementation does not depend on them. When
      this question comes first, these rules stay out of `project`, so `project` holds
      only constraints on the codebase. The rules also stay out of the protocol and
      conformance views that implementers read. Each kind has its own verification owner
      (MS-10-006), so a process rule in the wrong kind also goes into the wrong backlog.
    tags:
    - documentation
  - id: MS-12-002
    priority: MUST
    kind: process
    statement: >-
      A spec's kind MUST be decided by who must obey it. Naming a codebase construct,
      such as a file path, library, class, or Behavior Tree node, never decides it.
    rationale: >-
      Compare TCP and an operating system's socket API. An RFC fixes what two independent
      implementations exchange on the wire; how one implementation structures its internals (its
      endpoints, stores, compare-and-set loops) is not RFC content, however firm the MUST.
      Naming code is a symptom, not the test: a protocol rule
      spelled in this codebase's terms is reworded, and one that also says how this codebase
      meets it is split (MS-12-010). Neither is relabeled.
    verification: >-
      MS-12-006's spec-lint check enforces this rule where it is mechanical: a
      story-less protocol or foundation spec whose statement names a `.py` suffix, a `vultron/`, `test/`, or
      `scripts/` path, or `pytest`, `pydantic`, or `py_trees` is a hard error, and its message
      advises rewording or splitting and never relabeling (MS-12-015). Covered by
      `test/metadata/specs/test_lint.py::test_protocol_code_reference_message_advises_reword_or_split`.
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-012
    priority: MUST
    kind: process
    statement: >-
      When only this codebase must obey a spec, the spec MUST be classified as
      `project`. Such a spec is a deployment choice, a performance or operating
      limit, how a receiver records what it receives, or a core internal. One
      deployment choice is running the CASE_MANAGER as an actor separate from the
      case owner.
    rationale: >-
      A rule that only this codebase must obey binds no other implementation, so it
      stays out of the protocol view that implementers read. EP-02-004
      (compare-and-set on the policy PUT) is the worked example: only this codebase
      must obey it, so it is `project`.
    verification: >-
      Review: the reviewer applies the decision tree (MS-12-005) at spec review. The
      `project` branch is a classification judgement that no automated check
      inspects.
    relationships:
    - rel_type: depends_on
      spec_id: MS-12-005
      note: applies only when MS-12-001 did not already match
    - rel_type: uses_definition
      spec_id: MS-12-002
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      When every Vultron implementation, in any language or framework, must obey the spec to
      take part in the protocol, the spec MUST be classified as `protocol`. `protocol` is the
      Vultron layer: Vultron's message forms on the wire (including where ActivityStreams allows
      several forms and Vultron requires one), which messages are sent and when, what a receiver
      does given its state (including on duplicate delivery), and the state machines underlying
      those behaviors. Nothing else is `protocol`.
    rationale: >-
      The test is the TCP analogy: if the sentence could appear in an RFC for the protocol and an
      implementer in any language would have to honour it to interoperate, it is `protocol`.
      Behaviour that only changes how one implementation is built is not. State-machine states
      such as `RM.CLOSED` are protocol constructs. The CASE_MANAGER role and case-ledger sync are
      `protocol` for now; they are re-judged if the protocol moves to a federated design with no
      CASE_MANAGER (ADR-0134).
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: When none of the above apply — the spec is a structural or behavioral constraint that is implementation-independent
      but not required for Vultron compliance — the spec MUST be classified as `architecture`.
    rationale: >-
      The decision tree needs a last answer, so that each spec gets exactly one kind
      (MS-12-005). After the earlier questions, the remaining specs are recommended
      structure. Any implementation can adopt such a constraint, but compliance does not
      require it. The name `architecture` keeps these specs out of `protocol`, where
      implementers would read them as necessary to interoperate. It also keeps them out
      of `project`, where they would seem specific to this codebase.
    tags:
    - documentation
  - id: MS-12-005
    priority: MUST
    kind: process
    statement: >-
      An author MUST apply the decision tree in order (MS-12-001 → MS-12-012 →
      MS-12-009 → MS-12-003 → MS-12-004) and assign the kind of the first question
      that matches.
    rationale: >-
      Each question asks who must obey the rule, in this order: how the project is run, this
      codebase only, every implementation of a standard Vultron inherits, every Vultron
      implementation, and recommended structure. `foundation`
      precedes `protocol` so a rule that only restates ActivityStreams, ActivityPub or HTTP is not
      counted as Vultron's own.
    verification: >-
      MS-12-006's check names the split rule and the who-must-obey question rather than a
      replacement kind (MS-12-015), so its error message cannot route a spec around this
      ordering. Covered by
      `test/metadata/specs/test_lint.py::test_protocol_code_reference_message_advises_reword_or_split`.
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-013
    priority: MUST
    kind: process
    statement: >-
      Before an author applies the decision tree (MS-12-005), the author MUST split a
      spec that mixes kinds as MS-12-010 directs.
    rationale: >-
      A mixed spec would otherwise match `project` and hide its protocol half from
      implementers. Splitting first gives each half its own kind.
    verification: >-
      The MS-12-006 error message advises splitting the spec (MS-12-015), and
      `test_protocol_code_reference_message_advises_reword_or_split` in
      `test/metadata/specs/test_lint.py` checks it. Beyond that, the reviewer checks
      the split at spec review.
    relationships:
    - rel_type: extends
      spec_id: MS-12-005
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-006
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST emit a hard error for any `protocol` or `foundation` spec that
      carries no `stories:` back-reference and whose `statement` names an
      unambiguous codebase construct. Such a construct is a `.py` suffix, a
      `vultron/`, `test/`, or `scripts/` path, or the token `pytest`, `pydantic`, or
      `py_trees`.
    rationale: >-
      A MUST that nothing enforces gives a false signal. When only some specs obey it,
      readers think that no rule exists. Also, protocol-kind specs collect suppressions
      of the missing-story-reference check, and nobody corrects their kind. Two
      choices keep the check off specs that already comply. The check scans only specs
      with no stories. Its token list is narrow, so it does not match domain English.
      `notes/spec-authoring-rules.md` gives
      the derivation. The check scans only the `statement`. A `verification` field names
      the test that checks a rule, and a test file name there does not show if the rule
      is protocol content. The check also scans `foundation`. A foundation rule whose
      statement names code in this codebase also tells how this codebase obeys it, so it
      is a mixed spec to split (MS-12-010, ADR-0134).
    verification: >-
      `test_protocol_no_stories_code_reference_is_hard_error`,
      `test_foundation_no_stories_code_reference_is_hard_error` and
      `test_protocol_with_stories_and_code_reference_passes` in
      `test/metadata/specs/test_lint.py` cover the hard error and the story-bearing
      exemption, and
      `test_live_corpus_has_no_unsuppressed_protocol_kind_code_references` in
      `test/architecture/test_spec_kind_ratchet.py` asserts the live corpus has no
      unsuppressed violation.
    relationships:
    - rel_type: verifies
      spec_id: MS-12-002
    - rel_type: depends_on
      spec_id: SR-11-003
      note: shares the story-traceability population; the absence of stories gates both
    adr:
    - ADR-0038
    - ADR-0134
    tags:
    - documentation
    - tooling
  - id: MS-12-014
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST let a spec suppress the MS-12-006 check with the
      `protocol_kind_with_code_reference` lint_suppress code.
    rationale: >-
      A per-spec suppression is the escape hatch for a statement that names code on
      purpose. The code has the name `protocol_kind_with_code_reference`, but it also
      applies to `foundation`. Specs use that name, and a new name would break them.
      MS-12-008 holds the code at no carrier.
    verification: >-
      `test_protocol_code_reference_suppressed` in `test/metadata/specs/test_lint.py`
      checks that the code silences the error.
    relationships:
    - rel_type: extends
      spec_id: MS-12-006
    adr:
    - ADR-0038
    - ADR-0134
    tags:
    - documentation
    - tooling
  - id: MS-12-015
    priority: MUST
    kind: process
    statement: >-
      The MS-12-006 error message MUST advise rewording the statement so any
      implementation could obey it, or splitting the spec (MS-12-010), rather than
      relabeling it.
    rationale: >-
      A code reference never decides a kind (MS-12-002). A message that advised a
      new kind would route a spec around the decision tree, so the remedy is to
      reword or split the spec.
    verification: >-
      `test_protocol_code_reference_message_advises_reword_or_split` in
      `test/metadata/specs/test_lint.py` checks the message.
    relationships:
    - rel_type: extends
      spec_id: MS-12-006
    - rel_type: verifies
      spec_id: MS-12-005
      note: the error message advises reword or split rather than naming a single branch
    adr:
    - ADR-0134
    tags:
    - documentation
    - tooling
  - id: MS-12-007
    priority: MUST
    kind: process
    statement: >-
      A PR-only growth guard MUST fail each pull request that adds a
      `lint_suppress: [missing_story_reference]` carrier. A carrier is added when a
      spec carries the code at the PR head but not at the merge base with the base
      branch. This holds whether or not SR-11-003 would fire on it. The guard names
      each such spec.
    rationale: >-
      Suppression is the escape hatch SR-11-003 provides, so it cannot be forbidden,
      but an unguarded escape hatch is how the backlog accumulated. Every carrier
      counts, dead ones too; `spec-lint` prints the total. MS-12-008 closes the other
      code, so the two cannot trade places.
    verification: >-
      `test/architecture/test_spec_kind_ratchet.py::test_no_pr_adds_a_missing_story_suppression`
      fails on each spec that gained the code since the merge base, and
      `test/metadata/specs/test_growth_guard.py` exercises the guard on fixture repositories
      for an added and unchanged suppression, a relabel in and out, and the
      logged skip when no base ref is available.
    relationships:
    - rel_type: depends_on
      spec_id: SR-11-003
      note: guards the suppression escape hatch SR-11-003 provides against growth
    - rel_type: depends_on
      spec_id: SR-11-004
      note: the same suppression code silences this advisory, so dead suppressions are in scope
    adr:
    - ADR-0038
    tags:
    - documentation
    - tooling
  - id: MS-12-016
    priority: MUST_NOT
    kind: process
    statement: >-
      The MS-12-007 guard MUST NOT fail a pull request that removes a
      `missing_story_reference` suppression.
    rationale: >-
      Removing a suppression shrinks the backlog, which is the direction the guard
      exists to protect. A guard that failed on it would block the cleanup it asks
      for.
    verification: >-
      `test_suppression_removed_is_not_an_addition` and
      `test_suppression_relabel_out_is_not_an_addition` in
      `test/metadata/specs/test_growth_guard.py` check that a removed suppression,
      or one that leaves the guarded kind, adds nothing.
    relationships:
    - rel_type: extends
      spec_id: MS-12-007
    adr:
    - ADR-0038
    tags:
    - documentation
    - tooling
  - id: MS-12-017
    priority: MUST_NOT
    kind: process
    statement: >-
      The MS-12-007 guard MUST NOT compare against a committed count.
    rationale: >-
      Each carrier is recorded on its own spec, so the guard compares carrier sets
      and commits no number. A pinned count races concurrent PRs and a one-sided
      ceiling collects slack (`notes/testing-pitfalls.md`).
    verification: >-
      Inspection: `test_no_pr_adds_a_missing_story_suppression` in
      `test/architecture/test_spec_kind_ratchet.py` compares the carrier sets at the
      merge base and at the head, and the `test_suppression_*` tests in
      `test/metadata/specs/test_growth_guard.py` exercise that comparison with no
      count.
    relationships:
    - rel_type: extends
      spec_id: MS-12-007
    adr:
    - ADR-0038
    tags:
    - documentation
    - tooling
  - id: MS-12-008
    priority: MUST
    kind: process
    statement: >-
      A test MUST assert that no spec in the live corpus carries
      `lint_suppress: [protocol_kind_with_code_reference]`.
    rationale: >-
      MS-12-014 adds a second escape hatch next to the one MS-12-007 guards. If only
      one of the two is held, a pass can swap suppressions from the guarded code to
      the unguarded one: one total falls, the other grows, and every gate stays
      green. The code has never had a carrier, so it is held at that terminal value
      outright rather than by a growth guard; admitting a carrier means amending this
      requirement.
    verification: >-
      `test/architecture/test_spec_kind_ratchet.py::test_no_spec_carries_protocol_kind_with_code_reference`
      loads the live corpus and fails, naming each carrier, when any spec carries the code.
    relationships:
    - rel_type: refines
      spec_id: MS-12-007
      note: closes MS-12-006's suppression code alongside the code MS-12-007 guards
    - rel_type: depends_on
      spec_id: MS-12-014
      note: holds the suppression escape hatch MS-12-014 provides at no carrier
    adr:
    - ADR-0038
    tags:
    - documentation
    - tooling
  - id: MS-12-009
    priority: MUST
    kind: process
    statement: >-
      A spec MUST be classified as `foundation` when every implementation must obey
      it because Vultron inherits it from a standard beneath it. Those standards are
      ActivityStreams 2.0, ActivityPub, and HTTP.
    rationale: >-
      Addressing and delivery, HTTP status codes, and rules that only restate ActivityStreams
      (every `id` is an IRI) bind every implementation, but Vultron does not own them. Filing them
      as `protocol` inflates what Vultron defines; filing them as `project` hides them from
      implementers, who read `protocol` and `foundation` together. Where Vultron
      requires one form among several the standard allows, the rule is Vultron's own
      and is `protocol`.
    verification: >-
      Review: the reviewer applies the decision tree (MS-12-005) at spec review. The
      classification is a judgement that no automated check inspects.
    relationships:
    - rel_type: depends_on
      spec_id: MS-12-005
      note: applies only when MS-12-001 and MS-12-012 did not already match
    adr:
    - ADR-0134
    tags:
    - documentation
    - tooling
  - id: MS-12-018
    priority: MUST
    kind: process
    statement: >-
      A `foundation` spec MUST carry the tag that names the standard it inherits
      from: `as2`, `activitypub`, or `http`.
    rationale: >-
      The tag lets a reader trace each rule to the standard that owns it.
    verification: >-
      `test_foundation_with_standard_tag_passes`,
      `test_foundation_standard_tag_inherited_from_file_passes` and
      `test_foundation_spec_tags_replace_file_standard_tag` in
      `test/metadata/specs/test_lint.py` check which tags spec-lint accepts, on the
      spec or its file, and spec-lint fails a spec with none (MS-12-019).
    relationships:
    - rel_type: extends
      spec_id: MS-12-009
    adr:
    - ADR-0134
    tags:
    - documentation
    - tooling
  - id: MS-12-019
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST emit a hard error for a `foundation` spec whose effective tags
      name none of the three standards.
    rationale: >-
      A tag rule that nothing checks is obeyed only by some specs. A hard error
      keeps every `foundation` spec traceable to its standard.
    verification: >-
      `test_foundation_without_standard_tag_is_hard_error` in
      `test/metadata/specs/test_lint.py` fails a `foundation` spec with no standard
      tag.
    relationships:
    - rel_type: verifies
      spec_id: MS-12-018
    adr:
    - ADR-0134
    tags:
    - documentation
    - tooling
  - id: MS-12-010
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      An author MUST split a spec that mixes kinds along what other participants can
      observe.
    rationale: >-
      A mixed spec gives one kind to two kinds of rule, so one half lands in the
      wrong view. What other participants can observe is the line between the
      protocol half and the half that only this codebase must obey. Worked example:
      default-embargo creation. The protocol half says other participants never
      observe the intermediate Proposed state; the project half says this codebase
      applies PROPOSE and ACCEPT atomically in one behavior tree node.
    relationships:
    - rel_type: refines
      spec_id: MS-12-013
      note: states how the split that comes before the decision tree is made
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-020
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      In that split, the original ID MUST keep the half that states what is emitted
      or observed, reworded so any implementation could obey it.
    rationale: >-
      Keeping the original ID on the protocol half keeps its user stories, test markers and
      citations where implementers look, so the PR-only growth guards (SR-05-005, MS-12-007) see
      no new uncovered protocol spec and no new suppression.
    relationships:
    - rel_type: refines
      spec_id: MS-12-010
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-021
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      In that split, the half that states how this codebase does it MUST move to a
      new `project` ID whose `relationships:` name the original ID.
    rationale: >-
      The codebase half binds no other implementation, so it leaves the protocol
      view. The link to the original ID lets a reader find the protocol rule that
      this codebase meets.
    relationships:
    - rel_type: refines
      spec_id: MS-12-010
    adr:
    - ADR-0134
    tags:
    - documentation
  - id: MS-12-011
    priority: MUST
    kind: process
    statement: >-
      Changing a spec's kind MUST NOT remove the tests or `@pytest.mark.spec` markers that already
      verify it, whatever the destination kind. A spec relabeled from `protocol` to `project`, for
      example, keeps its tests and markers even though `project` does not require them.
    rationale: >-
      A test that verifies a rule is evidence the rule holds, and a kind change does not change
      whether it holds. Dropping markers on a relabel would turn a re-judgement sweep into a way
      to shed coverage, and a later relabel back would find the tests gone.
    verification: >-
      `test/architecture/test_spec_coverage_ratchet.py::test_no_pr_drops_a_marker_while_changing_a_kind`
      fails a pull request in which an ID whose kind differs from the merge base has lost every
      marker it had there, and `test/metadata/specs/test_growth_guard.py` exercises it on fixture
      repositories: a relabel that drops its marker, one that keeps it, a marker dropped with no
      relabel, a relabel of an unmarked spec, a retired spec, and the skip with no base. A test
      deleted while another test still marks the spec is not detected; that part is checked in
      review.
    relationships:
    - rel_type: refines
      spec_id: MS-12-005
      note: constrains how the kind the decision tree assigns is applied
    adr:
    - ADR-0134
    tags:
    - documentation
    - tooling
- id: MS-13
  title: Spec Item Format Selection (StatementSpec vs BehavioralSpec)
  specs:
  - id: MS-13-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item MUST use BehavioralSpec format (with preconditions, steps[], and
      postconditions fields) when it describes a sequential, stateful process that has a
      defined start state, ordered actions, and terminal conditions.
    rationale: >-
      StatementSpec statement text is a single normative sentence. Encoding ordered
      sub-steps as numbered lists inside that sentence violates MS-05-001 (no inline
      prose explanations) and makes the start state, step ordering, and terminal
      conditions invisible to conformance tooling.
    tags:
    - documentation
    adr:
    - ADR-0101
  - id: MS-13-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item MUST use StatementSpec format when it expresses a capability
      constraint, behavioral property, or structural rule that does not depend on
      step ordering — i.e., it specifies a required outcome or invariant, not a
      prescribed sequence of actions.
    rationale: >-
      BehavioralSpec's steps[] field implies ordering that is not meaningful for
      property requirements; StatementSpec is simpler and more appropriate.
    tags:
    - documentation
    adr:
    - ADR-0101
  - id: MS-13-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec group whose items describe a demo scenario workflow MUST include a
      trigger field with type: scenario_start to indicate to conformance tooling that
      the group is a process workflow, not a property group.
    rationale: >-
      The trigger field allows tooling to classify groups by activation kind without
      parsing item content. scenario_start distinguishes demo-script-triggered
      workflows from message_received and state_entered behavioral groups.
    tags:
    - documentation
  - id: MS-13-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec group with trigger type scenario_start MUST contain at least one
      BehavioralSpec item with a non-empty steps field describing the ordered
      protocol exchange.
    rationale: >-
      Mixed groups are permitted. Terminal-state assertions and infrastructure
      constraints can stay StatementSpec items. But the sequential workflow must be a
      BehavioralSpec, so that conformance tooling and CI can verify the ECA structure
      without parsing prose. spec-lint enforces the rule (SR-04-003): a group with only
      StatementSpec items is a hard error.
    tags:
    - documentation
- id: MS-14
  title: ADR Status as Confidence Signal
  specs:
  - id: MS-14-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Every ADR under docs/adr/ (excluding the template and index) MUST declare
      a non-empty status field whose value is a member of the AdrStatus StrEnum
      (proposed, accepted, accepted-provisional, deprecated, rejected,
      superseded); the inline MADR form "superseded by <link>" is accepted and
      normalised to superseded.
    rationale: >-
      The status field is the primary confidence signal that reaches coding
      agents (deepen-context weights ADR trust by it). A blank or non-standard
      status leaves agents to treat an unvalidated decision as settled fact.
      ADR-0024 shipped with a blank status; this rule prevents recurrence.
      AdrStatus is the fixed vocabulary (SR-02-002) the linter typechecks
      against. Enforced by spec-lint. See ADR-0043 and notes/specs-vs-adrs.md.
    relationships:
    - rel_type: derives_from
      spec_id: MS-11-004
      note: extends ADR/spec cross-referencing with a status-confidence rule
    adr:
    - ADR-0043
    - ADR-0024
    tags:
    - documentation
    - tooling
  - id: MS-14-002
    priority: SHOULD
    kind: process
    statement: An ADR's status value SHOULD agree with its prose.
    rationale: >-
      A status/prose contradiction is a landmine: the agent trusts status:
      accepted while the body admits the design is unvalidated. ADR-0025 was the
      motivating case.
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0025
    - ADR-0043
  - id: MS-14-013
    priority: SHOULD
    kind: process
    statement: >-
      Provisional markers include `formed in sand`, `not concrete`, `provisional`,
      `forward-looking`, `will converge`, `SHOULD refine this ADR` and
      `status will advance`. An ADR whose body holds one SHOULD declare
      `accepted-provisional` or `proposed` as its status, not `accepted`.
    rationale: >-
      spec-lint emits an advisory warning (not a hard error)
      because the substring scan can false-positive on ADRs that merely discuss
      provisional-ness; flagged ADRs are decision-audit candidates for human
      adjudication. An ADR that legitimately discusses provisional-ness (e.g.
      ADR-0043, which defines the vocabulary) MAY opt out with frontmatter
      'lint_suppress: [status_prose_contradiction]', mirroring the spec-level
      lint_suppress mechanism (SR-02-011).
    relationships:
    - rel_type: refines
      spec_id: MS-14-002
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0025
    - ADR-0043
  - id: MS-14-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      An ADR's placement in docs/adr/index.md (Accepted / Proposed / Rejected /
      Superseded-Archived sections) MUST agree with its own status field.
    rationale: >-
      Index-vs-frontmatter drift (ADR-0027 was listed provisional in the index
      while its file said accepted) misleads both humans and the agents that
      read the index.
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0027
  - id: MS-14-014
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      docs/adr/index.md MUST list a retired ADR (status deprecated or superseded)
      under the Superseded / Archived section, with a forward link to its
      replacement, not under Accepted.
    rationale: >-
      A retired ADR listed under Accepted reads as a live decision. The forward link
      takes a reader from the retired decision to the one that replaced it.
    relationships:
    - rel_type: refines
      spec_id: MS-14-003
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0027
  - id: MS-14-004
    priority: SHOULD
    kind: process
    statement: >-
      A newly-retired ADR (status deprecated or superseded) SHOULD be moved to
      docs/adr/archived/ so it stays out of the default docs/adr/ context sweep.
    rationale: >-
      Archiving retired ADRs keeps outdated decisions out of the default
      docs/adr/ sweep so agents must deliberately seek them. See ADR-0043.
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0043
  - id: MS-14-015
    priority: MAY
    kind: process
    statement: >-
      An ADR retired before the archive convention of MS-14-004 MAY stay in
      `docs/adr/` until it is next touched.
    rationale: >-
      The convention applies forward (SHOULD, not a retroactive MUST) to avoid
      churn on already-superseded ADRs that are still referenced by path.
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0043
  - id: MS-14-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      ADR frontmatter MUST validate against the AdrFrontmatter Pydantic model
      (vultron/metadata/adr/schema.py). The loader
      (vultron/metadata/adr/loader.py) enforces it via pytest and pre-commit,
      mirroring the notes frontmatter registry (NF-03, NF-04).
    rationale: >-
      ADRs are the confidence signal agents trust as ground truth. A Pydantic model
      makes status typechecking real validation rather than string-scraping. See
      ADR-0043.
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-016
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A retired ADR MUST carry a superseded_by pointer that resolves to a real ADR
      file.
    rationale: >-
      A retired ADR with no pointer leaves a reader with no way to find the decision
      that replaced it, and a pointer to a missing file is the same dead end. The
      loader checks both, so a dangling target cannot merge.
    relationships:
    - rel_type: extends
      spec_id: MS-14-005
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      docs/adr/index.md MUST be generated from ADR frontmatter (uv run
      adr-index --write). CI (uv run adr-index --check) fails on drift.
    rationale: >-
      A hand-maintained index rots: an ADR can be filed under the wrong index
      section. Generating it makes that drift mechanically impossible to merge. See
      ADR-0043 and MS-14-003.
    adr:
    - ADR-0043
    - ADR-0027
    tags:
    - documentation
    - tooling
  - id: MS-14-017
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      An ADR, archived or not, MUST NOT be referenced in the mkdocs nav. Readers
      reach it through the generated index.
    rationale: >-
      Decision records are project working record, which stays out of the
      reader-facing nav (DF-11-003), and the generated index is their routing page
      (DF-11-006).
    relationships:
    - rel_type: extends
      spec_id: MS-14-006
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-018
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Each ADR, archived or not, MUST be matched by the not_in_nav patterns in
      mkdocs.yml.
    rationale: >-
      An ADR in neither the nav nor not_in_nav breaks mkdocs --strict on an
      omitted-file warning, so the check requires the pattern match too.
    relationships:
    - rel_type: extends
      spec_id: MS-14-006
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-007
    priority: MUST
    kind: process
    statement: >-
      An ADR's `status` MUST be at least the lifecycle epoch computed for it
      (ADR-0120). Epoch 1 (`proposed`) ends at the first of two events: day 14
      after `updated`, or a test-verified dependent (MS-14-010). A test-verified
      dependent is a spec requirement that cites the ADR in `adr:` and whose
      verification names a test file that exists. The dependent is counted in the
      tree being checked: the pull request's head for a check on a pull request,
      `main` for the scheduled check. Epoch 3 (`accepted`) starts at day 28 after
      `updated`. Between the two, the epoch is 2 (`accepted-provisional`).
    rationale: >-
      Elapsed time alone does not show that an ADR had its chance to be revised. The
      first dependent that a test verifies shows it, because the material test asks if
      something built on the old text would now be wrong. The timers are a backstop, so
      every ADR gets to `accepted`. Boundaries are counted in
      whole days (14 and 28), because `updated` is a date. The dependency is counted on
      the head of the pull request, because the pull request that creates the dependency
      must already show its effect (MS-14-010).
    verification: >-
      `test/metadata/test_adr_lifecycle.py` checks the 14- and 28-day boundaries, and
      that a test-verified dependent ends epoch 1 and is counted on the pull
      request's head.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-001
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-019
    priority: MUST
    kind: process
    statement: >-
      A pull request that materially edits an ADR MUST leave its status on the epoch
      for the new `updated` date. Only a `status_override:` whose value is a human's
      reason lets the status stay off that epoch. A material edit changes the ADR's
      `updated` date, or adds the ADR.
    rationale: >-
      A material edit restarts the ADR's timers, so the status that the edit leaves
      must match the restarted epoch. An override keeps a status off its epoch only
      as a visible human act.
    verification: >-
      `test_material_edit_must_leave_status_matching_the_epoch`,
      `test_material_edit_with_matching_status_is_clean`,
      `test_new_adr_with_a_status_off_its_epoch_is_refused`,
      `test_new_adr_with_a_dependent_must_be_provisional` and
      `test_material_edit_status_override_lets_disagreement_stand` in
      `test/metadata/test_adr_lifecycle.py` check that a material edit and a new ADR
      must match their epoch or carry an override.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-007
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-020
    priority: MUST
    kind: process
    statement: >-
      A check that compares a pull request against its base MUST fail a pull request
      that breaks MS-14-019.
    rationale: >-
      A rule on pull requests is only as strong as the gate that refuses a pull
      request that breaks it. Comparing against the base shows which ADRs the pull
      request materially edited.
    verification: >-
      `test_material_edit_must_leave_status_matching_the_epoch` and
      `test_main_exit_codes` in `test/metadata/test_adr_lifecycle.py` check the
      refusal, and `test_edit_check_runs_on_pull_requests_against_the_merge_base` in
      `test/ci/test_adr_lifecycle_workflows.py` checks that `adr-lifecycle.yml` runs
      the edit check against the merge base on pull requests.
    relationships:
    - rel_type: verifies
      spec_id: MS-14-019
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-021
    priority: MUST_NOT
    kind: process
    statement: >-
      A merge-blocking check MUST NOT depend on today's date for an ADR that the pull
      request did not materially edit.
    rationale: >-
      A merge-blocking check that reads the current date would make `main` fail when
      no commit causes the failure. The scheduled check reports the drift of the
      clock instead (MS-14-022, ARCH-18-004).
    verification: >-
      `test_untouched_updated_never_trips_the_epoch_rule` in
      `test/metadata/test_adr_lifecycle.py` checks that an edit leaving `updated`
      alone passes, and
      `test_lint_adr_status_disagreeing_with_epoch_is_not_a_lint_failure` in
      `test/metadata/specs/test_lint.py` checks that `spec-lint` does not fail a
      status the clock has made stale.
    relationships:
    - rel_type: constrains
      spec_id: MS-14-020
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-022
    priority: MUST
    kind: process
    statement: >-
      A scheduled check MUST report every ADR whose status is behind today's epoch,
      without failing the build. It reports through one tracking issue that closes
      itself when none remain.
    rationale: >-
      The clock moves an ADR's epoch with no commit, so a scheduled check, not a
      merge-blocking one, finds a status left behind. A report that fails no build
      keeps `main` green while it shows the drift.
    verification: >-
      `test_epoch_drift_lists_every_stale_status_without_overrides` and
      `test_drift_report_credits_dependent_only_when_it_decided_the_epoch` in
      `test/metadata/test_adr_lifecycle.py` check that the drift report lists an ADR
      behind its epoch and not one ahead of it.
      `test_drift_report_reports_and_never_fails_the_build` and
      `test_drift_report_runs_at_least_hourly` in
      `test/ci/test_adr_lifecycle_workflows.py` check that `adr-status-drift.yml`
      reports at least hourly and never fails the build.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-007
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-008
    priority: MUST
    kind: process
    verification: >-
      `test_lifecycle_fields_are_required` in `test/metadata/test_adr_lifecycle.py`
      checks that the ADR schema rejects an ADR without the three fields.
    statement: >-
      ADR frontmatter MUST carry `created` (set once, never changed), `updated`
      (changed only by a material edit), and `revision` (an integer incremented by
      each material edit).
    rationale: >-
      The epochs of ADR-0120 are measured from `updated`, so it must move only when the decision
      changes; `date` was rewritten by editorial edits and cannot serve. `created` is the immutable
      birth date and `revision` counts how many times the decision has changed.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-005
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-023
    priority: MUST
    kind: process
    statement: >-
      Each ADR that predates the MS-14-008 fields MUST be migrated with `created` and
      `updated` set to its `date`, and `revision` set to 1.
    rationale: >-
      An ADR with no lifecycle fields has no epoch, so every check that reads one
      would fail on it. Setting both dates to the ADR's own `date` starts its epoch
      where its decision was made.
    verification: >-
      `test_all_adr_files_have_valid_frontmatter` in
      `test/metadata/test_adr_frontmatter.py` loads the real ADR registry, so an
      ADR that was not migrated fails.
    relationships:
    - rel_type: extends
      spec_id: MS-14-008
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-009
    priority: MUST
    kind: process
    statement: >-
      `adr-lifecycle-check` MUST fail a diff that changes the Decision Outcome or
      Considered Options section of an epoch-3 ADR without a dated Amendment block.
      It runs as a pre-commit check.
    rationale: >-
      ADR-0120 forbids rewriting an accepted ADR under its own number, and the audit that produced
      it found exactly that done by agents. The rule is only as strong as the gate that refuses the
      edit, and a reviewer reading a large diff does not reliably see a changed section. A heading
      that names "Amendment" and a date is the mechanical mark of a dated Amendment block.
    verification: >-
      `test/metadata/test_adr_lifecycle.py` checks each refused and each permitted
      edit of a decision section.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-007
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-024
    priority: MUST
    kind: process
    statement: >-
      `adr-lifecycle-check` MUST fail a diff that bumps `updated` on an ADR that was
      past epoch 1, unless the ADR carries a `status_override`.
    rationale: >-
      Bumping `updated` restarts the timers, which would move a settled ADR back to
      an editable epoch. The override makes that move a visible human act.
    verification: >-
      `test_bumping_updated_outside_epoch_one_needs_override`,
      `test_bumping_updated_with_override_is_allowed`,
      `test_bumping_updated_in_epoch_one_is_free` and
      `test_bumping_updated_on_a_tested_adr_needs_override` in
      `test/metadata/test_adr_lifecycle.py` check each case.
    relationships:
    - rel_type: extends
      spec_id: MS-14-009
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-025
    priority: MUST
    kind: process
    statement: >-
      `adr-lifecycle-check` MUST also run, against the merge base, on every pull
      request that changes an ADR, so a skipped local hook cannot bypass it.
    rationale: >-
      A pre-commit hook runs only where an author installed it, and an author can
      skip it. The same check in CI holds every pull request to the rule.
    verification: >-
      `test_edit_check_runs_on_pull_requests_against_the_merge_base` and
      `test_edit_check_has_the_history_it_needs_and_no_write_scope` in
      `test/ci/test_adr_lifecycle_workflows.py` check that the pull-request job runs
      it against the merge base.
    relationships:
    - rel_type: extends
      spec_id: MS-14-009
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-010
    priority: MUST
    kind: process
    statement: >-
      This rule covers a pull request after which an ADR that is `proposed` on its
      base first has a test-verified dependent (MS-14-007). Such a pull request MUST
      set that ADR's status to `accepted-provisional`. The rule holds however the
      dependent is created. A new requirement that cites the ADR creates one. So
      does `adr:` or a verification added to an existing requirement, or the test
      file that a verification names.
    rationale: >-
      The dependency ends epoch 1 (MS-14-007), but it lands in a spec and a test, usually in a
      pull request that never touches the ADR. The pull request that changed the facts owns the
      status, as a material edit already does; leaving the flip to the scheduled drift report would
      leave the ADR reading `proposed`, and free to rewrite, while code depends on it.
    verification: >-
      `test/metadata/test_adr_lifecycle.py` checks that the dependents are found, and
      that one adding a dependent of an ADR already past epoch 1 passes.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-007
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-026
    priority: MUST
    kind: process
    statement: >-
      The check that compares a pull request against its base MUST fail a pull
      request that breaks MS-14-010.
    rationale: >-
      Without a gate, the flip waits for the scheduled drift report, and the ADR
      stays free to rewrite while code depends on it. The check sees that the named
      test file exists, not that it passes.
    verification: >-
      `test_adding_a_requirement_that_tests_a_proposed_adr_needs_the_flip`,
      `test_editing_a_requirement_into_a_dependent_needs_the_flip`,
      `test_adding_the_named_test_file_needs_the_flip` and
      `test_main_fails_a_first_dependent_with_no_adr_path` in
      `test/metadata/test_adr_lifecycle.py` check the refusal for each way a
      dependent is created. `test_edit_check_runs_when_only_a_spec_or_test_changes`
      in `test/ci/test_adr_lifecycle_workflows.py` checks that the check runs when
      only a spec or a test changes.
    relationships:
    - rel_type: verifies
      spec_id: MS-14-010
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-011
    priority: MUST
    kind: project
    statement: >-
      ADR supersession links MUST be recorded in both directions. Each
      `superseded_by` or `partially_superseded_by` entry on an ADR is matched by a
      `supersedes` or `partially_supersedes` entry on the ADR it names. Each
      successor-side entry is matched by the reverse pointer on the ADR it names.
    rationale: >-
      When only the forward pointer is checked, the successor side becomes out of date.
      An agent that reads the successor must see what it replaced.
    verification: >-
      `test_all_adr_files_have_valid_frontmatter` in
      `test/metadata/test_adr_frontmatter.py` checks that the real ADR corpus loads
      with every pair matched, and `test/metadata/test_adr_index_gen.py` checks that
      the generated index shows the successor side.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-005
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-027
    priority: MUST
    kind: project
    statement: >-
      Each of the four supersession fields MUST accept a list of ADRs as well as a
      single ADR.
    rationale: >-
      A successor can retire several ADRs, and a single-value field cannot record
      that.
    verification: >-
      `TestSupersessionFieldsAreLists` in `test/metadata/test_adr_frontmatter.py`
      checks that each field accepts a single ADR or a list, and
      `test_list_valued_forward_pointers_are_joined` in
      `test/metadata/test_adr_index_gen.py` checks that the generated index joins
      list-valued pointers.
    relationships:
    - rel_type: extends
      spec_id: MS-14-011
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-028
    priority: MUST
    kind: project
    statement: >-
      The ADR loader MUST fail when a supersession pair is one-sided, comparing
      entries by ADR number whatever form the pointer is written in.
    rationale: >-
      A loader check in CI finds a one-sided link before it merges. Comparing by
      number keeps two forms of the same pointer from reading as a mismatch.
    verification: >-
      `TestTwoWaySupersession` in `test/metadata/test_adr_frontmatter.py` checks that
      the loader fails a one-sided pair in each direction and accepts a matched pair
      whatever pointer form either side uses.
    relationships:
    - rel_type: verifies
      spec_id: MS-14-011
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-012
    priority: MUST
    kind: process
    statement: >-
      An ADR's status MUST only move forward through the epochs. A status ahead of
      the computed epoch that the ADR already carried on the base stands. It is not
      a fault for the scheduled check, nor for a pull request that does not
      materially edit the ADR. A material edit that restarts the timers keeps it
      under the `status_override:` that MS-14-019 and MS-14-024 already require of
      that edit.
    rationale: >-
      ADR-0120 exists so that a citation keeps meaning what it meant. A change to the
      timers can make an ADR that is already `accepted` compute as
      `accepted-provisional`; demoting it would loosen the edit tiers on a decision
      agents had already built on. Treating the computed epoch as a floor covers any
      such change.
    verification: >-
      `test/metadata/test_adr_lifecycle.py` checks that a status ahead of its epoch
      carried on the base passes both the edit check and the drift report, and that
      a status moved back fails with or without an override.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-007
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-029
    priority: MUST
    kind: process
    statement: >-
      A pull request that moves `status` ahead of its computed epoch MUST add or
      change a `status_override:` whose value is a human's reason. An override
      already on the base does not satisfy this.
    rationale: >-
      The guard keeps a promotion ahead of the clock a visible human act rather than
      a silent frontmatter edit. An override left from an earlier, unrelated reason
      would make every later promotion silent again.
    verification: >-
      `test_promotion_ahead_of_the_epoch_needs_an_override`,
      `test_override_already_on_the_base_does_not_cover_a_promotion`,
      `test_promotion_with_an_added_or_changed_override_passes`,
      `test_promotion_onto_the_epoch_needs_no_override` and
      `test_a_retired_status_revived_ahead_of_its_epoch_needs_an_override` in
      `test/metadata/test_adr_lifecycle.py` check each case.
    relationships:
    - rel_type: extends
      spec_id: MS-14-012
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-030
    priority: MUST
    kind: process
    statement: >-
      The check that compares a pull request against its base MUST fail a pull
      request that breaks MS-14-029.
    rationale: >-
      A rule on pull requests is only as strong as the gate that refuses a pull
      request that breaks it.
    verification: >-
      `test_promotion_ahead_of_the_epoch_needs_an_override`,
      `test_override_already_on_the_base_does_not_cover_a_promotion` and
      `test_a_material_promotion_ahead_reports_both_faults` in
      `test/metadata/test_adr_lifecycle.py` check that the check fails the pull
      request.
    relationships:
    - rel_type: verifies
      spec_id: MS-14-029
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
- id: MS-15
  title: Spec Statements and ADR Edits Must Not Reference Phantom Paths or Phantom Symbols
  specs:
  - id: MS-15-001
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item's `statement`, `verification`, `behavioral step`, `precondition`,
      and `postcondition` fields MUST NOT reference a file path or directory path
      that does not exist.
    rationale: >-
      A normative statement naming non-existent infrastructure is a stale-premise
      landmine: the agent invents something inconsistent with the codebase or
      silently ignores a MUST. DEMOMA-19-008 named a `conftest.py` registry that
      had never existed; an audit found 18 phantom-path clauses. Behavioral step,
      precondition, and postcondition fields are scanned in addition to statement
      and verification because they are equally normative. `rationale` legitimately
      cites gone paths and is excluded.
    relationships:
    - rel_type: derives_from
      spec_id: MS-04-001
      note: extends spec-authoring rules with a path-existence guarantee
    tags:
    - documentation
    - tooling
  - id: MS-15-002
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item's `statement` and `verification` fields MUST NOT use an absolute
      path or a `..` segment.
    rationale: >-
      Absolute paths and parent-traversal segments are deployment-specific and will
      not resolve correctly in the repo-relative context used by spec-lint.
    relationships:
    - rel_type: refines
      spec_id: MS-15-001
    tags:
    - documentation
    - tooling
  - id: MS-15-003
    priority: MUST
    kind: process
    statement: >-
      A spec-first requirement that deliberately names a file yet to be created MUST
      either use a placeholder form (e.g. `test_XXX_invariants.py`) or opt out with
      `lint_suppress: [phantom_path_ref]`.
    rationale: >-
      The placeholder or lint_suppress mechanism makes the spec-first intent explicit
      rather than silently passing a phantom-path check by accident.
    verification: >-
      `test_lint_phantom_path_placeholder_exempt` and
      `test_lint_phantom_path_suppress` in `test/metadata/specs/test_lint.py` confirm
      both opt-out forms clear the hard error.
    relationships:
    - rel_type: refines
      spec_id: MS-15-001
    tags:
    - documentation
    - tooling
  - id: MS-15-004
    priority: MUST_NOT
    kind: process
    statement: >-
      A spec item's `statement`, `verification`, `behavioral step`, `precondition`,
      and `postcondition` fields MUST NOT reference a backticked all-caps code
      symbol containing at least one underscore that appears nowhere in the
      `vultron/` or `test/` Python sources.
    rationale: >-
      MS-15-001 examines only backticked tokens that contain a directory separator. Thus
      a bare symbol name passes it, and a retired symbol can stay in MUST-level protocol
      statements across many spec files. A MUST about a symbol that nobody can find is
      worse than no requirement. The agent either invents a replacement or ignores the
      obligation. The rule needs at least one underscore, so it excludes token shapes
      that are not symbols: RFC 2119 keywords, protocol shorthands and one-word state
      names. The check is textual and covers the whole tree, and it does not look up
      bindings. It accepts a false negative, so that it does not block a valid
      reference. The rule excludes `rationale`, as MS-15-001 does, because the problem
      that a rationale names (MS-10-012) can be a removed symbol that must not return.
    verification: >-
      `test_lint_phantom_symbol_is_hard_error` in `test/metadata/specs/test_lint.py`
      confirms a spec naming an absent symbol exits non-zero; the sibling
      `_existing_symbol_passes` and `_resolves_from_test_tree` cases confirm a live
      symbol in either tree is accepted.
    relationships:
    - rel_type: refines
      spec_id: MS-15-001
      note: extends the phantom-reference guarantee from paths to code symbols
    tags:
    - documentation
    - tooling
  - id: MS-15-005
    priority: MUST
    kind: process
    statement: >-
      A requirement that deliberately names a retired code symbol, or a convention
      token that was never code, MUST opt out with
      `lint_suppress: [phantom_symbol_ref]`.
    rationale: >-
      Two valid reasons exist to name a symbol that does not resolve. One reason is to
      record its removal, so that it does not return. The other reason is to name a
      proposed spec-authoring tag that is not an identifier (PROTO-04-001's
      `PROD_ONLY`). The explicit opt-out shows both as deliberate choices. Without it,
      they look the same as the stale MUSTs that MS-15-004 finds.
    verification: >-
      `test_lint_phantom_symbol_suppress` in `test/metadata/specs/test_lint.py`
      confirms the opt-out clears the hard error.
    relationships:
    - rel_type: refines
      spec_id: MS-15-004
    tags:
    - documentation
    - tooling
  - id: MS-15-006
    priority: MUST_NOT
    kind: process
    statement: >-
      A change that edits an ADR MUST NOT add to it a backticked file path,
      directory path or code symbol that resolves nowhere. Such a reference is a
      path missing from the repository, or a symbol found nowhere in the `vultron/`
      or `test/` Python sources. Recognized symbol shapes are underscored all-caps
      constants, CamelCase class names and called names such as `snake_case()`.
      Members of a CamelCase class, and all-caps members after a dot, are symbol
      shapes too. The rule covers only references the change adds to a record it
      edits. A reference present on the merge base, however stale, and a change that
      edits no ADR are outside it.
    rationale: >-
      ADR-0127 makes an ADR a historical record: a reference that aged after it
      was written is an accurate account of the code as it then stood, so a
      refactor owes the record nothing and no check keyed on code changes may
      fail on it. A reference newly written into a record is different — it
      should resolve on the day it is written, and that is a question about the
      change's own diff. The spec-corpus check of MS-15-004 reads only underscored
      constants, which misses the class and function names that make up the
      aged references in the corpus, so this check reads more shapes. It
      resolves textually, preferring a false negative to refusing a legitimate
      reference, as MS-15-004 does.
    verification: >-
      `test/metadata/test_adr_added_refs.py` checks that an added unresolvable
      reference fails at its position, that one present on the base or one that
      resolves passes, that a code change alone never fails it, and that each
      symbol shape the spec-corpus check misses is read.
    relationships:
    - rel_type: refines
      spec_id: MS-15-001
      note: extends the phantom-reference guarantee to references an edit adds to an ADR
    - rel_type: refines
      spec_id: MS-15-004
    adr:
    - ADR-0127
    tags:
    - documentation
    - tooling
  - id: MS-15-008
    priority: MUST
    kind: process
    statement: >-
      The pre-commit check `adr-added-reference-check` MUST enforce MS-15-006
      against `HEAD`.
    rationale: >-
      A hook at commit time finds an unresolvable reference while the author still
      has the edit open, which is the cheapest place to fix it.
    verification: >-
      `test_added_reference_check_runs_as_a_pre_commit_hook_on_adrs` in
      `test/ci/test_adr_lifecycle_workflows.py` checks that the pre-commit hook
      runs it on ADR files.
    relationships:
    - rel_type: verifies
      spec_id: MS-15-006
    adr:
    - ADR-0127
    tags:
    - documentation
    - tooling
  - id: MS-15-009
    priority: MUST
    kind: process
    statement: >-
      `adr-added-reference-check` MUST also run, against the merge base, on every
      pull request that changes an ADR, so a skipped local hook cannot bypass it.
    rationale: >-
      An author can skip a local hook. Comparing against the merge base is the
      shape MS-14-025 already uses, and it sees every reference the pull request
      adds.
    verification: >-
      `test_added_reference_check_runs_on_pull_requests_against_the_merge_base` in
      `test/ci/test_adr_lifecycle_workflows.py` checks that the pull-request job
      runs it against the merge base.
    relationships:
    - rel_type: verifies
      spec_id: MS-15-006
    adr:
    - ADR-0127
    tags:
    - documentation
    - tooling
  - id: MS-15-007
    priority: MUST
    kind: process
    statement: >-
      An ADR edit that deliberately adds a reference that does not resolve — a
      symbol or path the record annotates as removed, or a convention token that
      was never code — MUST opt the record out in its frontmatter with
      `lint_suppress: [phantom_symbol_ref]` for a symbol or
      `lint_suppress: [phantom_path_ref]` for a path. The opt-out covers the
      whole record: every later edit to it adds references of that kind
      unchecked.
    rationale: >-
      A decision record that notes a removal names the removed symbol or path because it
      is gone. Thus that reference can never resolve. The opt-out is the same as
      MS-15-005 for requirements. It shows the choice as deliberate, so that it does not
      look like a mistyped name.
    verification: >-
      `test_inline_removal_annotation_passes_with_the_opt_out` and
      `test_each_opt_out_covers_only_its_own_kind` in
      `test/metadata/test_adr_added_refs.py` confirm each opt-out clears its own
      kind of reference and no other.
    relationships:
    - rel_type: refines
      spec_id: MS-15-006
    adr:
    - ADR-0127
    tags:
    - documentation
    - tooling

- id: MS-16
  title: Long-Lived Docs Must Not State Unverifiable, Drift-Prone Facts
  specs:
  - id: MS-16-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec statement, notes file, or AGENTS.md entry MUST NOT restate a
      count that will drift independently of the authoritative source.
      When cross-referencing another spec item, omit the count and cite the
      source by ID: write "the universal types (DEMOMA-16-001)" not "the five
      universal types (DEMOMA-16-001)". Counts in enumerations that are the
      authoritative source (e.g. DEMOMA-16-001 itself listing its own members)
      are not subject to this rule.
    rationale: >-
      A count that a cross-reference restates drifts, and nobody sees it. When the
      authoritative requirement changes, its sibling references and the citations in
      other files do not change. The linter makes sure that a referenced spec ID
      resolves, but it does not examine the prose near the ID. A reader who sees the
      stale count first gets a false picture of the system. The count adds no normative
      force. "The universal types (DEMOMA-16-001)" is equally specific, because the ID
      points to the authoritative source. Without this rule, one change to an enumerated
      set can require an edit in each file that restates its size. The same principle
      applies to all long-lived documents, not only to spec cross-references. Notes
      files, AGENTS.md pitfall entries and architecture docs must not state counts such
      as "there are 4 unimplemented nodes" or "15 xfails". These snapshots will be wrong
      when a person reads them later. Decision-record bodies are out of scope, because a
      dated count in a record stays true on its date (ADR-0127).
    relationships:
    - rel_type: derives_from
      spec_id: MS-04-001
      note: extends spec-authoring rules with a count-drift prohibition
    tags:
    - documentation
    adr:
    - ADR-0127
  - id: MS-16-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A long-lived document MUST NOT state a fact that no automated check could
      falsify and that drifts independently of its source. A long-lived document is
      a spec, a notes file, AGENTS.md, or a `docs/` table that mirrors a code, spec,
      or config inventory. The governing test is "could a test fail on this
      sentence?" A restated count (MS-16-001) is one such fact. A per-item runtime
      outcome ("✅ passes"), a forecast ("resolved by #789"), or a free-prose claim
      copied from source are others.
    rationale: >-
      Nobody checks a fact that nothing can check, so it becomes wrong first. It also
      becomes a confident wrong answer, not a gap, and that costs more than no document.
      Counts (MS-16-001) are the most usual example. The question "could a test fail on
      this sentence?" finds the other examples. In a table that mixes the two, the
      columns derived from source stay correct, and the columns that no test holds
      become wrong.
      Decision-record bodies are out of scope, because readers read them as dated
      history (ADR-0127).
    relationships:
    - rel_type: derives_from
      spec_id: MS-16-001
      note: generalises the count-drift prohibition to any unverifiable, drift-prone fact
    tags:
    - documentation
    adr:
    - ADR-0127
  - id: MS-16-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Each fact that MS-16-002 forbids MUST either be made verifiable or be replaced
      by a pointer to where the live answer lives. A fact is made verifiable when it
      is derived from, or ratcheted against, its source.
    rationale: >-
      Deleting the fact alone leaves a reader with no answer, and keeping it
      unchecked leaves a wrong one. Before you decide that a column is unverifiable,
      find out if it combines two or more facts. A column that answers two questions
      cannot be verified as a unit, but each part can possibly come from its source.
      `notes/documentation-sweeps.md` gives the procedure for this check.
    relationships:
    - rel_type: extends
      spec_id: MS-16-002
    tags:
    - documentation
    adr:
    - ADR-0127
- id: MS-17
  title: Metadata Loader Failure Attribution
  description: >-
    Rules for how the file-walking loaders under `vultron/metadata/` report a file they
    cannot read. These loaders back the pre-commit hooks and the `spec-dump` / `spec-lint` /
    `append-history` / `adr-index` entry points, so their error output is the first thing an
    author sees after a bad edit.
  specs:
  - id: MS-17-001
    priority: MUST
    kind: project
    statement: >-
      A loader under `vultron/metadata/` that walks a set of files and validates each one MUST
      attribute every failure to the file that caused it, naming the repository-relative path
      and — when the underlying parser supplies a position — the line and column, in the form
      `path:line:col`. A message that reports only a position, or only a positional index into
      the parsed structure, does not satisfy this requirement.
    rationale: >-
      Each of these loaders reads a whole directory, so a position without a filename
      identifies nothing: the corpus under `specs/` alone spans dozens of files in which
      "line 404" is ambiguous. PyYAML compounds this, because a loader that hands it text
      rather than a named stream gets a mark reading `<unicode string>` — a position
      attributed to a source that does not exist on disk. The file name is knowledge only the
      loader holds, so only the loader can supply it.
    verification: >-
      A unit test corrupts one file in a temporary directory for each loader and asserts the
      raised error names that file, and that no `<unicode string>` marker survives in the
      message.
    tags:
    - tooling
  - id: MS-17-002
    priority: MUST_NOT
    kind: project
    statement: >-
      A YAML parse error or a schema-validation error MUST NOT escape such a loader
      as an unhandled traceback.
    rationale: >-
      A traceback replaces the tool's own error format, and no frame in it names the
      offending file. Which step raised also decides the output's shape: a parse fault
      escapes as a traceback and suppresses the loader's own reporting, while a
      validation fault is caught and rendered as the tool's error line.
    verification: >-
      `test_spec_lint_reports_a_syntax_fault_without_a_traceback` in
      `test/metadata/specs/test_registry_attribution.py` asserts that the linter's
      exit path prints its own error prefix rather than a traceback.
    tags:
    - tooling
  - id: MS-17-005
    priority: MUST
    kind: project
    statement: >-
      Such a loader MUST report both the parse fault and the model-validation fault
      of each file as a `ValueError`. That is the type these loaders already
      document raising.
    rationale: >-
      A YAML scanner error is not a `ValueError`, so a caller guarding
      `except (ValidationError, ValueError)` never sees it and the tool exits through a
      traceback instead of its own error format.
    verification: >-
      `test_documented_guard_catches_a_parse_failure` in
      `test/metadata/test_file_loading.py` and
      `test_loader_names_path_line_and_column_of_a_parse_error` in
      `test/metadata/test_msm_occasions.py` assert that a malformed file raises
      `ValueError` rather than a bare parser exception.
    relationships:
    - rel_type: implements
      spec_id: MS-17-002
    tags:
    - tooling
  - id: MS-17-003
    priority: MUST
    kind: project
    statement: >-
      The attribution required by MS-17-001, MS-17-002 and MS-17-005 MUST come from
      one shared helper in `vultron/metadata/file_loading.py`, not a copy per loader.
      Each loader that walks files routes both its parse step and its validation
      step through that helper.
    rationale: >-
      The same wrapper was written independently in the ADR loader and in the history entry
      loaders, in as many message shapes as there were copies, while the notes and spec
      loaders were left without one — so what an author sees depends on which directory they
      edited rather than on what they got wrong. A shared helper is also the only way an
      improvement reaches all of them: no hand-written copy read the parser's position mark, and
      the history CLI's copy reported no path at all.
    verification: >-
      A ratchet test asserts that no module under `vultron/metadata/` other than
      `file_loading.py` re-raises a caught exception as a path-prefixed `ValueError` — the
      shape every hand-written copy takes. Asserting instead that no module catches a
      YAML-specific exception would be vacuous: every copy catches bare `Exception`, so such a
      test passes with all of the duplication still in place.
    tags:
    - tooling
  - id: MS-17-004
    priority: MUST
    kind: project
    statement: >-
      An exception class raised by the shared helper to report loader failures MUST
      be a `ValueError` subclass defined within the tooling layer.
    rationale: >-
      `VultronError` derives from `Exception`, not `ValueError`, so a caller guarding
      `except (ValidationError, ValueError)` would miss an error of that hierarchy as
      it misses a scanner error. A `ValueError` subclass keeps the documented guard
      working.
    verification: >-
      A unit test asserts the helper's exception type is a `ValueError` subclass and that a
      caller guarding only `except (ValidationError, ValueError)` catches it.
    relationships:
    - rel_type: refines
      spec_id: MS-17-005
      note: fixes the concrete exception type that satisfies the ValueError requirement
    tags:
    - tooling
  - id: MS-17-006
    priority: MUST_NOT
    kind: project
    statement: >-
      Code under `vultron/metadata/` MUST NOT extend the `VultronError` hierarchy that
      EH-01-002 requires of protocol code.
    rationale: >-
      SR-03-009 makes the shared helper's exception the tooling layer's first custom
      exception class, which is what brings EH-01-002 into contact with it. Obeying
      EH-01-002 here would invert the loader contract of MS-17-004.
      `vultron/errors.py` is the protocol domain's; this is tooling.
    verification: >-
      `test_metadata_does_not_import_the_protocol_error_hierarchy` in
      `test/architecture/test_metadata_loader_attribution.py` asserts that no module
      under `vultron/metadata/` imports from `vultron/errors.py`.
    relationships:
    - rel_type: extends
      spec_id: MS-17-004
    tags:
    - tooling
- id: MS-18
  title: One Wire Form per Protocol Act
  description: >-
    How a requirement handles an act that ActivityStreams lets a sender express in more
    than one wire form, so that the reference implementation's habit never reads as a
    protocol rule and a receiver never pays for forms no sender needs.
  specs:
  - id: MS-18-001
    priority: MUST
    kind: process
    adr:
    - ADR-0137
    statement: >-
      When ActivityStreams allows more than one wire form for one protocol act, the
      `protocol` requirement for that act MUST name exactly one form. A form the
      protocol does not name is not a protocol message.
    rationale: >-
      A receiver that must accept all allowed forms pays for each form that any sender
      selects. When several forms are allowed, a reader sees only the choice of the
      reference implementation, so its habit looks like a protocol rule. When the other
      forms are deferred, they stay open for later design, and no receiver must accept
      them now.
    verification: >-
      Inspection: no two `protocol` requirements name different wire forms for the same
      act (for the case records, VAM-01-011 names the one attaching message).
    tags:
    - documentation
  - id: MS-18-003
    priority: MUST
    kind: process
    adr:
    - ADR-0137
    statement: >-
      Each other wire form considered for the act MUST be recorded as a deferred
      alternative in an open question. The question goes on the Open Questions page
      (`docs/topics/future_work/open_questions.md`).
    rationale: >-
      A deferred form stays open for later design, and the open question shows a
      reader that it was weighed. No receiver must accept it now.
    verification: >-
      Inspection: `docs/topics/future_work/_oq-create-then-add.md` lists the forms
      that the case-record requirement does not name.
    relationships:
    - rel_type: extends
      spec_id: MS-18-001
    tags:
    - documentation
  - id: MS-18-002
    priority: MUST_NOT
    kind: process
    statement: >-
      A requirement, a semantic registry occasion or a reader-facing page MUST NOT allow
      several wire forms for one protocol act and then record which of them this codebase
      sends; the choice is made once, in the `protocol` requirement (MS-18-001).
    rationale: >-
      A per-message marker of "allowed versus sent" makes each receiver accept forms
      that no implementation must send. It is also one more manual fact that drifts from
      the emitters (MS-16-002). When the protocol requirement makes the choice once, a
      receiver has one form to accept.
    verification: >-
      Inspection: `Occasion` in `vultron/semantic_registry/_occasion.py` has no field
      recording whether this codebase sends the occasion.
    relationships:
    - rel_type: refines
      spec_id: MS-18-001
      note: rules out the allow-several-then-mark-one alternative
    tags:
    - documentation
