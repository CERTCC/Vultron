id: MS
title: Meta-Specification Style Guide
description: Normative rules for authoring specification files in this project. Covers file structure, requirement format,
  IDs, writing rules, cross-references, lifecycle, quality criteria, and the delineation between spec files and ADRs.
scope:
- prototype
- production
tags:
- documentation
- tooling
groups:
- id: MS-01
  title: File Structure
  specs:
  - id: MS-01-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each spec file MUST focus on a single topic of concern and be largely independent of other spec files.
    rationale: Focused files are easier to navigate and maintain.
    tags:
    - documentation
  - id: MS-01-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirements MUST be grouped by category within each spec file; each group MUST address a single, cohesive
      area of concern.
    rationale: Grouping by category improves navigation and traceability.
    tags:
    - documentation
- id: MS-02
  title: Priority Levels
  specs:
  - id: MS-02-001
    priority: SHOULD
    kind: process
    statement: Requirement statements SHOULD include the applicable RFC 2119 strength keyword inline (e.g., 'The system MUST…')
      for human readability, in addition to the `priority:` field.
    rationale: The `priority:` field is the authoritative record of requirement strength; inline keywords aid readability
      but are advisory.
    tags:
    - documentation
  - id: MS-02-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: 'Each spec entry MUST have a `priority:` field whose value is one of the RFC 2119 vocabulary keywords: MUST,
      MUST NOT, SHOULD, SHOULD NOT, or MAY.'
    rationale: The `priority:` field is the machine-readable record of requirement strength. The Pydantic schema enum is the
      implementation of this normative requirement, not its source.
    tags:
    - documentation
  - id: MS-02-003
    priority: MUST
    kind: process
    statement: >-
      Any spec requirement, lint check, ratchet, or tool that selects requirements by
      priority MUST treat a negative keyword as the same tier as its positive: `MUST_NOT`
      with `MUST`, and `SHOULD_NOT` with `SHOULD`.
    rationale: >-
      RFC 2119 makes MUST NOT the same absolute strength as MUST, and SHOULD NOT the same
      strength as SHOULD; a prohibition is no less binding than an obligation. A gate that
      names only the positive keyword silently drops every prohibition. See
      `notes/spec-authoring-rules.md` for the gaps this left in the corpus.
    verification: >-
      Review: a spec requirement that selects by priority names the tier, or explicitly
      excludes the negative form and says why. Code gates are checked mechanically under
      MS-02-004.
    exceptions:
    - SR-11-003 stays MUST-only until every protocol MUST_NOT it would newly flag has
      been adjudicated (#3601) and given a user story (#2717); flipping it earlier needs
      new suppressions, which MS-12-007 forbids.
    relationships:
    - rel_type: refines
      spec_id: MS-02-002
    tags:
    - documentation
    - tooling
  - id: MS-02-004
    priority: MUST
    kind: process
    statement: >-
      Code that selects spec requirements by priority MUST obtain the MS-02-003 tiering
      from a single shared definition on `RFC2119Priority`, not by comparing against
      individual enum members.
    rationale: >-
      Selecting with `== RFC2119Priority.MUST` is easy to write and fails silently, and
      each hand-written member list (`backstop/_model.py` has one) re-decides which
      members count. One shared definition means the tiering is decided once. Display
      code that maps each member to a label is not a selection and is out of scope.
    verification: >-
      A unit test in `test/metadata/specs/` asserts the shared tier definition maps each
      of the five priorities to its tier. A static check fails if a priority-selecting
      comparison in `vultron/metadata/specs/` or `scripts/` tests equality or membership
      against individual `RFC2119Priority` members or priority strings instead of the
      shared definition. The SR-11-003 selector is allowlisted while the MS-02-003
      exception stands.
    relationships:
    - rel_type: refines
      spec_id: MS-02-003
    tags:
    - documentation
    - tooling
- id: MS-03
  title: Requirement Format
  specs:
  - id: MS-03-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each spec entry MUST contain exactly one normative statement; compound or multi-condition requirements MUST
      be split into separate entries.
    rationale: Atomic requirements are independently testable and traceable.
    tags:
    - documentation
  - id: MS-03-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Every requirement MUST have a unique ID.
    rationale: IDs enable stable cross-referencing.
    tags:
    - documentation
- id: MS-04
  title: Requirement IDs
  specs:
  - id: MS-04-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirement IDs MUST follow the format `PREFIX-NN-NNN` where PREFIX is the file-level prefix, NN is a two-digit
      group number, and NNN is a three-digit requirement number.
    rationale: Consistent format enables automated validation.
    tags:
    - documentation
  - id: MS-04-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirement IDs MUST be globally unique across all spec files.
    rationale: Uniqueness prevents ambiguous cross-references.
    tags:
    - documentation
    relationships:
    - rel_type: implements
      spec_id: SR-01-006
  - id: MS-04-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirement IDs MUST be stable; once assigned, an ID MUST NOT be renumbered.
    rationale: Stable IDs preserve traceability in git history.
    tags:
    - documentation
  - id: MS-04-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Superseded requirements MUST be removed entirely rather than left in place as deprecated.
    rationale: >-
      Deprecated-but-present requirements create confusion for agents and future
      implementers. The spec schema's `deprecated` and `superseded_by` fields are not a
      sanctioned lifecycle state; they are being retired, with the entries that use
      them, by #4166.
    tags:
    - documentation
    relationships:
    - rel_type: refines
      spec_id: MS-04-003
  - id: MS-04-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The group ID prefix of a spec ID MUST match the group it lives in (e.g., spec `HP-01-001` MUST live in group
      `HP-01`).
    rationale: Mismatched prefixes break navigability and cross-reference accuracy.
    tags:
    - documentation
    relationships:
    - rel_type: implements
      spec_id: SR-01-013
- id: MS-05
  title: Writing Rules
  specs:
  - id: MS-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirements MUST be concise; prose explanations MUST NOT appear inline in requirement statements.
    rationale: Concise statements reduce ambiguity.
    tags:
    - documentation
  - id: MS-05-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirements MUST be specific; vague terms such as 'appropriate' or 'robust' MUST NOT be used unless explicitly
      defined.
    rationale: Specificity makes requirements testable.
    tags:
    - documentation
  - id: MS-05-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirements MUST be testable; measurable acceptance criteria MUST be provided where applicable.
    rationale: Untestable requirements cannot be verified.
    tags:
    - documentation
  - id: MS-05-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Requirements MUST be declarative; they MUST state what the system must do, not how, unless the how is itself
      normative.
    rationale: Declarative requirements avoid constraining implementation unnecessarily.
    tags:
    - documentation
- id: MS-07
  title: Cross-References and Sources
  specs:
  - id: MS-07-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Cross-references between spec entries MUST use the `relationships:` list with a `rel_type` field (one of the
      defined vocabulary terms) and a `spec_id` field referencing the target requirement ID.
    rationale: Structured cross-references in the `relationships:` field enable automated graph analysis and linting of dangling
      references.
    tags:
    - documentation
  - id: MS-07-003
    priority: SHOULD
    kind: process
    statement: Cross-references SHOULD be placed in both source and target requirements using the corresponding inverse relationship
      for bidirectional traceability.
    rationale: Bidirectional links enable impact analysis from either end.
    tags:
    - documentation
  - id: MS-07-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Source attribution MUST appear only in the file header, not repeated on individual requirements.
    rationale: Per-requirement sources create maintenance overhead.
    tags:
    - documentation
- id: MS-08
  title: File Naming
  specs:
  - id: MS-08-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Spec files MUST use `kebab-case.yaml` naming; `specs/README.md` is the sole exception and MUST remain Markdown.
    rationale: Consistent naming enables glob patterns and automated tooling.
    tags:
    - documentation
    relationships:
    - rel_type: implements
      spec_id: SR-01-001
- id: MS-09
  title: Lifecycle of Requirements
  specs:
  - id: MS-09-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Superseded requirements MUST be removed from spec files rather than marked deprecated or left in place with
      an annotation.
    rationale: >-
      Deprecated-but-present requirements are agent noise and may cause incorrect
      behaviour. A spec states current understanding; git and the implementation history
      (MS-09-002) carry what it used to say. The spec schema's `deprecated` and
      `superseded_by` fields are not a sanctioned lifecycle state; they are being
      retired, with the entries that use them, by #4166.
    tags:
    - documentation
  - id: MS-09-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The removal of a requirement MUST be recorded in the implementation history so there is an audit trail.
    rationale: Audit trail preserves context for future maintainers.
    tags:
    - documentation
  - id: MS-09-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: A requirement ID MUST NOT be reused. Once an ID has been removed (MS-09-001), no later requirement, in any
      spec file, MAY carry it, and a rule that replaces a removed one MUST receive a new ID.
    rationale: >-
      Citations outlive requirements: code comments, tests, ADRs, PR bodies and history entries
      cite IDs. A reused ID silently re-points every one of those at a rule they never meant, and
      the reuse of CM-11-005 with the opposite force (found in the 2026-10-02 audit) did exactly
      that. A new ID costs nothing; a stale citation that still resolves is undetectable.
    relationships:
    - rel_type: refines
      spec_id: MS-09-001
    tags:
    - documentation
  - id: MS-09-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The text of every removed requirement MUST be preserved in an archive of retired requirements, one file per
      requirement ID, in a folder outside `specs/` (`plan/retired-specs/`, laid out like `plan/history/`), and loaders and
      agents reading the spec corpus MUST NOT load that folder.
    rationale: >-
      MS-09-001 keeps retired text out of the specs so it cannot be mistaken for current
      obligation, but git history is a poor place to look up what a cited ID used to say. One file
      per ID gives a citation something to resolve to without putting retired text into agent
      context. The archive tooling and the loader exclusion are tracked in #4197; until they
      land, files are written by hand.
    relationships:
    - rel_type: depends_on
      spec_id: MS-09-001
    - rel_type: depends_on
      spec_id: MS-09-002
    tags:
    - documentation
  - id: MS-09-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Cross-references to a removed requirement MUST be updated to point to the replacement requirement.
    rationale: Dangling cross-references break traceability.
    tags:
    - documentation
- id: MS-10
  title: Quality Criteria
  specs:
  - id: MS-10-001
    priority: SHOULD
    kind: process
    statement: Spec files SHOULD be scannable via priority-grouped layout.
    rationale: Priority grouping lets readers quickly find the most critical requirements.
    tags:
    - documentation
  - id: MS-10-002
    priority: SHOULD
    kind: process
    statement: Spec files SHOULD be traceable via stable IDs and bidirectional cross-references.
    rationale: Traceability supports change impact analysis.
    tags:
    - documentation
  - id: MS-10-003
    priority: MUST
    kind: process
    statement: >-
      Spec files MUST be testable with verifiable acceptance criteria per
      requirement; every `priority: MUST` or `priority: MUST_NOT` requirement MUST
      include a `verification:` field.
    rationale: >-
      Untestable specs cannot be reliably implemented; a MUST requirement with no
      verification field provides no contract for reviewers or agents. Upgraded
      from SHOULD to MUST (CONCERN-2382) to align with MS-05-003 and enable
      progressive linter enforcement. MUST_NOT is in scope per MS-02-003: a
      prohibition with nothing checking it is the same gap. See MS-10-005 through
      MS-10-008 for enforcement while the backlog is worked down.
    verification: >-
      `spec-lint` exits 1 on any MUST or MUST_NOT requirement that has neither a
      `verification:` field nor a `verification_debt:` marker; unit tests in
      `test/metadata/specs/test_verification.py` prove it for both keywords.
    relationships:
    - rel_type: refines
      spec_id: MS-05-003
    tags:
    - documentation
    - tooling
  - id: MS-10-005
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST report in its default output one summary line per kind that has an
      MS-10-006 owner entry or a `verification_debt:` marker, giving the number of
      `priority: MUST` or `priority: MUST_NOT` requirements of that kind that carry a
      marker, tallied by the issue each marker names. The line MUST be computed from the
      markers, not read from a committed count. spec-lint MUST list the marked IDs only
      when asked through an opt-in flag, and MUST NOT print one line per marked
      requirement by default.
    rationale: >-
      MS-05-003 and MS-10-003 require MUST and MUST_NOT requirements to carry measurable
      acceptance criteria. The original per-item [WARN] (CONCERN-2382) grew to more than a
      thousand lines, which made a newly introduced instance invisible. A per-kind count
      keeps the backlog legible and makes each backfill's progress visible. Computing it
      from the markers leaves no committed number for concurrent PRs to race on (#3984).
    verification: Unit tests in `test/metadata/specs/test_lint.py` assert that a fixture
      corpus with marked MUST and MUST_NOT items produces exactly one summary line per
      kind with the correct per-owner tally, no per-item lines by default, and the IDs
      when the opt-in flag is passed.
    relationships:
    - rel_type: implements
      spec_id: MS-05-003
    - rel_type: implements
      spec_id: MS-10-003
    - rel_type: depends_on
      spec_id: MS-10-006
    tags:
    - documentation
    - tooling
  - id: MS-10-006
    priority: MUST
    kind: process
    statement: >-
      Until it gains a `verification:` field, each `priority: MUST` or
      `priority: MUST_NOT` requirement MUST carry a `verification_debt:` marker naming,
      in `#N` form, the open issue that owns verifying it, and that issue MUST be listed
      as an owner of the requirement's kind in the one owner table under
      `vultron/metadata/specs/`. spec-lint MUST fail, one requirement at a time, on a
      MUST-tier requirement with neither field, on a requirement with both (a stale
      marker), on a marker below the MUST tier, and on a marker naming an issue that
      does not own its kind. A pull-request check MUST fail a pull request that closes
      an owner issue a marker or the owner table still names, and a scheduled check
      running at least hourly MUST report any marker or owner entry naming a closed
      issue through one tracking issue, without failing the build.
    rationale: >-
      A count pinned to the live value in both directions is correct on the PR that sets
      it and wrong on every other PR in flight: a sibling that moves the count by one is
      green alone and red once merged (#3984). A per-item rule has no shared number to
      race, and two PRs conflict only when they edit the same requirement. The marker
      gives every unverified requirement a tracked path to verification. An owner
      usually closes through the backfill PR that says `Closes #N`; failing that PR
      alone races nothing, and catches a backfill that claims to finish while leaving
      requirements unverified. An owner closed by hand is caused by no PR, so failing
      the build on it would turn every PR in flight red; it is reported instead
      (ARCH-18-004). The owner table holds issue references, never counts, so verifying
      a requirement never edits it.
    verification: >-
      Fixture-corpus tests in `test/metadata/specs/test_verification.py` prove each
      per-item failure fires (neither field, both fields, a below-tier marker, a
      wrong-kind owner), that a PR closing an owner still in use fails, and that a
      closed owner or a failed lookup is reported; a spec-corpus test there asserts the
      live corpus has no per-item failure.
      `test/ci/test_verification_debt_owner_check.py` asserts that
      `.github/workflows/verification-debt-owners.yml` fails a pull request through
      `--check-closing-pr`, and runs `--check-debt-owners` hourly and on push to `main`
      without failing the build.
    relationships:
    - rel_type: implements
      spec_id: MS-10-003
    - rel_type: refines
      spec_id: MS-02-003
    tags:
    - documentation
    - tooling
  - id: MS-10-007
    priority: MUST
    kind: process
    statement: >-
      When no `verification_debt:` marker names an owner issue, that issue MUST be removed
      from the MS-10-006 owner table, and a kind's entry MUST be removed with its last
      owner. spec-lint MUST report an owner that no marker names, and MUST treat a marker
      on any requirement of a kind with no owner entry as a hard error, so that an
      unverified MUST or MUST_NOT of that kind can only pass by gaining a `verification:`
      field.
    rationale: >-
      Zero is the only state a backlog cannot drift from, and only if nothing can raise it
      back. Removing a kind's entry makes the end state permanent: no marker of that kind
      is accepted, and an unmarked unverified requirement already fails under MS-10-006.
      An owner no marker names is reported rather than failed, because two PRs that each
      verify some of its last requirements are green alone and would turn `main` red
      merged (#3984); the PR that closes the owner issue fails until the entry is
      removed, which forces the removal. The growth guard (#4200) keeps markers from being added
      while an owner remains. The `protocol` tier is expected to finish first (#3612).
    verification: >-
      Unit tests in `test/metadata/specs/test_lint.py` and
      `test/metadata/specs/test_verification.py` assert that, for a kind with no owner
      entry, a marked MUST and a marked MUST_NOT each make lint exit 1, that verified
      items of that kind pass, and that an owner no marker names is reported.
    tracking_issue: '#3612'
    relationships:
    - rel_type: depends_on
      spec_id: MS-10-006
    - rel_type: implements
      spec_id: MS-10-003
    tags:
    - documentation
    - tooling
  - id: MS-10-008
    priority: MUST
    kind: process
    statement: >-
      A change that moves a `priority: MUST` or `priority: MUST_NOT` requirement carrying a
      `verification_debt:` marker from one kind to another MUST replace the marker with a
      `verification:` field in the same change.
    rationale: >-
      Each kind's backlog has its own owner. Re-pointing a relabelled requirement's marker
      at the destination kind's owner would add debt to a backlog that never took it on,
      which is the growth the marker exists to forbid.
    verification: >-
      spec-lint fails on a marker naming an issue that does not own its requirement's
      kind, so a relabel that keeps its old marker fails; a fixture test in
      `test/metadata/specs/test_verification.py` proves it. A relabel that re-points the
      marker at the destination kind's owner is a new marker for that owner, which the
      growth guard (#4200) rejects.
    relationships:
    - rel_type: refines
      spec_id: MS-10-006
    tags:
    - documentation
    - tooling
  - id: MS-10-009
    priority: MUST
    kind: process
    statement: >-
      A `verification:` clause MUST name a check that exists and that inspects the
      property its requirement's statement asserts. Naming a tool or test that merely
      runs near the property does not satisfy this requirement: a build, lint or
      type-check that never examines the artifact the statement constrains, or a test
      that does not exist, is not verification.
    rationale: >-
      A verification clause is a claim about the suite, and an unbacked one reads
      exactly like a backed one. DEMOCI-11-009 named `mkdocs build --strict` for links
      strict mode never sees; VM-01-004 described a test that did not exist (#2982);
      DR-03-002 had no clause and named the wrong component; MS-13-003 had no check and
      sat at half adoption (#3480); ADR-0099 graduated with two details unbuilt (#3888).
      MS-15-001 makes a path resolve, not a check examine. See
      `notes/spec-authoring-rules.md`.
    verification: >-
      Checked at spec review: for each new or changed `verification:` clause the
      reviewer asks whether the named check would fail if the requirement were violated,
      and reports a FAIL when it would not (`.agents/skills/pr-triage`). The existence
      of a named path is enforced by MS-15-001; the existence of a named test function
      is tracked by #4170.
    tracking_issue: '#4170'
    relationships:
    - rel_type: refines
      spec_id: MS-10-003
    - rel_type: depends_on
      spec_id: MS-15-001
    tags:
    - documentation
    - tooling
  - id: MS-10-004
    priority: SHOULD
    kind: process
    statement: Spec entries SHOULD require only `id`, `priority`, and `statement` to be complete; optional fields (`rationale`,
      `tags`, `relationships`) SHOULD be added only when they provide clear value, not by default.
    rationale: Requiring optional fields on every entry creates boilerplate that discourages keeping specs current.
    tags:
    - documentation
- id: MS-11
  title: Spec vs. ADR Delineation
  specs:
  - id: MS-11-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: A spec file MUST be used to capture testable requirements — what the system MUST, SHOULD, or MAY do — using
      RFC 2119 keywords. Specs define the intended behaviour of the system; they do not record the rationale for choosing one
      approach over another.
    rationale: Mixing decision rationale into spec files blurs the distinction between requirements and design history, making
      both harder to maintain and trace.
    tags:
    - documentation
  - id: MS-11-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: An Architecture Decision Record (ADR) MUST be created whenever a meaningful alternative was evaluated and
      rejected. The primary signal for an ADR is the presence of options considered and discarded — "we weighed X, Y, and Z
      and chose X because …"
    rationale: If no real fork existed, there is no decision to record. An ADR without evaluated alternatives is just prose
      documentation and belongs in notes/ instead.
    tags:
    - documentation
  - id: MS-11-003
    priority: SHOULD
    kind: process
    statement: When a significant architectural decision generates recurring testable requirements, both an ADR and a spec
      entry SHOULD be created. The ADR captures the why (context, options, consequences); the spec captures the what
      (requirements agents and reviewers must satisfy going forward).
    rationale: The two documents serve different audiences. The ADR is for human reviewers asking "why was this chosen?";
      the spec is for implementation agents asking "what must I do?". Collapsing them into one document serves neither well.
    tags:
    - documentation
  - id: MS-11-004
    priority: SHOULD
    kind: process
    statement: A spec entry that was motivated by an ADR-backed decision SHOULD reference the ADR in its rationale field.
      The corresponding ADR SHOULD list the generated spec IDs in its "More Information" section.
    rationale: Bidirectional cross-references make it possible to trace a requirement back to its decision rationale and
      forward from a decision to its testable consequences.
    tags:
    - documentation
  - id: MS-11-005
    priority: SHOULD
    kind: process
    statement: When the correct approach is uncontested and no alternative was seriously considered, a spec entry alone is
      sufficient. An ADR SHOULD NOT be created merely to document an obvious or unchallenged choice.
    rationale: Writing ADRs for trivial decisions adds noise to the decision log and devalues the records that capture
      genuine trade-offs.
    tags:
    - documentation
  - id: MS-11-006
    priority: SHOULD
    kind: process
    statement: When a decision is a one-time structural or process choice with no recurring testable requirements (e.g.,
      "use CalVer for project versioning", "pin CI actions to full commit SHAs"), an ADR alone is sufficient. A spec entry
      SHOULD NOT be created if there is no per-change requirement for agents to check.
    rationale: Not every decision produces enforceable requirements. Creating spec entries for binary one-time choices
      inflates the spec corpus without providing testable value.
    tags:
    - documentation
- id: MS-12
  title: SpecKind Classification Decision Tree
  description: Mechanical rules for assigning a `kind` value to a new or reclassified spec. Stop at the first matching
    question.
  specs:
  - id: MS-12-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: When a spec is about how the project is run — CI configuration, GitHub workflow, agent conventions, documentation
      standards, or spec authoring rules — the spec MUST be classified as `process`.
    tags:
    - documentation
  - id: MS-12-002
    priority: MUST
    kind: process
    statement: When a spec references a language construct, library, file path, class, function, module, or codebase-specific
      mechanism (py_trees, pydantic, `vultron/`, `.py`, pytest, Behavior Tree nodes, etc.), the spec MUST be classified
      as `project`. A spec about an internal endpoint or mechanism of this codebase is `project` even when it is phrased
      as a MUST on observable behaviour.
    rationale: >-
      Compare TCP and an operating system's socket API. An RFC fixes what two independent
      implementations exchange on the wire; how one implementation structures its internals (its
      endpoints, stores, compare-and-set loops) is not RFC content, however firm the MUST.
      EP-02-004 (compare-and-set on the policy PUT) is the worked example: it constrains an
      internal endpoint, so it is `project`, not `protocol`.
    verification: >-
      MS-12-006's spec-lint check enforces the unambiguous half of this rule — a spec of kind protocol
      carrying no story back-reference, whose text names a `.py` suffix, a `vultron/`, `test/`, or
      `scripts/` path, or `pytest`, `pydantic`, or `py_trees`, is a hard error. Covered by
      `test/metadata/specs/test_lint.py`.
    relationships:
    - rel_type: depends_on
      spec_id: MS-12-005
      note: applies only when MS-12-001 did not already match
    tags:
    - documentation
  - id: MS-12-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: When a spec describes a requirement that an independent implementer would need to satisfy to be considered
      Vultron-compliant regardless of language or framework (wire behaviour, state machine invariants, behavioral contracts,
      message semantics, protocol rules), the spec MUST be classified as `protocol`. `protocol` means RFC content, namely wire
      messages, the behaviours that lead to them, and state machines. Nothing else is `protocol`.
    rationale: >-
      The test is the TCP analogy: if the sentence could appear in an RFC for the protocol and an
      implementer in any language would have to honour it to interoperate, it is `protocol`.
      Behaviour that only changes how one implementation is built is not. Labelling internal
      mechanisms `protocol` inflates the compliance surface; the roughly ninety relabels
      made in #3944 are reverted by #3943 under this reading.
    tags:
    - documentation
  - id: MS-12-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: When none of the above apply — the spec is a structural or behavioral constraint that is implementation-independent
      but not required for Vultron compliance — the spec MUST be classified as `architecture`.
    tags:
    - documentation
  - id: MS-12-005
    priority: MUST
    kind: process
    statement: The decision tree MUST be applied in order (MS-12-001 → MS-12-002 → MS-12-003 → MS-12-004); a spec MUST
      be assigned the kind corresponding to the first matching question.
    rationale: The ordering ensures that process and project concerns (which immediately disqualify protocol or architecture)
      are checked before the compliance test, preventing misclassification.
    verification: MS-12-006's check defers to this ordering rather than naming a replacement kind, so its
      error message cannot prescribe `project` for a spec MS-12-001 claims for `process`. Covered by
      `test/metadata/specs/test_lint.py`.
    tags:
    - documentation
  - id: MS-12-006
    priority: MUST
    kind: process
    statement: >-
      spec-lint MUST emit a hard error for any spec with kind protocol that carries no
      `stories:` back-reference and whose `statement` text references
      an unambiguous codebase construct — a `.py` suffix, a `vultron/`, `test/`, or
      `scripts/` path, or the tokens `pytest`, `pydantic`, or `py_trees`. The check MUST
      be suppressible per-spec via the `protocol_kind_with_code_reference` lint_suppress
      code, and its message MUST direct the author to the MS-12-001 → MS-12-005 tree
      rather than naming a single replacement kind.
    rationale: >-
      MS-12-001 through MS-12-005 went unenforced until issue #2601, and the corpus accreted
      protocol-kind specs suppressing the missing-story-reference check instead of carrying a
      corrected kind. An unenforced MUST anti-advertises: partial adoption reads as "no rule
      here". Three choices keep it off already-compliant specs: story-less specs only, a token
      list narrow enough to exclude domain English, and the whole tree — not one branch — as
      the remedy. Derived in `notes/spec-authoring-rules.md`. Only the `statement` is scanned: a
      `verification` field names the test that checks a rule, and naming a test file there says
      nothing about whether the rule itself is protocol content.
    verification: Unit tests in `test/metadata/specs/test_lint.py` cover the hard error, the
      story-bearing exemption, and the suppression path, and `test/architecture/` holds a ratchet
      asserting the live corpus has no unsuppressed violation.
    relationships:
    - rel_type: verifies
      spec_id: MS-12-002
    - rel_type: verifies
      spec_id: MS-12-005
      note: the error message defers to the ordering rule rather than to a single branch
    - rel_type: depends_on
      spec_id: SR-11-003
      note: shares the story-traceability population; the absence of stories gates both
    adr:
    - ADR-0038
    tags:
    - documentation
    - tooling
  - id: MS-12-007
    priority: MUST
    kind: process
    statement: >-
      A ratchet test MUST assert that the number of specs carrying
      `lint_suppress: [missing_story_reference]` — whether or not SR-11-003 would fire on
      them — stays at or below a pinned ceiling, and that the ceiling is no higher than
      the live count, so that raising it to accommodate new suppressions fails the test.
    rationale: >-
      Suppression is the escape hatch SR-11-003 deliberately provides, so it cannot be
      forbidden outright — but an un-ratcheted escape hatch is how the corpus accumulated its
      backlog. A decreasing ceiling keeps the remaining suppressions visible as debt. It is
      asserted tight rather than merely sufficient because a test cannot otherwise notice its
      own constant being edited upward; slack is headroom the corpus regrows into. Counting
      every spec carrying the code surfaces dead suppressions too. The ceiling is down-only and
      is its own ceiling, separate from the one for any other suppression code: the
      `missing_story_reference` suppressions that remain after the kind reversal of #3943 are
      counted on their own so they cannot trade places with another code's count.
    verification: A ratchet test under `test/architecture/` fails both when the suppression count
      exceeds its pinned constant and when the constant exceeds the live count, mirroring
      `test/metadata/test_agents_md_size_ratchet.py::test_known_overage_ceilings_are_tight`.
    relationships:
    - rel_type: constrains
      spec_id: SR-11-003
      note: ratchets the suppression escape hatch SR-11-003 provides
    - rel_type: depends_on
      spec_id: SR-11-004
      note: the same suppression code silences this advisory, so dead suppressions are in scope
    adr:
    - ADR-0038
    tags:
    - documentation
    - tooling
  - id: MS-12-008
    priority: MUST
    kind: process
    statement: >-
      A ratchet test MUST hold the number of specs carrying
      `lint_suppress: [protocol_kind_with_code_reference]` to a pinned ceiling under the
      same two conditions MS-12-007 places on `missing_story_reference`: the live count
      stays at or below the ceiling, and the ceiling is no higher than the live count.
    rationale: >-
      MS-12-006 adds a second escape hatch next to the one MS-12-007 ratchets. If only one
      of the two is counted, a pass can swap suppressions from the counted code to the
      uncounted one: one total falls, the other grows, and every gate stays green.
    verification: The ratchet in `test/architecture/test_spec_kind_ratchet.py` asserts both
      conditions for `protocol_kind_with_code_reference` through the same parametrized tests
      that assert them for `missing_story_reference`.
    relationships:
    - rel_type: refines
      spec_id: MS-12-007
      note: applies MS-12-007's ceiling to MS-12-006's suppression code
    - rel_type: constrains
      spec_id: MS-12-006
      note: ratchets the suppression escape hatch MS-12-006 provides
    adr:
    - ADR-0038
    tags:
    - documentation
    - tooling
- id: MS-13
  title: Spec Item Format Selection (StatementSpec vs BehavioralSpec)
  specs:
  - id: MS-13-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item MUST use BehavioralSpec format (with preconditions, steps[], and
      postconditions fields) when it describes a sequential, stateful process that has a
      defined start state, ordered actions, and terminal conditions.
    rationale: >-
      StatementSpec statement text is a single normative sentence. Encoding ordered
      sub-steps as numbered lists inside that sentence violates MS-05-001 (no inline
      prose explanations) and makes the start state, step ordering, and terminal
      conditions invisible to conformance tooling.
    tags:
    - documentation
  - id: MS-13-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item MUST use StatementSpec format when it expresses a capability
      constraint, behavioral property, or structural rule that does not depend on
      step ordering — i.e., it specifies a required outcome or invariant, not a
      prescribed sequence of actions.
    rationale: >-
      BehavioralSpec's steps[] field implies ordering that is not meaningful for
      property requirements; StatementSpec is simpler and more appropriate.
    tags:
    - documentation
  - id: MS-13-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec group whose items describe a demo scenario workflow MUST include a
      trigger field with type: scenario_start to indicate to conformance tooling that
      the group is a process workflow, not a property group.
    rationale: >-
      The trigger field allows tooling to classify groups by activation kind without
      parsing item content. scenario_start distinguishes demo-script-triggered
      workflows from message_received and state_entered behavioral groups.
    tags:
    - documentation
  - id: MS-13-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec group with trigger type scenario_start MUST contain at least one
      BehavioralSpec item with a non-empty steps field describing the ordered
      protocol exchange.
    rationale: >-
      Mixed groups are permitted — terminal-state assertions and infrastructure
      constraints MAY remain StatementSpec — but the sequential workflow itself
      MUST be expressed as BehavioralSpec so that conformance tooling and CI can
      verify ECA structure without parsing prose. This requirement is enforced by
      spec-lint (SR-04-003); a group with only StatementSpec items causes a hard
      error. See CONCERN-1650 for the regression that prompted this rule.
    tags:
    - documentation
- id: MS-14
  title: ADR Status as Confidence Signal
  specs:
  - id: MS-14-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Every ADR under docs/adr/ (excluding the template and index) MUST declare
      a non-empty status field whose value is a member of the AdrStatus StrEnum
      (proposed, accepted, accepted-provisional, deprecated, rejected,
      superseded); the inline MADR form "superseded by <link>" is accepted and
      normalised to superseded.
    rationale: >-
      The status field is the primary confidence signal that reaches coding
      agents (deepen-context weights ADR trust by it). A blank or non-standard
      status leaves agents to treat an unvalidated decision as settled fact.
      ADR-0024 shipped with a blank status; this rule prevents recurrence.
      AdrStatus is the fixed vocabulary (SR-02-002) the linter typechecks
      against. Enforced by spec-lint. See ADR-0043 and notes/specs-vs-adrs.md.
    relationships:
    - rel_type: derives_from
      spec_id: MS-11-004
      note: extends ADR/spec cross-referencing with a status-confidence rule
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0024
  - id: MS-14-002
    priority: SHOULD
    kind: process
    statement: >-
      An ADR's status value SHOULD agree with its prose. An ADR whose body
      contains provisional markers (e.g. "formed in sand", "not concrete",
      "provisional", "forward-looking", "will converge", "SHOULD refine this
      ADR", "status will advance") SHOULD NOT declare status: accepted; it
      SHOULD use accepted-provisional or proposed.
    rationale: >-
      A status/prose contradiction is a landmine: the agent trusts status:
      accepted while the body admits the design is unvalidated. ADR-0025 was the
      motivating case. spec-lint emits an advisory warning (not a hard error)
      because the substring scan can false-positive on ADRs that merely discuss
      provisional-ness; flagged ADRs are decision-audit candidates for human
      adjudication. An ADR that legitimately discusses provisional-ness (e.g.
      ADR-0043, which defines the vocabulary) MAY opt out with frontmatter
      'lint_suppress: [status_prose_contradiction]', mirroring the spec-level
      lint_suppress mechanism (SR-02-011).
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0025
    - ADR-0043
  - id: MS-14-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      An ADR's placement in docs/adr/index.md (Accepted / Proposed / Rejected /
      Superseded-Archived sections) MUST agree with its own status field, and a
      retired ADR (status deprecated or superseded) MUST be listed under the
      Superseded / Archived section with a forward link to its replacement, not
      under Accepted.
    rationale: >-
      Index-vs-frontmatter drift (ADR-0027 was listed provisional in the index
      while its file said accepted) misleads both humans and the agents that
      read the index.
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0027
  - id: MS-14-004
    priority: SHOULD
    kind: process
    statement: >-
      A newly-retired ADR (status deprecated or superseded) SHOULD be moved to
      docs/adr/archived/ so it stays out of the default docs/adr/ context sweep;
      ADRs retired before this convention MAY remain in place until next touched.
    rationale: >-
      Archiving retired ADRs keeps outdated decisions out of the default
      docs/adr/ sweep so agents must deliberately seek them. Applied forward
      (SHOULD, not a retroactive MUST) to avoid churn on already-superseded
      ADRs that are still referenced by path. See ADR-0043.
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0043
  - id: MS-14-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      ADR frontmatter MUST validate against the AdrFrontmatter Pydantic model
      (vultron/metadata/adr/schema.py), and a retired ADR MUST carry a
      superseded_by pointer that resolves to a real ADR file. Enforced by the
      loader (vultron/metadata/adr/loader.py) via pytest and pre-commit,
      mirroring the notes frontmatter registry (NF-03, NF-04).
    rationale: >-
      ADRs are the confidence signal agents trust as ground truth, yet were the
      only structured-metadata artifact without a schema — validated only by
      regex bolt-ons in spec-lint. A Pydantic model makes status typechecking,
      the superseded_by-when-retired rule, and dangling-target detection real
      validation rather than string-scraping. See ADR-0043.
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
  - id: MS-14-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      docs/adr/index.md MUST be generated from ADR frontmatter (uv run
      adr-index --write), and an ADR, archived or not, MUST NOT be referenced in
      the mkdocs nav: each MUST instead be matched by the not_in_nav patterns in
      mkdocs.yml and reached through the index. CI (uv run adr-index --check)
      fails on drift.
    rationale: >-
      The index was a hand-maintained list that rotted: ADR-0027 was filed
      under the wrong index section. Generating it makes that drift
      mechanically impossible to merge. The nav rule was once the opposite,
      requiring every non-archived ADR in the nav, but decision records are
      project working record, which stays out of the reader-facing nav
      (DF-11-003), and the generated index is their routing page (DF-11-006).
      An ADR in neither the nav nor not_in_nav breaks mkdocs --strict on an
      omitted-file warning, so the check requires the pattern match too. See
      ADR-0043 and MS-14-003.
    adr:
    - ADR-0043
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0027
  - id: MS-14-007
    priority: MUST
    kind: process
    statement: >-
      An ADR's `status` MUST agree with the lifecycle epoch computed from its `updated` date
      (ADR-0120): `proposed` under 72 hours, `accepted-provisional` from 72 hours to day 10, and
      `accepted` from day 10 on. A human MAY override the computed value, and the override MUST be
      visible in the ADR's frontmatter.
    rationale: >-
      An ADR's status is the confidence signal agents read, and an unmaintained status drifts from
      how settled the decision really is. Computing the expected value from `updated` makes the
      drift mechanical to find; the override keeps a human's judgement (for example a merged
      dependent implementation hardening an ADR early) above the clock. The lint itself is #4196.
    verification_debt: '#2571'
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-001
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
  - id: MS-14-008
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      ADR frontmatter MUST carry `created` (set once, never changed), `updated` (changed only by a
      material edit), and `revision` (an integer incremented by each material edit). Existing ADRs
      MUST be migrated with `created = updated = date` and `revision = 1`.
    rationale: >-
      The epochs of ADR-0120 are measured from `updated`, so it must move only when the decision
      changes; `date` was rewritten by editorial edits and cannot serve. `created` is the immutable
      birth date and `revision` counts how many times the decision has changed.
    relationships:
    - rel_type: depends_on
      spec_id: MS-14-005
    adr:
    - ADR-0120
    tags:
    - documentation
    - tooling
- id: MS-15
  title: Spec Statements Must Not Reference Phantom Paths or Phantom Symbols
  specs:
  - id: MS-15-001
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item's `statement`, `verification`, `behavioral step`, `precondition`,
      and `postcondition` fields MUST NOT reference a file path or directory path
      that does not exist.
    rationale: >-
      A normative statement naming non-existent infrastructure is a stale-premise
      landmine: the agent invents something inconsistent with the codebase or
      silently ignores a MUST. DEMOMA-19-008 named a `conftest.py` registry that
      had never existed; an audit found 18 phantom-path clauses. Behavioral step,
      precondition, and postcondition fields are scanned in addition to statement
      and verification because they are equally normative. `rationale` legitimately
      cites gone paths and is excluded.
    relationships:
    - rel_type: derives_from
      spec_id: MS-04-001
      note: extends spec-authoring rules with a path-existence guarantee
    tags:
    - documentation
    - tooling
  - id: MS-15-002
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec item's `statement` and `verification` fields MUST NOT use an absolute
      path or a `..` segment.
    rationale: >-
      Absolute paths and parent-traversal segments are deployment-specific and will
      not resolve correctly in the repo-relative context used by spec-lint.
    relationships:
    - rel_type: refines
      spec_id: MS-15-001
    tags:
    - documentation
    - tooling
  - id: MS-15-003
    priority: MUST
    kind: process
    statement: >-
      A spec-first requirement that deliberately names a file yet to be created MUST
      either use a placeholder form (e.g. `test_XXX_invariants.py`) or opt out with
      `lint_suppress: [phantom_path_ref]`.
    rationale: >-
      The placeholder or lint_suppress mechanism makes the spec-first intent explicit
      rather than silently passing a phantom-path check by accident.
    verification: >-
      `test_lint_phantom_path_placeholder_exempt` and
      `test_lint_phantom_path_suppress` in `test/metadata/specs/test_lint.py` confirm
      both opt-out forms clear the hard error.
    relationships:
    - rel_type: refines
      spec_id: MS-15-001
    tags:
    - documentation
    - tooling
  - id: MS-15-004
    priority: MUST_NOT
    kind: process
    statement: >-
      A spec item's `statement`, `verification`, `behavioral step`, `precondition`,
      and `postcondition` fields MUST NOT reference a backticked all-caps code
      symbol containing at least one underscore that appears nowhere in the
      `vultron/` or `test/` Python sources.
    rationale: >-
      MS-15-001 only inspects backticked tokens containing a directory separator, so
      a bare symbol name passed it silently. That gap let the retired
      `SEMANTICS_ACTIVITY_PATTERNS` name survive across five spec files, eight of
      them MUST-level `kind: protocol` statements, from the registry move until
      issue #3022. A MUST about a symbol nobody can find is worse than an absent
      requirement: the agent either invents a replacement or drops the obligation.
      The single-underscore floor excludes the token shapes that are not symbols —
      RFC 2119 keywords, protocol shorthands, one-word state names. Resolution is
      textual and tree-wide rather than a binding lookup, preferring a false
      negative over blocking a legitimate reference. `rationale` narrates history
      and is excluded, as in MS-15-001.
    verification: >-
      `test_lint_phantom_symbol_is_hard_error` in `test/metadata/specs/test_lint.py`
      confirms a spec naming an absent symbol exits non-zero; the sibling
      `_existing_symbol_passes` and `_resolves_from_test_tree` cases confirm a live
      symbol in either tree is accepted.
    relationships:
    - rel_type: refines
      spec_id: MS-15-001
      note: extends the phantom-reference guarantee from paths to code symbols
    tags:
    - documentation
    - tooling
  - id: MS-15-005
    priority: MUST
    kind: process
    statement: >-
      A requirement that deliberately names a retired code symbol, or a convention
      token that was never code, MUST opt out with
      `lint_suppress: [phantom_symbol_ref]`.
    rationale: >-
      Two legitimate reasons to name a symbol that does not resolve: recording that
      it was removed (the retired SE-08-005 documented the removal of a semantic), and naming
      a proposed spec-authoring tag rather than an identifier (PROTO-04-001's
      `PROD_ONLY`). Requiring the explicit opt-out keeps both visible as deliberate
      choices instead of leaving them indistinguishable from the stale MUSTs
      MS-15-004 exists to catch.
    verification: >-
      `test_lint_phantom_symbol_suppress` in `test/metadata/specs/test_lint.py`
      confirms the opt-out clears the hard error.
    relationships:
    - rel_type: refines
      spec_id: MS-15-004
    tags:
    - documentation
    - tooling

- id: MS-16
  title: Long-Lived Docs Must Not State Unverifiable, Drift-Prone Facts
  specs:
  - id: MS-16-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec statement, notes file, or AGENTS.md entry MUST NOT restate a
      count that will drift independently of the authoritative source.
      When cross-referencing another spec item, omit the count and cite the
      source by ID: write "the universal types (DEMOMA-16-001)" not "the five
      universal types (DEMOMA-16-001)". Counts in enumerations that are the
      authoritative source (e.g. DEMOMA-16-001 itself listing its own members)
      are not subject to this rule.
    rationale: >-
      Counts restated in cross-references drift silently: when the authoritative
      requirement is updated, its sibling references and cross-file citations
      are not. The linter validates that a referenced spec ID resolves; it
      has no opinion about the prose next to it. A reader who encounters the
      stale count first gets a false picture of the system. The count adds no
      normative force — "the universal types (DEMOMA-16-001)" is equally
      specific because the ID is the authoritative pointer. This class of
      drift required 12 coordinated edits when `engage_case` was promoted
      to a fifth universal event type in ISSUE-2266 (CONCERN-2277).
      The same principle extends beyond spec cross-references to any
      long-lived document: notes files, AGENTS.md pitfall entries, and
      architecture docs MUST NOT state counts such as "there are 4
      unimplemented nodes" or "15 xfails" — these are snapshots guaranteed
      to be wrong when read in the future.
    relationships:
    - rel_type: derives_from
      spec_id: MS-04-001
      note: extends spec-authoring rules with a count-drift prohibition
    tags:
    - documentation
  - id: MS-16-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A long-lived document — a spec, a notes file, AGENTS.md, or a `docs/`
      table that mirrors a code, spec, or config inventory — MUST NOT state a
      fact that no automated check could falsify and that drifts independently
      of its source. The governing test is "could a test fail on this
      sentence?": a restated count (MS-16-001) is one instance; a per-item
      runtime outcome ("✅ passes"), a forecast ("resolved by #789"), or a
      free-prose claim copied from source are others. Each such fact MUST
      either be made verifiable — derived from, or ratcheted against, its
      source — or removed in favour of a pointer to where the live answer
      lives.
    rationale: >-
      A fact nothing can check is a fact nobody does check, so it rots first,
      and it rots into a confident wrong answer rather than into silence —
      which costs more than no doc at all. MS-16-001 caught the most common
      instance (counts); this entry generalises it from "is this a number?"
      to "could a test fail on this sentence?". Witnessed twice: the
      case-ledger invariant tables (ISSUE-3337), where the two columns no
      test could hold were 100% wrong while every source-derivable column
      stayed right; and the scenario table (the `fcvcv` and `vc` rows of
      `vultron/demo/scenario/README.md`, ISSUE-3450 / CONCERN-3466), where a
      free-prose column named four actors for a five-actor scenario. Before
      concluding a column is unverifiable, check whether it conflates more
      than one fact — a column answering two questions at once is unverifiable
      as a unit while each part may be individually derivable; the procedure
      for that triage lives in `notes/documentation-sweeps.md`.
    relationships:
    - rel_type: derives_from
      spec_id: MS-16-001
      note: generalises the count-drift prohibition to any unverifiable, drift-prone fact
    tags:
    - documentation
- id: MS-17
  title: Metadata Loader Failure Attribution
  description: >-
    Rules for how the file-walking loaders under `vultron/metadata/` report a file they
    cannot read. These loaders back the pre-commit hooks and the `spec-dump` / `spec-lint` /
    `append-history` / `adr-index` entry points, so their error output is the first thing an
    author sees after a bad edit.
  specs:
  - id: MS-17-001
    priority: MUST
    kind: project
    statement: >-
      A loader under `vultron/metadata/` that walks a set of files and validates each one MUST
      attribute every failure to the file that caused it, naming the repository-relative path
      and — when the underlying parser supplies a position — the line and column, in the form
      `path:line:col`. A message that reports only a position, or only a positional index into
      the parsed structure, does not satisfy this requirement.
    rationale: >-
      Each of these loaders reads a whole directory, so a position without a filename
      identifies nothing: the corpus under `specs/` alone spans dozens of files in which
      "line 404" is ambiguous. PyYAML compounds this, because a loader that hands it text
      rather than a named stream gets a mark reading `<unicode string>` — a position
      attributed to a source that does not exist on disk. The file name is knowledge only the
      loader holds, so only the loader can supply it.
    verification: >-
      A unit test corrupts one file in a temporary directory for each loader and asserts the
      raised error names that file, and that no `<unicode string>` marker survives in the
      message.
    tags:
    - tooling
  - id: MS-17-002
    priority: MUST_NOT
    kind: project
    statement: >-
      A YAML parse error or a schema-validation error MUST NOT escape such a loader as an
      unhandled traceback. Both the parse and the model validation of each file MUST be
      reported as a `ValueError`, the type these loaders already document raising.
    rationale: >-
      A YAML scanner error is not a `ValueError`, so a caller guarding
      `except (ValidationError, ValueError)` never sees it and the tool exits through a
      traceback instead of its own error format, in which no frame names the offending file.
      Which step raised also decides the output's shape: a parse fault escapes as a traceback and
      suppresses the loader's own reporting, while a validation fault is caught and rendered as
      the tool's error line.
    verification: >-
      A unit test asserts that a malformed file raises `ValueError` from each loader rather
      than a bare parser exception, and that the linter's exit path prints its own error
      prefix rather than a traceback.
    tags:
    - tooling
  - id: MS-17-003
    priority: MUST
    kind: project
    statement: >-
      The attribution required by MS-17-001 and MS-17-002 MUST be obtained from a single
      shared helper in `vultron/metadata/file_loading.py`, not reimplemented per loader.
      A loader that walks files MUST route both its parse step and its validation step
      through that helper.
    rationale: >-
      The same wrapper was written independently in the ADR loader and in the history entry
      loaders, in as many message shapes as there were copies, while the notes and spec
      loaders were left without one — so what an author sees depends on which directory they
      edited rather than on what they got wrong. A shared helper is also the only way an
      improvement reaches all of them: no hand-written copy read the parser's position mark, and
      the history CLI's copy reported no path at all.
    verification: >-
      A ratchet test asserts that no module under `vultron/metadata/` other than
      `file_loading.py` re-raises a caught exception as a path-prefixed `ValueError` — the
      shape every hand-written copy takes. Asserting instead that no module catches a
      YAML-specific exception would be vacuous: every copy catches bare `Exception`, so such a
      test passes with all of the duplication still in place.
    tags:
    - tooling
  - id: MS-17-004
    priority: MUST
    kind: project
    statement: >-
      An exception class raised by the shared helper to report loader failures MUST be a
      `ValueError` subclass defined within the tooling layer. The `VultronError` hierarchy
      required by EH-01-002 governs protocol code and MUST NOT be extended into
      `vultron/metadata/`.
    rationale: >-
      SR-03-009 makes this the tooling layer's first custom exception class, which is what brings
      EH-01-002 into contact with it — today's loaders raise the built-in `ValueError`, so that
      rule has never applied here. Obeying it now would invert the contract: `VultronError`
      derives from `Exception`, not `ValueError`, so a caller guarding
      `except (ValidationError, ValueError)` would miss the new error as it misses today's
      scanner error. `vultron/errors.py` is the protocol domain's; this is tooling.
    verification: >-
      A unit test asserts the helper's exception type is a `ValueError` subclass and that a
      caller guarding only `except (ValidationError, ValueError)` catches it. A ratchet test
      asserts that no module under `vultron/metadata/` imports from `vultron/errors.py`.
    relationships:
    - rel_type: refines
      spec_id: MS-17-002
      note: fixes the concrete exception type that satisfies the ValueError requirement
    tags:
    - tooling
