id: HTTP
title: HTTP Protocol Requirements
description: HTTP protocol requirements for the Vultron API, covering status codes, headers, and content negotiation.
version: 1.0.0
scope:
- prototype
- production
tags:
- wire-format
groups:
- id: HTTP-01
  title: Content-Type Validation
  specs:
  - id: HTTP-01-001
    priority: MUST
    kind: protocol
    statement: Inbox endpoint MUST accept `application/activity+json` Content-Type
    verification: 'Integration tests confirm that `POST /inbox/` with `Content-Type: application/activity+json` is
      accepted and returns a 2xx response.'
    lint_suppress:
    - missing_story_reference
  - id: HTTP-01-002
    priority: MUST
    kind: protocol
    statement: Inbox endpoint MUST accept `application/ld+json; profile="https://www.w3.org/ns/activitystreams"` Content-Type
    verification: >-
      Integration tests confirm that `POST /inbox/` with `Content-Type: application/ld+json;
      profile="https://www.w3.org/ns/activitystreams"` is accepted and returns a 2xx response.
    lint_suppress:
    - missing_story_reference
  - id: HTTP-01-003
    priority: MUST
    kind: protocol
    statement: Inbox endpoint MUST reject requests with invalid Content-Type using HTTP 415
    verification: Integration tests confirm that `POST /inbox/` with an unrecognized `Content-Type` header returns
      HTTP 415.
    lint_suppress:
    - missing_story_reference
- id: HTTP-02
  title: Request Size Limits
  specs:
  - id: HTTP-02-001
    priority: MUST
    kind: architecture
    statement: Inbox endpoint MUST reject requests exceeding 1 MB with HTTP 413
    scope:
    - production
- id: HTTP-03
  title: HTTP Status Codes
  specs:
  - id: HTTP-03-001
    priority: MUST
    kind: architecture
    statement: The API MUST return 200 OK for successful reads.
    rationale: Standard HTTP success code for GET and other read operations.
  - id: HTTP-03-002
    priority: MUST
    kind: architecture
    statement: The API MUST return 201 Created for successful resource creation.
    rationale: Standard HTTP success code for POST operations that create a new resource.
  - id: HTTP-03-003
    priority: MUST
    kind: architecture
    statement: The API MUST return 202 Accepted for queued processing.
    rationale: Indicates the request was accepted but processing is deferred to a background job.
  - id: HTTP-03-004
    priority: MUST
    kind: architecture
    statement: The API MUST return 400 Bad Request for malformed input.
    rationale: Signals that the client submitted a syntactically invalid request that cannot be parsed.
  - id: HTTP-03-005
    priority: MUST
    kind: architecture
    statement: The API MUST return 404 Not Found for missing resources.
    rationale: Indicates the requested resource does not exist in the system.
  - id: HTTP-03-006
    priority: MUST
    kind: architecture
    statement: The API MUST return 405 Method Not Allowed for unsupported methods.
    rationale: Informs the client that the HTTP method used is not supported on this endpoint.
  - id: HTTP-03-007
    priority: MUST
    kind: architecture
    statement: The API MUST return 413 Content Too Large for oversized payloads.
    rationale: Rejects requests exceeding the configured payload size limit (see HTTP-02-001).
  - id: HTTP-03-008
    priority: MUST
    kind: architecture
    statement: The API MUST return 415 Unsupported Media Type for invalid Content-Type.
    rationale: Rejects requests whose Content-Type header is not an accepted media type (see HTTP-01-003).
  - id: HTTP-03-009
    priority: MUST
    kind: architecture
    statement: The API MUST return 422 Unprocessable Entity for schema validation failures.
    rationale: Indicates the request was well-formed but failed semantic or schema validation.
  - id: HTTP-03-010
    priority: MUST
    kind: architecture
    statement: The API MUST return 429 Too Many Requests for rate-limit violations.
    rationale: Signals that the client has exceeded the permitted request rate and must back off.
  - id: HTTP-03-011
    priority: MUST
    kind: architecture
    statement: The API MUST return 503 Service Unavailable for transient errors.
    rationale: Indicates a temporary server-side failure; the client should retry after the Retry-After interval.
- id: HTTP-04
  title: Response Headers
  specs:
  - id: HTTP-04-001
    priority: MUST
    kind: protocol
    statement: 'Endpoints returning ActivityStreams objects MUST use `Content-Type: application/activity+json`. Endpoints
      returning non-AS2 JSON (e.g., health checks, error bodies) MUST use `Content-Type: application/json`.'
    rationale: The ActivityStreams 2.0 specification defines `application/activity+json` as the normative media type for AS2
      documents. Using plain `application/json` is ambiguous for federation clients that discover capabilities via Content-Type.
      The previous requirement (`application/json` for all responses) is superseded by this entry.
    verification: 'Integration test asserts that `GET /actors/{id}/profile` and `GET /cases/{id}` responses carry `Content-Type:
      application/activity+json`. Health-check response carries `Content-Type: application/json`.'
    lint_suppress:
    - missing_story_reference
- id: HTTP-05
  title: Correlation ID Propagation
  specs:
  - id: HTTP-05-001
    priority: SHOULD
    kind: architecture
    statement: API SHOULD accept `X-Correlation-ID` or `X-Request-ID` headers for request tracing
    scope:
    - production
  - id: HTTP-05-002
    priority: SHOULD
    kind: architecture
    statement: API SHOULD generate correlation ID from activity `id` field if header not provided
    scope:
    - production
- id: HTTP-06
  title: Request Timeout Handling
  specs:
  - id: HTTP-06-001
    priority: SHOULD
    kind: architecture
    statement: Inbox endpoints SHOULD respond with HTTP headers within 100ms
    rationale: Ensures responsive UX for ActivityPub federation
  - id: HTTP-06-002
    priority: SHOULD
    kind: architecture
    statement: Processing exceeding 100ms SHOULD return HTTP 202 and queue for background processing
  - id: HTTP-06-003
    priority: SHOULD
    kind: architecture
    statement: Timeout occurrences SHOULD be logged at WARNING level
    scope:
    - production
- id: HTTP-07
  title: Rate Limiting Headers
  specs:
  - id: HTTP-07-001
    priority: MAY
    kind: architecture
    statement: API MAY include `X-RateLimit-Limit` header (maximum requests per window)
    scope:
    - production
  - id: HTTP-07-002
    priority: MAY
    kind: architecture
    statement: API MAY include `X-RateLimit-Remaining` header (requests remaining)
    scope:
    - production
  - id: HTTP-07-003
    priority: MAY
    kind: architecture
    statement: API MAY include `X-RateLimit-Reset` header (UTC timestamp for window reset)
    scope:
    - production
  - id: HTTP-07-004
    priority: MUST
    kind: architecture
    statement: Transient error responses (HTTP 429, 503) MUST include a `Retry-After` header indicating when the client should
      retry
    scope:
    - production
- id: HTTP-08
  title: FastAPI Response Serialization
  specs:
  - id: HTTP-08-001
    priority: MUST
    kind: project
    statement: API responses MUST include all fields of the actual returned object type, not only fields declared on the annotated
      base class
- id: HTTP-09
  title: AS2 Response Class Convention
  rationale: 'FastAPI''s `response_model=` serves two purposes: OpenAPI schema generation and runtime response filtering.
    When a route returns a wire AS2 object (e.g., `as_VulnerabilityCase`), using `response_model=` for both purposes risks
    silently stripping subclass fields (HTTP-08-001 violation). The canonical fix is to separate the two concerns: use `response_model=`
    for OpenAPI docs only, and return an `AS2JSONResponse` instance for actual serialization (FastAPI skips response_model
    filtering when a `Response` subclass is returned directly).'
  specs:
  - id: HTTP-09-001
    priority: MUST
    kind: project
    statement: Wire vocabulary objects (`as_VulnerabilityCase`, `as_CaseParticipant`, etc.) are the canonical response type
      for Vultron HTTP endpoints — they define the AS2-formatted JSON shape returned to clients. No separate "response model"
      layer is needed; the wire model IS the response model.
    rationale: Vultron is an AS2-over-HTTP protocol. Every substantive response body is an ActivityStreams object. The wire
      vocabulary already defines the correct serialization shape (camelCase aliases, `@context`, `type`).
  - id: HTTP-09-002
    priority: MUST
    kind: project
    statement: FastAPI route handlers that return an AS2 object MUST return an `AS2JSONResponse` instance (defined in `vultron/adapters/driving/fastapi/responses.py`).
      They MUST NOT return a raw dict from `model_dump()`, a plain `JSONResponse`, or the wire model object directly. The
      `response_model=` decorator argument is used for OpenAPI schema generation only.
    rationale: 'Returning a `Response` subclass bypasses FastAPI''s `response_model` filtering while preserving its use for
      OpenAPI schema generation (per FastAPI docs). This eliminates the subtype-field-stripping bug (HTTP-08-001) and ensures
      consistent `Content-Type: application/activity+json` across all AS2 endpoints.'
    verification: Architecture test or grep confirms no route in `vultron/adapters/driving/fastapi/routers/` calls `model_dump()`
      and returns a plain dict instead of `AS2JSONResponse`.
  - id: HTTP-09-003
    priority: MUST
    kind: project
    statement: '`AS2JSONResponse` MUST serialize using `model_dump(mode="json", by_alias=True, exclude_none=True)` and set
      `Content-Type: application/activity+json`.'
    verification: 'Unit test confirms `AS2JSONResponse(as_VulnerabilityCase(...)).body` includes camelCase field names and
      the response headers contain `Content-Type: application/activity+json`.'
