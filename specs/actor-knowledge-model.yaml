id: AKM
title: Actor Knowledge Model
description: >-
  Defines the Actor Knowledge Model: a Vultron Actor's knowledge of the world is strictly
  bounded by the ActivityStreams 2.0 activities it has received. Actors must not assume
  recipients hold objects that were not explicitly included in prior activities; DataLayer
  access is private and non-shareable, and all inter-Actor communication occurs exclusively
  through the AS2 wire protocol.
scope:
- prototype
- production
tags:
- messaging
- protocol
- federation
groups:
- id: AKM-01
  title: DataLayer Isolation
  specs:
  - id: AKM-01-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Each Actor's DataLayer is private to that Actor and MUST NOT be accessible to any other
      Actor.
  - id: AKM-01-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Actors that are co-located on the same server or within the same process MUST still
      interact via the wire protocol and MUST NOT communicate via direct DataLayer access
      or in-process calls bypassing the inbox/outbox API.
- id: AKM-02
  title: Knowledge Boundaries
  specs:
  - id: AKM-02-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An Actor MUST NOT assume that a recipient has knowledge of any object that has not been
      explicitly included in a prior activity sent to that recipient.
    stories:
    - story_2022_053
  - id: AKM-02-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Actors MUST NOT use object references in place of full inline objects when the recipient
      cannot be expected to have the referenced object in its own DataLayer.
  - id: AKM-02-003
    priority: MUST
    kind: protocol
    statement: >-
      The `target` field is the one slot that MAY carry a reference to the case rather
      than the case inline, and only in two forms: the case URI, when the recipient
      already holds the case (a participant or the CASE_MANAGER being addressed about
      it, as in the full-case Invite of CM-11-010); or the case stub
      (`VulnerabilityCaseStub`, CM-11-013) the stub Invite sends to an actor that does
      not yet hold the case. A full case MUST NOT travel in `target`; the factory
      reduces one to its URI.
    verification: >-
      `test/adapters/driven/trigger_activity_adapter/test_sealed_body_audit.py` checks
      every trigger-port activity's `target`: a case there is a URI or an object of type
      `VulnerabilityCaseStub`. `test/wire/as2/factories/test_case_context.py` checks
      `case_target_ref` reduces a full case to its URI and leaves a stub and a URI
      alone.
    adr:
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_024
- id: AKM-03
  title: Outbound Activity Object Integrity
  specs:
  - id: AKM-03-001
    priority: MUST
    kind: protocol
    statement: >-
      Outbound initiating activities (Create, Offer, Invite, Announce, Add, Remove, Update,
      Join, Ignore, Leave) MUST carry the `object` field as a fully inline typed domain object.
    verification: Integration tests in `test/demo/` confirm that outbound initiating activities include a
      fully-serialized `object` field rather than a bare URI reference.
    stories:
    - story_2022_053
  - id: AKM-03-002
    priority: MUST
    kind: protocol
    statement: >-
      The outbox handler MUST enforce object integrity at delivery time as a last-resort runtime
      guard.
    verification: A unit test confirms that the outbox handler rejects an activity whose `object` field is a bare URI
      reference rather than a fully inline typed domain object.
    lint_suppress:
    - missing_story_reference
- id: AKM-04
  title: 'Future: Known-Object Tracking'
  specs:
  - id: AKM-04-001
    priority: MAY
    kind: protocol
    statement: >-
      A future implementation MAY track which objects have been shared with each participant
      (e.g., via `CaseLedgerEntry` hash-chain records) to avoid redundant full-object transmission.
    scope:
    - production
- id: AKM-05
  title: Actor Addressing and Discovery
  specs:
  - id: AKM-05-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The absence of a local `CoreActor` record for a peer MUST NOT prevent an actor from
      addressing an outbound activity to that peer. A deliverable http(s) URI is sufficient
      for addressing; having a fully resolved actor record is an enrichment concern (directory
      service), not a precondition for protocol participation.
  - id: AKM-05-002
    priority: SHOULD
    kind: architecture
    statement: >-
      When an actor is first named by URI and no local record exists, the implementation
      SHOULD attempt resolution via the injected `ActorDiscoveryCallOutBundle`
      (Retriever call-out, ADR-0024, ADR-0025) before minting a minimal record.
      A FAILURE result from the backend SHOULD produce an explicit WARNING rather than
      a silent default.
    scope:
    - production
