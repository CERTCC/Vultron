id: AKM
title: Actor Knowledge Model
description: >-
  Defines the Actor Knowledge Model: a Vultron Actor's knowledge of the world is strictly
  bounded by the ActivityStreams 2.0 activities it has received. Actors must not assume
  recipients hold objects that were not explicitly included in prior activities; DataLayer
  access is private and non-shareable, and all inter-Actor communication occurs exclusively
  through the AS2 wire protocol.
scope:
- prototype
- production
tags:
- messaging
- protocol
- federation
groups:
- id: AKM-01
  title: DataLayer Isolation
  specs:
  - id: AKM-01-001
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms each actor's DataLayer is constructed per actor and that no
      code path hands one actor's DataLayer instance to another actor's use cases or
      behavior trees.
    statement: >-
      Each Actor's DataLayer is private to that Actor and MUST NOT be accessible to any other
      Actor.
    rationale: >-
      If one actor could read another's DataLayer, it would act on case data it was
      never sent, so its knowledge would not be bounded by the activities it
      received (AKM-02-001), and co-located actors would behave differently from the
      same actors on separate servers. A private store also keeps one actor's embargoed
      case data from reaching another actor that shares the deployment.
  - id: AKM-01-002
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection confirms co-located actors exchange case traffic only through inbox
      POSTs and outbox delivery, with no direct read or write of a peer actor's
      DataLayer and no in-process call into a peer's use cases.
    statement: >-
      Actors that are co-located on the same server or within the same process MUST still
      exchange protocol messages through each other's inboxes, and MUST NOT communicate by
      reading or writing each other's local state or by calling into each other directly.
    rationale: >-
      A direct shortcut between co-located actors bypasses the inbox pipeline, so its
      exchanges skip validation, the addressee and entitlement gates, and the case
      ledger, and leave nothing a remote participant would receive. Delivery through
      inboxes makes co-location invisible to the protocol: the same actors behave the
      same whether or not they share a process.
- id: AKM-02
  title: Knowledge Boundaries
  specs:
  - id: AKM-02-001
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      An Actor MUST NOT assume that a recipient has knowledge of any object that has not been
      explicitly included in a prior activity sent to that recipient.
    rationale: >-
      A recipient holds only what it has been sent. An activity that relies on an object
      the recipient never received cannot be processed, or is processed against a guess,
      so a sender must reason from what it has actually delivered to that recipient.
    stories:
    - story_2022_053
  - id: AKM-02-002
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Satisfied in this codebase through AKM-02-004: inspection of the outbound activity
      factories confirms each embeds inline the objects a recipient cannot be expected to
      hold already, and uses a bare reference only for an object the recipient already
      has, such as the case it participates in.
    statement: >-
      Actors MUST NOT name an object the recipient cannot be expected to hold already by a
      reference the recipient cannot dereference (AKM-05-003, AKM-05-004). Such an object
      is carried inline, or by a reference the recipient can fetch.
    rationale: >-
      A reference the recipient can neither match to an object it holds nor fetch leaves
      it unable to read what the activity acts on, so it must refuse the activity or
      guess. Carrying such an object inline, or by a reference the recipient can fetch,
      keeps every activity processable by its addressee.
  - id: AKM-02-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry inline every object a recipient cannot be expected to hold
      already, and MUST use a bare reference only for an object the recipient already
      has, such as the case it participates in.
    rationale: >-
      How this codebase meets AKM-02-002; split from it so AKM-02-002 states only what
      other participants observe (MS-12-010). This codebase dereferences only the few
      references AKM-05-007 lists, so a reference to an object its recipient does not
      hold could not in general be resolved. Carrying the object inline instead is a
      shortcut of this prototype
      reference implementation, not a protocol rule.
    verification: >-
      `test/architecture/test_introduced_objects_inline.py` classifies every outbound
      activity factory: each one introducing an object refuses it as a bare id and
      carries it inline, and each one carrying an object the recipient already holds
      takes it through a parameter typed to refuse a bare id.
    relationships:
    - rel_type: implements
      spec_id: AKM-02-002
  - id: AKM-02-003
    priority: MUST
    kind: protocol
    statement: >-
      A case named in an activity's `target` MUST take one of two forms: the case URI,
      when the recipient already holds the case (a participant or the CASE_MANAGER being
      addressed about it, as in the full-case Invite of CM-11-010); or the case stub
      (`VulnerabilityCaseStub`, CM-11-013) the stub Invite sends to an actor that does
      not yet hold the case. A full case MUST NOT travel in `target`.
    rationale: >-
      A participant or CASE_MANAGER addressed about a case already holds it and needs
      only its URI, while an actor that does not yet hold the case needs only the stub
      to decide whether to join. A full case in `target` would either repeat what the
      recipient holds or hand case contents to an actor that has not joined.
    verification: >-
      `test/adapters/driven/trigger_activity_adapter/test_sealed_body_audit.py` checks
      every trigger-port activity's `target`: a case there is a URI or an object of type
      `VulnerabilityCaseStub`.
    adr:
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_024
  - id: AKM-02-005
    priority: MUST
    kind: project
    statement: >-
      This codebase's activity factories MUST reduce a full case given as `target` to its
      URI and leave a case stub or a URI unchanged. `target` is the one slot in which
      this codebase carries a case by reference rather than inline.
    rationale: >-
      How this codebase meets AKM-02-003; split from it so AKM-02-003 states only the
      forms other participants observe in `target` (MS-12-010). That every other slot
      carries the case inline follows from this codebase's inline-object shortcut
      (AKM-02-004, AKM-03-003), not from the protocol.
    verification: >-
      `test/wire/as2/factories/test_case_context.py` checks `case_target_ref` reduces a
      full case to its URI and leaves a stub and a URI alone.
    relationships:
    - rel_type: implements
      spec_id: AKM-02-003
  - id: AKM-02-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT record, or send in an activity, a value for a field of an object
      it did not author when it does not know that value. A field whose value it does
      not know MUST stay absent. A `published` or `updated` time read from its own
      clock, and an `inbox` or `outbox` derived from another actor's id, are such
      values.
    rationale: >-
      A receiver cannot tell an invented value from an asserted one, so it records the
      invention as the object's own claim, and the case ledger then carries it in its
      snapshots. A value read from the sender's clock also differs on every build, so a
      rebuild of one activity under the same id does not match the first build
      (OX-06-002).
    note: >-
      Delivery to an inbox address derived from a recipient's id, when no inbox is held,
      is addressing rather than a recorded or sent value (OX-12-009).
    verification: >-
      `test/wire/as2/factories/test_actor_references.py::test_an_actor_given_by_uri_carries_no_invented_field`
      builds each factory activity that names an actor given by URI, and
      `test/adapters/driven/trigger_activity_adapter/test_sealed_body_audit.py::test_a_role_delegate_given_by_uri_carries_no_invented_field`
      seals each role-delegation Offer and answer; both check the actor carries no
      `published`, `updated`, `inbox` or `outbox`. For records,
      `test/adapters/driving/fastapi/routers/test_actors.py::TestRegisterPeer::test_peer_record_holds_no_value_the_request_did_not_supply`
      checks a registered peer and
      `test/core/use_cases/triggers/test_actor_triggers.py::TestActorDiscoveryCallOut::test_minimal_peer_holds_no_value_nobody_asserted`
      checks a peer recorded from a URI hold none of those fields.
    adr:
    - ADR-0159
    stories:
    - story_2022_053
- id: AKM-03
  title: Outbound Activity Object Integrity
  specs:
  - id: AKM-03-001
    priority: MUST
    kind: protocol
    statement: >-
      Outbound initiating activities (Create, Offer, Invite, Announce, Add, Remove, Update,
      Join, Ignore, Leave) MUST carry, as their `object`, the domain object they act on,
      inline or by reference.
    rationale: >-
      A receiver identifies what an initiating activity does from its type together with
      the type of its `object`. Without the object it cannot select the use case or
      apply the change. Inline or by reference leaves the form to the implementation
      (AKM-05-003).
    verification: Integration tests in `test/demo/` confirm that outbound initiating activities carry the domain
      object they act on in their `object` field.
    stories:
    - story_2022_053
  - id: AKM-03-003
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the `object` of every outbound activity as a fully inline
      typed object, never as a bare URI reference or an `as_Link`. AKM-03-002 enforces
      this at delivery.
    rationale: >-
      How this codebase meets AKM-03-001 and MV-09-001; split from them so they state
      only what other participants observe (MS-12-010). A receiver of this codebase does
      not dereference (AKM-05-003), so it could not resolve a reference to learn the
      activity's semantic type. Carrying the object inline is a shortcut of this
      prototype reference implementation, not a protocol rule.
    note: >-
      The rule binds the activity's own `object`. An `Invite(EmbargoEvent)` nested as the
      object of an ER may name its terms by URI: the ER answers the Invite by id and type,
      both inline, and needs no terms (ADR-0123).
    verification: >-
      Integration tests in `test/demo/` confirm that outbound initiating activities
      include a fully serialized `object` field rather than a bare URI reference.
      `vultron/adapters/driving/fastapi/outbox_delivery.py` raises
      `VultronValidationError` when `object_` is a bare string URI rather than a typed
      object. `test/architecture/test_introduced_objects_inline.py` classifies every
      activity factory, and checks that each one introducing an object refuses it as a
      bare id and carries it inline, and that every example activity does the same.
    relationships:
    - rel_type: implements
      spec_id: AKM-03-001
    - rel_type: implements
      spec_id: MV-09-001
  - id: AKM-03-002
    priority: MUST
    kind: project
    statement: >-
      The outbox handler MUST enforce object integrity at delivery time as a last-resort runtime
      guard.
    rationale: >-
      The activity factories enforce inline objects at construction (AKM-03-003), but an
      activity built on another path could still reach the outbox with a bare URI.
      Checking at delivery keeps such an activity from reaching a receiver that cannot
      resolve it, and reports the defect at the sender instead of as a misrouted
      activity at the receiver.
    verification: A unit test confirms that the outbox handler rejects an activity whose `object` field is a bare URI
      reference rather than a fully inline typed domain object.
- id: AKM-04
  title: 'Future: Known-Object Tracking'
  specs:
  - id: AKM-04-001
    priority: MAY
    kind: project
    statement: >-
      A future implementation MAY track which objects have been shared with each participant
      (e.g., via `CaseLedgerEntry` hash-chain records) to avoid redundant full-object transmission.
    rationale: >-
      Carrying every object inline on every activity repeats data the recipient already
      holds, and messages grow with the case. Knowing what each participant has been
      sent would let a sender use a reference for those objects safely (AKM-02-002).
      Nothing depends on it, so it is a MAY.
    scope:
    - production
- id: AKM-05
  title: Actor Addressing and Discovery
  specs:
  - id: AKM-05-001
    priority: MUST_NOT
    kind: foundation
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py::TestSvcInviteActorToCaseUseCase::test_invite_proceeds_when_invitee_not_in_dl`
      confirms an invite is addressed to a peer with no local `CoreActor` record.
    statement: >-
      The absence of a local record of a peer actor MUST NOT prevent an actor from
      addressing an outbound activity to that peer. The peer's deliverable http(s) URI is
      sufficient for addressing; a fully resolved actor record is an enrichment (directory
      service), not a precondition for protocol participation.
    rationale: >-
      An actor often first learns of a peer only as a URI, for example in a
      recommendation or a report. If addressing required a local record, the actor could
      not invite or answer that peer until a directory had been consulted, which would
      make a directory service a precondition for taking part in a CVD case.
    tags:
    - activitypub
  - id: AKM-05-002
    priority: SHOULD
    kind: architecture
    statement: >-
      When an actor is first named by URI and no local record exists, the implementation
      SHOULD attempt resolution via the injected `ActorDiscoveryCallOutBundle`
      (Retriever call-out, ADR-0024, ADR-0025) before minting a minimal record.
      A FAILURE result from the backend SHOULD produce an explicit WARNING rather than
      a silent default.
    rationale: >-
      A discovery backend can supply a peer's inbox and profile, so a minimal record
      minted without asking it holds less than is available. A failed lookup that falls
      back silently looks like success, so operators would not learn that discovery is
      broken; the WARNING makes the degraded path visible.
    scope:
    - production
  - id: AKM-05-003
    priority: SHOULD
    kind: protocol
    statement: >-
      An implementation SHOULD support object dereference: fetching the full object named
      by a URI through an API call to the actor or service that holds it.
    rationale: >-
      Several rules let a sender name an object by reference instead of inlining it, and
      each is sound only where the receiver can resolve the reference. The CP-01-009
      by-reference `actor` form is one. A prototype may inline everything and resolve
      nothing, so the capability is a SHOULD there (AKM-05-004 makes it a MUST in
      production).
    scope:
    - prototype
    stories:
    - story_2022_014
    note: >-
      A refusal that stands in for dereference lapses where dereference exists. This
      codebase dereferences through the case host's object read (AKM-05-006) and the
      inbox's fetch-and-defer (AKM-05-007), so the bare-URI `actor` on
      `Create(CaseProposal)` is fetched (CP-01-010) and a replica fetches an embargo
      EMB-18-003 would otherwise refuse as unreadable; each is refused only when its
      fetch fails (AKM-05-008).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` delivers activities
      naming objects the receiver does not hold and checks each is fetched through an
      API call and the activity replayed with it, and
      `test/adapters/driven/test_http_object_fetch.py` checks the fetch is an HTTP `GET`
      to the object's holder.
  - id: AKM-05-004
    priority: MUST
    kind: protocol
    statement: >-
      A production implementation MUST support object dereference (AKM-05-003): given a URI
      it has not seen, it MUST be able to fetch the object through an API call.
    rationale: >-
      A production deployment exchanges cases with independently built implementations,
      which may name objects by reference instead of inline. Without dereference it
      cannot process such an activity, and the refusals that stand in for dereference
      (AKM-05-003) would block legitimate traffic.
    verification: >-
      A production deployment is given a URI it holds no record for and fetches the
      object it names through an API call; the fetch returns the typed object.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: AKM-05-003
    stories:
    - story_2022_014
  - id: AKM-05-006
    priority: MUST
    kind: project
    statement: >-
      This codebase's CASE_MANAGER MUST serve a case object, at `GET
      {actor}/cases/{case}/objects` with an `object_id` query parameter, to an
      active participant of the case (CM-10-004) that has not closed on it
      (CM-23-004). A case object is the case itself, an embargo in its register, a
      participant, status, report or note it lists, or an object whose `context`
      is the case. The `{case}` segment is the case's id, or its surrogate key
      when the id carries slashes. The surrogate key is the last segment of the
      id, and one that matches more than one case names none. The requester is the
      actor the request names in its `X-Vultron-Actor` header.
    rationale: >-
      A replica dereferences a case object from the actor that holds the canonical case
      (ADR-0107), and only an active participant is entitled to case content
      (CM-10-004). A participant's replica is not the case host, so only the
      CASE_MANAGER serves the read.
    note: >-
      The requester is not authenticated: the prototype trusts the header as its inbox
      trusts the actor an activity claims to be. Actor authentication (#509) replaces
      that trust.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_case_object_route.py` checks a
      participant gets an object the case names as an ActivityStreams document, and
      `test_a_case_id_with_slashes_is_named_by_its_surrogate_key` that a case whose id
      carries slashes is named by its surrogate key;
      `test/core/services/test_dereference.py` checks a removed participant and one
      that has closed (`test_a_participant_that_has_closed_is_refused`) are refused,
      that an object scoped to the case by its `context` is served, and that an actor
      other than the case's CASE_MANAGER serves nothing;
      `test/adapters/driven/test_sqlite_find_case.py::test_find_case_by_short_id_returns_none_when_ambiguous`
      checks a surrogate key
      that matches more than one case names none.
    relationships:
    - rel_type: implements
      spec_id: AKM-05-003
    - rel_type: depends_on
      spec_id: CM-10-004
    adr:
    - ADR-0107
  - id: AKM-05-009
    priority: MUST
    kind: project
    statement: >-
      This codebase's CASE_MANAGER MUST answer 403, 401 or 404 when it refuses the
      AKM-05-006 read. It answers 403 to a requester that is not an entitled
      participant, and 401 to a request naming no requester. It answers 404 for a
      case it does not manage, or an object the case does not name.
    rationale: >-
      A 404 for an object the case does not name, whether or not the host holds it,
      tells a participant nothing about cases it is not in. Distinct answers for a
      missing and a refused requester let the fetcher end at once on either (AKM-05-013).
    verification: >-
      `test/adapters/driving/fastapi/routers/test_case_object_route.py` checks that a
      non-participant, a request naming no requester, an object the case does not name
      and a case the host does not hold are answered 403, 401, 404 and 404.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-006
    adr:
    - ADR-0107
  - id: AKM-05-007
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST fetch an object it lacks, and needs to process a received
      activity, from the actor that holds it. A case's object is held by the
      case's CASE_MANAGER, and an actor's profile by that actor.
    rationale: >-
      A sender may name by reference an object its receiver is expected to hold
      (CLP-07-006, AKM-02-002), and a replica that lacks it, through a gap or a lag,
      would otherwise refuse or drop an activity that was sound.
    note: >-
      In this codebase a receiver fetches a case object for an activity no pattern
      matches because its `object` is a bare id it does not hold
      (`UNKNOWN_UNRESOLVABLE_OBJECT`), the embargo a replica's case names as active when
      an announced revision replaces it (EMB-18-007), and the proposer's profile a
      `Create(CaseProposal)` names by id (CP-01-014). A bare `object` matches no
      pattern that tests the object by its type (SE-01-006), so every activity whose
      `object` the receiver lacks is fetched for, except a `Read(CaseLedgerEntry)`
      position statement, which its `ledgerPosition` identifies. A bare reference in
      `target` or `context` is not fetched: it matches (SE-01-007), and its handler
      decides.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` delivers each such
      activity through the inbox run with a fake fetcher and checks it is fetched from
      the right actor; `test/core/services/test_dereference.py` checks a bare object a
      replica lacks is fetched from the case host and a proposer's profile from the
      proposer.
    relationships:
    - rel_type: implements
      spec_id: AKM-05-003
    - rel_type: refines
      spec_id: CLP-07-006
    adr:
    - ADR-0107
    stories:
    - story_2022_014
  - id: AKM-05-010
    priority: MUST
    kind: protocol
    statement: >-
      While a fetch under AKM-05-007 is open, the receiver MUST defer the
      activity, held as received. It does not process the activity without the
      object, and does not drop it.
    rationale: >-
      Deferring keeps the activity, as the inbox keeps one whose case is not yet known
      (PCR-06-001), so the activity is processed once, with the object, when the fetch
      settles.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` checks the activity is
      deferred and held while its fetch is open and replayed once the fetch settles;
      `test/core/behaviors/inbox/nodes/test_dereference_check_node.py` checks an
      activity waits while its fetch is open.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-007
    adr:
    - ADR-0107
    stories:
    - story_2022_014
  - id: AKM-05-011
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST NOT fetch an object from itself, or the entry an
      `Announce(CaseLedgerEntry)` carries.
    rationale: >-
      The CASE_MANAGER holds the canonical case, so nobody holds a case object it lacks.
      Replication carries its entries inline (SYNC-02-005), and replay needs no fetch.
    verification: >-
      `test/core/services/test_dereference.py` checks the CASE_MANAGER fetches nothing
      from itself and a ledger entry is never fetched.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-007
    adr:
    - ADR-0107
    stories:
    - story_2022_014
  - id: AKM-05-012
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST keep a fetched case object only when it holds no record under the
      object's id (MV-10-003).
    rationale: >-
      A fetch answers an object the receiver lacked; a record that arrived meanwhile is
      the receiver's own, and a fetched copy must not overwrite it (MV-10-003).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` checks the fetched case
      object is stored, and that a fetched object never replaces a record the receiver
      already holds; `test/core/services/test_dereference.py` checks a held object is
      not fetched again.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-007
    - rel_type: depends_on
      spec_id: MV-10-003
    adr:
    - ADR-0107
    stories:
    - story_2022_014
  - id: AKM-05-008
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST make at most `max_object_fetch_attempts` attempts to fetch one
      object (default 3), backing off exponentially between them, each bounded by
      `object_fetch_timeout_seconds` (default 30).
    rationale: >-
      A fetch that never succeeds must surface rather than hang (ADR-0107).
    verification: >-
      `test/adapters/driven/test_http_object_fetch.py` checks the retry cap and the
      backoff on a 5xx or network error, and `test/test_config.py` the defaults.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-007
    adr:
    - ADR-0107
  - id: AKM-05-013
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST end a fetch at once on a 4xx answer.
    rationale: >-
      A 4xx answer will not change on a retry (OX-13-005).
    verification: >-
      `test/adapters/driven/test_http_object_fetch.py` checks a 4xx ends the fetch
      after one attempt.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-008
    adr:
    - ADR-0107
  - id: AKM-05-014
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST log at WARNING a fetch that fails, or answers with anything but
      the object asked for, naming the object, its holder and the waiting activities.
    rationale: >-
      A failed fetch is recoverable for the inbox but leaves a replica without an object
      it was expected to hold, so an operator needs to see it (SL-01).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` checks a failed fetch is
      logged at WARNING, and that a body that is not the object asked for fails the
      fetch.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-008
    adr:
    - ADR-0107
  - id: AKM-05-015
    priority: MUST
    kind: project
    statement: >-
      After a fetch fails, this codebase MUST process each activity waiting on it
      without the object. The path that needs the object then refuses it as it did
      before dereference existed.
    rationale: >-
      Replaying the waiting activity, instead of dead-lettering it, lets the handler
      that needs the object give the refusal and the answer it already gives for an
      object nobody can supply.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` checks the waiting
      activity is replayed with its reference unresolved after a failed fetch;
      `test/core/behaviors/inbox/nodes/test_dereference_check_node.py` checks a failed
      fetch lets the activity go on with its reference.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-008
    adr:
    - ADR-0107
  - id: AKM-05-005
    priority: MUST
    kind: protocol
    statement: >-
      An actor carried inline in an activity MUST be the sender's held profile of that
      actor, as held. When the sender holds nothing more than the actor's URI, it MUST
      carry an actor reference instead: an inline object with exactly the actor's `id`
      and a `type`. A receiver MUST read the fields an actor reference lacks as unknown,
      and MUST NOT let an actor reference replace a fuller record of that actor it
      holds.
    rationale: >-
      A sender may name a peer it knows only by URI (AKM-05-001), and a receiver routes
      `Offer(Actor)` and `Invite(Actor)` by the object's `type`, so the actor must
      travel inline with a `type` even when nothing else is known. Anything beyond the
      id and type would be invented (AKM-02-006). A reference says nothing about the
      fields it lacks, so it cannot erase a value the receiver already holds.
    verification: >-
      `test/wire/as2/factories/test_actor_references.py::test_an_actor_given_by_uri_travels_as_an_actor_reference`
      checks the actor in each such activity is exactly an `id` and a `type`, and
      `test/wire/as2/factories/test_actor_references.py::test_a_held_actor_profile_travels_as_held`
      checks a held profile keeps the fields it was given.
      `test/adapters/driving/fastapi/test_actor_reference_receipt.py::test_a_received_actor_reference_keeps_the_held_profile`
      delivers an `Offer(Actor)` carrying a reference to a receiver that holds the
      actor's full profile, and checks the profile is unchanged.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-001
    - rel_type: constrains
      spec_id: MV-10-001
    adr:
    - ADR-0159
    stories:
    - story_2022_053
