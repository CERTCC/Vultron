id: AKM
title: Actor Knowledge Model
description: >-
  Defines the Actor Knowledge Model: a Vultron Actor's knowledge of the world is strictly
  bounded by the ActivityStreams 2.0 activities it has received. Actors must not assume
  recipients hold objects that were not explicitly included in prior activities; DataLayer
  access is private and non-shareable, and all inter-Actor communication occurs exclusively
  through the AS2 wire protocol.
scope:
- prototype
- production
tags:
- messaging
- protocol
- federation
groups:
- id: AKM-01
  title: DataLayer Isolation
  specs:
  - id: AKM-01-001
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms each actor's DataLayer is constructed per actor and that no
      code path hands one actor's DataLayer instance to another actor's use cases or
      behavior trees.
    statement: >-
      Each Actor's DataLayer is private to that Actor and MUST NOT be accessible to any other
      Actor.
  - id: AKM-01-002
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection confirms co-located actors exchange case traffic only through inbox
      POSTs and outbox delivery, with no direct read or write of a peer actor's
      DataLayer and no in-process call into a peer's use cases.
    statement: >-
      Actors that are co-located on the same server or within the same process MUST still
      exchange protocol messages through each other's inboxes, and MUST NOT communicate by
      reading or writing each other's local state or by calling into each other directly.
- id: AKM-02
  title: Knowledge Boundaries
  specs:
  - id: AKM-02-001
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      An Actor MUST NOT assume that a recipient has knowledge of any object that has not been
      explicitly included in a prior activity sent to that recipient.
    stories:
    - story_2022_053
  - id: AKM-02-002
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Satisfied in this codebase through AKM-02-004: inspection of the outbound activity
      factories confirms each embeds inline the objects a recipient cannot be expected to
      hold already, and uses a bare reference only for an object the recipient already
      has, such as the case it participates in.
    statement: >-
      Actors MUST NOT name an object the recipient cannot be expected to hold already by a
      reference the recipient cannot dereference (AKM-05-003, AKM-05-004). Such an object
      is carried inline, or by a reference the recipient can fetch.
  - id: AKM-02-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry inline every object a recipient cannot be expected to hold
      already, and MUST use a bare reference only for an object the recipient already
      has, such as the case it participates in.
    rationale: >-
      How this codebase meets AKM-02-002; split from it so AKM-02-002 states only what
      other participants observe (MS-12-010). This codebase does not yet dereference
      (AKM-05-003), so a reference to an object its recipient does not hold could not be
      resolved. Carrying the object inline instead is a shortcut of this prototype
      reference implementation, not a protocol rule.
    verification: >-
      `test/architecture/test_introduced_objects_inline.py` classifies every outbound
      activity factory: each one introducing an object refuses it as a bare id and
      carries it inline, and each one carrying an object the recipient already holds
      takes it through a parameter typed to refuse a bare id.
    relationships:
    - rel_type: implements
      spec_id: AKM-02-002
  - id: AKM-02-003
    priority: MUST
    kind: protocol
    statement: >-
      A case named in an activity's `target` MUST take one of two forms: the case URI,
      when the recipient already holds the case (a participant or the CASE_MANAGER being
      addressed about it, as in the full-case Invite of CM-11-010); or the case stub
      (`VulnerabilityCaseStub`, CM-11-013) the stub Invite sends to an actor that does
      not yet hold the case. A full case MUST NOT travel in `target`.
    verification: >-
      `test/adapters/driven/trigger_activity_adapter/test_sealed_body_audit.py` checks
      every trigger-port activity's `target`: a case there is a URI or an object of type
      `VulnerabilityCaseStub`.
    adr:
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_024
  - id: AKM-02-005
    priority: MUST
    kind: project
    statement: >-
      This codebase's activity factories MUST reduce a full case given as `target` to its
      URI and leave a case stub or a URI unchanged. `target` is the one slot in which
      this codebase carries a case by reference rather than inline.
    rationale: >-
      How this codebase meets AKM-02-003; split from it so AKM-02-003 states only the
      forms other participants observe in `target` (MS-12-010). That every other slot
      carries the case inline follows from this codebase's inline-object shortcut
      (AKM-02-004, AKM-03-003), not from the protocol.
    verification: >-
      `test/wire/as2/factories/test_case_context.py` checks `case_target_ref` reduces a
      full case to its URI and leaves a stub and a URI alone.
    relationships:
    - rel_type: implements
      spec_id: AKM-02-003
  - id: AKM-02-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT record, or send in an activity, a value for a field of an object
      it did not author when it does not know that value. A field whose value it does
      not know MUST stay absent. A `published` or `updated` time read from its own
      clock, and an `inbox` or `outbox` derived from another actor's id, are such
      values.
    rationale: >-
      A receiver cannot tell an invented value from an asserted one, so it records the
      invention as the object's own claim, and the case ledger then carries it in its
      snapshots. A value read from the sender's clock also differs on every build, so a
      rebuild of one activity under the same id no longer matches the first build
      (OX-06-002).
    note: >-
      Delivery to an inbox address derived from a recipient's id, when no inbox is held,
      is addressing rather than a recorded or sent value (OX-12-009).
    verification: >-
      `test/wire/as2/factories/test_actor_references.py::test_an_actor_given_by_uri_carries_no_invented_field`
      builds each factory activity that names an actor given by URI, and
      `test/adapters/driven/trigger_activity_adapter/test_sealed_body_audit.py::test_a_role_delegate_given_by_uri_carries_no_invented_field`
      seals each role-delegation Offer and answer; both check the actor carries no
      `published`, `updated`, `inbox` or `outbox`. For records,
      `test/adapters/driving/fastapi/routers/test_actors.py::TestRegisterPeer::test_peer_record_holds_no_value_the_request_did_not_supply`
      checks a registered peer and
      `test/core/use_cases/triggers/test_actor_triggers.py::TestActorDiscoveryCallOut::test_minimal_peer_holds_no_value_nobody_asserted`
      checks a peer recorded from a URI hold none of those fields.
    adr:
    - ADR-0159
    stories:
    - story_2022_053
- id: AKM-03
  title: Outbound Activity Object Integrity
  specs:
  - id: AKM-03-001
    priority: MUST
    kind: protocol
    statement: >-
      Outbound initiating activities (Create, Offer, Invite, Announce, Add, Remove, Update,
      Join, Ignore, Leave) MUST carry, as their `object`, the domain object they act on,
      inline or by reference.
    verification: Integration tests in `test/demo/` confirm that outbound initiating activities carry the domain
      object they act on in their `object` field.
    stories:
    - story_2022_053
  - id: AKM-03-003
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the `object` of every outbound activity as a fully inline
      typed object, never as a bare URI reference or an `as_Link`. AKM-03-002 enforces
      this at delivery.
    rationale: >-
      How this codebase meets AKM-03-001 and MV-09-001; split from them so they state
      only what other participants observe (MS-12-010). A receiver of this codebase does
      not dereference (AKM-05-003), so it could not resolve a reference to learn the
      activity's semantic type. Carrying the object inline is a shortcut of this
      prototype reference implementation, not a protocol rule.
    note: >-
      The rule binds the activity's own `object`. An `Invite(EmbargoEvent)` nested as the
      object of an ER may name its terms by URI: the ER answers the Invite by id and type,
      both inline, and needs no terms (ADR-0123).
    verification: >-
      Integration tests in `test/demo/` confirm that outbound initiating activities
      include a fully serialized `object` field rather than a bare URI reference.
      `vultron/adapters/driving/fastapi/outbox_delivery.py` raises
      `VultronValidationError` when `object_` is a bare string URI rather than a typed
      object. `test/architecture/test_introduced_objects_inline.py` classifies every
      activity factory, and checks that each one introducing an object refuses it as a
      bare id and carries it inline, and that every example activity does the same.
    relationships:
    - rel_type: implements
      spec_id: AKM-03-001
    - rel_type: implements
      spec_id: MV-09-001
  - id: AKM-03-002
    priority: MUST
    kind: project
    statement: >-
      The outbox handler MUST enforce object integrity at delivery time as a last-resort runtime
      guard.
    verification: A unit test confirms that the outbox handler rejects an activity whose `object` field is a bare URI
      reference rather than a fully inline typed domain object.
- id: AKM-04
  title: 'Future: Known-Object Tracking'
  specs:
  - id: AKM-04-001
    priority: MAY
    kind: project
    statement: >-
      A future implementation MAY track which objects have been shared with each participant
      (e.g., via `CaseLedgerEntry` hash-chain records) to avoid redundant full-object transmission.
    scope:
    - production
- id: AKM-05
  title: Actor Addressing and Discovery
  specs:
  - id: AKM-05-001
    priority: MUST_NOT
    kind: foundation
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py::TestSvcInviteActorToCaseUseCase::test_invite_proceeds_when_invitee_not_in_dl`
      confirms an invite is addressed to a peer with no local `CoreActor` record.
    statement: >-
      The absence of a local record of a peer actor MUST NOT prevent an actor from
      addressing an outbound activity to that peer. The peer's deliverable http(s) URI is
      sufficient for addressing; a fully resolved actor record is an enrichment (directory
      service), not a precondition for protocol participation.
    tags:
    - activitypub
  - id: AKM-05-002
    priority: SHOULD
    kind: architecture
    statement: >-
      When an actor is first named by URI and no local record exists, the implementation
      SHOULD attempt resolution via the injected `ActorDiscoveryCallOutBundle`
      (Retriever call-out, ADR-0024, ADR-0025) before minting a minimal record.
      A FAILURE result from the backend SHOULD produce an explicit WARNING rather than
      a silent default.
    scope:
    - production
  - id: AKM-05-003
    priority: SHOULD
    kind: protocol
    statement: >-
      An implementation SHOULD support object dereference: fetching the full object named
      by a URI through an API call to the actor or service that holds it.
    rationale: >-
      Several rules let a sender name an object by reference instead of inlining it, and
      each is sound only where the receiver can resolve the reference. The CP-01-009
      by-reference `actor` form is one. A prototype may inline everything and resolve
      nothing, so the capability is a SHOULD there (AKM-05-004 makes it a MUST in
      production).
    scope:
    - prototype
    stories:
    - story_2022_014
    note: >-
      A refusal that stands in for dereference lapses where dereference exists. This
      codebase dereferences through the case host's object read (AKM-05-006) and the
      inbox's fetch-and-defer (AKM-05-007), so the bare-URI `actor` on
      `Create(CaseProposal)` is fetched (CP-01-010) and a replica fetches an embargo
      EMB-18-003 would otherwise refuse as unreadable; each is refused only when its
      fetch fails (AKM-05-008).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` delivers activities
      naming objects the receiver does not hold and checks each is fetched through an
      API call and the activity replayed with it, and
      `test/adapters/driven/test_http_object_fetch.py` checks the fetch is an HTTP `GET`
      to the object's holder.
  - id: AKM-05-004
    priority: MUST
    kind: protocol
    statement: >-
      A production implementation MUST support object dereference (AKM-05-003): given a URI
      it has not seen, it MUST be able to fetch the object through an API call.
    verification: >-
      A production deployment is given a URI it holds no record for and fetches the
      object it names through an API call; the fetch returns the typed object.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: AKM-05-003
    stories:
    - story_2022_014
  - id: AKM-05-006
    priority: MUST
    kind: project
    statement: >-
      This codebase's CASE_MANAGER MUST serve, at `GET {actor}/case-object` with
      `case_id` and `object_id` query parameters, an object a case it manages names (the
      case itself, an embargo in its register, or a participant, status, report or note
      it lists) or an object whose `context` is that case, to an active participant of
      the case (CM-10-004). It MUST answer 403 to a requester that is not one, 401 to a
      request naming no requester, and 404 for a case it does not manage or an object
      the case does not name. The requester is the actor the request names in its
      `X-Vultron-Actor` header.
    rationale: >-
      A replica dereferences a case object from the actor that holds the canonical case
      (ADR-0107), and only an active participant is entitled to case content
      (CM-10-004). A 404 for an object the case does not name, whether or not the host
      holds it, tells a participant nothing about cases it is not in. A participant's
      replica is not the case host, so only the CASE_MANAGER serves the read.
    note: >-
      The requester is not authenticated: the prototype trusts the header as its inbox
      trusts the actor an activity claims to be. Actor authentication (#509) replaces
      that trust.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_case_object_route.py` checks a
      participant gets an object the case names as an ActivityStreams document, and
      that a non-participant, a request naming no requester, an object the case does
      not name and a case the host does not hold are answered 403, 401, 404 and 404;
      `test/core/services/test_dereference.py` checks a removed participant is refused
      and that an actor other than the case's CASE_MANAGER serves nothing.
    relationships:
    - rel_type: implements
      spec_id: AKM-05-003
    - rel_type: depends_on
      spec_id: CM-10-004
    adr:
    - ADR-0107
  - id: AKM-05-007
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that does not hold an object a received activity names, and needs it
      to process the activity, MUST fetch the object from the actor that holds it (a
      case's object from the case's CASE_MANAGER, an actor's profile from that actor)
      and MUST defer the activity, held as received, until the fetch settles, rather
      than process it without the object or drop it. A receiver MUST NOT fetch an object
      from itself, and MUST NOT fetch the entry an `Announce(CaseLedgerEntry)` carries.
      A fetched case object MUST be kept only when the receiver holds no record under
      its id (MV-10-003).
    rationale: >-
      A sender may name by reference an object its receiver is expected to hold
      (CLP-07-006, AKM-02-002), and a replica that lacks it, through a gap or a lag,
      would otherwise refuse or drop an activity that was sound. Deferring keeps the
      activity, as the inbox keeps one whose case is not yet known (PCR-06-001). The
      CASE_MANAGER holds the canonical case, so nobody holds a case object it lacks;
      replication carries its entries inline (SYNC-02-005) and replay needs no fetch.
    note: >-
      In this codebase a receiver fetches a case object for an activity no pattern
      matches because its `object` is a bare id it does not hold
      (`UNKNOWN_UNRESOLVABLE_OBJECT`), the embargo a replica's case names as active when
      an announced revision replaces it (EMB-18-003), and the proposer's profile a
      `Create(CaseProposal)` names by id (CP-01-010). An activity that matches a pattern
      with a bare reference is handled as it was before dereference existed: its
      handler decides.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` delivers each such
      activity through the inbox run with a fake fetcher and checks the activity is
      deferred and held, fetched from the right actor, and replayed once the fetch
      settles, the fetched case object stored and a fetched profile handed to the
      proposal and not stored; `test/core/services/test_dereference.py` checks the
      CASE_MANAGER fetches nothing from itself, a ledger entry is never fetched and a
      held object is not fetched again.
    relationships:
    - rel_type: implements
      spec_id: AKM-05-003
    - rel_type: refines
      spec_id: CLP-07-006
    adr:
    - ADR-0107
    stories:
    - story_2022_014
  - id: AKM-05-008
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST make at most `max_object_fetch_attempts` attempts to fetch one
      object (default 3), backing off exponentially between them, each bounded by
      `object_fetch_timeout_seconds` (default 30), and MUST end the fetch at once on a
      4xx answer. A fetch that fails, or answers with anything but the object asked for,
      MUST be logged at WARNING with the object, its holder and the waiting activities,
      and each waiting activity MUST then be processed without the object, so the path
      that needs it refuses it as it did before dereference existed.
    rationale: >-
      A fetch that never succeeds must surface rather than hang (ADR-0107). A 4xx answer
      will not change on a retry (OX-13-005). Replaying the waiting activity, instead of
      dead-lettering it, lets the handler that needs the object give the refusal and the
      answer it already gives for an object nobody can supply.
    verification: >-
      `test/adapters/driven/test_http_object_fetch.py` checks the retry cap, the
      immediate end on a 4xx and the backoff on a 5xx or network error;
      `test/adapters/driving/fastapi/test_inbox_dereference.py` checks a failed fetch is
      logged at WARNING and the waiting activity is replayed with its reference
      unresolved, and that a body that is not the object asked for fails the fetch.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-007
    adr:
    - ADR-0107
  - id: AKM-05-005
    priority: MUST
    kind: protocol
    statement: >-
      An actor carried inline in an activity MUST be the sender's held profile of that
      actor, as held. When the sender holds nothing more than the actor's URI, it MUST
      carry an actor reference instead: an inline object with exactly the actor's `id`
      and a `type`. A receiver MUST read the fields an actor reference lacks as unknown,
      and MUST NOT let an actor reference replace a fuller record of that actor it
      holds.
    rationale: >-
      A sender may name a peer it knows only by URI (AKM-05-001), and a receiver routes
      `Offer(Actor)` and `Invite(Actor)` by the object's `type`, so the actor must
      travel inline with a `type` even when nothing else is known. Anything beyond the
      id and type would be invented (AKM-02-006). A reference says nothing about the
      fields it lacks, so it cannot erase a value the receiver already holds.
    verification: >-
      `test/wire/as2/factories/test_actor_references.py::test_an_actor_given_by_uri_travels_as_an_actor_reference`
      checks the actor in each such activity is exactly an `id` and a `type`, and
      `test/wire/as2/factories/test_actor_references.py::test_a_held_actor_profile_travels_as_held`
      checks a held profile keeps the fields it was given.
      `test/adapters/driving/fastapi/test_actor_reference_receipt.py::test_a_received_actor_reference_keeps_the_held_profile`
      delivers an `Offer(Actor)` carrying a reference to a receiver that holds the
      actor's full profile, and checks the profile is unchanged.
    relationships:
    - rel_type: refines
      spec_id: AKM-05-001
    - rel_type: constrains
      spec_id: MV-10-001
    adr:
    - ADR-0159
    stories:
    - story_2022_053
