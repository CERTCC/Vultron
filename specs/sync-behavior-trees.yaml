id: SBT
title: Sync Behavior Trees
description: >-
  Requirements for behavior-tree-based implementation of sync log entry protocol flows.
  Covers three BTs: AnnounceLogEntryReceivedBT (received-side hash-chain validation with
  case-actor vs non-case-actor branching), RejectLogEntryReceivedBT (replication state
  update and replay), and CommitLogEntryBT (append, persist, fan-out).
scope:
  - prototype
  - production
tags:
- behavior-tree
relationships:
  - rel_type: extends
    spec_id: BT-06-001
    note: >-
      BT-06-001 requires all protocol-significant behavior in BTs; these
      specs define the sync-specific BTs that fulfill that requirement.
  - rel_type: implements
    spec_id: SYNC-02-002
    note: CommitLogEntryBT fan-out replaces procedural _fan_out_log_entry()
  - rel_type: implements
    spec_id: SYNC-03-001
    note: AnnounceLogEntryReceivedBT hash-chain validation and reject path
  - rel_type: implements
    spec_id: SYNC-03-002
    note: RejectLogEntryReceivedBT replay from last-accepted hash

groups:
  - id: SBT-01
    title: General Sync BT Requirements
    specs:
      - id: SBT-01-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          This codebase MUST implement every sync log entry protocol flow as a behavior
          tree, not as procedural use-case code.
        rationale: >-
          Ledger replication is protocol behavior. It decides what a replica accepts,
          when the replica rejects an entry, and which entries the CASE_MANAGER sends
          again. In a tree, each of these decisions is a named node, with a trace and
          its own tests. Procedural code in a use case hides these decisions from the
          behavior layer (BT-06-001).
        relationships:
          - rel_type: implements
            spec_id: BT-06-001
            note: Protocol-significant behavior in BTs
          - rel_type: implements
            spec_id: BT-06-006
            note: Protocol actions MUST NOT be outside BT

      - id: SBT-01-006
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          This codebase MUST replace the procedural sync logic in `received/sync.py` and
          `triggers/sync.py` with BT invocations through BTBridge.
        rationale: >-
          These two modules hold the sync use cases. A use case that runs its tree
          through BTBridge keeps its sync decisions in the tree, where SBT-01-001 puts
          them.
        relationships:
          - rel_type: extends
            spec_id: SBT-01-001

      - id: SBT-01-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Sync BTs MUST be organized as separate trees, each corresponding
          to a single message-type use case: (1) AnnounceLogEntryReceivedBT,
          (2) RejectLogEntryReceivedBT, (3) CommitLogEntryBT, (4)
          ReadLogEntryReceivedBT, the CASE_MANAGER's answer to a position
          statement (SYNC-17-002), and (5) the participant's
          StateLedgerPositions tree that sends one (SYNC-17-007). This
          preserves the one-message-type-per-use-case pattern.
        rationale: >-
          Each sync message has its own guards and effects. With one tree for each
          message type, each flow is small enough to read and test alone. Also, the
          dispatcher continues to route each semantic type to exactly one use case and
          one tree.

      - id: SBT-01-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Sync BT nodes MUST reside in `vultron/core/behaviors/sync/` with
          separate modules for node definitions (`nodes.py`) and tree
          composition functions (one module per tree).
        rationale: >-
          A fixed location for sync nodes and trees lets a developer find an existing
          node before the developer writes a new one. When nodes are separate from tree
          composition, several trees can reuse one node and do not import each other.

      - id: SBT-01-004
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          BTBridge.setup_tree() MUST inject driven ports, such as SyncActivityPort and
          DataLayer, into BT nodes through the blackboard. A BT node never constructs or
          acquires a port itself.
        rationale: >-
          A node that gets its own ports binds core logic to one adapter, and the node
          cannot run against a test double. When the bridge injects ports through the
          blackboard, nodes use only the port protocols. Then each test or deployment
          can choose the adapters.
        relationships:
          - rel_type: extends
            spec_id: BT-07-001
            note: BT nodes use DataLayer via Protocol

      - id: SBT-01-005
        priority: MUST_NOT
        kind: project
        verification_debt: '#2574'
        statement: >-
          Core use cases MUST NOT call trigger functions for sync operations. Triggers
          are external API entry points, for example for demo puppeteering, and core
          work flows through BTs.
        rationale: >-
          Triggers are entry points for an outside caller. When a core use case calls a
          trigger, it runs a second, nested path around the tree that it belongs to.
          This puts its guards, its commit order and its trace in two places.

  - id: SBT-02
    title: AnnounceLogEntryReceivedBT
    specs:
      - id: SBT-02-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          AnnounceLogEntryReceivedBT MUST include an explicit branch that decides whether
          the receiving actor is the CASE_MANAGER for the case that the log entry names.
        rationale: >-
          The CASE_MANAGER and a participant do different things with an announced
          entry. The CASE_MANAGER holds the canonical ledger and only checks its own
          echo. A participant validates the entry and stores it in its replica. The
          tree must know which of the two it is before it acts.

      - id: SBT-02-011
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          In AnnounceLogEntryReceivedBT, the CASE_MANAGER path and the participant path
          MUST be distinct subtrees.
        rationale: >-
          Separate subtrees keep the two rule sets apart, so a change to the
          participant's validation cannot alter the CASE_MANAGER's echo check.
        relationships:
          - rel_type: extends
            spec_id: SBT-02-001

      - id: SBT-02-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The non-case-actor (participant) path MUST validate the received
          log entry's hash chain before persisting.
        rationale: >-
          If a replica stores an entry without a check of its chain, it can accept a
          forged, reordered or gapped entry. Then the replica drifts from the canonical
          ledger. Validation before persistence keeps each stored replica a true prefix
          of the canonical ledger of the CASE_MANAGER.
        relationships:
          - rel_type: implements
            spec_id: SYNC-03-001
            note: Reject on hash-chain divergence

      - id: SBT-02-007
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          In the non-case-actor path, `prev_log_hash` MUST match the
          receiver's local chain tail hash.
        rationale: >-
          The hash-chain linkage is the integrity guarantee; accepting an
          entry whose prev_log_hash does not match the local tail would
          introduce a fork in the replica's chain.

      - id: SBT-02-008
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          On hash-chain mismatch in the non-case-actor path, the participant
          MUST send `Reject(CaseLedgerEntry)` back to the case-actor with
          its last-accepted hash.
        rationale: >-
          The Reject triggers the case-actor's replay path (SYNC-03-002),
          which resends all entries from the last accepted position forward
          so the participant can converge.

      - id: SBT-02-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The participant path MUST check for a duplicate entry before persisting
          (idempotency).
        rationale: >-
          Retries and replay can deliver an announcement more than one time. Without a
          duplicate check, the replica stores the repeat twice. Or, the repeat fails the
          chain check and causes an unnecessary reject and replay.
        relationships:
          - rel_type: implements
            spec_id: SYNC-03-003
            note: Idempotent delivery

      - id: SBT-02-012
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          When the participant path finds the entry already stored, the BT MUST return
          SUCCESS without persisting it again.
        rationale: >-
          A repeat of a stored entry is a delivery already handled. A SUCCESS with no
          write keeps the replica unchanged and does not read the repeat as an error.
        relationships:
          - rel_type: extends
            spec_id: SBT-02-003

      - id: SBT-02-004
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The case-actor path MUST verify that the log entry's sender
          matches the case-actor's own identity (actor-ID comparison).
        rationale: >-
          Only the CASE_MANAGER writes the canonical ledger. Thus an entry that claims
          to come from the CASE_MANAGER but has a different sender is not authentic. The
          identity check prevents other actors from writing into the canonical ledger.

      - id: SBT-02-009
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          On sender-identity mismatch (potential injection attempt) in the
          case-actor path, the BT MUST log at WARNING level including the
          activity_id and the mismatched actor IDs.
        rationale: >-
          A WARNING-level log with the mismatched IDs provides an auditable
          record of potential injection attempts without exposing internal
          state to the sender.

      - id: SBT-02-010
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          On sender-identity mismatch in the case-actor path, the BT MUST
          return FAILURE without persisting.
        rationale: >-
          Persisting a log entry whose sender does not match the case-actor's
          own identity would allow injection of forged entries into the
          canonical ledger.

      - id: SBT-02-005
        priority: SHOULD
        kind: project
        statement: >-
          The case-actor path's sender verification SHOULD be designed
          as a replaceable condition node so that cryptographic signature
          verification can replace actor-ID comparison in a future phase
          without restructuring the tree.
        rationale: >-
          Actor-ID comparison trusts the sender identity that the message claims. A
          single replaceable condition node lets a stronger check, such as a signature,
          replace the comparison later. The tree around the node does not change.

      - id: SBT-02-006
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          When the case-actor receives a valid round-trip of its own
          log entry, the BT MUST log at DEBUG level (delivery round-trip
          confirmation) and return SUCCESS. No state update or
          re-persistence is performed. Delivery confirmation tracking is
          deferred to a future phase.
        rationale: >-
          The CASE_MANAGER already holds the entry that it announced, so its own echo
          carries no new data. When the echo is a success with no write, the round trip
          does not change the canonical ledger and does not show as an error.

  - id: SBT-03
    title: RejectLogEntryReceivedBT
    specs:
      - id: SBT-03-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          RejectLogEntryReceivedBT MUST update the VultronReplicationState
          for the rejecting peer with the last-accepted hash reported in
          the rejection.
        rationale: >-
          Replay starts from the entry that the peer accepted last. When the
          CASE_MANAGER records that position for each peer, it sends again only the
          entries that the peer does not have. The position also stays available for
          later replays.
        relationships:
          - rel_type: implements
            spec_id: SYNC-04-001
            note: Per-peer replication state tracking

      - id: SBT-03-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          After updating replication state, RejectLogEntryReceivedBT MUST
          replay all missing entries from the peer's last-accepted hash
          forward by queuing `Announce(CaseLedgerEntry)` activities via
          SyncActivityPort, unless the replay rate bound suppresses the
          replay (SYNC-15-009) or the Reject is declined as already
          answered (SYNC-15-024).
        rationale: >-
          A peer that rejected an entry stays behind until it gets all entries after its
          last accepted entry. When the CASE_MANAGER replays that full range through the
          port, the replica gets the entries in order and becomes equal to the canonical
          ledger.
        relationships:
          - rel_type: implements
            spec_id: SYNC-03-002
            note: Retry from last-accepted hash

      - id: SBT-03-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          RejectLogEntryReceivedBT MUST resolve the case-actor for the
          referenced case and use the case-actor's identity as the sender
          for replayed Announce activities.
        rationale: >-
          Ledger entries replicate in one direction, from the CASE_MANAGER to each
          participant (SYNC-00-002). A participant replica accepts case-state updates
          only from the CASE_MANAGER for that case (PCR-03-001). Thus a replay sent
          under another identity does not bring the replica up to date.

  - id: SBT-04
    title: CommitLogEntryBT
    specs:
      - id: SBT-04-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          CommitLogEntryBT MUST compose as a Sequence of discrete BT nodes:
          (1) reconstruct chain tail hash, (2) create CaseLedgerEntry with
          computed entry_hash, (3) persist entry to DataLayer, (4) fan out
          Announce(CaseLedgerEntry) to case participants via SyncActivityPort.
        rationale: >-
          Each step of a commit can fail independently. The chain tail can fail to
          rebuild, the write can fail, or the port can be missing. When each step is a
          discrete node in a Sequence, the commit stops at the failed step, and the
          trace names that step. Each step can also be tested and reused alone.
        relationships:
          - rel_type: implements
            spec_id: SYNC-02-002
            note: Replication transport with sender and hash identification
          - rel_type: implements
            spec_id: BT-06-005
            note: Cascades as BT subtrees, not procedural calls

      - id: SBT-04-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Fan-out MUST be a separate BT action node (not inlined into the
          persist step) so that the commit and replication concerns are
          independently testable and composable.
        rationale: >-
          Persistence and announcement fail for different reasons, and have different
          tests. A separate fan-out node can be reused and tested with a fake port. It
          also goes after the persist step, so a failed write never announces an entry
          that does not exist.

      - id: SBT-04-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          `CommitCaseLedgerEntryNode` in `vultron/core/behaviors/case/nodes/lifecycle.py`
          MUST commit each ledger entry by running CommitLogEntryBT
          (`create_commit_log_entry_tree`), the one commit path.
        rationale: >-
          One commit path makes sure that each ledger entry is built, chained and
          announced in the same way. If the case node kept its own procedural commit,
          the two paths could create entries with different hashes or skip the fan-out.
          Ledger commits go only through `CommitCaseLedgerEntryNode` (BT-06-006).

      - id: SBT-04-004
        priority: MUST
        kind: project
        statement: >-
          CommitLogEntryBT MUST fan out a log entry only after it has durably persisted
          (committed) the entry.
        rationale: >-
          The fan-out is the record's delivery, so it follows the record. A failed
          write then never announces an entry that does not exist.
        verification: >-
          `test_commit_tree_fans_out_only_after_it_persists` in
          `test/core/behaviors/sync/test_commit_tree.py` asserts that the mint sequence
          runs `PersistLogEntryNode` before `FanOutLogEntryNode`, and
          `test_commit_tree_persists_entry_and_fans_out` asserts the entry is stored and
          announced.
        adr:
          - ADR-0119

      - id: SBT-04-005
        priority: MUST
        kind: project
        statement: >-
          An emit node MUST append its activity to the outbox before it runs the commit
          tree that records the activity, never running that commit first. This applies
          to every emit node whose activity the ledger records.
        rationale: >-
          The activity the record describes is the act, so it precedes the record
          (ADR-0119).
        verification: >-
          `test/core/behaviors/case/nodes/test_actor_and_announce_nodes.py::TestEmitInviteActorToCaseNodeQueuesBeforeCommitting`
          observes the ledger at the Invite's outbox append and asserts no
          entry for it is committed yet;
          `test/core/use_cases/triggers/test_actor_triggers.py::TestStubInviteIsRecordedAfterItIsSent`
          asserts the queue write precedes the entry.
        adr:
          - ADR-0119
        relationships:
          - rel_type: extends
            spec_id: SBT-04-004
          - rel_type: implements
            spec_id: SYNC-09-002
            note: Send-then-commit order (ADR-0119)

  - id: SBT-05
    title: Port Injection via Blackboard
    specs:
      - id: SBT-05-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          BTBridge MUST inject every driven port that BT nodes use through its blackboard
          context, in one consistent pattern. The ports include DataLayer,
          SyncActivityPort and any future port.
        rationale: >-
          With one injection pattern, all nodes find their ports in the same way. Then a
          test or a new deployment can supply all ports in one location.

      - id: SBT-05-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          A BT node MUST read its ports from the blackboard at `update()` time, never at
          construction time.
        rationale: >-
          When a node reads its ports at `update()` time, each run uses the ports set up
          for that run, not ports captured at tree build time.
        relationships:
          - rel_type: extends
            spec_id: SBT-05-001

      - id: SBT-05-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Blackboard keys for injected ports MUST follow the existing
          naming convention: `{noun}_{last_url_segment}` with no slashes.
          Recommended keys: `sync_port` for SyncActivityPort,
          `datalayer` for DataLayer (already established).
        rationale: >-
          py_trees reads a slash in a key as a namespace separator. Thus a key built
          from a full URL id splits into nested namespaces, and the lookup fails. Fixed,
          shared key names let all nodes read an injected port, and no node must know
          which code set the port.

