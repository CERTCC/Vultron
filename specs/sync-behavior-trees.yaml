id: SBT
title: Sync Behavior Trees
description: >-
  Requirements for behavior-tree-based implementation of sync log entry protocol flows.
  Covers three BTs: AnnounceLogEntryReceivedBT (received-side hash-chain validation with
  case-actor vs non-case-actor branching), RejectLogEntryReceivedBT (replication state
  update and replay), and CommitLogEntryBT (append, persist, fan-out).
scope:
  - prototype
  - production
tags:
- behavior-tree
relationships:
  - rel_type: extends
    spec_id: BT-06-001
    note: >-
      BT-06-001 requires all protocol-significant behavior in BTs; these
      specs define the sync-specific BTs that fulfill that requirement.
  - rel_type: implements
    spec_id: SYNC-02-002
    note: CommitLogEntryBT fan-out replaces procedural _fan_out_log_entry()
  - rel_type: implements
    spec_id: SYNC-03-001
    note: AnnounceLogEntryReceivedBT hash-chain validation and reject path
  - rel_type: implements
    spec_id: SYNC-03-002
    note: RejectLogEntryReceivedBT replay from last-accepted hash

groups:
  - id: SBT-01
    title: General Sync BT Requirements
    specs:
      - id: SBT-01-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          All sync log entry protocol flows MUST be implemented as behavior
          trees, not procedural use-case code. Procedural sync logic in
          `received/sync.py` and `triggers/sync.py` MUST be replaced by BT
          invocations via BTBridge.
        rationale: >-
          Ledger replication is protocol behavior: it decides what a replica accepts,
          when it rejects, and what gets resent. In a tree each of those decisions is a
          named, traced and testable node, while procedural code in a use case hides
          them from the behavior layer (BT-06-001).
        relationships:
          - rel_type: implements
            spec_id: BT-06-001
            note: Protocol-significant behavior in BTs
          - rel_type: implements
            spec_id: BT-06-006
            note: Protocol actions MUST NOT be outside BT

      - id: SBT-01-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Sync BTs MUST be organized as separate trees, each corresponding
          to a single message-type use case: (1) AnnounceLogEntryReceivedBT,
          (2) RejectLogEntryReceivedBT, (3) CommitLogEntryBT, (4)
          ReadLogEntryReceivedBT, the CASE_MANAGER's answer to a position
          statement (SYNC-17-002), and (5) the participant's
          StateLedgerPositions tree that sends one (SYNC-17-007). This
          preserves the one-message-type-per-use-case pattern.
        rationale: >-
          Each sync message has its own guards and effects. One tree per message type
          keeps each flow small enough to read and test alone, and keeps the
          dispatcher's route from a message meaning to exactly one use case and one
          tree.

      - id: SBT-01-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Sync BT nodes MUST reside in `vultron/core/behaviors/sync/` with
          separate modules for node definitions (`nodes.py`) and tree
          composition functions (one module per tree).
        rationale: >-
          A fixed place for sync nodes and trees lets a developer find the existing
          node before writing a new one, and keeping nodes apart from tree composition
          lets several trees reuse one node without importing each other.

      - id: SBT-01-004
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Driven ports (SyncActivityPort, DataLayer) MUST be injected into
          BT nodes via the blackboard context set up by BTBridge.setup_tree().
          BT nodes MUST NOT construct or acquire ports themselves.
        rationale: >-
          A node that acquires its own ports binds core logic to one adapter and cannot
          run against a test double. Injection through the bridge's blackboard keeps
          nodes on the port protocols and lets each test or deployment choose the
          adapters.
        relationships:
          - rel_type: extends
            spec_id: BT-07-001
            note: BT nodes use DataLayer via Protocol

      - id: SBT-01-005
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Core use cases MUST NOT call trigger functions for sync operations.
          Triggers exist as external API entry points (demo puppeteering);
          core work flows through BTs. The CommitLogEntryBT replaces
          `commit_log_entry_trigger()` for core-initiated log commits.
        rationale: >-
          Triggers are entry points for an outside caller. A core use case that calls
          one runs a second, nested path around the tree it belongs to, which splits
          its guards, commit order and trace across two places.

  - id: SBT-02
    title: AnnounceLogEntryReceivedBT
    specs:
      - id: SBT-02-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          AnnounceLogEntryReceivedBT MUST include an explicit branch that
          determines whether the receiving actor is the case-actor for the
          case referenced in the log entry. The case-actor path and the
          non-case-actor (participant) path MUST have distinct subtrees.
        rationale: >-
          The CASE_MANAGER and a participant do different things with an announced
          entry: the manager holds the canonical log and only checks its own echo,
          while a participant validates and stores a replica. Distinct subtrees keep
          those two rule sets from mixing in one set of nodes.

      - id: SBT-02-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The non-case-actor (participant) path MUST validate the received
          log entry's hash chain before persisting.
        rationale: >-
          A replica that stores an entry without checking its chain can accept a
          forged, reordered or gapped entry and drift from the canonical log.
          Validating before persisting keeps each stored replica a true prefix of the
          CASE_MANAGER's log.
        relationships:
          - rel_type: implements
            spec_id: SYNC-03-001
            note: Reject on hash-chain divergence

      - id: SBT-02-007
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          In the non-case-actor path, `prev_log_hash` MUST match the
          receiver's local chain tail hash.
        rationale: >-
          The hash-chain linkage is the integrity guarantee; accepting an
          entry whose prev_log_hash does not match the local tail would
          introduce a fork in the replica's chain.

      - id: SBT-02-008
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          On hash-chain mismatch in the non-case-actor path, the participant
          MUST send `Reject(CaseLedgerEntry)` back to the case-actor with
          its last-accepted hash.
        rationale: >-
          The Reject triggers the case-actor's replay path (SYNC-03-002),
          which resends all entries from the last accepted position forward
          so the participant can converge.

      - id: SBT-02-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The non-case-actor path MUST check for duplicate entries before
          persisting (idempotency). If the entry is already stored, the
          BT MUST return SUCCESS without re-persisting.
        rationale: >-
          Announcements can arrive more than once through retries and replay. Without a
          duplicate check a repeat would be stored twice or fail the chain check and
          trigger a needless reject and replay.
        relationships:
          - rel_type: implements
            spec_id: SYNC-03-003
            note: Idempotent delivery

      - id: SBT-02-004
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The case-actor path MUST verify that the log entry's sender
          matches the case-actor's own identity (actor-ID comparison).
        rationale: >-
          Only the CASE_MANAGER writes the canonical log, so an entry that claims to
          come from it but has another sender is not authentic. The identity check is
          what keeps another actor from writing into the canonical ledger.

      - id: SBT-02-009
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          On sender-identity mismatch (potential injection attempt) in the
          case-actor path, the BT MUST log at WARNING level including the
          activity_id and the mismatched actor IDs.
        rationale: >-
          A WARNING-level log with the mismatched IDs provides an auditable
          record of potential injection attempts without exposing internal
          state to the sender.

      - id: SBT-02-010
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          On sender-identity mismatch in the case-actor path, the BT MUST
          return FAILURE without persisting.
        rationale: >-
          Persisting a log entry whose sender does not match the case-actor's
          own identity would allow injection of forged entries into the
          canonical ledger.

      - id: SBT-02-005
        priority: SHOULD
        kind: project
        statement: >-
          The case-actor path's sender verification SHOULD be designed
          as a replaceable condition node so that cryptographic signature
          verification can replace actor-ID comparison in a future phase
          without restructuring the tree.
        rationale: >-
          Actor-ID comparison trusts the transport's claim of who sent a message. A
          single replaceable condition node lets a stronger check, such as a signature,
          take its place later without changing the tree around it.

      - id: SBT-02-006
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          When the case-actor receives a valid round-trip of its own
          log entry, the BT MUST log at DEBUG level (delivery round-trip
          confirmation) and return SUCCESS. No state update or
          re-persistence is performed. Delivery confirmation tracking is
          deferred to a future phase.
        rationale: >-
          The CASE_MANAGER already holds the entry it announced, so its own echo
          carries nothing new. Treating the echo as success with no write keeps the
          round trip from changing the canonical log or reading as an error.

  - id: SBT-03
    title: RejectLogEntryReceivedBT
    specs:
      - id: SBT-03-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          RejectLogEntryReceivedBT MUST update the VultronReplicationState
          for the rejecting peer with the last-accepted hash reported in
          the rejection.
        rationale: >-
          Replay starts from what the peer last accepted. Recording that position per
          peer lets the CASE_MANAGER resend only the entries that peer is missing, and
          keeps the position for later replays.
        relationships:
          - rel_type: implements
            spec_id: SYNC-04-001
            note: Per-peer replication state tracking

      - id: SBT-03-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          After updating replication state, RejectLogEntryReceivedBT MUST
          replay all missing entries from the peer's last-accepted hash
          forward by queuing `Announce(CaseLedgerEntry)` activities via
          SyncActivityPort.
        rationale: >-
          A peer that rejected an entry stays behind until it gets every entry after
          its last accepted one. Replaying that whole range through the port lets the
          replica catch up in order and converge on the canonical log.
        relationships:
          - rel_type: implements
            spec_id: SYNC-03-002
            note: Retry from last-accepted hash

      - id: SBT-03-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          RejectLogEntryReceivedBT MUST resolve the case-actor for the
          referenced case and use the case-actor's identity as the sender
          for replayed Announce activities.
        rationale: >-
          Ledger entries replicate one way, from the CASE_MANAGER to each participant
          (SYNC-00-002). Replayed entries sent under any other identity would not come
          from the replica's source, so the replay would not repair the replica.

  - id: SBT-04
    title: CommitLogEntryBT
    specs:
      - id: SBT-04-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          CommitLogEntryBT MUST compose as a Sequence of discrete BT nodes:
          (1) reconstruct chain tail hash, (2) create CaseLedgerEntry with
          computed entry_hash, (3) persist entry to DataLayer, (4) fan out
          Announce(CaseLedgerEntry) to case participants via SyncActivityPort.
        rationale: >-
          Each step of a commit can fail on its own: the chain tail may not rebuild,
          the write may fail, or the port may be missing. Discrete nodes in a Sequence
          stop the commit at the failing step, name that step in the trace, and let
          each step be tested and reused alone.
        relationships:
          - rel_type: implements
            spec_id: SYNC-02-002
            note: Replication transport with sender and hash identification
          - rel_type: implements
            spec_id: BT-06-005
            note: Cascades as BT subtrees, not procedural calls

      - id: SBT-04-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Fan-out MUST be a separate BT action node (not inlined into the
          persist step) so that the commit and replication concerns are
          independently testable and composable.
        rationale: >-
          Persisting and announcing fail for different reasons and are tested apart. A
          separate fan-out node can be reused, tested with a fake port, and placed
          after the persist step so a failed write never announces an entry that does
          not exist.

      - id: SBT-04-003
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The existing `CommitCaseLedgerEntryNode` in
          `vultron/core/behaviors/case/nodes/lifecycle.py` MUST be
          refactored to invoke CommitLogEntryBT as a subtree rather than
          calling `commit_log_entry_trigger()` procedurally.
        rationale: >-
          One commit path keeps every ledger entry built, chained and announced the
          same way. If the case node kept its own procedural commit, the two paths
          could produce entries with different hashes or skip the fan-out.

      - id: SBT-04-004
        priority: MUST
        kind: project
        statement: >-
          Fan-out MUST only occur after the log entry is durably persisted
          (committed). An emit node whose activity the ledger records MUST
          append the activity to the outbox before it runs the commit tree
          that records it, and MUST NOT run that commit first.
        rationale: >-
          The fan-out is the record's delivery, so it follows the record; the
          activity the record describes is the act, so it precedes it
          (ADR-0119).
        verification: >-
          `test/core/behaviors/case/nodes/test_actor_and_announce_nodes.py::TestEmitInviteActorToCaseNodeQueuesBeforeCommitting`
          observes the ledger at the Invite's outbox append and asserts no
          entry for it is committed yet;
          `test/core/use_cases/triggers/test_actor_triggers.py::TestStubInviteIsRecordedAfterItIsSent`
          asserts the queue write precedes the entry.
        adr:
          - ADR-0119
        relationships:
          - rel_type: implements
            spec_id: SYNC-09-002
            note: Send-then-commit order (ADR-0119)

  - id: SBT-05
    title: Port Injection via Blackboard
    specs:
      - id: SBT-05-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          All driven ports used by BT nodes (DataLayer, SyncActivityPort,
          and any future ports) MUST be injected via the BTBridge blackboard
          context using a consistent pattern. BT nodes MUST read ports from
          the blackboard at `update()` time, never at construction time.
        rationale: >-
          One injection pattern means every node finds its ports the same way, so a
          test or a new deployment can supply all of them in one place. Reading at
          `update()` time binds each run to the ports set up for it, not to ones
          captured when the tree was built.

      - id: SBT-05-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          Blackboard keys for injected ports MUST follow the existing
          naming convention: `{noun}_{last_url_segment}` with no slashes.
          Recommended keys: `sync_port` for SyncActivityPort,
          `datalayer` for DataLayer (already established).
        rationale: >-
          py_trees reads a slash in a key as a namespace separator, so a key built from
          a full URL id splits into nested namespaces and misses its lookup. Fixed,
          shared key names let any node read an injected port without knowing which
          code set it.

