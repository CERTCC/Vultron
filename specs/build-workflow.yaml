id: BW
title: Build Workflow Learnings Policy
description: >-
  Defines the content policy for the per-entry incoming learnings queue used by the build
  and bugfix skills to pass implementation observations upstream to the learn skill. Covers
  what belongs in the queue, what must not go there, file naming and format, how the learn
  skill processes and archives entries, and the learning history entry type. The queue is
  narrow by design: findings with a definite owner are routed to a GitHub issue or an
  in-session fix at the moment of discovery, and only unverified general claims and
  spec divergences are queued for batch processing (BW-07).
scope:
  - prototype
  - production
tags:
- tooling
groups:
  - id: BW-01
    title: Incoming Learnings Queue Content Policy
    specs:
      - id: BW-01-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          `plan/incoming/learnings/` MUST contain only implementation
          observations, open questions, constraints and insights. Each one
          comes from a `build` or `bugfix` run and bears on future
          implementation work.
        rationale: >-
          The queue is a focused upstream communication channel from executing
          skills to the `learn` skill. Mixing status updates with actionable
          insights dilutes the signal and creates noise for `learn` to filter.
          Thus completion summaries, "what was done" narratives and status
          updates do not go in the queue (BW-01-002).
        relationships:
          - rel_type: depends_on
            spec_id: HM-03-001
            note: >-
              Completion summaries belong in `append-history implementation`,
              not in the incoming learnings queue.
        adr:
          - ADR-0054
      - id: BW-01-002
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` and `bugfix` skills MUST NOT write completion summaries
          or task-status narratives to `plan/incoming/learnings/`.
        rationale: >-
          A completion summary in the queue gives `learn` nothing to promote. It also
          hides the observations that `learn` must act on. Completion summaries have
          their own record (BW-01-005).
        relationships:
          - rel_type: depends_on
            spec_id: HM-05-001
      - id: BW-01-005
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Completion summaries from the `build` and `bugfix` skills MUST be
          archived exclusively via `uv run append-history implementation`.
        rationale: >-
          `append-history implementation` puts the summary where readers of the work
          item find it, with validated frontmatter. A summary in a different location is
          lost, or it goes into the learnings queue, which is not its location
          (BW-01-001).
        relationships:
          - rel_type: implements
            spec_id: HM-05-001
      - id: BW-01-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Each incoming learning file MUST be named `YYYYMMDD-SLUG.md`.
          `YYYYMMDD` is the creation date. `SLUG` is a short, lowercase,
          hyphenated phrase that describes the observation.
        rationale: >-
          One file for each learning lets each branch record an observation without
          merge conflicts on a shared file. The date prefix sorts the directory by date.
          By convention, the slug is the originating issue number and then a
          descriptive phrase, for example
          `20260918-3399-bt18-has-no-contract-for-a-refusal-carrying-a-payload.md`.
      - id: BW-01-008
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          A tool or skill MUST NOT require a learning file's `SLUG` to equal or
          derive from its `source` frontmatter field.
        rationale: >-
          The `source` field carries the link to the originating work item
          (BW-02-002), so the filename does not have to carry it. One work item can
          produce many learnings. A name from `source` gives all of them the same
          filename.
        relationships:
          - rel_type: extends
            spec_id: BW-01-003
      - id: BW-01-009
        priority: MAY
        kind: process
        statement: >-
          One work item MAY produce several incoming learning files.
        rationale: >-
          One session can find several unrelated observations. Each one needs its own
          file, so that `learn` can promote, archive or reject each one separately.
      - id: BW-01-010
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Each incoming learning file's `SLUG` MUST differ from the `SLUG` of every
          other file in the queue with the same date prefix.
        rationale: >-
          Two files with the same date and slug have the same filename. Then the second
          file overwrites the first, and the first observation is lost. This can occur
          when one work item produces several learnings on one day (BW-01-009).
        relationships:
          - rel_type: extends
            spec_id: BW-01-003
          - rel_type: derives_from
            spec_id: BW-01-009
      - id: BW-01-006
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Incoming learning files MUST be committed as part of the
          originating PR so the learning is permanently linked to the
          work that produced it.
        rationale: >-
          A learning that is committed with its PR stays linked to the change that
          produced it. It goes into `main` when the change does. A learning that is
          committed separately can be lost when a branch is abandoned. It can also
          arrive before or after the work that it describes.
        relationships:
          - rel_type: refines
            spec_id: BW-01-003
      - id: BW-01-004
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          Skills other than `build` and `bugfix` MUST NOT create files in
          `plan/incoming/learnings/`.
        rationale: >-
          `plan/incoming/learnings/` is specifically a channel for
          code-execution insights flowing from build/bugfix to learn.
          Gap-analysis observations from `update-plan` are a different
          signal and belong in notes directly.
      - id: BW-01-007
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `update-plan` skill MUST write observations and open questions
          directly to the `notes/*.md` file whose topic matches the content.
        rationale: >-
          Gap-analysis observations already have a topic file in `notes/`. If they go
          into the learnings queue first, a later step must move them to `notes/`. A
          direct write also keeps the queue for build and bugfix output only
          (BW-01-004), so `update-plan` does not stage its observations there.
  - id: BW-02
    title: Incoming Learnings File Format
    specs:
      - id: BW-02-001
        priority: MUST
        kind: process
        statement: >-
          Every file in `plan/incoming/learnings/` MUST use the same YAML
          frontmatter format as history entry files: required fields
          `title`, `type` (value `learning`), `timestamp` (tz-aware ISO
          8601 UTC), and `source` (the originating work-item identifier, per
          BW-02-002). The incoming file is named `YYYYMMDD-SLUG.md`, which is
          a different naming scheme from the archived entry — the archived
          filename is derived from `source`, not carried over from the
          incoming name.
        rationale: >-
          Using identical format means archiving is a `git mv` equivalent
          via `uv run append-history --from-file` — no content
          transformation needed.
        verification: Inspection of `plan/incoming/learnings/` confirms each file parses with required fields `title`,
          `type` (value `learning`), `timestamp`, and `source` all present and valid. `HistoryEntryFrontmatter`
          (`vultron/metadata/history/models.py`) is the enforcement point — `--from-file` validates the incoming
          file's frontmatter through it before archiving, so a file that violates this cannot be archived at all.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-001
      - id: BW-02-002
        priority: MUST
        kind: process
        statement: >-
          The `source` field of an incoming learning file MUST be the originating
          work-item identifier, not the file's `YYYYMMDD-SLUG` stem. Examples are
          `ISSUE-<n>`, `CONCERN-<n>`, `IDEA-<n>` and `BUG-<n>`.
        rationale: >-
          `source` identifies the work item that produced the observation. HM-02-001
          defines it as an originating identifier. `append-history` uses it to name the
          archived file. Thus it must be the work-item ID, so that a reader of that item
          can find the archived entry. The incoming filename is the date and slug
          (BW-01-003), which is a different value. Many incoming files can have the same
          `source` when one work item produced several observations.
        verification: Inspection of `plan/incoming/learnings/` confirms each file's `source` matches the
          originating-identifier form defined by HM-02-001, and that `append-history --from-file` archives it to
          `plan/history/YYMM/<type>/<sanitised-source>.md`.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-001
      - id: BW-02-003
        priority: MUST
        kind: process
        statement: >-
          The `timestamp` field in an incoming learning file MUST reflect the
          actual creation time of the observation (not the current date if the
          entry was written for a historical run).
        rationale: >-
          `learn` sorts entries by `timestamp` and uses it to find old entries. For
          example, it archives an uncorroborated theme candidate after 30 days
          (BW-07-007). If the timestamp is the date of writing, not the date of the
          observation, a backfilled entry goes into the wrong position.
        verification: Inspection of `plan/incoming/learnings/` confirms each file's `timestamp` field is a tz-aware
          ISO 8601 UTC value and is not a future timestamp or today's date substituted for a historical entry.
        relationships:
          - rel_type: depends_on
            spec_id: HM-06-001
      - id: BW-02-004
        priority: MUST_NOT
        kind: process
        statement: >-
          The `timestamp` field MUST NOT be written as a bare `YYYY-MM-DD`
          date. `_coerce_to_utc()` in `vultron/metadata/history/models.py`
          rejects any value that is not timezone-aware, and YAML parses a bare
          date into a naive datetime, so a bare-date entry fails validation
          the moment `append-history --from-file` reads it. Write
          `"YYYY-MM-DDTHH:MM:SSZ"` (quoted, so YAML yields a string for
          Pydantic to parse) and use `T00:00:00Z` when only the date is known.
        rationale: >-
          This is stated separately because bare dates are the dominant form
          currently present in `plan/incoming/learnings/` and are silently
          accepted by every check *except* the archiving step — the one that
          matters. An entry written this way looks fine in review and then
          cannot be archived, so the defect surfaces only when `learn` tries
          to process it.
        verification: >-
          A unit test asserts `HistoryEntryFrontmatter` rejects a bare-date
          timestamp string and accepts the tz-aware form
          (`test_bare_date_string_timestamp_rejected`,
          `test_tz_aware_string_timestamp_accepted` in
          `test/metadata/test_history_models.py`).
        relationships:
          - rel_type: refines
            spec_id: BW-02-001
          - rel_type: depends_on
            spec_id: HM-06-005
      - id: BW-02-005
        priority: MUST
        kind: process
        statement: >-
          Conformance to BW-02-001 through BW-02-004 MUST be checked at commit
          time by validating every file in `plan/incoming/learnings/` through
          `HistoryEntryFrontmatter` — the same model
          `append-history --from-file` uses — so the check and the archiver
          cannot drift. A validator that reimplements the rules
          independently does not satisfy this.
        rationale: >-
          Without a commit-time check, `learn` finds frontmatter that the archiver
          rejects. This is frequently weeks after the author wrote the file, and then
          the entry cannot be archived. A commit-time check with the archiver's own
          model finds the error while the author has the file. Because the check and the
          archiver use one model, they cannot disagree.
        verification: >-
          The `validate-incoming-learnings-frontmatter` pre-commit hook calls
          `vultron.metadata.history.incoming.validate_incoming_learnings()`,
          and `test/metadata/test_incoming_learnings.py::TestRealCorpus`
          asserts the committed corpus validates.
        relationships:
          - rel_type: depends_on
            spec_id: BW-02-001
      - id: BW-02-006
        priority: MUST
        kind: project
        statement: >-
          The `learnings-index` entry point MUST render one line per file in
          `plan/incoming/learnings/` that carries its source, title and filename.
        rationale: >-
          `orient-agent` needs a map of the queue, not its full text. If it reads each
          full file, it uses much of the orientation budget. Each title states its
          lesson, so one line for each file gives orientation what it needs.
        verification: >-
          `test/metadata/test_incoming_learnings.py` asserts the line format and
          newest-first ordering.
        relationships:
          - rel_type: depends_on
            spec_id: BW-02-001
      - id: BW-02-007
        priority: MUST
        kind: project
        statement: >-
          When a file fails validation, the `learnings-index` entry point MUST still
          print the valid entries and report each failure on stderr.
        rationale: >-
          People write the queue by hand, so a malformed file is probable. If one bad
          file stops the index, orientation cannot see the other entries.
        verification: >-
          `test_malformed_file_does_not_cost_the_valid_entries` in
          `test/metadata/test_incoming_learnings.py` asserts that a malformed file is
          reported on stderr while the valid entries still render.
          `test_clean_queue_writes_nothing_to_stderr` asserts that a valid queue
          reports nothing on stderr.
        relationships:
          - rel_type: extends
            spec_id: BW-02-006
  - id: BW-03
    title: learn Skill Processing
    specs:
      - id: BW-03-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          When the `learn` skill processes `plan/incoming/learnings/`, each
          file MUST be promoted to the durable destination matching the content
          type — requirements to `specs/*.yaml`, design insights to `notes/*.md`,
          agent guidance to `AGENTS.md` — before being archived via
          `uv run append-history --from-file <path>`.
        rationale: >-
          The queue is a temporary location, not a durable one. If a learning is
          archived before its content goes into a spec, a note or `AGENTS.md`, the queue
          loses it and the project does not keep the lesson.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-002
      - id: BW-03-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          An agent MUST archive each processed incoming learning file with
          `uv run append-history --from-file <path>`, not by moving it by hand.
        rationale: >-
          Using the CLI tool preserves the audit trail, regenerates the
          monthly history README, and enforces write-once semantics. The command
          moves the file from `plan/incoming/learnings/` to
          `plan/history/YYMM/learning/` and deletes the source (BW-05-004), so no
          archived file stays in the queue.
        relationships:
          - rel_type: depends_on
            spec_id: HM-01-002
      - id: BW-03-003
        priority: SHOULD
        kind: process
        statement: >-
          After a complete `learn` cycle, `plan/incoming/learnings/` SHOULD
          contain only a `.gitkeep` file.
        rationale: >-
          Each `learn` cycle must process all queued entries. An empty queue after the
          cycle shows that the cycle did not skip an entry. An entry that stays in the
          queue shows that processing is not complete.
  - id: BW-04
    title: learning History Entry Type
    specs:
      - id: BW-04-001
        priority: MUST
        kind: project
        verification_debt: '#2575'
        statement: >-
          The `learning` entry type MUST exist in `HistoryEntryType` in
          `vultron/metadata/history/types.py`.
        rationale: >-
          The archiver accepts only types in `HistoryEntryType` (HM-02-002). Thus
          archived learnings need their own member, so that the archiver can write and
          index them.
        relationships:
          - rel_type: refines
            spec_id: HM-02-002
      - id: BW-04-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `learn` skill MUST use `uv run append-history --from-file`
          to archive each processed incoming learning file.
        rationale: >-
          The `--from-file` path moves the incoming file and its frontmatter into the
          archive without change, and deletes the source file. A different archive
          method can type the frontmatter again incorrectly, or leave the file in the
          queue.
        relationships:
          - rel_type: implements
            spec_id: BW-04-001
      - id: BW-04-002
        priority: MUST
        kind: project
        verification_debt: '#2575'
        statement: >-
          History entries of type `learning` MUST follow the same
          frontmatter and body format as all other `append-history` entry
          types, including required fields `title`, `type`, `timestamp`,
          and `source`.
        rationale: >-
          Indexes and `show-history` read all entries in the same way. A learning with a
          different format would break those readers, or need special handling.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-001
  - id: BW-05
    title: append-history --from-file Behaviour
    specs:
      - id: BW-05-001
        priority: MUST
        kind: project
        verification_debt: '#2575'
        statement: >-
          `uv run append-history --from-file <path>` MUST write the file's
          frontmatter and body through the normal write path to
          `plan/history/YYMM/<type>/<source>.md`. It takes `type`, `title`, `source`
          and `timestamp` from the frontmatter.
        rationale: >-
          Incoming learnings already have complete frontmatter. Thus the archive step
          can read it from the file, and the caller does not have to state it again.
      - id: BW-05-004
        priority: MUST
        kind: project
        statement: >-
          `uv run append-history --from-file <path>` MUST delete the source file
          after a successful write.
        rationale: >-
          The tool deletes the source after the write, so each learning is in one
          location only: the queue or the archive. A copy left in the queue would be
          processed again.
        verification: >-
          `test_source_file_deleted_after_archive` in
          `test/metadata/test_append_history.py` asserts the source file is gone
          after a successful archive.
        relationships:
          - rel_type: extends
            spec_id: BW-05-001
      - id: BW-05-002
        priority: MUST
        kind: project
        verification_debt: '#2575'
        statement: >-
          `uv run append-history --from-file` MUST be mutually exclusive with the
          positional `type` argument and the `--title`, `--source`, `--file` and
          `--timestamp` flags.
        rationale: >-
          With `--from-file`, the frontmatter in the file is the only source of the
          entry's metadata. If a flag conflicts with it, nobody can tell which value
          applies.
      - id: BW-05-005
        priority: MUST
        kind: project
        statement: >-
          When an agent combines `--from-file` with a conflicting argument,
          `uv run append-history` MUST exit non-zero with an error message that
          names the conflicting flags.
        rationale: >-
          A refusal with no message does not tell the agent what to change. The
          message names the flags, so the agent can remove them and run the command
          again.
        verification: >-
          `test_incompatible_with_title_flag`, `test_incompatible_with_source_flag`
          and `test_incompatible_with_positional_type` in
          `test/metadata/test_append_history.py` assert a non-zero exit and an error
          that names the conflicting argument.
        relationships:
          - rel_type: extends
            spec_id: BW-05-002
      - id: BW-05-003
        priority: MUST
        kind: project
        verification_debt: '#2575'
        statement: >-
          `uv run append-history --from-file` MUST reject files whose
          frontmatter `timestamp` is more than 60 seconds in the future
          (HM-06-004).
        rationale: >-
          `--from-file` must not bypass the validation that all other entries get. The
          same future-date check applies, so a file that the normal path rejects cannot
          go into the archive by this path.
      - id: BW-05-006
        priority: MUST
        kind: project
        statement: >-
          `uv run append-history --from-file` MUST reject files with missing or
          invalid frontmatter fields (HM-02-001).
        rationale: >-
          `--from-file` must not bypass the frontmatter validation that all other
          entries get. An archived entry with a missing or invalid field breaks the
          indexes and `show-history`, which read every entry in the same way.
        verification: >-
          `test_file_without_frontmatter_exits_nonzero` and
          `test_file_with_missing_required_fields_exits_nonzero` in
          `test/metadata/test_append_history.py` assert a non-zero exit for each.
        relationships:
          - rel_type: extends
            spec_id: BW-05-003
  - id: BW-06
    title: Skill Documentation Updates
    specs:
      - id: BW-06-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill documentation MUST distinguish between
          learnings (observations and constraints recorded as individual
          files in `plan/incoming/learnings/`) and completion summaries
          (archived via `uv run append-history implementation`). Both
          outputs are required; neither may be omitted or combined.
        rationale: >-
          The two outputs have different readers. Learnings go to `learn`, and
          completion summaries go to the record of the work item. If the documentation
          does not keep them separate, agents omit one, or they put a summary in the
          queue.
      - id: BW-06-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `learn` skill documentation MUST name `plan/incoming/learnings/` as its
          primary input source.
        rationale: >-
          `learn` agents follow the skill text. If the skill does not name the queue,
          agents do not read the entries.
      - id: BW-06-004
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `learn` skill documentation MUST describe the
          `append-history --from-file` archiving lifecycle.
        rationale: >-
          `learn` agents follow the skill text. If the skill does not describe the
          archive step, agents leave the entries in the queue after processing.
        relationships:
          - rel_type: extends
            spec_id: BW-06-002
      - id: BW-06-003
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `update-plan` skill MUST NOT instruct agents to write to
          `plan/incoming/learnings/`.
        rationale: >-
          Agents follow the skill text. If `update-plan` tells agents to write to the
          queue, it contradicts BW-01-007, which sends gap-analysis observations
          directly to `notes/*.md`. It also puts those observations in a channel that
          is for build and bugfix output.
  - id: BW-07
    title: Upward-Reflection Finding Routing
    specs:
      - id: BW-07-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Before an agent completes a `build` or `bugfix` session, it MUST run an
          upward-reflection checklist. The checklist asks explicitly whether the
          session found each of six things. The first two are behaviour with no spec
          entry, and a requirement that was unclear or conflicted with another. The
          next two are something that exists but is wrong, and something that should
          exist but does not. The last two are a broken tool, skill or tracking
          artefact, and a narrow but true fact about the code.
        rationale: >-
          Without a mandatory checklist, agents usually record only small tactical tips.
          They do not record the more important problems: spec gaps, conflicts and
          broken tools. The checklist asks each question explicitly. Each triggered item
          goes to one destination (BW-07-004), so somebody acts on it, and it is not
          only recorded. A session that records nothing is valid only if the agent
          completed the checklist and every answer was "no".
      - id: BW-07-002
        priority: SHOULD
        kind: process
        statement: >-
          Incoming learning files SHOULD include a `signal:` frontmatter
          field set to one of `theme-candidate`, `spec-gap`,
          `spec-ambiguity`, or `spec-contradiction`. The values
          `design-question`, `concern`, `tooling-issue`, and
          `process-issue` are retired: findings of those kinds are routed
          to a GitHub issue or an in-session fix per BW-07-004 and do not
          produce a learning file.
        rationale: >-
          The retired values all named findings with a definite owner and
          a definite action, which made the queue a waiting room for work
          that could already have started. The surviving values name the
          two things that genuinely require a batch — an unverified
          general claim, and a divergence between spec and reality.
        relationships:
          - rel_type: derives_from
            spec_id: BW-07-004
            note: >-
              The taxonomy is a consequence of the routing table rather
              than an independent list.
      - id: BW-07-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `learn` skill MUST process learning files tagged
          `signal: spec-gap`, `signal: spec-contradiction`, or
          `signal: spec-ambiguity` before processing
          `signal: theme-candidate` or untagged entries.
        rationale: >-
          These signal types represent cases where the specification
          has diverged from reality or contains internal conflicts.
          Deferring them risks future build sessions making the same
          gap-driven interpretations independently.
      - id: BW-07-004
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Each triggered checklist item MUST be routed at discovery to
          exactly one destination. Something that exists but is wrong → a
          GitHub `type:Bug`, `type:Task`, or `type:Concern` issue, chosen by
          the shape of the work. Something that should exist but
          does not → a GitHub `type:Idea` issue. A broken tool, skill, or
          tracking artefact → a fix applied in the same session. A
          narrow, symptom-retrievable fact about the code → an assertion
          at the site (regression test, type annotation, or comment) in
          the same session. A general claim that cannot be verified from
          a single instance → a `signal: theme-candidate` learning file.
          Behaviour with no spec entry, or an unclear or conflicting
          requirement → a `signal: spec-*` learning file. Only the last
          two destinations produce a learning file.
        rationale: >-
          A finding with a known owner and a known action does not need to wait for the
          next `learn` batch. If it waits, each agent before that batch can find the
          same problem again. Only an unverified general claim, or a difference between
          spec and code, needs a batch. Thus only those two produce a learning file.
        adr:
          - ADR-0054
      - id: BW-07-005
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `learn` skill MUST NOT promote a claim to `notes/` or
          `AGENTS.md` on the strength of a single learning file. Promotion
          requires at least two independent witnesses — two entries from
          different `source` work items making the same claim — or
          independent confirmation against the code.
        rationale: >-
          A single build session cannot distinguish a general pattern
          from a local accident, and its author is the party least able
          to judge which it is. Corroboration is the cheapest available
          test. The queue exists to accumulate it.
      - id: BW-07-006
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          When a session produces a finding that corroborates an existing
          queued `signal: theme-candidate` entry, the agent MUST file or
          update a GitHub issue (`type:Bug`, `type:Task`, or `type:Concern`,
          chosen by the shape of the work) for the now-corroborated theme in
          that session rather than adding a second learning file
          and waiting for `learn`.
        rationale: >-
          A second finding that agrees with a theme candidate makes the claim
          trustworthy, so that is the time to act. Without this rule, a corroborated
          theme stays in the queue until the next `learn` run. The corroboration
          threshold would then cause the delay that it must prevent.
        relationships:
          - rel_type: refines
            spec_id: BW-07-005
      - id: BW-07-007
        priority: SHOULD
        kind: process
        statement: >-
          A `signal: theme-candidate` entry that has received no
          corroborating witness within 30 days of its `timestamp` SHOULD
          be archived by `learn` as unreproduced, via
          `append-history learning`, without promotion to `notes/` or
          `AGENTS.md`.
        rationale: >-
          An uncorroborated claim that has not recurred in a month is
          more likely to have been a local accident than a pattern.
          Archiving preserves the record without letting the queue grow
          without bound.
        relationships:
          - rel_type: refines
            spec_id: BW-07-005
      - id: BW-07-008
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          A decision that was made, applied, and shipped within the
          session — leaving no open question and asking nothing of any
          future reader — MUST NOT be recorded as a learning file. The
          commit message, the diff, and the PR body are its record.
        rationale: >-
          Such entries cannot satisfy the completeness rule that a
          learning must produce a durable output, because there is no
          output left to produce. They are guaranteed to be archived
          unpromoted, and the reader who processes them recovers nothing.
        relationships:
          - rel_type: refines
            spec_id: BW-01-001
            note: >-
              A closed decision is a completion summary in the shape of
              an insight.
      - id: BW-07-009
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          This rule covers each code-review finding in a file that the current change
          did not touch. An agent MUST file each such finding as a GitHub `type:Bug`,
          `type:Task` or `type:Concern` issue, in the session that surfaced it.
        rationale: >-
          Such findings are pre-existing findings and findings deferred as out of scope.
          A PR comment records a finding but does not schedule it, so a PR-comment
          advisory alone does not meet this rule. A merged PR records what shipped, not
          what was deferred. Only an issue keeps the finding open until somebody
          resolves it.
        relationships:
          - rel_type: refines
            spec_id: BW-07-004
      - id: BW-07-010
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          An agent MUST NOT record a code-review finding in a file that the current
          change did not touch as a learning file.
        rationale: >-
          Nobody can assign, schedule or close a learning file. Thus a finding in a
          learning file is not tracked, but it can seem tracked. The finding goes to an
          issue instead (BW-07-009).
        relationships:
          - rel_type: extends
            spec_id: BW-07-009
