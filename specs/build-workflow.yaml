id: BW
title: Build Workflow Learnings Policy
description: >-
  Defines the content policy for the per-entry incoming learnings queue used by the build
  and bugfix skills to pass implementation observations upstream to the learn skill. Covers
  what belongs in the queue, what must not go there, file naming and format, how the learn
  skill processes and archives entries, and the learning history entry type. The queue is
  narrow by design: findings with a definite owner are routed to a GitHub issue or an
  in-session fix at the moment of discovery, and only unverified general claims and
  spec divergences are queued for batch processing (BW-07).
version: 3.0.0
scope:
  - prototype
  - production
tags:
- tooling
groups:
  - id: BW-01
    title: Incoming Learnings Queue Content Policy
    specs:
      - id: BW-01-001
        priority: MUST
        kind: process
        statement: >-
          `plan/incoming/learnings/` MUST contain only implementation
          observations, open questions, constraints, and insights discovered
          during `build` or `bugfix` execution that are relevant to future
          implementation work. Completion summaries, "what was done"
          narratives, and status updates MUST NOT appear here.
        rationale: >-
          The queue is a focused upstream communication channel from executing
          skills to the `learn` skill. Mixing status updates with actionable
          insights dilutes the signal and creates noise for `learn` to filter.
        relationships:
          - rel_type: depends_on
            spec_id: HM-03-001
            note: >-
              Completion summaries belong in `append-history implementation`,
              not in the incoming learnings queue.
      - id: BW-01-002
        priority: MUST_NOT
        kind: process
        statement: >-
          The `build` and `bugfix` skills MUST NOT write completion summaries
          or task-status narratives to `plan/incoming/learnings/`.
        relationships:
          - rel_type: depends_on
            spec_id: HM-05-001
      - id: BW-01-005
        priority: MUST
        kind: process
        statement: >-
          Completion summaries from the `build` and `bugfix` skills MUST be
          archived exclusively via `uv run append-history implementation`.
        relationships:
          - rel_type: implements
            spec_id: HM-05-001
      - id: BW-01-003
        priority: MUST
        kind: process
        statement: >-
          Each incoming learning file MUST be named `YYYYMMDD-SLUG.md`
          where `YYYYMMDD` is the creation date and `SLUG` is a short
          uppercase identifier matching the `source` frontmatter field
          (e.g., `20260622-AST-RATCHET-LAMBDA.md`).
        rationale: >-
          Using individual files instead of a shared flat file eliminates
          merge conflicts when multiple PRs each have an observation to
          record. The date prefix provides filesystem sort order.
      - id: BW-01-006
        priority: MUST
        kind: process
        statement: >-
          Incoming learning files MUST be committed as part of the
          originating PR so the learning is permanently linked to the
          work that produced it.
        relationships:
          - rel_type: refines
            spec_id: BW-01-003
      - id: BW-01-004
        priority: MUST_NOT
        kind: process
        statement: >-
          Skills other than `build` and `bugfix` MUST NOT create files in
          `plan/incoming/learnings/`.
        rationale: >-
          `plan/incoming/learnings/` is specifically a channel for
          code-execution insights flowing from build/bugfix to learn.
          Gap-analysis observations from `update-plan` are a different
          signal and belong in notes directly.
      - id: BW-01-007
        priority: MUST
        kind: process
        statement: >-
          The `update-plan` skill MUST write observations and open questions
          to the `notes/*.md` file whose topic matches the content. It MUST NOT use
          `plan/incoming/learnings/` as an intermediate staging area.
        relationships:
          - rel_type: refines
            spec_id: BW-01-004
  - id: BW-02
    title: Incoming Learnings File Format
    specs:
      - id: BW-02-001
        priority: MUST
        kind: protocol
        statement: >-
          Every file in `plan/incoming/learnings/` MUST use the same YAML
          frontmatter format as history entry files: required fields
          `title`, `type` (value `learning`), `timestamp` (tz-aware ISO
          8601 UTC), and `source` (the originating work-item identifier, per
          BW-02-002). The incoming file is named `YYYYMMDD-SLUG.md`, which is
          a different naming scheme from the archived entry — the archived
          filename is derived from `source`, not carried over from the
          incoming name.
        rationale: >-
          Using identical format means archiving is a `git mv` equivalent
          via `uv run append-history --from-file` — no content
          transformation needed.
        verification: Inspection of `plan/incoming/learnings/` confirms each file parses with required fields `title`,
          `type` (value `learning`), `timestamp`, and `source` all present and valid. `HistoryEntryFrontmatter`
          (`vultron/metadata/history/models.py`) is the enforcement point — `--from-file` validates the incoming
          file's frontmatter through it before archiving, so a file that violates this cannot be archived at all.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-001
        lint_suppress:
        - missing_story_reference
      - id: BW-02-002
        priority: MUST
        kind: protocol
        statement: >-
          The `source` field in an incoming learning file MUST be the
          originating work-item identifier — `ISSUE-<n>`, `CONCERN-<n>`,
          `IDEA-<n>`, `BUG-<n>` or equivalent — matching HM-02-001's
          definition of `source`. It MUST NOT be set to the incoming file's
          own `YYYYMMDD-SLUG` stem. `append-history` sanitises `source` into
          the archived entry's filename, so `source` is what makes the
          archived entry discoverable from the work item it came from, and
          several incoming files may legitimately share one `source` when one
          work item produced several observations.
        rationale: >-
          `source` answers "which work item produced this observation?", which
          is why HM-02-001 defines it as an originating identifier and why
          `append_history_entry()` uses it to name the archived file. The
          earlier "must match the filename stem" wording described the
          *post-archive* invariant (archived entries are named `<source>.md`,
          so there the two do coincide) and mistakenly applied it to the
          pre-archive file, whose name is date-and-slug. No file in
          `plan/incoming/learnings/` has ever satisfied the old wording.
        verification: Inspection of `plan/incoming/learnings/` confirms each file's `source` matches the
          originating-identifier form defined by HM-02-001, and that `append-history --from-file` archives it to
          `plan/history/YYMM/<type>/<sanitised-source>.md`.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-001
        lint_suppress:
        - missing_story_reference
      - id: BW-02-003
        priority: MUST
        kind: protocol
        statement: >-
          The `timestamp` field in an incoming learning file MUST reflect the
          actual creation time of the observation (not the current date if the
          entry was written for a historical run).
        verification: Inspection of `plan/incoming/learnings/` confirms each file's `timestamp` field is a tz-aware
          ISO 8601 UTC value and is not a future timestamp or today's date substituted for a historical entry.
        relationships:
          - rel_type: depends_on
            spec_id: HM-06-001
        lint_suppress:
        - missing_story_reference
      - id: BW-02-004
        priority: MUST_NOT
        kind: protocol
        statement: >-
          The `timestamp` field MUST NOT be written as a bare `YYYY-MM-DD`
          date. `_coerce_to_utc()` in `vultron/metadata/history/models.py`
          rejects any value that is not timezone-aware, and YAML parses a bare
          date into a naive datetime, so a bare-date entry fails validation
          the moment `append-history --from-file` reads it. Write
          `"YYYY-MM-DDTHH:MM:SSZ"` (quoted, so YAML yields a string for
          Pydantic to parse) and use `T00:00:00Z` when only the date is known.
        rationale: >-
          This is stated separately because bare dates are the dominant form
          currently present in `plan/incoming/learnings/` and are silently
          accepted by every check *except* the archiving step — the one that
          matters. An entry written this way looks fine in review and then
          cannot be archived, so the defect surfaces only when `learn` tries
          to process it.
        verification: >-
          A unit test asserts `HistoryEntryFrontmatter` rejects a bare-date
          timestamp string and accepts the tz-aware form
          (`test_bare_date_string_timestamp_rejected`,
          `test_tz_aware_string_timestamp_accepted` in
          `test/metadata/test_history_models.py`).
        relationships:
          - rel_type: refines
            spec_id: BW-02-001
          - rel_type: depends_on
            spec_id: HM-06-005
        lint_suppress:
        - missing_story_reference
      - id: BW-02-005
        priority: MUST
        kind: process
        statement: >-
          Conformance to BW-02-001 through BW-02-004 MUST be checked at commit
          time by validating every file in `plan/incoming/learnings/` through
          `HistoryEntryFrontmatter` — the same model
          `append-history --from-file` uses — so the check and the archiver
          cannot drift. A validator that reimplements the rules
          independently does not satisfy this.
        rationale: >-
          Between the spec being written and ISSUE-2762, 37 of 62 entries
          accumulated frontmatter that no check rejected and the archiver
          could not accept. The defect was invisible precisely because the
          only enforcement lived in the last step of a workflow that runs
          weeks after the file is written. Validating at commit time against
          the archiver's own model is what makes the queue stay drainable.
        verification: >-
          The `validate-incoming-learnings-frontmatter` pre-commit hook calls
          `vultron.metadata.history.incoming.validate_incoming_learnings()`,
          and `test/metadata/test_incoming_learnings.py::TestRealCorpus`
          asserts the committed corpus validates.
        relationships:
          - rel_type: depends_on
            spec_id: BW-02-001
        lint_suppress:
        - missing_story_reference
  - id: BW-03
    title: learn Skill Processing
    specs:
      - id: BW-03-001
        priority: MUST
        kind: process
        statement: >-
          When the `learn` skill processes `plan/incoming/learnings/`, each
          file MUST be promoted to the durable destination matching the content
          type — requirements to `specs/*.yaml`, design insights to `notes/*.md`,
          agent guidance to `AGENTS.md` — before being archived via
          `uv run append-history --from-file <path>`.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-002
      - id: BW-03-002
        priority: MUST
        kind: process
        statement: >-
          `uv run append-history --from-file <path>` MUST be used to
          archive each processed incoming learning file. This command
          moves the file from `plan/incoming/learnings/` to
          `plan/history/YYMM/learning/` and deletes the source. Files
          MUST NOT be moved manually or remain in `plan/incoming/learnings/`
          after archiving.
        rationale: >-
          Using the CLI tool preserves the audit trail, regenerates the
          monthly history README, and enforces write-once semantics.
        relationships:
          - rel_type: depends_on
            spec_id: HM-01-002
      - id: BW-03-003
        priority: SHOULD
        kind: process
        statement: >-
          After a complete `learn` cycle, `plan/incoming/learnings/` SHOULD
          contain only a `.gitkeep` file. The queue SHOULD be empty after
          every learning session that fully drains it.
  - id: BW-04
    title: learning History Entry Type
    specs:
      - id: BW-04-001
        priority: MUST
        kind: project
        statement: >-
          The `learning` entry type MUST exist in `HistoryEntryType` in
          `vultron/metadata/history/types.py`.
        relationships:
          - rel_type: refines
            spec_id: HM-02-002
      - id: BW-04-003
        priority: MUST
        kind: process
        statement: >-
          The `learn` skill MUST use `uv run append-history --from-file`
          to archive each processed incoming learning file.
        relationships:
          - rel_type: implements
            spec_id: BW-04-001
      - id: BW-04-002
        priority: MUST
        kind: project
        statement: >-
          History entries of type `learning` MUST follow the same
          frontmatter and body format as all other `append-history` entry
          types, including required fields `title`, `type`, `timestamp`,
          and `source`.
        relationships:
          - rel_type: depends_on
            spec_id: HM-02-001
  - id: BW-05
    title: append-history --from-file Behaviour
    specs:
      - id: BW-05-001
        priority: MUST
        kind: project
        statement: >-
          `uv run append-history --from-file <path>` MUST read the
          complete file content (frontmatter + body), parse the
          frontmatter to derive `type`, `title`, `source`, and
          `timestamp`, then call the normal write path to create the
          history entry at `plan/history/YYMM/<type>/<source>.md`.
          It MUST delete the source file after a successful write.
      - id: BW-05-002
        priority: MUST
        kind: project
        statement: >-
          `uv run append-history --from-file` MUST be mutually exclusive
          with the positional `type` argument, `--title`, `--source`,
          `--file`, and `--timestamp` flags. Any combination MUST exit
          non-zero with an error message listing the conflicting flags.
      - id: BW-05-003
        priority: MUST
        kind: project
        statement: >-
          `uv run append-history --from-file` MUST reject files whose
          frontmatter `timestamp` is more than 60 seconds in the future
          (HM-06-004). It MUST reject files with missing or invalid
          frontmatter fields (HM-02-001).
  - id: BW-06
    title: Skill Documentation Updates
    specs:
      - id: BW-06-001
        priority: MUST
        kind: process
        statement: >-
          The `build` skill documentation MUST distinguish between
          learnings (observations and constraints recorded as individual
          files in `plan/incoming/learnings/`) and completion summaries
          (archived via `uv run append-history implementation`). Both
          outputs are required; neither may be omitted or combined.
      - id: BW-06-002
        priority: MUST
        kind: process
        statement: >-
          The `learn` skill documentation MUST reference
          `plan/incoming/learnings/` as its primary input source and MUST
          describe the `append-history --from-file` archiving lifecycle.
      - id: BW-06-003
        priority: MUST_NOT
        kind: process
        statement: >-
          The `update-plan` skill MUST NOT instruct agents to write to
          `plan/incoming/learnings/`. Observations discovered during gap
          analysis MUST be written directly to `notes/*.md` files.
  - id: BW-07
    title: Upward-Reflection Finding Routing
    specs:
      - id: BW-07-001
        priority: MUST
        kind: process
        statement: >-
          Before completing a `build` or `bugfix` session, the agent MUST
          run an upward-reflection checklist that explicitly asks whether
          each of the following was encountered: behaviour with no spec
          entry; a requirement that was unclear or that conflicted with
          another; something that exists but is wrong; something that
          should exist but does not; a broken tool, skill, or tracking
          artefact; and a narrow but true fact about the code. Every
          triggered item MUST then be routed to exactly one destination
          per BW-07-004. A session that records nothing is valid only if
          the checklist was completed and every answer was "no".
        rationale: >-
          Without a mandatory checklist, agents default to recording
          only tactical tips-and-tricks. The checklist is what surfaces
          higher-signal problems, so it remains mandatory and unchanged
          in force. What changed is that a triggered item no longer
          implies a learning file — most findings have a nearer owner.
      - id: BW-07-002
        priority: SHOULD
        kind: protocol
        statement: >-
          Incoming learning files SHOULD include a `signal:` frontmatter
          field set to one of `theme-candidate`, `spec-gap`,
          `spec-ambiguity`, or `spec-contradiction`. The values
          `design-question`, `concern`, `tooling-issue`, and
          `process-issue` are retired: findings of those kinds are routed
          to a GitHub issue or an in-session fix per BW-07-004 and do not
          produce a learning file.
        rationale: >-
          The retired values all named findings with a definite owner and
          a definite action, which made the queue a waiting room for work
          that could already have started. The surviving values name the
          two things that genuinely require a batch — an unverified
          general claim, and a divergence between spec and reality.
        relationships:
          - rel_type: derives_from
            spec_id: BW-07-004
            note: >-
              The taxonomy is a consequence of the routing table rather
              than an independent list.
      - id: BW-07-003
        priority: MUST
        kind: process
        statement: >-
          The `learn` skill MUST process learning files tagged
          `signal: spec-gap`, `signal: spec-contradiction`, or
          `signal: spec-ambiguity` before processing
          `signal: theme-candidate` or untagged entries.
        rationale: >-
          These signal types represent cases where the specification
          has diverged from reality or contains internal conflicts.
          Deferring them risks future build sessions making the same
          gap-driven interpretations independently.
      - id: BW-07-004
        priority: MUST
        kind: process
        statement: >-
          Each triggered checklist item MUST be routed at discovery to
          exactly one destination. Something that exists but is wrong → a
          GitHub `type:Concern` issue. Something that should exist but
          does not → a GitHub `type:Idea` issue. A broken tool, skill, or
          tracking artefact → a fix applied in the same session. A
          narrow, symptom-retrievable fact about the code → an assertion
          at the site (regression test, type annotation, or comment) in
          the same session. A general claim that cannot be verified from
          a single instance → a `signal: theme-candidate` learning file.
          Behaviour with no spec entry, or an unclear or conflicting
          requirement → a `signal: spec-*` learning file. Only the last
          two destinations produce a learning file.
        rationale: >-
          A finding with a definite owner and a definite action does not
          need to wait for the next `learn` batch; deferring it means
          every agent between discovery and that batch rediscovers the
          same problem. Of the 62 queued files audited on 2026-09-02,
          only 5 were spec-shaped, while 38 named an action that could
          have been taken at discovery.
      - id: BW-07-005
        priority: MUST
        kind: process
        statement: >-
          The `learn` skill MUST NOT promote a claim to `notes/` or
          `AGENTS.md` on the strength of a single learning file. Promotion
          requires at least two independent witnesses — two entries from
          different `source` work items making the same claim — or
          independent confirmation against the code.
        rationale: >-
          A single build session cannot distinguish a general pattern
          from a local accident, and its author is the party least able
          to judge which it is. Corroboration is the cheapest available
          test. The queue exists to accumulate it.
      - id: BW-07-006
        priority: MUST
        kind: process
        statement: >-
          When a session produces a finding that corroborates an existing
          queued `signal: theme-candidate` entry, the agent MUST file or
          update a GitHub `type:Concern` issue for the now-corroborated
          theme in that session rather than adding a second learning file
          and waiting for `learn`.
        rationale: >-
          The second witness is the moment the claim becomes trustworthy,
          so it is the moment to act. Without this rule the corroboration
          threshold merely reintroduces the latency it was meant to
          remove: the `mkdocs --strict` theme accumulated four witnesses
          between 2026-08-27 and 2026-08-31 while remaining unfiled.
        relationships:
          - rel_type: refines
            spec_id: BW-07-005
      - id: BW-07-007
        priority: SHOULD
        kind: process
        statement: >-
          A `signal: theme-candidate` entry that has received no
          corroborating witness within 30 days of its `timestamp` SHOULD
          be archived by `learn` as unreproduced, via
          `append-history learning`, without promotion to `notes/` or
          `AGENTS.md`.
        rationale: >-
          An uncorroborated claim that has not recurred in a month is
          more likely to have been a local accident than a pattern.
          Archiving preserves the record without letting the queue grow
          without bound.
        relationships:
          - rel_type: refines
            spec_id: BW-07-005
      - id: BW-07-008
        priority: MUST_NOT
        kind: process
        statement: >-
          A decision that was made, applied, and shipped within the
          session — leaving no open question and asking nothing of any
          future reader — MUST NOT be recorded as a learning file. The
          commit message, the diff, and the PR body are its record.
        rationale: >-
          Such entries cannot satisfy the completeness rule that a
          learning must produce a durable output, because there is no
          output left to produce. They are guaranteed to be archived
          unpromoted, and the reader who processes them recovers nothing.
        relationships:
          - rel_type: refines
            spec_id: BW-01-001
            note: >-
              A closed decision is a completion summary in the shape of
              an insight.
      - id: BW-07-009
        priority: MUST
        kind: process
        statement: >-
          Code-review findings in files the current change did not touch
          (pre-existing findings, and findings deferred as out of scope)
          MUST be filed as GitHub `type:Bug` or `type:Concern` issues in
          the session that surfaced them. They MUST NOT be recorded as
          learning files, and MUST NOT be left only as PR-comment
          advisories.
        rationale: >-
          A learning file cannot be assigned, scheduled, or closed, so a
          bug report placed in one is inert. The 2026-09-02 audit traced
          six such entries holding roughly twenty findings: all but four
          were eventually filed as issues — by later sessions performing
          their own reviews, never by the learning file. The queue was
          therefore not the tracking mechanism but a parallel ledger that
          duplicated it, at the cost of the four findings that fell
          through because recording them had felt like tracking them.
          Several entries also cited the merged PR that surfaced the
          finding as evidence of tracking; a PR records what shipped, not
          what was deferred.
        relationships:
          - rel_type: refines
            spec_id: BW-07-004
