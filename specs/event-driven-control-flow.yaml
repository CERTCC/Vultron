id: EDF
title: Event-Driven Control Flow
description: 'Defines the event-driven processing model for Vultron actors: how primary events enter the system, how cascading
  consequences are produced automatically, and what constraints apply to demo scripts and integration tests.'
scope:
- prototype
- production
tags:
- messaging
- behavior-tree
groups:
- id: EDF-01
  title: Definitions
  specs:
  - id: EDF-01-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: 'A **primary event** is an externally supplied stimulus or an actor-initiated decision: a message delivered
      to an actor''s inbox, or a trigger invocation representing an actor choosing to begin an action.'
    rationale: >-
      The EDF rules treat a primary event differently from what follows from it. For
      example, a demo may inject only primary events (EDF-05-001). A fixed definition
      lets each rule and each reviewer tell the two apart.
  - id: EDF-01-002
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: A **cascade** is an automatic, BT-driven consequence that occurs within a single actor's execution context
      as a result of processing a primary event or an earlier cascade step.
    rationale: >-
      A cascade is the work an actor must do without being told again. A fixed
      definition separates it from a primary event. A manual call for a cascade step can
      then be identified as a defect (EDF-05-002).
  - id: EDF-01-003
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: 'A **cascade chain** is the full sequence of causally connected steps that flows from one primary event: within-actor
      cascade → outbox emission → delivery to peer inbox → peer''s own cascade → and so on.'
    rationale: >-
      The consequences of one primary event can cross several actors. A name for the
      whole chain lets the rules say where each step runs and what a demo must wait for.
      It also keeps the delivery between actors separate from the cascade of one actor.
  - id: EDF-01-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'An **external decision node** is a BT node that cannot complete autonomously: it requires input from an actor,
      a user interface, or an external system before it can return `SUCCESS` or `FAILURE`.'
    rationale: >-
      Some steps cannot complete without a decision from outside the actor. A fixed
      definition separates these points from steps that the actor must automate. A
      missing decision point and a missing automation are then not confused.
- id: EDF-02
  title: Event-Driven Processing
  specs:
  - id: EDF-02-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Every protocol-significant action in Vultron MUST be triggered by an event, not by direct procedural calls
      from upstream code.
    rationale: >-
      An action that runs only when upstream code calls it does not run when the same
      event arrives another way. When an event triggers every protocol-significant
      action, the same input always causes the same action, through the inbox or through
      a trigger.
  - id: EDF-02-002
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: 'The system MUST follow an "on event, do" model: business logic is invoked in response to events; events are
      not invoked by business logic.'
    rationale: >-
      When business logic calls the next step itself, the order of steps is in the
      callers, and each caller can get it wrong. When logic runs only in response to
      events, each step depends only on the event that caused it.
  - id: EDF-02-003
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: The inbox MUST be the sole entry point for inbound activity processing; handlers MUST NOT be invoked directly
      by callers that bypass the inbox dispatch pipeline.
    rationale: >-
      The inbox pipeline parses each activity, extracts its semantics and checks its
      case context before a handler runs. A caller that invokes a handler directly skips
      those steps. The handler then acts on input that the pipeline did not check.
  - id: EDF-02-004
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: The outbox MUST be the sole exit point for outbound activity delivery; handlers MUST NOT deliver activities
      directly to peer actors.
    rationale: >-
      The outbox records each outbound activity, keeps the delivery order to each
      recipient and retries failed deliveries. A handler that sends directly to a peer
      skips that record and those retries, so nobody can see or repeat a lost delivery.
- id: EDF-03
  title: Cascade Implementation
  specs:
  - id: EDF-03-001
    priority: MUST
    kind: project
    statement: All cascade steps that do not require external input MUST be implemented as BT subtrees within the handling
      actor's BT execution context.
    rationale: >-
      A BT subtree runs inside the same execution as the step that caused it, and the
      tree status reports its result. Procedural code after the tree runs outside it.
      The tree status then does not report a failure of that code, and its writes do not
      go through the checks that the BT write nodes apply.
    verification: Inspection of `vultron/core/behaviors/` and `vultron/core/use_cases/` confirms that every protocol
      consequence following a primary event is implemented as a BT subtree rather than as procedural post-handler code.
    stories:
    - story_2022_106
  - id: EDF-03-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Outbox emissions that are part of a cascade MUST be implemented as BT leaf-node actions (e.g., `EmitXxxNode`);
      they MUST NOT be procedural calls made after `BTBridge.execute_with_setup()` returns.
    rationale: >-
      An emission placed after `execute_with_setup()` returns can run when the tree
      failed. As a leaf node, the emission runs only when its tree reaches it, and the
      tree status reports its result.
  - id: EDF-03-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'A use case''s `execute()` method MUST contain only infrastructure glue: BT instantiation, blackboard setup,
      bridge execution, status check, and output extraction.'
    rationale: >-
      When `execute()` only builds, sets up and runs the tree, all protocol logic is in
      the tree, where nodes can be tested and composed. Logic in `execute()` is hidden
      from the tree. If that logic writes state, it skips the checks that the tree
      applies (CLP-10-020).
  - id: EDF-03-004
    priority: MUST
    kind: protocol
    statement: >-
      The cascading consequence of a primary event MUST be fully determined by the
      handling actor's processing of that event, with no required intermediate local
      action, except at explicit external decision points (see EDF-04).
    rationale: >-
      A peer sees only what an actor emits. If an actor needs an extra local step before
      it completes the consequences of an event, its peers wait for something that the
      protocol does not show them. When the processing of the event alone determines its
      consequences, every implementation that receives the same event does the same
      work. The only exception is a point where the actor must wait for a decision
      (EDF-04).
    verification: Integration tests in `test/demo/` confirm that injecting a primary event causes all expected cascade
      consequences (state changes, outbox activities) without any manual intermediate trigger steps.
    stories:
    - story_2022_088
    - story_2022_106
  - id: EDF-03-005
    priority: MUST_NOT
    kind: architecture
    verification: >-
      Inspection confirms each cascade lives in the receiving actor's own tree and is
      triggered by receipt of the peer's outgoing activity, with no cascade logic copied
      between actors.
    statement: Cascade logic MUST NOT be duplicated between actors; each actor's BT handles its own local cascade, triggered
      by receipt of the peer's outgoing activity.
    rationale: >-
      When one actor runs the cascade of another, the state of the receiver depends on
      code the receiver does not run. Each actor runs its own cascade only from what it
      receives, so its state follows from its own processing of the messages it holds.
- id: EDF-04
  title: External Decision Nodes
  specs:
  - id: EDF-04-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: When a cascade reaches a point where the actor cannot proceed autonomously, the stopping point MUST be represented
      as an explicit external decision node in the BT.
    rationale: >-
      A stop that has no node in the tree cannot be found by inspection or by a test. An
      explicit node shows where the actor waits and what input it needs. The stop is
      then a known decision point and not a hidden defect.
  - id: EDF-04-002
    priority: MUST_NOT
    kind: project
    statement: >-
      An external decision node MUST NOT return `py_trees.common.Status.RUNNING` to
      represent awaiting input; it MUST request the input it needs and terminate.
    rationale: >-
      The execution model cannot host `RUNNING`: `BTBridge.execute_tree` treats root
      `RUNNING` as "continue ticking", exhausts its budget, logs `ERROR`, returns
      `FAILURE`, then discards the tree — so no node survives to be resumed. Waiting is
      instead expressed by requesting the input and terminating (ASK-01-002).
    note: >-
      Reversed by ADR-0080. The previous form mandated `RUNNING` while awaiting input.
      It had zero implementations — no node in `vultron/` returns `RUNNING` — and any
      node that had complied would have busy-looped and then failed.
    verification: >-
      A repository-wide search finds no `return Status.RUNNING` in `vultron/`, and a
      gated tree returns `SUCCESS` after emitting its request.
    adr:
    - ADR-0080
    relationships:
    - rel_type: refines
      spec_id: ASK-01-003
  - id: EDF-04-003
    priority: MUST
    kind: architecture
    statement: The arrival of the required external input (a trigger invocation, an inbox message, or a UI response) MUST
      cause a fresh evaluation that determines where the exchange stands and proceeds
      accordingly.
    rationale: >-
      No tree instance stays alive between events, so no node waits to be ticked again.
      The arrival of the input must start a new evaluation. That evaluation first
      determines the state of the exchange (ASK-02-001), so it continues from the
      correct point.
    verification: >-
      Delivering the awaited input causes a fresh evaluation that resolves the
      exchange, without any prior tree instance being retained.
    adr:
    - ADR-0080
  - id: EDF-04-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Trigger endpoints that correspond to external decision node resolutions MUST be
      documented as such; their role is to supply the missing input, not to choreograph
      a cascade that should be automatic.
    rationale: >-
      Without this documentation, a trigger that supplies a decision looks the same as a
      trigger that pushes a cascade that should run on its own. The documentation shows
      which triggers are correct uses and which ones hide a missing automation
      (EDF-05-005).
  - id: EDF-04-005
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      An external decision node MUST NOT succeed or fail without having requested the
      input it needs.
    rationale: >-
      A decision point that returns a final status without a request hides that nobody
      asked for the input. The tree then continues as if somebody made the decision. A
      decision point stops and does not wait (EDF-04-002), so the emitted request is
      what shows "asked and waiting" and not "gave up". `RequireCaseOwnerApprovalNode`
      has this defect: it returns `FAILURE` and asks nobody.
    relationships:
    - rel_type: refines
      spec_id: EDF-04-002
  - id: EDF-04-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: An external decision node MUST NOT be modeled as an absence of code.
    rationale: >-
      An absent node makes the waiting point invisible to the BT structure, preventing
      inspection and making the decision requirement undetectable.
    relationships:
    - rel_type: refines
      spec_id: EDF-04-002
- id: EDF-05
  title: Demo Constraints
  specs:
  - id: EDF-05-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Demo scripts MUST inject only primary events into the system.
    rationale: >-
      A demo shows what the system does on its own. When a demo injects only primary
      events, the system produced every other step that the demo observes. The demo then
      checks the cascades and does not hide gaps in them.
  - id: EDF-05-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Demo scripts MUST NOT trigger intermediate cascade steps manually; all cascade steps that are not external
      decision nodes MUST complete automatically as a result of the primary event.
    rationale: >-
      A manual trigger for a cascade step lets a demo pass when the system does not
      complete that step itself. The demo then hides the missing automation that it
      should show.
  - id: EDF-05-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Demo scripts MUST verify correctness by observing externally visible system state (e.g., DataLayer contents,
      activities queued in the outbox) after the primary event and its cascades have settled.
    rationale: '"Settled" is not a matter of elapsed time. EDF-06 defines normatively what counts as evidence that a cascade
      has settled; read this requirement together with EDF-06-001.'
    relationships:
    - rel_type: refines
      spec_id: EDF-06-001
      note: EDF-06-001 supplies the operational definition of "settled" that this requirement assumes.
  - id: EDF-05-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Demo scripts MUST NOT assert on internal BT execution state (e.g., node status, blackboard values) as a substitute
      for observing external system state.
    rationale: >-
      Node status and blackboard values are internal, and they change when the tree
      changes. External state is what a peer or an operator sees. A check on external
      state tests the behavior and still holds when the tree changes shape.
  - id: EDF-05-005
    priority: SHOULD
    kind: project
    statement: A demo that must manually trigger intermediate steps to reach its expected final state SHOULD be treated as
      evidence of a cascade automation gap that requires a BT fix, not as correct demo behavior.
    rationale: >-
      A demo that needs a manual step shows that the system does not complete a cascade
      on its own. When that need counts as a defect, the fix goes into the tree, and the
      demo does not hide the gap.
- id: EDF-06
  title: Causal Gating in Demo Scenarios
  specs:
  - id: EDF-06-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: A harness step that depends on an asynchronous effect MUST be gated on positive evidence that the effect has
      been committed by the actor that produces it. Elapsed time, the step's position in the script, and the return of an
      HTTP 202 acknowledgement MUST NOT be treated as such evidence.
    rationale: >-
      A scenario ordered by time ("A, then B") and not by cause ("A, therefore B") makes
      each step race asynchronous delivery. Elapsed time, script position and a 202
      response show only that a request was accepted, not that its effect was committed.
      A gate on committed evidence removes that race (ADR-0058).
    adr:
    - ADR-0058
    tags:
    - demo
    - testing
  - id: EDF-06-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The gate predicate MUST be evaluated against the state of the actor that owns the awaited effect, read from
      that actor's own container. Observing the effect on the sending actor's container MUST NOT be accepted as evidence that
      the receiving actor committed it.
    rationale: Each actor holds an independent DataLayer replica. A sender-side observation proves only that the sender
      emitted the activity, not that the recipient processed it.
    adr:
    - ADR-0058
    tags:
    - demo
    - testing
  - id: EDF-06-003
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: A gate MUST NOT be placed on an observable that becomes true synchronously during the triggering request when
      the awaited effect is committed asynchronously after that request returns.
    rationale: >-
      An observable that becomes true during the triggering request shows only that the
      cause started, not that it completed. The awaited effect commits after the request
      returns, so a gate on that observable lets the next step run before the effect it
      needs. A gate on the committed effect removes that race (ADR-0058).
    adr:
    - ADR-0058
    tags:
    - demo
    - testing
  - id: EDF-06-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      When a received-side use case creates a new activity in response to a
      received one (the forwarding or propose-then-execute pattern), the harness
      MUST discover the derived object by scanning the recipient's state for its
      semantic properties (activity type, target, and object), and MUST NOT poll
      for the identifier of the sender's original activity.
    rationale: >-
      In the forwarding and propose-then-execute patterns, the recipient gets a new
      activity under an id that the received-side use case derives, and not the sender's
      activity. For example, on an ownership-transfer proposal from the Case Owner, the
      CASE_MANAGER makes its own `Offer(VulnerabilityCase)` for the transferee under a
      derived id (CM-21-005, ADR-0148). A poll for the id of the sender's activity can
      never find the derived activity. A scan for its type, target and object can find
      it.
    adr:
    - ADR-0058
    tags:
    - demo
    - testing
  - id: EDF-06-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: An unmet causal gate MUST prevent execution of the steps that depend on it. Recording the failure and
      continuing to the dependent step is not sufficient.
    rationale: A gate that records a failure but lets the dependent step run produces a cascade of secondary failures that
      masks the first one, and makes the gate indistinguishable from a comment. This refines the accumulate-and-continue
      rule of DEMOCI-01-003, which governs reporting rather than control flow.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-01-003
      note: Accumulation of failures is preserved; only the control flow of dependent steps is constrained.
    tags:
    - demo
    - testing
  - id: EDF-06-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: A wait that is irreducibly temporal — service liveness probes, protocol deadlines such as embargo expiry, and
      transport retry backoff — MUST be identified as temporal at its call site and MUST NOT be counted as a causal gate.
    rationale: Not every wait is a defect. Naming the temporal waits explicitly keeps them from being "fixed" into
      meaningless causal gates, and keeps the causal-gate inventory honest about what it does and does not cover.
    adr:
    - ADR-0058
    tags:
    - demo
    - testing
  - id: EDF-06-007
    priority: SHOULD
    kind: project
    statement: A step whose causal precondition cannot be expressed as an observable predicate SHOULD be treated as evidence
      of a missing observable or an unautomated cascade, and SHOULD be recorded as such rather than replaced with a timed
      wait.
    rationale: 'Refines EDF-05-005 to the harness side: where EDF-05-005 detects missing cascade automation from a needed
      manual trigger, this detects it from an ungateable precondition. Some preconditions are genuinely unobservable today
      (an actor having *processed* a delivery leaves no completion record); those gaps belong in the record, not behind a
      `sleep`.'
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: EDF-05-005
      note: Same diagnostic principle applied to harness gating rather than to manual cascade triggering.
    tags:
    - demo
    - testing
  - id: EDF-06-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The timeout value of a temporal wait (EDF-06-006) MUST be accompanied by
      a comment at the call site that names the delivery chain being bounded and
      justifies the chosen value relative to worst-case BackgroundTasks delivery
      across the containers involved.
    rationale: >-
      A bare integer timeout (e.g. `timeout_seconds=15.0`) with no explanation
      is indistinguishable from an arbitrary guess. When the wait starts failing
      in CI, there is no basis for deciding whether to raise the budget, change
      the observable, or investigate a deeper delivery failure. The justification
      comment is the decision record that makes that choice tractable.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: EDF-06-006
      note: Adds a justification requirement to the identification requirement; both apply to every temporal wait.
    tags:
    - demo
    - testing
