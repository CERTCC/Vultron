id: ASK
title: Protocol Asks and Outstanding-Ask Registers
description: >
  Requirements for the protocol-ask primitive: how an actor requests something it
  lacks authority to do, how outstanding asks are recorded and enumerated in both
  directions, how asks expire, and how a receiver reports that it could not
  process an inbound message. Derived from ADR-0080 and the G01 planning session
  (CONCERN-2829).
scope:
- prototype
- production
tags:
- protocol
- messaging
- behavior-tree
groups:
- id: ASK-01
  title: Ask and Terminate
  description: >
    An ask is an ordinary protocol message that completes the asking behavior.
    Nothing suspends awaiting a reply.
  specs:
  - id: ASK-01-001
    stories:
    - story_2022_010
    - story_2022_047
    - story_2022_053
    priority: MUST
    kind: protocol
    statement: >
      An actor that cannot perform an action on its own authority MUST request
      authorization with an ask activity addressed to the authorizing actor.
    rationale: >
      Separates requesting authority from holding it, so the action cannot occur
      on the asker's own initiative.
    verification: >
      A gated tree executed by a non-authorized actor emits the ask.
    adr:
    - ADR-0080
    tags:
    - protocol
    - security
  - id: ASK-01-005
    stories:
    - story_2022_010
    - story_2022_047
    - story_2022_053
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor that asks for authorization of an action MUST NOT perform the action
      before it has recorded a reply that authorizes it.
    rationale: >-
      An ask suspends nothing, so the action would otherwise run on the asker's own
      initiative while the answer is still pending.
    verification: >-
      A gated tree executed by a non-authorized actor produces no protocol effect
      from the gated action.
      `test/architecture/test_protocol_asks_specs.py`
      (`test_production_status_authorization_default_is_conservative`) confirms the
      production status-adoption gate never permits the action on its own.
    relationships:
    - rel_type: extends
      spec_id: ASK-01-001
    adr:
    - ADR-0080
    tags:
    - protocol
    - security
  - id: ASK-01-002
    priority: MUST
    kind: architecture
    statement: >-
      A behavior that emits an ask MUST end with SUCCESS once it has emitted the ask.
    rationale: >
      The behavior is divided at the question rather than paused there, which is
      what makes an asynchronous exchange hostable in a single-shot executor.
    verification: >
      A gated tree whose ask branch fires returns SUCCESS and the ask appears in
      the emitting actor's outbox.
    adr:
    - ADR-0080
  - id: ASK-01-006
    priority: MUST_NOT
    kind: architecture
    statement: >-
      Code that reads a behavior's SUCCESS at an ask point MUST NOT treat it as
      authorization granted. That SUCCESS means only that the ask was emitted.
    rationale: >-
      The behavior ends when it has asked, before any answer exists, so its SUCCESS
      carries no answer. Reading it as a grant would let the asker authorize itself.
    verification: >-
      A gated tree whose ask branch fires returns SUCCESS while the gated action
      has no effect.
    relationships:
    - rel_type: derives_from
      spec_id: ASK-01-002
    adr:
    - ADR-0080
  - id: ASK-01-003
    priority: MUST_NOT
    kind: architecture
    statement: >
      A BT node MUST NOT return RUNNING to represent waiting for an external
      reply.
    rationale: >
      `BTBridge.execute_tree` treats root RUNNING as "continue ticking", exhausts
      its iteration budget, logs ERROR and returns FAILURE, then discards the
      tree; no tree survives an invocation, so no node can be resumed.
    verification: >
      A repository-wide search finds no `return Status.RUNNING` in `vultron/`.
    adr:
    - ADR-0080
    tags:
    - behavior-tree
  - id: ASK-01-004
    stories:
    - story_2022_048
    - story_2022_053
    priority: MUST
    kind: protocol
    statement: >-
      An actor MUST determine the action that a reply authorizes from the ask the
      reply answers, not from the content of the reply.
    rationale: >
      Generalizes ADR-0026's trust rule; reading the action from the reply lets
      the answerer unilaterally alter what it authorizes.
    verification: >
      A reply whose embedded object differs from the stored ask's object does not
      change the action performed.
    adr:
    - ADR-0080
    - ADR-0026
    tags:
    - security
- id: ASK-02
  title: Conversation-State Routing
  description: >
    A gated interaction is one tree that determines where the conversation stands
    before taking any action.
  specs:
  - id: ASK-02-001
    priority: MUST
    kind: architecture
    statement: >
      A tree implementing a gated interaction MUST determine the state of the
      ask/reply exchange before executing any branch that produces a protocol
      effect.
    rationale: >
      State-first routing is what makes repeated entry safe without relying on
      per-node duplicate detection.
    verification: >
      Inspection of a gated tree confirms the state-determining nodes precede
      every effect-producing branch.
    adr:
    - ADR-0080
    tags:
    - behavior-tree
  - id: ASK-02-002
    priority: MUST
    kind: architecture
    statement: >
      The branches of a gated interaction tree MUST be mutually exclusive, such
      that at most one branch is applicable for any state of the exchange.
    rationale: >
      Disjoint branches mean a later entry does not re-attempt work an earlier
      entry completed, so no idempotency guard is required to abort it.
    verification: >
      For each state of the exchange, exactly one branch of the tree executes.
    adr:
    - ADR-0080
    tags:
    - behavior-tree
    - idempotency
  - id: ASK-02-003
    stories:
    - story_2022_053
    - story_2022_074
    priority: MUST
    kind: protocol
    statement: >
      When an ask for the same kind and subject is already outstanding and
      unexpired, the actor MUST NOT emit a second ask.
    rationale: >
      Re-asking an open question produces duplicate decisions for the answerer
      and duplicate register entries for the asker.
    verification: >
      A second entry into a gated tree while an unexpired ask is outstanding adds
      no activity to the outbox.
    adr:
    - ADR-0080
  - id: ASK-02-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT decide whether a gated action is authorized from its record of
      outstanding asks, but only from the case ledger.
    rationale: >
      The register is a working set that may be rebuilt or corrupted; making it
      authoritative for authorization would let a forged entry permit an action.
    verification: >
      An architecture test confirms no gate node reads an outstanding-ask
      register.
    adr:
    - ADR-0080
    tags:
    - security
    stories:
    - story_2026_034
  - id: ASK-02-005
    stories:
    - story_2026_038
    - story_2022_053
    priority: MUST
    kind: protocol
    statement: >-
      While an ask for authorization (ASK-01-001) is outstanding, the asking actor
      MUST leave the case in a state the protocol defines.
    rationale: >
      An ask suspends nothing, so the case sits in the pre-authorization state
      for the whole deadline; that state must be legitimate.
    verification: >
      For each gated action, the state after the ask branch runs is a defined
      protocol state.
    adr:
    - ADR-0080
    tags:
    - state-machine
    relationships:
    - rel_type: uses_definition
      spec_id: ASK-01-001
  - id: ASK-02-006
    stories:
    - story_2026_038
    - story_2022_053
    priority: MUST
    kind: protocol
    statement: >-
      An actor MUST refuse, not ask about, an action whose not-yet-authorized state
      the protocol cannot represent.
    rationale: >-
      Asking would leave the case in an undefined state for the whole ask deadline
      (ASK-02-005), so such an action can only be refused.
    verification: >-
      For each gated action, the ask branch runs only where the not-yet-authorized
      state is a defined protocol state.
    relationships:
    - rel_type: derives_from
      spec_id: ASK-02-005
    adr:
    - ADR-0080
    tags:
    - state-machine
- id: ASK-03
  title: Ask Kinds
  description: >
    Each kind of ask declares the replies that close it, its expiry consequence,
    and a default deadline.
  specs:
  - id: ASK-03-001
    stories:
    - story_2022_010
    - story_2022_048
    priority: MUST
    kind: protocol
    statement: >
      Each ask kind MUST declare the set of reply semantic types that close it.
    rationale: >
      Pairing a reply to an ask requires a declared closing set rather than
      hard-coded reply names at call sites; `ProtocolPair` already carries this
      field.
    verification: >
      Every registered ask kind exposes a non-empty set of closing reply event
      types.
    adr:
    - ADR-0080
  - id: ASK-03-002
    stories:
    - story_2022_032
    - story_2022_074
    priority: MUST
    kind: protocol
    statement: >
      Each ask kind MUST declare whether a reply arriving after the ask's
      deadline authorizes the action (stale) or does not (void).
    rationale: >
      Admitting a participant remains useful when authorized late; adopting a
      case status does not, because the case state the decision was made against
      has moved on.
    verification: >
      Every registered ask kind declares an expiry consequence.
    adr:
    - ADR-0080
    tags:
    - security
  - id: ASK-03-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The expiry consequence of an ask kind MUST NOT be deployment-configurable.
    rationale: >
      Two actors disagreeing about whether a late reply authorized an action is a
      divergence in canonical case state, not a deployment preference.
    verification: >
      No configuration key sets an ask kind's expiry consequence.
    adr:
    - ADR-0080
    tags:
    - security
    - configuration
    stories:
    - story_2026_034
  - id: ASK-03-009
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An ask activity MUST NOT carry the expiry consequence of its ask kind.
    rationale: >-
      Letting the asker declare the expiry consequence would let it extend its own
      authorization, and two actors could then disagree about a late reply.
    verification: >-
      No ask activity field carries the expiry consequence.
      `test/architecture/test_protocol_asks_specs.py`
      (`test_expiry_consequence_is_not_deployment_configurable`) checks the AS2
      object fields.
    relationships:
    - rel_type: extends
      spec_id: ASK-03-003
    adr:
    - ADR-0080
    tags:
    - security
    stories:
    - story_2026_034
  - id: ASK-03-004
    stories:
    - story_2022_032
    - story_2022_074
    priority: MUST
    kind: protocol
    statement: >
      An ask activity MUST carry its own deadline in the AS2 `endTime` field.
    rationale: >
      Placing the deadline on the wire means the answerer reads the same value as
      the asker, so a configurable duration cannot cause disagreement.
    verification: >
      Every emitted ask activity has a non-null `endTime`.
    adr:
    - ADR-0080
    tags:
    - wire-format
  - id: ASK-03-005
    priority: MUST
    kind: project
    statement: >
      The default deadline duration for each ask kind MUST be configurable
      through `ActorConfig`, with a documented fallback default for kinds that
      declare no override.
    rationale: >
      Urgency differs by kind and by deployment; the duration is safe to
      configure because it travels on the wire (ASK-03-004).
    verification: >
      `ActorConfig` exposes a per-kind deadline mapping and a fallback default.
    adr:
    - ADR-0080
    tags:
    - configuration
  - id: ASK-03-006
    priority: MUST_NOT
    kind: protocol
    statement: >
      An action gated by an ask whose kind declares void expiry MUST NOT be
      performed on the strength of a reply recorded after the ask's deadline.
    rationale: >
      An authorization granted against a case state that no longer holds is a
      standing permission, which is the hazard ADR-0026's trust rule addresses in
      the identity dimension.
    verification: >
      With a void-expiry ask past its deadline and an Accept recorded, the gated
      action does not execute.
    adr:
    - ADR-0080
    - ADR-0026
    tags:
    - security
    stories:
    - story_2026_034
  - id: ASK-03-007
    priority: MUST
    kind: protocol
    statement: >
      `Invite(EmbargoEvent)` is an ask kind. Its closing replies are
      `Accept(Invite(EmbargoEvent))` and `Reject(Invite(EmbargoEvent))` from the
      invitee; its deadline is the Invite's `endTime` (CM-28-001, CM-28-012); its
      expiry consequence is stale, not void: a reply after the deadline is still
      honoured under EMB-17 once the expiry has been recorded as `TIMED_OUT`
      (CM-28-004).
    rationale: >
      The embargo invitation already has every property an ask kind declares,
      and the relay (EP-09) emits one per participant per proposal, so the
      outstanding-ask register must track it without a special case. Declaring
      the kind here keeps `find_protocol_pair`'s one-open-request assumption from
      being applied to N simultaneous Invites of one semantic type.
    verification: >
      The ask-kind registry, when it lands (#2884), declares this kind with the
      two closing reply types and stale expiry; until then a strict `xfail`
      names the tracking issue.
    adr:
    - ADR-0080
    - ADR-0113
    stories:
    - story_2026_006
    relationships:
    - rel_type: uses_definition
      spec_id: CM-28-001
    - rel_type: uses_definition
      spec_id: CM-28-004
    see_also:
    - spec_id: CM-28-012
      reason: 'context for the reader'
  - id: ASK-03-008
    priority: MUST
    kind: protocol
    statement: >
      `Invite(Actor)[target=VulnerabilityCaseStub]` (the stub Invite) is an ask kind.
      Its closing
      replies are `Accept(Invite(Actor)[target=VulnerabilityCaseStub])` and
      `Reject(Invite(Actor)[target=VulnerabilityCaseStub])` from the invitee; its
      deadline is
      the Invite's `endTime` (CM-11-014); its expiry consequence is stale, not
      void: expiry only means the CASE_MANAGER stops waiting, so a reply that
      arrives after the deadline is processed like a live one (an `Accept`
      joins the invitee, a `Reject` closes the record). Expiry closes the ask
      only; it writes no participant state and refuses no later reply
      (CM-11-014).
    note: >
      A strict mode that refuses a reply after expiry (void) is a possible later
      addition. It is not built, and no setting selects it.
    rationale: >
      The hazard a late `Accept` could carry is joining on stale embargo terms,
      and the supersede rule already covers it: an embargo change or a re-invite
      replaces the stub, naming the old one in `inReplyTo`, and an `Accept` of a
      superseded stub is refused (CM-11-045). Voiding a late reply would add no
      protection and would turn away an invitee that answered after the CASE_MANAGER
      stopped waiting.
    verification: >
      A test lets a stub Invite expire and finds the record unchanged, a late
      `Accept` joining the invitee and a late `Reject` closing the record, and
      finds the declared closing replies and stale expiry.
    adr:
    - ADR-0080
    - ADR-0114
    stories:
    - story_2022_032
    - story_2022_074
    relationships:
    - rel_type: uses_definition
      spec_id: CM-11-014

- id: ASK-04
  title: Outstanding-Ask Register
  description: >
    A durable, actor-scoped record of asks outstanding in both directions.
  specs:
  - id: ASK-04-001
    priority: MUST
    kind: architecture
    statement: >-
      An actor MUST record an entry in its outstanding-ask register when it emits an
      ask.
    rationale: >
      The asker needs the entry to avoid re-asking and to notice expiry.
    verification: >
      Emitting an ask produces a register entry in the emitting actor's store.
    adr:
    - ADR-0080
  - id: ASK-04-011
    priority: MUST
    kind: architecture
    statement: >-
      An actor MUST record an entry in its outstanding-ask register when it receives
      an ask addressed to it.
    rationale: >-
      The answerer's entries are the queue of decisions it owes, which is the
      surface a human, UI, or agent acts through.
    verification: >-
      Receiving an ask produces a register entry in the receiving actor's store.
    relationships:
    - rel_type: extends
      spec_id: ASK-04-001
    adr:
    - ADR-0080
  - id: ASK-04-002
    priority: MUST
    kind: architecture
    statement: >
      An outstanding-ask register entry MUST be removed when a reply that closes
      its ask is recorded.
    rationale: >
      Presence in the register means outstanding, which keeps the working set
      small and the invariant checkable; history lives in the case ledger.
    verification: >
      Recording a closing reply removes the corresponding register entry.
    adr:
    - ADR-0080
  - id: ASK-04-003
    priority: MUST
    kind: architecture
    statement: >
      The outstanding-ask register MUST be durable across process restarts.
    rationale: >
      An in-memory register would orphan every outstanding ask on restart,
      producing a permanent stall worse than the one the register prevents.
    verification: >
      Register entries written before a restart are readable after it.
    adr:
    - ADR-0080
    tags:
    - persistence
  - id: ASK-04-004
    priority: MUST
    kind: architecture
    statement: >
      The outstanding-ask register MUST be actor-scoped rather than case-scoped,
      so that asks exchanged before a case exists are recorded.
    rationale: >
      Pre-case handshakes such as `Create(CaseProposal)` have no case ledger to
      derive state from; `VultronOfferRecord` already demonstrates the
      actor-scoped form.
    verification: >
      An ask emitted before any case exists produces a readable register entry.
    adr:
    - ADR-0080
  - id: ASK-04-005
    priority: MUST
    kind: architecture
    statement: >
      The outstanding-ask register MUST support enumeration of an actor's
      outstanding asks in each direction, without the caller supplying the
      identity of a specific ask.
    rationale: >
      Reaping deadlines and presenting a decision queue both require listing
      entries; a keyed query cannot answer "what am I waiting on".
    verification: >
      Enumeration returns all outstanding entries for an actor, separable by
      direction.
    adr:
    - ADR-0080
  - id: ASK-04-006
    priority: MUST
    kind: architecture
    statement: >-
      The outstanding-ask register MUST be reconstructible from the case ledger for
      case-scoped asks.
    rationale: >
      A register that cannot be rebuilt makes lost entries unrecoverable.
    verification: >
      A register rebuilt from the ledger yields the same outstanding case-scoped
      entries as the maintained register.
    adr:
    - ADR-0080
  - id: ASK-04-012
    priority: MUST
    kind: architecture
    statement: >-
      Where the outstanding-ask register and the case ledger disagree, the actor MUST
      treat the case ledger as authoritative.
    rationale: >-
      The register is an index and the ledger is the authority, the same division
      that governs `actor_participant_index`.
    verification: >-
      A register entry that the ledger contradicts gives way to the ledger's record
      when the register is rebuilt from the ledger.
    relationships:
    - rel_type: extends
      spec_id: ASK-04-006
    adr:
    - ADR-0080
  - id: ASK-04-007
    priority: MUST
    kind: architecture
    statement: >
      The create, close-on-named-event, and time-out lifecycle shared by
      outstanding-ask tracking and pending-assertion suppression MUST be
      implemented once as a reusable register, instantiated separately for each
      use.
    rationale: >
      Both uses already share `ProtocolPair` as their key type and both need
      reaping and enumeration; two implementations of one lifecycle drift.
    verification: >
      The ask register and the pending-assertion store are instances of one
      register implementation.
    adr:
    - ADR-0080
  - id: ASK-04-008
    priority: MUST
    kind: architecture
    statement: >
      Registration of an emitted ask MUST occur on the single shared emit path,
      so that no call site can emit an ask without recording it.
    rationale: >
      Registration that each call site must remember to perform is registration
      that will be forgotten; the wire factory cannot do it because the wire
      layer has no DataLayer access.
    verification: >
      Every emitted ask has a register entry, with no per-call-site registration
      code.
    adr:
    - ADR-0080
  - id: ASK-04-009
    priority: MUST
    kind: architecture
    statement: >
      An actor MUST expose its outstanding asks as a dereferenceable
      ActivityStreams collection in each direction.
    rationale: >
      A collection is the ActivityStreams idiom for the set of things belonging
      to an actor, so no new activity verb is needed to answer "what decisions do
      I owe"; the answerer already holds the underlying data in its ledger
      replica.
    verification: >
      Each direction is retrievable as an `OrderedCollection` of outstanding
      asks.
    adr:
    - ADR-0080
    tags:
    - wire-format
  - id: ASK-04-010
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the CASE_MANAGER relaying an ask on a participant's behalf
      (CM-24-001, CM-24-002; EP-09-002). It MUST record each relayed ask in its own
      outstanding-ask register as the asker.
    rationale: >
      ASK-04-001 says the emitter records; a relayed Invite's `actor` is the
      CASE_MANAGER with the proposer in `attributedTo`, so the manager is the
      emitter and the one that owes the bookkeeping.
    verification: >
      When the register lands, a relay test asserts the CASE_MANAGER's register
      holds one outgoing entry per relayed Invite; until then a strict `xfail`
      names the tracking issue.
    adr:
    - ADR-0080
    - ADR-0113
    stories:
    - story_2026_006
    relationships:
    - rel_type: uses_definition
      spec_id: CM-24-001
    see_also:
    - spec_id: CM-24-002
      reason: 'context for the reader'
    - spec_id: EP-09-002
      reason: 'context for the reader'
  - id: ASK-04-013
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant whose proposal the CASE_MANAGER relays MUST NOT record the relayed
      Invites in its outstanding-ask register. It records only its own proposal to the
      CASE_MANAGER.
    rationale: >-
      The participant did not emit the relayed Invites (ASK-04-001). Giving it a
      register entry for each one would let it reap or re-ask on the manager's
      behalf.
    verification: >-
      When the register lands, a relay test asserts the proposer's register holds
      only its proposal; until then a strict `xfail` names the tracking issue.
    relationships:
    - rel_type: extends
      spec_id: ASK-04-010
    adr:
    - ADR-0080
    - ADR-0113
    stories:
    - story_2026_006

- id: ASK-05
  title: Expiry and Reaping
  description: >
    How an expired ask is noticed, given that elapsed time is not an event.
  specs:
  - id: ASK-05-001
    priority: MUST
    kind: architecture
    statement: >
      A gated interaction tree MUST treat an outstanding ask past its deadline as
      expired at the next entry into the tree, without requiring a prior reaping
      pass.
    rationale: >
      Time passing delivers no message, so opportunistic evaluation is the only
      mechanism guaranteed to run; a peer's own retry is frequently the clock.
    verification: >
      Entering a gated tree with an expired outstanding ask takes the expired
      branch.
    adr:
    - ADR-0080
  - id: ASK-05-002
    priority: MUST
    kind: project
    statement: >
      The system MUST expose a general-purpose trigger that reaps expired
      outstanding asks for an actor.
    rationale: >
      Reaping is a Sentinel concern, and a Sentinel operates on the call-in
      surface with no BT call-out point, so the reaper belongs outside core.
    verification: >
      A trigger endpoint exists that transitions expired entries and is mounted
      in production mode.
    adr:
    - ADR-0080
    tags:
    - observability
  - id: ASK-05-003
    priority: MUST_NOT
    kind: architecture
    statement: >
      Reaping expired asks MUST NOT be implemented as a periodic loop inside
      core.
    rationale: >
      A timer-driven reaper inside core makes expiry behaviour observable only by
      waiting, which EDF-06-001 forbids treating as evidence, and misplaces a
      call-in concern.
    verification: >
      No core module schedules periodic expiry evaluation.
    adr:
    - ADR-0080
  - id: ASK-05-004
    stories:
    - story_2022_032
    - story_2022_074
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Reaping an expired ask MUST NOT re-emit it automatically.
    rationale: >
      Mirrors CLP-06-005 — a timeout is a signal, not an instruction to retry.
    verification: >
      Reaping an expired ask adds no activity to the outbox.
    adr:
    - ADR-0080
  - id: ASK-05-005
    stories:
    - story_2022_032
    - story_2022_074
    priority: MUST
    kind: protocol
    statement: >-
      After an ask expires, the actor MUST re-ask only when it decides anew to perform
      the gated action.
    rationale: >-
      The tree owns the decision because only it knows whether the action is still
      wanted.
    verification: >-
      After a reap, a new ask is emitted only by a fresh run of the gated tree.
    relationships:
    - rel_type: extends
      spec_id: ASK-05-004
    adr:
    - ADR-0080
- id: ASK-06
  title: Ask Visibility
  description: >
    Asks replicate like any other canonical entry, which constrains what they may
    carry.
  specs:
  - id: ASK-06-001
    stories:
    - story_2022_041
    - story_2026_069
    priority: MUST
    kind: protocol
    statement: >-
      A case-scoped ask MUST be recorded as a canonical `CaseLedgerEntry`.
    rationale: >
      An outstanding decision, and a stalled one, is protocol-relevant to every
      participant.
    verification: >
      An emitted case-scoped ask appears as a recorded entry.
    adr:
    - ADR-0080
  - id: ASK-06-003
    stories:
    - story_2022_041
    - story_2026_075
    priority: MUST
    kind: protocol
    statement: >-
      The ledger entry of a case-scoped ask MUST replicate to case participants on
      the normal fan-out path.
    rationale: >-
      Every participant needs to see an outstanding decision. A directed-delivery
      variant would require redaction with proofs, which does not exist.
    verification: >-
      An emitted case-scoped ask is announced to participants.
    relationships:
    - rel_type: extends
      spec_id: ASK-06-001
    adr:
    - ADR-0080
  - id: ASK-06-002
    priority: MUST_NOT
    kind: protocol
    statement: >
      An ask MUST NOT carry content that cannot be disclosed to every
      participant of its case.
    rationale: >
      Asks replicate to all participants (ASK-06-001), so private rationale must
      travel by a directed `Note` instead.
    verification: >
      Ask factories accept no field intended for restricted disclosure.
    adr:
    - ADR-0080
    tags:
    - security
    stories:
    - story_2022_044
- id: ASK-07
  title: Processing Faults
  description: >
    How a receiver tells an authenticated sender that it could not process what
    was sent.
  specs:
  - id: ASK-07-001
    stories:
    - story_2022_039
    - story_2022_077
    priority: MUST
    kind: protocol
    statement: >
      An actor that cannot process an inbound activity from an authenticated
      sender MUST notify that sender by emitting `Create(ProcessingFault)`.
    rationale: >
      Without a notice, a failure that took milliseconds costs the sender its
      full ask deadline in silence.
    verification: >
      An authenticated sender whose activity is dead-lettered or rejected
      receives a `Create(ProcessingFault)`.
    adr:
    - ADR-0080
    - ADR-0049
    tags:
    - error-handling
  - id: ASK-07-002
    priority: MUST_NOT
    kind: protocol
    statement: >
      An actor MUST NOT emit a processing fault in response to an inbound
      activity whose sender is not authenticated, or whose failure occurred
      before authentication.
    rationale: >
      Explaining a parse or validation failure to an unauthenticated sender is a
      parser oracle, and an unauthenticated sender identity cannot be trusted as
      a reply address.
    verification: >
      Unauthenticated malformed input produces no outbound activity.
    adr:
    - ADR-0080
    tags:
    - security
    stories:
    - story_2026_035
  - id: ASK-07-003
    stories:
    - story_2022_039
    priority: MUST
    kind: protocol
    statement: >
      `ProcessingFault` MUST be a single dedicated object type carrying a
      machine-readable failure class, rather than a reason field on an existing
      reply activity.
    rationale: >
      SE-08-003 prefers a dedicated object type over field-level discrimination;
      `Reject` additionally presupposes a rejectable object, which unreadable
      traffic does not provide.
    verification: >
      A registered `ProcessingFault` object type exists with a required failure
      class, and its pattern does not compete with reply patterns.
    adr:
    - ADR-0080
    tags:
    - wire-format
  - id: ASK-07-004
    stories:
    - story_2022_039
    priority: MUST
    kind: protocol
    statement: >-
      `ProcessingFault` MUST identify the activity that failed by reference.
    rationale: >
      A reference names the failed activity without the receiver having to rebuild
      or echo it.
    verification: >
      A `ProcessingFault` declares a field that references the failed activity.
    adr:
    - ADR-0080
  - id: ASK-07-012
    stories:
    - story_2022_039
    priority: MUST_NOT
    kind: protocol
    statement: >-
      `ProcessingFault` MUST NOT require an inline copy of the activity that failed.
    rationale: >-
      When a payload fails validation, a typed copy of it cannot be constructed —
      constructing it is what failed — and echoing sender-supplied content is a
      reflection hazard.
    verification: >-
      `test/architecture/test_protocol_asks_specs.py`
      (`test_processing_fault_validates_without_an_inline_failed_activity`)
      confirms a `ProcessingFault` validates without an inline failed activity.
    relationships:
    - rel_type: extends
      spec_id: ASK-07-004
    adr:
    - ADR-0080
  - id: ASK-07-005
    stories:
    - story_2022_036
    - story_2022_039
    priority: MUST
    kind: protocol
    statement: >-
      Each failure class of `ProcessingFault` MUST be identified by a URI minted in
      the Vultron namespace.
    rationale: >
      A URI-identified, dereferenceable problem type is extensible without a
      schema change and lets a receiver that does not recognise a class resolve
      its meaning.
    verification: >
      `test/architecture/test_protocol_asks_specs.py`
      (`test_failure_classes_are_uris_in_the_vultron_namespace`) confirms each
      failure class is a URI under the Vultron namespace.
    adr:
    - ADR-0080
    - ADR-0069
    tags:
    - wire-format
  - id: ASK-07-013
    stories:
    - story_2022_036
    - story_2022_039
    priority: MUST
    kind: protocol
    statement: >-
      A `ProcessingFault` MUST be structured according to RFC 9457 Problem Details.
    rationale: >-
      RFC 9457 is the standard for machine-readable error reporting over HTTP.
    verification: >-
      Fault payloads carry the RFC 9457 members.
    relationships:
    - rel_type: extends
      spec_id: ASK-07-005
    adr:
    - ADR-0080
    - ADR-0069
    tags:
    - wire-format
  - id: ASK-07-006
    priority: MUST_NOT
    kind: protocol
    statement: >
      `ProcessingFault` MUST NOT carry implementation diagnostics such as stack
      traces, parser internals, or the identity of the failing code path.
    rationale: >
      Faults replicate to all case participants and are also read by an
      untrusted-by-default peer; the diagnosis of a failure belongs in the
      actor's own log, governed by `specs/structured-logging.yaml`.
    verification: >
      The `ProcessingFault` schema admits no field for implementation
      diagnostics.
    adr:
    - ADR-0080
    tags:
    - security
    - logging
    stories:
    - story_2026_035
  - id: ASK-07-007
    stories:
    - story_2022_039
    - story_2022_074
    priority: MUST
    kind: protocol
    statement: >
      Receiving a processing fault that refers to an outstanding ask MUST close
      that ask's register entry.
    rationale: >
      The exchange cannot complete, so leaving the entry open costs the asker its
      whole deadline for a failure already reported.
    verification: >
      A fault naming an outstanding ask removes the corresponding register entry.
    adr:
    - ADR-0080
  - id: ASK-07-008
    stories:
    - story_2026_069
    - story_2022_074
    priority: MUST
    kind: protocol
    statement: >
      A processing fault that can be attributed to a case MUST be recorded as a
      canonical `CaseLedgerEntry`, unless it reports a failure to apply a
      `CaseLedgerEntry`, which SYNC-16-002 keeps out of the ledger.
    rationale: >
      The statement that a message arrived and could not be processed is true,
      legible protocol history, and it explains why a subsequent retransmission
      occurred; it is not per-actor observability content, so CLP-07-004 does not
      exclude it. A fault about applying a ledger entry is replication signalling
      instead: ledgering it loops, because the replica that sent it cannot apply the
      entry that records it. Whether the remaining faults belong in the ledger at
      all is an open question (#4800).
    verification: >
      A case-attributable fault appears as a recorded entry in the case ledger, and a
      fault SYNC-16-002 excludes does not.
    adr:
    - ADR-0080
    - ADR-0142
  - id: ASK-07-009
    priority: MUST_NOT
    kind: protocol
    statement: >
      The activity that could not be processed MUST NOT be recorded as a
      canonical `CaseLedgerEntry`.
    rationale: >
      There is no legible assertion to record; a snapshot of an unreadable
      payload cannot satisfy CLP-02-003, and CLP-03-002 already excludes
      unrouteable inbound from the ledger.
    verification: >
      No ledger entry is committed for an activity that failed processing.
    adr:
    - ADR-0080
    stories:
    - story_2026_023
  - id: ASK-07-010
    stories:
    - story_2022_039
    - story_2022_077
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a receiver that fails on its own internal error while it
      processes an inbound activity from an authenticated sender. The receiver MUST
      answer that sender with an internal-error `Create(ProcessingFault)`. It sends the
      fault only after it has undone every change the failed processing made.
    rationale: >
      A failed received act keeps only intake's archive (CLP-07-015), and the
      inbox answered before processing, so without this fault the sender waits
      out its ask deadline in silence. Emitting after the rollback keeps the
      fault from being undone with the act. ASK-07-008 decides whether the fault
      is ledgered, as for any fault.
    verification: >
      A received act whose consequence raises through the inbox leaves one
      queued `Create(ProcessingFault)` to the sender with the internal-error
      class and no diagnostics.
    adr:
    - ADR-0080
    - ADR-0151
    relationships:
    - rel_type: refines
      spec_id: ASK-07-001
    tags:
    - error-handling
  - id: ASK-07-014
    stories:
    - story_2022_039
    - story_2022_077
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiver MUST NOT answer a failure that it will retry until it stops retrying
      that failure.
    rationale: >-
      Answering only when no retry follows keeps a retry that later succeeds from
      sending a false fault that closes the ask early (ASK-07-007).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_queue_drain.py`
      (`test_a_failing_replay_is_answered_only_when_dead_lettered`,
      `test_a_retry_that_succeeds_is_never_answered`) confirms a deferred activity
      whose replay raises queues no fault while it is re-queued, and one fault when
      it is dead-lettered.
    relationships:
    - rel_type: extends
      spec_id: ASK-07-010
    adr:
    - ADR-0080
    tags:
    - error-handling
  - id: ASK-07-015
    stories:
    - story_2022_039
    - story_2022_077
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A repeated failure of the same activity MUST NOT produce a second fault. A fault
      sent again carries the identifier of the first.
    rationale: >-
      One fault per failed activity answers the sender once, however often the
      activity fails.
    verification: >-
      `test/adapters/driving/fastapi/test_failed_act_redelivery.py`
      (`test_a_failed_proposal_is_applied_when_posted_again`) confirms a second
      failing delivery of the same body builds no new fault and queues at most the
      same fault again, with the same id and body.
    relationships:
    - rel_type: extends
      spec_id: ASK-07-010
    adr:
    - ADR-0080
    tags:
    - error-handling
  - id: ASK-07-011
    priority: MUST
    kind: project
    statement: >-
      In this implementation, the inbox MUST send the fault of ASK-07-010 when the
      received use case dispatched for an activity raises. This holds for every use
      case, not only for the trees that commit an act.
    rationale: >
      The receiver's internal failure is a raise out of the use case, and the
      inbox is the one place every dispatch passes through, so answering there
      covers every use case at once.
    verification: >
      `test/core/behaviors/inbox/test_process_payload.py::TestARaisedDispatchIsAnsweredWithAFault::test_the_sender_gets_one_internal_error_fault`
      confirms a raising use case is answered with one internal-error fault.
    relationships:
    - rel_type: implements
      spec_id: ASK-07-010
    tags:
    - error-handling
  - id: ASK-07-016
    priority: MUST
    kind: project
    statement: >-
      The inbox MUST queue the fault of ASK-07-010 after the DataLayer transaction
      that the act opened has rolled back.
    rationale: >-
      A fault queued inside the rolled-back transaction would be undone with the act.
    verification: >-
      `test/adapters/driving/fastapi/test_failed_act_redelivery.py::test_a_failed_proposal_is_applied_when_posted_again`
      confirms a failing delivery keeps nothing of the act and still leaves its
      fault queued.
    relationships:
    - rel_type: implements
      spec_id: ASK-07-010
    tags:
    - error-handling
  - id: ASK-07-017
    priority: MUST
    kind: project
    statement: >-
      The inbox MUST answer a deferred activity replayed from the pending queue
      (IE-06-004) only when that activity is dead-lettered.
    rationale: >-
      A replay that fails is retried until it is dead-lettered, so the dead-letter
      step is the first point at which no retry follows (ASK-07-014).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_queue_drain.py::test_a_failing_replay_is_answered_only_when_dead_lettered`
      confirms a deferred replay is answered only on dead-lettering.
    relationships:
    - rel_type: implements
      spec_id: ASK-07-014
    - rel_type: uses_definition
      spec_id: IE-06-008
    - rel_type: uses_definition
      spec_id: IE-06-004
    tags:
    - error-handling
  - id: ASK-07-018
    priority: MUST
    kind: project
    statement: >-
      The inbox MUST derive the fault id from the failed activity's id and the failure
      class.
    rationale: >-
      A derived id makes a repeated failure rebuild the same fault, so the sender is
      answered once (ASK-07-015).
    verification: >-
      `test/adapters/driving/fastapi/test_failed_act_redelivery.py::test_a_failed_proposal_is_applied_when_posted_again`
      confirms two failing deliveries of one body keep nothing and are answered
      with one fault.
    relationships:
    - rel_type: implements
      spec_id: ASK-07-015
    tags:
    - error-handling
- id: ASK-08
  title: Lost-Reply Recovery
  description: >
    What an answerer does when a request is repeated because its reply was lost.
  specs:
  - id: ASK-08-001
    stories:
    - story_2022_010
    - story_2022_053
    priority: MUST
    kind: protocol
    statement: >
      An actor that receives a duplicate request it has already replied to MUST
      re-send its stored reply unchanged, with its original identity, rather than
      producing a new reply.
    rationale: >
      Re-sending the frozen original (VM-08-003) reads to the requester as the
      original arriving late rather than a second decision, which is what
      CP-05-012's irrevocability rule requires.
    verification: >
      A duplicate request produces an outbound reply identical to the stored
      original, including its identifier.
    adr:
    - ADR-0080
  - id: ASK-08-002
    priority: MUST_NOT
    kind: protocol
    statement: >
      An actor that receives a duplicate request it has already replied to MUST
      NOT create a second instance of the object the request concerned.
    rationale: >
      A repeated proposal after acceptance is a re-send, not a new request;
      treating it as new produces duplicate cases or duplicate participants.
    verification: >
      A duplicate `Create(CaseProposal)` after acceptance creates no second case.
    adr:
    - ADR-0080
    tags:
    - idempotency
    stories:
    - story_2026_014
