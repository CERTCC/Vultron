id: DOCBW
title: Docs Build and Link Check Workflow
description: >-
  Requirements for the GitHub Actions workflow that verifies the MkDocs site
  builds cleanly and that all links in the published documentation are valid.
  The workflow lives at `.github/workflows/docs-build-check.yml`.
  It is distinct from `python-app.yml` (Python unit tests and linting) and
  `.github/workflows/demo-integration.yml` (demo container integration tests,
  specified in `specs/demo-ci.yaml`).
version: 1.2.0
scope:
  - prototype
  - production
tags:
- ci-cd
- documentation
groups:
  - id: DOCBW-01
    title: Workflow File Name and Display Name
    specs:
      - id: DOCBW-01-001
        priority: MUST
        kind: project
        statement: >-
          The workflow file MUST be named
          `.github/workflows/docs-build-check.yml`.
      - id: DOCBW-01-002
        priority: MUST
        kind: project
        statement: >-
          The workflow `name:` field MUST be `Docs Build and Link Check`.

  - id: DOCBW-02
    title: Trigger Conditions
    specs:
      - id: DOCBW-02-001
        priority: MUST
        kind: project
        statement: >-
          The workflow MUST trigger on `pull_request` events whose changed
          paths include at least one of: `docs/**`, `mkdocs.yml`,
          `pyproject.toml`, `uv.lock`, or the workflow file itself
          (`.github/workflows/docs-build-check.yml`).
        rationale: >-
          These are the files that can break the site build or introduce
          broken links. Changes limited to `plan/`, `specs/`, `notes/`, or
          other non-site markdown do not affect the built site and MUST NOT
          trigger the workflow.
      - id: DOCBW-02-002
        priority: MUST
        kind: project
        statement: >-
          The workflow MUST trigger on `workflow_dispatch` events to allow
          manual runs at any time.
      - id: DOCBW-02-003
        priority: MUST_NOT
        kind: project
        statement: >-
          The `pull_request` trigger MUST NOT use `**/*.md` as a path
          pattern, as this would cause the workflow to run on changes to
          `plan/`, `specs/`, `notes/`, and other non-site markdown files
          that have no effect on the published documentation.

  - id: DOCBW-03
    title: Job Structure
    specs:
      - id: DOCBW-03-001
        priority: MUST
        kind: project
        statement: >-
          The workflow MUST contain a single job that runs both the
          build-site and link-check phases sequentially, sharing the same
          runner filesystem to avoid artifact upload/download overhead.
      - id: DOCBW-03-002
        priority: MUST
        kind: project
        statement: >-
          The Build Site step MUST run on every workflow trigger regardless
          of which paths changed, so that Python-macro and plugin failures
          introduced by `pyproject.toml` or `mkdocs.yml` changes are always
          caught.
      - id: DOCBW-03-003
        priority: MUST
        kind: project
        statement: >-
          The Check Links step that **crawls** the built site from an entry page
          MUST carry a step-level `if:` condition that skips it unless the
          `docs_changed` filter output is `'true'`. This requirement governs
          that step only, and it is not the project's position on internal
          references as such: those are checked unconditionally and over the
          whole tree by DOCBW-03-007, which subsumes this step's internal
          coverage.
        rationale: >-
          Crawling the entire built site is significantly slower than the build
          step alone, so running it on every trigger (e.g., `pyproject.toml`
          bumps) wastes CI time. The scope limit matters because this clause
          otherwise reads as licensing a `docs_changed` skip on internal
          reference checking generally — which would contradict DOCBW-03-007.
          It does not: it governs the crawl, whose coverage is bounded by
          reachability from its entry page and is therefore strictly narrower
          than the whole-tree resolution check. Note that `linkchecker` does not
          resolve external URLs unless `--check-extern` is passed, which the
          project does not pass; if an external check is ever added, its cost is
          a network request per outbound link and this condition applies to it
          for that separate reason.
      - id: DOCBW-03-004
        priority: SHOULD
        kind: project
        statement: >-
          The workflow SHOULD validate that maintainer-focused docs remain
          buildable. Pages under `docs/developer/` are declared as `draft_docs`
          in `mkdocs.yml` and are served by `mkdocs serve` but excluded from
          production builds; CI validates the production build only.
        rationale: >-
          The former `mkdocs.dev.yml` overlay build was removed when
          `docs/developer/` was moved from `exclude_docs` to `draft_docs`.
          Draft pages are excluded from `mkdocs build` regardless of config
          file, so a separate dev-overlay CI step no longer provides value.
      - id: DOCBW-03-005
        priority: MUST
        kind: project
        statement: >-
          A withheld-artifact step MUST run after the Build Site step and MUST
          fail the workflow when any artifact declared withheld produced files
          in `site/`. It MUST also fail when `site/` is absent or empty, and
          when a withheld declaration matches no file in the source tree.
        rationale: >-
          A decision not to publish is a claim, and nothing compared it to the
          build output. `docs/ns/index.md` carried `draft: true` — a Material
          blog-plugin key, not an MkDocs one — so it read as a suppression while
          the build published `site/ns/`. Checking the outcome rather than the
          `mkdocs.yml` mechanism also catches a mis-anchored pattern. The
          empty-`site/` and stale-declaration failures exist because a gate that
          resolves no targets and passes is worse than no gate (DF-09-009).
        verification: >-
          `uv run docs-withheld` (`vultron/metadata/docs/withheld.py`) exits
          non-zero, invoked by the `Check withheld artifacts are unpublished`
          step of `.github/actions/check-site-publication`, which
          `.github/workflows/docs-build-check.yml` runs after the build. Its logic is
          covered by `test/metadata/docs/test_withheld.py`, including the
          empty-`site/` and stale-declaration failure modes. #3555 repoints the
          declaration at the maturity manifest.
      - id: DOCBW-03-006
        priority: MUST
        kind: project
        statement: >-
          Every workflow that builds the site MUST run the DOCBW-03-005 step,
          including `.github/workflows/deploy_site.yml`, where it MUST sit
          between the build step and the Pages artifact upload.
        rationale: >-
          `deploy_site.yml` is the workflow that actually publishes: it builds
          `site/` on a push to `publish` and uploads it to Pages. A gate present
          only in the pull-request workflow does not bind the publishing path, so
          a withheld artifact reintroduced by a direct push to `publish`, or by a
          plugin or dependency change that alters the build, would ship. Placing
          the step before the upload means the deploy fails rather than
          publishing an artifact the project declared withheld.
        verification: >-
          `test/ci/test_publication_gates_in_workflows.py` asserts every
          workflow running `mkdocs build` also runs `docs-withheld` after it,
          directly or through a local composite action, and that in
          `deploy_site.yml` the step precedes `actions/upload-pages-artifact`.
      - id: DOCBW-03-007
        priority: MUST
        kind: project
        lint_suppress: [phantom_path_ref]
        statement: >-
          A reference-axis step MUST run after the Build Site step on every
          trigger, with no `docs_changed` condition, and MUST fail the workflow
          when any internal reference in the built `site/` tree resolves to a
          path the build did not produce. It MUST evaluate every built HTML file
          rather than only those reachable from an entry page, MUST fail when
          `site/` is absent or empty, and MUST run in every workflow that builds
          the site, on the same terms as DOCBW-03-006.
        rationale: >-
          DOCBW-03-005 checks the publication axis — a withheld artifact
          produced no files. The reference axis went unchecked: `docs/ns/` moving
          to `draft_docs` (#3549) left the What's New list advertising
          `../../ns/`, a well-formed path with no target (#3574). `--strict` is
          blind to it twice over: markdown-exec renders on a child `Markdown`
          instance with no relative-link treeprocessor, and a hand-written link
          to an excluded page is logged at INFO while its href is still
          rewritten. Checking *resolution* subsumes form signatures like a `.md`
          suffix. Unconditional here means no step-level `docs_changed`
          condition, which is one of two docs-scoped filters on this workflow;
          the `paths:` trigger of DOCBW-02-001 is the other and still omits
          `vultron/**`, so a PR editing only a page-enumerating generator does
          not reach this step in `docs-build-check.yml` and is first caught by
          `deploy_site.yml` after merge. Closing that half is #3070. Other
          clauses: `notes/documentation-strategy.md`.
        verification: >-
          `uv run docs-links` (`vultron/metadata/docs/links.py`) exits non-zero,
          invoked unconditionally after the build in
          `.github/workflows/docs-build-check.yml` and in
          `.github/workflows/deploy_site.yml` before the Pages upload. Its logic
          is covered by `test/metadata/docs/test_links.py` over synthetic built
          trees, including the absent-`site/` failure, a reference to a withheld
          page, a reference ending in `.md`, and a reference on a page no entry
          point links to. `test/ci/test_publication_gates_in_workflows.py` extends to
          assert the step's presence and placement.
      - id: DOCBW-03-008
        priority: MUST
        kind: project
        statement: >-
          A continuity step MUST run after the Build Site step and MUST fail the
          workflow when a URL that any earlier publish of the site served
          resolves to neither a built page nor a redirect whose chain ends at a
          built page, unless a withheld declaration (DOCBW-03-005) covers it. The
          record of served URLs MUST be committed, MUST only grow, and MUST NOT
          be derived at check time from the branch the publish replaces. The
          step MUST fail when `site/` is absent or empty or the record is empty,
          and MUST run in every workflow that builds the site on the same terms
          as DOCBW-03-006.
        rationale: >-
          Between `publish` and `main`, over a hundred pages moved or were
          withdrawn, and a publish would have 404ed each URL (#3556). `--strict`
          checks links within one build, not URLs an earlier build served. The
          record is committed because its evidence, the `publish` branch, is
          gone once `publish` advances. A withdrawn page is excluded, not
          redirected, so a retirement is not disguised as a move. Other clauses:
          `notes/documentation-strategy.md`.
        verification: >-
          `uv run docs-legacy-urls` (`vultron/metadata/docs/legacy_urls.py`)
          exits non-zero, reading the record in
          `vultron/metadata/docs/legacy_urls_baseline.txt`, invoked by the
          `Check published URLs still resolve` step of
          `.github/actions/check-site-publication`. Its logic is covered by
          `test/metadata/docs/test_legacy_urls.py` over synthetic built trees,
          including the absent-`site/` and empty-record failures, a redirect to
          an unbuilt page, a loop, and a withheld URL.
          `test/ci/test_publication_gates_in_workflows.py` asserts the step's
          presence and placement in every site-building workflow.

  - id: DOCBW-04
    title: Docs-Changed Filter Step
    specs:
      - id: DOCBW-04-001
        priority: MUST
        kind: project
        statement: >-
          A filter step MUST appear before the Build Site step. It MUST
          set a step output `docs_changed` to `true` or `false` using
          `echo "docs_changed=<value>" >> "$GITHUB_OUTPUT"`.
      - id: DOCBW-04-002
        priority: MUST
        kind: project
        statement: >-
          On `workflow_dispatch` events the filter step MUST set
          `docs_changed=true` unconditionally, ensuring that manual runs
          always execute the full link-check.
      - id: DOCBW-04-003
        priority: MUST
        kind: project
        statement: >-
          On `pull_request` events the filter step MUST use
          `git diff --name-only origin/${{ github.base_ref }}...HEAD`
          (or equivalent) to list changed files and set
          `docs_changed=true` if any path starts with `docs/`, otherwise
          `docs_changed=false`.
        rationale: >-
          Using `git diff` against the PR base avoids introducing a
          third-party path-filter action and keeps the SHA-pinning surface
          minimal (CISEC-01-001).

  - id: DOCBW-05
    title: Security Compliance
    specs:
      - id: DOCBW-05-001
        priority: MUST
        kind: project
        statement: >-
          All `uses:` references in `docs-build-check.yml` MUST be pinned
          to a specific commit SHA with an inline human-readable version
          comment, per CISEC-01-001 and CISEC-01-002.
      - id: DOCBW-05-002
        priority: MUST
        kind: project
        statement: >-
          The workflow MUST declare `permissions: contents: read` at the
          workflow level and no additional permissions, per CISEC-02-002.
