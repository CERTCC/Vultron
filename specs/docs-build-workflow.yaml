id: DOCBW
title: Docs Site Build and Publication Workflows
description: >-
  Requirements for the GitHub Actions workflows that build the MkDocs site and
  publish it: the review workflow `.github/workflows/docs-build-check.yml`, which
  runs on pull requests and verifies the site builds cleanly and that its links
  and URLs resolve, and the publication workflow
  `.github/workflows/deploy_site.yml`, which builds the site and uploads it to
  GitHub Pages. DOCBW-01, DOCBW-02 and DOCBW-05 name and configure the review
  workflow; DOCBW-03 states the build and gate obligations every site-building
  workflow carries; DOCBW-06 states what is specific to publication; DOCBW-07
  states the release promotion, release tag check and staleness alarm that read
  the publication's tags; DOCBW-08 states how each released draft of the
  Protocol Specification is frozen at promote and served by every build.
  The workflows are distinct from `python-app.yml` (Python unit tests and
  linting) and `.github/workflows/demo-integration.yml` (demo container
  integration tests, specified in `specs/demo-ci.yaml`).
scope:
  - prototype
  - production
tags:
- ci-cd
- documentation
groups:
  - id: DOCBW-01
    title: Review Workflow File Name and Display Name
    specs:
      - id: DOCBW-01-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The workflow file MUST be named
          `.github/workflows/docs-build-check.yml`.
        rationale: >-
          Another workflow calls this workflow by its file path, and specs, tests
          and documentation refer to it by that path. A fixed file name keeps those
          calls and references correct.
      - id: DOCBW-01-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The workflow `name:` field MUST be `Docs Build and Link Check`.
        rationale: >-
          GitHub shows the `name:` field in the Actions tab and in the checks list
          of a pull request. A fixed name lets maintainers find the docs check in
          those lists.

  - id: DOCBW-02
    title: Trigger Conditions
    specs:
      - id: DOCBW-02-001
        priority: MUST
        kind: project
        statement: >-
          The workflow MUST trigger on `pull_request` events whose changed
          paths include at least one of: `docs/**`, `overrides/**`,
          `mkdocs.yml`, `pyproject.toml`, `uv.lock`, `vultron/**`, `specs/**`,
          the gates' composite action (`.github/actions/check-site-publication/**`),
          the shared build action and the environment action it calls
          (`.github/actions/build-site/**`, `.github/actions/setup-python-uv/**`),
          or the workflow file itself (`.github/workflows/docs-build-check.yml`).
        rationale: >-
          A page renders from more than its `docs/` file. mkdocstrings reads
          `vultron/`, exec blocks print `vultron/` examples and the output of
          generators, and the spec reference pages render `specs/*.yaml`. If the
          trigger leaves out one of these paths, a change there can break the
          site while this workflow does not run. Changes only to `plan/`,
          `notes/` or other markdown outside the site do not change the built
          site, so they do not trigger the workflow (DOCBW-02-003). A change the
          filter misses is still checked by the deploy (DOCBW-03-012).
        verification: >-
          `test/ci/test_docs_build_trigger_paths.py` asserts the
          `pull_request` paths include every path this statement lists.
      - id: DOCBW-02-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The workflow MUST trigger on `workflow_dispatch` events to allow
          manual runs at any time.
        rationale: >-
          The workflow has no `push` trigger, so it runs only on a pull request that
          changes a watched path. A maintainer sometimes needs the docs check when there
          is no such pull request, for example to check a branch or `main` directly.
      - id: DOCBW-02-003
        priority: MUST_NOT
        kind: project
        statement: >-
          The `pull_request` trigger MUST NOT use `**/*.md` as a path
          pattern, as this would cause the workflow to run on changes to
          `plan/`, `notes/`, and other non-site markdown files that have no
          effect on the published documentation.
        rationale: >-
          Most markdown in the repository is not part of the site. A run for
          each change to `plan/` or `notes/` uses CI time and adds a check that
          tells the reader nothing about the site.
        verification: >-
          `test/ci/test_docs_build_trigger_paths.py` asserts `**/*.md` is not
          among the `pull_request` paths.

  - id: DOCBW-03
    title: Job Structure
    specs:
      - id: DOCBW-03-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The workflow MUST contain a single job that runs both the
          build-site and link-check phases sequentially, sharing the same
          runner filesystem to avoid artifact upload/download overhead.
        rationale: >-
          The link check reads the `site/` tree that the build makes. In one job,
          both phases use the same file system, so the workflow does not upload
          and download the site as an artifact. This makes the run shorter and
          removes a step that can fail.
      - id: DOCBW-03-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The Build Site step MUST run on every workflow trigger regardless
          of which paths changed, so that Python-macro and plugin failures
          introduced by `pyproject.toml` or `mkdocs.yml` changes are always
          caught.
        rationale: >-
          A change to `pyproject.toml` or `mkdocs.yml` can break a macro or a
          plugin on any page, whatever docs paths changed. If the build step ran
          only for some paths, the workflow could pass while the site does not
          build.
      - id: DOCBW-03-004
        priority: SHOULD
        kind: project
        statement: >-
          The workflow SHOULD validate that maintainer-focused docs remain
          buildable. Pages under `docs/developer/` are declared as `draft_docs`
          in `mkdocs.yml` and are served by `mkdocs serve` but excluded from
          production builds; CI validates the production build only.
        rationale: >-
          Maintainers read the pages under `docs/developer/` with `mkdocs serve`,
          so a broken page there misleads them. `mkdocs build` leaves out draft
          pages, so the production build in CI does not check them.
      - id: DOCBW-03-005
        priority: MUST
        kind: project
        statement: >-
          A withheld-artifact step MUST run after the Build Site step and fail
          the workflow when any artifact declared withheld produced files in
          `site/`.
        rationale: >-
          A decision not to publish an artifact is a claim, and only the build
          output shows if the claim is true. A key that looks like a suppression
          can have no effect on the build. For example, `draft: true` is a key of
          the Material blog plugin, not of MkDocs, so a page with it still gets
          to `site/`. A check of the output, not of the `mkdocs.yml` mechanism,
          also finds a pattern that matches the wrong path.
        verification: >-
          `uv run docs-withheld` (`vultron/metadata/docs/withheld.py`) exits
          non-zero, invoked by the `Check withheld artifacts are unpublished`
          step of `.github/actions/check-site-publication`, which
          `.github/workflows/docs-build-check.yml` runs after the build. Its logic is
          covered by `test/metadata/docs/test_withheld.py`.
      - id: DOCBW-03-016
        priority: MUST
        kind: project
        statement: >-
          The withheld-artifact step MUST also fail when `site/` is absent or
          empty, and when a withheld declaration matches no file in the source
          tree.
        rationale: >-
          With no `site/`, or with a declaration that matches nothing, the step
          has nothing to check and would pass. A gate that finds no targets and
          passes is worse than no gate (DF-09-009).
        verification: >-
          `test/metadata/docs/test_withheld.py` covers the absent-`site/`,
          empty-`site/` and stale-declaration failure modes of `docs-withheld`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-005
      - id: DOCBW-03-006
        priority: MUST
        kind: project
        statement: >-
          Every workflow that builds the site MUST run the DOCBW-03-005 step,
          including `.github/workflows/deploy_site.yml`.
        rationale: >-
          `deploy_site.yml` is the workflow that actually publishes: it builds
          `site/` from a scheduled, manual or rollback run (DOCBW-06-007) and
          uploads it to Pages. A gate present only in the pull-request workflow
          does not bind the publishing path, so a withheld artifact on a commit
          the publish takes without a pull request (a direct push to `main`, or a
          rollback to an older tag), or one a plugin or dependency change brings
          into the build, would ship.
        verification: >-
          `test/ci/test_publication_gates_in_workflows.py` asserts every
          workflow running `mkdocs build` also runs `docs-withheld`, directly or
          through a local composite action, `deploy_site.yml` included.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-005
      - id: DOCBW-03-007
        priority: MUST
        kind: project
        statement: >-
          A reference-axis step MUST fail the workflow when any internal
          reference in the built `site/` tree resolves to a path the build did
          not produce.
        rationale: >-
          An internal reference can have a correct form and still point to a
          path that the build did not make, for example after its target moves
          to `draft_docs`. `--strict` cannot see every such reference, because
          markdown-exec renders on a child `Markdown` instance that has no
          relative-link treeprocessor. A check of *resolution* also covers form
          checks such as a `.md` suffix. Other clauses:
          `notes/documentation-strategy.md`.
        verification: >-
          `uv run docs-links` (`vultron/metadata/docs/links.py`) exits non-zero,
          invoked by the `Check internal references resolve` step of
          `.github/actions/check-site-publication`. Its logic is covered by
          `test/metadata/docs/test_links.py` over synthetic built trees,
          including a reference to a withheld page and a reference ending in
          `.md`.
      - id: DOCBW-03-017
        priority: MUST
        kind: project
        statement: >-
          The reference-axis step MUST run after the Build Site step on every
          trigger, with no step-level `if:` condition.
        rationale: >-
          The step reads `site/`, so before the build it has nothing to check. A
          step that an `if:` can skip lets a dead reference merge on any trigger
          the condition excludes.
        verification: >-
          `test/ci/test_publication_gates_in_workflows.py` asserts the step
          follows the build and that neither it nor its calling step is
          conditional.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-007
      - id: DOCBW-03-018
        priority: MUST
        kind: project
        statement: >-
          The reference-axis step MUST evaluate every built HTML file rather
          than only those reachable from an entry page.
        rationale: >-
          A crawl from an entry page misses every page that no page links to,
          and a dead reference on such a page still reaches readers who arrive
          from a search or a bookmark.
        verification: >-
          `test/metadata/docs/test_links.py::test_dead_reference_on_unreachable_page_is_found`
          finds a dead reference on a page that no entry point links to.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-007
      - id: DOCBW-03-019
        priority: MUST
        kind: project
        statement: >-
          The reference-axis step MUST fail when `site/` is absent or empty.
        rationale: >-
          With no built files the step checks no reference and would pass. A
          gate that finds no targets and passes is worse than no gate
          (DF-09-009).
        verification: >-
          `test/metadata/docs/test_links.py` covers the absent-`site/` and
          empty-`site/` failures of `docs-links`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-007
      - id: DOCBW-03-020
        priority: MUST
        kind: project
        statement: >-
          The reference-axis step MUST run in every workflow that builds the
          site, on the same terms as DOCBW-03-006.
        rationale: >-
          A check present only in the pull-request workflow does not bind the
          publishing path, so a dead reference on a commit that reached `main`
          without a pull request, or on an older commit a rollback redeploys,
          would ship.
        verification: >-
          `test/ci/test_publication_gates_in_workflows.py` asserts that both
          site-building workflows run the step through
          `.github/actions/check-site-publication`, and that in
          `deploy_site.yml` it precedes the Pages upload.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-007
          - rel_type: uses_definition
            spec_id: DOCBW-03-006
      - id: DOCBW-03-008
        priority: MUST
        kind: project
        statement: >-
          A continuity step MUST fail the workflow when a URL that an earlier
          publish served reaches no built page, directly or through a redirect
          chain. A URL that a withheld declaration (DOCBW-03-005) covers is
          exempt.
        rationale: >-
          Readers and other sites keep links to the URLs that an earlier publish
          served. When a page moves or is withdrawn with no redirect, each of
          those links gets a 404. `--strict` checks links in one build, not URLs
          that an earlier build served. A withdrawn page is excluded, not
          redirected, so a retirement does not look like a move. Other clauses:
          `notes/documentation-strategy.md`.
        verification: >-
          `uv run docs-legacy-urls` (`vultron/metadata/docs/legacy_urls.py`)
          exits non-zero, reading the record in
          `vultron/metadata/docs/legacy_urls_baseline.txt`, invoked by the
          `Check published URLs still resolve` step of
          `.github/actions/check-site-publication`. Its logic is covered by
          `test/metadata/docs/test_legacy_urls.py` over synthetic built trees,
          including a redirect to an unbuilt page, a loop, and a withheld URL.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-03-005
      - id: DOCBW-03-021
        priority: MUST
        kind: project
        statement: >-
          The continuity step MUST run after the Build Site step.
        rationale: >-
          The step reads `site/`, so before the build it has nothing to check.
        verification: >-
          `test/ci/test_publication_gates_in_workflows.py::test_gate_runs_after_the_build`
          asserts the step follows the build in every site-building workflow.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-008
      - id: DOCBW-03-022
        priority: MUST
        kind: project
        statement: >-
          This codebase MUST commit the record of URLs that earlier publishes
          served.
        rationale: >-
          The evidence of what a publish served, the deployed site, is gone
          when the next deploy replaces it, so only a committed copy keeps it.
        verification: >-
          `test/metadata/docs/test_legacy_urls.py::test_the_committed_baseline_is_seeded`
          reads the committed record in
          `vultron/metadata/docs/legacy_urls_baseline.txt`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-008
      - id: DOCBW-03-023
        priority: MUST
        kind: project
        statement: >-
          The record of served URLs MUST only grow.
        rationale: >-
          A URL dropped from the record is no longer checked, so a later publish
          can turn it into a 404 with no failing check.
        verification: >-
          `test/metadata/docs/test_legacy_urls.py::test_snapshot_extends_the_baseline_and_never_drops`
          shows that a snapshot adds pages and keeps every recorded one.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-022
      - id: DOCBW-03-024
        priority: MUST_NOT
        kind: project
        statement: >-
          The continuity step MUST NOT derive the record at check time from the
          branch the publish replaces.
        rationale: >-
          That ref holds only the last publish, and the next publish replaces it.
          A record derived from it at check time loses every URL that an older
          publish served.
        verification: >-
          `docs-legacy-urls` reads the URLs it checks from the committed record
          through `load_baseline` and reads no git ref; only its `--snapshot`
          and `--require-recorded` modes read a ref.
          `test/metadata/docs/test_legacy_urls.py` checks the comparison over a
          page list with no git repository.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-008
      - id: DOCBW-03-025
        priority: MUST
        kind: project
        statement: >-
          The continuity step MUST fail when `site/` is absent or empty or the
          record is empty.
        rationale: >-
          With no built site or no recorded URL the step checks nothing and
          would pass. A gate that finds no targets and passes is worse than no
          gate (DF-09-009).
        verification: >-
          `test/metadata/docs/test_legacy_urls.py` covers the absent-`site/`,
          empty-`site/` and empty-record failures of `docs-legacy-urls`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-008
      - id: DOCBW-03-026
        priority: MUST
        kind: project
        statement: >-
          The continuity step MUST run in every workflow that builds the site,
          on the same terms as DOCBW-03-006.
        rationale: >-
          A check present only in the pull-request workflow does not bind the
          publishing path, so a commit that reached `main` without a pull request
          and breaks a served URL would ship.
        verification: >-
          `test/ci/test_publication_gates_in_workflows.py` asserts the step's
          presence in every site-building workflow and, in `deploy_site.yml`,
          before the Pages upload.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-008
          - rel_type: uses_definition
            spec_id: DOCBW-03-006
      - id: DOCBW-03-009
        priority: MUST
        kind: project
        statement: >-
          Every workflow that builds the site MUST run `mkdocs build --strict`,
          so that any warning the build emits fails the workflow.
        rationale: >-
          `mkdocs.yml` raises dead in-page anchors, and pages that are in neither the
          nav nor `not_in_nav`, to `warn`, so that a strict build fails on them
          (DOCBW-03-011). If a workflow builds without `--strict`, the warnings print
          and the job stays green. Strict mode does not cover every link. `--strict`
          sees only the links that MkDocs parsed, so DOCBW-03-007 checks the built
          output.
        verification: >-
          `test/ci/test_docs_build_strict.py` asserts every workflow running
          `mkdocs build` passes `--strict`.
      - id: DOCBW-03-010
        priority: MUST_NOT
        kind: project
        statement: >-
          A site build that DOCBW-03-009 requires to be strict MUST NOT also pass
          `--quiet` (or `-q`).
        rationale: >-
          `--quiet` raises the mkdocs logger to ERROR before strict mode's
          warning counter sees a record, so `mkdocs build --strict --quiet` exits
          0 over warnings. The flag reads as cosmetic and switches the gate off.
        verification: >-
          `test/ci/test_docs_build_strict.py` asserts no workflow's
          `mkdocs build` command carries `--quiet` or `-q`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-009
      - id: DOCBW-03-011
        priority: MUST
        kind: project
        statement: >-
          `mkdocs.yml` MUST set `validation.links.anchors` and
          `validation.nav.omitted_files` to `warn`, so that a strict build fails
          on a dead in-page anchor link and on a page absent from both the nav
          and `not_in_nav`.
        rationale: >-
          `info` is below what `--strict` counts, so downgrading either setting
          turns its check off as silently as dropping `--strict` would, and
          nothing in the build output says so.
        verification: >-
          `test/ci/test_docs_build_strict.py` asserts both settings are `warn`,
          and that a strict build of a synthetic two-page site carrying the
          project's `validation` block fails on each defect and passes a clean
          control.
      - id: DOCBW-03-012
        priority: MUST
        kind: project
        statement: >-
          Every workflow that builds the site MUST run, after the Build Site
          step and on the same terms as DOCBW-03-006, a step that fails when a
          page the checked-out commit builds is absent from the DOCBW-03-008
          record of served URLs, deciding which pages are built by the same
          rule that extends the record.
        rationale: >-
          A page goes live at the next deploy after it reaches `main`, whatever
          triggers that deploy, so it is recorded in the pull request that adds
          it, while its author is at hand, instead of in a catch-up before a
          release. Each docs pull request is checked at its merge result, and the
          deploy re-checks the commit it ships, covering a change the review's
          path filter missed.
          The record has one kind of entry, so a page counts as served once it
          is recorded: a page renamed after it merged needs a redirect even if
          no deploy shipped it, which is cheap. See
          `notes/documentation-strategy.md`.
        verification: >-
          A `docs-legacy-urls` mode (`vultron/metadata/docs/legacy_urls.py`)
          exits non-zero on an unrecorded built page, covered by
          `test/metadata/docs/test_legacy_urls.py`, whose
          `test_every_page_this_checkout_builds_is_recorded` also applies it to
          the checked-out tree; `test/ci/test_publication_gates_in_workflows.py`
          asserts that every site-building workflow runs the step after the
          build and cannot skip or swallow it, and that `deploy_site.yml` runs
          it before the Pages upload.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-03-008
          - rel_type: uses_definition
            spec_id: DOCBW-03-006
      - id: DOCBW-03-027
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-03-012 step MUST fail when the checked-out commit builds no
          pages.
        rationale: >-
          With no built page the step checks nothing and would pass. A gate
          that finds no targets and passes is worse than no gate (DF-09-009).
        verification: >-
          The `docs-legacy-urls --require-recorded` mode exits non-zero on an
          empty built-page set, covered by
          `test/metadata/docs/test_legacy_urls.py::test_a_commit_that_builds_no_pages_raises`
          and `test_cli_require_recorded_fails_when_it_would_check_nothing`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-012
      - id: DOCBW-03-013
        priority: MUST
        kind: project
        statement: >-
          Each tree-wide pre-commit hook (`pass_filenames: false`) whose
          `files:` matches a `docs/` file MUST also run in a workflow whose
          `pull_request` trigger fires on that file.
        rationale: >-
          No workflow runs pre-commit, so a hook enforces nothing on a pull
          request whose author did not run it. A test of the committed tree does
          not replace the hook when the path filter of its workflow misses the
          file. Then a pull request that changes only `docs/`, and breaks the
          frontmatter of a page or the normative banner, can merge with green
          checks.
        verification: >-
          `test/ci/test_docs_source_gates_in_workflows.py` derives the hooks
          from `.pre-commit-config.yaml` and asserts that, for every `docs/`
          file a hook's pattern matches, a workflow triggered by a pull
          request changing that file runs the hook's command in a step that
          can fail the run.
      - id: DOCBW-03-014
        priority: MUST
        kind: project
        statement: >-
          Each DOCBW-03-013 gate that the review workflow runs MUST run after
          the shared build step and the built-site checks, on `!cancelled()`,
          failing the job without stopping later steps. Nothing swallows its
          failure (no `continue-on-error`, no `|| true`).
        rationale: >-
          The gates check the `docs/` sources, not the built site, so they
          need only the environment the shared build step sets up
          (DOCBW-06-004); running them first would mean a second install in
          the same job. A built-site check has no `if:`, so it is skipped
          after any earlier failure: placed after those checks, a failed gate
          cannot hide them, and `!cancelled()` lets every gate run whatever
          failed before it, so one push reports every broken gate.
        verification: >-
          `test/ci/test_docs_source_gates_in_workflows.py` asserts, within the
          one job that calls the shared build action, that each gate follows
          the build and every built-site check, that nothing swallows its
          failure, and that every gate runs on `!cancelled()`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-013
      - id: DOCBW-03-015
        priority: MUST
        kind: project
        statement: >-
          The workflow that runs the DOCBW-03-013 check MUST fire on a pull
          request that changes `.pre-commit-config.yaml` or any
          `.github/workflows/*.yml` file.
        rationale: >-
          The check reads those files. If it ran only on a pull request that
          changes Python, the pull request that deletes a gate's step, or
          adds a docs hook with no step, would merge green and the next
          unrelated pull request would fail instead.
        verification: >-
          `test/ci/test_docs_source_gates_in_workflows.py` asserts that the
          workflow running `test/ci` fires, under the same trigger reading
          as DOCBW-03-013, on `.pre-commit-config.yaml` and on every
          `.github/workflows/*.yml` file.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-03-013

  - id: DOCBW-05
    title: Security Compliance
    specs:
      - id: DOCBW-05-001
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          All `uses:` references in `docs-build-check.yml` MUST be pinned
          to a specific commit SHA with an inline human-readable version
          comment, per CISEC-01-001 and CISEC-01-002.
        rationale: >-
          This workflow runs actions from outside the repository. A pin keeps that
          code fixed to a reviewed commit, as in every other workflow
          (CISEC-01-001).
        relationships:
          - rel_type: refines
            spec_id: CISEC-01-001
          - rel_type: refines
            spec_id: CISEC-01-002
      - id: DOCBW-05-002
        priority: MUST
        kind: project
        verification_debt: '#2574'
        statement: >-
          The workflow MUST declare `permissions: contents: read` at the
          workflow level and no additional permissions, per CISEC-02-002.
        rationale: >-
          The workflow reads the repository, builds the site and checks it. It writes
          nothing, so it needs no write access. A read-only token limits what a
          compromised step or action can change (CISEC-02-002).
        relationships:
          - rel_type: refines
            spec_id: CISEC-02-002

  - id: DOCBW-06
    title: Site Publication
    description: >-
      Obligations of the publication workflow, `.github/workflows/deploy_site.yml`,
      beyond the build and gate obligations DOCBW-03 places on every site-building
      workflow. Publication runs on a weekday schedule from `publish-*` tags, gated
      on `main` CI, with manual publish and rollback (ADR-0171). The gate's
      decisions live in `.github/scripts/publish_gate.py`.
    specs:
      - id: DOCBW-06-001
        priority: MUST
        kind: project
        statement: >-
          The publication workflow MUST be the only workflow that uploads the site
          to GitHub Pages.
        rationale: >-
          A gate is a property of the paths on which it runs. With one uploader,
          every requirement placed on the publication workflow binds every path by
          which the site reaches readers; a second uploader would be a path no
          DOCBW-06 obligation covers.
        verification: >-
          `test_no_other_workflow_uploads_to_pages` in
          `test/ci/test_site_build_shared_action.py` fails when any workflow
          other than `deploy_site.yml` reaches `actions/upload-pages-artifact`
          or `actions/deploy-pages`, local actions expanded.
      - id: DOCBW-06-002
        priority: MUST
        kind: project
        statement: >-
          In the publication workflow, the publication gates (DOCBW-03-005,
          DOCBW-03-007, DOCBW-03-008 and DOCBW-03-012, run through the
          `.github/actions/check-site-publication` composite action) MUST run after
          the site build and before the Pages artifact upload.
        rationale: >-
          After the upload the artifact is already out, so a gate placed later
          checks a site that has shipped; before the build, `site/` does not exist.
          The ordering is the gate.
        verification: >-
          `test_gate_runs_after_the_build` and `test_gate_precedes_the_pages_upload`
          in `test/ci/test_publication_gates_in_workflows.py`.
        relationships:
          - rel_type: refines
            spec_id: DOCBW-03-006
          - rel_type: uses_definition
            spec_id: DOCBW-03-005
          - rel_type: uses_definition
            spec_id: DOCBW-03-007
          - rel_type: uses_definition
            spec_id: DOCBW-03-008
          - rel_type: uses_definition
            spec_id: DOCBW-03-012
      - id: DOCBW-06-003
        priority: MUST
        kind: project
        statement: >-
          The publication workflow MUST notify on failure and close the failure
          notice on a later success, through the `notify-failure` composite action
          (CISEC-05-001, CISEC-05-002, CISEC-05-008).
        rationale: >-
          A failed publish leaves the live site stale with no failing pull request
          to notice it, so the failure has to be reported by the run itself.
        verification: >-
          `test/ci/test_workflow_failure_notification.py` asserts the notify and
          close steps for every workflow that triggers on a push to `main` or on
          a schedule, and `test_publication_workflow_qualifies` asserts
          `deploy_site.yml` is in that set.
        relationships:
          - rel_type: refines
            spec_id: CISEC-05-001
          - rel_type: refines
            spec_id: CISEC-05-002
          - rel_type: refines
            spec_id: CISEC-05-008
      - id: DOCBW-06-004
        priority: MUST
        kind: project
        statement: >-
          Every workflow that builds the site MUST build it through one shared
          composite action. That action fixes the checkout (history depth and
          tags), the dependency set and the `mkdocs build` command.
        rationale: >-
          A review build is evidence about the published site only when it builds
          the same thing. Two workflows that each set up their own build can
          differ in the dependency group, in whether they fetch git tags, and in
          the build flags. Then a green review does not show that the published
          site builds. Which commit is built is not part of how it is built, so
          the action may take the commit as its one input, which a rollback
          needs (DOCBW-06-020).
        verification: >-
          `test/ci/test_site_build_shared_action.py` fails when a site-building
          workflow does not use `.github/actions/build-site`, when it runs a
          step other than its checkout before the shared build, and when the
          action takes an input other than the commit to check out, or stops
          fixing the checkout, the dependency set or the single build.
      - id: DOCBW-06-005
        priority: MAY
        kind: project
        statement: >-
          A site-building workflow MAY add steps after the shared build.
        rationale: >-
          The review workflow and the publication workflow need different
          checks and uploads after the build. Steps after the shared build
          cannot change the site it built, so both still build the same site.
      - id: DOCBW-06-006
        priority: MUST_NOT
        kind: project
        statement: >-
          A workflow MUST NOT run a `mkdocs build` of its own.
        rationale: >-
          A second build outside the shared action can differ from it in
          dependencies, tags or flags. Then the site that one workflow checks is
          not the site that another publishes.
        verification: >-
          `test/ci/test_site_build_shared_action.py` fails when any workflow or
          any other local action runs `mkdocs build` outside
          `.github/actions/build-site`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-004
      - id: DOCBW-06-007
        priority: MUST
        kind: project
        statement: >-
          The publication workflow MUST run on the schedule `7 6 * * 1-5` (06:07
          UTC, Monday to Friday) and on `workflow_dispatch`, and on no other event.
        rationale: >-
          A manual merge to a release branch was skipped for seventeen months, so
          the site fell 6,966 commits behind `main`. A weekday schedule keeps the
          site within a working day of green `main` with no person in the loop,
          and a manual run covers an urgent publish or a rollback (ADR-0171).
        verification: >-
          `test_publication_workflow_triggers` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-008
        priority: MUST_NOT
        kind: project
        statement: >-
          A scheduled run, and a manual run from `main` that does not skip the CI
          gate, MUST NOT publish while a blocking workflow (DOCBW-06-009) has an
          open issue carrying both `ci:main-failure` and that workflow's label.
        rationale: >-
          Push CI on `main` is path-filtered and cancels superseded runs, so
          whether every check passed on one commit cannot be read per commit. The
          open failure issue that `notify-failure` keeps per workflow says the
          workflow is red on `main`, and that state carries over path filters
          (CISEC-05-011).
        verification: >-
          `test_an_open_blocking_issue_blocks` and
          `test_a_non_blocking_issue_does_not_block` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: uses_definition
            spec_id: CISEC-05-011
          - rel_type: uses_definition
            spec_id: DOCBW-06-009
      - id: DOCBW-06-009
        priority: MUST
        kind: project
        statement: >-
          The publication workflow MUST declare its blocking list itself, naming
          each blocking workflow's file and failure label: Python application,
          Demo Integration, Spec Check, UI, Lint Markdown and Actions Lint.
        rationale: >-
          These are the workflows whose failure means `main` is broken.
          Scheduled bookkeeping workflows, such as ADR Status Drift, report on
          the project rather than the code, so they do not block. Declared in the
          workflow, the list is reviewed with the publication it governs.
        verification: >-
          `test_blocking_list_names_the_main_ci_workflows` in
          `test/ci/test_publish_gate.py` checks each entry against the label that
          workflow's own notify step uses.
        adr:
          - ADR-0171
      - id: DOCBW-06-023
        priority: MUST_NOT
        kind: project
        statement: >-
          The blocking list MUST NOT name the publication workflow.
        rationale: >-
          A failed publish files an issue under the publication workflow's label.
          If that label blocked, the failure would stop every later publish,
          including the one that would close the issue.
        verification: >-
          `test_blocking_list_omits_the_publication_workflow` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-009
      - id: DOCBW-06-010
        priority: MUST
        kind: project
        statement: >-
          While a blocking workflow's run on `main` is unfinished on the
          candidate commit or one of its ancestors, the CI gate MUST wait up to
          one hour for it.
        rationale: >-
          An unfinished run can still turn its workflow red, so the gate cannot
          read the commit's state until it ends. Push CI is path-filtered, so the
          run that judges the candidate's code can be on an earlier commit: a
          docs-only tip starts no Python run, while the run for the commit before
          it may still be going. The hour covers the slowest push workflow; past
          it the run is treated as red rather than published unchecked. A run of
          a non-blocking workflow, or on a later commit, cannot change the
          verdict, so it is not waited for.
        verification: >-
          `test_unfinished_runs_are_waited_for_then_skip`,
          `test_issues_are_read_again_after_the_wait`,
          `test_pending_runs_waits_only_for_blocking_runs_in_history`,
          `test_is_in_history` and `test_wait_for_runs_*` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-011
        priority: MUST
        kind: project
        statement: >-
          A run that does not publish MUST write its reason to the run summary,
          naming each blocking issue or unfinished run.
        rationale: >-
          A skip is a green run, so nothing else reports it. The summary is
          where a maintainer looks to find out why the site did not change.
        verification: >-
          `test_gate_command_writes_its_verdict` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-012
        priority: MUST_NOT
        kind: project
        statement: >-
          A run whose candidate commit is blocked or skipped MUST NOT publish any
          other commit instead.
        rationale: >-
          An older commit was either published already or skipped for a reason
          of its own. Falling back would publish a commit nobody chose.
        verification: >-
          `test_deploy_runs_only_on_the_gate_verdict` in
          `test/ci/test_publish_gate.py`: the deploy job runs only when the gate
          says to, and builds the run's own commit.
        adr:
          - ADR-0171
      - id: DOCBW-06-013
        priority: MUST
        kind: project
        statement: >-
          A scheduled run MUST skip a candidate commit that already has a
          `publish-*` tag that is a DOCBW-07-013 publish.
        rationale: >-
          The schedule then never publishes one commit twice, and never undoes a
          rollback by publishing again the commit it rolled back from. A manual
          run is a deliberate request, so the rule does not apply to it.
        verification: >-
          `test_a_bot_tag_skips_a_scheduled_run` and
          `test_a_bot_tag_does_not_skip_a_manual_run` in
          `test/ci/test_publish_gate.py`, against real tags.
        adr:
          - ADR-0171
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-07-013
      - id: DOCBW-06-014
        priority: MUST_NOT
        kind: project
        statement: >-
          A `publish-*` tag that is not a DOCBW-07-013 publish MUST NOT trigger
          the DOCBW-06-013 skip.
        rationale: >-
          The tag ruleset restricts the update and deletion of a `publish-*`
          tag, not its creation (#5545), so any account that can push can create
          one. Without this rule a hand-pushed tag on the tip of `main` would
          suppress a publish with no failing check. The tagger is what the tag's
          author wrote, so the rule guards against an accidental tag, not a
          deliberate forgery.
        verification: >-
          `test_a_foreign_tag_is_ignored` in `test/ci/test_publish_gate.py`
          covers a bot-made annotated tag, a human-made annotated tag and a
          lightweight tag in a scratch repository.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-013
          - rel_type: uses_definition
            spec_id: DOCBW-07-013
      - id: DOCBW-06-015
        priority: MUST
        kind: project
        statement: >-
          A run that ignores a `publish-*` tag under DOCBW-06-014 MUST name the
          ignored tag in its run summary.
        rationale: >-
          An ignored tag is a sign that someone tagged by hand; naming it lets a
          maintainer find out why.
        verification: >-
          `test_a_foreign_tag_is_ignored` in `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-014
      - id: DOCBW-06-016
        priority: MUST
        kind: project
        statement: >-
          Each publish MUST create exactly one annotated tag
          `publish-YYYY-MM-DD.N` on the deployed commit, after the deploy
          succeeds, where the date is the UTC date and `N` starts at 1 and is
          always present.
        rationale: >-
          The newest `publish-*` tag then always names what is live, and a failed
          deploy leaves no tag for the skip rule to honour. The date is the one
          on which the gate named the tag (DOCBW-06-031). A push that reports
          failure but landed, and a re-run of the tag job, find the tag already
          pushed, so neither makes a second one.
        verification: >-
          `test_next_publish_name`, `test_next_publish_tag_counts_local_and_remote_tags`,
          `test_create_tag_pushes_the_named_annotated_tag`,
          `test_create_tag_accepts_a_push_that_landed`,
          `test_a_rerun_finds_the_tag_it_pushed` and
          `test_the_tag_job_follows_the_deploy` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-017
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-06-016 tag's message MUST record the trigger (scheduled,
          manual, manual with the CI gate skipped, or rollback) and the actor.
        rationale: >-
          The tag is the record of the publish. Its message says why a commit
          went live and who asked, without a search through workflow runs.
        verification: >-
          `test_tag_message_records_trigger_and_actor` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-016
      - id: DOCBW-06-018
        priority: MAY
        kind: project
        statement: >-
          A manual run from `main` MAY skip the CI gate through a boolean
          `skip-ci-gate` input that defaults to off.
        rationale: >-
          A workflow can be red for a reason that does not touch the site, such
          as a flaky demo, and an urgent docs fix cannot wait for it.
        verification: >-
          `test_skip_ci_gate_input_defaults_off`,
          `test_a_manual_ungated_run_skips_the_gate` and
          `test_gate_command_skips_the_gate_on_request` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-019
        priority: MUST_NOT
        kind: project
        statement: >-
          A trigger or input of the publication workflow MUST NOT skip the
          publication gates of DOCBW-06-002.
        rationale: >-
          The CI gate is about `main`; the publication gates are about the site
          that is about to ship. Skipping the first is a judgment about a red
          workflow, and it says nothing about whether the site is fit to publish.
        verification: >-
          `test_gate_is_not_neutered` in
          `test/ci/test_publication_gates_in_workflows.py` fails on a
          conditional publication-gate step.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-002
      - id: DOCBW-06-020
        priority: MUST
        kind: project
        statement: >-
          A manual run from `main` whose `rollback-to` input names a `publish-*`
          or `v*` tag MUST redeploy that tag's commit without the CI gate and
          create a new `publish-*` tag on it whose message reads "rollback to
          <tag>, by @<user>."
        rationale: >-
          A rollback restores a site that was published before, so the state of
          today's `main` is beside the point. The new tag keeps the newest
          `publish-*` tag naming what is live. The commit rolled back from keeps
          its own `publish-*` tag, so the next scheduled run, which finds that
          tag on the tip of `main`, does not publish it again. The run starts
          from `main` rather than from the tag, because a manual run executes
          the workflow file stored at the ref it starts from: a run from a tag
          would execute that tag's copy, which for every tag made before this
          design has no gate and no tag step.
        verification: >-
          `test_classify_trigger`, `test_a_rollback_skips_the_gate`,
          `test_a_rolled_back_commit_is_not_republished`,
          `test_gate_command_rolls_back_to_a_commit_on_main` and
          `test_tag_message_records_trigger_and_actor` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-021
        priority: MUST
        kind: project
        statement: >-
          Scheduled, manual and rollback runs MUST share one concurrency group
          that does not cancel a run in progress.
        rationale: >-
          Two publishes at once would race for the tag counter and for Pages,
          and a cancelled deploy can leave Pages and the tags disagreeing. The
          group covers the whole run, the gate's wait included: a group on the
          build, deploy and tag jobs alone would let two runs interleave, so the
          newest tag could name a deploy that is no longer live. The cost is
          GitHub's rule of one pending run per group: while a run holds the
          group, a newer queued run replaces an older queued one, which ends as
          cancelled with no failure notice, and its starter runs it again.
        verification: >-
          `test_one_concurrency_group_never_cancels` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-022
        priority: MUST_NOT
        kind: project
        statement: >-
          A step of the publication workflow MUST NOT move or delete a `publish-*`
          or `v*` tag.
        rationale: >-
          A published tag is the record of what was live. The tag ruleset
          refuses a move or a deletion (#5545), and a repository ruleset cannot
          grant the GitHub Actions app a bypass, so such a step could only fail.
        verification: >-
          `test_no_step_moves_or_deletes_a_tag` and
          `test_a_name_taken_by_hand_fails_the_job_and_is_left_alone` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-026
        priority: MUST_NOT
        kind: project
        statement: >-
          A rollback MUST NOT redeploy a commit that is not in `main`'s history.
        rationale: >-
          Anyone who can push can create a `publish-*` or `v*` tag (#5545), so a
          tag is no sign of review. A commit in `main`'s history was merged
          through review; any other commit was not.
        verification: >-
          `test_a_rollback_target_must_be_on_main` (against real commits) and
          `test_gate_command_refuses_a_rollback_off_main` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-020
      - id: DOCBW-06-030
        priority: MUST_NOT
        kind: project
        statement: >-
          A rollback MUST NOT pass the CI gate when its target commit lacks a
          local action that the site build loads from that commit.
        rationale: >-
          The build loads `setup-python-uv` and `check-site-publication` from
          the commit it builds, and the releases up to `v2024.4.3` predate them.
          Refused at the gate, such a rollback writes its reason to the run
          summary (DOCBW-06-011); let through, it would report "Publishing" and
          then fail in the build.
        verification: >-
          `test_a_rollback_target_must_carry_the_build_actions` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-020
      - id: DOCBW-06-024
        priority: MUST
        kind: project
        statement: >-
          In the publication workflow, `contents: write` MUST be held only by
          the job that pushes the DOCBW-06-016 tag.
        rationale: >-
          That job runs `main`'s tag script and nothing else. Every other job
          either runs project code or needs no write access (CISEC-02-002).
        verification: >-
          `test_each_job_holds_only_its_permissions` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: refines
            spec_id: CISEC-02-002
          - rel_type: uses_definition
            spec_id: DOCBW-06-016
      - id: DOCBW-06-025
        priority: MUST
        kind: project
        statement: >-
          When a publish reached Pages but its tag was not pushed, the failure
          notice MUST say that the newest `publish-*` tag does not name the live
          site, and how to recover.
        rationale: >-
          The deploy and the tag cannot succeed or fail together. A deploy left
          untagged breaks the rule that the newest `publish-*` tag names what is
          live. Re-running the tag job repairs it, and finds a tag an earlier
          attempt pushed instead of adding a second.
        verification: >-
          `test_an_untagged_deploy_is_reported` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-016
      - id: DOCBW-06-027
        priority: MUST_NOT
        kind: project
        statement: >-
          The job that builds the site MUST NOT hold a token that can write to
          the repository or deploy to Pages.
        rationale: >-
          The build runs project code and third-party plugins. A token that can
          push a tag or deploy, saved by the build's checkout, would let a
          compromised build step do either (CISEC-02-002).
        verification: >-
          `test_each_job_holds_only_its_permissions` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-024
      - id: DOCBW-06-028
        priority: MUST
        kind: project
        statement: >-
          When a DOCBW-06-010 run is still unfinished after the hour, the CI gate
          MUST skip the publish.
        rationale: >-
          Past the hour the run is treated as red rather than published
          unchecked; the next scheduled run tries again.
        verification: >-
          `test_unfinished_runs_are_waited_for_then_skip` and
          `test_wait_for_runs_gives_up_after_the_wait` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-010
      - id: DOCBW-06-029
        priority: MUST_NOT
        kind: project
        statement: >-
          A manual run of the publication workflow that does not start from
          `main` MUST NOT publish.
        rationale: >-
          A manual run executes the copy of the workflow file stored at the ref
          it starts from. A run started from another ref, a tag included, would
          execute that ref's copy with the deploy's permissions.
        verification: >-
          `test_an_unsupported_run_is_refused` and
          `test_gate_command_refuses_a_run_from_a_tag` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
      - id: DOCBW-06-031
        priority: MUST
        kind: project
        statement: >-
          A run that publishes MUST name its DOCBW-06-016 tag before the site
          build, pass that name, its date and the newest `v*` tag on the
          deployed commit to the build, and create the tag under exactly that
          name, failing rather than renumbering when the name is taken.
        rationale: >-
          Every page's footer names the publish it belongs to (#5544), and the
          build prints the footer before the deploy, so the name must be fixed
          first. A tag renumbered after the deploy would leave every page naming
          a tag the publish did not make. A taken name is a collision with a
          hand-made tag, which tags being append-only (DOCBW-06-022) cannot
          repair, so the tag job fails and its notice says how to recover
          (DOCBW-06-025). The build job checks, before the upload, that the
          name is still free and that the footer prints it: a re-run reuses the
          gate's outputs, and the variables reach the build only through the
          shared action.
        verification: >-
          `test_gate_command_skips_the_gate_on_request`,
          `test_the_footer_and_the_free_name_are_checked_before_the_upload`,
          `test_the_footer_check_fails_before_the_upload`,
          `test_the_footer_check_passes_a_free_name_the_footer_prints`,
          `test_the_footer_check_only_notes_a_page_without_the_footer`,
          `test_gate_command_rolls_back_to_a_commit_on_main`,
          `test_the_build_and_the_tag_job_share_the_gates_tag_name`,
          `test_another_runs_tag_of_the_same_name_fails_the_job`,
          `test_a_name_taken_by_hand_fails_the_job_and_is_left_alone` and
          `test_a_name_taken_during_the_push_fails_the_job` in
          `test/ci/test_publish_gate.py`; `test/metadata/docs/test_build_version.py`
          for the footer the build prints.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-016

  - id: DOCBW-07
    title: Release Promotion and Site Staleness
    description: >-
      Obligations of the workflows that read the `publish-*` tags DOCBW-06 makes:
      the promote workflow `.github/workflows/promote_release.yml`, which turns a
      publish into a release (ADR-0006, ADR-0171); the release tag check
      `.github/workflows/release_tag_check.yml`; and the staleness alarm
      `.github/workflows/site_staleness.yml`. Their logic lives in
      `.github/scripts/release.py`, and every tag query in
      `.github/scripts/release_tags.py`.
    specs:
      - id: DOCBW-07-001
        priority: MUST
        kind: project
        statement: >-
          The promote workflow MUST create the next `vYYYY.M.P` tag (ADR-0006)
          as an annotated tag on the commit of the chosen `publish-*` tag, and
          open a draft GitHub Release for it whose notes are generated since
          the previous `v*` tag.
        rationale: >-
          A release then names a snapshot that passed CI and the site checks and
          was live, with no SHAs matched by eye. The release dialog cannot target
          an existing tag, and its default target is `main`, which is not what
          the site shows. A draft lets the maintainer write the notes in the usual
          editor before anyone sees the release.
        verification: >-
          `test_the_first_release_has_no_previous_release`,
          `test_promote_tags_the_publish_and_drafts_the_release` and
          `test_promote_workflow` in `test/ci/test_release.py`.
        adr:
          - ADR-0006
          - ADR-0171
      - id: DOCBW-07-011
        priority: MUST
        kind: project
        statement: >-
          The year and month of a DOCBW-07-001 release tag MUST be those of the
          UTC promotion date, with `P` 0 for the month's first release and one
          more than the month's highest otherwise.
        rationale: >-
          The release names when it shipped, not when the snapshot was first
          published, and ADR-0006 counts `P` within the month.
        verification: >-
          `test_the_release_month_is_the_promotion_date` in
          `test/ci/test_release.py` and `test_next_release_name` in
          `test/ci/test_release_tags.py`.
        adr:
          - ADR-0006
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-001
      - id: DOCBW-07-012
        priority: MUST
        kind: project
        statement: >-
          A promote run with an empty input MUST promote the newest DOCBW-07-013
          publish.
        rationale: >-
          The newest publish names what the site shows now, which is what a
          maintainer most often means to release.
        verification: >-
          `test_an_empty_input_promotes_the_newest_publish` in
          `test/ci/test_release.py`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-001
          - rel_type: uses_definition
            spec_id: DOCBW-07-013
      - id: DOCBW-07-002
        priority: MUST_NOT
        kind: project
        statement: >-
          The promote workflow MUST NOT create a `v*` tag when its input is not
          an existing `publish-*` tag that is a DOCBW-07-013 publish.
        rationale: >-
          A tag the workflow's `GITHUB_TOKEN` pushes starts no other workflow, so
          the release tag check never sees it and the workflow must check its own
          input. Anyone who can push can create a `publish-*` tag (#5545), so a
          name alone is no sign that the commit was published.
        verification: >-
          `test_promote_refuses_an_input_that_is_no_publish` and
          `test_promote_refuses_and_tags_nothing` in `test/ci/test_release.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-001
          - rel_type: uses_definition
            spec_id: DOCBW-07-013
      - id: DOCBW-07-003
        priority: MUST_NOT
        kind: project
        statement: >-
          The promote workflow MUST NOT create a `v*` tag that does not compare
          strictly greater than every existing version-shaped `v*` tag.
        rationale: >-
          ADR-0006 requires release tags to increase monotonically. A tag from a
          later month pushed by hand would otherwise make the next promotion
          name a release older than the latest one.
        verification: >-
          `test_next_release_name_never_goes_backwards` in
          `test/ci/test_release_tags.py` and
          `test_promote_never_names_a_release_below_the_latest` in
          `test/ci/test_release.py`.
        adr:
          - ADR-0006
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-001
      - id: DOCBW-07-004
        priority: MUST_NOT
        kind: project
        statement: >-
          A run of the promote workflow that does not start from `main` MUST NOT
          create a tag or a release.
        rationale: >-
          A manual run executes the copy of the workflow file stored at the ref
          it starts from. A run from another ref would execute that ref's copy
          with write access to the repository.
        verification: >-
          `test_promote_refuses_and_tags_nothing` in `test/ci/test_release.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-001
      - id: DOCBW-07-005
        priority: MUST
        kind: project
        statement: >-
          The promote workflow MUST trigger on `workflow_dispatch` only, with
          `contents: read` at the workflow level and `contents: write` only on
          the job that pushes the release tag and creates the release.
        rationale: >-
          Promotion is a maintainer's decision, so nothing starts it on its own.
          The one job that writes needs to push a tag and create a release, and
          nothing more (CISEC-02-002).
        verification: >-
          `test_promote_workflow` in `test/ci/test_release.py`.
        relationships:
          - rel_type: refines
            spec_id: CISEC-02-002
      - id: DOCBW-07-006
        priority: MUST
        kind: project
        statement: >-
          The publish gate, the promote workflow, the release tag check and the
          staleness alarm MUST read the local clone's `publish-*` and `v*` tags,
          the commit, object id and message of a tag, and the bot's tagging
          identity only through the shared helper `.github/scripts/release_tags.py`.
        rationale: >-
          One helper gives all four the same answer to "which commits were
          published." A hand-pushed tag, which the scheduled skip ignores, must
          not pass as a publish to promote, to the release check or to the
          staleness alarm either.
        verification: >-
          `test/ci/test_release_tags.py` covers each query, a hand-pushed tag
          included, and `test_scripts_query_tags_only_through_the_helper` there
          fails when `publish_gate.py` or `release.py` reads tags or the bot
          identity itself. `test_a_bot_tag_with_a_malformed_name_is_ignored` in
          `test/ci/test_publish_gate.py` and
          `test_check_reports_a_release_of_no_publish` in
          `test/ci/test_release.py` cover the gate and the check.
        adr:
          - ADR-0171
      - id: DOCBW-07-013
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-07-006 helper MUST count as a publish only an annotated
          `publish-YYYY-MM-DD.N` tag whose tagger is `github-actions[bot]`.
        rationale: >-
          The tag ruleset does not restrict who creates a `publish-*` tag, so a
          hand-pushed or lightweight tag must not pass as a publish to the skip,
          to promote, to the release check or to the staleness alarm. A name the
          publish workflow never makes is no publish, whoever tagged it.
        verification: >-
          `test_only_a_bot_made_well_named_tag_is_a_publish` in
          `test/ci/test_release_tags.py` and
          `test_a_bot_tag_with_a_malformed_name_is_ignored` in
          `test/ci/test_publish_gate.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-006
      - id: DOCBW-07-007
        priority: MUST
        kind: project
        statement: >-
          A push of a `v*` tag whose commit has no DOCBW-07-013 publish MUST file
          or update a failure issue through the `notify-failure` composite
          action.
        rationale: >-
          A release cut by hand can name a commit that never passed the site
          checks or was never live. Tags are append-only (#5545), so the check
          can only report it for a maintainer to review.
        verification: >-
          `test_check_passes_a_release_of_a_publish`,
          `test_check_reports_a_release_of_no_publish`,
          `test_unpublished_release_names_the_tag_and_never_deletes` and
          `test_release_tag_check_workflow` in `test/ci/test_release.py`.
        relationships:
          - rel_type: uses_definition
            spec_id: CISEC-05-008
          - rel_type: uses_definition
            spec_id: DOCBW-07-013
      - id: DOCBW-07-014
        priority: MUST_NOT
        kind: project
        statement: >-
          The release tag check MUST NOT block a `v*` tag push.
        rationale: >-
          The check runs after the tag exists and only reports; a maintainer
          decides what to do about a release that names no publish.
        verification: >-
          `test_check_reports_a_release_of_no_publish` and
          `test_release_tag_check_workflow` in `test/ci/test_release.py`: the
          workflow triggers on the push and has no required status.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-007
      - id: DOCBW-07-008
        priority: MUST
        kind: project
        statement: >-
          When the newest DOCBW-07-013 publish is more than 4 weekdays older than
          the newest commit on `main`, and `main` has commits that are not in the
          published commit's history, the staleness alarm MUST keep one failure
          issue open through the `notify-failure` composite action.
        rationale: >-
          A skipped publish is a green run, so nothing else reports a site that
          stopped moving: the site once fell 6,966 commits behind `main` unseen
          (ADR-0171). Weekdays, not days, are counted, so a weekend alone never
          triggers it. The alarm also checks after every run of the publish
          workflow, so the next publish closes it.
        verification: >-
          `test_weekdays_between`, `test_stale_site`,
          `test_no_publish_at_all_is_stale`, `test_staleness_reads_the_clone` and
          `test_staleness_workflow` in `test/ci/test_release.py`.
        adr:
          - ADR-0171
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-07-013
      - id: DOCBW-07-015
        priority: MUST
        kind: project
        statement: >-
          The first staleness check after a publish that ends the DOCBW-07-008
          condition MUST close the issue.
        rationale: >-
          The alarm checks after every run of the publish workflow, so the next
          publish closes it without waiting for the schedule.
        verification: >-
          `test_staleness_reads_the_clone` and `test_staleness_workflow` in
          `test/ci/test_release.py`.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-008
      - id: DOCBW-07-009
        priority: MUST_NOT
        kind: project
        statement: >-
          A step of the promote workflow, the release tag check or the staleness
          alarm MUST NOT move or delete a `publish-*` or `v*` tag.
        rationale: >-
          The tag ruleset refuses a move or a deletion (#5545), and a repository
          ruleset cannot grant the GitHub Actions app a bypass, so such a step
          could only fail.
        verification: >-
          `test_no_step_moves_or_deletes_a_tag` in
          `test/ci/test_publish_gate.py` covers every tag workflow and the
          scripts they run.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-022
      - id: DOCBW-07-010
        priority: MUST
        kind: project
        statement: >-
          When the chosen publish's commit already carries the latest `v*` tag,
          made by the promote workflow, and that tag has no GitHub Release, the
          promote workflow MUST open the draft release for that tag instead of
          creating another tag.
        rationale: >-
          A run whose release step failed leaves its tag pushed. Re-running it
          then finishes the release instead of tagging one commit twice.
        verification: >-
          `test_a_tagged_commit_without_a_release_gets_its_draft`,
          `test_a_released_commit_is_not_promoted_again` and
          `test_a_rerun_after_a_failed_draft_reuses_the_tag` in
          `test/ci/test_release.py`.
        relationships:
          - rel_type: supersedes
            spec_id: DOCBW-07-001
          - rel_type: supersedes
            spec_id: DOCBW-07-016
      - id: DOCBW-07-016
        priority: MUST
        kind: project
        statement: >-
          When the chosen publish's commit carries a `v*` tag in any case other
          than DOCBW-07-010 and DOCBW-08-025, the promote workflow MUST refuse
          the run.
        rationale: >-
          A commit already released, a commit whose release a later one
          superseded, and a commit tagged by hand each need a maintainer's
          decision, not a second tag or a draft for a tag nobody promoted.
        verification: >-
          `test_a_released_commit_is_not_promoted_again`,
          `test_a_release_that_carries_no_draft_is_not_promoted_again` and
          `test_a_release_of_a_tag_not_made_yet_is_refused` in
          `test/ci/test_release.py`, and the DOCBW-08-024 and DOCBW-08-026
          tests in `test/ci/test_frozen_drafts.py`.
  - id: DOCBW-08
    title: Frozen Protocol Specification Drafts
    description: >-
      Obligations that keep each released draft of the Protocol Specification
      readable, unchanged, at `spec/draft-N/` beside the current draft
      (ADR-0188): the drafts register that states each draft once, the archive
      that the promote workflow `.github/workflows/promote_release.yml`
      attaches to a release that carries a draft, and the step by which the
      publication workflow and the review workflow serve the released drafts
      from those archives. Immutable releases are enabled on the repository,
      so a published release's assets never change, and an asset can be
      attached only while the release is a draft. The promote builds and checks
      the archive before any draft release exists, and creates the draft
      release with its assets attached, so every draft release a maintainer
      can publish already carries them. A release is published when
      GitHub reports a release for its tag that is not a draft. A release
      carries a matching DOCBW-08-009 pair when both files are attached to it
      and every file of the attached archive, and no other file, has the
      digest that the attached manifest lists.
    specs:
      - id: DOCBW-08-001
        priority: MUST
        kind: project
        statement: >-
          Each draft of the Protocol Specification MUST have exactly one entry
          in the drafts register `docs/reference/vultron-spec/drafts.yaml`.
          The entry gives the draft's version `draft-N`, its status
          (unreleased or released) and its date, the day the entry was added to
          the register, in the `YYYY-MM-DD` format. A released entry also gives
          the `v*` tag of the release that carries the draft.
        rationale: >-
          The promote workflow, the deploy and the pages must agree on which
          drafts are released and by which release. Facts that are written in
          one place cannot disagree.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` load the committed
          register and check that every entry has the fields its status
          requires, and load fixture registers with a field missing and check
          that each is refused.
        adr:
          - ADR-0188
      - id: DOCBW-08-002
        priority: MUST
        kind: project
        statement: >-
          The drafts register loader MUST refuse a malformed register and name
          the failing entry by `path:line:col`. These are malformed: a
          duplicate version, a version that is not `draft-N`, a gap in the
          draft numbers, a released entry with no tag, an unreleased entry
          with a tag, more than one unreleased entry, an unreleased entry that
          is not the highest-numbered, and two released entries that name the
          same tag.
        rationale: >-
          A wrong entry would make the promote attach the wrong draft or the
          deploy serve none. A refusal that names the line lets the author fix
          it at once.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` load one fixture register
          for each malformed case and check the refusal and its location.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-001
      - id: DOCBW-08-003
        priority: MUST
        kind: project
        statement: >-
          A step of `.github/workflows/docs-build-check.yml` MUST fail when the
          drafts register at the checked-out commit and the register at a `v*`
          tag disagree on a draft released by that tag: the tag's register
          names such a draft and the checked-out register lacks that entry or
          holds a different one, or the checked-out register names an existing
          tag as a draft's release and that tag's register lacks the same
          entry.
        rationale: >-
          The entry is marked released before the promote, so the release tag
          carries the entry that names it. After that release, the draft names
          one text, and a changed or removed entry would make the site serve or
          describe a different one. The shared build fetches every tag, so the
          step can read the register at each one.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` build a fixture repository
          with a release tag whose register names a released draft, and check
          that the check fails on a removed entry, on a changed entry, and on a
          new entry that names that existing tag, and passes on an unchanged
          register; they also read the review workflow and check that it runs
          the step.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-001
      - id: DOCBW-08-004
        priority: MUST
        kind: project
        statement: >-
          The status box of the Protocol Specification and the status tables
          of its revision log MUST be committed fragments generated from the
          drafts register.
        rationale: >-
          Today the status of a draft is written by hand in two places. A
          generated status cannot disagree with the register that the release
          automation reads, and a committed fragment shows each change in the
          pull request that makes it.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` generate the fragments
          from a fixture register and compare them with the register's
          entries.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-001
      - id: DOCBW-08-005
        priority: MUST
        kind: project
        statement: >-
          A pre-commit hook MUST fail when a committed DOCBW-08-004 fragment
          differs from a fresh generation from the drafts register.
        rationale: >-
          Without the check, a register edit that is not regenerated leaves the
          pages saying one thing while the automation reads another.
          DOCBW-03-013 then runs the hook in the review workflow too.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` change a fixture register
          without regenerating and check that the check fails, and read
          `.pre-commit-config.yaml` to check that the hook's `files:` match the
          register and the fragments.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-004
      - id: DOCBW-08-006
        priority: MUST
        kind: project
        statement: >-
          When the drafts register holds an unreleased entry, the generated
          status box MUST label the Protocol Specification "Current draft (work
          in progress)".
        rationale: >-
          A reader must be able to tell the moving current text from a frozen
          draft, which the banner of a frozen page names.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` generate the status box
          from a fixture register with an unreleased entry and check the label.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-004
      - id: DOCBW-08-007
        priority: MUST
        kind: project
        statement: >-
          When the drafts register holds no unreleased entry, the generated
          status box MUST name the newest released draft and its release tag,
          and carry no current-draft label.
        rationale: >-
          The promoted commit holds the register with the draft just marked
          released and no newer draft opened, so its pages are the text the
          release carries. The archive is built from those pages, so they must
          read as that released draft, not as a draft still in progress.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` generate the status box
          from a fixture register whose entries are all released and check
          the draft, the tag and the absence of the label.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-004
      - id: DOCBW-08-008
        priority: MUST
        kind: project
        statement: >-
          The generated revision log status tables MUST link the frozen copy
          at `spec/draft-N/` of every released draft.
        rationale: >-
          A reader who finds a draft in the revision log needs its permanent
          address. A generated link cannot miss a released draft.
        verification: >-
          Tests in `test/ci/test_drafts_register.py` generate the status tables
          from a fixture register with two released drafts and check both
          links.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-004
      - id: DOCBW-08-009
        priority: MUST
        kind: project
        statement: >-
          When the drafts register at the chosen publish's commit names the
          run's release as the release of `draft-N`, the promote workflow MUST
          create that draft release with the archive
          `vultron-spec-draft-N.tar.gz` and its manifest
          `vultron-spec-draft-N.sha256` attached, in the step that creates it.
        rationale: >-
          A published release is immutable, and the maintainer publishes the
          draft by hand after reviewing its notes. A draft release that existed
          without its assets could be published in that state, and could then
          never get them. The promote is the one step that knows both the
          release and its commit, so the frozen copy needs no manual step.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` promote a fixture publish
          whose register names the new tag as a draft's release, and check that
          the release is created as a draft by one call that names both files,
          that the tag is pushed only after the DOCBW-08-021 check passes, and
          that the release is never published by the run.
        adr:
          - ADR-0188
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-001
          - rel_type: uses_definition
            spec_id: DOCBW-08-001
      - id: DOCBW-08-010
        priority: MUST_NOT
        kind: project
        statement: >-
          A promote run whose release the drafts register names for no draft
          MUST NOT attach an archive or a manifest.
        rationale: >-
          A monthly release that carries no new draft would otherwise claim a
          frozen copy of a text that it does not release.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` promote a fixture publish
          whose register names no draft for the new tag, and check that the
          draft release has no asset.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-009
      - id: DOCBW-08-011
        priority: MUST
        kind: project
        statement: >-
          The promote workflow MUST refuse the run, and create no tag, when the
          drafts register at the chosen publish's commit names as a draft's
          release a tag that is not the run's release and whose own register
          does not hold the same entry. Such a tag either does not exist or
          is an earlier release that never carried the draft.
        rationale: >-
          The register is edited before the promote and predicts the tag name.
          When the prediction is wrong, for example because the promote moved
          to the next month, or names an earlier release, the release would
          carry pages that name a different release, and no frozen copy would
          ever be made; once that other release is published, every deploy
          fails (DOCBW-08-033).
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` promote a fixture publish
          whose register names a tag the run would not create, and one whose
          register names an existing earlier tag whose own register lacks the
          entry, and check that each run fails and creates no tag.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-009
      - id: DOCBW-08-012
        priority: MUST
        kind: project
        statement: >-
          The promote workflow MUST refuse the run, and create no tag, when the
          drafts register at the chosen publish's commit names the run's
          release for a draft and also holds an unreleased entry.
        rationale: >-
          An unreleased entry means a newer draft is open at that commit, so
          its pages are not the text of the draft the release would carry, and
          the frozen copy would freeze the wrong text.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` promote a fixture publish
          whose register names the new tag for one draft and holds another,
          unreleased one, and check that the run fails and creates no tag.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-009
      - id: DOCBW-08-013
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-08-009 archive MUST hold the pages that the shared site
          build (DOCBW-06-004) renders from `docs/reference/vultron-spec/` at
          the release's commit, with every file those pages load. Its root is
          the specification's root: the page built at
          `reference/vultron-spec/index.html` is `index.html` in the archive.
        rationale: >-
          The frozen copy must be the text the release carries, rendered by
          the toolchain of that release, and served at `spec/draft-N/` with the
          same page paths as the live specification has below its own root.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` build the archive from a
          fixture site and check that its page paths are the specification's
          page paths below its root, and that it holds no other page.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-06-004
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-014
        priority: MUST
        kind: project
        statement: >-
          The site build of the DOCBW-08-009 archive MUST pass the chosen
          publish tag and its date, and the run's release tag, as the build
          inputs of DOCBW-06-031.
        rationale: >-
          Every page's footer prints those inputs. A frozen page whose footer
          named no release, or another publish, would contradict its banner.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` build the archive from a
          fixture site and check that each page's footer names the chosen
          publish tag and the release tag.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
          - rel_type: uses_definition
            spec_id: DOCBW-06-031
      - id: DOCBW-08-015
        priority: MUST
        kind: project
        statement: >-
          Every relative reference in a page of the DOCBW-08-009 archive MUST
          resolve to a file inside the archive.
        rationale: >-
          A reference that resolves into the live site would let a later change
          of the live site alter the frozen page, and would break the archive
          when it is read offline.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` unpack an archive built from
          a fixture site into an empty folder and check that every relative
          `href`, `src` and `srcset` resolves inside it.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-016
        priority: MUST
        kind: project
        statement: >-
          Every link in a page of the DOCBW-08-009 archive to a page outside
          the Protocol Specification MUST be an absolute URL below the site's
          `site_url`.
        rationale: >-
          The frozen copy freezes the specification, not the rest of the site.
          A relative link out of the specification would resolve to nothing in
          the archive, or to an unrelated page below `spec/`.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` build the archive from a
          fixture site whose specification links a page outside it, and check
          that the link is absolute on the configured `site_url`.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-017
        priority: MUST
        kind: project
        statement: >-
          Every page of the DOCBW-08-009 archive MUST carry a banner. The
          banner names the draft version, the release tag, the full commit SHA
          and the UTC build date. It also says that the page's links outside
          the specification go to the live site, which changes.
        rationale: >-
          A reader who opens a frozen page must see which text it is and how to
          cite it, and must not take a linked page of the live site for part of
          the frozen text.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` build the archive from a
          fixture site and check the banner on every page.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-018
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-08-009 manifest MUST list every file of the archive, and no
          other file, with its SHA-256 digest, in the line format that
          `sha256sum --check` reads.
        rationale: >-
          The deploy checks each unpacked file against the manifest. A standard
          format also lets a reviewer check a downloaded archive with no
          project tool.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` build an archive and its
          manifest from a fixture site and check the manifest with
          `sha256sum --check` against the unpacked archive.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-019
        priority: MUST_NOT
        kind: project
        statement: >-
          The job of the promote workflow that builds the DOCBW-08-009 archive
          MUST NOT hold a token that can write to the repository.
        rationale: >-
          The build runs project code from the promoted commit. Only the job
          that pushes the release tag and attaches the assets needs write
          access, as the publication workflow already separates build and tag.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` read the promote workflow
          and check that the job that builds the archive has no write
          permission.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-005
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-020
        priority: MUST_NOT
        kind: project
        statement: >-
          The job of the promote workflow that attaches the DOCBW-08-009 assets
          MUST NOT run code from the promoted commit. It takes the archive and
          the manifest as an artifact of the DOCBW-08-019 job.
        rationale: >-
          The job holds write access. Code from the promoted commit is not the
          reviewed copy on `main` that the run started from, so running it with
          write access would undo the split of DOCBW-08-019.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` read the promote workflow
          and check that the attaching job checks out `main` only and receives
          the archive as a downloaded artifact.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-019
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-021
        priority: MUST
        kind: project
        statement: >-
          Before it pushes the release tag or creates the release, the promote
          workflow MUST unpack the built DOCBW-08-009 archive into an empty
          folder and fail the run when that tree breaks DOCBW-08-015 or does not
          match the manifest.
        rationale: >-
          Tests cover the archive builder on fixtures, not the real archive. A
          defect found before anything exists leaves nothing behind, and a
          defect found after publication can never be fixed.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` give the promote an archive
          with a relative reference that leaves it, and one that does not match
          its manifest, and check that each fails with no new tag and no
          release.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
          - rel_type: uses_definition
            spec_id: DOCBW-08-015
      - id: DOCBW-08-022
        priority: MUST
        kind: project
        statement: >-
          After it creates the DOCBW-08-009 draft release, the promote workflow
          MUST check that the attached assets are byte-identical to the built
          ones.
        rationale: >-
          The maintainer publishes a draft release once its run is green, and a
          published asset can never be replaced, so a truncated upload must
          fail the run while the release is still a draft.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` give the promote a release
          whose attached archive differs from the built one, and check that the
          run fails.
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-023
        priority: MUST
        kind: project
        statement: >-
          When the upload of a DOCBW-08-009 asset, the DOCBW-08-022 check, or
          any later step of the run fails, the promote workflow MUST delete the
          draft release it created before the run ends.
        rationale: >-
          A draft release left without its matching assets could be published
          by hand and then never repaired, and the maintainer publishes only
          the draft release of a green run, so a red run leaves none. A draft
          release is not yet immutable, so deleting it is safe, and the tag
          stays: DOCBW-07-009
          forbids deleting it, and a re-run then resumes it under DOCBW-07-010.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` make the upload fail, make
          the check fail, and make a step after the check fail, and check that
          afterwards the tag exists and no release does.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-022
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-037
        priority: MUST
        kind: project
        statement: >-
          When the DOCBW-08-023 delete fails, the promote workflow MUST fail the
          run with a message that names the draft release and says that it is
          incomplete and must not be published.
        rationale: >-
          A draft release the run could not delete may lack its matching pair.
          The maintainer must learn not to publish it; the next run deletes it
          under DOCBW-08-025.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` make the upload fail and the
          delete fail, and check that the run fails with that message.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-023
      - id: DOCBW-08-024
        priority: MUST
        kind: project
        statement: >-
          When the drafts register names the run's release as a draft's release
          and that release is a draft with a matching DOCBW-08-009 pair, the
          refusal of DOCBW-07-016 MUST say that the draft release is complete
          and waiting for the maintainer to publish it.
        rationale: >-
          A re-run after a green run has nothing to do. The message tells the
          maintainer to publish rather than to look for a failure.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` run the promote twice on a
          fixture repository and check that the second run refuses with that
          message and leaves the release and its assets unchanged.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-016
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-025
        priority: MUST
        kind: project
        statement: >-
          When the chosen publish's commit carries the latest `v*` tag, made by
          the promote workflow, whose release is a draft that the drafts
          register names as a draft's release and that lacks a matching
          DOCBW-08-009 pair, the promote workflow MUST delete that draft
          release and continue as DOCBW-07-010 states.
        rationale: >-
          A run stopped from outside, for example by a cancelled runner, can
          leave a draft release before DOCBW-08-023 deletes it. The re-run
          removes it, so the draft release a maintainer sees again carries its
          assets, and no path ever completes the assets of an existing draft.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` start the promote with a
          draft release that has only the archive, and with a mismatched pair,
          and check that the run deletes it and creates a new draft release
          with a matching pair, and creates no tag.
        relationships:
          - rel_type: supersedes
            spec_id: DOCBW-07-016
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
        see_also:
          - spec_id: DOCBW-07-010
            reason: 'the resume of a tag with no release that the run continues as'
      - id: DOCBW-08-026
        priority: MUST
        kind: project
        statement: >-
          When the drafts register names the run's release as a draft's release
          and that release is published without a matching DOCBW-08-009 pair,
          the refusal of DOCBW-07-016 MUST say that the published release
          cannot take the archive.
        rationale: >-
          The ordering of DOCBW-08-021 to DOCBW-08-025 prevents this case, but a
          maintainer can still publish a draft release that a stopped run had
          not yet deleted. An immutable release refuses a new asset, so the
          maintainer must learn that a re-run cannot help.
          The rule is limited to the run's own release, so an older release
          never blocks the promote of a newer one.
        verification: >-
          Tests in `test/ci/test_frozen_drafts.py` start the promote against a
          fixture release that is published without the pair, and check the
          refusal and its message.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-07-016
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-027
        priority: MUST
        kind: project
        statement: >-
          The publication workflow MUST read the drafts register as `main`
          holds it when the run starts, whatever commit the run deploys.
        rationale: >-
          A rollback deploys an older commit, whose register may not name a
          draft that was released later. Reading the register from `main` keeps
          every frozen draft served across any rollback the gate accepts
          (DOCBW-08-038).
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` roll a fixture repository back
          to a commit from before a draft's release, and check that the draft is still
          served.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-001
      - id: DOCBW-08-038
        priority: MUST_NOT
        kind: project
        statement: >-
          A rollback MUST NOT pass the CI gate when its target commit lacks the
          DOCBW-08-028 step.
        rationale: >-
          The build runs the target commit's own steps and checks, so a target
          older than the step would serve no frozen draft, and its publication
          checks, which lack the DOCBW-08-036 exemption, would judge the
          frozen pages. Refused at the gate, the rollback writes its reason to
          the run summary (DOCBW-06-011), as DOCBW-06-030 does for a missing
          local action. Every rollback the gate accepts serves every frozen
          draft (DOCBW-08-027).
        verification: >-
          Tests in `test/ci/test_publish_gate.py` give the gate a rollback target from
          before the DOCBW-08-028 step and check that it is refused with its reason in
          the run summary, and one after it and check that it passes.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-06-030
          - rel_type: uses_definition
            spec_id: DOCBW-08-028
      - id: DOCBW-08-028
        priority: MUST
        kind: project
        statement: >-
          For each released draft whose release is published, the publication
          workflow MUST unpack the release's DOCBW-08-009 archive into
          `site/spec/draft-N/` in the job that builds the site, after the
          shared build and before the publication gates of DOCBW-06-002.
        rationale: >-
          A Pages deploy replaces the whole site, so every deploy must place
          every frozen draft again. Unpacking before the gates lets the link
          check cover the frozen pages, and the build job holds no token that
          can write or deploy (DOCBW-06-027).
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` serve fixture archives into a
          fixture `site/` and check each draft's pages under `spec/draft-N/`, and read
          the publication workflow to check the job and the step order.
        lint_suppress:
          - phantom_path_ref
        adr:
          - ADR-0188
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
          - rel_type: uses_definition
            spec_id: DOCBW-06-002
      - id: DOCBW-08-029
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-08-028 step MUST refuse an archive, before it writes any
          file, when a member has an absolute path, a `..` component, or a type
          other than a regular file or a folder.
        rationale: >-
          The manifest is checked after the unpack, so a crafted member could
          otherwise write outside `site/spec/draft-N/`, or plant a link, before
          any check sees it.
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` serve fixture archives with an
          absolute member, a `..` member and a symbolic link, and check that each is
          refused and that nothing was written.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-028
      - id: DOCBW-08-030
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-08-028 step MUST fail unless the unpacked tree holds
          exactly the files that the manifest lists, each with the listed
          SHA-256 digest.
        rationale: >-
          The frozen copy is the bytes the promote built. A missing, extra or
          changed file means the site would serve a text that no release
          carries.
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` serve fixture archives with a
          missing file, an extra file and a changed file, and check that each fails.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-028
      - id: DOCBW-08-031
        priority: MUST_NOT
        kind: project
        statement: >-
          A workflow that builds the site MUST NOT render any page from a
          commit other than the one it checked out. A frozen draft's pages
          come only from its DOCBW-08-009 archive.
        rationale: >-
          A rebuild of an old draft runs today's environment on an old tag, so
          its output can drift. A frozen draft comes only from its archive.
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` read each workflow that builds
          the site and check that it runs one shared build per job, that no checkout
          step names a `v*` tag, and that no run step checks out or adds a worktree of
          another ref.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-032
        priority: MUST
        kind: project
        statement: >-
          For each released draft whose release is not published, the
          DOCBW-08-028 step MUST write a placeholder page at
          `site/spec/draft-N/index.html` that names the release, and name the
          draft in the run summary.
        rationale: >-
          The register marks a draft released before its tag exists, and its
          release stays a draft until the maintainer publishes it. The pages
          link the frozen copy from then on. The placeholder keeps that link
          from being dead in every build in between, so the publish the promote
          needs is not blocked, and the summary shows why the frozen copy is
          not served yet. A token with read access cannot see a draft release,
          so a draft counts as not published.
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` serve registers whose release
          tag does not exist, has no release, and has a draft release, and check the
          placeholder and the summary line in each case.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-028
      - id: DOCBW-08-033
        priority: MUST
        kind: project
        statement: >-
          When a published release that the drafts register names as a draft's
          release lacks a DOCBW-08-009 file, or its archive fails DOCBW-08-030,
          the DOCBW-08-028 step MUST fail, naming the draft and the release.
        rationale: >-
          A deploy that went on without the draft would drop a frozen draft
          from the site with no failing check. The step runs before the Pages
          upload, and in the review workflow too (DOCBW-08-035), so a pull
          request sees the failure the deploy would. The failure notice of
          DOCBW-06-003 then reports a failed deploy.
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` serve a register whose
          published release lacks the archive, and one whose archive fails its manifest,
          and check that each fails and names the draft and the release; they also read
          the publication workflow and check that the serving step runs in the build
          job, before the Pages upload.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-028
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
          - rel_type: uses_definition
            spec_id: DOCBW-08-030
      - id: DOCBW-08-034
        priority: MUST
        kind: project
        statement: >-
          The DOCBW-08-028 step MUST fail when the shared site build produced
          any file below `site/spec/`.
        rationale: >-
          `spec/` is reserved for frozen drafts. A page built there would be
          overwritten by an archive, or would sit at an address that a later
          draft claims.
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` serve archives into a fixture
          `site/` that already holds a file below `spec/`, and check that the step
          fails.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-028
      - id: DOCBW-08-035
        priority: MUST
        kind: project
        statement: >-
          The review workflow `.github/workflows/docs-build-check.yml` MUST run
          the DOCBW-08-028 step before its publication checks, reading the
          drafts register at the commit it checked out.
        rationale: >-
          The live pages link every frozen draft. The pull-request check must
          see the same tree as the deploy, or its link check fails on those
          links, or misses a broken one. A pull request that edits the
          register is checked with its own edit.
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` read the review workflow and
          check that the serving step runs after the shared build and before the
          publication checks, and that it is given the checked-out tree's register, not
          one read from another ref.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-028
      - id: DOCBW-08-039
        priority: MUST
        kind: project
        statement: >-
          The job of the promote workflow that builds the DOCBW-08-009 archive
          MUST run the DOCBW-08-028 step after the shared build and before its
          publication checks, reading the drafts register at the promoted
          commit.
        rationale: >-
          The Revision Log at that commit links the frozen copy of every
          released draft, including the draft this run releases. Without the
          served tree, the link check and the archive build find no file for
          those links and fail, so the run makes no tag. With it, the archive
          builder writes each link as its live URL (DOCBW-08-016).
        verification: >-
          Tests in `test/ci/test_serve_frozen_drafts.py` read the promote
          workflow and check that its archive job runs the serving step after
          the shared build and before the publication checks and the archive
          build, with the checked-out register. A test in
          `test/ci/test_frozen_drafts.py` builds an archive from a site whose
          Revision Log links a served frozen-copy page and checks that the
          link becomes its live URL.
        relationships:
          - rel_type: extends
            spec_id: DOCBW-08-028
          - rel_type: uses_definition
            spec_id: DOCBW-08-009
      - id: DOCBW-08-036
        priority: MUST_NOT
        kind: project
        statement: >-
          The DOCBW-03-008 continuity step, the DOCBW-03-012 step and the
          DF-11-045 reading-path box check MUST NOT judge files below
          `site/spec/`, and no URL below `spec/` is added to the DOCBW-03-008
          record of served URLs.
        rationale: >-
          A frozen page never changes, so a rule added after its release would
          fail it on every later build. The register and DOCBW-08-033 keep
          each frozen draft served, and the link check still covers its pages.
        verification: >-
          Tests in `test/metadata/docs/test_legacy_urls.py` and
          `test/metadata/docs/test_path_boxes.py` place a frozen page that breaks a
          reading-path rule and is absent from the record below a fixture `site/spec/`,
          and check that those checks pass.
        lint_suppress:
          - phantom_path_ref
        relationships:
          - rel_type: supersedes
            spec_id: DOCBW-03-008
          - rel_type: supersedes
            spec_id: DOCBW-03-012
          - rel_type: supersedes
            spec_id: DF-11-045
          - rel_type: uses_definition
            spec_id: DOCBW-08-028
