id: TRIG
title: Triggerable Behaviors
description: Requirements for the trigger API that allows an actor to initiate protocol behaviors based on its own internal
  state, rather than reacting to an inbound ActivityStreams message. Triggerable behaviors are the outgoing counterpart to
  the inbound handler pipeline and are required to demonstrate the full CVD protocol.
scope:
- prototype
- production
tags:
- messaging
- protocol
groups:
- id: TRIG-01
  title: Endpoint Format
  specs:
  - id: TRIG-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The system MUST expose trigger endpoints using the path pattern `POST /actors/{actor_id}/trigger/{behavior-name}`
    rationale: >-
      The path names the actor and the behavior, so a client does not need to learn a
      different route for each verb. The server takes the actor only from the path,
      never from the body. Thus each request names one actor in one place.
  - id: TRIG-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Trigger endpoints MUST return HTTP 202 on successful acceptance
    rationale: >-
      The behavior runs after the server sends the response (TRIG-01-004). Thus the
      server can confirm only that it accepted the request, not that the behavior is
      complete. A 202 response states exactly this, and the inbox uses the same code
      (IE-05-001).
    relationships:
    - rel_type: depends_on
      spec_id: HTTP-01-003
  - id: TRIG-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Trigger endpoints MUST return a structured error response when the actor, case, or report referenced in the
      request body cannot be resolved
    rationale: >-
      A request that names an actor, case or report that the server does not hold cannot
      succeed. When the server refuses it in the response, the caller knows the problem
      immediately. A 202 response would hide the failure in a background task that the
      caller cannot see.
    relationships:
    - rel_type: depends_on
      spec_id: EH-05-001
  - id: TRIG-01-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Trigger endpoint processing MUST NOT block the HTTP response; long-running behavior execution MUST run as a
      background task
    rationale: >-
      A behavior tree run and its outbox delivery can take much longer than an HTTP
      client waits. If the server held the response, each call would use a server worker
      for that time. A caller timeout would also look like a failed behavior. Thus the
      trigger sends the response first and runs the behavior after it, as the inbox does
      (IE-05-002).
    relationships:
    - rel_type: depends_on
      spec_id: IE-03-001
- id: TRIG-02
  title: Candidate RM Behaviors
  specs:
  - id: TRIG-02-001
    priority: SHOULD
    kind: project
    statement: >-
      The following RM behaviors SHOULD be individually triggerable via the trigger
      API: validate-report, invalidate-report, reject-report, submit-report,
      ack-report
    rationale: >-
      Each of these steps is a decision that an actor makes about a report. A person or
      an agentic client must be able to make that decision through the behavior tree of
      the actor. When a case holds a report, the case refuses `Close(Report)` from all
      senders (CM-23-019, ADR-0144). An actor closes its part when it leaves the case
      (TRIG-13-001). Thus no report trigger closes a report that a case holds. To close
      a report that no case holds, an actor uses reject-report (ADR-0145).
    adr:
    - ADR-0145
  - id: TRIG-02-002
    priority: SHOULD
    kind: project
    statement: 'The following EM behaviors SHOULD be individually triggerable via the trigger API: propose-embargo, accept-embargo, reject-embargo, propose-embargo-revision, terminate-embargo'
    rationale: >-
      Each embargo step is a decision that an actor makes. A person or an agentic client
      must be able to make that decision without building activities by hand. One
      trigger for each step gives each decision its own entry point and its own request
      checks.
  - id: TRIG-02-003
    priority: SHOULD
    kind: project
    statement: >-
      The following CS state-notification behaviors SHOULD be individually
      triggerable via the general-purpose trigger API (TRIG-08-003):
      notify-fix-ready, notify-fix-deployed, notify-published,
      notify-public-exploit, notify-attacks-observed. notify-published records
      that the actor has become Public Aware (it has learned the vul is public,
      by whatever means); it does not assert that the actor published anything.
    rationale: >-
      An actor learns each of these facts in one of two ways. An outside party tells it:
      a person or a tool invokes the trigger. Or the behavior tree of the actor asks an
      outside source through a call-out point (for example,
      `DevelopFixCallOutBundle.create_fix_factory`). Both ways are correct in
      production. Thus these triggers are general-purpose triggers (TRIG-08-002), not
      demo-only triggers.
    note: >-
      Only three of the five exist today, under `/demo/`; #4159 owns exposing all
      five.
  - id: TRIG-02-004
    priority: SHOULD
    kind: project
    statement: >-
      The following case management behaviors SHOULD be individually triggerable
      via the trigger API: engage-case, defer-case, leave-case, add-object-to-case,
      create-case, add-report-to-case
    rationale: >-
      An actor makes its own decision to engage, defer, leave or add to a case. A client
      needs one entry point for each decision. Then each decision runs the behavior tree
      of the actor, not an activity that someone built by hand.
    adr:
    - ADR-0145
  - id: TRIG-02-005
    priority: SHOULD
    kind: project
    statement: >-
      The following participant management behaviors SHOULD be individually triggerable
      via the trigger API: suggest-actor-to-case, accept-case-invite, reject-case-invite,
      invite-actor-to-case, accept-actor-recommendation, reject-actor-recommendation
    rationale: >-
      Invitations, suggestions and answers to invitations decide who takes part in a
      case. This is an actor decision. One trigger for each step lets a client make each
      decision through the behavior tree of the actor. That tree applies the role checks
      and the addressing checks.
  - id: TRIG-02-006
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection of the router mounting confirms add-note-to-case and
      sync-log-entry are mounted only under `/demo/` and only when demo mode is enabled.
    statement: >-
      The following behaviors exist only to support demo and prototype scenarios.
      They are exposed under the `/demo/` URL prefix (see TRIG-09-001) and MUST NOT
      be mounted in production mode (see TRIG-09-002): add-note-to-case,
      sync-log-entry
    rationale: >-
      Production needs neither verb. A correct implementation commits a SYNC entry each
      time the state changes. Thus sync-log-entry only lets a demo script insert entries
      by hand (TRIG-10-004). add-note-to-case is a shortcut for add-object-to-case,
      which already adds a Note (TRIG-10-003). Leaving a case is an actor decision, not
      a demo step that a script controls. Thus it is the general-purpose leave-case
      trigger (TRIG-13-001), not a demo verb (ADR-0145).
    adr:
    - ADR-0145
  - id: TRIG-02-007
    priority: SHOULD
    kind: project
    statement: >-
      Actors holding the CASE_OWNER role SHOULD be able to trigger the following role
      delegation behaviors via the trigger API: offer-case-manager-role,
      offer-case-participant-role, offer-case-ownership-transfer,
      accept-case-ownership-transfer.
    rationale: >-
      Only the Case Owner can delegate its roles or transfer the case. Thus the Case
      Owner needs an entry point for each delegation step. Without one, the only way to
      delegate is to build the Offer or the Accept by hand. That skips the behavior tree
      of the owner.
- id: TRIG-03
  title: Request Body
  specs:
  - id: TRIG-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Each trigger request body MUST include at least one of `case_id` (for
      case-scoped behaviors) or `offer_id` (for offer-response behaviors).
      Full per-behavior field requirements are defined in the API schema.
    rationale: >-
      A case-scoped behavior with no case id has nothing to act on. An offer response
      with no offer id also has nothing to act on. When the request schema requires the
      id, the server refuses a call that cannot run, before it queues anything.
  - id: TRIG-03-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Unknown fields in the request body MUST be ignored (forward-compatibility)
    rationale: >-
      A client built for a newer API can send fields that this server does not know.
      When the server ignores them, that client continues to work with an older server.
      The server still validates the fields that it knows.
  - id: TRIG-03-003
    priority: SHOULD
    kind: project
    statement: The trigger endpoint request body SHOULD support an optional `note` field containing free-text content that
      will be embedded in the outgoing ActivityStreams activity (e.g., rationale for embargo proposal, reason for deferral)
    rationale: >-
      The recipients of an activity see only what the activity carries. A free-text note
      lets the acting party tell them why it acted, for example the reason for a
      deferral. A CVD decision often needs this reason, and no structured field holds
      it.
  - id: TRIG-03-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `reject-report` trigger request body MUST include a `note` field (reason required); the `note` value SHOULD
      be non-empty
    rationale: Hard-close decisions are irreversible and warrant documented justification for audit purposes
    relationships:
    - rel_type: refines
      spec_id: TRIG-03-003
    - rel_type: depends_on
      spec_id: CS-08-001
- id: TRIG-04
  title: Response Body
  specs:
  - id: TRIG-04-001
    priority: SHOULD
    kind: project
    statement: 'A successful trigger response SHOULD include the resulting ActivityStreams activity in the response body under
      an `activity` key:'
    rationale: >-
      The caller often needs the exact activity that the actor sent. The caller can show
      the activity, audit it, or name it in a later call, for example the proposal that
      a withdrawal names (TRIG-11-006). When the response contains the activity, the
      caller does not need a second lookup, and the response states what the actor sent.
  - id: TRIG-04-002
    priority: MAY
    kind: project
    statement: When a trigger initiates a long-running behavior, the response MAY return a job object per `AR-04-001` instead
      of the activity directly
    rationale: >-
      A behavior that runs for a long time cannot return its activity in the response,
      because the activity does not exist yet. A job object gives the caller an item
      that it can poll to get the result.
    scope:
    - production
    relationships:
    - rel_type: depends_on
      spec_id: AR-04-001
  - id: TRIG-04-003
    priority: MUST
    kind: project
    statement: When a triggered behavior terminates because it emitted an authorization request rather than completing the
      requested action, the trigger response MUST identify the request it emitted.
    rationale: >-
      A trigger returns 202 and runs the behavior in the background. Without more data,
      a caller cannot tell "done" from "waiting for the decision of a different party".
      Under ASK-01-002, success means that the actor sent the request, so success alone
      has two meanings. When the response names the request, the caller can find the
      outcome in the outstanding-ask collection (ASK-04-009).
    note: >-
      This closes the CONCERN-2369 gap only for behaviors that stop to ask. Outcomes of
      behaviors that fail for other reasons remain unobservable and are tracked
      separately on CONCERN-2369.
    verification: A trigger whose behavior emits an authorization request returns a response identifying that request, and the
      identified request is retrievable from the actor's outstanding-ask collection.
    adr:
    - ADR-0080
    relationships:
    - rel_type: depends_on
      spec_id: ASK-04-009
- id: TRIG-05
  title: BT Integration
  specs:
  - id: TRIG-05-001
    priority: SHOULD
    kind: project
    statement: Trigger endpoint implementations SHOULD reuse existing BT trees rather than duplicating behavior logic
    rationale: >-
      The same behavior can start from a trigger or from a received message. When both
      entry points use one tree, their checks and effects cannot become different
      (CS-22-001).
    stories:
    - story_2022_086
  - id: TRIG-05-002
    priority: SHOULD
    kind: project
    statement: The trigger endpoint SHOULD invoke the BT tree via the bridge layer (`vultron/core/behaviors/bridge.py`) using
      the same pattern as existing BT-using handlers
    rationale: >-
      The bridge is the only place that sets up the blackboard and DataLayer of a tree,
      ticks the tree, and reads its result. When trigger trees run through the bridge,
      they get the same execution and error handling as received trees. Then there is no
      second runner to keep the same as the first.
    relationships:
    - rel_type: depends_on
      spec_id: BT-05-001
- id: TRIG-06
  title: Per-Actor DataLayer
  specs:
  - id: TRIG-06-001
    priority: MUST
    kind: project
    statement: Trigger endpoints MUST resolve the correct per-actor DataLayer instance using the `actor_id` path parameter
    rationale: >-
      Trigger endpoints are this codebase's local REST surface for driving its own
      actors, not messages between implementations, and per-actor stores are how
      this codebase isolates them (ADR-0073). Only this codebase must obey it, so it
      is `project` (ADR-0134).
    verification: >-
      Inspection of `vultron/adapters/driving/fastapi/` confirms that each trigger
      endpoint resolves its DataLayer instance keyed on the `actor_id` path
      parameter.
    relationships:
    - rel_type: depends_on
      spec_id: CM-01-001
    stories:
    - story_2022_088
    - story_2022_106
  - id: TRIG-06-002
    priority: MUST
    kind: project
    statement: Trigger endpoint implementations MUST accept the DataLayer instance via dependency injection to allow per-actor
      isolation to be retrofitted without changing endpoint contracts
    rationale: >-
      Tests and alternative deployments replace the store through the dependency, not
      through the endpoint. With injection, the way the server resolves a store can
      change, and the routes that clients call do not change.
    verification: >-
      Inspection of `vultron/adapters/driving/fastapi/` confirms that the DataLayer
      instance is injected via a FastAPI dependency rather than constructed inside
      the endpoint handler.
    relationships:
    - rel_type: depends_on
      spec_id: CM-01-001
- id: TRIG-07
  title: Outbox Activity
  specs:
  - id: TRIG-07-001
    priority: MUST
    kind: project
    statement: A successfully executed trigger MUST produce an outgoing ActivityStreams activity added to the actor's outbox
    rationale: >-
      A trigger exists so that the actor can tell a different party something. The
      outbox is the only way that an activity leaves the actor (OX-02-001). If a run
      reports success and the outbox is empty, the caller thinks that the actor sent a
      message, but the actor did not.
    verification: >-
      Integration tests in `test/demo/` confirm that each successfully executed
      trigger adds a new activity to the actor's outbox.
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    stories:
    - story_2022_039
    - story_2022_081
- id: TRIG-08
  title: Trigger Classification
  specs:
  - id: TRIG-08-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'The application MUST define a `RunMode` StrEnum with at least two values: `PROTOTYPE` and `PROD`'
    rationale: >-
      The server mode decides whether demo-only routes exist, so the mode must be one
      named setting. With a closed enum, a misspelled or undefined mode is a validation
      error, not a silent fallback.
  - id: TRIG-08-002
    priority: MUST
    kind: project
    statement: A trigger is **general-purpose** if it represents either a legitimate external stimulus (e.g., a finder submitting
      a report) or an intentional actor decision that a human operator or agentic client might initiate (e.g., validating
      a report, proposing an embargo). A trigger is **demo-only** if the only reason it exists is to let a demo script puppeteer
      an actor through a step the actor's own BT would handle autonomously in a real deployment.
    rationale: >-
      A demo-only trigger makes an actor do a step that its own behavior tree would do.
      In production, such a trigger would let a caller override the actor. The
      definitions give each verb a test that a reviewer can check, and the test decides
      whether production can expose the verb.
    verification: >-
      Every row of the trigger registry (TRIG-12-004) declares its `exposure`
      (general-purpose or demo-only), so the classification is a data-table fact
      per verb rather than a docstring judgment; the route-to-registry test
      (`test/adapters/driving/fastapi/test_trigger_registry_routes.py`) asserts
      each row is mounted under the prefix its exposure names. Which exposure a
      verb *deserves* is still a review question answered against this
      requirement's definitions when the row is added.
  - id: TRIG-08-003
    priority: MUST
    kind: project
    statement: General-purpose triggers MUST be exposed under the path prefix `/actors/{actor_id}/trigger/{behavior-name}`
      (TRIG-01-001)
    rationale: >-
      One prefix for production triggers gives clients one place to find them. It also
      makes the production surface equal to all routes under that prefix.
    verification: >-
      Every row of the trigger registry (TRIG-12-004) declares its exposure; the
      route-to-registry test asserts that each general-purpose row is mounted
      under `/actors/{actor_id}/trigger/` and that no route under that prefix
      lacks a general-purpose row.
  - id: TRIG-08-004
    priority: MUST
    kind: project
    statement: Demo-only triggers MUST be exposed under the path prefix `/actors/{actor_id}/demo/{behavior-name}` (see TRIG-09-001)
    rationale: >-
      A separate prefix lets the server mount or omit the demo routes as one group
      (TRIG-09-002). It also shows a demo call in its URL.
    verification: >-
      Every row of the trigger registry (TRIG-12-004) declares its exposure; the
      route-to-registry test asserts that each demo-only row is mounted under
      `/actors/{actor_id}/demo/` and that no route under that prefix lacks a
      demo-only row.
  - id: TRIG-08-005
    priority: MUST
    kind: project
    statement: '`RunMode` MUST be stored as `ServerConfig.run_mode` within `AppConfig` (CFG-04-001) with a default of `RunMode.PROTOTYPE`'
    rationale: >-
      All run-time settings are in one configuration model (CFG-04-001), so the mode is
      set in the same place as all other settings. The default is `PROTOTYPE` because
      this codebase runs as a prototype, and its demos need the demo routes with no
      extra setup.
    verification: >-
      Inspection of `vultron/core/` confirms that `ServerConfig.run_mode` is typed
      as `RunMode` within `AppConfig` and defaults to `RunMode.PROTOTYPE`.
    relationships:
    - rel_type: depends_on
      spec_id: CFG-04-001
- id: TRIG-09
  title: Demo Trigger Endpoints
  specs:
  - id: TRIG-09-001
    priority: MUST
    kind: project
    statement: Demo-only trigger endpoints MUST use the URL path pattern `POST /actors/{actor_id}/demo/{behavior-name}`
    rationale: >-
      Demo routes and general-purpose routes are different only in one path segment.
      Thus demo scripts and clients use the same call shape for both, and that segment
      alone shows the kind of call.
    verification: >-
      Inspection of `vultron/adapters/driving/fastapi/` confirms that the demo
      router registers all demo-only endpoints under the
      `POST /actors/{actor_id}/demo/{behavior-name}` path pattern.
  - id: TRIG-09-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'The demo router MUST be conditionally mounted: it MUST be included in the FastAPI application only when `get_config().server.run_mode
      == RunMode.PROTOTYPE`'
    rationale: >-
      Demo-only verbs move an actor through steps that it would do by itself. If a
      production server mounted them, any caller could make an actor do a step in place
      of its own behavior tree. A caller cannot call a route that the server does not
      mount.
  - id: TRIG-09-003
    priority: MUST
    kind: project
    statement: When `run_mode == RunMode.PROD`, any request to a path under `/demo/` MUST return HTTP 404 (the routes are
      not mounted; no custom error message is required)
    rationale: >-
      A production server must not show that demo controls exist. When the routes are
      not mounted, the server returns the same 404 as for any unknown path. No special
      handler is necessary, so no special handler can be wrong.
    verification: >-
      Integration tests in `test/demo/` confirm that, when `run_mode` is set to
      `RunMode.PROD`, any request to a path under `/demo/` returns HTTP 404.
    relationships:
    - rel_type: depends_on
      spec_id: TRIG-09-002
  - id: TRIG-09-004
    priority: MUST
    kind: project
    statement: Demo trigger endpoints MUST share the same per-actor DataLayer injection pattern as general-purpose trigger
      endpoints (TRIG-06-001, TRIG-06-002)
    rationale: >-
      A demo trigger acts on the same actor store as the real triggers of that actor. A
      different injection path could resolve a different store, and the test override
      that replaces the real store would not replace it.
    verification: >-
      Inspection of `vultron/adapters/driving/fastapi/` confirms that demo trigger
      endpoint handlers receive their DataLayer instance via the same FastAPI
      dependency as general-purpose triggers.
  - id: TRIG-09-005
    priority: MUST
    kind: project
    statement: Demo trigger endpoints MUST use an OpenAPI tag that visually distinguishes them from general-purpose triggers
      in the Swagger UI (e.g., `tags=["Demo Triggers"]` vs `tags=["Triggers"]`)
    rationale: >-
      A reader of the API documentation must be able to identify the endpoints that are
      demo controls, which a production server does not have. The reader must know this
      before writing a client that depends on them.
    verification: >-
      Inspection of the FastAPI application's OpenAPI schema confirms that demo
      trigger endpoints carry a distinct tag (e.g., "Demo Triggers") separate
      from the tag used by general-purpose endpoints.
- id: TRIG-10
  title: Generalized Object Triggers and Type-Specific Wrappers
  specs:
  - id: TRIG-10-001
    priority: MUST
    kind: project
    statement: >-
      The system MUST expose an `add-object-to-case` general trigger at
      `POST /actors/{actor_id}/trigger/add-object-to-case` that accepts any object type the protocol
      routes as `Add(object, target=VulnerabilityCase)`, except a type whose addition the protocol
      carries by its own flow (`EmbargoEvent`, `CaseParticipant`, `CaseStatus`). It MUST refuse with
      HTTP 422, queuing nothing, an object whose `Add` no receive-side pattern matches or whose type is
      one of those exceptions.
    rationale: >-
      Adding content to a case is a legitimate operator action for more than one object type; a Note
      is the most common use but not the only one. The `Add` is a participant's request to the
      CASE_MANAGER (PCR-08-005), so an object type the CASE_MANAGER cannot route would be delivered and
      dropped on arrival while the caller was told 202. Refusing it at the trigger keeps the response
      truthful. An embargo proposal is an `Invite` relayed by the CASE_MANAGER (EP-09-001), and
      participants and status changes have role-gated flows of their own, so a general `Add` of those
      types would bypass the gates that govern them.
    verification: >-
      Router tests under `test/adapters/driving/fastapi/routers/` confirm that a POST with a routable
      non-Note object returns 202 and queues an `Add` addressed to the CASE_MANAGER, and that a POST
      with an object type no `Add`-to-case pattern matches, or with an `EmbargoEvent`, returns 422 and
      leaves the outbox unchanged.
    stories:
    - story_2022_074
    - story_2022_102
  - id: TRIG-10-002
    priority: MUST
    kind: project
    statement: Type-specific convenience triggers (e.g., `add-report-to-case`) MUST delegate to the corresponding general
      trigger after performing type-specific validation
    rationale: >-
      The general trigger holds the routing check and the CASE_MANAGER addressing
      (TRIG-10-001). A wrapper that sent its own `Add` would skip that refusal. The
      wrapper could then queue an `Add` that the CASE_MANAGER drops, and still tell the
      caller 202.
    verification: >-
      Inspection of `vultron/adapters/driving/fastapi/` confirms that type-specific
      trigger handlers call the `add-object-to-case` general trigger after
      performing type-specific input validation.
  - id: TRIG-10-003
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/adapters/driving/fastapi/routers/test_demo_triggers.py::TestDemoAddNoteToCaseNotAtTriggerPrefix`
      confirms add-note-to-case is absent from the `/trigger/` path.
    statement: '`add-note-to-case` MUST NOT be exposed as a general `/trigger/` endpoint; it MUST be moved to `/demo/add-note-to-case`
      as a demo-only convenience wrapper around `add-object-to-case`'
    rationale: >-
      `add-object-to-case` already adds a Note to a case. A second production path for
      the same act would need its own checks. These checks must stay the same as the
      checks of the first path. Only demo scripts use the note shortcut, so the shortcut
      is in the demo layer.
    relationships:
    - rel_type: refines
      spec_id: TRIG-08-004
  - id: TRIG-10-004
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/adapters/driving/fastapi/routers/test_demo_triggers.py::TestDemoSyncLogEntry::test_returns_202_with_the_entry_identity`
      confirms sync-log-entry is served under `/demo/`; inspection of the trigger router
      confirms it is not mounted under `/trigger/`.
    statement: '`sync-log-entry` MUST NOT be exposed as a general `/trigger/` endpoint; it MUST be moved to `/demo/sync-log-entry`'
    rationale: In a correct implementation, SYNC log entries are committed automatically as a cascade effect of every state-changing
      operation. An explicit trigger exists only to let the demo script inject entries manually. A future production "force-sync"
      recovery operation would require a protocol-level mechanism for a peer to advertise its current log tail hash before
      entries are replayed (SYNC-17-001, SYNC-18-001)
    relationships:
    - rel_type: refines
      spec_id: TRIG-08-004
- id: TRIG-11
  title: Case Ownership Transfer Triggers
  specs:
  - id: TRIG-11-001
    priority: MUST
    kind: project
    statement: The system MUST expose an `offer-case-ownership-transfer` trigger at `POST /actors/{actor_id}/trigger/offer-case-ownership-transfer`
      that accepts a `case_id` and `transferee_id` in its request body and emits
      the requesting Case Owner's proposal, `Offer(Offer(VulnerabilityCase))`, to
      the case's CASE_MANAGER, which offers the case to the specified transferee
      (CM-21-005). The response's `activity` is the proposal.
    rationale: Without this trigger, demo scripts must inject ownership-transfer offers directly into the transferee's inbox,
      which bypasses the offering actor's BT execution and violates DEMOMA-05-001. A trigger endpoint ensures the full hexagonal
      stack is exercised for both sides of the handshake.
    verification: >-
      Integration tests in `test/demo/` confirm that a POST to
      `/actors/{actor_id}/trigger/offer-case-ownership-transfer` with a valid
      `case_id` and `transferee_id` emits the proposal and that the transferee then
      receives the CASE_MANAGER's `Offer(VulnerabilityCase)`.
    relationships:
    - rel_type: refines
      spec_id: TRIG-01-001
    - rel_type: refines
      spec_id: TRIG-02-004
    stories:
    - story_2022_050
  - id: TRIG-11-002
    priority: MUST
    kind: project
    statement: The system MUST expose an `accept-case-ownership-transfer` trigger at `POST /actors/{actor_id}/trigger/accept-case-ownership-transfer`
      that accepts an `offer_id` in its request body and emits an `Accept(Offer(VulnerabilityCase))` (ownership transfer variant)
      from the requesting actor, addressed to the CASE_MANAGER (CM-21-006).
    rationale: 'Symmetry with TRIG-11-001: the accepting actor must also be puppeteered through a trigger so that its BT execution
      is exercised, consistent with DEMOMA-05-001.'
    verification: >-
      Integration tests in `test/demo/` confirm that a POST to
      `/actors/{actor_id}/trigger/accept-case-ownership-transfer` with a valid
      `offer_id` emits an `Accept(Offer(VulnerabilityCase))` activity.
    relationships:
    - rel_type: refines
      spec_id: TRIG-01-001
    - rel_type: refines
      spec_id: TRIG-02-004
    - rel_type: refines
      spec_id: CM-21-006
    stories:
    - story_2022_048
    - story_2022_050
  - id: TRIG-11-003
    priority: SHOULD
    kind: project
    statement: The `offer-case-ownership-transfer` trigger request body SHOULD accept an optional `content` field (free-text
      message) to include in the offer activity, consistent with the factory function signature for `offer_case_ownership_transfer_activity`.
    rationale: >-
      The Case Owner can tell the transferee why it offers the case. The trigger uses
      the parameter of the factory function, so it passes the text through and needs no
      mapping of its own.
    relationships:
    - rel_type: refines
      spec_id: TRIG-11-001
  - id: TRIG-11-004
    priority: MUST
    kind: project
    statement: Every ownership-transfer trigger MUST return an `activity` field in its response body containing the emitted
      ActivityStreams object, consistent with the response contract for all other trigger endpoints (TRIG-05-001).
    rationale: >-
      A later step names the activity that a transfer trigger sent: a withdrawal names
      the proposal of the owner (TRIG-11-006). When the response returns the activity in
      `activity`, as other triggers do, the caller gets that id without a second lookup.
    verification: >-
      Integration tests in `test/demo/` confirm that every ownership-transfer
      trigger response includes an `activity` field containing the emitted
      ActivityStreams object.
    relationships:
    - rel_type: refines
      spec_id: TRIG-11-001
    - rel_type: refines
      spec_id: TRIG-11-002
    - rel_type: refines
      spec_id: TRIG-11-005
  - id: TRIG-11-005
    priority: MUST
    kind: project
    statement: >-
      The system MUST expose a `reject-case-ownership-transfer` trigger at
      `POST /actors/{actor_id}/trigger/reject-case-ownership-transfer` that accepts an
      `offer_id` in its request body and emits a `Reject(Offer(VulnerabilityCase))`
      (ownership transfer variant) from the requesting actor, addressed to the
      CASE_MANAGER (CM-21-010).
    rationale: >-
      Symmetry with TRIG-11-002. Without it the only way to decline a transfer is to
      build the Reject by hand and post it into the CASE_MANAGER's inbox, which is
      what the transfer-ownership exchange demo does and DEMOMA-05-001 forbids.
    verification: >-
      A test marked `TRIG-11-005` confirms the route is registered; integration tests
      in `test/demo/` confirm a POST with a valid `offer_id` emits the Reject addressed
      to the CASE_MANAGER.
    relationships:
    - rel_type: refines
      spec_id: TRIG-01-001
    - rel_type: refines
      spec_id: TRIG-11-002
    - rel_type: refines
      spec_id: CM-21-010
    stories:
    - story_2022_050
  - id: TRIG-11-006
    priority: MUST
    kind: project
    statement: >-
      The system MUST expose a `withdraw-case-ownership-transfer` trigger at
      `POST /actors/{actor_id}/trigger/withdraw-case-ownership-transfer` that
      accepts an `offer_id` in its request body, naming the requesting Case
      Owner's own proposal (the activity TRIG-11-001 returned), and emits
      `Undo(Offer(Offer(VulnerabilityCase)))` of that proposal, addressed to the
      CASE_MANAGER (CM-21-015).
    rationale: >-
      Symmetry with TRIG-11-002 and TRIG-11-005: the offerer withdraws through a
      trigger, so the withdrawal runs the same behavior tree a real client would
      (DEMOMA-05-001).
    verification: >-
      A test marked `TRIG-11-006` confirms the route is registered.
    relationships:
    - rel_type: refines
      spec_id: TRIG-01-001
    - rel_type: refines
      spec_id: CM-21-015
    stories:
    - story_2022_050
  - id: TRIG-11-007
    priority: MUST
    kind: project
    statement: >-
      The `offer-case-ownership-transfer` trigger (TRIG-11-001) MUST accept an
      optional `end_time` in its request body and, when given, set it as the
      `end_time` of the proposal's inner Offer, which the CASE_MANAGER carries
      to the Offer it makes as the deadline to answer (CM-21-016). Without it
      the Offer carries no `end_time`.
    rationale: >-
      The owner is the party that knows how long it can wait for an answer, so
      the deadline is set where the transfer is proposed.
    verification: >-
      A test marked `TRIG-11-007` confirms the trigger's request model has an
      optional `end_time` field.
    relationships:
    - rel_type: refines
      spec_id: TRIG-11-001
    - rel_type: refines
      spec_id: CM-21-016
    stories:
    - story_2022_050
- id: TRIG-12
  title: Trigger API Contract Stability and Dispatch Registry
  specs:
  - id: TRIG-12-001
    priority: MUST
    kind: project
    statement: >-
      Every trigger endpoint (`/trigger/` and `/demo/`) MUST declare a
      `response_model` naming the `TriggerResult` subtype its verb returns, so
      the OpenAPI document describes the real response body of each verb.
    rationale: >-
      Without a declared `response_model`, OpenAPI documents no response body. Then
      clients and reviewers cannot see the different body shapes that the verbs return.
    verification: >-
      A test iterates the FastAPI app's routes under `/actors/{actor_id}/trigger/`
      and `/actors/{actor_id}/demo/` and fails on any whose `response_model` is
      `None`.
    adr:
    - ADR-0110
  - id: TRIG-12-002
    priority: MUST
    kind: project
    statement: >-
      The response body of every trigger verb MUST be pinned to an exact key
      set by a test parametrized over the trigger registry (TRIG-12-004), and
      `response_model` serialization MUST keep FastAPI's defaults for
      `response_model_exclude_none`, `_exclude_unset`, `_exclude_defaults`, and
      `_by_alias`, so a key whose value is `null` is still emitted.
    rationale: >-
      `activity` is `null` whenever the BT captured nothing; excluding `None`
      would silently drop a key clients receive today. Pinning the exact set,
      rather than asserting one key is present, is what turns a body change
      into a failing test.
    verification: >-
      The parametrized test asserts `set(response.json()) == expected_keys` for
      each registry row; a route that adds or drops a key fails it.
    adr:
    - ADR-0110
  - id: TRIG-12-003
    priority: MUST_NOT
    kind: project
    statement: >-
      The trigger API contract — paths, `operation_id`s, status codes, summaries,
      descriptions, and request schemas — MUST NOT change without a deliberate
      update to a committed golden OpenAPI snapshot. The snapshot MUST be
      captured before any trigger route is rewritten, so it freezes the shipped
      contract rather than whatever a rewrite happened to emit.
    rationale: >-
      Some changes touch all trigger routes at one time, for example a new
      `response_model` on each route. Such a change needs mechanical evidence that the
      contract that clients see did not change. Only a snapshot taken before the routes
      change gives this evidence. A snapshot taken after the change records the change
      as the baseline.
    verification: >-
      A test compares `app.openapi()` for the trigger and demo paths against
      the committed snapshot and fails on any difference; the snapshot's commit
      predates the first route change in history.
    adr:
    - ADR-0110
  - id: TRIG-12-004
    priority: MUST
    kind: project
    statement: >-
      A single verb-keyed trigger registry MUST be the sole source mapping each
      trigger verb to its request model, use-case class, result type, and
      exposure (general-purpose or demo-only). Every trigger route MUST
      correspond to exactly one registry row and every row to exactly one
      route; every `Svc*UseCase` class under `vultron/core/use_cases/triggers/`
      MUST appear in exactly one row. The registry holds data and a lookup
      only; it MUST NOT contain per-verb behavior.
    rationale: >-
      The registry is for enumeration, not for routing, because a route already knows
      its verb. With enumeration, tests can assert TRIG-08-003/004, TRIG-12-001, and
      TRIG-12-002, so inspection is not necessary. Enumeration also finds a use case
      that no route reaches. When the registry holds no behavior, it cannot become a
      second layer of code for each verb (ADR-0110).
    verification: >-
      Architecture tests assert the route-to-registry bijection and the
      use-case-to-row bijection, both as exact set equalities (ARCH-18-001).
    relationships:
    - rel_type: refines
      spec_id: TRIG-08-003
    - rel_type: refines
      spec_id: TRIG-08-004
    adr:
    - ADR-0110
- id: TRIG-13
  title: Leaving a Case
  specs:
  - id: TRIG-13-001
    priority: MUST
    kind: project
    statement: >-
      The system MUST expose a general-purpose `leave-case` trigger at
      `POST /actors/{actor_id}/trigger/leave-case` that accepts a `case_id` and
      sends `Leave(VulnerabilityCase)` from the requesting actor, addressed to the
      case's CASE_MANAGER. It accepts a call from any participant of the case; what
      the Leave means for the case is decided by the CASE_MANAGER on receipt
      (CM-23-002, CM-23-003).
    verification: >-
      `test/core/use_cases/triggers/case/test_leave.py` runs `leave-case` for a
      participant that is not the owner and for the Case Owner, and asserts one
      `Leave(VulnerabilityCase)` addressed to the CASE_MANAGER in each actor's
      outbox; `test/adapters/driving/fastapi/routers/test_trigger_case.py` POSTs
      `trigger/leave-case` and asserts the same. `test/test_trigger_registry.py`
      asserts the `leave-case` row is general-purpose and that no `close-report` or
      demo `close-case` row exists, and
      `test/adapters/driving/fastapi/routers/test_trigger_report.py` asserts the
      `close-report` route is gone.
    rationale: >-
      A participant that joined a case closes its part in the case when it leaves the
      case (CM-23-001). It never uses `Close(Report)`, which a case refuses from all
      senders (CM-23-019, ADR-0144). A production deployment needs a trigger for this
      step, because production mode does not mount demo verbs (TRIG-09-002). The verb
      has the name of the message, not 'close'. When a participant that is not the owner
      leaves, the case stays open (ADR-0145).
    relationships:
    - rel_type: refines
      spec_id: TRIG-02-004
    - rel_type: depends_on
      spec_id: CM-23-001
    adr:
    - ADR-0145
  - id: TRIG-13-002
    priority: MUST
    kind: project
    statement: >-
      The `leave-case` trigger MUST run the pre-close Actuator call-out
      (`PreCloseAction`) for every caller before it sends the Leave. When the
      call-out fails, the trigger MUST fail with nothing sent.
    verification: >-
      Trigger tests in `test/core/use_cases/triggers/case/test_leave.py` with a
      recording `PreCloseAction` backend assert it ran before the Leave was queued,
      for a participant that is not the owner and for the Case Owner; one with a
      failing backend asserts the trigger fails with nothing queued.
    rationale: >-
      The pre-close step is the leaving actor's own integration work, such as
      closing its ticket, so it runs where that actor decides to leave. Running it
      when the actor's replica applies its closure entry would put local policy into
      replica application, which CM-23-016 forbids (ADR-0145).
    relationships:
    - rel_type: refines
      spec_id: TRIG-13-001
    adr:
    - ADR-0145
  - id: TRIG-13-003
    priority: MUST
    kind: project
    statement: >-
      When the actor calling `leave-case` is the Case Owner and its replica records
      an active embargo (EM.ACTIVE or EM.REVISE), the trigger MUST fail before the
      pre-close call-out runs and before anything is sent, with an error that says
      to terminate the embargo first.
    verification: >-
      Trigger tests in `test/core/use_cases/triggers/case/test_leave.py` call
      `leave-case` as the Case Owner with the embargo in EM.ACTIVE and in EM.REVISE,
      and assert the trigger fails, the pre-close call-out did not run, and nothing
      was queued; they also assert a participant that is not the owner is not
      blocked. `test/adapters/driving/fastapi/routers/test_trigger_case.py` asserts
      the route answers 409.
    rationale: >-
      The CASE_MANAGER declines the Case Owner's Leave while an embargo is active
      (CM-23-011). Checking first keeps the owner's own systems from acting on a
      close that would be declined (ADR-0145).
    relationships:
    - rel_type: refines
      spec_id: TRIG-13-002
    - rel_type: depends_on
      spec_id: CM-23-011
    adr:
    - ADR-0145
