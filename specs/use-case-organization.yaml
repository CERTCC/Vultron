id: UCORG
title: Use-Case Organization
description: >-
  Requirements for the physical package layout of the use_cases package, registry
  synchronization, test mirroring, and documentation of the trigger-to-received-to-sync
  information flow pattern.
scope:

- prototype
- production
tags:
- code-style
groups:
- id: UCORG-01
  title: Package Layout
  specs:
  - id: UCORG-01-001
    priority: MUST
    kind: project
    statement: >-
      Use-case classes that process inbound received messages MUST reside under `vultron/core/use_cases/received/`
    rationale: >-
      Received use cases answer messages that arrive from other actors. Trigger use
      cases start an action for the local actor. The two kinds have different callers
      and result types (UCORG-05-002, UCORG-05-007). When each kind has its own package,
      the location of a class tells a reader which kind it is, and the reader finds the
      use case for each received message in one place.
    verification: >-
      `test_each_use_case_sits_in_the_subpackage_its_kind_names` in
      `test/architecture/test_use_case_package_layout.py` discovers every use-case
      class in the package and asserts that each one whose result is
      a `HandlerResult` sits under `vultron/core/use_cases/received/`.
    relationships:
    - rel_type: implements
      spec_id: CS-12-002
  - id: UCORG-01-002
    priority: MUST
    kind: project
    statement: >-
      Trigger use-case classes that implement actor-initiated behaviors MUST reside under
      `vultron/core/use_cases/triggers/`
    rationale: >-
      Trigger use cases start an action for the local actor through the trigger driving
      port. Received use cases answer messages from other actors. The two kinds have
      different callers and result types (UCORG-05-002, UCORG-05-007). When each kind
      has its own package, the location of a class tells a reader which kind it is.
    verification: >-
      `test_each_use_case_sits_in_the_subpackage_its_kind_names` in
      `test/architecture/test_use_case_package_layout.py` discovers every use-case
      class in the package and asserts that each one whose result is
      a `TriggerResult` sits under `vultron/core/use_cases/triggers/`.
    relationships:
    - rel_type: implements
      spec_id: CS-12-003
  - id: UCORG-01-003
    priority: MUST_NOT
    kind: project
    statement: >-
      The `vultron/core/use_cases/` package root MUST NOT hold anything but
      `__init__.py`, `README.md`, the `query/`, `received/` and `triggers/` subpackages,
      and shared private helper modules.
    rationale: >-
      A use case at the package root does not show which kind it is, for example a
      received use case or a trigger use case (UCORG-01-001, UCORG-01-002). The root is
      for code that the use cases share and for the package's `README.md`, which
      UCORG-04-001 requires. The use-case registry is in `vultron/semantic_registry/`,
      not in this package, and the dispatcher receives the map by injection.
    verification: >-
      `test_the_package_root_holds_only_its_allowed_entries` in
      `test/architecture/test_use_case_package_layout.py` lists the package root and
      asserts that it holds nothing else.
  - id: UCORG-01-004
    priority: MUST
    kind: project
    statement: >-
      Query use-case classes, which compute a read-only result from the DataLayer and
      change no state, MUST reside under `vultron/core/use_cases/query/`.
    rationale: >-
      A query use case answers a question about the local actor's state, such as which
      CVD actions an actor may take in a case. It is neither a received use case nor a
      trigger use case, and its result type differs from both (UCORG-05-002,
      UCORG-05-007). A package of its own tells a reader that the class changes
      nothing.
    verification: >-
      `test_each_use_case_sits_in_the_subpackage_its_kind_names` in
      `test/architecture/test_use_case_package_layout.py` discovers every use-case
      class in the package and asserts that each one whose result is neither a
      `HandlerResult` nor a `TriggerResult` sits under `vultron/core/use_cases/query/`.
- id: UCORG-02
  title: Registry Synchronization
  specs:
  - id: UCORG-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Any relocation or rename of a use-case class MUST update its
      `SEMANTIC_REGISTRY` entry in `vultron/semantic_registry/` in the same commit.
      The registry is the single source of the `MessageSemantics` → use-case-class
      mapping, projected by `use_case_map()` in
      `vultron/semantic_registry/__init__.py`
    rationale: >-
      The dispatcher finds each use case only through the map that `use_case_map()`
      builds from `SEMANTIC_REGISTRY`. If a class moves or gets a new name and its entry
      does not change, the import fails or a message routes to no use case. A change in
      one commit keeps every commit in a state where routing works.
  - id: UCORG-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A dispatch coverage test MUST verify that every `MessageSemantics` value
      registered in `SEMANTIC_REGISTRY` resolves to a callable class and that
      dispatch succeeds for a representative event
    rationale: >-
      A registry entry that names a missing or wrong class fails only when its message
      arrives. A test over every registered value finds such an entry before a message
      reaches it. A dispatch of a representative event also shows that the dispatcher
      can call the class that it finds.
- id: UCORG-03
  title: Test Layout
  specs:
  - id: UCORG-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Use-case test modules MUST mirror the structural layout of the use-case source
      modules they test.
    rationale: >-
      When the tests mirror the source layout, a reader finds the tests for a use case
      from its path.
    relationships:
    - rel_type: refines
      spec_id: TB-04-001
      note: testability.md
  - id: UCORG-03-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Each use-case subpackage MUST have a test subpackage at the same relative path
      under the test root.
    rationale: >-
      When each subpackage has its test subpackage, a use-case package with no tests is
      easy to see.
    relationships:
    - rel_type: refines
      spec_id: UCORG-03-001
- id: UCORG-04
  title: Information Flow Documentation
  specs:
  - id: UCORG-04-001
    priority: SHOULD
    kind: project
    statement: >-
      The trigger → received → sync information flow pattern SHOULD be documented in `notes/`
      and summarized in a `README.md` under `vultron/core/use_cases/`
    rationale: >-
      A trigger, the received message that it causes and the sync of the result are in
      different modules of `triggers/` and `received/`, and no single module shows the
      whole flow. A note in `notes/` gives the design. A README in the package lets a
      reader who opens the code find that note.
- id: UCORG-05
  title: Use-Case Result Protocol
  specs:
  - id: UCORG-05-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Every use-case `execute()` method MUST declare a return type that is `UseCaseResult` or a
      subtype (`HandlerResult`, `TriggerResult`); bare `None` or `dict` return types are
      not permitted
    rationale: >-
      Makes the use-case contract explicit and machine-checkable. See ADR-0040
      (docs/adr/0040-use-case-result-envelope.md).
    relationships:
    - rel_type: implements
      spec_id: CS-11-001
    adr:
    - ADR-0040
  - id: UCORG-05-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'Handler (received-side) use cases MUST return `HandlerResult`.'
    rationale: >-
      `HandlerResult` carries the verdict of the handler to `InboxOutcome`
      (UCORG-05-011). If a handler returns no result, the inbox cannot tell an applied
      message from a no-op, and it reports both as processed. A separate subtype also
      lets callers tell a received-side result from a trigger-side result without an
      `isinstance` check on the base. See ADR-0095.
    adr:
    - ADR-0040
    - ADR-0095
  - id: UCORG-05-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The `UseCase` Protocol in `vultron/core/ports/use_case.py` MUST declare
      `execute() -> UseCaseResult`, not a return type of `Any` or `None`.
    rationale: >-
      The `UseCase` Protocol is the contract that every use case implements. A return
      type of `Any` or `None` lets a use case return nothing or an untyped value, and
      type checkers cannot report it. A `UseCaseResult` return type keeps every result
      typed. No production call site is typed against the Protocol, so UCORG-05-004
      checks each class.
    adr:
    - ADR-0040
  - id: UCORG-05-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      An architecture ratchet test MUST verify that all concrete use-case classes in
      `vultron/core/use_cases/` declare an `execute()` return annotation that is
      `UseCaseResult` or a registered subtype
    rationale: >-
      The enforcement for UCORG-05-003. No call site is typed against the
      `UseCase` Protocol (the dispatcher routing table holds bare `type` values),
      so mypy alone does not report a non-conforming `execute()`; the ratchet
      catches it at CI time.
    adr:
    - ADR-0040
  - id: UCORG-05-005
    priority: MUST
    kind: project
    statement: >-
      The `ActivityResult` subtype of `TriggerResult` MUST carry `activity` and
      `emitting_actor_id`. `TriggerResult` is the fieldless base of the trigger-side
      result hierarchy.
    rationale: >-
      Several trigger verbs return response bodies with no `emitting_actor_id` or no
      `activity`. A base that required both fields could not describe those bodies
      without a change to live responses. Thus only `ActivityResult` carries both keys.
      See ADR-0110.
    verification: >-
      `test_activity_result_requires_an_emitting_actor` and
      `test_activity_result_subtypes_share_the_activity_body` in
      `test/core/models/test_use_case_result.py` assert the two keys of
      `ActivityResult`.
    adr:
    - ADR-0110
    - ADR-0040
    - ADR-0095
  - id: UCORG-05-015
    priority: MUST
    kind: project
    statement: >-
      Each `TriggerResult` subtype other than `ActivityResult` MUST declare exactly the
      keys its verb's response body carries.
    rationale: >-
      When each subtype declares exactly the keys of its verb, the type is the contract
      of the response body, and a router needs no per-verb shaping. See ADR-0110.
    verification: >-
      `test_trigger_result_subtype_declares_exactly_its_body_keys` in
      `test/core/models/test_use_case_result.py` asserts each subtype's exact field set;
      the exact-response-key test parametrized over the trigger registry (TRIG-12-002)
      confirms each verb's HTTP body matches its declared subtype.
    relationships:
    - rel_type: extends
      spec_id: UCORG-05-005
    adr:
    - ADR-0110
  - id: UCORG-05-016
    priority: MUST
    kind: project
    statement: >-
      The `TriggerResult` base MUST reject unknown keys. A use case that grows a return
      key then fails loudly, and the key is not silently dropped from the body.
    rationale: >-
      An unknown key that the base drops would disappear from the response body with no
      notice. A loud failure makes the author declare the new key on the subtype.
    verification: >-
      `test_trigger_result_root_rejects_any_key` and
      `test_trigger_result_subtype_rejects_an_unknown_key` in
      `test/core/models/test_use_case_result.py`, and
      `test_every_row_result_type_forbids_unknown_keys` in
      `test/architecture/test_trigger_registry_ratchets.py`, assert that an unknown key
      raises.
    relationships:
    - rel_type: extends
      spec_id: UCORG-05-005
    adr:
    - ADR-0110
  - id: UCORG-05-017
    priority: MUST
    kind: project
    statement: >-
      `HandlerResult` MUST carry a `disposition` field of type `HandlerDisposition` and
      an optional `reason`.
    rationale: >-
      The disposition is the verdict that `DispatchNode` maps onto the inbox outcome
      (UCORG-05-011). The reason says why a handler refused, deferred or skipped.
    verification: >-
      `test_handler_result_fields_are_disposition_reason_and_unhandled` in
      `test/core/models/test_use_case_result.py` asserts the field set of
      `HandlerResult`.
    adr:
    - ADR-0095
  - id: UCORG-05-018
    priority: MAY
    kind: project
    statement: >-
      A `TriggerResult` subtype or a `HandlerResult` MAY carry further domain-specific
      result fields.
    rationale: >-
      Some verbs return more than an activity, and a typed field states what that is.
      The type checkers then see each extra value a caller reads.
    adr:
    - ADR-0110
  - id: UCORG-05-019
    priority: MUST_NOT
    kind: project
    statement: >-
      A `TriggerResult` subtype or a `HandlerResult` MUST NOT carry a raw `dict`
      payload. The one permitted `dict` value is an emitted activity's JSON object
      (`activity`, `offer`, `note`), typed `dict[NonEmptyString, Any]`.
    rationale: >-
      A raw `dict` hides its keys from the type checkers. An emitted activity's JSON is
      the exception: its keys are JSON member names (CS-08-001), and core captures it
      from the BT blackboard as JSON and cannot type it without a wire import
      (UCORG-05-014).
    verification: >-
      `test_handler_result_fields_are_disposition_reason_and_unhandled` and
      `test_trigger_result_subtype_declares_exactly_its_body_keys` in
      `test/core/models/test_use_case_result.py` pin the field set of each result type,
      so no `dict` field can appear unseen.
    adr:
    - ADR-0110
    - ADR-0040
  - id: UCORG-05-006
    priority: MUST_NOT
    kind: project
    statement: >-
      The trigger driving port MUST NOT declare `dict` or `dict[str, Any]` as a
      return type. It exposes one method, `trigger(request, dl)`, whose return
      type is the `TriggerResult` subtype bound to the request's type, so a router
      receives the verb's typed result without a per-verb port method.
    rationale: >-
      Propagating dict past the port defeats the typed contract at the router
      boundary. A per-verb method surface grows linearly with the verbs behind
      it, flattens each validated request into loose scalars that the next
      layer reassembles, and hides nothing (ADR-0110).
    verification: >-
      mypy and pyright resolve the bound result type at every router call site
      with no cast; an architecture test asserts the port `Protocol` declares
      exactly one public method and that no `TriggerService`-style per-verb
      facade exists under `vultron/core/`.
    adr:
    - ADR-0110
    - ADR-0040
  - id: UCORG-05-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'Trigger use cases MUST return `TriggerResult`.'
    rationale: >-
      A dedicated TriggerResult subtype makes trigger-side results structurally
      distinct from handler-side results without runtime isinstance checks.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-002
  - id: UCORG-05-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'Both `HandlerResult` and `TriggerResult` MUST inherit from `UseCaseResult`.'
    rationale: >-
      Inheriting from the common base type ensures that all use-case return values
      satisfy the UseCaseResult Protocol contract.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-002
  - id: UCORG-05-009
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `HandlerDisposition` MUST be a `StrEnum` whose members are exactly `APPLIED`,
      `SKIPPED`, `DEFERRED`, and `REFUSED`
    rationale: >-
      A closed `StrEnum` follows the project idiom for fixed value sets (`CVDRole`,
      `VultronObjectType`) rather than an inline `Literal`. `DEFERRED` is a member because
      handler-side deferral is real: `BufferOutOfOrderEntryNode` and
      `BufferPreGenesisEntryNode` return `SUCCESS` after holding the received
      `Announce(CaseLedgerEntry)` for replay once its predecessor arrives, which is
      neither a state change nor a benign no-op nor a refusal. `DeferCheckNode`
      decides the *other* kind of deferral — missing case context — before
      dispatch; the two are distinct and both map
      to `InboxOutcome.status == "deferred"`. See ADR-0095.
    adr:
    - ADR-0095
  - id: UCORG-05-010
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Every link between a received-side `execute()` and `DispatchNode` MUST declare and
      pass on the `HandlerResult` that `execute()` returns, not `None`. The links are
      `DispatcherBase._handle()`, `DispatcherBase.dispatch()`, the `ActivityDispatcher`
      Protocol, the adapter-level `dispatch()` helper,
      `FastAPIDispatchAdapter.dispatch()` and the `DispatchAdapter` Protocol.
    rationale: >-
      The dispatcher chain is the only route from a handler to `InboxOutcome`. If one
      link declares `None`, it discards the verdict, and a handler that took no action
      is still reported as processed. `_handle()` is named because it is the link that
      calls `execute()`, and `dispatch()` only logs and delegates to it. An implementer
      who reads only the public method names can leave the first link at `None` and lose
      the verdict before any other link sees it. See ADR-0095.
    adr:
    - ADR-0095
  - id: UCORG-05-011
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      When a dispatch occurred, this codebase MUST derive `InboxOutcome.status` from the
      handler's `HandlerDisposition`. It does not infer the status from the absence of a
      raised exception. Under this rule, `APPLIED` and `SKIPPED` map to `processed`, and
      `DEFERRED` maps to `deferred`. Also, `REFUSED` maps to `rejected`, with
      `failure_reason` taken from the handler's `reason`.
    rationale: >-
      If the outcome comes from "dispatch did not raise", a handler that takes no action
      is still reported as `processed`. Three components produce `deferred`, and they
      must not be confused. `DeferCheckNode` defers before dispatch for missing case
      context. `DereferenceCheckNode` defers before dispatch while an object is fetched
      (AKM-05-010). A handler returns `DEFERRED` after dispatch for an entry that waits
      for its predecessor. All three reach the same `InboxOutcome.status`, but only the
      last goes through this mapping.
    relationships:
    - rel_type: implements
      spec_id: IO-01-001
    adr:
    - ADR-0095
  - id: UCORG-05-012
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      When a dispatch finds no use case for the event's semantic type, the dispatcher
      MUST return an explicit `REFUSED` "no use case found" verdict (SE-05-002). It does
      not raise or return as though a handler ran, so the lookup failure never yields
      `InboxOutcome.status == "processed"`.
    rationale: >-
      No handler ran, so the outcome cannot be `processed`. The dispatcher returns a
      verdict, not an outcome, because HP-01-004 gives the `InboxOutcome` vocabulary
      only to `DispatchNode`. The dispatcher does not raise. A receiver that does not
      handle a message has not found it invalid (ADR-0140). A raise would answer the
      sender with a `ProcessingFault`. An activity that names no case does not take this
      path: routing uses the semantics only, and the handler refuses that activity
      (HP-05-002).
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-011
    adr:
    - ADR-0095
  - id: UCORG-05-013
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A `REFUSED` disposition reaching `InboxOutcome` MUST be logged above `DEBUG` by the
      component that observes the completed outcome
    rationale: >-
      `run_inbox_pipeline` logs every `outcome.status` at `DEBUG`. A refusal that only
      this line records would be invisible in normal operation, even when the dispatcher
      chain carries the verdict correctly (UCORG-05-010, UCORG-05-011). An operator must
      be able to see in the actor log that the actor refused a message.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-011
    adr:
    - ADR-0095
  - id: UCORG-05-014
    priority: MUST
    kind: project
    statement: >-
      A `WireActivityResult` model MUST exist in `vultron/demo/` with a non-optional
      `activity` field typed `as_TransitiveActivity`.
    rationale: >-
      Core captures `activity` as `dict[str, Any]` from the BT blackboard; a wire type
      there would violate ARCH-01-001. The demo-layer view types the raw dict as
      `as_TransitiveActivity` at the HTTP boundary, so `ActorSession` is fully typed
      without polluting core.
    verification: >-
      `WireActivityResult` exists in `vultron/demo/`, its `activity` field is
      `as_TransitiveActivity` (non-optional), and mypy passes with no `# type: ignore`
      in `ActorSession` method bodies.
    adr:
    - ADR-0110
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-005
  - id: UCORG-05-020
    priority: MUST
    kind: project
    statement: >-
      The demo layer MUST build each `WireActivityResult` by validating the `activity`
      key of the raw `dict` that `post_to_trigger` returns. A `WireActivityResult` is a
      typed view of the HTTP response body, not a use-case return value.
    rationale: >-
      Validation at the HTTP boundary turns the response body into a typed wire object
      once. Every `ActorSession` method then reads a typed activity, and a malformed
      body fails where it arrives.
    verification: >-
      mypy passes with no `# type: ignore` in `ActorSession` method bodies, which read
      the `WireActivityResult` that `vultron/demo/actor_session/` validates from the
      `post_to_trigger` response.
    relationships:
    - rel_type: extends
      spec_id: UCORG-05-014
    adr:
    - ADR-0110
  - id: UCORG-05-021
    priority: MUST_NOT
    kind: project
    statement: >-
      `WireActivityResult` MUST NOT be placed in `vultron/core/`.
      `as_TransitiveActivity` is a wire-only class with no core counterpart, and core
      does not import wire (ARCH-01-001).
    rationale: >-
      ARCH-25-003 aliases the paired domain types onto core, not the activity envelopes.
      A core model typed `as_TransitiveActivity` would thus need a wire import, which
      ARCH-01-001 forbids.
    verification: >-
      `test/architecture/test_core_no_wire_imports.py` fails any module under
      `vultron/core/` that imports the wire layer, which a core `WireActivityResult`
      typed `as_TransitiveActivity` would need.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-01-001
    adr:
    - ADR-0110
  - id: UCORG-05-022
    priority: MUST_NOT
    kind: project
    statement: >-
      A demo-layer typed view MUST NOT reuse the class name of a core result class. The
      plain `ActivityResult` name belongs to the core `TriggerResult` subtype
      (UCORG-05-005), whose `activity` is the JSON object captured from the BT
      blackboard.
    rationale: >-
      Two `ActivityResult` classes in different layers, one JSON and one wire, would
      look the same in a traceback. The wire-typed one thus takes the `Wire` prefix that
      `WireCaseLedgerEntry` already uses (ARCH-04-005).
    verification: >-
      No class under `vultron/demo/` shares a name with a `TriggerResult` subtype in
      `vultron/core/models/use_case_result.py`.
    adr:
    - ADR-0110
