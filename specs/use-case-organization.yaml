id: UCORG
title: Use-Case Organization
description: >-
  Requirements for the physical package layout of the use_cases package, registry
  synchronization, test mirroring, and documentation of the trigger-to-received-to-sync
  information flow pattern.
version: 1.2.0
scope:

- prototype
- production
tags:
- code-style
groups:
- id: UCORG-01
  title: Package Layout
  specs:
  - id: UCORG-01-001
    priority: MUST
    kind: project
    statement: >-
      Use-case classes that process inbound received messages MUST reside under `vultron/core/use_cases/received/`
    relationships:
    - rel_type: implements
      spec_id: CS-12-002
      note: code-style.md
  - id: UCORG-01-002
    priority: MUST
    kind: project
    statement: >-
      Trigger use-case classes that implement actor-initiated behaviors MUST reside under
      `vultron/core/use_cases/triggers/`
    relationships:
    - rel_type: implements
      spec_id: CS-12-002
      note: code-style.md
  - id: UCORG-01-003
    priority: MUST_NOT
    kind: project
    statement: >-
      The `vultron/core/use_cases/` package root MUST contain only `__init__.py` and shared
      private helper modules; use-case implementations MUST NOT be placed at the root level
    rationale: >-
      Previously required a `use_case_map.py` at the package root. No such file exists or
      ever did — the registry lives in `vultron/semantic_registry/`, where `use_case_map()`
      is a function, and `DispatcherBase` receives the map by injection. The
      no-implementations-at-root prohibition is the load-bearing half and is retained. See
      #3377.
- id: UCORG-02
  title: Registry Synchronization
  specs:
  - id: UCORG-02-001
    priority: MUST
    kind: project
    statement: >-
      Any relocation or rename of a use-case class MUST update its
      `SEMANTIC_REGISTRY` entry in `vultron/semantic_registry/` in the same commit.
      The registry is the single source of the `MessageSemantics` → use-case-class
      mapping, projected by `use_case_map()` in
      `vultron/semantic_registry/__init__.py`
  - id: UCORG-02-002
    priority: MUST
    kind: project
    statement: >-
      A dispatch coverage test MUST verify that every `MessageSemantics` value
      registered in `SEMANTIC_REGISTRY` resolves to a callable class and that
      dispatch succeeds for a representative event
- id: UCORG-03
  title: Test Layout
  specs:
  - id: UCORG-03-001
    priority: MUST
    kind: project
    statement: >-
      Use-case test modules MUST mirror the structural layout of the use-case source
      modules they test; each use-case subpackage MUST have a corresponding test
      subpackage at the same relative path under the test root.
    relationships:
    - rel_type: refines
      spec_id: TB-04-001
      note: testability.md
- id: UCORG-04
  title: Information Flow Documentation
  specs:
  - id: UCORG-04-001
    priority: SHOULD
    kind: project
    statement: >-
      The trigger → received → sync information flow pattern SHOULD be documented in `notes/`
      and summarized in a `README.md` under `vultron/core/use_cases/`
- id: UCORG-05
  title: Use-Case Result Protocol
  specs:
  - id: UCORG-05-001
    priority: MUST
    kind: project
    statement: >-
      Every use-case `execute()` method MUST declare a return type that is `UseCaseResult` or a
      subtype (`HandlerResult`, `TriggerResult`); bare `None` or `dict` return types are
      not permitted
    rationale: >-
      Makes the use-case contract explicit and machine-checkable. See ADR-0040
      (docs/adr/0040-use-case-result-envelope.md).
    relationships:
    - rel_type: implements
      spec_id: CS-11-001
    adr:
    - ADR-0040
  - id: UCORG-05-002
    priority: MUST
    kind: project
    statement: 'Handler (received-side) use cases MUST return `HandlerResult`.'
    rationale: Separate subtypes allow callers to distinguish received-side vs. trigger-side results without isinstance checks on the base.
  - id: UCORG-05-003
    priority: MUST
    kind: project
    statement: >-
      The `UseCase` Protocol in `vultron/core/ports/use_case.py` MUST declare
      `execute() -> UseCaseResult`; the return type MUST NOT be `Any` or `None`
  - id: UCORG-05-004
    priority: MUST
    kind: project
    statement: >-
      An architecture ratchet test MUST verify that all concrete use-case classes in
      `vultron/core/use_cases/` declare an `execute()` return annotation that is
      `UseCaseResult` or a registered subtype
    rationale: Belt-and-suspenders companion to mypy enforcement; caught at CI time without mypy strictness flags.
  - id: UCORG-05-004b
    priority: MAY
    kind: project
    statement: >-
      The UCORG-05-004 ratchet MAY exclude classes under
      `vultron/core/use_cases/triggers/` until the trigger-side migration lands; any such
      exclusion MUST name the tracking issue in the test and MUST be removed when that
      issue closes
    rationale: >-
      The received and trigger halves migrate independently (#1769 and #3354), so the
      ratchet has to be landable while one half still returns `dict`. Naming the issue
      keeps the carve-out from reading as permanent — an unattributed exclusion list is
      indistinguishable from a deliberate design choice a year later.
    adr:
    - ADR-0094
  - id: UCORG-05-005
    priority: MUST
    kind: project
    statement: >-
      `TriggerResult` MUST carry `activity` and `emitting_actor_id` fields; `HandlerResult`
      MUST carry a `disposition` field of type `HandlerDisposition` and an optional
      `reason`; either MAY carry further domain-specific result fields but MUST NOT carry
      raw `dict` payloads
  - id: UCORG-05-006
    priority: MUST_NOT
    kind: project
    statement: >-
      `TriggerService` methods and `TriggerServicePort` Protocol method signatures MUST NOT
      declare `dict` or `dict[str, Any]` as their return type; they MUST declare
      `TriggerResult`
    rationale: Propagating dict past the service boundary defeats the typed contract at the router boundary.
  - id: UCORG-05-007
    priority: MUST
    kind: project
    statement: 'Trigger use cases MUST return `TriggerResult`.'
    rationale: >-
      A dedicated TriggerResult subtype makes trigger-side results structurally
      distinct from handler-side results without runtime isinstance checks.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-002
  - id: UCORG-05-008
    priority: MUST
    kind: project
    statement: 'Both `HandlerResult` and `TriggerResult` MUST inherit from `UseCaseResult`.'
    rationale: >-
      Inheriting from the common base type ensures that all use-case return values
      satisfy the UseCaseResult Protocol contract.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-002
  - id: UCORG-05-009
    priority: MUST
    kind: project
    statement: >-
      `HandlerDisposition` MUST be a `StrEnum` whose members are exactly `APPLIED`,
      `SKIPPED`, and `REFUSED`; it MUST NOT declare a `DEFERRED` member
    rationale: >-
      A closed `StrEnum` follows the project idiom for fixed value sets (`CVDRole`,
      `VultronObjectType`) rather than an inline `Literal`. `DEFERRED` is excluded because
      deferral is decided by `DeferCheckNode` before dispatch — a handler is never in a
      position to return it, and offering the value would invite misuse. See ADR-0094.
    adr:
    - ADR-0094
  - id: UCORG-05-010
    priority: MUST
    kind: project
    statement: >-
      Every link between a received-side `execute()` and `DispatchNode` MUST propagate the
      returned `HandlerResult` — specifically `DispatcherBase._handle()`,
      `DispatcherBase.dispatch()`, the `ActivityDispatcher` Protocol, the adapter-level
      `dispatch()` helper, `FastAPIDispatchAdapter.dispatch()`, and the `DispatchAdapter`
      Protocol MUST all declare `HandlerResult` rather than `None`
    rationale: >-
      The dispatcher boundary is the only route from a handler to `InboxOutcome`, and no
      prior ADR reached it; ADR-0094 decides it. Any link left at `None` silently discards
      the verdict and reinstates issue #2255. `_handle()` is named explicitly because it is
      the link that actually calls `execute()` — `dispatch()` only logs and delegates to it
      — so an implementer working from the public method names alone would leave the first
      hop at `None` and lose the verdict before any other link saw it.
    adr:
    - ADR-0094
  - id: UCORG-05-011
    priority: MUST
    kind: project
    statement: >-
      `InboxOutcome.status` MUST be derived from the handler's `HandlerDisposition` when a
      dispatch occurred — `APPLIED` and `SKIPPED` mapping to `processed`, `REFUSED` mapping
      to `rejected` with `failure_reason` populated from the handler's `reason` — and MUST
      NOT be inferred from the absence of a raised exception
    rationale: >-
      Treating "dispatch did not raise" as success is what lets a handler take no action and
      still be reported as `processed` (issue #2255). `deferred` remains owned by the inbox
      pipeline, since it is decided before any handler runs.
    relationships:
    - rel_type: implements
      spec_id: IO-01-001
    adr:
    - ADR-0094
  - id: UCORG-05-012
    priority: MUST
    kind: project
    statement: >-
      When a dispatch is attempted but no handler runs, the dispatcher layer MUST
      synthesize an explicit verdict rather than returning normally: an activity dropped
      as unroutable and an unrecognized-semantics lookup failure MUST NOT yield
      `InboxOutcome.status == "processed"`
    rationale: >-
      `DispatcherBase._handle()` catches `UnroutableActivityError`, logs, and returns
      (`vultron/core/dispatcher.py`), so no exception escapes and no `HandlerResult` is
      produced — today that path reports `processed` for an activity that was silently
      dropped. `_get_use_case()` raising `VultronApiHandlerNotFoundError` is the companion
      case. UCORG-05-011 covers only "a dispatch occurred and a handler returned a
      verdict"; without this requirement the exact defect class #2255 describes survives
      the migration on the no-handler paths. Because HP-01-004 reserves `InboxOutcome`'s
      vocabulary to `DispatchNode`, this verdict is synthesized at the dispatcher layer,
      not by a handler.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-011
    adr:
    - ADR-0094
  - id: UCORG-05-013
    priority: MUST
    kind: project
    statement: >-
      A `REFUSED` disposition reaching `InboxOutcome` MUST be logged above `DEBUG` by the
      component that observes the completed outcome
    rationale: >-
      `run_inbox_pipeline` only debug-logs `outcome.status`, so the verdict is discarded a
      second time after `process_payload` returns. Issue #2255's acceptance criterion
      requires the refusal be visible in the actor log above `DEBUG`; without this
      requirement the whole chain could satisfy UCORG-05-010 and UCORG-05-011 and still
      leave the refusal invisible in normal operation.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-011
    adr:
    - ADR-0094
