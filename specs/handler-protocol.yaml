id: HP
title: Handler Protocol
description: Handler use-case classes process `VultronEvent` domain objects and implement protocol business logic. All handlers
  follow a common contract defined by the `UseCase` Protocol.
version: 1.1.0
scope:
- prototype
- production
tags:
- messaging
- protocol
groups:
- id: HP-00
  title: Protocol Semantics
  specs:
  - id: HP-00-001
    priority: MUST
    kind: protocol
    statement: Handlers MUST interpret received activities as assertions about the sender's state, not as commands to perform
      work
    verification: Inspection of all handler `execute()` methods confirms they update local state machine records from
      the received `VultronEvent` payload and issue no imperative outbound commands in direct response to receipt.
    stories:
    - story_2022_002
  - id: HP-00-002
    priority: MUST
    kind: protocol
    statement: Handlers MUST update local RM/EM/CS state to reflect the state transition asserted by the received activity
    verification: Integration tests in `test/demo/` confirm that each inbound activity type results in the expected
      RM, EM, or CS state change in the receiver's DataLayer after the handler completes.
    stories:
    - story_2022_074
    - story_2022_088
- id: HP-01
  title: Handler Signature
  specs:
  - id: HP-01-001
    priority: MUST
    kind: project
    statement: 'All handler use-case classes MUST accept `(dl: DataLayer, request: VultronEvent)` as `__init__` parameters,
      and their `execute()` method MUST take no arguments'
  - id: HP-01-002
    priority: MUST
    kind: project
    statement: >-
      Handler use-case `execute` methods MUST return `HandlerResult`; `None` is not a
      permitted return type
    rationale: >-
      Previously MAY (None or HandlerResult), which directly contradicted UCORG-05-002's
      MUST. The permissive form also made `-> None` ambiguous between "nothing to report"
      and "not yet migrated". Resolved in favour of MUST by ADR-0095, which gives the
      return value a consumer: the handler's `HandlerDisposition` is the only thing that
      can tell `InboxOutcome` whether an inbound assertion was applied, skipped, or
      refused. See CONCERN-1769.
    relationships:
    - rel_type: implements
      spec_id: UCORG-05-002
    adr:
    - ADR-0095
  - id: HP-01-003
    priority: MUST
    kind: project
    statement: >-
      A handler MUST report a `HandlerDisposition` of `REFUSED` only when it rejected the
      inbound assertion; it MUST report `SKIPPED` for a legitimate no-op such as a duplicate
      or already-present record, and `DEFERRED` when it parked the item for later replay
      rather than declining it. A benign skip or a deferral MUST NOT be reported as `REFUSED`
    rationale: >-
      Not every behavior-tree FAILURE is a refusal, and not every SUCCESS is applied work.
      `received/status.py` already special-cases `CASE_STATUS_ALREADY_PRESENT` to keep an
      idempotent skip from reading as a failure, and the ledger-sync buffer nodes return
      SUCCESS for an entry they have only parked. Conflating either with a refusal would
      promote it to `InboxOutcome.status == "rejected"` and produce false alarms; conflating
      a deferral with `APPLIED` or `SKIPPED` hides the fact that a replay is pending. See
      ADR-0095 and issue #2255.
    adr:
    - ADR-0095
  - id: HP-01-004
    priority: MUST_NOT
    kind: project
    statement: >-
      Handler use cases MUST NOT return or reference `InboxOutcome` or its
      `processed`/`deferred`/`rejected` vocabulary; mapping `HandlerDisposition` onto
      `InboxOutcome` is owned by `DispatchNode`
    rationale: >-
      Keeps the inbox-pipeline vocabulary out of the core use-case layer. A handler reports
      what *it* did, in its own vocabulary; whether that becomes `processed`, `deferred`, or
      `rejected` is a pipeline concern, and two dispositions already collapse onto
      `processed`. Note this is a layering rule, not a claim about which outcomes a handler
      can cause: a handler can produce a deferral (`HandlerDisposition.DEFERRED`), it just
      must not say so in `InboxOutcome`'s words.
    adr:
    - ADR-0095
- id: HP-02
  title: Semantic Verification
  specs:
  - id: HP-02-001
    priority: MUST
    kind: architecture
    statement: All handlers MUST have semantic type verification before execution
    relationships:
    - rel_type: depends_on
      spec_id: DR-01-003
  - id: HP-02-002
    priority: MUST
    kind: architecture
    statement: The verification mechanism MUST check that the activity's semantic type matches the handler's expected type
    rationale: Prevents routing errors where wrong handler processes an activity
    relationships:
    - rel_type: refines
      spec_id: DR-01-003
- id: HP-03
  title: Handler Registration
  specs:
  - id: HP-03-001
    priority: MUST
    kind: architecture
    statement: All handlers MUST be discoverable via a handler registry mechanism
    relationships:
    - rel_type: derives_from
      spec_id: DR-02-001
  - id: HP-03-002
    priority: MUST
    kind: architecture
    statement: Registry keys MUST match handler semantic verification types
    relationships:
    - rel_type: refines
      spec_id: DR-02-002
- id: HP-04
  title: Payload Access
  specs:
  - id: HP-04-001
    priority: MUST
    kind: project
    statement: Handlers MUST access activity data via `dispatchable.payload`
    rationale: Encapsulation; payload may be validated/transformed by dispatcher
  - id: HP-04-002
    priority: MUST
    kind: architecture
    statement: Handlers MUST use schema validation for type-safe payload access
- id: HP-05
  title: Error Handling
  specs:
  - id: HP-05-001
    priority: MUST
    kind: architecture
    statement: Handlers MUST raise exceptions for unrecoverable errors
  - id: HP-05-002
    priority: MUST
    kind: architecture
    statement: Handlers MUST log expected errors without raising exceptions
- id: HP-06
  title: Logging
  specs:
  - id: HP-06-001
    priority: MUST
    kind: project
    statement: Handlers MUST log entry at DEBUG level with handler name
  - id: HP-06-002
    priority: MUST
    kind: project
    statement: Handlers MUST log state transitions at INFO level with before/after states
  - id: HP-06-003
    priority: MUST
    kind: project
    statement: Handlers MUST log errors at ERROR level with full context
    relationships:
    - rel_type: depends_on
      spec_id: SL-03-001
    - rel_type: depends_on
      spec_id: SL-04-001
- id: HP-07
  title: Idempotency
  specs:
  - id: HP-07-001
    priority: SHOULD
    kind: architecture
    statement: Handlers SHOULD be idempotent to support retries
    relationships:
    - rel_type: depends_on
      spec_id: ID-04-001
  - id: HP-07-002
    priority: MUST
    kind: architecture
    statement: Handlers MUST complete execution within 30 seconds
    rationale: Prevents indefinite blocking of background task queue
    scope:
    - production
  - id: HP-07-003
    priority: MUST
    kind: architecture
    statement: Long-running operations MUST be broken into async subtasks
    scope:
    - production
- id: HP-08
  title: Data Model Persistence
  specs:
  - id: HP-08-001
    priority: MUST
    kind: project
    statement: Handlers MUST use helper functions when persisting Pydantic models to the data layer
  - id: HP-08-002
    priority: MUST
    kind: project
    statement: Handlers MUST call `DataLayer.update()` with all required parameters
  - id: HP-08-003
    priority: MUST_NOT
    kind: project
    statement: Pydantic validators MUST NOT overwrite existing field values during deserialization
  - id: HP-08-004
    priority: MUST
    kind: project
    statement: The DataLayer and handlers MUST treat object IDs as opaque URI strings
  - id: HP-08-005
    priority: MUST
    kind: project
    statement: Handlers that add status updates MUST append full status objects (not bare ID strings) to the case/participant
      status history lists
    relationships:
    - rel_type: depends_on
      spec_id: CM-03-006
  - id: HP-08-006
    priority: MUST
    kind: project
    statement: The `AddNoteToCase` handler MUST persist a Note object and append its ID as a `as_NoteRef` to `VulnerabilityCase.notes`.
    rationale: Ensures notes are fully persisted and linked to cases, consistent with the case management data model
- id: HP-09
  title: Offer Recipient Addressing
  specs:
  - id: HP-09-001
    priority: MUST
    kind: protocol
    statement: Handlers processing an inbound `Offer` activity MUST determine case-creation eligibility from the `to` field
      only
    verification: Inspect the `SubmitReportReceivedUseCase` (or equivalent Offer handler) to confirm eligibility logic
      branches only on the `to` field; `cc` and `target` fields are not consulted for eligibility determination.
    stories:
    - story_2022_002
    - story_2022_012
    - story_2022_038
  - id: HP-09-002
    priority: MUST_NOT
    kind: protocol
    statement: The `target` field MUST NOT be used to determine case-creation eligibility for `Offer` activities
    relationships:
    - rel_type: depends_on
      spec_id: VAM-01-008
- id: HP-10
  title: Unsupported Addressing Fields
  specs:
  - id: HP-10-001
    priority: MUST
    kind: protocol
    statement: When a receiving actor finds itself in the `cc` field of an inbound `Offer(Report)` activity, the handler MUST
      log a WARNING and discard the activity without creating a case
    verification: A unit or integration test confirms that an `Offer(Report)` addressed to the receiver via `cc`
      produces a WARNING log entry and neither creates a case nor enqueues any outbound activities.
    rationale: '`cc` addressing has no defined handler semantics in the current protocol version. Implementing an "informational
      receive" use case for `cc` recipients would require defining what "informational only" means, which is deferred. Deliberate
      simplification.'
    relationships:
    - rel_type: refines
      spec_id: HP-09-001
    stories:
    - story_2022_002
    - story_2022_012
