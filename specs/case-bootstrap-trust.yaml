id: CBT
title: Case Bootstrap Trust
description: Requirements for establishing trust in a VulnerabilityCase and its CASE_MANAGER at non-owner sites. Governs the
  bootstrap process by which a non-owner participant verifies that an incoming case and its managing actor are legitimate
  before accepting case state updates.
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: CBT-01
  title: Original Report-Submission Bootstrap
  specs:
  - id: CBT-01-001
    priority: MUST
    kind: protocol
    statement: When a case is created in response to an inbound `Offer(VulnerabilityReport)`, the actor that received the
      report (the report receiver) MUST establish trust at the original report submitter by sending it, as itself, a
      one-time `Create(VulnerabilityCase)` activity. When the CASE_MANAGER is a different actor from the report receiver,
      that activity introduces the CASE_MANAGER the receiver delegated case maintenance to (ADR-0132).
    rationale: The submitter chose the report receiver and wrote a record of that choice before the case existed. A case
      that arrives first from an actor the submitter never addressed gives it nothing to check the sender against, and a
      roster the sender wrote is not an anchor. The receiver already knows the CASE_MANAGER, so it vouches for it.
    verification: '`test_report_receiver_sends_the_reporter_the_case` in `test/demo/test_case_proposal_round_trip.py` confirms
      that when a case is created in response to an `Offer(VulnerabilityReport)`, the only `Create(VulnerabilityCase)` the
      original report submitter holds comes from the report receiver, and that the submitter accepts it on the trusted
      route. `test_report_receiver_introduces_the_case_manager_to_the_reporter` in
      `test/core/behaviors/case/test_create_case_received_tree.py` confirms the introduction carries the case inline,
      names the CASE_MANAGER and the submitted report.'
    relationships:
    - rel_type: refines
      spec_id: CM-12-001
    - rel_type: refines
      spec_id: PCR-02-005
    adr:
    - ADR-0132
    stories:
    - story_2022_012
    - story_2022_090
  - id: CBT-01-002
    priority: MUST
    kind: protocol
    statement: The bootstrap `Create(VulnerabilityCase)` activity MUST carry the complete `VulnerabilityCase`, inline or
      by reference, rather than a minimal stub or partial trust-only payload.
    rationale: >-
      The receiver seeds its Participant Case Replica from this activity. A stub or
      a partial case leaves it nothing complete to seed from. It also has no trusted
      source to ask for the rest, because it trusts the CASE_MANAGER only after it
      accepts this activity.
    verification: >-
      `test_report_receiver_introduces_the_case_manager_to_the_reporter` in
      `test/core/behaviors/case/test_create_case_received_tree.py` confirms that the
      bootstrap `Create(VulnerabilityCase)` the report receiver sends carries the
      case inline, with its participants and reports as full objects, not a stub.
    relationships:
    - rel_type: implements
      spec_id: AKM-03-001
    stories:
    - story_2022_088
    - story_2022_090
  - id: CBT-01-003
    priority: MUST
    kind: protocol
    statement: >-
      The bootstrap case snapshot MUST distinguish the actor that *asked for* the case
      from the actor that *created* it. The actor whose `CaseProposal` caused the case
      to exist — the report receiver, whatever other roles it also holds — MUST be a
      participant with the `CASE_OWNER` role. The actor that created the case MUST be a
      participant with the `CASE_MANAGER` role, and SHOULD also carry the `COORDINATOR`
      role. The `CASE_OWNER` role MUST NOT be delegated to the CASE_MANAGER.
    rationale: >-
      The CASE_MANAGER creates the case (ADR-0041) and the report receiver asks for
      it, so the two roles can belong to two actors. CASE_OWNER is the standing of
      the party whose disclosure decisions the case serves, and it is never
      delegated. CASE_MANAGER is the right to write the canonical case ledger, held
      by the actor whose store holds the case (ADR-0073). If the snapshot merged
      the roles, the ledger writer could also make the Case Owner's decisions.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts both halves
      of the distinction on the bootstrap snapshot: `TestADR0041OwnerParticipant` that
      the proposing report receiver is a participant carrying `CVDRole.CASE_OWNER`, and
      `TestCaseActorIsOneParticipantDistinctFromTheOwner` that the creating actor is the
      one participant carrying `CVDRole.CASE_MANAGER` and is not the case owner.
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    - rel_type: refines
      spec_id: CM-02-010
    - rel_type: refines
      spec_id: PCR-01-002
    adr:
    - ADR-0041
    - ADR-0073
    stories:
    - story_2022_046
    - story_2022_092
  - id: CBT-01-004
    priority: MUST
    kind: protocol
    statement: When the original report submitter is intended to receive ongoing case updates immediately, the bootstrap case
      snapshot MUST include that actor as a participant from the start.
    rationale: >-
      The CASE_MANAGER shares case content only with active participants (CM-10-004).
      A submitter that is not on the starting roster gets no updates until it is
      invited, although it is the party that brought the report. On the roster from
      the start, it can follow the case from its first entry.
    verification: >-
      `test_report_receiver_sends_the_reporter_the_case` in
      `test/demo/test_case_proposal_round_trip.py` confirms that the replica the
      submitter seeds from the bootstrap `Create(VulnerabilityCase)` lists the
      submitter in its participant index and holds its `CaseParticipant` record.
    stories:
    - story_2022_013
    - story_2022_052
  - id: CBT-01-005
    priority: MUST
    kind: protocol
    statement: A report submitter MUST NOT trust a newly introduced CASE_MANAGER unless the bootstrap `Create(VulnerabilityCase)`
      both comes from the same actor that received the report and references the previously submitted report. The
      submitter MUST check this against a record it wrote itself before the case arrived; the roster in the snapshot,
      which the sender wrote, MUST NOT serve as that record.
    rationale: >-
      The report receiver is the only actor the submitter chose. The record the
      submitter wrote when it sent the report ties the report to that actor, so the
      sender cannot forge it (PCR-05-001). The sender writes the roster in the
      snapshot, so any actor can name itself CASE_MANAGER there. The report reference
      also stops an actor from attaching an unrelated case to the submitter.
    verification: >-
      `TestBootstrapCreateRejectedBadSender` in
      `test/core/use_cases/received/case/test_create.py` confirms that a
      `Create(VulnerabilityCase)` from a sender other than the report receiver is
      refused and seeds no case, and
      `test_bootstrap_not_naming_the_submitted_report_is_refused` in
      `test/core/behaviors/case/test_create_case_received_tree.py` confirms that one
      without a matching report reference is refused and binds no link. The
      record-it-wrote-itself rule is verified by CBT-01-011's test.
    relationships:
    - rel_type: refines
      spec_id: PCR-05-001
    - rel_type: refines
      spec_id: AKM-02-001
    adr:
    - ADR-0132
    stories:
    - story_2022_035
    - story_2022_089
    - story_2022_090
  - id: CBT-01-006
    priority: MUST
    kind: protocol
    statement: After validating the bootstrap `Create(VulnerabilityCase)`, the receiving actor MUST persist the report-to-case
      link, the report receiver's identity (the actor that introduced the case), and the trusted CASE_MANAGER identity for that
      relationship.
    rationale: >-
      The receiver checks later CASE_MANAGER traffic, such as
      `Announce(VulnerabilityCase)`, against this record (CBT-02-001, CBT-02-003).
      Without it, the receiver could judge each later message only by what the
      message claims about itself. The report-to-case link also lets the submitter
      find the case for its report.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that after a valid bootstrap
      `Create(VulnerabilityCase)`, the receiver's DataLayer contains the report-to-case link, the report receiver's identity,
      and the trusted CASE_MANAGER identity for that relationship.
    relationships:
    - rel_type: refines
      spec_id: PCR-05-001
    adr:
    - ADR-0132
    stories:
    - story_2022_096
    - story_2022_088
  - id: CBT-01-007
    priority: MUST
    kind: protocol
    statement: >-
      The bootstrap `Create(VulnerabilityCase)` payload MUST carry every nested domain
      object of the case (e.g., each `CaseParticipant` the case lists), each inline or
      by reference.
    rationale: >-
      The receiver seeds its replica from this payload, and later guards read the
      nested records it seeds, such as the participant checks on a sender. A nested
      object the payload leaves out, inline or as a reference the receiver can
      resolve, is a record the replica lacks when a guard needs it.
    verification: >-
      `test/adapters/driven/trigger_activity_adapter/test_cases.py::TestCaseOnTheWireCarriesItsParticipants::test_create_case_carries_participants_and_reports`
      confirms every `CaseParticipant` of the case is present in the bootstrap payload,
      and integration tests in `test/demo/test_case_proposal_round_trip.py` confirm the
      receiver can persist each participant record.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-002
    stories:
    - story_2022_088
    - story_2022_092
  - id: CBT-01-012
    priority: MUST
    kind: project
    statement: This codebase MUST carry the bootstrap `VulnerabilityCase` inline in the `Create(VulnerabilityCase)`, with
      every nested domain object (e.g., each `CaseParticipant` in `case_participants`) embedded as a full inline object;
      it MUST NOT use a bare URI string for a nested object in this activity.
    rationale: >-
      This is how this codebase meets CBT-01-002 and CBT-01-007. The codebase fetches
      only the objects the note on AKM-05-007 lists, and a nested case object is not
      one of them, so a receiver here cannot read a record named only by URI. A
      bootstrap that names a participant by URI is refused (CBT-05-009). Inlining is
      a choice of this prototype, not a protocol rule: an implementation that fetches
      the reference can accept it.
    verification: Inspection of `vultron/wire/as2/vocab/` confirms that `ActivityStreamRef` fields accept bare URI strings
      without error; integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that the bootstrap carries
      a fully materialized `VulnerabilityCase` and that `CaseParticipant` objects are serialized as full inline objects
      in the bootstrap payload.
    relationships:
    - rel_type: implements
      spec_id: CBT-01-002
    - rel_type: implements
      spec_id: CBT-01-007
  - id: CBT-01-008
    priority: MUST
    kind: protocol
    statement: >-
      The bootstrap case snapshot MUST include the original report submitter's
      participant record with an RM state of `RM.ACCEPTED`. The CASE_MANAGER MUST
      set this state directly rather than inserting intermediate transitions
      (`RM.START`, `RM.RECEIVED`, `RM.VALID`) that the CASE_MANAGER never
      observed for the reporter.
    rationale: >-
      A report submitter can only be in `RM.ACCEPTED` at the time of submission:
      reporting is the act of accepting that the vulnerability warrants
      coordinated disclosure. A submitter who considered the item invalid would
      not have filed a report, and one who had deferred or closed their
      involvement would not be reporting at all. Because the CASE_MANAGER cannot
      observe the reporter's internal state progression, inserting intermediate
      RM records on the reporter's behalf would place unobserved events into the
      canonical case ledger. The CASE_MANAGER MUST instead reflect the only state
      the reporter could actually be in: `RM.ACCEPTED`.
    verification: >-
      Integration tests in `test/demo/test_case_proposal_round_trip.py`
      confirm that after a valid bootstrap exchange the reporter's participant
      record carries `RM.ACCEPTED` in the CASE_MANAGER's DataLayer, and that no
      intermediate RM records (`RM.START`, `RM.RECEIVED`, `RM.VALID`) appear
      for the reporter in that DataLayer.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-004
    - rel_type: refines
      spec_id: SM-04-001
    stories:
    - story_2022_013
    - story_2022_038
  - id: CBT-01-009
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The CASE_MANAGER MUST generate its `Create(VulnerabilityCase)` activity
      only after the `VulnerabilityCase` domain object has been fully
      initialized — all participants set to their correct initial RM states,
      all roles assigned. The activity MUST be a faithful record of a completed
      initialization, not an intent message constructed before initialization
      is finished. The report receiver's introduction to the submitter (CBT-01-001)
      MUST relay that completed snapshot.
    rationale: >-
      ActivityStreams 2.0 activities represent completed events, not intentions.
      A `Create(VulnerabilityCase)` sent before the case is fully initialized
      would misrepresent the state that existed at creation time. Receivers
      replay the bootstrap snapshot as authoritative ledger content; if that
      snapshot is incomplete, every replica is permanently wrong. Sequencing
      the activity after initialization is the structural guarantee that the
      bootstrap snapshot is always accurate.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-002
    - rel_type: refines
      spec_id: CBT-01-007
    lint_suppress:
    - missing_story_reference
  - id: CBT-01-010
    priority: MUST
    kind: protocol
    statement: >-
      When the actor enacting CASE_MANAGER is not the report receiver, the
      CASE_MANAGER MUST NOT address its `Create(VulnerabilityCase)` to the
      original report submitter. That activity goes to the report receiver (the
      Case Owner), which relays the introduction (CBT-01-001). The CASE_MANAGER's
      first message to the submitter is an `Announce`. A submitter that receives
      it before the introduction holds it under CBT-03-001 and CBT-03-002.
    rationale: >-
      The submitter never addressed the CASE_MANAGER, so a `Create` from it
      cannot be checked against anything the submitter wrote (CBT-01-005).
      Introducing the CASE_MANAGER through the actor the submitter chose keeps
      one trust anchor for the submitter and removes the route that trusted a
      sender because its own snapshot named it (ADR-0132).
    verification: >-
      `test_case_manager_create_is_addressed_to_the_owner_only` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts that
      the CASE_MANAGER's `Create(VulnerabilityCase)` has the report receiver as
      its only addressee.
    adr:
    - ADR-0132
    relationships:
    - rel_type: refines
      spec_id: CBT-01-001
    - rel_type: refines
      spec_id: CBT-01-005
    stories:
    - story_2022_090
    - story_2022_088
  - id: CBT-01-011
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST refuse a bootstrap `Create(VulnerabilityCase)` from an
      actor that no trust anchor the participant wrote names as the expected
      sender, and MUST store nothing from it. Naming the sender as CASE_MANAGER
      in the carried snapshot MUST NOT make the sender trusted.
    rationale: >-
      The sender wrote the snapshot, so a roster in it proves nothing about the
      sender's authority (ADR-0132; `notes/participant-case-replica.md`).
    verification: >-
      `test_bootstrap_from_an_actor_no_anchor_names_is_refused` in
      `test/core/use_cases/received/case/test_helpers.py` sends
      `Create(VulnerabilityCase)` from an actor no local anchor names, with a
      snapshot naming that sender as CASE_MANAGER, and asserts a refusal and an
      empty case store. It runs once per anchor state: a pending link naming
      another actor, no link at all, and a link already bound to another case.
    adr:
    - ADR-0132
    relationships:
    - rel_type: refines
      spec_id: CBT-01-005
    stories:
    - story_2022_035
    - story_2022_089
    - story_2022_090
- id: CBT-02
  title: Post-Bootstrap Update Authority
  specs:
  - id: CBT-02-001
    priority: MUST
    kind: protocol
    statement: For the original report-submission path, `Create(VulnerabilityCase)` is a one-time bootstrap message only;
      subsequent full-case synchronization MUST use `Announce(VulnerabilityCase)` from the trusted CASE_MANAGER.
    rationale: >-
      Two activity types let a receiver tell a first introduction from a later
      sync. It checks the `Create` against the record it wrote when it sent the
      report (CBT-01-005). It checks each `Announce` against the CASE_MANAGER that
      the accepted `Create` named (CBT-01-006).
    verification: >-
      `test_receiver_that_is_the_case_manager_sends_no_second_create` and
      `test_reporter_trusts_a_receiver_that_is_its_own_case_manager` in
      `test/core/behaviors/case/test_create_case_received_tree.py` confirm that a
      report receiver that is also the CASE_MANAGER sends the reporter no second
      `Create(VulnerabilityCase)`.
      `test_reporter_accepts_the_case_managers_announce_after_the_introduction` in
      `test/demo/test_case_proposal_round_trip.py` confirms that the reporter accepts
      the later `Announce(VulnerabilityCase)` from the trusted CASE_MANAGER.
    relationships:
    - rel_type: refines
      spec_id: PCR-02-001
    - rel_type: refines
      spec_id: PCR-03-001
    stories:
    - story_2022_088
    - story_2022_045
  - id: CBT-02-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: Transport authentication or encrypted direct messaging alone MUST NOT be treated as establishing authority to
      trust a previously unknown CASE_MANAGER; the explicit bootstrap trust handoff is required.
    rationale: >-
      Transport authentication shows which actor sent a message. It does not show
      that the actor may manage the case. Only a Trust Anchor the receiver wrote,
      from a relationship it had before the case arrived, ties the case to a
      CASE_MANAGER (CBT-01-005, CBT-04-001).
    relationships:
    - rel_type: refines
      spec_id: AKM-01-002
  - id: CBT-02-003
    priority: MUST
    kind: protocol
    statement: Once a CASE_MANAGER has been trusted for a case, that identity MUST NOT be replaced implicitly by ordinary case-update
      traffic; CASE_MANAGER rotation or transfer MUST use an explicit transfer workflow.
    rationale: >-
      If ordinary case traffic could replace the trusted CASE_MANAGER, a case
      snapshot that names a different manager would move trust with no decision by
      the Case Owner. The receiver would then accept updates from an actor it never
      checked. An explicit workflow makes the change one step that participants can
      see.
    verification: Inspection of `vultron/wire/as2/` confirms that CASE_MANAGER identity is stored at bootstrap time and is
      not overwritten by ordinary `Announce(VulnerabilityCase)` traffic; only an explicit transfer workflow may replace
      the trusted CASE_MANAGER.
    relationships:
    - rel_type: refines
      spec_id: CM-02-010
    stories:
    - story_2022_050
    - story_2022_035
- id: CBT-03
  title: Out-of-Order Handling and Replay Requests
  specs:
  - id: CBT-03-001
    priority: SHOULD
    kind: protocol
    statement: >-
      If a CASE_MANAGER-originated case message arrives before the required bootstrap
      trust handoff, the receiving actor SHOULD queue it only for a short bounded
      interval rather than accepting or permanently trusting it immediately.
    rationale: >-
      The transport does not promise delivery order (SYNC-19-003), so a message from
      the real CASE_MANAGER can arrive before the bootstrap that makes it trusted. If
      the receiver drops the message at once, the message is lost. If the receiver
      applies it at once, it trusts a sender it has not checked. A short hold keeps
      the message until the bootstrap arrives, and the limit stops untrusted messages
      from staying in storage with no end.
    relationships:
    - rel_type: refines
      spec_id: PCR-06-002
  - id: CBT-03-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: A pre-bootstrap CASE_MANAGER message MUST NOT update local case state before the corresponding trust-establishing
      bootstrap message has been validated.
    rationale: >-
      Before the bootstrap is validated, the receiver cannot know that the sender is
      the CASE_MANAGER. A state change from that message can come from any actor,
      and the receiver would then hold case state that no trusted source sent.
    relationships:
    - rel_type: refines
      spec_id: PCR-06-003
  - id: CBT-03-003
    priority: MUST
    kind: protocol
    statement: >-
      When the bounded pre-bootstrap queue interval (CBT-03-001) expires, the receiver
      MUST drop the queued message.
    rationale: >-
      A message the receiver cannot yet trust must not wait without limit for a case
      copy that may never arrive. Dropping it when the interval ends limits what the
      receiver stores. ADR-0163 gives the recovery of a dropped Invite to the
      CASE_MANAGER, which knows which Invites each participant has not answered.
    verification: >-
      A unit test confirms that when the pre-bootstrap queue timeout elapses, the queued
      message is discarded and the activity is not applied to local case state.
    adr:
    - ADR-0163
    stories:
    - story_2022_090
    - story_2022_088
  - id: CBT-03-004
    priority: SHOULD
    kind: project
    statement: When bootstrap has not arrived in time, the receiver SHOULD request a replay from the original report receiver
      / case creator by sending an `as_Question` activity (`vultron.wire.as2.vocab.base.objects.activities.intransitive.as_Question`)
      asking for the bootstrap `Create(VulnerabilityCase)` to be resent. The `target` of the `as_Question` SHOULD be set to
      the `case_actor_id` recorded on the `VultronPendingCaseInbox` entry.
    rationale: >-
      A receiver whose queue expired has lost messages it could not yet trust, and
      only a case copy lets it trust the next ones. The `Question` asks the actor
      that the queue record names for that case copy, so the receiver does not
      depend only on other traffic to get it.
  - id: CBT-03-005
    priority: MUST
    kind: project
    statement: >-
      This codebase's pre-bootstrap queue (CBT-03-001, CBT-03-003) MUST expire after 300
      seconds by default, configurable via
      `AppConfig.pre_bootstrap_queue_timeout_seconds` (environment variable
      `VULTRON_PRE_BOOTSTRAP_QUEUE_TIMEOUT_SECONDS`).
    rationale: >-
      A queue with no expiry holds activities for a case that never bootstraps for as
      long as the process runs. A fixed default gives every deployment the same bound,
      and the override lets an operator fit it to how slow its peers are.
    verification: >-
      `test/test_config.py::test_defaults_pre_bootstrap_queue_timeout_seconds` asserts
      the 300-second default, and
      `::test_env_override_pre_bootstrap_queue_timeout_seconds` asserts the environment
      override.
    relationships:
    - rel_type: implements
      spec_id: CBT-03-001
    - rel_type: implements
      spec_id: CBT-03-003
  - id: CBT-03-006
    priority: MUST
    kind: project
    statement: >-
      When this codebase drops an expired pre-bootstrap queue (CBT-03-003), it MUST log
      a warning.
    rationale: >-
      An expired queue drops activities the actor received but never processed. Without
      a log record, an operator cannot tell that a case missed its bootstrap or which
      activities were lost.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_handler.py::test_pending_case_queue_expires_drops_and_warns`
      asserts the WARNING record when an expired queue is dropped.
    relationships:
    - rel_type: implements
      spec_id: CBT-03-003
- id: CBT-04
  title: Late-Joiner Bootstrap
  specs:
  - id: CBT-04-001
    priority: MUST
    kind: protocol
    statement: For a participant added after case creation, the trust-establishing message MUST be `InviteActorToCase` from
      the CASE_MANAGER rather than `Create(VulnerabilityCase)`.
    rationale: >-
      A late joiner submitted no report, so it holds no record that ties a case to
      an actor it chose. The stub Invite gives it one: the joiner chooses to accept
      it, and the accepted Invite is its Trust Anchor for the case (PCR-03-004). A
      `Create(VulnerabilityCase)` from an actor the joiner never dealt with gives it
      nothing to check the sender against.
    verification: >-
      `test_the_stub_invite_is_the_late_joiners_trust_anchor` in
      `test/demo/test_pcr_late_joiner.py` confirms that a participant
      added after case creation receives the stub Invite and seeds its replica with
      no `Create(VulnerabilityCase)` received.
    relationships:
    - rel_type: refines
      spec_id: CM-11-001
    stories:
    - story_2022_013
    - story_2022_090
  - id: CBT-04-002
    priority: MUST
    kind: protocol
    statement: The trust-establishing invite for a late joiner MUST identify both the case and the CASE_MANAGER that will send
      subsequent `Announce(VulnerabilityCase)` updates.
    rationale: >-
      The joiner checks each later `Announce(VulnerabilityCase)` against the Trust
      Anchor the Invite left. If the Invite does not name both the case and the
      CASE_MANAGER, the joiner cannot tell which sender to trust for which case.
    verification: >-
      `test_the_stub_invite_is_the_late_joiners_trust_anchor` in
      `test/demo/test_pcr_late_joiner.py` confirms that the stub Invite
      names the case as its `context` and, as its `actor`, the one actor that later
      sends the joiner `Announce(VulnerabilityCase)`.
    stories:
    - story_2022_090
    - story_2022_092
  - id: CBT-04-003
    priority: MUST
    kind: protocol
    statement: >-
      After the late joiner has accepted the stub Invite (`Accept(Invite(Actor,
      VulnerabilityCaseStub))`), the CASE_MANAGER MAY send `Announce(VulnerabilityCase)`
      without a separate `Create(VulnerabilityCase)` bootstrap.
    rationale: >-
      The accepted stub Invite already gives the joiner its Trust Anchor
      (CBT-04-001). A further `Create(VulnerabilityCase)` adds a second trust step
      with nothing new to check, and it uses `Create` for a case the joiner did not
      see created.
    verification: >-
      `test_the_stub_invite_is_the_late_joiners_trust_anchor` in
      `test/demo/test_pcr_late_joiner.py` confirms that after a late
      joiner accepts the stub Invite, the CASE_MANAGER's
      `Announce(VulnerabilityCase)` seeds its replica with no
      `Create(VulnerabilityCase)` received.
    relationships:
    - rel_type: refines
      spec_id: PCR-07-007
    adr:
    - ADR-0114
    stories:
    - story_2022_054
    - story_2022_088
- id: CBT-05
  title: Verification
  specs:
  - id: CBT-05-001
    priority: MUST
    kind: project
    statement: >-
      Tests MUST verify that the original report submitter accepts
      CASE_MANAGER-originated `Announce(VulnerabilityCase)` updates only after a valid
      bootstrap `Create(VulnerabilityCase)` from the report receiver has established
      trust.
    rationale: >-
      This order keeps an actor the submitter never checked out of its replica.
      Messages usually arrive in order, so a regression that accepted an `Announce`
      before the bootstrap would show no error in a normal run. A test must check
      it.
    verification: >-
      `test_reporter_accepts_the_case_managers_announce_after_the_introduction` in
      `test/demo/test_case_proposal_round_trip.py` confirms that, after the report
      receiver's bootstrap, the submitter accepts the CASE_MANAGER's
      `Announce(VulnerabilityCase)` and refuses the same `Announce` from an actor the
      bootstrap did not name.
    stories:
    - story_2022_090
    - story_2022_088
  - id: CBT-05-002
    priority: MUST
    kind: project
    statement: Tests MUST verify that a bootstrap `Create(VulnerabilityCase)` is rejected when the sender does not match the
      actor that received the report or when the case does not reference the known submitted report.
    rationale: >-
      These two checks make the bootstrap a Trust Anchor (CBT-01-005). If either
      check stops working, any actor can seed a case at the submitter, and a normal
      run, where every sender is honest, shows no error.
    verification: '`TestBootstrapCreateRejectedBadSender` in `test/core/use_cases/received/case/test_create.py` confirms
      that a `Create(VulnerabilityCase)` from a sender other than the actor that received the report is rejected, and
      `test_bootstrap_not_naming_the_submitted_report_is_refused` in
      `test/core/behaviors/case/test_create_case_received_tree.py` confirms that one not referencing the known submitted
      report is rejected.'
    stories:
    - story_2022_089
    - story_2022_090
  - id: CBT-05-003
    priority: MUST
    kind: project
    statement: >-
      Tests MUST verify that pre-bootstrap CASE_MANAGER messages remain unapplied,
      expire safely, and lead to a replay request (CBT-03-004).
    rationale: >-
      A message arrives before its bootstrap only when delivery is out of order,
      which a normal run seldom causes. Only a test checks regularly that such a
      message stays unapplied and that its expiry follows CBT-03-003 and CBT-03-004.
    verification: >-
      `test_deferred_activity_replays_with_its_inline_object` in
      `test/adapters/driving/fastapi/test_inbox_staging.py` confirms that a queued
      activity is held, not stored, until the case arrives.
      `test_pending_case_queue_expires_drops_and_warns` and
      `test_pending_case_queue_expiry_emits_question` in
      `test/adapters/driving/fastapi/test_inbox_handler.py` confirm that an expired
      queue is dropped with a warning and that a replay `Question` goes to the
      `case_actor_id` the queue record holds.
    stories:
    - story_2022_090
    - story_2022_088
  - id: CBT-05-004
    priority: MUST
    kind: project
    statement: Tests MUST verify that late joiners establish trust through `InviteActorToCase` and may then accept CASE_MANAGER-originated
      `Announce(VulnerabilityCase)` updates without an intermediate `Create(VulnerabilityCase)` bootstrap.
    rationale: >-
      A late joiner gets its Trust Anchor from a different message than the
      submitter does. A test of the submitter's bootstrap does not show a break in
      the joiner's.
    verification: >-
      `test_the_stub_invite_is_the_late_joiners_trust_anchor` in
      `test/demo/test_pcr_late_joiner.py` confirms that a late joiner accepts the
      stub Invite and seeds its replica from the CASE_MANAGER's
      `Announce(VulnerabilityCase)` with no `Create(VulnerabilityCase)` received.
    stories:
    - story_2022_054
    - story_2022_090
  - id: CBT-05-005
    priority: MUST
    kind: project
    verification: >-
      `test/core/use_cases/received/case/test_bootstrap_participants.py::TestBootstrapParticipantStorage`
      asserts each embedded participant of a valid bootstrap is stored, and
      `test/demo/test_case_proposal_round_trip.py` asserts the reporter receives the
      case it is a participant of.
    stories:
    - story_2022_013
    - story_2022_063
    statement: >-
      Tests MUST verify that a valid bootstrap `Create(VulnerabilityCase)` causes the
      reporter's participant status record to be stored as an embedded participant in the
      new case, making the reporter addressable without a separate `InviteActorToCase`.
    rationale: >-
      If the bootstrap does not store the reporter's participant record, the
      reporter is not a participant in its own replica, and it would need an Invite
      to join the case it reported. A test confirms that the bootstrap alone makes
      it a participant.
  - id: CBT-05-006
    priority: MUST
    kind: project
    verification: >-
      `test/core/use_cases/received/case/test_bootstrap_participants.py::TestM4AddParticipantStatusAfterBootstrap`
      runs `AddParticipantStatusBT` on the reporter's replica after bootstrap and
      asserts it succeeds.
    stories:
    - story_2022_092
    - story_2022_093
    statement: >-
      Tests MUST verify that `AddParticipantStatusBT` executes successfully on the
      reporter's replica after bootstrap, confirming the reporter appears in the
      CASE_MANAGER's participant index.
    rationale: >-
      The reporter's later status updates find its participant record through the
      replica's participant index. If the bootstrap leaves the reporter out of that
      index, its first status update fails. Running `AddParticipantStatusBT` after
      the bootstrap shows that the index holds it.
  - id: CBT-05-007
    priority: MUST
    kind: project
    verification: >-
      `test/core/use_cases/received/case/test_helpers.py::test_reporter_participant_stored_at_accepted_when_inline`
      asserts the reporter's participant record is stored at `RM.ACCEPTED` after
      bootstrap.
    stories:
    - story_2022_088
    - story_2022_038
    statement: >-
      Tests MUST verify that the bootstrap stores the reporter's participant record
      at `RM.ACCEPTED` (CBT-01-008).
    rationale: >-
      `RM.ACCEPTED` is the only RM state a reporter can be in when it reports
      (CBT-01-008). If the bootstrap stored another state, the reporter's later RM
      transitions would start from the wrong state, and a normal run would show no
      error.
  - id: CBT-05-008
    priority: MUST
    kind: protocol
    statement: >-
      When a receiver processes a bootstrap `Create(VulnerabilityCase)` and
      finds that required participant data is absent (in violation of
      CBT-01-007), the receiver MUST reject the bootstrap as a protocol error.
      The receiver MUST NOT silently skip the missing participant, infer
      participant state from domain knowledge, or synthesize a participant
      record from information not present in the bootstrap payload.
    rationale: >-
      Silent reconstruction of missing protocol data masks protocol bugs.
      This system exists to demonstrate that the CVD protocol works correctly
      end-to-end; when the protocol fails to deliver required data, that
      failure MUST be visible so it can be diagnosed and fixed. A fallback
      that fills in missing data "from domain knowledge" creates a false
      impression that the protocol is functioning when it is not. Replicas
      MUST be built exclusively from ledger content; if data is not in the
      ledger, it did not happen.
    verification: >-
      Tests confirm that when a bootstrap `Create(VulnerabilityCase)` arrives
      with a participant this receiver cannot read from the payload (a bare
      URI string, which CBT-05-009 treats as absent), the handler returns
      `HandlerResult.refused` with a reason citing CBT-05-008, which the inbox
      records as rejected, and does not accept the bootstrap. The validation
      step runs before any DataLayer writes so bootstrap is atomic: either the
      full payload is valid and committed, or nothing is written.
    relationships:
    - rel_type: implements
      spec_id: CBT-01-007
    - rel_type: implements
      spec_id: CBT-01-008
    lint_suppress:
    - missing_story_reference
  - id: CBT-05-009
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST treat a participant that arrives in a bootstrap
      `Create(VulnerabilityCase)` as a bare URI reference as absent, and so
      MUST reject the bootstrap under CBT-05-008.
    rationale: >-
      CBT-05-008 states only what other participants observe; this item states
      how this codebase meets it (MS-12-010). This codebase fetches only the
      objects the note on AKM-05-007 lists, and a bootstrap participant is not
      one of them, so it cannot read a participant record named only by URI.
      Refusing it is a shortcut of this prototype reference implementation, not
      a protocol rule: an implementation that fetches the reference has the
      participant data and need not refuse it.
    verification: >-
      `test/core/use_cases/received/case/test_helpers.py::test_bootstrap_bare_uri_participant_is_refused`
      confirms a bootstrap with a bare-URI participant is refused with a reason
      citing CBT-05-008 before any DataLayer write.
    relationships:
    - rel_type: implements
      spec_id: CBT-05-008
- id: CBT-06
  title: One Report Offered to Several Recipients
  specs:
  - id: CBT-06-001
    priority: MUST
    kind: protocol
    statement: >-
      Each `Offer(VulnerabilityReport)` a reporter sends MUST address exactly
      one recipient and MUST carry an activity id distinct from every other
      `Offer` of the same report, so that each submission attempt is
      identified by at least the pair (report, recipient).
    rationale: >-
      A reporter that gets no answer from its first recipient routinely offers
      the same report to a Coordinator, and either recipient may then accept
      and create its own case. The protocol permits this on purpose. The two
      attempts, and the cases that follow from them, are only distinguishable
      if each `Offer` names one recipient and has its own id.
    verification: >-
      Unit tests confirm that two `Offer(VulnerabilityReport)` activities built
      for the same report and different recipients each carry a single-element
      `to` naming their own recipient and have distinct ids.
    relationships:
    - rel_type: refines
      spec_id: HP-09-001
    stories:
    - story_2022_038
    - story_2022_088
  - id: CBT-06-002
    priority: MUST
    kind: protocol
    statement: >-
      A reporter that has offered one report to several recipients MUST accept
      a valid bootstrap `Create(VulnerabilityCase)` from each of them, checking
      each bootstrap (CBT-01-005) against the recipient that sent it and
      recording the resulting case and CASE_MANAGER for that recipient alone.
      Offering the report to a further recipient, or accepting one recipient's
      bootstrap, MUST NOT change whether another recipient's bootstrap is
      accepted or which case is recorded for it.
    rationale: >-
      A reporter often offers an unanswered report again to a Coordinator, and
      either recipient may then start a case. A reporter that trusts only one
      sender per report refuses the bootstrap from the second recipient and cannot
      join that case. How the reporter stores trust for each recipient is an
      implementation choice. This requirement controls only which bootstraps it
      accepts.
    verification: >-
      Unit tests confirm that after one report is offered to two recipients, a
      valid bootstrap from each recipient is accepted and seeds that
      recipient's case, in either order, without affecting the other.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-006
    - rel_type: depends_on
      spec_id: CBT-01-005
    stories:
    - story_2022_096
    - story_2022_104
