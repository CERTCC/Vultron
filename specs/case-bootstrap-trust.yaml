id: CBT
title: Case Bootstrap Trust
description: Requirements for establishing trust in a VulnerabilityCase and its CaseActor at non-owner sites. Governs the
  bootstrap process by which a non-owner participant verifies that an incoming case and its managing actor are legitimate
  before accepting case state updates.
version: 1.0.0
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: CBT-01
  title: Original Report-Submission Bootstrap
  specs:
  - id: CBT-01-001
    priority: MUST
    kind: protocol
    statement: When an actor creates a case in response to an inbound `Offer(VulnerabilityReport)`, that case creator MUST
      establish trust at the original report submitter by sending a one-time `Create(VulnerabilityCase)` activity.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that when a case is created
      in response to an `Offer(VulnerabilityReport)`, a `Create(VulnerabilityCase)` is dispatched to the original report
      submitter's inbox.
    relationships:
    - rel_type: refines
      spec_id: CM-12-001
    - rel_type: refines
      spec_id: PCR-02-005
    lint_suppress:
    - missing_story_reference
  - id: CBT-01-002
    priority: MUST
    kind: protocol
    statement: The bootstrap `Create(VulnerabilityCase)` activity MUST carry a full inline `VulnerabilityCase` snapshot rather
      than a minimal stub or partial trust-only payload.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that the bootstrap
      `Create(VulnerabilityCase)` carries a fully materialized `VulnerabilityCase` object rather than a stub or bare URI
      reference in its payload.
    relationships:
    - rel_type: implements
      spec_id: AKM-03-001
    lint_suppress:
    - missing_story_reference
  - id: CBT-01-003
    priority: MUST
    kind: protocol
    statement: The bootstrap case snapshot MUST identify the case creator/owner as a participant with `CASE_OWNER` role and
      MUST identify the CaseActor as a participant with `COORDINATOR` role.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that the bootstrap
      `VulnerabilityCase` snapshot includes a participant with `CASE_OWNER` role for the case creator and a participant
      with `COORDINATOR` role for the CaseActor.
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    - rel_type: refines
      spec_id: CM-02-010
    lint_suppress:
    - missing_story_reference
  - id: CBT-01-004
    priority: MUST
    kind: protocol
    statement: When the original report submitter is intended to receive ongoing case updates immediately, the bootstrap case
      snapshot MUST include that actor as a participant from the start.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that the original report
      submitter appears as an inline participant in `case_participants` of the bootstrap `Create(VulnerabilityCase)` when
      ongoing case updates are expected from the start.
    lint_suppress:
    - missing_story_reference
  - id: CBT-01-005
    priority: MUST
    kind: protocol
    statement: A report submitter MUST NOT trust a newly introduced CaseActor unless the bootstrap `Create(VulnerabilityCase)`
      both comes from the same actor that received the report and references the previously submitted report.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that a
      `Create(VulnerabilityCase)` from an unexpected sender or without a matching report reference is rejected and does
      not establish CaseActor trust.
    relationships:
    - rel_type: refines
      spec_id: PCR-05-001
    - rel_type: refines
      spec_id: AKM-02-001
    lint_suppress:
    - missing_story_reference
  - id: CBT-01-006
    priority: MUST
    kind: protocol
    statement: After validating the bootstrap `Create(VulnerabilityCase)`, the receiving actor MUST persist the report-to-case
      link, the trusted case-creator identity, and the trusted CaseActor identity for that relationship.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that after a valid bootstrap
      `Create(VulnerabilityCase)`, the receiver's DataLayer contains the report-to-case link, the trusted case-creator
      identity, and the trusted CaseActor identity for that relationship.
    relationships:
    - rel_type: refines
      spec_id: PCR-05-001
    lint_suppress:
    - missing_story_reference
  - id: CBT-01-007
    priority: MUST
    kind: protocol
    statement: All nested domain objects in the bootstrap `Create(VulnerabilityCase)` payload (e.g., `CaseParticipant` objects
      in `case_participants`) MUST be embedded as full inline objects; bare URI string references MUST NOT be used for nested
      objects in this activity.
    rationale: Receiving handlers store nested objects by iterating the embedded collection and persisting each object individually
      to the local DataLayer. ActivityStreamRef allows bare URI strings, so Pydantic accepts the field without error — but
      handlers only persist non-string entries (materialized objects). Bare URI strings are silently skipped; the receiver
      cannot seed CaseParticipant records from string-only refs, causing downstream BT failures (e.g., `CheckParticipantExists`
      returns FAILURE for a participant the receiver was never told about).
    verification: Inspection of `vultron/wire/as2/vocab/` confirms that `ActivityStreamRef` fields accept bare URI strings
      without error; integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that `CaseParticipant`
      objects are serialized as full inline objects in the bootstrap payload so the receiver can persist each participant
      record.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-002
    lint_suppress:
    - missing_story_reference
- id: CBT-02
  title: Post-Bootstrap Update Authority
  specs:
  - id: CBT-02-001
    priority: MUST
    kind: protocol
    statement: For the original report-submission path, `Create(VulnerabilityCase)` is a one-time bootstrap message only;
      subsequent full-case synchronization MUST use `Announce(VulnerabilityCase)` from the trusted CaseActor.
    verification: Integration tests in `test/demo/test_pcr_bootstrap.py` confirm that after the initial bootstrap
      exchange, full-case synchronization uses `Announce(VulnerabilityCase)` from the trusted CaseActor and that a second
      `Create(VulnerabilityCase)` is not issued.
    relationships:
    - rel_type: refines
      spec_id: PCR-02-001
    - rel_type: refines
      spec_id: PCR-03-001
    lint_suppress:
    - missing_story_reference
  - id: CBT-02-002
    priority: MUST_NOT
    kind: protocol
    statement: Transport authentication or encrypted direct messaging alone MUST NOT be treated as establishing authority to
      trust a previously unknown CaseActor; the explicit bootstrap trust handoff is required.
    relationships:
    - rel_type: refines
      spec_id: AKM-01-002
  - id: CBT-02-003
    priority: MUST
    kind: protocol
    statement: Once a CaseActor has been trusted for a case, that identity MUST NOT be replaced implicitly by ordinary case-update
      traffic; CaseActor rotation or transfer MUST use an explicit transfer workflow.
    verification: Inspection of `vultron/wire/as2/` confirms that CaseActor identity is stored at bootstrap time and is
      not overwritten by ordinary `Announce(VulnerabilityCase)` traffic; only an explicit transfer workflow may replace
      the trusted CaseActor.
    relationships:
    - rel_type: refines
      spec_id: CM-02-010
    lint_suppress:
    - missing_story_reference
- id: CBT-03
  title: Out-of-Order Handling and Replay Requests
  specs:
  - id: CBT-03-001
    priority: SHOULD
    kind: protocol
    statement: If a CaseActor-originated case message arrives before the required bootstrap trust handoff, the receiving actor
      SHOULD queue it only for a short bounded interval rather than accepting or permanently trusting it immediately. The
      default queue expiry interval is 300 seconds (configurable via `AppConfig.pre_bootstrap_queue_timeout_seconds`).
    relationships:
    - rel_type: refines
      spec_id: PCR-06-002
  - id: CBT-03-002
    priority: MUST_NOT
    kind: protocol
    statement: A pre-bootstrap CaseActor message MUST NOT update local case state before the corresponding trust-establishing
      bootstrap message has been validated.
    relationships:
    - rel_type: refines
      spec_id: PCR-06-003
  - id: CBT-03-003
    priority: MUST
    kind: protocol
    statement: 'When the bounded pre-bootstrap queue expires (default: 300 seconds, configurable via `AppConfig.pre_bootstrap_queue_timeout_seconds`),
      the receiver MUST drop the queued message, log a warning, and require a resend after bootstrap.'
    verification: A unit test confirms that when the pre-bootstrap queue timeout (`AppConfig.pre_bootstrap_queue_timeout_seconds`)
      elapses, the queued message is discarded, a warning is logged, and the activity is not applied to local case state.
    lint_suppress:
    - missing_story_reference
  - id: CBT-03-004
    priority: SHOULD
    kind: project
    statement: When bootstrap has not arrived in time, the receiver SHOULD request a replay from the original report receiver
      / case creator by sending an `as_Question` activity (`vultron.wire.as2.vocab.base.objects.activities.intransitive.as_Question`)
      asking for the bootstrap `Create(VulnerabilityCase)` to be resent. The `target` of the `as_Question` SHOULD be set to
      the `case_actor_id` recorded on the `VultronPendingCaseInbox` entry.
- id: CBT-04
  title: Late-Joiner Bootstrap
  specs:
  - id: CBT-04-001
    priority: MUST
    kind: protocol
    statement: For a participant added after case creation, the trust-establishing message MUST be `InviteActorToCase` from
      the case creator/owner rather than `Create(VulnerabilityCase)`.
    verification: Integration tests in `test/demo/test_invite_actor_demo.py` confirm that a participant added after case
      creation receives an `InviteActorToCase` message rather than a `Create(VulnerabilityCase)` to establish trust.
    relationships:
    - rel_type: refines
      spec_id: CM-11-001
    lint_suppress:
    - missing_story_reference
  - id: CBT-04-002
    priority: MUST
    kind: protocol
    statement: The trust-establishing invite for a late joiner MUST identify both the case and the CaseActor that will send
      subsequent `Announce(VulnerabilityCase)` updates.
    verification: Integration tests in `test/demo/test_invite_actor_demo.py` confirm that the `InviteActorToCase` payload
      includes both the case identifier and the CaseActor that will subsequently send `Announce(VulnerabilityCase)`
      updates.
    lint_suppress:
    - missing_story_reference
  - id: CBT-04-003
    priority: MUST
    kind: protocol
    statement: After the late joiner has validated and accepted that invitation, the CaseActor MAY send `Announce(VulnerabilityCase)`
      without a separate `Create(VulnerabilityCase)` bootstrap.
    verification: Integration tests in `test/demo/test_invite_actor_demo.py` confirm that after a late joiner accepts
      `InviteActorToCase`, it correctly processes `Announce(VulnerabilityCase)` from the CaseActor without an intermediate
      `Create(VulnerabilityCase)` bootstrap.
    relationships:
    - rel_type: refines
      spec_id: PCR-07-007
    lint_suppress:
    - missing_story_reference
- id: CBT-05
  title: Verification
  specs:
  - id: CBT-05-001
    priority: MUST
    kind: protocol
    statement: Tests MUST verify that the original report submitter accepts CaseActor-originated `Announce(VulnerabilityCase)`
      updates only after a valid creator-signed bootstrap `Create(VulnerabilityCase)` has established trust.
    verification: Integration tests in `test/demo/test_pcr_bootstrap.py` confirm that an `Announce(VulnerabilityCase)`
      from the CaseActor is accepted by the report submitter only after a valid `Create(VulnerabilityCase)` bootstrap has
      established trust.
    lint_suppress:
    - missing_story_reference
  - id: CBT-05-002
    priority: MUST
    kind: protocol
    statement: Tests MUST verify that a bootstrap `Create(VulnerabilityCase)` is rejected when the sender does not match the
      actor that received the report or when the case does not reference the known submitted report.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that a
      `Create(VulnerabilityCase)` is rejected when its sender mismatches the actor that received the report or when it
      does not reference the known submitted report.
    lint_suppress:
    - missing_story_reference
  - id: CBT-05-003
    priority: MUST
    kind: protocol
    statement: Tests MUST verify that pre-bootstrap CaseActor messages remain unapplied, expire safely, and lead to a replay
      request to the case creator.
    verification: Integration tests in `test/demo/test_pcr_bootstrap.py` confirm that pre-bootstrap CaseActor messages
      remain unapplied, that the pre-bootstrap queue expiry is handled safely, and that expiry triggers a replay request
      to the case creator.
    lint_suppress:
    - missing_story_reference
  - id: CBT-05-004
    priority: MUST
    kind: protocol
    statement: Tests MUST verify that late joiners establish trust through `InviteActorToCase` and may then accept CaseActor-originated
      `Announce(VulnerabilityCase)` updates without an intermediate `Create(VulnerabilityCase)` bootstrap.
    verification: Integration tests in `test/demo/test_invite_actor_demo.py` confirm that late joiners establish trust
      through `InviteActorToCase` and subsequently accept `Announce(VulnerabilityCase)` updates without a
      `Create(VulnerabilityCase)` bootstrap.
    lint_suppress:
    - missing_story_reference
  - id: CBT-05-005
    priority: MUST
    kind: protocol
    lint_suppress:
    - must_without_verification
    - missing_story_reference
    statement: >-
      Tests MUST verify that a valid bootstrap `Create(VulnerabilityCase)` causes the
      reporter's participant status record to be stored as an embedded participant in the
      new case, making the reporter addressable without a separate `InviteActorToCase`.
  - id: CBT-05-006
    priority: MUST
    kind: protocol
    lint_suppress:
    - must_without_verification
    - missing_story_reference
    statement: >-
      Tests MUST verify that `AddParticipantStatusBT` executes successfully on the
      reporter's replica after bootstrap, confirming the reporter appears in the
      CaseActor's participant index.
  - id: CBT-05-007
    priority: MUST
    kind: protocol
    lint_suppress:
    - must_without_verification
    - missing_story_reference
    statement: >-
      Tests MUST verify that the reporter's RM state is advanced from `RM.START` to
      `RM.ACCEPTED` as part of the bootstrap sequence, confirming full case-management
      relationship establishment.
