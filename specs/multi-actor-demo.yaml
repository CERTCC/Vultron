id: DEMOMA
title: Multi-Actor Demo
description: >-
  Requirements for multi-actor demo scenarios, Docker Compose orchestration, actor isolation,
  acceptance testing, and reproducibility. Includes per-scenario required
  semantic-type lists for the case-ledger invariant harness.
scope:

- prototype
- production
tags:
- demo
groups:
- id: DEMOMA-00
  title: Cross-Actor Communication
  specs:
  - id: DEMOMA-00-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Cross-actor communication MUST occur exclusively via HTTP using the ActivityStreams
      inbox endpoint
    rationale: >-
      A demo exists to show that the protocol works between separate actors. If actors
      exchange data by any path other than the HTTP inbox, the demo can pass while the
      delivery path that real deployments use is broken. HTTP delivery to the
      ActivityStreams inbox is the only path that a real peer has.
- id: DEMOMA-01
  title: Actor Isolation
  specs:
  - id: DEMOMA-01-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each actor in a multi-actor demo MUST run in a separate container with its own DataLayer
      instance
    rationale: >-
      Separate containers with separate DataLayers give each actor only the state that
      the protocol delivers to it. If two actors share a store, one actor can read the
      state of another actor directly. Then the demo can pass although the messages
      between them are missing or wrong.
  - id: DEMOMA-01-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each actor container MUST expose the actor's identity via its `/actors/{actor_id}` profile
      endpoint so that other containers can discover it at startup
    rationale: >-
      Other containers must find an actor before they can send to it. The profile
      endpoint is the standard way that an ActivityStreams peer learns the inbox and
      identity of an actor. Without it, each container must hard-code its peers, and a
      wrong address shows only as a failed delivery later in the run.
  - id: DEMOMA-01-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Demo startup MUST automatically reset all actor state to a known clean baseline before
      the scenario executes, without requiring manual user intervention
    rationale: >-
      State left from an earlier run can satisfy a check that the current run did not
      earn, or it can cause a failure that the current code did not cause. An
      automatic reset to a known baseline makes each run start from the same state, so
      that a result tells you about the current code. A manual step is easy to forget,
      and CI cannot do it.
  - id: DEMOMA-01-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each call to `create_app()` MUST create fresh per-app instances of the dispatcher,
      emitter, and DataLayer stored on `app.state`; `create_app()` MUST NOT mutate
      module-level singleton state such as `_DEFAULT_EMITTER_SLOT`, `_DISPATCHER_SLOT`, or
      `_shared_instance`
    rationale: >-
      When multiple Vultron actors are co-located in the same Python process (e.g., a
      report-receiver actor and its spawned Case Actor), each call to `create_app()` must
      produce a fully isolated application. If `create_app()` mutates module-level globals,
      the last lifespan to call `configure_default_emitter()` or `init_dispatcher()`
      silently overwrites all prior actors' state, causing cross-actor data leakage.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-01-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Co-located actors (multiple FastAPI app instances in the same process) MUST each have
      a dedicated `DataLayer` instance registered in their `app.dependency_overrides`; no
      two co-located apps in the same process MAY share a `DataLayer` instance
    rationale: >-
      Sharing a `DataLayer` instance across co-located actors bypasses the outbox → inbox
      delivery path: objects created by Actor A become immediately visible to Actor B
      without any delivery occurring. This makes integration tests unreliable and hides
      real cross-actor delivery bugs.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
- id: DEMOMA-02
  title: Container Orchestration
  specs:
  - id: DEMOMA-02-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Docker Compose configurations for multi-actor demos MUST include a `healthcheck` for
      each actor service that probes the `/health/ready` endpoint
    rationale: >-
      A container can be running before its API can accept requests. A healthcheck on
      `/health/ready` lets Docker Compose know when each actor can receive messages.
      Without it, the first triggers of a scenario can fail for reasons that have
      nothing to do with the protocol.
    relationships:
    - rel_type: refines
      spec_id: IMPLTS-05-002
      note: tech-stack.md
    - rel_type: depends_on
      spec_id: OB-05-002
      note: observability.md
  - id: DEMOMA-02-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Dependent services (e.g., a demo orchestration container) MUST use `condition: service_healthy`
      for all actor service dependencies
    rationale: >-
      A `depends_on` entry without `condition: service_healthy` waits only for the
      container to start, not for the actor to be ready. The demo runner can then send
      its first request to an actor that cannot answer it. The condition uses the
      healthcheck (DEMOMA-02-001) to hold the runner until every actor is ready.
  - id: DEMOMA-02-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Port mappings, network names, and required environment variables MUST be documented
      in the `docker-compose.yml` file or an accompanying `README.md`
    rationale: >-
      A developer who runs or debugs a demo must know which port reaches which actor
      and which variables configure it. If this information is only in the code, each
      person must find it again, and a wrong value gives a failure that is hard to
      diagnose. A record next to the Compose configuration keeps it in one known
      place.
- id: DEMOMA-03
  title: Acceptance Tests
  specs:
  - id: DEMOMA-03-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each multi-actor demo scenario MUST include an acceptance test that validates the end-to-end
      workflow deterministically
    rationale: >-
      A scenario script can run to the end without proof that the protocol did what
      the scenario claims. An acceptance test checks the result of the complete
      workflow. A deterministic test gives the same verdict for the same code, so a
      failure points to a defect and not to chance.
  - id: DEMOMA-03-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Acceptance tests MUST assert final state for each actor (e.g., correct RM/EM/CS state,
      expected case ledger entries)
    rationale: >-
      A run that ends without an error can still leave an actor in the wrong RM, EM or
      CS state, or with a ledger that is missing an entry. Checks on the final state
      of each actor find these defects. Checks on one actor only cannot find a replica
      that did not receive an update.
  - id: DEMOMA-03-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Acceptance tests MUST be reproducible: the same test on the same codebase MUST produce
      the same result on successive runs
    rationale: >-
      A test that passes on one run and fails on the next gives no information about
      the code. Developers then learn to ignore its failures, and a real defect can
      hide among them. A reproducible test lets a failure count as evidence.
- id: DEMOMA-04
  title: Scenario Coverage
  specs:
  - id: DEMOMA-04-002
    priority: SHOULD
    kind: project
    statement: >-
      Each scenario SHOULD include a summary of the expected CVD workflow steps and the expected
      final RM/EM/CS state for each actor
    rationale: >-
      A reader must know what the scenario is expected to do before the reader can
      judge whether a run is correct. A summary of the expected workflow steps and
      final states gives that reference. Without it, the script itself becomes the
      only description of the expected result, and a wrong script then looks correct.
- id: DEMOMA-05
  title: Demo Trigger Protocol
  specs:
  - id: DEMOMA-05-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      All actor-initiated actions in scenario demos MUST be driven through the trigger API
      (`POST /actors/{actor_id}/trigger/{behavior-name}`), not by direct inbox injection or
      other mechanisms that bypass the actor's own protocol logic
    rationale: >-
      Using trigger endpoints ensures that the demo exercises the same code paths that a real
      actor would use, including BT execution, outbox queuing, and downstream cascading behaviors.
      Direct inbox injection spoofs protocol messages and does not validate that the initiating
      actor's behavior is correctly implemented.
    relationships:
    - rel_type: depends_on
      spec_id: TRIG-01-001
      note: trigger endpoint format
  - id: DEMOMA-05-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2573'
    statement: >-
      Scenario demo scripts MUST NOT construct and POST raw ActivityStreams JSON directly
      to an actor's inbox as a substitute for calling that actor's trigger endpoint
    rationale: >-
      A demo script that posts raw ActivityStreams JSON to an inbox creates a message
      that the sending actor did not decide to send. Its behavior tree does not run,
      so the demo cannot find a defect in that logic. The trigger endpoint is the path
      on which the sending actor makes the decision itself (DEMOMA-05-001).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-00-001
  - id: DEMOMA-05-003
    priority: MAY
    kind: project
    statement: >-
      Exchange demos located under `vultron/demo/exchange/` MAY use direct inbox injection
      (constructing and posting raw ActivityStreams JSON) to simulate the receipt of a
      specific wire message. Scenario demos under `vultron/demo/scenario/` MUST NOT use
      direct inbox injection (DEMOMA-05-001 and DEMOMA-05-002 apply without exception to
      scenario demos).
    rationale: >-
      Exchange demos are low-level wire-format verification scripts that intentionally
      exercise the inbox parsing path directly. Scenario demos must exercise the full
      actor behavior including trigger dispatch; direct inbox injection in a scenario demo
      bypasses the triggering actor's BT execution and produces a scenario that does not
      test the protocol from end to end. This carve-out resolves the apparent contradiction
      between DEMOMA-05-001 (which would prohibit exchange demos) and the existing
      `vultron/demo/exchange/` code.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-05-001
  - id: DEMOMA-05-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2573'
    statement: >-
      Demo trigger endpoints and demo helper functions MUST NOT manipulate an actor's
      DataLayer directly (e.g., calling `add_participant_status` or equivalent) or write
      directly to an actor's outbox as a substitute for invoking a triggerable use case.
      Puppeteering an actor means calling a trigger endpoint that invokes the actor's own
      use case, which in turn emits the correct protocol message and awaits any required
      round-trip confirmation (e.g., a CaseActor ledger entry).
    rationale: >-
      Direct DataLayer writes bypass the protocol entirely: no ActivityStreams message is
      emitted, no CaseActor ledger round-trip occurs, and the actor's local state is never
      established through the protocol. This produces demos that appear to work but do not
      exercise the real protocol path. For example, a demo that stamps RM.CLOSED directly
      via `add_participant_status` gives the appearance that the participant left the case,
      but no `Leave(VulnerabilityCase)` message was ever sent or confirmed by the CaseActor.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-05-001
- id: DEMOMA-06
  title: rv Scenario Workflow
  trigger:
    type: scenario_start
    value: rv
  specs:
  - id: DEMOMA-06-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rv (Reporter + Vendor) demo scenario MUST execute a complete CVD lifecycle
      ending in final case state VFDPxa (Vendor aware, Fix ready, Fix Deployed, Public aware,
      no exploit public, no active attacks)
    rationale: >-
      The rv scenario is the smallest scenario that runs the complete CVD lifecycle
      between two parties. VFDPxa is the state in which the fix is ready and deployed
      and the public is aware. A run that ends in any other state has not completed
      the lifecycle that this scenario exists to show.
  - id: DEMOMA-06-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rv scenario script MUST verify the following protocol checkpoints in order,
      checking both the Vendor and Reporter DataLayers at each checkpoint: (1) report
      received (RM.RECEIVED), (2) report validated (RM.VALID), (3) case engaged
      (RM.ACCEPTED), (4) embargo active (EM.ACTIVE), (5) fix ready (CS.VFd), (6) fix
      deployed (CS.VFD), (7) publicly disclosed (CS.VFDPxa).
    rationale: >-
      Each checkpoint is a protocol event on which the next events depend. A check on
      the final state alone cannot show which step failed. A check on one DataLayer
      alone cannot show whether the update reached the other actor. Ordered checks on
      both DataLayers find the first step that went wrong and the actor that did not
      get the update.
    preconditions:
    - description: Two-actor scenario executing; Vendor, Reporter, and CaseActor containers
        running and reachable; report submitted by Reporter to Vendor
    steps:
    - order: 1
      actor: demo-script
      action: >-
        Verify case creation: 3 participants (Vendor, Reporter, CaseActor) and EM.ACTIVE;
        check Vendor DataLayer
      expected: >-
        Vendor DataLayer holds VulnerabilityCase with 3 participants and
        EM state = ACTIVE
    - order: 2
      actor: demo-script
      action: >-
        Verify case replica sync: Reporter has case replica with matching participant index
        and active embargo; check Reporter DataLayer
      expected: >-
        Reporter DataLayer holds case replica; participant index matches Vendor's; embargo
        state = ACTIVE
    - order: 3
      actor: demo-script
      action: >-
        Verify notes exchange: check both DataLayers for question note and reply note
      expected: >-
        Question note and reply note both present in canonical case state on Vendor and
        Reporter replicas
    - order: 4
      actor: demo-script
      action: >-
        Verify fix-ready state: CS.VF on all replicas
      expected: Vendor and Reporter replicas both show CS = VF (vendor aware, fix ready)
    - order: 5
      actor: demo-script
      action: >-
        Verify fix-deployed state: CS.VFD on all replicas
      expected: Vendor and Reporter replicas both show CS = VFD (fix deployed)
    - order: 6
      actor: demo-script
      action: >-
        Verify public-disclosure state: CS.VFDPxa and EM terminated on all replicas
      expected: All replicas show CS = VFDPxa; EM state = EXITED
    - order: 7
      actor: demo-script
      action: >-
        Verify case close: all participants RM.CLOSED and case closed
      expected: >-
        All participants RM state = CLOSED in the CASE_MANAGER's store; case
        record marked closed; each participant's replica ends at the entries
        recording its own closure (CM-23-004)
    postconditions:
    - description: >-
        All checkpoints verified; rv scenario complete in final state VFDPxa
        with EM.EXITED and all participants RM.CLOSED
  - id: DEMOMA-06-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Milestone verification MUST read both the Vendor DataLayer and the Reporter DataLayer
      directly; direct DataLayer reads are acceptable in demo scripts for verification
      (read-only assertions), but MUST NOT be used to write or manipulate actor state
    rationale: >-
      A demo must observe the state of an actor to verify it, and a direct read does
      not change what the protocol did. A write is different. It puts state into an
      actor that the protocol did not put there, and the demo can then pass although
      the protocol failed (DEMOMA-05-004).
  - id: DEMOMA-06-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rv demo Docker topology MUST use a dedicated case-actor container with its
      own isolated DataLayer; the Vendor MUST route case-actor creation to that container
      using the pre-configured `case_actor_service_url` from `ActorConfig`, not derive
      the case-actor URL from `server_base_url` (per CP-08-001 through CP-08-003).
    rationale: >-
      Routing case-actor creation to its own container satisfies DEMOMA-01-001 (each
      actor in its own container) and exercises the CaseProposal protocol (ADR-0023) in
      the rv scenario. The case setup nodes read `case_actor_service_url` from
      `ActorConfig` through `case_actor_identity()`, so the Vendor container must supply
      `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL` pointing to the dedicated CaseActor
      container (CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: CP-08-001
    adr:
    - ADR-0023
  - id: DEMOMA-06-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rv demo MUST verify that the case-actor container's DataLayer holds the
      canonical case ledger after the demo completes; the demo script MUST dump the
      case-actor's ledger from the dedicated case-actor container, not from the vendor
      container's co-located sub-actor
    rationale: >-
      The dedicated case-actor container holds the canonical case and ledger
      (DEMOMA-06-004). A ledger read from another container can be a replica or an old
      local copy. A check on that ledger can pass although the canonical ledger is
      wrong or empty.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-06-004
  - id: DEMOMA-06-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Before a demo script calls `verify_fix_ready`, `verify_fix_deployed` or
      `verify_publicly_disclosed`, it MUST poll for the checked state on every container
      that the helper asserts against. This includes the receiver container. The polling
      waits are `wait_for_participant_vf_state` and `wait_for_participant_d_state`.
      Using a polling wait only on the reporter container and then immediately asserting
      on the receiver container with a single-shot check is not permitted.
    rationale: >-
      A demo step must wait for its cause, not for a fixed time or a fixed order
      (ADR-0058). A VFD change reaches each container through
      `Announce(CaseLedgerEntry)`, at a time that nobody can predict. `verify_fix_ready`
      and `verify_fix_deployed` check each container once and do not retry. Thus a check
      on a container that has not yet received the change fails, although the protocol
      is correct. A wait on every container that the helper checks makes the check
      depend on the change, not on timing.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-06-002
    - rel_type: refines
      spec_id: DEMOMA-15-001
- id: DEMOMA-07
  title: ParticipantStatus Trigger Pattern
  specs:
  - id: DEMOMA-07-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      CS state transitions (fix-ready, fix-deployed, published) MUST be driven through
      participant status updates via Add(ParticipantStatus, target=Case) sent to the Case
      Actor inbox, not through dedicated low-level state-machine endpoints.
      RM case closure is explicitly excluded from this requirement: RM.CLOSED MUST be
      reached via the Leave(VulnerabilityCase) round-trip (CM-23-001), not via
      Add(ParticipantStatus, rmState=CLOSED).
    rationale: >-
      CS transitions are participant facts, so they travel as `Add(ParticipantStatus)`
      to the CASE_MANAGER, which commits them to the case ledger. A dedicated
      state-machine endpoint would change state with no message and no ledger entry. RM
      closure is different: the participant leaves the case. The
      Leave(VulnerabilityCase) round-trip makes the CASE_MANAGER the authority for that
      departure, so a participant cannot be closed on its own replica while its peers
      never learn of it (ADR-0050).
    adr:
    - ADR-0050
    relationships:
    - rel_type: implements
      spec_id: CM-23-001
  - id: DEMOMA-07-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Demo trigger endpoints for participant status transitions MUST use the "notify" naming
      convention (e.g., notify-fix-ready, notify-fix-deployed, notify-published)
      to avoid semantic collision with the ActivityStreams Announce verb
    rationale: >-
      `Announce` is an ActivityStreams verb that the protocol uses for case
      replication. A trigger named `announce-fix-ready` would suggest that the trigger
      sends an `Announce` activity, but it sends `Add(ParticipantStatus)`. The
      `notify` names describe what the actor does without that confusion.
  - id: DEMOMA-07-003
    priority: MUST
    kind: project
    statement: >-
      The Case Actor received handler for ADD_PARTICIPANT_STATUS_TO_PARTICIPANT MUST
      implement the following ordered steps as a BT Sequence:
      (1) verify the activity actor is a known case participant (precondition guard),
      (2) update the participant status record,
      (3) propagate the update to the other case participants that receive case content
      (CM-10-004, CM-23-004) via Announce(CaseLedgerEntry) fan-out (per ADR-0019 and
      SYNC-02-002) — NOT via a direct raw Add(ParticipantStatus) re-broadcast,
      (4) if CS.P is newly set by the Case Owner, trigger embargo teardown automatically,
      (5) if all participants are RM.CLOSED, close the case automatically.
      Each step MUST be implemented as a distinct BT node or subtree so that the protocol
      logic is visible in the tree structure and not hidden inside node update() methods.
    rationale: >-
      The CASE_MANAGER must check the sender before it changes a record, and it must
      commit the change before it tells other participants about it. A BT Sequence
      makes this order part of the tree structure. A step hidden inside one node's
      `update()` method cannot be seen or tested on its own, and it can be skipped or
      reordered without notice.
    verification: >-
      Unit tests on the received tree confirm the status entry is committed and fanned
      out as Announce(CaseLedgerEntry) with no raw Add(ParticipantStatus)
      re-broadcast.  Unit tests on the shared recipient selection
      (`test/core/participants/test_recipients.py`) and the fan-out
      (`test/core/behaviors/sync/nodes/test_fanout_embargo_gate.py`) confirm the
      fan-out skips a participant at RM.CLOSED except for an entry recording its own
      closure (CM-23-004); the demo closure check verifies every participant's
      RM.CLOSED in the CASE_MANAGER's store, not on every replica.
    testable: true
    trigger:
      type: message_received
      value: ADD_PARTICIPANT_STATUS_TO_PARTICIPANT
    preconditions:
    - description: Receiving actor is CASE_MANAGER (Case Actor)
    - description: Inbound activity actor is a known case participant
    steps:
    - order: 1
      actor: case_actor
      action: Verify inbound activity actor is a known case participant
      expected: >-
        Actor found in case.actor_participant_index; FAILURE if unknown sender
    - order: 2
      actor: case_actor
      action: Append ParticipantStatus to the participant record
      expected: Participant's latest status reflects the newly received state
    - order: 3
      actor: case_actor
      action: >-
        Commit a canonical CaseLedgerEntry and fan-out Announce(CaseLedgerEntry)
        to the case's content recipients (CM-10-004, CM-23-004)
      expected: >-
        Every active peer not at RM.CLOSED receives the status update via the
        canonical log path (ADR-0019, SYNC-02-002), and so does a closed
        participant the entry records the closure of; no other closed
        participant receives it, and no raw Add(ParticipantStatus) re-broadcast
        is emitted
    - order: 4
      actor: case_actor
      action: >-
        If the new CaseStatus (derived from the participant status update) indicates
        at least one of CS.P, CS.X, or CS.A and an active embargo exists, trigger
        embargo teardown automatically via ThreatTerminationBranchNode (RSH-03-001).
        The teardown runs in the act that adopts the value, with no separate
        teardown gate: the adoption also authorizes it (RSH-07-001, ADR-0166).
        The teardown fires for any adopted participant's CS.P/X/A, not only the
        Case Owner's. See ThreatTerminationBranchNode (RSH-03-002: no
        sender-role gate) and ADR-0046.
      expected: >-
        Embargo teardown triggered (EM.EXITED) when any participant's CaseStatus
        carries CS.P, CS.X, or CS.A and an active embargo is present
    - order: 5
      actor: case_actor
      action: >-
        **SUPERSEDED** This step previously described an all-participants-RM.CLOSED
        check that emitted Leave(VulnerabilityCase) from the Case Actor to trigger
        case closure.  This step is retired: RM case closure now flows through each
        participant's own Leave(VulnerabilityCase) round-trip (CM-23-001).
        The owner-Leave path (CM-23-002) replaces this step; when the Case Owner
        sends Leave(VulnerabilityCase), the Case Actor closes the case and
        advances the CaseActor participant to RM.CLOSED (CM-23-004, ADR-0051).
        Implementation: see #1901.
      expected: >-
        **SUPERSEDED** No AutoCloseSequence fires in add_participant_status_tree.
        Case closure is triggered by Leave(VulnerabilityCase) from the Case Owner.
    postconditions:
    - description: >-
        Participant record updated; CaseLedgerEntry committed and broadcast;
        embargo teardown triggered when any participant's CaseStatus carries
        CS.P, CS.X, or CS.A and an active embargo exists.
    relationships:
    - rel_type: refines
      spec_id: SYNC-02-002
      note: step 3 propagation must use canonical Announce(CaseLedgerEntry) fan-out
  - id: DEMOMA-07-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      **SUPERSEDED by CM-23-001 and ADR-0050**  The BT node decomposition
      requirements for DEMOMA-07-003 step 5 (AllParticipantsRMClosedConditionNode,
      CloseNotYetEmittedConditionNode, EmitCloseCaseNode) are retired from the
      add_participant_status_tree path.  Those nodes MUST NOT be wired into
      add_participant_status_tree; they were live dead code after PR #1909 because
      the AutoCloseSequence evaluated AllParticipantsRMClosedConditionNode only
      when Add(ParticipantStatus) arrived, which always precedes any Leave and
      therefore could never observe all participants at RM.CLOSED.
      The equivalent closure logic belongs in the Leave(VulnerabilityCase) receive
      path, implemented by #1901 (CM-23-002, CM-23-003, ADR-0051).
    rationale: >-
      These nodes check whether all participants are at RM.CLOSED when an
      `Add(ParticipantStatus)` arrives. On that path the check cannot be true, because
      the status update always arrives before any Leave. Nodes that can never fire
      make the tree look as if it closes cases when it does not. Case closure belongs
      to the Leave(VulnerabilityCase) receive path (CM-23-002).
    testable: true
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-07-003
      note: >-
        Step 5 is superseded; AutoCloseSequence removed from add_participant_status_tree
  - id: DEMOMA-07-004
    priority: SHOULD
    kind: project
    statement: >-
      The participant status trigger implementation SHOULD be layered: SvcAddObjectToCaseUseCase
      (generic Add(object, target=Case)) as the base, SvcAddParticipantStatusUseCase (new core
      use case) above it, and demo-specific endpoints in demo_triggers.py at the top
    rationale: >-
      Each layer adds one thing: the generic case use case adds an object to a case, the
      status use case adds the participant status rules, and the demo endpoint adds only
      the HTTP route for the demo. Code in one layer can then be reused by the layer
      above it, and the demo endpoints do not repeat the protocol logic.
  - id: DEMOMA-07-005
    priority: MUST_NOT
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Case Actor received handler for ADD_PARTICIPANT_STATUS_TO_PARTICIPANT MUST NOT
      send a raw Add(ParticipantStatus) re-broadcast directly to peer participants after
      updating the local participant record. Announce(CaseLedgerEntry) fan-out is the sole
      canonical propagation path for status updates to peers (DEMOMA-07-003 step 3); a
      parallel raw re-broadcast causes every peer to receive and process the same status
      update twice — once as a raw Add(ParticipantStatus) and once wrapped in
      Announce(CaseLedgerEntry) — producing duplicate state transitions and non-canonical
      messages in peer inboxes. This artefact is superseded by ADR-0019.
    rationale: >-
      Each status update must reach a peer once, through the case ledger. A second raw
      `Add(ParticipantStatus)` gives the peer the same update twice, by two paths, and
      only one of them is a canonical ledger entry. The peer can then apply the change
      twice or hold a message that does not match its ledger.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-07-003
      note: prohibits the pre-SYNC raw re-broadcast artefact superseded by ADR-0019
    - rel_type: refines
      spec_id: SYNC-02-002
      note: Announce(CaseLedgerEntry) is the sole canonical propagation path for status updates
- id: DEMOMA-08
  title: Case Actor Bootstrap and CASE_MANAGER Role
  specs:
  - id: DEMOMA-08-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The vendor MUST send Create(VulnerabilityCase) (not Announce) to the Reporter as the
      trust bootstrap after case initialization; only the Case Actor uses Announce for
      subsequent case updates.
    rationale: >-
      The Reporter does not yet know the Case Actor, but it trusts the vendor to which
      it sent the report. A `Create(VulnerabilityCase)` from the vendor carries that
      trust to the case and to its CASE_MANAGER (CBT-01-001). After that, the Reporter
      can accept `Announce` messages from the Case Actor, which it would otherwise
      reject as messages from an unknown sender.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-001
      note: original report submission path bootstrap
  - id: DEMOMA-08-003
    priority: MUST_NOT
    kind: project
    verification_debt: '#2573'
    statement: >-
      CASE_MANAGER role delegation MUST NOT reuse or adapt the existing
      OFFER_CASE_OWNERSHIP_TRANSFER, ACCEPT_CASE_OWNERSHIP_TRANSFER, or
      REJECT_CASE_OWNERSHIP_TRANSFER message semantics; these are distinct protocol operations
      with different semantics and different effects on case ownership
    rationale: >-
      An ownership transfer changes who is the Case Owner. A CASE_MANAGER delegation
      does not change the Case Owner. If delegation used the ownership-transfer
      messages, a receiver could not tell which change was meant, and it could apply
      an ownership change that nobody asked for.
  - id: DEMOMA-08-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      When the Case Actor accepts the CASE_MANAGER delegation, it MUST run the case
      initialization BT: establish the default embargo with both Vendor and Reporter
      immediately as signatories (no invite/accept round-trip), and set EM state to
      ACTIVE before the trust bootstrap is sent to the Reporter
    rationale: >-
      The Reporter consented to the default embargo of the Case Owner when it submitted
      the report (CM-14-005, EP-04-001), and the Vendor is that Case Owner. An invite
      and accept exchange for these two parties would record an invitation that did not
      occur. EM must be ACTIVE before the trust bootstrap, so that the Reporter
      receives a case that already has its embargo.
  - id: DEMOMA-08-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      All nested domain objects in the bootstrap `Create(VulnerabilityCase)` activity (e.g.,
      `CaseParticipant` objects in `case_participants`) MUST be embedded as full inline
      objects, not as bare URI string references
    rationale: >-
      Receiving handlers store nested objects by iterating the embedded collection and
      persisting each object individually. Bare URI string references cannot be deserialized
      to typed domain objects; the referenced objects are never written to the receiver's
      DataLayer. Downstream BT nodes (e.g., `SenderIsParticipantNode`) then fail because
      participant records are absent.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-007
  - id: DEMOMA-08-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The trust bootstrap payload MUST include all three participants (Vendor, Reporter,
      Case Actor) so the Reporter can bind the Case Actor identity to this case.
    rationale: >-
      Without all three participants embedded in the bootstrap payload, the Reporter
      cannot establish trust for the Case Actor and cannot route subsequent protocol
      messages correctly.
- id: DEMOMA-09
  title: RVV Scenario (Reporter → Vendor1 → Vendor2, no Coordinator)
  trigger:
    type: scenario_start
    value: rvv
  specs:
  - id: DEMOMA-09-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVV scenario MUST seed three independent actor containers — Reporter, Vendor1,
      and Vendor2 — with no Coordinator; each container MUST have its own isolated
      DataLayer.
    rationale: >-
      RVV is the scenario in which two vendors work on one case without a Coordinator.
      Each actor in its own container with its own DataLayer makes sure that the
      vendors exchange data only through the protocol (DEMOMA-01-001).
  - id: DEMOMA-09-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Vendor1 MUST invite Vendor2 to the case after accepting the report (RM→ACCEPTED),
      and Vendor2 MUST accept and become a full signatory participant before the
      scenario advances to fix tracking.
    rationale: >-
      Fix tracking for Vendor2 needs Vendor2 to be a participant that is bound by the
      embargo. If the scenario advances before Vendor2 accepts, the later status
      updates from Vendor2 are refused, or they come from a party that never agreed to
      the embargo.
    preconditions:
    - description: Vendor1 RM state = ACCEPTED; VulnerabilityCase created by the CaseActor
        on the dedicated case-actor container; Vendor2 container running
    steps:
    - order: 1
      actor: vendor1
      action: POST invite-actor-to-case trigger for Vendor2
      expected: >-
        CaseActor receives and queues Invite(Actor, VulnerabilityCaseStub) for Vendor2
    - order: 2
      actor: demo-script
      action: >-
        Poll Vendor2 DataLayer until Invite(Actor, VulnerabilityCaseStub) is visible
      expected: Invite activity present in Vendor2 DataLayer
    - order: 3
      actor: vendor2
      action: POST accept-case-invite trigger
      expected: >-
        Vendor2 joins the case and becomes a signatory (active); CaseActor seeds Vendor2
        case replica
    postconditions:
    - description: Vendor2 is a signatory participant with EM consent; Vendor2 holds a
        seeded case replica; scenario may advance to fix tracking
  - id: DEMOMA-09-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVV scenario MUST reach a final state of VFDPxa CS on all three actor replicas
      (Reporter, Vendor1, Vendor2), with EM.EXITED and RM.CLOSED for all participants;
      both Vendor1 and Vendor2 MUST each have their own Vendor Fix Path tracked
      independently
    rationale: >-
      Each vendor has its own fix path, so the case is complete only when each vendor
      has reached it on its own. If the scenario tracked one fix path for both
      vendors, a defect in the path of one vendor would be hidden by the progress of
      the other. The final state on all three replicas shows that each update reached
      every party.
  - id: DEMOMA-09-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVV scenario MUST run deterministically end-to-end via a single
      `docker compose` command using the existing multi-actor Compose stack; the
      scenario script MUST verify LedgerFanout replica convergence (both Reporter and Vendor2
      replicas match the authoritative Vendor1 state) after each major protocol event
    rationale: >-
      A single command makes the scenario easy to run in CI and on a developer
      machine. A convergence check after each major event finds the first event that
      did not reach a replica. A check only at the end can show that the replicas
      differ, but not when they became different.
  - id: DEMOMA-09-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The PR that introduces the RVV scenario script MUST also register it with the
      scenario registry (DEMOCI-11-001), so that its generated
      `.github/demo-scenarios.json` entry (DEMOCI-11-004) runs it as its own CI
      matrix job; that job MUST run concurrently with (not after) the rv
      job so that total CI wall-clock time does not grow linearly with scenario count
    rationale: >-
      A scenario that is not registered does not run in CI, so it can break without
      notice. A separate concurrent CI job keeps each scenario failure visible on its
      own. It also keeps the elapsed time of a CI run close to the time of the slowest
      scenario.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-03-004
  - id: DEMOMA-09-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Case Actor MUST run on the dedicated case-actor container in the RVV
      scenario, as in every multi-container scenario; Vendor1 proposes the case
      to it.
    rationale: >-
      RVV has no Coordinator, but the Case Actor is not a Coordinator. It is the
      CASE_MANAGER participant, and every actor container names the dedicated
      case-actor container as its `case_actor_service_url` (CP-08-003, CP-08-008,
      DEMOMA-06-004). The scenarios share one Compose stack, so RVV cannot keep the
      Case Actor in the Vendor1 container unless every other scenario does the same.
    relationships:
    - rel_type: refines
      spec_id: CP-08-008

- id: DEMOMA-10
  title: RVCV-Extension Scenario (Vendor1 keeps ownership; Coordinator suggests Vendor2)
  trigger:
    type: scenario_start
    value: rvcv-extension
  specs:
  - id: DEMOMA-10-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-extension scenario MUST involve four actor identities — Reporter, Vendor1,
      Coordinator, and Vendor2 — each with its own isolated DataLayer; the CaseActor
      MUST run as a separate actor identity with its own container and DataLayer, not
      co-located in the Vendor1 container.
    rationale: >-
      The RVCV-extension scenario needs four separate parties, and each must see only
      what the protocol delivers to it. A CaseActor in the Vendor1 container could
      share state with Vendor1 by a path that the protocol does not have. Then the
      demo could pass although the messages between them are missing.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-10-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Vendor1 MUST create the case (RM→ACCEPTED) and retain `CVDRole.CASE_OWNER`
      throughout the entire scenario. Ownership MUST NOT transfer to the Coordinator.
    rationale: >-
      This scenario demonstrates the "extension" variant: a vendor seeks facilitation
      help without surrendering case control, in contrast to the RVCV-handoff variant
      where ownership transfers.
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
  - id: DEMOMA-10-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Vendor1 MUST invite the Coordinator to the case and the Coordinator MUST accept
      and become a participant holding CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER.
    rationale: >-
      The Coordinator helps with the case but does not run it. CASE_MANAGER is the role
      that commits canonical case state, and in this scenario the CaseActor holds it. If
      the Coordinator also held CASE_MANAGER, two actors could commit case changes, and
      the scenario would then not show a Coordinator that helps without control.
    preconditions:
    - description: Vendor1 RM state = ACCEPTED; VulnerabilityCase created with CaseActor;
        Coordinator container running
    steps:
    - order: 1
      actor: vendor1
      action: POST invite-actor-to-case trigger targeting Coordinator
      expected: >-
        CaseActor queues Invite(Actor, VulnerabilityCaseStub) for Coordinator inbox
    - order: 2
      actor: demo-script
      action: >-
        Poll Coordinator DataLayer until Invite(Actor, VulnerabilityCaseStub) is visible
      expected: Invite activity present in Coordinator DataLayer
    - order: 3
      actor: coordinator
      action: POST accept-case-invite trigger
      expected: >-
        Coordinator joins the case (active) with CVDRole.COORDINATOR (not CASE_MANAGER);
        CaseActor seeds Coordinator case replica
    postconditions:
    - description: >-
        Coordinator is a participant with CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER;
        Coordinator holds a seeded case replica
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
  - id: DEMOMA-10-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Coordinator MUST suggest Vendor2 to the case and the CaseActor MUST
      transform the offer and forward it to Vendor1 for approval.
    rationale: >-
      A participant that is not the Case Owner cannot add a party to the case. It can
      only suggest one. The CASE_MANAGER changes the suggestion into an
      `Offer(CaseParticipant)` and sends it to the Case Owner, who decides. This step
      shows that a suggestion goes to the Case Owner and does not admit Vendor2 by
      itself.
    preconditions:
    - description: >-
        Coordinator is an accepted participant (DEMOMA-10-003 complete); Vendor2
        container running; no existing suggestion for Vendor2 in the case
    steps:
    - order: 1
      actor: coordinator
      action: POST suggest-actor-to-case trigger for Vendor2
      expected: Coordinator sends Offer(Actor, Case) to CaseActor inbox
    - order: 2
      actor: case-actor
      action: Transform Offer(Actor, Case) to Offer(CaseParticipant{Vendor2, roles=[vendor]}, Case)
      expected: Transformed offer forwarded to Vendor1 (Case Owner) inbox
    - order: 3
      actor: demo-script
      action: Poll Vendor1 DataLayer until transformed Offer(CaseParticipant) is visible
      expected: Transformed offer present in Vendor1 DataLayer
    postconditions:
    - description: >-
        Vendor1 holds a pending Offer(CaseParticipant) for Vendor2 awaiting approval;
        no invitation has been sent to Vendor2 yet
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-003
  - id: DEMOMA-10-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Vendor1 MUST approve the Coordinator's suggestion and the CaseActor MUST then
      send Invite(CaseStub+embargo) to Vendor2 on Vendor1's behalf.
    rationale: >-
      The Case Owner decides who joins the case, and the CASE_MANAGER sends the
      invitation. This step shows that an approved suggestion becomes an invitation
      only after the Case Owner approves it. The invitation carries the embargo, so
      Vendor2 learns the terms before it joins.
    preconditions:
    - description: >-
        Vendor1 DataLayer holds pending Offer(CaseParticipant) for Vendor2
        (DEMOMA-10-004 complete); Vendor2 container running
    steps:
    - order: 1
      actor: vendor1
      action: POST accept-actor-recommendation trigger for Vendor2
      expected: Vendor1 accepts Offer(CaseParticipant); CaseActor sends Invite(CaseStub+embargo) to Vendor2
    - order: 2
      actor: demo-script
      action: Poll Vendor2 DataLayer until Invite(CaseStub+embargo) is visible
      expected: Invite activity present in Vendor2 DataLayer
    postconditions:
    - description: >-
        Vendor2 holds an invitation to the case; scenario may advance to Vendor2
        acceptance
    relationships:
    - rel_type: refines
      spec_id: CM-17-001
    - rel_type: refines
      spec_id: CM-20-002
  - id: DEMOMA-10-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-extension scenario MUST reach a final state with four participants —
      Reporter, Vendor1, Coordinator, and Vendor2 (plus the CaseActor) — and MUST
      advance to VFDPxa CS with EM.EXITED and RM.CLOSED for all participants.
    rationale: >-
      The final state shows that the complete lifecycle ran for every participant,
      including Vendor2, which joined late. A run that ends with a participant that is
      not RM.CLOSED, or with the embargo still active, has not finished the scenario.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
  - id: DEMOMA-10-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-extension scenario MUST run deterministically end-to-end; the scenario
      script MUST verify LedgerFanout replica convergence for Reporter, Coordinator, and
      Vendor2 replicas against the authoritative Vendor1 state after each major protocol
      event.
    rationale: >-
      Reporter, Coordinator and Vendor2 each hold a replica that must follow the
      canonical state. A check after each major event finds the first update that did
      not reach a replica. A run that is not deterministic gives a verdict that does
      not depend only on the code.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-004
  - id: DEMOMA-10-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The implementation of the RVCV-extension scenario MUST add a dedicated parallel
      CI job that runs the scenario concurrently with existing demo CI jobs; the scenario
      MUST be runnable end-to-end via a single orchestration command (e.g., `docker compose`).
    rationale: >-
      A scenario that does not run in CI can break without notice. A separate concurrent
      job keeps its failures visible on their own. It also keeps the elapsed time of a
      CI run close to the time of the slowest scenario. A single command lets a
      developer run the same scenario in the same way.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-005
  - id: DEMOMA-10-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Vendor1 actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from
      `server_base_url` (per CP-08-001 through CP-08-003).
    rationale: >-
      In a multi-container scenario the CaseActor runs in its own container, so its URL
      is not the URL of Vendor1. Without the variable, the case setup nodes return
      FAILURE and no case is created. An identity derived from `server_base_url` would
      name an actor in the Vendor1 container that does not exist, so messages to it
      would fail or go to the wrong place (CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-10-001

- id: DEMOMA-11
  title: RVCV-Handoff Scenario (Vendor1 hands ownership to Coordinator; it invites Vendor2)
  trigger:
    type: scenario_start
    value: rvcv-handoff
  specs:
  - id: DEMOMA-11-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-handoff scenario MUST involve four actor identities with isolated
      DataLayers and a separate CaseActor container, as required by DEMOMA-10-001.
    rationale: >-
      The RVCV-handoff scenario must keep the same separation as RVCV-extension. Then
      the two scenarios differ in their protocol steps and not in their topology. A
      difference in their results then points to the ownership transfer and the steps
      that follow it.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-001
  - id: DEMOMA-11-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Vendor1 MUST transfer case ownership to the Coordinator via the
      offer-case-ownership-transfer / accept-case-ownership-transfer handshake.
    rationale: >-
      This is the defining contrast with RVCV-extension (DEMOMA-10-002): ownership
      transfers mid-scenario rather than staying with Vendor1 throughout.
      The Coordinator must already hold a case replica before accepting ownership,
      because AcceptCaseOwnershipTransferNode reads the case from the DataLayer
      and returns FAILURE if the case is not found.
    preconditions:
    - description: >-
        Vendor1 RM state = ACCEPTED; Coordinator is an existing signatory participant
        with a seeded case replica in their DataLayer; no pending ownership-transfer offer
        exists
    steps:
    - order: 1
      actor: vendor1
      action: POST offer-case-ownership-transfer trigger targeting Coordinator
      expected: >-
        Vendor1's proposal queued for the CASE_MANAGER, which queues its
        Offer(VulnerabilityCase) for the Coordinator inbox
    - order: 2
      actor: demo-script
      action: Poll Coordinator DataLayer until Offer(VulnerabilityCase) is visible
      expected: Offer activity present in Coordinator DataLayer
    - order: 3
      actor: coordinator
      action: POST accept-case-ownership-transfer trigger
      expected: >-
        Coordinator CVDRole updated to CASE_OWNER; Vendor1 role updated to plain
        participant; VulnerabilityCase attributed_to updated to Coordinator actor ID
    postconditions:
    - description: >-
        Coordinator holds CVDRole.CASE_OWNER; Vendor1 is a plain participant;
        VulnerabilityCase.attributed_to = Coordinator actor ID; all participants' case
        replicas reflect the updated ownership
    relationships:
    - rel_type: refines
      spec_id: TRIG-11-001
    - rel_type: refines
      spec_id: TRIG-11-002
  - id: DEMOMA-11-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After becoming CASE_OWNER, the Coordinator MUST invite Vendor2 directly using the
      invite-actor-to-case trigger, and Vendor2 MUST accept the invitation before the
      scenario advances.
    rationale: >-
      In RVCV-extension, Vendor1 approves a Coordinator suggestion. In RVCV-handoff,
      the Coordinator is the owner and invites directly — no approval step is needed.
      The Vendor2 accept-invite step is mandatory: per MV-10-004 an Invite alone does
      not seed the replica; the CaseActor's Announce fires only after the stub
      Invite is accepted (CM-11-008).
    preconditions:
    - description: >-
        Coordinator holds CVDRole.CASE_OWNER (DEMOMA-11-002 complete); Vendor2 container
        running; no existing Invite for Vendor2 in the case
    steps:
    - order: 1
      actor: coordinator
      action: POST invite-actor-to-case trigger for Vendor2
      expected: CaseActor queues Invite(Actor, VulnerabilityCaseStub) for Vendor2
    - order: 2
      actor: demo-script
      action: >-
        Poll Vendor2 DataLayer until Invite(Actor, VulnerabilityCaseStub) is visible
      expected: Invite activity present in Vendor2 DataLayer
    - order: 3
      actor: vendor2
      action: POST accept-case-invite trigger directed to CaseActor
      expected: >-
        Vendor2 joins the case and becomes a signatory (active); CaseActor emits
        Announce(VulnerabilityCase) to seed Vendor2 case replica
    - order: 4
      actor: demo-script
      action: Poll Vendor2 DataLayer until case replica is seeded
      expected: VulnerabilityCase record present in Vendor2 DataLayer
    postconditions:
    - description: >-
        Vendor2 is a signatory participant with a seeded case replica; scenario may
        advance to fix tracking and final state
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-003
  - id: DEMOMA-11-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `VulnerabilityCase.attributed_to` field MUST be updated to the Coordinator's actor
      ID after the ownership transfer completes. All participants MUST observe the
      updated `attributed_to` in their case replicas.
    rationale: >-
      `attributed_to` names the Case Owner, and owner checks such as `is_case_owner`
      compare an actor with it in the local replica. If a replica keeps the old value
      after the transfer, it still treats the previous owner as the Case Owner. That
      replica then refuses owner acts from the new Case Owner, and it judges the
      authority of other participants wrongly.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-002
  - id: DEMOMA-11-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      An active embargo initiated before an ownership transfer MUST remain ACTIVE
      through and after the transfer; the EM state machine MUST transition correctly
      through the ownership change.
    rationale: >-
      An ownership transfer changes who runs the case. It does not change the terms
      that the participants agreed to. If the transfer ended or reset the embargo, a
      change of the Case Owner could release information early. Each party relies on
      the embargo staying in force.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-006
  - id: DEMOMA-11-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-handoff scenario MUST reach a final state with four participants —
      Reporter, Vendor1, Coordinator, and Vendor2 (plus CaseActor) — and MUST advance
      to VFDPxa CS with EM.EXITED and RM.CLOSED for all participants, as required by
      DEMOMA-10-006.
    rationale: >-
      The final state shows that the lifecycle completes after the ownership transfer. A
      transfer that left a participant unable to reach RM.CLOSED, or left the embargo
      active, would show in this check.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-006
  - id: DEMOMA-11-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-handoff scenario MUST run deterministically and MUST verify LedgerFanout
      replica convergence for all non-owning participants after each major protocol
      event, as required by DEMOMA-10-007.
    rationale: >-
      After the transfer, every participant that is not the Case Owner must still
      receive canonical updates. A check after each major event finds the first update
      that a replica did not receive, before or after the ownership changes.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-007
  - id: DEMOMA-11-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The implementation of the RVCV-handoff scenario MUST add a dedicated parallel
      CI job and a CLI entry point, as required by DEMOMA-10-008.
    rationale: >-
      A scenario that does not run in CI can break without notice, and a scenario that
      cannot be started from the CLI is hard to run and debug locally. A separate CI
      job keeps its failures visible on their own.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-008
  - id: DEMOMA-11-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-handoff scenario script MUST include polling wait steps at each
      asynchronous protocol boundary before driving the next trigger.
    rationale: >-
      A trigger commits its local change and then returns. The outbox is sent after the
      response, and the receiving actor commits its own change later, in another
      container. If the script drives the next trigger before that change is visible to
      the target actor, the trigger runs on state that does not exist yet. The run then
      fails, or it passes only when the timing is fortunate. This requirement applies
      the general rule DEMOMA-22-001 to RVCV-handoff (ADR-0058).
    adr:
    - ADR-0058
    preconditions:
    - description: >-
        RVCV-handoff scenario executing; Vendor1 has just emitted the ownership-transfer
        offer and the script is driving subsequent async steps
    steps:
    - order: 1
      actor: demo-script
      action: >-
        After emitting the ownership-transfer offer: poll Coordinator's DataLayer until
        Offer(VulnerabilityCase) is visible
      expected: Offer activity present in Coordinator DataLayer
    - order: 2
      actor: demo-script
      action: >-
        After Coordinator accepts the offer: poll Vendor1's case replica until
        attributed_to reflects the Coordinator's actor ID
      expected: Vendor1 case replica shows VulnerabilityCase.attributed_to = Coordinator actor ID
    - order: 3
      actor: demo-script
      action: >-
        After Coordinator invites Vendor2: poll Vendor2's DataLayer until
        Invite(Actor, VulnerabilityCaseStub) is visible
      expected: Invite activity present in Vendor2 DataLayer
    - order: 4
      actor: demo-script
      action: >-
        After Vendor2 accepts the invitation: poll Vendor2's DataLayer until the case
        replica seeded by CaseActor's Announce(VulnerabilityCase) is present
      expected: VulnerabilityCase record present in Vendor2 DataLayer
    postconditions:
    - description: >-
        All four async boundaries confirmed; each actor's DataLayer reflects the
        expected state before the next trigger is driven; scenario proceeds
        deterministically
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-007
    - rel_type: refines
      spec_id: DEMOMA-22-001
      note: >-
        This requirement is the RVCV-handoff instance of the general rule
        DEMOMA-22-001, which applies the same constraint to every scenario and
        additionally constrains *what* the wait may observe (EDF-06-001 through
        EDF-06-003). "A polling wait exists here" is necessary but not
        sufficient. This requirement remains active; it is not superseded.
  - id: DEMOMA-11-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Vendor1 actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from `server_base_url`
      (per CP-08-001 through CP-08-003).
    rationale: >-
      In a multi-container scenario the CaseActor runs in its own container, so its URL
      is not the URL of Vendor1. Without the variable, the case setup nodes return
      FAILURE and no case is created. An identity derived from `server_base_url` would
      name an actor in the Vendor1 container that does not exist, so messages to it
      would fail or go to the wrong place (CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-10-009
  - id: DEMOMA-11-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After the RVCV-handoff ownership transfer, the Coordinator MUST hold
      CVDRole.CASE_OWNER.
    rationale: >-
      The ownership transfer postcondition for the Coordinator: it becomes the case owner.
  - id: DEMOMA-11-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The CaseActor MUST seed Vendor2's case replica on Vendor2's acceptance of the
      RVCV-handoff invitation.
    rationale: >-
      Replica seeding is the CaseActor's responsibility after each new participant
      accepts an invitation.
  - id: DEMOMA-11-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      All participants (including Vendor2 after joining) MUST be subject to an active
      embargo that was established before the RVCV-handoff ownership transfer.
    rationale: >-
      Ownership transfer does not alter PEC consent rows; all prior signatories and
      any late-joining participants remain bound by the active embargo.
  - id: DEMOMA-11-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After the RVCV-handoff ownership transfer, Vendor1 MUST become a plain
      participant (no longer holding CVDRole.CASE_OWNER).
    rationale: >-
      The ownership transfer postcondition for Vendor1: it relinquishes the case-owner
      role and becomes an ordinary participant.

- id: DEMOMA-12
  title: RCV Scenario (Reporter reports to Coordinator; Coordinator invites Vendor)
  trigger:
    type: scenario_start
    value: rcv
  specs:
  - id: DEMOMA-12-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV scenario MUST involve four actor identities — Reporter, Coordinator,
      Vendor, and CaseActor — each with its own isolated DataLayer and separate
      container. The CaseActor MUST run as a separate actor identity with its own
      container and DataLayer, not co-located on the Coordinator container.
    rationale: >-
      RCV is the canonical three-party coordination baseline. Using four separate
      containers (Reporter, Coordinator, Vendor, CaseActor) matches the RVCV-extension
      topology (DEMOMA-10-001) and ensures the demo exercises true multi-container
      message delivery rather than in-process calls.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-12-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Coordinator MUST receive the Reporter's report (RM→RECEIVED), validate it
      (RM→VALID), and engage the case (RM→ACCEPTED). Engagement triggers CaseActor
      creation on the CaseActor's own container (DEMOMA-12-001).
    rationale: >-
      RCV is the scenario in which the Coordinator is the Case Owner: the Reporter
      reports to the Coordinator, and the Coordinator creates the case. In RVV and
      RVCV-extension the Vendor is the Case Owner. The Coordinator holds CASE_OWNER, and
      the CaseActor in its own container holds CASE_MANAGER (DEMOMA-12-001).
    preconditions:
    - description: >-
        All four containers running (Reporter, Coordinator, Vendor, CaseActor);
        no VulnerabilityCase exists for this report; Coordinator
        auto_create_case=True; Coordinator pre-configured with the dedicated
        CaseActor container URL
    steps:
    - order: 1
      actor: reporter
      action: POST submit-report trigger directed at Coordinator
      expected: Report delivered to Coordinator inbox
    - order: 2
      actor: coordinator
      action: BT processes inbound report; RM transitions RECEIVED→VALID→ACCEPTED
      expected: >-
        VulnerabilityCase created; CaseActor registered on the separate
        CaseActor container (not co-located on the Coordinator container,
        per DEMOMA-12-001); default embargo initialized to EM.ACTIVE
        (EP-04-001); EM.ACTIVE is established at case creation before
        any participant invitation
    - order: 3
      actor: coordinator
      action: Coordinator assigned CVDRole.CASE_OWNER on the new case
      expected: Coordinator holds CASE_OWNER; CaseActor holds CASE_MANAGER
    - order: 4
      actor: coordinator
      action: >-
        Coordinator sends trust-bootstrap Create(VulnerabilityCase) to Reporter
        (CBT-01-001); Reporter is the original report submitter so MUST receive
        this one-time bootstrap to trust the CaseActor identity
      expected: >-
        Reporter receives Create(VulnerabilityCase) carrying Coordinator as
        CASE_OWNER and CaseActor as COORDINATOR; Reporter trusts CaseActor
        for this case
    postconditions:
    - description: >-
        VulnerabilityCase exists; Coordinator RM=ACCEPTED, CVDRole=CASE_OWNER;
        CaseActor running with CASE_MANAGER on its own container; EM.ACTIVE
        established; trust bootstrap delivered to Reporter; no ownership
        transfer has occurred
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    - rel_type: refines
      spec_id: CBT-01-001
    - rel_type: refines
      spec_id: EP-04-001
  - id: DEMOMA-12-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Coordinator MUST NOT invite the Reporter to the case. The Reporter is the
      reporter, so the CASE_MANAGER seats it as a signatory participant when it
      creates the case (CM-22-002, CM-14-005). The scenario MUST confirm that
      the Reporter is a participant and holds a case replica before the Vendor
      is invited.
    rationale: >-
      The reporter's consent is implicit in submitting the report (CM-14-005),
      so an Invite/Accept exchange for the Reporter would record an invitation
      that never occurred (CM-18-003).
    preconditions:
    - description: >-
        DEMOMA-12-002 postconditions satisfied: VulnerabilityCase exists,
        Coordinator RM=ACCEPTED, CVDRole=CASE_OWNER, EM.ACTIVE, trust bootstrap
        Create(VulnerabilityCase) already delivered to Reporter (CBT-01-001)
    steps:
    - order: 1
      actor: demo_script
      action: >-
        Wait until the Coordinator's case lists the Reporter and the
        Coordinator as participants
      expected: >-
        Reporter present as a participant seated at case creation, with no
        Invite/Accept exchange (the case-actor log's single
        invite_actor_to_case entry, the Vendor's, is checked by
        DEMOMA-12-009(2))
    - order: 2
      actor: demo_script
      action: >-
        Verify the case is active and the Reporter holds a case replica
      expected: Reporter holds a case replica with EM.ACTIVE
    postconditions:
    - description: >-
        Reporter is a signatory with a case replica; Vendor invitation has not
        yet been issued
    relationships:
    - rel_type: refines
      spec_id: CM-22-002
    - rel_type: refines
      spec_id: CM-14-005
  - id: DEMOMA-12-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Coordinator MUST invite Vendor to the case using the `invite-actor-to-case`
      trigger directly (not via a suggestion/approval chain); Vendor MUST accept via
      the `accept-case-invite` trigger.
    rationale: >-
      Coordinator is CASE_OWNER, so a direct `invite-actor-to-case` is correct;
      the ADR-0026 suggest/approve chain is for participants recommending actors to
      the case owner, not for the owner inviting directly. Polling before accept
      is required for determinism (per DEMOMA-11-009 pattern).
    preconditions:
    - description: >-
        Reporter is a signatory with a case replica (DEMOMA-12-003 postconditions
        satisfied); Vendor is not yet a case participant
    steps:
    - order: 1
      actor: coordinator
      action: POST invite-actor-to-case trigger for Vendor
      expected: Invite(Actor, VulnerabilityCaseStub) delivered to Vendor inbox
    - order: 2
      actor: demo_script
      action: >-
        Poll Vendor DataLayer until Invite(Actor, VulnerabilityCaseStub) is visible
      expected: Invitation record present in Vendor replica
    - order: 3
      actor: vendor
      action: POST accept-case-invite trigger
      expected: >-
        Vendor becomes a signatory; CaseActor emits Announce(VulnerabilityCase)
        to seed Vendor replica with full case history
    postconditions:
    - description: >-
        Vendor is a signatory with a seeded case replica containing full history
        from genesis; all three actors (Reporter, Coordinator, Vendor) plus
        CaseActor are now case participants
    relationships:
    - rel_type: refines
      spec_id: CM-17-001
    adr:
    - ADR-0026
  - id: DEMOMA-12-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV scenario MUST reach a final state with three participants — Reporter,
      Coordinator, and Vendor (plus the CaseActor) — advancing to VFDPxa CS with
      EM.EXITED and RM.CLOSED for all participants; only Vendor's fix path (VFD)
      is tracked.
    rationale: >-
      RCV has one Vendor, so only that Vendor has a fix path. The final state shows
      that the complete lifecycle ran for all three parties. The Coordinator and
      Reporter have no fix path, so a check on their fix path state would test
      nothing.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: EP-04-001
  - id: DEMOMA-12-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV scenario MUST run deterministically end-to-end and MUST verify LedgerFanout
      replica convergence for Reporter and Vendor replicas against the authoritative
      Coordinator/CaseActor state after each major protocol event.
    rationale: >-
      The Reporter and Vendor replicas must follow the canonical state. A check after
      each major event finds the first update that did not reach a replica. A
      deterministic run gives a verdict that depends only on the code.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-004
  - id: DEMOMA-12-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The implementation of the RCV scenario MUST register it with the scenario
      registry (DEMOCI-11-001) in the same PR, so that its generated
      `.github/demo-scenarios.json` entry (DEMOCI-11-004) runs it as its own CI
      matrix job and CI failures are independently reported per DEMOCI-03-003.
    rationale: >-
      A scenario that is not registered has no entry in the CI matrix, so it can break
      without notice. Registration in the same pull request gives the scenario a matrix
      entry from the time that it is in the repository. Its own CI job keeps its
      failures separate from those of other scenarios (DEMOCI-03-003).
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-03-002
    - rel_type: refines
      spec_id: DEMOCI-03-003
  - id: DEMOMA-12-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV implementation MUST ship a dedicated per-scenario case-ledger
      invariant test file (`test/ci/invariants/test_rcv_invariants.py`) built
      exclusively on the shared invariant library introduced by the harness
      refactor (issue #1592); DEMOMA-12-008 is satisfied only when that shared
      library exists.
    rationale: >-
      Requiring use of the shared library enforces the DRY constraint across
      scenarios. A file that copies invariant logic is not compliant even if
      it tests the correct things.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-006
  - id: DEMOMA-12-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV per-scenario invariant test file MUST assert the following
      scenario-specific checks in addition to the universal library checks:
      (1) `validate_report` event present in case-actor log,
      (2) `invite_actor_to_case` present exactly once (the Vendor invitation;
      the Reporter is seated, not invited, per DEMOMA-12-003),
      (3) `close_case` present, (4) CS transitions VFd
      and VFD observed in `add_participant_status_to_participant` entries for
      the Vendor actor and public-aware (P) transition observed in
      `add_participant_status_to_participant` entries for the Coordinator actor,
      and (5) Vendor replica holds the complete log from genesis (full history
      backfill, as Vendor is a late joiner).
    rationale: >-
      Scenario-specific invariants prevent the RCV scenario from accidentally
      omitting protocol steps not covered by universal checks. Explicitly
      enumerating them here means CI will catch regressions in the steps
      unique to RCV.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-008
  - id: DEMOMA-12-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Coordinator actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from `server_base_url`
      (per CP-08-001 through CP-08-003).
    rationale: >-
      In a multi-container scenario the CaseActor runs in its own container, so its URL
      is not the URL of Coordinator. Without the variable, the case setup nodes return
      FAILURE and no case is created. An identity derived from `server_base_url` would
      name an actor in the Coordinator container that does not exist, so messages to it
      would fail or go to the wrong place (CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-12-001
  - id: DEMOMA-12-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Coordinator MUST hold `CVDRole.CASE_OWNER` throughout the entire RCV scenario;
      ownership MUST NOT transfer to any other actor.
    rationale: >-
      RCV is the canonical Coordinator-as-owner scenario. Retaining CASE_OWNER
      throughout differentiates it from RVCV-extension and RVCV-handoff variants.
  - id: DEMOMA-12-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The CaseActor MUST emit `Announce(VulnerabilityCase)` to seed Vendor's case replica
      after Vendor accepts the invitation in the RCV scenario.
    rationale: >-
      Replica seeding via Announce is the CaseActor's canonical response to an accepted
      invitation (PCR-02-002).
  - id: DEMOMA-12-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV demo script MUST poll Vendor's DataLayer for the arriving invitation before
      driving the accept step.
    rationale: >-
      Polling before accept is required for determinism; driving accept before the
      invitation is visible in Vendor's DataLayer causes a race condition.
  - id: DEMOMA-12-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      RCV demo scripts MUST verify EM.ACTIVE at the case-creation milestone and EM.EXITED
      at the final milestone.
    rationale: >-
      The causal chain EM.ACTIVE (established at case creation per EP-04-001) to
      EM.EXITED (triggered by CS.P per DEMOMA-07-003(4)) must be confirmed at both
      endpoints.
  - id: DEMOMA-12-015
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV invariant test file MUST NOT duplicate universal invariant logic;
      universal chain/hash/RM-closed checks MUST be imported from the shared library,
      not re-implemented inline.
    rationale: >-
      Universal invariants are the same for every scenario, so the shared library
      keeps them in one place. A copy in the RCV test file can drift from the library.
      Then a defect fixed in the library stays in RCV, or RCV checks a weaker rule
      than every other scenario does.
  - id: DEMOMA-12-016
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The P-set CS state MUST be visible in all replicas via Announce(CaseLedgerEntry)
      fan-out after the Coordinator triggers CS.P.
    rationale: >-
      Announce(CaseLedgerEntry) is the sole canonical propagation path for status
      updates to peers (SYNC-02-002); this invariant confirms the fan-out fired.
  - id: DEMOMA-12-017
    priority: MUST
    kind: project
    statement: >-
      The RCV story MUST start with the shared "the Coordinator invites the
      Vendor" opening and continue from the Vendor's acceptance.
    rationale: >-
      The opening is the Reporter telling the Coordinator, the Coordinator
      engaging the case, and the Coordinator inviting the Vendor. RCV tells it
      identically to RCV-reject, so it is one copy of the code and the
      recordings of the two are byte-identical up to the Vendor's decision
      (DEMOCI-11-018). Naming it here keeps this group a whole story: a reader
      sees where RCV's own telling begins without reading the sibling's group.
    verification: >-
      `test/demo_unit/test_story.py::test_the_two_composed_scenarios_share_one_opening`
      asserts that `rcv`'s story begins with the items of
      `COORDINATOR_INVITES_VENDOR`, and `TestComposedFamilies` in
      `test/demo_unit/test_recordings.py` compares the `rcv` and `rcv-reject`
      recordings byte for byte up to the `vendor-join` branch point.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: depends_on
      spec_id: DEMOCI-11-019
    tags:
    - demo

- id: DEMOMA-13
  title: RCCV-Extension Scenario (C1 retains ownership; C2 is participant; C2 suggests Vendor)
  trigger:
    type: scenario_start
    value: rccv-extension
  specs:
  - id: DEMOMA-13-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-extension scenario MUST involve four actor identities — Reporter,
      Coordinator1 (C1), Coordinator2 (C2), and Vendor — each with its own isolated
      DataLayer; the CaseActor MUST run as a separate actor identity with its own
      container and DataLayer, not co-located in the C1 container.
    rationale: >-
      RCCV-extension demonstrates inter-coordinator collaboration: C1 is the Case
      Owner, C2 is a participating coordinator who can suggest new actors but cannot
      independently invite them. The five-container topology (Reporter, C1, C2, Vendor,
      CaseActor) is the same as RVCV-extension (DEMOMA-10-001) with the C1 role
      replacing Vendor1 as Case Owner.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-10-001
  - id: DEMOMA-13-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C1 MUST receive the Reporter's report (RM→RECEIVED), validate it (RM→VALID),
      and engage the case (RM→ACCEPTED), retaining CVDRole.CASE_OWNER throughout
      the entire scenario. Ownership MUST NOT transfer to C2 or Vendor.
    rationale: >-
      This scenario demonstrates the "extension" variant where a Coordinator
      creates and owns a case. C1 acts as both the initial report recipient and
      the authority that approves all participant additions, in contrast to the
      RVCV-extension variant where a Vendor holds ownership.
    preconditions:
    - description: >-
        All five containers running (Reporter, C1, C2, Vendor, CaseActor);
        no VulnerabilityCase exists for this report; C1 auto_create_case=True;
        C1 pre-configured with the dedicated CaseActor container URL
    steps:
    - order: 1
      actor: reporter
      action: POST submit-report trigger directed at C1
      expected: Report delivered to C1 inbox
    - order: 2
      actor: c1
      action: BT processes inbound report; RM transitions RECEIVED→VALID→ACCEPTED
      expected: >-
        VulnerabilityCase created; CaseActor registered on the separate
        CaseActor container; default embargo initialized to EM.ACTIVE (EP-04-001)
    - order: 3
      actor: c1
      action: C1 assigned CVDRole.CASE_OWNER on the new case
      expected: C1 holds CASE_OWNER; CaseActor holds CASE_MANAGER
    - order: 4
      actor: c1
      action: >-
        C1 sends trust-bootstrap Create(VulnerabilityCase) to Reporter (CBT-01-001);
        Reporter is the original report submitter and MUST receive this bootstrap to
        trust the CaseActor identity
      expected: >-
        Reporter receives Create(VulnerabilityCase) carrying C1 as CASE_OWNER and
        CaseActor as COORDINATOR; Reporter trusts CaseActor for this case
    postconditions:
    - description: >-
        VulnerabilityCase exists; C1 RM=ACCEPTED, CVDRole=CASE_OWNER; CaseActor
        running with CASE_MANAGER on its own container; EM.ACTIVE established;
        trust bootstrap delivered to Reporter; Reporter is an initial participant via
        the report-submission bootstrap (not via a separate invite-actor-to-case
        trigger); no ownership transfer has occurred
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    - rel_type: refines
      spec_id: CBT-01-001
    - rel_type: refines
      spec_id: EP-04-001
    - rel_type: refines
      spec_id: DEMOMA-12-002
  - id: DEMOMA-13-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C1 MUST invite C2 to the case and C2 MUST accept, becoming a participant
      holding CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER.
    rationale: >-
      C2 must be a participant before it can suggest a vendor. CASE_MANAGER is the role
      that commits canonical case state, and in this scenario the CaseActor holds it. If
      C2 also held CASE_MANAGER, two actors could commit case changes, and the scenario
      would not show a coordinator that participates without control.
    preconditions:
    - description: >-
        DEMOMA-13-002 postconditions satisfied: C1 RM=ACCEPTED, CVDRole=CASE_OWNER;
        EM.ACTIVE; trust bootstrap delivered to Reporter; Reporter is an initial
        participant; C2 container running
    steps:
    - order: 1
      actor: c1
      action: POST invite-actor-to-case trigger targeting C2
      expected: CaseActor queues Invite(Actor, VulnerabilityCaseStub) for C2's inbox
    - order: 2
      actor: demo-script
      action: Poll C2 DataLayer until Invite(Actor, VulnerabilityCaseStub) is visible
      expected: Invite activity present in C2 DataLayer
    - order: 3
      actor: c2
      action: POST accept-case-invite trigger
      expected: >-
        C2 joins the case (active) with CVDRole.COORDINATOR (not CASE_MANAGER);
        CaseActor seeds C2 case replica
    postconditions:
    - description: >-
        C2 is a participant with CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER;
        C2 holds a seeded case replica; case has four participants
        (Reporter, C1, C2, CaseActor)
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
    - rel_type: refines
      spec_id: DEMOMA-10-003
  - id: DEMOMA-13-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C2 MUST suggest Vendor to the case and the CaseActor MUST transform the
      offer and forward it to C1 for approval.
    rationale: >-
      C2 is not the Case Owner, so it cannot add a party to the case. It can only
      suggest one. The CASE_MANAGER changes the suggestion into an
      `Offer(CaseParticipant)` and sends it to C1, who decides. This step shows that a
      suggestion from a coordinator goes to the Case Owner and does not admit the
      Vendor by itself.
    preconditions:
    - description: >-
        C2 is an accepted participant (DEMOMA-13-003 complete); Vendor
        container running; no existing suggestion for Vendor in the case
    steps:
    - order: 1
      actor: c2
      action: POST suggest-actor-to-case trigger for Vendor with roles=["vendor"]
      expected: C2 sends Offer(Actor, Case) to CaseActor inbox
    - order: 2
      actor: case-actor
      action: >-
        Transform Offer(Actor, Case) to
        Offer(CaseParticipant{Vendor, roles=[vendor]}, Case)
      expected: Transformed offer forwarded to C1 (Case Owner) inbox
    - order: 3
      actor: demo-script
      action: Poll C1 DataLayer until transformed Offer(CaseParticipant) is visible
      expected: Transformed offer present in C1 DataLayer
    postconditions:
    - description: >-
        C1 holds a pending Offer(CaseParticipant) for Vendor awaiting approval;
        no invitation has been sent to Vendor yet
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-003
    - rel_type: refines
      spec_id: DEMOMA-10-004
  - id: DEMOMA-13-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C1 MUST approve C2's suggestion and the CaseActor MUST then send
      Invite(CaseStub+embargo) to Vendor on C1's behalf.
    rationale: >-
      The Case Owner decides who joins the case, and the CASE_MANAGER sends the
      invitation. This step shows that a suggestion becomes an invitation only after
      C1 approves it. The invitation carries the embargo, so the Vendor learns the
      terms before it joins.
    preconditions:
    - description: >-
        C1 DataLayer holds pending Offer(CaseParticipant) for Vendor
        (DEMOMA-13-004 complete); Vendor container running
    steps:
    - order: 1
      actor: c1
      action: POST accept-actor-recommendation trigger for Vendor
      expected: >-
        C1 accepts Offer(CaseParticipant); CaseActor sends
        Invite(CaseStub+embargo) to Vendor
    - order: 2
      actor: demo-script
      action: Poll Vendor DataLayer until Invite(CaseStub+embargo) is visible
      expected: Invite activity present in Vendor DataLayer
    - order: 3
      actor: vendor
      action: POST accept-case-invite trigger
      expected: >-
        Vendor joins the case (active) with CVDRole.VENDOR;
        CaseActor seeds Vendor case replica with full history
    postconditions:
    - description: >-
        Vendor is a participant with CVDRole.VENDOR and a seeded case replica;
        all five participants present (Reporter, C1, C2, Vendor, CaseActor)
    relationships:
    - rel_type: refines
      spec_id: CM-17-001
    - rel_type: refines
      spec_id: CM-20-002
    - rel_type: refines
      spec_id: DEMOMA-10-005
  - id: DEMOMA-13-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-extension scenario MUST reach a final state with four participants —
      Reporter, C1, C2, and Vendor (plus the CaseActor) — and MUST advance to
      VFDPxa CS with EM.EXITED and RM.CLOSED for all participants.
    rationale: >-
      Only Vendor tracks a vendor fix path (VFD). C1 and C2 hold CVDRole.COORDINATOR
      and have no VFD substate. Reporter has no VFD substate. EM.EXITED is triggered
      by CS.P (public disclosure). C1 (CASE_OWNER) is the actor that triggers
      CS.P per DEMOMA-07-003(4).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: DEMOMA-10-006
  - id: DEMOMA-13-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-extension scenario MUST run deterministically end-to-end and MUST
      verify LedgerFanout replica convergence for Reporter, C2, and Vendor replicas against
      the authoritative C1/CaseActor state after each major protocol event.
    rationale: >-
      Each replica that is not the authority must follow the canonical state. A check
      after each major event finds the first update that did not reach a replica. A
      deterministic run gives a verdict that depends only on the code.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-004
    - rel_type: refines
      spec_id: DEMOMA-10-007
  - id: DEMOMA-13-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The implementation of the RCCV-extension scenario MUST register it with the
      scenario registry (DEMOCI-11-001), so that its generated
      `.github/demo-scenarios.json` entry (DEMOCI-11-004) runs it as its own CI
      matrix job and CI failures are independently reported per DEMOCI-03-003.
    rationale: >-
      A scenario that is not registered does not run in CI, so it can break without
      notice. Its own CI job keeps its failures separate from those of other scenarios
      (DEMOCI-03-003).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-005
    - rel_type: refines
      spec_id: DEMOMA-10-008
  - id: DEMOMA-13-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-extension implementation MUST ship a dedicated per-scenario
      case-ledger invariant test file
      (`test/ci/invariants/test_rccv_extension_invariants.py`) built exclusively
      on the shared invariant library (per DEMOMA-12-008 pattern).
    rationale: >-
      Scenario-specific invariants prevent the RCCV-extension scenario from
      accidentally omitting protocol steps not covered by universal checks.
      The Vendor-as-late-joiner invariant is shared with RVCV-extension
      (DEMOMA-10) and RCCV-handoff (DEMOMA-15).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-008
  - id: DEMOMA-13-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The C1 actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from `server_base_url`
      (per CP-08-001 through CP-08-003).
    rationale: >-
      In a multi-container scenario the CaseActor runs in its own container, so its URL
      is not the URL of C1. Without the variable, the case setup nodes return FAILURE
      and no case is created. An identity derived from `server_base_url` would name an
      actor in the C1 container that does not exist, so messages to it would fail or go
      to the wrong place (CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-13-001
  - id: DEMOMA-13-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-extension invariant test file MUST assert the following
      scenario-specific checks in addition to universal library checks:
      (1) `validate_report` event present in case-actor log,
      (2) `invite_actor_to_case` present at least twice (C2 invitation + Vendor
      invitation), (3) `close_case` present, (4) CS transitions VFd and VFD
      observed in `add_participant_status_to_participant` entries for the Vendor
      actor and public-aware (P) transition observed in
      `add_participant_status_to_participant` entries for C1 (CASE_OWNER triggers
      CS.P), and (5) Vendor replica holds the complete log from genesis (full
      history backfill, as Vendor is a late joiner).
    rationale: >-
      Scenario-specific invariants prevent the RCCV-extension scenario from
      accidentally omitting protocol steps not covered by universal checks.

- id: DEMOMA-14
  title: RCCV-Handoff Scenario (C1 transfers case ownership to C2; C2 invites Vendor)
  trigger:
    type: scenario_start
    value: rccv-handoff
  specs:
  - id: DEMOMA-14-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-handoff scenario MUST involve four actor identities — Reporter,
      Coordinator1 (C1), Coordinator2 (C2), and Vendor — each with its own
      isolated DataLayer; the CaseActor MUST run as a separate actor identity
      with its own container and DataLayer.
    rationale: >-
      RCCV-handoff demonstrates the case-ownership-transfer flow between two
      coordinators.  C1 starts as CASE_OWNER, then transfers ownership to C2
      via TRIG-11-001/002.  Its five containers come from the fixed cast: C1
      in the first Coordinator slot, the Vendor in the first Vendor slot, C2 in
      a character-actor slot, plus the Reporter slot and the dedicated
      CaseActor container (DEMOCI-11-020).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-13-001
  - id: DEMOMA-14-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C1 MUST receive the Reporter's report (RM→RECEIVED), validate it
      (RM→VALID), and engage the case (RM→ACCEPTED), holding
      CVDRole.CASE_OWNER until it completes the ownership transfer to C2.
    rationale: >-
      C1 is the first Case Owner, so this scenario tests the ownership transfer from a
      Coordinator. RVCV-handoff (DEMOMA-11) tests it from a Vendor. C1 becomes the Case
      Owner when it receives the report and creates the case. Only a Case Owner can
      offer the transfer, so these steps must come first.
    preconditions:
    - description: >-
        All five containers running (Reporter, C1, C2, Vendor, CaseActor);
        all actors seeded and cross-registered.
    steps:
    - order: 1
      actor: reporter
      action: POST submit-report trigger to C1
      expected: C1 creates VulnerabilityCase; RM→RECEIVED on C1
    - order: 2
      actor: demo-script
      action: POST validate-report and engage-case triggers on C1
      expected: C1 RM→VALID then RM→ACCEPTED; C1 holds CVDRole.CASE_OWNER
    postconditions:
    - description: C1 holds CVDRole.CASE_OWNER and case attributed_to=C1.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-13-002
  - id: DEMOMA-14-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C1 MUST invite C2 to the case (CVDRole.COORDINATOR), and C2 MUST accept.
    rationale: >-
      C2 must be a known participant before C1 can offer ownership transfer.
      The invite-accept flow establishes C2's presence in the case ledger.
    preconditions:
    - description: C1 is CASE_OWNER; case attributed_to=C1.
    steps:
    - order: 1
      actor: c1
      action: POST invite-actor-to-case trigger targeting C2 (CVDRole.COORDINATOR)
      expected: C1 sends Invite activity to CaseActor; CaseActor forwards to C2
    - order: 2
      actor: c2
      action: POST accept-case-invite trigger
      expected: C2 joins the case (active) with CVDRole.COORDINATOR
    postconditions:
    - description: C2 is a participant; CVDRole.COORDINATOR; case attributed_to=C1.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-14-002
  - id: DEMOMA-14-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C1 MUST offer case ownership transfer to C2 (TRIG-11-001) and C2 MUST
      accept (TRIG-11-002).
    rationale: >-
      The ownership transfer is the step that makes this scenario different from
      RCCV-extension. The trigger pair (TRIG-11-001, TRIG-11-002) is the same mechanism
      that RVCV-handoff uses (DEMOMA-11-002). Thus the transfer is tested from a Vendor
      and from a Coordinator, and a defect that occurs for only one of these roles is
      found.
    preconditions:
    - description: C2 is a participant; case attributed_to=C1.
    steps:
    - order: 1
      actor: c1
      action: POST offer-case-ownership-transfer trigger targeting C2
      expected: C1 sends Offer activity to C2's inbox via CaseActor
    - order: 2
      actor: c2
      action: POST accept-case-ownership-transfer trigger referencing the Offer
      expected: >-
        case attributed_to=C2 on C1's and C2's DataLayers; C2 holds
        CVDRole.CASE_OWNER; C1 holds CVDRole.COORDINATOR
    postconditions:
    - description: case attributed_to=C2 on C1's and C2's DataLayers.
    - description: C2 holds CVDRole.CASE_OWNER; C1 holds CVDRole.COORDINATOR.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-14-003
  - id: DEMOMA-14-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C2 (the new CASE_OWNER) MUST invite Vendor to the case (NOT C1), and
      Vendor MUST accept.
    rationale: >-
      This invariant confirms that the new CASE_OWNER (C2) has the authority
      to extend the case to additional actors after the handoff, and that the
      four-actor coordination path works end-to-end.
    preconditions:
    - description: case attributed_to=C2; C2 is CASE_OWNER.
    steps:
    - order: 1
      actor: c2
      action: POST invite-actor-to-case trigger for Vendor
      expected: C2 sends Invite activity to CaseActor; CaseActor forwards to Vendor
    - order: 2
      actor: vendor
      action: POST accept-case-invite trigger directed to CaseActor
      expected: Vendor joins the case (active); Accept delivered to CaseActor inbox
    postconditions:
    - description: Vendor is a participant; all five actors have case replicas.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-14-004
  - id: DEMOMA-14-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After Vendor joins, all four actor containers (Reporter, C1, C2, Vendor)
      MUST converge to the same case ledger state (LedgerFanout invariant).  Vendor
      MUST receive the complete ledger backfill from genesis.
    rationale: >-
      Late-joiner backfill is a shared invariant across RVCV-extension,
      RVCV-handoff, and RCCV-handoff.  Verifying it here ensures the
      ownership-transfer workflow does not break LedgerFanout convergence.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-007
  - id: DEMOMA-14-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Vendor MUST advance through the full fix lifecycle: CS.VFd (fix ready)
      and CS.VFD (fix deployed).
    rationale: >-
      End-to-end completion is required to exercise the full CVD coordination
      workflow in the RCCV-handoff variant.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-11-006
  - id: DEMOMA-14-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-handoff implementation MUST ship a dedicated CLI command
      (`vultron-demo rccv-handoff`) wired into `vultron/demo/cli.py`
      and registered in the `DEMOS` list.  The command MUST expose
      `--reporter-url`, `--c1-url`, `--c2-url`, `--vendor-url`,
      `--case-actor-url`, `--reporter-id`, `--c1-id`, `--c2-id`,
      `--vendor-id`, `--case-actor-id`, and `--skip-health-check`
      options with corresponding environment variable bindings.
    rationale: >-
      CLI consistency and Docker-entrypoint compatibility require the
      `DEMO=rccv-handoff` env var to map to `vultron-demo rccv-handoff`
      (demo-entrypoint.sh forwards the DEMO value directly).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-04-002
  - id: DEMOMA-14-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-handoff implementation MUST ship a dedicated per-scenario
      case-ledger invariant test file
      (`test/ci/invariants/test_rccv_handoff_invariants.py`) built
      exclusively on the shared invariant library (per DEMOMA-12-008 pattern).
    rationale: >-
      Scenario-specific invariants prevent the RCCV-handoff scenario from
      accidentally omitting protocol steps not covered by universal checks.
      The Vendor-as-late-joiner invariant is shared with RVCV-extension
      (DEMOMA-10) and RCCV-extension (DEMOMA-13).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-008
  - id: DEMOMA-14-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      C2 MUST be a participant with CVDRole.COORDINATOR before the ownership transfer
      is initiated in the RCCV-handoff scenario.
    rationale: >-
      C2 must be a known case participant before C1 can offer ownership transfer;
      the invite-accept flow in DEMOMA-14-003 establishes C2's presence in the ledger.
  - id: DEMOMA-14-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After the RCCV-handoff ownership transfer, the case's attributed_to MUST reflect
      C2 on C1's DataLayer, C2's DataLayer, and the CaseActor's canonical ledger.
    rationale: >-
      attributed_to reflects the current CASE_OWNER; all replicas must converge on
      the updated value after the ownership transfer completes.
  - id: DEMOMA-14-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After the RCCV-handoff ownership transfer, C1's CVDRole MUST become
      CVDRole.COORDINATOR (no longer CASE_OWNER).
    rationale: >-
      This is the defining role-change outcome of the handoff; C1 retains participation
      but surrenders ownership authority.
  - id: DEMOMA-14-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Vendor's Accept activity MUST be delivered to the CaseActor so
      `AcceptInviteActorToCaseBT` runs and the join is committed to the canonical
      ledger (PCR-08-008).
    rationale: >-
      Accept must reach the CaseActor, not just the inviting actor, so the join
      is recorded in the authoritative ledger.
  - id: DEMOMA-14-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      All participants MUST report publication (CS.VFDPx or CS.VFDPxa) and the
      embargo MUST terminate (EM.EXITED) in the RCCV-handoff scenario.
    rationale: >-
      Public disclosure triggers embargo teardown via ThreatTerminationBranchNode;
      both outcomes must be confirmed to validate the end-to-end CS.P path.
  - id: DEMOMA-14-015
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      All participants MUST close the case (RM.CLOSED) in the RCCV-handoff scenario.
    rationale: >-
      RM.CLOSED for all participants is the terminal acceptance criterion for the
      full CVD lifecycle in the RCCV-handoff scenario.
  - id: DEMOMA-14-016
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-handoff invariant test file MUST assert the following scenario-specific
      checks in addition to universal library checks: (1) `validate_report` event
      present in case-actor log, (2) `invite_actor_to_case` present at least twice
      (C2 invitation + Vendor invitation), (3) `accept_invite_actor_to_case` present
      at least twice (C2 accept + Vendor accept), (4) `close_case` present, (5) CS
      transitions VFd and VFD observed in `add_participant_status_to_participant`
      entries for the Vendor actor, and (6) Vendor replica holds the complete log
      from genesis (late-joiner full-history backfill).
    rationale: >-
      Scenario-specific invariants prevent the RCCV-handoff scenario from accidentally
      omitting protocol steps not covered by universal checks.
- id: DEMOMA-15
  title: Demo Helper Preconditions
  specs:
  - id: DEMOMA-15-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      `verify_fix_ready` in `vultron/demo/helpers/milestones.py` MUST accept only
      actor IDs holding `CVDRole.VENDOR` in the case's participant index; the f→F
      (fix-ready) transition is gated on VENDOR by `CheckVendorRoleNode`.
    rationale: >-
      The f→F (fix-ready) transition requires CVDRole.VENDOR, and a Coordinator has no
      vendor fix path. If `verify_fix_ready` accepted any actor, a call with a
      Coordinator would fail only later, as a fix-ready state that never appears. That
      failure does not show its cause. The role check names the wrong actor at once. An
      actor that holds both VENDOR and DEPLOYER passes the check.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-06-002
    - rel_type: refines
      spec_id: DEMOMA-12-005
  - id: DEMOMA-15-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      `verify_fix_deployed` MUST accept only actor IDs holding `CVDRole.DEPLOYER`
      in the case's participant index; the d→D (fix-deployed) transition is gated
      on DEPLOYER by `CheckDeployerRoleNode`.
    rationale: >-
      A VENDOR-only actor stops at VFd and cannot advance to VFD (CSB-15-002);
      requiring DEPLOYER makes the failure mode unambiguous when the wrong actor ID
      is passed.
  - id: DEMOMA-15-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each demo helper (`verify_fix_ready` and `verify_fix_deployed`) MUST enforce
      its role precondition at runtime, raising `AssertionError` with the actor ID
      and its actual roles if the assertion fails.
    rationale: >-
      Runtime enforcement surfaces caller errors immediately with a clear diagnostic
      rather than a confusing downstream VFD state-check failure.
- id: DEMOMA-16
  title: Per-Scenario Required Semantic Types for the Invariant Harness
  description: >-
    Each scenario defines a minimum set of protocol semantic types that MUST
    appear in the authoritative (case-actor) case-ledger log for a complete,
    correct run. These lists are implemented as the per-scenario
    `_XXX_EXPECTED_SEMANTIC_TYPES` constants in the corresponding
    `test/ci/invariants/test_XXX_invariants.py` file and are checked by
    Invariant 5 (test_invariant_5_expected_semantic_types_present). They
    complement, and do not replace, the scenario-specific invariant test
    functions that use `check_semantic_type_count` for events that must appear
    multiple times.
  specs:
  - id: DEMOMA-16-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The five universal semantic types — `validate_report`,
      `add_participant_status_to_participant`, `close_case`,
      `add_note_to_case`, and `engage_case` — MUST appear at least once in the
      authoritative case-actor log for every multi-actor demo scenario.
    rationale: >-
      These five types are the minimum for every scenario: report validation, RM
      engagement (VALID to ACCEPTED), participant status, case closure, and at least one
      note (the add-note trigger posts one inline `Add(Note)`). A scenario without one
      of the five has not completed the basic CVD lifecycle. The shared demo helpers
      emit `engage_case`, so no scenario file calls the trigger, but every scenario
      produces the entry. Paths: see `notes/demo-ci-invariants.md`.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002

  - id: DEMOMA-16-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In addition to the universal types (DEMOMA-16-001), the rv scenario
      MUST verify that its expected-semantic-types list is restricted to types that
      the rv scenario actually produces. rv does not include an
      `invite_actor_to_case` phase; the Reporter joins by submitting a report,
      not via an invitation.
    rationale: >-
      An expected type that rv never produces makes the check fail on every correct
      run, and a developer then learns to ignore it. rv has no invitation phase,
      because the Reporter joins when it submits the report. The list must contain
      only the types that a correct rv run produces, so that a missing type always
      means a defect.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-06-002

  - id: DEMOMA-16-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVV scenario expected-semantic-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition
      to the universal types (DEMOMA-16-001), because Vendor1 invites
      Vendor2 into the case and Vendor2 explicitly accepts via the
      `accept-case-invite` trigger.
    rationale: >-
      Without these two types in the list, a run in which Vendor2 never joined can
      still pass the type check. The invitation and its acceptance are the steps that
      make Vendor2 a participant, so their ledger entries are the evidence that RVV
      ran as specified.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-09-002

  - id: DEMOMA-16-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-extension scenario expected-semantic-types list MUST include
      `invite_actor_to_case`, `offer_case_participant`,
      `accept_invite_actor_to_case`, and `accept_actor_recommendation` in
      addition to the universal types (DEMOMA-16-001), because Vendor1
      invites Coordinator, Coordinator uses the ADR-0026 suggest-actor flow
      (`offer_case_participant`) to propose Vendor2, Vendor1 approves the
      recommendation (`accept_actor_recommendation`), CaseActor converts the
      approval into an invitation, and Vendor2 explicitly accepts via the
      `accept-case-invite` trigger.
    rationale: >-
      Each listed type is the ledger evidence of one step in the suggest and approve
      flow. If one is missing from the list, a run in which that step never happened can
      still pass. The invitation types occur once for each invitee, so their presence
      shows only that one invitee joined. The count checks in the harness show that both
      the Coordinator and Vendor2 joined.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-10-001

  - id: DEMOMA-16-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RVCV-handoff scenario expected-semantic-types list MUST include
      `invite_actor_to_case`, `accept_invite_actor_to_case` and
      `accept_case_ownership_transfer` in addition
      to the universal types (DEMOMA-16-001), because Vendor1 invites
      Coordinator, the Coordinator accepts the invitation and then accepts the
      ownership transfer to become the new CASE_OWNER (TRIG-11-002, CM-21-007),
      and Coordinator then invites Vendor2 who also accepts.
    rationale: >-
      The ownership transfer is the step that makes this scenario different from
      RVCV-extension. Without `accept_case_ownership_transfer` in the list, a run in
      which the Coordinator never became the Case Owner can still pass the type check.
      The invitation types show that the invitation step ran. The count checks in the
      harness show that both the Coordinator and Vendor2 joined.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-11-001

  - id: DEMOMA-16-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-handoff scenario expected-semantic-types list MUST include
      `invite_actor_to_case`, `accept_invite_actor_to_case` and
      `accept_case_ownership_transfer` in addition
      to the universal types (DEMOMA-16-001), because C1 invites C2,
      C2 accepts the invitation and then accepts the ownership transfer to
      become the new CASE_OWNER (TRIG-11-002, CM-21-007), and C2 then invites
      the Vendor who also accepts.
    rationale: >-
      The ownership transfer is the step that makes this scenario different from
      RCCV-extension. Without `accept_case_ownership_transfer` in the list, a run in
      which C2 never became the Case Owner can still pass the type check. The invitation
      types show that the invitation step ran. The count checks in the harness show that
      both C2 and the Vendor joined.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-14-009

  - id: DEMOMA-16-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV scenario expected-semantic-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition
      to the universal types (DEMOMA-16-001), because the Coordinator
      invites the Vendor into the case and the Vendor explicitly accepts via
      the `accept-case-invite` trigger. The Reporter is seated at
      case creation and is not invited (DEMOMA-12-003).
    rationale: >-
      Without these two types, a run in which the Vendor never joined can still pass
      the type check. The Reporter is seated at case creation, so the invitation types
      in RCV are evidence about the Vendor only.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-12-008

  - id: DEMOMA-16-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The per-scenario expected-semantic-types list in each
      `test/ci/invariants/test_XXX_invariants.py` file MUST be kept in
      sync with the corresponding DEMOMA-16-XXX spec requirement; when a
      new scenario phase is added or removed, both the spec and the test
      list MUST be updated in the same PR.
    rationale: >-
      The test list is the code form of the requirement. If the two drift, the test
      can check for a type that the scenario does not produce, or it can stop
      checking for a step that the scenario still needs. A step can then be lost
      without a failure. One change that updates both keeps them the same.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-004

  - id: DEMOMA-16-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario expected-semantic-types list MUST include
      `invite_actor_to_case`, `offer_case_participant`,
      `accept_invite_actor_to_case`, and `accept_actor_recommendation` in
      addition to the universal types (DEMOMA-16-001).
    rationale: >-
      RCVCV has two coordinators and two vendors. C1 invites V1 and C2 directly. C2
      suggests V2 through the suggest and approve flow (ADR-0026): C1 approves the
      recommendation, the CaseActor invites V2, and V2 accepts. Each listed type is the
      ledger evidence of one of these steps. A type that is missing shows a step that
      never happened. The count checks in the harness show that all three invitees
      joined.
    adr:
    - ADR-0026
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-19-001

  - id: DEMOMA-16-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCCV-extension scenario expected-semantic-types list MUST include
      `invite_actor_to_case`, `offer_case_participant`,
      `accept_invite_actor_to_case`, and `accept_actor_recommendation` in
      addition to the universal types (DEMOMA-16-001), because
      Coordinator1 invites Coordinator2, Coordinator2 uses the ADR-0026
      suggest-actor flow (`offer_case_participant`) to propose the Vendor,
      Coordinator1 approves the recommendation (`accept_actor_recommendation`),
      CaseActor converts the approval into an invitation, and the Vendor
      explicitly accepts via the `accept-case-invite` trigger.
    rationale: >-
      Each listed type is the ledger evidence of one step in the suggest and approve
      flow. If one is missing from the list, a run in which that step never happened can
      still pass. C2 and the Vendor each accept an invitation, so the presence of
      `accept_invite_actor_to_case` shows only that one of them joined. The count checks
      in the harness show that both joined.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-13-001

  - id: DEMOMA-16-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV-reject scenario expected-semantic-types list MUST include
      `invite_actor_to_case` and `reject_invite_actor_to_case` in addition to the
      universal types (DEMOMA-16-001), because the Coordinator invites the Vendor and
      the Vendor sends `Reject(Invite(Actor, VulnerabilityCaseStub))` (an
      invitation-layer rejection), which triggers
      `RejectInviteActorToCaseReceivedUseCase` on the CaseActor and produces the
      `reject_invite_actor_to_case` ledger entry. The Vendor never sends
      `Accept(Invite(Actor, VulnerabilityCaseStub))`, so `accept_invite_actor_to_case`
      does NOT appear in this scenario.
    rationale: >-
      The rejection is the step that this scenario exists to show, so its ledger entry
      must be in the list. The list must not contain `accept_invite_actor_to_case`,
      because a correct run never produces it. If it were in the list, every correct
      run would fail.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-27-002
  - id: DEMOMA-16-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the RCVCV scenario, the case-actor log MUST record `invite_actor_to_case`
      at least three times (C1 invites V1, C1 invites C2, and CaseActor invites V2
      via the ADR-0026 path) and `offer_case_participant` at least once (C2 suggests
      V2 to C1 via the ADR-0026 suggest-actor flow).
    rationale: >-
      These counts confirm that the multi-party invitation and suggest-actor flows
      were exercised end-to-end, not just that the semantic types appear at least once.
  - id: DEMOMA-16-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the RCVCV scenario, the case-actor log MUST record `accept_actor_recommendation`
      at least once (C1 approves C2's recommendation) and `accept_invite_actor_to_case`
      at least three times (V1, C2, and V2 each accept their respective invitations).
    rationale: >-
      These counts verify that every actor who received an invitation explicitly
      accepted, and that the ADR-0026 approval path was exercised.
  - id: DEMOMA-16-015
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The VC scenario expected-semantic-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition
      to the universal types (DEMOMA-16-001), because Vendor invites
      Coordinator into the case as `CVDRole.OBSERVER` and Coordinator
      explicitly accepts via the `accept-case-invite` trigger.
    rationale: >-
      Vendor is CASE_OWNER from self-reporting, so Vendor drives the direct
      `invite-actor-to-case` trigger (no suggest/approve chain). Coordinator
      accepts and becomes a signatory by accepting the embargo. No
      `offer_case_participant` or `accept_actor_recommendation` events are
      expected because there is no second-level recommendation in this
      two-actor scenario.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-25-001

  - id: DEMOMA-16-016
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV-embargo scenario expected-semantic-types list MUST include
      `invite_actor_to_case`, `accept_invite_actor_to_case`,
      `invite_to_embargo_on_case`, `accept_invite_to_embargo_on_case`,
      `activate_embargo_on_case` and `remove_embargo_event_from_case` in
      addition to the universal types (DEMOMA-16-001), because the Coordinator
      invites the Vendor and the Vendor accepts, the Reporter's embargo proposal
      and its relayed invitations are committed, the Vendor accepts it, the
      owner activates it (VAM-05-008), and the Coordinator terminates the
      embargo.
    rationale: >-
      The embargo semantic types are the ones the CASE_MANAGER's commit path emits
      (DEMOMA-20-006); the harness imports them from that code, so a rename
      there fails the harness rather than leaving it checking a stale string.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-20-006

  - id: DEMOMA-16-017
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVV-embargo scenario expected-semantic-types list MUST include
      `invite_actor_to_case`, `accept_invite_actor_to_case`,
      `invite_to_embargo_on_case`, `accept_invite_to_embargo_on_case`,
      `activate_embargo_on_case` and `remove_embargo_event_from_case` in
      addition to the universal types (DEMOMA-16-001), because the Coordinator
      invites both Vendors and they accept, the Reporter's and Vendor1's
      embargo proposals and their relayed invitations are committed, the other
      participants accept them, the owner activates each revision
      (VAM-05-008), and the embargo is torn down when the Reporter reports
      publication.
    rationale: >-
      The embargo semantic types are the ones the CASE_MANAGER's commit path emits
      (DEMOMA-21-007); the harness imports them from that code, so a rename
      there fails the harness rather than leaving it checking a stale string.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-21-007

  - id: DEMOMA-16-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVD scenario expected-semantic-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition to
      the universal types (DEMOMA-16-001), because the Coordinator invites
      Reporter, Vendor, and Deployer into the case, and all three explicitly accept
      via the `accept-case-invite` trigger.
    note: >-
      The RCVD scenario is unbuilt. This entry is the text from before #4136 and
      awaits RCVD planning, which decides who is invited once the Reporter is seated
      as reporter at case creation (DEMOMA-12-003).
    rationale: >-
      RCVD exercises a four-actor coordination chain with one full invitation
      cycle per non-case-owner actor; `invite_actor_to_case` and
      `accept_invite_actor_to_case` confirm the invitation/accept path was
      exercised for each. Unlike scenarios with ADR-0026 suggest-actor flows,
      RCVD uses only direct case-owner invitations.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-24-001

- id: DEMOMA-18
  title: In-Process Fuzz Simulation Scenario
  specs:
  - id: DEMOMA-18-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The fuzz simulation scenario MUST run entirely in-process with no
      HTTP servers, containers, or network I/O required; each actor MUST
      have its own isolated in-memory DataLayer.
    rationale: >-
      The scenario explores the protocol state space by chance, so it must run quickly
      and many times. Containers and network setup would make it too slow for local
      development and CI smoke tests. Separate in-memory DataLayers keep each actor
      separate, as in the container demos (DEMOMA-01-001).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-18-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The fuzz simulation scenario MUST support a configurable number of
      iterations N (default 10); each iteration MUST start with fresh
      in-memory DataLayers for all actors (no state carried across
      iterations).
    rationale: >-
      Each iteration is an independent probabilistic sample of the
      protocol state space. Shared state would cause later iterations to
      depend on earlier ones, undermining the exploration goal.
  - id: DEMOMA-18-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The fuzz simulation scenario MUST use STOCHASTIC call-out point
      bundles for all actors so that each call-out decision is drawn
      from the fuzzer node probability distribution rather than a
      deterministic default.
    rationale: >-
      The scenario's purpose is probabilistic state-space exploration.
      DETERMINISTIC bundles would produce an identical path on every
      iteration, defeating the simulation goal.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001
  - id: DEMOMA-18-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The fuzz simulation scenario MUST simulate in-process message
      delivery between actors by directly invoking the receiving actor's
      dispatcher with the emitted activity; no HTTP, ASGIEmitter, or
      real network transport is permitted.
    rationale: >-
      A direct call to the dispatcher of the receiving actor delivers each emitted
      activity without network setup. The receiver still runs its own received use case
      and behavior tree, so the simulation tests the protocol logic of both actors and
      not only that of the sender.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001
  - id: DEMOMA-18-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each iteration MUST log structured output at INFO level including:
      the iteration number, each call-out point node name and its
      SUCCESS/FAILURE outcome, and the final RM/EM/CS state per actor.
    rationale: >-
      Per-run logging is the primary diagnostic output of the scenario;
      it allows users to observe which protocol paths were exercised
      across iterations.
  - id: DEMOMA-18-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The fuzz simulation scenario MUST be accessible via the
      ``vultron demo fuzz`` CLI sub-command, accepting at minimum an
      ``--iterations N`` option; the default number of iterations MUST
      be documented in the CLI help text.
    rationale: >-
      Consistent with the existing ``vultron demo`` CLI structure
      (DC-01-001 through DC-01-005); the ``fuzz`` sub-command makes the
      scenario discoverable alongside other demo commands.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001
  - id: DEMOMA-18-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Existing deterministic demo scenarios MUST NOT be modified by the
      fuzz simulation scenario; the fuzz scenario MUST NOT import from
      or depend on any existing ``vultron/demo/scenario/`` module.
    rationale: >-
      The fuzz scenario is a standalone simulation tool; coupling it to
      deterministic scenario files would break their repeatability and
      make the fuzz scenario harder to isolate.
  - id: DEMOMA-18-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      A unit test in ``test/demo/`` MUST verify that the fuzz simulation
      scenario completes a single iteration without raising an exception;
      the test MUST run with a seeded RNG where possible.
    rationale: >-
      The test provides a regression guard confirming the scenario still
      runs after code changes, independent of the specific protocol path
      taken.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001

- id: DEMOMA-17
  title: Demo Code Reuse and DRY
  specs:
  - id: DEMOMA-17-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Before writing a second use of a pattern in a scenario file under
      `vultron/demo/scenario/`, the pattern MUST be extracted to
      `vultron/demo/helpers/` first. Scenario files MUST NOT copy-paste
      function bodies, polling loops, verification blocks, or any other
      logical unit from an existing scenario file.
    rationale: >-
      A scenario written by copying an earlier scenario copies its defects together with
      its correct patterns. A fix then lands in one copy and not in the others. A shared
      helper gives each pattern one place, so one fix reaches every scenario that uses
      the pattern.
    relationships:
    - rel_type: refines
      spec_id: CS-22-001
      note: MUST-level specialisation of the project-wide SHOULD rule for demo scenario files
    - rel_type: refines
      spec_id: DEMOMA-03-001
      note: acceptance test scenario files are also subject to this rule
  - id: DEMOMA-17-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2573'
    statement: >-
      A change that consolidates demo code (extracting or merging helpers, phases or
      scenario bodies under DEMOMA-17-001) MUST NOT change what any demo scenario
      passes or fails on. A verdict changed by a consolidation PR MUST instead be
      made in its own change, with its own issue.
    rationale: >-
      A consolidation should change only where the code is, not what it checks. If it
      also makes a check weaker or stronger, the change in the verdict is hidden
      inside a refactor, where reviewers do not look for it. Its own change, with its
      own issue, makes the verdict change visible and lets reviewers judge it on its
      own.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001

- id: DEMOMA-19
  title: RCVCV 5-Party Scenario (Reporter + Coordinator1 + Vendor1 + Coordinator2 + Vendor2)
  trigger:
    type: scenario_start
    value: rcvcv
  description: >-
    Specifies the RCVCV multi-actor demo scenario: a 5-party CVD case with
    Reporter (F), Coordinator1 (C1), Vendor1 (V1), Coordinator2 (C2), and
    Vendor2 (V2). C1 receives the report and creates the case. C1 invites V1
    and C2. C2 suggests V2 to C1 via the ADR-0026 suggest-actor flow; C1
    approves; CaseActor invites V2. V1 holds only CVDRole.VENDOR (reaches VFd,
    fix-ready, but has no deploy path). V2 holds both CVDRole.VENDOR and
    CVDRole.DEPLOYER (full VFD path). V1 triggers CS.P first, causing
    CaseActor to initiate embargo teardown via ThreatTerminationBranchNode.
    This scenario is the first to exercise: (a) two independent coordinators,
    (b) two vendor actors with different role sets, (c) embargo teardown
    triggered by a non-CASE_OWNER vendor participant's publication.
  specs:
  - id: DEMOMA-19-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario MUST seat V2 (VendorDeployer) in a character-actor
      slot of the fixed cast (DEMOCI-11-020).
    rationale: >-
      The RCVCV scenario needs five independent actor containers — one per
      scenario actor — to force all inter-actor communication over the network
      wire protocol (DEMOMA-01-001). Keeping one actor per container preserves
      the architectural isolation invariant that prevents intra-container
      data-layer shortcuts (ADR-0042). V2 holds VENDOR and DEPLOYER from the
      Invite that seats it, so its container declares no default case roles
      (DEMOCI-11-021).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-02-001
    - rel_type: refines
      spec_id: DEMOCI-11-020

  - id: DEMOMA-19-023
    priority: MUST
    kind: project
    statement: >-
      Each cast slot RCVCV seats MUST have a service built from the shared
      `*actor-service` anchor, with its own volume, port variable and actor
      id.
    rationale: >-
      One anchor for every actor service keeps the image build and the health
      check identical across the cast, so a per-container stanza holds only
      what actually differs. Its seed config is DEMOCI-11-028. One actor per
      container preserves the isolation invariant that prevents
      intra-container data-layer shortcuts (ADR-0042).
    verification: >-
      Tests assert, over every cast slot, that the compose file gives it its own
      data volume, publishes it on its own host-port variable, and configures the
      actor id its slot hosts. The shared anchor itself is the remaining debt.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-19-001
    - rel_type: refines
      spec_id: DEMOMA-02-001

  - id: DEMOMA-19-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      A `seed_containers_rcvcv` function MUST be added to
      `vultron/demo/helpers/seeding.py` accepting five `DataLayerClient`
      arguments (reporter_client, c1_client, v1_client, c2_client, v2_client)
      and five optional deterministic actor ID arguments.
    rationale: >-
      The 5-actor cross-registration ensures that every actor can locate and
      deliver activities to every other actor without runtime DNS surprises.
      The N×(N-1) pattern is established by all existing multi-actor seed
      functions (seed_containers_rvv, seed_containers_rvcv, seed_containers_rccv).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-19-001
    - rel_type: refines
      spec_id: DEMOMA-02-002

  - id: DEMOMA-19-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario file MUST be implemented at
      `vultron/demo/scenario/rcvcv_demo.py`.
    rationale: >-
      The scenario registry derives the script path, the test harness path and the
      narrative path from the scenario name (ADR-0098, DEMOCI-11-003). A script at any
      other path is not found by these tools. The fixed path keeps the registered
      `rcvcv` scenario and its files together.
    adr:
    - ADR-0098
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: DEMOMA-17-001

  - id: DEMOMA-19-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the RCVCV scenario, V1 MUST be assigned `CVDRole.VENDOR` only (no
      DEPLOYER role) and V2 MUST be assigned both `CVDRole.VENDOR` and
      `CVDRole.DEPLOYER`.
    rationale: >-
      V1's vendor-only role set (stops at VFd) and V2's vendor-deployer role
      set (reaches VFD) are the key differentiators of this scenario. The
      distinction verifies DEMOMA-15-001's precondition guards:
      `verify_fix_ready` requires VENDOR; `verify_fix_deployed` requires
      DEPLOYER. Using V1 in a `verify_fix_deployed` call would exercise the
      wrong path and mask a future regression where the d→D BT gate is weakened.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-15-001
    - rel_type: refines
      spec_id: DEMOMA-19-003

  - id: DEMOMA-19-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the RCVCV scenario, V1 MUST publish before V2; after V1 sends its
      participant status update indicating CS.P, the scenario MUST wait for
      CaseActor to process that update and emit the embargo teardown
      (EM.EXITED) before V2 publishes.
    rationale: >-
      V1 publishes first so that the scenario tests a teardown that a VENDOR participant
      who is not the Case Owner starts. ThreatTerminationBranchNode does not gate
      teardown on the role of the sender (RSH-03-002). If V2 publishes before the
      teardown commits, the two publications race, and the ledger order changes from run
      to run.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-07-003
    - rel_type: refines
      spec_id: DEMOMA-19-003

  - id: DEMOMA-19-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario MUST be registered in the scenario registry under the name
      `rcvcv`. The CLI generates the `rcvcv` sub-command from the registry
      (DEMOCI-11-011), consistent with the naming convention of existing scenario
      commands (rv, rvv, rcv, rvcv, rccv).
    rationale: >-
      The CLI is the single entry point for all demo scenarios (DC-01-001), and it
      builds one sub-command for each registered scenario (DEMOCI-11-011). A scenario
      that is not registered is not reachable from `vultron demo rcvcv`, and it has no
      entry in the CI matrix.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001

  - id: DEMOMA-19-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario MUST be registered with the scenario registry
      (DEMOCI-11-001), so that its generated `.github/demo-scenarios.json`
      entry (DEMOCI-11-004) adds it to the CI matrix.
    rationale: >-
      CI coverage of all demo scenarios is required by DEMOCI-04-001. RCVCV is
      the widest scenario, so it is the one that sets the size of the cast.
      DEMOMA-19-023 is what places each of those containers in the compose file
      CI starts as a whole; this requirement no longer carries that half.
      Scenario-role names in devlogs match the names used in scenario code,
      making log archaeology easier.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-19-001

  - id: DEMOMA-19-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      An invariant harness file MUST be created at
      `test/ci/invariants/test_rcvcv_invariants.py` with `_DEMO_NAME = "rcvcv"`,
      a `_CHAIN_ACTORS` list of scenario-role actor names (reporter, c1, v1, c2,
      v2, case-actor), and `_RCVCV_EXPECTED_SEMANTIC_TYPES` per DEMOMA-16-009.
    rationale: >-
      The invariant harness is the CI acceptance test for the scenario. The
      scenario-specific checks show that each of the three invitees was invited and
      accepted, and that C2 made its suggestion. The chain checks for each actor show
      that each of the six devlogs holds a ledger with no gaps.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-16-009
    - rel_type: refines
      spec_id: DEMOMA-19-003

  - id: DEMOMA-19-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario MUST exercise the ADR-0026 suggest-actor flow for V2's
      onboarding: C2 posts `suggest-actor-to-case`, CaseActor forwards an
      `Offer(CaseParticipant)` to C1, C1 posts `accept-actor-recommendation`,
      CaseActor sends `Invite` to V2, and V2 posts `accept-case-invite`.
    rationale: >-
      This flow adds a new participant through a suggestion from a coordinator that is
      not the Case Owner (ADR-0026). It is the path that admits V2. The invitation
      must arrive through normal delivery and be found by polling. A demo that posts
      the invitation into the inbox of V2 would skip the delivery path that the
      scenario exists to test.
    adr:
    - ADR-0026
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-003
    - rel_type: refines
      spec_id: DEMOMA-19-003
  - id: DEMOMA-19-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Every cast container the RCVCV scenario seats MUST have its own seed
      config in `docker/seed-configs/`.
    rationale: >-
      RCVCV is the widest scenario, so it is the first to need a seed config
      for every cast container. The cast-wide shape of those configs is
      DEMOCI-11-028 (the local actor), DEMOCI-11-029 (the peer mesh) and
      DEMOCI-11-033 (the display name), which together replace the id, name
      and peer list this requirement used to spell for one container.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-11-028
  - id: DEMOMA-19-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `demo-runner` service MUST wait for every cast container the RCVCV
      scenario seats.
    rationale: >-
      RCVCV seats every cast container, so its run is the one that waits for
      all of them. The cast-wide form of the wait and of the matching
      environment variables is DEMOCI-11-030 and DEMOCI-11-031.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-11-030
    - rel_type: refines
      spec_id: DEMOCI-11-031
  - id: DEMOMA-19-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `seed_containers_rcvcv` function MUST create five local actors: Reporter
      (Person), Coordinator1 (Organization), V1 named Vendor (Organization),
      Coordinator2 (Organization), and VendorDeployer (Organization).
    rationale: >-
      Each of the five scenario participants requires a typed local actor record
      in its container's DataLayer before cross-registration. V1 is named Vendor,
      as the one Vendor of rcv is, because rcvcv shares rcv's path up to C1's
      decision and their ledgers must match there, the name included
      (DEMOCI-11-017).
  - id: DEMOMA-19-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `seed_containers_rcvcv` function MUST register every actor as a known
      peer on each of the other four containers (N×(N-1) = 20 cross-registrations
      total), following the same Phase 1 / Phase 2 pattern as `seed_containers_rccv`.
    rationale: >-
      Full cross-registration ensures every actor can locate and deliver activities
      to every other actor without runtime DNS surprises.
  - id: DEMOMA-19-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario MUST implement the following phases in order:
      report_submission, c2_suggests_v2, sync_verification, notes_exchange,
      fix_lifecycle, publication, case_closure, and dump_case_ledgers.
    rationale: >-
      Each phase depends on the state that the phases before it create. Invitations
      come before suggestions, the fix lifecycle comes before publication, and
      publication comes before closure. The ledger dump comes last so that it holds
      the complete run. The fixed order makes a failure point to one phase.
    preconditions:
    - description: >-
        All six containers running (Reporter, C1, V1, C2, V2, CaseActor); all
        actors seeded and cross-registered.
    steps:
    - order: 1
      actor: reporter
      action: >-
        report_submission phase — POST submit-report trigger to C1, which then
        invites V1; the Reporter asks, C1 answers and V1 adds its status with
        add-note-to-case; C1 then invites C2
      expected: >-
        C1 creates the VulnerabilityCase and holds CVDRole.CASE_OWNER; V1 and C2
        accept their invitations, and C2's invitation follows the three notes
    - order: 2
      actor: c2
      action: >-
        c2_suggests_v2 phase — drive the ADR-0026 suggest-actor flow for V2's
        onboarding (DEMOMA-19-009)
      expected: >-
        C2 posts suggest-actor-to-case; C1 posts accept-actor-recommendation;
        CaseActor invites V2; V2 posts accept-case-invite
    - order: 3
      actor: demo-script
      action: sync_verification phase — poll every replica for the participant set
      expected: all five participants are present on every replica
    - order: 4
      actor: demo-script
      action: >-
        joiner notes phase — once joined, C2 and V2 add their notes with
        add-note-to-case
      expected: add_note_to_case is recorded in the case-actor log
    - order: 5
      actor: demo-script
      action: >-
        fix_lifecycle phase — advance V1 to VFd and V2 to VFD, calling the
        verification helpers named by DEMOMA-19-015
      expected: >-
        verify_fix_ready passes for V1 and V2; verify_fix_deployed passes for V2
        only, because V1 holds no DEPLOYER role
    - order: 6
      actor: demo-script
      action: publication phase — V1 publishes, then V2 (DEMOMA-19-005)
      expected: >-
        CaseActor emits the embargo teardown (EM.EXITED) after V1's CS.P update
        and before V2 publishes
    - order: 7
      actor: demo-script
      action: case_closure phase — close the case on every participant
      expected: >-
        RM.CLOSED for every participant in the CASE_MANAGER's store; each
        participant's replica ends at the entries recording its own closure
        (CM-23-004)
    - order: 8
      actor: demo-script
      action: dump_case_ledgers phase
      expected: one case-ledger JSONL artifact per actor under devlogs/rcvcv/
    postconditions:
    - description: >-
        EM.EXITED after V1 reaches CS.P (DEMOMA-19-005); V1 at VFd and V2 at
        VFD (DEMOMA-19-015); every participant at RM.CLOSED, which the universal
        Invariant 7 check
        (`test_invariant_7_log_terminates_all_rm_closed`) asserts for every
        scenario rather than this group. Nothing beyond those is restated here:
        a postcondition is a projection of the group's normative statements, and
        asserting a state no statement carries would make this block the only
        place that requirement exists (MS-16-002).
  - id: DEMOMA-19-015
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The fix lifecycle phase MUST call `verify_fix_ready` for both V1 and V2 after
      they each advance to VFd, and MUST call `verify_fix_deployed` for V2 only after
      V2 advances to VFD.
    rationale: >-
      V1's vendor-only role set (stops at VFd) and V2's vendor-deployer role set
      (reaches VFD) are the key differentiators of the RCVCV scenario.
  - id: DEMOMA-19-016
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      `verify_fix_ready` MUST NOT be called with a DEPLOYER-only actor ID;
      `verify_fix_deployed` MUST NOT be called with a VENDOR-only (no DEPLOYER)
      actor ID such as V1.
    rationale: >-
      Calling the wrong helper with the wrong actor masks future regressions where
      the BT gate is weakened; the precondition guards surface the error immediately.
  - id: DEMOMA-19-017
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `verify_publicly_disclosed` check MUST be called after both V1 and V2
      have published in the RCVCV scenario.
    rationale: >-
      Calling the check before both actors have published may produce a spurious
      failure if the second publication has not yet propagated.
  - id: DEMOMA-19-018
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The CI devlogs directory for the RCVCV run MUST use the scenario-role naming
      convention: `reporter`, `c1`, `v1`, `c2`, `v2`, `case-actor` (not docker
      service names).
    rationale: >-
      Scenario-role names match the names used in scenario code, making log
      archaeology easier than using docker service names.
  - id: DEMOMA-19-019
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV invariant harness MUST define the universal invariant tests
      (Invariants 1–5) plus at minimum these scenario-specific invariant tests:
      `invite_actor_to_case` appears at least three times (C1→V1, C1→C2,
      CaseActor→V2), `offer_case_participant` appears at least once (C2 suggests
      V2 via ADR-0026), and `accept_invite_actor_to_case` appears at least three
      times (V1, C2, V2 each accept).
    rationale: >-
      The three scenario-specific count checks verify that the multi-party
      invitation and suggest-actor flows were exercised end-to-end.
  - id: DEMOMA-19-020
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV invariant harness MUST load its replicas via
      `load_devlogs(demo_name=_DEMO_NAME)` from `test/ci/invariants/common.py`,
      following the same self-contained pattern as every prior scenario harness.
    rationale: >-
      Consistent loading via common.py ensures the harness can be run standalone
      without importing scenario module state.
  - id: DEMOMA-19-021
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario MUST be routed to the invariant harness file by the
      `demo`/`test_file` pair in its generated `.github/demo-scenarios.json`
      entry (DEMOCI-11-004); harnesses MUST NOT be registered via a
      `conftest.py` scenario mapping.
    rationale: >-
      The harness path is derived from the registered scenario name by
      convention (DEMOCI-11-003) and reaches CI only through the generated
      matrix; conftest.py mappings are not consulted by the CI runner.
  - id: DEMOMA-19-022
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVCV scenario MUST use polling helpers (not `post_to_inbox_and_wait`) to
      deliver the invite to V2's inbox, consistent with the no-mail-carrying rule in
      `vultron/demo/AGENTS.md`.
    rationale: >-
      The no-mail-carrying rule requires that the demo orchestrator never post
      directly to another actor's inbox; the invite must arrive via the normal
      routing path and be detected by polling.

- id: DEMOMA-20
  title: RCV Embargo Scenario (Reporter + Coordinator + Vendor, deliberate termination)
  trigger:
    type: scenario_start
    value: rcv-embargo
  description: >-
    Specifies the rcv-embargo demo scenario: a 3-party CVD case with Reporter
    (R), Coordinator (C), and Vendor (V), exercising embargo lifecycle variations
    (b) post-submission negotiation and (e) deliberate early termination. After
    report submission and case setup, R proposes an embargo (EP). Case creation
    has already activated the default embargo (EP-04-001), so the case is at
    EM.ACTIVE before R proposes and R's proposal revises that embargo
    (ACTIVE → REVISE). V and C accept the Invite; C, as case owner, activates the
    revision (EC), returning EM to ACTIVE with the revision as the active embargo and
    all three parties as signatories to it. The fix lifecycle then proceeds. Before
    the natural embargo window expires, C deliberately terminates the embargo
    (ET), advancing EM to EXITED. The case continues to the normal P-transition
    and closure sequence. This scenario is the first to exercise: (a) embargo
    proposal initiated after report submission (variation b), (b) the full
    EV→EC→ET arc (propose, activate, terminate without a further revision),
    (c) each party's consent row for the revised embargo passing through
    INVITED → AGREED (signatory to the active embargo) for all three parties.
  specs:
  - id: DEMOMA-20-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcv-embargo scenario file MUST be implemented at
      `vultron/demo/scenario/rcv_embargo_demo.py`.
    rationale: >-
      The scenario registry derives the script path, the invariant harness path and the
      narrative path from the scenario name (ADR-0098, DEMOCI-11-003). Discovery does
      not find a script outside the scenario package, and a script in that package with
      a different name fails registration. The fixed path keeps the registered
      `rcv-embargo` scenario and its files together.
    adr:
    - ADR-0098
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-12-001

  - id: DEMOMA-20-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      An exchange helper function `demo_propose_and_activate_embargo` MUST be
      added to `vultron/demo/exchange/` accepting `(reporter, coordinator,
      vendor, case)` arguments — each an `ActorSession` (DEMOMA-26-001), because a
      trigger addresses an actor as well as its container, and `case` the
      `VulnerabilityCase`; it MUST execute
      the relayed propose-and-activate sequence (EP-09): the reporter posts
      `trigger_propose_embargo`, which sends the proposal to the CASE_MANAGER;
      the coordinator and the vendor each poll their own replica for the
      `Invite(EmbargoEvent)` the CASE_MANAGER relays to them and post
      `trigger_accept_embargo` — the coordinator's, as case owner, activates the
      embargo and the vendor's records its consent; the helper then polls every
      replica for `em_state == EM.ACTIVE`. No participant polls for another
      participant's message.
    rationale: >-
      The CASE_MANAGER relays every embargo proposal and records each step (ADR-0113).
      Each participant then reads the relayed `Invite(EmbargoEvent)` from its own
      replica. One helper runs that relayed sequence the same way in the rcv-embargo
      and rcvv-embargo scenarios (DEMOMA-17-001), so both scenarios test the same
      protocol steps.
    adr:
    - ADR-0113
    note: >-
      The sequence was first written in the peer voice ("coordinator polls for
      the EP message"); under ADR-0113 the proposal reaches the other
      participants only as the CASE_MANAGER's relayed Invite, and their replicas
      move only through the ledger (#3918). A case opened by a report already
      holds the default embargo (EP-04-001), so in the rcv-embargo scenario the
      sequence runs as a revision (`ACTIVE → REVISE → ACTIVE`); from `EM.NONE`
      it runs `NONE → PROPOSED → ACTIVE`. The helper is the same either way.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001

  - id: DEMOMA-20-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      An exchange helper function `demo_terminate_embargo` MUST be added to
      `vultron/demo/exchange/` accepting `(terminating, case)` arguments — where
      `terminating` is the `ActorSession` of any signatory participant authorized
      to terminate (DEMOMA-26-001) — and posting `trigger_terminate_embargo`.
    rationale: >-
      The terminate-embargo exchange is a single-actor trigger that can be
      reused by any scenario exercising variation (e). Keeping it in
      `vultron/demo/exchange/` (not inline in the scenario file) satisfies
      DEMOMA-17-001. Restricting assertions to the terminating actor's EM state
      keeps the helper side-effect-free with respect to peer-replica polling,
      which varies by scenario topology.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: refines
      spec_id: DEMOMA-20-002

  - id: DEMOMA-20-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcv-embargo scenario MUST be registered in the scenario registry under the
      name `rcv-embargo`. The CLI generates the `rcv-embargo` sub-command from the
      registry (DEMOCI-11-011), consistent with the naming convention of existing
      scenario commands.
    rationale: >-
      Each scenario has one CLI sub-command, which the CLI builds from the registry, so
      a developer can run it by name (DC-01-001, DEMOCI-11-011). The `rcv-embargo` name
      tells the reader that this scenario is about the embargo lifecycle. It also keeps
      the name different from the base `rcv` scenario (DEMOMA-12).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001

  - id: DEMOMA-20-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcv-embargo scenario MUST be registered with `in_pr_set=True`
      (DEMOCI-11-001), so that its generated `.github/demo-scenarios.json`
      entry (DEMOCI-11-004) carries `"full_suite_only": false` (runs on every
      PR).
      The CI devlogs directory for the run MUST use the scenario-role naming
      convention: `reporter`, `coordinator`, `vendor`, `case-actor`.
    rationale: >-
      The embargo lifecycle is a core part of the protocol, so a defect in it must be
      found on the pull request that causes it. A scenario that runs only in the full
      suite finds that defect later, after the pull request merges. A scenario in the PR
      set runs on each pull request that changes code the demos use.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001

  - id: DEMOMA-20-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcv-embargo scenario invariant harness MUST verify that the case ledger records,
      in order, the semantic types the CASE_MANAGER commits for the embargo proposal, the
      owner's acceptance and the termination. The semantic type strings used in the invariant
      check MUST be the ones the CASE_MANAGER's commit path emits, read from the code rather
      than hand-listed here.
    rationale: >-
      The invariants confirm that the ledger records the proposal, the acceptance by the
      Case Owner and the termination, and in that order. A run that ends without an
      error does not show this. If the test listed the type strings by hand, a rename in
      the code would leave it checking for strings that do not occur. Strings read from
      the code change with the code.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-16-009
    - rel_type: refines
      spec_id: DEMOMA-20-001
  - id: DEMOMA-20-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcv-embargo scenario MUST be structured with the following phases
      executed in order: (1) report_submission, (2) embargo_proposal,
      (3) fix_lifecycle, (4) embargo_termination, (5) publication,
      (6) case_closure, and (7) dump_case_ledgers.
    rationale: >-
      The phased structure mirrors prior RCV/RVCV scenarios while inserting
      embargo lifecycle phases between report setup and fix-lifecycle.
    preconditions:
    - description: >-
        All four containers running (Reporter, Coordinator, Vendor, CaseActor);
        all actors seeded and cross-registered; no embargo in force.
    steps:
    - order: 1
      actor: reporter
      action: >-
        report_submission phase — POST submit-report trigger to the Coordinator,
        which engages the case and invites the Vendor
      expected: >-
        the case exists on every replica; EM has no active embargo; no
        participant holds a consent row for an embargo
    - order: 2
      actor: reporter
      action: >-
        embargo_proposal phase — call demo_propose_and_activate_embargo
        (DEMOMA-20-002): R posts trigger_propose_embargo to the CASE_MANAGER;
        C and V answer the relayed Invites with trigger_accept_embargo
      expected: >-
        em_state == EM.ACTIVE on every replica after the ledger fan-out and
        R, C and V are each a signatory to the active embargo (DEMOMA-20-009)
    - order: 3
      actor: demo-script
      action: fix_lifecycle phase — advance the Vendor through the fix lifecycle
      expected: >-
        the fix lifecycle completes with the embargo still ACTIVE; the EM state
        is asserted before the next phase begins (DEMOMA-20-008)
    - order: 4
      actor: coordinator
      action: >-
        embargo_termination phase — call demo_terminate_embargo
        (DEMOMA-20-003), posting trigger_terminate_embargo before the window
        expires
      expected: >-
        em_state == EM.EXITED on the CASE_MANAGER's canonical case
        (DEMOMA-20-011)
    - order: 5
      actor: demo-script
      action: publication phase — drive the P-transition for each participant
      expected: PXA advances to Pxa on every replica
    - order: 6
      actor: demo-script
      action: case_closure phase — close the case on every participant
      expected: >-
        RM.CLOSED for every participant in the CASE_MANAGER's store; each
        participant's replica ends at the entries recording its own closure
        (CM-23-004)
    - order: 7
      actor: demo-script
      action: dump_case_ledgers phase
      expected: >-
        one case-ledger JSONL artifact per actor under devlogs/rcv-embargo/,
        recording the proposal, the owner's acceptance and the termination
        (DEMOMA-20-006)
    postconditions:
    - description: >-
        EM.EXITED after a deliberate termination (variation e, DEMOMA-20-011);
        every participant at RM.CLOSED, which the universal Invariant 7 check
        (`test_invariant_7_log_terminates_all_rm_closed`) asserts for every
        scenario rather than this group. Nothing beyond those is restated here —
        see DEMOMA-19-014's postcondition for why.
  - id: DEMOMA-20-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After each phase of the rcv-embargo scenario, the scenario MUST assert
      the expected EM state before proceeding to the next phase.
    rationale: >-
      Phase-boundary EM assertions catch regressions where an embargo trigger
      silently fails and the scenario continues in an unexpected state.
  - id: DEMOMA-20-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After completing the propose-activate sequence, `demo_propose_and_activate_embargo`
      MUST assert `em_state == EM.ACTIVE` on the coordinator's case replica and
      that R, C and V are each a signatory to the active embargo (their consent row for it
      is `AGREED`).
    rationale: >-
      These post-conditions confirm that all three parties successfully enrolled in
      the embargo before the scenario advances.
  - id: DEMOMA-20-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `demo_propose_and_activate_embargo` helper MUST use `demo_step` and
      `demo_check` for all assertions, consistent with existing exchange helpers.
    rationale: >-
      Using the shared assertion utilities keeps failure reporting consistent
      across all exchange helpers.
  - id: DEMOMA-20-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After delivery of `trigger_terminate_embargo`, `demo_terminate_embargo`
      MUST poll the CASE_MANAGER's canonical case for `em_state == EM.EXITED`
      and assert it using `demo_check`.
    rationale: >-
      The CASE_MANAGER decides and commits the termination. The replica of the
      terminating actor changes only when the CASE_MANAGER announces that commit
      (EP-09-008). A read of that replica just after delivery can show the old state.
      A poll of the canonical case shows that the teardown was committed before the
      helper returns.
  - id: DEMOMA-20-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      `demo_terminate_embargo` MUST NOT assert PEC states for other participants;
      PEC propagation is asynchronous and belongs in scenario-level phase
      assertions, not in the exchange helper.
    rationale: >-
      Asserting peer PEC states in the exchange helper introduces a race condition;
      propagation timing varies by topology and scenario.

- id: DEMOMA-21
  title: RCVV Embargo Scenario (Reporter + Coordinator + V1 + V2, revision and accidental collapse)
  trigger:
    type: scenario_start
    value: rcvv-embargo
  description: >-
    Specifies the rcvv-embargo demo scenario: a 4-party CVD case with Reporter
    (R), Coordinator (C), Vendor1 (V1), and Vendor2 (V2), exercising embargo
    lifecycle variations (b) post-submission negotiation, (c) revision during
    active embargo (EV→EC), (f) deliberate notification delay for V2
    (late invitation simulating a short-deadline vendor), and (d) accidental
    collapse via CS.P. After R proposes and C accepts an initial embargo (EP→EA),
    EM reaches ACTIVE with R, C, and V1 as signatories. C then proposes a
    revision (EV), V1 accepts the revision Invite, C activates the revision (EC),
    and EM returns to ACTIVE with updated terms.
    V2 is not invited until after the revision is accepted, simulating a
    coordinator holding off on inviting a short-deadline vendor until the
    embargo window is near its close. V2 accepts the case invite and becomes
    a signatory. Finally, R publishes (CS.P fires), triggering
    `ThreatTerminationBranchNode` which auto-terminates the embargo (EM→EXITED).
    This scenario is the first to exercise: (a) an embargo revision cycle
    (EV→EC arc), (b) a late-invitee V2 joining an active embargo (consent
    row INVITED→AGREED after EM.ACTIVE), (c) accidental embargo collapse via
    external P-event rather than deliberate termination.
  specs:
  - id: DEMOMA-21-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcvv-embargo scenario file MUST be implemented at
      `vultron/demo/scenario/rcvv_embargo_demo.py`.
    rationale: >-
      The scenario registry derives the script path, the invariant harness path and the
      narrative path from the scenario name (ADR-0098, DEMOCI-11-003). Discovery does
      not find a script outside the scenario package, and a script in that package with
      a different name fails registration. The fixed path keeps the registered
      `rcvv-embargo` scenario and its files together.
    adr:
    - ADR-0098
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-12-001

  - id: DEMOMA-21-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      An exchange helper function `demo_propose_embargo_revision` MUST be added
      to `vultron/demo/exchange/` accepting `(proposing, accepting, owner,
      case)` arguments — each of the first three an `ActorSession`
      (DEMOMA-26-001) — where `owner` MAY be the same session as `proposing`; it
      MUST execute the relayed
      revision sequence (EP-09): `proposing` posts
      `trigger_propose_embargo_revision`, which sends the proposal to the
      CASE_MANAGER (canonical `em_state: ACTIVE → REVISE` at the manager);
      `accepting` polls its own replica for the relayed
      `Invite(EmbargoEvent)` and posts `trigger_accept_embargo`, which records
      its consent and moves no EM state; `owner` posts
      `trigger_accept_embargo`, which as the case owner's answer activates the
      revision (canonical `em_state: REVISE → ACTIVE`); the helper then polls
      every replica for `em_state == EM.ACTIVE`.
    rationale: >-
      The CASE_MANAGER relays every embargo revision, and only the answer of the Case
      Owner decides it (ADR-0113). An answer from another participant records its
      consent. One shared helper holds this relayed revision sequence, so a scenario
      does not repeat the steps in its own module (DEMOMA-17-001). Accepting a revision
      uses the same `trigger_accept_embargo` endpoint as accepting a proposal, so no new
      endpoint is needed.
    adr:
    - ADR-0113
    note: >-
      The sequence was first written in the peer voice, with a non-owner's
      acceptance moving `REVISE → ACTIVE`; under ADR-0113 only the owner's
      answer decides the embargo (EP-09-005), a non-owner's answer is a consent
      record, and both reach every replica through the ledger (#3918).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: refines
      spec_id: DEMOMA-20-002

  - id: DEMOMA-21-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The v2_late_invite phase of rcvv-embargo MUST invite V2 to the case only
      after the embargo revision (phase 3) is complete and `em_state` is confirmed
      ACTIVE; on receiving the case invite, V2 MUST accept the current embargo
      event, becoming a signatory to it (its consent row for the embargo is `AGREED`).
    rationale: >-
      Inviting V2 after the revision is complete — rather than before — is the
      defining characteristic of variation (f): the coordinator delays
      notification of a short-deadline vendor until the embargo terms are
      settled. Asserting that V2 is a signatory before fix_lifecycle ensures that
      V2 is fully enrolled in the embargo before it is accidentally collapsed by
      CS.P, making the ledger record unambiguous about V2's consent at time of
      collapse.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-003
    - rel_type: refines
      spec_id: DEMOMA-21-001

  - id: DEMOMA-21-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The accidental_collapse phase of rcvv-embargo MUST trigger the P-transition
      by calling `actor_notifies_published` on the reporter's client; the scenario
      MUST then poll for CaseActor to emit the embargo teardown (EM.EXITED via
      `ThreatTerminationBranchNode`) before asserting `em_state == EM.EXITED` on
      the coordinator's replica.
    rationale: >-
      Variation (d) specifically exercises the accidental/automatic embargo
      collapse path rather than the deliberate termination (ET) path.
      `ThreatTerminationBranchNode` fires when CS.P is detected on the CaseActor,
      emitting the EM termination activity automatically. Using `actor_notifies_published`
      from `vultron/demo/helpers/actions.py` exercises this code path end-to-end.
      Calling `trigger_terminate_embargo` directly would test variation (e)
      instead and would not exercise `ThreatTerminationBranchNode`.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-21-001
    - rel_type: refines
      spec_id: DEMOMA-07-003

  - id: DEMOMA-21-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcvv-embargo scenario MUST be registered in the scenario registry under the
      name `rcvv-embargo`. The CLI generates the `rcvv-embargo` sub-command from the
      registry (DEMOCI-11-011), consistent with the naming convention of existing
      scenario commands.
    rationale: >-
      Each scenario has one CLI sub-command, so a developer can run it by name
      (DC-01-001). The CLI builds that sub-command from the registry (DEMOCI-11-011).
      Without the registration, the scenario can run only through its module, and the
      CLI does not show that the scenario exists.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001

  - id: DEMOMA-21-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcvv-embargo scenario MUST be registered with `in_pr_set=True`
      (DEMOCI-11-001), so that its generated `.github/demo-scenarios.json`
      entry (DEMOCI-11-004) carries `"full_suite_only": false` (runs on every
      PR).
      The CI devlogs directory for the run MUST use the scenario-role naming
      convention: `reporter`, `coordinator`, `vendor`, `vendor2`, `case-actor`.
    rationale: >-
      The revision and the collapse of an embargo are core parts of the protocol, so a
      defect in them must be found on the pull request that causes it. A scenario that
      runs only in the full suite finds that defect later, after the pull request
      merges. A scenario in the PR set runs on each pull request that changes code the
      demos use.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001

  - id: DEMOMA-21-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcvv-embargo scenario invariant harness MUST verify that the case ledger records
      the semantic types the CASE_MANAGER commits for the embargo proposal, the owner's
      acceptance, the revision proposal and the owner's acceptance of the revision. The
      semantic type strings used in the invariant check MUST be the ones the CASE_MANAGER's
      commit path emits, read from the code rather than hand-listed here.
    rationale: >-
      The scenario-specific invariants confirm all four embargo-variation
      protocol paths were exercised and recorded: EP (b), EV (c), EC (c), and
      auto-collapse via CS.P (d). The late-joiner backfill check for V2
      verifies that the ledger synchronization worked correctly when V2 joined
      mid-scenario after an embargo revision. Invariant (f) distinguishes
      accidental collapse from deliberate termination, ensuring the scenario
      exercised the correct code path.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-16-009
    - rel_type: refines
      spec_id: DEMOMA-21-001
  - id: DEMOMA-21-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcvv-embargo scenario MUST be structured with the following phases
      executed in order: (1) report_submission, (2) embargo_proposal,
      (3) embargo_revision, (4) v2_late_invite, (5) fix_lifecycle,
      (6) accidental_collapse, (7) case_closure, and (8) dump_case_ledgers.
    rationale: >-
      Phase ordering reflects the temporal protocol constraints: revision
      requires an ACTIVE embargo; V2 late-invite simulates a short-deadline
      vendor held back until terms are settled.
    preconditions:
    - description: >-
        All five containers running (Reporter, Coordinator, V1, V2, CaseActor);
        all actors seeded and cross-registered; V2 not yet invited.
    steps:
    - order: 1
      actor: reporter
      action: >-
        report_submission phase — POST submit-report trigger to the Coordinator,
        which engages the case and invites V1
      expected: the case exists on every replica with R, C and V1 as participants
    - order: 2
      actor: reporter
      action: >-
        embargo_proposal phase — call demo_propose_and_activate_embargo: R posts
        trigger_propose_embargo, C posts trigger_accept_embargo
      expected: >-
        em_state == EM.ACTIVE with R, C and V1 each a signatory to the active embargo
    - order: 3
      actor: coordinator
      action: >-
        embargo_revision phase — call demo_propose_embargo_revision
        (DEMOMA-21-002): C posts trigger_propose_embargo_revision to the
        CASE_MANAGER (canonical ACTIVE → REVISE); V1 answers the relayed
        Invite with trigger_accept_embargo (consent); C, as case owner, posts
        trigger_accept_embargo (canonical REVISE → ACTIVE)
      expected: >-
        em_state returns to EM.ACTIVE with the revised terms on every replica
        after the ledger fan-out
    - order: 4
      actor: coordinator
      action: >-
        v2_late_invite phase — invite V2 only after the revision is complete and
        em_state is confirmed ACTIVE (DEMOMA-21-003)
      expected: >-
        V2 accepts the case invite and the current embargo event, reaching
        becoming a signatory to it (DEMOMA-21-012)
    - order: 5
      actor: demo-script
      action: fix_lifecycle phase — advance V1 and V2 through the fix lifecycle
      expected: >-
        the fix lifecycle completes for V1 and V2; the embargo stays ACTIVE
        until the accidental collapse in phase 6
    - order: 6
      actor: reporter
      action: >-
        accidental_collapse phase — call actor_notifies_published on the
        reporter's client to fire CS.P; trigger_terminate_embargo MUST NOT be
        called (DEMOMA-21-004, DEMOMA-21-014)
      expected: >-
        CaseActor emits the embargo teardown via ThreatTerminationBranchNode and
        em_state == EM.EXITED on the Coordinator's replica
    - order: 7
      actor: demo-script
      action: case_closure phase — close the case on every participant
      expected: >-
        RM.CLOSED for every participant in the CASE_MANAGER's store; each
        participant's replica ends at the entries recording its own closure
        (CM-23-004)
    - order: 8
      actor: demo-script
      action: dump_case_ledgers phase
      expected: >-
        one case-ledger JSONL artifact per actor under devlogs/rcvv-embargo/,
        recording the proposal, the owner's acceptance, the revision proposal
        and its acceptance (DEMOMA-21-007)
    postconditions:
    - description: >-
        EM.EXITED as an automatic consequence of CS.P rather than a deliberate
        termination (variation d, DEMOMA-21-004); every participant at
        RM.CLOSED, which the universal Invariant 7 check
        (`test_invariant_7_log_terminates_all_rm_closed`) asserts for every
        scenario rather than this group. Nothing beyond those is restated here —
        see DEMOMA-19-014's postcondition for why.
  - id: DEMOMA-21-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After phases 2, 3, 4, and 6 of the rcvv-embargo scenario, the scenario
      MUST assert the expected EM state before proceeding to the next phase.
    rationale: >-
      Phase-boundary EM assertions catch silent failures where an embargo
      trigger fires but the state machine does not advance.
  - id: DEMOMA-21-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      After the revision sequence, `demo_propose_embargo_revision` MUST poll
      the CASE_MANAGER's canonical case and the accepting client's replica for
      `em_state == EM.ACTIVE` and assert both using `demo_check`.
    rationale: >-
      A check for ACTIVE after the revision shows that the Case Owner decided and that
      the embargo did not stay in REVISE. The canonical case shows that the
      CASE_MANAGER committed the decision. The replica of the accepting client shows
      that the ledger update reached a participant that is not the Case Owner.
  - id: DEMOMA-21-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `demo_propose_embargo_revision` function MUST be importable from
      `vultron/demo/exchange/` and MUST NOT duplicate the propose-and-activate
      logic already in `demo_propose_and_activate_embargo` (DEMOMA-20-002).
    rationale: >-
      Reusing the activate path prevents divergence between the propose-and-activate
      and revision helpers when the embargo lifecycle nodes change.
  - id: DEMOMA-21-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcvv-embargo scenario MUST assert that V2 is a signatory to
      the active embargo before proceeding to the fix_lifecycle phase.
    rationale: >-
      V2 must be fully enrolled in the embargo before it is accidentally
      collapsed by CS.P, making the ledger record unambiguous about V2's
      consent at time of collapse.
  - id: DEMOMA-21-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The rcvv-embargo scenario MUST use polling helpers (not `post_to_inbox_and_wait`)
      to detect the invite in V2's inbox, consistent with the no-mail-carrying rule in
      `vultron/demo/AGENTS.md`.
    rationale: >-
      The no-mail-carrying rule requires that the demo orchestrator never post
      directly to another actor's inbox; polling ensures the invite arrives via
      the normal routing path.
  - id: DEMOMA-21-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The accidental_collapse phase of rcvv-embargo MUST NOT call
      `trigger_terminate_embargo` directly; the embargo collapse MUST arrive as
      an automatic consequence of CS.P, not a deliberate termination.
    rationale: >-
      Variation (d) specifically exercises the automatic embargo collapse path
      via `ThreatTerminationBranchNode`; calling `trigger_terminate_embargo`
      directly would test variation (e) instead.
- id: DEMOMA-22
  title: Causal Gating and Scenario Narratives
  specs:
  - id: DEMOMA-22-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Every scenario script under `vultron/demo/scenario/` MUST gate each
      asynchronous protocol boundary on a causal precondition satisfying
      EDF-06-001 through EDF-06-003 before driving the next trigger.
    rationale: >-
      A trigger commits its local change and returns before its activity is delivered.
      The receiving actor commits its own change later. A step that runs before its
      cause is visible operates on state that does not exist yet. A rule for one
      scenario does not stop the next scenario from making the same mistake, so the rule
      applies to every scenario (ADR-0058).
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: EDF-06-001
    tags:
    - demo
    - testing
  - id: DEMOMA-22-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Causal gate *predicates* — the reusable functions that poll or scan an
      actor's own state to decide whether a precondition holds — MUST be defined
      in `vultron/demo/helpers/`. Scenario modules MUST NOT define their own
      polling or retry loops. This requirement does NOT relocate the `demo_gate`
      context manager itself, which DEMOCI-01-007 places in
      `vultron/demo/utils.py` alongside `demo_step` and `demo_check`.
    rationale: >-
      This applies DEMOMA-17-001 (extract before reuse) to gate predicates. A polling
      loop written in a scenario module is a copy that the next fix does not reach, so
      a defect fixed in one scenario stays in another. `demo_gate` stays in
      `vultron/demo/utils.py` with `demo_step` and `demo_check`, and the functions that
      read actor state stay in the helpers.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: depends_on
      spec_id: DEMOCI-01-007
      note: >-
        DEMOCI-01-007 owns the location and semantics of the `demo_gate` context
        manager; this requirement owns the location of the predicates passed to
        it.
    tags:
    - demo
    - testing
  - id: DEMOMA-22-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each demo scenario MUST have a narrative page under
      `docs/topics/scenarios/` that describes the case's progress through the
      CVD process in domain terms, without reference to implementation
      details such as endpoint names, helper functions, or container topology.
      Each narrative step MUST state the antecedent that causes it.
    rationale: >-
      A narrative written in domain terms is an independent statement of what
      the protocol is supposed to accomplish. Because it is written without
      reference to the implementation, it can disagree with the implementation
      — which is precisely what makes it usable as a conformance oracle rather
      than a restatement of the code.
    adr:
    - ADR-0058
    lint_suppress:
    - phantom_path_ref
    tags:
    - demo
    - documentation
  - id: DEMOMA-22-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each scenario narrative MUST carry a machine-readable list of causal
      edges. Each edge MUST name the antecedent event, the consequent event,
      and the actor that commits the consequent. The actor label MUST name
      the `actor` recorded on the consequent's ledger entry, the literal
      emitter of the activity. For an activity the CASE_MANAGER emits on a
      participant's behalf, such as every `invite_actor_to_case`, that is
      the CASE_MANAGER (CM-24-001, PCR-08-007), and the requesting
      participant is recoverable from the entry's `attributedTo`
      (CM-24-002), not from the label.
    rationale: >-
      Prose alone drifts silently from the code it describes. A structured edge
      list is the part of the narrative a test can check, and it forces the
      author to state the causal claim precisely enough to be falsifiable.
    adr:
    - ADR-0058
    tags:
    - demo
    - documentation
  - id: DEMOMA-22-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The invariant harness MUST assert, for each scenario, that every causal
      edge declared in that scenario's narrative appears in the observed case
      ledger, with the antecedent's log index preceding the consequent's.
      The harness MUST also check each edge's actor tag against the ledger:
      the consequent entry considered MUST be one whose recorded `actor`
      resolves, through the scenario's dump manifest, to the edge's
      `consequent_actor`, and an edge with no such entry, or whose recorded
      actor is absent from the manifest, MUST fail.
    rationale: >-
      The case ledger records `log_index` in causal order (ADR-0079,
      CLP-14-001) and the invariant harness already reads the per-scenario
      ledger dumps, so checking declared causality against observed causality
      needs no new instrumentation. This is what converts the narrative from
      documentation into a conformance check.
    adr:
    - ADR-0058
    - ADR-0079
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    tags:
    - demo
    - testing
  - id: DEMOMA-22-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      A change to a scenario's protocol flow MUST update that scenario's
      narrative and its declared causal edges in the same pull request.
    rationale: >-
      If the flow changes and the narrative does not, the causal-edge check can fail.
      The easy fix is then to make the check weaker, and the narrative then checks
      nothing. A change to both in one pull request makes a protocol change visible as a
      narrative change, where a reviewer can judge it.
    adr:
    - ADR-0058
    tags:
    - demo
    - documentation
  - id: DEMOMA-22-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Every `wait_for_*` call in a scenario script MUST be wrapped in either
      `demo_gate` (when the wait is a causal precondition for a subsequent
      step) or `demo_check` (when the wait is temporal or a non-gating
      post-hoc verification). Bare unwrapped `wait_for_*` calls are
      prohibited.
    rationale: >-
      A bare call raises `AssertionError` directly on timeout, bypassing the
      demo harness's failure accumulator. Earlier `demo_check` failures
      accumulated in the same run are lost, and downstream steps do not
      receive the structured skip that `demo_gate` provides — the exception
      terminates the scenario with no record of what preceded the failure.
      `demo_gate` and `demo_check` are the two sanctioned wrappers; using
      them consistently keeps the failure record complete and the control
      flow explicit.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-22-001
      note: >-
        DEMOMA-22-001 requires causal gating at every async boundary;
        this requirement closes the loophole of bare calls that appear to
        gate but do not integrate with the failure accumulator.
    - rel_type: refines
      spec_id: EDF-06-005
      note: >-
        EDF-06-005 requires unmet causal gates to prevent dependent steps;
        this requirement enforces the same principle for the bare-call case.
    tags:
    - demo
    - testing
- id: DEMOMA-23
  title: Shared Scenario Harness
  specs:
  - id: DEMOMA-23-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Every `run_<name>_demo()` orchestrator MUST run its phase body inside the
      shared `scenario_harness("<demo-name>")` context manager from
      `vultron.demo.helpers.harness`, which resets the failure accumulator, always
      dumps the case ledgers, and only then asserts demo success. The scenario's
      `main()` MUST NOT wrap the run in `try: ... finally: assert_demo_success()`.
    rationale: >-
      Every scenario must reset the failure record, dump the ledgers, and then assert
      success, in that order. When each scenario does this itself, the order can
      differ. A `finally: assert_demo_success()` in `main()` also replaces the real
      exception with a generic `DemoFailureError`. One shared harness does the three
      steps in the same order for every scenario and keeps the real cause of a
      failure.
    relationships:
    - rel_type: implements
      spec_id: DEMOCI-10-001
    - rel_type: refines
      spec_id: DEMOMA-17-001
    tags:
    - demo
    - testing
  - id: DEMOMA-23-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      A scenario's `_phase_dump_case_ledgers()` MUST be a thin wrapper over
      `vultron.demo.helpers.ledger_dump.dump_case_ledgers()`, declaring only that
      scenario's dump targets (actor name, client, route key, and any fallback).
      Per-actor fetching, 404 handling, JSONL writing, and manifest writing MUST
      live in the shared helper, not in the scenario module.
    rationale: >-
      The export loop is the same for every scenario. A copy of it in each scenario
      module is the duplication that DEMOMA-17-001 forbids, and a defect in it must
      then be fixed in each copy. The scenario keeps only its own participant map, and
      the helper keeps the mechanics, so each fact is in one place.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    tags:
    - demo
  - id: DEMOMA-23-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      A scenario MUST register its dump with `harness.dump_with(...)` as soon as
      a case exists — immediately after the report-submission phase returns —
      rather than at the end of the run.
    rationale: >-
      The harness can only dump what it has been given. Registering the dump at
      the first point where a case exists is what makes every later phase failure
      survivable: the ledgers that existed at the moment of failure are still
      exported.
    relationships:
    - rel_type: implements
      spec_id: DEMOCI-10-001
    tags:
    - demo
  - id: DEMOMA-23-004
    priority: SHOULD
    kind: project
    statement: >-
      When a scenario body raises, the harness SHOULD attach the accumulated
      `demo_step`/`demo_check` failures to the propagating exception as notes
      rather than raising `DemoFailureError` in their place.
    rationale: >-
      The accumulated soft failures are usually downstream consequences of the
      exception, so they are context, not the cause. Attaching them as notes keeps
      both: the reader sees the failure that stopped the run and every check that
      had already failed.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-10-004
    tags:
    - demo
  - id: DEMOMA-23-005
    priority: MUST
    kind: project
    statement: >-
      Every wait for a set of replicas to reach contiguous ledger coverage of an
      authority's tail, such as the causal gate before the notes phase, MUST be
      performed through a shared helper in `vultron/demo/helpers/sync.py` that
      reads the authority tail, iterates the replicas, applies the named
      ledger-coverage timeout constants from `vultron/demo/helpers/polling.py`
      (a default budget and a wider late-joiner budget, neither below any budget
      a scenario carried before the loop was shared), and wraps each per-replica
      wait in a demo context internally. After case closure no replica covers
      the authority's tail, because a closed participant is sent nothing after
      the entries recording its own closure (CM-23-004). The closure-phase wait
      for a departed participant's replica to end at its own closure MUST also
      be performed through a helper in `vultron/demo/helpers/sync.py`.
    rationale: >-
      Every scenario waits for its replicas twice. Before the notes phase, it waits
      until each replica holds the ledger of the authority. After closure, it waits
      until each departed replica ends at its own closure. A copy of these waits in
      each scenario lets the timeouts differ by module and by replica, and a copy can
      forget a timeout and use a value that is too short. One helper keeps the loop,
      the named timeouts and the demo context in one place.
    verification: >-
      Unit tests for the shared helper assert that the per-replica wait is
      skipped when the authority-tail read yields nothing, that a late joiner
      receives the late-joiner coverage budget and every other replica the
      default coverage budget, that neither budget is below the values the
      scenario copies carried, and that a raising per-replica timeout is
      recorded by the failure accumulator rather than propagating. Unit tests
      for the closure-phase helper (`wait_for_replica_ledger_ending_at`, in
      `test/demo/test_case_closure.py`) assert that it passes when the replica
      ends at the participant's own closure, reports an entry after it, and
      times out on a gap.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: refines
      spec_id: DEMOCI-01-011
      note: >-
        DEMOCI-01-011 requires a shared helper that encapsulates polling to
        perform the demo-context wrap itself; the coverage helper is such a
        helper.
    tags:
    - demo
    - testing
  - id: DEMOMA-23-006
    priority: MUST_NOT
    kind: project
    statement: >-
      A module under `vultron/demo/` other than `vultron/demo/helpers/sync.py`
      MUST NOT call or import `wait_for_contiguous_ledger_coverage` or
      `_get_log_entries_for_case` directly. Defining the primitive and
      re-exporting either name from a package `__init__` are exempt.
    rationale: >-
      The shared helper (DEMOMA-23-005) is useful only if every scenario calls it. A
      direct call to the primitive is how a copy of the coverage loop gets back into a
      new scenario, which is often written from an earlier one. The ban also covers
      helper modules, because a copy moved into a helper module is still a copy, and a
      check of scenario modules only cannot see it.
    verification: >-
      An architecture test under `test/architecture/` parses every module under
      `vultron/demo/` except `vultron/demo/helpers/sync.py` and fails if one
      calls or imports `wait_for_contiguous_ledger_coverage` or
      `_get_log_entries_for_case`, excluding the primitive's own definition and
      package `__init__` re-exports.
    relationships:
    - rel_type: depends_on
      spec_id: DEMOMA-23-005
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: refines
      spec_id: DEMOMA-22-002
      note: >-
        DEMOMA-22-002 places causal gate predicates in `vultron/demo/helpers/`;
        this requirement names the specific predicate that every scenario needs
        and forbids the scenario-local copy of it.
    tags:
    - demo
    - testing
  - id: DEMOMA-23-007
    priority: MUST
    kind: project
    statement: >-
      A scenario's replica sync-verification phase MUST be a thin call to a
      shared phase helper in `vultron/demo/helpers/sync.py`, declaring only the
      scenario's authority, replicas, late joiners, expected participant set, and
      the replica pairs to state-check.
    rationale: >-
      Keeping the scenario's facts in the scenario and the mechanics in the
      helper puts each fact in one place, exactly as DEMOMA-23-002 does for the
      ledger dump. A scenario-specific extra — the rv scenario's check that its
      dedicated case-actor container holds the case — follows the helper call as
      a separate step rather than becoming a per-scenario variant of the phase
      body.
    verification: >-
      Unit tests for the shared phase helper assert that it composes the
      Reporter-case gate, the coverage wait (DEMOMA-23-005), the participant-index
      wait, and the declared replica state checks, in that order. The
      DEMOMA-23-006 architecture test covers the scenario side.
    relationships:
    - rel_type: depends_on
      spec_id: DEMOMA-23-005
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: refines
      spec_id: DEMOMA-23-002
    tags:
    - demo
    - testing
  - id: DEMOMA-23-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      A scenario whose ledger authority holds no ledger entries for the case MUST
      fail: an authority with an empty ledger is a demo failure, not a vacuous pass of
      the ledger checks.
    rationale: >-
      Checks that iterate over the entries of the authority pass when there are no
      entries. An authority with no entries means that the case never reached it, or
      that its ledger was never read. Either way the run proved nothing, so it must
      fail and not pass with nothing checked.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-23-002
    tags:
    - demo
    - testing
- id: DEMOMA-24
  title: RCVD Scenario (Reporter + Coordinator + Vendor + Deployer)
  trigger:
    type: scenario_start
    value: rcvd
  description: >-
    Requirements for the RCVD scenario, which exercises the Deployer role as a
    participant distinct from the Vendor. The Vendor develops the fix (VFd) but
    does not deploy it; the Deployer applies the patch in their own environment
    (d→D), gated on the causal precondition that at least one Vendor in the case
    has reached VFd state (CSB-15-004). This is the first scenario in which a
    DEPLOYER-only participant (holding CVDRole.DEPLOYER but not CVDRole.VENDOR)
    completes the fix-deployment protocol step.
  specs:
  - id: DEMOMA-24-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVD scenario MUST involve five actor identities — Reporter, Coordinator,
      Vendor, Deployer, and CaseActor — each with its own isolated DataLayer and
      separate container. The CaseActor MUST run as a separate actor identity on
      its own container; the Coordinator holds CVDRole.CASE_OWNER throughout the
      scenario.
    rationale: >-
      RCVD is the canonical scenario demonstrating the distinction between fix
      availability (Vendor's F event) and fix deployment (Deployer's D event).
      Five separate containers enforce true multi-container message delivery and
      per-actor DataLayer isolation, consistent with DEMOMA-01-001. The Coordinator
      as CASE_OWNER follows the RCV topology so that the Deployer role is the sole
      new element introduced.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-12-001
      note: >-
        Extends the RCV four-container topology by adding a fifth Deployer
        container
    tags:
    - demo
  - id: DEMOMA-24-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Vendor actor MUST hold only CVDRole.VENDOR in the case; it MUST NOT hold
      CVDRole.DEPLOYER. The Vendor's participant VFD path MUST advance to VFd (fix
      ready) and MUST NOT advance to VFD (fix deployed). The RCVD scenario MUST
      verify, after the fix-ready milestone, that the Vendor's VFD state is VFd and
      that no VFD participant status snapshot exists for the Vendor actor.
    rationale: >-
      The central protocol distinction this scenario demonstrates is that fix
      availability (Vendor at VFd) and fix deployment (Deployer at VFD) are separate
      events attributed to separate actors. A Vendor-only actor cannot hold
      CVDRole.DEPLOYER; CSB-15-002 would block d→D for it regardless, but the scenario
      MUST make this explicit through role assignment and post-milestone verification.
    relationships:
    - rel_type: refines
      spec_id: CSB-15-001
    - rel_type: refines
      spec_id: CSB-15-002
    - rel_type: refines
      spec_id: DEMOMA-15-001
    tags:
    - demo
  - id: DEMOMA-24-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Deployer actor MUST hold only CVDRole.DEPLOYER in the case; it MUST NOT
      hold CVDRole.VENDOR. The Deployer MUST be invited to the case by the
      Coordinator AFTER the fix-ready milestone is verified (Vendor at VFd), so
      that the causal precondition (CSB-15-004) is satisfied at the time of the
      Deployer's d→D transition.
    rationale: >-
      Inviting the Deployer after fix-ready ensures the causal gate (at least one
      VENDOR in the case at VFd) is satisfied when the Deployer attempts d→D.
      Inviting before fix-ready is a valid protocol scenario but requires a
      separate causal-gate check within the BT; the RCVD scenario intentionally
      uses the simpler post-fix-ready invite to isolate the pure-Deployer d→D
      path from the timing complexity of pre-fix-ready invites.
    relationships:
    - rel_type: refines
      spec_id: CSB-15-002
    - rel_type: refines
      spec_id: CSB-15-004
    - rel_type: refines
      spec_id: DEMOMA-15-002
    tags:
    - demo
  - id: DEMOMA-24-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVD scenario MUST exercise the causal-gate d→D path for the
      DEPLOYER-only participant as specified in CSB-15-004: the BT MUST permit the
      Deployer's d→D transition because at least one VENDOR participant in the case
      is at VFd, and MUST block d→D for any participant that holds neither
      CVDRole.DEPLOYER nor satisfies the causal precondition.
    preconditions:
    - description: >-
        All five containers running (Reporter, Coordinator, Vendor, Deployer,
        CaseActor); all actors seeded and cross-registered; the Coordinator
        holds CVDRole.CASE_OWNER throughout (DEMOMA-24-001).
    steps:
    - order: 1
      actor: reporter
      action: >-
        POST submit-report trigger to the Coordinator, which validates and
        engages the case
      expected: the case exists on the Coordinator's replica; RM→ACCEPTED
    - order: 2
      actor: coordinator
      action: invite the Vendor (CVDRole.VENDOR only) into the case
      expected: >-
        the Vendor accepts and holds no CVDRole.DEPLOYER (DEMOMA-24-002)
    - order: 3
      actor: vendor
      action: advance the participant VFD path to VFd without deploying
      expected: >-
        Vendor VFD = VFd and no VFD participant status snapshot exists for the
        Vendor actor (DEMOMA-24-002); the CSB-15-004 causal precondition is now
        satisfied
    - order: 4
      actor: coordinator
      action: >-
        invite the Deployer (CVDRole.DEPLOYER only) into the case, AFTER the
        fix-ready milestone is verified (DEMOMA-24-003)
      expected: >-
        the Deployer container is polled for the arriving invitation before the
        accept-case-invite trigger is driven (DEMOMA-24-008); the Deployer holds
        no CVDRole.VENDOR
    - order: 5
      actor: deployer
      action: apply the patch in its own environment, driving the d→D transition
      expected: >-
        the BT permits d→D because a VENDOR participant is at VFd, and blocks
        d→D for any participant that holds neither CVDRole.DEPLOYER nor
        satisfies the causal precondition
    - order: 6
      actor: demo-script
      action: >-
        drive publication, calling verify_publicly_disclosed with the Deployer
        actor ID as the DEPLOYER-role participant (DEMOMA-24-005)
      expected: PXA advances to Pxa on every replica; EM.EXITED
    - order: 7
      actor: demo-script
      action: close the case on every participant, then dump the case ledgers
      expected: >-
        RM.CLOSED for every participant in the CASE_MANAGER's store; each
        participant's replica ends at the entries recording its own closure
        (CM-23-004); one case-ledger JSONL artifact per actor under
        devlogs/rcvd/
    postconditions:
    - description: >-
        The final state DEMOMA-24-005 requires. Deliberately a pointer rather
        than a copy: -005 is the authority for that state, and a restatement here
        would drift from it with nothing able to tell which was current
        (MS-16-002).
    rationale: >-
      CSB-15-004 defines a new guard condition for DEPLOYER-only actors that
      replaces the per-participant VFD-state check used by VENDOR actors. The RCVD
      scenario is the primary functional test exercising this path end-to-end in
      a multi-container context. The scenario-level `verify_fix_deployed` call MUST
      pass the Deployer actor ID (not the Vendor actor ID) to confirm that
      DEMOMA-15-002 is satisfied.
    relationships:
    - rel_type: implements
      spec_id: CSB-15-004
    - rel_type: refines
      spec_id: DEMOMA-15-002
    tags:
    - demo
  - id: DEMOMA-24-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVD scenario MUST reach a final state where: Vendor VFD = VFd; Deployer
      VFD = VFD; all participants (Reporter, Coordinator, Vendor, Deployer, CaseActor)
      PXA = Pxa; EM.EXITED; and RM.CLOSED for all participants. The
      `verify_publicly_disclosed` helper call MUST use the Deployer actor ID as the
      participant with DEPLOYER role.
    rationale: >-
      Verifying Vendor stops at VFd and Deployer reaches VFD confirms the role-separated
      VFD model. Using the Deployer actor ID in `verify_publicly_disclosed` exercises
      the existing vfd_roles branch that treats DEPLOYER the same as VENDOR for
      public-state verification.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: DEMOMA-12-005
    tags:
    - demo
  - id: DEMOMA-24-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The implementation of the RCVD scenario MUST register it with the scenario
      registry (DEMOCI-11-001) in the same PR as the scenario script, so that its
      generated `.github/demo-scenarios.json` entry (DEMOCI-11-004) runs it as its
      own CI matrix job and CI failures are independently reported per
      DEMOCI-03-003.
    rationale: >-
      A scenario that is not registered has no entry in the CI matrix, so it can break
      without notice. Registration in the same pull request as the script gives the
      scenario a matrix entry from the time that it is in the repository. Its own CI job
      keeps its failures separate from those of other scenarios (DEMOCI-03-003).
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-03-002
    - rel_type: refines
      spec_id: DEMOCI-03-003
    - rel_type: refines
      spec_id: DEMOMA-12-007
    tags:
    - demo
  - id: DEMOMA-24-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    lint_suppress:
    - phantom_path_ref
    statement: >-
      The RCVD implementation MUST ship a dedicated per-scenario case-ledger
      invariant test file (`test/ci/invariants/test_rcvd_invariants.py`) using
      the shared invariant library; the file MUST assert the scenario-specific
      checks: (1) `invite_actor_to_case` present at least three times (Reporter,
      Vendor, Deployer invitations), (2) `accept_invite_actor_to_case` present at
      least three times, (3) `add_participant_status_to_participant` entries show
      VFd (not VFD) for Vendor and VFD for Deployer, and (4) the Deployer replica
      holds the full case history from genesis.
    note: >-
      The RCVD scenario is unbuilt. This entry is the text from before #4136 and
      awaits RCVD planning, which decides who is invited once the Reporter is seated
      as reporter at case creation (DEMOMA-12-003).
    rationale: >-
      The VFd-vs-VFD distinction for Vendor and Deployer is the central protocol
      claim of the RCVD scenario; without an invariant test that explicitly checks
      both states, a regression that lets the Vendor silently reach VFD would pass
      CI undetected.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-008
    - rel_type: refines
      spec_id: DEMOMA-12-009
    tags:
    - demo
  - id: DEMOMA-24-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCVD scenario MUST run deterministically end-to-end. The Deployer
      container MUST be polled for the arriving case invitation before the
      `accept-case-invite` trigger is driven, following the polling pattern
      established by DEMOMA-12-013.
    rationale: >-
      The invitation reaches the Deployer container some time after the Coordinator
      sends it. If the demo drives the accept trigger before the invitation is there,
      the accept fails or answers nothing. Then the run fails for a reason that is not
      a protocol defect, or it passes only when the timing is fortunate.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-004
    - rel_type: refines
      spec_id: DEMOMA-12-013
    tags:
    - demo

- id: DEMOMA-25
  title: VC Scenario (Vendor self-reports; Coordinator joins as Observer)
  trigger:
    type: scenario_start
    value: vc
  specs:
  - id: DEMOMA-25-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The VC scenario MUST involve three actor identities — Vendor, Coordinator,
      and CaseActor — each with its own isolated DataLayer and separate container.
      The CaseActor MUST run as a separate actor identity on the dedicated
      `case-actor` container (not co-located on the Vendor container), and
      `docker-compose-multi-actor.yml` MUST configure Vendor with
      `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL=http://case-actor:7999/api/v2`.
    rationale: >-
      Using the shared `case-actor` container for Vendor-owned cases matches the
      topology used by other scenarios where a non-Coordinator actor holds
      CASE_OWNER, keeps the CaseActor identity consistent across scenarios, and
      exercises true multi-container message delivery. Every container it
      needs is already in the fixed cast (DEMOCI-11-020); no new
      infrastructure is required.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    tags:
    - demo
  - id: DEMOMA-25-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the VC scenario, Vendor MUST submit the initial vulnerability report to
      its own inbox using `reporter_submits_report` with Vendor in BOTH the
      reporter and receiver slots. No external Reporter actor exists; there are no
      interactions outside the protocol. Vendor then validates the report
      (RM→RECEIVED→VALID) and engages the case (RM→ACCEPTED→case created),
      becoming CASE_OWNER with `CVDRole.VENDOR + CVDRole.CASE_OWNER`.
    rationale: >-
      Vendor-as-reporter means the discoverer and the responsible fixer are the
      same actor. Using `reporter_submits_report` unchanged ensures the standard
      RM intake path is exercised rather than a shortcut; the only difference
      from a normal report submission is that the reporter and receiver share an
      identity. This matches "THERE ARE NO INTERACTIONS OUTSIDE THE PROTOCOL":
      no ad-hoc case injection or create-case trigger bypass.
    steps:
    - order: 1
      actor: vendor
      action: POST submit-report trigger directed at self (vendor inbox)
      expected: Report delivered to Vendor inbox via standard HTTP delivery path
    - order: 2
      actor: vendor
      action: BT processes inbound report; RM transitions RECEIVED→VALID
      expected: Report validated; RM state VALID
    - order: 3
      actor: vendor
      action: BT engages case; RM transitions VALID→ACCEPTED
      expected: >-
        VulnerabilityCase created on Vendor/CaseActor; Vendor holds
        CVDRole.VENDOR + CVDRole.CASE_OWNER; default embargo initialized
        EM.ACTIVE (EP-04-001)
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    - rel_type: refines
      spec_id: EP-04-001
    tags:
    - demo
  - id: DEMOMA-25-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Vendor MUST invite Coordinator into the case using the
      `invite-actor-to-case` trigger. Coordinator's case role MUST be
      `CVDRole.OBSERVER` only — NOT `CVDRole.COORDINATOR`. Coordinator MUST
      accept the invitation via the `accept-case-invite` trigger and MUST
      become an embargo signatory, which, because the case has an active
      embargo, is what makes it an active participant entitled to case-content
      announcements as an Observer (CM-10-004, CM-25, CM-26).
    rationale: >-
      An OBSERVER that has not joined, or that is not a signatory while an embargo
      is active, is inert and receives no case updates (CM-10-004).
      The Invite/Accept exchange (CM-25) is the correct admission mechanism
      regardless of role. Coordinator's role is explicitly limited to OBSERVER:
      assigning CVDRole.COORDINATOR here would be semantically incorrect because
      the Vendor, not the Coordinator, owns the case and drives coordination.
    steps:
    - order: 1
      actor: vendor
      action: POST invite-actor-to-case trigger for Coordinator with OBSERVER role
      expected: Invite(Actor, VulnerabilityCaseStub) sent to Coordinator inbox
    - order: 2
      actor: demo_script
      action: >-
        Poll Coordinator DataLayer until Invite(Actor, VulnerabilityCaseStub) is visible
      expected: Invitation record present in Coordinator replica
    - order: 3
      actor: coordinator
      action: POST accept-case-invite trigger directed to CaseActor
      expected: >-
        Coordinator becomes a signatory with CVDRole.OBSERVER;
        CaseActor emits Announce(VulnerabilityCase) to seed Coordinator replica
    adr:
    - ADR-0057
    relationships:
    - rel_type: refines
      spec_id: CM-25-001
    - rel_type: refines
      spec_id: CM-26-001
    tags:
    - demo
  - id: DEMOMA-25-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the VC scenario, only Vendor MUST follow the VFD fix-deployment path
      (vfd → Vfd → VFd → VFD). Coordinator, holding only `CVDRole.OBSERVER`,
      MUST NOT be driven through VFD steps. Coordinator tracks pxa state
      updates only (public-awareness transitions shared with all signatory
      participants).
    rationale: >-
      VFD obligations attach to `CVDRole.VENDOR` and `CVDRole.DEPLOYER` per
      CM-26. OBSERVER carries no VFD obligations unless the actor also holds
      VENDOR or DEPLOYER. Driving Coordinator through VFD triggers in this
      scenario would incorrectly exercise a code path that the OBSERVER role
      is not supposed to activate.
    relationships:
    - rel_type: refines
      spec_id: CM-26-001
    tags:
    - demo
  - id: DEMOMA-25-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The VC scenario MUST reach a final state in which both Vendor and
      Coordinator have transitioned to RM.CLOSED. Vendor MUST reach VFDPxa
      CS with EM.EXITED. Coordinator MUST reach pxa CS with EM.EXITED
      (Observer-only state; no VFD suffix). The scenario verifies LedgerFanout
      replica convergence for the Coordinator replica against the authoritative
      Vendor/CaseActor state after each major protocol event.
    rationale: >-
      The Coordinator is an Observer with no fix path, so its correct final CS state
      has no VFD part. A check that expected VFDPxa for the Coordinator would fail on
      every correct run. A convergence check after each major event finds the first
      update that did not reach the Coordinator replica.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: EP-04-001
    tags:
    - demo
  - id: DEMOMA-25-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The implementation of the VC scenario MUST register it with the scenario
      registry (DEMOCI-11-001) in the same PR, so that its generated
      `.github/demo-scenarios.json` entry (DEMOCI-11-004) runs it as its own CI
      matrix job, and MUST ship a dedicated per-scenario case-ledger invariant test
      file (`test/ci/invariants/test_vc_invariants.py`) built on the shared
      invariant library. The test MUST assert the semantic-type list from
      DEMOMA-16-015 and the pxa-only final state for Coordinator.
    rationale: >-
      A scenario that is not registered does not run in CI, so it can break without
      notice. The invariant test checks the ledger types and the Observer final state
      that make VC different from the other scenarios. Without those checks, a run in
      which the Coordinator never joined, or ended in a state that has a fix path,
      could still pass.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-03-002
    - rel_type: refines
      spec_id: DEMOCI-03-003
    - rel_type: refines
      spec_id: DEMOMA-16-015
    tags:
    - demo
    - testing
- id: DEMOMA-26
  title: ActorSession — typed demo trigger API
  specs:
  - id: DEMOMA-26-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2573'
    statement: >-
      Demo scripts under `vultron/demo/scenario/` and `vultron/demo/exchange/`
      MUST NOT call `post_to_trigger` directly. All trigger endpoint calls MUST
      be made through `ActorSession` typed methods.
    rationale: >-
      `post_to_trigger` accepts a bare string behavior name and an untyped
      `body` dict. A misspelled behavior name is a 404 at runtime; a misspelled
      body key is silently dropped by `extra="ignore"` request models
      (TRIG-03-002), producing an undetectable no-op. `ActorSession` makes
      both mistakes unrepresentable at the call site. `post_to_trigger` remains
      as the private implementation of `ActorSession._post` and MUST NOT be
      imported outside `vultron/demo/utils.py` and `vultron/demo/actor_session.py`.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    tags:
    - demo
  - id: DEMOMA-26-002
    priority: MUST
    kind: project
    statement: >-
      `ActorSession` MUST be a frozen dataclass with fields `client:
      DataLayerClient`, `actor: as_Actor`, `case_id: str | None = None`, and
      `narrate: bool = True`. The `__post_init__` method MUST
      perform the container/actor authority check (formerly
      `_assert_client_hosts_actor`), running it exactly once at construction
      rather than on every trigger call.
    rationale: >-
      Moving the authority check to construction makes a mismatched
      `(client, actor)` pair unconstructible rather than a runtime guard that
      silently passes in unit tests (where neither side is a real absolute URI).
      The frozen constraint prevents callers from drifting the pairing after
      construction.
    verification: >-
      Constructing `ActorSession` with a mismatched container/actor URI pair
      raises `ValueError`; constructing with a matched pair succeeds. Mypy
      reports the four fields at their declared types with no `Any` escapes.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-26-001
    tags:
    - demo
  - id: DEMOMA-26-003
    priority: MUST
    kind: project
    statement: >-
      `ActorSession.with_case(case: as_VulnerabilityCase | str) ->
      ActorSession` MUST return a new frozen `ActorSession` with `case_id` set
      to the case's ID (or the given ID). It MUST NOT modify the receiver.
      Case-scoped trigger methods MUST raise if `self.case_id` is `None` at
      call time.
    rationale: >-
      A case does not exist when the session is constructed, because the actor must
      exist before the case does. A `with_case` copy keeps the session frozen and
      stops a binding from changing between steps. A trigger names its case by ID, so
      the session keeps only the ID. A caller that holds only the ID binds it directly
      and does not build a placeholder case, which could not name the Case Owner.
    verification: >-
      `session.with_case(case)` returns a new object; `session.case_id` is
      still `None` on the original. `with_case` accepts a bare case ID. A
      case-scoped method called on a session where `self.case_id is None`
      raises `ValueError`.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-26-002
    tags:
    - demo
  - id: DEMOMA-26-004
    priority: MUST
    kind: project
    statement: >-
      `ActorSession` MUST expose one typed method per trigger verb called from
      `vultron/demo/`. Each method MUST accept only the keyword arguments that
      are meaningful for that verb (no `**kwargs`). An architecture ratchet test
      MUST verify that each method's keyword parameter set is a subset of the
      corresponding trigger request model's fields minus `actor_id`.
    rationale: >-
      A `**kwargs` shim or a `behavior: str` pass-through removes the static check that
      is the reason `ActorSession` exists. A request model with `extra="ignore"` drops
      an unknown key without an error. If a method accepts a keyword that its request
      model does not have, a misspelled key gets through without notice. An architecture
      test compares the keywords of each method with its request model, and it fails on
      a keyword that the model does not have.
    verification: >-
      Architecture ratchet test in `test/architecture/` confirms each
      `ActorSession` method's kwargs are a subset of its request model's fields
      minus `actor_id`. Test fails if a new method is added without a
      corresponding request model check.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-26-001
    tags:
    - demo
    - testing
  - id: DEMOMA-26-005
    priority: MUST
    kind: project
    # actions.py is intentionally deleted by the PR that satisfies this
    # requirement (#3398), so the path it names no longer exists — the
    # reference is historical, not a live file (MS-15-001).
    lint_suppress:
    - phantom_path_ref
    statement: >-
      `vultron/demo/helpers/actions.py` MUST be deleted when `ActorSession`
      lands. No backward-compatibility shims or re-export stubs for its
      functions are permitted. All callers MUST be migrated to `ActorSession`
      methods in the same PR.
    rationale: >-
      `actions.py` is a 1:1 wrapper layer over `post_to_trigger` that
      `ActorSession` wholly subsumes. Keeping it alongside `ActorSession` would
      leave two competing APIs for the same operations, undoing the
      consolidation goal.
    verification: >-
      `vultron/demo/helpers/actions.py` does not exist in the repository after
      the PR merges. `grep -r "from vultron.demo.helpers.actions" vultron/`
      returns no results.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-26-001
    tags:
    - demo
  - id: DEMOMA-26-006
    priority: MUST
    kind: project
    # This ratchet is intentionally deleted by the PR that satisfies this
    # requirement (#3398), so the path it names no longer exists — the
    # reference is historical, not a live file (MS-15-001).
    lint_suppress:
    - phantom_path_ref
    statement: >-
      The architecture ratchet test
      `test/architecture/test_demo_trigger_client_matches_actor.py` MUST be
      deleted in the same PR that removes the last `post_to_trigger` call site
      from `vultron/demo/`. It MUST NOT be deleted before that point; until
      then it serves as the migration's own safety net against regressions.
    rationale: >-
      The test finds the `(client, actor_id)` mismatch that `ActorSession` makes
      impossible to write. When no `post_to_trigger` call site remains, that mismatch
      cannot occur, so the test checks nothing. Until then it protects the migration
      from new mismatches.
    verification: >-
      After the PR merges, `test/architecture/test_demo_trigger_client_matches_actor.py`
      does not exist and `grep -rn "post_to_trigger" vultron/demo/scenario/
      vultron/demo/exchange/ vultron/demo/helpers/` returns no results outside
      `utils.py` and `actor_session.py`.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-26-001
    tags:
    - demo
    - testing
- id: DEMOMA-27
  title: RCV-Reject Scenario (Coordinator invites Vendor; Vendor rejects the invitation)
  trigger:
    type: scenario_start
    value: rcv-reject
  specs:
  - id: DEMOMA-27-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The RCV-reject scenario MUST involve four actor identities — Reporter,
      Coordinator, Vendor, and CaseActor — each with its own isolated DataLayer
      and separate container, with the Coordinator holding CVDRole.CASE_OWNER and
      the CaseActor holding CVDRole.CASE_MANAGER throughout. The Vendor MUST be
      seeded as a full actor identity even though it never becomes an active
      participant (CM-10-004).
    rationale: >-
      The topology is DEMOMA-12's (RCV): the scenario exists to isolate one
      divergence — the invitation response — so every other variable is held
      equal. The Vendor needs a real identity and container because the rejection
      is a protocol message it must author; a placeholder actor could not send
      `Reject(Invite(Actor, VulnerabilityCaseStub))`, and the point of the
      scenario is that the rejection travels the wire.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-12-001
    tags:
    - demo
  - id: DEMOMA-27-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Vendor MUST reject the case invitation by sending
      `Reject(Invite(Actor, VulnerabilityCaseStub))`, and the CaseActor MUST
      record a `reject_invite_actor_to_case` ledger entry. The Vendor's
      participant record, created by the stub Invite, MUST end at `RM.CLOSED`;
      the Vendor MUST NOT become active, MUST NOT receive a case ledger replica,
      and MUST NOT appear as a recipient of any subsequent case-content
      fan-out.
    rationale: >-
      This is the only scenario covering the invitation-layer rejection path, so
      it is the only place the protocol's "invited but never participating"
      outcome is exercised end to end. The negative half is the load-bearing
      half: a rejection that still made the Vendor active, or still shipped a
      replica, would satisfy a check that only looked for the ledger entry while
      leaving the case in a state the protocol forbids (ADR-0114).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-27-001
    adr:
    - ADR-0114
    tags:
    - demo
  - id: DEMOMA-27-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The scenario MUST execute its phases in order — report submission,
      invitation and rejection, replica-sync verification, notes exchange,
      publication, case closure, ledger dump — and the Reporter and Coordinator
      MUST complete publication and closure without the Vendor.
    rationale: >-
      Phase order is the causal order (EDF-06, ADR-0058): the rejection must
      precede sync verification, because what sync verification asserts is the
      *absence* of a Vendor replica, and asserting that before the rejection has
      been processed would pass vacuously. Closing the case without the Vendor is
      the scenario's demonstration that a rejected invitation does not block
      lifecycle completion for the remaining participants.
    preconditions:
    - description: >-
        All four containers running (Reporter, Coordinator, Vendor, CaseActor); all
        actors seeded and cross-registered; no VulnerabilityCase exists for this
        report; the Coordinator is pre-configured with the dedicated CaseActor
        container URL (DEMOMA-27-001).
    steps:
    - order: 1
      actor: reporter
      action: >-
        report_submission phase — POST submit-report trigger directed at the
        Coordinator, which validates the report and engages the case
      expected: >-
        VulnerabilityCase created with the Coordinator as CVDRole.CASE_OWNER and
        the CaseActor as CVDRole.CASE_MANAGER on its own container
        (DEMOMA-27-001)
    - order: 2
      actor: coordinator
      action: >-
        invite_vendor_reject phase — Coordinator sends
        `Invite(Actor, VulnerabilityCaseStub)` to the Vendor with CVDRole.VENDOR
      expected: >-
        `invite_actor_to_case` recorded in the case-actor log
        (DEMOMA-16-011)
    - order: 3
      actor: vendor
      action: >-
        Vendor responds with `Reject(Invite(Actor, VulnerabilityCaseStub))` rather than
        `Accept(...)`
      expected: >-
        `reject_invite_actor_to_case` recorded; the Vendor's participant record
        is at RM.CLOSED, it never becomes active, and it holds no case ledger
        replica (DEMOMA-27-002)
    - order: 4
      actor: coordinator
      action: >-
        sync_verification phase — verify replica agreement across the
        participants that exist
      expected: >-
        Reporter and Coordinator replicas agree with the case-actor log; no Vendor
        replica is present, which is the assertion the rejection makes checkable
        (DEMOMA-27-002)
    - order: 5
      actor: coordinator
      action: notes_exchange phase — participants exchange case notes
      expected: '`add_note_to_case` recorded (DEMOMA-16-001)'
    - order: 6
      actor: coordinator
      action: publication phase — the case is published
      expected: participants advance to the public-aware CS.pxa states
    - order: 7
      actor: coordinator
      action: >-
        case_closure phase — the Coordinator and Reporter each close the case
      expected: >-
        every participant at RM.CLOSED, which the universal Invariant 7 check
        (`test_invariant_7_log_terminates_all_rm_closed`) asserts for every
        scenario rather than this group
    - order: 8
      actor: coordinator
      action: dump_case_ledgers phase
      expected: >-
        one case-ledger JSONL artifact per participating actor under
        devlogs/rcv-reject/
    postconditions:
    - description: >-
        The case is closed with the Reporter and Coordinator as its only
        participants, and the case-actor log holds exactly one
        `reject_invite_actor_to_case` entry and no
        `accept_invite_actor_to_case` entry (DEMOMA-16-011, DEMOMA-27-002).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-27-001
    tags:
    - demo
  - id: DEMOMA-27-004
    priority: MUST
    kind: project
    statement: >-
      The RCV-reject story MUST start with the same shared opening as RCV
      (DEMOMA-12-017) and continue from the Vendor's rejection.
    rationale: >-
      The rejection is the only thing this scenario tells differently, so
      everything before it is one copy of the code shared with RCV and the two
      recordings are byte-identical up to the Vendor's decision
      (DEMOCI-11-018). Naming it here keeps this group a whole story: a reader
      sees where the rejection path begins without reading RCV's group.
    verification: >-
      `test/demo_unit/test_story.py::test_the_two_composed_scenarios_share_one_opening`
      asserts that `rcv-reject`'s story begins with the items of
      `COORDINATOR_INVITES_VENDOR`, and `TestComposedFamilies` in
      `test/demo_unit/test_recordings.py` compares the `rcv` and `rcv-reject`
      recordings byte for byte up to the `vendor-join` branch point.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: depends_on
      spec_id: DEMOCI-11-019
    tags:
    - demo
