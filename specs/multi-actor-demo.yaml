id: DEMOMA
title: Multi-Actor Demo
description: >-
  Requirements for multi-actor demo scenarios, Docker Compose orchestration, actor isolation,
  acceptance testing, and reproducibility. Includes per-scenario required
  event-type lists for the case-ledger invariant harness.
version: 1.4.0
scope:

- prototype
- production
tags:
- demo
groups:
- id: DEMOMA-00
  title: Cross-Actor Communication
  specs:
  - id: DEMOMA-00-001
    priority: MUST
    kind: project
    statement: >-
      Cross-actor communication MUST occur exclusively via HTTP using the ActivityStreams
      inbox endpoint
- id: DEMOMA-01
  title: Actor Isolation
  specs:
  - id: DEMOMA-01-001
    priority: MUST
    kind: project
    statement: >-
      Each actor in a multi-actor demo MUST run in a separate container with its own DataLayer
      instance
  - id: DEMOMA-01-002
    priority: MUST
    kind: project
    statement: >-
      Each actor container MUST expose the actor's identity via its `/actors/{actor_id}` profile
      endpoint so that other containers can discover it at startup
  - id: DEMOMA-01-003
    priority: MUST
    kind: project
    statement: >-
      Demo startup MUST automatically reset all actor state to a known clean baseline before
      the scenario executes, without requiring manual user intervention
  - id: DEMOMA-01-004
    priority: MUST
    kind: project
    statement: >-
      Each call to `create_app()` MUST create fresh per-app instances of the dispatcher,
      emitter, and DataLayer stored on `app.state`; `create_app()` MUST NOT mutate
      module-level singleton globals such as `_default_emitter`, `_DISPATCHER`, or
      `_shared_instance`
    rationale: >-
      When multiple Vultron actors are co-located in the same Python process (e.g., a
      report-receiver actor and its spawned Case Actor), each call to `create_app()` must
      produce a fully isolated application. If `create_app()` mutates module-level globals,
      the last lifespan to call `configure_default_emitter()` or `init_dispatcher()`
      silently overwrites all prior actors' state, causing cross-actor data leakage.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-01-005
    priority: MUST
    kind: project
    statement: >-
      Co-located actors (multiple FastAPI app instances in the same process) MUST each have
      a dedicated `DataLayer` instance registered in their `app.dependency_overrides`; no
      two co-located apps in the same process MAY share a `DataLayer` instance
    rationale: >-
      Sharing a `DataLayer` instance across co-located actors bypasses the outbox → inbox
      delivery path: objects created by Actor A become immediately visible to Actor B
      without any delivery occurring. This makes integration tests unreliable and hides
      real cross-actor delivery bugs.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
- id: DEMOMA-02
  title: Container Orchestration
  specs:
  - id: DEMOMA-02-001
    priority: MUST
    kind: project
    statement: >-
      Docker Compose configurations for multi-actor demos MUST include a `healthcheck` for
      each actor service that probes the `/health/ready` endpoint
    relationships:
    - rel_type: refines
      spec_id: IMPLTS-05-002
      note: tech-stack.md
    - rel_type: depends_on
      spec_id: OB-05-002
      note: observability.md
  - id: DEMOMA-02-002
    priority: MUST
    kind: project
    statement: >-
      Dependent services (e.g., a demo orchestration container) MUST use `condition: service_healthy`
      for all actor service dependencies
  - id: DEMOMA-02-003
    priority: MUST
    kind: project
    statement: >-
      Port mappings, network names, and required environment variables MUST be documented
      in the `docker-compose.yml` file or an accompanying `README.md`
- id: DEMOMA-03
  title: Acceptance Tests
  specs:
  - id: DEMOMA-03-001
    priority: MUST
    kind: project
    statement: >-
      Each multi-actor demo scenario MUST include an acceptance test that validates the end-to-end
      workflow deterministically
  - id: DEMOMA-03-002
    priority: MUST
    kind: project
    statement: >-
      Acceptance tests MUST assert final state for each actor (e.g., correct RM/EM/CS state,
      expected case ledger entries)
  - id: DEMOMA-03-003
    priority: MUST
    kind: project
    statement: >-
      Acceptance tests MUST be reproducible: the same test on the same codebase MUST produce
      the same result on successive runs
- id: DEMOMA-04
  title: Scenario Coverage
  specs:
  - id: DEMOMA-04-002
    priority: SHOULD
    kind: project
    statement: >-
      Each scenario SHOULD include a summary of the expected CVD workflow steps and the expected
      final RM/EM/CS state for each actor
- id: DEMOMA-05
  title: Demo Trigger Protocol
  specs:
  - id: DEMOMA-05-001
    priority: MUST
    kind: project
    statement: >-
      All actor-initiated actions in scenario demos MUST be driven through the trigger API
      (`POST /actors/{actor_id}/trigger/{behavior-name}`), not by direct inbox injection or
      other mechanisms that bypass the actor's own protocol logic
    rationale: >-
      Using trigger endpoints ensures that the demo exercises the same code paths that a real
      actor would use, including BT execution, outbox queuing, and downstream cascading behaviors.
      Direct inbox injection spoofs protocol messages and does not validate that the initiating
      actor's behavior is correctly implemented.
    relationships:
    - rel_type: depends_on
      spec_id: TRIG-01-001
      note: trigger endpoint format
  - id: DEMOMA-05-002
    priority: MUST_NOT
    kind: project
    statement: >-
      Scenario demo scripts MUST NOT construct and POST raw ActivityStreams JSON directly
      to an actor's inbox as a substitute for calling that actor's trigger endpoint
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-00-001
  - id: DEMOMA-05-003
    priority: MAY
    kind: project
    statement: >-
      Exchange demos located under `vultron/demo/exchange/` MAY use direct inbox injection
      (constructing and posting raw ActivityStreams JSON) to simulate the receipt of a
      specific wire message. Scenario demos under `vultron/demo/scenario/` MUST NOT use
      direct inbox injection (DEMOMA-05-001 and DEMOMA-05-002 apply without exception to
      scenario demos).
    rationale: >-
      Exchange demos are low-level wire-format verification scripts that intentionally
      exercise the inbox parsing path directly. Scenario demos must exercise the full
      actor behavior including trigger dispatch; direct inbox injection in a scenario demo
      bypasses the triggering actor's BT execution and produces a scenario that does not
      test the protocol from end to end. This carve-out resolves the apparent contradiction
      between DEMOMA-05-001 (which would prohibit exchange demos) and the existing
      `vultron/demo/exchange/` code.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-05-001
  - id: DEMOMA-05-004
    priority: MUST_NOT
    kind: project
    statement: >-
      Demo trigger endpoints and demo helper functions MUST NOT manipulate an actor's
      DataLayer directly (e.g., calling `add_participant_status` or equivalent) or write
      directly to an actor's outbox as a substitute for invoking a triggerable use case.
      Puppeteering an actor means calling a trigger endpoint that invokes the actor's own
      use case, which in turn emits the correct protocol message and awaits any required
      round-trip confirmation (e.g., a CaseActor ledger entry).
    rationale: >-
      Direct DataLayer writes bypass the protocol entirely: no ActivityStreams message is
      emitted, no CaseActor ledger round-trip occurs, and the actor's local state is never
      established through the protocol. This produces demos that appear to work but do not
      exercise the real protocol path. For example, a demo that stamps RM.CLOSED directly
      via `add_participant_status` gives the appearance that the participant left the case,
      but no `Leave(VulnerabilityCase)` message was ever sent or confirmed by the CaseActor.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-05-001
- id: DEMOMA-06
  title: FV Scenario Workflow
  trigger:
    type: scenario_start
    value: fv
  specs:
  - id: DEMOMA-06-001
    priority: MUST
    kind: project
    statement: >-
      The FV (Finder + Vendor) demo scenario MUST execute a complete CVD lifecycle
      ending in final case state VFDPxa (Vendor aware, Fix ready, Fix Deployed, Public aware,
      no exploit public, no active attacks)
  - id: DEMOMA-06-002
    priority: MUST
    kind: project
    statement: >-
      The FV scenario script MUST verify the following protocol checkpoints in order,
      checking both the Vendor and Finder DataLayers at each checkpoint: (1) report
      received (RM.RECEIVED), (2) report validated (RM.VALID), (3) case engaged
      (RM.ACCEPTED), (4) embargo active (EM.ACTIVE), (5) fix ready (CS.VFd), (6) fix
      deployed (CS.VFD), (7) publicly disclosed (CS.VFDPxa).
    preconditions:
    - description: Two-actor scenario executing; Vendor, Finder, and CaseActor containers
        running and reachable; report submitted by Finder to Vendor
    steps:
    - order: 1
      actor: demo-script
      action: >-
        Verify case creation: 3 participants (Vendor, Reporter, CaseActor) and EM.ACTIVE;
        check Vendor DataLayer
      expected: >-
        Vendor DataLayer holds VulnerabilityCase with 3 participants and
        EM state = ACTIVE
    - order: 2
      actor: demo-script
      action: >-
        Verify case replica sync: Finder has case replica with matching participant index
        and active embargo; check Finder DataLayer
      expected: >-
        Finder DataLayer holds case replica; participant index matches Vendor's; embargo
        state = ACTIVE
    - order: 3
      actor: demo-script
      action: >-
        Verify notes exchange: check both DataLayers for question note and reply note
      expected: >-
        Question note and reply note both present in canonical case state on Vendor and
        Finder replicas
    - order: 4
      actor: demo-script
      action: >-
        Verify fix-ready state: CS.VF on all replicas
      expected: Vendor and Finder replicas both show CS = VF (vendor aware, fix ready)
    - order: 5
      actor: demo-script
      action: >-
        Verify fix-deployed state: CS.VFD on all replicas
      expected: Vendor and Finder replicas both show CS = VFD (fix deployed)
    - order: 6
      actor: demo-script
      action: >-
        Verify public-disclosure state: CS.VFDPxa and EM terminated on all replicas
      expected: All replicas show CS = VFDPxa; EM state = EXITED
    - order: 7
      actor: demo-script
      action: >-
        Verify case close: all participants RM.CLOSED and case closed
      expected: All participants RM state = CLOSED; case record marked closed
    postconditions:
    - description: >-
        All checkpoints verified; FV scenario complete in final state VFDPxa
        with EM.EXITED and all participants RM.CLOSED
  - id: DEMOMA-06-003
    priority: MUST
    kind: project
    statement: >-
      Milestone verification MUST read both the Vendor DataLayer and the Finder DataLayer
      directly; direct DataLayer reads are acceptable in demo scripts for verification
      (read-only assertions), but MUST NOT be used to write or manipulate actor state
  - id: DEMOMA-06-004
    priority: MUST
    kind: project
    statement: >-
      The FV demo Docker topology MUST use a dedicated case-actor container with its
      own isolated DataLayer; the Vendor MUST route case-actor creation to that container
      using the pre-configured `case_actor_service_url` from `ActorConfig`, not derive
      the case-actor URL from `server_base_url` (per CP-08-001 through CP-08-003).
    rationale: >-
      Routing case-actor creation to its own container satisfies DEMOMA-01-001 (each actor
      in its own container) and exercises the CaseProposal protocol (ADR-0023) in the
      FV scenario. `ResolveCaseActorUrlsNode` reads `case_actor_service_url` from
      `ActorConfig`; the Vendor container MUST supply
      `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL` pointing to the dedicated CaseActor
      container (CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: CP-08-001
    adr:
    - ADR-0023
  - id: DEMOMA-06-005
    priority: MUST
    kind: project
    statement: >-
      The FV demo MUST verify that the case-actor container's DataLayer holds the
      canonical case ledger after the demo completes; the demo script MUST dump the
      case-actor's ledger from the dedicated case-actor container, not from the vendor
      container's co-located sub-actor
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-06-004
  - id: DEMOMA-06-006
    priority: MUST
    kind: project
    statement: >-
      Before calling `verify_fix_ready`, `verify_fix_deployed`, or
      `verify_publicly_disclosed`, demo scripts MUST first call
      `wait_for_participant_vfd_state` on every container that the helper will
      assert against — including the receiver container.  Using a polling wait
      only on the reporter/finder container and then immediately asserting on
      the receiver container with a single-shot check is not permitted.
    rationale: >-
      Each of these helpers calls `_check_participant_vfd_state_in` or
      `_assert_participant_vfd_pxa` as a single-shot, non-retrying assertion.
      VFD state updates are broadcast asynchronously via
      `Announce(CaseLedgerEntry)` fan-out; if the broadcast has not yet
      reached the receiver container when the assertion fires, the check
      fails with a spurious "vfd_state is not VFD" error.  Adding a
      `wait_for_participant_vfd_state` poll on every target container
      before the single-shot assertion eliminates this race.  Additionally,
      the `receiver_actor_id` argument MUST be the full URI of an actor that
      holds `CVDRole.VENDOR` in the case (see DEMOMA-15-001); passing a
      Coordinator or other non-Vendor actor whose VFD path never advances
      will always fail the VFD check.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-06-002
    - rel_type: refines
      spec_id: DEMOMA-15-001
- id: DEMOMA-07
  title: ParticipantStatus Trigger Pattern
  specs:
  - id: DEMOMA-07-001
    priority: MUST
    kind: project
    statement: >-
      CS state transitions (fix-ready, fix-deployed, published) MUST be driven through
      participant status updates via Add(ParticipantStatus, target=Case) sent to the Case
      Actor inbox, not through dedicated low-level state-machine endpoints.
      RM case closure is explicitly excluded from this requirement: RM.CLOSED MUST be
      reached via the Leave(VulnerabilityCase) round-trip (CM-23-001), not via
      Add(ParticipantStatus, rm_state=RM.CLOSED).
    rationale: >-
      PR #1909 (issue #1858) changed RM case closure to flow through
      Leave(VulnerabilityCase) → Case Actor ledger commit → broadcast, rather than
      Add(ParticipantStatus, rm_state=RM.CLOSED).  This makes the Case Actor the
      authority for closure and prevents ghost-departures from lost messages.
      See ADR-0050.
    relationships:
    - rel_type: implements
      spec_id: CM-23-001
  - id: DEMOMA-07-002
    priority: MUST
    kind: project
    statement: >-
      Demo trigger endpoints for participant status transitions MUST use the "notify" naming
      convention (e.g., notify-fix-ready, notify-fix-deployed, notify-published, close-case)
      to avoid semantic collision with the ActivityStreams Announce verb
  - id: DEMOMA-07-003
    priority: MUST
    kind: project
    statement: >-
      The Case Actor received handler for ADD_PARTICIPANT_STATUS_TO_PARTICIPANT MUST
      implement the following ordered steps as a BT Sequence:
      (1) verify the activity actor is a known case participant (precondition guard),
      (2) update the participant status record,
      (3) propagate the update to all other case participants via Announce(CaseLedgerEntry)
      fan-out (per ADR-0019 and SYNC-02-002) — NOT via a direct raw Add(ParticipantStatus)
      re-broadcast,
      (4) if CS.P is newly set by the Case Owner, trigger embargo teardown automatically,
      (5) if all participants are RM.CLOSED, close the case automatically.
      Each step MUST be implemented as a distinct BT node or subtree so that the protocol
      logic is visible in the tree structure and not hidden inside node update() methods.
    testable: true
    trigger:
      type: message_received
      value: ADD_PARTICIPANT_STATUS_TO_PARTICIPANT
    preconditions:
    - description: Receiving actor is CASE_MANAGER (Case Actor)
    - description: Inbound activity actor is a known case participant
    steps:
    - order: 1
      actor: case_actor
      action: Verify inbound activity actor is a known case participant
      expected: >-
        Actor found in case.actor_participant_index; FAILURE if unknown sender
    - order: 2
      actor: case_actor
      action: Append ParticipantStatus to the participant record
      expected: Participant's latest status reflects the newly received state
    - order: 3
      actor: case_actor
      action: >-
        Commit a canonical CaseLedgerEntry and fan-out Announce(CaseLedgerEntry)
        to all known case participants
      expected: >-
        All peers receive the status update via the canonical log path
        (ADR-0019, SYNC-02-002); no raw Add(ParticipantStatus) re-broadcast emitted
    - order: 4
      actor: case_actor
      action: >-
        If the new CaseStatus (derived from the participant status update) indicates
        at least one of CS.P, CS.X, or CS.A and an active embargo exists, trigger
        embargo teardown automatically via ThreatTerminationBranchNode (RSH-03-001).
        An EmbargoTeardownAuthorizationGate call-out (RSH-02-001) precedes the teardown node;
        it defaults to AlwaysSucceed (auto-approve) but is designed to accommodate
        a future "ask CASE_OWNER to confirm" policy. The CASE_OWNER gate previously
        stated here is incorrect — the code fires teardown for any participant's
        CS.P/X/A, not only the Case Owner's. See ThreatTerminationBranchNode
        (RSH-03-002: no sender-role gate) and ADR-0046.
      expected: >-
        Embargo teardown triggered (EM.EXITED) when any participant's CaseStatus
        carries CS.P, CS.X, or CS.A and an active embargo is present
    - order: 5
      actor: case_actor
      action: >-
        **SUPERSEDED** This step previously described an all-participants-RM.CLOSED
        check that emitted Leave(VulnerabilityCase) from the Case Actor to trigger
        case closure.  This step is retired: RM case closure now flows through each
        participant's own Leave(VulnerabilityCase) round-trip (CM-23-001).
        The owner-Leave path (CM-23-002) replaces this step; when the Case Owner
        sends Leave(VulnerabilityCase), the Case Actor closes the case and
        advances the CaseActor participant to RM.CLOSED (CM-23-004, ADR-0051).
        Implementation: see #1901.
      expected: >-
        **SUPERSEDED** No AutoCloseSequence fires in add_participant_status_tree.
        Case closure is triggered by Leave(VulnerabilityCase) from the Case Owner.
    postconditions:
    - description: >-
        Participant record updated; CaseLedgerEntry committed and broadcast;
        embargo teardown triggered when any participant's CaseStatus carries
        CS.P, CS.X, or CS.A and an active embargo exists.
    relationships:
    - rel_type: refines
      spec_id: SYNC-02-002
      note: step 3 propagation must use canonical Announce(CaseLedgerEntry) fan-out
  - id: DEMOMA-07-006
    priority: MUST
    kind: project
    statement: >-
      **SUPERSEDED by CM-23-001 and ADR-0050**  The BT node decomposition
      requirements for DEMOMA-07-003 step 5 (AllParticipantsRMClosedConditionNode,
      CloseNotYetEmittedConditionNode, EmitCloseCaseNode) are retired from the
      add_participant_status_tree path.  Those nodes MUST NOT be wired into
      add_participant_status_tree; they were live dead code after PR #1909 because
      the AutoCloseSequence evaluated AllParticipantsRMClosedConditionNode only
      when Add(ParticipantStatus) arrived, which always precedes any Leave and
      therefore could never observe all participants at RM.CLOSED.
      The equivalent closure logic belongs in the Leave(VulnerabilityCase) receive
      path, implemented by #1901 (CM-23-002, CM-23-003, ADR-0051).
    testable: true
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-07-003
      note: >-
        Step 5 is superseded; AutoCloseSequence removed from add_participant_status_tree
  - id: DEMOMA-07-004
    priority: SHOULD
    kind: project
    statement: >-
      The participant status trigger implementation SHOULD be layered: SvcAddObjectToCaseUseCase
      (generic Add(object, target=Case)) as the base, SvcAddParticipantStatusUseCase (new core
      use case) above it, and demo-specific endpoints in demo_triggers.py at the top
  - id: DEMOMA-07-005
    priority: MUST_NOT
    kind: project
    statement: >-
      The Case Actor received handler for ADD_PARTICIPANT_STATUS_TO_PARTICIPANT MUST NOT
      send a raw Add(ParticipantStatus) re-broadcast directly to peer participants after
      updating the local participant record. Announce(CaseLedgerEntry) fan-out is the sole
      canonical propagation path for status updates to peers (DEMOMA-07-003 step 3); a
      parallel raw re-broadcast causes every peer to receive and process the same status
      update twice — once as a raw Add(ParticipantStatus) and once wrapped in
      Announce(CaseLedgerEntry) — producing duplicate state transitions and non-canonical
      messages in peer inboxes. This artefact is superseded by ADR-0019.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-07-003
      note: prohibits the pre-SYNC raw re-broadcast artefact superseded by ADR-0019
    - rel_type: refines
      spec_id: SYNC-02-002
      note: Announce(CaseLedgerEntry) is the sole canonical propagation path for status updates
- id: DEMOMA-08
  title: Case Actor Bootstrap and CASE_MANAGER Role
  specs:
  - id: DEMOMA-08-001
    priority: MUST
    kind: project
    statement: >-
      The vendor MUST send Create(VulnerabilityCase) (not Announce) to the Reporter as the
      trust bootstrap after case initialization; only the Case Actor uses Announce for
      subsequent case updates.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-001
      note: original report submission path bootstrap
  - id: DEMOMA-08-002
    priority: MUST
    kind: project
    deprecated: true
    statement: >-
      CASE_MANAGER role delegation MUST be implemented as a distinct protocol mechanism from
      OFFER_CASE_OWNERSHIP_TRANSFER. CASE_MANAGER delegation allows the Vendor to retain
      CASE_OWNER while delegating operational authority to a service actor. The three-message
      handshake (Offer/Accept/Reject) MUST use distinct `MessageSemantics` values:
      `OFFER_CASE_MANAGER_ROLE`, `ACCEPT_CASE_MANAGER_ROLE`, `REJECT_CASE_MANAGER_ROLE`.
    rationale: >-
      Superseded by ADR-0039 (CONCERN-2322). The `OFFER_CASE_MANAGER_ROLE` wire format and
      all supporting infrastructure were removed and replaced by `OFFER_CASE_PARTICIPANT_ROLE`
      (`Offer(CaseParticipantRole, target=Actor, context=VulnerabilityCase)`), which is
      self-describing and eliminates the ambiguity with OFFER_CASE_OWNERSHIP_TRANSFER.
      See SE-08-005.
  - id: DEMOMA-08-006
    priority: MUST
    kind: project
    deprecated: true
    statement: >-
      `OfferCaseManagerRolePattern`, `AcceptCaseManagerRolePattern`, and
      `RejectCaseManagerRolePattern` MUST be registered in
      `SEMANTICS_ACTIVITY_PATTERNS` in `vultron/semantic_registry/__init__.py`.
      `OfferCaseManagerRoleReceivedUseCase`, `AcceptCaseManagerRoleReceivedUseCase`, and
      `RejectCaseManagerRoleReceivedUseCase` MUST be registered in the `use_case_map`.
    rationale: >-
      Superseded by ADR-0039 (CONCERN-2322). These patterns and use cases were deleted;
      the replacement registry entries are `OFFER_CASE_PARTICIPANT_ROLE`,
      `ACCEPT_CASE_PARTICIPANT_ROLE`, and `REJECT_CASE_PARTICIPANT_ROLE` backed by
      `OfferCaseParticipantRoleReceivedUseCase`. See SE-08-005.
  - id: DEMOMA-08-007
    priority: MUST
    kind: project
    deprecated: true
    statement: >-
      A trigger-side use case `SvcOfferCaseManagerRoleUseCase` MUST be implemented in
      `vultron/core/use_cases/triggers/actor.py` (or a new module in that package).
      It MUST build an `_OfferCaseManagerRoleActivity` addressed to the target Case Actor
      and enqueue it to the offering Vendor's outbox.
    rationale: >-
      Superseded by ADR-0039 (CONCERN-2322). `SvcOfferCaseManagerRoleUseCase` was deleted;
      the replacement is the `offer_case_participant_role` adapter method and
      `SvcOfferCaseParticipantRoleUseCase`. See SE-08-005.
  - id: DEMOMA-08-008
    priority: SHOULD
    kind: project
    deprecated: true
    statement: >-
      A trigger-side use case `SvcAcceptCaseManagerRoleUseCase` SHOULD be implemented
      for the Case Actor to explicitly accept (rather than auto-accepting via the received
      use case). This allows manual override of the auto-accept behavior for deployments
      that require explicit operator approval before the Case Actor assumes the role.
    rationale: >-
      Superseded by ADR-0039 (CONCERN-2322). `SvcAcceptCaseManagerRoleUseCase` was deleted;
      auto-acceptance is now handled by `AutoAcceptCaseParticipantRoleNode` in the received
      tree. See SE-08-005.
  - id: DEMOMA-08-009
    priority: MUST
    kind: project
    deprecated: true
    statement: >-
      Unit and integration tests MUST cover the full CASE_MANAGER delegation handshake:
      (1) Vendor offers role via `_OfferCaseManagerRoleActivity`,
      (2) Case Actor auto-accepts via `OfferCaseManagerRoleReceivedUseCase`,
      (3) Vendor receives `_AcceptCaseManagerRoleActivity` and triggers
      trust bootstrap `Create(VulnerabilityCase)` to Reporter.
    rationale: >-
      Superseded by ADR-0039 (CONCERN-2322). `_OfferCaseManagerRoleActivity` and
      `OfferCaseManagerRoleReceivedUseCase` were deleted. Test coverage for the
      replacement flow (`Offer(CaseParticipantRole)` handshake) is in
      `test/core/behaviors/case/nodes/test_delegation.py` and
      `test/adapters/driven/trigger_activity_adapter/test_actors.py`.
  - id: DEMOMA-08-003
    priority: MUST_NOT
    kind: project
    statement: >-
      CASE_MANAGER role delegation MUST NOT reuse or adapt the existing
      OFFER_CASE_OWNERSHIP_TRANSFER, ACCEPT_CASE_OWNERSHIP_TRANSFER, or
      REJECT_CASE_OWNERSHIP_TRANSFER message semantics; these are distinct protocol operations
      with different semantics and different effects on case ownership
  - id: DEMOMA-08-004
    priority: MUST
    kind: project
    statement: >-
      When the Case Actor accepts the CASE_MANAGER delegation, it MUST run the case
      initialization BT: establish the default embargo with both Vendor and Reporter
      immediately as SIGNATORY (no invite/accept round-trip), and set EM state to ACTIVE
      before the trust bootstrap is sent to the Reporter
  - id: DEMOMA-08-005
    priority: MUST
    kind: project
    statement: >-
      All nested domain objects in the bootstrap `Create(VulnerabilityCase)` activity (e.g.,
      `CaseParticipant` objects in `case_participants`) MUST be embedded as full inline
      objects, not as bare URI string references
    rationale: >-
      Receiving handlers store nested objects by iterating the embedded collection and
      persisting each object individually. Bare URI string references cannot be deserialized
      to typed domain objects; the referenced objects are never written to the receiver's
      DataLayer. Downstream BT nodes (e.g., `CheckParticipantExists`) then fail because
      participant records are absent.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-007
  - id: DEMOMA-08-010
    priority: MUST
    kind: project
    statement: >-
      The trust bootstrap payload MUST include all three participants (Vendor, Reporter,
      Case Actor) so the Reporter can bind the Case Actor identity to this case.
    rationale: >-
      Without all three participants embedded in the bootstrap payload, the Reporter
      cannot establish trust for the Case Actor and cannot route subsequent protocol
      messages correctly.
- id: DEMOMA-09
  title: FVV Scenario (Finder → Vendor1 → Vendor2, no Coordinator)
  trigger:
    type: scenario_start
    value: fvv
  specs:
  - id: DEMOMA-09-001
    priority: MUST
    kind: project
    statement: >-
      The FVV scenario MUST seed three independent actor containers — Finder, Vendor1, and
      Vendor2 — with no Coordinator; each container MUST have its own isolated DataLayer.
  - id: DEMOMA-09-002
    priority: MUST
    kind: project
    statement: >-
      Vendor1 MUST invite Vendor2 to the case after accepting the report (RM→ACCEPTED),
      and Vendor2 MUST accept and become a full SIGNATORY participant before the scenario
      advances to fix tracking.
    preconditions:
    - description: Vendor1 RM state = ACCEPTED; VulnerabilityCase created with CaseActor
        co-located in Vendor1 container; Vendor2 container running
    steps:
    - order: 1
      actor: vendor1
      action: POST invite-actor-to-case trigger for Vendor2
      expected: CaseActor receives and queues Invite(Actor, Case) for Vendor2
    - order: 2
      actor: demo-script
      action: Poll Vendor2 DataLayer until Invite(Actor, Case) is visible
      expected: Invite activity present in Vendor2 DataLayer
    - order: 3
      actor: vendor2
      action: POST accept-case-invite trigger
      expected: Vendor2 becomes SIGNATORY participant; CaseActor seeds Vendor2 case replica
    postconditions:
    - description: Vendor2 is a SIGNATORY participant with EM consent; Vendor2 holds a
        seeded case replica; scenario may advance to fix tracking
  - id: DEMOMA-09-003
    priority: MUST
    kind: project
    statement: >-
      The FVV scenario MUST reach a final state of VFDPxa CS on all three actor replicas
      (Finder, Vendor1, Vendor2), with EM.EXITED and RM.CLOSED for all participants;
      both Vendor1 and Vendor2 MUST each have their own Vendor Fix Path tracked
      independently
  - id: DEMOMA-09-004
    priority: MUST
    kind: project
    statement: >-
      The FVV scenario MUST run deterministically end-to-end via a single
      `docker compose` command using the existing multi-actor Compose stack; the
      scenario script MUST verify LedgerFanout replica convergence (both Finder and Vendor2
      replicas match the authoritative Vendor1 state) after each major protocol event
  - id: DEMOMA-09-005
    priority: MUST
    kind: project
    statement: >-
      The PR that introduces the FVV scenario script MUST also add a dedicated parallel
      CI job to `.github/workflows/demo-integration.yml` that runs the FVV scenario
      using `DEMO=fvv`; the job MUST run concurrently with (not after) the FV
      job so that total CI wall-clock time does not grow linearly with scenario count
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-03-004
  - id: DEMOMA-09-006
    priority: MUST
    kind: project
    statement: >-
      The Case Actor MUST be co-located in the Vendor1 container in the FVV scenario.
    rationale: >-
      FVV uses no dedicated Coordinator actor, so the Case Actor runs as a sub-actor
      within the Vendor1 container rather than in a separate container.

- id: DEMOMA-10
  title: FVCV-Extension Scenario (Vendor1 retains ownership; Coordinator is participant; Coordinator suggests Vendor2)
  trigger:
    type: scenario_start
    value: fvcv-extension
  specs:
  - id: DEMOMA-10-001
    priority: MUST
    kind: project
    statement: >-
      The FVCV-extension scenario MUST involve four actor identities — Finder, Vendor1,
      Coordinator, and Vendor2 — each with its own isolated DataLayer; the CaseActor
      MUST run as a separate actor identity with its own container and DataLayer, not
      co-located in the Vendor1 container.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-10-002
    priority: MUST
    kind: project
    statement: >-
      Vendor1 MUST create the case (RM→ACCEPTED) and retain `CVDRole.CASE_OWNER`
      throughout the entire scenario. Ownership MUST NOT transfer to the Coordinator.
    rationale: >-
      This scenario demonstrates the "extension" variant: a vendor seeks facilitation
      help without surrendering case control, in contrast to the FVCV-handoff variant
      where ownership transfers.
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
  - id: DEMOMA-10-003
    priority: MUST
    kind: project
    statement: >-
      Vendor1 MUST invite the Coordinator to the case and the Coordinator MUST accept
      and become a participant holding CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER.
    preconditions:
    - description: Vendor1 RM state = ACCEPTED; VulnerabilityCase created with CaseActor;
        Coordinator container running
    steps:
    - order: 1
      actor: vendor1
      action: POST invite-actor-to-case trigger targeting Coordinator
      expected: CaseActor queues Invite(Actor, Case) for Coordinator inbox
    - order: 2
      actor: demo-script
      action: Poll Coordinator DataLayer until Invite(Actor, Case) is visible
      expected: Invite activity present in Coordinator DataLayer
    - order: 3
      actor: coordinator
      action: POST accept-case-invite trigger
      expected: >-
        Coordinator becomes participant with CVDRole.COORDINATOR (not CASE_MANAGER);
        CaseActor seeds Coordinator case replica
    postconditions:
    - description: >-
        Coordinator is a participant with CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER;
        Coordinator holds a seeded case replica
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
  - id: DEMOMA-10-004
    priority: MUST
    kind: project
    statement: >-
      The Coordinator MUST suggest Vendor2 to the case and the CaseActor MUST
      transform the offer and forward it to Vendor1 for approval.
    preconditions:
    - description: >-
        Coordinator is an accepted participant (DEMOMA-10-003 complete); Vendor2
        container running; no existing suggestion for Vendor2 in the case
    steps:
    - order: 1
      actor: coordinator
      action: POST suggest-actor-to-case trigger for Vendor2
      expected: Coordinator sends Offer(Actor, Case) to CaseActor inbox
    - order: 2
      actor: case-actor
      action: Transform Offer(Actor, Case) to Offer(CaseParticipant{Vendor2, roles=[vendor]}, Case)
      expected: Transformed offer forwarded to Vendor1 (Case Owner) inbox
    - order: 3
      actor: demo-script
      action: Poll Vendor1 DataLayer until transformed Offer(CaseParticipant) is visible
      expected: Transformed offer present in Vendor1 DataLayer
    postconditions:
    - description: >-
        Vendor1 holds a pending Offer(CaseParticipant) for Vendor2 awaiting approval;
        no invitation has been sent to Vendor2 yet
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-003
  - id: DEMOMA-10-005
    priority: MUST
    kind: project
    statement: >-
      Vendor1 MUST approve the Coordinator's suggestion and the CaseActor MUST then
      send Invite(CaseStub+embargo) to Vendor2 on Vendor1's behalf.
    preconditions:
    - description: >-
        Vendor1 DataLayer holds pending Offer(CaseParticipant) for Vendor2
        (DEMOMA-10-004 complete); Vendor2 container running
    steps:
    - order: 1
      actor: vendor1
      action: POST accept-actor-recommendation trigger for Vendor2
      expected: Vendor1 accepts Offer(CaseParticipant); CaseActor sends Invite(CaseStub+embargo) to Vendor2
    - order: 2
      actor: demo-script
      action: Poll Vendor2 DataLayer until Invite(CaseStub+embargo) is visible
      expected: Invite activity present in Vendor2 DataLayer
    postconditions:
    - description: >-
        Vendor2 holds an invitation to the case; scenario may advance to Vendor2
        acceptance
    relationships:
    - rel_type: refines
      spec_id: CM-17-001
    - rel_type: refines
      spec_id: CM-20-002
  - id: DEMOMA-10-006
    priority: MUST
    kind: project
    statement: >-
      The FVCV-extension scenario MUST reach a final state with four participants —
      Finder, Vendor1, Coordinator, and Vendor2 (plus the CaseActor) — and MUST
      advance to VFDPxa CS with EM.EXITED and RM.CLOSED for all participants.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
  - id: DEMOMA-10-007
    priority: MUST
    kind: project
    statement: >-
      The FVCV-extension scenario MUST run deterministically end-to-end; the scenario
      script MUST verify LedgerFanout replica convergence for Finder, Coordinator, and Vendor2
      replicas against the authoritative Vendor1 state after each major protocol event.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-004
  - id: DEMOMA-10-008
    priority: MUST
    kind: project
    statement: >-
      The implementation of the FVCV-extension scenario MUST add a dedicated parallel
      CI job that runs the scenario concurrently with existing demo CI jobs; the scenario
      MUST be runnable end-to-end via a single orchestration command (e.g., `docker compose`).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-005
  - id: DEMOMA-10-009
    priority: MUST
    kind: project
    statement: >-
      The Vendor1 actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from
      `server_base_url` (per CP-08-001 through CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-10-001

- id: DEMOMA-11
  title: FVCV-Handoff Scenario (Vendor1 transfers ownership to Coordinator; Coordinator invites Vendor2)
  trigger:
    type: scenario_start
    value: fvcv-handoff
  specs:
  - id: DEMOMA-11-001
    priority: MUST
    kind: project
    statement: >-
      The FVCV-handoff scenario MUST involve four actor identities with isolated
      DataLayers and a separate CaseActor container, as required by DEMOMA-10-001.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-001
  - id: DEMOMA-11-002
    priority: MUST
    kind: project
    statement: >-
      Vendor1 MUST transfer case ownership to the Coordinator via the
      offer-case-ownership-transfer / accept-case-ownership-transfer handshake.
    rationale: >-
      This is the defining contrast with FVCV-extension (DEMOMA-10-002): ownership
      transfers mid-scenario rather than staying with Vendor1 throughout.
      The Coordinator must already hold a case replica before accepting ownership,
      because AcceptCaseOwnershipTransferNode reads the case from the DataLayer
      and returns FAILURE if the case is not found.
    preconditions:
    - description: >-
        Vendor1 RM state = ACCEPTED; Coordinator is an existing SIGNATORY participant
        with a seeded case replica in their DataLayer; no pending ownership-transfer offer
        exists
    steps:
    - order: 1
      actor: vendor1
      action: POST offer-case-ownership-transfer trigger targeting Coordinator
      expected: Offer(VulnerabilityCase) queued for Coordinator inbox
    - order: 2
      actor: demo-script
      action: Poll Coordinator DataLayer until Offer(VulnerabilityCase) is visible
      expected: Offer activity present in Coordinator DataLayer
    - order: 3
      actor: coordinator
      action: POST accept-case-ownership-transfer trigger
      expected: >-
        Coordinator CVDRole updated to CASE_OWNER; Vendor1 role updated to plain
        participant; CaseActor attributed_to updated to Coordinator actor ID
    postconditions:
    - description: >-
        Coordinator holds CVDRole.CASE_OWNER; Vendor1 is a plain participant;
        CaseActor.attributed_to = Coordinator actor ID; all participants' case
        replicas reflect the updated ownership
    relationships:
    - rel_type: refines
      spec_id: TRIG-11-001
    - rel_type: refines
      spec_id: TRIG-11-002
  - id: DEMOMA-11-003
    priority: MUST
    kind: project
    statement: >-
      After becoming CASE_OWNER, the Coordinator MUST invite Vendor2 directly using the
      invite-actor-to-case trigger, and Vendor2 MUST accept the invitation before the
      scenario advances.
    rationale: >-
      In FVCV-extension, Vendor1 approves a Coordinator suggestion. In FVCV-handoff,
      the Coordinator is the owner and invites directly — no approval step is needed.
      The Vendor2 accept-invite step is mandatory: per MV-10-004 an Invite alone does
      not seed the replica; the CaseActor's Announce fires only after Accept(Invite).
    preconditions:
    - description: >-
        Coordinator holds CVDRole.CASE_OWNER (DEMOMA-11-002 complete); Vendor2 container
        running; no existing Invite for Vendor2 in the case
    steps:
    - order: 1
      actor: coordinator
      action: POST invite-actor-to-case trigger for Vendor2
      expected: CaseActor queues Invite(Actor, Case) for Vendor2
    - order: 2
      actor: demo-script
      action: Poll Vendor2 DataLayer until Invite(Actor, Case) is visible
      expected: Invite activity present in Vendor2 DataLayer
    - order: 3
      actor: vendor2
      action: POST accept-case-invite trigger directed to CaseActor
      expected: >-
        Vendor2 becomes SIGNATORY participant; CaseActor emits
        Announce(VulnerabilityCase) to seed Vendor2 case replica
    - order: 4
      actor: demo-script
      action: Poll Vendor2 DataLayer until case replica is seeded
      expected: VulnerabilityCase record present in Vendor2 DataLayer
    postconditions:
    - description: >-
        Vendor2 is a SIGNATORY participant with a seeded case replica; scenario may
        advance to fix tracking and final state
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-003
  - id: DEMOMA-11-004
    priority: MUST
    kind: project
    statement: >-
      The `CaseActor.attributed_to` field MUST be updated to the Coordinator's actor
      ID after the ownership transfer completes. All participants MUST observe the
      updated `attributed_to` in their case replicas.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-002
  - id: DEMOMA-11-005
    priority: MUST
    kind: project
    statement: >-
      An active embargo initiated before an ownership transfer MUST remain ACTIVE
      through and after the transfer; the EM state machine MUST transition correctly
      through the ownership change.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-006
  - id: DEMOMA-11-006
    priority: MUST
    kind: project
    statement: >-
      The FVCV-handoff scenario MUST reach a final state with four participants —
      Finder, Vendor1, Coordinator, and Vendor2 (plus CaseActor) — and MUST advance
      to VFDPxa CS with EM.EXITED and RM.CLOSED for all participants, as required by
      DEMOMA-10-006.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-006
  - id: DEMOMA-11-007
    priority: MUST
    kind: project
    statement: >-
      The FVCV-handoff scenario MUST run deterministically and MUST verify LedgerFanout
      replica convergence for all non-owning participants after each major protocol
      event, as required by DEMOMA-10-007.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-007
  - id: DEMOMA-11-008
    priority: MUST
    kind: project
    statement: >-
      The implementation of the FVCV-handoff scenario MUST add a dedicated parallel
      CI job and a CLI entry point, as required by DEMOMA-10-008.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-008
  - id: DEMOMA-11-009
    priority: MUST
    kind: project
    statement: >-
      The FVCV-handoff scenario script MUST include polling wait steps at each
      asynchronous protocol boundary before driving the next trigger.
    rationale: >-
      Each of these polling steps was required in FVCV-extension (see ISSUE-1535
      post-review fixes). Omitting any wait step causes the scenario to proceed on
      state that has not yet been committed to the target actor's DataLayer,
      producing consistent CI failures rather than intermittent flakes.
      This requirement is the FVCV-handoff instance of the general rule
      DEMOMA-22-001 (see relationships).
    preconditions:
    - description: >-
        FVCV-handoff scenario executing; Vendor1 has just emitted the ownership-transfer
        offer and the script is driving subsequent async steps
    steps:
    - order: 1
      actor: demo-script
      action: >-
        After emitting the ownership-transfer offer: poll Coordinator's DataLayer until
        Offer(VulnerabilityCase) is visible
      expected: Offer activity present in Coordinator DataLayer
    - order: 2
      actor: demo-script
      action: >-
        After Coordinator accepts the offer: poll Vendor1's case replica until
        attributed_to reflects the Coordinator's actor ID
      expected: Vendor1 case replica shows CaseActor.attributed_to = Coordinator actor ID
    - order: 3
      actor: demo-script
      action: >-
        After Coordinator invites Vendor2: poll Vendor2's DataLayer until
        Invite(Actor, Case) is visible
      expected: Invite activity present in Vendor2 DataLayer
    - order: 4
      actor: demo-script
      action: >-
        After Vendor2 accepts the invitation: poll Vendor2's DataLayer until the case
        replica seeded by CaseActor's Announce(VulnerabilityCase) is present
      expected: VulnerabilityCase record present in Vendor2 DataLayer
    postconditions:
    - description: >-
        All four async boundaries confirmed; each actor's DataLayer reflects the
        expected state before the next trigger is driven; scenario proceeds
        deterministically
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-007
    - rel_type: refines
      spec_id: DEMOMA-22-001
      note: >-
        This requirement is the FVCV-handoff instance of the general rule
        DEMOMA-22-001, which applies the same constraint to every scenario and
        additionally constrains *what* the wait may observe (EDF-06-001 through
        EDF-06-003). "A polling wait exists here" is necessary but not
        sufficient. This requirement remains active; it is not superseded.
  - id: DEMOMA-11-010
    priority: MUST
    kind: project
    statement: >-
      The Vendor1 actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from `server_base_url`
      (per CP-08-001 through CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-10-009
  - id: DEMOMA-11-011
    priority: MUST
    kind: project
    statement: >-
      After the FVCV-handoff ownership transfer, the Coordinator MUST hold
      CVDRole.CASE_OWNER.
    rationale: >-
      The ownership transfer postcondition for the Coordinator: it becomes the case owner.
  - id: DEMOMA-11-012
    priority: MUST
    kind: project
    statement: >-
      The CaseActor MUST seed Vendor2's case replica on Vendor2's acceptance of the
      FVCV-handoff invitation.
    rationale: >-
      Replica seeding is the CaseActor's responsibility after each new participant
      accepts an invitation.
  - id: DEMOMA-11-013
    priority: MUST
    kind: project
    statement: >-
      All participants (including Vendor2 after joining) MUST be subject to an active
      embargo that was established before the FVCV-handoff ownership transfer.
    rationale: >-
      Ownership transfer does not alter PEC consent state; all prior signatories and
      any late-joining participants remain bound by the active embargo.
  - id: DEMOMA-11-014
    priority: MUST
    kind: project
    statement: >-
      After the FVCV-handoff ownership transfer, Vendor1 MUST become a plain
      participant (no longer holding CVDRole.CASE_OWNER).
    rationale: >-
      The ownership transfer postcondition for Vendor1: it relinquishes the case-owner
      role and becomes an ordinary participant.

- id: DEMOMA-12
  title: FCV Scenario (Finder reports to Coordinator; Coordinator invites Vendor)
  specs:
  - id: DEMOMA-12-001
    priority: MUST
    kind: project
    statement: >-
      The FCV scenario MUST involve four actor identities — Finder, Coordinator,
      Vendor, and CaseActor — each with its own isolated DataLayer and separate
      container. The CaseActor MUST run as a separate actor identity with its own
      container and DataLayer, not co-located on the Coordinator container.
    rationale: >-
      FCV is the canonical three-party coordination baseline. Using four separate
      containers (Finder, Coordinator, Vendor, CaseActor) matches the FVCV-extension
      topology (DEMOMA-10-001) and ensures the demo exercises true multi-container
      message delivery rather than in-process calls.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-12-002
    priority: MUST
    kind: project
    statement: >-
      The Coordinator MUST receive the Finder's report (RM→RECEIVED), validate it
      (RM→VALID), and engage the case (RM→ACCEPTED), which triggers CaseActor
      creation on the Coordinator's container.
    rationale: >-
      FCV is the canonical Coordinator-as-owner scenario: Finder reports to
      Coordinator, Coordinator creates the case. This contrasts with FVV (Vendor
      is owner) and FVCV-extension (Vendor retains ownership). The CaseActor
      service actor holds CASE_MANAGER alongside COORDINATOR role per glossary;
      the Coordinator human actor holds CASE_OWNER only.
    preconditions:
    - description: >-
        All four containers running (Finder, Coordinator, Vendor, CaseActor);
        no VulnerabilityCase exists for this report; Coordinator
        auto_create_case=True; Coordinator pre-configured with the dedicated
        CaseActor container URL
    steps:
    - order: 1
      actor: finder
      action: POST submit-report trigger directed at Coordinator
      expected: Report delivered to Coordinator inbox
    - order: 2
      actor: coordinator
      action: BT processes inbound report; RM transitions RECEIVED→VALID→ACCEPTED
      expected: >-
        VulnerabilityCase created; CaseActor registered on the separate
        CaseActor container (not co-located on the Coordinator container,
        per DEMOMA-12-001); default embargo initialized to EM.ACTIVE
        (EP-04-001); EM.ACTIVE is established at case creation before
        any participant invitation
    - order: 3
      actor: coordinator
      action: Coordinator assigned CVDRole.CASE_OWNER on the new case
      expected: Coordinator holds CASE_OWNER; CaseActor holds CASE_MANAGER
    - order: 4
      actor: coordinator
      action: >-
        Coordinator sends trust-bootstrap Create(VulnerabilityCase) to Finder
        (CBT-01-001); Finder is the original report submitter so MUST receive
        this one-time bootstrap to trust the CaseActor identity
      expected: >-
        Finder receives Create(VulnerabilityCase) carrying Coordinator as
        CASE_OWNER and CaseActor as COORDINATOR; Finder trusts CaseActor
        for this case
    postconditions:
    - description: >-
        VulnerabilityCase exists; Coordinator RM=ACCEPTED, CVDRole=CASE_OWNER;
        CaseActor running with CASE_MANAGER on its own container; EM.ACTIVE
        established; trust bootstrap delivered to Finder; no ownership
        transfer has occurred
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    - rel_type: refines
      spec_id: CBT-01-001
    - rel_type: refines
      spec_id: EP-04-001
  - id: DEMOMA-12-003
    priority: MUST
    kind: project
    statement: >-
      The Coordinator MUST invite Finder to the case using the `invite-actor-to-case`
      trigger after case creation. Finder MUST accept the invitation and become a
      full SIGNATORY participant with a case replica in their DataLayer before
      Vendor is invited.
    preconditions:
    - description: >-
        DEMOMA-12-002 postconditions satisfied: VulnerabilityCase exists,
        Coordinator RM=ACCEPTED, CVDRole=CASE_OWNER, EM.ACTIVE, trust bootstrap
        Create(VulnerabilityCase) already delivered to Finder (CBT-01-001);
        Finder has trusted CaseActor identity but is not yet a formal case
        participant (no Invite/Accept exchange has occurred)
    steps:
    - order: 1
      actor: coordinator
      action: POST invite-actor-to-case trigger for Finder
      expected: >-
        Invite(Actor, Case) sent from CaseActor (not Coordinator) to Finder
        inbox (PCR-08-007); invitation record present in Finder DataLayer
    - order: 2
      actor: demo_script
      action: Poll Finder DataLayer until Invite(Actor, Case) is visible
      expected: Invitation record present in Finder replica
    - order: 3
      actor: finder
      action: POST accept-case-invite trigger directed to CaseActor (PCR-08-008)
      expected: >-
        Finder transitions to SIGNATORY (MV-10-006); CaseActor emits
        Announce(VulnerabilityCase) to seed Finder replica (PCR-02-002)
    postconditions:
    - description: >-
        Finder is SIGNATORY with a seeded case replica; Vendor invitation has
        not yet been issued
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
  - id: DEMOMA-12-004
    priority: MUST
    kind: project
    statement: >-
      The Coordinator MUST invite Vendor to the case using the `invite-actor-to-case`
      trigger directly (not via a suggestion/approval chain); Vendor MUST accept via
      the `accept-case-invite` trigger.
    rationale: >-
      Coordinator is CASE_OWNER, so a direct `invite-actor-to-case` is correct;
      the ADR-0026 suggest/approve chain is for participants recommending actors to
      the case owner, not for the owner inviting directly. Polling before accept
      is required for determinism (per DEMOMA-11-009 pattern).
    preconditions:
    - description: >-
        Finder is SIGNATORY (DEMOMA-12-003 postconditions satisfied);
        Vendor is not yet a case participant
    steps:
    - order: 1
      actor: coordinator
      action: POST invite-actor-to-case trigger for Vendor
      expected: Invite(Actor, Case) delivered to Vendor inbox
    - order: 2
      actor: demo_script
      action: Poll Vendor DataLayer until Invite(Actor, Case) is visible
      expected: Invitation record present in Vendor replica
    - order: 3
      actor: vendor
      action: POST accept-case-invite trigger
      expected: >-
        Vendor transitions to SIGNATORY; CaseActor emits Announce(VulnerabilityCase)
        to seed Vendor replica with full case history
    postconditions:
    - description: >-
        Vendor is SIGNATORY with a seeded case replica containing full history
        from genesis; all three actors (Finder, Coordinator, Vendor) plus
        CaseActor are now case participants
    relationships:
    - rel_type: refines
      spec_id: CM-17-001
    adr:
    - ADR-0026
  - id: DEMOMA-12-005
    priority: MUST
    kind: project
    statement: >-
      The FCV scenario MUST reach a final state with three participants — Finder,
      Coordinator, and Vendor (plus the CaseActor) — advancing to VFDPxa CS with
      EM.EXITED and RM.CLOSED for all participants; only Vendor's fix path (VFD)
      is tracked.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: EP-04-001
  - id: DEMOMA-12-006
    priority: MUST
    kind: project
    statement: >-
      The FCV scenario MUST run deterministically end-to-end and MUST verify LedgerFanout
      replica convergence for Finder and Vendor replicas against the authoritative
      Coordinator/CaseActor state after each major protocol event.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-004
  - id: DEMOMA-12-007
    priority: MUST
    kind: project
    statement: >-
      The implementation of the FCV scenario MUST add a dedicated parallel CI job
      (`DEMO=fcv`) to `.github/workflows/demo-integration.yml` in the same PR, so
      CI failures are independently reported per DEMOCI-03-003.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-03-002
    - rel_type: refines
      spec_id: DEMOCI-03-003
  - id: DEMOMA-12-008
    priority: MUST
    kind: project
    statement: >-
      The FCV implementation MUST ship a dedicated per-scenario case-ledger
      invariant test file (`test/ci/invariants/test_fcv_invariants.py`) built
      exclusively on the shared invariant library introduced by the harness
      refactor (issue #1592); DEMOMA-12-008 is satisfied only when that shared
      library exists.
    rationale: >-
      Requiring use of the shared library enforces the DRY constraint across
      scenarios. A file that copies invariant logic is not compliant even if
      it tests the correct things.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-006
  - id: DEMOMA-12-009
    priority: MUST
    kind: project
    statement: >-
      The FCV per-scenario invariant test file MUST assert the following
      scenario-specific checks in addition to the universal library checks:
      (1) `validate_report` event present in case-actor log,
      (2) `invite_actor_to_case` present at least twice (Finder invitation +
      Vendor invitation), (3) `close_case` present, (4) CS transitions VFd
      and VFD observed in `add_participant_status_to_participant` entries for
      the Vendor actor and public-aware (P) transition observed in
      `add_participant_status_to_participant` entries for the Coordinator actor,
      and (5) Vendor replica holds the complete log from genesis (full history
      backfill, as Vendor is a late joiner).
    rationale: >-
      Scenario-specific invariants prevent the FCV scenario from accidentally
      omitting protocol steps not covered by universal checks. Explicitly
      enumerating them here means CI will catch regressions in the steps
      unique to FCV.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-008
  - id: DEMOMA-12-010
    priority: MUST
    kind: project
    statement: >-
      The Coordinator actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from `server_base_url`
      (per CP-08-001 through CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-12-001
  - id: DEMOMA-12-011
    priority: MUST
    kind: project
    statement: >-
      The Coordinator MUST hold `CVDRole.CASE_OWNER` throughout the entire FCV scenario;
      ownership MUST NOT transfer to any other actor.
    rationale: >-
      FCV is the canonical Coordinator-as-owner scenario. Retaining CASE_OWNER
      throughout differentiates it from FVCV-extension and FVCV-handoff variants.
  - id: DEMOMA-12-012
    priority: MUST
    kind: project
    statement: >-
      The CaseActor MUST emit `Announce(VulnerabilityCase)` to seed Vendor's case replica
      after Vendor accepts the invitation in the FCV scenario.
    rationale: >-
      Replica seeding via Announce is the CaseActor's canonical response to an accepted
      invitation (PCR-02-002).
  - id: DEMOMA-12-013
    priority: MUST
    kind: project
    statement: >-
      The FCV demo script MUST poll Vendor's DataLayer for the arriving invitation before
      driving the accept step.
    rationale: >-
      Polling before accept is required for determinism; driving accept before the
      invitation is visible in Vendor's DataLayer causes a race condition.
  - id: DEMOMA-12-014
    priority: MUST
    kind: project
    statement: >-
      FCV demo scripts MUST verify EM.ACTIVE at the case-creation milestone and EM.EXITED
      at the final milestone.
    rationale: >-
      The causal chain EM.ACTIVE (established at case creation per EP-04-001) to
      EM.EXITED (triggered by CS.P per DEMOMA-07-003(4)) must be confirmed at both
      endpoints.
  - id: DEMOMA-12-015
    priority: MUST
    kind: project
    statement: >-
      The FCV invariant test file MUST NOT duplicate universal invariant logic;
      universal chain/hash/RM-closed checks MUST be imported from the shared library,
      not re-implemented inline.
    rationale: >-
      Copying invariant logic violates the DRY constraint enforced by the shared
      library architecture introduced by issue #1592.
  - id: DEMOMA-12-016
    priority: MUST
    kind: project
    statement: >-
      The P-set CS state MUST be visible in all replicas via Announce(CaseLedgerEntry)
      fan-out after the Coordinator triggers CS.P.
    rationale: >-
      Announce(CaseLedgerEntry) is the sole canonical propagation path for status
      updates to peers (SYNC-02-002); this invariant confirms the fan-out fired.

- id: DEMOMA-13
  title: FCCV-Extension Scenario (C1 retains ownership; C2 is participant; C2 suggests Vendor)
  trigger:
    type: scenario_start
    value: fccv-extension
  specs:
  - id: DEMOMA-13-001
    priority: MUST
    kind: project
    statement: >-
      The FCCV-extension scenario MUST involve four actor identities — Finder,
      Coordinator1 (C1), Coordinator2 (C2), and Vendor — each with its own isolated
      DataLayer; the CaseActor MUST run as a separate actor identity with its own
      container and DataLayer, not co-located in the C1 container.
    rationale: >-
      FCCV-extension demonstrates inter-coordinator collaboration: C1 is the Case
      Owner, C2 is a participating coordinator who can suggest new actors but cannot
      independently invite them. The five-container topology (Finder, C1, C2, Vendor,
      CaseActor) is the same as FVCV-extension (DEMOMA-10-001) with the C1 role
      replacing Vendor1 as Case Owner.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-10-001
  - id: DEMOMA-13-002
    priority: MUST
    kind: project
    statement: >-
      C1 MUST receive the Finder's report (RM→RECEIVED), validate it (RM→VALID),
      and engage the case (RM→ACCEPTED), retaining CVDRole.CASE_OWNER throughout
      the entire scenario. Ownership MUST NOT transfer to C2 or Vendor.
    rationale: >-
      This scenario demonstrates the "extension" variant where a Coordinator
      creates and owns a case. C1 acts as both the initial report recipient and
      the authority that approves all participant additions, in contrast to the
      FVCV-extension variant where a Vendor holds ownership.
    preconditions:
    - description: >-
        All five containers running (Finder, C1, C2, Vendor, CaseActor);
        no VulnerabilityCase exists for this report; C1 auto_create_case=True;
        C1 pre-configured with the dedicated CaseActor container URL
    steps:
    - order: 1
      actor: finder
      action: POST submit-report trigger directed at C1
      expected: Report delivered to C1 inbox
    - order: 2
      actor: c1
      action: BT processes inbound report; RM transitions RECEIVED→VALID→ACCEPTED
      expected: >-
        VulnerabilityCase created; CaseActor registered on the separate
        CaseActor container; default embargo initialized to EM.ACTIVE (EP-04-001)
    - order: 3
      actor: c1
      action: C1 assigned CVDRole.CASE_OWNER on the new case
      expected: C1 holds CASE_OWNER; CaseActor holds CASE_MANAGER
    - order: 4
      actor: c1
      action: >-
        C1 sends trust-bootstrap Create(VulnerabilityCase) to Finder (CBT-01-001);
        Finder is the original report submitter and MUST receive this bootstrap to
        trust the CaseActor identity
      expected: >-
        Finder receives Create(VulnerabilityCase) carrying C1 as CASE_OWNER and
        CaseActor as COORDINATOR; Finder trusts CaseActor for this case
    postconditions:
    - description: >-
        VulnerabilityCase exists; C1 RM=ACCEPTED, CVDRole=CASE_OWNER; CaseActor
        running with CASE_MANAGER on its own container; EM.ACTIVE established;
        trust bootstrap delivered to Finder; Finder is an initial participant via
        the report-submission bootstrap (not via a separate invite-actor-to-case
        trigger); no ownership transfer has occurred
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    - rel_type: refines
      spec_id: CBT-01-001
    - rel_type: refines
      spec_id: EP-04-001
    - rel_type: refines
      spec_id: DEMOMA-12-002
  - id: DEMOMA-13-003
    priority: MUST
    kind: project
    statement: >-
      C1 MUST invite C2 to the case and C2 MUST accept, becoming a participant
      holding CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER.
    preconditions:
    - description: >-
        DEMOMA-13-002 postconditions satisfied: C1 RM=ACCEPTED, CVDRole=CASE_OWNER;
        EM.ACTIVE; trust bootstrap delivered to Finder; Finder is an initial
        participant; C2 container running
    steps:
    - order: 1
      actor: c1
      action: POST invite-actor-to-case trigger targeting C2
      expected: CaseActor queues Invite(Actor, Case) for C2's inbox
    - order: 2
      actor: demo-script
      action: Poll C2 DataLayer until Invite(Actor, Case) is visible
      expected: Invite activity present in C2 DataLayer
    - order: 3
      actor: c2
      action: POST accept-case-invite trigger
      expected: >-
        C2 becomes participant with CVDRole.COORDINATOR (not CASE_MANAGER);
        CaseActor seeds C2 case replica
    postconditions:
    - description: >-
        C2 is a participant with CVDRole.COORDINATOR and NOT CVDRole.CASE_MANAGER;
        C2 holds a seeded case replica; case has four participants
        (Finder, C1, C2, CaseActor)
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
    - rel_type: refines
      spec_id: DEMOMA-10-003
  - id: DEMOMA-13-004
    priority: MUST
    kind: project
    statement: >-
      C2 MUST suggest Vendor to the case and the CaseActor MUST transform the
      offer and forward it to C1 for approval.
    preconditions:
    - description: >-
        C2 is an accepted participant (DEMOMA-13-003 complete); Vendor
        container running; no existing suggestion for Vendor in the case
    steps:
    - order: 1
      actor: c2
      action: POST suggest-actor-to-case trigger for Vendor with roles=["vendor"]
      expected: C2 sends Offer(Actor, Case) to CaseActor inbox
    - order: 2
      actor: case-actor
      action: >-
        Transform Offer(Actor, Case) to
        Offer(CaseParticipant{Vendor, roles=[vendor]}, Case)
      expected: Transformed offer forwarded to C1 (Case Owner) inbox
    - order: 3
      actor: demo-script
      action: Poll C1 DataLayer until transformed Offer(CaseParticipant) is visible
      expected: Transformed offer present in C1 DataLayer
    postconditions:
    - description: >-
        C1 holds a pending Offer(CaseParticipant) for Vendor awaiting approval;
        no invitation has been sent to Vendor yet
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-003
    - rel_type: refines
      spec_id: DEMOMA-10-004
  - id: DEMOMA-13-005
    priority: MUST
    kind: project
    statement: >-
      C1 MUST approve C2's suggestion and the CaseActor MUST then send
      Invite(CaseStub+embargo) to Vendor on C1's behalf.
    preconditions:
    - description: >-
        C1 DataLayer holds pending Offer(CaseParticipant) for Vendor
        (DEMOMA-13-004 complete); Vendor container running
    steps:
    - order: 1
      actor: c1
      action: POST accept-actor-recommendation trigger for Vendor
      expected: >-
        C1 accepts Offer(CaseParticipant); CaseActor sends
        Invite(CaseStub+embargo) to Vendor
    - order: 2
      actor: demo-script
      action: Poll Vendor DataLayer until Invite(CaseStub+embargo) is visible
      expected: Invite activity present in Vendor DataLayer
    - order: 3
      actor: vendor
      action: POST accept-case-invite trigger
      expected: >-
        Vendor becomes participant with CVDRole.VENDOR;
        CaseActor seeds Vendor case replica with full history
    postconditions:
    - description: >-
        Vendor is a participant with CVDRole.VENDOR and a seeded case replica;
        all five participants present (Finder, C1, C2, Vendor, CaseActor)
    relationships:
    - rel_type: refines
      spec_id: CM-17-001
    - rel_type: refines
      spec_id: CM-20-002
    - rel_type: refines
      spec_id: DEMOMA-10-005
  - id: DEMOMA-13-006
    priority: MUST
    kind: project
    statement: >-
      The FCCV-extension scenario MUST reach a final state with four participants —
      Finder, C1, C2, and Vendor (plus the CaseActor) — and MUST advance to
      VFDPxa CS with EM.EXITED and RM.CLOSED for all participants.
    rationale: >-
      Only Vendor tracks a vendor fix path (VFD). C1 and C2 hold CVDRole.COORDINATOR
      and have no VFD substate. Finder has no VFD substate. EM.EXITED is triggered
      by CS.P (public disclosure). C1 (CASE_OWNER) is the actor that triggers
      CS.P per DEMOMA-07-003(4).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: DEMOMA-10-006
  - id: DEMOMA-13-007
    priority: MUST
    kind: project
    statement: >-
      The FCCV-extension scenario MUST run deterministically end-to-end and MUST
      verify LedgerFanout replica convergence for Finder, C2, and Vendor replicas against
      the authoritative C1/CaseActor state after each major protocol event.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-004
    - rel_type: refines
      spec_id: DEMOMA-10-007
  - id: DEMOMA-13-008
    priority: MUST
    kind: project
    statement: >-
      The implementation of the FCCV-extension scenario MUST add a dedicated parallel
      CI job (`DEMO=fccv-extension`) to `.github/workflows/demo-integration.yml`,
      so CI failures are independently reported per DEMOCI-03-003.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-09-005
    - rel_type: refines
      spec_id: DEMOMA-10-008
  - id: DEMOMA-13-009
    priority: MUST
    kind: project
    statement: >-
      The FCCV-extension implementation MUST ship a dedicated per-scenario
      case-ledger invariant test file
      (`test/ci/invariants/test_fccv_extension_invariants.py`) built exclusively
      on the shared invariant library (per DEMOMA-12-008 pattern).
    rationale: >-
      Scenario-specific invariants prevent the FCCV-extension scenario from
      accidentally omitting protocol steps not covered by universal checks.
      The Vendor-as-late-joiner invariant is shared with FVCV-extension
      (DEMOMA-10) and FCCV-handoff (DEMOMA-15).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-008
  - id: DEMOMA-13-010
    priority: MUST
    kind: project
    statement: >-
      The C1 actor container MUST supply `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      in its Docker Compose environment pointing to the dedicated CaseActor container
      base URL (e.g., `http://case-actor:7999/api/v2`). `ResolveCaseActorUrlsNode`
      MUST derive `case_actor_id` from this configured URL, not from `server_base_url`
      (per CP-08-001 through CP-08-003).
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
    - rel_type: refines
      spec_id: DEMOMA-13-001
  - id: DEMOMA-13-011
    priority: MUST
    kind: project
    statement: >-
      The FCCV-extension invariant test file MUST assert the following
      scenario-specific checks in addition to universal library checks:
      (1) `validate_report` event present in case-actor log,
      (2) `invite_actor_to_case` present at least twice (C2 invitation + Vendor
      invitation), (3) `close_case` present, (4) CS transitions VFd and VFD
      observed in `add_participant_status_to_participant` entries for the Vendor
      actor and public-aware (P) transition observed in
      `add_participant_status_to_participant` entries for C1 (CASE_OWNER triggers
      CS.P), and (5) Vendor replica holds the complete log from genesis (full
      history backfill, as Vendor is a late joiner).
    rationale: >-
      Scenario-specific invariants prevent the FCCV-extension scenario from
      accidentally omitting protocol steps not covered by universal checks.

- id: DEMOMA-14
  title: FCCV-Handoff Scenario (C1 transfers case ownership to C2; C2 invites Vendor)
  trigger:
    type: scenario_start
    value: fccv-handoff
  specs:
  - id: DEMOMA-14-001
    priority: MUST
    kind: project
    statement: >-
      The FCCV-handoff scenario MUST involve four actor identities — Finder,
      Coordinator1 (C1), Coordinator2 (C2), and Vendor — each with its own
      isolated DataLayer; the CaseActor MUST run as a separate actor identity
      with its own container and DataLayer.
    rationale: >-
      FCCV-handoff demonstrates the case-ownership-transfer flow between two
      coordinators.  C1 starts as CASE_OWNER, then transfers ownership to C2
      via TRIG-11-001/002.  The five-container topology (Finder, C1, C2,
      Vendor, CaseActor) reuses the existing docker-compose-multi-actor.yml
      services (vendor→C1, coordinator→C2, vendor2→Vendor).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-13-001
  - id: DEMOMA-14-002
    priority: MUST
    kind: project
    statement: >-
      C1 MUST receive the Finder's report (RM→RECEIVED), validate it
      (RM→VALID), and engage the case (RM→ACCEPTED), holding
      CVDRole.CASE_OWNER until it completes the ownership transfer to C2.
    rationale: >-
      C1 acts as the initial entry point for Finder's report and establishes
      the case before delegating ownership.  This mirrors the FVCV-handoff
      pattern (DEMOMA-10) except the initial owner is a Coordinator, not a
      Vendor.
    preconditions:
    - description: >-
        All five containers running (Finder, C1, C2, Vendor, CaseActor);
        all actors seeded and cross-registered.
    steps:
    - order: 1
      actor: finder
      action: POST submit-report trigger to C1
      expected: C1 creates VulnerabilityCase; RM→RECEIVED on C1
    - order: 2
      actor: demo-script
      action: POST validate-report and engage-case triggers on C1
      expected: C1 RM→VALID then RM→ACCEPTED; C1 holds CVDRole.CASE_OWNER
    postconditions:
    - description: C1 holds CVDRole.CASE_OWNER and case attributed_to=C1.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-13-002
  - id: DEMOMA-14-003
    priority: MUST
    kind: project
    statement: >-
      C1 MUST invite C2 to the case (CVDRole.COORDINATOR), and C2 MUST accept.
    rationale: >-
      C2 must be a known participant before C1 can offer ownership transfer.
      The invite-accept flow establishes C2's presence in the case ledger.
    preconditions:
    - description: C1 is CASE_OWNER; case attributed_to=C1.
    steps:
    - order: 1
      actor: c1
      action: POST invite-actor-to-case trigger targeting C2 (CVDRole.COORDINATOR)
      expected: C1 sends Invite activity to CaseActor; CaseActor forwards to C2
    - order: 2
      actor: c2
      action: POST accept-case-invite trigger
      expected: C2 becomes a participant with CVDRole.COORDINATOR
    postconditions:
    - description: C2 is a participant; CVDRole.COORDINATOR; case attributed_to=C1.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-14-002
  - id: DEMOMA-14-004
    priority: MUST
    kind: project
    statement: >-
      C1 MUST offer case ownership transfer to C2 (TRIG-11-001) and C2 MUST
      accept (TRIG-11-002).
    rationale: >-
      This is the core FCCV-handoff invariant.  The ownership-transfer
      trigger pair (TRIG-11-001/002) is the same mechanism as FVCV-handoff
      (DEMOMA-10-006/007) and must be validated end-to-end.
    preconditions:
    - description: C2 is a participant; case attributed_to=C1.
    steps:
    - order: 1
      actor: c1
      action: POST offer-case-ownership-transfer trigger targeting C2
      expected: C1 sends Offer activity to C2's inbox via CaseActor
    - order: 2
      actor: c2
      action: POST accept-case-ownership-transfer trigger referencing the Offer
      expected: >-
        case attributed_to=C2 on C1's and C2's DataLayers; C2 holds
        CVDRole.CASE_OWNER; C1 holds CVDRole.COORDINATOR
    postconditions:
    - description: case attributed_to=C2 on C1's and C2's DataLayers.
    - description: C2 holds CVDRole.CASE_OWNER; C1 holds CVDRole.COORDINATOR.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-14-003
  - id: DEMOMA-14-005
    priority: MUST
    kind: project
    statement: >-
      C2 (the new CASE_OWNER) MUST invite Vendor to the case (NOT C1), and
      Vendor MUST accept.
    rationale: >-
      This invariant confirms that the new CASE_OWNER (C2) has the authority
      to extend the case to additional actors after the handoff, and that the
      four-actor coordination path works end-to-end.
    preconditions:
    - description: case attributed_to=C2; C2 is CASE_OWNER.
    steps:
    - order: 1
      actor: c2
      action: POST invite-actor-to-case trigger for Vendor
      expected: C2 sends Invite activity to CaseActor; CaseActor forwards to Vendor
    - order: 2
      actor: vendor
      action: POST accept-case-invite trigger directed to CaseActor
      expected: Vendor becomes a participant; Accept delivered to CaseActor inbox
    postconditions:
    - description: Vendor is a participant; all five actors have case replicas.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-14-004
  - id: DEMOMA-14-006
    priority: MUST
    kind: project
    statement: >-
      After Vendor joins, all four actor containers (Finder, C1, C2, Vendor)
      MUST converge to the same case ledger state (LedgerFanout invariant).  Vendor
      MUST receive the complete ledger backfill from genesis.
    rationale: >-
      Late-joiner backfill is a shared invariant across FVCV-extension,
      FVCV-handoff, and FCCV-handoff.  Verifying it here ensures the
      ownership-transfer workflow does not break LedgerFanout convergence.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-10-007
  - id: DEMOMA-14-007
    priority: MUST
    kind: project
    statement: >-
      Vendor MUST advance through the full fix lifecycle: CS.VFd (fix ready)
      and CS.VFD (fix deployed).
    rationale: >-
      End-to-end completion is required to exercise the full CVD coordination
      workflow in the FCCV-handoff variant.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-11-006
  - id: DEMOMA-14-008
    priority: MUST
    kind: project
    statement: >-
      The FCCV-handoff implementation MUST ship a dedicated CLI command
      (`vultron-demo fccv-handoff`) wired into `vultron/demo/cli.py`
      and registered in the `DEMOS` list.  The command MUST expose
      `--finder-url`, `--c1-url`, `--c2-url`, `--vendor-url`,
      `--case-actor-url`, `--finder-id`, `--c1-id`, `--c2-id`,
      `--vendor-id`, `--case-actor-id`, and `--skip-health-check`
      options with corresponding environment variable bindings.
    rationale: >-
      CLI consistency and Docker-entrypoint compatibility require the
      `DEMO=fccv-handoff` env var to map to `vultron-demo fccv-handoff`
      (demo-entrypoint.sh forwards the DEMO value directly).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-04-002
  - id: DEMOMA-14-009
    priority: MUST
    kind: project
    statement: >-
      The FCCV-handoff implementation MUST ship a dedicated per-scenario
      case-ledger invariant test file
      (`test/ci/invariants/test_fccv_handoff_invariants.py`) built
      exclusively on the shared invariant library (per DEMOMA-12-008 pattern).
    rationale: >-
      Scenario-specific invariants prevent the FCCV-handoff scenario from
      accidentally omitting protocol steps not covered by universal checks.
      The Vendor-as-late-joiner invariant is shared with FVCV-extension
      (DEMOMA-10) and FCCV-extension (DEMOMA-13).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-12-008
  - id: DEMOMA-14-010
    priority: MUST
    kind: project
    statement: >-
      C2 MUST be a participant with CVDRole.COORDINATOR before the ownership transfer
      is initiated in the FCCV-handoff scenario.
    rationale: >-
      C2 must be a known case participant before C1 can offer ownership transfer;
      the invite-accept flow in DEMOMA-14-003 establishes C2's presence in the ledger.
  - id: DEMOMA-14-011
    priority: MUST
    kind: project
    statement: >-
      After the FCCV-handoff ownership transfer, the case's attributed_to MUST reflect
      C2 on C1's DataLayer, C2's DataLayer, and the CaseActor's canonical ledger.
    rationale: >-
      attributed_to reflects the current CASE_OWNER; all replicas must converge on
      the updated value after the ownership transfer completes.
  - id: DEMOMA-14-012
    priority: MUST
    kind: project
    statement: >-
      After the FCCV-handoff ownership transfer, C1's CVDRole MUST become
      CVDRole.COORDINATOR (no longer CASE_OWNER).
    rationale: >-
      This is the defining role-change outcome of the handoff; C1 retains participation
      but surrenders ownership authority.
  - id: DEMOMA-14-013
    priority: MUST
    kind: project
    statement: >-
      The Vendor's Accept activity MUST be delivered to the CaseActor so
      `AcceptInviteActorToCaseBT` runs and the join is committed to the canonical
      ledger (PCR-08-008).
    rationale: >-
      Accept must reach the CaseActor, not just the inviting actor, so the join
      is recorded in the authoritative ledger.
  - id: DEMOMA-14-014
    priority: MUST
    kind: project
    statement: >-
      All participants MUST report publication (CS.VFDPx or CS.VFDPxa) and the
      embargo MUST terminate (EM.EXITED) in the FCCV-handoff scenario.
    rationale: >-
      Public disclosure triggers embargo teardown via ThreatTerminationBranchNode;
      both outcomes must be confirmed to validate the end-to-end CS.P path.
  - id: DEMOMA-14-015
    priority: MUST
    kind: project
    statement: >-
      All participants MUST close the case (RM.CLOSED) in the FCCV-handoff scenario.
    rationale: >-
      RM.CLOSED for all participants is the terminal acceptance criterion for the
      full CVD lifecycle in the FCCV-handoff scenario.
  - id: DEMOMA-14-016
    priority: MUST
    kind: project
    statement: >-
      The FCCV-handoff invariant test file MUST assert the following scenario-specific
      checks in addition to universal library checks: (1) `validate_report` event
      present in case-actor log, (2) `invite_actor_to_case` present at least twice
      (C2 invitation + Vendor invitation), (3) `accept_invite_actor_to_case` present
      at least twice (C2 accept + Vendor accept), (4) `close_case` present, (5) CS
      transitions VFd and VFD observed in `add_participant_status_to_participant`
      entries for the Vendor actor, and (6) Vendor replica holds the complete log
      from genesis (late-joiner full-history backfill).
    rationale: >-
      Scenario-specific invariants prevent the FCCV-handoff scenario from accidentally
      omitting protocol steps not covered by universal checks.
- id: DEMOMA-15
  title: Demo Helper Preconditions
  specs:
  - id: DEMOMA-15-001
    priority: MUST
    kind: project
    statement: >-
      `verify_fix_ready` in `vultron/demo/helpers/milestones.py` MUST accept only
      actor IDs holding `CVDRole.VENDOR` in the case's participant index; the f→F
      (fix-ready) transition is gated on VENDOR by `CheckVendorRoleNode`.
    rationale: >-
      The f→F (fix-ready) transition requires CVDRole.VENDOR; coordinators have no
      vendor fix path. The d→D (fix-deployed) transition requires CVDRole.DEPLOYER;
      a vendor who is not a deployer stops at VFd and cannot advance to VFD
      (CSB-15-002). An actor may hold both VENDOR and DEPLOYER roles and passes
      both checks. `verify_fix_deployed` previously accepted VENDOR-or-DEPLOYER,
      which was misleading: a VENDOR-only actor can never reach VFD regardless of
      the role guard, so accepting VENDOR in the guard gave a confusing error
      (VFD state check failure) instead of a clear one (DEPLOYER role check
      failure). Requiring DEPLOYER-only makes the failure mode unambiguous.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-06-002
    - rel_type: refines
      spec_id: DEMOMA-12-005
  - id: DEMOMA-15-002
    priority: MUST
    kind: project
    statement: >-
      `verify_fix_deployed` MUST accept only actor IDs holding `CVDRole.DEPLOYER`
      in the case's participant index; the d→D (fix-deployed) transition is gated
      on DEPLOYER by `CheckDeployerRoleNode`.
    rationale: >-
      A VENDOR-only actor stops at VFd and cannot advance to VFD (CSB-15-002);
      requiring DEPLOYER makes the failure mode unambiguous when the wrong actor ID
      is passed.
  - id: DEMOMA-15-003
    priority: MUST
    kind: project
    statement: >-
      Each demo helper (`verify_fix_ready` and `verify_fix_deployed`) MUST enforce
      its role precondition at runtime, raising `AssertionError` with the actor ID
      and its actual roles if the assertion fails.
    rationale: >-
      Runtime enforcement surfaces caller errors immediately with a clear diagnostic
      rather than a confusing downstream VFD state-check failure.
- id: DEMOMA-16
  title: Per-Scenario Required Event Types for the Invariant Harness
  description: >-
    Each scenario defines a minimum set of protocol event types that MUST
    appear in the authoritative (case-actor) case-ledger log for a complete,
    correct run. These lists are implemented as the per-scenario
    `_XXX_EXPECTED_EVENT_TYPES` constants in the corresponding
    `test/ci/invariants/test_XXX_invariants.py` file and are checked by
    Invariant 5 (test_invariant_5_expected_event_types_present). They
    complement, and do not replace, the scenario-specific invariant test
    functions that use `check_event_type_count` for events that must appear
    multiple times.
  specs:
  - id: DEMOMA-16-001
    priority: MUST
    kind: project
    statement: >-
      The five universal event types — `validate_report`,
      `add_participant_status_to_participant`, `close_case`,
      `add_note_to_case`, and `engage_case` — MUST appear at least once in the
      authoritative case-actor log for every multi-actor demo scenario.
    rationale: >-
      These five types are the minimal coverage shared by all scenarios:
      report validation, RM engagement (VALID → ACCEPTED), participant state
      tracking, case closure, and at least one note. A scenario missing any of
      the five has not completed the basic CVD lifecycle. `engage_case` is as
      universal as `validate_report`: emission lives in the shared demo helper
      layer, not at scenario call sites, so no scenario file names the trigger
      itself (CONCERN-2243). Paths: see `notes/demo-ci-invariants.md`.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-002

  - id: DEMOMA-16-002
    priority: MUST
    kind: project
    statement: >-
      In addition to the universal types (DEMOMA-16-001), the FV scenario
      MUST verify that its expected-event-types list is restricted to types that
      the FV scenario actually produces. FV does not include an
      `invite_actor_to_case` phase; the Finder joins by submitting a report,
      not via an invitation.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-06-002

  - id: DEMOMA-16-003
    priority: MUST
    kind: project
    statement: >-
      The FVV scenario expected-event-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition
      to the universal types (DEMOMA-16-001), because Vendor1 invites
      Vendor2 into the case and Vendor2 explicitly accepts via the
      `accept-case-invite` trigger.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-09-002

  - id: DEMOMA-16-004
    priority: MUST
    kind: project
    statement: >-
      The FVCV-extension scenario expected-event-types list MUST include
      `invite_actor_to_case`, `offer_case_participant`,
      `accept_invite_actor_to_case`, and `accept_actor_recommendation` in
      addition to the universal types (DEMOMA-16-001), because Vendor1
      invites Coordinator, Coordinator uses the ADR-0026 suggest-actor flow
      (`offer_case_participant`) to propose Vendor2, Vendor1 approves the
      recommendation (`accept_actor_recommendation`), CaseActor converts the
      approval into an invitation, and Vendor2 explicitly accepts via the
      `accept-case-invite` trigger.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-10-001

  - id: DEMOMA-16-005
    priority: MUST
    kind: project
    statement: >-
      The FVCV-handoff scenario expected-event-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition
      to the universal types (DEMOMA-16-001), because Vendor1 invites
      Coordinator, the Coordinator accepts and becomes the new CASE_OWNER,
      and Coordinator then invites Vendor2 who also accepts.
    rationale: >-
      In addition to the event-type coverage, FVCV-handoff is the scenario
      planned to exercise the non-linear RM path R → I → V (tentative
      rejection then acceptance, implementation tracked in #2050): Vendor1
      will initially invalidate the report (RI), then re-validate after the
      Finder provides clarifying information via a case note. This RM
      state-transition path will be verified by `demo_check` assertions in
      the scenario script, not by `event_type` presence in the invariant
      harness, because R → I → V produces the same `validate_report` ledger
      event as the linear R → V path.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-11-001

  - id: DEMOMA-16-006
    priority: MUST
    kind: project
    statement: >-
      The FCCV-handoff scenario expected-event-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition
      to the universal types (DEMOMA-16-001), because C1 invites C2,
      C2 accepts and becomes the new CASE_OWNER, and C2 then invites the
      Vendor who also accepts.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-14-009

  - id: DEMOMA-16-007
    priority: MUST
    kind: project
    statement: >-
      The FCV scenario expected-event-types list MUST include
      `invite_actor_to_case` and `accept_invite_actor_to_case` in addition
      to the universal types (DEMOMA-16-001), because the Coordinator
      invites both the Finder and the Vendor into the case, and both Finder
      and Vendor explicitly accept via the `accept-case-invite` trigger.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-12-008

  - id: DEMOMA-16-008
    priority: MUST
    kind: project
    statement: >-
      The per-scenario expected-event-types list in each
      `test/ci/invariants/test_XXX_invariants.py` file MUST be kept in
      sync with the corresponding DEMOMA-16-XXX spec requirement; when a
      new scenario phase is added or removed, both the spec and the test
      list MUST be updated in the same PR.
    rationale: >-
      The test list is the code-level implementation of the spec requirement.
      Allowing them to drift reintroduces the silent-failure risk that
      motivated issue #1649.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-004

  - id: DEMOMA-16-009
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario expected-event-types list MUST include
      `invite_actor_to_case`, `offer_case_participant`,
      `accept_invite_actor_to_case`, and `accept_actor_recommendation` in
      addition to the universal types (DEMOMA-16-001).
    rationale: >-
      FCVCV is the first scenario with two independent coordinators and two
      independent vendor actors. C1 directly invites V1 and C2; C2 suggests
      V2 via ADR-0026 (offer_case_participant → C1 approves via
      accept_actor_recommendation → CaseActor invite → V2 accept); all three
      vendor/coordinator invitees issue explicit accepts. Verifying these
      event types confirms the full ADR-0026 suggest-actor path and the
      multi-vendor invitation chain are exercised end-to-end.

      In addition to event-type coverage, FCVCV is the scenario planned to
      exercise the non-linear RM path A → D → A (accepted, then deferred,
      then re-accepted, implementation tracked in #2050): V1 will accept the
      case, defer due to competing priorities (RD message), then resume and
      engage again (RV message). This RM state-transition path will be
      verified by `demo_check` assertions in the scenario script. The
      `defer-case` and `engage-case` trigger endpoints both support this path
      without new BT nodes, since the RM state machine already declares
      `ACCEPT: DEFERRED → ACCEPTED` as a valid transition.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-19-001

  - id: DEMOMA-16-010
    priority: MUST
    kind: project
    statement: >-
      The FCCV-extension scenario expected-event-types list MUST include
      `invite_actor_to_case`, `offer_case_participant`,
      `accept_invite_actor_to_case`, and `accept_actor_recommendation` in
      addition to the universal types (DEMOMA-16-001), because
      Coordinator1 invites Coordinator2, Coordinator2 uses the ADR-0026
      suggest-actor flow (`offer_case_participant`) to propose the Vendor,
      Coordinator1 approves the recommendation (`accept_actor_recommendation`),
      CaseActor converts the approval into an invitation, and the Vendor
      explicitly accepts via the `accept-case-invite` trigger.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
    - rel_type: refines
      spec_id: DEMOMA-13-001

  - id: DEMOMA-16-011
    priority: MUST
    kind: project
    statement: >-
      The FCV-reject scenario expected-event-types list MUST include
      `invite_actor_to_case` and `reject_invite_actor_to_case` in addition to
      the universal types (DEMOMA-16-001), because the Coordinator invites
      the Vendor and the Vendor sends `Reject(Invite(actor, case))` (an
      invitation-layer rejection), which triggers
      `RejectInviteActorToCaseReceivedUseCase` on the CaseActor and produces
      the `reject_invite_actor_to_case` ledger entry. The Vendor never sends
      `Accept(Invite(actor, case))`, so `accept_invite_actor_to_case` does NOT
      appear in this scenario.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-16-001
  - id: DEMOMA-16-012
    priority: MUST
    kind: project
    statement: >-
      In the FCVCV scenario, the case-actor log MUST record `invite_actor_to_case`
      at least three times (C1 invites V1, C1 invites C2, and CaseActor invites V2
      via the ADR-0026 path) and `offer_case_participant` at least once (C2 suggests
      V2 to C1 via the ADR-0026 suggest-actor flow).
    rationale: >-
      These counts confirm that the multi-party invitation and suggest-actor flows
      were exercised end-to-end, not just that the event types appear at least once.
  - id: DEMOMA-16-013
    priority: MUST
    kind: project
    statement: >-
      In the FCVCV scenario, the case-actor log MUST record `accept_actor_recommendation`
      at least once (C1 approves C2's recommendation) and `accept_invite_actor_to_case`
      at least three times (V1, C2, and V2 each accept their respective invitations).
    rationale: >-
      These counts verify that every actor who received an invitation explicitly
      accepted, and that the ADR-0026 approval path was exercised.

- id: DEMOMA-18
  title: In-Process Fuzz Simulation Scenario
  specs:
  - id: DEMOMA-18-001
    priority: MUST
    kind: project
    statement: >-
      The fuzz simulation scenario MUST run entirely in-process with no
      HTTP servers, containers, or network I/O required; each actor MUST
      have its own isolated in-memory DataLayer.
    rationale: >-
      The scenario is a simulation tool for exploring the protocol state
      space probabilistically. Container setup would make it unsuitable
      for local development and CI smoke-testing. Derived from issue #1178
      planning decisions.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
  - id: DEMOMA-18-002
    priority: MUST
    kind: project
    statement: >-
      The fuzz simulation scenario MUST support a configurable number of
      iterations N (default 10); each iteration MUST start with fresh
      in-memory DataLayers for all actors (no state carried across
      iterations).
    rationale: >-
      Each iteration is an independent probabilistic sample of the
      protocol state space. Shared state would cause later iterations to
      depend on earlier ones, undermining the exploration goal.
  - id: DEMOMA-18-003
    priority: MUST
    kind: project
    statement: >-
      The fuzz simulation scenario MUST use STOCHASTIC call-out point
      bundles for all actors so that each call-out decision is drawn
      from the fuzzer node probability distribution rather than a
      deterministic default.
    rationale: >-
      The scenario's purpose is probabilistic state-space exploration.
      DETERMINISTIC bundles would produce an identical path on every
      iteration, defeating the simulation goal.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001
  - id: DEMOMA-18-004
    priority: MUST
    kind: project
    statement: >-
      The fuzz simulation scenario MUST simulate in-process message
      delivery between actors by directly invoking the receiving actor's
      dispatcher with the emitted activity; no HTTP, ASGIEmitter, or
      real network transport is permitted.
    rationale: >-
      Direct DataLayer injection allows the simulation to run without
      network infrastructure while still exercising the full
      trigger-endpoint→BT→outbox→peer-inbox cascade.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001
  - id: DEMOMA-18-005
    priority: MUST
    kind: project
    statement: >-
      Each iteration MUST log structured output at INFO level including:
      the iteration number, each call-out point node name and its
      SUCCESS/FAILURE outcome, and the final RM/EM/CS state per actor.
    rationale: >-
      Per-run logging is the primary diagnostic output of the scenario;
      it allows users to observe which protocol paths were exercised
      across iterations.
  - id: DEMOMA-18-006
    priority: MUST
    kind: project
    statement: >-
      The fuzz simulation scenario MUST be accessible via the
      ``vultron demo fuzz`` CLI sub-command, accepting at minimum an
      ``--iterations N`` option; the default number of iterations MUST
      be documented in the CLI help text.
    rationale: >-
      Consistent with the existing ``vultron demo`` CLI structure
      (DC-01-001 through DC-01-005); the ``fuzz`` sub-command makes the
      scenario discoverable alongside other demo commands.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001
  - id: DEMOMA-18-007
    priority: MUST
    kind: project
    statement: >-
      Existing deterministic demo scenarios MUST NOT be modified by the
      fuzz simulation scenario; the fuzz scenario MUST NOT import from
      or depend on any existing ``vultron/demo/scenario/`` module.
    rationale: >-
      The fuzz scenario is a standalone simulation tool; coupling it to
      deterministic scenario files would break their repeatability and
      make the fuzz scenario harder to isolate.
  - id: DEMOMA-18-008
    priority: MUST
    kind: project
    statement: >-
      A unit test in ``test/demo/`` MUST verify that the fuzz simulation
      scenario completes a single iteration without raising an exception;
      the test MUST run with a seeded RNG where possible.
    rationale: >-
      The test provides a regression guard confirming the scenario still
      runs after code changes, independent of the specific protocol path
      taken.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-18-001

- id: DEMOMA-17
  title: Demo Code Reuse and DRY
  specs:
  - id: DEMOMA-17-001
    priority: MUST
    kind: project
    statement: >-
      Before writing a second use of a pattern in a scenario file under
      `vultron/demo/scenario/`, the pattern MUST be extracted to
      `vultron/demo/helpers/` first. Scenario files MUST NOT copy-paste
      function bodies, polling loops, verification blocks, or any other
      logical unit from an existing scenario file.
    rationale: >-
      Every scenario written by copying the previous one propagates latent bugs
      alongside valid patterns. Issue #1632 documented residual duplication
      remaining after PR #1629 reactively extracted five helper modules from
      five already-written scenarios. The rule enforces extraction-first to
      prevent recurrence.
    relationships:
    - rel_type: refines
      spec_id: CS-22-001
      note: MUST-level specialisation of the project-wide SHOULD rule for demo scenario files
    - rel_type: refines
      spec_id: DEMOMA-03-001
      note: acceptance test scenario files are also subject to this rule

- id: DEMOMA-19
  title: FCVCV 5-Party Scenario (Finder + Coordinator1 + Vendor1 + Coordinator2 + Vendor2)
  description: >-
    Specifies the FCVCV multi-actor demo scenario: a 5-party CVD case with
    Finder (F), Coordinator1 (C1), Vendor1 (V1), Coordinator2 (C2), and
    Vendor2 (V2). C1 receives the report and creates the case. C1 invites V1
    and C2. C2 suggests V2 to C1 via the ADR-0026 suggest-actor flow; C1
    approves; CaseActor invites V2. V1 holds only CVDRole.VENDOR (reaches VFd,
    fix-ready, but has no deploy path). V2 holds both CVDRole.VENDOR and
    CVDRole.DEPLOYER (full VFD path). V1 triggers CS.P first, causing
    CaseActor to initiate embargo teardown via ThreatTerminationBranchNode.
    This scenario is the first to exercise: (a) two independent coordinators,
    (b) two vendor actors with different role sets, (c) embargo teardown
    triggered by a non-CASE_OWNER vendor participant's publication.
  specs:
  - id: DEMOMA-19-001
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario MUST add an `actor6` service to
      `docker/docker-compose-multi-actor.yml`, configured identically to
      the existing `actor5` service (same `*actor-service` anchor, port
      pattern, data volume) with `VULTRON_SERVER__BASE_URL=http://actor6:7999/api/v2/`,
      `VULTRON_ACTOR_ID=http://actor6:7999/api/v2/actors/vendor-deployer`,
      `VULTRON_ACTOR__DEFAULT_CASE_ROLES=["vendor","deployer"]`, and
      `VULTRON_SEED_CONFIG=/app/docker/seed-configs/seed-actor6.yaml`.
    rationale: >-
      The FCVCV scenario requires five independent actor containers — one per
      CVD-role actor — to force all inter-actor communication over the network
      wire protocol (DEMOMA-01-001). The existing four non-CaseActor containers
      are insufficient; a sixth container (`actor6`) carries V2 (VendorDeployer).
      Keeping one actor per container preserves the architectural isolation
      invariant that prevents intra-container data-layer shortcuts (ADR-0042).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-02-001

  - id: DEMOMA-19-002
    priority: MUST
    kind: project
    statement: >-
      A `seed_containers_fcvcv` function MUST be added to
      `vultron/demo/helpers/seeding.py` accepting five `DataLayerClient`
      arguments (finder_client, c1_client, v1_client, c2_client, v2_client)
      and five optional deterministic actor ID arguments.
    rationale: >-
      The 5-actor cross-registration ensures that every actor can locate and
      deliver activities to every other actor without runtime DNS surprises.
      The N×(N-1) pattern is established by all existing multi-actor seed
      functions (seed_containers_fvv, seed_containers_fvcv, seed_containers_fccv).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-19-001
    - rel_type: refines
      spec_id: DEMOMA-02-002

  - id: DEMOMA-19-003
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario file MUST be implemented at
      `vultron/demo/scenario/fcvcv_demo.py`.
    rationale: >-
      The phased structure mirrors the FCCV-extension scenario (the closest
      prior template) while adding V1's vendor-only VFd path and V2's full
      VFD path. Having V1 publish first exercises the
      ThreatTerminationBranchNode on a non-CASE_OWNER vendor participant, a
      path not covered by any prior scenario (DEMOMA-07-003 correction).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-03-002
    - rel_type: refines
      spec_id: DEMOMA-17-001

  - id: DEMOMA-19-004
    priority: MUST
    kind: project
    statement: >-
      In the FCVCV scenario, V1 MUST be assigned `CVDRole.VENDOR` only (no
      DEPLOYER role) and V2 MUST be assigned both `CVDRole.VENDOR` and
      `CVDRole.DEPLOYER`.
    rationale: >-
      V1's vendor-only role set (stops at VFd) and V2's vendor-deployer role
      set (reaches VFD) are the key differentiators of this scenario. The
      distinction verifies DEMOMA-15-001's precondition guards:
      `verify_fix_ready` requires VENDOR; `verify_fix_deployed` requires
      DEPLOYER. Using V1 in a `verify_fix_deployed` call would exercise the
      wrong path and mask a future regression where the d→D BT gate is weakened.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-15-001
    - rel_type: refines
      spec_id: DEMOMA-19-003

  - id: DEMOMA-19-005
    priority: MUST
    kind: project
    statement: >-
      In the FCVCV scenario, V1 MUST publish before V2; after V1 sends its
      participant status update indicating CS.P, the scenario MUST wait for
      CaseActor to process that update and emit the embargo teardown
      (EM.EXITED) before V2 publishes.
    rationale: >-
      Having V1 publish first exercises the ThreatTerminationBranchNode code
      path where a VENDOR participant (not the CASE_OWNER) triggers embargo
      teardown — the scenario path corrected in DEMOMA-07-003. Waiting for
      EM.EXITED before V2 publishes avoids a timing race where the
      teardown-triggered publication arrives concurrently with V2's
      publication and produces a non-deterministic ledger order.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-07-003
    - rel_type: refines
      spec_id: DEMOMA-19-003

  - id: DEMOMA-19-006
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario MUST be registered as the `fcvcv` sub-command in
      `vultron/demo/cli.py`, consistent with the naming convention of existing
      scenario commands (fv, fvv, fcv, fvcv, fccv).
    rationale: >-
      The CLI is the single entry point for all demo scenarios (DC-01-001).
      Omitting the sub-command leaves the scenario unreachable from
      `vultron demo fcvcv` and from the CI matrix DEMO variable override.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001

  - id: DEMOMA-19-007
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario MUST be added to the CI demo-integration matrix in
      `.github/workflows/demo-integration.yml` with `DEMO=fcvcv`, and
      `actor6` MUST be listed as a service dependency alongside the existing
      five services.
    rationale: >-
      CI coverage of all demo scenarios is required by DEMOCI-04-001. The
      FCVCV scenario introduces the actor6 container, which must be listed as
      a service dependency so CI spins it up. Scenario-role names in devlogs
      match the names used in scenario code, making log archaeology easier.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-19-001

  - id: DEMOMA-19-008
    priority: MUST
    kind: project
    statement: >-
      An invariant harness file MUST be created at
      `test/ci/invariants/test_fcvcv_invariants.py` with `_DEMO_NAME = "fcvcv"`,
      a `_CHAIN_ACTORS` list of scenario-role actor names (finder, c1, v1, c2,
      v2, case-actor), and `_FCVCV_EXPECTED_EVENT_TYPES` per DEMOMA-16-009.
    rationale: >-
      The invariant harness is the CI-level acceptance test for the scenario.
      The three scenario-specific count checks verify that the multi-party
      invitation and suggest-actor flows were exercised end-to-end. The
      per-actor chain checks confirm ledger contiguity for all five actor
      devlogs. Derived from the FCCV-extension invariant harness as the
      closest prior template.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-16-009
    - rel_type: refines
      spec_id: DEMOMA-19-003

  - id: DEMOMA-19-009
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario MUST exercise the ADR-0026 suggest-actor flow for V2's
      onboarding: C2 posts `suggest-actor-to-case`, CaseActor forwards an
      `Offer(CaseParticipant)` to C1, C1 posts `accept-actor-recommendation`,
      CaseActor sends `Invite` to V2, and V2 posts `accept-case-invite`.
    rationale: >-
      The ADR-0026 flow is the accepted pattern for coordinator-to-case actor
      suggestion (ADR-0026). The FCVCV scenario is the first to exercise C2
      (a non-CASE_OWNER coordinator) suggesting a vendor; prior scenarios
      (FCCV-extension) exercised C2 suggesting an existing vendor, but FCVCV
      adds V2 as a new participant. The no-mail-carrying rule (DEMOMA-03-003)
      requires that the demo orchestrator never post directly to another
      actor's inbox; the invite must arrive via the normal routing path and
      be detected by polling.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-003
    - rel_type: refines
      spec_id: DEMOMA-19-003
  - id: DEMOMA-19-010
    priority: MUST
    kind: project
    statement: >-
      A `seed-actor6.yaml` seed config MUST be created in `docker/seed-configs/`
      with `local_actor.id=http://actor6:7999/api/v2/actors/vendor-deployer`,
      `local_actor.name=VendorDeployer`, and a peers list covering the five other
      actors (finder, vendor, coordinator, actor5, case-actor).
    rationale: >-
      The seed config bootstraps actor6's identity and peer registry at container
      startup, consistent with the pattern used by all other actor containers.
  - id: DEMOMA-19-011
    priority: MUST
    kind: project
    statement: >-
      The `demo-runner` service MUST add `actor6` to its `depends_on` list and
      expose `VULTRON_VENDOR_DEPLOYER_BASE_URL=http://actor6:7999/api/v2` in
      its environment block.
    rationale: >-
      Without actor6 in depends_on, the demo runner may start before actor6 is
      healthy; without the environment variable, the scenario cannot locate V2.
  - id: DEMOMA-19-012
    priority: MUST
    kind: project
    statement: >-
      The `seed_containers_fcvcv` function MUST create five local actors: Finder
      (Person), Coordinator1 (Organization), Vendor1 (Organization), Coordinator2
      (Organization), and VendorDeployer (Organization).
    rationale: >-
      Each of the five scenario participants requires a typed local actor record
      in its container's DataLayer before cross-registration.
  - id: DEMOMA-19-013
    priority: MUST
    kind: project
    statement: >-
      The `seed_containers_fcvcv` function MUST register every actor as a known
      peer on each of the other four containers (N×(N-1) = 20 cross-registrations
      total), following the same Phase 1 / Phase 2 pattern as `seed_containers_fccv`.
    rationale: >-
      Full cross-registration ensures every actor can locate and deliver activities
      to every other actor without runtime DNS surprises.
  - id: DEMOMA-19-014
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario MUST implement the following phases in order:
      report_submission, c2_suggests_v2, sync_verification, notes_exchange,
      fix_lifecycle, publication, case_closure, and dump_case_ledgers.
    rationale: >-
      The phased structure mirrors the FCCV-extension scenario (the closest prior
      template) while adding V1's vendor-only VFd path and V2's full VFD path.
      Phase ordering reflects temporal protocol constraints.
  - id: DEMOMA-19-015
    priority: MUST
    kind: project
    statement: >-
      The fix lifecycle phase MUST call `verify_fix_ready` for both V1 and V2 after
      they each advance to VFd, and MUST call `verify_fix_deployed` for V2 only after
      V2 advances to VFD.
    rationale: >-
      V1's vendor-only role set (stops at VFd) and V2's vendor-deployer role set
      (reaches VFD) are the key differentiators of the FCVCV scenario.
  - id: DEMOMA-19-016
    priority: MUST
    kind: project
    statement: >-
      `verify_fix_ready` MUST NOT be called with a DEPLOYER-only actor ID;
      `verify_fix_deployed` MUST NOT be called with a VENDOR-only (no DEPLOYER)
      actor ID such as V1.
    rationale: >-
      Calling the wrong helper with the wrong actor masks future regressions where
      the BT gate is weakened; the precondition guards surface the error immediately.
  - id: DEMOMA-19-017
    priority: MUST
    kind: project
    statement: >-
      The `verify_publicly_disclosed` check MUST be called after both V1 and V2
      have published in the FCVCV scenario.
    rationale: >-
      Calling the check before both actors have published may produce a spurious
      failure if the second publication has not yet propagated.
  - id: DEMOMA-19-018
    priority: MUST
    kind: project
    statement: >-
      The CI devlogs directory for the FCVCV run MUST use the scenario-role naming
      convention: `finder`, `c1`, `v1`, `c2`, `v2`, `case-actor` (not docker
      service names).
    rationale: >-
      Scenario-role names match the names used in scenario code, making log
      archaeology easier than using docker service names.
  - id: DEMOMA-19-019
    priority: MUST
    kind: project
    statement: >-
      The FCVCV invariant harness MUST define the universal invariant tests
      (Invariants 1–5) plus at minimum these scenario-specific invariant tests:
      `invite_actor_to_case` appears at least three times (C1→V1, C1→C2,
      CaseActor→V2), `offer_case_participant` appears at least once (C2 suggests
      V2 via ADR-0026), and `accept_invite_actor_to_case` appears at least three
      times (V1, C2, V2 each accept).
    rationale: >-
      The three scenario-specific count checks verify that the multi-party
      invitation and suggest-actor flows were exercised end-to-end.
  - id: DEMOMA-19-020
    priority: MUST
    kind: project
    statement: >-
      The FCVCV invariant harness MUST load its replicas via
      `load_devlogs(demo_name=_DEMO_NAME)` from `test/ci/invariants/common.py`,
      following the same self-contained pattern as every prior scenario harness.
    rationale: >-
      Consistent loading via common.py ensures the harness can be run standalone
      without importing scenario module state.
  - id: DEMOMA-19-021
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario MUST be routed to the invariant harness file by the
      `demo`/`test_file` matrix in `.github/workflows/demo-integration.yml`;
      harnesses MUST NOT be registered via a `conftest.py` scenario mapping.
    rationale: >-
      The CI matrix is the sole scenario-to-harness registry; conftest.py mappings
      are not consulted by the CI runner.
  - id: DEMOMA-19-022
    priority: MUST
    kind: project
    statement: >-
      The FCVCV scenario MUST use polling helpers (not `post_to_inbox_and_wait`)
      to deliver the invite to V2's inbox, consistent with the no-mail-carrying
      rule (DEMOMA-03-003).
    rationale: >-
      The no-mail-carrying rule requires that the demo orchestrator never post
      directly to another actor's inbox; the invite must arrive via the normal
      routing path and be detected by polling.

- id: DEMOMA-20
  title: RCV Embargo Scenario (Reporter + Coordinator + Vendor, deliberate termination)
  description: >-
    Specifies the rcv-embargo demo scenario: a 3-party CVD case with Reporter
    (R), Coordinator (C), and Vendor (V), exercising embargo lifecycle variations
    (b) post-submission negotiation and (e) deliberate early termination. After
    report submission and case setup, R proposes an embargo (EP); C accepts (EA),
    advancing EM to ACTIVE with all three parties as SIGNATORY. The fix lifecycle
    then proceeds. Before the natural embargo window expires, C deliberately
    terminates the embargo (ET), advancing EM to EXITED. The case continues to
    the normal P-transition and closure sequence. This scenario is the first to
    exercise: (a) embargo proposal initiated after report submission (variation
    b), (b) the full EP→EA→ET arc (propose, activate, terminate without revision),
    (c) PEC transitions from NO_EMBARGO through INVITED → SIGNATORY for all three
    parties.
  specs:
  - id: DEMOMA-20-001
    priority: MUST
    kind: project
    statement: >-
      The rcv-embargo scenario file MUST be implemented at
      `vultron/demo/scenario/rcv_embargo_demo.py`.
    rationale: >-
      The phased structure mirrors prior FCV/FVCV scenarios while inserting
      embargo lifecycle phases between report setup and fix-lifecycle. Asserting
      EM state at phase boundaries catches regressions where an embargo trigger
      silently fails and the scenario continues in an unexpected state.
      Variation (b) places the EP message after report submission, consistent
      with the protocol definition: R already has an established case before
      proposing embargo terms.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-12-001

  - id: DEMOMA-20-002
    priority: MUST
    kind: project
    statement: >-
      An exchange helper function `demo_propose_and_activate_embargo` MUST be
      added to `vultron/demo/exchange/` accepting `(reporter_client,
      coordinator_client, vendor_client, case_id)` arguments; it MUST execute
      a three-step propose-activate sequence: reporter posts
      `trigger_propose_embargo`, coordinator polls for the EP message and posts
      `trigger_accept_embargo`, and vendor polls for the EA message.
    rationale: >-
      Extracting the propose-and-activate sequence as a reusable exchange
      helper follows DEMOMA-17-001 (DRY for demo code). The three-party
      propose→accept→active flow is a composable unit that both rcv-embargo
      and rcvv-embargo scenarios require; a single helper prevents duplication
      and ensures both scenarios exercise identical protocol steps.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001

  - id: DEMOMA-20-003
    priority: MUST
    kind: project
    statement: >-
      An exchange helper function `demo_terminate_embargo` MUST be added to
      `vultron/demo/exchange/` accepting `(terminating_client, case_id)` arguments
      — where `terminating_client` is any SIGNATORY participant authorized to
      terminate — and posting `trigger_terminate_embargo`.
    rationale: >-
      The terminate-embargo exchange is a single-actor trigger that can be
      reused by any scenario exercising variation (e). Keeping it in
      `vultron/demo/exchange/` (not inline in the scenario file) satisfies
      DEMOMA-17-001. Restricting assertions to the terminating actor's EM state
      keeps the helper side-effect-free with respect to peer-replica polling,
      which varies by scenario topology.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: refines
      spec_id: DEMOMA-20-002

  - id: DEMOMA-20-004
    priority: MUST
    kind: project
    statement: >-
      The rcv-embargo scenario MUST be registered as the `rcv-embargo`
      sub-command in `vultron/demo/cli.py`, consistent with the naming
      convention of existing scenario commands.
    rationale: >-
      The CLI is the single entry point for all demo scenarios (DC-01-001).
      The `rcv-embargo` name makes the embargo-lifecycle focus explicit and
      distinguishes this scenario from the base `rcv` scenario if one is
      ever added.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001

  - id: DEMOMA-20-005
    priority: MUST
    kind: project
    statement: >-
      The rcv-embargo scenario MUST be added to the CI demo-integration matrix
      in `.github/workflows/demo-integration.yml` with `DEMO=rcv-embargo` and
      `full_suite_only: false` (runs on every PR). The CI devlogs directory for
      the run MUST use the scenario-role naming convention: `reporter`,
      `coordinator`, `vendor`, `case-actor`.
    rationale: >-
      CI coverage of the embargo lifecycle from day one avoids the deferred-add
      pattern that required a later DEMOCI-06 amendment for earlier scenarios.
      `full_suite_only: false` places the scenario in the minimum PR set,
      consistent with the decision recorded in issue #1222 planning: default to
      add-now/remove-later rather than deferred adds.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001

  - id: DEMOMA-20-006
    priority: MUST
    kind: project
    statement: >-
      The rcv-embargo scenario invariant harness MUST verify that the following event
      types are recorded in the case ledger in order: `propose_embargo`, `accept_embargo`,
      and `terminate_embargo`. The event type strings used in the invariant check MUST
      match the strings logged by the CASE_MANAGER handler.
    rationale: >-
      The scenario-specific invariants confirm that all three embargo protocol
      messages (EP, EA, ET) were recorded in the ledger — not just that the
      scenario ran without crashing. The PEC consent-state check verifies that
      participant embargo consent transitions were emitted and recorded, which
      is the minimal proof that the PEC state machine was exercised. Requiring
      event-type confirmation from a first live run prevents the harness from
      silently passing with wrong or missing event type strings.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-16-009
    - rel_type: refines
      spec_id: DEMOMA-20-001
  - id: DEMOMA-20-007
    priority: MUST
    kind: project
    statement: >-
      The rcv-embargo scenario MUST be structured with the following phases
      executed in order: (1) report_submission, (2) embargo_proposal,
      (3) fix_lifecycle, (4) embargo_termination, (5) publication,
      (6) case_closure, and (7) dump_case_ledgers.
    rationale: >-
      The phased structure mirrors prior FCV/FVCV scenarios while inserting
      embargo lifecycle phases between report setup and fix-lifecycle.
  - id: DEMOMA-20-008
    priority: MUST
    kind: project
    statement: >-
      After each phase of the rcv-embargo scenario, the scenario MUST assert
      the expected EM state before proceeding to the next phase.
    rationale: >-
      Phase-boundary EM assertions catch regressions where an embargo trigger
      silently fails and the scenario continues in an unexpected state.
  - id: DEMOMA-20-009
    priority: MUST
    kind: project
    statement: >-
      After completing the propose-activate sequence, `demo_propose_and_activate_embargo`
      MUST assert `em_state == EM.ACTIVE` on the coordinator's case replica and
      `emConsentState == SIGNATORY` for all three participants.
    rationale: >-
      These post-conditions confirm that all three parties successfully enrolled in
      the embargo before the scenario advances.
  - id: DEMOMA-20-010
    priority: MUST
    kind: project
    statement: >-
      The `demo_propose_and_activate_embargo` helper MUST use `demo_step` and
      `demo_check` for all assertions, consistent with existing exchange helpers.
    rationale: >-
      Using the shared assertion utilities keeps failure reporting consistent
      across all exchange helpers.
  - id: DEMOMA-20-011
    priority: MUST
    kind: project
    statement: >-
      After delivery of `trigger_terminate_embargo`, `demo_terminate_embargo`
      MUST assert `em_state == EM.EXITED` on the terminating actor's case
      replica using `demo_check`.
    rationale: >-
      Asserting on the terminating actor's replica immediately after delivery
      confirms the embargo teardown was committed locally before returning.
  - id: DEMOMA-20-012
    priority: MUST
    kind: project
    statement: >-
      `demo_terminate_embargo` MUST NOT assert PEC states for other participants;
      PEC propagation is asynchronous and belongs in scenario-level phase
      assertions, not in the exchange helper.
    rationale: >-
      Asserting peer PEC states in the exchange helper introduces a race condition;
      propagation timing varies by topology and scenario.

- id: DEMOMA-21
  title: RCVV Embargo Scenario (Reporter + Coordinator + V1 + V2, revision and accidental collapse)
  description: >-
    Specifies the rcvv-embargo demo scenario: a 4-party CVD case with Reporter
    (R), Coordinator (C), Vendor1 (V1), and Vendor2 (V2), exercising embargo
    lifecycle variations (b) post-submission negotiation, (c) revision during
    active embargo (EV→ER→EJ), (f) deliberate notification delay for V2
    (late invitation simulating a short-deadline vendor), and (d) accidental
    collapse via CS.P. After R proposes and C accepts an initial embargo (EP→EA),
    EM reaches ACTIVE with R, C, and V1 as SIGNATORY. C then proposes a
    revision (EV), V1 accepts (EJ), and EM returns to ACTIVE with updated terms.
    V2 is not invited until after the revision is accepted, simulating a
    coordinator holding off on inviting a short-deadline vendor until the
    embargo window is near its close. V2 accepts the case invite and becomes
    SIGNATORY. Finally, R publishes (CS.P fires), triggering
    `PublicDisclosureBranchNode` which auto-terminates the embargo (EM→EXITED).
    This scenario is the first to exercise: (a) an embargo revision cycle
    (EV→ER/EJ arc), (b) a late-invitee V2 joining an active embargo (PEC
    INVITED→SIGNATORY after EM.ACTIVE), (c) accidental embargo collapse via
    external P-event rather than deliberate termination.
  specs:
  - id: DEMOMA-21-001
    priority: MUST
    kind: project
    statement: >-
      The rcvv-embargo scenario file MUST be implemented at
      `vultron/demo/scenario/rcvv_embargo_demo.py`.
    rationale: >-
      The phased ordering reflects the temporal constraints of the embargo
      protocol: revision requires an ACTIVE embargo (phase 3 must follow
      phase 2); V2 late-invite after revision simulates a short-deadline vendor
      pattern (variation f); accidental collapse via CS.P must come after both
      vendors have progressed through the fix lifecycle so the ledger contains
      a complete picture of fix-ready states before collapse. Phase-boundary
      assertions catch silent failures.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001
    - rel_type: refines
      spec_id: DEMOMA-12-001

  - id: DEMOMA-21-002
    priority: MUST
    kind: project
    statement: >-
      An exchange helper function `demo_propose_embargo_revision` MUST be added
      to `vultron/demo/exchange/` accepting `(proposing_client, accepting_client,
      case_id)` arguments; it MUST execute the following sequence:
      `proposing_client` posts `trigger_propose_embargo_revision`
      (`em_state: ACTIVE → REVISE`), then `accepting_client` polls for the EV
      message and posts `trigger_accept_embargo` (`em_state: REVISE → ACTIVE`).
    rationale: >-
      The revision exchange (EV→EJ) is a self-contained composable unit that
      can be reused if future scenarios add multiple revision cycles. Accepting
      from REVISE state uses the same `trigger_accept_embargo` endpoint as
      accepting from PROPOSED, because `AcceptEmbargoLifecycleNode` handles
      both states (confirmed in `vultron/core/behaviors/embargo/trigger_tree.py`
      and `vultron/core/behaviors/embargo/nodes/proposal.py`). No new endpoint
      is needed.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: refines
      spec_id: DEMOMA-20-002

  - id: DEMOMA-21-003
    priority: MUST
    kind: project
    statement: >-
      The v2_late_invite phase of rcvv-embargo MUST invite V2 to the case only
      after the embargo revision (phase 3) is complete and `em_state` is confirmed
      ACTIVE; on receiving the case invite, V2 MUST accept the current embargo
      event, reaching `emConsentState=SIGNATORY`.
    rationale: >-
      Inviting V2 after the revision is complete — rather than before — is the
      defining characteristic of variation (f): the coordinator delays
      notification of a short-deadline vendor until the embargo terms are
      settled. Asserting V2's SIGNATORY state before fix_lifecycle ensures that
      V2 is fully enrolled in the embargo before it is accidentally collapsed by
      CS.P, making the ledger record unambiguous about V2's consent at time of
      collapse.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-03-003
    - rel_type: refines
      spec_id: DEMOMA-21-001

  - id: DEMOMA-21-004
    priority: MUST
    kind: project
    statement: >-
      The accidental_collapse phase of rcvv-embargo MUST trigger the P-transition
      by calling `actor_notifies_published` on the reporter's client; the scenario
      MUST then poll for CaseActor to emit the embargo teardown (EM.EXITED via
      `PublicDisclosureBranchNode`) before asserting `em_state == EM.EXITED` on
      the coordinator's replica.
    rationale: >-
      Variation (d) specifically exercises the accidental/automatic embargo
      collapse path rather than the deliberate termination (ET) path.
      `PublicDisclosureBranchNode` fires when CS.P is detected on the CaseActor,
      emitting the EM termination activity automatically. Using `actor_notifies_published`
      from `vultron/demo/helpers/actions.py` exercises this code path end-to-end.
      Calling `trigger_terminate_embargo` directly would test variation (e)
      instead and would not exercise `PublicDisclosureBranchNode`.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-21-001
    - rel_type: refines
      spec_id: DEMOMA-07-003

  - id: DEMOMA-21-005
    priority: MUST
    kind: project
    statement: >-
      The rcvv-embargo scenario MUST be registered as the `rcvv-embargo`
      sub-command in `vultron/demo/cli.py`, consistent with the naming
      convention of existing scenario commands.
    rationale: >-
      The CLI is the single entry point for all demo scenarios (DC-01-001).
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-01-001

  - id: DEMOMA-21-006
    priority: MUST
    kind: project
    statement: >-
      The rcvv-embargo scenario MUST be added to the CI demo-integration matrix
      in `.github/workflows/demo-integration.yml` with `DEMO=rcvv-embargo` and
      `full_suite_only: false` (runs on every PR). The CI devlogs directory for
      the run MUST use the scenario-role naming convention: `reporter`,
      `coordinator`, `vendor`, `vendor2`, `case-actor`.
    rationale: >-
      CI coverage from day one, consistent with the decision recorded in issue
      #1222 planning: default to add-now/remove-later rather than deferred adds.
      `full_suite_only: false` places the scenario in the minimum PR set.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001

  - id: DEMOMA-21-007
    priority: MUST
    kind: project
    statement: >-
      The rcvv-embargo scenario invariant harness MUST verify that the following event
      types are recorded in the case ledger: `propose_embargo`, `accept_embargo`, and
      `revise_embargo`. The event type strings used in the invariant check MUST match
      the strings logged by the CASE_MANAGER handler.
    rationale: >-
      The scenario-specific invariants confirm all four embargo-variation
      protocol paths were exercised and recorded: EP (b), EV (c), EJ (c), and
      auto-collapse via CS.P (d). The late-joiner backfill check for V2
      verifies that the ledger synchronization worked correctly when V2 joined
      mid-scenario after an embargo revision. Invariant (f) distinguishes
      accidental collapse from deliberate termination, ensuring the scenario
      exercised the correct code path.
    lint_suppress:
    - phantom_path_ref
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    - rel_type: refines
      spec_id: DEMOMA-16-009
    - rel_type: refines
      spec_id: DEMOMA-21-001
  - id: DEMOMA-21-008
    priority: MUST
    kind: project
    statement: >-
      The rcvv-embargo scenario MUST be structured with the following phases
      executed in order: (1) report_submission, (2) embargo_proposal,
      (3) embargo_revision, (4) v2_late_invite, (5) fix_lifecycle,
      (6) accidental_collapse, (7) case_closure, and (8) dump_case_ledgers.
    rationale: >-
      Phase ordering reflects the temporal protocol constraints: revision
      requires an ACTIVE embargo; V2 late-invite simulates a short-deadline
      vendor held back until terms are settled.
  - id: DEMOMA-21-009
    priority: MUST
    kind: project
    statement: >-
      After phases 2, 3, 4, and 6 of the rcvv-embargo scenario, the scenario
      MUST assert the expected EM state before proceeding to the next phase.
    rationale: >-
      Phase-boundary EM assertions catch silent failures where an embargo
      trigger fires but the state machine does not advance.
  - id: DEMOMA-21-010
    priority: MUST
    kind: project
    statement: >-
      After the revision sequence, `demo_propose_embargo_revision` MUST assert
      `em_state == EM.ACTIVE` on the accepting client's case replica using
      `demo_check`.
    rationale: >-
      Confirming ACTIVE after the revision ensures the EJ path completed and
      the embargo did not stall in REVISE state.
  - id: DEMOMA-21-011
    priority: MUST
    kind: project
    statement: >-
      The `demo_propose_embargo_revision` function MUST be importable from
      `vultron/demo/exchange/` and MUST NOT duplicate the propose-and-activate
      logic already in `demo_propose_and_activate_embargo` (DEMOMA-20-002).
    rationale: >-
      Reusing the activate path prevents divergence between the propose-and-activate
      and revision helpers when the embargo lifecycle nodes change.
  - id: DEMOMA-21-012
    priority: MUST
    kind: project
    statement: >-
      The rcvv-embargo scenario MUST assert that V2's `emConsentState` is
      SIGNATORY before proceeding to the fix_lifecycle phase.
    rationale: >-
      V2 must be fully enrolled in the embargo before it is accidentally
      collapsed by CS.P, making the ledger record unambiguous about V2's
      consent at time of collapse.
  - id: DEMOMA-21-013
    priority: MUST
    kind: project
    statement: >-
      The rcvv-embargo scenario MUST use polling helpers (not
      `post_to_inbox_and_wait`) to detect the invite in V2's inbox, consistent
      with the no-mail-carrying rule (DEMOMA-03-003).
    rationale: >-
      The no-mail-carrying rule requires that the demo orchestrator never post
      directly to another actor's inbox; polling ensures the invite arrives via
      the normal routing path.
  - id: DEMOMA-21-014
    priority: MUST
    kind: project
    statement: >-
      The accidental_collapse phase of rcvv-embargo MUST NOT call
      `trigger_terminate_embargo` directly; the embargo collapse MUST arrive as
      an automatic consequence of CS.P, not a deliberate termination.
    rationale: >-
      Variation (d) specifically exercises the automatic embargo collapse path
      via `PublicDisclosureBranchNode`; calling `trigger_terminate_embargo`
      directly would test variation (e) instead.
- id: DEMOMA-22
  title: Causal Gating and Scenario Narratives
  specs:
  - id: DEMOMA-22-001
    priority: MUST
    kind: project
    statement: >-
      Every scenario script under `vultron/demo/scenario/` MUST gate each
      asynchronous protocol boundary on a causal precondition satisfying
      EDF-06-001 through EDF-06-003 before driving the next trigger.
    rationale: >-
      This generalizes DEMOMA-11-009, which stated the rule for FVCV-handoff
      alone. Seven of the nineteen sub-issues of Epic #2136 were the same
      defect — a step proceeding before its enabling event had propagated —
      reproduced in a different scenario each time. A per-scenario requirement
      cannot prevent the next scenario from rediscovering it. See ADR-0058.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: EDF-06-001
    - rel_type: constrains
      spec_id: DEMOMA-11-009
      note: >-
        DEMOMA-11-009 remains active and is NOT superseded: it is retained as
        the FVCV-handoff instance of this general rule, and additionally
        constrained by it (the general form also governs *what* the wait may
        observe, per EDF-06-001 through EDF-06-003).
    tags:
    - demo
    - testing
  - id: DEMOMA-22-002
    priority: MUST
    kind: project
    statement: >-
      Causal gate *predicates* — the reusable functions that poll or scan an
      actor's own state to decide whether a precondition holds — MUST be defined
      in `vultron/demo/helpers/`. Scenario modules MUST NOT define their own
      polling or retry loops. This requirement does NOT relocate the `demo_gate`
      context manager itself, which DEMOCI-01-007 places in
      `vultron/demo/utils.py` alongside `demo_step` and `demo_check`.
    rationale: >-
      A MUST-level application of DEMOMA-17-001 (extract before reuse) to the
      gating vocabulary specifically. Hand-rolled loops in scenario modules are
      how the #2178 defect survived in `fccv_handoff_demo.py` after being fixed
      in `fvcv_handoff_demo.py` — the fix had nowhere shared to land. The split
      is deliberate: the control-flow primitive lives with the other context
      managers, and the observables it gates on live in the helper vocabulary.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    - rel_type: depends_on
      spec_id: DEMOCI-01-007
      note: >-
        DEMOCI-01-007 owns the location and semantics of the `demo_gate` context
        manager; this requirement owns the location of the predicates passed to
        it.
    tags:
    - demo
    - testing
  - id: DEMOMA-22-003
    priority: MUST
    kind: project
    statement: >-
      Each demo scenario MUST have a narrative page under
      `docs/topics/scenarios/` that describes the case's progress through the
      CVD process in domain terms, without reference to implementation
      details such as endpoint names, helper functions, or container topology.
      Each narrative step MUST state the antecedent that causes it.
    rationale: >-
      A narrative written in domain terms is an independent statement of what
      the protocol is supposed to accomplish. Because it is written without
      reference to the implementation, it can disagree with the implementation
      — which is precisely what makes it usable as a conformance oracle rather
      than a restatement of the code.
    adr:
    - ADR-0058
    lint_suppress:
    - phantom_path_ref
    tags:
    - demo
    - documentation
  - id: DEMOMA-22-004
    priority: MUST
    kind: project
    statement: >-
      Each scenario narrative MUST carry a machine-readable list of causal
      edges. Each edge MUST name the antecedent event, the consequent event,
      and the actor that commits the consequent.
    rationale: >-
      Prose alone drifts silently from the code it describes. A structured edge
      list is the part of the narrative a test can check, and it forces the
      author to state the causal claim precisely enough to be falsifiable.
    adr:
    - ADR-0058
    tags:
    - demo
    - documentation
  - id: DEMOMA-22-005
    priority: MUST
    kind: project
    statement: >-
      The invariant harness MUST assert, for each scenario, that every causal
      edge declared in that scenario's narrative appears in the observed case
      ledger, with the antecedent's log index preceding the consequent's.
    rationale: >-
      The case ledger already records `log_index` in causal order (ADR-0041)
      and the invariant harness already reads the per-scenario ledger dumps, so
      checking declared causality against observed causality needs no new
      instrumentation. This is what converts the narrative from documentation
      into a conformance check.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-04-001
    tags:
    - demo
    - testing
  - id: DEMOMA-22-006
    priority: MUST
    kind: project
    statement: >-
      A change to a scenario's protocol flow MUST update that scenario's
      narrative and its declared causal edges in the same pull request.
    rationale: >-
      Without this, the conformance check decays into a ratchet that is
      weakened whenever it fails. Updating both together makes a deliberate
      protocol change visible as a narrative change, which is the point.
    adr:
    - ADR-0058
    tags:
    - demo
    - documentation
  - id: DEMOMA-22-007
    priority: MUST
    kind: project
    statement: >-
      Every `wait_for_*` call in a scenario script MUST be wrapped in either
      `demo_gate` (when the wait is a causal precondition for a subsequent
      step) or `demo_check` (when the wait is temporal or a non-gating
      post-hoc verification). Bare unwrapped `wait_for_*` calls are
      prohibited.
    rationale: >-
      A bare call raises `AssertionError` directly on timeout, bypassing the
      demo harness's failure accumulator. Earlier `demo_check` failures
      accumulated in the same run are lost, and downstream steps do not
      receive the structured skip that `demo_gate` provides — the exception
      terminates the scenario with no record of what preceded the failure.
      `demo_gate` and `demo_check` are the two sanctioned wrappers; using
      them consistently keeps the failure record complete and the control
      flow explicit.
    adr:
    - ADR-0058
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-22-001
      note: >-
        DEMOMA-22-001 requires causal gating at every async boundary;
        this requirement closes the loophole of bare calls that appear to
        gate but do not integrate with the failure accumulator.
    - rel_type: refines
      spec_id: EDF-06-005
      note: >-
        EDF-06-005 requires unmet causal gates to prevent dependent steps;
        this requirement enforces the same principle for the bare-call case.
    tags:
    - demo
    - testing
- id: DEMOMA-23
  title: Shared Scenario Harness
  specs:
  - id: DEMOMA-23-001
    priority: MUST
    kind: project
    statement: >-
      Every `run_<name>_demo()` orchestrator MUST run its phase body inside the
      shared `scenario_harness("<demo-name>")` context manager from
      `vultron.demo.helpers.harness`, which resets the failure accumulator, always
      dumps the case ledgers, and only then asserts demo success. The scenario's
      `main()` MUST NOT wrap the run in `try: ... finally: assert_demo_success()`.
    rationale: >-
      Each scenario previously repeated the same three responsibilities in a
      slightly different order, and the `finally: assert_demo_success()` shape in
      `main()` substituted a generic `DemoFailureError` for whatever actually went
      wrong. One harness fixes the order once for all scenarios: run phases,
      always dump, then assert.
    relationships:
    - rel_type: implements
      spec_id: DEMOCI-10-001
    - rel_type: refines
      spec_id: DEMOMA-17-001
    tags:
    - demo
    - testing
  - id: DEMOMA-23-002
    priority: MUST
    kind: project
    statement: >-
      A scenario's `_phase_dump_case_ledgers()` MUST be a thin wrapper over
      `vultron.demo.helpers.ledger_dump.dump_case_ledgers()`, declaring only that
      scenario's dump targets (actor name, client, route key, and any fallback).
      Per-actor fetching, 404 handling, JSONL writing, and manifest writing MUST
      live in the shared helper, not in the scenario module.
    rationale: >-
      Nine copies of the same export loop is exactly the copy-paste that
      DEMOMA-17-001 forbids, and it is why a defect in the dump had to be fixed
      nine times. Keeping the scenario-specific participant map in the scenario
      and the mechanics in the helper puts each fact in one place.
    relationships:
    - rel_type: refines
      spec_id: DEMOMA-17-001
    tags:
    - demo
  - id: DEMOMA-23-003
    priority: MUST
    kind: project
    statement: >-
      A scenario MUST register its dump with `harness.dump_with(...)` as soon as
      a case exists — immediately after the report-submission phase returns —
      rather than at the end of the run.
    rationale: >-
      The harness can only dump what it has been given. Registering the dump at
      the first point where a case exists is what makes every later phase failure
      survivable: the ledgers that existed at the moment of failure are still
      exported.
    relationships:
    - rel_type: implements
      spec_id: DEMOCI-10-001
    tags:
    - demo
  - id: DEMOMA-23-004
    priority: SHOULD
    kind: project
    statement: >-
      When a scenario body raises, the harness SHOULD attach the accumulated
      `demo_step`/`demo_check` failures to the propagating exception as notes
      rather than raising `DemoFailureError` in their place.
    rationale: >-
      The accumulated soft failures are usually downstream consequences of the
      exception, so they are context, not the cause. Attaching them as notes keeps
      both: the reader sees the failure that stopped the run and every check that
      had already failed.
    relationships:
    - rel_type: refines
      spec_id: DEMOCI-10-004
    tags:
    - demo
