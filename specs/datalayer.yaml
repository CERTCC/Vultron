id: DL
title: DataLayer Port
description: Behavioural contract that all DataLayer adapter implementations MUST satisfy. Covers auto-rehydration on read,
  type-safe write operations, and port isolation.
version: 1.4.0
scope:
- prototype
- production
tags:
- persistence
groups:
- id: DL-01
  title: Auto-Rehydration on Read
  specs:
  - id: DL-01-001
    priority: MUST
    kind: project
    statement: '`dl.read(id)` MUST return a fully rehydrated, typed domain object: a Pydantic model instance with all dehydrated
      ID-string fields expanded to their full typed objects; if the object does not exist, `VultronNotFoundError` MUST be
      raised.'
    rationale: Core use cases must not contain coercion logic for storage artefacts. See vultron/core/ports/AGENTS.md 'Auto-Rehydration'.
    tags:
    - persistence
  - id: DL-01-002
    priority: MUST
    kind: project
    statement: '`dl.list(type_key)` MUST return an iterable of fully rehydrated, typed domain objects; an empty result MUST
      be returned (not an error) when no objects of the given type exist.'
    rationale: Consistent with DL-01-001 rehydration guarantee.
    tags:
    - persistence
  - id: DL-01-003
    priority: MUST
    kind: project
    statement: Rehydration MUST cover all fields the adapter dehydrates on write (including `object_`, `target`, `origin`);
      if a dehydrated field references a missing ID, the adapter MUST log a WARNING and return the ID string as-is.
    rationale: Preserves partial readability when nested objects are deleted.
    tags:
    - persistence
  - id: DL-01-004
    priority: MUST
    kind: project
    statement: Core use cases MUST NOT contain manual coercion of `dl.read()` results; specifically, `model_validate` on a
      `dl.read()` result, `record_to_object()` calls, and `isinstance(result, Document)` checks are prohibited in `vultron/core/`.
    rationale: These patterns indicate the adapter is not satisfying its rehydration contract and MUST be fixed in the adapter,
      not in core.
    tags:
    - persistence
- id: DL-02
  title: Type-Safe Write Operations
  specs:
  - id: DL-02-001
    priority: MUST
    kind: project
    statement: '`dl.save(obj)` MUST accept a typed Pydantic domain object directly and handle all serialisation and dehydration
      internally; core MUST NOT call `object_to_record()` before passing an object to `dl.save()`.'
    rationale: Keeps serialisation concerns inside the adapter layer.
    tags:
    - persistence
  - id: DL-02-002
    priority: MUST
    kind: project
    statement: '`dl.save(obj)` MUST be idempotent with respect to the object''s `id_`: saving the same object twice with the
      same ID MUST produce the same stored state as saving it once (upsert semantics).'
    rationale: Idempotent writes prevent duplicate-key errors in retry scenarios.
    tags:
    - persistence
    - idempotency
- id: DL-03
  title: Port Isolation
  specs:
  - id: DL-03-001
    priority: MUST
    kind: project
    statement: The `DataLayer` port (`vultron/core/ports/datalayer.py`) MUST be defined entirely in terms of core domain types
      and MUST NOT import from `vultron/wire/`, `vultron/adapters/`, or any storage-specific library (SQLModel, TinyDB, etc.).
    rationale: Enforces hexagonal architecture layer separation (ARCH-01-001).
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-001
  - id: DL-03-002
    priority: MUST
    kind: project
    statement: The DataLayer adapter MUST NOT expose vocabulary registry lookups or AS2 type-name resolution to core; the
      vocabulary registry is a wire-layer concern and the adapter must maintain its own internal mapping.
    rationale: Prevents wire-layer types from leaking into the core domain through the persistence port.
- id: DL-04
  title: Narrow Core Persistence Ports
  specs:
  - id: DL-04-001
    priority: MUST
    kind: project
    statement: The `DataLayer` port MUST remain the full adapter-level persistence contract, while core use cases and BT
      nodes MUST depend on `CasePersistence` or `CaseOutboxPersistence` instead of the full `DataLayer` port unless a
      documented exception requires the broader interface.
    rationale: Preserves a complete adapter-facing contract while making narrow, intention-revealing ports the default
      dependency for core code.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-001
  - id: DL-04-002
    priority: MUST
    kind: project
    statement: The current required minimum `CasePersistence` surface is `actor_id`, `clone_for_actor`, `create`, `read`,
      `get`, `save`, `by_type`, `find_case_by_report_id`, and `find_actor_by_short_id`; future additions MAY be made only
      when they preserve the same core-facing persistence/query boundary and do not introduce queue, admin, health, or
      diagnostic responsibilities. `actor_id` and `clone_for_actor` are part of the minimum because a store belongs to
      exactly one actor (DL-07-002) and reaching another's is a named operation (DL-07-005).
    rationale: Makes the current narrow-port contract explicit without freezing the interface against future legitimate
      query helpers.
  - id: DL-04-003
    priority: MUST_NOT
    kind: project
    statement: '`CasePersistence` MUST NOT include inbox queue methods, outbox inspection or drain methods, `ping`,
      `clear_*`, `update`, `delete`, `get_all`, `all`, `count_all`, or other infrastructure, admin, or diagnostic
      operations that belong to the full `DataLayer` adapter contract.'
    rationale: Prevents low-level storage and operational concerns from leaking into core use cases and BT nodes.
  - id: DL-04-004
    priority: MUST
    kind: project
    statement: '`CaseOutboxPersistence` MUST extend `CasePersistence` only with the outbound enqueue method
      `outbox_append`; if a `ReceivedUseCase` depends on `CaseOutboxPersistence`, that dependency MUST be treated as a
      documented architectural smell rather than normal design.'
    rationale: >-
      Makes outbound side effects explicit and highlights mixed inbound-plus-broadcast handlers for later
      refactoring. `record_outbox_item(actor_id, ...)` was removed from this surface by ADR-0070: it existed
      so that an unscoped DataLayer could name the actor explicitly, and every one of its call sites passed
      the executing actor's own id, so under a mandatory actor scope it was exactly `outbox_append`. Keeping
      both would have preserved a way to write to a queue that is not the store's own.
  - id: DL-04-005
    priority: MUST
    kind: project
    statement: '`get()` and `by_type()` on `CasePersistence` are deprecated compatibility methods; new or refactored core
      code MUST prefer typed `read()`, `list()`, or dedicated typed helper methods, and migration work MUST remove the
      deprecated methods once existing call sites have been replaced.'
    rationale: The narrow port should converge on typed domain-object access rather than preserve raw-record escape hatches.
- id: DL-05
  title: Core-Object Read Contract
  description: The DataLayer read path MUST return core domain objects for every persisted type that has a registered core
    counterpart. Wire-layer vocabulary types MUST NOT be handed to core code through the persistence port.
  specs:
  - id: DL-05-001
    priority: MUST
    kind: project
    statement: '`dl.read(id)` and `dl.list_objects(type_key)` MUST reconstruct persisted domain entities using the core
      vocabulary registry (`vultron.core.models.registry.CORE_VOCABULARY`) so that the returned instance is a
      `vultron.core.models` type (e.g. core `VulnerabilityCase`), never a `vultron.wire.as2.vocab` type
      (e.g. `as_VulnerabilityCase`), whenever the persisted `type_` has a registered core counterpart.'
    rationale: >-
      Core code MUST receive core domain objects so that core validators run and static analysis sees the real type
      (ARCH-01-002). Reconstructing via the wire `VOCABULARY` returns wire objects that only work in core by structural
      coincidence of field names. Decided in ADR-0034; derived from ARCH-01-002 and DL-03-002.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-002
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0034
  - id: DL-05-002
    priority: MUST
    kind: project
    statement: The DataLayer adapter MUST own the wire↔core translation for persistence.
    rationale: >-
      The wire registry is a wire-layer concern (DL-03-002). Making the adapter own translation
      decouples DataLayer storage from the wire type system so the wire layer can evolve without
      breaking persistence.
    relationships:
    - rel_type: implements
      spec_id: DL-03-002
    tags:
    - persistence
    - wire-format
  - id: DL-05-003
    priority: MUST_NOT
    kind: project
    statement: >-
      Core code (`vultron/core/`) MUST NOT use structural duck-typing Protocols to accept
      DataLayer results without importing concrete core types. Core MUST depend on concrete
      domain classes and use `isinstance` narrowing directly. Structural workaround Protocols
      that evade ARCH-01-001 are prohibited.
    rationale: >-
      The duck-typing Protocols exist solely to let core touch wire objects at runtime without a compile-time wire import,
      evading rather than honouring ARCH-01-001. When the read path returns core objects, the Protocols are dead weight
      and mask the boundary from mypy/pyright.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-001
    tags:
    - persistence
    - wire-format
  - id: DL-05-004
    priority: MUST
    kind: project
    statement: An architecture ratchet test MUST assert that no `vultron.wire.as2` vocabulary type is returned from
      `dl.read()` / `dl.list_objects()` into `vultron/core/`; the test MAY exempt persisted AS2 Activity types that have no
      registered core counterpart, and any such exemption MUST be enumerated explicitly so the exemption set can only shrink.
    rationale: >-
      Prevents regression back to wire-object leakage. Activity read-back from core is itself a boundary violation tracked
      separately; the enumerated exemption set documents the remaining debt and ratchets toward zero.
    tags:
    - persistence
    - testing
    - wire-format
  - id: DL-05-005
    priority: MUST
    kind: project
    statement: >-
      An architecture ratchet test MUST assert that `_NORMALIZE_WIRE_TO_CORE` in
      `vultron/adapters/driven/db_record.py` covers every wire vocabulary class whose bare `type_`
      shadows a `CORE_VOCABULARY` entry; the set may only grow, as shrinking re-opens the
      write-path shape duality.
    rationale: >-
      Prevents regression on the write path: a wire-shaped row MUST NOT be persisted in a
      core-typed DataLayer table. The write-side ratchet is the mirror-image of DL-05-004 and
      enforces the persistence-boundary backstop described in ADR-0062. Source concern #2268.
    relationships:
    - rel_type: implements
      spec_id: DL-05-001
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0062
  - id: DL-05-006
    priority: MUST
    kind: project
    statement: >-
      The DataLayer adapter MUST maintain its own `type_`→core-class mapping (via
      `CORE_VOCABULARY`) that is independent of the wire `VOCABULARY` registry.
    rationale: >-
      An independent adapter-owned mapping decouples DataLayer storage from the wire type system
      so the wire layer can evolve without breaking persistence (DL-03-002).
    tags:
    - persistence
    - wire-format
  - id: DL-05-007
    priority: MUST_NOT
    kind: project
    statement: >-
      The wire vocabulary registry MUST NOT be the mechanism by which core objects are
      reconstructed on the DataLayer read path.
    rationale: >-
      Using the wire registry for core object reconstruction leaks wire-layer concerns into the
      adapter read path, violating DL-03-002.
    tags:
    - persistence
    - wire-format
  - id: DL-05-008
    priority: MUST
    kind: project
    statement: >-
      When all shadowing types are migrated, the companion `_NOT_YET_NORMALIZED` enumeration in
      `vultron/adapters/driven/db_record.py` MUST be empty.
    rationale: >-
      An empty `_NOT_YET_NORMALIZED` set confirms that all wire-shaped rows have been migrated
      to core-typed persistence, completing the write-path normalization described in ADR-0062.
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0062
  - id: DL-05-009
    priority: MUST
    kind: project
    statement: >-
      The architecture ratchet test MUST enforce that no wire vocabulary class shadowing a
      `CORE_VOCABULARY` entry in `_NORMALIZE_WIRE_TO_CORE` is left uncovered.
    rationale: >-
      Ensures the ratchet is closed-form: every shadowing type must be explicitly handled, with
      no silent gaps that would allow wire-shaped rows to slip through.
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0062
- id: DL-06
  title: Activity Read-Back and the Semantic/Envelope Split
  description: >-
    Core code MUST NOT read a persisted wire AS2 Activity back from the DataLayer to recover its semantic content. AS2
    protocol Activities are wire-only envelopes with no registered core counterpart (the DL-05-004 exemption set); the
    domain fact each carries MUST live as core state. Reading a stored activity is permitted only to reconstitute the
    verbatim envelope for an outbound reply, and only through a wire/adapter-owned seam — never core interpreting it.
    Decided in ADR-0035; extends DL-05 and ARCH-09-001.
  specs:
  - id: DL-06-001
    priority: MUST_NOT
    kind: project
    statement: >-
      Core code (`vultron/core/`) MUST NOT call `dl.read(activity_id)` or `dl.list_objects(<activity_type>)` to recover
      the semantic content of a persisted wire AS2 Activity (e.g. reading a stored `Offer` to obtain the embedded report,
      or a stored `Invite` to obtain its case or embargo id). The domain fact MUST be obtained from core state instead.
    rationale: >-
      AS2 protocol Activities are wire-only envelopes with no core counterpart, so reading one back into core hands a
      `vultron.wire.as2` type to core code (ARCH-01-002) and re-interprets an activity the semantic extractor already
      interpreted once (ARCH-03-001). The activity is being used as the system of record for a domain fact, inverting the
      rule that wire is a projection of core (ARCH-09-001). Decided in ADR-0035; source concern #1506.
    relationships:
    - rel_type: implements
      spec_id: ARCH-09-001
    - rel_type: implements
      spec_id: ARCH-03-001
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
  - id: DL-06-002
    priority: MUST
    kind: project
    statement: >-
      Every domain fact an actor must remember from a received protocol message MUST be recorded as core state — either a
      state transition on an existing core entity or a purpose-built core record — at the point the semantic extractor
      first interprets the inbound activity. Core MUST NOT reconstruct such a fact by re-reading the stored activity later.
    rationale: >-
      Core is the sole system of record for domain facts (the Actor Knowledge Model bounds an actor's knowledge to what it
      has received, and that knowledge is held as core state). Capturing the fact once at extraction time removes the need
      for core to reach back through the wire envelope. This does NOT mean cloning each AS2 Activity into a 1:1 core
      Activity class; model only the domain fact each message conveys, in domain vocabulary, capturing only what handlers
      use. Decided in ADR-0035.
    relationships:
    - rel_type: implements
      spec_id: ARCH-03-001
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
  - id: DL-06-003
    priority: MUST
    kind: project
    statement: >-
      When an inbound protocol message references a prior message (e.g. an Accept answering an Invite, a counter-offer
      answering an Offer), core MUST correlate them through a core-entity relationship (e.g. "the pending embargo proposal
      for this case", "the invitation for this actor"), NOT by re-reading the referenced wire activity from the DataLayer.
    rationale: >-
      Correlation is a domain relationship between core facts. Recovering it by re-reading the referenced activity
      reintroduces the DL-06-001 violation and depends on the wire envelope surviving as a semantic record. When the prior
      message was first received it MUST have created or updated the core entity that the later message now correlates to.
      Decided in ADR-0035.
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
  - id: DL-06-004
    priority: MUST
    kind: project
    statement: >-
      Reconstituting the verbatim original activity for an outbound reply's inline `object_` / `in_reply_to` field (as the
      Actor Knowledge Model requires) MAY read a stored activity payload back, but this retrieval MUST be owned by the
      wire/adapter layer and treat the stored activity as an opaque envelope; core code MUST NOT read the activity to
      interpret its meaning. Such a wire/adapter-owned envelope seam is NOT counted as a core boundary violation under
      DL-05-004.
    rationale: >-
      Activity IDs are non-regenerable random `urn:uuid:` values and the Actor Knowledge Model requires a reply to embed
      the full inline original activity, so verbatim reconstitution cannot be produced by re-projecting core state — the
      original envelope (with its original id) must be retained and read back. Confining that read to a wire/adapter seam
      that never interprets the payload keeps semantic authority in core while satisfying transport needs. `CaseLedgerEntry`
      `payloadSnapshot` is the existing precedent for opaque, write-only activity retention. Decided in ADR-0035.
    relationships:
    - rel_type: refines
      spec_id: DL-05-004
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
  - id: DL-06-005
    priority: MUST
    kind: project
    statement: >-
      As each core semantic read is migrated off activity read-back (per DL-06-001 through DL-06-003), the corresponding
      AS2 Activity type MUST be removed from the DL-05-004 ratchet exemption set. The exemption set MUST reach zero once
      all core semantic activity reads are migrated; the only remaining sanctioned activity reads are the wire/adapter
      envelope-reconstitution seam of DL-06-004.
    rationale: >-
      Ties the migration to an enforceable, monotonically shrinking ratchet so progress is measurable and regressions are
      blocked. Decided in ADR-0035; source concern #1506.
    relationships:
    - rel_type: refines
      spec_id: DL-05-004
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0035
- id: DL-07
  title: Per-Actor Store Isolation
  specs:
  - id: DL-07-001
    priority: MUST
    kind: project
    statement: >-
      Each actor MUST have its own store. A DataLayer instance MUST belong to exactly one actor, and
      one actor's writes MUST NOT be able to affect what another actor could read — including writes
      to the same object ID, which two actors MAY each hold their own replica of.
    rationale: >-
      This is CM-01-001's isolation requirement restated as a property of the *storage layout* rather
      than of each query. Previously `actor_id` was an indexed filter column over a globally unique
      primary key, so reads were partitioned and writes were not: `save()` on one actor's DataLayer
      overwrote another actor's row while leaving it owned by the original actor, and `create()`
      raised a spurious duplicate error for the second actor. Both are unreachable when the layout —
      not the WHERE clause — carries the isolation. Decided in ADR-0070; source issue #2238.
    relationships:
    - rel_type: implements
      spec_id: CM-01-001
    verification: >-
      `test/adapters/driven/test_datalayer_isolation.py` asserts that two actors sharing one
      configured store each create, read back and mutate their own replica of the same object ID,
      and that neither can affect what the other reads.
    tags:
    - persistence
    adr:
    - ADR-0070
  - id: DL-07-002
    priority: MUST
    kind: project
    statement: >-
      A DataLayer MUST NOT be constructible without an actor. There MUST be no shared, unscoped, or
      "admin" DataLayer, and no factory MUST return an instance whose actor is unset.
    rationale: >-
      Makes DL-07-001 unreachable to violate rather than merely discouraged. An unscoped mode is not
      a neutral convenience: `deps.py` demonstrated that it accumulates domain data ("operational
      data — actors, offers, reports, cases — is stored in the shared DataLayer"), so anything holding
      one could read across actors. Guarantees that depend on every call site remembering to scope had
      already failed once here, producing two architecture ratchets for one problem (#2232).
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    verification: >-
      `SqliteDataLayer` cannot be constructed without a keyword `actor_id`, and
      `test_every_instance_carries_the_actor_it_was_asked_for` asserts that `get_datalayer` always
      returns an instance carrying the actor it was asked for and that the argument cannot be omitted.
    tags:
    - persistence
    adr:
    - ADR-0070
  - id: DL-07-003
    priority: MUST
    kind: project
    statement: >-
      The configured `db_url` MUST be treated as a template rather than a location: each actor's store
      MUST be derived from it per actor. An already-derived URL MUST NOT be passed back through the
      derivation.
    rationale: >-
      A single configured location cannot express one store per actor. Derivation is not idempotent
      and cannot be made so, because a suffix cannot be stripped unambiguously — `app7-vendor` is
      indistinguishable from `app7` plus `vendor` — so re-deriving silently produces a third store.
    relationships:
    - rel_type: refines
      spec_id: DL-07-002
    tags:
    - persistence
    - configuration
    adr:
    - ADR-0070
  - id: DL-07-004
    priority: MUST
    kind: project
    statement: >-
      An in-memory store MUST be named such that its identity is carried entirely by its URL, not by
      the identity of an engine object held in a cache.
    rationale: >-
      With identity in a Python object, two independent applications in one process that both host the
      same actor silently shared one store — the URL said `:memory:` for both and only the cache
      distinguished them. Naming the database makes the URL the single source of store identity in
      both file-backed and in-memory modes. Two consequences follow for tests and MUST be respected:
      two DataLayers built for the same actor id are the *same* database, and two scenarios that must
      not see each other's rows therefore need two actor ids.
    relationships:
    - rel_type: refines
      spec_id: DL-07-002
    tags:
    - persistence
    - testing
    adr:
    - ADR-0070
  - id: DL-07-005
    priority: MUST
    kind: project
    statement: >-
      Cross-actor access MUST be named at the call site. `clone_for_actor` MUST be the only route to
      another actor's store, and any node-wide view MUST be assembled by enumerating hosted actors and
      fanning out rather than obtained from a single query.
    rationale: >-
      Makes a fan-out explicit rather than something a forgotten filter grants. `CasePersistence`
      declares `clone_for_actor`, so a cross-actor read is visible in the type as well as in the code.
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    tags:
    - persistence
    adr:
    - ADR-0070
  - id: DL-07-006
    priority: MUST
    kind: project
    statement: >-
      A URL path segment naming an actor MUST be resolved to a canonical actor URI by computation from
      the node's own base URL, without a registry lookup or a scan over stored actor records.
    rationale: >-
      A scan is a cross-actor read, and it could return a *peer's* record — an actor this node does not
      host — because since DL-07-007 a hosted actor's store is full of peer records. Computation also
      means only an actor whose id already has this node's shape is addressable here, which is correct:
      an id under another authority names a process elsewhere.
    relationships:
    - rel_type: refines
      spec_id: DL-07-005
    tags:
    - persistence
    - protocol
    adr:
    - ADR-0070
  - id: DL-07-007
    priority: MUST
    kind: project
    statement: >-
      A peer actor's record MUST live in the address book of each hosted actor that knows it, not in a
      node-global store. `GET /actors/` MUST return only the actors the node hosts.
    rationale: >-
      An actor's view of its peers is that actor's own data, per the Actor Knowledge Model: what an
      actor knows is bounded by what it has received. This is safe because delivery derives a
      recipient's inbox URL from its URI alone and never reads the peer's stored record. A peer is not
      something the node hosts; it is an address some hosted actor happens to know.
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    references:
    - notes/actor-knowledge-model.md
    tags:
    - persistence
    adr:
    - ADR-0070
  - id: DL-07-008
    priority: MUST
    kind: project
    statement: >-
      Retry and dead-letter bookkeeping for an actor's outbox MUST live in that actor's own store and
      MUST NOT be keyed by an actor column in a shared table.
    rationale: >-
      Delivery bookkeeping about an actor's own outbox is that actor's own data, so it is subject to
      DL-07-001 like any other row. Keying it on `(actor_id, activity_id)` in a shared table
      reintroduces exactly the filter-column layout DL-07-001 replaces; keying on `activity_id` alone
      within the actor's store also makes an attempt counter structurally single-valued, so one
      activity cannot accumulate two rival counts.
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    - rel_type: refines
      spec_id: OX-13-001
    tags:
    - persistence
    - messaging
    adr:
    - ADR-0070
- id: DL-08
  title: Storage Fidelity for Inline-Required References
  description: >-
    Persistence dehydrates AS2 reference fields to their id to avoid storing a nested object twice.
    Some references must not be dehydrated, because the protocol requires the object to be *carried*
    rather than referenced and nothing else ever gives it a record to be read back from. Added by
    ISSUE-2482, where the round-trip silently emptied a `Create(CaseProposal)` of its report.
  specs:
  - id: DL-08-001
    priority: MUST_NOT
    kind: architecture
    statement: >-
      Persistence MUST NOT dehydrate a reference field to its id when the declaring model requires that
      field to carry the object inline. A model MUST be able to declare such fields, and the storage
      layer MUST consult that declaration rather than enumerating the affected types itself.
    rationale: >-
      Dehydration is only reversible when the nested object has a record of its own, and inbound
      activities are given records only one level deep — so a second-level inline object collapses to
      an id that no read can expand. CP-01-004 requires `as_CaseProposal` to carry its
      `as_VulnerabilityReport` inline for exactly the reason that makes the collapse unrecoverable: the
      receiver may not hold the report and no dereferencing mechanism is specified (AKM-03-001). The
      declaration belongs on the model because that is where the invariant is, and because a lookup
      table in the storage layer is action at a distance from the field it governs.
    relationships:
    - rel_type: refines
      spec_id: CP-01-004
    - rel_type: refines
      spec_id: AKM-03-001
    verification: >-
      `test/adapters/driven/test_db_record.py` asserts a stored `as_CaseProposal` keeps its report as an
      inline object and that the report round-trips typed, with its `attributed_to` intact.
    tags:
    - persistence
    adr:
    - ADR-0070
  - id: DL-08-002
    priority: MUST
    kind: architecture
    statement: >-
      A type annotation MUST NOT be relied on as the record of an inline-only requirement when that
      annotation also admits a URI string.
    rationale: >-
      `ActivityStreamRequiredRef[T]` expands to `T | as_Link | str`, so a bare URI type-checks and
      `model_validate` accepts a dehydrated object without complaint. CP-01-004 was therefore recorded
      only in prose, and the storage layer had nothing to consult; the resulting collapse surfaced as
      three unrelated "best-effort" skips several layers away, none of which named the cause.
    relationships:
    - rel_type: refines
      spec_id: DL-08-001
    tags:
    - persistence
