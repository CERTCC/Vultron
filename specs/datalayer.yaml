id: DL
title: DataLayer Port
description: Behavioural contract that all DataLayer adapter implementations MUST satisfy. Covers auto-rehydration on read,
  type-safe write operations, and port isolation.
scope:
- prototype
- production
tags:
- persistence
groups:
- id: DL-01
  title: Auto-Rehydration on Read
  specs:
  - id: DL-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`dl.read(id)` MUST return a fully rehydrated, typed domain object: a Pydantic model instance with all dehydrated
      ID-string fields expanded to their full typed objects; if the object does not exist, `VultronNotFoundError` MUST be
      raised.'
    rationale: Core use cases must not contain coercion logic for storage artefacts. See vultron/core/ports/AGENTS.md 'Auto-Rehydration'.
    tags:
    - persistence
  - id: DL-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`dl.list(type_key)` MUST return an iterable of fully rehydrated, typed domain objects; an empty result MUST
      be returned (not an error) when no objects of the given type exist.'
    rationale: >-
      Core code reads lists as often as it reads single objects. If `list` returned
      storage records while `read` returned domain objects, core would need two ways to
      handle stored data. An empty result is a normal answer, not a fault, so a caller
      does not need error handling for a type that has no objects yet.
    tags:
    - persistence
  - id: DL-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Rehydration MUST cover all fields the adapter dehydrates on write (including `object_`, `target`, `origin`);
      if a dehydrated field references a missing ID, the adapter MUST log a WARNING and return the ID string as-is.
    rationale: Preserves partial readability when nested objects are deleted.
    tags:
    - persistence
  - id: DL-01-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Core use cases MUST NOT contain manual coercion of `dl.read()` results; specifically, `model_validate` on a
      `dl.read()` result, `record_to_object()` calls, and `isinstance(result, Document)` checks are prohibited in `vultron/core/`.
    rationale: These patterns indicate the adapter is not satisfying its rehydration contract and MUST be fixed in the adapter,
      not in core.
    tags:
    - persistence
- id: DL-02
  title: Type-Safe Write Operations
  specs:
  - id: DL-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`dl.save(obj)` MUST accept a typed Pydantic domain object directly and handle all serialisation and dehydration
      internally; core MUST NOT call `object_to_record()` before passing an object to `dl.save()`.'
    rationale: Keeps serialisation concerns inside the adapter layer.
    tags:
    - persistence
  - id: DL-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`dl.save(obj)` MUST be idempotent with respect to the object''s `id_`: saving the same object twice with the
      same ID MUST produce the same stored state as saving it once (upsert semantics).'
    rationale: Idempotent writes prevent duplicate-key errors in retry scenarios.
    tags:
    - persistence
    - idempotency
  - id: DL-02-003
    priority: MUST
    kind: project
    statement: '`dl.save_if_unchanged(obj, expected)` MUST write *obj* only if the stored record with that id still equals
      *expected* in stored form, checked atomically with the write, and MUST return `False` and write nothing otherwise,
      including when no record with that id is stored. A replacement whose id differs from *expected*''s MUST raise
      `ValueError`.'
    rationale: >-
      A read-modify-write through `dl.save()` overwrites any write that lands between
      the read and the save, and nothing reports the lost write. A compare-and-set
      closes that gap without a schema change. The caller decides what a refusal means:
      EP-02-004, for example, reads the record again and applies its change again. See
      notes/datalayer-design.md.
    verification: '`test/adapters/driven/test_sqlite_save_if_unchanged.py` covers an unchanged record, a write before the
      call, a write between the call''s own read and write on a file-backed store, an absent record, and a mismatched id.'
    tags:
    - persistence
  - id: DL-02-004
    priority: MUST
    kind: project
    statement: >-
      `with dl.transaction():` MUST make every call on that store, from the
      thread that opened the block, one atomic unit: every write inside the block
      commits when it ends, or none does when it raises, and a read inside the
      block MUST see the block's own writes. A block opened inside another MUST
      roll back only its own writes when it raises. A side effect that tells
      another component a write happened (the outbox enqueue callback) MUST run
      only after the commit.
    rationale: >-
      An act and its consequences are several DataLayer calls (an activity, an
      outbox row, ledger entries, the case-file save). Committed one call at a
      time, a failure part-way leaves a state no single act produces, and recovery
      machinery to finish it is what ADR-0146 rejects. `save_many` is atomic only
      within one call, and its callers cannot read their own uncommitted writes.
    verification: >-
      `test/adapters/driven/datalayer_sqlite/test_transaction.py` covers commit,
      rollback, read-your-writes, another instance on the same store, a nested
      block, a helper's own rollback, a failed flush, the enqueue callback, a
      failing after-commit callback, and another thread, on an in-memory and a
      file-backed store.
    tags:
    - persistence
    adr:
    - ADR-0146
- id: DL-03
  title: Port Isolation
  specs:
  - id: DL-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `DataLayer` port (`vultron/core/ports/datalayer.py`) MUST be defined entirely in terms of core domain types
      and MUST NOT import from `vultron/wire/`, `vultron/adapters/`, or any storage-specific library (SQLModel, TinyDB, etc.).
    rationale: Enforces hexagonal architecture layer separation (ARCH-01-001).
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-001
  - id: DL-03-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The DataLayer adapter MUST NOT expose vocabulary registry lookups or AS2 type-name resolution to core; the
      vocabulary registry is a wire-layer concern and the adapter must maintain its own internal mapping.
    rationale: Prevents wire-layer types from leaking into the core domain through the persistence port.
- id: DL-04
  title: Narrow Core Persistence Ports
  specs:
  - id: DL-04-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `DataLayer` port MUST remain the full adapter-level persistence contract, while core use cases and BT
      nodes MUST depend on `CasePersistence` or `CaseOutboxPersistence` instead of the full `DataLayer` port unless a
      documented exception requires the broader interface.
    rationale: Preserves a complete adapter-facing contract while making narrow, intention-revealing ports the default
      dependency for core code.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-001
  - id: DL-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The current required minimum `CasePersistence` surface is `actor_id`, `clone_for_actor`, `create`, `read`,
      `read_case`, `save`, `save_many`, `transaction`, `list_objects`,
      `find_case_by_report_id`, `find_actor_by_short_id`,
      `find_case_by_short_id`, `find_protocol_pair`, and `delete`; future additions MAY be made only when they preserve
      the same core-facing persistence/query boundary and do not introduce queue, admin, health, or diagnostic
      responsibilities. `actor_id` and `clone_for_actor` are part of the minimum because a store belongs to exactly one
      actor (DL-07-002) and reaching another's is a named operation (DL-07-005). `read_case` is the canonical typed
      accessor for `VulnerabilityCase` retrieval — callers prefer it over `read()` + isinstance narrowing (ISSUE-2490).
    rationale: >-
      A narrow port lets a reader see what core can do with storage. The list states the
      declared Protocol in `vultron/core/ports/case_persistence.py`, so a difference
      between the two is a spec defect, not a code defect. `actor_id` and
      `clone_for_actor` are in the list because each store belongs to one actor
      (DL-07-002) and access to the store of another actor must be named (DL-07-005).
      `read_case` gives a typed case read, so callers do not narrow a `read()` result
      themselves. New query helpers stay possible if they keep to domain persistence and
      queries. `get` and `by_type` are not in the list (DL-04-005).
    adr:
    - ADR-0073
  - id: DL-04-003
    lint_suppress:
    - rationale_too_long
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: '`CasePersistence` MUST NOT include inbox queue methods, outbox inspection or drain methods, `ping`,
      `clear_*`, `update`, `get_all`, `all`, `count_all`, or other infrastructure, admin, or diagnostic
      operations that belong to the full `DataLayer` adapter contract.'
    rationale: >-
      Queue, admin and diagnostic operations work on storage, not on case data. If core
      can call them, core logic starts to depend on how the adapter stores data.
      `delete` is not on this list: core removes records that it wrote itself, and that
      is a domain operation (DL-04-002). `update` is on this list because core changes a
      record through `save`, which is idempotent by object id (DL-02-002).
  - id: DL-04-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`CaseOutboxPersistence` MUST extend `CasePersistence` only with the outbound enqueue method
      `outbox_append`; if a `ReceivedUseCase` depends on `CaseOutboxPersistence`, that dependency MUST be treated as a
      documented architectural smell rather than normal design.'
    rationale: >-
      An outbound enqueue is a side effect that a reader of a use case must be able to
      see, and a separate port shows it in the type. A received use case that also sends
      is a mixed design, so the port marks it for review. `outbox_append` writes only to
      the outbox of the actor that owns the store. A method that takes an actor id would
      allow a write to the queue of another actor, which DL-07-001 forbids.
    adr:
    - ADR-0073
  - id: DL-04-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`get()` and `by_type()` MUST NOT be declared on `CasePersistence`; core code MUST use typed `read()`,
      `list_objects()`, or dedicated typed helper methods. Any reintroduction of a raw-record escape hatch on the narrow
      port MUST be recorded as a deliberate decision rather than added incidentally.'
    rationale: >-
      `get` and `by_type` return raw storage records, not typed domain objects. A raw
      record in core brings back the coercion code that DL-01-004 forbids. Neither
      method is on the Protocol now, and this rule keeps them out. A real need for raw
      access must be a recorded decision, so that nobody adds it by accident.
- id: DL-05
  title: Core-Object Read Contract
  description: The DataLayer read path MUST return core domain objects for every persisted type that has a registered core
    counterpart. Wire-layer vocabulary types MUST NOT be handed to core code through the persistence port.
  specs:
  - id: DL-05-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`dl.read(id)` and `dl.list_objects(type_key)` MUST reconstruct persisted domain entities using the core
      vocabulary registry (`vultron.core.models.registry.CORE_VOCABULARY`) so that the returned instance is a
      `vultron.core.models` type (e.g. core `VulnerabilityCase`), never a `vultron.wire.as2.vocab` type
      (e.g. `as_VulnerabilityCase`), whenever the persisted `type_` has a registered core counterpart.'
    rationale: >-
      Core code MUST receive core domain objects so that core validators run and static analysis sees the real type
      (ARCH-01-002). Reconstructing via the wire `VOCABULARY` returns wire objects that only work in core by structural
      coincidence of field names. Decided in ADR-0034; derived from ARCH-01-002 and DL-03-002.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-002
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0034
  - id: DL-05-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The DataLayer adapter MUST own the wire↔core translation for persistence.
    rationale: >-
      The wire registry is a wire-layer concern (DL-03-002). Making the adapter own translation
      decouples DataLayer storage from the wire type system so the wire layer can evolve without
      breaking persistence.
    relationships:
    - rel_type: implements
      spec_id: DL-03-002
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0034
  - id: DL-05-003
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Core code (`vultron/core/`) MUST NOT use structural duck-typing Protocols to accept
      DataLayer results without importing concrete core types. Core MUST depend on concrete
      domain classes and use `isinstance` narrowing directly. Structural workaround Protocols
      that evade ARCH-01-001 are prohibited.
    rationale: >-
      The duck-typing Protocols exist solely to let core touch wire objects at runtime without a compile-time wire import,
      evading rather than honouring ARCH-01-001. When the read path returns core objects, the Protocols are dead weight
      and mask the boundary from mypy/pyright.
    relationships:
    - rel_type: implements
      spec_id: ARCH-01-001
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0034
  - id: DL-05-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: An architecture ratchet test MUST assert that no `vultron.wire.as2` vocabulary type is returned from
      `dl.read()` / `dl.list_objects()` into `vultron/core/`; the test MAY exempt persisted AS2 Activity types that have no
      registered core counterpart, and any such exemption MUST be enumerated explicitly so the exemption set can only shrink.
    rationale: >-
      Prevents regression back to wire-object leakage. Activity read-back from core is itself a boundary violation tracked
      separately; the enumerated exemption set documents the remaining debt and ratchets toward zero.
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0034
  - id: DL-05-005
    priority: MUST
    kind: project
    statement: >-
      Wire→core normalisation on the persistence write path MUST use `CORE_VOCABULARY` lookup
      (DL-05-006, ARCH-23-002), not a hand-maintained
      `_NORMALIZE_WIRE_TO_CORE` list in `vultron/adapters/driven/db_record.py`. Once wire and core
      registry keys are disjoint (ARCH-23-002) no wire class shadows a `CORE_VOCABULARY` entry, so
      the subject set of the former grow-only ratchet is permanently empty; that list and its
      ratchet test MUST be deleted rather than maintained.
    rationale: >-
      A wire-shaped row in a core-typed table breaks every later read of that row. A
      hand-kept list of wire classes to normalise must change each time a type changes,
      and a missed update is a silent defect. The `CORE_VOCABULARY` lookup needs no
      list. Wire and core registry keys are disjoint (ARCH-23-002), so no wire class can
      shadow a core type, and the list is always empty. A check over an empty list can
      never fail. It gives false confidence, so the list and its test must not exist
      (ADR-0099).
    verification: >-
      A grep test asserts that neither `_NORMALIZE_WIRE_TO_CORE` nor
      `test_normalize_wire_to_core_ratchet.py` exists, so neither can be reintroduced, and the
      ARCH-23-002 disjointness test confirms no shadowing type remains to normalise.
    relationships:
    - rel_type: implements
      spec_id: DL-05-001
    - rel_type: depends_on
      spec_id: ARCH-23-002
      note: Disjoint registry keys are what empty this requirement's former subject set.
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0062
    - ADR-0082
    - ADR-0099
  - id: DL-05-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The DataLayer adapter MUST maintain its own `type_`→core-class mapping (via
      `CORE_VOCABULARY`) that is independent of the wire `VOCABULARY` registry.
    rationale: >-
      An independent adapter-owned mapping decouples DataLayer storage from the wire type system
      so the wire layer can evolve without breaking persistence (DL-03-002).
    tags:
    - persistence
    - wire-format
  - id: DL-05-007
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      The wire vocabulary registry MUST NOT be the mechanism by which core objects are
      reconstructed on the DataLayer read path.
    rationale: >-
      Using the wire registry for core object reconstruction leaks wire-layer concerns into the
      adapter read path, violating DL-03-002.
    tags:
    - persistence
    - wire-format
  - id: DL-05-008
    priority: MUST
    kind: project
    statement: >-
      The write path MUST NOT retain a deferral list of not-yet-normalised types. The companion
      `_NOT_YET_NORMALIZED` enumeration in `vultron/adapters/driven/db_record.py` MUST be deleted
      together with `_NORMALIZE_WIRE_TO_CORE` (DL-05-005).
    rationale: >-
      With disjoint registry keys (ARCH-23-002), no wire type shadows a core type, so no
      type is left to defer. `extra="forbid"` (ARCH-12-003) makes a wrongly shaped row
      fail at read-back. An empty deferral list in the source code invites a contributor
      to add the next entry to it, instead of a fix to the type.
    verification: >-
      A grep test asserts `_NOT_YET_NORMALIZED` does not appear under `vultron/adapters/`.
    relationships:
    - rel_type: depends_on
      spec_id: DL-05-005
      note: The deferral list has no purpose once the normalisation list it defers against is gone.
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0062
    - ADR-0082
  - id: DL-05-009
    priority: MUST
    kind: project
    statement: >-
      The closed-form guarantee that no wire-shaped row slips into a core-typed table MUST be
      carried by the structural invariants — disjoint registry keys (ARCH-23-002) plus
      `extra="forbid"` on every core-branch type (ARCH-12-003) — rather than by a per-type
      coverage ratchet over `_NORMALIZE_WIRE_TO_CORE`.
    rationale: >-
      A coverage check over a list protects only the types that somebody put on the
      list. A new type that is not on the list is a silent gap. Disjoint registry keys
      make a shadowing type impossible to create. `extra="forbid"` makes an
      un-normalised row raise an error, so its keys are not silently dropped. The type
      system holds these two properties, so nobody has to maintain a list.
    verification: >-
      A test asserts every `CoreObject` subclass resolves `extra="forbid"`, and that reading back
      a deliberately wire-shaped row raises rather than yielding a partially-populated core object.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-12-003
      note: '`extra="forbid"` is the read-back guard that replaces per-type coverage bookkeeping.'
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0062
    - ADR-0082
- id: DL-06
  title: Activity Read-Back and the Semantic/Envelope Split
  description: >-
    Core code MUST NOT read a persisted wire AS2 Activity back from the DataLayer to
    recover its semantic content. AS2 protocol Activities are wire-only envelopes with
    no registered core counterpart (the DL-05-004 exemption set); the domain fact each
    carries MUST live as core state. A received activity is archived as the body that
    arrived, and two reads of it are sanctioned: core reads its facts from the read-only
    view a load of that body yields, and a wire/adapter-owned seam parses it to embed it
    in a reply. Decided in ADR-0035, partially superseded by ADR-0149; extends DL-05 and
    ARCH-09-001.
  specs:
  - id: DL-06-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Core code (`vultron/core/`) MUST NOT call `dl.read(activity_id)` or
      `dl.list_objects(<activity_type>)` to recover the semantic content of a persisted
      wire AS2 Activity (e.g. reading a stored `Offer` to obtain the embedded report, or
      a stored `Invite` to obtain its case or embargo id). Core MUST read a received
      activity's facts only from the read-only view a load of its archived body yields
      (the `ReceivedActivityLoader` port, ADR-0149), and every other domain fact from
      core state.
    rationale: >-
      AS2 protocol activities have no core counterpart. If core reads one back, core
      receives a `vultron.wire.as2` type (ARCH-01-002). Core also interprets again an
      activity that the semantic extractor already interpreted (ARCH-03-001). The stored
      activity then becomes the record of a domain fact, but wire must be a projection
      of core (ARCH-09-001). The loaded view of the archive is the only exception. It is
      the output of the semantic extractor for the archived body, so it interprets
      nothing again and gives core no wire type (ADR-0149). See ADR-0035.
    relationships:
    - rel_type: implements
      spec_id: ARCH-09-001
    - rel_type: implements
      spec_id: ARCH-03-001
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
  - id: DL-06-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Every domain fact an actor must remember from a received protocol message MUST be
      recorded as core state — either a state transition on an existing core entity or a
      purpose-built core record — at the point the semantic extractor first interprets
      the inbound activity. Core MUST NOT reconstruct such a fact by re-reading a stored
      activity later. Reading the read-only view a received activity's archive loads
      (DL-06-001) is not such a re-read.
    rationale: >-
      Core is the sole system of record for domain facts (the Actor Knowledge Model
      bounds an actor's knowledge to what it has received, and that knowledge is held as
      core state). Capturing the fact once at extraction time removes the need for core
      to reach back through the wire envelope. This does NOT mean cloning each AS2
      Activity into a 1:1 core Activity class; model only the domain fact each message
      conveys, in domain vocabulary, capturing only what handlers use. The archive's
      loaded view is the extraction itself, run again on the archived body, so reading
      it reaches back through no envelope (ADR-0149). Decided in ADR-0035.
    relationships:
    - rel_type: implements
      spec_id: ARCH-03-001
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
    - ADR-0149
  - id: DL-06-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      When an inbound protocol message references a prior message (e.g. an Accept answering an Invite, a counter-offer
      answering an Offer), core MUST correlate them through a core-entity relationship (e.g. "the pending embargo proposal
      for this case", "the invitation for this actor"), NOT by re-reading the referenced wire activity from the DataLayer.
    rationale: >-
      Correlation is a domain relationship between core facts. Recovering it by re-reading the referenced activity
      reintroduces the DL-06-001 violation and depends on the wire envelope surviving as a semantic record. When the prior
      message was first received it MUST have created or updated the core entity that the later message now correlates to.
      Decided in ADR-0035.
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
  - id: DL-06-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Reconstituting the verbatim original activity for an outbound reply's inline
      `object_` / `in_reply_to` field (as the Actor Knowledge Model requires) MUST read
      the received body the receiver archived and parse it in the wire/adapter layer,
      and the reply MUST embed that body as received, every key included; core code MUST
      NOT read the body to interpret its meaning. Such a wire/adapter-owned seam is NOT
      counted as a core boundary violation under DL-05-004.
    rationale: >-
      Activity IDs are non-regenerable random `urn:uuid:` values and the Actor Knowledge
      Model requires a reply to embed the full inline original activity, so verbatim
      reconstitution cannot be produced by re-projecting core state — the original
      envelope (with its original id) must be retained and read back. Confining that
      read to a wire/adapter seam that never interprets the payload keeps semantic
      authority in core while satisfying transport needs. A re-dump of a parsed or
      extracted form is not the original: the parse sets aside keys the vocabulary does
      not name, and the extractor keeps only what core reads, so the reply embeds the
      archived body itself (ADR-0149). `CaseLedgerEntry` `payloadSnapshot` is the
      existing precedent for opaque, write-only activity retention. Decided in ADR-0035.
    relationships:
    - rel_type: refines
      spec_id: DL-05-004
    tags:
    - persistence
    - wire-format
    adr:
    - ADR-0035
    - ADR-0149
  - id: DL-06-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      As each core semantic read is migrated off activity read-back (per DL-06-001
      through DL-06-003), the corresponding AS2 Activity type MUST be removed from the
      DL-05-004 ratchet exemption set. The exemption set MUST reach zero once all core
      semantic activity reads are migrated; the only remaining sanctioned activity reads
      are the wire/adapter envelope-reconstitution seam of DL-06-004 and core's reads of
      an archive's loaded view (DL-06-001).
    rationale: >-
      The exemption set names the AS2 activity types that `dl.read()` may still return
      to core. When a core read moves off activity read-back, its type leaves the set,
      so the set shows the work that remains. When the set is empty, no core semantic
      read of an activity is left (DL-06-001). A test fails when an exempt type gets a
      core counterpart, so a stale entry cannot stay in the set. See ADR-0035.
    relationships:
    - rel_type: refines
      spec_id: DL-05-004
    tags:
    - persistence
    - testing
    - wire-format
    adr:
    - ADR-0035
  - id: DL-06-006
    priority: MUST_NOT
    kind: project
    statement: >-
      A receiver MUST NOT hold a received activity in its DataLayer as a record readable
      by the id the sender chose for it, at any stage: not at inbox ingress, not for a
      deferred replay, and not in a received-side tree. A received activity is held only
      under a key the receiver derives from the activity id: its
      `ReceivedActivityRecord.build_id`, or the opaque deferred record that holds it for
      replay (`DeferredInboxActivity.build_id`, IO-03-004). A record of an activity type
      stored under its own id is then always one the receiver authored.
    rationale: >-
      An actor scans the type tables of its sent activities to answer "did I already
      send this?". For example, it checks whether it announced a case or which stub
      Invites it issued. A received copy stored under the sender's id gives a false yes,
      also when its unsigned `actor` field names the receiver. CLP-10-017 keeps intake
      off the sender's id for this reason. This rule gives the same protection at every
      writer, so a received activity never looks like one that the receiver sent.
    relationships:
    - rel_type: refines
      spec_id: CLP-10-017
    - rel_type: refines
      spec_id: IO-03-004
    verification: >-
      `test/adapters/driving/fastapi/test_received_activity_not_sender_keyed.py`
      asserts that ingress writes nothing, and delivers through the real inbox an
      activity each "did I send it" scan would match (a `Create` naming the case, one
      under the proposal-derived id, a `Create` and a stub `Invite` whose `actor` names
      the receiver), asserting `case_is_announced`, `announced_case_id`,
      `find_case_create_sent_by` and `recorded_stub_invites` do not count it; all pass.
      `test/adapters/driving/fastapi/test_inbox_staging.py` asserts a deferred
      activity is held only in its `DeferredInboxActivity` and that no row under the
      sender's id is replayed. For the received-side trees, the
      `Invite(EmbargoEvent)`, `Offer(VulnerabilityReport)` and ownership-transfer
      `Offer` tests in `test/core/use_cases/received/` (marked DL-06-006) run each tree
      on a store with no ingress row and assert, through `assert_held_only_as_received`
      (`test/support/received.py`), that nothing is held under the activity's id and
      that its `ReceivedActivityRecord` is. Trigger tests marked DL-06-006 seed only
      that record and assert each reply is built from it.
    tags:
    - persistence
- id: DL-07
  title: Per-Actor Store Isolation
  specs:
  - id: DL-07-001
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: project
    statement: >-
      Each actor MUST have its own store. A DataLayer instance MUST belong to exactly one actor, and
      one actor's writes MUST NOT be able to affect what another actor could read — including writes
      to the same object ID, which two actors MAY each hold their own replica of.
    rationale: >-
      CM-01-001 requires that the data of one actor is isolated from the data of
      another. If isolation depends on a filter column in each query, reads are
      separated but writes are not. A `save()` by one actor can then overwrite the row
      of another actor, and a `create()` can fail for a second actor that holds its own
      replica of the same object. When each actor has its own store, the layout carries
      the isolation, and these failures cannot occur. See ADR-0073.
    relationships:
    - rel_type: implements
      spec_id: CM-01-001
    verification: >-
      `test/adapters/driven/test_datalayer_isolation.py` asserts that two actors sharing one
      configured store each create, read back and mutate their own replica of the same object ID,
      and that neither can affect what the other reads.
    tags:
    - persistence
    adr:
    - ADR-0073
  - id: DL-07-002
    priority: MUST
    kind: project
    statement: >-
      A DataLayer MUST NOT be constructible without an actor. There MUST be no shared, unscoped, or
      "admin" DataLayer, and no factory MUST return an instance whose actor is unset.
    rationale: >-
      A store without an actor can read across actors, and it collects domain data that
      belongs to no actor. A rule that depends on every call site to set the scope fails
      at the first call site that forgets. When no unscoped DataLayer can be
      constructed, a missed scope cannot break DL-07-001.
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    verification: >-
      `SqliteDataLayer` cannot be constructed without a keyword `actor_id`, and
      `test_every_instance_carries_the_actor_it_was_asked_for` asserts that `get_datalayer` always
      returns an instance carrying the actor it was asked for and that the argument cannot be omitted.
    tags:
    - persistence
    adr:
    - ADR-0073
    - ADR-0012
  - id: DL-07-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The configured `db_url` MUST be treated as a template rather than a location: each actor's store
      MUST be derived from it per actor. An already-derived URL MUST NOT be passed back through the
      derivation.
    rationale: >-
      A single configured location cannot express one store per actor. Derivation is not idempotent
      and cannot be made so, because a suffix cannot be stripped unambiguously — `app7-vendor` is
      indistinguishable from `app7` plus `vendor` — so re-deriving silently produces a third store.
    relationships:
    - rel_type: refines
      spec_id: DL-07-002
    tags:
    - persistence
    - configuration
    adr:
    - ADR-0073
  - id: DL-07-004
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      An in-memory store MUST be named such that its identity is carried entirely by its URL, not by
      the identity of an engine object held in a cache.
    rationale: >-
      If a Python engine object carries the identity of an in-memory store, two
      applications in one process that host the same actor can share one store by
      accident, because both URLs say `:memory:`. A named database makes the URL the
      only source of store identity, for file-backed and in-memory stores. Tests must
      respect two results of this rule. Two DataLayers built for the same actor id are
      the same database. Two scenarios that must not see each other's rows therefore
      need two actor ids.
    relationships:
    - rel_type: refines
      spec_id: DL-07-002
    tags:
    - persistence
    - testing
    adr:
    - ADR-0073
  - id: DL-07-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Cross-actor access MUST be named at the call site. `clone_for_actor` MUST be the only route to
      another actor's store, and any node-wide view MUST be assembled by enumerating hosted actors and
      fanning out rather than obtained from a single query.
    rationale: >-
      Makes a fan-out explicit rather than something a forgotten filter grants. `CasePersistence`
      declares `clone_for_actor`, so a cross-actor read is visible in the type as well as in the code.
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    tags:
    - persistence
    adr:
    - ADR-0073
  - id: DL-07-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A URL path segment naming an actor MUST be resolved to a canonical actor URI by computation from
      the node's own base URL, without a registry lookup or a scan over stored actor records.
    rationale: >-
      A scan is a cross-actor read, and it could return a *peer's* record — an actor this node does not
      host — because since DL-07-007 a hosted actor's store is full of peer records. Computation also
      means only an actor whose id already has this node's shape is addressable here, which is correct:
      an id under another authority names a process elsewhere.
    relationships:
    - rel_type: refines
      spec_id: DL-07-005
    - rel_type: implements
      spec_id: ARCH-13-003
    tags:
    - persistence
    - protocol
    adr:
    - ADR-0073
  - id: DL-07-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A peer actor's record MUST live in the address book of each hosted actor that knows it, not in a
      node-global store. `GET /actors/` MUST return only the actors the node hosts.
    rationale: >-
      An actor's view of its peers is that actor's own data, per the Actor Knowledge Model: what an
      actor knows is bounded by what it has received. This is safe because delivery derives a
      recipient's inbox URL from its URI alone and never reads the peer's stored record. A peer is not
      something the node hosts; it is an address some hosted actor happens to know.
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    references:
    - notes/actor-knowledge-model.md
    tags:
    - persistence
    adr:
    - ADR-0073
    - ADR-0081
  - id: DL-07-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Retry and dead-letter bookkeeping for an actor's outbox MUST live in that actor's own store and
      MUST NOT be keyed by an actor column in a shared table.
    rationale: >-
      Delivery bookkeeping about an actor's own outbox is that actor's own data, so it is subject to
      DL-07-001 like any other row. Keying it on `(actor_id, activity_id)` in a shared table
      reintroduces exactly the filter-column layout DL-07-001 replaces; keying on `activity_id` alone
      within the actor's store also makes an attempt counter structurally single-valued, so one
      activity cannot accumulate two rival counts.
    relationships:
    - rel_type: refines
      spec_id: DL-07-001
    - rel_type: refines
      spec_id: OX-13-001
    tags:
    - persistence
    - messaging
    adr:
    - ADR-0073
  - id: DL-07-009
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: architecture
    statement: >-
      When execution is scoped to an actor, every store reference reachable from that scope MUST be
      reconciled to the same actor — not the store alone. A component injected with a store of its own
      MUST either offer a named way to be rebound to another actor's store or hold no store at all;
      writes belonging to one logical operation MUST NOT land in two actors' stores.
    rationale: >-
      If only the store moves to the executing actor, other components on the same
      blackboard can still hold the store of a different actor. For example, an adapter
      that persists an outbound activity can write it to the store of the requesting
      actor while the outbox entry goes to the store of the executing actor. Delivery
      then cannot read the activity and skips it with no error, so the recipient is
      never told. Rebinding is opt-in, so that a stateless collaborator is not replaced
      without the knowledge of its caller. The opt-in is on the type, not on the
      instance, because a test double answers any attribute.
    relationships:
    - rel_type: refines
      spec_id: DL-07-005
    - rel_type: implements
      spec_id: PCR-08-007
    verification: >-
      `test/core/behaviors/test_bridge.py::test_a_delegated_emit_writes_activity_and_outbox_to_one_store`
      creates an activity through the injected port and queues its id through the blackboard store while
      executing as a co-located CaseActor, and asserts the queued id is readable from the store that
      holds the queue entry. `test/core/behaviors/test_store_scope.py::TestPortForStore` asserts the
      rebinding is opt-in, is a no-op when the store already matches, and does not fire on a bare `Mock`.
    tags:
    - persistence
    - behavior-tree
    adr:
    - ADR-0073
  - id: DL-07-010
    priority: MUST
    kind: project
    statement: >-
      `POST /actors/` MUST reject with 422 an absolute `actor_id` whose authority (host and port)
      differs from that of the node's configured base URL, and MUST NOT create a store or actor
      record for it. A peer actor
      MUST instead be registered through `POST /actors/{actor_id}/peers/`, which writes the peer's
      actor record into the store of the hosted actor named in the path (DL-07-007), answers 404 when
      that path names no actor this node hosts, and is idempotent: registering a peer id that the
      hosted actor already holds returns the existing record rather than a second one.
    rationale: >-
      If the node creates a store for each posted id, it claims to host actors that live
      elsewhere. Two foreign ids with the same final path segment then share one store,
      and the second actor gets the record of the first. A check of the authority at the
      route keeps the node from hosting a foreign actor. A peer is registered in the
      store of the hosted actor that knows it, so hosting an actor and knowing an actor
      stay separate. See ADR-0081.
    relationships:
    - rel_type: refines
      spec_id: DL-07-007
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors.py::TestCreateActor::test_a_foreign_absolute_id_is_rejected`
      asserts the 422, that no actor is listed and that no store is opened for the id;
      `TestRegisterPeer` asserts the peer record lands in the hosted actor's store and that the peer
      gets no store of its own, that a second registration returns 200 with the existing record,
      that the peer is absent from `GET /actors/`, and that an unhosted path actor returns 404.
    tags:
    - persistence
    adr:
    - ADR-0081
  - id: DL-07-011
    priority: MUST
    kind: project
    statement: >-
      A node MUST enumerate the actors it hosts from the stores of its own storage
      deployment: the `db_url` template its app declares, or the configured `db_url`
      only when the app declares none. This holds in memory mode as in file mode.
    rationale: >-
      File mode scopes enumeration by construction: it lists the files named after the
      node's template. Memory mode listed every store any app in the process had opened,
      so nodes sharing a process (the demo harness, the scenario recorder) opened empty
      stores for each other's actors and flooded runs with store-sharing warnings
      (#5319). In production one process is one node, so the configured `db_url` is the
      node's own deployment.
    relationships:
    - rel_type: refines
      spec_id: DL-07-005
    verification: >-
      `test/adapters/driven/test_actor_hosts.py` asserts that two in-memory deployments
      in one process each enumerate only their own actors, and that a deployment given
      no template enumerates the configured one.
    tags:
    - persistence
    adr:
    - ADR-0073
  - id: DL-07-012
    priority: MUST
    kind: project
    statement: >-
      A node MUST map each enumerated store's slug back to an actor id through its own
      base URL: the one its app declares, or the configured one only when it declares
      none.
    rationale: >-
      A slug names a store, not an actor (DL-07-004). Two in-process nodes that share
      a slug, such as each node's `primary`, are different actors, and only the node's
      own base URL says which one this node hosts.
    relationships:
    - rel_type: refines
      spec_id: DL-07-011
    verification: >-
      `test/adapters/driven/test_actor_hosts.py` asserts that two in-memory deployments
      with different base URLs and the same slug each return the actor id under their
      own base URL.
    tags:
    - persistence
    adr:
    - ADR-0073
  - id: DL-07-013
    priority: MUST
    kind: project
    statement: >-
      An in-memory node MUST NOT list as hosted an actor whose store was opened only
      under another deployment in the same process, or a scratch store.
    rationale: >-
      The process-wide store cache holds every deployment's stores and the `~` scratch
      stores. Listing them made `GET /actors/` and `/info` open an empty store on this
      node for each foreign actor (#5319).
    relationships:
    - rel_type: refines
      spec_id: DL-07-011
    verification: >-
      `test/adapters/driven/test_actor_hosts.py` asserts that scratch stores are not
      enumerated; `test/adapters/driving/fastapi/test_app_isolation.py` asserts that
      `GET /actors/` and `/info` on each of two in-process nodes list only that node's
      actors.
    tags:
    - persistence
    adr:
    - ADR-0073
  - id: DL-07-014
    priority: MUST
    kind: project
    statement: >-
      A node-wide operation over hosted actors, such as the admin reset, MUST open each
      actor's store under the same deployment it enumerated the actor from.
    rationale: >-
      The reset fallback opened stores under the configured `db_url`, so on a node that
      declares its own template it cleared another deployment's stores, left its own
      untouched, and still reported success (#5319).
    relationships:
    - rel_type: refines
      spec_id: DL-07-011
    verification: >-
      `test/adapters/driving/fastapi/test_app_isolation.py` asserts that the admin reset
      on one of two in-process nodes clears that node's stores and leaves the other
      node's stores intact.
    tags:
    - persistence
    adr:
    - ADR-0073
- id: DL-08
  title: Storage Fidelity for Inline-Required References
  description: >-
    Persistence dehydrates AS2 reference fields to their id to avoid storing a nested object twice.
    Some references must not be dehydrated, because the protocol requires the object to be *carried*
    rather than referenced and nothing else ever gives it a record to be read back from. Added by
    ISSUE-2482, where the round-trip silently emptied a `Create(CaseProposal)` of its report.
  specs:
  - id: DL-08-001
    lint_suppress:
    - rationale_too_long
    priority: MUST_NOT
    kind: architecture
    statement: >-
      Persistence MUST NOT dehydrate a reference field to its id when the declaring model requires that
      field to carry the object inline. A model MUST be able to declare such fields, and the storage
      layer MUST consult that declaration rather than enumerating the affected types itself.
    rationale: >-
      Dehydration is only reversible when the nested object has a record of its own, and inbound
      activities are given records only one level deep — so a second-level inline object collapses to
      an id that no read can expand. CP-01-004 requires `as_CaseProposal` to carry its
      `as_VulnerabilityReport` inline for exactly the reason that makes the collapse unrecoverable: the
      receiver may not hold the report and this codebase dereferences only the few
      references AKM-05-007 lists (AKM-03-003). The
      declaration belongs on the model because that is where the invariant is, and because a lookup
      table in the storage layer is action at a distance from the field it governs.
    relationships:
    - rel_type: refines
      spec_id: CP-01-004
    - rel_type: refines
      spec_id: AKM-03-001
    verification: >-
      `test/adapters/driven/test_db_record.py` asserts a stored `as_CaseProposal` keeps its report as an
      inline object and that the report round-trips typed, with its `attributed_to` intact.
    tags:
    - persistence
    adr:
    - ADR-0073
  - id: DL-08-002
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      A type annotation MUST NOT be relied on as the record of an inline-only requirement when that
      annotation also admits a URI string.
    rationale: >-
      `ActivityStreamRequiredRef[T]` expands to `T | as_Link | str`. A bare URI
      therefore passes the type check, and `model_validate` accepts a dehydrated object
      with no error. If the annotation is the only record of an inline-only rule, the
      storage layer has nothing to consult. A collapsed reference then fails far from
      its cause, and no message names the cause.
    relationships:
    - rel_type: refines
      spec_id: DL-08-001
    tags:
    - persistence
    adr:
    - ADR-0073
  - id: DL-08-003
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: architecture
    statement: >-
      An activity whose reference field names another *actor* MUST declare that field inline-required.
    rationale: >-
      Each actor's record lives in its own store (ADR-0073). A peer that an outbound
      activity names has no record in the store of the sending actor, because actor
      discovery is not implemented (ADR-0024). Dehydration is reversible only against
      such a record (DL-08-001), so a peer actor stored as its id cannot be expanded
      again. Each activity that names a peer, such as `_RmInviteToCaseActivity` in
      `object_` or `_OfferCaseOwnershipTransferActivity` in `target`, declares that
      field in `inline_required_refs`. The role offer also declares its `object_`, a
      `CaseParticipantRole` that the factory creates inline and no path persists. Each
      factory wraps a peer named by a bare id as an `as_Actor`, so the peer travels
      inline. Each other required typed reference names an activity, which stays inline,
      or a case, report, status, participant or embargo, which the sender holds. The
      parser stores a received activity as its base class. Storage therefore also reads
      the inline declaration of the semantic class that the activity matches. For
      example, the CASE_MANAGER holds no record of an ownership transferee, so its
      ledger snapshot must carry the transferee inline (CLP-07-006). Without the
      declaration, outbox delivery refuses the stored activity for AKM-03-003, and the
      invitee is never told about its invitation. Read-back must also re-type the inline
      object, or semantic matching classifies the activity as UNKNOWN. For this reason
      the re-typing set (`_inline_typed_fields` in `db_record.py`) is wider than the
      dehydration set and includes `context`.
    relationships:
    - rel_type: refines
      spec_id: DL-08-001
    - rel_type: refines
      spec_id: AKM-03-001
    verification: >-
      `test/adapters/driven/test_db_record.py` asserts a stored
      `_RmInviteToCaseActivity` keeps its invitee as an object through a write/read
      round-trip, that all four peer-actor-naming activities declare the naming field in
      `inline_required_refs`, that each still coerces back to its semantic class after
      storage, and that an ownership-transfer Offer keeps its transferee inline when
      stored as built and as received.
      `test/adapters/driving/fastapi/test_ownership_offer_inbox.py` drives the owner's
      ownership-transfer proposal through the real inbox at a CASE_MANAGER holding no
      transferee profile and asserts the ledger commits carry the transferee inline.
    tags:
    - persistence
    adr:
    - ADR-0073
