id: SE
title: Semantic Extraction
description: >-
  The inbox handler extracts semantic meaning from ActivityStreams activities by matching
  activity type and object type patterns. This semantic type determines which handler function
  processes the activity.
version: 1.2.0
scope:
- prototype
- production
tags:
- messaging
- wire-format
groups:
- id: SE-01
  title: Pattern Matching
  specs:
  - id: SE-01-001
    priority: MUST
    kind: protocol
    statement: The system MUST match activities using activity type and object type patterns
  - id: SE-01-002
    priority: MUST
    kind: protocol
    statement: >-
      The semantic extraction algorithm MUST handle both fully expanded objects and URI string
      references defensively
  - id: SE-01-003
    priority: MUST
    kind: protocol
    statement: 'If rehydration fails for any nested object, the system MUST: (1) log a WARNING identifying the unresolvable URI, (2) return MessageSemantics.UNKNOWN for the containing activity, and (3) store the activity in a dead-letter record per SE-04-003.'
  - id: SE-01-004
    priority: MUST
    kind: protocol
    statement: >-
      Pattern matching MUST support type/subclass matching semantics for actor/object classes
    relationships:
    - rel_type: depends_on
      spec_id: SE-01-002
- id: SE-02
  title: Semantic Type Assignment
  specs:
  - id: SE-02-001
    priority: MUST
    kind: protocol
    statement: >-
      The system MUST assign MessageSemantics enum value via `find_matching_semantics()`
  - id: SE-02-002
    priority: MUST
    kind: protocol
    statement: The function MUST return the first matching semantic type
  - id: SE-02-003
    priority: MUST
    kind: protocol
    statement: The function MUST return MessageSemantics.UNKNOWN if no patterns match
- id: SE-03
  title: Pattern Registry
  specs:
  - id: SE-03-001
    priority: MUST
    kind: protocol
    statement: >-
      SEMANTICS_ACTIVITY_PATTERNS MUST contain patterns for all supported MessageSemantics
      values except UNKNOWN
  - id: SE-03-002
    priority: MUST
    kind: protocol
    statement: Pattern registry MUST be ordered from most specific to least specific
  - id: SE-03-003
    priority: MUST
    kind: protocol
    statement: >-
      Every `ActivityPattern` entry in `SEMANTICS_ACTIVITY_PATTERNS` MUST discriminate on
      at minimum both Activity type AND Object type
    rationale: >-
      A pattern without an object-type constraint would match every activity of that verb
      type regardless of payload, causing misrouting when multiple semantics share an outer
      Activity type
- id: SE-04
  title: Unrecognized Activity Handling
  specs:
  - id: SE-04-001
    priority: MUST
    kind: protocol
    statement: The system MUST log unrecognized activities at WARNING level
  - id: SE-04-002
    priority: MUST
    kind: protocol
    statement: >-
      The system MUST distinguish two causes of `MessageSemantics.UNKNOWN`: 1. **No pattern
      match**: No registered `ActivityPattern` matched the activity structure → raise `VultronApiHandlerMissingSemanticError`
      2. **Unresolvable `object_`**: `object_` remains a bare string URI after rehydration
      (per VAM-01-009) → do NOT raise an error; instead log a WARNING, store the activity
      in a dead-letter record, and return silently
    rationale: >-
      An unresolvable `object_` URI is not a programming error; it is a data completeness
      issue that may resolve later. Treating it as a 5xx error would cause unnecessary noise
      and fail legitimate protocol flows.
  - id: SE-04-003
    priority: MUST
    kind: protocol
    statement: >-
      Dead-letter records for unresolvable-object_ activities MUST include: the full activity
      JSON, the unresolvable URI, the actor ID, and a timestamp. They MUST be stored in a
      DataLayer collection accessible for administrative review and retry.
  - id: SE-04-004
    priority: MUST
    kind: protocol
    statement: >-
      For any future synchronous processing path (non-background), UNKNOWN due to unresolvable
      `object_` MUST return HTTP 422 with an explanatory error body identifying the unresolvable
      URI
- id: SE-05
  title: Pattern Validation
  specs:
  - id: SE-05-001
    priority: MUST
    kind: protocol
    statement: All patterns MUST have corresponding MessageSemantics enum value
  - id: SE-05-002
    priority: MUST
    kind: protocol
    statement: All patterns MUST have corresponding use-case class in USE_CASE_MAP
    relationships:
    - rel_type: derives_from
      spec_id: DR-02-002
  - id: SE-05-003
    priority: MUST
    kind: protocol
    statement: All patterns MUST have unit test coverage
  - id: SE-05-004
    priority: SHOULD
    kind: protocol
    statement: >-
      Pattern matching SHOULD be actor-subtype-aware where the semantics of an activity
      differ based on whether the sender is a `Vendor`, `Coordinator`, `Researcher`, or
      other `CVDRole`. Patterns that match on object type alone (e.g., `InviteActorToCasePattern`)
      without inspecting the sender's role produce a single use-case handler that must
      internally branch; a separate pattern per sender subtype is the preferred decomposition.
    rationale: >-
      Open design question (as of 2026-07): `InviteActorToCasePattern` matches regardless
      of the invitee's role. This is correct for the current single-handler path but will
      need revisiting when role-specific invite acceptance logic is introduced. This entry
      marks the known limitation so it is not rediscovered.
- id: SE-06
  title: Registry Order Enforcement
  specs:
  - id: SE-06-001
    priority: MUST
    kind: project
    statement: >-
      The `ActivityPatternRegistry` MUST include an import-time guard function
      `_validate_registry_order()` that raises `RegistryOrderError` if any registered
      `ActivityPattern` appears in the registry in an order that would cause a more-specific
      pattern to be shadowed by a less-specific one that matches a superset of the same
      activities.
    rationale: >-
      py_trees traverses the registry in insertion order; a less-specific pattern inserted
      before a more-specific one will match first and the specific case is never reached.
      This is a silent correctness bug that manifests only for the specific activity
      combinations the shadowed pattern was meant to handle.
    relationships:
    - rel_type: refines
      spec_id: SE-05-001
  - id: SE-06-002
    priority: MUST
    kind: project
    statement: >-
      `RegistryOrderError` MUST be a named exception class in the semantic extraction
      module. It MUST NOT be raised as a generic `ValueError` or `AssertionError`.
    relationships:
    - rel_type: implements
      spec_id: SE-06-001
  - id: SE-06-003
    priority: MUST
    kind: project
    statement: >-
      The registry order guard MUST have a companion unit test that asserts correct ordering
      is maintained for all registered patterns. The test MUST fail if the guard raises
      `RegistryOrderError` on the current registry.
    relationships:
    - rel_type: implements
      spec_id: SE-06-001
- id: SE-07
  title: Display Metadata
  specs:
  - id: SE-07-001
    priority: MUST
    kind: project
    statement: >-
      Every `SemanticEntry` in `SEMANTIC_REGISTRY` MUST carry a non-empty `phrase: str`
      field containing an active-voice format-string template suitable for human-readable
      event summaries (e.g. `"{actor} submitted report {object}"`).
    rationale: >-
      A mandatory phrase field ensures every registered semantic is self-documenting and
      prevents silent drift between the registry and display-layer phrase tables (see
      CONCERN-1675). Making the field mandatory at the dataclass level means a missing
      phrase is a construction-time error, not a runtime rendering gap.
  - id: SE-07-002
    priority: MUST
    kind: project
    statement: >-
      Phrase templates MUST use named slots drawn from the set `{actor}`, `{object}`,
      `{target}`, `{context}`, `{origin}`, `{inner_object}`. Slot names MUST be
      human-facing role identifiers, not Python field names from `VultronEvent`.
    rationale: >-
      **Runtime population note (CONCERN-1898)**: The current render pipeline
      (`CaseTimelineEvent.summary`, `event_phrase()`) only populates `{actor}`,
      `{object}`, and `{target}`. The slots `{context}`, `{origin}`, and
      `{inner_object}` are reserved for future pipeline extensions but are never
      populated today. A phrase referencing an unpopulated slot will render with a
      dangling `"—"` fallback. SE-07-005 pins this invariant with an allowlist test.
    relationships:
    - rel_type: refines
      spec_id: SE-07-001
  - id: SE-07-003
    priority: MUST
    kind: project
    statement: >-
      The `SemanticEntry` dataclass `phrase` field MUST have no default value so
      that omitting it is a construction-time `TypeError`, not a silent empty string.
    relationships:
    - rel_type: implements
      spec_id: SE-07-001
  - id: SE-07-004
    priority: MUST
    kind: project
    statement: >-
      A parametrized unit test MUST assert that every entry in `SEMANTIC_REGISTRY`
      has a non-empty `phrase` and that calling `entry.phrase.format_map(d)` with a
      `defaultdict(lambda: "X")` returns a non-empty string without raising a
      `KeyError`.
    relationships:
    - rel_type: verifies
      spec_id: SE-07-001
  - id: SE-07-005
    priority: MUST
    kind: project
    statement: >-
      A unit test MUST assert that no phrase in `SEMANTIC_REGISTRY` references a
      slot name outside the set currently populated by the runtime render pipeline
      (`{actor}`, `{object}`, `{target}`). This test MUST fail if a phrase is added
      that uses `{context}`, `{origin}`, `{inner_object}`, or any other slot name
      not listed here, until the render pipeline is extended to populate that slot.
    rationale: >-
      The `defaultdict`-based SE-07-004 test fills every slot with a placeholder,
      so it cannot detect phrases that reference slots the runtime never fills.
      SE-07-005 adds a structural slot-name check, making unfillable-slot bugs a
      CI failure rather than a silent render defect. Source: CONCERN-1898.
    relationships:
    - rel_type: verifies
      spec_id: SE-07-002
    - rel_type: refines
      spec_id: SE-07-004
  - id: SE-07-006
    priority: MUST
    kind: project
    statement: >-
      Companion behavioural tests MUST call `event_phrase()` and
      `CaseTimelineEvent.summary` with representative `MessageSemantics` values
      covering each distinct slot shape (actor-only, actor+object, actor+target)
      and assert: (1) no trailing `"—"` appears in the rendered output; (2) no
      un-substituted `{slot}` markers remain.
    rationale: >-
      The structural allowlist (SE-07-005) catches phrase definitions that use
      forbidden slot names, but cannot detect a phrase that is structurally valid
      yet still produces a dangling em-dash at render time (e.g. because
      `target_label` did not resolve for a particular event type). The behavioural
      tests close this gap. Source: CONCERN-1898.
    relationships:
    - rel_type: verifies
      spec_id: SE-07-002
    - rel_type: refines
      spec_id: SE-07-005
- id: SE-08
  title: Target-Field Discriminators
  specs:
  - id: SE-08-001
    priority: MUST
    kind: protocol
    statement: >-
      When two or more `ActivityPattern` entries share the same `activity_` type AND
      `object_` type, the more-specific pattern MUST include an additional discriminator
      field (e.g. `target_`, `context_`) that unambiguously distinguishes it from the
      less-specific pattern. The more-specific pattern MUST appear before the less-specific
      one in `SEMANTIC_REGISTRY`.
    rationale: >-
      `OFFER_CASE_MANAGER_ROLE` and `OFFER_CASE_OWNERSHIP_TRANSFER` both match
      `Offer(VulnerabilityCase)`. `OFFER_CASE_MANAGER_ROLE` is disambiguated by the
      presence of `target=CaseParticipant`. If the more-specific entry appeared after the
      less-specific one, every case-manager delegation offer would be silently misrouted
      as an ownership transfer. `_validate_registry_order()` enforces this at import time.
    relationships:
    - rel_type: refines
      spec_id: SE-03-002
  - id: SE-08-002
    priority: MUST
    kind: protocol
    statement: >-
      A wire activity class whose semantic identity depends on a target-field discriminator
      MUST declare that target field as required (not optional) so that a sender omitting it
      produces a validation error rather than a silently misrouted activity.
    rationale: >-
      `_OfferCaseManagerRoleActivity.target` is `as_CaseParticipant` (required). This ensures
      that any attempt to construct the activity without the discriminator field fails fast at
      the sending side rather than reaching the receiver's registry as an ambiguous shape.
    relationships:
    - rel_type: refines
      spec_id: SE-08-001
  - id: SE-08-003
    priority: SHOULD
    kind: protocol
    statement: >-
      When two semantics share `Offer(VulnerabilityCase)` and are discriminated only by a
      target-field value, a dedicated wire object type (e.g. `as_CaseParticipantRole`)
      SHOULD be preferred over target-field discrimination so that the wire shape is
      unambiguously self-describing without depending on registry ordering.
    rationale: >-
      Target-field discrimination is a latent correctness risk: a minimally-conformant or
      buggy sender omitting the target will be silently misrouted. A distinct object type
      eliminates this risk structurally and makes the wire format self-describing.
      See also `notes/activitystreams-state-update.md` § "Target-Field Discriminators".
    relationships:
    - rel_type: refines
      spec_id: SE-08-001
  - id: SE-08-004
    priority: MUST
    kind: protocol
    deprecated: true
    statement: >-
      The `OFFER_CASE_MANAGER_ROLE` semantic and its wire format
      `Offer(VulnerabilityCase, target=CaseParticipant)` are **deprecated** in favour of
      `OFFER_CASE_PARTICIPANT_ROLE` (`Offer(CaseParticipantRole, target=Actor,
      context=VulnerabilityCase)`) introduced by ADR-0039. New senders MUST emit the
      `OFFER_CASE_PARTICIPANT_ROLE` wire format. Receivers MUST continue to handle
      `OFFER_CASE_MANAGER_ROLE` traffic for interoperability with pre-ADR-0039 actors.
    rationale: >-
      ADR-0039 resolves the wire ambiguity identified in CONCERN-1674 by introducing a
      self-describing `as_CaseParticipantRole` object type, eliminating reliance on the
      target-field discriminator that SE-08-001 through SE-08-003 document.
      `OFFER_CASE_MANAGER_ROLE` is retained in the registry as a fallback-only entry
      that appears after `OFFER_CASE_PARTICIPANT_ROLE` (SE-08-001).
    relationships:
    - rel_type: refines
      spec_id: SE-08-003
