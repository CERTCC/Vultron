id: EMB
title: Embargo Management Behavioral Requirements
description: >-
  Event-Condition-Action behavioral requirements for Embargo Management (EM). Each group
  is triggered by either a received EM message or a local EM state transition, and
  specifies typed preconditions, ordered steps, and postconditions that implementations
  must satisfy.
version: 0.3.0
tags:
- behavioral
- state-machine
- protocol
scope:
- prototype
- production
groups:
- id: EMB-01
  title: Receive EP (Embargo Proposed)
  description: Behaviors triggered when a participant receives an EP (Embargo Proposed) message, transitioning EM state to Proposed and acknowledging receipt.
  trigger:
    type: message_received
    value: EP
  specs:
  - id: EMB-01-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM None (q^em ∈ N) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EP MUST transition their EM state to Proposed
      (q^em N → P) and emit EK to acknowledge receipt.
    rationale: >-
      EP is the EM message that initiates embargo negotiation. When no embargo
      exists and the case is still pre-public, the receiver transitions to
      Proposed to signal they are evaluating the proposal.
    testable: true
    preconditions:
    - em_state:
        - NONE
      cs_pattern: "...pxa"
      description: EM state is None; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from NONE to PROPOSED
      expected: Receiver EM state is PROPOSED
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of EP
      expected: EK queued for sender
    postconditions:
    - description: Receiver EM state is PROPOSED; EK emitted to sender
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'

  - id: EMB-01-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant MUST NOT accept a new embargo proposal (process EP) when
      information about the vulnerability is public (q^cs ∈ ···P··), exploit
      is public (q^cs ∈ ····X·), or attacks have been observed (q^cs ∈ ·····A).
      The Participant MUST respond with ER to reject the proposal.
    rationale: >-
      Embargo negotiation is not viable once public disclosure has occurred.
      VP-06-001 and VP-11-001 prohibit new embargo negotiations in these states.
      ER signals the rejection to the proposer so they can update their own EM
      state.
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    - cs_pattern: "....X."
      description: CS matches pattern ....X.
    - cs_pattern: ".....A"
      description: CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Emit ER to reject the embargo proposal
      expected: >-
        ER queued for sender; receiver EM state returns to NONE if previously
        PROPOSED
    postconditions:
    - description: ER emitted; no EM state transition to PROPOSED
    relationships:
    - rel_type: satisfies
      spec_id: VP-06-001
      note: MUST NOT propose or accept embargo when public/exploit/attacks
    - rel_type: satisfies
      spec_id: VP-11-001
      note: >-
        SHALL NOT negotiate embargoes where vulnerability or exploit is public
        or attacks occurred
    - rel_type: satisfies
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'

  - id: EMB-01-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant already in EM Proposed (q^em ∈ P) with CS not yet
      public/exploit/attack (q^cs ∈ ···pxa) receiving a second or counter EP
      MUST emit EK to acknowledge and MAY evaluate the counter-proposal terms
      without an additional state transition.
    rationale: >-
      Multiple EP messages can arrive during negotiation. When already in
      Proposed, no additional state transition is needed. The receiver evaluates
      the counter-proposal and may accept, counter, or reject via EA, EV, or ER.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      cs_pattern: "...pxa"
      description: EM state is Proposed; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Emit EK to acknowledge receipt of counter-proposal EP
      expected: EK queued for sender; EM state remains PROPOSED
    postconditions:
    - description: >-
        EK emitted; EM state remains PROPOSED; counter-proposal terms available
        for evaluation
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'

  - id: EMB-01-004
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in RM Invalid (q^rm ∈ I) SHOULD NOT propose or accept an
      embargo when receiving EP.
    rationale: >-
      VP-13-003 discourages starting embargo management from an Invalid RM state.
      The report has been assessed as invalid; committing to embargo terms under
      those conditions is premature and likely to be wasted effort.
    testable: true
    preconditions:
    - rm_state:
        - INVALID
      description: Participant is in RM Invalid
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-003
      note: >-
        SHOULD NOT begin EM with a proposal from a Participant in RM Invalid
    - rel_type: satisfies
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'

  - id: EMB-01-005
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in an inactive RM state (q^rm ∈ {D, C}) SHOULD NOT begin
      embargo management by accepting an incoming EP.
    rationale: >-
      VP-13-002 discourages starting embargo management in inactive RM states.
      Deferred or Closed cases indicate the participant has deprioritized or
      completed their engagement; starting embargo negotiation in these states
      is unlikely to lead to productive coordinated disclosure.
    testable: true
    preconditions:
    - rm_state:
        - DEFERRED
        - CLOSED
      description: Participant is in RM Deferred/Closed
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-002
      note: SHOULD NOT begin EM in an inactive RM state
    - rel_type: satisfies
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'

- id: EMB-02
  title: Receive EA (Embargo Accepted)
  description: Behaviors triggered when a participant receives an EA (Embargo Accepted) message, transitioning EM state to Active and acknowledging receipt.
  trigger:
    type: message_received
    value: EA
  specs:
  - id: EMB-02-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Proposed (q^em ∈ P) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EA MUST transition their EM state to Active
      (q^em P → A) and emit EK to acknowledge receipt.
    rationale: >-
      EA is the message that moves a negotiated embargo from Proposed to Active.
      The receiver records that the embargo is now in effect.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      cs_pattern: "...pxa"
      description: EM state is Proposed; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from PROPOSED to ACTIVE
      expected: Receiver EM state is ACTIVE
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of EA
      expected: EK queued for sender
    postconditions:
    - description: Receiver EM state is ACTIVE; EK emitted to sender
    relationships:
    - rel_type: satisfies
      spec_id: VP-05-003
      note: An embargo SHALL begin at the moment it is accepted
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-002
      note: 'EA shorthand wire-type mapping'

  - id: EMB-02-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant MUST NOT process EA to transition EM to Active when the case
      is already public (q^cs ∈ ···P··), exploit is public (q^cs ∈ ····X·), or
      attacks have been observed (q^cs ∈ ·····A). The Participant MUST instead
      emit ER to signal the embargo is not viable.
    rationale: >-
      VP-06-001 prohibits accepting embargoes once public disclosure has occurred.
      VP-13-004 adds that EM SHOULD NOT proceed from Proposed to Active when RM
      is Invalid or Closed, but the public/exploit/attack constraint is absolute.
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    - cs_pattern: "....X."
      description: CS matches pattern ....X.
    - cs_pattern: ".....A"
      description: CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Emit ER to reject the acceptance (embargo not viable)
      expected: ER queued for sender; EM state transitions toward NONE
    postconditions:
    - description: ER emitted; EM state not transitioned to ACTIVE
    relationships:
    - rel_type: satisfies
      spec_id: VP-06-001
      note: MUST NOT accept a new embargo when public/exploit/attacks
    - rel_type: satisfies
      spec_id: VP-11-001
      note: SHALL NOT negotiate embargoes where vulnerability or exploit is public
    - rel_type: satisfies
      spec_id: MSM-02-002
      note: 'EA shorthand wire-type mapping'

  - id: EMB-02-003
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in RM Invalid or Closed (q^rm ∈ {I, C}) SHOULD NOT allow
      EM to proceed from Proposed to Active upon receiving EA.
    rationale: >-
      VP-13-004 discourages proceeding to Active when the report has been
      assessed as invalid or closed. The embargo would apply to a case the
      participant is not actively working.
    testable: true
    preconditions:
    - rm_state:
        - INVALID
        - CLOSED
      description: Participant is in RM Invalid/Closed
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-004
      note: >-
        SHOULD NOT proceed from EM Proposed to EM Accepted when RM is Invalid
        or Closed
    - rel_type: satisfies
      spec_id: MSM-02-002
      note: 'EA shorthand wire-type mapping'

- id: EMB-03
  title: Receive EV (Embargo Revision Proposed)
  description: Behaviors triggered when a participant receives an EV (Embargo Revision Proposed) message while an embargo is active, transitioning EM state to Revise and acknowledging receipt.
  trigger:
    type: message_received
    value: EV
  specs:
  - id: EMB-03-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Active (q^em ∈ A) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EV MUST transition their EM state to Revise
      (q^em A → R) and emit EK to acknowledge receipt.
    rationale: >-
      EV signals a proposal to revise an active embargo's terms. The receiver
      enters Revise state to indicate a pending revision. The original embargo
      remains in force during revision per VP-04-005.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      cs_pattern: "...pxa"
      description: EM state is Active; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from ACTIVE to REVISE
      expected: Receiver EM state is REVISE
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of EV
      expected: EK queued for sender
    postconditions:
    - description: >-
        Receiver EM state is REVISE; original embargo remains in force; EK
        emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-04-005
      note: Once accepted, revisions MAY be proposed
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-003
      note: 'EV shorthand wire-type mapping'

  - id: EMB-03-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant already in EM Revise (q^em ∈ R) with CS not yet
      public/exploit/attack (q^cs ∈ ···pxa) receiving a counter EV
      (counter-revision) MUST emit EK to acknowledge without an additional
      state transition.
    rationale: >-
      Multiple revision proposals can arrive. When already in Revise, no further
      state transition is needed; the receiver evaluates the counter-revision
      and responds with EJ or EC.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Emit EK to acknowledge counter-revision EV
      expected: EK queued for sender; EM state remains REVISE
    postconditions:
    - description: EK emitted; EM state remains REVISE
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-003
      note: 'EV shorthand wire-type mapping'

  - id: EMB-03-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Active or Revise (q^em ∈ {A, R}) with CS in a
      public/exploit/attack state (q^cs ∉ ···pxa) receiving EV MUST emit ET
      to terminate the embargo immediately.
    rationale: >-
      Revision negotiation is not viable once public disclosure has occurred.
      VP-11-001 and VP-11-002 require termination in these states; receiving a
      revision proposal while in a terminal CS state triggers immediate embargo
      exit.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: "...P.."
      description: EM state is Active or Revise; CS matches pattern ...P..
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: "....X."
      description: EM state is Active or Revise; CS matches pattern ....X.
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: ".....A"
      description: EM state is Active or Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Emit ET to terminate the embargo immediately
      expected: ET queued for participants; EM transitions to EXITED
    postconditions:
    - description: ET emitted; EM state is EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-002
      note: SHALL terminate embargo when public/exploit
    - rel_type: satisfies
      spec_id: MSM-02-003
      note: 'EV shorthand wire-type mapping'

- id: EMB-04
  title: Receive EJ (Embargo Revision Rejected)
  description: Behaviors triggered when a participant receives an EJ (Embargo Revision Rejected) message, reverting EM state from Revise to Active and acknowledging receipt.
  trigger:
    type: message_received
    value: EJ
  specs:
  - id: EMB-04-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Revise (q^em ∈ R) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EJ MUST transition their EM state back to Active
      (q^em R → A) and emit EK to acknowledge receipt.
    rationale: >-
      EJ signals that a revision proposal has been rejected and the embargo
      reverts to its previous Active terms. The receiver restores the
      pre-revision state.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from REVISE back to ACTIVE
      expected: Receiver EM state is ACTIVE
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of EJ
      expected: EK queued for sender
    postconditions:
    - description: Receiver EM state is ACTIVE (revision rejected); EK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-004
      note: 'EJ shorthand wire-type mapping'

  - id: EMB-04-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Revise (q^em ∈ R) with CS in a public/exploit/attack
      state (q^cs ∉ ···pxa) receiving EJ MUST emit ET to terminate the embargo
      immediately rather than reverting to Active.
    rationale: >-
      Reverting to Active is not viable once public disclosure has occurred.
      VP-11-002 requires termination in these states. Embargo termination takes
      precedence over the revision rejection.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...P.."
      description: EM state is Revise; CS matches pattern ...P..
    - em_state:
        - REVISE
      cs_pattern: "....X."
      description: EM state is Revise; CS matches pattern ....X.
    - em_state:
        - REVISE
      cs_pattern: ".....A"
      description: EM state is Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Emit ET to terminate the embargo immediately
      expected: ET queued for participants; EM transitions to EXITED
    postconditions:
    - description: ET emitted; EM state is EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-002
      note: SHALL terminate embargo when public/exploit
    - rel_type: satisfies
      spec_id: MSM-02-004
      note: 'EJ shorthand wire-type mapping'

- id: EMB-05
  title: Receive EC (Embargo Revision Accepted)
  description: Behaviors triggered when a participant receives an EC (Embargo Revision Accepted) message, advancing EM state from Revise back to Active with updated terms and acknowledging receipt.
  trigger:
    type: message_received
    value: EC
  specs:
  - id: EMB-05-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Revise (q^em ∈ R) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EC MUST transition their EM state back to Active
      (q^em R → A) with the revised terms and emit EK to acknowledge receipt.
    rationale: >-
      EC signals that a revision proposal has been accepted. The embargo returns
      to Active state under the new terms agreed by the revision.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from REVISE to ACTIVE with revised embargo terms
      expected: Receiver EM state is ACTIVE; revised terms recorded
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of EC
      expected: EK queued for sender
    postconditions:
    - description: Receiver EM state is ACTIVE with new terms; EK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-04-005
      note: Once accepted, revisions MAY be accepted
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-005
      note: 'EC shorthand wire-type mapping'

  - id: EMB-05-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Revise (q^em ∈ R) with CS in a public/exploit/attack
      state (q^cs ∉ ···pxa) receiving EC MUST emit ET to terminate the embargo
      rather than accepting the revision.
    rationale: >-
      Accepting a revision is not viable once public disclosure has occurred.
      VP-11-002 requires termination in these states.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...P.."
      description: EM state is Revise; CS matches pattern ...P..
    - em_state:
        - REVISE
      cs_pattern: "....X."
      description: EM state is Revise; CS matches pattern ....X.
    - em_state:
        - REVISE
      cs_pattern: ".....A"
      description: EM state is Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Emit ET to terminate the embargo immediately
      expected: ET queued for participants; EM transitions to EXITED
    postconditions:
    - description: ET emitted; EM state is EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-002
      note: SHALL terminate embargo when public/exploit
    - rel_type: satisfies
      spec_id: MSM-02-005
      note: 'EC shorthand wire-type mapping'

- id: EMB-06
  title: Receive ER (Embargo Rejected)
  description: Behaviors triggered when a participant receives an ER (Embargo Rejected) message, transitioning EM state from Proposed to None and acknowledging receipt.
  trigger:
    type: message_received
    value: ER
  specs:
  - id: EMB-06-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Proposed (q^em ∈ P) receiving ER MUST transition their
      EM state back to None (q^em P → N) and emit EK to acknowledge receipt.
    rationale: >-
      ER signals that a proposed embargo has been rejected. The embargo returns
      to None state (no embargo in effect). The EK acknowledges the rejection.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      description: EM state is Proposed
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from PROPOSED to NONE
      expected: Receiver EM state is NONE
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of ER
      expected: EK queued for sender
    postconditions:
    - description: Receiver EM state is NONE (proposal rejected); EK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: VP-05-017
      note: Participants MAY reject proposed embargo terms for any reason
    - rel_type: satisfies
      spec_id: MSM-02-006
      note: 'ER shorthand wire-type mapping'

- id: EMB-07
  title: Receive ET (Embargo Terminated)
  description: Behaviors triggered when a participant receives an ET (Embargo Terminated) message, transitioning EM state to Terminated and acknowledging receipt.
  trigger:
    type: message_received
    value: ET
  specs:
  - id: EMB-07-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Active (q^em ∈ A) receiving ET MUST transition their
      EM state to Exited (q^em A → X) and emit EK to acknowledge receipt.
    rationale: >-
      ET is the message that terminates an active embargo. The receiver records
      that the embargo has ended. ET has immediate effect regardless of other
      pending messages.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from ACTIVE to EXITED
      expected: Receiver EM state is EXITED
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of ET
      expected: EK queued for sender
    postconditions:
    - description: Receiver EM state is EXITED; EK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-007
      note: 'ET shorthand wire-type mapping'

  - id: EMB-07-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Revise (q^em ∈ R) receiving ET MUST transition their
      EM state to Exited (q^em R → X) and emit EK to acknowledge receipt.
    rationale: >-
      ET terminates the embargo regardless of whether a revision is pending.
      The revision proposal is abandoned upon termination.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      description: EM state is Revise
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from REVISE to EXITED
      expected: Receiver EM state is EXITED
    - order: 2
      actor: receiver
      action: Emit EK to acknowledge receipt of ET
      expected: EK queued for sender
    postconditions:
    - description: >-
        Receiver EM state is EXITED; pending revision abandoned; EK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-007
      note: 'ET shorthand wire-type mapping'

  - id: EMB-07-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant already in EM Exited (q^em ∈ X) receiving ET MUST emit EK
      without any state transition.
    rationale: >-
      Exited is already the terminal state. The EK acknowledges the duplicate
      termination message; no additional transition is needed.
    testable: true
    preconditions:
    - em_state:
        - EXITED
      description: EM state is Exited
    steps:
    - order: 1
      actor: receiver
      action: Emit EK to acknowledge receipt of ET (no state change)
      expected: EK queued for sender; EM state remains EXITED
    postconditions:
    - description: EK emitted; EM state remains EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: SHOULD send EK in acknowledgment of any E* message except EK itself
    - rel_type: satisfies
      spec_id: MSM-02-007
      note: 'ET shorthand wire-type mapping'

- id: EMB-08
  title: Receive EE (Embargo Error)
  description: Behaviors triggered when a participant receives an EE (Embargo Management Error) signal, which has no dedicated semantic dispatch value and is handled outside the standard AS2 pattern-matching pipeline.
  trigger:
    type: message_received
    value: EE
  specs:
  - id: EMB-08-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant receiving EE SHOULD emit EK to acknowledge receipt and SHOULD
      emit GI to inquire about the nature of the error.
    rationale: >-
      EE signals a protocol error in the EM process. Acknowledging with EK and
      following up with GI allows the sender to explain the error and enables
      recovery. EE does not trigger an EM state transition.
    testable: true
    steps:
    - order: 1
      actor: receiver
      action: Emit EK to acknowledge receipt of EE
      expected: EK queued for sender
    - order: 2
      actor: receiver
      action: Emit GI to inquire about the nature of the error
      expected: GI queued for sender
    postconditions:
    - description: EK and GI emitted; EM state unchanged
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-005
      note: >-
        SHOULD acknowledge (EK) and inquire (GI) about the nature of any error
        reported by EE
    - rel_type: satisfies
      spec_id: MSM-02-008
      note: 'EE shorthand wire-type mapping'

- id: EMB-09
  title: Receive EK (Embargo Acknowledgment)
  description: Behaviors triggered when a participant receives an EK (Embargo Management Acknowledgment) passthrough signal, which has no dedicated semantic dispatch value and requires no state transition.
  trigger:
    type: message_received
    value: EK
  specs:
  - id: EMB-09-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant receiving EK MAY process it as a passthrough acknowledgment
      with no state transition and no required response.
    rationale: >-
      EK is a pure acknowledgment message. It confirms the sender received a
      prior E* message. No state change or response is required from the
      receiver.
    testable: false
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-11-004
      note: EK is the acknowledgment; no acknowledgment of acknowledgment required
    - rel_type: satisfies
      spec_id: MSM-02-009
      note: 'EK shorthand wire-type mapping'

- id: EMB-10
  title: Enter EM Proposed
  trigger:
    type: state_entered
    value: EM.PROPOSED
  specs:
  - id: EMB-10-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant entering EM Proposed MAY evaluate the proposed terms and
      respond with EA (accept), EV (counter-propose a revision), or ER (reject).
    rationale: >-
      EM Proposed marks that embargo negotiation is underway. The participant
      must evaluate the proposal and eventually accept, counter, or reject to
      move the EM process forward.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - PROPOSED
      description: EM state is Proposed
    relationships:
    - rel_type: satisfies
      spec_id: VP-04-004
      note: Once proposed, an embargo MAY be accepted or rejected
    - rel_type: satisfies
      spec_id: VP-06-003
      note: Receivers SHOULD accept any embargo proposed by Reporters
    - rel_type: satisfies
      spec_id: VP-06-010
      note: Participants MAY accept or reject any proposed embargo as they see fit

  - id: EMB-10-002
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in RM Invalid or Deferred or Closed (q^rm ∈ {I, D, C})
      SHOULD NOT begin or continue embargo negotiations while in those inactive
      RM states.
    rationale: >-
      VP-13-002 and VP-13-003 discourage starting EM in inactive RM states.
      An embargo proposed while a report is invalid or deferred is unlikely to
      result in productive coordination.
    testable: true
    preconditions:
    - rm_state:
        - INVALID
        - DEFERRED
        - CLOSED
      description: Participant is in RM Invalid/Deferred/Closed
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-002
      note: SHOULD NOT begin EM in an inactive RM state
    - rel_type: satisfies
      spec_id: VP-13-003
      note: SHOULD NOT begin EM with a proposal from a Participant in RM Invalid

- id: EMB-11
  title: Enter EM Active
  trigger:
    type: state_entered
    value: EM.ACTIVE
  specs:
  - id: EMB-11-001
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in EM Active SHOULD NOT share the vulnerability report with
      a newly invited Participant until that Participant has accepted the existing
      embargo terms.
    rationale: >-
      VP-08-006 prohibits sharing the vulnerability report with new Participants
      who have not yet accepted an existing embargo. Sharing before acceptance
      undermines the embargo's confidentiality guarantees.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-08-006
      note: >-
        SHOULD NOT share vulnerability report with newly invited Participant
        unless they accepted the embargo

  - id: EMB-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering EM Active SHOULD maintain the embargo by not
      publishing information about the vulnerability until the embargo expires
      or is terminated.
    rationale: >-
      VP-05-014 specifies that Participants SHOULD NOT publish information about
      the vulnerability when there is an active embargo. Entering Active marks
      the formal commitment to these terms.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    relationships:
    - rel_type: satisfies
      spec_id: VP-05-014
      note: SHOULD NOT publish information when there is an active embargo

  - id: EMB-11-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant in RM Closed or Deferred (q^rm ∈ {C, D}) in EM Active
      while other Participants remain engaged MUST NOT automatically terminate
      the embargo due to their own RM closure or deferral.
    rationale: >-
      VP-13-009 explicitly requires that a single Participant's closure or
      deferral SHALL NOT automatically terminate the embargo. The embargo
      persists as long as other Participants remain engaged and the EM process
      is Active.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      rm_state:
        - CLOSED
        - DEFERRED
      description: Participant is in RM Closed/Deferred; EM state is Active
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-009
      note: >-
        A Participant's closure or deferral SHALL NOT automatically terminate
        the embargo

  - id: EMB-11-004
    priority: SHOULD
    kind: protocol
    statement: >-
      Reports with no further tasks (q^rm ∈ {D, I}) SHOULD be held in Deferred
      or Invalid while the embargo remains Active or Revise (q^em ∈ {A, R})
      rather than being closed.
    rationale: >-
      VP-13-006 advises keeping the report in a non-terminal RM state until the
      embargo has exited. Closing early may prematurely signal disengagement
      from the coordinated timeline.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      rm_state:
        - DEFERRED
        - INVALID
      description: Participant is in RM Deferred/Invalid; EM state is Active or Revise
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-006
      note: SHOULD be held in Deferred or Invalid until embargo exits

  - id: EMB-11-005
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant who intends to change their adherence stance to an active
      embargo SHOULD communicate that intent clearly to other Participants.
    rationale: >-
      VP-13-008 requires communicating changes to embargo adherence. Surprises
      about who is or is not honoring the embargo undermine coordinated
      disclosure.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-008
      note: Changes to adherence intention SHOULD be communicated clearly

- id: EMB-12
  title: Enter EM Revise
  trigger:
    type: state_entered
    value: EM.REVISE
  specs:
  - id: EMB-12-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant entering EM Revise MAY evaluate the revision proposal and
      respond with EC (accept the revision), EJ (reject the revision), or EV
      (counter-propose a further revision).
    rationale: >-
      EM Revise means an active embargo has a pending revision proposal. The
      participant must evaluate the proposed new terms and either accept, reject,
      or counter-propose to move the EM process forward.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - REVISE
      description: EM state is Revise
    relationships:
    - rel_type: satisfies
      spec_id: VP-04-005
      note: Once accepted, revisions MAY be proposed, which MAY be accepted or rejected

  - id: EMB-12-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant in RM Closed or Deferred (q^rm ∈ {C, D}) in EM Revise
      while other Participants remain engaged MUST NOT automatically terminate
      the embargo due to their own RM state.
    rationale: >-
      VP-13-009 applies equally in Revise state. A single Participant's closure
      or deferral SHALL NOT automatically terminate the embargo. The embargo
      remains in force even when one Participant's engagement has declined.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      rm_state:
        - CLOSED
        - DEFERRED
      description: Participant is in RM Closed/Deferred; EM state is Revise
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-009
      note: >-
        A Participant's closure or deferral SHALL NOT automatically terminate
        the embargo

  - id: EMB-12-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant who intends to change their adherence stance while an embargo
      is in Revise state SHOULD communicate that intent clearly to other
      Participants.
    rationale: >-
      VP-13-008 requires communicating changes to embargo adherence. This applies
      during revision negotiations as well as during the stable Active state.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - REVISE
      description: EM state is Revise
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-008
      note: Changes to adherence intention SHOULD be communicated clearly

- id: EMB-13
  title: Enter EM Exited
  trigger:
    type: state_entered
    value: EM.EXITED
  specs:
  - id: EMB-13-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering EM Exited SHOULD reset all Participant embargo
      consent states to reflect that the embargo has ended.
    rationale: >-
      Once the embargo exits, each Participant's consent status should be
      cleared to a neutral terminal state so that future embargo negotiations
      for this case (if any) start from a clean baseline.
    testable: true
    preconditions:
    - em_state:
        - EXITED
      description: EM state is Exited
    steps:
    - order: 1
      actor: participant
      action: >-
        Reset all Participant embargo consent states to the post-exit terminal
        state
      expected: All Participant embargo consent states reflect embargo termination
    postconditions:
    - description: Embargo consent states reset; EM state is terminal EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-04-001
      note: Accepted embargoes MUST eventually terminate

  - id: EMB-13-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant in EM Exited MUST NOT seek new embargoes or accept new
      embargo proposals (EP) for this case when the CS state is public
      (q^cs ∈ ···P··), exploit-public (q^cs ∈ ····X·), or attacks-observed
      (q^cs ∈ ·····A).
    rationale: >-
      VP-14-001 through VP-14-003 prohibit seeking new embargoes once public
      disclosure, exploit publication, or attacks have occurred. The EXITED state
      after any of these events is terminal for embargo negotiations on this case.
    testable: true
    preconditions:
    - em_state:
        - EXITED
      cs_pattern: "...P.."
      description: EM state is Exited; CS matches pattern ...P..
    - em_state:
        - EXITED
      cs_pattern: "....X."
      description: EM state is Exited; CS matches pattern ....X.
    - em_state:
        - EXITED
      cs_pattern: ".....A"
      description: EM state is Exited; CS matches pattern .....A
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-001
      note: Once Public Awareness, new embargoes SHALL NOT be sought
    - rel_type: satisfies
      spec_id: VP-14-002
      note: Once Exploit Publication, new embargoes SHALL NOT be sought
    - rel_type: satisfies
      spec_id: VP-14-003
      note: Once Attacks observed, new embargoes SHALL NOT be sought

- id: EMB-14
  title: Actor-Voluntary Embargo Termination (Trigger Side)
  trigger:
    type: state_entered
    value: EM.ACTIVE
  specs:
  - id: EMB-14-001
    priority: MUST
    kind: protocol
    statement: >-
      The create_terminate_active_embargo_tree factory MUST require the actor
      to supply a termination reason before delegating to terminate_embargo_bt.
      Valid reasons are: fix-deployed, fix-ready, or other. The reason is
      recorded via the matching Evaluator call-out point (ExitEmbargoWhenDeployed,
      ExitEmbargoWhenFixReady, or ExitEmbargoForOtherReason).
    rationale: >-
      Voluntary termination requires an auditable reason. Structuring reason
      selection as a Selector of Evaluator call-out points gives actors a
      clear interface (three buttons) while preserving the audit trail and
      allowing policy-rule backends to be injected per ADR-0025.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise
    steps:
    - order: 1
      actor: actor
      action: Select termination reason (ExitEmbargoWhenDeployed,
        ExitEmbargoWhenFixReady, or ExitEmbargoForOtherReason)
      expected: Matching Evaluator call-out point returns SUCCESS; reason recorded
    - order: 2
      actor: system
      action: Run EmbargoExitPolicyGuard or EmbargoExitOverride
      expected: Policy check passes or actor override accepted
    - order: 3
      actor: system
      action: Run OnEmbargoExit actuator
      expected: Site-specific integration hooks execute
    - order: 4
      actor: system
      action: Delegate to terminate_embargo_bt
      expected: ET emitted; EM transitions to EXITED
    postconditions:
    - description: EM state is EXITED; ET queued; termination reason recorded
    relationships:
    - rel_type: refines
      spec_id: EMB-07-001
      note: Voluntary actor termination is a sub-case of active-embargo termination

  - id: EMB-14-002
    priority: MUST
    kind: protocol
    statement: >-
      The create_terminate_active_embargo_tree factory MUST include an
      EmbargoExitPolicyGuard Evaluator call-out point that runs after the
      reason Selector and before OnEmbargoExit. The guard MAY veto termination
      regardless of the chosen reason.
    rationale: >-
      Separating the reason selection (actor intent) from the policy check
      (system authorization) allows external policy engines to block termination
      on grounds orthogonal to the stated reason (e.g., active revision
      negotiation, pending approvals) without coupling the guard logic to the
      reason semantics.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; reason Selector has succeeded
    steps:
    - order: 1
      actor: system
      action: Run EmbargoExitPolicyGuard call-out point
      expected: Returns SUCCESS (policy permits) or FAILURE (policy vetoes)
    postconditions:
    - description: >-
        SUCCESS: pipeline continues to OnEmbargoExit and terminate_embargo_bt.
        FAILURE: termination blocked; actor may retry with override.
    relationships:
    - rel_type: refines
      spec_id: EMB-14-001

  - id: EMB-14-003
    priority: SHOULD
    kind: protocol
    statement: >-
      The create_terminate_active_embargo_tree factory SHOULD include an
      EmbargoExitOverride Evaluator call-out point in a Selector alongside
      EmbargoExitPolicyGuard. When the actor explicitly accepts responsibility
      for overriding policy, EmbargoExitOverride SHOULD return SUCCESS so that
      termination proceeds despite a policy veto.
    rationale: >-
      Providing an override seam lets actors exercise their authority to exit
      in exceptional circumstances without requiring code changes. The override
      is a distinct call-out point so that integrators can log, gate, or audit
      it separately from the normal policy path.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      description: >-
        EM state is Active or Revise; reason Selector succeeded;
        EmbargoExitPolicyGuard returned FAILURE
    steps:
    - order: 1
      actor: actor
      action: Invoke EmbargoExitOverride call-out point
      expected: Override accepted; pipeline continues to OnEmbargoExit
    postconditions:
    - description: Override recorded; termination proceeds; audit trail reflects override
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: EMB-14-002
      note: Override is the fallback arm of the policy authorization Selector

- id: EMB-15
  title: Inbound Embargo-Response Decision (Received Side)
  description: >-
    Behaviors triggered when an actor receives an inbound embargo overture and
    must decide how to respond. Two overture flows are distinguished: (Flow A)
    an EM-level embargo proposal (EP) proposing terms, whose acceptance moves
    the shared EM state; and (Flow B) a PEC-level invitation
    (InviteToEmbargoOnCase) asking the actor to become a signatory to an
    embargo, whose acceptance advances that participant's Participant Embargo
    Consent (PEC) state. The pre-PEC simulator conflated these into a single
    _ChooseEmProposedResponse fallback; the production protocol separates the
    shared EM lifecycle (EMB-01..EMB-09) from per-participant consent (CM-18,
    ADR-0048). This group specifies a single decision seam layered over both
    flows: it selects the response (accept / defer-to-owner / reject / counter)
    while delegating the mechanical transition to the existing received and
    trigger BTs. The mechanics already exist (invite/accept/reject trees,
    propose/accept/reject trigger use cases); what is missing is the decision
    layer that chooses among them, with a default-accept policy and a
    plug-in seam for owner adjudication.
  trigger:
    type: message_received
    value: EP | InviteToEmbargoOnCase
  specs:
  - id: EMB-15-001
    priority: MUST
    kind: protocol
    statement: >-
      The inbound embargo-response decision seam MUST default to accepting a
      well-formed embargo overture (Flow A: EP proposing terms; Flow B:
      InviteToEmbargoOnCase). When no external adjudication backend is injected,
      the EvaluateEmbargoProposal Evaluator call-out point MUST return SUCCESS
      so the actor accepts by default, delegating to the existing acceptance
      mechanism (accept_embargo_trigger_bt for Flow A;
      accept_invite_to_embargo_tree for Flow B).
    rationale: >-
      The recommended CVD behavior is to accept an offered embargo and negotiate
      revisions separately rather than block coordination. A deterministic
      accept-by-default keeps actors runnable without a human in the loop, and
      the DETERMINISTIC call-out bundle (BT-23) supplies the default. Structuring
      acceptance as an Evaluator call-out point preserves the seam for later
      owner/agent adjudication without changing the tree.
    testable: true
    preconditions:
    - description: >-
        Inbound EP or InviteToEmbargoOnCase received; case is embargo-eligible
        (CS not public/exploit/attacks per EMB-01-002); no external
        adjudication backend injected (deterministic default in force).
    steps:
    - order: 1
      actor: system
      action: Run EvaluateEmbargoProposal Evaluator call-out point
      expected: Returns SUCCESS (default-accept) under the DETERMINISTIC bundle
    - order: 2
      actor: system
      action: Delegate to the flow-appropriate acceptance BT
      expected: >-
        Flow A activates/records via accept_embargo_trigger_bt; Flow B advances
        PEC to SIGNATORY via accept_invite_to_embargo_tree
    postconditions:
    - description: >-
        Overture accepted by default; EM (Flow A) or PEC (Flow B) advanced by
        the existing mechanism
    relationships:
    - rel_type: satisfies
      spec_id: BT-18-004
      note: Decision node accepts a CallOutBackendFactory; deterministic default
    - rel_type: refines
      spec_id: EMB-01-001
      note: Adds the response-decision layer above EP receipt
    - rel_type: refines
      spec_id: CM-18-003
      note: Flow B acceptance advances the PEC state machine (INVITED → SIGNATORY)

  - id: EMB-15-002
    priority: MUST
    kind: protocol
    statement: >-
      The decision seam MUST include a CASE_OWNER hard-bypass arm ahead of the
      adjudication call-out point: when the deciding actor holds
      CVDRole.CASE_OWNER, the owner's stated response is authoritative and the
      seam MUST NOT require external approval. Non-owner actors (e.g. a CaseActor
      processing an overture on the owner's behalf) MUST route through the
      CaseOwnerApprovesEmbargoResponse call-out point, which defaults to SUCCESS
      under the DETERMINISTIC bundle.
    rationale: >-
      This mirrors the two-seam authorization model (ADR-0046) and the
      case_proposal_received_tree pattern: the CASE_OWNER is the human
      decision-maker whose choice is gospel, while other actors need an
      adjudication seam that a UI or LLM agent can later fulfil. The distinction
      matters because a CaseActor may process an overture routed to it without
      being the party whose consent is being recorded.
    testable: true
    preconditions:
    - description: Inbound EP or InviteToEmbargoOnCase received by the deciding actor
    steps:
    - order: 1
      actor: system
      action: Run CheckIsCaseOwner guard (hard-bypass arm of the Selector)
      expected: >-
        SUCCESS when actor holds CASE_OWNER (owner's response is authoritative);
        FAILURE otherwise, falling through to the adjudication call-out point
    - order: 2
      actor: system
      action: >-
        For non-owners, run CaseOwnerApprovesEmbargoResponse call-out point
      expected: Returns SUCCESS (default) or FAILURE (adjudication withholds)
    postconditions:
    - description: >-
        Owner responses proceed unconditionally; non-owner responses gated by
        the adjudication seam
    relationships:
    - rel_type: satisfies
      spec_id: BT-18-004
    - rel_type: refines
      spec_id: EMB-15-001

  - id: EMB-15-003
    priority: SHOULD
    kind: protocol
    statement: >-
      For Flow A (EP proposing terms), the decision seam SHOULD provide a
      counter-proposal arm gated by a WillingToCounterEmbargoProposal Evaluator
      call-out point. Countering MUST NOT introduce a new mechanism: when the
      arm is taken, the seam delegates to the existing embargo proposal trigger
      (propose_embargo_trigger_bt via SvcProposeEmbargoUseCase), which emits a
      fresh EP while the EM state remains PROPOSED. The default DETERMINISTIC
      backend for this call-out point SHOULD return FAILURE (do not counter),
      reflecting the recommended practice of accepting and revising rather than
      countering.
    rationale: >-
      A counter-proposal is operationally identical to proposing: the propose
      trigger already records a "counter-proposed, no state change" outcome when
      invoked in PROPOSED. Modeling counter as routing to the existing trigger
      avoids duplicate mechanism and keeps the EM lifecycle single-sourced.
      Countering is intentionally low-automation and off by default; the
      recommended path is accept-then-revise.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      description: >-
        Flow A only; inbound EP received; actor declined to accept outright and
        the adjudication arm elects to counter
    steps:
    - order: 1
      actor: system
      action: Run WillingToCounterEmbargoProposal Evaluator call-out point
      expected: SUCCESS elects the counter arm; FAILURE (default) skips it
    - order: 2
      actor: actor
      action: Delegate to propose_embargo_trigger_bt with new terms
      expected: New EP emitted; EM remains PROPOSED (counter recorded)
    postconditions:
    - description: >-
        Counter EP emitted via the existing proposal mechanism; no new
        counter-specific transition introduced
    relationships:
    - rel_type: refines
      spec_id: EMB-15-001
    - rel_type: satisfies
      spec_id: EMB-01-001
      note: Counter reuses the EP proposal path

  - id: EMB-15-004
    priority: MUST
    kind: protocol
    statement: >-
      When the decision resolves to reject, the seam MUST delegate to the
      flow-appropriate existing rejection mechanism rather than duplicating the
      transition: reject_embargo_trigger_bt (Flow A, emitting ER and returning
      the shared EM to NONE per EMB-06) or reject_invite_to_embargo_tree
      (Flow B, advancing that participant's PEC to DECLINED per CM-18-003). The
      seam MUST also honor the mandatory rejection required by EMB-01-002 when
      CS is public/exploit/attacks, independent of any adjudication outcome.
    rationale: >-
      Rejection paths are already implemented and carry the correct EM-vs-PEC
      semantics. The decision layer selects among them; it must not re-implement
      the transition. The pre-public constraint (EMB-01-002) is a hard protocol
      rule that overrides the default-accept policy.
    testable: true
    preconditions:
    - description: >-
        Inbound overture received; decision resolves to reject, OR CS is
        public/exploit/attacks forcing rejection (EMB-01-002)
    steps:
    - order: 1
      actor: system
      action: Select the flow-appropriate rejection BT
      expected: >-
        Flow A emits ER (EM → NONE); Flow B advances PEC to DECLINED
    postconditions:
    - description: Overture rejected via the existing mechanism with correct semantics
    relationships:
    - rel_type: refines
      spec_id: EMB-06-001
      note: Flow A rejection reuses the ER emission path
    - rel_type: refines
      spec_id: CM-18-003
      note: Flow B rejection advances PEC to DECLINED
    - rel_type: satisfies
      spec_id: EMB-01-002
      note: Mandatory rejection when public/exploit/attacks overrides default-accept

- id: EMB-16
  title: CS Public/Exploit/Attacks Detected While EM Proposed
  description: >-
    Behaviors required when a Participant detects that the vulnerability has
    become public (q^cs ∈ ···P··), an exploit is available (q^cs ∈ ····X·),
    or attacks have been observed (q^cs ∈ ·····A) while the case EM state is
    still Proposed (q^em ∈ P). Embargo negotiation is not viable in any of
    these states; the proposed embargo MUST be abandoned.
  trigger:
    type: state_entered
    value: CS.public_exploit_attacks
  specs:
  - id: EMB-16-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Proposed (q^em ∈ P) that detects a CS transition into
      a public (q^cs ∈ ···P··), exploit-available (q^cs ∈ ····X·), or
      attacks-observed (q^cs ∈ ·····A) state MUST abandon the proposed embargo
      by transitioning EM from Proposed to None (q^em P → N) and MUST emit ER
      to notify other Participants.
    rationale: >-
      EMB-01-002 establishes that embargo negotiation is not viable once public
      disclosure, exploit availability, or attacks have occurred. EMB-01-002 is
      framed as a guard on receiving EP, but the same viability constraint
      applies when a P/X/A state change arrives while a proposal is already in
      flight. Continuing to negotiate a proposed embargo in these conditions
      would be misleading to other Participants and counter to the purpose of
      coordinated disclosure. The existing reject path (EM P → N + ER) is the
      correct mechanism; no new transition is introduced.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      description: EM state is Proposed
    - cs_pattern: "...P.."
      description: CS transitions to public (q^cs ∈ ···P··)
    - cs_pattern: "....X."
      description: CS transitions to exploit-available (q^cs ∈ ····X·)
    - cs_pattern: ".....A"
      description: CS transitions to attacks-observed (q^cs ∈ ·····A)
    steps:
    - order: 1
      actor: system
      action: >-
        Detect that CS has transitioned to a P/X/A state while EM is Proposed
      expected: PublicDisclosureBranchNode recognises EM is Proposed (not skipped)
    - order: 2
      actor: system
      action: >-
        Transition EM from Proposed to None via reject_embargo_trigger_bt
        (RejectEmbargoLifecycleNode → sender_side_bt)
      expected: EM state transitions to NO_EMBARGO; ER queued for sender
    postconditions:
    - description: EM state is NO_EMBARGO; ER emitted; proposed embargo abandoned
    relationships:
    - rel_type: extends
      spec_id: EMB-01-002
      note: >-
        EMB-01-002 guards against entering PROPOSED with P/X/A set;
        this entry covers the symmetric case where P/X/A fires while already in PROPOSED
    - rel_type: refines
      spec_id: EMB-06-001
      note: ER emission semantics apply; EM returns to NONE
- id: EMB-17
  title: Late Accept of an Expired Embargo Invitation
  description: >-
    Behaviors required when an `Accept(Invite(EmbargoEvent))` arrives after the
    invitation's RSVP deadline (CM-28-001) has passed. The protocol is liberal
    in what it accepts: a late accepter has signalled willingness to coordinate
    and MUST NOT be sent away. Codified by ADR-0065. Source: IDEA-2066.
  trigger:
    type: message_received
    value: EA
  specs:
  - id: EMB-17-001
    priority: MUST
    kind: protocol
    statement: >-
      A CaseActor receiving an `Accept(Invite(EmbargoEvent))` after the
      invitation's effective RSVP deadline MUST NOT reject it solely because the
      deadline has passed. It MUST evaluate whether the accepted embargo is still
      compatible with the case's current embargo and then apply EMB-17-002,
      EMB-17-003, or EMB-17-004.
    rationale: >-
      Being liberal in what is accepted serves CVD outcomes. A late accepter is
      volunteering to coordinate; refusing them converts a missed deadline into
      a lost participant, which is worse for the case than a late consent.
      See ADR-0065.
    testable: true
    preconditions:
    - description: The referenced invitation's effective RSVP deadline has passed
    postconditions:
    - description: >-
        The Accept is not refused on deadline grounds; one of EMB-17-002,
        EMB-17-003, or EMB-17-004 has been applied
    relationships:
    - rel_type: depends_on
      spec_id: CM-28-003
    adr:
    - ADR-0065
  - id: EMB-17-002
    priority: MUST
    kind: protocol
    statement: >-
      When the accepted embargo is the case's current embargo, the CaseActor MUST
      honour the late Accept and record the participant's PEC transition to
      SIGNATORY, exactly as it would for an on-time Accept.
    rationale: >-
      If the terms the participant agreed to are the terms in force, the
      participant is a valid signatory. The deadline governs whether the
      *invitation* is open, not whether the *agreement* is sound. See ADR-0065.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    - description: >-
        The accepted embargo ID matches the case's current active embargo
    steps:
    - order: 1
      actor: system
      action: Record the PEC ACCEPT transition for the accepting participant
      expected: Participant PEC state is SIGNATORY; embargo_adherence is true
    postconditions:
    - description: Participant PEC state is SIGNATORY
    relationships:
    - rel_type: refines
      spec_id: EMB-17-001
    adr:
    - ADR-0065
  - id: EMB-17-003
    priority: MUST
    kind: protocol
    statement: >-
      When the accepted embargo is NOT the case's current embargo (for example
      the embargo was revised or replaced after the invitation was sent), the
      CaseActor MUST issue a fresh `Invite(EmbargoEvent)` to the accepting actor
      carrying the case's current embargo. It MUST NOT record the stale Accept as
      consent to the current terms, and it MUST NOT reject the accepting actor.
    rationale: >-
      Recording the stale Accept as consent would make the participant a
      signatory to terms they never saw. Rejecting them would discard a
      willing participant. Re-inviting resolves both: the actor stays in the
      case and is asked to consent to the terms actually in force. See ADR-0065.
    testable: true
    preconditions:
    - description: >-
        The accepted embargo ID does not match the case's current active embargo,
        and the case has a current embargo
    steps:
    - order: 1
      actor: system
      action: >-
        Emit a fresh Invite(EmbargoEvent) to the accepting actor carrying the
        case's current embargo
      expected: >-
        Accepting participant PEC state is INVITED for the current embargo;
        stale Accept is not recorded as consent
    postconditions:
    - description: >-
        A fresh invitation for the current embargo has been sent; the actor
        remains a case participant
    relationships:
    - rel_type: refines
      spec_id: EMB-17-001
    adr:
    - ADR-0065
  - id: EMB-17-004
    priority: MUST
    kind: protocol
    statement: >-
      When the case has no current embargo (EM state is EXITED or NONE),
      the CaseActor MUST acknowledge the late Accept as a no-op on embargo state,
      leaving the participant's PEC state at NONE. It MUST NOT issue a
      fresh invitation, and it MUST NOT remove the accepting actor from the case.
    note: >-
      EMB-13-002 independently forbids seeking or accepting new embargoes for a
      case whose CS state is public, exploit-public, or attacks-observed. This
      entry closes the remaining gap: an Accept arriving after EM has EXITED
      while CS is not yet P/X/A previously had no specified behaviour.
    rationale: >-
      Follows the EMB-07-003 precedent for post-terminal messages: acknowledge
      without transitioning. There is nothing to invite the actor to, so a fresh
      invitation would manufacture a negotiation nobody requested — but the
      actor's case participation is independent of embargo consent and MUST
      survive. See ADR-0065.
    testable: true
    preconditions:
    - em_state:
        - EXITED
        - NONE
      description: EM state is EXITED (embargo terminated) or NONE (no embargo started)
    steps:
    - order: 1
      actor: system
      action: Acknowledge the Accept without applying a PEC transition
      expected: >-
        Participant PEC state remains NO_EMBARGO; participant remains in the
        case; no fresh invitation is emitted
    postconditions:
    - description: >-
        No embargo state change; accepting actor remains a case participant
    relationships:
    - rel_type: refines
      spec_id: EMB-17-001
    - rel_type: extends
      spec_id: EMB-13-002
      note: >-
        EMB-13-002 covers the P/X/A case; this entry covers an Accept arriving
        after EM EXITED when CS is not yet P/X/A
    adr:
    - ADR-0065
