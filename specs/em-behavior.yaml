id: EMB
title: Embargo Management Behavioral Requirements
description: >-
  Event-Condition-Action behavioral requirements for Embargo Management (EM). Each group
  is triggered by either a received EM message or a local EM state transition, and
  specifies typed preconditions, ordered steps, and postconditions that implementations
  must satisfy.
tags:
- behavioral
- state-machine
- protocol
scope:
- prototype
- production
groups:
- id: EMB-01
  title: Receive EP (Embargo Proposed)
  description: >-
    Behaviors triggered when a participant receives an EP (Embargo Proposed) message,
    transitioning EM state to Proposed and acknowledging receipt. Written in the voice of the
    formal protocol, in which every Participant is a peer. In the CASE_MANAGER topology
    (PCR-08-001) a participant addresses its proposal to the CASE_MANAGER alone, so the
    Participant receiving EP is the CASE_MANAGER on receipt; every other participant reaches
    the same EM state through ledger replay, and is asked for its answer by the Invite the
    CASE_MANAGER relays to it. "Emit EK" is discharged by the CASE_MANAGER's commit and
    announcement of the received activity; no EK message exists (EP-09-009). See EP-09 and
    ADR-0113 as amended.
  trigger:
    type: message_received
    value: EP
  specs:
  - id: EMB-01-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM None (q^em ∈ N) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EP MUST transition their EM state to Proposed
      (q^em N → P). "Emit EK" is discharged by the CASE_MANAGER's commit of the
      received activity, fanned out as `Announce(CaseLedgerEntry)`; no EK message
      is emitted (EP-09-009).
    rationale: >-
      EP is the EM message that initiates embargo negotiation. When no embargo
      exists and the case is still pre-public, the receiver transitions to
      Proposed to signal they are evaluating the proposal.
    verification: >-
      `test_case_manager_moves_first_proposal_to_proposed` in
      `test/core/use_cases/received/test_embargo_revision_relay.py` confirms that
      receiving EP when EM is NONE transitions EM to PROPOSED, that the
      CASE_MANAGER commits the received EP once and announces its entry, and that
      no acknowledgement message is queued.
    testable: true
    preconditions:
    - em_state:
        - NONE
      cs_pattern: "...pxa"
      description: EM state is None; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from NONE to PROPOSED
      expected: Receiver EM state is PROPOSED
    - order: 2
      actor: receiver
      action: >-
        CASE_MANAGER commits the received EP and announces the ledger entry
        (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: Receiver EM state is PROPOSED; EK discharged by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009

    stories:
    - story_2026_086
    - story_2022_023
  - id: EMB-01-002
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The case is at P/X/A when the vulnerability is public (q^cs ∈ ···P··), an
      exploit is public (q^cs ∈ ····X·), or attacks are observed
      (q^cs ∈ ·····A). A Participant that receives a new embargo proposal (EP) at P/X/A
      MUST answer the Invite with its own `Reject(Invite(EmbargoEvent))` instead of
      accepting it.
      The refusal binds only the proposal's addressee. A receiver the proposal is not
      addressed to (HP-01-012) holds an unaddressed copy, refuses it (HP-01-005) and
      answers nothing (ADR-0118); `cc` addresses nobody (ADR-0109). The `Reject` names
      the Invite by id and carries no terms. An Invite that names its terms by URI only
      is classified as an embargo Invite only once the receiver holds the terms
      (SE-01-006). Its `Reject` follows the fetch of those terms (AKM-05-007), and none
      is sent when the fetch fails (AKM-05-015). A re-delivery of an Invite already
      answered with a `Reject` gets no second `Reject`: the seen-before door refuses
      it again from its receipt stub (CLP-10-010, HP-01-014).
    rationale: >-
      Embargo negotiation is not viable once public disclosure has occurred.
      VP-06-001 prohibits new embargo negotiations in these states.
      The `Reject` of the Invite tells the proposer that the receiver refuses the
      terms. It is the receiver's own consent answer (MSM-07-004), not ER: ER is the
      Case Owner's decision for the case, or the CASE_MANAGER's abandonment of the
      proposal (MSM-02-006, MSM-02-010). A bare object URI matches no pattern's object
      type, so a receiver that lacks the terms cannot tell an embargo Invite from an
      actor Invite until it fetches them (#5266).
    adr:
    - ADR-0118
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    - cs_pattern: "....X."
      description: CS matches pattern ....X.
    - cs_pattern: ".....A"
      description: CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Emit a `Reject` of the Invite to refuse the embargo proposal
      expected: >-
        `Reject(Invite(EmbargoEvent))` queued for the sender; the receiver's EM state does
        not move to PROPOSED
    postconditions:
    - description: >-
        `Reject(Invite(EmbargoEvent))` emitted; no EM state transition to PROPOSED
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
    - rel_type: uses_definition
      spec_id: CLP-10-010
      note: MUST NOT propose or accept embargo when public/exploit/attacks
    - rel_type: uses_definition
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'
    stories:
    - story_2026_033
    see_also:
    - spec_id: AKM-05-007
      reason: 'context for the reader'
    - spec_id: AKM-05-015
      reason: 'context for the reader'
    - spec_id: HP-01-005
      reason: 'context for the reader'
    - spec_id: HP-01-012
      reason: 'context for the reader'
    - spec_id: HP-01-014
      reason: 'context for the reader'
    - spec_id: SE-01-006
      reason: 'context for the reader'

  - id: EMB-01-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant already in EM Proposed (q^em ∈ P) with CS not yet
      public/exploit/attack (q^cs ∈ ···pxa) receiving a second or counter EP MUST stay
      in Proposed with no additional state transition. "Emit EK" is discharged by the
      CASE_MANAGER's commit of the received activity, fanned out as
      `Announce(CaseLedgerEntry)`; no EK message is emitted (EP-09-009, MSM-02-009).
    rationale: >-
      Multiple EP messages can arrive during negotiation. When already in
      Proposed, no additional state transition is needed. The receiver evaluates
      the counter-proposal: it may answer the Invite with an `Accept` or a `Reject` of it,
      or counter, and the Case Owner decides the proposal for the case with EA or ER.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving a counter EP while
      already in EM PROPOSED keeps the state at PROPOSED without triggering an
      additional N→P transition, and that the CASE_MANAGER's ledger commit and
      announcement of the counter EP discharge EK with no EK message queued.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      cs_pattern: "...pxa"
      description: EM state is Proposed; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: >-
        CASE_MANAGER commits the counter EP and announces the ledger
        entry (discharges EK)
      expected: >-
        Ledger entry committed and fanned out; no EK message exists; EM
        state remains PROPOSED
    postconditions:
    - description: >-
        EM state remains PROPOSED; counter-proposal terms available for
        evaluation; EK discharged by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009

    stories:
    - story_2026_086
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-01-004
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in RM Invalid (q^rm ∈ I) SHOULD NOT propose or accept an
      embargo when receiving EP.
    rationale: >-
      VP-13-003 discourages starting embargo management from an Invalid RM state.
      The report has been assessed as invalid; committing to embargo terms under
      those conditions is premature and likely to be wasted effort.
    testable: true
    preconditions:
    - rm_state:
        - INVALID
      description: Participant is in RM Invalid
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-13-003
      note: >-
        SHOULD NOT begin EM with a proposal from a Participant in RM Invalid
    - rel_type: uses_definition
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'
    stories:
    - story_2026_084

  - id: EMB-01-005
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in an inactive RM state (q^rm ∈ {D, C}) SHOULD NOT begin
      embargo management by accepting an incoming EP.
    rationale: >-
      VP-13-002 discourages starting embargo management in inactive RM states.
      Deferred or Closed cases indicate the participant has deprioritized or
      completed their engagement; starting embargo negotiation in these states
      is unlikely to lead to productive coordinated disclosure.
    testable: true
    preconditions:
    - rm_state:
        - DEFERRED
        - CLOSED
      description: Participant is in RM Deferred/Closed
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-13-002
      note: SHOULD NOT begin EM in an inactive RM state
    - rel_type: uses_definition
      spec_id: MSM-02-001
      note: 'EP shorthand wire-type mapping'
    stories:
    - story_2026_084

  - id: EMB-01-006
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST seal the `Reject` of the Invite that EMB-01-002 requires before
      it queues it (ID-04-005).
    rationale: >-
      A redelivery reads the sealed record as "already answered", so the refusal is sent
      once however often the Invite arrives (HP-01-014).
    verification: >-
      `test/core/use_cases/received/test_embargo_relay_replay.py`
      (`test_a_refusal_whose_queue_write_failed_is_queued_on_redelivery`) fails the
      queue write, redelivers the Invite twice, and asserts exactly one `Reject` is
      queued, naming the Invite.
    relationships:
    - rel_type: extends
      spec_id: EMB-01-002
    see_also:
    - spec_id: ID-04-005
      reason: 'context for the reader'
  - id: EMB-01-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST queue again, under its own id, a sealed `Reject` of EMB-01-002
      that the outbox no longer holds (ID-04-005).
    rationale: >-
      The seal of EMB-01-006 makes a redelivery read the Invite as answered. Without the
      requeue, a failed queue write would leave the proposal unanswered for good, and
      the proposer would wait for a `Reject` that never comes.
    verification: >-
      `test/core/use_cases/received/test_embargo_relay_replay.py`
      (`test_a_refusal_whose_queue_write_failed_is_queued_on_redelivery`) fails the
      queue write, redelivers the Invite twice, and asserts exactly one `Reject` is
      queued, naming the Invite.
    relationships:
    - rel_type: extends
      spec_id: EMB-01-006
    see_also:
    - spec_id: EMB-01-002
      reason: 'reached through the link to EMB-01-006'
    - spec_id: ID-04-005
      reason: 'context for the reader'
- id: EMB-02
  title: Receive EA (Embargo Accepted)
  description: Behaviors triggered when a participant receives an EA (Embargo Accepted) message, transitioning EM state to Active and acknowledging receipt.
  trigger:
    type: message_received
    value: EA
  specs:
  - id: EMB-02-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Proposed (q^em ∈ P) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EA MUST move their EM state along the accept
      transition of EMB-18-005: to Active (q^em P → A) when the accepted
      proposal was the last one open, and to Revise (q^em P → R) while another
      proposal stays open.
      "Emit EK" is discharged by the CASE_MANAGER's commit of the
      received activity, fanned out as `Announce(CaseLedgerEntry)`; no EK message
      is emitted (EP-09-009, MSM-02-009).
    rationale: >-
      Every participant must agree on whether an embargo is in force. If the receiver
      kept EM at Proposed after the EA, it would act as if no embargo binds the case,
      and it could disclose while the other participants keep the vulnerability private.
      Another open proposal stays open as a revision of the embargo now in force,
      because the consent already given to its terms stays valid (ADR-0130). Revise
      records both facts. The ledger commit of the EA acknowledges it.
    adr:
    - ADR-0130
    verification: >-
      Integration tests in `test/demo/` confirm that receiving EA in EM PROPOSED
      with CS matching ...pxa and no other open proposal transitions EM to ACTIVE
      with no EK message queued; the multi-proposal move is covered by
      `test/core/states/test_em_transition_table.py` (EMB-18-005).
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      cs_pattern: "...pxa"
      description: EM state is Proposed; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from PROPOSED to ACTIVE
      expected: Receiver EM state is ACTIVE
    - order: 2
      actor: receiver
      action: >-
        CASE_MANAGER commits the received EA and announces the ledger
        entry (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: >-
        Receiver EM state is ACTIVE, or REVISE while another proposal is open;
        EK discharged by the ledger commit
    relationships:
    - rel_type: implements
      spec_id: VP-05-003
      note: An embargo SHALL begin at the moment it is accepted
    - rel_type: uses_definition
      spec_id: MSM-02-002
      note: 'EA shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009
    - rel_type: refines
      spec_id: EMB-18-005

    stories:
    - story_2026_086
    - story_2022_023
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-02-002
    priority: MUST_NOT
    kind: protocol
    verification: >-
      `test/core/use_cases/received/test_embargo_owner_decision.py::test_an_activation_with_pxa_set_is_refused_uncommitted`
      confirms an activation on a public case (P set) is refused before commit;
      inspection confirms the refusal tests all three bits (`pxa_is_embargo_eligible`
      in the owner's decision), so X or A set refuses the activation as P does.
    statement: >-
      A Participant MUST NOT apply EA's transition to Active when the case is at P/X/A
      (q^cs ∉ ···pxa). EA is the Case Owner's `Add(EmbargoEvent)[target=VulnerabilityCase]`
      (MSM-07-008). The CASE_MANAGER refuses that activation before committing it to the
      case ledger, and sends no `Reject` of the Invite for it.
    rationale: >-
      VP-06-001 prohibits accepting embargoes once public disclosure has occurred.
      EA is the Case Owner's decision (MSM-02-002), so the refusal falls on it. A
      `Reject` of the Invite that the CASE_MANAGER commits reads as its abandonment of
      the proposal (MSM-07-016, ADR-0152), so the activation is refused instead. The
      `Reject` of EMB-02-004 differs: it is a direct answer, never committed. VP-13-004
      only discourages Active when RM is Invalid or Closed; this bar is absolute.
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    - cs_pattern: "....X."
      description: CS matches pattern ....X.
    - cs_pattern: ".....A"
      description: CS matches pattern .....A
    steps:
    - order: 1
      actor: CASE_MANAGER
      action: Refuse the Case Owner's activation before committing it (embargo not viable)
      expected: Nothing is committed; EM state is not transitioned to ACTIVE
    postconditions:
    - description: Activation refused; EM state not transitioned to ACTIVE
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
      note: MUST NOT accept a new embargo when public/exploit/attacks
    - rel_type: uses_definition
      spec_id: MSM-02-002
      note: 'EA shorthand wire-type mapping'
    adr:
    - ADR-0180
    stories:
    - story_2026_033
    see_also:
    - spec_id: MSM-07-008
      reason: 'context for the reader'

  - id: EMB-02-003
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in RM Invalid or Closed (q^rm ∈ {I, C}) SHOULD NOT allow
      EM to proceed from Proposed to Active upon receiving EA.
    rationale: >-
      VP-13-004 discourages proceeding to Active when the report has been
      assessed as invalid or closed. The embargo would apply to a case the
      participant is not actively working.
    testable: true
    preconditions:
    - rm_state:
        - INVALID
        - CLOSED
      description: Participant is in RM Invalid/Closed
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-13-004
      note: >-
        SHOULD NOT proceed from EM Proposed to EM Accepted when RM is Invalid
        or Closed
    - rel_type: uses_definition
      spec_id: MSM-02-002
      note: 'EA shorthand wire-type mapping'
    stories:
    - story_2026_084

  - id: EMB-02-004
    priority: MUST
    kind: protocol
    statement: >-
      The case may be at P/X/A (q^cs ∉ ···pxa) when a Participant's
      `Accept(Invite(EmbargoEvent))` reaches the CASE_MANAGER. The CASE_MANAGER MUST then
      refuse the Accept by answering that Participant with a `Reject` of the Invite.
    rationale: >-
      An `Accept` of the Invite is the Participant's own consent, not EA (MSM-02-010), so
      EMB-02-002 does not cover it. VP-06-001 prohibits accepting embargoes once public
      disclosure has occurred, so consent to the proposed terms cannot be recorded. The
      `Reject` of the Invite tells the Participant that its answer was refused, as
      EMB-01-002 does for a proposal. It is a direct answer addressed to that
      Participant and is never committed to the ledger, so no replica reads it as the
      abandonment of MSM-07-016. It sits beside EMB-02-002 because both refuse an
      acceptance on a public case.
    verification: >-
      `test/core/use_cases/received/test_embargo_relay_replay.py::test_a_case_manager_with_pxa_set_rejects_a_participants_acceptance`
      confirms that the CASE_MANAGER answers a participant's acceptance on a public case
      with a `Reject` of the Invite; inspection confirms `PxaBarsEmbargoNode` tests all
      three bits, so X or A set refuses the acceptance as P does.
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    - cs_pattern: "....X."
      description: CS matches pattern ....X.
    - cs_pattern: ".....A"
      description: CS matches pattern .....A
    steps:
    - order: 1
      actor: CASE_MANAGER
      action: Emit a `Reject` of the Invite to refuse the acceptance (embargo not viable)
      expected: >-
        `Reject(Invite(EmbargoEvent))` queued for the accepting Participant; its consent
        is not
        recorded
    postconditions:
    - description: >-
        `Reject(Invite(EmbargoEvent))` emitted; the Participant's acceptance is not recorded
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
      note: MUST NOT accept a new embargo when public/exploit/attacks
    stories:
    - story_2026_033

- id: EMB-03
  title: Receive EV (Embargo Revision Proposed)
  description: >-
    Behaviors triggered when a participant receives an EV (Embargo Revision Proposed)
    message while an embargo is active, transitioning EM state to Revise and acknowledging
    receipt. Written in the voice of the formal protocol, in which every Participant is a
    peer. In the CASE_MANAGER topology (PCR-08-001) a participant addresses its proposal to
    the CASE_MANAGER alone, so the Participant receiving EV is the CASE_MANAGER on receipt;
    every other participant reaches the same EM state through ledger replay, and is asked
    for its answer by the Invite the CASE_MANAGER relays to it. "Emit EK" is discharged by
    the CASE_MANAGER's commit and announcement of the received activity; no EK message exists
    (EP-09-009). See EP-09 and ADR-0113.
  trigger:
    type: message_received
    value: EV
  specs:
  - id: EMB-03-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Active (q^em ∈ A) with CS not yet public/exploit/attack
      (q^cs ∈ ···pxa) receiving EV MUST transition their EM state to Revise
      (q^em A → R). "Emit EK" is discharged by the CASE_MANAGER's commit of the
      received activity, fanned out as `Announce(CaseLedgerEntry)`; no EK message
      is emitted (EP-09-009, MSM-02-009).
    rationale: >-
      A participant must know that a change to the embargo is open while the current
      terms still bind it. Revise records both facts: an embargo is in force, and a
      revision of it waits for an answer. If the receiver stayed in Active, it could not
      tell that a later EC or EJ decides a revision. The revision does not change any
      participant's consent to the embargo in force until the Case Owner activates it
      (EP-05-002).
    adr:
    - ADR-0113
    verification: >-
      `test_case_manager_moves_canonical_case_to_revise` in
      `test/core/use_cases/received/test_embargo_revision_relay.py` confirms that
      receiving EV in EM ACTIVE transitions EM to REVISE, that the CASE_MANAGER
      commits the received EV once and announces its entry, and that no
      acknowledgement message is queued.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      cs_pattern: "...pxa"
      description: EM state is Active; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from ACTIVE to REVISE
      expected: Receiver EM state is REVISE
    - order: 2
      actor: receiver
      action: CASE_MANAGER commits the received EV and announces the ledger entry (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: >-
        Receiver EM state is REVISE; original embargo remains in force; EK
        discharged by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-003
      note: 'EV shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009

    stories:
    - story_2026_086
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-03-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant already in EM Revise (q^em ∈ R) with CS not yet
      public/exploit/attack (q^cs ∈ ···pxa) receiving a counter EV
      (counter-revision) MUST stay in Revise with no additional state
      transition. "Emit EK" is discharged by the CASE_MANAGER's commit of the
      received activity, fanned out as `Announce(CaseLedgerEntry)`; no EK message
      is emitted (EP-09-009, MSM-02-009).
    rationale: >-
      Multiple revision proposals can arrive. When already in Revise, no further
      state transition is needed; the receiver evaluates the counter-revision and
      answers its Invite with an `Accept` or a `Reject` of it, and the Case Owner decides
      the revision for the case with EC or EJ.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving a counter EV while
      already in EM REVISE keeps the state at REVISE without triggering an
      additional state transition, with no EK message queued.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: >-
        CASE_MANAGER commits the counter EV and announces the ledger
        entry (discharges EK)
      expected: >-
        Ledger entry committed and fanned out; no EK message exists; EM
        state remains REVISE
    postconditions:
    - description: EM state remains REVISE; EK discharged by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-003
      note: 'EV shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009

    stories:
    - story_2026_086
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-03-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule binds a Participant that is neither Case Owner nor CASE_MANAGER. Its
      EM is Active or Revise (q^em ∈ {A, R}) and the case is at P/X/A (q^cs ∉ ···pxa).
      That Participant, receiving EV, MUST NOT adopt the proposal, emit ET or change its
      own EM state. Only the Case Owner, or the CASE_MANAGER when delegated, initiates
      termination (EP-09-003, EP-09-008, CM-24, ADR-0113, ADR-0118). The public, exploit
      or attack fact causes it, never a revision proposal.
    rationale: >-
      A proposal is at most the occasion on which a participant notices the case is
      public; making it the cause would tie termination to someone proposing terms.
      Ending the embargo is the Case Owner's decision, and only the CASE_MANAGER writes
      shared EM state (EP-09-008, ADR-0113). VP-06-001 and VP-09-001 are met by the
      owner's or CASE_MANAGER's termination (VP-11-002, VP-11-011), which in the
      CASE_MANAGER topology is the CS public-event cascade, not by each participant
      emitting ET (ADR-0118).
    adr:
    - ADR-0113
    - ADR-0118
    verification: >-
      A per-actor-store test in
      `test/core/use_cases/received/test_embargo_relay_replay.py` delivers a relayed
      revision Invite to a participant whose case is P/X/A and asserts no ET and no EM
      state change on the participant. On the CASE_MANAGER side,
      `test/core/behaviors/status/test_add_case_status_bt.py::TestThreatTerminationBranchNode::test_triggers_teardown_on_threat_pxa_states`
      shows a recorded P, X or A state tearing down the active embargo, and
      `test/core/use_cases/received/test_embargo_revision_relay.py::test_a_revision_of_a_public_case_is_refused_with_a_reject`
      shows a revision proposal on a public case not adopted.
      `test_a_racing_revision_is_refused_and_the_cascade_ends_the_embargo`, in
      the same file, covers the race: a revision that reaches the CASE_MANAGER
      at `ACTIVE` or `REVISE` with P, X or A already recorded is refused
      (EP-09-021) and ends nothing, and the embargo ends only when the cascade
      runs, with the threat signal as its cause.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: "...P.."
      description: EM state is Active or Revise; CS matches pattern ...P..
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: "....X."
      description: EM state is Active or Revise; CS matches pattern ....X.
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: ".....A"
      description: EM state is Active or Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Leave the revision unadopted and emit no ET
      expected: No ET is emitted; the receiver's EM state is unchanged
    postconditions:
    - description: >-
        No revision proposal adopted; the receiver emits no ET and its EM state is
        unchanged
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-003
      note: 'EV shorthand wire-type mapping'
    - rel_type: refines
      spec_id: EP-09-003

    stories:
    - story_2022_023
    - story_2022_080
    see_also:
    - spec_id: EP-09-008
      reason: 'context for the reader'
  - id: EMB-03-004
    priority: MUST
    kind: protocol
    statement: >-
      This rule binds the Participant of EMB-03-003: neither the Case Owner nor the
      CASE_MANAGER, in EM Active or Revise, with the case at P/X/A. That Participant,
      receiving EV, MUST answer the revision Invite with its own `Reject` of it to the
      CASE_MANAGER. EMB-01-002 requires the same answer to a proposal.
    rationale: >-
      Revision negotiation is not viable once public disclosure has occurred, so the
      participant refuses the revision. A participant answers only the Invite addressed
      to it (EP-09-003). The `Reject` of the Invite is the participant's own consent
      answer (MSM-07-004), not ER, which is the Case Owner's decision or the
      CASE_MANAGER's abandonment (MSM-02-006).
    adr:
    - ADR-0113
    verification: >-
      A per-actor-store test in
      `test/core/use_cases/received/test_embargo_relay_replay.py` delivers a relayed
      revision Invite to a participant whose case is P/X/A and asserts one `Reject` of
      the Invite to the CASE_MANAGER;
      `test/core/use_cases/received/test_embargo_revision_relay.py::test_a_revision_of_a_public_case_is_refused_with_a_reject`
      shows a revision proposal on a public case refused with a `Reject` of it.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: "...P.."
      description: EM state is Active or Revise; CS matches pattern ...P..
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: "....X."
      description: EM state is Active or Revise; CS matches pattern ....X.
    - em_state:
        - ACTIVE
        - REVISE
      cs_pattern: ".....A"
      description: EM state is Active or Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: receiver
      action: Emit a `Reject` of the revision Invite to the CASE_MANAGER
      expected: "`Reject(Invite(EmbargoEvent))` queued for the CASE_MANAGER"
    postconditions:
    - description: "`Reject(Invite(EmbargoEvent))` queued for the CASE_MANAGER"
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-003
      note: 'EV shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EMB-03-003
    stories:
    - story_2022_023
    - story_2022_080
    see_also:
    - spec_id: EMB-01-002
      reason: >-
        an analogy ("requires the same answer"); a revision Invite is not EMB-01-002's
        new proposal
- id: EMB-04
  title: Receive EJ (Embargo Revision Rejected)
  description: Behaviors triggered when a participant receives an EJ (Embargo Revision Rejected) message, reverting EM state from Revise to Active and acknowledging receipt.
  trigger:
    type: message_received
    value: EJ
  specs:
  - id: EMB-04-001
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a Participant in EM Revise (q^em ∈ R) whose CS is not yet
      public/exploit/attack (q^cs ∈ ···pxa).
      When it receives EJ for the last open proposal, it MUST move its EM state back to
      Active (q^em R → A).
      The CASE_MANAGER's commit of the received activity, fanned out as
      `Announce(CaseLedgerEntry)`, discharges "Emit EK".
      No EK message is emitted (EP-09-009, MSM-02-009).
    rationale: >-
      EJ says that a revision proposal is rejected. A rejected revision leaves the
      embargo in force and the consent to it unchanged (EP-05-002), so when no other
      proposal is open, EM returns to Active under the terms it had. The CASE_MANAGER's
      commit and fan-out of the received activity tell every participant of the
      change, so no separate EK message is necessary (ADR-0113).
    adr:
    - ADR-0113
    - ADR-0130
    verification: >-
      Integration tests in `test/demo/` confirm that receiving EJ in EM REVISE
      with CS matching ...pxa and no other open proposal transitions EM back to
      ACTIVE, and that the CASE_MANAGER's
      ledger commit and announcement of the received EJ discharge EK with no EK message
      queued.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from REVISE back to ACTIVE
      expected: Receiver EM state is ACTIVE
    - order: 2
      actor: receiver
      action: CASE_MANAGER commits the received EJ and announces the ledger entry (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: >-
        Receiver EM state is ACTIVE (revision rejected); EK discharged by the ledger
        commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-004
      note: 'EJ shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009
    stories:
    - story_2026_086
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-04-003
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a Participant in EM Revise (q^em ∈ R) whose CS is not yet
      public/exploit/attack (q^cs ∈ ···pxa).
      When it receives EJ while another proposal is open, it MUST remain in Revise (q^em
      R → R) (EMB-18-005).
    rationale: >-
      While another proposal stays open, EM stays in Revise, because the register
      still holds an open proposal (ADR-0130).
    verification: >-
      `test/core/states/test_em_transition_table.py`
      (`test_rejecting_one_of_two_open_revisions_stays_in_revise`) confirms rejecting
      one of two open revisions leaves EM in REVISE.
    adr:
    - ADR-0130
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa; another proposal is open
    postconditions:
    - description: Receiver EM state is REVISE
    relationships:
    - rel_type: refines
      spec_id: EMB-18-005
    stories:
    - story_2026_086
  - id: EMB-04-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER in EM Revise (q^em ∈ R) with CS in a public/exploit/attack
      state (q^cs ∉ ···pxa) that commits the Case Owner's EJ of the last open
      revision MUST emit ET in the same act to terminate the embargo, rather than
      reverting to Active.
    rationale: >-
      Reverting to Active is not viable once public disclosure has occurred.
      VP-09-001 requires termination in these states. "Rather than reverting"
      describes where the act ends: EM ends EXITED, never back in Active. Inside
      the act, the CASE_MANAGER records the rejection as decided (the revision
      REJECTED) and then terminates the embargo, as two entries a replica copies
      in order (MSM-07-032, CM-23-016).
    note: >-
      EJ is the Case Owner's decision, and only the CASE_MANAGER writes shared
      EM state, so the CASE_MANAGER emits the ET. The CASE_MANAGER can be the
      Case Owner itself. A Participant that does not hold the CASE_MANAGER role
      emits no ET (EP-09-008, EMB-03-003, ADR-0118). While another revision is
      open, the rejection leaves EM in Revise and ends nothing (EP-08-001).
      Adopting P, X or A ends the embargo and cancels its proposals in the same
      act (ADR-0166, EP-08-004), so this rule's start state follows only a
      failed teardown (CSB-18-004).
    verification: >-
      `test/core/use_cases/received/test_embargo_ending_notices.py`
      (`test_owner_ej_after_disclosure_sends_et_crediting_the_owner`) and
      `test/core/use_cases/triggers/embargo/test_reject.py`
      (`test_manager_reject_after_disclosure_rejects_then_terminates`) confirm
      that the CASE_MANAGER commits the Case Owner's EJ of the last revision
      after P/X/A and then emits ET, so EM ends EXITED, not ACTIVE.
      `test/core/services/embargo_lifecycle/test_reject_with_other_proposals_open.py`
      confirms that while another revision is open the rejection leaves EM in
      REVISE, and
      `test/core/use_cases/received/test_ledger_replay_convergence.py` confirms
      that a replica copies both entries in order.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...P.."
      description: EM state is Revise; CS matches pattern ...P..
    - em_state:
        - REVISE
      cs_pattern: "....X."
      description: EM state is Revise; CS matches pattern ....X.
    - em_state:
        - REVISE
      cs_pattern: ".....A"
      description: EM state is Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: CASE_MANAGER
      action: >-
        Commit the Case Owner's EJ, then emit ET to terminate the embargo in the
        same act
      expected: ET queued for participants; EM transitions to EXITED
    postconditions:
    - description: ET emitted; EM state is EXITED
    relationships:
    - rel_type: refines
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when public/exploit
    - rel_type: uses_definition
      spec_id: MSM-02-004
      note: 'EJ shorthand wire-type mapping'

    stories:
    - story_2022_023
    - story_2022_080
- id: EMB-05
  title: Receive EC (Embargo Revision Accepted)
  description: Behaviors triggered when a participant receives an EC (Embargo Revision Accepted) message, advancing EM state from Revise back to Active with updated terms and acknowledging receipt.
  trigger:
    type: message_received
    value: EC
  specs:
  - id: EMB-05-001
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a Participant in EM Revise (q^em ∈ R) whose CS is not yet
      public/exploit/attack (q^cs ∈ ···pxa).
      When it receives EC for the last open proposal, it MUST move its EM state back to
      Active (q^em R → A) with the revised terms.
      The CASE_MANAGER's commit of the Case Owner's `Add(EmbargoEvent)[target=VulnerabilityCase]`,
      fanned out as `Announce(CaseLedgerEntry)`, discharges "Emit EK".
      No EK message is emitted (EP-09-009, MSM-02-009).
    rationale: >-
      EC says that the Case Owner activates a revision. The revised terms replace the
      terms in force, so when no other proposal is open, EM returns to Active under the
      revised terms. The CASE_MANAGER's commit and fan-out of the owner's Add tell
      every participant of the change, so no separate EK message is necessary
      (ADR-0113).
    adr:
    - ADR-0113
    - ADR-0130
    - ADR-0180
    verification: >-
      Integration tests in `test/demo/` confirm that receiving EC in EM REVISE
      with CS matching ...pxa and no other open proposal transitions EM back to
      ACTIVE with revised terms, and that the
      CASE_MANAGER's commit of the Case Owner's
      `Add(EmbargoEvent)[target=VulnerabilityCase]` and its announcement
      discharge EK with no EK message queued.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from REVISE to ACTIVE with revised embargo terms
      expected: Receiver EM state is ACTIVE; revised terms recorded
    - order: 2
      actor: receiver
      action: >-
        CASE_MANAGER commits the Case Owner's
        `Add(EmbargoEvent)[target=VulnerabilityCase]` and announces the ledger entry
        (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: >-
        Receiver EM state is ACTIVE with new terms; EK discharged by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-005
      note: 'EC shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009
    stories:
    - story_2026_086
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-05-003
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a Participant in EM Revise (q^em ∈ R) whose CS is not yet
      public/exploit/attack (q^cs ∈ ···pxa).
      When it receives EC while another proposal is open, it MUST remain in Revise (q^em
      R → R) under the revised terms (EMB-18-005).
    rationale: >-
      The revised terms replace the terms in force at once. While another proposal
      stays open, EM stays in Revise, because the register still holds an open
      proposal (ADR-0130).
    verification: >-
      `test/core/states/test_em_transition_table.py`
      (`test_accepting_one_of_two_open_revisions_stays_in_revise_on_its_terms`)
      confirms accepting one of two open revisions leaves EM in REVISE with the
      accepted revision in force.
    adr:
    - ADR-0130
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...pxa"
      description: EM state is Revise; CS matches pattern ...pxa; another proposal is open
    postconditions:
    - description: Receiver EM state is REVISE with the revised terms
    relationships:
    - rel_type: refines
      spec_id: EMB-18-005
    stories:
    - story_2026_086
  - id: EMB-05-002
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the CASE_MANAGER in EM Revise (q^em ∈ R) with CS in a
      public/exploit/attack state (q^cs ∉ ···pxa).
      It MUST refuse the Case Owner's EC before committing it, and emits no ET
      for the EC.
    rationale: >-
      Accepting a revision is not viable once public disclosure has occurred
      (VP-06-001). EC activates a revision, so it is refused as EA is
      (EMB-02-002), before the commit (CLP-10-009). A refusal is not an act,
      so it carries no ET. The P/X/A fact causes the termination, not the EC
      (EMB-03-003): the act that adopts P, X or A ends the embargo (RSH-03-001,
      ADR-0166). EJ differs (EMB-04-002): it is committed, so its act can end
      the embargo.
    note: >-
      Restated to match the received EC tree, which refuses the activation in
      `OwnerMayActivateEmbargoNode` (maintainer decision, #5325).
    adr:
    - ADR-0166
    verification: >-
      `test/core/use_cases/received/test_embargo_owner_decision.py::test_an_accepted_revision_with_pxa_set_is_refused_without_et`
      confirms that, with P, X or A set, the CASE_MANAGER refuses the Case
      Owner's EC of a revision with no ledger entry and nothing queued to the
      outbox, so no ET, and leaves EM in REVISE under the prior terms.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      cs_pattern: "...P.."
      description: EM state is Revise; CS matches pattern ...P..
    - em_state:
        - REVISE
      cs_pattern: "....X."
      description: EM state is Revise; CS matches pattern ....X.
    - em_state:
        - REVISE
      cs_pattern: ".....A"
      description: EM state is Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: CASE_MANAGER
      action: Refuse the Case Owner's EC before committing it
      expected: >-
        No ledger entry and no ET; EM stays Revise under the prior terms
    postconditions:
    - description: >-
        EC refused uncommitted; no ET emitted for it; the embargo in force is
        unchanged
    relationships:
    - rel_type: refines
      spec_id: EMB-02-002
      note: EC is the activation of a revision
    - rel_type: uses_definition
      spec_id: MSM-02-005
      note: 'EC shorthand wire-type mapping'

    stories:
    - story_2022_023
    - story_2022_080
- id: EMB-06
  title: Receive ER (Embargo Rejected)
  description: Behaviors triggered when a participant receives an ER (Embargo Rejected) message, transitioning EM state from Proposed to None and acknowledging receipt.
  trigger:
    type: message_received
    value: ER
  specs:
  - id: EMB-06-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Proposed (q^em ∈ P) receiving ER MUST move their EM state
      along the reject transition of EMB-18-005: back to None (q^em P → N) when the
      rejected proposal was the last one open, and staying in Proposed (q^em P → P)
      while another proposal is open. "Emit EK" is discharged by the CASE_MANAGER's
      commit of the received activity, fanned out as `Announce(CaseLedgerEntry)`; no EK
      message is emitted (EP-09-009, MSM-02-009).
    rationale: >-
      If the receiver stayed in Proposed after the last open proposal is rejected, it
      would wait for an answer that does not come, and it would show an embargo
      negotiation that has ended. None tells every participant that no embargo binds the
      case. While another proposal is open, EM stays in Proposed, because that proposal
      still waits for an answer (ADR-0130). The ledger commit of the ER acknowledges it.
    adr:
    - ADR-0130
    verification: >-
      Integration tests in `test/demo/` confirm that receiving ER in EM PROPOSED
      with no other open proposal transitions EM to NONE with no EK message
      queued; `test_a_rejection_returns_em_to_none_only_with_the_last_proposal`
      in `test/core/states/test_em_transition_table.py` covers the
      multi-proposal case.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      description: EM state is Proposed
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from PROPOSED to NONE
      expected: Receiver EM state is NONE
    - order: 2
      actor: receiver
      action: >-
        CASE_MANAGER commits the received ER and announces the ledger
        entry (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: >-
        Receiver EM state is NONE (proposal rejected), or PROPOSED while another
        proposal is open; EK discharged by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-006
      note: 'ER shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009
    - rel_type: refines
      spec_id: EMB-18-005

    stories:
    - story_2026_086
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
- id: EMB-07
  title: Receive ET (Embargo Terminated)
  description: Behaviors triggered when a participant receives an ET (Embargo Terminated) message, transitioning EM state to Terminated and acknowledging receipt.
  trigger:
    type: message_received
    value: ET
  specs:
  - id: EMB-07-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Active (q^em ∈ A) receiving ET MUST transition their
      EM state to Exited (q^em A → X). "Emit EK" is discharged by the
      CASE_MANAGER's commit of the received activity, fanned out as
      `Announce(CaseLedgerEntry)`; no EK message is emitted (EP-09-009,
      MSM-02-009).
    rationale: >-
      ET is the message that terminates an active embargo. The receiver records
      that the embargo has ended. ET has immediate effect regardless of other
      pending messages.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving ET in EM ACTIVE
      transitions EM to EXITED with no EK message queued.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from ACTIVE to EXITED
      expected: Receiver EM state is EXITED
    - order: 2
      actor: receiver
      action: >-
        CASE_MANAGER commits the received ET and announces the ledger
        entry (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: Receiver EM state is EXITED; EK discharged by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-007
      note: 'ET shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009

    stories:
    - story_2026_086
    - story_2022_023
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-07-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Revise (q^em ∈ R) receiving ET MUST transition their
      EM state to Exited (q^em R → X). "Emit EK" is discharged by the
      CASE_MANAGER's commit of the received activity, fanned out as
      `Announce(CaseLedgerEntry)`; no EK message is emitted (EP-09-009,
      MSM-02-009).
    rationale: >-
      ET terminates the embargo regardless of whether a revision is pending.
      The revision proposal is abandoned upon termination.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving ET in EM REVISE
      transitions EM to EXITED and abandons any pending revision, with no EK
      message queued.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      description: EM state is Revise
    steps:
    - order: 1
      actor: receiver
      action: Transition EM state from REVISE to EXITED
      expected: Receiver EM state is EXITED
    - order: 2
      actor: receiver
      action: >-
        CASE_MANAGER commits the received ET and announces the ledger
        entry (discharges EK)
      expected: Ledger entry committed and fanned out; no EK message exists
    postconditions:
    - description: >-
        Receiver EM state is EXITED; pending revision abandoned; EK discharged
        by the ledger commit
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-007
      note: 'ET shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009

    stories:
    - story_2026_086
    - story_2022_023
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
  - id: EMB-07-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant already in EM Exited (q^em ∈ X) receiving ET MUST remain in Exited
      with no state transition. "Emit EK" is discharged by the CASE_MANAGER's commit of
      the received activity, fanned out as `Announce(CaseLedgerEntry)`; no EK message is
      emitted (EP-09-009, MSM-02-009).
    rationale: >-
      Exited is already the terminal state, so a duplicate termination message
      needs no additional transition and no acknowledgment of its own.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving ET while already in
      EM EXITED leaves EM state unchanged, with no EK message queued.
    testable: true
    preconditions:
    - em_state:
        - EXITED
      description: EM state is Exited
    steps:
    - order: 1
      actor: receiver
      action: Make no state change for the duplicate ET
      expected: EM state remains EXITED; no EK message exists
    postconditions:
    - description: EM state remains EXITED; no EK message emitted
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-007
      note: 'ET shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009

    stories:
    - story_2026_014
    see_also:
    - spec_id: MSM-02-009
      reason: 'context for the reader'
- id: EMB-08
  title: Receive EE (Embargo Error)
  description: Behaviors triggered when a participant receives an EE (Embargo Management Error) signal, which has no dedicated semantic dispatch value and is handled outside the standard AS2 pattern-matching pipeline.
  trigger:
    type: message_received
    value: EE
  specs:
  - id: EMB-08-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant that receives `Create(ProcessingFault)` about an embargo
      activity it sent SHOULD inquire about the nature of the error (GI) when the
      fault does not say what went wrong. EE has no wire activity of its own
      (MSM-02-008, MSM-05-001). The receiver emits no EK for the fault
      (EP-09-009).
    rationale: >-
      A fault report says that an embargo activity failed, but it does not always say
      why. An inquiry lets the sender explain the error and enables recovery. A fault
      report does not trigger an EM state transition, and the error is grouped by
      failure mode, not by state machine, so no EE or EK message exists.
    testable: true
    steps:
    - order: 1
      actor: receiver
      action: Emit GI to inquire about the nature of the error
      expected: GI queued for sender; no EK message exists
    postconditions:
    - description: GI emitted; EM state unchanged
    relationships:
    - rel_type: refines
      spec_id: VP-11-005
      note: >-
        SHOULD inquire (GI) about the nature of an error reported by a fault
        about an E* message; no EK message exists
    - rel_type: uses_definition
      spec_id: MSM-02-008
      note: 'EE shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009
    stories:
    - story_2022_039
    see_also:
    - spec_id: MSM-05-001
      reason: 'context for the reader'

- id: EMB-09
  title: Receive EK (Embargo Acknowledgment)
  description: >-
    Behaviors triggered when a participant receives the acknowledgment (EK) of an embargo
    activity it sent. No EK message exists (EP-09-009): the acknowledgment is the
    CASE_MANAGER's commit of the activity, fanned out as `Announce(CaseLedgerEntry)`.
  trigger:
    type: message_received
    value: EK
  specs:
  - id: EMB-09-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant that receives the CASE_MANAGER's `Announce(CaseLedgerEntry)` for an
      embargo activity it sent MAY treat that entry as the acknowledgment (EK) of the
      activity, with no further state transition and no required response. No EK message
      exists (EP-09-009, MSM-02-009).
    rationale: >-
      The ledger entry confirms that the CASE_MANAGER received and recorded the earlier
      E* message. As an acknowledgment it carries no new decision about the embargo, so
      it gives the receiver nothing more to change and nothing to answer. The replica
      acknowledges the entry itself through its unbroken hash chain (MSM-05-002).
    testable: false
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-02-009
      note: 'EK shorthand wire-type mapping'
    - rel_type: uses_definition
      spec_id: EP-09-009
    stories:
    - story_2026_006

- id: EMB-10
  title: Enter EM Proposed
  trigger:
    type: state_entered
    value: EM.PROPOSED
  specs:
  - id: EMB-10-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant entering EM Proposed MAY evaluate the proposed terms and answer
      the Invite with `Accept(Invite(EmbargoEvent))` or `Reject(Invite(EmbargoEvent))`, or
      counter-propose with EV.
    rationale: >-
      EM Proposed marks that embargo negotiation is underway. The participant
      must evaluate the proposal and eventually accept, counter, or reject to
      move the EM process forward. Its answer is its own consent (MSM-07-003,
      MSM-07-004); the Case Owner's EA or ER decides the proposal for the case
      (MSM-02-002, MSM-02-006).
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - PROPOSED
      description: EM state is Proposed
    relationships:
    - rel_type: refines
      spec_id: VP-04-004
      note: Once proposed, an embargo MAY be accepted or rejected
    - rel_type: refines
      spec_id: VP-06-010
      note: Participants MAY accept or reject any proposed embargo as they see fit
    stories:
    - story_2026_083

  - id: EMB-10-002
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in RM Invalid or Deferred or Closed (q^rm ∈ {I, D, C})
      SHOULD NOT begin or continue embargo negotiations while in those inactive
      RM states.
    rationale: >-
      VP-13-002 and VP-13-003 discourage starting EM in inactive RM states.
      An embargo proposed while a report is invalid or deferred is unlikely to
      result in productive coordination.
    testable: true
    preconditions:
    - rm_state:
        - INVALID
        - DEFERRED
        - CLOSED
      description: Participant is in RM Invalid/Deferred/Closed
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-002
      note: SHOULD NOT begin EM in an inactive RM state
    - rel_type: satisfies
      spec_id: VP-13-003
      note: SHOULD NOT begin EM with a proposal from a Participant in RM Invalid
    stories:
    - story_2026_084

- id: EMB-11
  title: Enter EM Active
  trigger:
    type: state_entered
    value: EM.ACTIVE
  specs:
  - id: EMB-11-001
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant in EM Active SHOULD NOT share the vulnerability report with
      a newly invited Participant until that Participant has accepted the existing
      embargo terms.
    rationale: >-
      VP-08-006 prohibits sharing the vulnerability report with new Participants
      who have not yet accepted an existing embargo. Sharing before acceptance
      undermines the embargo's confidentiality guarantees.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-08-006
      note: >-
        SHOULD NOT share vulnerability report with newly invited Participant
        unless they accepted the embargo
    stories:
    - story_2022_023

  - id: EMB-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering EM Active SHOULD maintain the embargo by not
      publishing information about the vulnerability until the embargo is
      terminated, whether on reaching its end time or early. An embargo whose
      end time has passed is ended by the CASE_MANAGER with the reason
      `END_TIME_REACHED` (EMB-13-003); until that termination reaches a
      Participant, its end time still bounds what it withholds.
    rationale: >-
      VP-05-014 specifies that Participants SHOULD NOT publish information about
      the vulnerability when there is an active embargo. Entering Active marks
      the formal commitment to these terms. Reaching the end time does not end
      the embargo by itself: the termination is a register change the
      CASE_MANAGER commits, so every Participant learns of it the same way
      (ADR-0122).
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    relationships:
    - rel_type: satisfies
      spec_id: VP-05-014
      note: SHOULD NOT publish information when there is an active embargo
    stories:
    - story_2022_023
    see_also:
    - spec_id: EMB-13-003
      reason: 'context for the reader'

  - id: EMB-11-003
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A Participant in RM Closed or Deferred (q^rm ∈ {C, D}) in EM Active
      while other Participants remain engaged MUST NOT automatically terminate
      the embargo due to their own RM closure or deferral.
    rationale: >-
      VP-13-009 explicitly requires that a single Participant's closure or
      deferral SHALL NOT automatically terminate the embargo. The embargo
      persists as long as other Participants remain engaged and the EM process
      is Active.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
      rm_state:
        - CLOSED
        - DEFERRED
      description: Participant is in RM Closed/Deferred; EM state is Active
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-13-009
      note: >-
        A Participant's closure or deferral SHALL NOT automatically terminate
        the embargo
    stories:
    - story_2022_066

  - id: EMB-11-004
    priority: SHOULD
    kind: protocol
    statement: >-
      Reports with no further tasks (q^rm ∈ {D, I}) SHOULD be held in Deferred
      or Invalid while the embargo remains Active or Revise (q^em ∈ {A, R})
      rather than being closed.
    rationale: >-
      VP-13-006 advises keeping the report in a non-terminal RM state until the
      embargo has exited. Closing early may prematurely signal disengagement
      from the coordinated timeline.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      rm_state:
        - DEFERRED
        - INVALID
      description: Participant is in RM Deferred/Invalid; EM state is Active or Revise
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-006
      note: SHOULD be held in Deferred or Invalid until embargo exits
    stories:
    - story_2022_066

  - id: EMB-11-005
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant who intends to change their adherence stance to an active
      embargo SHOULD communicate that intent clearly to other Participants.
    rationale: >-
      VP-13-008 requires communicating changes to embargo adherence. Surprises
      about who is or is not honoring the embargo undermine coordinated
      disclosure.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - ACTIVE
      description: EM state is Active
    relationships:
    - rel_type: satisfies
      spec_id: VP-13-008
      note: Changes to adherence intention SHOULD be communicated clearly
    stories:
    - story_2022_015

- id: EMB-12
  title: Enter EM Revise
  trigger:
    type: state_entered
    value: EM.REVISE
  specs:
  - id: EMB-12-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant entering EM Revise MAY evaluate the revision proposal and answer
      its Invite with `Accept(Invite(EmbargoEvent))` or `Reject(Invite(EmbargoEvent))`, or
      counter-propose a further revision with EV.
    rationale: >-
      EM Revise means an active embargo has a pending revision proposal. The
      participant must evaluate the proposed new terms and either accept, reject,
      or counter-propose to move the EM process forward. Its answer is its own
      consent (MSM-07-003, MSM-07-004); the Case Owner's EC or EJ decides the revision
      for the case (MSM-02-005, MSM-02-004).
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - REVISE
      description: EM state is Revise
    relationships:
    - rel_type: refines
      spec_id: VP-04-005
      note: Once accepted, revisions MAY be proposed, which MAY be accepted or rejected
    stories:
    - story_2026_083

  - id: EMB-12-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A Participant in RM Closed or Deferred (q^rm ∈ {C, D}) in EM Revise
      while other Participants remain engaged MUST NOT automatically terminate
      the embargo due to their own RM state.
    rationale: >-
      VP-13-009 applies equally in Revise state. A single Participant's closure
      or deferral SHALL NOT automatically terminate the embargo. The embargo
      remains in force even when one Participant's engagement has declined.
    testable: true
    preconditions:
    - em_state:
        - REVISE
      rm_state:
        - CLOSED
        - DEFERRED
      description: Participant is in RM Closed/Deferred; EM state is Revise
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-13-009
      note: >-
        A Participant's closure or deferral SHALL NOT automatically terminate
        the embargo
    stories:
    - story_2022_066

  - id: EMB-12-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant who intends to change their adherence stance while an embargo
      is in Revise state SHOULD communicate that intent clearly to other
      Participants.
    rationale: >-
      VP-13-008 requires communicating changes to embargo adherence. This applies
      during revision negotiations as well as during the stable Active state.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - REVISE
      description: EM state is Revise
    relationships:
    - rel_type: refines
      spec_id: VP-13-008
      note: Changes to adherence intention SHOULD be communicated clearly
    stories:
    - story_2022_015

- id: EMB-13
  title: Enter EM Exited
  trigger:
    type: state_entered
    value: EM.EXITED
  specs:
  - id: EMB-13-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering EM Exited SHOULD treat no participant as bound by an
      embargo. The embargo register's `ACTIVE` entry is `TERMINATED`, and no consent
      row is written (MSM-07-025, ADR-0118, ADR-0122).
    rationale: >-
      Once the embargo exits, no consent row binds anyone: with no `ACTIVE`
      register entry nobody is a signatory, and a register with a `TERMINATED`
      entry accepts no further change (ADR-0122), so no later
      invitation to the terminated embargo can rebind anyone. The position is
      derived from the case, so it is not copied onto each participant record.
    adr:
    - ADR-0118
    - ADR-0122
    testable: true
    preconditions:
    - em_state:
        - EXITED
      description: EM state is Exited
    steps:
    - order: 1
      actor: participant
      action: >-
        Terminate the register's `ACTIVE` entry; write no Participant consent row
      expected: No Participant is bound by an embargo; consent rows are as they were
    postconditions:
    - description: No active embargo and no signatory; EM state is terminal EXITED
    stories:
    - story_2026_001
    see_also:
    - spec_id: MSM-07-025
      reason: 'context for the reader'

  - id: EMB-13-003
    priority: MUST
    kind: protocol
    statement: >-
      When the end time of the embargo in force has passed, the CASE_MANAGER
      MUST end it with the reason `END_TIME_REACHED`, through one idempotent
      termination path.
      Two ways reach that path. One is the CASE_MANAGER's own lazy check when it
      next handles the case, for an inbound activity or one of its own triggers.
      The other is an outside request to end the embargo at its end time, such as
      from a Sentinel that monitors embargo timers.
      A request to end the embargo early, made after its end time, takes the same
      path.
      Each way commits the CASE_MANAGER's `Remove(EmbargoEvent)` with `content`
      `END_TIME_REACHED` and runs the full termination cascade.
      The outside request is made to the CASE_MANAGER itself. A `Remove` from the
      Case Owner is the owner's own message, ledgered on receipt like any other.
    rationale: >-
      VP-04-001 requires every accepted embargo to have an end time, so every
      embargo reaches one; recording the end as a termination keeps EM derived
      from the register, and lets the content gate stop withholding content
      under an embargo that has expired. The lazy check needs no scheduler;
      the outside request lets a deployment end an embargo on time without
      waiting for the next activity on the case. One path keeps the two from
      both committing: a register with a `TERMINATED` entry accepts no further
      change (ADR-0122).
    verification: >-
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py`
      covers the lazy check, the outside request, the order of the two, a
      race between them, an early request after the end time, and the lazy
      check composed into the one tree that handles a participant's received
      activity or a case-scoped trigger (CLP-10-025, ADR-0135), including an
      accept of a pending revision that cannot extend the expired embargo;
      `test/core/use_cases/received/test_termination_reason.py`
      covers the refusal of an early `END_TIME_REACHED` at the CASE_MANAGER and
      at a replica, and a Case Owner's `Remove` after the termination.
    testable: true
    lint_suppress:
    - testable_without_steps
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      description: An embargo is in force and its end time has passed
    postconditions:
    - description: >-
        The register's ACTIVE entry is TERMINATED with reason
        END_TIME_REACHED, every open proposal CANCELLED, EM EXITED, and the
        teardown announced
    adr:
    - ADR-0122
    stories:
    - story_2022_010
    - story_2022_026
  - id: EMB-13-006
    priority: MUST
    kind: protocol
    statement: >-
      Whichever of the lazy check and the outside request (EMB-13-003) arrives after
      the embargo has ended MUST commit nothing.
    rationale: >-
      One path keeps the two from both committing: a register with a `TERMINATED`
      entry accepts no further change (ADR-0122).
    verification: >-
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py`
      (`test_lazy_check_on_an_ended_embargo_commits_nothing`,
      `test_lazy_check_after_the_sentinel_commits_nothing`,
      `test_racing_lazy_check_and_sentinel_commit_one_termination`) confirms the
      later arrival commits nothing.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-003
    stories:
    - story_2022_010
    - story_2022_026
  - id: EMB-13-007
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST answer an end-time request (EMB-13-003) that arrives after
      the embargo has ended as already done.
    rationale: >-
      The requester asked for an outcome the case already holds, so the answer tells
      it the embargo is ended rather than refusing it.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py`
      (`test_sentinel_after_the_lazy_check_is_answered_as_already_done`) confirms the
      later request is answered as already done.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-003
    stories:
    - story_2022_010
    - story_2022_026
  - id: EMB-13-008
    priority: MUST
    kind: protocol
    statement: >-
      An `END_TIME_REACHED` termination claimed before the embargo's end time MUST be
      refused, by the CASE_MANAGER before it commits and by a replica that replays
      it.
    rationale: >-
      An `END_TIME_REACHED` reason claims the end time has passed. A claim made before
      then is false, and the content gate would stop withholding content under an
      embargo that is still in force.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py`
      (`test_sentinel_request_before_the_end_time_is_refused`) and
      `test/core/use_cases/received/test_termination_reason.py`
      (`test_case_manager_refuses_an_end_time_remove_before_the_end_time`,
      `test_case_manager_judges_an_end_time_remove_by_the_embargo_in_force`,
      `test_replica_replay_refuses_an_end_time_entry_before_the_end_time`) confirm
      the refusal at the CASE_MANAGER and at a replica;
      `test/core/use_cases/received/test_embargo_ending_notices.py`
      (`test_paused_replica_refuses_an_early_expiry_remove_of_a_revision`,
      `test_paused_replica_refuses_expiry_of_a_longer_revision`) confirms it at a
      paused replica, judged by the revision the `Remove` names.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-003
    stories:
    - story_2022_010
    - story_2022_026

  - id: EMB-13-004
    priority: MUST
    kind: protocol
    statement: >-
      A termination `Remove(EmbargoEvent)` MUST carry what ended the embargo in
      `content`, exactly `END_TIME_REACHED` or `EARLY`. Its `summary` carries a
      human-readable account the protocol does not read.
    rationale: >-
      The what is all a receiver needs to apply a termination and to check it
      against the end time; the why records the decision. A cause is a kind
      with its own details, so a new cause (adversary awareness, exploit code
      held by adversaries, a participant's leak) is a new kind rather than a
      change to a closed list (ADR-0122).
    verification: >-
      `test/core/use_cases/received/test_termination_reason.py`
      (`test_parse_edge_promotes_the_reason_onto_the_event`) and
      `test/core/models/test_embargo_termination.py`
      (`test_the_wire_what_has_exactly_two_values`) cover the two values of the
      what.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    stories:
    - story_2022_080
    - story_2022_026
  - id: EMB-13-009
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST refuse, at the parse edge, a termination `Remove(EmbargoEvent)`
      whose `content` is anything other than `END_TIME_REACHED` or `EARLY`
      (EMB-13-004).
    rationale: >-
      The what is all a receiver needs to apply a termination and to check it against
      the end time, so a termination without a valid what cannot be applied.
    verification: >-
      `test/core/use_cases/received/test_termination_reason.py`
      (`test_parse_edge_refuses_a_remove_without_a_termination_reason`) and
      `test/core/models/test_embargo_termination.py`
      (`test_content_that_is_not_a_reason_is_refused`) cover the parse-edge
      check.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-004
    stories:
    - story_2022_080
    - story_2022_026
  - id: EMB-13-010
    priority: MUST
    kind: protocol
    statement: >-
      The `TERMINATED` register entry MUST record the termination's reason (the what)
      and, when known, a structured cause (the why).
      The cause is an object discriminated on `kind`, whose details depend on the
      kind.
      One kind is `THREAT_SIGNAL`, with the signals (`P`, `X`, `A`) that ended the
      embargo, distinct and in that order.
      Another, `FIX_READY`, has the vendor participants whose readiness made the
      quorum (VP-09-007).
      The other kinds are `FIX_DEPLOYED`, and `OTHER`, whose account is the
      `summary`.
    rationale: >-
      The why records the decision. A cause is a kind with its own details, so a new
      cause (adversary awareness, exploit code held by adversaries, a participant's
      leak) is a new kind rather than a change to a closed list (ADR-0122).
    verification: >-
      `test/core/use_cases/received/test_termination_reason.py`
      (`test_case_manager_records_an_early_remove_as_early`) and
      `test/core/models/test_embargo_termination.py` cover the recorded what and the
      why for `THREAT_SIGNAL`;
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_an_early_termination_records_each_new_cause_kind`) builds an `EARLY`
      termination with each of `FIX_READY`, `FIX_DEPLOYED` and `OTHER`.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-004
    stories:
    - story_2022_080
    - story_2022_026
    see_also:
    - spec_id: VP-09-007
      reason: 'context for the reader'
  - id: EMB-13-011
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An `END_TIME_REACHED` termination MUST NOT record a cause (EMB-13-010). Every
      cause kind is `EARLY`, and an `EARLY` termination with no cause is valid and
      records the what alone.
    rationale: >-
      A cause explains why an embargo ended before its end time. An embargo that ran
      to its end time has no such cause.
    verification: >-
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_every_cause_kind_is_early_and_end_time_has_none`,
      `test_an_early_termination_with_no_cause_records_the_what_alone`) refuses each
      cause on `END_TIME_REACHED` and records an `EARLY` termination with no
      cause.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-010
    stories:
    - story_2022_080
    - story_2022_026

  - id: EMB-13-005
    priority: MUST
    kind: protocol
    statement: >-
      A termination `Remove(EmbargoEvent)` whose termination has a cause
      (EMB-13-010) MUST carry it as `terminationCause`.
    rationale: >-
      One ledger entry is one activity, and the termination's entry is the
      whole `TERMINATE` register step (ADR-0124), so the why reaches a replica
      replaying the ledger only if the `Remove` carries it. A threat signal is
      a fact about the case that every participant learns from a status
      entry; naming it on a `Remove` while the case status does not show it
      would leave the register and the status disagreeing, and reading the
      `Remove` as a status change would commit one no participant sent
      (ADR-0122).
    verification: >-
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_parse_edge_promotes_a_carried_cause_onto_the_event`,
      `test_the_factory_carries_the_cause_as_termination_cause`) parses a `Remove`
      carrying each cause kind.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: uses_definition
      spec_id: EMB-13-010
      note: Carries the recorded cause on the wire so replicas can copy it
    stories:
    - story_2022_080
    - story_2022_026
  - id: EMB-13-012
    priority: MUST
    kind: protocol
    statement: >-
      At the parse edge, a receiver MUST refuse a bad `terminationCause` (EMB-13-005).
      A cause is bad when its `kind` is unknown, when a detail is missing or malformed,
      or when the termination is `END_TIME_REACHED`.
    rationale: >-
      A cause the receiver cannot read, or one on a termination that can have none
      (EMB-13-011), would put a `TERMINATED` entry in the register that no other
      node can reproduce.
    verification: >-
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_parse_edge_refuses_a_malformed_cause`,
      `test_parse_edge_refuses_a_cause_on_an_end_time_termination`) refuses each
      malformed cause and a cause on `END_TIME_REACHED`.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-005
    stories:
    - story_2022_080
    - story_2022_026
  - id: EMB-13-013
    priority: MUST
    kind: protocol
    statement: >-
      A `FIX_READY`, `FIX_DEPLOYED` or `OTHER` cause on the Case Owner's `Remove` to the
      CASE_MANAGER is the owner's claim.
      The CASE_MANAGER MUST record it as given.
    rationale: >-
      These causes are the owner's account of its own decision, which the
      CASE_MANAGER has no grounds to check against its own view of the case.
    verification: >-
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_case_manager_records_an_owner_cause_as_given`,
      `test_an_owner_fix_ready_cause_is_not_checked_against_the_vendors`) records an
      owner's `FIX_READY` cause whose vendors are not fix-ready as given.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-005
    stories:
    - story_2022_080
    - story_2022_026
  - id: EMB-13-014
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a `THREAT_SIGNAL` cause on the Case Owner's `Remove`
      before it is committed. The refusal's reason directs the sender to a case
      status update that sets `P`, `X` or `A`, the way a threat signal ends an
      embargo.
    rationale: >-
      A threat signal is a fact about the case that every participant learns from a
      status entry. Naming it on a `Remove` while the case status does not show it
      would leave the register and the status disagreeing, and reading the `Remove`
      as a status change would commit one no participant sent (ADR-0122).
    verification: >-
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_an_owner_threat_signal_cause_is_refused_before_the_commit`) refuses an
      owner's `THREAT_SIGNAL` with a reason naming the case status update.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-005
    stories:
    - story_2022_080
    - story_2022_026
  - id: EMB-13-015
    priority: MAY
    kind: protocol
    statement: >-
      A `Remove` that the CASE_MANAGER sends MAY name `THREAT_SIGNAL` as its cause.
      No other `Remove` names it (EMB-13-014).
    rationale: >-
      The CASE_MANAGER ends an embargo on a threat signal it has adopted into the case
      status, so its `Remove` and the status agree.
    verification: >-
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_the_threat_cascade_remove_carries_the_signals_it_records`) confirms the
      CASE_MANAGER's threat cascade `Remove` carries the signals it records.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    stories:
    - story_2022_080
    - story_2022_026
    see_also:
    - spec_id: EMB-13-014
      reason: 'context for the reader'
  - id: EMB-13-016
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST record, on its `TERMINATED` entry, the cause that the
      termination's ledger entry carries.
    rationale: >-
      One ledger entry is one activity, and the termination's entry is the whole
      `TERMINATE` register step (ADR-0124), so the why reaches a replica replaying the
      ledger only if the `Remove` carries it.
    verification: >-
      `test/core/use_cases/received/test_termination_reason.py`
      (`test_replica_replay_copies_the_cause_the_entry_carries`) and
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_a_replica_copies_an_owner_fix_ready_cause`) assert the replica's
      `TERMINATED` entry equals the CASE_MANAGER's.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-005
    stories:
    - story_2022_080
    - story_2022_026
  - id: EMB-13-017
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A replica MUST NOT work a termination cause out from its own case state.
    rationale: >-
      A replica's own view can differ from the CASE_MANAGER's, such as threat signals
      its PXA does not carry. A cause it worked out would then disagree with the
      CASE_MANAGER's `TERMINATED` entry (CM-23-016).
    verification: >-
      `test/core/use_cases/received/test_termination_cause.py`
      (`test_a_replica_copies_signals_its_own_pxa_does_not_carry`) replays a
      termination whose threat signals differ from the replica's PXA and asserts the
      two `TERMINATED` entries are equal.
    testable: true
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0122
    relationships:
    - rel_type: extends
      spec_id: EMB-13-016
    stories:
    - story_2022_080
    - story_2022_026

  - id: EMB-13-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A Participant in EM Exited MUST NOT seek new embargoes or accept new
      embargo proposals (EP) for this case when the CS state is public
      (q^cs ∈ ···P··), exploit-public (q^cs ∈ ····X·), or attacks-observed
      (q^cs ∈ ·····A).
    rationale: >-
      VP-06-001 prohibits seeking new embargoes once public disclosure, exploit
      publication, or attacks have occurred. The EXITED state
      after any of these events is terminal for embargo negotiations on this case.
    testable: true
    preconditions:
    - em_state:
        - EXITED
      cs_pattern: "...P.."
      description: EM state is Exited; CS matches pattern ...P..
    - em_state:
        - EXITED
      cs_pattern: "....X."
      description: EM state is Exited; CS matches pattern ....X.
    - em_state:
        - EXITED
      cs_pattern: ".....A"
      description: EM state is Exited; CS matches pattern .....A
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
      note: >-
        No new embargo once public awareness, exploit publication or attacks
        have occurred
    stories:
    - story_2026_033

- id: EMB-14
  title: Actor-Voluntary Embargo Termination (Trigger Side)
  description: >-
    Trigger-side factory for voluntarily ending an active embargo (e.g., fix
    deployed or ready). "The actor" here is the actor enacting the CASE_MANAGER
    role: the factory's canonical case-state write (EM → EXITED, ledger commit,
    teardown announce) is gated on `CVDRole.CASE_MANAGER` (`terminate_embargo_bt`
    runs `ResolveCaseManagerNode` before the state mutation) and is authorised by
    the Case Owner by default (CM-02-005). A teardown that a received P, X or A
    report calls for is authorised by the Case Owner's adoption of that value,
    with no second gate (RSH-07-001, ADR-0166). A non-manager Participant
    that wishes to end an embargo does not run this trigger to write canonical
    state; it initiates termination by reporting the condition or notifying intent
    (VP-11-003, VP-13-017/018), and terminates only its own compliance. See
    CONCERN-3280 for the reconciliation of the participant-facing protocol prose
    with this authority model.
  trigger:
    type: state_entered
    value: EM.ACTIVE
  specs:
  - id: EMB-14-001
    priority: MUST
    kind: protocol
    statement: >-
      An actor that ends an active embargo early of its own accord MUST name its
      reason: a deployed fix, a ready fix, or another reason.
    rationale: >-
      Voluntary termination requires an auditable reason.
    verification: >-
      Tests in `test/core/behaviors/embargo/test_terminate_active_embargo_tree.py` run
      the termination once per reason, and `test_no_reason_ends_nothing` asserts that
      with no reason the embargo stays active.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise
    steps:
    - order: 1
      actor: actor
      action: Choose the termination reason (fix deployed, fix ready, or other)
      expected: Reason chosen
    postconditions:
    - description: A termination reason is chosen
    stories:
    - story_2022_080
    - story_2026_095
  - id: EMB-14-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor that names no reason MUST NOT end an active embargo early of its own
      accord.
    rationale: >-
      A termination with no reason gives the other participants nothing to audit
      (EMB-14-001).
    verification: >-
      `test/core/behaviors/embargo/test_terminate_active_embargo_tree.py`
      (`test_no_reason_ends_nothing`) asserts that with no reason the embargo stays
      active.
    testable: true
    postconditions:
    - description: EM state is unchanged
    relationships:
    - rel_type: derives_from
      spec_id: EMB-14-001
    stories:
    - story_2022_080
    - story_2026_095
  - id: EMB-14-006
    priority: MUST
    kind: protocol
    statement: >-
      An actor that ends an active embargo early of its own accord MUST record its
      reason as the termination's cause (EMB-13-010).
      The cause is `FIX_DEPLOYED`, `FIX_READY` or `OTHER` respectively, never an `EARLY`
      termination with no cause.
    rationale: >-
      Recording the chosen reason as the cause carries it to every participant through
      the termination's ledger entry, where a cause-less `EARLY` termination would tell
      them only that the embargo ended.
    verification: >-
      Tests in `test/core/behaviors/embargo/test_terminate_active_embargo_tree.py` run
      the termination once per reason and assert the `TERMINATED` entry's cause is
      `FIX_DEPLOYED`, `FIX_READY` or `OTHER` respectively.
    testable: true
    steps:
    - order: 1
      actor: actor
      action: Terminate the embargo, recording the chosen reason as its cause
      expected: ET emitted carrying the cause; EM transitions to EXITED
    postconditions:
    - description: EM state is EXITED; ET queued; termination cause recorded
    relationships:
    - rel_type: extends
      spec_id: EMB-14-001
    - rel_type: uses_definition
      spec_id: EMB-13-010
    stories:
    - story_2022_080
    - story_2026_095
  - id: EMB-14-004
    priority: MUST
    kind: project
    statement: >-
      The create_terminate_active_embargo_tree factory MUST require the actor to supply
      a termination reason (EMB-14-001) before delegating to terminate_embargo_bt.
    rationale: >-
      A tree that reached terminate_embargo_bt with no reason would end the embargo
      with nothing to audit, which EMB-14-005 forbids.
    adr:
    - ADR-0025
    verification: >-
      `test/core/behaviors/embargo/test_terminate_active_embargo_tree.py`
      (`test_no_reason_ends_nothing`) confirms that with no reason the tree ends
      nothing.
    relationships:
    - rel_type: implements
      spec_id: EMB-14-001
  - id: EMB-14-007
    priority: MUST
    kind: project
    statement: >-
      The create_terminate_active_embargo_tree factory MUST have the actor choose the
      reason through the matching Evaluator call-out point: ExitEmbargoWhenDeployed,
      ExitEmbargoWhenFixReady or ExitEmbargoForOtherReason. EmbargoExitPolicyGuard or
      EmbargoExitOverride (EMB-14-002, EMB-14-003) follows, then the OnEmbargoExit
      actuator.
    rationale: >-
      A Selector of Evaluator call-out points gives actors a clear interface with three
      choices, and it lets a deployment inject a policy-rule backend (ADR-0025). Each
      deployment can then supply the termination reason in its own way with no change to
      the tree.
    adr:
    - ADR-0025
    verification: >-
      `test/core/behaviors/embargo/test_terminate_active_embargo_tree.py` confirms the
      tree's second child is a Selector of the three reason call-out points
      (`test_child_1_is_reason_selector`, `test_reason_selector_has_three_children`),
      its third the policy guard with the override beside it
      (`test_child_2_is_authorize_selector`,
      `test_authorize_first_child_stochastic_is_policy_guard`,
      `test_authorize_second_child_stochastic_is_override`), and its fourth the
      OnEmbargoExit actuator
      (`test_child_3_on_embargo_exit_deterministic_is_always_succeed`).
    relationships:
    - rel_type: extends
      spec_id: EMB-14-004
    see_also:
    - spec_id: EMB-14-003
      reason: 'context for the reader'
  - id: EMB-14-002
    priority: MUST
    kind: project
    statement: >-
      The create_terminate_active_embargo_tree factory MUST include an
      EmbargoExitPolicyGuard Evaluator call-out point that runs after the
      reason Selector and before OnEmbargoExit.
    rationale: >-
      Separating the reason selection (actor intent) from the policy check
      (system authorization) allows external policy engines to block termination
      on grounds orthogonal to the stated reason (e.g., active revision
      negotiation, pending approvals) without coupling the guard logic to the
      reason semantics.
    verification: >-
      Inspection of `vultron/core/` confirms that `create_terminate_active_embargo_tree`
      places `EmbargoExitPolicyGuard` as a child node after the reason Selector and
      before the `OnEmbargoExit` actuator.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; reason Selector has succeeded
    steps:
    - order: 1
      actor: system
      action: Run EmbargoExitPolicyGuard call-out point
      expected: Returns SUCCESS (policy permits) or FAILURE (policy vetoes)
    postconditions:
    - description: >-
        SUCCESS: pipeline continues to OnEmbargoExit and terminate_embargo_bt.
        FAILURE: termination blocked; actor may retry with override.
    relationships:
    - rel_type: extends
      spec_id: EMB-14-007
  - id: EMB-14-008
    priority: MAY
    kind: project
    statement: >-
      EmbargoExitPolicyGuard (EMB-14-002) MAY veto termination whatever reason the
      actor chose.
    rationale: >-
      A policy engine can block termination on grounds orthogonal to the stated
      reason, such as an active revision negotiation or a pending approval.
    relationships:
    - rel_type: uses_definition
      spec_id: EMB-14-002

  - id: EMB-14-003
    priority: SHOULD
    kind: project
    statement: >-
      The create_terminate_active_embargo_tree factory SHOULD include an
      EmbargoExitOverride Evaluator call-out point in a Selector alongside
      EmbargoExitPolicyGuard.
    rationale: >-
      Providing an override seam lets actors exercise their authority to exit
      in exceptional circumstances without requiring code changes. The override
      is a distinct call-out point so that integrators can log, gate, or audit
      it separately from the normal policy path.
    testable: true
    preconditions:
    - em_state:
        - ACTIVE
        - REVISE
      description: >-
        EM state is Active or Revise; reason Selector succeeded;
        EmbargoExitPolicyGuard returned FAILURE
    steps:
    - order: 1
      actor: actor
      action: Invoke EmbargoExitOverride call-out point
      expected: Override accepted; pipeline continues to OnEmbargoExit
    postconditions:
    - description: Override recorded; termination proceeds; audit trail reflects override
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: extends
      spec_id: EMB-14-002
      note: Override is the fallback arm of the policy authorization Selector
  - id: EMB-14-009
    priority: SHOULD
    kind: project
    statement: >-
      When the actor explicitly accepts responsibility for overriding policy,
      EmbargoExitOverride (EMB-14-003) SHOULD return SUCCESS, so that termination
      proceeds despite a policy veto.
    rationale: >-
      The override exists so that an actor can exit in exceptional circumstances.
      It does so only when the actor takes responsibility for overriding the policy.
    relationships:
    - rel_type: extends
      spec_id: EMB-14-003

- id: EMB-15
  title: Inbound Embargo-Response Decision (Received Side)
  description: >-
    Behaviors triggered when an actor receives an inbound embargo overture and
    must decide how to respond. Two overture flows are distinguished: (Flow A)
    an EM-level embargo proposal (EP) proposing terms, whose acceptance moves
    the shared EM state; and (Flow B) a PEC-level invitation
    (Invite(EmbargoEvent)[context=VulnerabilityCase]) asking the actor to become
    a signatory to an embargo, whose acceptance advances that participant's
    Participant Embargo Consent (PEC) state. The pre-PEC simulator conflated
    these into a single _ChooseEmProposedResponse fallback; the production
    protocol separates the shared EM lifecycle (EMB-01..EMB-09) from
    per-participant consent (CM-18, ADR-0048). This group specifies a single
    decision seam layered over both flows: it selects the response (accept /
    reject / counter) while delegating the mechanical transition to the
    existing received and trigger BTs. The mechanics already exist
    (invite/accept/reject trees, propose/accept/reject trigger use cases); the
    decision layer chooses among them with a default-accept policy, decided by
    the deciding actor's own policy and approved by no other actor.
  trigger:
    type: message_received
    value: EP | InviteToEmbargoOnCase
  specs:
  - id: EMB-15-001
    priority: MUST
    kind: project
    statement: >-
      The inbound embargo-response decision seam MUST default to accepting a
      well-formed embargo overture (Flow A: EP proposing terms; Flow B:
      InviteToEmbargoOnCase).
    rationale: >-
      The recommended CVD behavior is to accept an offered embargo and negotiate
      revisions separately rather than block coordination. A deterministic
      accept-by-default keeps actors runnable without a human in the loop, and
      the DETERMINISTIC call-out bundle (BT-23) supplies the default. Structuring
      acceptance as an Evaluator call-out point lets the deciding actor's own UI
      or agent policy decide later without changing the tree.
    note: >-
      The seam's default is accept; it does not decide whether the seam runs. For a
      relayed revision Invite the Case Owner's answer is its own (EP-09-005, EP-09-006),
      so the Flow B tree reaches this seam for the owner only inside the prototype's
      bounded auto-accept (EM `NONE`, terms within the owner's policy duration) and holds
      the answer otherwise (#4179). A non-owner participant always reaches the seam.
    verification: >-
      Integration tests in `test/demo/` confirm that an inbound EP or
      InviteToEmbargoOnCase is accepted by default under the DETERMINISTIC bundle,
      with EvaluateEmbargoProposal returning SUCCESS and delegating to the
      appropriate acceptance BT.
    testable: true
    preconditions:
    - description: >-
        Inbound EP or InviteToEmbargoOnCase received; case is embargo-eligible
        (CS not public/exploit/attacks per EMB-01-002); no external
        adjudication backend injected (deterministic default in force).
    steps:
    - order: 1
      actor: system
      action: Run EvaluateEmbargoProposal Evaluator call-out point
      expected: Returns SUCCESS (default-accept) under the DETERMINISTIC bundle
    - order: 2
      actor: system
      action: Delegate to the flow-appropriate acceptance BT
      expected: >-
        Flow A activates/records via accept_embargo_trigger_bt; Flow B marks
        the consent row AGREED via accept_invite_to_embargo_tree
    postconditions:
    - description: >-
        Overture accepted by default; EM (Flow A) or PEC (Flow B) advanced by
        the existing mechanism
    stories:
    - story_2026_004
    - story_2022_006
  - id: EMB-15-005
    priority: MUST
    kind: project
    statement: >-
      When no external adjudication backend is injected, the EvaluateEmbargoProposal
      Evaluator call-out point MUST return SUCCESS so the actor accepts by default,
      delegating to the existing acceptance mechanism (`accept_embargo_trigger_bt`
      for Flow A; `accept_invite_to_embargo_tree` for Flow B).
    rationale: >-
      A deterministic accept-by-default keeps actors runnable without a human in
      the loop; the DETERMINISTIC call-out bundle (BT-23) supplies the default.
    verification: >-
      Inspection of `vultron/core/` confirms that the DETERMINISTIC call-out bundle
      resolves `EvaluateEmbargoProposal` to a node that unconditionally returns
      SUCCESS when no external backend is injected.
    relationships:
    - rel_type: refines
      spec_id: EMB-15-001

    stories:
    - story_2026_004
    - story_2022_006
  - id: EMB-15-013
    priority: MUST_NOT
    kind: project
    statement: >-
      The decision seam MUST NOT make the deciding actor's answer wait on
      another actor's approval. Only `EvaluateEmbargoProposal` decides whether
      the accept arm runs, whether or not the deciding actor is the Case Owner.
    rationale: >-
      A participant's answer to an embargo Invite records only its own consent
      row (CM-18, ADR-0122), so the Case Owner has nothing to approve. A gate
      that asks another actor for a decision is a protocol ask, not a call-out
      point (BT-18-014). The CASE_MANAGER never runs this seam for its own
      consent. A gate where the Case Owner delegates activation to the
      CASE_MANAGER belongs on the CASE_MANAGER's activation path (#6045).
    verification: >-
      In `test/core/behaviors/embargo/test_response_decision_tree.py`,
      `TestAcceptArm::test_accept_arm_has_two_children` and
      `TestAcceptArm::test_accept_arm_first_child_name` confirm the accept arm
      is `EvaluateEmbargoProposal` then the accept delegate, and
      `TestBTBridgeIntegration::test_non_owner_answer_follows_evaluate_alone`
      confirms a non-owner's answer follows `EvaluateEmbargoProposal` alone.
    relationships:
    - rel_type: extends
      spec_id: EMB-15-001
    - rel_type: refines
      spec_id: BT-18-014
    stories:
    - story_2022_046
    - story_2022_006
  - id: EMB-15-006
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/core/behaviors/embargo/test_response_decision_tree.py::TestBTBridgeIntegration::test_case_owner_answer_follows_evaluate_alone`
      confirms the Case Owner's response is decided by `EvaluateEmbargoProposal`
      alone, with no approval call-out.
    statement: >-
      When the deciding actor holds `CVDRole.CASE_OWNER`, the owner's stated
      response is authoritative and the seam MUST NOT require external approval.
    rationale: >-
      The CASE_OWNER is the human decision-maker whose choice is gospel; requiring
      external approval for the owner's response would violate the authorization model.
    relationships:
    - rel_type: refines
      spec_id: EMB-15-013
  - id: EMB-15-003
    priority: SHOULD
    kind: project
    statement: >-
      For Flow A (EP proposing terms), the decision seam SHOULD provide a
      counter-proposal arm gated by a WillingToCounterEmbargoProposal Evaluator
      call-out point.
    rationale: >-
      A counter-proposal is operationally identical to proposing: the propose
      trigger already records a "counter-proposed, no state change" outcome when
      invoked in PROPOSED. Countering is intentionally low-automation and off by
      default; the recommended path is accept-then-revise.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      description: >-
        Flow A only; inbound EP received; actor declined to accept outright and
        the adjudication arm elects to counter
    steps:
    - order: 1
      actor: system
      action: Run WillingToCounterEmbargoProposal Evaluator call-out point
      expected: SUCCESS elects the counter arm; FAILURE (default) skips it
    postconditions:
    - description: >-
        The counter arm runs only when WillingToCounterEmbargoProposal succeeds
    relationships:
    - rel_type: extends
      spec_id: EMB-15-001
  - id: EMB-15-011
    priority: MUST_NOT
    kind: project
    statement: >-
      The counter-proposal arm (EMB-15-003) MUST NOT introduce a new mechanism.
      When the arm is taken, the seam delegates to the existing embargo proposal
      trigger, propose_embargo_trigger_bt via SvcProposeEmbargoUseCase.
      That trigger emits a fresh EP while the EM state remains PROPOSED.
    rationale: >-
      Modeling counter as routing to the existing trigger avoids duplicate mechanism
      and keeps the EM lifecycle single-sourced.
    verification: >-
      `test/core/behaviors/embargo/test_response_decision_tree.py`
      (`test_counter_arm_second_child_is_delegate`,
      `test_flow_a_counter_delegation_when_willing`) confirms the counter arm ends in
      a delegate and that taking the arm ticks the supplied counter tree.
    testable: true
    steps:
    - order: 1
      actor: actor
      action: Delegate to propose_embargo_trigger_bt with new terms
      expected: New EP emitted; EM remains PROPOSED (counter recorded)
    postconditions:
    - description: >-
        Counter EP emitted via the existing proposal mechanism; no new
        counter-specific transition introduced
    relationships:
    - rel_type: extends
      spec_id: EMB-15-003
  - id: EMB-15-012
    priority: SHOULD
    kind: project
    statement: >-
      The default DETERMINISTIC backend for the WillingToCounterEmbargoProposal
      call-out point (EMB-15-003) SHOULD return FAILURE, so that the seam does not
      counter.
    rationale: >-
      The recommended practice is to accept and then revise rather than to counter,
      so countering is off by default.
    relationships:
    - rel_type: extends
      spec_id: EMB-15-003

  - id: EMB-15-004
    priority: MUST
    kind: protocol
    statement: >-
      An actor that rejects an embargo overture MUST answer with the activity that
      matches what it rejects. The Case Owner deciding a proposal for the case sends ER,
      its `Reject(EmbargoEvent)[target=VulnerabilityCase]`, which returns the shared EM
      to NONE
      (EMB-06, MSM-07-009). A participant answering an embargo Invite sends a `Reject`
      of the Invite, which records only its own consent (MSM-07-004). That Reject marks
      the rejected embargo's row DECLINED. A signatory refusing proposed terms keeps its
      row for the embargo in force (MSM-07-015).
    rationale: >-
      A proposal and an Invite carry different EM and consent semantics, so the
      rejection has to match the overture for every participant to read it the same
      way. The pre-public constraint (EMB-01-002) is a hard protocol rule that overrides
      any local acceptance policy.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_reject.py`
      (`test_non_manager_owner_reject_asks_the_manager_to_reject`) confirms the Case
      Owner's rejection of a proposal is
      `Reject(EmbargoEvent)[target=VulnerabilityCase]`, and
      `test/core/behaviors/embargo/nodes/test_invite_answer.py`
      (`test_queues_the_answer_to_the_case_manager`) confirms an invitee's rejection of
      an embargo Invite is a `Reject` of it, addressed to the CASE_MANAGER.
    testable: true
    preconditions:
    - description: >-
        Inbound overture received; decision resolves to reject, OR CS is
        public/exploit/attacks forcing rejection (EMB-01-002)
    steps:
    - order: 1
      actor: participant
      action: Answer with the rejection that matches the overture
      expected: >-
        The Case Owner's decision on a proposal is ER (EM → NONE); an embargo Invite
        gets a Reject of the Invite, recording DECLINED
    postconditions:
    - description: Overture rejected with the activity that matches it
    stories:
    - story_2026_087
    - story_2022_027
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-07-009
    - rel_type: uses_definition
      spec_id: MSM-07-004
    see_also:
    - spec_id: MSM-07-015
      reason: 'context for the reader'
  - id: EMB-15-009
    priority: MAY
    kind: protocol
    statement: >-
      The Case Owner MAY send a `Reject(Invite(EmbargoEvent))` besides its decision for
      the case. That Reject records only the owner's own consent, like any sender's
      (MSM-07-004).
    rationale: >-
      The owner is also a participant with a consent row of its own. Its decision for
      the case is a separate activity (MSM-07-009, ADR-0122), so its Invite answer
      decides nothing for the case.
    verification: >-
      `test/core/services/embargo_lifecycle/test_answers.py`
      (`test_reject_embargo_invite_signatory_owner_rejecting_first_proposal_declines`)
      confirms the owner's Reject of an Invite declines only its own row.
    adr:
    - ADR-0122
    stories:
    - story_2026_087
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-07-004
  - id: EMB-15-010
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST send the refusal EMB-01-002 requires whatever its own decision
      on the overture would have been.
    rationale: >-
      The pre-public constraint (EMB-01-002) is a hard protocol rule that overrides any
      local acceptance policy, so no decision seam may answer in its place.
    verification: >-
      `test/core/behaviors/embargo/test_refusal_tree.py`
      (`test_the_factory_builds_each_refusal_in_place`) confirms the P/X/A refusal is a
      diversion that answers before the received tree's decision runs.
    relationships:
    - rel_type: refines
      spec_id: EMB-01-002
      note: Mandatory rejection when public/exploit/attacks overrides default-accept
    stories:
    - story_2026_033
  - id: EMB-15-008
    priority: MUST
    kind: project
    statement: >-
      When its embargo-response decision seam resolves to reject, this codebase MUST
      delegate to the existing rejection mechanism (EMB-15-004) rather than duplicate
      the transition.
      The mechanism follows the overture's flow: reject_embargo_trigger_bt for Flow A,
      and the invitee's Reject of the Invite for Flow B.
    note: >-
      In this prototype the owner's auto-answer to a Flow B Invite is its decision for
      the case, not a Reject of the Invite. The rejection EMB-01-002 requires, whatever
      the adjudication outcome, is EMB-15-010.
    rationale: >-
      The rejection paths already carry the EM and consent semantics. If the decision
      layer re-implemented the transition, the two copies could drift apart, and a
      rejection could then change EM or consent in a way the rejection trigger does not.
      When the decision layer selects among the existing paths, one implementation
      decides each rejection.
    verification: >-
      `test/core/behaviors/embargo/test_response_decision_tree.py`
      (`test_reject_arm_is_last_child_without_counter`,
      `test_flow_a_reject_delegation_when_all_arms_fail`) confirms the reject arm is the
      decision tree's last child and that Flow A delegates to the existing rejection
      trigger when every other arm fails.
    relationships:
    - rel_type: implements
      spec_id: EMB-15-004
- id: EMB-16
  title: CS Public/Exploit/Attacks Detected While EM Proposed
  description: >-
    Behaviors required when a Participant detects that the vulnerability has
    become public (q^cs ∈ ···P··), an exploit is available (q^cs ∈ ····X·),
    or attacks have been observed (q^cs ∈ ·····A) while the case EM state is
    still Proposed (q^em ∈ P). Embargo negotiation is not viable in any of
    these states; the proposed embargo MUST be abandoned.
  trigger:
    type: state_entered
    value: CS.public_exploit_attacks
  specs:
  - id: EMB-16-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in EM Proposed (q^em ∈ P) MUST abandon the proposed embargo when it
      detects a CS transition into P, X or A.
      The P state is public (q^cs ∈ ···P··), X is exploit-available (q^cs ∈ ····X·), and
      A is attacks-observed (q^cs ∈ ·····A).
      It cancels each open proposal in the case's embargo register, so EM derives None
      (q^em P → N).
      The CASE_MANAGER cancels a proposal it received with its ER,
      `Reject(Invite(EmbargoEvent))`, committed as `reject_invite_to_embargo_on_case`.
      It cancels a proposal it made itself with its `Undo(Invite(EmbargoEvent))`,
      committed as `undo_invite_to_embargo_on_case`.
      After either, it sends its `Undo(Invite(EmbargoEvent))` of each Invite it relayed
      for that proposal.
      A proposal never relayed is cancelled all the same.
    rationale: >-
      EMB-01-002 establishes that embargo negotiation is not viable once public
      disclosure, exploit availability, or attacks have occurred. EMB-01-002 is
      framed as a guard on receiving EP, but the same viability constraint
      applies when a P/X/A state change arrives while a proposal is already in
      flight. Continuing to negotiate a proposed embargo in these conditions
      would be misleading to other Participants and counter to the purpose of
      coordinated disclosure. CANCEL records that nobody decided the proposal
      (ADR-0122). An actor undoes only an activity it performed, so
      withdrawing an Invite one sent is an `Undo` and declining one received
      is a `Reject`; a CASE_MANAGER act with a participant's verb and object
      carries the participant's semantic type (ADR-0152).
    note: >-
      Under ADR-0113 the abandonment is shared EM state, so the CASE_MANAGER
      makes it for the case (EP-09-008): it cancels each open proposal, so EM
      derives NONE, and its committed entries are what notifies every other
      Participant (EP-09-007, EP-09-009). Each activity is addressed to
      nobody. A replica tells the CASE_MANAGER's Reject, which cancels the
      proposal, from a participant's, which records DECLINED, by the
      payload's `actor` (SE-03-004); each Undo after the cancel finds the
      proposal cancelled and changes nothing. A Participant that is not the
      CASE_MANAGER meets this requirement through its replica, which moves
      when the entries are replayed; it emits no ER of its own as the
      abandonment (EMB-16-002). That is separate from EMB-01-002: a
      proposal, Invite or revision a Participant receives while the case is
      at P/X/A is still answered by that Participant with its own `Reject` of
      the Invite.
    verification: >-
      `test/core/behaviors/embargo/nodes/test_abandon.py` runs
      `reject_proposed_embargo_bt` as the CASE_MANAGER and asserts EM is NONE,
      no proposal is open, one Reject per received proposal and one Undo per
      relayed Invite are committed, and an own proposal is withdrawn with an
      Undo; `test_embargo_abandonment_effect.py` replays both shapes on a
      replica;
      `test/core/behaviors/status/test_add_case_status_bt.py` drives the same
      abandonment through `ThreatTerminationBranchNode` on a received
      P/X/A status.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
      description: EM state is Proposed
    - cs_pattern: "...P.."
      description: CS transitions to public (q^cs ∈ ···P··)
    - cs_pattern: "....X."
      description: CS transitions to exploit-available (q^cs ∈ ····X·)
    - cs_pattern: ".....A"
      description: CS transitions to attacks-observed (q^cs ∈ ·····A)
    steps:
    - order: 1
      actor: system
      action: >-
        Detect that CS has transitioned to a P/X/A state while EM is Proposed
      expected: >-
        An open proposal is recognised
    - order: 2
      actor: system
      action: >-
        As the CASE_MANAGER, cancel each open proposal: commit its Reject of the
        proposal, or its Undo of an own proposal, then an Undo of each Invite relayed
        for it
      expected: >-
        Each proposal's register entry is CANCELLED and EM derives NONE; the
        entries are committed and replayed by every replica
    postconditions:
    - description: >-
        EM state is NONE; the abandonment is committed; proposed embargo
        abandoned
    adr:
    - ADR-0122
    - ADR-0152
    stories:
    - story_2022_080
    - story_2022_023
  - id: EMB-16-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant that abandons a proposed embargo on a P/X/A transition
      (EMB-16-001) MUST notify the other Participants.
    rationale: >-
      Continuing to negotiate a proposed embargo that is no longer viable would
      mislead the other Participants. The CASE_MANAGER's committed entries are the
      notice to every other Participant (EP-09-007, EP-09-009).
    verification: >-
      `test/core/behaviors/embargo/nodes/test_abandon.py`
      (`test_the_manager_abandons_every_open_proposal_and_commits_each`) asserts the
      CASE_MANAGER commits each cancelling activity.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-16-001
    adr:
    - ADR-0122
    stories:
    - story_2022_080
    - story_2022_023
  - id: EMB-16-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit the entries that abandon every open proposal
      (EMB-16-001) in one transaction (CLP-07-015).
    rationale: >-
      A partly committed abandonment would leave some proposals open after the case
      reached P/X/A, so the case's register and its replicas would disagree about
      which proposals are still open.
    verification: >-
      `test/core/behaviors/embargo/nodes/test_abandon.py`
      (`test_a_later_failed_commit_abandons_no_proposal`,
      `test_a_failed_undo_keeps_no_part_of_the_abandonment`) asserts a failed commit
      keeps no part of the abandonment.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-16-001
    - rel_type: refines
      spec_id: CLP-07-015
    adr:
    - ADR-0122
    stories:
    - story_2022_080
    - story_2022_023
  - id: EMB-16-005
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST apply each abandoned proposal's CANCEL once, from the entry that
      carries it (ADR-0152).
    rationale: >-
      The CASE_MANAGER's Reject cancels the proposal, and each Undo after it finds
      the proposal cancelled and changes nothing. Applying the CANCEL from its own
      entry keeps the replica's register equal to the CASE_MANAGER's.
    verification: >-
      `test/core/behaviors/sync/nodes/test_embargo_abandonment_effect.py`
      (`test_each_entry_drops_its_proposal_and_the_last_reaches_none`,
      `test_an_undo_after_the_reject_changes_nothing_more`) replays both shapes on a
      replica.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-16-001
    adr:
    - ADR-0152
    stories:
    - story_2022_080
    - story_2022_023
  - id: EMB-16-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule covers a Participant without the `CASE_MANAGER` role that detects a
      P/X/A CS transition while EM is Proposed.
      It MUST NOT emit ER as the abandonment of the case's open proposals.
    rationale: >-
      Abandoning the case's open proposals is a decision for the case, and only the
      actor that holds the CASE_MANAGER role writes shared EM state (EMB-16-001,
      EP-09-008). The P/X/A signal already reaches the CASE_MANAGER as a status
      declaration, and the CASE_MANAGER abandons the proposals when it detects that
      signal. A `Reject` of the Invite that another Participant sends arrives at the
      CASE_MANAGER as that Participant declining the proposal (MSM-07-004). The
      CASE_MANAGER records only that decline, so the `Reject` cannot abandon the
      proposals, and it misstates what the Participant meant.
    note: >-
      Two rules sit side by side. This one covers the abandonment of
      proposals already open on the case: only the CASE_MANAGER makes it.
      EMB-01-002 covers what a Participant receives: a proposal, Invite or
      revision that reaches it while it believes the case is at P, X or A is
      answered by that Participant with its own `Reject` of the Invite,
      CASE_MANAGER or not. That `Reject` is its own answer to something
      addressed to it, not an abandonment on the case's behalf, so EMB-16-002
      does not forbid it.
    verification: >-
      `test/core/behaviors/embargo/nodes/test_abandon.py` runs
      `reject_proposed_embargo_bt` as a non-manager and asserts nothing is
      queued or committed and EM is unchanged, and that after the
      CASE_MANAGER's abandonment no Participant's consent moved.
    relationships:
    - rel_type: extends
      spec_id: EMB-16-001
    - rel_type: refines
      spec_id: EP-09-008
    adr:
    - ADR-0113
    stories:
    - story_2026_059
  - id: EMB-16-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule covers a Participant without the `CASE_MANAGER` role that detects a
      P/X/A CS transition while EM is Proposed.
      It MUST NOT write the abandonment to its own EM state.
    rationale: >-
      Only the actor that holds the CASE_MANAGER role writes shared EM state
      (EMB-16-001, EP-09-008). Another Participant's EM moves when its replica replays
      the CASE_MANAGER's entries.
    verification: >-
      `test/core/behaviors/embargo/nodes/test_abandon.py`
      (`test_a_non_manager_neither_writes_nor_asks`) runs
      `reject_proposed_embargo_bt` as a non-manager and asserts EM is unchanged.
    relationships:
    - rel_type: extends
      spec_id: EMB-16-002
    - rel_type: refines
      spec_id: EP-09-008
    adr:
    - ADR-0113
    stories:
    - story_2026_059
- id: EMB-17
  title: Late Accept of an Expired Embargo Invitation
  description: >-
    Behaviors required when an `Accept(Invite(EmbargoEvent))` arrives after the
    invitation's RSVP deadline (CM-28-001) has passed. The protocol is liberal
    in what it accepts: a late accepter has signalled willingness to coordinate
    and MUST NOT be sent away. Codified by ADR-0065. Source: IDEA-2066.
    What decides the answer is whether the named embargo is still available
    (MSM-07-012), as for an on-time Accept, never the deadline.
    The trigger is a Participant's consent answer, which carries no protocol
    shorthand (MSM-02-010).
  trigger:
    type: message_received
    value: AcceptInviteToEmbargoOnCase
  specs:
  - id: EMB-17-001
    priority: MUST
    kind: protocol
    statement: >-
      A CASE_MANAGER receiving an `Accept(Invite(EmbargoEvent))` after the
      invitation's effective RSVP deadline MUST NOT reject it solely because the
      deadline has passed.
    rationale: >-
      Being liberal in what is accepted serves CVD outcomes. A late accepter is
      volunteering to coordinate; refusing them converts a missed deadline into
      a lost participant, which is worse for the case than a late consent.
      See ADR-0065.
    verification: >-
      Integration tests in `test/demo/` confirm that an `Accept(Invite(EmbargoEvent))`
      received after the RSVP deadline is not rejected on timeliness grounds and is
      evaluated against the case's EM state and Active Embargo per EMB-17-002,
      EMB-17-003, or EMB-17-004.
    testable: true
    preconditions:
    - description: The referenced invitation's effective RSVP deadline has passed
    postconditions:
    - description: >-
        The Accept is not refused on deadline grounds; one of EMB-17-002,
        EMB-17-003, or EMB-17-004 has been applied
    adr:
    - ADR-0065
    stories:
    - story_2022_013
    - story_2026_093
  - id: EMB-17-012
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST check whether a late `Accept(Invite(EmbargoEvent))` names
      an available embargo (MSM-07-012).
      Those are the case's Active Embargo and its open proposals (MSM-07-003), before
      their end time.
      It then applies EMB-17-002, EMB-17-003 or EMB-17-004.
    rationale: >-
      A late Accept can name the embargo in force, an open proposal, terms the case
      decided, replaced or let run out, or terms it never held. Each needs its own
      answer, read by the same test as for an on-time Accept. "Is this the Active
      Embargo" leaves out a case under proposal, and a test without the end time
      honours an Accept of terms that bind nobody. See ADR-0065.
    verification: >-
      `test/core/behaviors/embargo/nodes/test_accept_availability.py` confirms the one
      availability test reads the named entry's register status and its end time:
      `test_the_active_embargo_and_open_proposals_are_available` covers EM PROPOSED,
      ACTIVE and REVISE, `test_an_active_embargo_past_its_end_time_is_unavailable` an
      ACTIVE entry at and after its end time, and
      `test_the_condition_holds_only_for_the_embargos_availability` that exactly one
      answer's condition holds.
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_the_managers_reinvite_is_committed_and_replayed_by_a_replica`,
      `test_an_accept_of_an_active_embargo_past_its_end_time_is_refused`) drives the
      check on the late path.
    testable: true
    preconditions:
    - description: The referenced invitation's effective RSVP deadline has passed
    postconditions:
    - description: One of EMB-17-002, EMB-17-003, or EMB-17-004 has been applied
    relationships:
    - rel_type: extends
      spec_id: EMB-17-001
    - rel_type: refines
      spec_id: MSM-07-012
    - rel_type: uses_definition
      spec_id: MSM-07-003
    adr:
    - ADR-0065
    stories:
    - story_2022_013
    - story_2026_093
    see_also:
    - spec_id: EMB-17-002
      reason: 'context for the reader'
    - spec_id: EMB-17-003
      reason: 'context for the reader'
    - spec_id: EMB-17-004
      reason: 'context for the reader'
  - id: EMB-17-002
    priority: MUST
    kind: protocol
    statement: >-
      When the accepted embargo is available (MSM-07-012), the CASE_MANAGER MUST
      honour the late Accept.
      Available means the case's Active Embargo or one of its open proposals
      (MSM-07-003), before its end time.
      An ACTIVE entry past its end time is not available, so a late Accept of it is
      refused, not honoured.
      It marks the participant's consent row for that embargo AGREED, exactly as it
      would for an on-time Accept.
      A row at TIMED_OUT moves directly to AGREED (`TIMED_OUT → AGREED`, ADR-0118).
      So does one at DECLINED (`DECLINED → AGREED`, CM-18-003): the participant
      has changed its answer, so it is not re-invited first. The CASE_MANAGER
      honours it by committing the received Accept verbatim as
      `accept_invite_to_embargo_on_case`, carrying the row it states, as an
      on-time Accept is committed (EMB-17-009, ADR-0152).
    rationale: >-
      An answer the case can still record is sound whenever it arrives. The
      deadline governs whether the *invitation* is open, not whether the
      *agreement* is sound, and an open proposal's row takes an answer until the
      Case Owner decides it, so dropping a late Accept of an open proposal would
      hide a willing participant from that decision. See ADR-0065.
      The Accept states the change, so its entry is the change's entry
      (CLP-07-013), and a replica reaches the state an on-time Accept leaves.
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_an_honoured_late_accept_is_committed_and_replayed_by_a_replica`) confirms
      a late Accept naming the Active Embargo marks the accepter's consent row for it
      AGREED, so the accepter is a signatory.
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_a_late_accept_of_an_open_revision_is_honoured`) confirms a late Accept
      naming an open proposal is committed verbatim and moves the row for that
      proposal to AGREED from TIMED_OUT or DECLINED, while the accepter's row for
      the Active Embargo is unchanged.
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_an_accept_of_an_active_embargo_past_its_end_time_is_refused`) confirms a
      late Accept of an Active Embargo past its end time is refused and its row does
      not move to AGREED.
    testable: true
    preconditions:
    - em_state:
        - PROPOSED
        - ACTIVE
        - REVISE
      description: EM state is Proposed, Active or Revise
    - description: >-
        The accepted embargo is the case's Active Embargo or one of its open
        proposals, and its end time has not passed
    steps:
    - order: 1
      actor: system
      action: Record the PEC AGREE transition for the accepting participant
      expected: The participant's consent row for the accepted embargo is AGREED
    postconditions:
    - description: >-
        The participant's consent row for the accepted embargo is AGREED, so it is
        a signatory when that embargo is the Active Embargo
    relationships:
    - rel_type: refines
      spec_id: EMB-17-001
    - rel_type: uses_definition
      spec_id: MSM-07-012
    - rel_type: uses_definition
      spec_id: MSM-07-003
    - rel_type: uses_definition
      spec_id: CM-18-003
    adr:
    - ADR-0065
    - ADR-0118
    - ADR-0152
    stories:
    - story_2026_093
    - story_2022_013
  - id: EMB-17-003
    priority: MUST
    kind: protocol
    statement: >-
      An Accept, late or on time, may name an embargo the register holds but that is
      not available. The CASE_MANAGER refuses it with the refusal notice (MSM-07-012).
      When the case holds terms of its own, the CASE_MANAGER MUST also send the
      accepter a fresh `Invite(EmbargoEvent)` naming those terms.
      The fresh Invite goes alongside the refusal notice.
      The terms are the case's Active Embargo, while it is available.
      Otherwise they are its earliest-expiring available open proposal
      (EP-08-002).
      An accepting participant at TIMED_OUT moves `TIMED_OUT → INVITED` for the
      invited embargo (ADR-0118).
      The fresh Invite is a relay (EP-09-002). Its `actor` is the CASE_MANAGER.
      Its `attributedTo` names the invited embargo's proposer, or the CASE_MANAGER
      itself when it made the embargo as the protocol default, without a proposal.
    note: >-
      Only an available embargo is terms: a `PROPOSED` entry stays open after its
      embargo's end time, but an Invite to it can carry no RSVP deadline that
      EP-07-002 and EP-07-006 allow, and an ACTIVE entry past its end time binds
      nobody. A case whose embargoes have all ended thus holds no terms, and the
      accepter gets the refusal notice alone (EMB-17-004). The re-invite does not
      depend on lateness: what decides the answer is the named embargo, so an on-time
      Accept of terms the case replaced is asked about the current ones too
      (maintainer ruling on #5745, #6029). An accepter
      whose row for the terms is already INVITED or AGREED has been asked or has
      answered, and INVITE does not move that row (CM-18-003), so nothing is sent.
      A DECLINED or TIMED_OUT row is asked again: the late Accept shows the
      participant is now willing (maintainer decision on #5732, 2026-11-09).
    rationale: >-
      Recording the stale Accept as consent binds the participant to terms it never
      saw; refusing it alone leaves a willing participant unasked. The re-invite asks
      about the terms that bind, in a relay's shape (ADR-0152). Naming the Active
      Embargo alone leaves a case under proposal with nothing to invite to. The
      earliest-expiring proposal is the one a participant answers first (EP-08-001);
      arrival order would ask about superseded terms. See ADR-0065.
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_the_managers_reinvite_is_committed_and_replayed_by_a_replica`) confirms a
      late Accept naming an embargo the case has decided or replaced gets the refusal
      notice and a fresh `Invite(EmbargoEvent)` carrying the case's Active Embargo,
      without recording the stale Accept as consent.
      `test/core/behaviors/embargo/nodes/test_accept_availability.py`
      (`test_the_terms_are_the_earliest_ending_live_proposal`,
      `test_an_active_embargo_past_its_end_time_is_no_terms`) confirms the terms are
      the available Active Embargo, else the earliest-expiring open proposal whose
      embargo has not ended, and
      `test_an_accepter_already_asked_or_answered_is_not_asked_again` confirms an
      accepter whose row for those terms takes no INVITE is not asked again.
    testable: true
    preconditions:
    - description: >-
        The register holds the accepted embargo, but it is not available, and the
        case has an available Active Embargo or open proposal
    steps:
    - order: 1
      actor: system
      action: >-
        Emit the refusal notice and a fresh Invite(EmbargoEvent) to the accepting
        actor carrying the case's current terms
      expected: >-
        Accepting participant's consent row for the invited embargo is INVITED;
        stale Accept is not recorded as consent
    postconditions:
    - description: >-
        A fresh invitation for the case's current terms has been sent; the actor
        remains a case participant
    relationships:
    - rel_type: refines
      spec_id: EMB-17-001
    - rel_type: extends
      spec_id: MSM-07-012
    - rel_type: uses_definition
      spec_id: EP-08-002
    - rel_type: uses_definition
      spec_id: EP-09-002
    adr:
    - ADR-0065
    - ADR-0118
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_093
  - id: EMB-17-013
    priority: MUST
    kind: protocol
    statement: >-
      Once it has queued the fresh Invite of EMB-17-003 (SYNC-09-002), the CASE_MANAGER
      MUST commit it as `invite_to_embargo_on_case`. The invitee's `INVITED` row with
      the Invite's deadline follows it (CM-28-013).
    rationale: >-
      The re-invite asks about terms somebody proposed, exactly as a relay does, so it
      carries the relay's semantic type (ADR-0152). Committing it after it is queued
      lets a rebuilt send keep the same id (SYNC-09-002).
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_the_managers_reinvite_is_committed_and_replayed_by_a_replica`) confirms
      the re-invite is committed as `invite_to_embargo_on_case`, followed by the
      invitee's `INVITED` row.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-17-003
    - rel_type: refines
      spec_id: CM-28-013
    - rel_type: refines
      spec_id: SYNC-09-002
    adr:
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_093
  - id: EMB-17-014
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST apply the CASE_MANAGER's re-invite (EMB-17-003) through the
      relay slot, so that the Invite proposes nothing and EM does not move.
    rationale: >-
      The replica's register already holds the embargo the Invite names, so the
      Invite asks for consent to it and changes no embargo state (ADR-0152).
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_the_managers_reinvite_is_committed_and_replayed_by_a_replica`) and
      `test/core/behaviors/sync/nodes/test_embargo_relay_effect.py`
      (`test_a_reinvite_to_the_embargo_in_force_indexes_nothing`) confirm a replica
      applies the re-invite with no new proposal and no EM move.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-17-003
    adr:
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_093
  - id: EMB-17-005
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The accepted embargo is neither the Active Embargo nor an open proposal. The
      CASE_MANAGER MUST NOT then record the stale Accept as consent to the current
      terms.
    rationale: >-
      Recording the stale Accept as consent would make the participant a signatory
      to terms they never saw. An Accept of an open proposal is not stale: the case
      can still record it on that proposal's own row (EMB-17-002). See ADR-0065.
    relationships:
    - rel_type: extends
      spec_id: EMB-17-003
    adr:
    - ADR-0065
    stories:
    - story_2026_001
  - id: EMB-17-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the accepted embargo is not available, the CASE_MANAGER refuses the Accept
      (MSM-07-012). It MUST NOT refuse the accepting actor's participation: the
      refusal is of the Accept alone.
    rationale: >-
      Refusing a willing participant discards coordination capacity. The refusal
      notice says the answer is moot, never that the actor is unwelcome, and
      re-inviting to the current terms is the rest of the answer. See ADR-0065.
    verification: >-
      `test/core/use_cases/received/test_embargo_invite_lapse.py`
      (`test_late_accept_refused_when_em_exited`) and
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_a_late_accept_with_no_terms_gets_the_refusal_notice_alone`) refuse an
      Accept of a terminated embargo and assert the accepter is still a case
      participant.
    relationships:
    - rel_type: extends
      spec_id: EMB-17-003
    - rel_type: refines
      spec_id: MSM-07-012
    adr:
    - ADR-0065
    stories:
    - story_2026_001
  - id: EMB-17-004
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a case with no Active and no Proposed Embargo (EM EXITED or
      NONE). There, the CASE_MANAGER MUST answer a late Accept of an embargo its
      register holds with the refusal notice alone (MSM-07-012).
      A redelivery of the same Accept gets the same result.
    note: >-
      EMB-13-002 independently forbids seeking or accepting new embargoes for a
      case whose CS state is public, exploit-public, or attacks-observed. This
      entry closes the remaining gap: an Accept arriving after EM has EXITED
      while CS is not yet P/X/A previously had no specified behaviour.
    rationale: >-
      Follows the EMB-07-003 precedent for post-terminal messages: no transition.
      There is nothing to invite the actor to, so a fresh invitation would
      manufacture a negotiation nobody requested — but the actor's case
      participation is independent of embargo consent and MUST survive. The
      sender is still owed word that its answer did not count, which the refusal
      notice gives (CLP-05-001). An Accept of terms the case never held gets a
      processing fault instead (MSM-07-039). See ADR-0065.
    verification: >-
      Tests in `test/core/use_cases/received/test_embargo_answer_routing.py` and
      `test/core/use_cases/received/test_embargo_invite_lapse.py` confirm that a late Accept
      arriving when EM is EXITED or NONE is reported `REFUSED`, commits no ledger entry,
      queues the refusal notice and nothing else, and leaves every consent row
      unchanged, and that a redelivery, with or without its received body, is refused
      again and sends nothing more.
      `test/core/behaviors/embargo/nodes/test_accept_availability.py`
      (`test_a_case_with_no_active_or_proposed_embargo_holds_no_terms`) confirms such a
      case holds no terms to invite to.
    testable: true
    preconditions:
    - em_state:
        - EXITED
        - NONE
      description: EM state is EXITED (embargo terminated) or NONE (no embargo started)
    steps:
    - order: 1
      actor: system
      action: >-
        Refuse the Accept with the refusal notice, committing nothing and sending
        nothing else
      expected: >-
        Participant consent rows are unchanged; participant remains in the
        case; no ledger entry is committed and only the refusal notice is sent
    postconditions:
    - description: >-
        No embargo state change; accepting actor remains a case participant
    relationships:
    - rel_type: refines
      spec_id: EMB-17-001
    - rel_type: refines
      spec_id: MSM-07-012
    adr:
    - ADR-0065
    - ADR-0118
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_064
  - id: EMB-17-015
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT commit any ledger entry for a late Accept that arrives
      when the case has no Active Embargo and no Proposed Embargo (EMB-17-004).
    rationale: >-
      An entry acknowledging the Accept would change nothing at any receiver. The
      Accept is refused, and a refusal is never written to the ledger (CLP-04-007).
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_a_late_accept_with_no_terms_gets_the_refusal_notice_alone`)
      confirms that a late Accept arriving when EM is EXITED commits no ledger entry.
    testable: true
    relationships:
    - rel_type: part_of
      spec_id: EMB-17-004
    adr:
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_064
  - id: EMB-17-016
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule covers a late Accept of an embargo the register holds, in a case with
      no Active and no Proposed Embargo (EMB-17-004). The CASE_MANAGER MUST NOT send
      any activity in reply to it but the refusal notice.
    rationale: >-
      There is nothing to invite the actor to, so a fresh invitation would
      manufacture a negotiation nobody requested. The refusal notice is owed: it
      tells the sender its answer did not count (MSM-07-012).
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_a_late_accept_with_no_terms_gets_the_refusal_notice_alone`)
      confirms that a late Accept arriving when EM is EXITED queues the refusal
      notice and nothing else.
    testable: true
    relationships:
    - rel_type: part_of
      spec_id: EMB-17-004
    adr:
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_064
  - id: EMB-17-017
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST leave the participant's consent rows unchanged for a late
      Accept that arrives when the case has no Active Embargo and no Proposed Embargo
      (EMB-17-004). Nothing is recorded after a termination (EM EXITED), and a
      TIMED_OUT row stays TIMED_OUT when no embargo has started (EM NONE)
      (ADR-0118).
    rationale: >-
      The Accept names an embargo that is no longer, or not yet, in force, so no row
      can bind to it. The actor's case participation is independent of embargo
      consent and survives.
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_a_late_accept_with_no_terms_gets_the_refusal_notice_alone`)
      confirms that a late Accept arriving when EM is EXITED leaves every consent row
      unchanged.
    testable: true
    relationships:
    - rel_type: part_of
      spec_id: EMB-17-004
    adr:
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_064
  - id: EMB-17-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the case has no Active Embargo and no Proposed Embargo (EM state is
      EXITED or NONE), the CASE_MANAGER MUST NOT issue a fresh embargo invitation
      to the accepting actor.
    rationale: >-
      There is no active embargo to invite the actor to; a fresh invitation would
      manufacture a negotiation nobody requested. See ADR-0065.
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_a_late_accept_with_no_terms_gets_the_refusal_notice_alone`) drives a late
      Accept into a case in EM EXITED and asserts the refusal notice is the only
      activity queued, so no Invite is sent.
      `test/core/behaviors/embargo/nodes/test_accept_availability.py`
      (`test_a_case_with_no_active_or_proposed_embargo_holds_no_terms`) asserts such a
      case holds no terms to invite to.
    relationships:
    - rel_type: derives_from
      spec_id: EMB-17-004
    adr:
    - ADR-0065
    stories:
    - story_2026_001
  - id: EMB-17-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the case has no Active Embargo and no Proposed Embargo (EM state is
      EXITED or NONE), the CASE_MANAGER MUST NOT remove the accepting actor from
      the case.
    rationale: >-
      Case participation is independent of embargo consent; the actor's
      willingness to coordinate must not result in their removal. See ADR-0065.
    verification: >-
      `test/core/use_cases/received/test_embargo_invite_lapse.py`
      (`test_late_accept_refused_when_em_exited`) and
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_a_late_accept_with_no_terms_gets_the_refusal_notice_alone`) drive a late
      Accept into a case in EM EXITED and assert the accepter is still in the case's
      participant index afterwards.
    relationships:
    - rel_type: derives_from
      spec_id: EMB-17-004
    adr:
    - ADR-0065
    stories:
    - story_2026_001
  - id: EMB-17-009
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER honours a late Accept (EMB-17-002), it MUST commit the
      received `Accept(Invite(EmbargoEvent))` verbatim as
      `accept_invite_to_embargo_on_case`.
      Its entry carries the AGREED row the Accept states, exactly as for an on-time
      Accept.
      A replica then copies the row without re-evaluating the deadline (RSH-08-004,
      ADR-0124, CLP-07-011).
    rationale: >-
      Without a committed entry the replica has no signal that the row moved
      to AGREED; the replica's participant record would silently stay
      TIMED_OUT while the CASE_MANAGER's record shows AGREED, breaking
      ledger-driven convergence (ADR-0108, ADR-0118). The Accept states the
      change, so its entry is the change's entry (CLP-07-013); a follow-up
      `Update` of the same row would record one state change twice. The
      deadline having passed is an observation anything holding the case can
      make, so it is not ledgered either (ADR-0152).
    verification: >-
      `test_an_honoured_late_accept_is_committed_and_replayed_by_a_replica`
      drives the full path across per-actor stores: the late Accept reaches the
      CASE_MANAGER, the Accept itself is committed and broadcast with no
      `Update(EmbargoConsent)` of the AGREED row after it, and the replica
      asserts the accepting participant's row reads AGREED, as after an
      on-time Accept (EMB-17-001, RSH-08-004).
    testable: true
    postconditions:
    - description: >-
        The late Accept is committed as `accept_invite_to_embargo_on_case`
        in the CASE_MANAGER's store, and the accepter's AGREED row is copied
        from it in every replica's store
    relationships:
    - rel_type: extends
      spec_id: EMB-17-002
    - rel_type: refines
      spec_id: CLP-07-011
    adr:
    - ADR-0118
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_093
    see_also:
    - spec_id: RSH-08-004
      reason: 'replica coverage is not a precondition of the commit'
  - id: EMB-17-018
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the CASE_MANAGER honours a late Accept (EMB-17-002), it MUST NOT commit any
      further entry for the same row.
      An example is its own `Update(EmbargoConsent)` of the AGREED row (CLP-07-002,
      ADR-0152).
    rationale: >-
      The Accept states the change, so its entry is the change's entry (CLP-07-013);
      a follow-up `Update` of the same row would record one state change twice.
    verification: >-
      `test/core/use_cases/received/test_embargo_answer_routing.py`
      (`test_an_honoured_late_accept_is_committed_and_replayed_by_a_replica`) asserts
      no `Update(EmbargoConsent)` of the AGREED row follows the committed Accept.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-17-009
    - rel_type: refines
      spec_id: CLP-07-002
    adr:
    - ADR-0152
    stories:
    - story_2022_013
    - story_2026_093
    see_also:
    - spec_id: EMB-17-002
      reason: 'context for the reader'

- id: EMB-18
  title: EM Write-Boundary Consolidation
  description: >-
    Requirements ensuring that all EM state transitions are executed through
    the EmbargoLifecycle service layer rather than written directly to
    case.current_status.em in BT nodes or helpers. Identified by audit in
    CONCERN-2412: three BT nodes (EmActivateEmbargo, ClearEmbargo,
    SetDefaultActiveEmbargoNode) bypass EmbargoLifecycle with direct
    EmDimension assignment. Complements SM-04-001 (general write-boundary guard
    requirement) with an EM-specific routing rule.
  specs:
  - id: EMB-18-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      This codebase MUST make every change to a case's embargo register through
      EmbargoLifecycle, or through apply_embargo_change() for an act converted to the
      copy model.
      A change to the register is also a change to the EM state derived from it
      (ADR-0122).
      Each public operation of EmbargoLifecycle, such as propose_embargo(),
      activate_embargo() and reject_embargo_proposal(), applies one register step.
      The one apply function, apply_embargo_change(), applies the act's ledger entry
      (ADR-0124, CM-23-016).
    rationale: >-
      EmbargoLifecycle and the one apply function are the only embargo writers. A path
      that goes around both skips the fail-closed reads of EMB-18-003, the PEC cascade,
      and the shared starting-state and EM checks. Also, the EM value the register
      derives overwrites a status EM that a path assigns directly.
    adr:
    - ADR-0122
    - ADR-0124
    see_also:
    - spec_id: CM-23-016
      reason: 'context for the reader'
  - id: EMB-18-008
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      A BT node or helper function MUST NOT apply a register step itself, or assign
      case.current_status.em, then call dl.save(case) in place of the EMB-18-001
      writers.
    rationale: >-
      A path that goes around both writers skips the fail-closed reads of EMB-18-003,
      the PEC cascade, and the shared starting-state and EM checks. The EM value the
      register derives also overwrites a status EM that a path assigns directly.
    relationships:
    - rel_type: derives_from
      spec_id: EMB-18-001
    adr:
    - ADR-0122
    - ADR-0124
  - id: EMB-18-002
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      A BT node or helper MUST NOT check an embargo register step as a non-blocking
      warning-only guard and then write regardless of the result.
    rationale: >-
      A warning-only guard looks like validation but lets an invalid state persist. The
      correct pattern is to go through EmbargoLifecycle (EMB-18-001), which fails closed
      in STRICT mode.
    relationships:
    - rel_type: extends
      spec_id: EMB-18-001
  - id: EMB-18-009
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      A refused embargo register step MUST either raise or make the BT node return
      Status.FAILURE without writing to the DataLayer.
    rationale: >-
      A refusal that still writes lets an invalid state persist. EmbargoLifecycle
      (EMB-18-001) fails closed in STRICT mode, so a refused step leaves the store
      unchanged.
    relationships:
    - rel_type: extends
      spec_id: EMB-18-002
  - id: EMB-18-003
    priority: MUST
    kind: architecture
    statement: >-
      A path that activates an embargo register entry MUST already hold that
      `EmbargoEvent`'s record in the same store.
    note: >-
      The writers' fail-closed read still guards every activation; a replica's fetch
      (EMB-18-007) only gives it the record before the writer reads it. The
      CASE_MANAGER holds the canonical case, so it has nobody to fetch a record from.
    rationale: >-
      The EP-05-001 comparison reads the replaced embargo, so it holds only if no case
      names an embargo its store cannot read. Any writer that accepts a bare id lets a
      case name an unreadable record: an activation writer can, and so can seeding a
      case whose embargo arrived as a bare reference. A replica can fetch the record
      from the CASE_MANAGER (AKM-05-003). At the CASE_MANAGER, a deferral waits for a
      record that no path delivers.
    verification: >-
      Unit tests of `accept_embargo_invite()` and `activate_embargo()` in
      `test/core/services/embargo_lifecycle/` assert that an unreadable activated or replaced
      embargo raises before any write and leaves the stored case unchanged, and
      a received-Accept test asserts the handler reports `REFUSED`; a
      seeding test asserts a received case whose `active_embargo` is a bare
      reference the store lacks is refused rather than saved.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-18-001
  - id: EMB-18-010
    priority: MUST
    kind: architecture
    statement: >-
      The `EmbargoLifecycle` activation writers (`activate_embargo()`,
      `initialize_creation_embargo()`) MUST read the record of the embargo being
      activated and of the one it replaces (EP-05-001).
    rationale: >-
      The EP-05-001 comparison reads the replaced embargo, so it holds only if the
      writer reads both records before it changes the register.
    verification: >-
      Unit tests of `accept_embargo_invite()` and `activate_embargo()` in
      `test/core/services/embargo_lifecycle/` assert that an unreadable activated or replaced
      embargo raises before any write and leaves the stored case unchanged, and
      a received-Accept test asserts the handler reports `REFUSED`.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-18-003
    - rel_type: implements
      spec_id: EP-05-001
  - id: EMB-18-011
    priority: MUST
    kind: architecture
    statement: >-
      An `EmbargoLifecycle` activation writer MUST fail closed on an unreadable
      activated or replaced embargo (EMB-18-010) before changing the register. An
      unreadable replaced embargo is a broken invariant, reported as a refusal, not
      deferred.
    rationale: >-
      A replica can fetch the record from the CASE_MANAGER (AKM-05-003). At the
      CASE_MANAGER, a deferral waits for a record that no path delivers, so the writer
      refuses instead.
    verification: >-
      Unit tests of `accept_embargo_invite()` and `activate_embargo()` in
      `test/core/services/embargo_lifecycle/` assert that an unreadable activated or replaced
      embargo raises before any write and leaves the stored case unchanged, and
      a received-Accept test asserts the handler reports `REFUSED`.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-18-010
  - id: EMB-18-007
    priority: MUST
    kind: protocol
    statement: >-
      A participant replica MUST fetch from the case's CASE_MANAGER the embargo an
      announced revision replaces, when it cannot read it (AKM-05-007). It defers
      the revision until the fetch settles (AKM-05-010), and refuses it only when
      the fetch fails (AKM-05-015).
    rationale: >-
      A replica can lack a record the CASE_MANAGER holds through a gap or a lag, and the
      CASE_MANAGER can supply it (AKM-05-003). The fetch runs before the activation
      writer, so EMB-18-003's fail-closed read still guards the register.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_dereference.py` checks a replica
      lacking the replaced embargo fetches it and replays the revision, and
      `test/core/services/test_dereference.py` checks a replica fetches the replaced
      embargo it cannot read, a replica holding it fetches nothing, and the
      CASE_MANAGER fetches nothing.
    testable: true
    relationships:
    - rel_type: implements
      spec_id: EMB-18-003
    - rel_type: refines
      spec_id: AKM-05-007
    - rel_type: refines
      spec_id: AKM-05-010
    adr:
    - ADR-0107
    stories:
    - story_2026_098
    see_also:
    - spec_id: AKM-05-015
      reason: 'context for the reader'
  - id: EMB-18-004
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST refuse an inline `EmbargoEvent` whose `context` is neither the
      case that carries it nor a report that case holds (EP-04-009).
      The same refusal applies to the record the receiver already holds under the
      embargo's id.
      It applies whether the case or ledger entry carries the embargo inline or names it
      by bare id.
      For a ledger entry, the case's reports are those of the replica's stored case.
    rationale: >-
      An embargo belongs to the case that its `context` names. A handler stores a
      carried embargo when its store does not hold that id yet, and the first write
      wins. An unchecked event would therefore let a sender plant the embargo of another
      case under an id that case will name later. That case would then name the planted
      record. The check therefore covers the record already held under the id, not only
      the carried copy. A Reporter's proposal names its report until the case exists,
      and it keeps its id after that (EP-04-004). A refusal of an embargo about one of
      the case's reports would refuse the Reporter its own case.
    verification: >-
      A receiver is given a case that carries an inline `EmbargoEvent` whose `context`
      names a different case. The receiver refuses it, holds no record of the event
      afterwards, and leaves both cases' embargo state unchanged. Exercised by
      `test_an_inline_embargo_of_another_case_is_refused_unstored`. A case or ledger entry
      naming, inline or by bare id, an embargo the receiver holds for another case is
      refused with nothing written, exercised by
      `test_a_case_naming_a_held_embargo_of_another_case_is_refused_unwritten` and the
      entry tests beside it in `test/core/services/test_carried_embargo.py`. A held
      proposal about the case's own report is accepted on the case and entry paths, and
      one about another case's report is refused
      (`test_a_held_proposal_about_the_cases_own_report_is_accepted` and its neighbours).
    stories:
    - story_2026_082
    testable: true
    relationships:
    - rel_type: uses_definition
      spec_id: EP-04-009
  - id: EMB-18-012
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST make an EMB-18-004 refusal before it writes anything.
      The event is then not stored, and no embargo state of either case changes.
    rationale: >-
      A handler stores a carried embargo when its store does not hold that id yet, and
      the first write wins. A refusal after a write would leave the planted record in
      the store for the other case to name later.
    verification: >-
      `test/core/services/test_carried_embargo.py`
      (`test_an_inline_embargo_of_another_case_is_refused_unstored`,
      `test_a_case_naming_a_held_embargo_of_another_case_is_refused_unwritten`)
      confirms the receiver holds no record of a refused event afterwards and leaves
      both cases' embargo state unchanged.
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-18-004
    stories:
    - story_2026_082
  - id: EMB-18-005
    priority: MUST
    kind: protocol
    statement: >-
      Every change to a case's embargo register MUST move the case's EM state
      only along an EM transition for the change's EM trigger: a proposal is
      `propose`, an activation is `accept`, a rejection, or the cancellation of
      open proposals with no embargo in force, is `reject`, and a termination is
      `terminate`. The EM transitions are `propose`: N→P, P→P, A→R, R→R;
      `reject`: P→N, P→P, R→A, R→R; `accept`: P→A, P→R, R→A, R→R; and
      `terminate`: A→X, R→X. A rejection leaves Proposed, and a rejection or an
      acceptance leaves Revise, only when no proposal remains open; an acceptance
      from Proposed moves to Active, or to Revise while another proposal stays
      open.
    rationale: >-
      EM is computed from the embargo register (ADR-0122), not replaced by it:
      the EM state machine remains the protocol's model, and the register is a
      layer beneath it. With several proposals open, rejecting or activating one
      leaves the others open: a rejection keeps EM in Proposed or Revise until the
      last one is off the table, and an activation from Proposed puts the embargo
      in force with the others pending as revisions, in Revise (ADR-0130).
    verification: >-
      A property test enumerates register states, applies every legal register
      step, and asserts each (trigger, EM before, EM after) is one of these
      transitions: `test_every_register_step_moves_em_along_an_em_transition`
      in `test/core/states/test_em_transition_table.py`.
    adr:
    - ADR-0130
    stories:
    - story_2026_086
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-18-001
  - id: EMB-18-006
    priority: MUST
    kind: architecture
    statement: >-
      This codebase MUST hold the EM transitions of EMB-18-005 as one declarative
      table.
    rationale: >-
      A check only in tests protects only the register states a test reaches.
      Refusing at the step makes a register defect fail when it happens, on
      every node, and gives tools that draw or export the EM machine one table
      to read (ADR-0130).
    verification: >-
      `test_em_transition_table_is_declared_and_enforced` in
      `test/core/states/test_em_transition_table.py` asserts the table is
      declared.
    adr:
    - ADR-0130
    testable: true
    relationships:
    - rel_type: implements
      spec_id: EMB-18-005
  - id: EMB-18-013
    priority: MUST
    kind: architecture
    statement: >-
      Applying an embargo register step MUST refuse, with no write, a step whose EM
      move is not in the EMB-18-006 table.
    rationale: >-
      A check only in tests protects only the register states a test reaches.
      Refusing at the step makes a register defect fail when it happens.
    verification: >-
      `test_em_transition_table_is_declared_and_enforced` in
      `test/core/states/test_em_transition_table.py` asserts a step whose EM move is
      not in the table is refused, and
      `test_a_refused_em_move_leaves_the_case_unchanged` that the refusal writes
      nothing to the case.
    adr:
    - ADR-0130
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-18-006
  - id: EMB-18-014
    priority: MUST
    kind: architecture
    statement: >-
      The CASE_MANAGER and every replica MUST apply the EMB-18-013 check as part of
      the one apply function (ADR-0124).
    rationale: >-
      One check in the one apply function makes a register defect fail on every
      node, not only on the node that made the step.
    verification: >-
      `test_a_refused_em_move_leaves_the_case_unchanged` in
      `test/core/states/test_em_transition_table.py` drives the refusal through the
      apply function.
    adr:
    - ADR-0124
    testable: true
    relationships:
    - rel_type: extends
      spec_id: EMB-18-013

- id: EMB-19
  title: Embargo Teardown Announcement
  description: >-
    Who authors the activity that tells the other participants of an embargo
    teardown, and who receives it. Added by ISSUE-2238 after the recipients were
    found to be unspecified, which is how they came to disagree with the tree's
    role gate.
  specs:
  - id: EMB-19-001
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: protocol
    statement: >-
      The actor that holds the `CASE_MANAGER` role for the case MUST author the
      activity that tells the other participants of an embargo teardown. That
      activity is an `Announce(EmbargoEvent)` after a received `Remove(EmbargoEvent)`,
      and the CASE_MANAGER's own `Remove(EmbargoEvent)` for a teardown it starts.
    rationale: >-
      The teardown changes canonical case state, so the actor that holds the
      CASE_MANAGER role announces it, and the participants are its audience. The tree
      that commits the teardown runs as the CASE_MANAGER, because the ledger commit is
      gated on that role. An announcement addressed to the CASE_MANAGER would therefore
      go to the announcing actor itself, and the teardown would reach nobody.
    note: >-
      This is the general rule of CLP-10-001 as amended by ADR-0109, not an exception to it: the
      CASE_MANAGER commits its own emissions in the emitting tree and never addresses a copy to itself.
      `remove_embargo_from_case_tree` passes the announce to `create_receive_activity_tree` as
      `manager_effects`, which the factory gates on `CVDRole.CASE_MANAGER` after the guarded commit
      (CLP-10-013, BT-17-008); a participant replica tears down its own copy and announces nothing. The
      ledger entry therefore already exists when the announce is queued, and a self-addressed copy would
      loop an activity back to the actor that just emitted it for no additional
      record. A teardown the CASE_MANAGER starts (its own decision, the end time,
      or a P/X/A cascade) runs `terminate_embargo_bt`, whose
      `CommitAndApplyEmbargoTerminationNode` commits the CASE_MANAGER's own
      `Remove(EmbargoEvent)` addressed to every other active participant (the same
      `case_content_recipients` audience as the announce), and no announce
      follows.
    verification: >-
      `test/core/behaviors/embargo/test_announce_teardown_tree.py` asserts the
      announce is authored by the CASE_MANAGER, and, with each actor in its own
      store, that a participant replica receiving the same `Remove(EmbargoEvent)`
      queues nothing. `test/core/behaviors/embargo/nodes/test_lifecycle.py`
      (`test_manager_teardown_is_addressed_to_the_others_only`, trigger and
      cascade), `test/core/use_cases/triggers/embargo/test_terminate.py`
      (`test_manager_terminate_queues_nothing_addressed_to_itself`) and
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py`
      (`test_lazy_check_ends_an_embargo_whose_end_time_has_passed`,
      `test_sentinel_request_ends_the_embargo_at_its_end_time`,
      `test_racing_lazy_check_and_sentinel_commit_one_termination` and
      `test_an_early_request_after_the_end_time_ends_it_at_its_end_time`, each
      through `_assert_full_cascade`) assert that a teardown the
      CASE_MANAGER starts sends its own `Remove(EmbargoEvent)` to the other
      participants and never to itself.
    adr:
    - ADR-0109
    - ADR-0114
    stories:
    - story_2026_075
    - story_2022_046
    tags:
    - protocol
    - messaging
  - id: EMB-19-003
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST address the teardown `Announce(EmbargoEvent)` (EMB-19-001)
      to every active participant (CM-10-004) except itself.
    rationale: >-
      The teardown changes canonical case state, and the participants are the
      audience of that change.
    verification: >-
      `test/core/behaviors/embargo/test_announce_teardown_tree.py`
      (`test_emits_announce_when_active_embargo_removed`) asserts the announce is
      addressed to the case's other active participants.
    relationships:
    - rel_type: extends
      spec_id: EMB-19-001
    - rel_type: uses_definition
      spec_id: CM-10-004
    tags:
    - protocol
    - messaging
    stories:
    - story_2026_075
    - story_2022_046
  - id: EMB-19-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT address the teardown `Announce(EmbargoEvent)`
      (EMB-19-001) to the CASE_MANAGER.
    rationale: >-
      The tree that commits the teardown runs as the CASE_MANAGER, because the ledger
      commit is gated on that role. An announcement addressed to the CASE_MANAGER
      would go to the announcing actor itself and loop back for no additional record.
    verification: >-
      `test/core/behaviors/embargo/test_announce_teardown_tree.py`
      (`test_emits_announce_when_active_embargo_removed`) asserts the announce is
      not addressed to the CASE_MANAGER.
    relationships:
    - rel_type: extends
      spec_id: EMB-19-001
    tags:
    - protocol
    - messaging
    stories:
    - story_2026_075
    - story_2022_046
  - id: EMB-19-002
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      When a case has no participants besides the CASE_MANAGER, the teardown
      announcement MUST be skipped rather than emitted with an empty recipient list.
    rationale: >-
      An activity addressed to nobody is undeliverable, and delivery discards it anyway; constructing one
      only adds a queue entry that can never be resolved. Skipping keeps the teardown itself unaffected,
      consistent with the announcement being best-effort — a notification gap MUST NOT block a teardown.
    relationships:
    - rel_type: extends
      spec_id: EMB-19-001
    stories:
    - story_2026_075
    tags:
    - protocol
    - messaging
