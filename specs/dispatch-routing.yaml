id: DR
title: Dispatch Routing
description: >-
  After semantic extraction, the dispatcher routes `VultronEvent` domain objects to the appropriate
  use-case class. The dispatcher may execute use cases synchronously (DirectActivityDispatcher)
  or asynchronously (queue-based).
scope:
- prototype
- production
tags:
- messaging
groups:
- id: DR-01
  title: Dispatcher Protocol
  specs:
  - id: DR-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All dispatcher implementations MUST implement ActivityDispatcher protocol
    rationale: >-
      Driving adapters such as the inbox call the dispatcher only through the
      `ActivityDispatcher` port. If every implementation honors that protocol, an
      adapter or a test can swap one dispatcher for another without a code change.
  - id: DR-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Dispatchers MUST construct use-case instances with the complete `VultronEvent` and `DataLayer`
      before calling `execute()`, so that `execute()` takes no arguments
    rationale: >-
      A use case that gets its event and DataLayer at construction has one fixed entry
      point, `execute()`. The dispatcher can then run every use case the same way, and
      a test can build a use case with a fake DataLayer and run it with no dispatcher.
  - id: DR-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Dispatchers MUST perform semantic type validation at dispatch time using the configured
      semantics-to-use-case mapping
    rationale: >-
      Routing on the semantic type, read from the one configured mapping, sends each
      event to the use case that handles that meaning. A dispatcher that chose by other
      fields, or kept its own table, could send the same message to different handlers.
    relationships:
    - rel_type: implements
      spec_id: HP-02-001
- id: DR-02
  title: Handler Lookup
  specs:
  - id: DR-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The system MUST look up use-case classes by semantic type using the mapping returned
      by `use_case_map()`
    rationale: >-
      `use_case_map()` derives the routing table from the semantic registry, which is
      the one place a message meaning is tied to its use case. Reading routes from it
      keeps the dispatcher and the registry from disagreeing about who handles what.
    relationships:
    - rel_type: derives_from
      spec_id: HP-03-001
  - id: DR-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The mapping returned by `use_case_map()` MUST contain an entry for every
      `MessageSemantics` value whose `SEMANTIC_REGISTRY` entry names a use case, and
      none for a value the registry recognizes but no use case handles (SE-05-002)
    rationale: >-
      A missing entry would leave a handled meaning with no route, and an extra entry
      would route a meaning that no use case claims. Matching the map to the registry
      entries keeps every handled message routed and every unhandled one refused as "no
      use case found".
    relationships:
    - rel_type: derives_from
      spec_id: SE-05-002
- id: DR-03
  title: Direct Dispatch Implementation
  specs:
  - id: DR-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The DirectActivityDispatcher MUST execute handlers synchronously
    rationale: >-
      The direct dispatcher is the in-process implementation: the caller runs in a
      background task already, and running the use case in the same call keeps the
      handler's result and any exception with that caller, which decides the inbox
      outcome.
  - id: DR-03-002
    priority: MUST
    kind: project
    statement: >-
      The DirectActivityDispatcher MUST NOT catch handler exceptions. It MUST let
      every exception a handler raises propagate to its caller. A semantic type with
      no use case raises nothing: the dispatcher reports it as a `REFUSED` "no use
      case found" verdict, logged at INFO (SE-05-002).
    rationale: >-
      Catching and logging belongs at the adapter boundary that decides what a
      failure means for the inbox item (IE-06-004), not in core: a blanket catch in
      the dispatcher would break CS-23-001 (no broad `except` outside a BT node's
      `update()`) and HP-05-001 (handlers raise for unrecoverable errors), and would
      turn a programming error into a silent verdict. The dispatcher routes by semantics
      alone, so an activity that names no case reaches its handler, which refuses it
      (HP-05-002).
    verification: >-
      `test/test_behavior_dispatcher.py::test_dispatch_lets_a_handler_exception_propagate`
      asserts a `RuntimeError` raised inside a use case's `execute()` escapes
      `dispatch()` unchanged.
    relationships:
    - rel_type: depends_on
      spec_id: CS-23-001
    - rel_type: depends_on
      spec_id: HP-05-001
- id: DR-04
  title: Async Dispatch Implementation
  specs:
  - id: DR-04-001
    priority: SHOULD
    kind: project
    statement: An async dispatcher SHOULD queue activities for processing
    rationale: >-
      A queue lets the inbox accept a message and return at once while handlers run
      later, and it absorbs bursts of messages without blocking the receiver.
  - id: DR-04-002
    priority: SHOULD
    kind: project
    statement: An async dispatcher SHOULD process activities in FIFO order
    rationale: >-
      Many protocol messages depend on earlier ones, such as a reply to an offer or a
      status update after a join. Processing in arrival order keeps the receiver from
      handling a message before the one it follows.
