id: CS
title: Code Style Specifications
description: Defines code formatting, import organization, and coding style standards for Python code in the Vultron project.
scope:
- prototype
- production
tags:
- code-style
groups:
- id: CS-01
  title: Code Formatting
  specs:
  - id: CS-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Code MUST follow PEP 8 style guidelines
    rationale: >-
      PEP 8 is the style most Python contributors already know. One shared style lets
      a reader follow any module without first learning a local one. The `E` and `W`
      pycodestyle rules that `ruff check` selects in `pyproject.toml` check much of
      it, and `ruff format` sets the layout.
  - id: CS-01-004
    priority: SHOULD
    kind: project
    statement: Functions and methods SHOULD have docstrings following PEP 257 conventions
    rationale: >-
      A docstring tells a reader what a function does and what it expects without
      reading its body. The code reference pages under `docs/reference/code/` are
      built from docstrings by mkdocstrings, so a missing docstring is also a gap in
      the published reference. No lint rule checks this; review does.
  - id: CS-01-005
    priority: SHOULD
    kind: project
    statement: Docstrings SHOULD follow Google style for structured sections
    rationale: >-
      mkdocstrings parses Google-style `Args:`, `Returns:` and `Raises:` sections into
      structured entries on the code reference pages. One style for every module gives
      each reader the same layout and gives the parser one format to read.
- id: CS-02
  title: Import Organization
  specs:
  - id: CS-02-001
    priority: SHOULD
    kind: project
    statement: 'Imports SHOULD be organized in three groups: standard library, third-party libraries, local application'
    rationale: >-
      The three groups show at a glance which dependencies come from outside the
      project. A fixed order also means two contributors write the same import block,
      so a diff shows only the imports that really changed. The `I001` rule in `ruff
      check` reports an import block that is not grouped and sorted.
  - id: CS-02-002
    priority: SHOULD
    kind: project
    statement: Import statements SHOULD be placed at the top of the file after module comments or docstrings
    rationale: >-
      Imports at the top show all of a module's dependencies in one place. An import
      lower in a module runs later than a reader expects and can hide an import cycle
      (CS-05-005). The `E402` rule in `ruff check` reports a module-level import that
      is not at the top.
  - id: CS-02-003
    priority: SHOULD
    kind: project
    statement: Multi-line import statements SHOULD use parentheses for readability
    rationale: >-
      Parentheses let `ruff format` put one name on each line. A diff that adds or
      removes a name then changes one line. A backslash continuation breaks when a
      space follows the backslash, and the formatter cannot lay it out.
- id: CS-03
  title: Import Practices
  specs:
  - id: CS-03-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Wildcard imports (e.g., `from module import *`) MUST NOT be used
    rationale: >-
      A wildcard import hides where a name comes from, so a reader and a type checker
      cannot tell which names a module defines. A name that the source module adds
      later can also replace a local name without warning. The `F403` and `F405` rules
      in `ruff check` report wildcard imports; each sanctioned use carries a `# noqa:
      F403` marker.
  - id: CS-03-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Unused imports MUST be removed
    rationale: >-
      An unused import adds a dependency that does nothing. It makes a module load
      code it does not use, and it can create an import cycle with no reason. The
      `F401` rule in `ruff check` reports it. `__init__.py` files are exempt in
      `pyproject.toml`, because there an import re-exports a name.
  - id: CS-03-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: When importing more than 10 items from a module, import the module itself instead
    rationale: Reduces line noise and makes module boundaries clearer
  - id: CS-03-004
    priority: SHOULD
    kind: project
    statement: In test modules, avoid multiple imports from the module under test; consider importing the module and using
      attribute access for clarity.
    rationale: >-
      A test that imports the module under test and uses `module.name` shows at each
      use which module a name comes from. The import list then stays short as the test
      file grows.
- id: CS-04
  title: Import Style Preferences
  specs:
  - id: CS-04-001
    priority: MAY
    kind: project
    statement: Relative imports MAY be used for local application imports when appropriate
    rationale: >-
      Inside one package, a relative import is short and keeps working when the parent
      package moves. The permission records that neither form is a defect, so a review
      does not ask for a rewrite of one to the other.
  - id: CS-04-002
    priority: MAY
    kind: project
    statement: Module imports MAY use aliases for clarity or to avoid naming conflicts
    rationale: >-
      Two modules can export the same name, for example a wire class and a core class.
      An alias lets one module use both without a clash, and it can give a long module
      path a short, clear name.
- id: CS-05
  title: Circular Import Prevention
  specs:
  - id: CS-05-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Core modules SHALL NOT import from application layer modules
    rationale: >-
      Core holds the protocol rules, and every adapter and driver depends on it. An
      import from a layer above would make core depend on the code that depends on it.
      That creates import cycles, and core could not load or run its tests without
      those layers. ARCH-01-001 states the full layer rule.
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
  - id: CS-05-002
    priority: SHOULD
    kind: project
    statement: A circular dependency SHOULD be resolved by reorganization first (a neutral module per CS-05-003, or moving
      the shared symbol to the side of the cycle that owns it). Deferring the import into a function body is a **last
      resort** that hides the cycle rather than removing it, and every such deferral is tracked toward structural removal
      (CS-05-005).
    rationale: >-
      A function-local import hides a cycle but does not remove it. The cycle stays in
      the module graph, and the next import that reaches it fails at load time or
      needs one more deferral. Reorganization removes the cause, so the cycle cannot
      come back through a different import. Most function-local imports break no cycle
      at all, and module level is the right place for them.
    verification: With `PLC0415` (`import-outside-top-level`) selected in `[tool.ruff.lint]` of `pyproject.toml`, every
      function-local import in production code is either absent or carries a marker per CS-05-005; the count of markers
      is the size of the remaining cycle backlog.
  - id: CS-05-005
    priority: MUST
    kind: project
    statement: 'In production code under `vultron/`, a function-local import MUST exist only to break an import cycle
      that reorganization has not yet removed, and MUST carry a `# noqa: PLC0415` marker whose trailing comment names the
      issue that tracks its structural removal (the IMPLTS-07-020 baseline form). A function-local import with no cycle
      to break MUST be hoisted to module level. A `TYPE_CHECKING`-guarded import is not a function-local import and
      needs no marker.'
    rationale: >-
      The marker makes each deferred import visible in review, and its comment names
      the issue that removes the cycle. A new function-local import without a marker
      fails `ruff check` under `PLC0415`. `RUF100` (`unused-noqa`) stays selected, so
      a marker left behind after its import moves to module level also fails. The
      markers in `vultron/` therefore list every function-local import that remains.
    adr:
    - ADR-0094
    verification: '`ruff check` invoked with no path operands (IMPLTS-07-021) reports no `PLC0415` finding; each surviving
      marker in `vultron/` cites an open issue.'
    relationships:
    - rel_type: refines
      spec_id: CS-05-002
    - rel_type: refines
      spec_id: IMPLTS-07-020
  - id: CS-05-006
    priority: MAY
    kind: project
    statement: Test modules under `test/` MAY import inside test functions and fixtures. This idiom is exempted from
      `PLC0415` through a `per-file-ignores` entry for `test/**` rather than through per-site markers.
    rationale: A test-local import scopes a dependency to the one test that needs it and keeps a module-under-test out of
      collection-time import order (`isolated_core_registries`, `monkeypatch` of module attributes). It is an isolation
      idiom, not a cycle break, so CS-05-002 does not govern it and CS-05-005's marker discipline would add noise without
      a backlog to drain.
  - id: CS-05-003
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Shared types and errors SHALL be placed in neutral modules
    rationale: >-
      A type that two layers both need cannot live in either one. If it did, the other
      layer would have to import it, and that import goes in the wrong direction or
      closes a cycle. A neutral module such as `vultron/errors.py` or `vultron/enums/`
      depends on no layer, so every layer can import it.
  - id: CS-05-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Before adding imports between modules, trace the import chain to prevent cycles
    rationale: >-
      An import cycle fails at load time, often in a module other than the one a
      change edited. CS-05-005 does not let a function-local import hide a cycle, so
      the only remedy after the fact is to reorganize modules. Tracing the chain first
      finds the cycle before the import exists, when a different placement costs
      nothing.
- id: CS-06
  title: Module Size
  specs:
  - id: CS-06-001
    priority: SHOULD
    kind: project
    statement: Prefer modules that are < ~400 lines; split large modules by responsibility and avoid single-file catchalls
    rationale: >-
      A small module with one responsibility is easier to read, review and test. A
      catch-all file collects unrelated code, so changes to it conflict more often,
      and a reader must scan code that has nothing to do with the task.
- id: CS-07
  title: '`as_` Field Prefix Policy'
  specs:
  - id: CS-07-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Pydantic **field names** MUST NOT use the `as_` prefix anywhere in the codebase.
      Class names (e.g., `as_Activity`, `as_Object`) keep the `as_` prefix as an
      ActivityStreams provenance marker.
    rationale: >-
      Field names become wire keys through the `to_camel` alias generator. A field
      named `as_object` would serialize as `asObject`, which is not an ActivityStreams
      key. On a class name the prefix marks ActivityStreams vocabulary. On a field it
      adds no information and gives the wrong key.
  - id: CS-07-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'For fields whose plain name collides with a Python builtin or reserved word (e.g., `object`, `type`, `id`,
      `context`), use a trailing underscore: `object_`, `type_`, `id_`, `context_`'
    rationale: Idiomatic Python (PEP 8); keeps models readable and decoupled from AS2 naming conventions.
- id: CS-08
  title: Optional Field Non-Emptiness
  specs:
  - id: CS-08-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Optional string fields MUST NOT contain empty strings when present; the invariant is "if present, then non-empty"
    rationale: Distinguishes "not provided" from "provided but blank", avoiding ambiguous database states.
  - id: CS-08-002
    priority: SHOULD
    kind: project
    statement: Non-empty string validation SHOULD be consolidated into a shared type alias rather than duplicated per-field
      validators
    rationale: Reduces boilerplate and makes the invariant visible in the type signature rather than buried in a per-field
      validator.
    relationships:
    - rel_type: implements
      spec_id: CS-08-001
- id: CS-09
  title: Code Reuse
  specs:
  - id: CS-09-001
    priority: SHOULD_NOT
    kind: architecture
    statement: New code SHOULD NOT duplicate logic already present elsewhere; prefer extracting shared logic into reusable
      helpers, base classes, or type aliases
    rationale: Duplication inflates maintenance cost and allows bug fixes to be applied inconsistently
  - id: CS-09-002
    priority: SHOULD
    kind: project
    statement: Pydantic request and response models for API endpoints SHOULD be reused or inherited rather than duplicated
    rationale: Duplicated models diverge silently over time; a hierarchy makes the relationship explicit and reduces boilerplate
- id: CS-10
  title: Port and Adapter Data Exchange
  specs:
  - id: CS-10-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Data passed across port/adapter boundaries MUST use named, domain-typed objects rather than type-erased containers
      (plain maps, untyped base classes, or equivalent). Port interface signatures MUST declare parameters and return values
      as specific domain types, not as generic base types or untyped collections.
    rationale: Ports that accept or return type-erased containers (dicts, bare base models) serve as machine-readable contracts
      in name only — the type system cannot enforce what passes through them. Naming the specific domain type at the boundary
      makes the contract explicit, enables static verification, and surfaces layer-coupling violations at compile/analysis
      time rather than runtime.
  - id: CS-10-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: In this Python codebase, port boundary types MUST be named Pydantic model classes (e.g., `VulnerabilityCase`,
      `CaseParticipant`), not plain `dict`s or bare `BaseModel` subclasses without semantic meaning. Port `Protocol` signatures
      MUST declare parameters and return values as these specific domain types.
    rationale: >-
      A bare `BaseModel` at a port says no more about its content than a `dict`: any
      model passes the type check. A named domain type lets mypy and pyright reject a
      wrong object at the call site, and it tells the reader what crosses the port.
      CS-10-001 states the general rule; this is its Python form.
    relationships:
    - rel_type: implements
      spec_id: CS-10-001
      note: Python/Pydantic-specific application of the typed-port-boundary pattern
  - id: CS-10-002
    priority: SHOULD
    kind: project
    statement: Wire-level ActivityStreams payload classes SHOULD carry the `Activity` suffix; domain event classes SHOULD
      carry the `Event` suffix
    rationale: Distinguishes wire representation from domain intent, prevents accidental coupling between layers, and makes
      the translation point explicit. See `notes/wire-core-boundary.md` for the rationale.
- id: CS-11
  title: Type Annotations
  specs:
  - id: CS-11-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Code MUST NOT use `Any` in type hints when the type can be determined
    rationale: '`Any` defeats static type checking, obscures API contracts, and hides bugs at the boundary between typed and
      untyped code'
- id: CS-12
  title: Domain Model Naming
  specs:
  - id: CS-12-001
    priority: SHOULD
    kind: project
    statement: Core domain model class names SHOULD reflect the domain concept they represent, not a parallel to a wire-format
      class name
    rationale: Generic wire-mirroring names obscure what an object actually represents in the CVD domain. Domain-centric names
      make the code self-documenting and reduce reliance on comments to explain intent.
  - id: CS-12-002
    priority: SHOULD
    kind: project
    statement: 'Use-case class names SHOULD carry a suffix that reflects their origin: classes handling inbound received messages SHOULD use the `Received` suffix (e.g., `ValidateReportReceived`); classes expressing local actor-initiated triggers SHOULD use the `Trigger` suffix (e.g., `PublishAdvisoryTrigger`).'
    rationale: Distinguishes messages received from external parties from actions the local actor has decided to take. This
      distinction is fundamental to the Vultron protocol model (see `notes/activitystreams-semantics.md`) and prevents accidentally
      treating incoming messages as local commands.
- id: CS-13
  title: Datetime and Timezone Conventions
  specs:
  - id: CS-13-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: All datetime values produced by the application MUST be timezone-aware and MUST use UTC
    rationale: Naive datetimes are ambiguous in a distributed system where actors may run in different timezones; UTC eliminates
      this ambiguity
  - id: CS-13-002
    priority: MUST
    kind: project
    verification: >-
      `test_application_code_reads_the_clock_only_through_now_utc` in
      `test/core/models/test_helpers.py` parses every module under `vultron/`
      except the `vultron/metadata/` repo tooling and fails on any
      `datetime.now()`, `utcnow()` or `date.today()` call outside the body
      of `now_utc` itself.
    statement: All datetime values MUST be created via the `now_utc()` helper in `vultron.core.models._helpers`
    rationale: >-
      One clock function gives every time the application creates the same form:
      timezone-aware, in UTC and at second precision (CS-13-001, CS-13-003). A direct
      `datetime.now()` call can give a naive or local time. Tests can also replace the
      clock in one place to control time.
  - id: CS-13-003
    priority: SHOULD
    kind: architecture
    statement: All datetime values SHOULD be stored at second precision (microseconds set to zero)
    rationale: >-
      A value with microseconds serializes with a fractional second, and a value
      without them does not. Two stores or peers can then hold different strings for
      the same instant, and an exact comparison fails. `now_utc()` drops microseconds,
      so every time the application creates has one form.
  - id: CS-13-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Embargo deadline datetimes MUST be computed using the `from_now_utc(delta)` / `days_from_now_utc(n)` helpers in `vultron.core.models._helpers` rather than inline arithmetic
    rationale: >-
      An embargo deadline is a protocol commitment that every Participant compares
      with its own clock. The helpers build each deadline from `now_utc()`, so it is
      timezone-aware, in UTC and at second precision. Inline arithmetic can start from
      a naive or local time and give a deadline that peers read as a different
      instant.
  - id: CS-13-005
    priority: MUST
    kind: protocol
    statement: >-
      A wire timestamp this node generates MUST serialize with a UTC offset (`Z` or
      `+00:00`). A timestamp carried from a peer MUST serialize with the explicit
      offset it arrived with, which need not be UTC (CLP-15-007).
    rationale: >-
      UTC is the form every node can write without configuration. A carried timestamp
      is part of an activity that the case ledger records verbatim (CLP-07-011). A
      change from `+05:00` to `Z` keeps the instant but changes the recorded text, so
      replicas then hold different records. CS-13-006 holds the separate rule that
      every wire timestamp has an explicit offset.
    verification: >-
      `test_carried_non_utc_offset_round_trips_through_storage` asserts that an
      inbound `+05:00` `endTime` round-trips through parse, storage and
      serialization unchanged, and `test_minted_timestamp_serialises_with_a_utc_offset`
      asserts a time this node mints serializes with `Z` or `+00:00`.
    relationships:
    - rel_type: depends_on
      spec_id: CLP-15-007
    - rel_type: refines
      spec_id: CS-13-006
      note: picks which explicit offset a wire timestamp carries
    lint_suppress:
    - missing_story_reference
  - id: CS-13-006
    priority: MUST
    kind: foundation
    statement: >-
      Wire-format datetime fields MUST serialize as RFC 3339 date-times with an
      explicit offset; a naive or offset-free value MUST NOT reach the wire.
    rationale: >-
      ActivityStreams 2.0 requires every date-time value to follow the RFC 3339
      `date-time` form, in which the offset is mandatory. A peer cannot read a value without
      an offset as one instant, so it cannot compare it with other times. CS-13-005
      holds Vultron's rules on which offset a timestamp carries.
    verification: >-
      In `test/wire/as2/test_timestamp_offsets.py`,
      `test_a_naive_time_reaches_the_wire_as_an_rfc3339_date_time` and
      `test_a_naive_inbound_time_is_serialised_with_an_offset` assert that a naive
      value, built locally or received, serializes as an RFC 3339 date-time with an
      offset, and `test_minted_timestamp_serialises_with_a_utc_offset` asserts the
      same of a time this node mints. The CS-13-001 tests assert a naive value is
      normalized to UTC before it can reach the wire.
    tags:
    - as2
- id: CS-14
  title: Wire Model Configuration
  specs:
  - id: CS-14-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Wire-layer Pydantic models (classes in `vultron/wire/as2/vocab/`) MUST inherit `model_config` from `as_Base`,
      which sets `alias_generator=to_camel`, `validate_by_name=True`, and `validate_by_alias=True`
    rationale: >-
      One inherited `model_config` gives every wire class the same mapping from Python
      field names to camelCase ActivityStreams keys. A class with its own settings
      could serialize a field under the wrong key, or refuse a valid inbound key. The
      two `validate_by_*` settings let a model accept both the wire key and the Python
      name.
  - id: CS-14-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Core/domain-layer Pydantic models (classes in `vultron/core/models/`) MUST set `populate_by_name=True` in their
      `model_config`
    rationale: >-
      Core code builds objects with Python field names such as `id_` and `type_`,
      while stored rows and serialized forms use the alias spelling. With
      `populate_by_name=True`, one model accepts both spellings, so core code does not
      need to know the alias to build an object.
  - id: CS-14-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Domain event subclasses MUST narrow the `semantic_type` field to a `Literal[MessageSemantics.FOO]` type with
      the corresponding default value
    rationale: >-
      The `Literal` ties each event class to one `MessageSemantics` value. Pydantic
      then refuses an event built with a different value, so an event cannot claim
      a meaning its class does not handle. The default fills the value, so a caller
      does not repeat it.
- id: CS-15
  title: No Compatibility Shims
  specs:
  - id: CS-15-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: When a module, function, variable, or symbol is refactored or replaced, the old symbol MUST be deleted. Compatibility
      aliases, re-exports, and shims that exist solely to avoid updating call sites are prohibited.
    rationale: The codebase is in prototype development; there are no external downstream consumers that require stable import
      paths. Leaving old symbols in place accumulates technical debt and makes the codebase harder to navigate.
- id: CS-16
  title: Method and Variable Naming Safety
  specs:
  - id: CS-16-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Methods and class-level variables MUST NOT be named after Python built-in types (`list`, `dict`, `set`, `tuple`,
      `type`, `object`, `int`, `str`, `float`, `bool`, `bytes`, etc.)
    rationale: >-
      Defining `def list(self, ...)` in a class body shadows the built-in `list` type for all
      subsequent annotations and expressions in that class scope. Any annotation like `list[str]` that
      appears after the method definition resolves to the method (a function), producing a `TypeError`
      at runtime. A `# type: ignore` comment suppresses mypy but does NOT prevent the runtime error.
      Rename the method to avoid the collision (e.g., `list_objects`).
- id: CS-17
  title: Pydantic Models for Structured Data
  specs:
  - id: CS-17-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: CLI tools and any code that reads or writes structured files (YAML frontmatter, JSON, structured config) MUST
      define a Pydantic model for the file structure rather than using `dict.get()` with fallback defaults.
    rationale: Ad-hoc `metadata.get("field", "")` access makes it impossible to distinguish "absent field" from "empty field",
      silently allows invalid data through, and scatters validation logic across callers. A Pydantic model with `ValidationError`
      on missing required fields is the single source of truth and forces callers to handle the error path explicitly.
- id: CS-18
  title: Module Size and Organization
  specs:
  - id: CS-18-001
    priority: SHOULD
    kind: project
    statement: A Python source file SHOULD NOT exceed 500 lines when it mixes multiple distinct responsibilities.
      When the 500-line threshold is crossed, the module MUST be split into a subpackage whose submodules are grouped by semantic
      concern.
    rationale: Large, multi-responsibility files accumulate technical debt, slow review cycles, and make targeted test coverage
      difficult. High-churn large files are especially prone to merge conflicts. The 500-line threshold is a practical signal,
      not a hard language constraint — a coherent single-responsibility module MAY exceed it if all concerns are tightly related.
      The key signal is mixed responsibility.
    verification: 'Any production source file exceeding 500 lines SHOULD be reviewed for mixed-responsibility concerns. A
      codebase scan MAY flag such files for triage. Applies to all layers: core, wire, adapters, use cases, and demo.'
  - id: CS-18-002
    priority: MUST
    kind: project
    statement: 'When a module is split into a subpackage, the resulting submodules MUST themselves comply with CS-18-001.
      The split pattern applies recursively: a submodule that exceeds 500 lines and mixes responsibilities MUST be further
      decomposed.'
    rationale: Splitting a god module into a package does not eliminate the problem if individual submodules re-accumulate
      size. A recursive constraint closes this loophole.
    verification: After any split, confirm that each resulting submodule is below 500 lines or has a single well-defined responsibility.
    relationships:
    - rel_type: refines
      spec_id: CS-18-001
  - id: CS-18-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: A subpackage created by splitting a flat module MUST re-export all previously public names from its `__init__.py`
      to preserve import compatibility with callers.
    rationale: >-
      A split changes how a module is organized, not what it offers. When the package
      `__init__.py` exports every public name of the flat module, an import such as
      `from vultron.foo.nodes import SomeNode` keeps working. The split then changes
      no caller, and its diff holds only the moved code.
    relationships:
    - rel_type: supersedes
      spec_id: CS-15-001
  - id: CS-18-004
    priority: SHOULD
    kind: project
    statement: >-
      The test suite for a subpackage created by splitting a flat module SHOULD mirror the subpackage
      structure: a `test/…/nodes/` (or equivalent) directory with one `test_<submodule>.py` per submodule.
    rationale: A monolithic test file grows in parallel with the flat module and inherits the same blast-radius problem. Mirrored
      test files scope failures to the affected concern and make it easier to add focused per-unit tests.
- id: CS-20
  title: Protocol and Type-Guard Hygiene
  specs:
  - id: CS-20-001
    priority: MUST
    kind: project
    statement: When a field or method is removed from a concrete class that structurally conforms to a `Protocol`, the matching
      declaration MUST also be removed from the Protocol (and vice versa). Protocol members that no longer exist on any conforming
      concrete class MUST NOT be left as stale declarations.
    rationale: >-
      mypy and pyright check only one direction: that a concrete class satisfies the
      Protocol. They do not report a Protocol member that no concrete class has any
      more. A caller typed against the Protocol can then use that member, pass the
      type check, and fail at runtime.
    verification: Diff any PR that removes a field or method from a Protocol-conforming class; confirm the matching Protocol
      declaration is also removed.
  - id: CS-20-002
    priority: MUST
    kind: project
    statement: '`TypeGuard` discriminator functions (e.g., `is_case_model()`) MUST use only fields or methods that are explicitly
      declared on the target `Protocol` as their `hasattr`/`isinstance` checks. Using a method or field that is NOT in the
      Protocol as a discriminator is forbidden.'
    rationale: >-
      A guard that tests a member outside the Protocol depends on a detail that the
      Protocol does not promise. When that member goes away from the concrete class,
      the guard returns `False` for valid objects and gives no error. Code that relies
      on the guard can then skip those objects, far from the cause. A guard that tests
      only Protocol members stays correct for as long as CS-20-001 keeps the Protocol
      current.
    verification: Inspect each `TypeGuard` function; confirm every `hasattr(obj, "x")` check uses an attribute `x` that is
      declared on the target `Protocol`.
- id: CS-19
  title: Test Fixtures Mirroring Production Enums
  specs:
  - id: CS-19-001
    priority: MUST
    kind: project
    statement: A test fixture or constant that enumerates the same value set as a production enum (e.g., a list of expected
      semantic-type strings mirroring `MessageSemantics`) MUST derive its values from the
      enum at import/collection time rather than duplicating them as
      separately-maintained literals.
    rationale: >-
      A copied list of enum values does not change when the enum changes. After a
      rename, the test then checks for values that the enum does not have, and it can
      pass while it checks nothing. A list built from the enum follows each rename,
      and an exclusion that names a removed member fails at collection time, where the
      cause is clear.
    verification: Grep test fixtures for literal string lists that parallel a production enum's member names; replace with
      `[e.value for e in EnumName]` or equivalent, narrowed with an explicit exclusion list where the fixture intentionally
      covers a subset.
- id: CS-21
  title: Collection-Typed Pydantic Field Defaults
  specs:
  - id: CS-21-001
    priority: MUST_NOT
    kind: project
    statement: 'Pydantic model fields whose type is a collection (`dict`, `set`, `list`, or any generic alias thereof) MUST
      NOT use `None` as their default value when the intent is "empty collection if not provided". Use `Field(default_factory=list)`,
      `Field(default_factory=dict)`, or `Field(default_factory=set)` matching the field''s collection type. `None` is only acceptable as a field
      default when it is an intentional sentinel meaning "absent" (as distinct from "empty"), and that distinction must be
      observable in the model''s behaviour or serialisation. Plain function and method parameters are out of scope for this
      rule: `param: set[str] | None = None` with an `x or set()` guard in the body is the correct idiom for optional collection
      parameters, as it avoids the Python mutable-default-argument hazard (`= set()` shares a single object across all calls
      that omit the argument).'
    rationale: >-
      A `None` default for a collection gives two values for "nothing here". Every
      reader must then guard against `None` before it can iterate, and a missed guard
      fails at runtime. An empty default gives one value. Function parameters differ:
      a `= set()` default is one object shared by every call, so there the `None`
      sentinel with an `x or set()` guard is the safe form.
    verification: 'Grep `vultron/` for Pydantic `BaseModel` subclass field declarations that use a bare mutable literal as
      a default (e.g., `field: list[str] = []`, `field: dict[str, Any] = {}`). Each such hit is a violation; replace with
      `Field(default_factory=list)` etc. Plain function/method parameter defaults (`param: set[str] | None = None`) are exempt
      from this check.'
    exceptions:
    - '`None` is permitted as a Pydantic field default when it is a genuine sentinel distinguishing "not provided" from "empty",
      provided the distinction is observable in the model''s behaviour or serialisation (e.g., `BTExecutionResult.errors:
      list[str] | None` where `None` means "no error list was collected" vs `[]` meaning "errors were collected but none occurred").
      AS2 wire-layer fields that use `None` to omit keys from the serialised payload are a common example.'

- id: CS-22
  title: Extract Before Reuse
  specs:
  - id: CS-22-001
    priority: SHOULD
    kind: project
    statement: >-
      Shared logic SHOULD be extracted to a dedicated helper module before it
      is used in a second location. Three similar lines of code is a signal to
      extract; copy-pasting a function body is not acceptable. DRY is a project
      standard.
    rationale: >-
      Copied code copies its defects too. A later fix then has to find and change each
      copy, and a missed copy keeps the defect. Extraction after many copies exist
      costs more, because the copies have usually changed in small ways that must be
      reconciled first. Extraction at the second use keeps one implementation from the
      start.

- id: CS-23
  title: Exception Handler Breadth
  specs:
  - id: CS-23-001
    priority: MUST_NOT
    kind: project
    statement: >-
      A blanket `except Exception` (or a bare `except:`) MUST NOT be used to
      wrap domain logic in `vultron/`. An exception handler MUST catch the
      narrowest concrete exception type(s) it can meaningfully handle, so that
      an unexpected error surfaces loudly instead of being silently absorbed.
      The one sanctioned broad-catch boundary is a behavior-tree node's
      `update()` method, where converting an unexpected error into
      `Status.FAILURE` is the documented node contract (BT-HELPER-01). Any
      other broad catch is permitted only at a genuine framework or execution
      boundary (e.g., the `BTBridge` execution boundary, py_trees
      `setup()`/`initialise()`); such a site MUST be narrowed to the narrowest
      type that covers the boundary and MUST carry an inline comment stating
      what it guards and why.
    rationale: >-
      A broad catch handles every error the same way, including defects nobody
      expected. In this codebase an undocumented broad catch more often hides a defect
      than handles a real case. The error then shows up later as a wrong result, far
      from its cause, or not at all. A narrow catch lets an unexpected error stop the
      work where it happens. The inline comment at a sanctioned boundary tells a
      reviewer what the catch is for, so a reviewer can tell a real boundary from a
      hidden defect.
    verification: >-
      Enforced for `vultron/core/behaviors/` by
      `test/architecture/test_no_broad_except_outside_bt_update.py`: an AST scan
      that fails on any `except Exception` outside a node's `update()` method.
      Genuine framework boundaries are recorded in that test's
      `_DECLARED_EXCLUSIONS` allow-list, one reason per entry, held as an exact
      pinned exemption set (ARCH-18-005). When it is genuinely unclear whether a
      broad catch is load-bearing, apply the instrument-and-count method from #3217 (log the
      class, keys, and error reaching the handler; run the full suite; group by
      cause) before deciding to narrow, delete, or justify it.
    exceptions:
    - A behavior-tree node's `update()` method MAY use `except Exception` to
      convert an unexpected error into `Status.FAILURE` (BT-HELPER-01).
    - A genuine framework/execution boundary MAY catch broadly when narrowed to
      the narrowest covering type and accompanied by an inline comment stating
      what it guards and why; such sites are enumerated in the enforcing test's
      `_DECLARED_EXCLUSIONS` allow-list.
