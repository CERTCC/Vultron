id: CISEC
title: CI Security
description: Requirements for securing CI/CD workflows and GitHub Actions usage in the Vultron project.
scope:

- prototype
- production
tags:
- ci-cd
- security
groups:
- id: CISEC-01
  title: Action Version Pinning
  specs:
  - id: CISEC-01-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: All `uses:` references to third-party or external actions in `.github/workflows/*.yml` MUST be pinned to a
      specific commit SHA rather than a version tag or branch name. Local path references to actions within this repository
      (e.g. `./.github/actions/<name>`) are exempt — they are already pinned to the commit being checked out and have no
      separate tag/release lifecycle to pin against
    rationale: >-
      The owner of an upstream action can move a tag or a branch to new code. Then
      changed code runs in CI with no change in this repository, and it can read
      secrets or change what CI builds. A commit SHA cannot move, so CI runs the same
      code until a change in this repository updates the pin. A local action is
      already fixed to the commit that CI checks out.
    adr:
    - ADR-0014
  - id: CISEC-01-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each SHA-pinned `uses:` reference MUST carry an inline comment identifying the corresponding human-readable
      version tag (e.g., `# v4.1.0`) to aid maintainability
    rationale: >-
      A reviewer cannot tell from a SHA alone which release it pins. The version
      comment shows the release. Then a reviewer can see when a pin is old, or when a
      security advisory applies to the pinned action.
    adr:
    - ADR-0014
  - id: CISEC-01-003
    priority: SHOULD
    kind: process
    statement: A CI verification test SHOULD confirm that all `uses:` lines in `.github/workflows/*.yml` reference a SHA hash
      rather than a mutable version tag or branch name, and that each SHA line carries the human-readable version comment
      required by CISEC-01-002
    rationale: >-
      A person can add an unpinned `uses:` line or drop a version comment by mistake,
      and review does not always see it. A test that reads every workflow file finds
      the mistake in CI. Then the pinning rules (CISEC-01-001, CISEC-01-002) do not
      depend on the memory of each author and reviewer.
    adr:
    - ADR-0014
- id: CISEC-02
  title: Secrets Management
  specs:
  - id: CISEC-02-001
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: Workflow secrets and tokens MUST be stored in GitHub Secrets and MUST NOT appear in repository files
    rationale: >-
      Every person who can read the repository can read a secret in a repository
      file. The secret also stays in the version history after someone deletes the
      file. GitHub Secrets keeps the value out of the files and hides it in the job
      logs.
  - id: CISEC-02-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The minimal set of permissions required MUST be declared explicitly via `permissions:` at the job or workflow
      level
    rationale: >-
      If a workflow does not limit its token, the token gets the default permissions,
      which can be broad. A compromised step or action can then do everything the
      token allows. An explicit, minimal `permissions:` block limits that damage, and
      it shows a reviewer what each workflow can change.
- id: CISEC-03
  title: Artifact Integrity
  specs:
  - id: CISEC-03-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: CI workflows that download third-party artifacts or tools MUST verify signatures or checksums before using
      them
    rationale: Prevents supply-chain attacks via compromised artifacts
- id: CISEC-04
  title: Maintenance
  specs:
  - id: CISEC-04-001
    priority: SHOULD
    kind: process
    statement: SHA pins SHOULD be reviewed and updated on a documented periodic cadence, at minimum when a security advisory
      is issued for the pinned action or when a new minor version is released
    rationale: >-
      A pin that nobody updates keeps the known vulnerabilities of the pinned release,
      and the distance to the current release grows. A review on a fixed cadence, a
      review when an advisory is published, and a review for each new minor version keep
      the pins current. Each update is still a change that a person reviews.
    adr:
    - ADR-0014
  - id: CISEC-04-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: When adding a new workflow step or action, the SHA pin and version annotation MUST be included before the step
      is merged to `main`
    rationale: >-
      A step that merges without its pin runs unpinned code on `main` from the first
      run after the merge. A later fix does not undo what that run did. Thus the pin
      and its version comment must be in the change that adds the step.
    adr:
    - ADR-0014
- id: CISEC-05
  title: CI Failure Notification
  specs:
  - id: CISEC-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Every workflow triggered by push to `main` or by a `schedule` event MUST
      include a step conditioned on failure that files or updates a GitHub Issue.
      The step MUST use the shared `.github/actions/notify-failure` composite
      action. The step MUST fire only on a genuine job `failure` and MUST NOT
      fire on cancellation alone (see CISEC-05-006).
    rationale: >-
      Without a failure alert, nobody sees a broken `main` or a failed scheduled job
      until a developer looks at the Actions tab. An issue puts the failure in the
      issue tracker, where the team already triages work. One shared action makes the
      alert the same in every workflow. A cancelled run is not a failure, so it must
      not cause an alert (CISEC-05-006).
    adr:
    - ADR-0055
  - id: CISEC-05-002
    priority: MUST
    kind: process
    statement: >-
      Every qualifying workflow (per CISEC-05-001) MUST also include a separate
      step conditioned on success that closes any open failure issue for that
      workflow, providing recovery visibility. The close step MUST NOT run on a
      cancelled (concurrency-superseded) run: a step keyed on the `success()`
      status function already satisfies this, and a step keyed on the
      `needs.*.result` aggregate MUST require the absence of `cancelled`
      (`!contains(needs.*.result, 'cancelled')`).
    rationale: >-
      A failure issue that stays open after the workflow recovers is misleading.
      Two dedicated steps (one on failure, one on success) keep each step
      single-purpose and avoid embedding workflow-status logic inside the
      composite action itself. A superseded run must not declare recovery: an
      aggregate with no `failure` but a `cancelled` result proves nothing about
      the commit, because the cancelled job might have failed had it run to
      completion. This is the mirror image of CISEC-05-006, where the notify
      step drops the same exclusion because a genuine `failure` beside a
      `cancelled` sibling is still genuine.
    verification: >-
      `test_close_step_does_not_close_on_cancellation` in
      `test/ci/test_workflow_failure_notification.py` asserts every
      aggregate-keyed close step in a qualifying workflow requires the absence
      of `cancelled`.
  - id: CISEC-05-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Each failure notification issue MUST be tagged with the `ci:main-failure`
      label and a workflow-specific label (e.g., `ci:workflow-python-app`). The
      combination of both labels MUST uniquely identify the open failure issue
      for a specific workflow, enabling the composite action to find and update
      rather than duplicate. Within a workflow, exactly one job MUST run the
      notify step and the close step for its workflow-specific label; when
      more than one job can run in the same workflow run, that job MUST be a
      final job that `needs:` every other job that can run in it and keys on
      the `needs.*.result` aggregate (CISEC-05-002, CISEC-05-006).
    rationale: >-
      The close step closes every open issue that has both labels. If several jobs
      each run a notify step and a close step under the same label, a job that passes
      closes the issue that another job filed. Then the job that finishes last decides
      if a failed `main` stays reported. One final job that reads the result of every
      other job makes one decision for each run.
  - id: CISEC-05-004
    priority: SHOULD
    kind: process
    statement: A CI verification test SHOULD confirm that every qualifying workflow (push to `main` or `schedule` trigger)
      includes the `.github/actions/notify-failure` composite action step.
    rationale: >-
      The author of each new workflow on `main` or on a schedule must remember to add
      the notify step. If the author forgets, the failures of that workflow cause no
      alert, and nobody sees that the alert is missing. A test that finds every
      qualifying workflow finds the missing step in CI.
    adr:
    - ADR-0055
  - id: CISEC-05-005
    priority: SHOULD
    kind: process
    statement: >-
      A workflow triggered on the `issues: labeled` event SHOULD enforce that the
      `ci:main-failure` label is bot-managed: if `github.actor` is not
      `github-actions[bot]`, the label MUST be removed immediately. This prevents
      label spoofing that could suppress failure notification or create false alerts.
    rationale: >-
      The `ci:main-failure` label is the deduplication key used by the composite
      action to find and update an existing failure issue rather than creating a
      new one. If a human or external actor applies the label manually, the signal
      is corrupted — the action may comment on an unrelated issue or fail to file
      a new one. Bot-only enforcement keeps the alerting signal reliable.
  - id: CISEC-05-006
    priority: MUST
    kind: process
    statement: >-
      The failure-conditioned notify step (CISEC-05-001) MUST NOT file a failure
      issue on cancellation alone, and MUST file when any job in the run
      genuinely failed, even if a sibling job in the same run was cancelled. A
      step keyed on the GitHub Actions `failure()` status function already
      satisfies both, because `failure()` is false on cancellation. A step keyed
      on the `needs.*.result` aggregate MUST key on
      `contains(needs.*.result, 'failure')` alone: it MUST NOT file on
      cancellation directly (e.g. via `|| contains(needs.*.result, 'cancelled')`)
      and MUST NOT require the absence of `cancelled` (e.g. via
      `&& !contains(needs.*.result, 'cancelled')`). Instead, every job that
      consumes another job's artifact MUST be skipped when its producer was
      cancelled (DEMOCI-04-007), so that a `failure` in the aggregate is always
      genuine.
    rationale: >-
      When a newer merge makes the concurrency group cancel a push run on `main`, the
      cancelled run is not a CI failure. The newer run gives the current result, and
      it files or closes the issue. A cancelled run can look like a failure in two
      ways. A guard can file on cancellation directly. Or a cancelled job can make a
      job that needs its artifact fail, and that failure then shows in the
      `needs.*.result` aggregate. The `failure()` status function is not affected by
      either. For the aggregate, the fix for the missing artifact is to skip the
      consumer when its producer was cancelled. A guard that ignores every run with a
      `cancelled` result cannot tell a real failure from a false one. It then hides
      the alert when a newer push cancels a job after another job really failed, for
      example lint jobs cancelled beside failing tests. The close step keeps its
      cancellation exclusion, because a cancelled run must not report recovery either
      (CISEC-05-002).
    verification: >-
      In `test/ci/test_workflow_failure_notification.py`,
      `test_notify_step_does_not_file_on_cancellation` asserts no qualifying
      workflow's notify step files on cancellation directly,
      `test_notify_step_files_on_failure_mixed_with_cancellation` asserts no
      aggregate-keyed notify step requires the absence of `cancelled`, and
      `test_invariant_harness_skipped_when_demo_cancelled` asserts the one
      artifact consumer skips on a cancelled producer.
    relationships:
      - rel_type: refines
        spec_id: CISEC-05-001
  - id: CISEC-05-007
    priority: MUST
    kind: process
    statement: >-
      A failure notification issue filed by the composite action MUST carry the
      `Bug` issue type. The action MUST set the type itself, immediately after
      creating the issue, by resolving the repository's `Bug` issue type by name
      and applying it through the `updateIssue` GraphQL mutation; when a later
      notify run finds the open failure issue still untyped, it MUST apply the
      type then. It MUST NOT rely on applying a `bug` label for the
      label-to-issue-type workflow to convert, and it MUST fail visibly if no
      `Bug` issue type exists.
    rationale: >-
      `gh issue create` cannot set an issue type. Without a separate mutation, a failure
      issue has no type, and no issue-type query finds it. The label-to-issue-type
      workflow cannot fix this. An event that a workflow causes with its own
      `GITHUB_TOKEN` does not start other workflows, so nothing converts a `bug` label
      that the action applies. A lookup by name still works when someone creates the
      type again. A later run sets the type when one mutation failed. If no `Bug` type
      exists, the action fails with an error, so the problem shows in the run.
    verification: >-
      In `test/ci/test_workflow_failure_notification.py`,
      `test_notify_action_sets_bug_issue_type` asserts the action sets the
      `Bug` type through `.github/scripts/ensure-issue-type.sh` on both the
      create and the comment-on-existing arm;
      `test_issue_type_helper_resolves_the_type_by_name` asserts that helper
      resolves the type by name and applies it via `updateIssue` with
      `issueTypeId`; and
      `test_issue_type_helper_fails_visibly_without_the_type` asserts its
      no-type guard exits non-zero with an `::error::` annotation.
    relationships:
      - rel_type: refines
        spec_id: CISEC-05-001
