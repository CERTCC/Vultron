id: NF
title: Notes Frontmatter
description: >-
  Requirements for YAML frontmatter in notes files, covering the required schema, a
  Pydantic-based loader, validation enforcement, migration requirements, what a note
  is for and how it is written, and the report that flags delivered plan notes.
scope:
- prototype
- production
tags:
- documentation
- tooling
groups:
- id: NF-01
  title: Frontmatter Schema
  specs:
  - id: NF-01-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Every `notes/*.md` file (except `notes/README.md`) MUST contain a YAML frontmatter block
      delimited by `---` at the top of the file.
    rationale: >-
      Tooling and agents use the frontmatter to select which notes to read, and they do
      not open each body. A note without a frontmatter block cannot be selected and
      cannot be validated.
  - id: NF-01-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The frontmatter MUST include a `title` field whose value is a non-empty string matching
      the file's `# H1` heading.
    rationale: >-
      Indexes and agents use the title to name a note. If the title is not the same as
      the H1, the note has two names, and a reader cannot tell that they are one file.
  - id: NF-01-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The frontmatter MUST include a `status` field whose value is one of: `active`, `draft`,
      `superseded`, `archived`.
    rationale: >-
      A reader must know if a note is current before the reader acts on it. A closed
      vocabulary lets tooling remove superseded and archived notes from a selection.
      Free text does not let tooling do this.
  - id: NF-01-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      When `status` is `superseded`, a `superseded_by` field MUST be present and MUST contain
      a non-empty string identifying the replacement file path (e.g., `notes/new-topic.md`
      or `specs/new-spec.md`).
    rationale: >-
      A superseded note is useful only if it points to the file that replaced it.
      Without that pointer, a reader who opens the note cannot find the current
      guidance.
  - id: NF-01-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The optional `description` field, when present, MUST be a non-empty string summarising
      the file's purpose for tooling and agents.
    rationale: >-
      An empty description looks like a value, but it gives tooling and agents no data
      for a selection. When the field is present, it must be a non-empty string, so that
      the field always gives information.
  - id: NF-01-006
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The optional `related_specs` field, when present, MUST be a non-empty list of non-empty
      strings naming related specification files (e.g., `["specs/behavior-tree-integration.md"]`).
    rationale: >-
      Tooling and agents use related-spec lists to go from a note to the requirements
      that it informs. An empty list or an empty entry looks like a link, but it points
      to nothing.
  - id: NF-01-007
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The optional `related_notes` field, when present, MUST be a non-empty list of non-empty
      strings naming related notes files.
    rationale: >-
      Related-note lists let a reader find related guidance. An empty list or an empty
      entry looks like a link, but it points to nothing.
  - id: NF-01-008
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: 'The optional `relevant_packages` field, when present, MUST be a non-empty list of non-empty strings naming packages relevant to the note''s topic. Each entry MUST be either a dot-separated Python package name (e.g., `vultron.core`) or a top-level package directory name (e.g., `vultron`).'
    rationale: >-
      Package lists connect a note to the code that it governs. Thus an agent that edits
      a package can find the notes for that package. Entries are package names only, so
      a tool can compare them with import paths mechanically.
  - id: NF-01-009
    priority: MUST
    kind: process
    statement: >-
      The frontmatter MUST include a `kind` field whose value is one of `guidance`, `plan`,
      or `generated`, as defined by NF-08-002.
    rationale: >-
      The kind sets the lifecycle of the note. A plan note retires when its work lands.
      A guidance note stays. A tool writes a generated note again each time it runs.
      Without a declared kind, no reader or tool can tell which rules apply to the note.
    verification: >-
      Unit tests assert that a note without `kind`, or with a value outside the three, is
      rejected; the corpus test (NF-04-001) asserts every note declares one.
    relationships:
    - rel_type: depends_on
      spec_id: NF-08-002
  - id: NF-01-010
    priority: MUST
    kind: process
    statement: >-
      A note whose `kind` is `plan` MUST include a `tracks` field: a non-empty list of GitHub
      issue references in `#N` form naming the issues the plan informs and their parent
      epic. A note of any other `kind` MUST NOT include `tracks`.
    rationale: >-
      Tooling uses the tracked issues to find when the work of a plan is done
      (NF-09-001). The note also tracks the parent epic, not only the leaf issues. Thus
      the note stays active while related work continues. For example, a Concern closed
      by a split into Tasks, or a leaf moved to a different epic, does not close all
      tracked issues. Only plans have work to track, so `tracks` on a different kind
      gives a false signal.
    verification: >-
      Unit tests assert that a `plan` note without `tracks`, a non-`plan` note with `tracks`,
      an empty list, and a malformed reference are each rejected.
  - id: NF-01-011
    priority: MUST
    kind: process
    statement: >-
      A note whose `kind` is `generated` MUST begin its body, immediately after the
      frontmatter, with an HTML comment whose text starts with the word `GENERATED` and
      names the command which writes the file. The loader MUST reject a `generated` note without it, naming
      the file per NF-03-006.
    rationale: >-
      The tool of a generated note writes over the file, so the next run removes a hand
      edit. The marker tells an editor not to edit the file by hand, and it names the
      command to run. The loader check prevents a generated note from being processed as
      a hand-written note.
    verification: >-
      Unit tests load a `generated` note with and without the marker; the coverage-matrix
      generator's rendered output validates as a `generated` note.
- id: NF-02
  title: Pydantic Schema Module
  specs:
  - id: NF-02-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `vultron/metadata/notes/` subpackage MUST define a Pydantic model (`NotesFrontmatter`)
      that validates the frontmatter schema described in NF-01.
    rationale: >-
      A Pydantic model gives one executable definition of the schema. Thus the loader,
      the pre-commit hook and the corpus test all apply the same rules.
  - id: NF-02-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `NotesFrontmatter` MUST use a `StrEnum` for the `status` field vocabulary (`NoteStatus`).
    rationale: >-
      A `StrEnum` makes the status vocabulary one type, which validation and code both
      use. Thus validation rejects an unknown status, and the status is not stored.
  - id: NF-02-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Shared base vocabulary (e.g., common `StrEnum` base classes or type aliases) MUST live
      in `vultron/metadata/base.py` and be importable by both `metadata/notes/` and the future
      `metadata/specs/` subpackage.
    rationale: >-
      The notes, specs and history tooling use the same vocabulary types. One shared
      base module defines those types one time, so that each subpackage does not keep
      its own copy.
  - id: NF-02-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `vultron/metadata/` package MUST NOT import from `vultron/core/`, `vultron/wire/`,
      or `vultron/adapters/`; it is a standalone tooling layer with no dependency on application
      code.
    rationale: >-
      The metadata tooling runs in hooks and CI. If it imports application code, it
      becomes slower, and protocol changes can break it. If it stays independent, it can
      validate documents when application code is broken.
- id: NF-03
  title: Loader
  specs:
  - id: NF-03-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `vultron/metadata/notes/` subpackage MUST provide a loader that discovers and parses
      all `notes/*.md` files relative to the repository root.
    rationale: >-
      Validation and selection both need all of the notes. The loader finds each file
      relative to the repository root, so each caller gets the same set from any
      location.
  - id: NF-03-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The loader MUST skip `notes/README.md`.
    rationale: >-
      `notes/README.md` is the directory index, not a note, and it has no note
      frontmatter. If the loader parses it as a note, it fails the validation that all
      other files must pass.
  - id: NF-03-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The loader MUST parse each file's YAML frontmatter block and validate it against `NotesFrontmatter`,
      raising a `ValueError` (or equivalent) on schema violations.
    rationale: >-
      A note that does not agree with the schema must stop the hook and the test. It
      must not load without an error. A `ValueError` gives callers one exception type to
      report.
  - id: NF-03-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The loader MUST return a registry mapping file path to validated `NotesFrontmatter`
      instance.
    rationale: >-
      Callers find notes by path. A registry with the path as its key gives them
      validated frontmatter, and they do not parse each file again.
  - id: NF-03-005
    priority: SHOULD
    kind: project
    statement: >-
      The loader SHOULD resolve the repository root by searching upward from the current working
      directory for a `pyproject.toml` file, so it works correctly regardless of where it
      is called from.
    rationale: >-
      The loader runs from hooks, from tests and from the shell, each with a different
      working directory. The loader finds the root from `pyproject.toml`, so it loads
      the same notes from each of them.
  - id: NF-03-006
    priority: MUST
    kind: project
    statement: >-
      The `ValueError` required by NF-03-003 MUST name the offending notes file per MS-17-001,
      and the loader MUST obtain that attribution from the shared helper named by MS-17-003.
      This applies to the frontmatter parse as well as the `NotesFrontmatter` validation — a
      malformed frontmatter block MUST NOT surface as a raw parser traceback.
    rationale: >-
      The loader reads all files in `notes/`, so an error that names only a field path
      does not identify the incorrect file. A frontmatter block that the parser cannot
      read causes a YAML error, which is not a `ValueError`. Without this rule, that
      error does not obey the contract of NF-03-003, and the pre-commit hook shows a
      traceback.
    verification: >-
      Unit tests assert that a notes file with an unparseable frontmatter block and one with an
      invalid `status` value each raise a `ValueError` naming that file.
    relationships:
    - rel_type: implements
      spec_id: MS-17-001
    - rel_type: implements
      spec_id: MS-17-003
    - rel_type: refines
      spec_id: NF-03-003
      note: constrains the error NF-03-003 requires to name its file
- id: NF-04
  title: Validation Enforcement
  specs:
  - id: NF-04-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A pytest test MUST load all `notes/*.md` files via the loader and assert that every
      file parses without validation errors.
    rationale: >-
      The pre-commit hook runs only when a note file is staged. Thus a change to the
      loader or schema can break existing notes, and the hook does not run. A test in
      the suite runs on each change, so all notes are known to parse at each commit.
  - id: NF-04-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A pre-commit hook MUST validate the frontmatter of any changed `notes/*.md` file before
      the commit is accepted.
    rationale: >-
      A check at commit time finds a frontmatter error while the author has the file
      open. Without it, CI or the next tool that reads the file finds the error later.
- id: NF-05
  title: Migration
  specs:
  - id: NF-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      All existing `notes/*.md` files (except `notes/README.md`) MUST have compliant YAML
      frontmatter added as part of the initial implementation of this spec.
    rationale: >-
      The corpus test (NF-04-001) fails on each non-compliant note. Thus the schema
      could be enforced only after each existing note had frontmatter.
  - id: NF-05-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The `status` field added during migration MUST accurately reflect the current state
      of each file's content.
    rationale: >-
      Readers use `status` to decide if a note is current. If the status is a default
      value and does not come from the content, stale notes show as active and current
      notes do not.
- id: NF-06
  title: Maintenance
  specs:
  - id: NF-06-001
    priority: SHOULD
    kind: process
    statement: >-
      When modifying any `notes/*.md` file, the author SHOULD review and update its frontmatter
      — in particular `status`, `related_specs`, and `related_notes` — to reflect any changes
      in scope or relationships.
    rationale: >-
      Tools and agents select notes by their frontmatter. If the frontmatter does not
      agree with the note, it gives incorrect data to all of them. The author of an edit
      that changes the scope of a note knows the new values at that time.
  - id: NF-06-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      `AGENTS.md` MUST document the frontmatter maintenance rule so that AI coding agents
      apply it consistently.
    rationale: >-
      During usual edits, agents follow `AGENTS.md`, not this spec. If the rule is not
      in `AGENTS.md`, agents edit notes and do not update the frontmatter.
- id: NF-07
  title: 'Future: Registry and Query Tool'
  specs:
  - id: NF-07-001
    priority: MAY
    kind: project
    statement: >-
      A query/dump tool MAY be built (in a later task) that accepts a topic keyword and returns
      all notes (and eventually specs) whose frontmatter indicates relevance to that topic.
    rationale: >-
      A topic lookup on frontmatter lets an agent find the notes for a topic without a
      read of each note. The requirement is optional, because a person can already use
      the frontmatter to select notes by hand.
  - id: NF-07-002
    priority: MAY
    kind: project
    statement: >-
      The `notes/README.md` index MAY be generated from the notes registry in a later task,
      replacing the manually-maintained summaries with content derived from `description`
      frontmatter fields.
    rationale: >-
      A hand-maintained index becomes different from the notes that it summarizes. An
      index generated from the `description` fields stays the same as the notes, but
      somebody must build the generator.
- id: NF-08
  title: Note Kinds and Content
  specs:
  - id: NF-08-001
    priority: MUST
    kind: process
    statement: >-
      A note MUST exist only to inform work that has not been done yet. Once that work lands,
      the note's content MUST either be archived (PD-03-004) or, if it remains useful beyond
      that stage, be moved to `docs/` (reference material) or into a `guidance` note
      (lasting rules). `notes/` MUST NOT be used as a narrative history of the project; git
      and `plan/history/` hold the history.
    rationale: >-
      A note that records history does not tell the reader what to do next. It also
      becomes longer with each change that it records. A note stays only until its work
      lands, so `notes/` stays small enough to read. Git and `plan/history/` already
      keep the history.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
    relationships:
    - rel_type: refines
      spec_id: PD-03-004
  - id: NF-08-002
    priority: MUST
    kind: process
    statement: >-
      The `kind` values MUST be applied as follows. `guidance`: a rule for changing the
      project without repeating a known mistake, or a procedure for a recurring task, that
      would still be true and still change how someone works if every open issue were closed.
      `plan`: a design or decision for work the code does not do yet, too large or too
      cross-cutting for one issue body. `generated`: a file a tool writes. Material that is
      none of these — reference material, or rationale for delivered work — MUST NOT be kept
      in `notes/`; it belongs in `docs/` or the archive.
    rationale: >-
      Each kind has a different lifecycle. Thus a writer must be able to apply a test to
      find the kind of a note. Reference material and the rationale for delivered work
      have a permanent location in `docs/` or the archive. If they stay in `notes/`,
      each note takes longer to read.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
  - id: NF-08-003
    priority: MUST
    kind: process
    statement: >-
      Each note MUST have exactly one `kind`. A plan item MUST NOT be added to a `guidance`
      note; it goes in a `plan` note (a new one if needed) or in the issue itself. When a plan
      is delivered, its lasting lessons MUST be promoted into the matching `guidance` note,
      or `docs/`, before the plan note is archived.
    rationale: >-
      A plan item in a guidance note gives a permanent note a part that expires. Nothing
      removes that part when the plan lands. If the lasting lessons are promoted before
      the plan note is archived, the project keeps them.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
    relationships:
    - rel_type: depends_on
      spec_id: NF-08-002
  - id: NF-08-004
    priority: MUST
    kind: process
    statement: >-
      Each item in a `guidance` note MUST be stated as the rule, the reason for it, and at
      most one citation (issue, ADR, or spec ID). It MUST NOT carry provenance chains,
      HTML `Source:` comments, accounts of how a defect hid or was found, change-history
      lists, migration-complete notices, reconstructions of removed features, copies of live
      code, `file.py:line` tables, or inventories a test already enforces. The writing guide
      at `.agents/skills/shared/notes-writing-guide.md` holds the full pattern list.
    rationale: >-
      A reader of a guidance note needs the rule and the reason. The reader does not
      need the story of how somebody found the rule, and git already keeps that story.
      The listed patterns make the note longer, but they do not tell the reader what to
      do. Copies of code or test-enforced inventories become incorrect when the source
      changes.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
- id: NF-09
  title: Plan Retirement Report
  specs:
  - id: NF-09-001
    priority: MUST
    kind: project
    statement: >-
      The `notes-tracks` command MUST list every `plan` note whose tracked issues (NF-01-010)
      are all closed, and every `plan` note that tracks a number that is not a known issue.
    rationale: >-
      Plan notes retire when their work lands (NF-08-001), but nothing tells a
      maintainer when that occurs. The command lists the plans whose tracked issues are
      all closed, or whose references are unknown, so that the next sweep includes them.
    verification: >-
      Unit tests of the pure report function cover an all-closed note, a note with a closed
      leaf under an open epic, an unknown reference, and a `guidance` note.
  - id: NF-09-002
    priority: MUST_NOT
    kind: project
    statement: >-
      The `notes-tracks` command MUST NOT archive, edit, or fail on a flagged note; a flagged
      note is an agenda item for the next notes sweep, decided by a person or the sweep's
      interview. The command exits non-zero only when the issue lookup itself fails.
    rationale: >-
      A closed issue is evidence, not proof, that a plan is delivered; follow-up bugs and
      re-scoped work often keep a plan relevant past its first issue.
    verification: >-
      A unit test runs the command with an all-closed plan note and asserts it exits 0,
      prints the finding, and leaves the note file unchanged; another asserts a failed
      issue lookup exits 2.
    relationships:
    - rel_type: refines
      spec_id: NF-09-001
