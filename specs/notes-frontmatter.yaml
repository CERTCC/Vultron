id: NF
title: Notes Frontmatter
description: >-
  Requirements for YAML frontmatter in notes files, covering the required schema, a
  Pydantic-based loader, validation enforcement, migration requirements, what a note
  is for and how it is written, and the report that flags delivered plan notes.
scope:
- prototype
- production
tags:
- documentation
- tooling
groups:
- id: NF-01
  title: Frontmatter Schema
  specs:
  - id: NF-01-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Every `notes/*.md` file (except `notes/README.md`) MUST contain a YAML frontmatter block
      delimited by `---` at the top of the file.
    rationale: >-
      Tooling and agents decide which notes to read from their frontmatter, without
      opening every body. A note with no frontmatter block is invisible to that
      selection and cannot be validated.
  - id: NF-01-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The frontmatter MUST include a `title` field whose value is a non-empty string matching
      the file's `# H1` heading.
    rationale: >-
      The title is how indexes and agents name a note. If it differs from the H1, the
      same note goes by two names and a reader cannot tell they are one file.
  - id: NF-01-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The frontmatter MUST include a `status` field whose value is one of: `active`, `draft`,
      `superseded`, `archived`.
    rationale: >-
      A reader needs to know whether a note is current before acting on it. A closed
      vocabulary lets tooling filter out superseded and archived notes, which free text
      would not allow.
  - id: NF-01-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      When `status` is `superseded`, a `superseded_by` field MUST be present and MUST contain
      a non-empty string identifying the replacement file path (e.g., `notes/new-topic.md`
      or `specs/new-spec.md`).
    rationale: >-
      A superseded note is only useful if it points to what replaced it. Without that
      pointer a reader who lands on it has no route to the current guidance.
  - id: NF-01-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The optional `description` field, when present, MUST be a non-empty string summarising
      the file's purpose for tooling and agents.
    rationale: >-
      An empty description gives tooling and agents nothing to choose by while still
      looking like a value. Requiring a non-empty string when the field is present means
      its presence always carries information.
  - id: NF-01-006
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The optional `related_specs` field, when present, MUST be a non-empty list of non-empty
      strings naming related specification files (e.g., `["specs/behavior-tree-integration.md"]`).
    rationale: >-
      Related-spec lists are how tooling and agents move from a note to the requirements
      it informs. An empty list or an empty entry looks like a link but leads nowhere.
  - id: NF-01-007
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The optional `related_notes` field, when present, MUST be a non-empty list of non-empty
      strings naming related notes files.
    rationale: >-
      Related-note lists let a reader find neighbouring guidance. An empty list or an
      empty entry looks like a link but leads nowhere.
  - id: NF-01-008
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: 'The optional `relevant_packages` field, when present, MUST be a non-empty list of non-empty strings naming packages relevant to the note''s topic. Each entry MUST be either a dot-separated Python package name (e.g., `vultron.core`) or a top-level package directory name (e.g., `vultron`).'
    rationale: >-
      Package lists map a note to the code it governs, so an agent editing a package can
      find the notes for it. Restricting entries to package names keeps the mapping
      mechanical to match against import paths.
  - id: NF-01-009
    priority: MUST
    kind: process
    statement: >-
      The frontmatter MUST include a `kind` field whose value is one of `guidance`, `plan`,
      or `generated`, as defined by NF-08-002.
    rationale: >-
      The kind decides the note's lifecycle: a plan note retires when its work lands,
      guidance persists, and a generated note is rewritten by a tool. Without a declared
      kind, no reader or tool can tell which rules apply to the note.
    verification: >-
      Unit tests assert that a note without `kind`, or with a value outside the three, is
      rejected; the corpus test (NF-04-001) asserts every note declares one.
    relationships:
    - rel_type: depends_on
      spec_id: NF-08-002
  - id: NF-01-010
    priority: MUST
    kind: process
    statement: >-
      A note whose `kind` is `plan` MUST include a `tracks` field: a non-empty list of GitHub
      issue references in `#N` form naming the issues the plan informs and their parent
      epic. A note of any other `kind` MUST NOT include `tracks`.
    rationale: >-
      The tracked issues are what lets tooling tell when a plan's work is done
      (NF-09-001). Tracking the parent epic as well as the leaf issues keeps the note
      alive while related work continues: a Concern closed by being split into Tasks, or
      a leaf moved to another epic, does not by itself make every tracked issue closed.
      Only plans have work to track, so `tracks` on another kind would carry a false
      signal.
    verification: >-
      Unit tests assert that a `plan` note without `tracks`, a non-`plan` note with `tracks`,
      an empty list, and a malformed reference are each rejected.
  - id: NF-01-011
    priority: MUST
    kind: process
    statement: >-
      A note whose `kind` is `generated` MUST begin its body, immediately after the
      frontmatter, with an HTML comment whose text starts with the word `GENERATED` and
      names the command which writes the file. The loader MUST reject a `generated` note without it, naming
      the file per NF-03-006.
    rationale: >-
      A generated note is overwritten by its tool, so a hand edit is lost on the next
      run. The marker tells an editor not to edit the file by hand and names the command
      to run instead, and the loader check keeps a generated note from being mistaken
      for a hand-written one.
    verification: >-
      Unit tests load a `generated` note with and without the marker; the coverage-matrix
      generator's rendered output validates as a `generated` note.
- id: NF-02
  title: Pydantic Schema Module
  specs:
  - id: NF-02-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `vultron/metadata/notes/` subpackage MUST define a Pydantic model (`NotesFrontmatter`)
      that validates the frontmatter schema described in NF-01.
    rationale: >-
      A Pydantic model gives one executable definition of the schema, so the loader, the
      pre-commit hook and the corpus test all enforce the same rules.
  - id: NF-02-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `NotesFrontmatter` MUST use a `StrEnum` for the `status` field vocabulary (`NoteStatus`).
    rationale: >-
      A `StrEnum` makes the status vocabulary a single type that validation and code
      both use, so an unknown status is rejected rather than stored.
  - id: NF-02-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Shared base vocabulary (e.g., common `StrEnum` base classes or type aliases) MUST live
      in `vultron/metadata/base.py` and be importable by both `metadata/notes/` and the future
      `metadata/specs/` subpackage.
    rationale: >-
      The notes, specs and history tooling share vocabulary types. One shared base
      module keeps those types defined once instead of copied into each subpackage.
  - id: NF-02-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `vultron/metadata/` package MUST NOT import from `vultron/core/`, `vultron/wire/`,
      or `vultron/adapters/`; it is a standalone tooling layer with no dependency on application
      code.
    rationale: >-
      The metadata tooling runs in hooks and CI, where importing application code would
      slow it down and tie it to protocol changes. Keeping it independent lets it
      validate documents even when application code is broken.
- id: NF-03
  title: Loader
  specs:
  - id: NF-03-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `vultron/metadata/notes/` subpackage MUST provide a loader that discovers and parses
      all `notes/*.md` files relative to the repository root.
    rationale: >-
      Validation and selection both need the whole set of notes. A loader that finds
      every file relative to the repository root gives each caller the same set wherever
      it runs.
  - id: NF-03-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The loader MUST skip `notes/README.md`.
    rationale: >-
      `notes/README.md` is the directory index, not a note, and carries no note
      frontmatter. Parsing it as a note would fail the validation every other file must
      pass.
  - id: NF-03-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The loader MUST parse each file's YAML frontmatter block and validate it against `NotesFrontmatter`,
      raising a `ValueError` (or equivalent) on schema violations.
    rationale: >-
      A note that fails the schema must stop the hook and the test, not load silently.
      Raising a `ValueError` gives callers one exception type to report.
  - id: NF-03-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The loader MUST return a registry mapping file path to validated `NotesFrontmatter`
      instance.
    rationale: >-
      Callers look notes up by path. A registry keyed by path gives them validated
      frontmatter without re-parsing each file.
  - id: NF-03-005
    priority: SHOULD
    kind: project
    statement: >-
      The loader SHOULD resolve the repository root by searching upward from the current working
      directory for a `pyproject.toml` file, so it works correctly regardless of where it
      is called from.
    rationale: >-
      The loader runs from hooks, tests and the shell, each with a different working
      directory. Finding the root from `pyproject.toml` makes it load the same notes
      from any of them.
  - id: NF-03-006
    priority: MUST
    kind: project
    statement: >-
      The `ValueError` required by NF-03-003 MUST name the offending notes file per MS-17-001,
      and the loader MUST obtain that attribution from the shared helper named by MS-17-003.
      This applies to the frontmatter parse as well as the `NotesFrontmatter` validation — a
      malformed frontmatter block MUST NOT surface as a raw parser traceback.
    rationale: >-
      The loader walks every file in `notes/`, so an error that names only a field path
      does not say which file is wrong. A frontmatter block that fails to parse raises a
      YAML error, which is not a `ValueError`, so without this rule it would escape
      NF-03-003's contract and reach the pre-commit hook as a traceback.
    verification: >-
      Unit tests assert that a notes file with an unparseable frontmatter block and one with an
      invalid `status` value each raise a `ValueError` naming that file.
    relationships:
    - rel_type: implements
      spec_id: MS-17-001
    - rel_type: implements
      spec_id: MS-17-003
    - rel_type: refines
      spec_id: NF-03-003
      note: constrains the error NF-03-003 requires to name its file
- id: NF-04
  title: Validation Enforcement
  specs:
  - id: NF-04-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A pytest test MUST load all `notes/*.md` files via the loader and assert that every
      file parses without validation errors.
    rationale: >-
      The pre-commit hook checks only changed files, so a corpus-wide test is what
      guarantees that the whole notes directory parses at any commit.
  - id: NF-04-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A pre-commit hook MUST validate the frontmatter of any changed `notes/*.md` file before
      the commit is accepted.
    rationale: >-
      Checking at commit time catches a frontmatter error while the author still has the
      file open, instead of in CI or the next time a tool reads it.
- id: NF-05
  title: Migration
  specs:
  - id: NF-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      All existing `notes/*.md` files (except `notes/README.md`) MUST have compliant YAML
      frontmatter added as part of the initial implementation of this spec.
    rationale: >-
      The corpus test (NF-04-001) fails on any non-compliant note, so the schema could
      be enforced only once every existing note had frontmatter.
  - id: NF-05-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      The `status` field added during migration MUST accurately reflect the current state
      of each file's content.
    rationale: >-
      Readers trust `status` to decide whether a note is current. A status set to a
      default rather than from the content would mark stale notes active and hide
      current ones.
- id: NF-06
  title: Maintenance
  specs:
  - id: NF-06-001
    priority: SHOULD
    kind: process
    statement: >-
      When modifying any `notes/*.md` file, the author SHOULD review and update its frontmatter
      — in particular `status`, `related_specs`, and `related_notes` — to reflect any changes
      in scope or relationships.
    rationale: >-
      Tools and agents select notes by their frontmatter, so frontmatter that disagrees
      with the note misleads every one of them. The edit that changes a note's scope is
      the moment its author knows the new values.
  - id: NF-06-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      `AGENTS.md` MUST document the frontmatter maintenance rule so that AI coding agents
      apply it consistently.
    rationale: >-
      Agents follow `AGENTS.md`, not this spec, during routine edits. Unless the rule is
      written where they read, they edit notes without updating the frontmatter.
- id: NF-07
  title: 'Future: Registry and Query Tool'
  specs:
  - id: NF-07-001
    priority: MAY
    kind: project
    statement: >-
      A query/dump tool MAY be built (in a later task) that accepts a topic keyword and returns
      all notes (and eventually specs) whose frontmatter indicates relevance to that topic.
    rationale: >-
      Topic lookup over frontmatter would let an agent find the notes for a topic
      without reading every note. The requirement is optional because the frontmatter
      already supports selection by hand.
  - id: NF-07-002
    priority: MAY
    kind: project
    statement: >-
      The `notes/README.md` index MAY be generated from the notes registry in a later task,
      replacing the manually-maintained summaries with content derived from `description`
      frontmatter fields.
    rationale: >-
      A hand-maintained index drifts from the notes it summarises. Generating it from
      the `description` fields would keep the two in step, at the cost of building the
      generator.
- id: NF-08
  title: Note Kinds and Content
  specs:
  - id: NF-08-001
    priority: MUST
    kind: process
    statement: >-
      A note MUST exist only to inform work that has not been done yet. Once that work lands,
      the note's content MUST either be archived (PD-03-004) or, if it remains useful beyond
      that stage, be moved to `docs/` (reference material) or into a `guidance` note
      (lasting rules). `notes/` MUST NOT be used as a narrative history of the project; git
      and `plan/history/` hold the history.
    rationale: >-
      A note that records history does not tell the reader what to do next, and it grows
      with every change it narrates. Bounding a note's life by the work it informs keeps
      `notes/` small enough to read, while git and `plan/history/` already hold the
      history.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
    relationships:
    - rel_type: refines
      spec_id: PD-03-004
  - id: NF-08-002
    priority: MUST
    kind: process
    statement: >-
      The `kind` values MUST be applied as follows. `guidance`: a rule for changing the
      project without repeating a known mistake, or a procedure for a recurring task, that
      would still be true and still change how someone works if every open issue were closed.
      `plan`: a design or decision for work the code does not do yet, too large or too
      cross-cutting for one issue body. `generated`: a file a tool writes. Material that is
      none of these — reference material, or rationale for delivered work — MUST NOT be kept
      in `notes/`; it belongs in `docs/` or the archive.
    rationale: >-
      Each kind has a different lifecycle, so a note's kind must follow from a test a
      writer can apply. Reference material and rationale for delivered work have a
      permanent home in `docs/` or the archive, and keeping them in `notes/` makes every
      note longer to read.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
  - id: NF-08-003
    priority: MUST
    kind: process
    statement: >-
      Each note MUST have exactly one `kind`. A plan item MUST NOT be added to a `guidance`
      note; it goes in a `plan` note (a new one if needed) or in the issue itself. When a plan
      is delivered, its lasting lessons MUST be promoted into the matching `guidance` note,
      or `docs/`, before the plan note is archived.
    rationale: >-
      Mixing plan items into guidance gives a lasting note a part that expires, and
      nothing removes that part when the plan lands. Promoting the lasting lessons
      before archiving keeps them when the plan note goes.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
    relationships:
    - rel_type: depends_on
      spec_id: NF-08-002
  - id: NF-08-004
    priority: MUST
    kind: process
    statement: >-
      Each item in a `guidance` note MUST be stated as the rule, the reason for it, and at
      most one citation (issue, ADR, or spec ID). It MUST NOT carry provenance chains,
      HTML `Source:` comments, accounts of how a defect hid or was found, change-history
      lists, migration-complete notices, reconstructions of removed features, copies of live
      code, `file.py:line` tables, or inventories a test already enforces. The writing guide
      at `.agents/skills/shared/notes-writing-guide.md` holds the full pattern list.
    rationale: >-
      A reader of a guidance note needs the rule and the reason, not the story of how
      the rule was found, which git already holds. The listed patterns add length
      without telling the reader what to do, and copies of code or test-enforced
      inventories go stale as soon as the source changes.
    verification: >-
      Checked by review: the `learn` skill's notes staleness review and each notes sweep
      apply it to every note, and PR review applies it to changed notes against the
      writing guide.
- id: NF-09
  title: Plan Retirement Report
  specs:
  - id: NF-09-001
    priority: MUST
    kind: project
    statement: >-
      The `notes-tracks` command MUST list every `plan` note whose tracked issues (NF-01-010)
      are all closed, and every `plan` note that tracks a number that is not a known issue.
    rationale: >-
      Plan notes retire when their work lands (NF-08-001), but nothing tells a
      maintainer when that has happened. Listing the plans whose tracked issues are all
      closed, or whose references are unknown, puts them on the next sweep's agenda.
    verification: >-
      Unit tests of the pure report function cover an all-closed note, a note with a closed
      leaf under an open epic, an unknown reference, and a `guidance` note.
  - id: NF-09-002
    priority: MUST_NOT
    kind: project
    statement: >-
      The `notes-tracks` command MUST NOT archive, edit, or fail on a flagged note; a flagged
      note is an agenda item for the next notes sweep, decided by a person or the sweep's
      interview. The command exits non-zero only when the issue lookup itself fails.
    rationale: >-
      A closed issue is evidence, not proof, that a plan is delivered; follow-up bugs and
      re-scoped work often keep a plan relevant past its first issue.
    verification: >-
      A unit test runs the command with an all-closed plan note and asserts it exits 0,
      prints the finding, and leaves the note file unchanged; another asserts a failed
      issue lookup exits 2.
    relationships:
    - rel_type: refines
      spec_id: NF-09-001
