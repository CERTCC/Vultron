id: PRM
title: Participant Role Management
description: Defines the API for reading and mutating CVD roles on CaseParticipant, the one participant class shared by
  the core domain and the wire layer (ADR-0099). Requires the role-management methods, prohibits direct attribute mutation after construction,
  and mandates test coverage for each method.
scope:
- prototype
- production
tags:
- protocol
groups:
- id: PRM-01
  title: Role Read API
  specs:
  - id: PRM-01-001
    priority: MUST
    kind: project
    statement: 'CaseParticipant MUST expose a read-only `roles` property that returns `list[CVDRole]`, providing a stable
      public interface for iterating a participant''s current roles without directly accessing the `case_roles` field.'
    rationale: 'A named property decouples callers from the internal storage field, enabling future changes to how roles are
      stored without updating every call site.'
    verification: >-
      Inspection of `vultron/core/models/case_participant/participant.py` confirms a
      `roles` property
      returning `list[CVDRole]`; the architecture test in
      `test/architecture/test_participant_case_roles.py` confirms no direct `case_roles`
      reads appear outside the class.
    tags:
    - protocol
    stories:
    - story_2022_063
  - id: PRM-01-002
    priority: MUST
    kind: project
    statement: 'CaseParticipant MUST expose a `has_role(role: CVDRole) -> bool` method that returns True when the participant
      holds the given role, False otherwise.'
    rationale: 'Provides a clear, named predicate for role-presence checks rather than requiring callers to write `role in
      participant.case_roles`.'
    verification: >-
      A unit test confirms that `has_role()` returns `True` when the role is in the
      participant's role set and `False` when it is absent.
    tags:
    - protocol
    stories:
    - story_2022_063
  - id: PRM-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Core code in `vultron/core/` MUST use `participant.roles` or
      `participant.has_role(role)` for role-presence checks and role iteration, never
      a direct read of `participant.case_roles` outside the `CaseParticipant` class.
    rationale: 'Encapsulating storage access in the class boundary allows the internal representation to change without cascading
      updates across the core.'
    tags:
    - protocol
    - tooling
- id: PRM-02
  title: Role Mutation API
  specs:
  - id: PRM-02-001
    priority: MUST
    kind: project
    statement: 'CaseParticipant MUST expose an `add_role(role: CVDRole, raise_when_present: bool = False) -> None` method
      that adds a role to the participant''s role set.'
    rationale: 'A named method provides a single place to enforce invariants (e.g. deduplication, logging) whenever a role
      is added.'
    verification: >-
      Inspection of `vultron/core/models/case_participant/participant.py` confirms
      `add_role()` is defined
      with the correct signature; a unit test confirms the role appears in
      `participant.roles` after the call.
    tags:
    - protocol
    stories:
    - story_2022_063
  - id: PRM-02-002
    priority: MUST
    kind: project
    statement: >-
      Unless `raise_when_present=True`, `add_role()` MUST ignore a role the participant
      already holds, raising no error and leaving the role set unchanged.
    rationale: 'Idempotent add is safe for concurrent or repeated processing.'
    verification: >-
      A unit test confirms that calling `add_role()` twice with the same role raises no
      exception on the second call.
    tags:
    - protocol
    stories:
    - story_2022_013
    - story_2022_063
  - id: PRM-02-007
    priority: SHOULD
    kind: project
    statement: >-
      `add_role()` SHOULD log an INFO-level message when it ignores a duplicate add.
    rationale: >-
      An ignored add leaves no other trace. Logging the skip makes duplicate adds
      visible for debugging.
    relationships:
    - rel_type: extends
      spec_id: PRM-02-002
    verification: >-
      A unit test confirms that the second `add_role()` call with the same role emits
      an INFO-level log message.
    tags:
    - protocol
  - id: PRM-02-003
    priority: MUST
    kind: project
    statement: '`add_role()` MUST raise `KeyError` when `raise_when_present=True` and the given role is already present in
      the participant''s role set.'
    rationale: 'Callers that require strict single-assignment semantics (e.g. role initialization guards) need a fail-fast
      path.'
    verification: >-
      A unit test confirms that `add_role(role, raise_when_present=True)` raises
      `KeyError` when the participant already holds that role.
    tags:
    - protocol
  - id: PRM-02-004
    priority: MUST
    kind: project
    statement: 'CaseParticipant MUST expose a `remove_role(role: CVDRole, raise_when_missing: bool = False) -> None` method
      that removes a role from the participant''s role set.'
    rationale: 'A named method provides a single place to enforce invariants whenever a role is removed.'
    verification: >-
      Inspection of `vultron/core/models/case_participant/participant.py` confirms
      `remove_role()` is
      defined with the correct signature; a unit test confirms the role is absent from
      `participant.roles` after the call.
    tags:
    - protocol
    stories:
    - story_2022_063
    - story_2022_066
  - id: PRM-02-005
    priority: MUST
    kind: project
    statement: >-
      Unless `raise_when_missing=True`, `remove_role()` MUST ignore a role the
      participant does not hold, raising no error and leaving the role set unchanged.
    rationale: 'Idempotent remove is safe for repeated processing.'
    verification: >-
      A unit test confirms that calling `remove_role()` for an absent role raises no
      exception.
    tags:
    - protocol
    stories:
    - story_2022_063
    - story_2022_066
  - id: PRM-02-008
    priority: SHOULD
    kind: project
    statement: >-
      `remove_role()` SHOULD log an INFO-level message when it ignores the removal of a
      role the participant does not hold.
    rationale: >-
      An ignored remove leaves no other trace. Logging the skip makes spurious removes
      visible for debugging.
    relationships:
    - rel_type: extends
      spec_id: PRM-02-005
    verification: >-
      A unit test confirms that calling `remove_role()` for an absent role emits an
      INFO-level log message.
    tags:
    - protocol
  - id: PRM-02-006
    priority: MUST
    kind: project
    statement: '`remove_role()` MUST raise `KeyError` when `raise_when_missing=True` and the given role is not present in
      the participant''s role set.'
    rationale: 'Callers that rely on strict presence checks before removal need a fail-fast path.'
    verification: >-
      A unit test confirms that `remove_role(role, raise_when_missing=True)` raises
      `KeyError` when the participant does not hold that role.
    tags:
    - protocol
- id: PRM-03
  title: Core Layer Rules
  specs:
  - id: PRM-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Core code in `vultron/core/` MUST make every post-construction change to a
      CaseParticipant's `case_roles` through `add_role()` or `remove_role()`, never by
      direct mutation. Examples of direct mutation are
      `participant.case_roles.append(...)` and `participant.case_roles = [...]`.
    rationale: 'Direct mutation bypasses the class''s encapsulation and any future invariant checks added to the mutation
      methods. Centralising mutations in named methods is the standard object-oriented pattern.'
    tags:
    - protocol
    - tooling
  - id: PRM-03-002
    priority: MUST
    kind: project
    statement: 'Passing `case_roles=[...]` as a constructor argument when creating a CaseParticipant instance is permitted
      and does not violate PRM-03-001; the prohibition applies only to post-construction attribute mutation.'
    rationale: 'Constructor arguments are the canonical way to initialise an immutable value-object. This clarification prevents
      over-application of the rule.'
    verification: >-
      A unit test confirms that `CaseParticipant(case_roles=[CVDRole.REPORTER])`
      constructs successfully and `participant.roles` returns the initial role list.
    tags:
    - protocol
  - id: PRM-03-003
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/architecture/test_validate_assignment_ratchet.py` scans every core
      module for a direct `participant_statuses` write — attribute assignment or
      in-place list mutation — outside
      `vultron/core/models/case_participant/participant.py`
      and fails on any hit; `test/core/models/test_case_participant.py` covers
      the canonical mutator accepting a core-shaped status and rejecting a
      wire-shaped one.
    statement: >-
      Core code under `vultron/core/` MUST NOT mutate `participant_statuses` on a
      CaseParticipant after construction except through the canonical `CaseParticipant`
      mutators. An example of direct mutation is
      `participant.participant_statuses.append(...)`. The mutator methods themselves,
      in `vultron/core/models/case_participant/participant.py`, are exempt.
    rationale: >-
      `ParticipantStatus` has two shapes that are not compatible (SDO-03-002, ADR-0036).
      When a status in the wire shape is added to a list of core-typed statuses, readers
      do not see it. They use an initial state, and the RM ladder of the participant
      resets with no signal. `validate_assignment` cannot stop this, because `append` is
      not an attribute assignment. Only the canonical mutators can check the shape. This
      rule applies PRM-03-001 to `participant_statuses`.
    adr:
    - ADR-0064
    tags:
    - protocol
- id: PRM-04
  title: Wire Layer Interface Parity
  specs:
  - id: PRM-04-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'The wire-layer participant `as_CaseParticipant` (`vultron/wire/as2/vocab/objects/case_participant.py`) MUST
      expose `add_role()`, `remove_role()`, and `has_role()` methods with behavioral contracts equivalent to those on the
      core `CaseParticipant`: idempotent add/remove with optional raise-on-duplicate/missing flags, and a boolean presence
      check. Under ARCH-25-003 the two names are one class, which satisfies this by identity.'
    rationale: 'Callers that work with either domain or wire participant objects should not need to know which class they
      hold in order to manage roles.'
    tags:
    - wire-format
  - id: PRM-04-002
    priority: SHOULD
    kind: project
    statement: >-
      Wire-layer `model_validator` methods in `CaseParticipant` subclasses (e.g.
      `ReporterParticipant`, `VendorParticipant`) that initialise `case_roles` SHOULD
      call `add_role()` rather than assigning to `self.case_roles` directly, so that
      role-management logic is centralised.
    rationale: 'Using `add_role()` in validators ensures any future invariant checks or logging added to `add_role()` apply
      uniformly during construction.'
    tags:
    - wire-format
- id: PRM-05
  title: Testing Requirements
  specs:
  - id: PRM-05-001
    priority: MUST
    kind: project
    statement: 'Unit tests for `CaseParticipant.add_role()` MUST cover: (a) adding a new role, (b) idempotent re-add (no
      exception, INFO log), and (c) `raise_when_present=True` raising `KeyError`.'
    rationale: 'Each distinct branch of the method must be independently verified.'
    verification: >-
      Inspection of `test/core/` confirms test cases covering add-new-role, idempotent
      re-add with INFO-log assertion, and `raise_when_present=True` raising `KeyError`.
    tags:
    - testing
  - id: PRM-05-002
    priority: MUST
    kind: project
    statement: 'Unit tests for `CaseParticipant.remove_role()` MUST cover: (a) removing a present role, (b) idempotent
      remove-when-missing (no exception, INFO log), and (c) `raise_when_missing=True` raising `KeyError`.'
    rationale: 'Each distinct branch of the method must be independently verified.'
    verification: >-
      Inspection of `test/core/` confirms test cases covering remove-present-role,
      idempotent missing-remove with INFO-log assertion, and `raise_when_missing=True`
      raising `KeyError`.
    tags:
    - testing
  - id: PRM-05-003
    priority: MUST
    kind: project
    statement: 'Unit tests for `CaseParticipant.has_role()` MUST cover both the case where the role is present (returns
      True) and the case where it is absent (returns False).'
    rationale: 'Both branches of the boolean predicate must be verified.'
    verification: >-
      Inspection of `test/core/` confirms two test cases for `has_role()`: one where the
      role is present (returns `True`) and one where it is absent (returns `False`).
    tags:
    - testing
  - id: PRM-05-004
    priority: SHOULD
    kind: project
    statement: 'An architecture test SHOULD enforce that no Python source file under
      `vultron/core/` (outside `vultron/core/models/case_participant/participant.py`)
      contains a direct `case_roles` mutation pattern (i.e. `\.case_roles\s*=` or `\.case_roles\.append`).'
    rationale: >-
      A machine-checkable rule prevents regression. Using a targeted file-content
      scan (e.g. ripgrep or stdlib pathlib glob + str search) on a small, bounded
      directory keeps it cheap (PRM-05-005).
    verification: >-
      `test_no_direct_case_roles_mutation_in_core` in
      `test/architecture/test_participant_case_roles.py` scans `vultron/core/` for the
      two mutation patterns and fails on any match outside
      `case_participant/participant.py`.
    tags:
    - testing
    - tooling
  - id: PRM-05-005
    priority: MUST
    kind: project
    statement: 'The architecture test of PRM-05-004 MUST complete within one second.'
    rationale: >-
      The one-second budget keeps the check from slowing the test suite, so it
      stays cheap enough to run on every change.
    verification: >-
      `test_case_roles_mutation_scan_completes_within_one_second` in
      `test/architecture/test_participant_case_roles.py` times the PRM-05-004 scan and
      fails when it takes one second or more.
    relationships:
    - rel_type: extends
      spec_id: PRM-05-004
    tags:
    - testing
    - tooling
- id: PRM-06
  title: Assertion Authority and On-Behalf Exceptions
  specs:
  - id: PRM-06-001
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      Participant status is self-declaratory by default: each participant
      asserts its own RM and VFD state without external approval.  This is why
      they are *participant* status items (ADR-0121).  The one write about a
      participant that the participant does not make is its birth: the
      CASE_MANAGER creates the record at RM ``RECEIVED`` (and VF ``vf`` for a
      vendor) when it sends the stub Invite (CM-11-006, ADR-0114).
    rationale: >-
      The self-declaratory model keeps state authority with the role holder.
      Deviations must be narrow, externally evidenced, and explicitly named
      (ADR-0121).
    adr:
    - ADR-0121
    tags:
    - protocol
    stories:
    - story_2022_062
  - id: PRM-06-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant holding the VENDOR role MUST NOT self-report a vendor-fix state of vf
      (vendor unaware). A vendor's valid self-reports are Vf and VF. The only vf a vendor
      participant carries is the one the CASE_MANAGER writes when the stub Invite creates
      its record (CM-11-006); any reply to that Invite sets V (CM-11-009) (ADR-0121,
      ADR-0114).
    rationale: >-
      A vendor that has answered its Invite, or otherwise acknowledged a message
      about the case, is aware of it.  Allowing a vendor to self-report the
      vendor-unaware state would create an impossible protocol record.
    verification: >-
      ``vendor_vf_invariant_ok`` in ``vultron/core/predicates/participants.py``
      enforces this predicate.  It is called once, from ``_vf_violations`` inside
      ``participant_transition_violations`` in
      ``vultron/core/states/participant_transitions.py``, which both
      ``ValidateTriggerTransitionsNode`` (trigger path) and
      ``CreateParticipantStatusNode`` (BT action path) go through — BTND-10-002
      forbids either node from calling the predicate directly, and
      ``test/architecture/test_participant_status_validation.py`` ratchets that.
      The CASE_MANAGER's birth write at the stub Invite is the one write that
      may carry ``vf`` for a vendor.
      ``test_vendor_cannot_disclaim_awareness`` in
      ``test/core/states/test_participant_transitions.py`` confirms that a VENDOR
      reporting ``vf`` is refused with a PRM-06-002 violation.
    adr:
    - ADR-0121
    - ADR-0114
    tags:
    - protocol
    stories:
    - story_2022_062
  - id: PRM-06-003
    priority: MAY
    kind: protocol
    statement: >-
      A CASE_MANAGER or Case Owner MAY assert ``v→V`` (``Vf``) on behalf of a
      Vendor-role participant when the notification or invite is evidenced. Any vendor
      acknowledgement, including
      ``Read(Invite(Actor)[target=VulnerabilityCaseStub])``, is evidence. The target is
      typically an inert invitee that has not yet replied, and it must already be a
      participant (PRM-06-006). This move is the whole of what the status asserts: it
      cannot be asserted in the same status as the ``d→D`` of PRM-06-004.
    rationale: >-
      Without this path, the case cannot record that an invited vendor is aware until
      the vendor replies to the Invite. A vendor acknowledgement already shows that the
      vendor is aware. The stub Invite creates the record (ADR-0114), so the assertion
      has a target. RM stays the same, so the assertion does not speak for the report
      decisions of the vendor. The pair with `d→D` is excluded: together they are
      `VfD`, which CSB-17-001 does not enumerate, and PRM-06-008 already has the
      entailments refuse it.
    verification: >-
      ``SvcAddOnBehalfStatusUseCase`` implements this path; the asserting
      actor's CASE_MANAGER or CASE_OWNER role is verified by
      ``CheckOnBehalfAuthorizedNode``, and the target's existing Vendor-role
      participant by ``CheckOnBehalfTargetIsParticipantNode``, before any
      write occurs.
    adr:
    - ADR-0121
    tags:
    - protocol
    stories:
    - story_2022_061
  - id: PRM-06-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An on-behalf ``v→V`` write by a CASE_MANAGER or Case Owner MUST NOT change the
      target's RM state (ADR-0121).
    rationale: >-
      RM records the vendor's own report decisions. The on-behalf assertion speaks
      only for the vendor's awareness, which its acknowledgement shows, so it leaves
      RM where the vendor put it.
    relationships:
    - rel_type: extends
      spec_id: PRM-06-003
    verification: >-
      ``test_changes_only_vf_of_an_inert_vendor_invitee`` in
      ``test/core/use_cases/triggers/case/test_add_on_behalf_status.py`` asserts the
      on-behalf write changes only the target's VF state and leaves its RM state
      unchanged.
    adr:
    - ADR-0121
    tags:
    - protocol
    stories:
    - story_2022_061
  - id: PRM-06-004
    priority: MAY
    kind: protocol
    statement: >-
      A CASE_MANAGER or Case Owner MAY assert ``d→D`` (``D``) on behalf of a
      Deployer-role participant, under the same externally-evidenced pattern as
      PRM-06-003. The target must already be a participant (PRM-06-006). This move is
      the whole of what the status asserts: it cannot be asserted in the same status as
      the ``v→V`` of PRM-06-003.
    rationale: >-
      Usually the deployer reports its own deployment. But a deployer that joined and
      has since gone quiet can leave the case unable to record a deployment the case
      has evidence of. The on-behalf limit keeps this narrow exception from becoming a
      general proxy capability, and a deployer that did not join is not in the case at
      all. The pair with `v→V` is excluded: together they are `VfD`, which CSB-17-001
      does not enumerate, and PRM-06-008 already has the entailments refuse it.
    verification: >-
      ``test_target_holding_both_roles_passes_guard_then_entailment_refuses`` in
      ``test/core/use_cases/triggers/case/test_add_on_behalf_status.py`` asserts a
      request carrying both moves reaches the write and is refused by CSB-17-001,
      storing nothing.
    relationships:
    - rel_type: uses_definition
      spec_id: PRM-06-003
    adr:
    - ADR-0121
    tags:
    - protocol
    stories:
    - story_2022_061
  - id: PRM-06-008
    priority: MUST
    kind: protocol
    statement: >-
      The actor processing an on-behalf ``d→D`` assertion MUST apply the cross-machine
      entailments, so it succeeds only for a deployer whose RM state fits deployment.
    rationale: >-
      The on-behalf path is an exception to self-declaration, not a way around the
      rules every status write obeys. Without the entailments, it could record a
      deployment for a deployer that never accepted the report.
    relationships:
    - rel_type: extends
      spec_id: PRM-06-004
    verification: >-
      ``test_succeeds_for_deployer_at_rm_consistent_with_deployment`` and
      ``test_refused_by_entailment_at_any_other_rm`` in
      ``test/core/use_cases/triggers/case/test_add_on_behalf_status.py`` assert the
      write succeeds at an RM state consistent with deployment and is refused by the
      entailment at any other.
    adr:
    - ADR-0121
    tags:
    - protocol
    stories:
    - story_2022_061
  - id: PRM-06-006
    priority: MUST
    kind: protocol
    statement: >-
      An actor processing an on-behalf status assertion MUST refuse it before any write
      if its target is not a case participant, creating no participant.
    rationale: >-
      A status update is never a way into a case; joining is the Invite flow (CM-11,
      ADR-0114).
      If a status update creates the participant that it names, it is a second path into
      a case. That path skips the Invite flow and its consent and entitlement checks. If
      the record is created before the status write, and the write is then refused, a
      stray participant stays. For example, the RM-to-D entailment refuses d to D for a
      target that did not accept the report.
    verification: >-
      A test asserts an on-behalf assertion for an actor that is not a
      participant is refused and leaves the case's roster unchanged.
      ``CheckOnBehalfTargetIsParticipantNode`` enforces it as a read-only
      guard ahead of the only write in the on-behalf tree.
    relationships:
    - rel_type: constrains
      spec_id: PRM-06-003
    - rel_type: constrains
      spec_id: PRM-06-004
    adr:
    - ADR-0121
    tags:
    - protocol
    stories:
    - story_2022_062
  - id: PRM-06-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The f→F transition (fix ready, VF) MUST NOT be asserted by any actor other than the
      Vendor-role holder. Fix readiness is not externally knowable; no on-behalf assertion
      is ever permitted for this transition (ADR-0121).
    rationale: >-
      Allowing a non-vendor to assert fix-readiness would let the CASE_MANAGER
      fabricate protocol-visible fix state, undermining the meaning of the F
      event.
    verification: >-
      ``AddOnBehalfStatusTriggerRequest.vf_state_not_fix_ready`` rejects
      ``CS_vf.VF`` at the request boundary before any BT runs.  On the self-report
      path the VENDOR-only rule lives in ``_vf_violations`` inside
      ``participant_transition_violations``
      (``vultron/core/states/participant_transitions.py``), which both
      ``CreateParticipantStatusNode`` and ``ValidateTriggerTransitionsNode``
      call (BTND-10-002).
    adr:
    - ADR-0121
    tags:
    - protocol
    stories:
    - story_2022_107
