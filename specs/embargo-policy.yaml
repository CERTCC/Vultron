id: EP
title: Embargo Policy
description: >-
  Requirements for a standardized embargo policy record associated with an Actor profile.
  Allows actors to declare their default embargo preferences so that coordinators can evaluate
  compatibility before proposing an embargo or inviting an actor to a case.
version: 1.1.0
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: EP-01
  title: Policy Record Format
  specs:
  - id: EP-01-001
    priority: MAY
    kind: protocol
    statement: >-
      An Actor profile MAY include a `embargo_policy` field containing a structured embargo
      policy record
  - id: EP-01-002
    priority: MUST
    kind: protocol
    statement: 'The embargo policy record MUST include the following fields:'
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-002
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
  - id: EP-01-003
    priority: SHOULD
    kind: protocol
    statement: 'The embargo policy record SHOULD include the following fields:'
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
  - id: EP-01-004
    priority: MUST
    kind: protocol
    statement: >-
      The embargo policy record MUST be serializable as a Pydantic model and persisted in
      the DataLayer
  - id: EP-01-005
    priority: MUST
    kind: protocol
    statement: The embargo policy record MUST use full-URI IDs for `actor_id`
    relationships:
    - rel_type: depends_on
      spec_id: OID-01-001
- id: EP-02
  title: API Endpoint
  specs:
  - id: EP-02-001
    priority: SHOULD
    kind: protocol
    statement: >-
      Each Actor SHOULD expose its embargo policy at `GET /actors/{actor_id}/embargo-policy`
    scope:
    - production
  - id: EP-02-002
    priority: MUST
    kind: protocol
    statement: >-
      The policy endpoint MUST be machine-readable (returns JSON) and MUST be listed in the
      Actor's ActivityPub profile under a well-known key (e.g., `vultron:embargoPolicy`)
    scope:
    - production
- id: EP-03
  title: Policy Compatibility Evaluation
  specs:
  - id: EP-03-001
    priority: SHOULD
    kind: protocol
    statement: >-
      Before proposing an embargo or inviting an actor to join an existing embargo, the CaseActor
      SHOULD retrieve and evaluate the target actor's embargo policy for compatibility with
      the proposed embargo terms
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: implements
      spec_id: VP-07-007
  - id: EP-03-002
    priority: MUST
    kind: protocol
    statement: >-
      Compatibility evaluation MUST check that the proposed duration falls within the target
      actor's `minimum_duration`–`maximum_duration` range, if declared
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-003
    - rel_type: implements
      spec_id: VP-07-004
    - rel_type: implements
      spec_id: VP-07-005
    - rel_type: depends_on
      spec_id: DUR-01-001
    - rel_type: depends_on
      spec_id: DUR-04-001
- id: EP-04
  title: Default Embargo Semantics
  specs:
  - id: EP-04-001
    priority: MUST
    kind: protocol
    statement: >-
      When a receiver applies their published default embargo at case creation and the sender
      submitted no explicit embargo proposal, the initial `CaseStatus.em_state` MUST be set
      to `EM.ACTIVE`, not `EM.PROPOSED`. The sender's report submission without a counter-proposal
      constitutes tacit acceptance of the receiver's default embargo.
    relationships:
    - rel_type: refines
      spec_id: DUR-07-003
  - id: EP-04-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The implementation MUST apply both the PROPOSE and ACCEPT state machine triggers atomically
      within `InitializeDefaultEmbargoNode`. The intermediate `EM.PROPOSED` state MUST NOT
      be persisted or observable externally.
  - id: EP-04-003
    priority: MUST
    kind: protocol
    statement: >-
      When both the sender and receiver have an applicable embargo proposal at case creation
      (sender proposes a duration and receiver has a default), the shorter of the two MUST
      be made active immediately (`em_state = EM.ACTIVE`) and the longer SHOULD be registered
      as a pending revision (`em_state = EM.REVISE`).
  - id: EP-04-004
    priority: MUST
    kind: protocol
    statement: >-
      EP-04-003 is contingent on a sender-proposal mechanism being available. Until such a
      mechanism exists, only the no-sender-proposal case (EP-04-001) applies at case creation.
- id: EP-05
  title: Counter-Revision PEC Cascade Rule
  specs:
  - id: EP-05-001
    priority: MUST
    kind: protocol
    statement: >-
      When an embargo transitions from `ACTIVE` to `REVISE` (counter-revision proposed),
      the CaseActor MUST call `_cascade_pec_revise()` to reset each `SIGNATORY`
      participant's PEC state to `INVITED` so they can re-consent to the revised terms.
    rationale: >-
      Without the PEC cascade, a participant who signed for embargo terms `T1` would
      remain `SIGNATORY` when the embargo is revised to `T2` — implying consent they
      never gave. The cascade makes re-consent explicit.
    relationships:
    - rel_type: implements
      spec_id: CM-18-001
  - id: EP-05-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the embargo is already in `REVISE` state and a further revision proposal
      arrives (`REVISE → REVISE`), the CaseActor MUST NOT call `_cascade_pec_revise()`
      again. The PEC states were already reset by the initial `ACTIVE → REVISE` transition;
      a double cascade would incorrectly re-invite participants who may have already
      re-consented.
    relationships:
    - rel_type: refines
      spec_id: EP-05-001
- id: EP-06
  title: PEC Idempotency
  specs:
  - id: EP-06-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An idempotent retry or re-processing of a participant add-or-update MUST NOT
      overwrite a non-null PEC state with the default `NO_EMBARGO`. Once a participant
      has been assigned any non-default PEC state (`INVITED`, `SIGNATORY`, `LAPSED`,
      or `DECLINED`), that state MUST be preserved across retries.
    rationale: >-
      Overwriting a `SIGNATORY` or `DECLINED` state with `NO_EMBARGO` on retry silently
      revokes or erases consent that was already given. The positive-path idempotency
      rule (don't double-add) is covered by CM-13-005; this rule covers the negative
      path (don't downgrade).
    relationships:
    - rel_type: refines
      spec_id: CM-13-005
    - rel_type: implements
      spec_id: CM-18-001
- id: EP-07
  title: Embargo Invite RSVP Window Policy
  description: >-
    Policy requirements for the embargo invite RSVP window: the fallback default
    when no deadline is on the wire, the minimum permitted window, and the
    clamp-on-receipt rule that neutralises coercively short deadlines.
    Codified by ADR-0065. Source: IDEA-2066.
  specs:
  - id: EP-07-001
    priority: MUST
    kind: protocol
    statement: >-
      The embargo invite RSVP window MUST be configurable. When an
      `Invite(EmbargoEvent)` carries no `Invite.end_time`, implementations MUST
      apply the configured default window, measured from the invitation's
      `published` timestamp. The default value SHOULD be 7 days, matching
      CM-18-002.
    rationale: >-
      Aligning the fallback with the pre-existing CM-18-002 policy window means
      an invitation that omits `end_time` behaves exactly as it does today, so
      adopting CM-28 changes no existing behaviour. See ADR-0065.
    relationships:
    - rel_type: implements
      spec_id: CM-28-002
    adr:
    - ADR-0065
  - id: EP-07-002
    priority: MUST
    kind: protocol
    statement: >-
      A minimum RSVP window MUST be enforced. An inviting actor MUST NOT send an
      `Invite(EmbargoEvent)` whose `Invite.end_time` is less than the configured
      minimum after the invitation's `published` timestamp. The minimum SHOULD
      default to 72 hours.
    rationale: >-
      An unbounded-downward deadline weaponises the mechanism: a one-minute RSVP
      window formally invites a participant while guaranteeing they cannot
      answer, excluding them with the appearance of due process. See ADR-0065.
    adr:
    - ADR-0065
  - id: EP-07-003
    priority: MUST
    kind: protocol
    statement: >-
      A receiving actor that receives an `Invite(EmbargoEvent)` whose
      `Invite.end_time` is earlier than the configured minimum window MUST clamp
      the effective deadline up to that minimum. It MUST NOT reject the invite as
      malformed on the basis of a sub-minimum deadline, and it MUST log the
      clamp.
    note: >-
      Both parties must reach the same effective deadline for CM-28-002 to hold.
      Because the floor is a configured value, a receiver whose floor differs
      from the sender's can compute a different effective deadline. Deployments
      that require strict bilateral agreement SHOULD align their floor
      configuration; the clamp guarantees safety, not identical arithmetic.
    rationale: >-
      Clamping makes a coercive deadline ineffective rather than fatal.
      Rejecting the invitation outright would hand the sender exactly what a
      hostile sender wants — an invite that never takes effect — and would
      punish the invitee for the inviter's misbehaviour. See ADR-0065.
    relationships:
    - rel_type: refines
      spec_id: EP-07-002
    adr:
    - ADR-0065
