id: EP
title: Embargo Policy
description: >-
  Requirements for a standardized embargo policy record associated with an Actor profile.
  Allows actors to declare their default embargo preferences so that coordinators can evaluate
  compatibility before proposing an embargo or inviting an actor to a case.
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: EP-01
  title: Policy Record Format
  specs:
  - id: EP-01-001
    priority: MAY
    kind: protocol
    statement: >-
      An Actor profile MAY include an `embargo_policy` field containing the Actor's structured
      embargo policy record inline. The policy is part of the profile: an Actor has at most one,
      and it is published, read and replaced as a field of the profile, not as a separate object.
    rationale: >-
      Whoever holds an Actor's profile then holds its embargo terms, so carrying the profile
      (CP-01-010) carries the policy, and no lookup has to choose among several records.
    stories:
    - story_2022_001
    - story_2022_003
    - story_2022_009
    - story_2022_011
    - story_2022_076
    - story_2022_095
  - id: EP-01-002
    priority: MUST
    kind: protocol
    statement: 'The embargo policy record MUST include the following fields: actor_id (full URI string identifying the Actor to which this policy applies), inbox (URL string of the Actor''s ActivityPub inbox), preferred_duration (ISO 8601 duration string representing the Actor''s preferred embargo length)'
    verification: >-
      Inspection of the `EmbargoPolicy` Pydantic model confirms that `actor_id`,
      `inbox`, and `preferred_duration` are declared as required fields with no
      default values.
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-002
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
    stories:
    - story_2022_004
    - story_2022_010
    - story_2022_021
    - story_2022_022
    - story_2022_072
  - id: EP-01-003
    priority: SHOULD
    kind: protocol
    statement: >-
      The embargo policy record SHOULD include the optional fields
      `minimum_duration` (ISO 8601 duration), `maximum_duration` (ISO 8601 duration),
      and `notes` (free-text string describing the Actor's embargo preferences).
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
    stories:
    - story_2022_004
    - story_2022_021
    - story_2022_073
  - id: EP-01-004
    priority: MUST
    kind: protocol
    statement: >-
      The embargo policy record MUST be serializable as a Pydantic model and persisted in
      the DataLayer as part of the Actor's profile record (EP-01-001)
    verification: >-
      A unit test confirms that an actor profile carrying an `EmbargoPolicy` round-trips
      through Pydantic serialization and through the DataLayer `save()` and `get()`
      operations without data loss.
    stories:
    - story_2022_004
  - id: EP-01-005
    priority: MUST
    kind: protocol
    statement: The embargo policy record MUST use full-URI IDs for `actor_id`
    verification: >-
      A unit test confirms that `EmbargoPolicy` raises `ValidationError` when
      `actor_id` is a non-URI string and accepts a well-formed `https://` URI.
    relationships:
    - rel_type: depends_on
      spec_id: OID-01-001
    stories:
    - story_2022_034
    - story_2022_035
  - id: EP-01-006
    priority: SHOULD
    kind: protocol
    statement: >-
      When `minimum_duration` is declared, an Actor SHOULD reject embargo proposals
      shorter than that value.
    rationale: >-
      The minimum_duration field signals a floor below which the Actor will not
      accept an embargo; evaluating it prevents compatibility mismatches.
    relationships:
    - rel_type: refines
      spec_id: EP-01-003
  - id: EP-01-007
    priority: SHOULD
    kind: protocol
    statement: >-
      When `maximum_duration` is declared, an Actor SHOULD reject embargo proposals
      longer than that value.
    rationale: >-
      The maximum_duration field signals a ceiling above which the Actor will not
      accept an embargo; evaluating it prevents compatibility mismatches.
    relationships:
    - rel_type: refines
      spec_id: EP-01-003
- id: EP-02
  title: API Endpoint
  specs:
  - id: EP-02-001
    priority: SHOULD
    kind: protocol
    statement: >-
      Each Actor SHOULD expose its embargo policy at `GET /actors/{actor_id}/embargo-policy`
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`TestGetEmbargoPolicy`) confirms the route returns the published record as
      AS2 JSON, answers 404 when none is published, and shows the record the actor's
      profile carries inline, not a free-standing policy record in the store (EP-01-001).
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-002
    priority: MUST
    kind: protocol
    statement: >-
      The policy endpoint MUST be machine-readable (returns JSON) and MUST return the same
      record the Actor's profile carries inline under `embargo_policy` (EP-01-001)
    verification: >-
      A test confirms the endpoint responds with `Content-Type: application/json` and a body
      equal to the `embargoPolicy` value of the Actor's profile document.
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_004
    - story_2022_009
  - id: EP-02-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A hosted Actor SHOULD be able to publish or replace its embargo policy at
      `PUT /actors/{actor_id}/embargo-policy`, carrying only the terms (EP-01-002,
      EP-01-003). The record's `actor_id` and `inbox` MUST be derived from the addressed
      actor's own record, never taken from the body, and the record MUST be persisted as
      the `embargo_policy` field of that actor's profile in its own store (EP-01-004), so
      that the profile carries it inline as the actor default shortest-wins reads at case
      creation (CP-01-010, EP-04-003). A replace MUST leave exactly one policy for the actor.
    rationale: >-
      Nothing in the API wrote an `EmbargoPolicy` before #3972; the only writers were tests
      and the demo seeder, so a Receiver could not be given an actor default without reaching
      into its store. Deriving `actor_id` from the path actor keeps a body from publishing
      terms in another actor's name (EP-01-005). Writing the terms into the one profile field
      makes a replace an overwrite, so there is never a withdrawn default left beside the
      current one for anything to read (#4027).
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`TestPutEmbargoPolicy`) confirms 201 on first publish and 200 on replace with one
      record remaining, `actor_id`/`inbox` derived from the actor record, 404 for an actor
      this node does not host, 422 for a malformed or calendar-unit duration or a body that
      names an actor, and that the stored profile's `embargo_policy` is the published record
      with no free-standing policy record beside it. The published record's id is the
      endpoint URL (`EmbargoPolicy.build_id`), so a replace keeps the id;
      `test_a_publish_leaves_a_seeded_policy_record_unread` confirms a record in the store that
      the profile does not carry is neither read nor counted as a prior publish.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: EP-01-004
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-004
    priority: MUST
    kind: protocol
    statement: >-
      A publish or replace at `PUT /actors/{actor_id}/embargo-policy` MUST NOT overwrite
      an update to the actor's profile that was written after the request read it. The
      write MUST succeed only if the stored profile is still the one the request read;
      otherwise the request MUST re-read the profile and re-apply its terms, and when the
      profile keeps changing under it for a bounded number of attempts it MUST be refused
      with 409 Conflict and MUST write nothing.
    rationale: >-
      The policy is a field of the profile (EP-01-001), so a publish rewrites the whole
      profile, and a plain read-then-save loses a write landing between the two without
      anyone being told (#4102). Re-applying the terms to a fresh read is safe because a
      publish changes only the policy field; the bound keeps a profile under continuous
      write from holding the request open.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`TestConcurrentProfileWrite`) interleaves a profile write between the PUT's read and
      its write and confirms both the concurrent update and the published policy are kept,
      and that a profile changed under every attempt yields 409 with the stored profile
      untouched. `test/adapters/driven/test_sqlite_save_if_unchanged.py` confirms the
      store's compare-and-set refuses a stale expected record and a row changed between
      its own read and write.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: EP-02-003
    stories:
    - story_2022_003
    - story_2022_009
- id: EP-03
  title: Policy Compatibility Evaluation
  specs:
  - id: EP-03-001
    priority: SHOULD
    kind: protocol
    statement: >-
      Before proposing an embargo or inviting an actor to join an existing embargo, the CASE_MANAGER
      SHOULD retrieve and evaluate the target actor's embargo policy for compatibility with
      the proposed embargo terms
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: implements
      spec_id: VP-07-007
    stories:
    - story_2022_005
  - id: EP-03-002
    priority: MUST
    kind: protocol
    statement: >-
      Compatibility evaluation MUST check that the proposed duration falls within the target
      actor's `minimum_duration`–`maximum_duration` range, if declared
    verification: >-
      A unit test confirms that the compatibility evaluator returns incompatible when the
      proposed duration falls outside the declared `minimum_duration`–`maximum_duration`
      range, and compatible when it falls within the range.
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-003
    - rel_type: implements
      spec_id: VP-07-004
    - rel_type: implements
      spec_id: VP-07-005
    - rel_type: depends_on
      spec_id: DUR-01-001
    - rel_type: depends_on
      spec_id: DUR-04-001
    stories:
    - story_2022_005
- id: EP-04
  title: Default Embargo Semantics
  specs:
  - id: EP-04-001
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_OWNER's **actor default** embargo applies at case creation and the sender
      submitted no explicit embargo proposal, the initial `CaseStatus.em_state` MUST be set
      to `EM.ACTIVE`, not `EM.PROPOSED`. The sender's report submission without a counter-proposal
      constitutes tacit acceptance of the CASE_OWNER's actor default embargo.
    note: >-
      "Actor default" is the duration carried by a published `EmbargoPolicy`, as distinguished
      from the "protocol default" of EP-04-005. Only the actor default participates in the
      shortest-wins comparison (EP-04-003); the protocol default never does (EP-04-006).
      Amended by ADR-0096.
    verification: >-
      Integration tests in `test/demo/test_establish_embargo_demo.py` confirm that a
      case created without a sender-side embargo proposal immediately enters `EM.ACTIVE`,
      with no intermediate `EM.PROPOSED` record persisted in the DataLayer.
    relationships:
    - rel_type: refines
      spec_id: DUR-07-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The implementation MUST apply both the PROPOSE and ACCEPT state machine triggers atomically
      within `InitializeDefaultEmbargoNode`. The intermediate `EM.PROPOSED` state MUST NOT
      be persisted or observable externally.
    verification: >-
      The `initialize_creation_embargo` service tests confirm that the creation-time operation
      hands the store one commit (`save_many`) holding the case at `EM.ACTIVE` with the embargo
      attached, the participant consent records, the case owner's SIGNATORY seed and, for a
      contested creation, the revision's `EmbargoEvent` with the case at `EM.REVISE`; that a
      refused P/X/A check, an unheld embargo, a missing owner record or a case that has left
      `EM.NONE` writes nothing; and that a failed commit writes nothing and a rerun completes.
      `TestCreationTimeEmbargoIsOneWrite` refuses the ACCEPT step after PROPOSE has been applied
      and asserts the stored case stays at `EM.NONE`, and that a rerun then reaches `EM.ACTIVE`
      with an attached embargo (EP-04-012, #4123).
      `TestCreationTimeEmbargoCommitsItsEffectsWithIt` faults the owner-seed write and the
      revision write in turn and asserts the case stays at `EM.NONE` and that a rerun seeds
      the owner and registers the revision (#4142).
  - id: EP-04-003
    priority: MUST
    kind: protocol
    statement: >-
      When both the sender and the CASE_OWNER have an applicable embargo proposal at case
      creation (the sender proposes a duration and the CASE_OWNER's profile carries an embargo
      policy, its actor default — EP-01-001, CP-01-010), the shorter of the two MUST
      be made active immediately (`em_state = EM.ACTIVE`) and the longer SHOULD be registered
      as a pending revision (`em_state = EM.REVISE`).
    rationale: >-
      Two parties that propose 30 and 60 days respectively agree on days 1–30 and disagree
      only on days 31–60. Activating the shorter embargo immediately captures all mutual
      agreement; the longer duration becomes a pending revision so the proposer can negotiate
      the contested portion. This is strictly better than rejecting outright: both parties
      secure the overlap they both wanted. See docs/topics/process_models/em/formal_model.md
      § "Why the shortest proposal wins" for the full vector-agreement derivation.
    note: >-
      An exact tie between the sender's terms and the actor default leaves nothing contested,
      so no revision is registered and the case stays at `EM.ACTIVE`. The comparison is of the
      time remaining at creation: the actor default is a duration from creation, and the
      sender's remaining time is `end_time` minus now, so comparing them is comparing end dates.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`TestEP04SenderProposalAtCaseCreation`) confirms that when both parties carry a
      proposal at case creation the shorter is the active embargo and the longer is registered
      through `EmbargoLifecycle.propose_embargo`, leaving `em_state` at `EM.REVISE` with the
      loser in `proposed_embargoes`; `test/core/behaviors/case/nodes/test_embargo_resolution.py`
      pins the duration table. The same class's
      `test_a_second_proposal_for_the_same_report_registers_no_second_revision` and
      `test/core/behaviors/case/nodes/test_embargo.py`
      (`test_a_second_run_registers_no_second_revision`) confirm initialization runs once per
      case: a repeated proposal for the same report leaves one active embargo and one pending
      revision. End to end, `test/demo/test_report_with_embargo_demo.py` runs the
      `report-with-embargo` exchange demo through the Reporter's `submit-report` trigger in
      both directions of the comparison.
    relationships:
    - rel_type: refines
      spec_id: EP-08-001
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-004
    priority: MUST
    kind: protocol
    statement: >-
      A sender MUST be able to propose embargo terms when submitting a report, by embedding a
      proposed `EmbargoEvent` in the `Offer(VulnerabilityReport)` activity. The proposed
      `EmbargoEvent` carries the report URI as its `context` (EP-04-009), and the
      CASE_MANAGER MUST rewrite that context to the case URI at case creation.
    rationale: >-
      This discharges the contingency this requirement previously recorded. Until ADR-0096 no
      sender-proposal mechanism existed, so EP-04-003 was unreachable and only the
      no-sender-proposal path applied. Implemented by #3392: the Offer carries the proposal as
      `proposedEmbargo`; the report receiver's `CaseProposal` carries the Offer whole (CP-01-008); the
      case-actor's `CreateEmbargoEventNode` keeps the Reporter's event and rewrites its context.
    note: >-
      Embedding the proposal on the report offer was chosen over two alternatives. An
      activity-level `end_time` on the `Offer` would add a third meaning to a field CM-28-001
      already names a critical naming hazard. Inlining the sender's own `EmbargoPolicy` states
      a standing preference, not terms for this report — "I generally prefer 30 days" is not
      "for this report I propose 30 days". Amended by ADR-0096.
    verification: >-
      `test/wire/as2/test_report_offer_proposed_embargo.py` confirms that `Offer(VulnerabilityReport)`
      carrying a proposed `EmbargoEvent` is extracted with the proposal intact, on the Offer and on the
      `CaseProposal` that carries it; `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`TestEP04SenderProposalAtCaseCreation`) confirms the context is rewritten from the report URI to
      the case URI when the case is created, with the event's identity kept.
      `test/core/use_cases/triggers/test_report_triggers.py` (`TestSubmitReportProposedEmbargo`) and
      `test/adapters/driving/fastapi/routers/test_trigger_report.py` confirm a sender states the
      terms through the `submit-report` trigger's `proposed_embargo_end_time`, which stores the
      `EmbargoEvent` about the report and carries it on the Offer (#3971).
    relationships:
    - rel_type: refines
      spec_id: EP-04-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-005
    priority: MUST
    kind: protocol
    statement: >-
      A **protocol default** embargo duration MUST exist and MUST be configurable. It MUST be
      no less than 72 hours and no more than 5 days. When an embargo-eligible case is created and
      no embargo proposal and no actor default applies, the protocol default MUST be used and the
      case MUST begin at `EM.ACTIVE`. Where the case is not embargo-eligible, EP-04-008 applies
      instead and no protocol default embargo is created.
    rationale: >-
      The goal of the EM process is to lock in *an* embargo as early as possible
      (`docs/topics/process_models/em/principles.md`). A case with no embargo is the outcome
      the process exists to avoid, and reaching it through mutual silence is the least
      deliberate way to arrive there.
    note: >-
      The duration is deliberately short so that publishing an `EmbargoPolicy` is strictly
      better than publishing nothing. The previous hardcoded 90-day fallback inverted that
      incentive: a receiver who published nothing got a longer embargo than one who published a
      considered 30 days.

      The 72-hour floor is not arbitrary — it equals the *configured* EP-07-002 minimum RSVP
      window, so the shortest embargo the protocol produces is exactly as long as the shortest
      answer window it grants. Note that this alignment holds at the configured values only:
      EP-07-002's effective minimum is the lesser of that window and the time remaining in the
      embargo, precisely so that the floor cannot outlive a shorter agreed embargo (EP-07-006).
      The 5-day ceiling prevents a deployment from quietly restoring a value generous enough to
      re-invert the incentive.

      This overturns `docs/topics/process_models/em/defaults.md` § "No Defaults, No Proposals"
      and its corpus encoding VP-07-001, both of which stated that no embargo SHALL exist in
      this case. See ADR-0096.
    verification: >-
      A unit test asserts that a case created with no `EmbargoPolicy` in the store and no
      sender proposal reaches `EM.ACTIVE` at the configured protocol default, and that
      configuring a value outside [72 hours, 5 days] is refused.
    relationships:
    - rel_type: constrains
      spec_id: VP-07-001
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The protocol default MUST NOT participate in the shortest-wins comparison of EP-04-003.
      It is the value applied when no proposal and no actor default applies, never a candidate
      within that comparison.
    rationale: >-
      A 72-hour protocol default that competed under shortest-wins would win against every
      longer proposal and cap every embargo in the system at 72 hours, so no longer embargo
      could ever be agreed. The protocol default answers "what if nobody said anything", not
      "whose terms are shortest". See ADR-0096.
    verification: >-
      A unit test asserts that a 30-day actor default with no sender proposal yields a 30-day
      active embargo, not the protocol default.
    relationships:
    - rel_type: constrains
      spec_id: EP-04-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The protocol default MUST NOT be applied as a minimum on agreed embargo terms. A
      proposal or actor default shorter than the protocol default MUST be honored at its
      stated duration and MUST NOT be clamped up to it.
    rationale: >-
      `em/principles.md` requires embargo duration be "limited to the shortest duration
      possible", and a Participant is free to set their own terms. EP-04-005's range bounds
      what the fallback may be configured to; it does not constrain what parties may agree.
      A reporter who proposes 12 hours gets 12 hours. See ADR-0096.
    verification: >-
      A unit test asserts that a sender proposal shorter than the configured protocol default
      is activated at its stated duration.
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The protocol default MUST NOT be applied to a case that is not embargo-eligible. When
      any of P/X/A is set at case creation, no protocol default embargo is created and the
      case MUST remain at `EM.NONE`.
    rationale: >-
      VP-06-001 already forbids proposing or accepting an embargo negotiation once the
      vulnerability is public, exploit code is public, or attacks are observed (EMB-01-002 is the
      accept half of the same prohibition). An embargo on an already-public vulnerability
      protects nothing, so the protocol default inherits that guard rather than bypassing it.
      See ADR-0096.
    verification: >-
      A unit test asserts that a case created with `pxa_state != CS_pxa.pxa` receives no
      protocol default embargo and remains at `EM.NONE`.
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
    - rel_type: constrains
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-009
    priority: MUST
    kind: protocol
    statement: >-
      `EmbargoEvent.context` MUST identify the subject the embargo concerns: the report URI
      before a case exists, and the case URI afterwards. A reader MUST NOT assume the context
      is a case without checking.
    rationale: >-
      A proposal embedded on `Offer(VulnerabilityReport)` (EP-04-004) precedes the case, so it
      has no case URI to point at. Widening the subject is a semantic change, not a type change:
      the field is `EmbargoEvent.context` in `vultron/core/models/embargo_event.py`, typed
      `NonEmptyString`, and nothing validates it as a case reference. This also gives pre-case
      embargo terms a legitimate home, which is what CONCERN-2215 asked for; what ADR-0096
      declines is the pre-case *phase*, not the *representation*.
    note: >-
      Do not confuse this field with `VultronEvent.context` in
      `vultron/core/models/events/base.py`, which is typed `CoreObject | None` and holds the
      *inbound activity's* resolved context. The casts to `VulnerabilityCase` in
      `vultron/core/models/events/embargo.py` are on that field, for `Announce`/`Invite` events
      whose context genuinely is a case, and are unaffected by this widening.
    verification: >-
      `test/wire/as2/test_report_offer_proposed_embargo.py` confirms an `EmbargoEvent` constructed with
      a report URI context validates and travels on the Offer; `CreateEmbargoEventPattern` admits both
      subjects (VAM-05-001). No consumer of `EmbargoEvent.context` casts it to a case: the field is read
      as an identifier only.
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-010
    priority: MUST_NOT
    kind: project
    statement: >-
      Implementations MUST NOT conflate the actor default with the protocol default. The two
      MUST be carried under distinct names, so that a consumer can distinguish "the CASE_OWNER
      published this duration" from "the CASE_OWNER published nothing". The protocol default MUST
      be the single source of the fallback duration: no other implicit default embargo duration
      may be carried anywhere in the implementation.
    rationale: >-
      `_preferred_embargo_duration()` returned its fallback into the same blackboard key
      (`default_embargo_duration`) that a published `EmbargoPolicy` filled, so no downstream
      code could tell the two apart. That conflation is why a silent 90-day fallback survived
      in contradiction of three documents. Additionally, that function selected `policies[0]`
      from an unordered list, making the applicable policy arbitrary when an actor's store
      holds more than one. See ADR-0096.
    note: >-
      The 90-day constant and the shared blackboard key are gone (#3390): the fallback is
      `ActorConfig.protocol_default_embargo_duration`, published as
      `protocol_default_embargo_duration` beside `actor_default_embargo_duration`, and the
      actor default is the one `embargo_policy` the CASE_OWNER's inline profile carries
      (`actor_default_duration()`; EP-01-001, CP-01-010), so there is no list to select
      from. The third
      implicit duration — `EmbargoEvent.end_time`'s 45-day `default_factory` in
      `vultron/core/models/embargo_event.py` — is gone too (#3404): `end_time` is required
      with no default, so every construction site states the end it means, and the protocol
      default resolved at case creation is the only fallback duration in the implementation.
    verification: >-
      Inspection of `vultron/core/behaviors/case/nodes/embargo_resolution.py` and
      `vultron/core/services/embargo_duration.py` confirms the actor default and the protocol
      default are resolved under distinct names, and that the actor default is read from
      the single policy field of the CASE_OWNER's inline profile rather than selected from
      the store. Inspection of
      `vultron/core/models/embargo_event.py` confirms no independent default embargo duration
      remains on `EmbargoEvent.end_time`.
    adr:
    - ADR-0096
  - id: EP-04-011
    priority: MUST
    kind: protocol
    statement: >-
      The pending revision that EP-04-003 registers at case creation MUST follow the same
      relay as any other revision proposal (EP-09). The CASE_MANAGER MUST propose it on behalf
      of the party whose terms lost the shortest-wins comparison, with that party in
      `attributedTo`, MUST commit it as a proposal entry — the committed relayed Invite is that
      entry, and no separate proposal entry is committed — MUST record it in the open-proposal
      record so that the owner's default selection (EP-08-002) can reach it, and MUST relay it
      as an `Invite(EmbargoEvent)` to the other party. The party whose terms lost is the
      proposer and is not invited (EP-09-002).
    rationale: >-
      A revision registered in the CASE_MANAGER's store alone is invisible to the party whose
      terms won and unreachable by the owner: it was never indexed, so the default selection
      could not name it, and no Invite was ever emitted for it (#3863). The creation-time
      revision is a revision like any other; the only thing special about it is who proposes
      it, and CM-24 already covers the CASE_MANAGER proposing on a participant's behalf.
    note: >-
      Which party lost is known at registration:
      `initial_embargo_duration.source` on the blackboard names whether the sender's proposal
      or the actor default became active. When
      the reporter's longer terms lost, the reporter is the proposer and the case owner is
      invited; when the owner's longer default lost, the owner is the proposer and the
      reporter is invited. An exact tie registers no revision (EP-04-003) and relays nothing.
      No proposal activity exists at creation, so the committed relayed Invite is itself the
      proposal entry; no second entry is committed. The open-proposal record is written once
      the Invite is sent, not at registration: the case reaches every participant whole in
      the bootstrap `Create`, and a record already naming the Invite would read to the winner
      as an Invite it had already answered. The relay is owed durably: a
      `PendingCreationTimeRevisionRelay` record, committed together with the revision
      and deleted once the relay is discharged, survives a failed relay — including one
      whose committed Invite never reached the outbox — so a redelivered
      proposal or the startup retry runner completes it (the CP-05-005 retry-marker
      pattern). A retry outside the case tree sends nothing until the case's genesis
      ledger entry is committed (CM-14-007, CM-14-011).
    verification: >-
      A marker test of `InitializeDefaultEmbargoNode` asserts that a contested
      creation registers the loser as an open proposal without indexing it. Tree tests of
      the case-proposal received tree assert the relayed `Invite(EmbargoEvent)` for both
      directions — `actor` the CASE_MANAGER, `attributedTo` the losing party, queued to the
      winning party, committed, then indexed in `pending_embargo_proposal_index` for the
      owner's default selection, with the bootstrap `Create` carrying no index entry — and
      that a tie or a redelivered proposal relays no second Invite, while a redelivery after
      a failed relay sends the owed one. Node tests assert that an owner who reported to
      itself has nothing relayed or indexed, that a failed relay keeps its obligation and a
      retry completes it once, that an Invite already committed is not sent again, that no
      relay precedes the case's genesis entry, and that the proposer's replica indexes the
      replayed Invite while the invitee's does not. Startup-runner tests assert the retry,
      its CASE_MANAGER gate, and that a failure never stops the server starting. Node and
      service tests (`TestTheRevisionIsConsentedToByItsProposer`) assert that the losing
      party's record, not the executing actor's, gains the revision id, that a failed
      registration leaves neither the revision nor its relay record, and that a contest with
      no report to name the reporter fails before the initialization commit, leaving the
      case at `EM.NONE` (MSM-07-005, #4152, #4156).
    relationships:
    - rel_type: refines
      spec_id: EP-04-003
    - rel_type: depends_on
      spec_id: EP-09-002
      note: The creation-time revision is relayed by the same rule as any other revision.
    - rel_type: depends_on
      spec_id: EP-08-002
      note: Indexing the revision is what lets the default selection reach it.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-012
    priority: MUST
    kind: project
    statement: >-
      Creation-time embargo initialization MUST run at most once per case. A
      `Create(as_CaseProposal)` that resolves to an existing `VulnerabilityCase` MUST NOT
      run it again in any EM state other than `NONE` — `PROPOSED`, `ACTIVE`, `REVISE`, or
      `EXITED` — and any embargo terms carried on such a proposal MUST NOT be reconciled against the
      case: the embargo belongs to the case, not to the report, so terms that conflict with
      the case lose to the case. A case still at `EM.NONE` has never been initialized
      (EP-04-002 never persists `PROPOSED`), and initialization MUST proceed for it.
    rationale: >-
      "Initialized" cannot be read from the case's active-embargo reference, because
      termination clears that reference while the EM state stays `EXITED`. A guard keyed on
      the reference reads an exited case as uninitialized and runs the creation arm, which
      stores a fresh `EmbargoEvent` before the EM machine refuses the `EXITED → PROPOSED`
      step it has no transition for — an orphan write and an unanswerable proposal (#3986).
      The EM state is the evidence: the machine never returns to `NONE` once it has left it,
      so "has left `NONE`" is exactly "initialization has run", and `NONE` still admits the
      half-built case a redelivery must be allowed to finish.
    note: >-
      The reuse path is a lost-reply recovery (CP-05-006): "duplicate" here means an exact
      redelivery of the same proposal, not a second report describing the same
      vulnerability, which is a report-management matter (RMB-11-002). In
      `InitializeDefaultEmbargoNode` the guard arm reads the state through
      `ReadEmStateNode` (the behaviors-layer rule for EM reads) and, like every refusal arm
      ahead of a write, raises rather than returns FAILURE when it cannot answer.
      `ReadEmStateNode` itself reports an unreadable case as FAILURE with the cause in
      `result_out["error"]`, so the arm converts a read that left `em_before` unset into a
      raise; only `em_before == NONE` may return FAILURE, because falling through to the
      creation arm is the right answer there. Skipping
      the whole creation arm is what leaves the proposal's terms unreconciled: the
      shortest-wins comparison and the pending-revision registration both live inside it.
    verification: >-
      `test/core/behaviors/case/nodes/test_embargo_resolution.py` runs
      `InitializeDefaultEmbargoNode` once, terminates the embargo through
      `EmbargoLifecycle`, runs the subtree again and asserts SUCCESS, EM still `EXITED`, no
      `active_embargo`, and no additional `EmbargoEvent` stored; the same module covers
      the guard's SUCCESS for every state but `NONE`, the half-built case (`EM.NONE`, no
      embargo) still completing, an `ACTIVE` or `REVISE` rerun storing no event and
      registering no revision, and an unreadable EM state raising. A tree-level test in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` redelivers the same
      `Create(CaseProposal)` after exit and asserts it is answered with the case's embargo
      state and events unchanged.
    relationships:
    - rel_type: refines
      spec_id: EP-04-002
      note: The never-persisted PROPOSED state is what makes "has left NONE" a clean reading.
    - rel_type: depends_on
      spec_id: CP-05-006
      note: The reuse path this rule guards is the duplicate-proposal recovery path.
    - rel_type: depends_on
      spec_id: EMB-18-001
      note: The guard reads EM state; it never writes it.
- id: EP-05
  title: Revision Activation PEC Cascade Rule
  specs:
  - id: EP-05-001
    priority: MUST
    kind: protocol
    statement: >-
      When the case owner activates a revised embargo that ends later than the embargo
      it replaces (`REVISE → ACTIVE`), the CASE_MANAGER MUST move each `SIGNATORY`
      participant whose `accepted_embargo_ids` lacks the revised embargo to `LAPSED` via
      the PEC `REVISE` trigger, so that their consent to the longer terms is explicit.
      A revised embargo that ends no later than the one it replaces MUST carry every
      existing signatory over: the revised id is recorded in their `accepted_embargo_ids`
      and their consent state is unchanged. In either case a participant in any other
      state whose `accepted_embargo_ids` already holds the revised id MUST advance to
      `SIGNATORY` via the PEC `ACCEPT` trigger (MSM-07-005).
    rationale: >-
      A participant who signed for terms `T1` has not consented to longer terms `T2`;
      leaving them `SIGNATORY` once `T2` is in force would imply consent they never gave.
      Shorter terms ask nothing new: agreeing to N days is agreeing to every shorter
      period, the same containment that makes shortest-wins (EP-04-003) and the
      termination exit cascade (MSM-07-006) safe without asking anyone. The cascade fires at
      activation rather than at proposal because the participant remains bound by `T1`
      for as long as `T1` is the active embargo (ADR-0093).
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` and
      `test_activation.py` assert that the owner's acceptance of a revision ending later
      than the active embargo moves exactly the signatories lacking the revised id to
      `LAPSED`, that acceptance of a revision ending no later than it moves nobody and
      records the revised id on every signatory, and that on any activation a
      non-signatory already holding the newly active id advances to `SIGNATORY`.
    relationships:
    - rel_type: implements
      spec_id: CM-18-001
    adr:
    - ADR-0093
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-05-002
    priority: MUST_NOT
    kind: project
    statement: >-
      A revision proposal (`ACTIVE → REVISE`) and any further counter-revision
      (`REVISE → REVISE`) MUST NOT change any participant's PEC state. Consent is
      re-evaluated only when the case owner activates a revision (EP-05-001); until then
      the prior embargo is in force and every signatory to it remains `SIGNATORY`.
    rationale: >-
      A participant cannot lapse until the embargo on the case differs from the one they
      agreed to. Lapsing on proposal stranded signatories when the revision was rejected,
      reported `embargo_adherence` false for participants still bound and still receiving
      embargoed content, and lapsed the proposer of the revision (ADR-0093, Concern #3884).
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_proposals.py` assert that
      `propose_embargo()` from `ACTIVE` and from `REVISE` reports no participant consent
      changes.
    relationships:
    - rel_type: refines
      spec_id: EP-05-001
    adr:
    - ADR-0093
- id: EP-06
  title: PEC Idempotency
  specs:
  - id: EP-06-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An idempotent retry or re-processing of a participant add-or-update MUST NOT
      overwrite a non-null PEC state with the default `UNBOUND`. Once a participant
      has been assigned any non-default PEC state (`INVITED`, `SIGNATORY`, `LAPSED`,
      or `DECLINED`), that state MUST be preserved across retries.
    rationale: >-
      Overwriting a `SIGNATORY` or `DECLINED` state with `UNBOUND` on retry silently
      revokes or erases consent that was already given. The positive-path idempotency
      rule (don't double-add) is covered by CM-13-005; this rule covers the negative
      path (don't downgrade).
    relationships:
    - rel_type: refines
      spec_id: CM-13-005
    - rel_type: implements
      spec_id: CM-18-001
- id: EP-07
  title: Embargo Invite RSVP Window Policy
  description: >-
    Policy requirements for the embargo invite RSVP window: the fallback default
    when no deadline is on the wire, the minimum permitted window, and the
    clamp-on-receipt rule that neutralises coercively short deadlines.
    Codified by ADR-0065. Source: IDEA-2066.
  specs:
  - id: EP-07-001
    priority: MUST
    kind: protocol
    statement: >-
      The embargo invite RSVP window MUST be configurable. When an
      `Invite(EmbargoEvent)` carries no `Invite.end_time`, implementations MUST
      apply the configured default window, measured from the invitation's
      `published` timestamp. The default value SHOULD be 7 days, matching
      CM-18-002.
    note: >-
      Under the embargo relay (EP-09, ADR-0113) this fallback is discharged by the
      CASE_MANAGER when it stamps `Invite.end_time` on each relayed Invite (CM-28-012):
      the configured default window is what it adds to its own `published`. No receiving
      participant applies the fallback on receipt; it derives no deadline and stores none
      (CM-28-013).
    rationale: >-
      Aligning the fallback with the pre-existing CM-18-002 policy window means
      an invitation that omits `end_time` behaves exactly as it does today, so
      adopting CM-28 changes no existing behaviour. See ADR-0065.
    verification: >-
      Inspection of the embargo invite handler in `vultron/core/` confirms a
      configurable default RSVP window setting and that invitations arriving without
      `end_time` apply this default measured from their `published` timestamp.
    relationships:
    - rel_type: implements
      spec_id: CM-28-002
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-002
    priority: MUST
    kind: protocol
    statement: >-
      A minimum RSVP window MUST be enforced. An inviting actor MUST NOT send an
      `Invite(EmbargoEvent)` whose `Invite.end_time` is less than the configured
      minimum after the invitation's `published` timestamp. The minimum is the
      configured window — SHOULD default to 72 hours — **or the time remaining in
      the embargo, whichever is shorter**.
    rationale: >-
      An unbounded-downward deadline weaponises the mechanism: a one-minute RSVP
      window formally invites a participant while guaranteeing they cannot
      answer, excluding them with the appearance of due process. See ADR-0065.
    note: >-
      The "whichever is shorter" clause was added by ADR-0096, because the absolute
      72-hour floor can exceed the embargo it concerns: EP-04-007 permits a 12-hour
      agreed embargo, and EP-04-005's protocol default floor is 72 hours exactly. The
      floor exists to prevent an *unreasonably* short deadline, and a deadline equal to
      the whole embargo is not unreasonable. Without this clause the floor would
      contradict EP-07-006.
    verification: >-
      A unit test confirms that the outbound invite builder raises a validation error
      when the supplied `end_time` is less than `published` plus the configured
      minimum window, and that for an embargo whose remaining duration is shorter
      than that window the remaining duration is used as the minimum instead.
    relationships:
    - rel_type: refines
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-003
    priority: MUST
    kind: protocol
    statement: >-
      When a receiving actor receives an `Invite(EmbargoEvent)` whose
      `Invite.end_time` is earlier than the applicable minimum window, it MUST
      clamp the effective deadline up to that minimum. The applicable minimum is
      the one computed by EP-07-002, so the clamp never raises the deadline past
      the embargo's own end.
    note: >-
      Both parties must reach the same effective deadline for CM-28-002 to hold.
      Because the floor is a configured value, a receiver whose floor differs
      from the sender's can compute a different effective deadline. Deployments
      that require strict bilateral agreement SHOULD align their floor
      configuration; the clamp guarantees safety, not identical arithmetic.

      The clamp is bidirectional in effect but not in mechanism: this requirement
      raises a sub-minimum deadline, and EP-07-006 lowers one that overshoots the
      embargo. Where both would apply — a remaining embargo shorter than the
      configured window — EP-07-002 has already reduced the minimum to the
      remaining embargo, so the two agree rather than fight.

      Under the embargo relay (EP-09, ADR-0113) the "receiving actor" this clause binds
      is the CASE_MANAGER at the point it stamps the relayed Invite (CM-28-012): it
      computes the applicable minimum and clamps before emission, so every replica reads
      one deadline off one object. A participant that receives a relayed Invite stores it
      and neither derives nor clamps a deadline (CM-28-013).
    rationale: >-
      Clamping makes a coercive deadline ineffective rather than fatal.
      Rejecting the invitation outright would hand the sender exactly what a
      hostile sender wants — an invite that never takes effect — and would
      punish the invitee for the inviter's misbehaviour. See ADR-0065.
    verification: >-
      A unit test confirms that the invite receiver replaces a sub-minimum `end_time`
      with `published + minimum_window` rather than using the on-wire value, and that
      the substituted value never exceeds the embargo's `end_time`.
    relationships:
    - rel_type: refines
      spec_id: EP-07-002
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An RSVP deadline MUST NOT fall after the end of the embargo it concerns. Where a
      computed deadline — whether from an explicit `Invite.end_time` or from the
      CM-18-002 policy window — would fall after the embargo's `end_time`, it MUST be
      clamped down to that `end_time`.
    rationale: >-
      An invitee must be able to answer while the embargo still exists. Nothing previously
      compared the RSVP deadline against the embargo's own end, so an answer window could
      outlive the thing it was about. See ADR-0096.
    note: >-
      The failure is concrete. Invite a participant to a 24-hour embargo with no explicit
      `Invite.end_time` and the CM-18-002 policy window applies: 7 days. The pocket veto
      fires on day 7; the embargo ended at hour 24. The participant is asked to consent to
      an embargo that is already over, and their inaction is recorded as an expiry six days
      after it stopped mattering.

      This is independent of the protocol default of EP-04-005 — the same thing happens on
      day 28 of a 30-day embargo with a published actor default, which is reachable today.
    verification: >-
      A unit test confirms that an RSVP deadline computed beyond the embargo's `end_time`
      is clamped down to it, for both the explicit-`end_time` and policy-window paths,
      including when the remaining embargo is shorter than the configured minimum window.
    relationships:
    - rel_type: constrains
      spec_id: CM-18-002
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiving actor MUST NOT reject an `Invite(EmbargoEvent)` as malformed
      solely on the basis of a sub-minimum deadline.
    rationale: >-
      Rejecting the invitation would hand a hostile sender exactly what they want —
      an invite that never takes effect — and punishes the invitee for the inviter's
      misbehaviour.
    relationships:
    - rel_type: refines
      spec_id: EP-07-003
    adr:
    - ADR-0065
  - id: EP-07-005
    priority: MUST
    kind: protocol
    statement: >-
      A receiving actor MUST log every deadline clamp it applies to an
      `Invite(EmbargoEvent)` deadline — both the EP-07-003 clamp up to the
      applicable minimum window and the EP-07-006 clamp down to the embargo's
      `end_time`.
    rationale: >-
      Logging the clamp makes the adjustment observable for auditing and
      debugging without rejecting the invitation.
    note: >-
      Amended by ADR-0096. This requirement previously named only the up-clamp, and only
      "the configured minimum window". The applicable minimum is now derived (EP-07-002:
      the lesser of the configured window and the time remaining in the embargo), and a
      second clamp direction exists. Both are adjustments a reader of the log needs to see.

      Under the embargo relay (EP-09, ADR-0113) the clamps are applied — and therefore
      logged — by the CASE_MANAGER when it stamps the relayed Invite (CM-28-012); a
      participant receiver applies none (CM-28-013).
    verification: >-
      A unit test confirms that clamping a sub-minimum deadline emits a log entry at
      the appropriate level recording both the original and the effective deadline
      values, and that clamping a deadline down to the embargo's `end_time` emits the
      same record.
    relationships:
    - rel_type: refines
      spec_id: EP-07-003
    - rel_type: refines
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_074
- id: EP-08
  title: Open Proposal Resolution Order
  description: >-
    How a Participant resolves two or more simultaneously open embargo proposals:
    earliest expiration first, with the remainder handled as revisions. Codified by
    ADR-0100, which also records why there is no multi-candidate poll activity. The
    heuristic itself predates this group as normative prose in
    `docs/topics/process_models/em/defaults.md`; stating it here is what makes it
    testable. Source: CONCERN-3433.
  specs:
  - id: EP-08-001
    priority: SHOULD
    kind: protocol
    statement: >-
      When two or more embargo proposals are open for a case and none has been
      accepted, a Participant SHOULD accept the proposal whose embargo `end_time` is
      earliest and propose the remainder as revisions. When two or more revisions are
      open against an active embargo, a Participant SHOULD accept or reject them
      individually in earliest-to-latest `end_time` order.
    rationale: >-
      Two parties proposing 30 and 60 days agree on days 1–30 and disagree only
      beyond that, so accepting the shorter proposal captures all mutual agreement
      immediately and leaves the contested remainder to negotiate as a revision. This
      is the *Shortest Embargo Proposed Wins* heuristic stated in
      `docs/topics/process_models/em/defaults.md`, derived in
      `docs/topics/process_models/em/formal_model.md`, and applied to case growth in
      `docs/topics/process_models/em/working_with_others.md`.
    note: >-
      This requirement restates guidance that was already normative in
      `docs/topics/process_models/em/defaults.md` but existed nowhere in `specs/`.
      Because `spec-dump` is the corpus agents read, the rule was invisible to
      implementation and the code diverged from it — `find_embargo_proposal_id`
      selected by arrival order until #3470. Recording it here is the correction; the
      shared comparator is `earliest_ending` in `vultron/core/services/embargo_ordering.py`,
      which EP-04-003's case-creation merge also uses.
    verification: >-
      A unit test asserts that, given three open proposals with distinct embargo
      `end_time` values, the proposal selected for acceptance is the earliest-expiring
      one.
    relationships:
    - rel_type: constrains
      spec_id: EP-04-003
      note: >-
        EP-04-003 is the two-party case-creation instance of this ordering rule, so
        it refines EP-08-001 rather than the reverse. Both MUST resolve
        earliest-end-date first, and both MUST share one comparator (#3392).
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-002
    priority: MUST
    kind: protocol
    statement: >-
      When an implementation must select among two or more open embargo proposals and
      the caller supplied no proposal identifier, it MUST select the earliest-expiring
      open proposal. It MUST NOT select by insertion or arrival order.
    rationale: >-
      A counter-proposal is emitted while the EM state remains PROPOSED (EMB-15-003),
      so arrival order places the superseded terms first. Selecting by arrival
      therefore accepts the terms the counter-proposal was sent to replace, which
      inverts EP-08-001 in exactly the situation that makes a default selection
      necessary.
    note: >-
      The default-selection path is the one that carries the risk. An explicit
      proposal identifier is unambiguous; the ambiguity only arises when the caller
      does not name one, and that is where the ordering rule must be enforced.
    verification: >-
      A unit test asserts that an accept request omitting the proposal identifier
      resolves to the earliest-expiring open proposal, including the case where a
      later-arriving counter-proposal expires sooner than the original.
    relationships:
    - rel_type: refines
      spec_id: EP-08-001
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-003
    priority: MUST
    kind: project
    statement: >-
      The record of open embargo proposals MUST NOT retain a proposal that has been
      accepted or rejected, or whose embargo has terminated. An implementation that
      records open proposals MUST remove an entry when the proposal is decided.
    rationale: >-
      EP-08-002 orders the set of open proposals, so a set that retains decided
      proposals can select one that is no longer open. Ordering an unpruned record is
      not a weaker guarantee than ordering a pruned one — it is a different and wrong
      answer, which is why the retention rule is stated alongside the ordering rule
      rather than left as hygiene.
    note: >-
      Two records of overlapping state are involved: `pending_embargo_proposal_index`
      and `VulnerabilityCase.proposed_embargoes`. Before #3470 **neither** was fully
      pruned — the index had one writer and no remover, and `proposed_embargoes` was
      pruned only on teardown by `RemoveFromProposedEmbargoesNode`, which
      `reject_proposed_embargo_bt` did not include, so a rejected proposal stayed in
      both records. Both are now pruned together by
      `VulnerabilityCase.discard_proposed_embargo`, called from every `EmbargoLifecycle`
      decision (owner accept, owner reject, activation, termination) and from
      `RemoveFromProposedEmbargoesNode` — on teardown unconditionally, and in the
      received `Reject(Invite)` tree gated on the rejecting actor being the case owner,
      so a replica forgets the proposal the owner rejected while a participant's
      Reject (consent, not a decision) prunes nothing. This requirement covers every
      record of open proposals on every replica, not just the index.
    verification: >-
      A unit test asserts that accepting a proposal, rejecting a proposal, and
      tearing down an embargo each leave no corresponding entry in the open-proposal
      record.
    relationships:
    - rel_type: constrains
      spec_id: EP-08-002
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-004
    priority: MUST
    kind: protocol
    statement: >-
      When an embargo terminates (EM `ACTIVE` or `REVISE` → `EXITED`), the implementation MUST
      remove every open proposal from the record of open embargo proposals, not only the entry
      for the terminated embargo itself. Every proposal open while EM is `ACTIVE` or `REVISE` is
      a revision of the active embargo, and a revision of an embargo that no longer exists
      cannot be accepted.
    rationale: >-
      A case has at most one active embargo (VP-04-002), so while EM is `ACTIVE` or `REVISE`
      every open proposal is by construction a revision of that embargo; no field linking a
      revision to the embargo it revises is needed to know which proposals a termination
      decides. EP-08-003's text reaches the terminated embargo; this entry reaches the
      proposals about it.
    note: >-
      Before this rule termination pruned the terminated embargo's own id and left its open
      revisions in both records, where the next default selection after `EXITED → PROPOSED`
      could pick a revision of a dead embargo as the earliest-expiring candidate (#3836). The
      rule lives in `EmbargoLifecycle.terminate_active_embargo`, which calls
      `VulnerabilityCase.discard_all_proposed_embargoes` — the whole-record sibling of the
      per-proposal pruner `discard_proposed_embargo`, clearing both records together — and
      applies on every replica without extra work: the teardown replay node
      (`ClearActiveEmbargoNode`) runs the same method in `OBSERVED` mode (#3914).
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_activation.py` assert that
      terminating an embargo while revisions of it are pending leaves both
      `proposed_embargoes` and `pending_embargo_proposal_index` empty, in `STRICT` and in
      `OBSERVED` mode; `test/core/behaviors/embargo/nodes/test_teardown.py` asserts the same
      through `ClearActiveEmbargoNode`, and
      `test/core/use_cases/triggers/embargo/test_terminate.py` through the terminate trigger.
    relationships:
    - rel_type: refines
      spec_id: EP-08-003
    - rel_type: depends_on
      spec_id: VP-04-002
      note: One active embargo at a time is what makes every open proposal a revision of it.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
- id: EP-09
  title: Embargo Negotiation Relays Through the CASE_MANAGER
  description: >-
    How an embargo proposal — the first one for a case or a revision of the active
    embargo — reaches every participant and every replica in the CASE_MANAGER topology.
    The behavioural specs (EMB-01 through EMB-06) are written in the voice of the formal
    protocol, in which every Participant is a peer and every Participant "receives EP" or
    "receives EV". Here a participant addresses its proposal to the CASE_MANAGER alone
    (PCR-08-001), so the Participant receiving EP or EV is the CASE_MANAGER on receipt, and
    every other participant learns the resulting case state from the ledger. The protocol
    interactions the behavioural specs define still happen: the CASE_MANAGER relays the
    proposal to the participants as an Invite, they answer the CASE_MANAGER, and the owner's
    answer decides. Each step is recorded in the ledger. Ledger entries carry case state to
    replicas and set no parse-and-respond expectation; they augment the negotiation as the
    record of the case, they do not replace it. Decided by ADR-0113 from Concerns #3892,
    #3836 and #3863 for revisions; generalised to every proposal, with the acknowledgement,
    RSVP-deadline, trigger-side write and invitee rules below, by its 2026-09-30 amendment
    from Concern #3918.
  specs:
  - id: EP-09-001
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives an `Invite(EmbargoEvent)` for a case whose CS state is
      not yet public, exploit or attack, it MUST move the canonical case through
      `EmbargoLifecycle` — EM `NONE → PROPOSED` for the first proposal, `ACTIVE → REVISE`
      for a revision — and commit the proposal as a ledger entry. When the case is already
      at `PROPOSED` or `REVISE` (a counter-proposal) it MUST commit the proposal without a
      further EM transition. When the case is public, exploit or attack it MUST refuse the
      proposal (EMB-01-002, EMB-03-003). This is how EMB-01-001, EMB-01-003, EMB-03-001 and
      EMB-03-002 are realised in the CASE_MANAGER topology: the CASE_MANAGER on receipt,
      every other participant through ledger replay (EP-09-007).
    rationale: >-
      The received Invite tree stored the activity, moved the invitee's consent and committed
      an entry, but never moved the case, so the CASE_MANAGER's canonical record never showed
      that a revision was under negotiation when a non-owner proposed one, and everything
      keyed on `EM.REVISE` ran only in the proposer's store (#3892). The CASE_MANAGER is the
      sole writer of canonical case state (ADR-0108); if it does not move the case, no
      replica can.
    note: >-
      The write sits behind the CASE_MANAGER role gate (BT-17-001, RSH-08-003). A non-manager
      that receives a peer's proposal directly stores it and writes nothing; that delivery is
      a misrouting under PCR-08-001, not a protocol case, and no parse-and-respond handling
      is built for it.
    verification: >-
      A test runs the received Invite path as the CASE_MANAGER with the case at `EM.ACTIVE`
      and asserts the persisted case is at `EM.REVISE`; a second runs it with the case at
      `EM.NONE` and asserts `EM.PROPOSED`. Until the implementation lands the tests are
      strict `xfail`s naming their tracking issue.
    relationships:
    - rel_type: implements
      spec_id: EMB-01-001
    - rel_type: implements
      spec_id: EMB-01-002
    - rel_type: implements
      spec_id: EMB-01-003
    - rel_type: implements
      spec_id: EMB-03-001
    - rel_type: implements
      spec_id: EMB-03-002
    - rel_type: implements
      spec_id: EMB-03-003
    - rel_type: depends_on
      spec_id: EMB-18-001
      note: The EM write goes through EmbargoLifecycle, never a direct assignment.
    - rel_type: depends_on
      spec_id: RSH-08-003
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-002
    priority: MUST
    kind: protocol
    statement: >-
      After committing a revision proposal, the CASE_MANAGER MUST emit an
      `Invite(EmbargoEvent)` for the revision to every case participant whose RM state
      is not `RM.CLOSED`, except the proposer and except the executing CASE_MANAGER
      itself, with `actor` set to the CASE_MANAGER's ID and `attributedTo` set to the
      proposer's ID (CM-24-001, CM-24-002), and MUST commit each emission as a ledger
      entry. The CASE_MANAGER MUST NOT invite the proposer or itself. The
      CASE_MANAGER role carries no embargo stake of its own: consent MUST NOT be
      solicited or recorded for the role, and when the actor holding it also holds
      `CVDRole.CASE_OWNER`, that actor's consent is its decision as owner (EP-09-005).
    rationale: >-
      Participants answer only an Invite addressed to them (EP-09-003), so without the
      relay nobody but the proposer would be asked. Proposing terms is consenting to
      them (ADR-0093), so the proposer is not invited. The CASE_MANAGER is the Case
      Owner's delegate that routes communications and manages ledger entries, with no
      view of its own on the embargo, and a container never mails an actor it hosts
      (ADR-0109).
    note: >-
      Excluding the proposer costs one filter: the proposer's identity is on the
      activity just adjudicated. The emit runs on the container that hosts the
      CASE_MANAGER and is committed in the emitting tree (CM-24-004, ADR-0109). Every
      other participant on the case whose RM state is not `RM.CLOSED` is a recipient,
      whatever its consent state and whether or not it has joined: an embargo Invite is
      not case content and reaches an inert participant (CM-10-007). A participant not
      yet bound is invited into the revised terms, a signatory is asked whether it
      accepts them (EP-09-004).
    verification: >-
      `test/core/behaviors/embargo/nodes/test_relay.py::TestCollectEmbargoInviteRecipientsNode::test_excludes_the_proposer_and_the_manager_itself`
      and `test/core/use_cases/received/test_embargo_revision_relay.py::test_case_manager_invites_every_participant_except_the_proposer`
      run the relay as the CASE_MANAGER and assert one Invite per participant other than the
      proposer and the manager, each with `actor` the CASE_MANAGER and `attributedTo` the
      proposer; `TestRelayEmbargoInviteToEachNode::test_each_emission_is_committed_as_a_canonical_entry` in the same node test file asserts each emission
      is committed.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    - rel_type: refines
      spec_id: CM-24-002
    - rel_type: depends_on
      spec_id: PCR-08-007
      note: The same relay shape as the case Invite.
    adr:
    - ADR-0113
    - ADR-0114
    stories:
    - story_2022_014
  - id: EP-09-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant that receives an `Invite(EmbargoEvent)` MUST NOT write case EM state or
      any participant's consent state on receipt; it stores the Invite and answers it with
      `Accept` or `Reject` addressed to the CASE_MANAGER through its response decision
      (EMB-15). A participant MUST NOT treat an `Announce(CaseLedgerEntry)` that carries a
      proposal or an Invite as an invitation to answer: a participant answers only an Invite
      addressed to it. Consent is recorded when the CASE_MANAGER commits the answer, and the
      replica learns it from the ledger.
    rationale: >-
      Only the CASE_MANAGER turns an announcement into case state and every other participant
      takes case state from the ledger (ADR-0108, RSH-08-003). The ledger is a channel for
      case state, not a protocol interaction; giving an entry parse-and-respond semantics
      would let every future entry type become an implicit request and would fork the
      negotiation into two paths, one over Invites and one over entries. The interactions the
      behavioural specs define are the ones that happen; the ledger records them.
    note: >-
      The current receive tree moves the invitee's consent to `INVITED` at every inbox. Under
      this rule that write moves to the CASE_MANAGER's commit of the Invite emission
      (EP-09-002) and reaches the replica through replay (EP-09-007). The participant-side
      tree keeps the store-and-answer path only.
    verification: >-
      A test runs the received Invite path as a non-manager participant and asserts the
      case EM state and every participant's consent state are unchanged afterwards. Until the
      implementation lands the test is a strict `xfail` naming its tracking issue.
    relationships:
    - rel_type: refines
      spec_id: RSH-08-003
    - rel_type: depends_on
      spec_id: PCR-08-003
      note: The fan-out is the only mechanism by which participants learn accepted state.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A revision `Invite(EmbargoEvent)` MUST NOT change the consent state of a participant that is
      already `SIGNATORY` to the active embargo. The PEC `INVITE` trigger applies only to a
      participant in `UNBOUND`, `LAPSED`, `DECLINED` or `EXPIRED` (CM-18-003); a signatory's answer
      to a revision is recorded in `accepted_embargo_ids` and leaves its state unchanged until the
      owner activates the revision (EP-05-001, EP-05-002).
    rationale: >-
      A signatory is bound by the active embargo for as long as it is active; a proposal to
      revise it asks nothing of them yet (ADR-0093). Applying `INVITE` to a `SIGNATORY` is an
      illegal PEC transition, so a receive tree that applies it unconditionally faults on
      exactly the participants a revision most concerns.
    verification: >-
      A test delivers a revision Invite for a participant already `SIGNATORY` and asserts the
      receive tree succeeds and the participant is still `SIGNATORY`. Until the implementation
      lands the test is a strict `xfail` naming its tracking issue.
    relationships:
    - rel_type: refines
      spec_id: EP-05-002
    - rel_type: depends_on
      spec_id: CM-18-003
    adr:
    - ADR-0113
    - ADR-0093
  - id: EP-09-005
    priority: MAY
    kind: protocol
    statement: >-
      The case owner MAY accept or reject an open revision at any time, without waiting for
      any other participant to answer the revision Invite. The owner's `Accept` activates the
      revision and the owner's `Reject` keeps the prior terms (MSM-07-003, MSM-07-004); either
      is committed as a ledger entry and decides the embargo.
    rationale: >-
      Only the case owner's answer changes the embargo on the case; the other participants'
      answers inform that decision, they do not make it (ADR-0093). The Invites are not a
      vote: they gather the consent records the activation cascade reads (EP-05-001). The
      owner's decision settles the embargo; the answers settle who is bound by it.
    note: >-
      This is why the Invites are sent even though the owner may act by fiat. When the owner
      activates longer terms, every signatory that accepted them stays bound and every
      signatory that did not lapses (EP-05-001); the answers are what that cascade reads.
    verification: >-
      A unit test in `test/core/services/embargo_lifecycle/` asserts the owner's accept of a
      revision from `REVISE` activates it with no other participant having answered.
    relationships:
    - rel_type: refines
      spec_id: MSM-07-003
    - rel_type: refines
      spec_id: MSM-07-004
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-006
    priority: SHOULD
    kind: protocol
    statement: >-
      The case owner SHOULD wait for at least some participants to answer a revision Invite
      before accepting or rejecting the revision, so as to gauge consensus (VP-08-003). The
      protocol defines no quorum, no vote and no waiting period; which answers, how many and
      how long are actor policy.
    rationale: >-
      Consensus on embargo terms is the protocol's stated norm (VP-08-003), and "quorum" is
      deliberately undefined so that different CVD communities can adopt different decision
      rules (VP-09-007). A fixed threshold here would take that room away. Leaving it to actor
      policy makes the waiting decision a natural call-out point rather than a rule.
    note: >-
      The MAY in EP-09-005 and the SHOULD here are one position, not a contradiction: the
      owner is never blocked, and is advised to listen first. An implementation that wants to
      wait puts the policy at the owner's accept or reject call-out; the protocol imposes
      nothing.
    verification: >-
      Not machine-checkable as a protocol obligation: the protocol imposes no waiting rule.
      The EP-09-005 test pins that nothing blocks the owner; inspection of the owner-side
      accept and reject call-out confirms that a waiting policy has a place to live.
    relationships:
    - rel_type: refines
      spec_id: VP-08-003
    - rel_type: depends_on
      spec_id: VP-09-007
      note: >-
        VP-09-007's rationale is where the protocol leaves "quorum" undefined; it stays
        undefined here too.
    adr:
    - ADR-0113
    stories:
    - story_2022_046
    - story_2022_078
    - story_2022_079
  - id: EP-09-007
    priority: MUST
    kind: architecture
    statement: >-
      Every ledger event type the revision relay commits (the proposal, each Invite emission,
      each participant's consent answer, and the owner's decision) MUST have a replica apply
      node reachable from `create_announce_log_entry_tree` (RSH-08-004) that reconstructs the
      state through `EmbargoLifecycle` in `OBSERVED` mode, as the teardown apply node does.
      The replay node for a transition MUST land before the received-side effect that wrote
      it directly is gated (RSH-08-003).
    rationale: >-
      Replicas take case state from the ledger, so an event type with no replay node is a
      state change no replica can see (ADR-0108). Before this rule the only embargo event with
      a replica effect was teardown; proposal, revision and activation entries were stored and
      ignored, which is why a replica's EM stayed `ACTIVE` through a whole revision cycle
      (#3892). Covering every event type of the relay is what makes the participant-side
      embargo trees gateable with no further work.
    verification: >-
      The RSH-08-004 architecture ratchet lists every committed embargo event type as having a
      replay node or a declared exemption; integration tests with per-actor stores assert a
      replica converges to `REVISE` and back to `ACTIVE` on the fan-out alone.
    relationships:
    - rel_type: refines
      spec_id: RSH-08-004
    - rel_type: depends_on
      spec_id: EMB-18-001
    adr:
    - ADR-0113
    - ADR-0108
  - id: EP-09-008
    priority: MUST
    kind: protocol
    statement: >-
      A trigger use case MUST write shared EM state — proposing, accepting, rejecting or
      terminating an embargo — only when the executing actor holds `CVDRole.CASE_MANAGER`
      for the case, inside the same role gate received trees use (BT-17-001). When it does
      not, the trigger MUST emit its activity to the CASE_MANAGER, record it in the
      pending-assertion store (SYNC-11-002), write no EM state, and emit no case-status
      declaration of an EM state; the actor's replica moves when the CASE_MANAGER's commit is
      announced (EP-09-007). The CASE_MANAGER's `Reject` of a refused proposal closes the
      pending entry.
    rationale: >-
      Every embargo trigger wrote its own local EM state before the CASE_MANAGER had
      answered, then declared that state to the manager, and nothing corrected the write when
      the manager refused, so a proposer's replica could sit at `PROPOSED` while the canonical
      case never moved (#3918). The manager is the one writer of shared case state
      (ADR-0108); a participant's replica of it comes from the ledger like everyone else's.
    note: >-
      Participant self-status (RM, `Add(ParticipantStatus)`) is the participant's own claim
      and keeps its local write (RSH-06-001). The role gate covers the owner that still holds
      the manager role after creation (CM-24-006): it writes canonically until it delegates.

      Same ordering constraint as RSH-08-004: the replay nodes of EP-09-007 MUST exist before
      the trigger-side write is gated, or a non-manager's replica never moves. The
      pending-assertion store is the ephemeral half of the outstanding-ask register
      (ASK-04-007) and never holds case state (CLP-06-002).
    verification: >-
      A test runs `propose_embargo_trigger_bt` as a participant that does not hold the
      CASE_MANAGER role and asserts its case is still at `EM.NONE`, the Invite is queued to
      the CASE_MANAGER, the pending-assertion store holds the activity, and no
      `Add(CaseStatus)` was queued; a second runs it as the role holder and asserts
      `EM.PROPOSED`. Until the implementation lands the tests are strict `xfail`s naming
      their tracking issue.
    relationships:
    - rel_type: depends_on
      spec_id: EP-09-007
    - rel_type: depends_on
      spec_id: SYNC-11-002
    - rel_type: depends_on
      spec_id: BT-17-001
    - rel_type: refines
      spec_id: RSH-08-003
      note: The receive-side rule, applied to the trigger side for shared EM state.
    adr:
    - ADR-0113
    - ADR-0108
    stories:
    - story_2022_014
  - id: EP-09-009
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER's commit of a received embargo activity, fanned out as
      `Announce(CaseLedgerEntry)`, is the acknowledgement the EMB behavioural requirements
      express as "emit EK". Implementations MUST NOT add an EK message type, pattern or
      emission to acknowledge an embargo activity.
    rationale: >-
      No EK exists in the production stack and MSM-02-009 records that its purpose is served
      by ledger hash-chain continuity. Under the relay every accepted embargo activity is
      committed and announced, so the record the specs want the receiver to produce already
      exists; a second acknowledgement would be a message with no reader (#3918).
    verification: >-
      A test asserts `MessageSemantics` has no embargo-acknowledgement member and the
      semantic registry has no embargo-acknowledgement pattern.
    relationships:
    - rel_type: refines
      spec_id: MSM-02-009
    - rel_type: implements
      spec_id: EMB-09-001
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-010
    priority: MUST
    kind: protocol
    statement: >-
      The invitee of an `Invite(EmbargoEvent)` is its sole `to` recipient. A receiving actor
      MUST resolve the invitee from that single recipient, MUST refuse an Invite that names
      no `to` recipient or more than one as a misrouting (OX-08-001), and MUST NOT infer the
      invitee from the receiving actor.
    note: >-
      Scope: the invitee is resolved for the relayed Invite a participant receives
      (EP-09-002). A proposal is addressed to the CASE_MANAGER alone (PCR-08-001), so it
      too names exactly one `to` recipient and is refused when it names none or several;
      that recipient is its adjudicator under EP-09-001, not its invitee, so the
      CASE_MANAGER's own record takes no RSVP deadline from it (CM-28-003). The refusal
      comes before the P/X/A check, so a misrouted Invite on a public, exploited or attacked
      case gets no ER: EMB-01-002's ER answers a proposal its receiver was sent, and a
      misrouting is not accepted either way. Two spellings of one actor in `to` (a trailing
      slash) name one recipient.
    rationale: >-
      Every emitter sends a single-recipient Invite — a participant to the CASE_MANAGER, the
      CASE_MANAGER to one participant per relayed Invite (EP-09-002) — so the multi-recipient
      resolution built for a shape nothing emits was dead code, and its fallback to the
      receiving actor put the deadline on the enforcer's own record (ISSUE-2762). Refusing
      names the defect; guessing hides it.
    verification: >-
      Tests deliver an Invite with two `to` recipients and with none and assert `REFUSED`
      with the recipient count in the reason; a single-recipient Invite resolves that
      recipient (`test_invite_with_several_recipients_is_refused` and
      `test_invite_with_no_recipient_is_refused` in `test_embargo_revision_relay.py`;
      `TestInviteeIsTheAddressee` and `TestInviteeIdProperty` in
      `test_embargo_invite_lapse.py`).
    relationships:
    - rel_type: depends_on
      spec_id: EP-09-002
    adr:
    - ADR-0113
    stories:
    - story_2022_014

