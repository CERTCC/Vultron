id: EP
title: Embargo Policy
description: >-
  Requirements for a standardized embargo policy record associated with an Actor profile.
  Allows actors to declare their default embargo preferences so that coordinators can evaluate
  compatibility before proposing an embargo or inviting an actor to a case.
version: 1.2.0
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: EP-01
  title: Policy Record Format
  specs:
  - id: EP-01-001
    priority: MAY
    kind: protocol
    statement: >-
      An Actor profile MAY include a `embargo_policy` field containing a structured embargo
      policy record
    stories:
    - story_2022_001
    - story_2022_003
    - story_2022_009
    - story_2022_011
    - story_2022_076
    - story_2022_095
  - id: EP-01-002
    priority: MUST
    kind: protocol
    statement: 'The embargo policy record MUST include the following fields: actor_id (full URI string identifying the Actor to which this policy applies), inbox (URL string of the Actor''s ActivityPub inbox), preferred_duration (ISO 8601 duration string representing the Actor''s preferred embargo length)'
    verification: >-
      Inspection of the `EmbargoPolicy` Pydantic model confirms that `actor_id`,
      `inbox`, and `preferred_duration` are declared as required fields with no
      default values.
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-002
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
    stories:
    - story_2022_004
    - story_2022_010
    - story_2022_021
    - story_2022_022
    - story_2022_072
  - id: EP-01-003
    priority: SHOULD
    kind: protocol
    statement: >-
      The embargo policy record SHOULD include the optional fields
      `minimum_duration` (ISO 8601 duration), `maximum_duration` (ISO 8601 duration),
      and `notes` (free-text string describing the Actor's embargo preferences).
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
    stories:
    - story_2022_004
    - story_2022_021
    - story_2022_073
  - id: EP-01-004
    priority: MUST
    kind: protocol
    statement: >-
      The embargo policy record MUST be serializable as a Pydantic model and persisted in
      the DataLayer
    verification: >-
      A unit test confirms that an `EmbargoPolicy` instance round-trips through
      Pydantic serialization and that the DataLayer `save()` and `get()` operations
      accept and return the model without data loss.
    stories:
    - story_2022_004
  - id: EP-01-005
    priority: MUST
    kind: protocol
    statement: The embargo policy record MUST use full-URI IDs for `actor_id`
    verification: >-
      A unit test confirms that `EmbargoPolicy` raises `ValidationError` when
      `actor_id` is a non-URI string and accepts a well-formed `https://` URI.
    relationships:
    - rel_type: depends_on
      spec_id: OID-01-001
    stories:
    - story_2022_034
    - story_2022_035
  - id: EP-01-006
    priority: SHOULD
    kind: protocol
    statement: >-
      When `minimum_duration` is declared, an Actor SHOULD reject embargo proposals
      shorter than that value.
    rationale: >-
      The minimum_duration field signals a floor below which the Actor will not
      accept an embargo; evaluating it prevents compatibility mismatches.
    relationships:
    - rel_type: refines
      spec_id: EP-01-003
  - id: EP-01-007
    priority: SHOULD
    kind: protocol
    statement: >-
      When `maximum_duration` is declared, an Actor SHOULD reject embargo proposals
      longer than that value.
    rationale: >-
      The maximum_duration field signals a ceiling above which the Actor will not
      accept an embargo; evaluating it prevents compatibility mismatches.
    relationships:
    - rel_type: refines
      spec_id: EP-01-003
- id: EP-02
  title: API Endpoint
  specs:
  - id: EP-02-001
    priority: SHOULD
    kind: protocol
    statement: >-
      Each Actor SHOULD expose its embargo policy at `GET /actors/{actor_id}/embargo-policy`
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-002
    priority: MUST
    kind: protocol
    statement: >-
      The policy endpoint MUST be machine-readable (returns JSON) and MUST be listed in the
      Actor's ActivityPub profile under a well-known key (e.g., `vultron:embargoPolicy`)
    verification: >-
      Inspection of the Actor profile endpoint handler confirms the response uses
      `Content-Type: application/json` and the profile document includes a
      `vultron:embargoPolicy` key whose value is the embargo-policy endpoint URL.
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_004
    - story_2022_009
- id: EP-03
  title: Policy Compatibility Evaluation
  specs:
  - id: EP-03-001
    priority: SHOULD
    kind: protocol
    statement: >-
      Before proposing an embargo or inviting an actor to join an existing embargo, the CASE_MANAGER
      SHOULD retrieve and evaluate the target actor's embargo policy for compatibility with
      the proposed embargo terms
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: implements
      spec_id: VP-07-007
    stories:
    - story_2022_005
  - id: EP-03-002
    priority: MUST
    kind: protocol
    statement: >-
      Compatibility evaluation MUST check that the proposed duration falls within the target
      actor's `minimum_duration`–`maximum_duration` range, if declared
    verification: >-
      A unit test confirms that the compatibility evaluator returns incompatible when the
      proposed duration falls outside the declared `minimum_duration`–`maximum_duration`
      range, and compatible when it falls within the range.
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-003
    - rel_type: implements
      spec_id: VP-07-004
    - rel_type: implements
      spec_id: VP-07-005
    - rel_type: depends_on
      spec_id: DUR-01-001
    - rel_type: depends_on
      spec_id: DUR-04-001
    stories:
    - story_2022_005
- id: EP-04
  title: Default Embargo Semantics
  specs:
  - id: EP-04-001
    priority: MUST
    kind: protocol
    statement: >-
      When a receiver applies their **actor default** embargo at case creation and the sender
      submitted no explicit embargo proposal, the initial `CaseStatus.em_state` MUST be set
      to `EM.ACTIVE`, not `EM.PROPOSED`. The sender's report submission without a counter-proposal
      constitutes tacit acceptance of the receiver's actor default embargo.
    note: >-
      "Actor default" is the duration carried by a published `EmbargoPolicy`, as distinguished
      from the "protocol default" of EP-04-005. Only the actor default participates in the
      shortest-wins comparison (EP-04-003); the protocol default never does (EP-04-006).
      Amended by ADR-0096.
    verification: >-
      Integration tests in `test/demo/test_establish_embargo_demo.py` confirm that a
      case created without a sender-side embargo proposal immediately enters `EM.ACTIVE`,
      with no intermediate `EM.PROPOSED` record persisted in the DataLayer.
    relationships:
    - rel_type: refines
      spec_id: DUR-07-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The implementation MUST apply both the PROPOSE and ACCEPT state machine triggers atomically
      within `InitializeDefaultEmbargoNode`. The intermediate `EM.PROPOSED` state MUST NOT
      be persisted or observable externally.
  - id: EP-04-003
    priority: MUST
    kind: protocol
    statement: >-
      When both the sender and receiver have an applicable embargo proposal at case creation
      (sender proposes a duration and receiver has a default), the shorter of the two MUST
      be made active immediately (`em_state = EM.ACTIVE`) and the longer SHOULD be registered
      as a pending revision (`em_state = EM.REVISE`).
    rationale: >-
      Two parties that propose 30 and 60 days respectively agree on days 1–30 and disagree
      only on days 31–60. Activating the shorter embargo immediately captures all mutual
      agreement; the longer duration becomes a pending revision so the proposer can negotiate
      the contested portion. This is strictly better than rejecting outright: both parties
      secure the overlap they both wanted. See docs/topics/process_models/em/formal_model.md
      § "Why the shortest proposal wins" for the full vector-agreement derivation.
    verification: >-
      A unit test confirms that `InitializeDefaultEmbargoNode` sets `em_state` to
      `EM.ACTIVE` for the shorter duration and records the longer as `EM.REVISE`
      when both parties carry a proposal at case creation.
    relationships:
    - rel_type: refines
      spec_id: EP-08-001
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-004
    priority: MUST
    kind: protocol
    statement: >-
      A sender MUST be able to propose embargo terms when submitting a report, by embedding a
      proposed `EmbargoEvent` in the `Offer(VulnerabilityReport)` activity. The proposed
      `EmbargoEvent` carries the report URI as its `context` (EP-04-009), and the
      CASE_MANAGER MUST rewrite that context to the case URI at case creation.
    rationale: >-
      This discharges the contingency this requirement previously recorded. Until ADR-0096 no
      sender-proposal mechanism existed, so EP-04-003 was unreachable and only the
      no-sender-proposal path applied.
    note: >-
      Embedding the proposal on the report offer was chosen over two alternatives. An
      activity-level `end_time` on the `Offer` would add a third meaning to a field CM-28-001
      already names a critical naming hazard. Inlining the sender's own `EmbargoPolicy` states
      a standing preference, not terms for this report — "I generally prefer 30 days" is not
      "for this report I propose 30 days". Amended by ADR-0096.
    verification: >-
      A unit test confirms that `Offer(VulnerabilityReport)` carrying a proposed `EmbargoEvent`
      is extracted with the proposal intact, and that the context is rewritten from the report
      URI to the case URI when the case is created.
    relationships:
    - rel_type: refines
      spec_id: EP-04-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-005
    priority: MUST
    kind: protocol
    statement: >-
      A **protocol default** embargo duration MUST exist and MUST be configurable. It MUST be
      no less than 72 hours and no more than 5 days. When an embargo-eligible case is created and
      no embargo proposal and no actor default applies, the protocol default MUST be used and the
      case MUST begin at `EM.ACTIVE`. Where the case is not embargo-eligible, EP-04-008 applies
      instead and no protocol default embargo is created.
    rationale: >-
      The goal of the EM process is to lock in *an* embargo as early as possible
      (`docs/topics/process_models/em/principles.md`). A case with no embargo is the outcome
      the process exists to avoid, and reaching it through mutual silence is the least
      deliberate way to arrive there.
    note: >-
      The duration is deliberately short so that publishing an `EmbargoPolicy` is strictly
      better than publishing nothing. The previous hardcoded 90-day fallback inverted that
      incentive: a receiver who published nothing got a longer embargo than one who published a
      considered 30 days.

      The 72-hour floor is not arbitrary — it equals the *configured* EP-07-002 minimum RSVP
      window, so the shortest embargo the protocol produces is exactly as long as the shortest
      answer window it grants. Note that this alignment holds at the configured values only:
      EP-07-002's effective minimum is the lesser of that window and the time remaining in the
      embargo, precisely so that the floor cannot outlive a shorter agreed embargo (EP-07-006).
      The 5-day ceiling prevents a deployment from quietly restoring a value generous enough to
      re-invert the incentive.

      This overturns `docs/topics/process_models/em/defaults.md` § "No Defaults, No Proposals"
      and its corpus encoding VP-07-001, both of which stated that no embargo SHALL exist in
      this case. See ADR-0096.
    verification: >-
      A unit test asserts that a case created with no `EmbargoPolicy` in the store and no
      sender proposal reaches `EM.ACTIVE` at the configured protocol default, and that
      configuring a value outside [72 hours, 5 days] is refused.
    relationships:
    - rel_type: constrains
      spec_id: VP-07-001
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The protocol default MUST NOT participate in the shortest-wins comparison of EP-04-003.
      It is the value applied when no proposal and no actor default applies, never a candidate
      within that comparison.
    rationale: >-
      A 72-hour protocol default that competed under shortest-wins would win against every
      longer proposal and cap every embargo in the system at 72 hours, so no longer embargo
      could ever be agreed. The protocol default answers "what if nobody said anything", not
      "whose terms are shortest". See ADR-0096.
    verification: >-
      A unit test asserts that a 30-day actor default with no sender proposal yields a 30-day
      active embargo, not the protocol default.
    relationships:
    - rel_type: constrains
      spec_id: EP-04-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The protocol default MUST NOT be applied as a minimum on agreed embargo terms. A
      proposal or actor default shorter than the protocol default MUST be honored at its
      stated duration and MUST NOT be clamped up to it.
    rationale: >-
      `em/principles.md` requires embargo duration be "limited to the shortest duration
      possible", and a Participant is free to set their own terms. EP-04-005's range bounds
      what the fallback may be configured to; it does not constrain what parties may agree.
      A reporter who proposes 12 hours gets 12 hours. See ADR-0096.
    verification: >-
      A unit test asserts that a sender proposal shorter than the configured protocol default
      is activated at its stated duration.
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The protocol default MUST NOT be applied to a case that is not embargo-eligible. When
      any of P/X/A is set at case creation, no protocol default embargo is created and the
      case MUST remain at `EM.NONE`.
    rationale: >-
      VP-06-001 already forbids proposing or accepting an embargo negotiation once the
      vulnerability is public, exploit code is public, or attacks are observed (EMB-01-002 is the
      accept half of the same prohibition). An embargo on an already-public vulnerability
      protects nothing, so the protocol default inherits that guard rather than bypassing it.
      See ADR-0096.
    verification: >-
      A unit test asserts that a case created with `pxa_state != CS_pxa.pxa` receives no
      protocol default embargo and remains at `EM.NONE`.
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
    - rel_type: constrains
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-009
    priority: MUST
    kind: protocol
    statement: >-
      `EmbargoEvent.context` MUST identify the subject the embargo concerns: the report URI
      before a case exists, and the case URI afterwards. A reader MUST NOT assume the context
      is a case without checking.
    rationale: >-
      A proposal embedded on `Offer(VulnerabilityReport)` (EP-04-004) precedes the case, so it
      has no case URI to point at. Widening the subject is a semantic change, not a type change:
      the field is `EmbargoEvent.context` in `vultron/core/models/embargo_event.py`, typed
      `NonEmptyString`, and nothing validates it as a case reference. This also gives pre-case
      embargo terms a legitimate home, which is what CONCERN-2215 asked for; what ADR-0096
      declines is the pre-case *phase*, not the *representation*.
    note: >-
      Do not confuse this field with `VultronEvent.context` in
      `vultron/core/models/events/base.py`, which is typed `CoreObject | None` and holds the
      *inbound activity's* resolved context. The casts to `VulnerabilityCase` in
      `vultron/core/models/events/embargo.py` are on that field, for `Announce`/`Invite` events
      whose context genuinely is a case, and are unaffected by this widening.
    verification: >-
      A unit test confirms an `EmbargoEvent` constructed with a report URI context validates, and
      that every consumer of `EmbargoEvent.context` resolves the referent type rather than
      assuming a case.
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-010
    priority: MUST_NOT
    kind: project
    statement: >-
      Implementations MUST NOT conflate the actor default with the protocol default. The two
      MUST be carried under distinct names, so that a consumer can distinguish "the receiver
      published this duration" from "the receiver published nothing". The protocol default MUST
      be the single source of the fallback duration: no other implicit default embargo duration
      may be carried anywhere in the implementation.
    rationale: >-
      `_preferred_embargo_duration()` returned its fallback into the same blackboard key
      (`default_embargo_duration`) that a published `EmbargoPolicy` filled, so no downstream
      code could tell the two apart. That conflation is why a silent 90-day fallback survived
      in contradiction of three documents. Additionally, that function selected `policies[0]`
      from an unordered list, making the applicable policy arbitrary when an actor's store
      holds more than one. See ADR-0096.
    note: >-
      Three implicit durations exist today, not one: `_DEFAULT_EMBARGO_DAYS = 90` in
      `vultron/core/behaviors/case/nodes/embargo.py`, the blackboard key that carries both
      meanings, and `EmbargoEvent.end_time`'s `default_factory=_45_days_hence` in
      `vultron/core/models/embargo_event.py`. The 45-day default is the quietest of the three —
      any `EmbargoEvent` built without an explicit `end_time` silently acquires it, nine times the
      5-day ceiling EP-04-005 sets. All three must resolve to the configured protocol default or
      be made explicit at every construction site.
    verification: >-
      Inspection of `vultron/core/behaviors/case/nodes/embargo.py` confirms the actor default
      and the protocol default are resolved under distinct names, and that actor-default
      selection is deterministic rather than positional. Inspection of
      `vultron/core/models/embargo_event.py` confirms no independent default embargo duration
      remains on `EmbargoEvent.end_time`.
    adr:
    - ADR-0096
    lint_suppress:
    - missing_story_reference
- id: EP-05
  title: Counter-Revision PEC Cascade Rule
  specs:
  - id: EP-05-001
    priority: MUST
    kind: protocol
    statement: >-
      When an embargo transitions from `ACTIVE` to `REVISE` (counter-revision proposed),
      the CASE_MANAGER MUST call `_cascade_pec_revise()` to reset each `SIGNATORY`
      participant's PEC state to `INVITED` so they can re-consent to the revised terms.
    rationale: >-
      Without the PEC cascade, a participant who signed for embargo terms `T1` would
      remain `SIGNATORY` when the embargo is revised to `T2` — implying consent they
      never gave. The cascade makes re-consent explicit.
    verification: >-
      Integration tests in `test/demo/test_manage_embargo_demo.py` confirm that an
      `ACTIVE→REVISE` transition resets each `SIGNATORY` participant's PEC state to
      `INVITED` via `_cascade_pec_revise()`.
    relationships:
    - rel_type: implements
      spec_id: CM-18-001
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-05-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the embargo is already in `REVISE` state and a further revision proposal
      arrives (`REVISE → REVISE`), the CASE_MANAGER MUST NOT call `_cascade_pec_revise()`
      again. The PEC states were already reset by the initial `ACTIVE → REVISE` transition;
      a double cascade would incorrectly re-invite participants who may have already
      re-consented.
    relationships:
    - rel_type: refines
      spec_id: EP-05-001
- id: EP-06
  title: PEC Idempotency
  specs:
  - id: EP-06-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An idempotent retry or re-processing of a participant add-or-update MUST NOT
      overwrite a non-null PEC state with the default `UNBOUND`. Once a participant
      has been assigned any non-default PEC state (`INVITED`, `SIGNATORY`, `LAPSED`,
      or `DECLINED`), that state MUST be preserved across retries.
    rationale: >-
      Overwriting a `SIGNATORY` or `DECLINED` state with `UNBOUND` on retry silently
      revokes or erases consent that was already given. The positive-path idempotency
      rule (don't double-add) is covered by CM-13-005; this rule covers the negative
      path (don't downgrade).
    relationships:
    - rel_type: refines
      spec_id: CM-13-005
    - rel_type: implements
      spec_id: CM-18-001
- id: EP-07
  title: Embargo Invite RSVP Window Policy
  description: >-
    Policy requirements for the embargo invite RSVP window: the fallback default
    when no deadline is on the wire, the minimum permitted window, and the
    clamp-on-receipt rule that neutralises coercively short deadlines.
    Codified by ADR-0065. Source: IDEA-2066.
  specs:
  - id: EP-07-001
    priority: MUST
    kind: protocol
    statement: >-
      The embargo invite RSVP window MUST be configurable. When an
      `Invite(EmbargoEvent)` carries no `Invite.end_time`, implementations MUST
      apply the configured default window, measured from the invitation's
      `published` timestamp. The default value SHOULD be 7 days, matching
      CM-18-002.
    rationale: >-
      Aligning the fallback with the pre-existing CM-18-002 policy window means
      an invitation that omits `end_time` behaves exactly as it does today, so
      adopting CM-28 changes no existing behaviour. See ADR-0065.
    verification: >-
      Inspection of the embargo invite handler in `vultron/core/` confirms a
      configurable default RSVP window setting and that invitations arriving without
      `end_time` apply this default measured from their `published` timestamp.
    relationships:
    - rel_type: implements
      spec_id: CM-28-002
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-002
    priority: MUST
    kind: protocol
    statement: >-
      A minimum RSVP window MUST be enforced. An inviting actor MUST NOT send an
      `Invite(EmbargoEvent)` whose `Invite.end_time` is less than the configured
      minimum after the invitation's `published` timestamp. The minimum is the
      configured window — SHOULD default to 72 hours — **or the time remaining in
      the embargo, whichever is shorter**.
    rationale: >-
      An unbounded-downward deadline weaponises the mechanism: a one-minute RSVP
      window formally invites a participant while guaranteeing they cannot
      answer, excluding them with the appearance of due process. See ADR-0065.
    note: >-
      The "whichever is shorter" clause was added by ADR-0096, because the absolute
      72-hour floor can exceed the embargo it concerns: EP-04-007 permits a 12-hour
      agreed embargo, and EP-04-005's protocol default floor is 72 hours exactly. The
      floor exists to prevent an *unreasonably* short deadline, and a deadline equal to
      the whole embargo is not unreasonable. Without this clause the floor would
      contradict EP-07-006.
    verification: >-
      A unit test confirms that the outbound invite builder raises a validation error
      when the supplied `end_time` is less than `published` plus the configured
      minimum window, and that for an embargo whose remaining duration is shorter
      than that window the remaining duration is used as the minimum instead.
    relationships:
    - rel_type: refines
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-003
    priority: MUST
    kind: protocol
    statement: >-
      When a receiving actor receives an `Invite(EmbargoEvent)` whose
      `Invite.end_time` is earlier than the applicable minimum window, it MUST
      clamp the effective deadline up to that minimum. The applicable minimum is
      the one computed by EP-07-002, so the clamp never raises the deadline past
      the embargo's own end.
    note: >-
      Both parties must reach the same effective deadline for CM-28-002 to hold.
      Because the floor is a configured value, a receiver whose floor differs
      from the sender's can compute a different effective deadline. Deployments
      that require strict bilateral agreement SHOULD align their floor
      configuration; the clamp guarantees safety, not identical arithmetic.

      The clamp is bidirectional in effect but not in mechanism: this requirement
      raises a sub-minimum deadline, and EP-07-006 lowers one that overshoots the
      embargo. Where both would apply — a remaining embargo shorter than the
      configured window — EP-07-002 has already reduced the minimum to the
      remaining embargo, so the two agree rather than fight.
    rationale: >-
      Clamping makes a coercive deadline ineffective rather than fatal.
      Rejecting the invitation outright would hand the sender exactly what a
      hostile sender wants — an invite that never takes effect — and would
      punish the invitee for the inviter's misbehaviour. See ADR-0065.
    verification: >-
      A unit test confirms that the invite receiver replaces a sub-minimum `end_time`
      with `published + minimum_window` rather than using the on-wire value, and that
      the substituted value never exceeds the embargo's `end_time`.
    relationships:
    - rel_type: refines
      spec_id: EP-07-002
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An RSVP deadline MUST NOT fall after the end of the embargo it concerns. Where a
      computed deadline — whether from an explicit `Invite.end_time` or from the
      CM-18-002 policy window — would fall after the embargo's `end_time`, it MUST be
      clamped down to that `end_time`.
    rationale: >-
      An invitee must be able to answer while the embargo still exists. Nothing previously
      compared the RSVP deadline against the embargo's own end, so an answer window could
      outlive the thing it was about. See ADR-0096.
    note: >-
      The failure is concrete. Invite a participant to a 24-hour embargo with no explicit
      `Invite.end_time` and the CM-18-002 policy window applies: 7 days. The pocket veto
      fires on day 7; the embargo ended at hour 24. The participant is asked to consent to
      an embargo that is already over, and their inaction is recorded as a decline six days
      after it stopped mattering.

      This is independent of the protocol default of EP-04-005 — the same thing happens on
      day 28 of a 30-day embargo with a published actor default, which is reachable today.
    verification: >-
      A unit test confirms that an RSVP deadline computed beyond the embargo's `end_time`
      is clamped down to it, for both the explicit-`end_time` and policy-window paths,
      including when the remaining embargo is shorter than the configured minimum window.
    relationships:
    - rel_type: constrains
      spec_id: CM-18-002
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiving actor MUST NOT reject an `Invite(EmbargoEvent)` as malformed
      solely on the basis of a sub-minimum deadline.
    rationale: >-
      Rejecting the invitation would hand a hostile sender exactly what they want —
      an invite that never takes effect — and punishes the invitee for the inviter's
      misbehaviour.
    relationships:
    - rel_type: refines
      spec_id: EP-07-003
    adr:
    - ADR-0065
  - id: EP-07-005
    priority: MUST
    kind: protocol
    statement: >-
      A receiving actor MUST log every deadline clamp it applies to an
      `Invite(EmbargoEvent)` deadline — both the EP-07-003 clamp up to the
      applicable minimum window and the EP-07-006 clamp down to the embargo's
      `end_time`.
    rationale: >-
      Logging the clamp makes the adjustment observable for auditing and
      debugging without rejecting the invitation.
    note: >-
      Amended by ADR-0096. This requirement previously named only the up-clamp, and only
      "the configured minimum window". The applicable minimum is now derived (EP-07-002:
      the lesser of the configured window and the time remaining in the embargo), and a
      second clamp direction exists. Both are adjustments a reader of the log needs to see.
    verification: >-
      A unit test confirms that clamping a sub-minimum deadline emits a log entry at
      the appropriate level recording both the original and the effective deadline
      values, and that clamping a deadline down to the embargo's `end_time` emits the
      same record.
    relationships:
    - rel_type: refines
      spec_id: EP-07-003
    - rel_type: refines
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_074
- id: EP-08
  title: Open Proposal Resolution Order
  description: >-
    How a Participant resolves two or more simultaneously open embargo proposals:
    earliest expiration first, with the remainder handled as revisions. Codified by
    ADR-0100, which also records why there is no multi-candidate poll activity. The
    heuristic itself predates this group as normative prose in
    `docs/topics/process_models/em/defaults.md`; stating it here is what makes it
    testable. Source: CONCERN-3433.
  specs:
  - id: EP-08-001
    priority: SHOULD
    kind: protocol
    statement: >-
      When two or more embargo proposals are open for a case and none has been
      accepted, a Participant SHOULD accept the proposal whose embargo `end_time` is
      earliest and propose the remainder as revisions. When two or more revisions are
      open against an active embargo, a Participant SHOULD accept or reject them
      individually in earliest-to-latest `end_time` order.
    rationale: >-
      Two parties proposing 30 and 60 days agree on days 1–30 and disagree only
      beyond that, so accepting the shorter proposal captures all mutual agreement
      immediately and leaves the contested remainder to negotiate as a revision. This
      is the *Shortest Embargo Proposed Wins* heuristic stated in
      `docs/topics/process_models/em/defaults.md`, derived in
      `docs/topics/process_models/em/formal_model.md`, and applied to case growth in
      `docs/topics/process_models/em/working_with_others.md`.
    note: >-
      This requirement restates guidance that was already normative in
      `docs/topics/process_models/em/defaults.md` but existed nowhere in `specs/`.
      Because `spec-dump` is the corpus agents read, the rule was invisible to
      implementation and the code diverged from it — `find_embargo_proposal_id`
      selected by arrival order instead. Recording it here is the correction.
    verification: >-
      A unit test asserts that, given three open proposals with distinct embargo
      `end_time` values, the proposal selected for acceptance is the earliest-expiring
      one.
    relationships:
    - rel_type: constrains
      spec_id: EP-04-003
      note: >-
        EP-04-003 is the two-party case-creation instance of this ordering rule, so
        it refines EP-08-001 rather than the reverse. Both MUST resolve
        earliest-end-date first, and both MUST share one comparator (#3392).
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-002
    priority: MUST
    kind: protocol
    statement: >-
      When an implementation must select among two or more open embargo proposals and
      the caller supplied no proposal identifier, it MUST select the earliest-expiring
      open proposal. It MUST NOT select by insertion or arrival order.
    rationale: >-
      A counter-proposal is emitted while the EM state remains PROPOSED (EMB-15-003),
      so arrival order places the superseded terms first. Selecting by arrival
      therefore accepts the terms the counter-proposal was sent to replace, which
      inverts EP-08-001 in exactly the situation that makes a default selection
      necessary.
    note: >-
      The default-selection path is the one that carries the risk. An explicit
      proposal identifier is unambiguous; the ambiguity only arises when the caller
      does not name one, and that is where the ordering rule must be enforced.
    verification: >-
      A unit test asserts that an accept request omitting the proposal identifier
      resolves to the earliest-expiring open proposal, including the case where a
      later-arriving counter-proposal expires sooner than the original.
    relationships:
    - rel_type: refines
      spec_id: EP-08-001
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-003
    priority: MUST
    kind: project
    statement: >-
      The record of open embargo proposals MUST NOT retain a proposal that has been
      accepted or rejected, or whose embargo has terminated. An implementation that
      records open proposals MUST remove an entry when the proposal is decided.
    rationale: >-
      EP-08-002 orders the set of open proposals, so a set that retains decided
      proposals can select one that is no longer open. Ordering an unpruned record is
      not a weaker guarantee than ordering a pruned one — it is a different and wrong
      answer, which is why the retention rule is stated alongside the ordering rule
      rather than left as hygiene.
    note: >-
      Two records of overlapping state are involved and **neither** is fully
      pruned. `pending_embargo_proposal_index` has one writer and no remover at
      all, so it grows without bound.
      `VulnerabilityCase.proposed_embargoes` is pruned only on teardown, by
      `RemoveFromProposedEmbargoesNode` in `remove_embargo_from_case_tree`;
      `reject_proposed_embargo_bt` does not include that node, so a rejected
      proposal stays in both records. This requirement therefore covers every
      record of open proposals, not just the index.
    verification: >-
      A unit test asserts that accepting a proposal, rejecting a proposal, and
      tearing down an embargo each leave no corresponding entry in the open-proposal
      record.
    relationships:
    - rel_type: constrains
      spec_id: EP-08-002
    adr:
    - ADR-0100
    stories:
    - story_2022_014
