id: EP
title: Embargo Policy
description: >-
  Requirements for a standardized embargo policy record associated with an Actor profile.
  Allows actors to declare their default embargo preferences so that coordinators can evaluate
  compatibility before proposing an embargo or inviting an actor to a case.
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: EP-01
  title: Policy Record Format
  specs:
  - id: EP-01-001
    priority: MAY
    kind: protocol
    statement: >-
      An Actor profile MAY include an `embargo_policy` field containing the Actor's structured
      embargo policy record inline. The policy is part of the profile: an Actor has at most one,
      and it is published, read and replaced as a field of the profile, not as a separate object.
    rationale: >-
      Whoever holds an Actor's profile then holds its embargo terms, so carrying the profile
      (CP-01-010) carries the policy, and no lookup has to choose among several records.
    stories:
    - story_2022_001
    - story_2022_003
    - story_2022_009
    - story_2022_011
    - story_2022_076
    - story_2022_095
  - id: EP-01-002
    priority: MUST
    kind: protocol
    statement: 'The embargo policy record MUST include the following fields: actor_id (full URI string identifying the Actor to which this policy applies), inbox (URL string of the Actor''s ActivityPub inbox), preferred_duration (ISO 8601 duration string representing the Actor''s preferred embargo length)'
    rationale: >-
      A coordinator that reads a policy needs to know whose terms it states, where to
      send a proposal or Invite, and what length the actor prefers. Without `actor_id` a
      policy copied out of its profile cannot be attributed, without `inbox` the
      coordinator cannot reach the actor, and `preferred_duration` is the actor default
      that shortest-wins reads at case creation (EP-04-003).
    verification: >-
      Inspection of the `EmbargoPolicy` Pydantic model confirms that `actor_id`,
      `inbox`, and `preferred_duration` are declared as required fields with no
      default values.
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-002
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
    stories:
    - story_2022_004
    - story_2022_010
    - story_2022_021
    - story_2022_022
    - story_2022_072
  - id: EP-01-003
    priority: SHOULD
    kind: protocol
    statement: >-
      The embargo policy record SHOULD include the optional fields
      `minimum_duration` (ISO 8601 duration), `maximum_duration` (ISO 8601 duration),
      and `notes` (free-text string describing the Actor's embargo preferences).
    rationale: >-
      A declared range tells a coordinator, before it proposes, which terms the actor
      will accept (EP-03-002), which saves a propose-and-reject round trip. Free-text
      notes carry preferences that a duration cannot express. The fields are optional
      because many actors hold only a preferred length.
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: depends_on
      spec_id: DUR-01-001
      note: ISO 8601 duration format
    stories:
    - story_2022_004
    - story_2022_021
    - story_2022_073
  - id: EP-01-004
    priority: MUST
    kind: project
    statement: >-
      The embargo policy record MUST be serializable as a Pydantic model and persisted in
      the DataLayer as part of the Actor's profile record (EP-01-001)
    rationale: >-
      The policy must survive a restart and be readable from the profile at case
      creation (EP-04-003). Persisting it as part of the profile record keeps one copy,
      so the profile and the policy cannot disagree.
    verification: >-
      A unit test confirms that an actor profile carrying an `EmbargoPolicy` round-trips
      through Pydantic serialization and through the DataLayer `save()` and `get()`
      operations without data loss.
    stories:
    - story_2022_004
  - id: EP-01-005
    priority: MUST
    kind: protocol
    statement: The embargo policy record MUST use full-URI IDs for `actor_id`
    rationale: >-
      Other actors on other servers read and compare policies. A local or short
      identifier cannot be resolved or compared across servers, so a coordinator could
      attach a policy to the wrong actor; a full URI names one actor everywhere
      (OID-01-001).
    verification: >-
      A unit test confirms that `EmbargoPolicy` raises `ValidationError` when
      `actor_id` is a non-URI string and accepts a well-formed `https://` URI.
    relationships:
    - rel_type: depends_on
      spec_id: OID-01-001
    stories:
    - story_2022_034
    - story_2022_035
  - id: EP-01-006
    priority: SHOULD
    kind: protocol
    statement: >-
      When `minimum_duration` is declared, an Actor SHOULD reject embargo proposals
      shorter than that value.
    rationale: >-
      The minimum_duration field signals a floor below which the Actor will not
      accept an embargo; evaluating it prevents compatibility mismatches.
    relationships:
    - rel_type: refines
      spec_id: EP-01-003
  - id: EP-01-007
    priority: SHOULD
    kind: protocol
    statement: >-
      When `maximum_duration` is declared, an Actor SHOULD reject embargo proposals
      longer than that value.
    rationale: >-
      The maximum_duration field signals a ceiling above which the Actor will not
      accept an embargo; evaluating it prevents compatibility mismatches.
    relationships:
    - rel_type: refines
      spec_id: EP-01-003
- id: EP-02
  title: API Endpoint
  specs:
  - id: EP-02-001
    priority: SHOULD
    kind: project
    statement: >-
      Each Actor SHOULD expose its embargo policy at `GET /actors/{actor_id}/embargo-policy`
    rationale: >-
      A coordinator evaluates an actor's terms before inviting it (EP-03-001). A
      predictable URL lets it fetch those terms from any server without knowing how that
      server lays out its profiles.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`TestGetEmbargoPolicy`) confirms the route returns the published record as
      AS2 JSON, answers 404 when none is published, and shows the record the actor's
      profile carries inline, not a free-standing policy record in the store (EP-01-001).
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-002
    priority: MUST
    kind: project
    statement: >-
      The policy endpoint MUST return its record as machine-readable JSON.
    rationale: >-
      Compatibility evaluation is done by code (EP-03), so the policy must be
      machine-readable.
    verification: >-
      A test confirms the endpoint responds with `Content-Type: application/json`.
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_004
    - story_2022_009
  - id: EP-02-006
    priority: MUST
    kind: project
    statement: >-
      The policy endpoint MUST return the same record that the Actor's profile carries
      inline under `embargo_policy` (EP-01-001).
    rationale: >-
      If the endpoint could return a record that differs from the one in the profile, a
      coordinator could evaluate terms the actor has since replaced.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`test_the_actor_profile_carries_the_policy_inline_after_publish`) confirms the
      endpoint body equals the `embargoPolicy` value of the Actor's profile document.
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_004
    - story_2022_009
  - id: EP-02-004
    priority: MUST_NOT
    kind: project
    statement: >-
      A publish or replace at `PUT /actors/{actor_id}/embargo-policy` MUST NOT overwrite
      an update to the actor's profile that was written after the request read it.
    rationale: >-
      The policy is a field of the profile (EP-01-001), so a publish rewrites the whole
      profile, and a plain read-then-save loses a write that lands between the two
      without anyone being told.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`TestConcurrentProfileWrite`) interleaves a profile write between the PUT's read and
      its write and confirms both the concurrent update and the published policy are
      kept.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: EP-02-005
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-007
    priority: MUST
    kind: project
    statement: >-
      The policy endpoint MUST write a publish or replace only if the stored profile is
      still the one the request read.
    rationale: >-
      A compare-and-set write is what keeps a publish from overwriting a profile update
      that landed after the request read the profile (EP-02-004).
    verification: >-
      `test/adapters/driven/test_sqlite_save_if_unchanged.py` confirms the store's
      compare-and-set refuses a stale expected record and a row changed between its own
      read and write.
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: EP-02-004
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-008
    priority: MUST
    kind: project
    statement: >-
      When the stored profile has changed since the request read it, the policy endpoint
      MUST re-read the profile and re-apply the request's terms.
    rationale: >-
      Re-applying the terms to a fresh read is safe because a publish changes only the
      policy field, so a concurrent profile update and the published policy are both
      kept.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`test_a_profile_write_inside_the_window_is_kept_beside_the_policy`) confirms the
      retried publish keeps the concurrent update and the published policy.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: EP-02-007
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-009
    priority: MUST
    kind: project
    statement: >-
      When the profile keeps changing under the request for a bounded number of
      attempts, the policy endpoint MUST refuse the request with 409 Conflict.
    rationale: >-
      The bound keeps a profile under continuous write from holding the request open.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`test_a_profile_changed_under_every_attempt_is_409_and_writes_nothing`) confirms
      a profile changed under every attempt yields 409.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: EP-02-008
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-010
    priority: MUST
    kind: project
    statement: >-
      A publish or replace that the policy endpoint refuses with 409 Conflict MUST write
      nothing.
    rationale: >-
      A refused request that wrote part of its change would leave the profile in a state
      no request asked for.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`test_a_profile_changed_under_every_attempt_is_409_and_writes_nothing`) confirms
      the stored profile is untouched after the 409.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: EP-02-009
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-005
    priority: SHOULD
    kind: project
    statement: >-
      A hosted Actor SHOULD be able to publish or replace its embargo policy at
      `PUT /actors/{actor_id}/embargo-policy`, with a body that carries only the terms
      (EP-01-002, EP-01-003).
    rationale: >-
      Without a write endpoint the only way to give a Receiver an actor default is to
      reach into its store, so an operator could not set the terms shortest-wins reads
      at case creation.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`TestPutEmbargoPolicy`) confirms 201 on first publish and 200 on replace, 404 for
      an actor this node does not host, and 422 for a malformed or calendar-unit
      duration. The published record's id is the endpoint URL
      (`EmbargoPolicy.build_id`), so a replace keeps the id.
    scope:
    - production
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-011
    priority: MUST
    kind: project
    statement: >-
      The policy endpoint MUST derive the record's `actor_id` and `inbox` from the
      addressed actor's own record, never from the request body.
    rationale: >-
      Deriving `actor_id` from the path actor keeps a body from publishing terms in
      another actor's name (EP-01-005).
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`test_a_body_cannot_publish_in_another_actors_name`) confirms `actor_id` and
      `inbox` come from the actor record and that a body naming an actor is refused with
      422.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: EP-02-005
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-012
    priority: MUST
    kind: project
    statement: >-
      The policy endpoint MUST persist the record as the `embargo_policy` field of the
      addressed actor's profile, in that actor's own store (EP-01-004).
    rationale: >-
      The profile then carries the record inline as the actor default that
      shortest-wins reads at case creation (CP-01-010, EP-04-003). A free-standing
      record beside the profile would be a second source that nothing reads.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`TestPutEmbargoPolicy`) confirms the stored profile's `embargo_policy` is the
      published record with no free-standing policy record beside it, and
      `test_a_publish_leaves_a_seeded_policy_record_unread` confirms a record in the
      store that the profile does not carry is neither read nor counted as a prior
      publish.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: EP-01-004
    stories:
    - story_2022_003
    - story_2022_009
  - id: EP-02-013
    priority: MUST
    kind: project
    statement: >-
      A replace at the policy endpoint MUST leave exactly one policy for the actor.
    rationale: >-
      Writing the terms into the one profile field makes a replace an overwrite, so no
      withdrawn default is left beside the current one for anything to read.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actors_embargo_policy.py`
      (`test_replace_returns_200_and_leaves_exactly_one_policy`) confirms one record
      remains after a replace.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: EP-02-005
    stories:
    - story_2022_003
    - story_2022_009
- id: EP-03
  title: Policy Compatibility Evaluation
  specs:
  - id: EP-03-001
    priority: SHOULD
    kind: protocol
    statement: >-
      Before proposing an embargo or inviting an actor to join an existing embargo, the CASE_MANAGER
      SHOULD retrieve and evaluate the target actor's embargo policy for compatibility with
      the proposed embargo terms
    rationale: >-
      A proposal the invitee will reject costs a negotiation round and can leave the
      invitee outside the embargo while the round runs. Reading the published policy
      first lets the CASE_MANAGER choose terms the invitee has said it accepts, or know
      in advance that it will decline.
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-001
    - rel_type: implements
      spec_id: VP-07-006
    - rel_type: implements
      spec_id: VP-07-007
    stories:
    - story_2022_005
  - id: EP-03-002
    priority: MUST
    kind: protocol
    statement: >-
      Compatibility evaluation MUST check that the proposed duration falls within the target
      actor's `minimum_duration`–`maximum_duration` range, if declared
    rationale: >-
      The declared minimum and maximum are the actor's statement of what it will accept
      (EP-01-006, EP-01-007). An evaluation that ignored them would report terms as
      compatible that the actor has already said it will reject.
    verification: >-
      A unit test confirms that the compatibility evaluator returns incompatible when the
      proposed duration falls outside the declared `minimum_duration`–`maximum_duration`
      range, and compatible when it falls within the range.
    scope:
    - production
    relationships:
    - rel_type: implements
      spec_id: VP-07-003
    - rel_type: implements
      spec_id: VP-07-004
    - rel_type: implements
      spec_id: VP-07-005
    - rel_type: depends_on
      spec_id: DUR-01-001
    - rel_type: depends_on
      spec_id: DUR-04-001
    stories:
    - story_2022_005
- id: EP-04
  title: Default Embargo Semantics
  specs:
  - id: EP-04-001
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_OWNER's **actor default** embargo applies at case creation and the
      sender submitted no explicit embargo proposal, the case's initial EM state MUST be
      `EM.ACTIVE`, not `EM.PROPOSED`. The sender's report submission without a
      counter-proposal constitutes tacit acceptance of the CASE_OWNER's actor default
      embargo.
    rationale: >-
      A sender that submits a report without terms of its own has nothing to object to
      in the receiver's default, so nobody is left to accept it. A case left at
      `EM.PROPOSED` would wait for an answer nobody owes, with no embargo in force at
      the moment the report is most sensitive.
    note: >-
      "Actor default" is the duration carried by a published `EmbargoPolicy`, as distinguished
      from the "protocol default" of EP-04-005. Only the actor default participates in the
      shortest-wins comparison (EP-04-003); the protocol default never does (EP-04-006).
      Amended by ADR-0096.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`test_inline_actor_profile_policy_is_the_actor_default`) confirms that a case
      created from the CASE_OWNER's actor default with no sender proposal is at
      `EM.ACTIVE`, and `test/core/services/embargo_lifecycle/test_creation.py`
      (`test_none_to_active_in_one_commit`) that `EM.PROPOSED` is never persisted.
    relationships:
    - rel_type: refines
      spec_id: DUR-07-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When a default embargo is created, the intermediate EM Proposed state MUST NOT be
      observable to other participants: no message, ledger entry or replica shows the
      embargo as Proposed.
    rationale: >-
      The default embargo is in force from creation. A participant that saw it as
      Proposed would treat it as not yet agreed and could answer it or counter-propose,
      and its replica would record a negotiation that never happened.
    verification: >-
      `TestCreationTimeEmbargoIsOneWrite` refuses the ACCEPT step after PROPOSE has been
      applied and asserts the stored case stays at `EM.NONE` rather than `EM.PROPOSED`, and
      that a rerun then reaches `EM.ACTIVE` with an attached embargo (EP-04-012, #4123).
      `TestCreationTimeEmbargoCommitsItsEffectsWithIt` faults the owner-seed write and the
      revision write in turn and asserts the case stays at `EM.NONE` and that a rerun seeds
      the owner and registers the revision (#4142).
  - id: EP-04-013
    priority: MUST_NOT
    kind: project
    statement: >-
      `InitializeDefaultEmbargoNode` MUST NOT persist the intermediate `EM.PROPOSED`
      state.
    rationale: >-
      How this codebase meets EP-04-002; split from it so EP-04-002 states only what
      other participants observe (MS-12-010).
    verification: >-
      The `initialize_creation_embargo` service tests confirm that the creation-time
      operation hands the store one commit (`save_many`) holding the case at
      `EM.ACTIVE`, or at `EM.REVISE` for a contested creation, so no `EM.PROPOSED` case
      is stored.
    relationships:
    - rel_type: implements
      spec_id: EP-04-002
  - id: EP-04-031
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST apply the PROPOSE and ACCEPT state machine triggers atomically
      within `InitializeDefaultEmbargoNode`.
    rationale: >-
      How this codebase meets EP-04-002; split from it so EP-04-002 states only what
      other participants observe (MS-12-010). An atomic step leaves either the whole
      creation embargo or nothing.
    verification: >-
      The `initialize_creation_embargo` service tests confirm that the creation-time
      operation hands the store one commit (`save_many`) holding the case with the
      embargo attached, the participant consent records, the Case Owner's signatory seed
      and, for a contested creation, the revision's `EmbargoEvent`; that a refused P/X/A
      check, an unheld embargo, a missing owner record or a case that has left `EM.NONE`
      writes nothing; and that a failed commit writes nothing and a rerun completes.
    relationships:
    - rel_type: implements
      spec_id: EP-04-002
  - id: EP-04-003
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers case creation where the sender proposes a duration and the
      CASE_OWNER's profile carries an embargo policy, its actor default (EP-01-001,
      CP-01-010). The CASE_MANAGER MUST make the shorter of the two the active embargo
      at once (EM `ACTIVE`).
    rationale: >-
      Two parties that propose 30 and 60 days respectively agree on days 1–30 and disagree
      only on days 31–60. Activating the shorter embargo immediately captures all mutual
      agreement. See docs/topics/process_models/em/formal_model.md § "Why the shortest
      proposal wins" for the full vector-agreement derivation.
    note: >-
      The comparison is of the time remaining at creation: the actor default is a
      duration from creation, and the sender's remaining time is `end_time` minus now,
      so comparing them is comparing end dates.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`TestEP04SenderProposalAtCaseCreation`) confirms that when both parties carry a
      proposal at case creation the shorter is the active embargo;
      `test/core/behaviors/case/nodes/test_embargo_resolution.py` pins the duration
      table. End to end, `test/demo/test_report_with_embargo_demo.py` runs the
      `report-with-embargo` exchange demo through the Reporter's `submit-report` trigger
      in both directions of the comparison.
    relationships:
    - rel_type: refines
      spec_id: EP-08-001
      note: >-
        EP-04-003 is the two-party case-creation instance of this ordering rule.
        Both MUST resolve earliest-end-date first, and both MUST share one
        comparator (#3392).
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-016
    priority: SHOULD
    kind: protocol
    statement: >-
      This rule covers case creation where both the sender and the CASE_OWNER have an
      applicable embargo proposal (EP-04-003). The CASE_MANAGER SHOULD register the
      longer of the two as a pending revision (EM `REVISE`).
    rationale: >-
      The longer duration becomes a pending revision so the proposer can negotiate the
      contested portion. This is strictly better than rejecting it outright: both
      parties secure the overlap they both wanted.
    note: >-
      An exact tie between the sender's terms and the actor default leaves nothing
      contested, so no revision is registered and the case stays at `EM.ACTIVE`.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`TestEP04SenderProposalAtCaseCreation`) confirms the longer proposal is
      registered through `EmbargoLifecycle.propose_embargo`, leaving `em_state` at
      `EM.REVISE` with the loser in `proposed_embargo_ids`. The same class's
      `test_a_second_proposal_for_the_same_report_registers_no_second_revision` and
      `test/core/behaviors/case/nodes/test_embargo.py`
      (`test_a_second_run_registers_no_second_revision`) confirm a repeated proposal for
      the same report leaves one active embargo and one pending revision.
    relationships:
    - rel_type: extends
      spec_id: EP-04-003
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-004
    priority: MUST
    kind: protocol
    statement: >-
      A sender MUST be able to propose embargo terms when it submits a report. It
      carries a proposed `EmbargoEvent`, inline or by reference, as the
      `proposedEmbargo` of the `Offer(VulnerabilityReport)` activity. That
      `EmbargoEvent` carries the report URI as its `context` (EP-04-009).
    rationale: >-
      Without a way to state terms on the report, a sender with its own deadline can
      only take the receiver's default or negotiate after the case exists, and the
      shortest-wins comparison (EP-04-003) has no sender side to compare. The report
      Offer is the one message the sender sends before a case exists, so it carries the
      proposal, and the receiver's `CaseProposal` carries the Offer whole (CP-01-008),
      so the terms reach the CASE_MANAGER as the sender stated them.
    note: >-
      Carrying the proposal on the report offer was chosen over two alternatives. An
      activity-level `end_time` on the `Offer` would add a third meaning to a field CM-28-001
      already names a critical naming hazard. Inlining the sender's own `EmbargoPolicy` states
      a standing preference, not terms for this report — "I generally prefer 30 days" is not
      "for this report I propose 30 days". Amended by ADR-0096.
    verification: >-
      `test/wire/as2/test_report_offer_proposed_embargo.py` confirms that `Offer(VulnerabilityReport)`
      carrying a proposed `EmbargoEvent` is extracted with the proposal intact, on the Offer and on the
      `CaseProposal` that carries it.
      `test/core/use_cases/triggers/test_report_triggers.py` (`TestSubmitReportProposedEmbargo`) and
      `test/adapters/driving/fastapi/routers/test_trigger_report.py` confirm a sender states the
      terms through the `submit-report` trigger's `proposed_embargo_end_time`, which stores the
      `EmbargoEvent` about the report and carries it on the Offer.
    relationships:
    - rel_type: refines
      spec_id: EP-04-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-017
    priority: MUST
    kind: protocol
    statement: >-
      At case creation, the CASE_MANAGER MUST rewrite the `context` of the sender's
      proposed `EmbargoEvent` (EP-04-004) from the report URI to the case URI.
    rationale: >-
      The context rewrite moves the terms onto the case once there is one, so the case's
      embargo is about the case like every other (EP-04-009).
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`TestEP04SenderProposalAtCaseCreation`,
      `test_a_lone_sender_proposal_becomes_the_active_embargo_about_the_case`) confirms
      the context is rewritten from the report URI to the case URI when the case is
      created, with the event's identity kept.
    relationships:
    - rel_type: extends
      spec_id: EP-04-004
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-014
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the proposed `EmbargoEvent` of EP-04-004 inline as the
      `proposedEmbargo` of the `Offer(VulnerabilityReport)`, not by reference.
    rationale: >-
      How this codebase meets EP-04-004; split from it so EP-04-004 states only what
      other participants observe (MS-12-010). The CASE_MANAGER has never seen the
      Reporter's event, and this codebase dereferences only the few references
      AKM-05-007 lists, so the event travels inline. That is a shortcut of this
      prototype reference implementation, not a protocol rule.
    verification: >-
      `test/core/use_cases/triggers/test_report_triggers.py::TestSubmitReportProposedEmbargo::test_the_offer_carries_the_stored_terms_about_the_report`
      confirms the emitted `Offer(VulnerabilityReport)` carries `proposedEmbargo` as an
      inline `EmbargoEvent` object with its type, id and context, not a URI string;
      `test/wire/as2/test_report_offer_proposed_embargo.py` confirms such an Offer is
      extracted with the proposal intact.
    relationships:
    - rel_type: implements
      spec_id: EP-04-004
  - id: EP-04-005
    priority: MUST
    kind: protocol
    statement: >-
      A **protocol default** embargo duration MUST exist.
    rationale: >-
      The goal of the EM process is to lock in *an* embargo as early as possible
      (`docs/topics/process_models/em/principles.md`). Without a protocol default, a
      case with no embargo proposal and no actor default would have no embargo at all.
    note: >-
      The duration is deliberately short so that publishing an `EmbargoPolicy` is
      strictly better than publishing nothing: a receiver who published nothing must not
      get a longer embargo than one who published a considered 30 days. See ADR-0096,
      which overturns `docs/topics/process_models/em/defaults.md` § "No Defaults, No
      Proposals".
    verification: >-
      `test/core/models/test_actor_config.py`
      (`test_protocol_default_embargo_duration_defaults_to_72_hours`) confirms a
      protocol default exists when nothing is configured.
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-018
    priority: MUST
    kind: protocol
    statement: >-
      The protocol default embargo duration MUST be no less than 72 hours and no more
      than 5 days.
    rationale: >-
      The 72-hour floor equals the *default* EP-07-002 minimum RSVP window, so the
      shortest embargo the protocol produces is as long as the shortest answer window it
      grants. The 5-day ceiling keeps a deployment from restoring a default generous
      enough to make publishing nothing better than publishing a policy.
    note: >-
      The alignment with EP-07-002 holds at the default values only: EP-07-002's
      effective minimum is the lesser of that window and the time remaining in the
      embargo, so that the floor cannot outlive a shorter agreed embargo (EP-07-006).
    verification: >-
      `test/core/models/test_actor_config.py`
      (`test_protocol_default_embargo_duration_accepts_range`,
      `test_protocol_default_embargo_duration_refuses_out_of_range`) confirms the
      default lies in [72 hours, 5 days] and that no value outside it can become the
      default.
    relationships:
    - rel_type: constrains
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-019
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers an embargo-eligible case created with no embargo proposal and no
      actor default. The CASE_MANAGER MUST activate an embargo of the protocol default
      duration, so the case begins at `EM.ACTIVE`.
    rationale: >-
      A case with no embargo is the outcome the process exists to avoid, and reaching it
      through mutual silence is the least deliberate way to arrive there.
    note: >-
      Where the case is not embargo-eligible, EP-04-008 applies instead and no protocol
      default embargo is created.
    verification: >-
      `test/core/behaviors/case/nodes/test_embargo_resolution.py`
      (`test_no_policy_no_proposal_uses_configured_protocol_default`) confirms that a
      case created with no `EmbargoPolicy` in the store and no sender proposal gets an
      active embargo at the protocol default.
    relationships:
    - rel_type: extends
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: EP-04-015
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST make the protocol default embargo duration of EP-04-005
      configurable per actor.
    rationale: >-
      How this codebase lets a deployment choose its protocol default within the bounds
      EP-04-005 sets; split from it so EP-04-005 states only the bounds and the case
      that other participants observe (MS-12-010). Whether a value can be changed is an
      operating choice of one implementation.
    verification: >-
      `test/core/models/test_actor_config.py` confirms that a value in [72 hours, 5
      days] is accepted and that the value is read from the environment.
    relationships:
    - rel_type: implements
      spec_id: EP-04-005
  - id: EP-04-032
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST refuse a configured protocol default embargo duration outside
      [72 hours, 5 days].
    rationale: >-
      A configured value outside the bounds of EP-04-018 would let one deployment's
      default break the protocol rule that other participants rely on.
    verification: >-
      `test/core/models/test_actor_config.py`
      (`test_protocol_default_embargo_duration_refuses_out_of_range`) confirms that a
      value outside [72 hours, 5 days] is refused.
    relationships:
    - rel_type: implements
      spec_id: EP-04-018
  - id: EP-04-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The protocol default MUST NOT participate in the shortest-wins comparison of EP-04-003.
      It is the value applied when no proposal and no actor default applies, never a candidate
      within that comparison.
    rationale: >-
      A 72-hour protocol default that competed under shortest-wins would win against every
      longer proposal and cap every embargo in the system at 72 hours, so no longer embargo
      could ever be agreed. The protocol default answers "what if nobody said anything", not
      "whose terms are shortest". See ADR-0096.
    verification: >-
      A unit test asserts that a 30-day actor default with no sender proposal yields a 30-day
      active embargo, not the protocol default.
    relationships:
    - rel_type: refines
      spec_id: EP-04-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT clamp a proposal or actor default that is shorter than
      the protocol default up to it. It honors that term at its stated duration.
    rationale: >-
      `em/principles.md` requires embargo duration be "limited to the shortest duration
      possible", and a Participant is free to set their own terms. EP-04-005's range bounds
      what the fallback may be configured to; it does not constrain what parties may agree.
      A reporter who proposes 12 hours gets 12 hours. See ADR-0096.
    verification: >-
      A unit test asserts that a sender proposal shorter than the configured protocol default
      is activated at its stated duration.
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT apply the protocol default to a case that is not
      embargo-eligible. Such a case has P, X or A set at creation.
    rationale: >-
      VP-06-001 already forbids proposing or accepting an embargo negotiation once the
      vulnerability is public, exploit code is public, or attacks are observed (EMB-01-002 is the
      accept half of the same prohibition). An embargo on an already-public vulnerability
      protects nothing, so the protocol default inherits that guard rather than bypassing it.
      See ADR-0096.
    verification: >-
      `test/core/behaviors/case/nodes/test_embargo_resolution.py`
      (`test_pxa_set_creates_no_embargo_event`) confirms that a case created with
      `pxa_state != CS_pxa.pxa` receives no protocol default embargo.
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
    - rel_type: refines
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-020
    priority: MUST
    kind: protocol
    statement: >-
      When any of P, X or A is set at case creation, the CASE_MANAGER MUST leave the
      case at `EM.NONE`.
    rationale: >-
      VP-06-001 forbids proposing or accepting an embargo once the vulnerability is
      public, exploit code is public, or attacks are observed. An embargo on an
      already-public vulnerability protects nothing, so the case starts with none.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`test_ineligible_case_is_created_without_an_embargo`) confirms a case created
      with P, X or A set is at `EM.NONE` with no embargo.
    relationships:
    - rel_type: refines
      spec_id: VP-06-001
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-009
    priority: MUST
    kind: protocol
    statement: >-
      `EmbargoEvent.context` MUST identify the subject the embargo concerns: the report URI
      before a case exists, and the case URI afterwards.
    rationale: >-
      A proposal embedded on `Offer(VulnerabilityReport)` (EP-04-004) precedes the case,
      so the report is the only subject it can name. This gives pre-case embargo terms a
      representation without a pre-case embargo phase, which ADR-0096 declines.
    note: >-
      Do not confuse this field with `VultronEvent.context` in
      `vultron/core/models/events/base.py`, which is typed `CoreObject | None` and holds the
      *inbound activity's* resolved context. The casts to `VulnerabilityCase` in
      `vultron/core/models/events/embargo.py` are on that field, for `Announce`/`Invite` events
      whose context genuinely is a case, and are unaffected by this widening.
    verification: >-
      `test/wire/as2/test_report_offer_proposed_embargo.py` confirms an `EmbargoEvent`
      constructed with a report URI context validates and travels on the Offer.
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-021
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A reader of `EmbargoEvent.context` MUST NOT assume it names a case without
      checking.
    rationale: >-
      The field is `EmbargoEvent.context` in `vultron/core/models/embargo_event.py`,
      typed `NonEmptyString`, and nothing validates it as a case reference. Before a
      case exists it holds a report URI (EP-04-009), so a reader that assumes a case
      would take a report URI for one.
    verification: >-
      `test/core/services/test_carried_embargo.py`
      (`test_a_held_proposal_about_the_cases_own_report_is_accepted`) confirms a
      consumer reads a pre-case proposal's `context` as the report it names, not as a
      case.
    relationships:
    - rel_type: derives_from
      spec_id: EP-04-009
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: EP-04-010
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT conflate the actor default with the protocol default.
    rationale: >-
      A consumer must be able to tell "the CASE_OWNER published this duration" from "the
      CASE_OWNER published nothing". A fallback returned into the same blackboard key
      that a published `EmbargoPolicy` fills leaves no downstream code able to tell the
      two apart. See ADR-0096.
    note: >-
      The fallback is `ActorConfig.protocol_default_embargo_duration`, and the actor
      default is the one `embargo_policy` the CASE_OWNER's inline profile carries
      (`actor_default_duration()`; EP-01-001, CP-01-010), so there is no list of
      policies to select from.
    verification: >-
      Inspection of `vultron/core/behaviors/case/nodes/embargo_resolution.py` and
      `vultron/core/services/embargo_duration.py` confirms the actor default is read
      from the single policy field of the CASE_OWNER's inline profile rather than
      selected from the store, apart from the protocol default.
    adr:
    - ADR-0096
  - id: EP-04-022
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the actor default and the protocol default under distinct
      names.
    rationale: >-
      Distinct names are how a consumer distinguishes "the CASE_OWNER published this
      duration" from "the CASE_OWNER published nothing" (EP-04-010).
    note: >-
      The protocol default is published as `protocol_default_embargo_duration` beside
      `actor_default_embargo_duration`.
    verification: >-
      Inspection of `vultron/core/behaviors/case/nodes/embargo_resolution.py` and
      `vultron/core/services/embargo_duration.py` confirms the actor default and the
      protocol default are resolved under distinct names.
    relationships:
    - rel_type: implements
      spec_id: EP-04-010
    adr:
    - ADR-0096
  - id: EP-04-023
    priority: MUST
    kind: project
    statement: >-
      The protocol default MUST be the only fallback embargo duration in this codebase.
    rationale: >-
      A second implicit default duration would decide an embargo's length where nothing
      states it, and would hide which default a case received.
    note: >-
      `EmbargoEvent.end_time` is required with no default, so every construction site
      states the end it means, and the protocol default resolved at case creation is the
      only fallback duration in the implementation.
    verification: >-
      `test/core/models/test_embargo_event.py` (`test_end_time_is_required`,
      `test_end_time_field_has_no_default`) confirms `EmbargoEvent.end_time` is
      required and carries no default embargo duration.
    adr:
    - ADR-0096
  - id: EP-04-011
    priority: MUST
    kind: protocol
    statement: >-
      The pending revision that EP-04-016 registers at case creation MUST follow the
      same relay as any other revision proposal (EP-09).
    rationale: >-
      A revision registered in the CASE_MANAGER's store alone is invisible to the party
      whose terms won and unreachable by the owner: unindexed, the default selection
      cannot name it, and with no Invite nobody is asked to answer it. The creation-time
      revision is a revision like any other; the only thing special about it is who
      proposes it, and CM-24 already covers the CASE_MANAGER proposing on a
      participant's behalf.
    note: >-
      Which party lost is known at registration:
      `initial_embargo_duration.source` on the blackboard names whether the sender's proposal
      or the actor default became active. When
      the reporter's longer terms lost, the reporter is the proposer and the Case Owner is
      invited; when the owner's longer default lost, the owner is the proposer and the
      reporter is invited. An exact tie registers no revision (EP-04-016) and relays
      nothing. The relay is part of the case-creation act
      (CLP-07-015): it runs after the creation entries are committed (CM-14-014,
      CM-14-011), in the same transaction, so a failed relay rolls the whole creation
      back and a redelivered proposal creates the case and relays the revision again.
      Nothing is stored for a later run.
    verification: >-
      Tree tests of the case-proposal received tree assert that a tie or a redelivered
      proposal relays no second Invite, that a failed relay leaves nothing of the case,
      and that the inbox's archived redelivery then creates the case and relays the
      Invite once. Node tests assert that an owner who reported to itself has nothing
      relayed or indexed, that a relay with no registration in its act relays nothing,
      that the same creation relays under the same Invite id, and that a failure inside
      the act keeps nothing.
    relationships:
    - rel_type: refines
      spec_id: EP-04-016
    - rel_type: depends_on
      spec_id: EP-09-002
      note: The creation-time revision is relayed by the same rule as any other revision.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-024
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST propose the creation-time revision (EP-04-011) on behalf of
      the party whose terms lost the shortest-wins comparison, with that party in
      `attributedTo`.
    rationale: >-
      The creation-time revision is a revision like any other; the only thing special
      about it is who proposes it, and CM-24 already covers the CASE_MANAGER proposing
      on a participant's behalf. The party whose terms lost is the proposer and is not
      invited (EP-09-002).
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`test_the_owners_losing_default_is_relayed_to_the_reporter`,
      `test_the_reporters_losing_terms_are_relayed_to_the_owner`) assert the relayed
      Invite for both directions has `actor` the CASE_MANAGER and `attributedTo` the
      losing party. Node and service tests (`TestTheRevisionIsConsentedToByItsProposer`)
      assert that the losing party's record, not the executing actor's, gains the
      revision id, and that a contest with no report to name the reporter fails before
      the initialization commit, leaving the case at `EM.NONE` (MSM-07-022).
    relationships:
    - rel_type: part_of
      spec_id: EP-04-011
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-025
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit the creation-time revision (EP-04-011) as a proposal
      entry. The committed relayed Invite is that entry, and the CASE_MANAGER commits no
      separate proposal entry.
    rationale: >-
      No proposal activity exists at creation, so the committed relayed Invite is itself
      the proposal entry. A second entry would record one proposal twice.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`test_the_owners_losing_default_is_relayed_to_the_reporter`,
      `test_the_reporters_losing_terms_are_relayed_to_the_owner`) assert the relayed
      Invite is committed.
    relationships:
    - rel_type: part_of
      spec_id: EP-04-011
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-026
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record the creation-time revision (EP-04-011) in the
      open-proposal record, so that the owner's default selection (EP-08-002) can reach
      it.
    rationale: >-
      A revision registered in the CASE_MANAGER's store alone is unreachable by the
      owner: unindexed, the default selection cannot name it.
    note: >-
      The open-proposal record is written once the Invite is sent, not at registration:
      the case reaches every participant whole in the bootstrap `Create`, and a record
      already naming the Invite would read to the winner as an Invite it had already
      answered.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`test_the_owners_losing_default_is_relayed_to_the_reporter`,
      `test_the_reporters_losing_terms_are_relayed_to_the_owner`) assert the Invite is
      indexed in `pending_embargo_proposal_index` after its commit, with the bootstrap
      `Create` carrying no index entry. A marker test of `InitializeDefaultEmbargoNode`
      asserts that a contested creation registers the loser as an open proposal without
      indexing it, and node tests assert the proposer's replica indexes the replayed
      Invite while the invitee's does not.
    relationships:
    - rel_type: part_of
      spec_id: EP-04-011
    - rel_type: depends_on
      spec_id: EP-08-002
      note: Indexing the revision is what lets the default selection reach it.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-027
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST relay the creation-time revision (EP-04-011) as an
      `Invite(EmbargoEvent)` to the party whose terms won.
    rationale: >-
      A revision registered in the CASE_MANAGER's store alone is invisible to the party
      whose terms won, and with no Invite nobody is asked to answer it.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`test_the_owners_losing_default_is_relayed_to_the_reporter`,
      `test_the_reporters_losing_terms_are_relayed_to_the_owner`) assert the relayed
      `Invite(EmbargoEvent)` is queued to the winning party in both directions.
    relationships:
    - rel_type: part_of
      spec_id: EP-04-011
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_079
  - id: EP-04-012
    priority: MUST
    kind: project
    statement: >-
      Creation-time embargo initialization MUST run at most once per case.
    rationale: >-
      A second initialization stores a fresh `EmbargoEvent` for a case that already has
      its embargo history, which leaves an orphan write and an unanswerable proposal.
    note: >-
      The reuse path is a lost-reply recovery (CP-05-006): "duplicate" here means an exact
      redelivery of the same proposal, not a second report describing the same
      vulnerability, which is a report-management matter (RMB-11-002).
    verification: >-
      `test/core/behaviors/case/nodes/test_embargo_resolution.py` runs
      `InitializeDefaultEmbargoNode` once, terminates the embargo through
      `EmbargoLifecycle`, runs the subtree again and asserts SUCCESS, EM still `EXITED`, no
      `active_embargo`, and no additional `EmbargoEvent` stored. A tree-level test in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` redelivers the same
      `Create(CaseProposal)` after exit and asserts it is answered with the case's embargo
      state and events unchanged.
    relationships:
    - rel_type: depends_on
      spec_id: CP-05-006
      note: The reuse path this rule guards is the duplicate-proposal recovery path.
  - id: EP-04-028
    priority: MUST_NOT
    kind: project
    statement: >-
      This rule covers a `Create(CaseProposal)` that resolves to an existing
      `VulnerabilityCase`. Its receiver MUST NOT run creation-time embargo
      initialization again in any EM state but `NONE`: `PROPOSED`, `ACTIVE`, `REVISE` or
      `EXITED`.
    rationale: >-
      "Initialized" cannot be read from the case's active-embargo reference, because
      termination clears that reference while the EM state stays `EXITED`. A guard keyed
      on the reference reads an exited case as uninitialized and runs the creation arm,
      which stores a fresh `EmbargoEvent` before the EM machine refuses the
      `EXITED → PROPOSED` step it has no transition for. The EM state is the evidence:
      the machine never returns to `NONE` once it has left it.
    note: >-
      In `InitializeDefaultEmbargoNode` the guard arm reads the state through
      `ReadEmStateNode` (the behaviors-layer rule for EM reads) and, like every refusal
      arm ahead of a write, raises rather than returns FAILURE when it cannot answer.
      `ReadEmStateNode` itself reports an unreadable case as FAILURE with the cause in
      `result_out["error"]`, so the arm converts a read that left `em_before` unset into
      a raise; only `em_before == NONE` may return FAILURE, because falling through to
      the creation arm is the right answer there.
    verification: >-
      `test/core/behaviors/case/nodes/test_embargo_resolution.py` covers the guard's
      SUCCESS for every state but `NONE`, an `ACTIVE` or `REVISE` rerun storing no event
      and registering no revision, and an unreadable EM state raising.
    relationships:
    - rel_type: refines
      spec_id: EP-04-012
    - rel_type: depends_on
      spec_id: CP-05-006
      note: The reuse path this rule guards is the duplicate-proposal recovery path.
    - rel_type: depends_on
      spec_id: EMB-18-001
      note: The guard reads EM state; it never writes it.
  - id: EP-04-029
    priority: MUST_NOT
    kind: project
    statement: >-
      The CASE_MANAGER MUST NOT reconcile the embargo terms on a
      `Create(CaseProposal)` that resolves to an existing case against that case.
      Terms that conflict with the case lose to the case.
    rationale: >-
      The embargo belongs to the case, not to the report. Skipping the whole creation
      arm is what leaves the proposal's terms unreconciled: the shortest-wins comparison
      and the pending-revision registration both live inside it.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py`
      (`test_a_second_proposal_for_the_same_report_registers_no_second_revision`)
      confirms a repeated proposal for the same report leaves one active embargo and one
      pending revision.
    relationships:
    - rel_type: derives_from
      spec_id: EP-04-028
  - id: EP-04-030
    priority: MUST
    kind: project
    statement: >-
      For a case still at `EM.NONE`, creation-time embargo initialization MUST proceed.
    rationale: >-
      A case still at `EM.NONE` has never been initialized, because EP-04-002 never
      persists `PROPOSED`, so `NONE` still admits the case the delivery is creating.
    verification: >-
      `test/core/behaviors/case/nodes/test_embargo_resolution.py` confirms a case not
      yet initialized (`EM.NONE`, no embargo) still completes initialization.
    relationships:
    - rel_type: refines
      spec_id: EP-04-002
      note: The never-persisted PROPOSED state is what makes "has left NONE" a clean reading.
- id: EP-05
  title: Revision Activation Consent Rule
  specs:
  - id: EP-05-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule covers the Case Owner's activation of a revised embargo that ends later
      than the embargo it replaces (`REVISE → ACTIVE`). The CASE_MANAGER MUST NOT carry
      any participant's consent over to it.
    rationale: >-
      A participant who signed for terms `T1` has not consented to longer terms `T2`;
      treating them as a signatory once `T2` is in force would imply consent they never
      gave. A participant is bound by the revised embargo only through an `AGREED`
      consent row for it, so each signatory to the replaced embargo that has not agreed
      to the revised one has lapsed (CM-18-001), and no write is needed to lapse them.
      The rule applies at activation rather than at proposal because the participant
      remains bound by `T1` for as long as `T1` is the active embargo (ADR-0093,
      ADR-0122).
    note: >-
      Apart from the Case Owner's own agreement, no activation advances anyone: a
      participant holding an `AGREED` row for the embargo now in force is its signatory
      by lookup.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_answers.py` and
      `test_activation.py` assert that the owner's acceptance of a revision ending later
      than the active embargo writes no row for any signatory and leaves those lacking
      the revised row lapsed and outside the content gate, and that a participant
      already holding an `AGREED` row for the newly active embargo is its signatory with
      no further write.
    relationships:
    - rel_type: implements
      spec_id: CM-18-001
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-05-003
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the Case Owner's activation of a revised embargo that ends no
      later than the one it replaces. The CASE_MANAGER MUST apply `CARRY_OVER` to the
      revised embargo's row of each participant with an `AGREED` row for the replaced
      embargo. That includes a participant whose row for the revision is `DECLINED`
      (CM-10-001, CM-18-003, MSM-07-019).
    rationale: >-
      Shorter terms ask nothing new: agreeing to N days is agreeing to every shorter
      period, the same containment that makes shortest-wins (EP-04-003) safe without
      asking anyone, so their agreement is carried over by writing the row. That holds
      for a participant that declined the shorter revision too: its decline objected to
      losing time, not to keeping the embargo, and the decline stays in the ledger
      (ADR-0122).
    verification: >-
      `test/core/services/embargo_lifecycle/test_activation.py`
      (`test_activate_embargo_replacing_a_longer_one_carries_signatories_over`) and
      `test/core/services/embargo_lifecycle/test_answers.py`
      (`test_owner_activating_a_shorter_revision_carries_every_signatory_over`,
      `test_carry_over_lifts_a_declined_revision_row`) assert that acceptance of a
      revision ending no later than the active embargo applies `CARRY_OVER` to the
      revised row of every signatory to the replaced embargo, a `DECLINED` revision row
      included.
    relationships:
    - rel_type: implements
      spec_id: CM-18-001
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-05-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A revision proposal (`ACTIVE → REVISE`) and any further counter-revision
      (`REVISE → REVISE`) MUST NOT change any participant's consent to the embargo in
      force. The proposer's row for the proposed embargo becomes `AGREED`
      (MSM-07-022). Every other participant gets an `UNINVITED` row for it
      (CM-18-001). Every other row stays as it is until the Case Owner activates a
      revision (EP-05-001, EP-05-003). Until then the prior embargo stays in force,
      and every signatory to it remains one.
    rationale: >-
      A participant cannot lapse until the embargo on the case differs from the one they
      agreed to. Lapsing on proposal would strand signatories when the revision is
      rejected, report participants who are still bound and still receive embargoed
      content as not bound, and lapse the proposer of the revision (ADR-0093). With
      per-embargo rows a proposal only ever adds rows for the proposed embargo.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_proposals.py` assert that
      `propose_embargo()` from `ACTIVE` and from `REVISE` leaves every participant's row
      for the embargo in force unchanged.
    relationships:
    - rel_type: refines
      spec_id: EP-05-001
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2022_014
- id: EP-06
  title: PEC Idempotency
  specs:
  - id: EP-06-001
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      An idempotent retry or re-processing of a participant add-or-update MUST NOT
      remove or downgrade any consent row. That covers each row that has left
      `UNINVITED` for `INVITED`, `AGREED`, `DECLINED` or `TIMED_OUT`.
    rationale: >-
      Dropping an `AGREED` or `DECLINED` row on retry silently
      revokes or erases consent that was already given. The positive-path idempotency
      rule (don't double-add) is covered by CM-13-005; this rule covers the negative
      path (don't downgrade).
    relationships:
    - rel_type: refines
      spec_id: CM-13-005
    - rel_type: implements
      spec_id: CM-18-001
- id: EP-07
  title: Embargo Invite RSVP Window Policy
  description: >-
    Policy requirements for the embargo invite RSVP window: the fallback default
    when no deadline is on the wire, the minimum permitted window, and the
    clamp-on-receipt rule that neutralises coercively short deadlines.
    Codified by ADR-0065. Source: IDEA-2066.
  specs:
  - id: EP-07-001
    priority: MUST
    kind: protocol
    statement: >-
      When an `Invite(EmbargoEvent)` carries no `Invite.end_time`, an implementation
      MUST apply a default RSVP window, measured from the invitation's `published`
      timestamp.
    note: >-
      Under the embargo relay (EP-09, ADR-0113) this fallback is discharged by the
      CASE_MANAGER when it stamps `Invite.end_time` on each relayed Invite (CM-28-012):
      the default window is what it adds to its own `published`. No receiving
      participant applies the fallback on receipt; it derives no deadline and stores none
      (CM-28-024).
    rationale: >-
      An invitation with no deadline would leave the invitee's consent row `INVITED`
      for ever. A default window gives every invitation an end, so silence resolves.
      See ADR-0065.
    verification: >-
      `test/core/behaviors/inbox/test_process_payload.py`
      (`test_no_config_applies_the_protocol_default`) confirms that an invitation
      arriving without `end_time` gets a deadline 7 days after its `published`
      timestamp.
    relationships:
    - rel_type: implements
      spec_id: CM-28-002
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-009
    priority: SHOULD
    kind: protocol
    statement: >-
      The default RSVP window of EP-07-001 SHOULD be 7 days, matching CM-18-002.
    rationale: >-
      Aligning the fallback with the CM-18-023 policy window means an invitation that
      omits `end_time` gets the same answer window as the policy grants. See ADR-0065.
    verification: >-
      `test/core/behaviors/inbox/test_process_payload.py`
      (`test_no_config_applies_the_protocol_default`) confirms that an invitation
      arriving without `end_time` gets a deadline 7 days after its `published`
      timestamp.
    relationships:
    - rel_type: extends
      spec_id: EP-07-001
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST make the default RSVP window of EP-07-001, which is the policy
      window of CM-18-023, configurable per actor.
    rationale: >-
      How this codebase lets a deployment choose the window; split from EP-07-001 and
      CM-18-023 so they state only the window and its default that other participants
      observe (MS-12-010). Whether the value can be changed is an operating choice of
      one implementation.
    verification: >-
      `test/core/behaviors/inbox/test_process_payload.py`
      (`test_configured_default_window_applies`) and
      `test/core/behaviors/embargo/test_rsvp_stamp.py`
      (`test_the_configured_window_and_floor_are_used`) confirm that a configured window
      replaces the 7-day default.
    relationships:
    - rel_type: implements
      spec_id: EP-07-001
    - rel_type: implements
      spec_id: CM-18-023
  - id: EP-07-002
    priority: MUST
    kind: protocol
    statement: >-
      An inviting actor MUST set each `Invite(EmbargoEvent)`'s `Invite.end_time` at
      least the minimum RSVP window after the invitation's `published` timestamp. The
      minimum is the lesser of a fixed window and **the time remaining in the
      embargo**.
    rationale: >-
      An unbounded-downward deadline weaponises the mechanism: a one-minute RSVP
      window formally invites a participant while guaranteeing they cannot
      answer, excluding them with the appearance of due process. See ADR-0065.
    note: >-
      The "whichever is shorter" clause was added by ADR-0096, because the absolute
      72-hour floor can exceed the embargo it concerns: EP-04-007 permits a 12-hour
      agreed embargo, and EP-04-005's protocol default floor is 72 hours exactly. The
      floor exists to prevent an *unreasonably* short deadline, and a deadline equal to
      the whole embargo is not unreasonable. Without this clause the floor would
      contradict EP-07-006.
    verification: >-
      A unit test confirms that the outbound invite builder raises a validation error
      when the supplied `end_time` is less than `published` plus the minimum window, and
      that for an embargo whose remaining duration is shorter than that window the
      remaining duration is used as the minimum instead.
    relationships:
    - rel_type: refines
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-010
    priority: SHOULD
    kind: protocol
    statement: >-
      The fixed window of the minimum RSVP window (EP-07-002) SHOULD be 72 hours.
    rationale: >-
      Seventy-two hours gives an invitee a realistic chance to answer across time zones
      and weekends, and it equals the floor of the protocol default embargo (EP-04-018).
      See ADR-0065.
    verification: >-
      `test/core/behaviors/embargo/test_rsvp_stamp.py`
      (`test_the_default_window_is_seven_days_from_published`) confirms the unconfigured
      minimum RSVP window is 72 hours.
    relationships:
    - rel_type: extends
      spec_id: EP-07-002
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-008
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST make the minimum RSVP window of EP-07-002 configurable per
      actor.
    rationale: >-
      How this codebase lets a deployment choose the minimum window; split from
      EP-07-002 so it states only the minimum and its default that other participants
      observe (MS-12-010). Whether the value can be changed is an operating choice of
      one implementation.
    verification: >-
      `test/core/behaviors/embargo/test_rsvp_stamp.py`
      (`test_the_configured_window_and_floor_are_used`) confirms a configured minimum
      takes effect.
    relationships:
    - rel_type: implements
      spec_id: EP-07-002
  - id: EP-07-012
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST apply an actor's configured minimum RSVP window in both
      directions. It applies to the Invites the actor sends (EP-07-002) and to the clamp
      on those it receives (EP-07-003).
    rationale: >-
      One configured value for both directions keeps an actor from demanding of others a
      window it does not grant to itself.
    verification: >-
      `test/core/behaviors/embargo/test_rsvp_stamp.py`
      (`test_the_configured_window_and_floor_are_used`) confirms the configured minimum
      is used on an outbound Invite, and
      `test/core/behaviors/inbox/test_process_payload.py`
      (`test_configured_minimum_window_applies`) confirms it is used to clamp an inbound
      one.
    relationships:
    - rel_type: extends
      spec_id: EP-07-008
  - id: EP-07-003
    priority: MUST
    kind: protocol
    statement: >-
      When a receiving actor receives an `Invite(EmbargoEvent)` whose
      `Invite.end_time` is earlier than the applicable minimum window, it MUST
      clamp the effective deadline up to that minimum. The applicable minimum is
      the one computed by EP-07-002, so the clamp never raises the deadline past
      the embargo's own end.
    note: >-
      Both parties must reach the same effective deadline for CM-28-002 to hold.
      Because the floor is a configured value, a receiver whose floor differs
      from the sender's can compute a different effective deadline. Deployments
      that require strict bilateral agreement SHOULD align their floor
      configuration; the clamp guarantees safety, not identical arithmetic.

      The clamp is bidirectional in effect but not in mechanism: this requirement
      raises a sub-minimum deadline, and EP-07-006 lowers one that overshoots the
      embargo. Where both would apply — a remaining embargo shorter than the
      configured window — EP-07-002 has already reduced the minimum to the
      remaining embargo, so the two agree rather than fight.

      Under the embargo relay (EP-09, ADR-0113) the "receiving actor" this clause binds
      is the CASE_MANAGER at the point it stamps the relayed Invite (CM-28-012): it
      computes the applicable minimum and clamps before emission, so every replica reads
      one deadline off one object. A participant that receives a relayed Invite stores it
      and neither derives nor clamps a deadline (CM-28-013).
    rationale: >-
      Clamping makes a coercive deadline ineffective rather than fatal.
      Rejecting the invitation outright would hand the sender exactly what a
      hostile sender wants — an invite that never takes effect — and would
      punish the invitee for the inviter's misbehaviour. See ADR-0065.
    verification: >-
      A unit test confirms that the invite receiver replaces a sub-minimum `end_time`
      with `published + minimum_window` rather than using the on-wire value, and that
      the substituted value never exceeds the embargo's `end_time`.
    relationships:
    - rel_type: refines
      spec_id: EP-07-002
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An RSVP deadline MUST NOT fall after the end of the embargo it concerns.
    rationale: >-
      An invitee must be able to answer while the embargo still exists. A deadline past
      the embargo's end asks the invitee to consent to an embargo that is already over,
      and records its silence as an expiry after the answer stopped mattering. See
      ADR-0096.
    note: >-
      The failure is concrete. Invite a participant to a 24-hour embargo with no explicit
      `Invite.end_time` and the CM-18-023 policy window applies: 7 days. The pocket veto
      fires on day 7; the embargo ended at hour 24. The participant is asked to consent to
      an embargo that is already over, and their inaction is recorded as an expiry six days
      after it stopped mattering.

      This is independent of the protocol default of EP-04-005 — the same thing happens on
      day 28 of a 30-day embargo with a published actor default, which is reachable today.
    verification: >-
      `test/core/behaviors/embargo/test_rsvp_stamp.py`
      (`test_the_deadline_never_passes_the_embargo_end`) and
      `test/core/models/test_rsvp_deadline.py` (`test_clamp_up_and_clamp_down_agree`)
      confirm that no RSVP deadline falls after the embargo's `end_time`, including when
      the remaining embargo is shorter than the configured minimum window.
    relationships:
    - rel_type: constrains
      spec_id: CM-18-023
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-011
    priority: MUST
    kind: protocol
    statement: >-
      When a computed RSVP deadline would fall after the embargo's `end_time`, the actor
      that computes it MUST clamp it down to that `end_time`. This holds for a deadline
      from an explicit `Invite.end_time` and from the CM-18-002 policy window alike.
    rationale: >-
      Clamping is how a deadline is kept within the embargo (EP-07-006) without refusing
      the invitation: the invitee can still answer while the embargo exists.
    verification: >-
      `test/core/models/test_rsvp_deadline.py`
      (`test_day_28_of_30_day_embargo_policy_window_is_the_end`,
      `test_explicit_request_past_end_is_lowered`) confirms that an RSVP deadline
      computed beyond the embargo's `end_time` is clamped down to it, for both the
      policy-window and explicit-`end_time` paths.
    relationships:
    - rel_type: implements
      spec_id: EP-07-006
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: EP-07-004
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A receiving actor MUST NOT reject an `Invite(EmbargoEvent)` as malformed
      solely on the basis of a sub-minimum deadline.
    rationale: >-
      Rejecting the invitation would hand a hostile sender exactly what they want —
      an invite that never takes effect — and punishes the invitee for the inviter's
      misbehaviour.
    relationships:
    - rel_type: refines
      spec_id: EP-07-003
    adr:
    - ADR-0065
  - id: EP-07-005
    priority: MUST
    kind: project
    statement: >-
      A receiving actor MUST log every deadline clamp it applies to an
      `Invite(EmbargoEvent)` deadline — both the EP-07-003 clamp up to the
      applicable minimum window and the EP-07-006 clamp down to the embargo's
      `end_time`.
    rationale: >-
      Logging the clamp makes the adjustment observable for auditing and
      debugging without rejecting the invitation.
    note: >-
      Amended by ADR-0096. This requirement previously named only the up-clamp, and only
      "the configured minimum window". The applicable minimum is now derived (EP-07-002:
      the lesser of the configured window and the time remaining in the embargo), and a
      second clamp direction exists. Both are adjustments a reader of the log needs to see.

      Under the embargo relay (EP-09, ADR-0113) the clamps are applied — and therefore
      logged — by the CASE_MANAGER when it stamps the relayed Invite (CM-28-012); a
      participant receiver applies none (CM-28-013).
    verification: >-
      A unit test confirms that clamping a sub-minimum deadline emits a log entry at
      the appropriate level recording both the original and the effective deadline
      values, and that clamping a deadline down to the embargo's `end_time` emits the
      same record.
    relationships:
    - rel_type: refines
      spec_id: EP-07-003
    - rel_type: refines
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_074
- id: EP-08
  title: Open Proposal Resolution Order
  description: >-
    How a Participant resolves two or more simultaneously open embargo proposals:
    earliest expiration first, with the remainder handled as revisions. Codified by
    ADR-0100, which also records why there is no multi-candidate poll activity. The
    heuristic itself predates this group as normative prose in
    `docs/topics/process_models/em/defaults.md`; stating it here is what makes it
    testable. Source: CONCERN-3433.
  specs:
  - id: EP-08-001
    priority: SHOULD
    kind: protocol
    statement: >-
      This rule covers a case with two or more open embargo proposals and none accepted.
      A Participant SHOULD accept the proposal whose embargo `end_time` is earliest, and
      propose the remainder as revisions.
    rationale: >-
      Two parties proposing 30 and 60 days agree on days 1–30 and disagree only
      beyond that, so accepting the shorter proposal captures all mutual agreement
      immediately and leaves the contested remainder to negotiate as a revision. This
      is the *Shortest Embargo Proposed Wins* heuristic stated in
      `docs/topics/process_models/em/defaults.md`, derived in
      `docs/topics/process_models/em/formal_model.md`, and applied to case growth in
      `docs/topics/process_models/em/working_with_others.md`.
    note: >-
      This requirement restates guidance that was already normative in
      `docs/topics/process_models/em/defaults.md` but existed nowhere in `specs/`.
      Because `spec-dump` is the corpus agents read, the rule was invisible to
      implementation and the code diverged from it — `find_embargo_proposal_id`
      selected by arrival order until #3470. Recording it here is the correction; the
      shared comparator is `earliest_ending` in `vultron/core/services/embargo_ordering.py`,
      which EP-04-003's case-creation merge also uses.
    verification: >-
      A unit test asserts that, given three open proposals with distinct embargo
      `end_time` values, the proposal selected for acceptance is the earliest-expiring
      one.
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-005
    priority: SHOULD
    kind: protocol
    statement: >-
      This rule covers two or more revisions open against an active embargo. A
      Participant SHOULD accept or reject them one at a time, in earliest-to-latest
      `end_time` order.
    rationale: >-
      Taking revisions shortest first applies the *Shortest Embargo Proposed Wins*
      heuristic (EP-08-001) to revisions: each accepted revision captures the agreement
      the longer ones also contain.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_proposal_resolution_order.py`
      (`test_default_selection_takes_open_revisions_earliest_expiring_first`)
      confirms that, with an embargo in force, an accept naming no revision takes the
      earliest-expiring open revision.
    relationships:
    - rel_type: extends
      spec_id: EP-08-001
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-002
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a selection among two or more open embargo proposals where the
      caller supplied no proposal identifier. The implementation MUST select the
      earliest-expiring open proposal, never the first by insertion or arrival order.
    rationale: >-
      A counter-proposal is emitted while the EM state remains PROPOSED (EMB-15-003),
      so arrival order places the superseded terms first. Selecting by arrival
      therefore accepts the terms the counter-proposal was sent to replace, which
      inverts EP-08-001 in exactly the situation that makes a default selection
      necessary.
    note: >-
      The default-selection path is the one that carries the risk. An explicit
      proposal identifier is unambiguous; the ambiguity only arises when the caller
      does not name one, and that is where the ordering rule must be enforced.
    verification: >-
      A unit test asserts that an accept request omitting the proposal identifier
      resolves to the earliest-expiring open proposal, including the case where a
      later-arriving counter-proposal expires sooner than the original.
    relationships:
    - rel_type: refines
      spec_id: EP-08-001
    adr:
    - ADR-0100
    stories:
    - story_2022_014
  - id: EP-08-003
    priority: MUST
    kind: project
    statement: >-
      An implementation that records open embargo proposals MUST take a proposal out of
      that record when it is decided. A proposal is decided when it is accepted or
      rejected, or when its embargo terminates.
    rationale: >-
      EP-08-002 orders the set of open proposals, so a set that retains decided
      proposals can select one that is no longer open. Ordering an unpruned record is
      not a weaker guarantee than ordering a pruned one — it is a different and wrong
      answer, which is why the retention rule is stated alongside the ordering rule
      rather than left as hygiene.
    note: >-
      The open proposals are the embargo register's `PROPOSED` entries (ADR-0122):
      `VulnerabilityCase.proposed_embargo_ids` is a view of the register, so a decided
      proposal leaves it by changing status (`ACTIVE`, `REJECTED`, `CANCELLED`), and the
      entry itself stays in the register as history. The relay record
      `pending_embargo_proposal_index` is pruned in the same register step
      (`VulnerabilityCase.apply_embargo_register_step`), so the two cannot disagree.
      Before #3470 neither record was fully pruned, and a rejected proposal stayed in
      both. A participant's Reject (consent, not a decision) changes no entry. This
      requirement covers every record of open proposals on every replica.
      The record is not a way to answer the embargo in force: that goes through the
      Invite the participant received (EP-09-012).
    verification: >-
      A unit test asserts that accepting a proposal, rejecting a proposal, and
      tearing down an embargo each leave no corresponding entry in the open-proposal
      record; `test/core/models/test_embargo_register.py` asserts the relay record
      leaves with the proposal.
    relationships:
    - rel_type: constrains
      spec_id: EP-08-002
    adr:
    - ADR-0100
    - ADR-0122
    stories:
    - story_2022_014
  - id: EP-08-004
    priority: MUST
    kind: protocol
    statement: >-
      When an embargo terminates (EM `ACTIVE` or `REVISE` → `EXITED`), the implementation MUST
      close every open proposal, cancelling it in the same embargo register step that
      terminates the embargo (ADR-0122), not only the entry for the terminated embargo
      itself. Every proposal open while EM is `ACTIVE` or `REVISE` is
      a revision of the active embargo, and a revision of an embargo that no longer exists
      cannot be accepted.
    rationale: >-
      A case has at most one active embargo (VP-04-002), so while EM is `ACTIVE` or `REVISE`
      every open proposal is by construction a revision of that embargo; no field linking a
      revision to the embargo it revises is needed to know which proposals a termination
      decides. EP-08-003's text reaches the terminated embargo; this entry reaches the
      proposals about it.
    note: >-
      Before this rule termination pruned the terminated embargo's own id and left its open
      revisions open, where a later default selection could pick a revision of a dead
      embargo as the earliest-expiring candidate (#3836). The register now enforces it: a
      step that leaves an entry `TERMINATED` while another is `PROPOSED` is refused
      (ADR-0122), so the `TERMINATE` step applies `TERMINATE` and the `CANCEL` of every
      proposal as one step. The `Remove(EmbargoEvent)` entry carries that whole step,
      and the CASE_MANAGER and every replica apply it through the one apply function,
      `apply_embargo_change()` (ADR-0124, #4714), so no cancel has an entry of its own.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/test_activation.py` assert that
      terminating an embargo while revisions of it are pending leaves no open proposal and an
      empty `pending_embargo_proposal_index`, in `STRICT` and in
      `OBSERVED` mode; `test/core/behaviors/embargo/nodes/test_teardown.py` asserts the same
      through `ClearActiveEmbargoNode` and the replica slot `ApplyEmbargoTeardownNode`,
      `test/core/use_cases/triggers/embargo/test_terminate.py` through the terminate
      trigger, and `test/core/use_cases/received/test_embargo_termination_copy.py` that
      the `Remove` is the only entry and a replica's register matches the
      CASE_MANAGER's.
    relationships:
    - rel_type: refines
      spec_id: EP-08-003
    - rel_type: depends_on
      spec_id: VP-04-002
      note: One active embargo at a time is what makes every open proposal a revision of it.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
- id: EP-09
  title: Embargo Negotiation Relays Through the CASE_MANAGER
  description: >-
    How an embargo proposal — the first one for a case or a revision of the active
    embargo — reaches every participant and every replica in the CASE_MANAGER topology.
    The behavioural specs (EMB-01 through EMB-06) are written in the voice of the formal
    protocol, in which every Participant is a peer and every Participant "receives EP" or
    "receives EV". Here a participant addresses its proposal to the CASE_MANAGER alone
    (PCR-08-001), so the Participant receiving EP or EV is the CASE_MANAGER on receipt, and
    every other participant learns the resulting case state from the ledger. The protocol
    interactions the behavioural specs define still happen: the CASE_MANAGER relays the
    proposal to the participants as an Invite, they answer the CASE_MANAGER, and the owner's
    answer decides. Each step is recorded in the ledger. Ledger entries carry case state to
    replicas and set no parse-and-respond expectation; they augment the negotiation as the
    record of the case, they do not replace it. Decided by ADR-0113 from Concerns #3892,
    #3836 and #3863 for revisions; generalised to every proposal, with the acknowledgement,
    RSVP-deadline, trigger-side write and invitee rules below, by its 2026-09-30 amendment
    from Concern #3918.
  specs:
  - id: EP-09-001
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the CASE_MANAGER's receipt of an `Invite(EmbargoEvent)` for a
      case whose CS state is not yet public, exploit or attack. The CASE_MANAGER MUST
      move the canonical case's EM state and commit the proposal as a ledger entry. The
      move is EM `NONE → PROPOSED` for the first proposal and `ACTIVE → REVISE` for a
      revision.
    rationale: >-
      If the CASE_MANAGER does not move the canonical case on receipt, its record never
      shows that a revision is under negotiation when a non-owner proposes one, and
      everything keyed on `EM.REVISE` runs only in the proposer's store. The
      CASE_MANAGER is the sole writer of canonical case state (ADR-0108); if it does not
      move the case, no replica can.
    note: >-
      This group of rules is how EMB-01-001, EMB-01-003, EMB-03-001 and EMB-03-002 are
      realised in the CASE_MANAGER topology: the CASE_MANAGER on receipt, every other
      participant through ledger replay (EP-09-007). The write sits behind the
      CASE_MANAGER role gate (BT-17-001, RSH-08-003). A non-manager that receives a
      peer's proposal directly stores it and writes nothing; that delivery is a
      misrouting under PCR-08-001, not a protocol case, and no parse-and-respond
      handling is built for it.
    verification: >-
      `test/core/use_cases/received/test_embargo_revision_relay.py`
      (`test_case_manager_moves_canonical_case_to_revise`,
      `test_case_manager_moves_first_proposal_to_proposed`) runs the received Invite
      path as the CASE_MANAGER with the case at `EM.ACTIVE` and asserts the persisted
      case is at `EM.REVISE`, and with the case at `EM.NONE` and asserts `EM.PROPOSED`.
    relationships:
    - rel_type: implements
      spec_id: EMB-01-001
    - rel_type: implements
      spec_id: EMB-03-001
    - rel_type: depends_on
      spec_id: EMB-18-001
      note: The EM write goes through EmbargoLifecycle, never a direct assignment.
    - rel_type: depends_on
      spec_id: RSH-08-003
    adr:
    - ADR-0113
    - ADR-0108
    stories:
    - story_2022_014
  - id: EP-09-020
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the CASE_MANAGER's receipt of a counter-proposal
      `Invite(EmbargoEvent)` for a case already at EM `PROPOSED` or `REVISE`. The
      CASE_MANAGER MUST commit the proposal with no further EM transition.
    rationale: >-
      A counter-proposal adds terms to a negotiation already open, so the EM state that
      says a negotiation is open already holds. Committing it still puts the proposal on
      the ledger, where every replica learns of it.
    verification: >-
      `test/core/use_cases/received/test_embargo_revision_relay.py`
      (`test_counter_proposal_at_proposed_commits_without_a_transition`,
      `test_counter_revision_at_revise_commits_without_a_transition`) confirm the
      counter-proposal is committed and EM stays `PROPOSED` or `REVISE`.
    relationships:
    - rel_type: implements
      spec_id: EMB-01-003
    - rel_type: implements
      spec_id: EMB-03-002
    - rel_type: depends_on
      spec_id: RSH-08-003
    adr:
    - ADR-0113
    - ADR-0108
    stories:
    - story_2022_014
  - id: EP-09-021
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives an `Invite(EmbargoEvent)` for a case whose CS state
      is public, exploit or attack, it MUST refuse the proposal (EMB-01-002,
      EMB-03-003).
    rationale: >-
      An embargo on a vulnerability that is already public, exploited or attacked
      protects nothing (VP-06-001), so the CASE_MANAGER does not open a negotiation for
      one.
    verification: >-
      `test/core/use_cases/received/test_embargo_revision_relay.py`
      (`test_a_revision_of_a_public_case_is_refused_with_a_reject`) confirms that with
      P, X or A set the CASE_MANAGER refuses the revision and the case stays `ACTIVE`.
    relationships:
    - rel_type: implements
      spec_id: EMB-01-002
    - rel_type: implements
      spec_id: EMB-03-003
    - rel_type: implements
      spec_id: EMB-03-004
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-002
    priority: MUST
    kind: protocol
    statement: >-
      After committing a revision proposal, the CASE_MANAGER MUST emit an
      `Invite(EmbargoEvent)` for the revision to each case participant whose RM state is
      not `RM.CLOSED`. The proposer and the executing CASE_MANAGER itself get none. Each
      Invite has `actor` set to the CASE_MANAGER's ID and `attributedTo` set to the
      proposer's ID (CM-24-001, CM-24-002).
    rationale: >-
      Participants answer only an Invite addressed to them (EP-09-003), so without the
      relay nobody but the proposer would be asked. Proposing terms is consenting to
      them (ADR-0093), so the proposer is not invited. The CASE_MANAGER is the Case
      Owner's delegate that routes communications and manages ledger entries, with no
      view of its own on the embargo, and a container never mails an actor it hosts
      (ADR-0109).
    note: >-
      Excluding the proposer costs one filter: the proposer's identity is on the
      activity just adjudicated. The emit runs on the container that hosts the
      CASE_MANAGER and is committed in the emitting tree (CM-24-004, ADR-0109). Every
      other participant on the case whose RM state is not `RM.CLOSED` is a recipient,
      whatever its consent state and whether or not it has joined: an embargo Invite is
      not case content and reaches an inert participant (CM-10-009). A participant not
      yet bound is invited into the revised terms, a signatory is asked whether it
      accepts them (EP-09-004). Instead of an Invite, the proposer and a CASE_MANAGER
      with a stake of its own get consent rows at the commit (EP-09-023, EP-09-024).
    verification: >-
      `test/core/behaviors/embargo/nodes/test_relay.py::TestCollectEmbargoInviteRecipientsNode::test_excludes_the_proposer_and_the_manager_itself`
      and
      `test/core/use_cases/received/test_embargo_revision_relay.py::test_case_manager_invites_every_participant_except_the_proposer`
      run the relay as the CASE_MANAGER and assert one Invite per participant other than
      the proposer and the manager, each with `actor` the CASE_MANAGER and
      `attributedTo` the proposer.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    - rel_type: refines
      spec_id: CM-24-002
    - rel_type: depends_on
      spec_id: PCR-08-007
      note: The same relay shape as the case Invite.
    adr:
    - ADR-0113
    - ADR-0114
    - ADR-0119
    stories:
    - story_2022_014
  - id: EP-09-022
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit each Invite emission of EP-09-002 as a ledger entry
      once the Invite is in the outbox (SYNC-09-002).
    rationale: >-
      The committed emission is how every replica learns who was asked, and committing
      only after the outbox write keeps the ledger from recording an Invite that was
      never sent.
    verification: >-
      `test/core/behaviors/embargo/nodes/test_relay.py`
      (`TestRelayEmbargoInviteToEachNode::test_each_emission_is_committed_as_a_canonical_entry`)
      asserts each emission is committed,
      `test_each_invite_is_queued_before_it_is_committed` in the same file that it is
      queued first, and
      `test/core/use_cases/received/test_embargo_revision_relay.py::test_a_received_proposal_whose_relay_commit_fails_keeps_no_consequence`
      that a failed Invite commit keeps no Invite, row or entry of the act (CLP-07-015).
    relationships:
    - rel_type: extends
      spec_id: EP-09-002
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-023
    priority: MUST
    kind: protocol
    statement: >-
      At the commit of a revision proposal, the CASE_MANAGER MUST write the proposer's
      consent row for the proposed embargo as `AGREED`.
    rationale: >-
      Proposing terms is consenting to them (ADR-0093), so the proposer is not invited,
      and its row records that consent instead.
    verification: >-
      `test/core/use_cases/received/test_embargo_manager_consent.py`
      (`test_committing_a_proposal_records_the_proposers_row_agreed`) asserts the
      proposer's row is `AGREED` after the commit.
    relationships:
    - rel_type: extends
      spec_id: EP-09-002
    adr:
    - ADR-0093
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-024
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers an actor that holds the CASE_MANAGER role but not `CASE_OWNER`.
      It also has an embargo stake of its own, through a role beyond `CASE_MANAGER` and
      `COORDINATOR`. At the commit of a revision proposal, the CASE_MANAGER MUST write
      that actor's own row for the proposed embargo. The row is `AGREED` when the actor
      is the proposer. Otherwise the actor's own embargo-proposal policy decides
      `AGREED` or `DECLINED` (EMB-15-001).
    rationale: >-
      The CASE_MANAGER relays the Invite and never mails an actor it hosts (ADR-0109),
      so a stakeholder that holds the role would never be asked.
    note: >-
      The CASE_MANAGER role alone carries no embargo stake: no consent is solicited or
      recorded for a bare container. When the actor holding the role also holds
      `CASE_OWNER`, that actor's consent is its decision as owner (EP-09-005), not
      written at the commit.
    verification: >-
      `test/core/use_cases/received/test_embargo_manager_consent.py`
      (`test_a_stakeholder_manager_records_its_own_row_with_no_invite`,
      `test_a_manager_that_is_the_proposer_is_recorded_agreed`,
      `test_a_bare_container_manager_records_nothing`) asserts that a stakeholder
      manager (and a manager that is the proposer) holds an `AGREED` row with no Invite
      addressed to it, and that a bare container writes none; and
      `test/core/behaviors/embargo/nodes/test_manager_consent.py` pins the policy
      call-out (`AGREED` or `DECLINED`) and the owner, proposer and existing-row skips.
    relationships:
    - rel_type: extends
      spec_id: EP-09-002
    adr:
    - ADR-0113
    - ADR-0119
    stories:
    - story_2022_014
  - id: EP-09-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant that receives an `Invite(EmbargoEvent)` MUST NOT write case EM state or
      any participant's consent state on receipt. It stores the Invite and answers it
      with `Accept` or `Reject` addressed to the CASE_MANAGER through its response
      decision (EMB-15).
    rationale: >-
      Only the CASE_MANAGER turns an announcement into case state and every other
      participant takes case state from the ledger (ADR-0108, RSH-08-003). Consent is
      recorded when the CASE_MANAGER commits the answer, and the replica learns it from
      the ledger.
    note: >-
      The current receive tree moves the invitee's consent to `INVITED` at every inbox. Under
      this rule that write moves to the CASE_MANAGER's commit of the Invite emission
      (EP-09-002) and reaches the replica through replay (EP-09-007). The participant-side
      tree keeps the store-and-answer path only.
    verification: >-
      A test runs the received Invite path as a non-manager participant and asserts the
      case EM state and every participant's consent state are unchanged afterwards. Until the
      implementation lands the test is a strict `xfail` naming its tracking issue.
    relationships:
    - rel_type: refines
      spec_id: RSH-08-003
    - rel_type: depends_on
      spec_id: PCR-08-003
      note: The fan-out is the only mechanism by which participants learn accepted state.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-025
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant MUST NOT treat an `Announce(CaseLedgerEntry)` that carries a
      proposal or an Invite as an invitation to answer. A participant answers only an
      Invite addressed to it.
    rationale: >-
      The ledger is a channel for case state, not a protocol interaction. Giving an
      entry parse-and-respond semantics would let every future entry type become an
      implicit request, and would fork the negotiation into two paths, one over Invites
      and one over entries. The interactions the behavioural specs define are the ones
      that happen; the ledger records them.
    verification: >-
      `test/core/use_cases/received/test_embargo_relay_replay.py`
      (`test_a_replica_follows_a_revision_from_proposal_to_activation`) replays a
      revision proposal's entries to a bystander and asserts it queues nothing to the
      CASE_MANAGER.
    relationships:
    - rel_type: depends_on
      spec_id: PCR-08-003
      note: >-
        The fan-out is the only mechanism by which participants learn accepted
        state.
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A revision `Invite(EmbargoEvent)` MUST NOT change the consent of a participant that is
      already a signatory to the active embargo. The PEC `INVITE` trigger is applied to the
      participant's row for the *revision* (CM-18-003), so a signatory's row for the revision
      moves from `UNINVITED` to `INVITED` and it keeps its `AGREED` row for the active
      embargo; its answer to the
      revision is recorded on the revision's row and binds it to nothing new until the owner
      activates the revision (EP-05-001, EP-05-002).
    rationale: >-
      A signatory is bound by the active embargo for as long as it is active; a proposal
      to revise it asks nothing of them yet (ADR-0093). Because consent is per embargo
      (ADR-0122) the Invite lands on its own row and cannot touch the row that binds the
      signatory, so a receive tree that applies `INVITE` for every recipient does not
      fault on exactly the participants a revision most concerns.
    verification: >-
      A test delivers a revision Invite for a participant already a signatory and asserts the
      receive tree succeeds, the participant has an `INVITED` row for the revision, and its
      row for the active embargo is still `AGREED`; a second asserts the consent write
      alone keeps the `AGREED` row for the active embargo and adds the revision's
      `INVITED` row.
    relationships:
    - rel_type: refines
      spec_id: EP-05-002
    - rel_type: depends_on
      spec_id: CM-18-003
    adr:
    - ADR-0113
    - ADR-0093
    - ADR-0122
  - id: EP-09-005
    priority: MAY
    kind: protocol
    statement: >-
      The Case Owner MAY accept or reject an open revision at any time, without waiting for
      any other participant to answer the revision Invite. The owner's
      `Accept(EmbargoEvent)[target=VulnerabilityCase]` activates the revision and the owner's
      `Reject(EmbargoEvent)[target=VulnerabilityCase]` keeps the prior terms
      (MSM-07-008, MSM-07-009);
      either is committed as a ledger entry and decides the embargo. The owner's `Accept` or
      `Reject` of the revision Invite is only its own consent (MSM-07-003, MSM-07-004).
    rationale: >-
      Only the Case Owner's answer changes the embargo on the case; the other participants'
      answers inform that decision, they do not make it (ADR-0093). The Invites are not a
      vote: they gather the consent records the activation cascade reads (EP-05-001). The
      owner's decision settles the embargo; the answers settle who is bound by it.
    note: >-
      This is why the Invites are sent even though the owner may act by fiat. When the owner
      activates longer terms, every signatory that accepted them stays bound and every
      signatory that did not lapses (EP-05-001); the answers are what that cascade reads.

      Auto-accept is never required: the protocol imposes no automatic answer to a revision
      Invite (EP-09-006). The prototype keeps one bounded auto-accept, an implementation
      choice and not a protocol rule: the owner accepts on its own only while EM is `NONE` and
      the proposal ends no later than the owner's own policy duration from now, and never
      while an embargo is `ACTIVE` or `REVISE` (#4179).
    verification: >-
      A unit test in `test/core/services/embargo_lifecycle/` asserts the owner's activation of
      a revision from `REVISE` activates it with no other participant having answered.
    adr:
    - ADR-0113
    - ADR-0122
    stories:
    - story_2022_014
  - id: EP-09-006
    priority: SHOULD
    kind: protocol
    statement: >-
      The Case Owner SHOULD wait for at least some participants to answer a revision Invite
      before accepting or rejecting the revision, so as to gauge consensus (VP-08-003). The
      protocol defines no quorum, no vote and no waiting period; which answers, how many and
      how long are actor policy.
    rationale: >-
      Consensus on embargo terms is the protocol's stated norm (VP-08-003), and "quorum" is
      deliberately undefined so that different CVD communities can adopt different decision
      rules (VP-09-007). A fixed threshold here would take that room away. Leaving it to actor
      policy makes the waiting decision a natural call-out point rather than a rule.
    note: >-
      The MAY in EP-09-005 and the SHOULD here are one position, not a contradiction: the
      owner is never blocked, and is advised to listen first. An implementation that wants to
      wait puts the policy at the owner's accept or reject call-out; the protocol imposes
      nothing. The default answer to a revision Invite is no answer, so a creation-time
      revision (EP-04-011) leaves the shorter terms active until the owner acts; the
      prototype's bounded auto-accept is described at EP-09-005.
    verification: >-
      Not machine-checkable as a protocol obligation: the protocol imposes no waiting rule.
      The EP-09-005 test pins that nothing blocks the owner; inspection of the owner-side
      accept and reject call-out confirms that a waiting policy has a place to live.
    relationships:
    - rel_type: refines
      spec_id: VP-08-003
    - rel_type: depends_on
      spec_id: VP-09-007
      note: >-
        VP-09-007's rationale is where the protocol leaves "quorum" undefined; it stays
        undefined here too.
    adr:
    - ADR-0113
    stories:
    - story_2022_046
    - story_2022_078
    - story_2022_079
  - id: EP-09-007
    priority: MUST
    kind: architecture
    statement: >-
      Every ledger semantic type the revision relay commits MUST have a replica apply
      node reachable from `create_announce_log_entry_tree` (RSH-08-004). The node
      applies what the entry carries by copying it through the one apply function
      (ADR-0124, CM-23-016).
    rationale: >-
      Replicas take state from the ledger, so a semantic type with no replay node is a
      state change no replica can see (ADR-0108). A relay entry with no replay node is
      stored and ignored, and a replica's EM then stays `ACTIVE` through a whole
      revision cycle. Covering every semantic type of the relay is what makes the
      participant-side embargo trees gateable with no further work.
    note: >-
      The relay's semantic types are the proposal, each Invite emission, each
      participant's consent answer, each consent row the CASE_MANAGER changes, and the
      owner's decision. The proposal's entry is its `PROPOSE` register step, an answer's
      entry carries the row the answer states (ADR-0122), and every other consent row
      the proposal or a relayed Invite changes is the CASE_MANAGER's own `Create` or
      `Update(EmbargoConsent)` entry that follows it. The owner's decision and expiry
      slots copy their entry's register step or row too, and the consent rows those acts
      change arrive as their own entries. The owner's Reject the CASE_MANAGER answers
      with ET (EMB-04-002) is copied like any other: its entry carries the REJECT step
      and the CASE_MANAGER's termination entry that follows carries the TERMINATE step
      (MSM-07-032), so the replica decides nothing. A withdrawal's `Leave(EmbargoEvent)`
      (EP-09-013) carries no row: each row it declines is the CASE_MANAGER's own
      `Update(EmbargoConsent)` entry, which the consent slot copies. The replay node for
      a transition lands before the received-side effect that wrote it directly is gated
      (RSH-08-004).
    verification: >-
      The RSH-08-004 ratchet lists every committed embargo semantic type as having a
      replay node or a declared exemption; integration tests with per-actor stores assert a
      replica converges to `REVISE` and back to `ACTIVE` on the fan-out alone, and
      `test/core/use_cases/received/test_embargo_proposal_answer_copy.py` asserts a replica's
      register and rows equal the CASE_MANAGER's after a proposal, each answer, the
      CASE_MANAGER's policy consent and a withdrawal (the withdrawer's own replica
      included), and
      `test/architecture/test_embargo_replica_slots_copy.py` asserts the copying slots
      run no lifecycle logic.
    relationships:
    - rel_type: refines
      spec_id: RSH-08-004
    - rel_type: depends_on
      spec_id: EMB-18-001
    adr:
    - ADR-0113
    - ADR-0108
  - id: EP-09-008
    priority: MUST
    kind: protocol
    statement: >-
      Shared EM state covers proposing, accepting, rejecting or terminating an embargo.
      An actor acting on its own initiative MUST write it only when it holds the
      `CASE_MANAGER` role for the case. EP-09-017 says what an actor without the role
      does instead.
    rationale: >-
      An actor that writes its own EM state before the CASE_MANAGER has answered, then
      declares that state to the manager, is left wrong when the manager refuses:
      nothing corrects the write, so a proposer's replica can sit at `PROPOSED` while
      the canonical case never moves. The manager is the one writer of shared case state
      (ADR-0108); a participant's replica of it comes from the ledger like everyone
      else's.
    note: >-
      Participant self-status (RM, `Add(ParticipantStatus)`) is the participant's own
      claim and keeps its local write (RSH-06-001). The rule covers the owner that still
      holds the CASE_MANAGER role after creation (CM-24-006): it writes canonically
      until it delegates.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_trigger_write_gate.py`
      (`test_non_manager_trigger_asks_and_writes_no_em_state`) confirms a participant
      without the CASE_MANAGER role leaves its case at `EM.NONE`, sends its Invite to
      the CASE_MANAGER and declares no EM state.
    relationships:
    - rel_type: depends_on
      spec_id: EP-09-007
    - rel_type: depends_on
      spec_id: SYNC-11-002
    - rel_type: depends_on
      spec_id: BT-17-001
    - rel_type: refines
      spec_id: RSH-08-003
      note: The receive-side rule, applied to the trigger side for shared EM state.
    adr:
    - ADR-0113
    - ADR-0108
    stories:
    - story_2022_014
  - id: EP-09-017
    priority: MUST
    kind: protocol
    statement: >-
      This rule binds an actor acting on its own initiative without the `CASE_MANAGER`
      role. It MUST send its embargo activity to the CASE_MANAGER, write no EM state,
      and declare no EM state. Its replica moves when the CASE_MANAGER's
      commit is announced (EP-09-007). The CASE_MANAGER's `Reject` of a refused proposal
      answers the activity. So does its `Reject` of the Invite to an `Accept` it refuses
      once P/X/A is set (EMB-02-004). A participant takes a
      `Reject(Invite(EmbargoEvent))` from the CASE_MANAGER and from nobody else
      (PCR-08-001, HP-01-006).
    rationale: >-
      The CASE_MANAGER is the one writer of shared case state (ADR-0108), so an actor
      without the role asks it instead of writing. A write made before the CASE_MANAGER
      answers is left wrong when the CASE_MANAGER refuses, and a declaration of that
      state spreads the error. The CASE_MANAGER's answer is the only one a participant
      takes, so a refusal always reaches the actor that asked.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_trigger_write_gate.py`
      (`test_non_manager_trigger_asks_and_writes_no_em_state`) confirms a participant
      without the CASE_MANAGER role leaves its case at `EM.NONE`, sends its Invite to
      the CASE_MANAGER and declares no EM state, and
      `test/core/use_cases/received/test_embargo_refusal_notice.py` asserts that the
      CASE_MANAGER's `Reject` of the Invite to a participant's `Accept` passes the
      participant's sender guard.
    relationships:
    - rel_type: refines
      spec_id: EP-09-008
    - rel_type: depends_on
      spec_id: EP-09-007
    adr:
    - ADR-0113
    - ADR-0108
    stories:
    - story_2022_014
  - id: EP-09-014
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST gate a trigger use case's write of shared EM state (EP-09-008)
      with the same CASE_MANAGER role gate the received trees use (BT-17-001).
    rationale: >-
      How this codebase keeps a non-manager's trigger from writing shared EM state and
      tracks the ask it sent; split from EP-09-008 so that item states only what other
      participants observe (MS-12-010). The role gate and the pending-assertion store
      are this codebase's mechanism, and no other participant sees either.
    note: >-
      Same ordering constraint as RSH-08-004: the replay nodes of EP-09-007 MUST exist
      before the trigger-side write is gated, or a non-manager's replica never moves.
      The pending-assertion store is the ephemeral half of the outstanding-ask register
      (ASK-04-007) and never holds case state (CLP-06-002).
    verification: >-
      `test/architecture/test_embargo_trigger_writes_are_case_manager_gated.py`
      (`test_every_lifecycle_write_is_case_manager_gated`) confirms every trigger-side
      EM write sits behind the role gate;
      `test/core/use_cases/triggers/embargo/test_trigger_write_gate.py`
      (`test_non_manager_trigger_asks_and_writes_no_em_state`) confirms a non-manager's
      proposal is recorded in the pending-assertion store.
    relationships:
    - rel_type: implements
      spec_id: EP-09-008
  - id: EP-09-018
    priority: MUST
    kind: project
    statement: >-
      When the role gate of EP-09-014 refuses a trigger's write, this codebase MUST
      record the trigger's activity in the pending-assertion store (SYNC-11-002).
    rationale: >-
      The record is how this codebase tracks the ask it sent to the CASE_MANAGER, so the
      answer can close it (EP-09-019). No other participant sees the store.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_trigger_write_gate.py`
      (`test_non_manager_trigger_asks_and_writes_no_em_state`) confirms a non-manager's
      proposal is recorded in the pending-assertion store.
    relationships:
    - rel_type: implements
      spec_id: EP-09-017
    - rel_type: depends_on
      spec_id: EP-09-014
  - id: EP-09-019
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER answers a refused ask with its `Reject` of the proposal, or of
      the Invite to a refused `Accept` (EMB-02-004). This codebase MUST close the
      pending entry of EP-09-018 when that answer arrives.
    rationale: >-
      A pending entry that no answer closes would leave the ask open for good, so the
      actor would wait for an answer it already has.
    verification: >-
      `test/core/use_cases/received/test_pending_refusal.py`
      (`test_case_managers_reject_closes_the_pending_proposal`) and
      `test/core/use_cases/received/test_embargo_refusal_notice.py`
      (`test_the_case_managers_reject_to_an_accept_closes_the_accepters_ask`) confirm the
      CASE_MANAGER's `Reject` of the proposal and its `Reject` of the Invite close the
      pending entry.
    relationships:
    - rel_type: depends_on
      spec_id: EP-09-018
  - id: EP-09-009
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER's commit of a received embargo activity, fanned out as
      `Announce(CaseLedgerEntry)`, is the acknowledgement the EMB behavioural requirements
      express as "emit EK". Implementations MUST NOT define or emit an EK message to
      acknowledge an embargo activity.
    rationale: >-
      No EK exists in the production stack and MSM-02-009 records that its purpose is served
      by ledger hash-chain continuity. Under the relay every accepted embargo activity is
      committed and announced, so the record the specs want the receiver to produce already
      exists; a second acknowledgement would be a message with no reader (#3918).
    verification: >-
      A test asserts `MessageSemantics` has no embargo-acknowledgement member and the
      semantic registry has no embargo-acknowledgement pattern.
    relationships:
    - rel_type: refines
      spec_id: MSM-02-009
    - rel_type: implements
      spec_id: EMB-09-001
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-010
    priority: MUST
    kind: protocol
    statement: >-
      The invitee of an `Invite(EmbargoEvent)` is its sole `to` recipient. A receiving
      actor MUST resolve the invitee from that single recipient, not from the receiving
      actor.
    note: >-
      Scope: the invitee is resolved for the relayed Invite a participant receives
      (EP-09-002). A proposal is addressed to the CASE_MANAGER alone (PCR-08-001), so
      its one `to` recipient is its adjudicator under EP-09-001, not its invitee, and
      the CASE_MANAGER's own record takes no RSVP deadline from it (CM-28-003). Two
      spellings of one actor in `to` (a trailing slash) name one recipient.
    rationale: >-
      Every emitter sends a single-recipient Invite, a participant to the CASE_MANAGER
      and the CASE_MANAGER to one participant per relayed Invite (EP-09-002). Inferring
      the invitee from the receiving actor puts the RSVP deadline on the enforcer's own
      record instead of the invitee's.
    verification: >-
      `test/core/use_cases/received/test_embargo_invite_lapse.py`
      (`TestInviteeIsTheAddressee`, `TestInviteeIdProperty`) confirms a single-recipient
      Invite resolves that recipient.
    relationships:
    - rel_type: depends_on
      spec_id: EP-09-002
    adr:
    - ADR-0113
    stories:
    - story_2022_014
  - id: EP-09-026
    priority: MUST
    kind: protocol
    statement: >-
      A receiving actor MUST refuse an `Invite(EmbargoEvent)` that names no `to`
      recipient or more than one, as a misrouting (OX-08-001).
    rationale: >-
      Every emitter sends a single-recipient Invite (EP-09-010), so an Invite with no
      recipient or several is a defect, not a shape to interpret. Refusing names the
      defect; guessing hides it.
    note: >-
      A proposal to the CASE_MANAGER is refused the same way when it names no recipient
      or several. The refusal comes before the P/X/A check, so a misrouted Invite on a
      public, exploited or attacked case gets no `Reject`: EMB-01-002's `Reject` answers
      a proposal its receiver was sent, and a misrouting is received but not understood.
      The receiver answers it with `Create(ProcessingFault)` to the sender, naming the
      Invite in `inReplyTo` and failure class `MisroutedEmbargoInvite` (MSM-05-001,
      ADR-0123). An Invite that names no embargo is answered the same way, with failure
      class `EmbargoInviteWithoutEmbargo`.
    verification: >-
      `test/core/use_cases/received/test_embargo_relay_replay.py`
      (`test_an_invite_with_zero_or_several_recipients_gets_a_processing_fault`)
      delivers an Invite with two `to` recipients and with none and asserts `REFUSED`
      with the recipient count in the reason and one `Create(ProcessingFault)` to the
      sender, however often the Invite is delivered; an Invite naming no embargo gets
      the `EmbargoInviteWithoutEmbargo` fault
      (`test_an_invite_naming_no_embargo_gets_a_processing_fault`, same file).
      `test/core/use_cases/received/test_embargo_revision_relay.py`
      (`test_invite_with_several_recipients_is_refused`,
      `test_invite_with_no_recipient_is_refused`) confirms the refusal at the receiver.
    relationships:
    - rel_type: extends
      spec_id: EP-09-010
    adr:
    - ADR-0113
    stories:
    - story_2022_014

  - id: EP-09-011
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER admits a participant
      (`Accept(Invite(Actor)[target=VulnerabilityCaseStub])`) while an embargo
      proposal is open, it MUST relay an `Invite(EmbargoEvent)` for every open proposal to
      the joiner and commit each as a ledger entry, after the joiner holds the case and the
      prior ledger. Each Invite has `actor` set to the CASE_MANAGER's ID and `attributedTo`
      set to the proposal's original proposer (EP-09-002). A proposal whose consent row
      for the joiner has already left `UNINVITED` is not relayed again. Every participant
      holds a row for every register entry (CM-18-001). The row's state, not its
      presence, says whether the joiner was asked. The joiner's row for the active
      embargo is unchanged (EP-09-004), so a joiner that accepts the revision is a
      signatory of it at activation and one that does not lapses (ADR-0093, EP-05-001).
    rationale: >-
      A joiner is seated after the relay of a proposal (EP-09-002), so it was never on the
      roster when the Invite went out, and nothing else would ask it. A new participant
      becomes a signatory to the embargo in effect when it joins, and is asked about a
      revision on the table exactly like the participants who were present when it was
      proposed.
    verification: >-
      `test/core/use_cases/received/test_joiner_revision_relay.py` accepts a stub Invite
      as the CASE_MANAGER at `EM.REVISE` and asserts one committed, outbox-queued Invite
      per open proposal, attributed to the proposer, with the joiner's row for the
      revision `INVITED` and the row for the active embargo `AGREED`; a follow-up
      accept leaves it with an `AGREED` row for the revision, which binds it at activation.
    relationships:
    - rel_type: refines
      spec_id: EP-09-002
    - rel_type: depends_on
      spec_id: CM-11-001
    adr:
    - ADR-0113
    - ADR-0114
    stories:
    - story_2022_014

  - id: EP-09-012
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a participant whose consent row for the embargo of an
      `Invite(EmbargoEvent)` it received is `INVITED` or `TIMED_OUT` (CM-18-001). The
      participant MUST be able to answer that Invite with `Accept` or `Reject` after its
      embargo has become the embargo in force, as before. The answer names the Invite it
      answers.
    rationale: >-
      Activation takes a proposal out of the record of open proposals (EP-08-003), so a
      participant relayed the proposal (EP-09-011) that had not answered when it was
      activated, or whose reply deadline has since passed (EMB-17), can no longer answer
      it as an open proposal. The receive side already honours the answer (MSM-07-003,
      EMB-17-002).
    note: >-
      Answering the embargo in force goes through the relayed `Invite(EmbargoEvent)`
      (ADR-0122), not the full-case Invite, whose replies move only the RM state
      (CM-11-011). A joiner whose `INVITED` row for the embargo in force comes from the
      stub Invite (CM-11-026) holds no `Invite(EmbargoEvent)` to name; accepting the
      stub makes it `AGREED` (CM-11-001), so it needs no trigger. Withdrawing from the
      embargo in force from an `AGREED` row is not an answer and has its own trigger
      (EP-09-013, EP-09-016).
    verification: >-
      `test/core/use_cases/triggers/embargo/test_answer_in_force.py`
      (`test_answers_the_embargo_in_force_by_invite_id`) answers the embargo in force by
      Invite id with an `INVITED` row and with a `TIMED_OUT` row (accept and reject).
    relationships:
    - rel_type: constrains
      spec_id: EP-08-002
    - rel_type: depends_on
      spec_id: MSM-07-003
    - rel_type: depends_on
      spec_id: EMB-17-002
    adr:
    - ADR-0122
    stories:
    - story_2022_014
  - id: EP-09-027
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant MUST NOT answer an `Invite(EmbargoEvent)` whose consent row is in
      any state other than `INVITED` or `TIMED_OUT`.
    rationale: >-
      A row that is `AGREED` or `DECLINED` already holds an answer, and an `UNINVITED`
      row was never asked. Withdrawing from the embargo in force from an `AGREED` row is
      not an answer and has its own message (EP-09-013).
    verification: >-
      `test/core/use_cases/triggers/embargo/test_answer_in_force.py`
      (`test_a_row_with_nothing_to_answer_is_not_found`) refuses an answer from an
      `AGREED` or `DECLINED` row.
    relationships:
    - rel_type: extends
      spec_id: EP-09-012
    adr:
    - ADR-0122
    stories:
    - story_2022_014
  - id: EP-09-015
    priority: MUST
    kind: project
    statement: >-
      This codebase's accept and reject embargo triggers MUST resolve an Invite the
      caller names from the participant's own record of the Invites it received. They do
      not resolve it from the record of open proposals.
    rationale: >-
      How this codebase's triggers find the Invite a participant answers; split from
      EP-09-012 so that item states only the answer other participants observe
      (MS-12-010). The record a trigger reads and the error it raises are this
      codebase's mechanism. A no-name call never falls back to the embargo in force,
      because answering an embargo is an intentional act.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_answer_in_force.py` answers by Invite
      id from the participant's received Invite
      (`test_answers_the_embargo_in_force_by_invite_id`).
    relationships:
    - rel_type: implements
      spec_id: EP-09-012
  - id: EP-09-029
    priority: MUST
    kind: project
    statement: >-
      This codebase's accept and reject embargo triggers MUST raise a not-found error in
      two cases. The participant holds no Invite the caller names, or the Invite's row
      is not `INVITED` or `TIMED_OUT` (EP-09-027).
    rationale: >-
      The error this codebase raises for an Invite with nothing to answer is its
      mechanism for refusing an answer the protocol forbids (EP-09-027).
    verification: >-
      `test/core/use_cases/triggers/embargo/test_answer_in_force.py` asserts the
      not-found error for an unknown Invite
      (`test_an_invite_the_actor_does_not_hold_is_not_found`) and for a row with nothing
      to answer (`test_a_row_with_nothing_to_answer_is_not_found`).
    relationships:
    - rel_type: implements
      spec_id: EP-09-027
  - id: EP-09-030
    priority: MUST
    kind: project
    statement: >-
      When the caller names no Invite, this codebase's accept and reject embargo
      triggers MUST select among the open proposals only (EP-08-002). They never select
      the embargo in force.
    rationale: >-
      Answering an embargo in force is an intentional act, so a call that names nothing
      never falls back to it.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_answer_in_force.py`
      (`test_a_call_naming_no_invite_never_falls_back_to_the_embargo_in_force`) asserts
      a call naming no Invite never falls back to the embargo in force.
    relationships:
    - rel_type: implements
      spec_id: EP-08-002

  - id: EP-09-013
    priority: MUST
    kind: protocol
    statement: >-
      A participant whose consent row for the embargo in force is `AGREED` MUST be able
      to withdraw from that embargo. It sends `Leave(EmbargoEvent)`, naming the embargo
      in force, to the CASE_MANAGER (MSM-07-010, PCR-08). A withdrawal needs no Invite.
      An `Accept` or a `Reject` is never a withdrawal from the embargo in force.
    rationale: >-
      VP-13-017 lets a participant end its own compliance at any time, and VP-13-008
      asks that it say so. A signatory made by seeding (CM-14-005) or by joining
      (CM-11-001) holds no `Invite(EmbargoEvent)` for the embargo in force, but every
      participant holds the embargo itself, so a withdrawal names the embargo, not an
      Invite.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_withdraw.py` withdraws a signatory with
      an `AGREED` row on the embargo in force, including one seeded with no Invite, and
      asserts the Leave names the active embargo and is addressed to the CASE_MANAGER;
      it also asserts that a no-name reject with a revision open refuses the revision
      and leaves the row for the embargo in force `AGREED`.
    relationships:
    - rel_type: depends_on
      spec_id: MSM-07-010
    - rel_type: refines
      spec_id: VP-13-017
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2022_014
  - id: EP-09-028
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule covers a participant with no embargo in force, one whose row for that
      embargo is not `AGREED`, and the Case Owner. Each MUST NOT send
      `Leave(EmbargoEvent)` to withdraw.
    rationale: >-
      With no embargo in force there is nothing to withdraw from, and a participant
      whose row is not `AGREED` is not bound by the embargo. The Case Owner ends an
      embargo by terminating it (MSM-07-036), not by withdrawing from it.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_withdraw.py`
      (`test_withdrawal_with_no_embargo_in_force_is_refused`,
      `test_withdrawal_from_a_row_that_is_not_agreed_is_refused`,
      `test_the_case_owner_cannot_withdraw`) asserts the refusal in each case.
    relationships:
    - rel_type: extends
      spec_id: EP-09-013
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2022_014
  - id: EP-09-016
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST offer withdrawal (EP-09-013) as a trigger of its own. The
      trigger resolves the embargo from the case's active embargo and refuses, with a
      reported reason, a withdrawal the participant may not send (EP-09-028).
    rationale: >-
      How this codebase exposes withdrawal to a participant's operator; split from
      EP-09-013 so that item states only the `Leave` other participants observe
      (MS-12-010). Which trigger sends it, and how a refused call is reported, are this
      codebase's mechanism.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_withdraw.py` confirms the trigger
      exists (`test_a_withdraw_embargo_trigger_exists`) and refuses with no embargo in
      force, from a row that is not `AGREED`, and for the Case Owner
      (`test_withdrawal_with_no_embargo_in_force_is_refused`,
      `test_withdrawal_from_a_row_that_is_not_agreed_is_refused`,
      `test_the_case_owner_cannot_withdraw`).
    relationships:
    - rel_type: implements
      spec_id: EP-09-013
  - id: EP-09-031
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase's accept and reject embargo triggers MUST NOT withdraw from the
      embargo in force.
    rationale: >-
      Keeping withdrawal out of the reject trigger means a no-name reject still refuses
      an open proposal (EP-08-002) and never withdraws a signatory.
    verification: >-
      `test/core/use_cases/triggers/embargo/test_withdraw.py`
      (`test_a_no_name_reject_refuses_the_revision_and_never_withdraws`) confirms that a
      no-name reject never withdraws.
    relationships:
    - rel_type: implements
      spec_id: EP-09-013
