id: BTND
title: Behavior Tree Node Design
description: Formal requirements for BT node parameterization, composability, and reuse in the core behaviors package. Covers
  node context injection, blackboard hygiene, module ownership, and the fractal composability pattern that applies at every
  depth of the tree hierarchy.
scope:
- prototype
- production
tags:
- behavior-tree
groups:
- id: BTND-01
  title: Node Parameterization
  specs:
  - id: BTND-01-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT node MUST NOT hard-code an actor identity, a CVD role, a case ID or any other
      value that varies by usage site.
    rationale: Hard-coded context values prevent reuse across actors or scenarios and couple the node to a single workflow.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
  - id: BTND-01-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT node MUST NOT read its actor identity, case ID or CVD role from implicit
      ambient context. Environment variables and module-level globals are such context.
    rationale: >-
      A value that a node reads from the environment or from a global is a hidden input.
      Several actors can run in one process. Thus ambient context can give the identity
      or the case of one actor to the tree of a different actor. A test also cannot set
      such a value without a change to shared state. When all inputs are explicit, the
      behavior of a node depends only on what its tree gives it.
  - id: BTND-01-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: When a BT node name is derived from a parameterized value (e.g., role or actor ID), the name MUST be constructed
      from that parameter at instantiation time, not hard-coded as a string literal.
    rationale: >-
      Tree traces and logs show node names. If a parameterized node uses a literal name,
      all its instances have the same label. Then a trace cannot show which role or
      actor each instance served.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
  - id: BTND-01-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT node MUST take each value that varies by usage site as a constructor
      parameter. Such values include an actor identity, a CVD role and a case ID.
    rationale: >-
      A constructor parameter makes each such value an explicit input. The caller that
      builds the tree then decides the value, so one node class serves every actor and
      every case.
    relationships:
    - rel_type: extends
      spec_id: BTND-01-001
  - id: BTND-01-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT node MUST receive each variable input through a constructor parameter or
      the documented blackboard interface.
    rationale: >-
      These two channels are the inputs that a tree and its tests can see and set. An
      input that arrives any other way is hidden, and a test cannot control it.
    relationships:
    - rel_type: extends
      spec_id: BTND-01-002
- id: BTND-02
  title: Composability and Reuse
  specs:
  - id: BTND-02-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Logic in two or more BT nodes or subtrees MUST be extracted into one shared,
      parameterized node or factory in a neutral shared module (BTND-04-005).
    rationale: >-
      Copies of the same logic drift apart, because each copy gets its own fixes. Then
      two trees enforce different rules for the same protocol step. One shared node
      gives one version to test and to change.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
  - id: BTND-02-002
    priority: SHOULD
    kind: project
    statement: Each BT subtree SHOULD be independently triggerable as a use-case entry point AND composable as a child of
      a larger subtree.
    rationale: This is the "fractal composability" pattern. Subtrees that can only be used one way are candidates for refactoring.
    relationships:
    - rel_type: refines
      spec_id: BT-06-002
  - id: BTND-02-003
    priority: SHOULD
    kind: project
    statement: New BT subtrees SHOULD be verified against `notes/vultron-bt.txt` (the canonical simulation BT structure) to
      confirm structural correspondence before committing.
    rationale: >-
      The canonical simulation tree is the reference design for protocol behavior. A
      check before commit finds a subtree that does not agree with that design while the
      change is still small. After other trees depend on the subtree, the correction
      costs more.
    relationships:
    - rel_type: refines
      spec_id: BT-06-002
  - id: BTND-02-004
    priority: SHOULD
    kind: project
    statement: >-
      A shared BT node or subtree that models a generic operation (e.g., "create a
      case participant with any role") SHOULD replace all role-specific one-off
      variants (e.g., `CreateReporterParticipantNode`, `CreateVendorParticipantNode`)
      once the shared version is available.
    rationale: Reduces maintenance surface; fixes and improvements apply consistently across all use sites.
- id: BTND-03
  title: Blackboard Interface Contracts
  specs:
  - id: BTND-03-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Each BT node that reads from or writes to the py_trees blackboard MUST declare all blackboard keys it uses
      in its `setup()` method via `register_key()`.
    rationale: Undeclared blackboard reads create hidden dependencies that break composability and make tests fragile.
    relationships:
    - rel_type: refines
      spec_id: BT-03-003
  - id: BTND-03-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: A BT node MUST NOT read a blackboard key that was not registered with at least `READ` access in `setup()`.
    rationale: >-
      Registration is the contract that a node declares with the blackboard, and
      py_trees uses this contract to enforce access. If a node reads a key that it did
      not register, one of two problems occurs. The read fails at tick time, or the read
      hides a dependency that a reader of `setup()` cannot see.
    relationships:
    - rel_type: refines
      spec_id: BT-03-003
  - id: BTND-03-003
    priority: SHOULD
    kind: project
    statement: A BT node's docstring SHOULD document all blackboard keys it reads and writes, including the expected type
      and the node that produces the value for each READ key.
    rationale: >-
      The docstring tells a reader the data flow of a node without the code. When the
      docstring gives the type and the producer of each key, the reader sees which node
      must run first. The reader also sees what a consumer can expect. Thus a broken
      handoff is easier to find.
  - id: BTND-03-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT node that writes an inter-node handoff key MUST namespace it by the
      execution-scoped correlation ID of its tree instance, as `{noun}_{id_segment}`.
      An inter-node handoff key is a blackboard key that one node writes and a
      downstream sibling in the same tree reads. For an HTTP URI, `id_segment` is
      `recommendation_id.split('/')[-1]`. For a URN ID, it is the last colon-delimited
      segment.
    rationale: >-
      The py_trees blackboard is global to the process. A tree factory can run
      concurrently, for example for two `Offer(Actor, Case)` messages that the actor
      handles in parallel. Then both tree instances share one blackboard namespace. The
      first instance can write a flat key such as `suggested_roles`, and the second
      instance can overwrite it before the first instance reads it. Then the Case Owner
      gets the wrong role list. A key that contains the execution-scoped ID, such as
      `suggested_roles_abc123`, gives each execution its own key. See
      `notes/bt-pitfalls.md` § "Namespaced Inter-Node Handoff Keys".
    relationships:
    - rel_type: refines
      spec_id: BTND-03-001
  - id: BTND-03-005
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: Blackboard keys MUST NOT contain forward-slash characters.
    rationale: py_trees parses forward-slashes as namespacing separators; a key containing `/` silently creates a sub-namespace
      and will not be found by flat-key readers.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-004
  - id: BTND-03-008
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Blackboard keys MUST follow the `{noun}_{id_segment}` naming convention where the noun names the value and
      `id_segment` is the execution-scoped correlation ID (last path or colon-delimited segment). Flat, unscoped keys (e.g.,
      `result`, `status`) are only permitted for top-level handoff keys that are consumed in the same tick cycle and cannot
      collide.
    rationale: The `{noun}_{id_segment}` convention generalizes BTND-03-004 to all keys, not just inter-node handoffs.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-004
  - id: BTND-03-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A decomposed BT leaf node that meets a domain-layer error MUST write the error to
      the `result_out["error"]` blackboard key before it returns `FAILURE`.
    rationale: Without a written error key the bridge layer sees only `FAILURE` with no diagnostic context; the error is silently
      swallowed. Writing to `result_out["error"]` ensures the error propagates to the caller via the result channel even when
      the BT stops traversal at the failing leaf.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-001
  - id: BTND-03-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A decomposed BT leaf node MUST catch a `KeyError` for a missing blackboard key in
      its `update()` method and return `FAILURE`. The `KeyError` then never reaches the
      bridge layer.
    rationale: A `KeyError` propagating to the bridge results in an unhandled 500-level error for the caller. At the leaf
      level the semantics of "key not present" are known — this is a precondition failure, not an unexpected crash, so `FAILURE`
      is the correct BT response.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-001
  - id: BTND-03-009
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A new BT node in `vultron/core/behaviors/` MUST subclass
      `DataLayerConditionWithPorts` or `DataLayerActionWithPorts` from `helpers.py`,
      not `DataLayerCondition` or `DataLayerAction`.
    rationale: >-
      Typed port declarations are machine-readable and are at the class level. They are
      the one source of truth for the data-flow contract of a node. The imperative
      `register_key()` approach puts declarations in `setup()`, `initialise()` and
      `update()`. py_trees 2.6 and later treats a ports class without both attributes as
      abstract, and does not instantiate it. Thus an accessor override is not a valid
      declaration (ADR-0044).
    relationships:
    - rel_type: extends
      spec_id: BTND-03-001
    - rel_type: refines
      spec_id: BTND-03-003
    adr:
    - ADR-0044
  - id: BTND-03-010
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >
      A `DataLayerConditionWithPorts` or `DataLayerActionWithPorts` subclass MUST call `setup_ports()` in its
      `setup()` method with port remappings `{"datalayer": "/datalayer", "actor_id": "/actor_id"}` (plus
      `"trigger_activity_factory": "/trigger_activity_factory"` for action nodes). These absolute-path remappings wire
      the node's declared ports to the flat keys written by `BTBridge.setup_tree()`.
    rationale: >
      The `BehaviourWithPorts` default namespace scopes port keys under the node's subtree path, which does not
      match the flat `/datalayer` and `/actor_id` keys that `BTBridge.setup_tree()` writes. Explicit absolute-path
      remappings are required for compatibility. The base classes `DataLayerConditionWithPorts` and
      `DataLayerActionWithPorts` implement this in their own `setup()` so subclasses that do not add extra ports need
      not override `setup()`.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-009
    adr:
    - ADR-0044
  - id: BTND-03-011
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A `DataLayerConditionWithPorts` or `DataLayerActionWithPorts` subclass MUST read injected values via
      `get_input(port_name)` in `initialise()` (not via direct `self.blackboard.<key>` attribute access). A missing
      required port raises `NoDataAvailable` when `get_input()` is first called in `initialise()` — at the start of
      the first tick, not during `setup()`.
    rationale: Direct blackboard attribute access bypasses the typed port layer and its early error detection. Using
      `get_input()` preserves type checking and `NoDataAvailable` detection for required ports.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-009
    adr:
    - ADR-0044
  - id: BTND-03-012
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A `DataLayerActionWithPorts` subclass MUST declare each handoff key it writes in
      `OUTPUT_PORTS` and write it with `self._set_output()`, never by direct blackboard
      assignment.
    rationale: >
      Declaring output ports in `OUTPUT_PORTS` makes the node's write contract explicit and machine-readable,
      consistent with the input-port convention from BTND-03-009/BTND-03-011. Using `_set_output()` routes writes
      through the typed port layer so the framework enforces that only declared output keys are written.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-009
  - id: BTND-03-013
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      An output port with an execution-scoped physical key (BTND-03-004) MUST have a
      stable logical name in `OUTPUT_PORTS` that is only its `{noun}` part. An example
      physical key is `suggested_roles_abc123`.
    rationale: >
      `OUTPUT_PORTS` is a class attribute with no access to instance state, so execution-scoped physical keys
      (computed in `__init__`) cannot be declared there directly. Declaring a stable logical name and binding the
      physical key in `setup()` separates the interface (class attribute) from the execution-time binding (instance
      method), preserving BTND-03-004 concurrent-execution safety while enabling typed port declarations.
      Validated against `py_trees.ports.PortsMixin.setup_ports()` remapping semantics.
    relationships:
    - rel_type: refines
      spec_id: BTND-03-012
    - rel_type: refines
      spec_id: BTND-03-004
  - id: BTND-03-014
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Every node in a tree that reads or writes an inter-node handoff value MUST use
      the same namespaced key for that value.
    rationale: >-
      A namespaced key protects a handoff only when the writer and every reader agree
      on it. If one node uses a different key, the reader finds no value, or it finds
      the value of another execution.
    relationships:
    - rel_type: extends
      spec_id: BTND-03-004
  - id: BTND-03-015
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      After a decomposed BT leaf node writes a domain-layer error to
      `result_out["error"]`, `execute()` MUST re-raise the original exception.
    rationale: >-
      The bridge layer maps the original exception to the matching HTTP error
      response. If `execute()` does not re-raise it, the caller gets a generic failure
      and loses the error type.
    relationships:
    - rel_type: extends
      spec_id: BTND-03-006
  - id: BTND-03-016
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `FAILURE` that a decomposed BT leaf node returns for a missing blackboard key
      MUST carry a diagnostic message that names the missing key.
    rationale: >-
      A bare `FAILURE` does not tell a reader which precondition was absent. The key
      name points the reader to the node that should have written it.
    relationships:
    - rel_type: extends
      spec_id: BTND-03-007
  - id: BTND-03-017
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `INPUT_PORTS` and `OUTPUT_PORTS` class attributes of a BT node in
      `vultron/core/behaviors/` MUST declare every port that the node reads or writes.
    rationale: >-
      These typed class attributes are the formal blackboard contract of the node. A
      port that they do not declare is a hidden input or output, which a reader and a
      tool cannot see.
    relationships:
    - rel_type: extends
      spec_id: BTND-03-009
    adr:
    - ADR-0044
  - id: BTND-03-018
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A ports node subclass extends the ports of its parent by spreading the parent
      attribute, as in `{**Parent.INPUT_PORTS, ...}`. It MUST NOT override the
      `input_ports()` or `output_ports()` accessors.
    rationale: >-
      py_trees 2.6 and later treats a ports class without both attributes as abstract,
      and does not instantiate it. Thus an accessor override is not a valid port
      declaration (ADR-0044).
    relationships:
    - rel_type: extends
      spec_id: BTND-03-009
    adr:
    - ADR-0044
  - id: BTND-03-019
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A `DataLayerActionWithPorts` subclass MUST include its output port remappings in
      the `port_remappings` dict that it passes to `setup_ports()`, usually through
      `_domain_port_remappings()`.
    rationale: >-
      A declared output port reaches its blackboard key only through a remapping. Without
      it, `_set_output()` writes to a key that no downstream reader looks at.
    relationships:
    - rel_type: extends
      spec_id: BTND-03-012
  - id: BTND-03-020
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A node whose output port has an execution-scoped physical key MUST bind that key
      by overriding `setup()` to pass `port_remappings={"logical_name": physical_key}`
      to `setup_ports()`.
    rationale: >-
      `OUTPUT_PORTS` is a class attribute with no access to instance state, so it
      cannot name a key computed in `__init__`. The binding in `setup()` connects the
      stable logical name, which is the public contract, to the key of each execution.
    relationships:
    - rel_type: extends
      spec_id: BTND-03-013
- id: BTND-04
  title: Module Ownership
  specs:
  - id: BTND-04-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A domain-specific module in `vultron/core/behaviors/` MUST NOT import BT nodes
      from a sibling domain module.
    rationale: Cross-domain node imports create tight coupling and circular-import risk. Neutral shared ownership makes the
      dependency structure explicit.
    relationships:
    - rel_type: refines
      spec_id: ARCH-04-001
  - id: BTND-04-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: BT nodes MUST NOT import from `vultron/demo/` or any other demo-layer module. Demo-specific context (step descriptions,
      demo loggers, demo flags) belongs in demo scripts, not in BT nodes.
    rationale: >-
      The demo layer is outside core and depends on core. A behavior node that imports
      demo code reverses that dependency. It also puts demo-only context into the
      protocol logic. A deployment that ships core without the demos then fails.
  - id: BTND-04-003
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A `behaviors/` module MUST NOT import from a `use_cases/` module.
    rationale: Importing use-cases from behaviors inverts the composition hierarchy (behaviors are the implementation layer
      of use-cases, not their consumers) and introduces circular imports when use-cases inject behaviors via factories.
    relationships:
    - rel_type: refines
      spec_id: BTND-04-001
    - rel_type: refines
      spec_id: ARCH-04-001
  - id: BTND-04-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Logic shared between `behaviors/` and `use_cases/` MUST be extracted to a common helper in `vultron/core/`
      or `vultron/core/behaviors/helpers.py`.
    rationale: >-
      `behaviors/` must not import `use_cases/` (BTND-04-003). Thus logic that both
      layers need must be in a location that both layers can import. Without that
      location, only two choices remain: an import that breaks the layering, or a second
      copy that drifts.
    relationships:
    - rel_type: refines
      spec_id: BTND-04-003
  - id: BTND-04-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT node or subtree that more than one domain module uses MUST be defined in
      `helpers.py` or another purpose-built shared module in `vultron/core/behaviors/`.
      Two such domain modules are `case/` and `report/`.
    rationale: >-
      A neutral shared module gives each domain module a place to import from that is
      not a sibling. The dependency structure then stays explicit, with no
      cross-domain imports and no circular-import risk.
    relationships:
    - rel_type: implements
      spec_id: BTND-04-001
  - id: BTND-04-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT node MUST NOT import a use-case class or function.
    rationale: >-
      Behaviors implement use cases, so a node that imports a use case inverts the
      composition hierarchy. It also makes a circular import when the use case injects
      the behavior through a factory.
    relationships:
    - rel_type: refines
      spec_id: BTND-04-003
- id: BTND-05
  title: Actor Configuration for Participant Nodes
  specs:
  - id: BTND-05-001
    priority: MUST
    kind: project
    statement: The `CVDRoles` enum MUST include a `CASE_OWNER` flag value representing the actor who owns and manages a `VulnerabilityCase`.
    rationale: Case ownership is a protocol-significant relationship distinct from the CVD roles (VENDOR, COORDINATOR, etc.).
      When a vendor or coordinator receives a report and creates a case, they are both the receiving CVD actor (VENDOR or
      COORDINATOR) and the case owner. Representing this explicitly avoids hardcoding the assumption that the case creator
      is always a vendor.
    verification: Inspection of the `CVDRoles` enum definition confirms that a `CASE_OWNER` flag value is present.
    stories:
    - story_2022_046
    - story_2022_013
  - id: BTND-05-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The BT node for creating the initial case participant MUST be role-agnostic; the correct
      node for this purpose is `AddOwnerParticipantNode`, which takes the case owner's
      additional roles from `ActorConfig.default_case_roles`.
    rationale: >-
      "Vendor" is a demo-specific assumption. In the general protocol a coordinator, deployer, or
      other role may equally receive a report and become the case owner.
    relationships:
    - rel_type: refines
      spec_id: BTND-01-001
  - id: BTND-05-003
    priority: MUST
    kind: project
    statement: >-
      Participant-creation BT nodes MUST build and attach the `CaseParticipant`
      record through the shared `_create_and_attach_participant` helper
      (`vultron/core/behaviors/case/nodes/participant/common.py`) rather than
      re-implementing create-and-attach per flow. The helper carries no status
      or embargo-consent policy; each seating flow (case owner, inert invitee,
      reporter) supplies its own roles and initial status. No role-specific
      participant-creation subclasses or alias names are permitted.
    rationale: >-
      Participant creation differs by protocol moment — case creation, stub-Invite
      seating (CM-11-006), reporter seating — not by role. The invitee flow must
      seat an inert, non-signatory participant (ADR-0114), so a single composite
      creation node bundling embargo-signatory seeding (the retired
      `CreateCaseParticipantNode`) could not serve every flow. Centralizing the
      policy-free create-and-attach in `_create_and_attach_participant` keeps the
      mechanism DRY without forcing an incompatible policy.
    verification: >-
      Inspection of `vultron/core/behaviors/case/nodes/participant/` confirms
      participant records are built and attached via
      `_create_and_attach_participant`, and that no role-specific
      participant-creation subclasses or alias names (e.g.,
      `CreateReporterParticipantNode`) are present.
    adr:
    - ADR-0114
    stories:
    - story_2022_013
    - story_2022_052
  - id: BTND-05-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The `CVDRole` enum MUST include a `CVE_NUMBERING_AUTHORITY` value representing a participant that holds CVE
      Numbering Authority (CNA) status.
    rationale: Multiple participants in an MPCVD case may independently be CNAs (e.g., a vendor CNA and a coordinator CNA).
      The `IsIDAssignmentAuthority` BT node checks whether a participant holds this role as a static capability check; `IdAssignable`
      evaluates whether the CNA's scope rules cover the specific vulnerability. Without a `CVE_NUMBERING_AUTHORITY` role in
      `CVDRole`, the protocol has no way to represent CNA status, route ID-assignment decision nodes to the correct participant(s),
      or distinguish CNA participants from non-CNA participants in case actor lists. `CVE_NUMBERING_AUTHORITY` is orthogonal
      to all other CVD roles — a VENDOR, COORDINATOR, or any participant may independently hold it.
    relationships:
    - rel_type: refines
      spec_id: BTND-05-001
  - id: BTND-05-005
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      The BT node for creating the initial case participant MUST NOT assume any specific CVD role
      (e.g., Vendor).
    rationale: >-
      Any CVD actor (coordinator, deployer, vendor, etc.) may receive a report and become the
      case owner; hardcoding a role couples the node to a single scenario.
  - id: BTND-05-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The BT node for creating the initial case participant MUST treat the actor as the case
      owner regardless of their CVD role(s).
    rationale: >-
      Case ownership is orthogonal to CVD role. The node must apply the `CASE_OWNER` flag without
      requiring or checking any specific CVD role value.
  - id: BTND-05-007
    priority: SHOULD
    kind: project
    statement: >-
      CVE eligibility checking SHOULD be implemented as a single `EvaluateCveEligibility`
      Evaluator call-out point rather than as multiple individual call-out points for each
      eligibility criterion.
    rationale: >-
      CVE eligibility is one logical capability: a set of criteria evaluated as a unit against
      a specific version of the CNA Operational Rules. Treating each criterion as an independent
      call-out point misrepresents the substitution unit — when the rules are updated, all criteria
      change together, not independently. A single Evaluator call-out correctly models the
      "replace the whole eligibility check" seam (ADR-0071).
    adr:
    - ADR-0071
    relationships:
    - rel_type: refines
      spec_id: BTND-05-004
  - id: BTND-05-008
    priority: SHOULD
    kind: project
    statement: >-
      The `EvaluateCveEligibility` call-out point SHOULD be grounded in the CNA Operational
      Rules edition endorsed by the current spec as the conformance baseline. The reference
      implementation follows CNA Operational Rules v4.1.0. Adopting a newer edition requires
      updating both this spec and the implementing call-out factory.
    rationale: >-
      Pinning the eligibility logic to a specific rules edition in the implementation (not the
      RFC) avoids coupling the protocol spec to an independently-versioned external document's
      release cycle, while remaining transparent about which edition serves as the conformance
      baseline (ADR-0071).
    adr:
    - ADR-0071
    relationships:
    - rel_type: refines
      spec_id: BTND-05-007
- id: BTND-06
  title: Idiomatic BT Construction Patterns
  specs:
  - id: BTND-06-001
    priority: SHOULD
    kind: project
    statement: >-
      Stateful BT nodes SHOULD use the **implicit sequence** pattern: a Fallback whose first child
      checks whether the goal is already achieved (the postcondition), and whose remaining children perform the work only
      when the goal has not yet been reached.
    rationale: Automatically makes nodes idempotent and reactive. Re-ticking a satisfied node costs only a cheap condition
      check. This is the dominant pattern throughout `vultron/bt/`.
    relationships:
    - rel_type: refines
      spec_id: BT-06-003
  - id: BTND-06-002
    priority: SHOULD
    kind: project
    statement: >-
      When a Sequence contains multiple actions, each action that may already be complete SHOULD be
      paired with its success condition via a Fallback, making the **explicit success condition** visible in the tree.
    rationale: Improves readability and correctness. Readers can determine the success criterion of each step from the tree
      alone, without reading action implementations.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
  - id: BTND-06-003
    priority: SHOULD
    kind: project
    statement: >-
      Every BT node that performs a protocol state transition (RM/EM/CS state machine update, emitting
      an AS2 activity, or creating/updating a domain object) SHOULD follow the **PPA (Postcondition–Precondition–Action)**
      structure: `Fallback(Postcondition, Sequence(Precondition1, …, PreconditionN, Action))`.
    rationale: PPA is the canonical "unit cell" of idiomatic BT design. It makes the node's contract (what it requires and
      what it guarantees) explicit and machine-readable from the tree structure.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
  - id: BTND-06-004
    priority: MAY
    kind: project
    statement: >-
      Multi-step workflows where each step has its own preconditions that may need to be achieved MAY
      be constructed using **back-chaining**: start with the goal condition, find the PPA whose postcondition matches, and
      recursively substitute failing preconditions with their own PPAs.
    rationale: Back-chaining produces fully reactive, goal-directed trees where intermediate states are automatically recovered
      on failure.
    relationships:
    - rel_type: refines
      spec_id: BT-06-002
  - id: BTND-06-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'Before any irreversible or protocol-significant action, a safety guard condition MUST be the first child of the enclosing Sequence, so that the action is skipped when the guard fails.'
    rationale: Prevents unsafe state transitions when the world changes between ticks. In a multi-party protocol, another
      actor may change shared state at any time.
    relationships:
    - rel_type: refines
      spec_id: BT-06-003
  - id: BTND-06-006
    priority: MAY
    kind: project
    statement: >-
      Memory composites (`memory=True` in py_trees) MAY be used **only** in contexts that are fully deterministic
      and non-reactive: no external actor can undo a child's outcome between ticks, and the agent operates in a closed-loop,
      human-supervised environment.
    rationale: >-
      A memory composite does not tick again a child that succeeded on an earlier tick.
      Between ticks, a message from a different actor can make the result of that child
      false. Then the tree acts on a success that is not true. The skip is safe only in
      a closed, deterministic setting.
    relationships:
    - rel_type: refines
      spec_id: BT-06-003
  - id: BTND-06-007
    priority: SHOULD
    kind: project
    statement: >-
      A behavior SHOULD be implemented as a leaf node when the action is atomic and has no
      observable sub-steps.
    rationale: >-
      Leaf nodes are the appropriate granularity for indivisible actions; decomposing them further
      adds structural complexity without improving testability.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
  - id: BTND-06-008
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'Code that writes to a `memory=False` py_trees Sequence MUST be written assuming that any child''s writes to
      the blackboard are immediately visible to subsequent children but are NOT rolled back if a later child returns `FAILURE`.
      A `memory=False` Sequence is non-transactional: partial side-effects from earlier children survive the composite''s
      final `FAILURE` status.'
    rationale: The py_trees `memory=False` Sequence restarts from the first child on each tick, but it does NOT undo blackboard
      writes made by children in previous ticks or earlier in the same tick. This surprises developers who expect Sequence
      failure to be atomic. The correct pattern for atomic multi-write operations is a single leaf node that performs all
      writes.
    relationships:
    - rel_type: refines
      spec_id: BTND-06-001
  - id: BTND-06-009
    priority: SHOULD
    kind: project
    statement: >-
      A behavior SHOULD be decomposed into a subtree when it can be split into independently
      verifiable pre/post-condition pairs.
    rationale: >-
      Decomposing into subtrees with explicit pre/post-condition pairs makes each step
      individually testable and follows the PPA pattern (BTND-06-003).
  - id: BTND-06-010
    priority: SHOULD
    kind: project
    statement: >-
      A subtree SHOULD be extracted when the same multi-step pattern appears in more than one
      place (see BTND-02-001).
    rationale: >-
      Extracting repeated patterns into a shared subtree reduces duplication and ensures fixes
      and improvements apply consistently across all use sites.
- id: BTND-07
  title: BT Node Module Organization
  specs:
  - id: BTND-07-001
    priority: MUST
    kind: project
    statement: BT node classes for a given protocol step MUST be organized into a `nodes/` subpackage rather than a single
      flat `nodes.py` module. This applies to all BT-bearing process areas in `vultron/core/behaviors/` regardless of current
      node count or file size.
    rationale: A flat `nodes.py` becomes a high-churn, high-blast-radius file where every change — regardless of which workflow
      step it touches — modifies the same module. Applying the `nodes/` subpackage pattern uniformly (not just when a file
      grows large) keeps the hierarchy consistent and prevents gradual accumulation that creates a large-file problem later.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
    - rel_type: extends
      spec_id: CS-18-001
    verification: Every BT-bearing process area under `vultron/core/behaviors/` has a `nodes/` subpackage and does not retain
      a flat `nodes.py` module at the area root. Helper-only areas that do not define BT tree composition or BT leaf nodes
      are exempt.
  - id: BTND-07-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Within a `nodes/` subpackage, submodules MUST be grouped by semantic concern (e.g., `conditions.py`, `case_setup.py`,
      `participant.py`, `embargo.py`, `communication.py`, `lifecycle.py`).
    rationale: Grouping by semantic concern reduces diff scope, improves discoverability, and lets reviewers focus on the
      affected concern in isolation.
    relationships:
    - rel_type: refines
      spec_id: BTND-07-001
  - id: BTND-07-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The `nodes/` subpackage `__init__.py` MUST re-export all public node names to preserve import compatibility
      with callers.
    rationale: >-
      Callers import node names from the package. When a module splits into a `nodes/`
      subpackage, those imports must continue to work. Thus the package must export each
      public name that it exported before the split.
    relationships:
    - rel_type: refines
      spec_id: BTND-07-001
  - id: BTND-07-002
    priority: SHOULD
    kind: project
    statement: >-
      The test suite for a `nodes/` subpackage SHOULD mirror the subpackage structure: a `test/…/nodes/`
      directory with one `test_<submodule>.py` per submodule, so that each concern's tests are co-located and independently
      runnable.
    rationale: A monolithic `test_nodes.py` grows in parallel with the flat `nodes.py` and inherits the same blast-radius
      problem. Mirrored test files scope test failures to the affected concern and make it easier to add focused per-node
      unit tests.
    relationships:
    - rel_type: refines
      spec_id: BTND-07-001
    - rel_type: refines
      spec_id: CS-18-004
    verification: For any `nodes/` subpackage, confirm that a matching `test/…/nodes/` directory exists with per-submodule
      test files.
  - id: BTND-07-003
    priority: MUST
    kind: project
    statement: >-
      Each BT-bearing process area directory under `vultron/core/behaviors/` MUST keep
      its tree factory modules apart from its leaf node modules. Tree factory modules
      are the `*_tree.py` files at the area root, and they define BT composition and
      structure. Leaf node modules are the files in the `nodes/` subpackage, and they
      define BT `Behaviour` subclasses.
    rationale: 'Mixing tree factory functions and leaf node class definitions in the same module conflates two separate concerns:
      composition/structure (how the tree is assembled) and implementation/detail (what each leaf node does). Keeping them
      in separate modules makes the tree structure immediately readable without navigating past implementation details, and
      lets each concern evolve independently without cross-contaminating diffs.'
    relationships:
    - rel_type: refines
      spec_id: BTND-07-001
    verification: For each BT-bearing process area under `vultron/core/behaviors/`, confirm that `*_tree.py` modules do not
      define `Behaviour` subclasses inline (except trivial one-off composites), and that `nodes/` submodules do not define
      top-level tree factory functions.
  - id: BTND-07-004
    priority: MUST
    kind: project
    statement: >-
      Each BT leaf node module under `vultron/core/behaviors/**/nodes/` MUST stay under
      500 lines.
    rationale: Subpackage splits fail when they recreate the same god-module risk in a new file. A hard per-module cap keeps
      decomposition recursive and auditable.
    relationships:
    - rel_type: refines
      spec_id: CS-18-002
    verification: For each BT-bearing area, scan `nodes/` modules and fail compliance when any leaf module exceeds 500 lines.
  - id: BTND-07-005
    priority: MUST
    kind: project
    statement: >-
      Before implementing guard, validation, or factory-call boilerplate in a new BT leaf
      node's `update()` method, the implementer MUST search `vultron/core/behaviors/` for an
      existing base class or helper that already provides that boilerplate and inherit or reuse it.
    rationale: >-
      The most common cause of god-node `update()` methods is copy-paste of guard and
      factory-call boilerplate from prior nodes. Each copy drifts independently, accumulates line
      count, and must be fixed separately. A shared base class keeps `update()` methods to a
      single try-block orchestration with all logic in overridable hooks, satisfying BTND-07-003
      and the DRY principle simultaneously.
    relationships:
    - rel_type: refines
      spec_id: BTND-07-003
    verification: >-
      When reviewing a new or modified BT leaf node, confirm that its `update()` method does not
      re-implement boilerplate already available in a parent class or shared helper. Flag any
      inline `if self.datalayer is None`, `if self.actor_id is None`, or
      `if self.trigger_activity_factory is None` guard blocks that duplicate logic already present
      in an existing base class.
  - id: BTND-07-008
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A new BT leaf node MUST NOT re-implement `self.datalayer`, `self.actor_id`, or
      `self.trigger_activity_factory` resolution inline; `DataLayerAction` already provides these
      lookups.
    rationale: >-
      Inline resolution duplicates logic from `DataLayerAction`, drifts independently, and
      increases line count without benefit.
  - id: BTND-07-009
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A new BT leaf node that follows the standard guard + factory-dispatch + outbox-write pattern
      MUST subclass an existing emit-node base class (e.g., `_EmitCaseActorReportActivityBase`)
      and override `_call_factory()` rather than writing a new `update()` from scratch.
    rationale: >-
      Subclassing an existing emit-node base class reuses the standard pattern and ensures fixes
      and improvements propagate to all subclasses automatically.
  - id: BTND-07-010
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      If no suitable base class exists for the boilerplate pattern needed by a new BT leaf node,
      the implementer MUST extract the shared pattern into a new base class and document it for
      future reuse.
    rationale: >-
      Extracting the pattern prevents future copy-paste proliferation and makes the shared
      abstraction explicit and discoverable.
  - id: BTND-07-011
    priority: MAY
    kind: project
    statement: >-
      A BT-bearing process area MAY keep supporting files, such as `policy.py` or
      `update_support.py`, at its root beside its tree modules.
    rationale: >-
      Some area code is neither tree composition nor a leaf node, such as a policy
      table. A place at the area root keeps that code out of both kinds of module.
    relationships:
    - rel_type: refines
      spec_id: BTND-07-003
  - id: BTND-07-012
    priority: MAY
    kind: project
    statement: >-
      A `nodes/` subpackage MAY contain sub-subpackages when a semantic concern grows
      large, and each one follows the same split recursively.
    rationale: >-
      One level of `nodes/` can grow into a new god module. A deeper split by concern
      keeps each module small, and the same pattern at each depth keeps the layout
      predictable.
    relationships:
    - rel_type: refines
      spec_id: BTND-07-003
  - id: BTND-07-013
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST decompose a BT leaf node module that exceeds 500 lines into
      concern-focused modules or subpackages.
    rationale: >-
      A cap with no remedy leaves an oversized module in place. Decomposition by concern
      keeps each split module small, and it does not move the same risk into one new
      file.
    relationships:
    - rel_type: extends
      spec_id: BTND-07-004
    verification: >-
      `test_leaf_module_line_count` in `test/core/behaviors/test_btnd07_structure.py`
      fails each `nodes/` leaf module over 500 lines that its oversize ratchet does not
      list.
- id: BTND-08
  title: Positive-Precondition Condition Node Naming
  specs:
  - id: BTND-08-001
    priority: SHOULD
    kind: project
    statement: >-
      A type-dispatch guard in a `Selector(Sequence(Condition, Action), AlwaysSuccess)`
      composite SHOULD have a positive name, such as `IsFooEventNode`, returning SUCCESS
      when its condition holds.
    rationale: 'The `Selector(IsNotFoo, ApplyFoo)` pattern requires readers to mentally invert the condition to understand
      when the effect fires, and the `IsNotFoo` naming implies a guard against `Foo` when the intent is to *apply* `Foo`.  Positive-precondition
      Sequences make intent immediately readable: "if this IS a remove-embargo entry, apply embargo teardown; otherwise skip".'
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
    verification: Search `vultron/core/behaviors/` for `IsNot*Node` class definitions used as the first child of a `Selector`
      composite; flag any found.
  - id: BTND-08-002
    priority: SHOULD
    kind: project
    statement: 'The `AlwaysSuccess` fallback in a `Selector(Sequence(IsFoo, ApplyFoo), AlwaysSuccess)` composite SHOULD be given a descriptive `name` of the form `"<Effect>Skipped"` (e.g., `"EmbargoEffectsSkipped"`) so the no-op path is identifiable in BT visualizations and logs.'
    rationale: An unnamed or generically-named `AlwaysSuccess` node is invisible in tree dumps and log output, making it harder
      to trace which effect was skipped and why.  A descriptive `<Effect>Skipped` name makes the no-op path explicit and consistent
      with the existing codebase convention (e.g., `"AutoCloseSkippedNotCaseManager"`, `"ValidationSkipped"`).
    relationships:
    - rel_type: refines
      spec_id: BTND-08-001
    verification: In each `Selector(Sequence(IsFoo, ApplyFoo), AlwaysSuccess)` composite, confirm the `AlwaysSuccess` node's
      `name` ends with `"Skipped"`.
  - id: BTND-08-003
    priority: SHOULD_NOT
    kind: project
    statement: >-
      New code SHOULD NOT introduce a negative-guard condition node, such as
      `IsNotFooEventNode`, that returns SUCCESS to skip an effect and FAILURE to
      trigger it.
    rationale: >-
      A negative guard makes a reader invert the condition to see when the effect
      fires. Its name also suggests a guard against `Foo` when the intent is to apply
      `Foo`.
    relationships:
    - rel_type: extends
      spec_id: BTND-08-001
    verification: >-
      Search `vultron/core/behaviors/` for `IsNot*Node` class definitions used as the
      first child of a `Selector` composite; flag any found.
- id: BTND-09
  title: BT Error Handling Contract
  specs:
  - id: BTND-09-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT helper function MUST raise an exception on error.
    rationale: If helpers catch their own errors and return sentinels (e.g., `None`, `False`), the leaf's `update()` method
      cannot distinguish a legitimate `None` return from a hidden failure. All error information travels via Python's exception
      mechanism so that the single boundary point (`update()`) has complete diagnostic context.
    relationships:
    - rel_type: implements
      spec_id: BTND-03-006
    - rel_type: implements
      spec_id: EH-02-001
  - id: BTND-09-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      A BT helper function MUST NOT catch an exception and return a sentinel value,
      such as `None` or `False`, in its place.
    rationale: >-
      A sentinel hides the failure. The caller cannot tell a legitimate `None` from a
      failed call, and the error details are lost.
    relationships:
    - rel_type: extends
      spec_id: BTND-09-001
  - id: BTND-09-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `update()` method of the owning leaf node MUST be the sole try/except
      boundary for its helpers. It catches what they raise, writes the error result
      channel (BTND-03-006) and returns `FAILURE`.
    rationale: >-
      One boundary gives one place with full diagnostic context, which writes the
      error and sets the node status. Nested handlers split that work and can swallow
      an error.
    relationships:
    - rel_type: extends
      spec_id: BTND-09-001

- id: BTND-10
  title: BT Status-Write Node Transition Validation
  specs:
  - id: BTND-10-001
    priority: MUST
    kind: project
    statement: >-
      A BT node MUST validate that a ParticipantStatus transition
      (current_state → target_state) is permitted before it constructs or saves the new
      dimension object. This applies to a snapshot with a non-None VFD, RM or PXA
      state. A same-state write (target == current) is permitted as a status
      confirmation.
    rationale: >-
      The `transition()` methods of the dimension objects (SDO-02-002) and the
      `is_valid_*_transition()` helpers in `vultron/core/states/` enforce forward-only
      state machine rules. But code that constructs `VfDimension(state=target)` or
      `DDimension(state=target)` directly does not go through these checks. An upstream
      BT guard is necessary but not sufficient. A guard can be too weak, and some paths,
      such as the trigger path, reach the write node with no guard. When the write node
      validates, an illegal transition fails closed, whether a guard ran or not.
      Same-state writes are permitted. A ParticipantStatus snapshot records the current
      state, and a confirmation such as "still at VFd" is a correct protocol
      observation, not a transition error.
    testable: true
    preconditions:
    - description: A non-None target VFD, RM, or PXA state is passed to the write node
    steps:
    - order: 1
      actor: write_node
      action: >-
        Read the participant's current state for the dimension being written
        (e.g. resolve_participant_state_from_dl)
      expected: Current state available
    - order: 2
      actor: write_node
      action: >-
        If target == current, proceed (status confirmation). If
        is_valid_*_transition(current, target) is True, proceed. Otherwise
        return Status.FAILURE with a feedback_message identifying the illegal
        source→target pair.
      expected: Only valid forward transitions or same-state writes reach the
        DataLayer persist step; invalid jumps return FAILURE.
    postconditions:
    - description: No ParticipantStatus record with an illegal state jump is persisted
    relationships:
    - rel_type: implements
      spec_id: SDO-02-002
      note: Write-node compliance with the transition() validation contract
    - rel_type: implements
      spec_id: BTND-09-001
      note: Validation failure returns FAILURE from update(), consistent with error handling contract
    verification: >-
      Unit tests: (1) valid forward transition succeeds; (2) same-state write
      succeeds; (3) None target skips validation.
    stories:
    - story_2022_088
    - story_2022_107
  - id: BTND-10-002
    priority: MUST
    kind: architecture
    statement: >-
      The per-dimension transition rules, role gates and cross-machine entailments of
      a ParticipantStatus write MUST be composed into one evaluator that returns every
      violated rule.
    rationale: >-
      Two paths that each have their own copy of the transition checks and role gates
      drift apart. Each path enforces some rules that the other path does not, and their
      messages diverge (ARCH-15-004). When the rule set is composed one time, as
      `composite_state_violations()` does, all paths use the same rules. Shared
      individual predicates do not give that result.
    relationships:
    - rel_type: refines
      spec_id: BTND-10-001
    - rel_type: implements
      spec_id: ARCH-15-004
      note: One canonical copy of each transition and role predicate
    - rel_type: implements
      spec_id: EH-07-001
      note: Reporting every violation at a ParticipantStatus write boundary
    adr:
    - ADR-0086
    - ADR-0089
    verification: >-
      `test_shared_entry_point_delegates_to_the_evaluator` in
      `test/architecture/test_participant_status_validation.py` asserts that the shared
      entry point delegates to the one composed evaluator.
  - id: BTND-10-003
    priority: MUST
    kind: architecture
    statement: >-
      A ParticipantStatus write node MUST keep its own call to the shared evaluator,
      even when an upstream guard node validates the same write.
    rationale: >-
      BTND-10-001's fail-closed-regardless-of-guard-coverage rule is not hypothetical
      here: `CreateParticipantStatusNode` is reached from `develop_fix.py`,
      `deploy_fix.py`, `close_case_effect.py` and two sites in `leave.py` without
      passing through `ValidateTriggerTransitionsNode`, so for those paths its checks
      are the only validation. Both nodes validating cannot double-report on the
      trigger path: the guard fails first and the Sequence aborts before the write
      node ticks.
    relationships:
    - rel_type: refines
      spec_id: BTND-10-001
    - rel_type: depends_on
      spec_id: BTND-10-002
    adr:
    - ADR-0086
    verification: >-
      A write-node-only test (constructing the node directly, without the guard)
      reports every violation and persists nothing.
  - id: BTND-10-004
    priority: MUST
    kind: architecture
    statement: >-
      The ParticipantStatus write node MUST run only as a child of a behavior tree,
      never built and ticked inside another node's `update()`.
    rationale: >-
      Five sites did exactly that (`develop_fix.py`, `deploy_fix.py`,
      `close_case_effect.py` and twice in `leave.py`), producing six nested
      `update()` calls because `develop_fix.py` ticks one shared helper-built node
      from two places. A nested `update()` call skips `setup()` and the tick cycle,
      so declared ports are never resolved and the enclosing composite cannot
      observe the child's status; `deploy_fix.py` and `develop_fix.py` additionally
      wrapped the call in `try/except`, which is the failure-swallowing shape
      notes/bt-pitfalls.md documents under "Always Check
      BTBridge.execute_with_setup Return Value". Six further nodes bypassed the
      write node entirely, giving three distinct ways to perform one write. One way
      is the point: two mechanisms for one purpose must both be maintained and
      tested, and they drift (CS-22-001).
    relationships:
    - rel_type: depends_on
      spec_id: BTND-10-002
    - rel_type: implements
      spec_id: ARCH-15-004
      note: One canonical way to reach the single writer
    adr:
    - ADR-0089
    testable: true
    verification: >-
      An architecture ratchet asserts that `CreateParticipantStatusNode` is never
      constructed within a function whose enclosing scope is another Behaviour's
      `update()`.
  - id: BTND-10-005
    priority: MUST
    kind: architecture
    statement: >-
      The ParticipantStatus write node MUST obtain `case_id` from its declared
      blackboard port, never from a constructor argument.
    rationale: >-
      A port is the only way to supply `case_id` that works in all trees. In received
      trees, the tree finds the case at tick time from the report, so the case is not
      known at build time. Trees that know the case at build time seed `/case_id`
      through `BTBridge.execute_with_setup(**context_data)`. Thus one mechanism serves
      both.
    relationships:
    - rel_type: depends_on
      spec_id: BTND-10-004
    adr:
    - ADR-0089
    testable: true
    verification: >-
      `test_create_participant_status_node_has_no_case_id_constructor` in
      `test/architecture/test_participant_status_validation.py` asserts that the write
      node takes `case_id` from its `CaseIdInputPortMixin` port, with no `case_id`
      constructor parameter.
  - id: BTND-10-006
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT persist report-scoped RM state from before a case exists
      as a ParticipantStatus.
    rationale: >-
      RM state begins at report receipt, and the case may never exist: a receiver may
      declare a bare report INVALID or CLOSED and never propose a case. That state was
      held in a standalone ParticipantStatus keyed on (actor, report, rm_state) and
      used as an existence latch, which gave the type two jobs and therefore made a
      single writer impossible. The two jobs were also already entangled:
      `_build_owner_initial_status()` reused the latch's *id* as the participant's
      first ladder rung, and `_get_or_create_accepted_status()` mutated the stored
      record in place. `VultronReportCaseLink` already exists for precisely this
      window (ADR-0041) and is the report-scoped record, so relocating the state there
      leaves ParticipantStatus ladder-only — and leaves the writer always holding a
      case, which is why no further case-absence disposition (ADR-0087) is required.
    relationships:
    - rel_type: depends_on
      spec_id: BTND-10-002
    adr:
    - ADR-0089
    - ADR-0041
    testable: true
    verification: >-
      A ratchet asserts `_report_phase_status_id`, `report_phase_context` and
      `_current_report_phase_rm_state` are absent from the tree, and a unit test
      asserts that a receiver that declares a bare report INVALID writes no
      ParticipantStatus.
  - id: BTND-10-007
    priority: MUST
    kind: project
    statement: >-
      When that validation finds an illegal jump or a backward move, the write node
      MUST return Status.FAILURE with a descriptive feedback_message. An example
      illegal jump is vfd → VFD, which skips Vfd.
    rationale: >-
      A failed write must fail closed and say why. The feedback_message names the
      illegal source and target pair, so a reader can find the bad request without a
      debugger.
    relationships:
    - rel_type: extends
      spec_id: BTND-10-001
    verification: >-
      `test_write_node_validates_without_the_trigger_guard` in
      `test/core/use_cases/triggers/case/test_add_participant_status.py` asserts that
      skip jumps make the write node return `FAILURE` and name each in its
      `feedback_message`; `test_backwards_rm_transition_fails` in
      `test/core/behaviors/status/test_add_participant_status_bt.py` asserts `FAILURE`
      for a backward RM move.
  - id: BTND-10-008
    priority: MAY
    kind: project
    statement: >-
      On the receive side, a dimension MAY reach the write node with adjacency
      validation relaxed when the CASE_MANAGER already accepted it under RSH-09 or
      RSH-06. This includes a non-adjacent forward RM move (RSH-06-006). The write
      boundary still refuses a backward move.
    rationale: >-
      The CASE_MANAGER admits any forward move that a participant reports (RSH-09).
      A write node that applied adjacency again would refuse a move that the case
      already accepted. The forward-only rule still holds at the write boundary.
    relationships:
    - rel_type: refines
      spec_id: BTND-10-001
  - id: BTND-10-009
    priority: MUST
    kind: architecture
    statement: >-
      Every writer of a ParticipantStatus, not only every node that validates one,
      MUST call that evaluator instead of the individual `is_valid_*_transition()` or
      `violation_*` predicates.
    rationale: >-
      Two paths that each have their own copy of the transition checks and role gates
      drift apart (ARCH-15-004). The rule applies to every writer, not to every
      validator (ADR-0089). Otherwise a writer that validates nothing, or a writer that
      is not a node, is not covered. This check does not find the wire projection
      (`as_CaseParticipant.append_rm_state`), which builds `as_ParticipantStatus` from
      flat fields. That code needs its own check.
    relationships:
    - rel_type: extends
      spec_id: BTND-10-002
    adr:
    - ADR-0086
    - ADR-0089
    verification: >-
      `test_validating_nodes_do_not_call_individual_predicates` and
      `test_validating_nodes_call_the_shared_entry_point` in
      `test/architecture/test_participant_status_validation.py` assert that no node
      that validates a ParticipantStatus write calls the individual predicates.
  - id: BTND-10-010
    priority: MUST
    kind: architecture
    statement: >-
      Every writer of a ParticipantStatus MUST report every violation that the
      evaluator returns.
    rationale: >-
      A writer that reports only the first violation hides the rest. The sender then
      fixes one problem, retries, and meets the next one (EH-07-001).
    relationships:
    - rel_type: extends
      spec_id: BTND-10-002
    - rel_type: implements
      spec_id: EH-07-001
    adr:
    - ADR-0086
    verification: >-
      `test_write_node_validates_without_the_trigger_guard` (the write node) and
      `test_trigger_path_reports_every_violation_and_persists_nothing` (the trigger
      guard), both in
      `test/core/use_cases/triggers/case/test_add_participant_status.py`, assert that a
      request invalid in RM and PXA reports both violations.
  - id: BTND-10-011
    priority: MUST
    kind: architecture
    statement: >-
      The ParticipantStatus write node MUST take the subject actor only as an explicit
      argument, never from the executing actor on the blackboard.
    rationale: >-
      The blackboard `actor_id` is the executing actor, and the subject of the write is
      often a different actor, such as the deferring actor, the sender or the leaver. A
      fallback writes the status onto the wrong participant, and no error shows. It
      also gives the node two paths, and each path needs its own tests.
    relationships:
    - rel_type: extends
      spec_id: BTND-10-005
    adr:
    - ADR-0089
    verification: >-
      `test_report_phase_rm_transition_has_no_blackboard_actor_fallback` in
      `test/architecture/test_participant_status_validation.py` asserts that the
      report-phase RM writer has no fallback from its subject actor to the blackboard
      `actor_id`.
  - id: BTND-10-012
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST record report-scoped RM state from before a case exists on the
      report's `ReportCaseLink`.
    rationale: >-
      RM state begins at report receipt, and the case may never exist.
      `ReportCaseLink` is the report-scoped record for that window (ADR-0041). With the
      state there, ParticipantStatus holds only the case ladder, and its writer always
      has a case.
    relationships:
    - rel_type: extends
      spec_id: BTND-10-006
    adr:
    - ADR-0041
    verification: >-
      `test_transition_rm_to_invalid_sets_link_rm_state` in
      `test/core/behaviors/report/nodes/test_rm_transitions.py` asserts that declaring
      a bare report INVALID records that state on its ReportCaseLink.
