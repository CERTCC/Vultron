id: VAM
title: Vultron Semantic–AS2 Mapping
description: Defines the authoritative mapping from each Vultron semantic message type (MessageSemantics enum value) to its
  ActivityStreams 2.0 wire representation. This is the single source of truth for how Vultron domain semantics are encoded
  as AS2 activity structures, isolating transport and wire-encoding concerns from the core domain logic and case-state machines.
scope:
- prototype
- production
tags:
- messaging
- wire-format
groups:
- id: VAM-01
  title: General Mapping Conventions
  specs:
  - id: VAM-01-001
    priority: MUST
    kind: project
    statement: Every `MessageSemantics` enum value except the `UNKNOWN` and `UNKNOWN_UNRESOLVABLE_OBJECT` sentinels MUST have
      exactly one entry in `SEMANTIC_REGISTRY` carrying a non-`None` `pattern` that defines its AS2 wire representation
    rationale: >-
      A semantic type with no pattern can never be extracted from a received activity.
      Its use case never runs, and every activity of that type is classified as unknown.
      One entry for each type gives the type one wire form, so two entries cannot
      disagree about it. The two sentinels name the results of a failed match, so they
      have no wire form.
    verification: A unit test confirms that every `MessageSemantics` value except `UNKNOWN` and
      `UNKNOWN_UNRESOLVABLE_OBJECT` has a non-None `pattern` in `SEMANTIC_REGISTRY`.
  - id: VAM-01-002
    priority: MUST
    kind: project
    statement: >-
      The AS2 activity patterns defined in this document MUST be implemented as
      `ActivityPattern` objects in `vultron/wire/as2/extractor/_instances.py`.
    rationale: >-
      The registry modules import their patterns from one module. A reader can then see
      every wire form in one file, and no registry module builds its own copy of a form
      that can drift from the form this document defines.
    verification: >-
      `test/architecture/test_activity_patterns_defined_in_instances.py` confirms that no
      module under `vultron/` other than `_instances.py` constructs an `ActivityPattern`.
  - id: VAM-01-002b
    priority: MUST_NOT
    kind: project
    statement: >-
      AS2 activity pattern objects MUST NOT be defined in any module other than
      `vultron/wire/as2/extractor/_instances.py`.
    rationale: >-
      A pattern built in another module is not in the file where a reader looks for the
      wire forms. It can also match a different shape from the pattern that
      `_instances.py` defines for the same form, and nothing compares the two.
    verification: >-
      `test/architecture/test_activity_patterns_defined_in_instances.py` confirms that no
      module under `vultron/` other than `_instances.py` constructs an `ActivityPattern`.
    relationships:
    - rel_type: refines
      spec_id: VAM-01-002
  - id: VAM-01-003
    priority: MUST
    kind: project
    statement: Pattern entries in `SEMANTIC_REGISTRY` MUST be ordered from most-specific to least-specific so that
      `find_matching_semantics()` returns the correct semantic for overlapping patterns
    rationale: >-
      `find_matching_semantics()` returns the first pattern that matches. When a general
      pattern comes before a specific pattern that it also covers, the specific semantic
      type never matches, and the wrong use case runs with no error.
      `_validate_registry_order()` raises `RegistryOrderError` at import for each such
      order that it can detect.
    verification: Inspection of `vultron/semantic_registry/__init__.py` confirms that `_validate_registry_order()`
      is called at module load time and raises `RegistryOrderError` if a less-specific pattern precedes a
      more-specific one in the same activity-type group.
  - id: VAM-01-004
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms semantic extraction rehydrates an activity before pattern
      matching and that no pattern discriminates on an unhydrated string field.
    statement: An AS2 activity MUST be rehydrated (URI string references expanded to full objects via the DataLayer) before
      pattern matching; pattern matching MUST NOT rely on unhydrated string fields for type discrimination
    rationale: >-
      A URI string carries no type. A pattern that reads the type of an unhydrated field
      cannot tell, for example, an `Offer` of a report from an `Offer` of a case.
      Rehydration gives each field its full object, so the type that the pattern reads
      is the type of the object.
  - id: VAM-01-005
    priority: MUST
    kind: project
    statement: When a pattern specifies a nested activity as the `object` field, the outer activity's `object` MUST be a fully
      rehydrated AS2 activity object matching the inner `ActivityPattern`
    rationale: >-
      Many semantic types differ only in the activity that they wrap, such as
      `Accept(Invite(Event))` and `Accept(Offer(VulnerabilityReport))`. Only the type
      and fields of the inner activity tell them apart, so the inner activity must be a
      full object that the inner pattern can match.
    verification: A unit test confirms that `ActivityPattern.match()` recurses into a nested `ActivityPattern`
      for the `object_` field, requiring the outer activity's rehydrated `object_` to satisfy the inner
      pattern's type and field constraints.
  - id: VAM-01-006
    priority: MUST
    kind: project
    statement: 'Pattern matching MUST be conservative when a non-`object_` field is a non-rehydratable URI string: such a
      field MUST be treated as matching any expected type rather than failing the match'
    rationale: Peripheral reference fields (`actor`, `target`, `context`, etc.) do not drive semantic dispatch; conservatively
      matching them avoids false negatives when the DataLayer cannot expand every reference
    verification: A unit test confirms that a URI string in a non-`object_` field (e.g., `actor`) does not cause
      `ActivityPattern.match()` to return `False`, preserving pattern matches when peripheral references are
      not rehydratable.
  - id: VAM-01-009
    priority: MUST
    kind: project
    statement: >-
      `find_matching_semantics()` MUST return
      `MessageSemantics.UNKNOWN_UNRESOLVABLE_OBJECT` when no pattern matches an
      activity of a registered verb whose object chain ends in a bare URI. The
      chain is the activity's `object_`, followed through each inline activity
      it holds, as rehydration left it.
    rationale: >-
      `UNKNOWN_UNRESOLVABLE_OBJECT` is the specific signal for a known activity
      type whose object could not be resolved: it separates a data gap, which may
      resolve later, from an activity no pattern describes.
    verification: >-
      Tests marked `VAM-01-009` confirm that `find_matching_semantics()` returns
      `MessageSemantics.UNKNOWN_UNRESOLVABLE_OBJECT` for an `Accept` whose
      `object_` is a bare string URI that no pattern matches, for an
      `Accept(Invite)` whose Invite's `object_` is one, and for an
      `Undo(Offer(Offer))` and an `Undo(Accept(Invite))` whose innermost
      `object_` is one; `test_a_bare_object_two_activities_deep_is_the_one_fetched`
      confirms the fetch names that innermost id.
  - id: VAM-01-012
    priority: MUST_NOT
    kind: project
    statement: >-
      A scalar `object_` constraint MUST NOT match a bare URI still unresolved after
      rehydration, unless its `ActivityPattern` sets `accepts_bare_object=True`.
    rationale: >-
      `accepts_bare_object` is how this codebase marks the exception SE-01-006
      allows: a pattern that a field other than the object's type tells apart, as
      `ledgerPosition` tells apart the `Read(CaseLedgerEntry)` position statement of
      SYNC-17-001, which names its entry by id.
    verification: >-
      Unit tests marked `VAM-01-012` confirm that a default `Offer(VulnerabilityCase)`
      pattern does not match an `Offer` whose `object_` is an unresolved bare string
      URI, and that the same pattern with `accepts_bare_object=True` does.
    relationships:
    - rel_type: implements
      spec_id: SE-01-006
  - id: VAM-01-013
    priority: MUST
    kind: project
    statement: >-
      `ActivityPattern.strict` MUST govern only the `target_` constraint, leaving how
      the pattern matches `object_` unchanged.
    rationale: >-
      Once `object_` is strict by default (SE-01-006), `strict` is the tool SE-08-004
      names for a pattern whose `target_` is its sole discriminator. Building a
      strict pattern with no `target_` raises, since the flag would tighten nothing.
    verification: >-
      Unit tests marked `VAM-01-013` confirm that a strict pattern refuses a bare
      `target` that a lenient one accepts, that `strict` leaves the `object_` match
      unchanged, and that building a strict pattern with no `target_` raises.
    relationships:
    - rel_type: implements
      spec_id: SE-08-004
  - id: VAM-01-007
    priority: MUST
    kind: project
    statement: >-
      `MessageSemantics.UNKNOWN` MUST be returned when no registered pattern
      matches the incoming activity, except where VAM-01-009 requires
      `MessageSemantics.UNKNOWN_UNRESOLVABLE_OBJECT`
    rationale: >-
      A received activity needs one defined result even when no pattern describes it.
      `UNKNOWN` gives the inbox a value that it can refuse and log, in place of an
      exception or a guess at the nearest semantic type.
    verification: A unit test (`test_find_matching_semantics_returns_unknown_for_unmatched_activity`) in
      `test/wire/as2/test_extractor.py` confirms that `find_matching_semantics()` returns
      `MessageSemantics.UNKNOWN` for an activity matching no registered pattern.
  - id: VAM-01-008
    priority: MUST
    kind: protocol
    statement: Inbound activities represent state-change notifications, not commands; the AS2 activity type used for each
      semantic MUST reflect the completed state transition, not a requested action
    rationale: >-
      Each activity reports an act that the sender has already performed, such as an
      Offer it made or an Invite it sent, and not an act it asks the receiver to
      perform. If an activity stated a requested action, the receiver could not know
      whether the sender's state had changed, and two participants could record
      different states for the same case. A completed-action type makes each message
      match the change that it reports.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that every registered
      `ActivityPattern` uses a completed-action activity type (e.g., `Create`, `Accept`, `Reject`) and that
      no imperative or request-type activity variant appears in any pattern.
    lint_suppress:
    - missing_story_reference
  - id: VAM-01-010
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST send a `CaseStatus` or a `ParticipantStatus` inline on the
      single `Add` that attaches it (VAM-08-002, VAM-08-004), MUST send a `Note`
      inline on the single `Add(Note)` that attaches it (VAM-07-002), and MUST send a
      proposed `EmbargoEvent` inline on the `Invite` that proposes it (VAM-05-005). An
      inbox MUST refuse a received `Create(CaseStatus)`, `Create(ParticipantStatus)` or
      `Create(Note)` as an unrecognized activity, and MUST report a received
      `Create(CaseParticipant)` or `Create(EmbargoEvent)`, each the CASE_MANAGER's own
      record of a creation (VAM-05-016), as "no use case found" (SE-05-002, ADR-0140).
      Only a `Create` whose object is an `EmbargoEvent` is recognized: a `Create` of
      any other `Event` is refused as an unrecognized activity.
    rationale: >-
      VAM-01-011 leaves to the receiver how to handle a stray `Create`, and this item is
      the answer of this codebase. A `Create` stored with no ledger entry would change
      the case file outside the ledger (CLP-07-013), and `Create(Note)` would be a
      second way to attach a note (ADR-0137). `Create(CaseParticipant)` and
      `Create(EmbargoEvent)` are ledger records of the CASE_MANAGER that a replica
      copies from the ledger (ADR-0124). A received `Invite` can still name its terms by
      URI (ADR-0123).
    verification: >-
      In `test/wire/as2/vocab/test_actvitities/test_object_types.py`, the
      `test_rejects_string` and `test_rejects_link` tests of
      `TestAddStatusToCaseActivity`, `TestAddStatusToParticipantActivity` and
      `TestAddNoteToCaseActivity` confirm that each status `Add` and the note `Add`
      refuse an object given by reference. For the note emitters,
      `test_one_add_note_queued_in_outbox` in
      `test/core/use_cases/triggers/test_note_trigger.py` confirms that the add-note
      trigger sends one `Add(Note)` with the note inline and the case as `target`.
      `test_gap_anomaly_records_note`, `test_regression_anomaly_records_note` and
      `test_a_failed_teardown_is_reported_in_a_note` in
      `test/core/behaviors/status/test_add_participant_status_bt.py` and
      `test_note_travels_inline_on_the_add` in
      `test/core/behaviors/case/nodes/test_suggest_actor_owner_recipient.py` confirm
      the same for each CASE_MANAGER note, whose `Add(Note)` the CASE_MANAGER commits
      as its own entry rather than sends (#4829).
      `test_em_propose_embargo_refuses_terms_by_uri` in
      `test/wire/as2/factories/test_embargo_factories.py` confirms that the proposal
      factory refuses terms given by URI. The parametrized test
      `test_received_create_of_a_case_record_is_refused_case_unchanged` in
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` confirms that each
      of the received `Create` activities, including `Create(Note)` with and without a
      case `context`, resolves to `UNKNOWN` and is refused, and that the case, the
      ledger and the outbox stay unchanged.
      `test_a_received_case_manager_act_is_recognized_and_unhandled` in the same file
      confirms that a received `Create(CaseParticipant)` or `Create(EmbargoEvent)` is
      recognized, reported unhandled, and changes nothing, and
      `test_received_create_of_a_case_record_is_refused_case_unchanged` confirms that
      a received `Create` of a plain `Event` is refused as unrecognized.
    relationships:
    - rel_type: refines
      spec_id: VAM-01-011
      note: this codebase's inline sending and refusal of the Create forms
    - rel_type: implements
      spec_id: VAM-08-002
    - rel_type: implements
      spec_id: VAM-08-004
    - rel_type: implements
      spec_id: VAM-05-005
    - rel_type: implements
      spec_id: VAM-07-002
    adr:
    - ADR-0137
  - id: VAM-01-011
    priority: MUST
    kind: protocol
    adr:
    - ADR-0137
    statement: >-
      A `CaseStatus` MUST be brought into a case only by the `Add(CaseStatus)` that
      attaches it (VAM-08-002), a `ParticipantStatus` only by the
      `Add(ParticipantStatus)` that attaches it (VAM-08-004), a proposed
      `EmbargoEvent` only by the `Invite` that proposes it (VAM-05-005), and a `Note`
      only by the `Add(Note)` that attaches it (VAM-07-002); each carries its object
      inline or by reference. A `CaseParticipant` MUST come into existence only as the
      CASE_MANAGER's consequence of an act it records. A received `Create` whose
      object is a `CaseStatus`, a `ParticipantStatus`, an `EmbargoEvent`, a
      `CaseParticipant` or a `Note` is not a protocol message, and its receiver MUST
      NOT change the case file because of it.
    rationale: >-
      These records mean nothing apart from their case, so a separate `Create` would
      add a "created but not attached" state needing its own ledger entry and replica
      step (CLP-07-013, RSH-08-004) for no gain (ADR-0137). A `Create(Note)`, with
      or without a case `context`, is a deferred form recorded as an open question
      (MS-18-001). These records get one attaching message each. The `Create` a
      CASE_MANAGER ledger entry carries as its payload snapshot records a change; it
      is not a received message.
    stories:
    - story_2022_088
    - story_2022_045
    - story_2022_014
    verification: >-
      The parametrized test
      `test_received_create_of_a_case_record_is_refused_case_unchanged` in
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` sends each of the
      `Create` activities, including `Create(Note)` with and without a case
      `context`, to an inbox and confirms that the case, the ledger and the outbox
      stay unchanged.
    relationships:
    - rel_type: constrains
      spec_id: VAM-08-002
      note: the Add(CaseStatus) is the only way a case status enters a case
    - rel_type: constrains
      spec_id: VAM-08-004
      note: the Add(ParticipantStatus) is the only way a participant status enters a case
    - rel_type: constrains
      spec_id: VAM-05-005
      note: the Invite is the only way a proposed embargo event enters a case
    - rel_type: constrains
      spec_id: VAM-07-002
      note: the Add(Note) is the only way a note enters a case
- id: VAM-02
  title: Report Management Messages
  specs:
  - id: VAM-02-001
    priority: MUST
    kind: protocol
    statement: '`CREATE_REPORT` MUST be represented as `Create(VulnerabilityReport)`'
    rationale: >-
      A report is a new object, and AS2 records a new object with `Create`. The sender
      and every receiver must use the same wire form, or a receiver classifies the
      activity as unknown.
    verification: A unit test in `test/wire/as2/test_extractor.py` confirms that `find_matching_semantics()`
      returns `CREATE_REPORT` for a `Create(VulnerabilityReport)` activity, and inspection of `_instances.py`
      confirms `CreateReportPattern` matches this shape.
    stories:
    - story_2022_012
    - story_2022_002
  - id: VAM-02-002
    priority: MUST
    kind: protocol
    statement: '`SUBMIT_REPORT` MUST be represented as `Offer(VulnerabilityReport)`'
    rationale: >-
      To submit a report is to give it to a receiver for a decision, which is what an
      AS2 `Offer` means. The receiver answers the same `Offer` with `Read`, `Accept`,
      `TentativeReject` or `Reject` (VAM-02-003 to VAM-02-006), so each answer wraps the
      submission that it answers.
    note: >-
      The Offer MAY carry the Reporter's proposed embargo terms as `proposedEmbargo`, an inline
      `EmbargoEvent` whose `context` is the report (EP-04-004, EP-04-009, ADR-0096). The field is
      declared on the base `as_Offer` because an inbound Offer is reconstructed as the base class,
      and an undeclared key would be dropped silently. It does not change dispatch: `SubmitReportPattern`
      keys on the activity and object types only.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `SubmitReportPattern`
      is registered as `Offer(VulnerabilityReport)`; integration tests in `test/demo/` exercise the full
      report-submission flow end-to-end. `test/wire/as2/test_report_offer_proposed_embargo.py` confirms
      the optional `proposedEmbargo` survives the inbound parse and is surfaced by extraction.
      `test/test_semantic_activity_patterns.py::test_wire_form_examples_map_to_their_semantics`
      asserts that the `submit_report` vocabulary example extracts as this semantic type.
    stories:
    - story_2022_012
  - id: VAM-02-003
    priority: MUST
    kind: protocol
    statement: '`ACK_REPORT` MUST be represented as `Read(Offer(VulnerabilityReport))`'
    rationale: >-
      An acknowledgement says only that the receiver has the report, not that it has
      judged the report. AS2 `Read` states that an actor has seen an object, so the
      Reporter gets a receipt that it cannot confuse with a validation.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `AckReportPattern`
      is registered as `Read(Offer(VulnerabilityReport))`; integration tests in `test/demo/` exercise the
      full acknowledgement flow.
    stories:
    - story_2022_016
    - story_2022_002
  - id: VAM-02-004
    priority: MUST
    kind: protocol
    statement: >-
      `VALIDATE_REPORT` MUST be represented as `Accept(Offer(VulnerabilityReport))`.
      This is the direct report recipient's RV; a participant that joined through an
      Invite sends RV as the full-case Invite reply of VAM-04-012.
    rationale: >-
      Validation is the receiver's answer to the submitted `Offer`, so it wraps that
      `Offer`. A participant that joined through an Invite never received the `Offer`,
      so it answers the full-case Invite instead (ADR-0121). The two forms differ in
      their inner object, so a receiver tells them apart by shape.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `ValidateReportPattern`
      is registered as `Accept(Offer(VulnerabilityReport))`; integration tests in `test/demo/` exercise the
      full report-validation flow.
    adr:
    - ADR-0121
    stories:
    - story_2022_012
  - id: VAM-02-005
    priority: MUST
    kind: protocol
    statement: >-
      `INVALIDATE_REPORT` MUST be represented as
      `TentativeReject(Offer(VulnerabilityReport))`. This is the direct report
      recipient's RI; a participant that joined through an Invite sends RI as the
      full-case Invite reply of VAM-04-013.
    rationale: >-
      `TentativeReject` says that the receiver does not accept the report now but keeps
      it open. That matches RM Invalid, from which a report can still become Valid. A
      `Reject` would read as final and is the form of the close in VAM-02-006.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `InvalidateReportPattern`
      is registered as `TentativeReject(Offer(VulnerabilityReport))`; integration tests in `test/demo/` exercise
      the full report-invalidation flow.
    adr:
    - ADR-0121
    stories:
    - story_2022_101
    - story_2022_006
  - id: VAM-02-006
    priority: MUST
    kind: protocol
    statement: >-
      `CLOSE_REPORT` MUST be represented as `Reject(Offer(VulnerabilityReport))`. This
      is the direct report recipient's RC; a participant that joined through an Invite
      sends RC as the full-case Invite reply of VAM-04-014.
    rationale: >-
      A close ends the receiver's work on the report, so the answer is a final `Reject`
      of the submitted `Offer`. Its activity type, `Reject` and not `TentativeReject`,
      tells it apart from an invalidation (VAM-02-005).
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `CloseReportPattern` is registered as `Reject(Offer(VulnerabilityReport))`;
      `test/wire/as2/factories/test_report_factories.py` builds that wire form, and
      `test/core/use_cases/received/test_close_report_on_case.py` receives it.
    adr:
    - ADR-0121
    stories:
    - story_2022_066
    - story_2022_006
- id: VAM-03
  title: Case Management Messages
  specs:
  - id: VAM-03-001
    priority: MUST
    kind: protocol
    statement: '`CREATE_CASE` MUST be represented as `Create(VulnerabilityCase)`'
    rationale: >-
      A case is a new object, and AS2 records a new object with `Create`. One wire form
      lets every receiver classify the creation of a case by shape.
    verification: A unit test in `test/wire/as2/test_extractor.py` confirms that `extract_event()` correctly
      handles `Create(VulnerabilityCase)`, and inspection of `_instances.py` confirms `CreateCasePattern`
      matches this shape.
    stories:
    - story_2022_012
  - id: VAM-03-003
    priority: MUST
    kind: protocol
    statement: '`ENGAGE_CASE` MUST be represented as `Join(VulnerabilityCase)`'
    rationale: >-
      Engage and defer are the two answers that a participant gives about its own work
      on a case. AS2 `Join` and `Ignore` (VAM-03-004) state those two answers, and both
      have the case as their object, so a receiver tells them apart by activity type
      alone.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `EngageCasePattern`
      is registered as `Join(VulnerabilityCase)`; integration tests in `test/demo/` exercise the
      engage-case flow.
    stories:
    - story_2022_006
    - story_2022_013
  - id: VAM-03-004
    priority: MUST
    kind: protocol
    statement: '`DEFER_CASE` MUST be represented as `Ignore(VulnerabilityCase)`'
    rationale: >-
      A defer says that the participant sets the case aside but stays in it. AS2
      `Ignore` states that. It differs from `Leave` (VAM-03-006), which ends the
      participant's part in the case.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `DeferCasePattern`
      is registered as `Ignore(VulnerabilityCase)`; integration tests in `test/demo/` exercise the
      defer-case flow.
    stories:
    - story_2022_006
    - story_2022_086
  - id: VAM-03-005
    priority: MUST
    kind: protocol
    statement: '`ADD_REPORT_TO_CASE` MUST be represented as `Add(VulnerabilityReport)[target=VulnerabilityCase]`'
    rationale: >-
      A report is attached to a case that already exists, so the message is an `Add`
      with the case as its `target`. The `target` tells a receiver which case the report
      goes into.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `AddReportToCasePattern`
      uses `TAtype.ADD`, `AOtype.VULNERABILITY_REPORT`, and `target_=VULNERABILITY_CASE`; integration tests
      in `test/demo/` exercise this flow.
    stories:
    - story_2022_012
    - story_2022_104
  - id: VAM-03-006
    priority: MUST
    kind: protocol
    statement: '`CLOSE_CASE` MUST be represented as `Leave(VulnerabilityCase)`'
    rationale: >-
      A close ends the participant's part in the case, which is what AS2 `Leave` means.
      Its object, the case and not an `EmbargoEvent`, tells it apart from a withdrawal
      from an embargo, which is also a `Leave` (VAM-05-011).
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `CloseCasePattern` is registered as `Leave(VulnerabilityCase)`; integration tests
      in `test/demo/test_manage_case_demo.py` exercise the close-case flow.
      `test_wire_form_examples_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the `close_case`
      vocabulary example maps to `CLOSE_CASE`.
    stories:
    - story_2022_066
    - story_2022_067
  - id: VAM-03-007
    priority: MUST
    kind: protocol
    statement: >-
      `UPDATE_CASE_OWNER` MUST be represented as `Update(VulnerabilityCase)`, carrying
      the case with its new owner in `attributedTo`. Only the CASE_MANAGER sends it,
      as its own act on an accepted ownership transfer (CM-21-002), and it is not
      handled on receipt (SE-05-002, ADR-0140).
    rationale: >-
      An entry's semantic type is the registry's label for its payload (ADR-0140), so
      the CASE_MANAGER's own case-field change needs a registry entry of its own.
    verification: >-
      `test_case_manager_acts_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the `update_case`
      example maps to `UPDATE_CASE_OWNER`.
    relationships:
    - rel_type: satisfies
      spec_id: CM-21-002
    adr:
    - ADR-0140
    stories:
    - story_2022_050
- id: VAM-04
  title: Actor Suggestion and Invitation Messages
  specs:
  - id: VAM-04-001
    priority: MUST
    kind: protocol
    statement: '`OFFER_ACTOR_TO_CASE` MUST be represented as `Offer(Actor)[target=VulnerabilityCase]`'
    rationale: >-
      This is the first message of the actor-suggestion exchange: a participant suggests
      an Actor to the CASE_MANAGER. A suggestion names only an actor (CM-16-001,
      CM-16-003), so the object is the Actor itself. The pattern names cross:
      `SuggestActorToCasePattern` is bound to `OFFER_ACTOR_TO_CASE`, and
      `OfferActorToCasePattern` is bound to `OFFER_CASE_PARTICIPANT` (VAM-04-010).
    verification: >-
      Inspection of `vultron/semantic_registry/actor.py` confirms that
      `MessageSemantics.OFFER_ACTOR_TO_CASE` is keyed to `SuggestActorToCasePattern`,
      which uses `TAtype.OFFER`, `AOtype.ACTOR`, and `target_=VULNERABILITY_CASE`;
      integration tests in `test/demo/test_suggest_actor_demo.py` exercise this flow.
      `test_actor_suggestion_is_two_offers_over_different_objects` in
      `test/test_message_semantics_mapping.py` confirms that the pattern bound to
      `OFFER_ACTOR_TO_CASE` is an `Offer` of an `Actor` with a `VulnerabilityCase`
      target.
    stories:
    - story_2022_053
    - story_2022_013
  - id: VAM-04-002
    priority: MUST
    kind: protocol
    statement: '`ACCEPT_OFFER_CASE_PARTICIPANT` MUST be represented as
      `Accept(Offer(CaseParticipant)[target=VulnerabilityCase])`'
    rationale: >-
      The Case Owner decides on the CASE_MANAGER's `Offer(CaseParticipant)`
      (VAM-04-010), which carries the proposed roles, so its `Accept` wraps that offer
      and not the first `Offer(Actor)`. The inner object type tells this `Accept` apart
      from the CASE_MANAGER's answer to the recommender (VAM-04-016). See CM-16-003,
      CM-16-004 and ADR-0026.
    verification: >-
      Inspection of `vultron/semantic_registry/actor.py` confirms that
      `MessageSemantics.ACCEPT_OFFER_CASE_PARTICIPANT` is keyed to
      `AcceptActorRecommendationPattern`, whose nested sub-pattern has
      `object_=CASE_PARTICIPANT` rather than `ACTOR`; integration tests in
      `test/demo/test_suggest_actor_demo.py` exercise this flow.
      `test_actor_suggestion_accept_reject_wrap_the_participant_offer` in
      `test/test_message_semantics_mapping.py` confirms that the pattern bound to
      `ACCEPT_OFFER_CASE_PARTICIPANT` is an `Accept` that wraps an `Offer` of a
      `CaseParticipant`.
    stories:
    - story_2022_054
  - id: VAM-04-003
    priority: MUST
    kind: protocol
    statement: '`REJECT_OFFER_CASE_PARTICIPANT` MUST be represented as
      `Reject(Offer(CaseParticipant)[target=VulnerabilityCase])`'
    rationale: >-
      As in VAM-04-002, the Case Owner's `Reject` wraps the CASE_MANAGER's
      `Offer(CaseParticipant)` and not the first `Offer(Actor)`. The inner object type
      tells it apart from the CASE_MANAGER's answer to the recommender (VAM-04-017).
    verification: >-
      Inspection of `vultron/semantic_registry/actor.py` confirms that
      `MessageSemantics.REJECT_OFFER_CASE_PARTICIPANT` is keyed to
      `RejectActorRecommendationPattern`, whose nested sub-pattern has
      `object_=CASE_PARTICIPANT`; integration tests in
      `test/demo/test_suggest_actor_demo.py` exercise this flow.
      `test_actor_suggestion_accept_reject_wrap_the_participant_offer` in
      `test/test_message_semantics_mapping.py` confirms that the pattern bound to
      `REJECT_OFFER_CASE_PARTICIPANT` is a `Reject` that wraps an `Offer` of a
      `CaseParticipant`.
    stories:
    - story_2022_054
  - id: VAM-04-004
    priority: MUST
    kind: protocol
    statement: >-
      `INVITE_ACTOR_TO_CASE` (the stub Invite) MUST be represented as
      `Invite(Actor)[target=VulnerabilityCaseStub]`, with the stub shaped as CM-11-013
      requires.
    rationale: >-
      An invitee has not yet joined the case, so the Invite carries a stub that
      stands for the case (ADR-0114). The stub has its own type (CM-11-013), so a
      receiver tells the stub Invite from the full-case Invite (VAM-04-011) by the
      `type` of the `target`, with no lookup.
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `InviteActorToCasePattern` uses `TAtype.INVITE`, `object_=ACTOR` and a
      `VulnerabilityCaseStub` target; integration tests in
      `test/demo/test_invite_actor_demo.py` exercise this flow.
      `test_only_a_stub_invite_matches_the_stub_invite_pattern` and
      `test_invite_actor_to_case_matches_all_actor_subtypes` in
      `test/test_semantic_activity_patterns.py` confirm that an `Invite` of an actor
      with a stub target matches the stub Invite pattern.
    adr:
    - ADR-0114
    stories:
    - story_2022_013
    - story_2022_052
  - id: VAM-04-005
    priority: MUST
    kind: protocol
    statement: >-
      `ACCEPT_INVITE_ACTOR_TO_CASE` MUST be represented as
      `Accept(Invite(Actor)[target=VulnerabilityCaseStub])`
    rationale: >-
      The invitee answers the Invite that it received, so its `Accept` wraps that
      Invite. The stub `target` tells this `Accept` apart from the RV reply to the
      full-case Invite (VAM-04-012).
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AcceptInviteActorToCasePattern` wraps `InviteActorToCasePattern` inside an
      `Accept` outer pattern; integration tests in `test/demo/test_invite_actor_demo.py`
      exercise this flow. `test_accept_invite_actor_to_case_matches_all_actor_subtypes`
      in `test/test_semantic_activity_patterns.py` confirms that an `Accept` of the stub
      Invite maps to `ACCEPT_INVITE_ACTOR_TO_CASE`.
    adr:
    - ADR-0114
    stories:
    - story_2022_013
    - story_2022_054
  - id: VAM-04-006
    priority: MUST
    kind: protocol
    statement: >-
      `REJECT_INVITE_ACTOR_TO_CASE` MUST be represented as
      `Reject(Invite(Actor)[target=VulnerabilityCaseStub])`
    rationale: >-
      A `Reject` of the stub Invite is the invitee's refusal to join (CM-11-007). The
      stub `target` tells it apart from the RC reply to the full-case Invite
      (VAM-04-014), which a participant that has already joined sends to close the
      report.
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `RejectInviteActorToCasePattern` wraps `InviteActorToCasePattern` inside a
      `Reject` outer pattern; integration tests in `test/demo/test_invite_actor_demo.py`
      exercise this flow. `test_reject_of_stub_invite_is_reject_invite_actor_to_case` in
      `test/wire/as2/test_case_joining_wire.py` confirms that a `Reject` of the stub
      Invite maps to `REJECT_INVITE_ACTOR_TO_CASE`.
    adr:
    - ADR-0114
    stories:
    - story_2022_006
  - id: VAM-04-007
    priority: MUST
    kind: protocol
    statement: >-
      `OFFER_CASE_OWNERSHIP_TRANSFER` MUST be represented as
      `Offer(VulnerabilityCase)`: the one Offer of a transfer, which the
      CASE_MANAGER makes from the Case Owner's proposal (CM-21-005).
    rationale: >-
      The Offer asks the transferee to become the Case Owner, and an AS2 `Offer` gives
      an object to a receiver for a decision. The CASE_MANAGER makes the Offer, so the
      transfer goes through the actor that records it in the case ledger (CM-21-005). An
      `Offer` of the case differs by shape from the Case Owner's proposal, an `Offer` of
      an `Offer` (VAM-04-018).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `OfferCaseOwnershipTransferActivityPattern` uses `TAtype.OFFER` and
      `AOtype.VULNERABILITY_CASE`; a test marked `VAM-04-007` in
      `test/test_semantic_activity_patterns.py` matches an Offer of the case to it.
    stories:
    - story_2022_050
    - story_2022_047
  - id: VAM-04-008
    priority: MUST
    kind: protocol
    statement: '`ACCEPT_CASE_OWNERSHIP_TRANSFER` MUST be represented as `Accept(Offer(VulnerabilityCase))`'
    rationale: >-
      The transferee answers the Offer that it received, so its `Accept` wraps that
      Offer. The CASE_MANAGER then moves the `CASE_OWNER` role (CM-21-002 to CM-21-004).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AcceptCaseOwnershipTransferActivityPattern` wraps
      `OfferCaseOwnershipTransferActivityPattern` inside an `Accept` outer
      pattern; a test marked `VAM-04-008` in `test/test_semantic_activity_patterns.py`
      matches an Accept of the Offer to it.
    stories:
    - story_2022_050
    - story_2022_048
  - id: VAM-04-009
    priority: MUST
    kind: protocol
    statement: '`REJECT_CASE_OWNERSHIP_TRANSFER` MUST be represented as `Reject(Offer(VulnerabilityCase))`'
    rationale: >-
      A `Reject` of the Offer leaves the current Case Owner in place. It wraps the same
      Offer as the `Accept` of VAM-04-008, so a receiver tells the two answers apart by
      activity type.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `RejectCaseOwnershipTransferActivityPattern` wraps
      `OfferCaseOwnershipTransferActivityPattern` inside a `Reject` outer
      pattern; a test marked `VAM-04-009` in `test/test_semantic_activity_patterns.py`
      matches a Reject of the Offer to it.
    stories:
    - story_2022_048
    - story_2022_050
  - id: VAM-04-010
    priority: MUST
    kind: protocol
    statement: '`OFFER_CASE_PARTICIPANT` MUST be represented as `Offer(CaseParticipant)[target=VulnerabilityCase]`'
    rationale: >-
      This is the second message of the actor-suggestion exchange. When it has the
      `Offer(Actor)` (VAM-04-001), the CASE_MANAGER offers case participation to the
      Case Owner as a `CaseParticipant` that carries the proposed roles (CM-16-003). The
      Case Owner answers this offer (VAM-04-002, VAM-04-003), so the roles that it
      decides on are in the object that it answers. See CM-16-004 and ADR-0026.
    verification: >-
      Inspection of `vultron/semantic_registry/actor.py` confirms that
      `MessageSemantics.OFFER_CASE_PARTICIPANT` is keyed to `OfferActorToCasePattern`
      (note the crossed spelling described in VAM-04-001), which uses `TAtype.OFFER`,
      `object_=CASE_PARTICIPANT`, and `target_=VULNERABILITY_CASE`; integration tests in
      `test/demo/test_suggest_actor_demo.py` exercise this flow.
      `test_actor_suggestion_is_two_offers_over_different_objects` in
      `test/test_message_semantics_mapping.py` confirms that the pattern bound to
      `OFFER_CASE_PARTICIPANT` is an `Offer` of a `CaseParticipant` with a
      `VulnerabilityCase` target.
    stories:
    - story_2022_053
  - id: VAM-04-011
    priority: MUST
    kind: protocol
    statement: >-
      The full-case Invite (CM-11-010) MUST be represented as
      `Invite(Actor)[target=VulnerabilityCase]`, with the case referenced by its plain
      URI in `target` (AKM-02-003) and the CASE_MANAGER's ledger position carried as the
      Invite's `ledgerPosition`, the object with `logIndex` and `entryHash` every case
      activity carries (SYNC-18-001), for example
      `"ledgerPosition": {"logIndex": 3, "entryHash": "<hash>"}`. The position of an
      empty ledger is `logIndex` -1 with the case's `genesisHash` as `entryHash`
      (CLP-08-004). A receiver MUST refuse an Invite whose `ledgerPosition` is missing
      or does not parse as a ledger position, naming the activity and writing nothing
      (SYNC-18-003).
    rationale: >-
      The participant already holds the case from the replica, so the Invite references
      it by ID. Because the stub is its own type (VAM-04-004, CM-11-013), this shape and
      the stub Invite differ in their target's `type` and are classified without a
      lookup. The position is the sender's ledger tail, which every case activity
      states in the same property (ADR-0156), so the Invite's floor needs no slot of
      its own.
    verification: >-
      A unit test confirms that an `Invite` whose `target` is a `VulnerabilityCase`
      matches the full-case Invite pattern and not the stub Invite pattern, and that one
      whose `target` is a `VulnerabilityCaseStub` matches only the stub Invite pattern.
      `test/wire/as2/factories/test_full_case_invite_factories.py` confirms the Invite's
      `ledgerPosition` carries the position's `logIndex` and `entryHash` and that it
      has no `content`; `test/core/use_cases/received/actor/test_full_case_invite.py`
      and `test/core/use_cases/received/actor/test_case_joining_replies.py` confirm a
      missing or non-parsing `ledgerPosition` is refused at the parse edge.
    adr:
    - ADR-0121
    - ADR-0114
    - ADR-0156
    stories:
    - story_2022_013
    - story_2022_054
    lint_suppress:
    - compound_statement  # one wire shape and its refusal
  - id: VAM-04-012
    priority: MUST
    kind: protocol
    statement: >-
      The RV reply to the full-case Invite MUST be represented as
      `Accept(Invite(Actor)[target=VulnerabilityCase])`, carrying the replier's ledger
      position as its `ledgerPosition`, in the form VAM-04-011 defines (CM-11-011,
      SYNC-18-001).
    rationale: >-
      The RV reply answers the full-case Invite, so it wraps that Invite. Its ledger
      position states the replier's ledger tail when it judged the case (ADR-0156). The
      full-case `target` tells this reply apart from the `Accept` of a stub Invite
      (VAM-04-005).
    verification: >-
      A unit test confirms that `Accept(Invite(Actor)[target=VulnerabilityCase])`
      matches the full-case Invite's RV pattern and not the stub Invite's `Accept`
      pattern (VAM-04-005).
    adr:
    - ADR-0121
    - ADR-0156
    stories:
    - story_2022_012
    - story_2022_054
  - id: VAM-04-013
    priority: MUST
    kind: protocol
    statement: >-
      The RI reply to the full-case Invite MUST be represented as
      `TentativeReject(Invite(Actor)[target=VulnerabilityCase])`, carrying the replier's
      ledger position as its `ledgerPosition`, in the form VAM-04-011 defines
      (CM-11-011, SYNC-18-001).
    rationale: >-
      `TentativeReject` records RM Invalid, from which the participant's RM state can
      still become Valid, so it is the same tentative answer as for a direct report
      (VAM-02-005). A stub Invite has no tentative reply (CM-11-007), so this form
      exists only for the full-case Invite.
    verification: >-
      A unit test confirms that
      `TentativeReject(Invite(Actor)[target=VulnerabilityCase])` matches the full-case
      Invite's RI pattern, and that a `TentativeReject` of a stub Invite matches no
      pattern (CM-11-007).
    adr:
    - ADR-0121
    - ADR-0156
    stories:
    - story_2022_101
    - story_2022_006
  - id: VAM-04-014
    priority: MUST
    kind: protocol
    statement: >-
      The RC reply to the full-case Invite MUST be represented as
      `Reject(Invite(Actor)[target=VulnerabilityCase])`, carrying the replier's ledger
      position as its `ledgerPosition`, in the form VAM-04-011 defines (CM-11-011,
      SYNC-18-001).
    rationale: >-
      `Reject` records RM Closed for a participant that has already joined. The
      full-case `target` tells it apart from a refusal to join, which is the `Reject` of
      a stub Invite (VAM-04-006).
    verification: >-
      A unit test confirms that `Reject(Invite(Actor)[target=VulnerabilityCase])`
      matches the full-case Invite's RC pattern and not the stub Invite's `Reject`
      pattern (VAM-04-006).
    adr:
    - ADR-0121
    - ADR-0156
    stories:
    - story_2022_066
    - story_2022_006
  - id: VAM-04-015
    priority: MUST
    kind: protocol
    statement: >-
      `UNDO_CASE_OWNERSHIP_TRANSFER` MUST be represented as
      `Undo(Offer(Offer(VulnerabilityCase)))`: the Case Owner's withdrawal of its
      own proposal, and with it of the open Offer the CASE_MANAGER made from it
      (CM-21-015).
    rationale: >-
      An actor undoes only an activity that it performed, so the Case Owner withdraws
      its own proposal with an `Undo` of that proposal. The withdrawal also ends the
      Offer that the CASE_MANAGER made from the proposal (CM-21-015), so no transferee
      can accept an Offer that the Case Owner withdrew.
    verification: >-
      A unit test confirms that `Undo(Offer(Offer(VulnerabilityCase)))` matches
      `UndoCaseOwnershipTransferActivityPattern`, which wraps
      `ProposeCaseOwnershipTransferActivityPattern` inside an `Undo` outer
      pattern, and resolves to `UNDO_CASE_OWNERSHIP_TRANSFER`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-015
    stories:
    - story_2022_050
  - id: VAM-04-016
    priority: MUST
    kind: protocol
    statement: >-
      `ACCEPT_ACTOR_RECOMMENDATION` MUST be represented as
      `Accept(Offer(Actor)[target=VulnerabilityCase])`: the CASE_MANAGER's answer to
      the recommender, wrapping the recommender's own `Offer(Actor)` (VAM-04-001), with
      `inReplyTo` naming that Offer (CM-16-006, CM-16-009).
    rationale: >-
      This is the third hop of the exchange, addressed back to the recommender. It
      wraps the first offer, where the Case Owner's decision (VAM-04-002) wraps the
      second, so the inner object type tells the two `Accept`s apart.
    verification: >-
      A unit test confirms that the answer the CASE_MANAGER's adapter builds matches
      `AcceptSuggestActorToCasePattern`, resolves to `ACCEPT_ACTOR_RECOMMENDATION` and
      carries `inReplyTo`.
    relationships:
    - rel_type: refines
      spec_id: CM-16-006
    stories:
    - story_2022_054
  - id: VAM-04-017
    priority: MUST
    kind: protocol
    statement: >-
      `REJECT_ACTOR_RECOMMENDATION` MUST be represented as
      `Reject(Offer(Actor)[target=VulnerabilityCase])`: the CASE_MANAGER's answer to
      the recommender after the Case Owner declines, with `inReplyTo` naming the
      recommender's `Offer(Actor)` (CM-16-007).
    rationale: >-
      Symmetric with VAM-04-016; the Case Owner's `Reject` (VAM-04-003) wraps
      `Offer(CaseParticipant)` instead.
    verification: >-
      A unit test confirms that the answer the CASE_MANAGER's adapter builds matches
      `RejectSuggestActorToCasePattern`, resolves to `REJECT_ACTOR_RECOMMENDATION` and
      carries `inReplyTo`.
    relationships:
    - rel_type: refines
      spec_id: CM-16-007
    stories:
    - story_2022_054
  - id: VAM-04-018
    priority: MUST
    kind: protocol
    statement: >-
      `PROPOSE_CASE_OWNERSHIP_TRANSFER` MUST be represented as
      `Offer(Offer(VulnerabilityCase))` with the case as the proposal's
      `context`: the Case Owner's proposal to the CASE_MANAGER, whose inner Offer
      is the template of the Offer the CASE_MANAGER makes (CM-21-005).
    rationale: >-
      The proposal and the CASE_MANAGER's `Offer(VulnerabilityCase)` (VAM-04-007)
      are told apart by shape, an Offer of an Offer against an Offer of a case,
      so neither pattern needs a sender check and no new vocabulary type is
      needed (ADR-0148).
    verification: >-
      A unit test confirms that a proposal matches
      `ProposeCaseOwnershipTransferActivityPattern`, which wraps
      `OfferCaseOwnershipTransferActivityPattern` inside an `Offer` outer
      pattern, and resolves to `PROPOSE_CASE_OWNERSHIP_TRANSFER`, while its inner
      Offer alone resolves to `OFFER_CASE_OWNERSHIP_TRANSFER` and neither matches
      the other's pattern.
    relationships:
    - rel_type: refines
      spec_id: CM-21-005
    adr:
    - ADR-0148
    stories:
    - story_2022_050
- id: VAM-05
  title: Embargo Management Messages
  specs:
  - id: VAM-05-003
    priority: MUST
    kind: protocol
    statement: '`REMOVE_EMBARGO_EVENT_FROM_CASE` MUST be represented as `Remove(Event)`'
    rationale: >-
      A removal takes the embargo out of the case, which is what AS2 `Remove` means. The
      sender and every receiver must use the same wire form, or a receiver classifies
      the activity as unknown.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `RemoveEmbargoEventFromCasePattern` uses `TAtype.REMOVE` and `AOtype.EVENT` with no target constraint;
      integration tests in `test/demo/test_manage_embargo_demo.py` exercise this flow.
      `test/test_semantic_activity_patterns.py::test_wire_form_examples_map_to_their_semantics`
      asserts that the `remove_embargo` vocabulary example extracts as this semantic type.
    stories:
    - story_2022_014
    - story_2022_023
  - id: VAM-05-004
    priority: MUST
    kind: protocol
    statement: '`ANNOUNCE_EMBARGO_EVENT_TO_CASE` MUST be represented as `Announce(Event)[context=VulnerabilityCase]`'
    rationale: >-
      An announcement tells participants about an embargo event and asks for no answer,
      which is what AS2 `Announce` means. The case in `context` names the case that the
      embargo belongs to.
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AnnounceEmbargoEventToCasePattern` uses `TAtype.ANNOUNCE`, `AOtype.EVENT`, and
      `context_=VULNERABILITY_CASE`; integration tests in
      `test/demo/test_manage_embargo_demo.py` exercise this flow.
      `test_wire_form_examples_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the `announce_embargo`
      vocabulary example maps to `ANNOUNCE_EMBARGO_EVENT_TO_CASE`.
    stories:
    - story_2022_010
    - story_2022_081
  - id: VAM-05-005
    priority: MUST
    kind: protocol
    statement: '`INVITE_TO_EMBARGO_ON_CASE` MUST be represented as `Invite(Event)[context=VulnerabilityCase]`'
    rationale: >-
      A proposed embargo needs the answer of each invitee, so it is an `Invite` with the
      `EmbargoEvent` as its object. The `EmbargoEvent` object and the case in `context`
      keep this form separate from the Invite of an actor to a case, whose case is in
      `target` (VAM-04-004).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `InviteToEmbargoOnCasePattern` uses `TAtype.INVITE`, `AOtype.EVENT`, and `context_=VULNERABILITY_CASE`;
      integration tests in `test/demo/test_establish_embargo_demo.py` exercise this flow.
      `test/test_semantic_activity_patterns.py::test_wire_form_examples_map_to_their_semantics`
      asserts that the `propose_embargo` vocabulary example extracts as this semantic type.
    stories:
    - story_2022_014
    - story_2022_023
  - id: VAM-05-006
    priority: MUST
    kind: protocol
    statement: '`ACCEPT_INVITE_TO_EMBARGO_ON_CASE` MUST be represented as `Accept(Invite(Event)[context=VulnerabilityCase])`'
    rationale: >-
      An invitee consents to the proposed embargo when it accepts the Invite that it
      received, so the `Accept` wraps that Invite. Its inner object tells it apart from
      the Case Owner's activation, which is an `Accept` of the `EmbargoEvent` itself
      (VAM-05-008).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AcceptInviteToEmbargoOnCasePattern` wraps `InviteToEmbargoOnCasePattern` inside an `Accept` outer
      pattern; integration tests in `test/demo/test_establish_embargo_demo.py` exercise this flow.
      `test/test_semantic_activity_patterns.py::test_owner_embargo_decisions_are_distinct_from_invite_answers`
      asserts that the `accept_embargo` vocabulary example extracts as this semantic type.
    stories:
    - story_2022_014
  - id: VAM-05-007
    priority: MUST
    kind: protocol
    statement: '`REJECT_INVITE_TO_EMBARGO_ON_CASE` MUST be represented as `Reject(Invite(Event)[context=VulnerabilityCase])`'
    rationale: >-
      An invitee declines the proposed embargo when it rejects the Invite that it
      received. Its inner object tells it apart from the Case Owner's rejection of the
      proposal, which is a `Reject` of the `EmbargoEvent` itself (VAM-05-009).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `RejectInviteToEmbargoOnCasePattern` wraps `InviteToEmbargoOnCasePattern` inside a `Reject` outer
      pattern; integration tests in `test/demo/test_establish_embargo_demo.py` exercise this flow.
      `test/test_semantic_activity_patterns.py::test_owner_embargo_decisions_are_distinct_from_invite_answers`
      asserts that the `reject_embargo` vocabulary example extracts as this semantic type.
    stories:
    - story_2022_014
  - id: VAM-05-008
    priority: MUST
    kind: protocol
    statement: >-
      `ACTIVATE_EMBARGO_ON_CASE` MUST be represented as
      `Accept(Event)[target=VulnerabilityCase]`, whose object is the proposed `EmbargoEvent`
      itself, carried inline or by reference, and not the `Invite` that proposed it (ADR-0122).
    rationale: >-
      The case owner's activation is a decision about the embargo for the case, so it accepts
      the embargo; an `Accept` of the `Invite` is each sender's own consent (VAM-05-006).
      Giving the two different objects keeps them apart on the wire.
    verification: A unit test in `test/test_semantic_activity_patterns.py` confirms that
      `Accept(EmbargoEvent, target=VulnerabilityCase)` maps to `ACTIVATE_EMBARGO_ON_CASE` and no
      other semantics, and inspection of `_instances.py` confirms `ActivateEmbargoOnCasePattern`
      uses `TAtype.ACCEPT`, `AOtype.EVENT`, and `target_=VULNERABILITY_CASE`.
    adr:
    - ADR-0122
    stories:
    - story_2022_014
  - id: VAM-05-009
    priority: MUST
    kind: protocol
    statement: >-
      `REJECT_EMBARGO_PROPOSAL_ON_CASE` MUST be represented as
      `Reject(Event)[target=VulnerabilityCase]`, whose object is the proposed `EmbargoEvent`
      itself, carried inline or by reference, and not the `Invite` that proposed it (ADR-0122).
    rationale: >-
      The case owner's rejection is a decision about the embargo for the case; a `Reject` of
      the `Invite` is each sender's own consent (VAM-05-007).
    verification: A unit test in `test/test_semantic_activity_patterns.py` confirms that
      `Reject(EmbargoEvent, target=VulnerabilityCase)` maps to
      `REJECT_EMBARGO_PROPOSAL_ON_CASE` and no other semantics, and inspection of
      `_instances.py` confirms `RejectEmbargoProposalOnCasePattern` uses `TAtype.REJECT`,
      `AOtype.EVENT`, and `target_=VULNERABILITY_CASE`.
    adr:
    - ADR-0122
    stories:
    - story_2022_014
  - id: VAM-05-010
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the proposed `EmbargoEvent` inline as the object of the
      `Accept(Event)[target=VulnerabilityCase]` of VAM-05-008 and of the
      `Reject(Event)[target=VulnerabilityCase]` of VAM-05-009.
    rationale: >-
      This is how this codebase meets VAM-05-008 and VAM-05-009, kept apart from them so
      that they state only what other participants observe (MS-12-010). This codebase
      matches the semantic type on the type of the object. An inline event lets the
      pattern read that type without depending on what the receiver's store holds. The
      vocabulary class types the object as `as_EmbargoEvent` with no reference form, so
      a reference that the receiver cannot resolve is refused (VM-06-007) and not
      deferred. That is a choice of this prototype reference implementation, not a
      protocol rule.
    verification: >-
      Inspection of `_ActivateEmbargoActivity` and `_RejectEmbargoProposalActivity` in
      `vultron/wire/as2/vocab/activities/embargo.py` confirms each types `object_` as
      `as_EmbargoEvent`, not a reference union, so this codebase cannot build either with
      a bare URI. Unit tests in `test/test_semantic_activity_patterns.py` confirm that
      `Accept(EmbargoEvent, target=VulnerabilityCase)` and
      `Reject(EmbargoEvent, target=VulnerabilityCase)`, each carrying the typed inline
      `EmbargoEvent`, map to `ACTIVATE_EMBARGO_ON_CASE` and
      `REJECT_EMBARGO_PROPOSAL_ON_CASE`.
    relationships:
    - rel_type: implements
      spec_id: VAM-05-008
    - rel_type: implements
      spec_id: VAM-05-009
  - id: VAM-05-011
    priority: MUST
    kind: protocol
    statement: >-
      `WITHDRAW_FROM_EMBARGO_ON_CASE` MUST be represented as
      `Leave(Event)[context=VulnerabilityCase]`, whose object is the embargo in force,
      carried inline or by reference, and not an `Invite` (ADR-0122).
    rationale: >-
      Withdrawal answers no Invite, so it names the embargo itself; it is told apart from
      `Leave(VulnerabilityCase)`, which leaves the case, by its object (MSM-07-010).
    verification: A unit test in `test/test_semantic_activity_patterns.py` confirms that
      `Leave(EmbargoEvent)[context=VulnerabilityCase]` maps to
      `WITHDRAW_FROM_EMBARGO_ON_CASE` and `Leave(VulnerabilityCase)` still maps to
      `CLOSE_CASE`, and inspection of `_instances.py` confirms
      `WithdrawFromEmbargoOnCasePattern` uses `TAtype.LEAVE`, `AOtype.EVENT`, and
      `context_=VULNERABILITY_CASE`.
    adr:
    - ADR-0122
    stories:
    - story_2022_014
    - story_2022_080
  - id: VAM-05-012
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the `EmbargoEvent` in force inline as the object of the
      `Leave(Event)[context=VulnerabilityCase]` of VAM-05-011.
    rationale: >-
      This is how this codebase meets VAM-05-011, kept apart from it so that it states
      only what other participants observe (MS-12-010). This codebase matches the
      semantic type on the type of the object. An inline event lets the pattern read
      that type without depending on what the receiver's store holds. The vocabulary
      class types the object as `as_EmbargoEvent` with no reference form, so a reference
      that the receiver cannot resolve is refused (VM-06-007) and not deferred. That is
      a choice of this prototype reference implementation, not a protocol rule.
    verification: >-
      Inspection of `_WithdrawFromEmbargoActivity` in
      `vultron/wire/as2/vocab/activities/embargo.py` confirms it types `object_` as
      `as_EmbargoEvent`, not a reference union, and a unit test in
      `test/test_semantic_activity_patterns.py` confirms that
      `Leave(EmbargoEvent)[context=VulnerabilityCase]`, carrying the typed inline
      `EmbargoEvent`, maps to `WITHDRAW_FROM_EMBARGO_ON_CASE`.
    relationships:
    - rel_type: implements
      spec_id: VAM-05-011
  - id: VAM-05-013
    priority: MUST
    kind: protocol
    statement: >-
      `UNDO_INVITE_TO_EMBARGO_ON_CASE` MUST be represented as
      `Undo(Invite(Event)[context=VulnerabilityCase])`, whose object is an
      `Invite(EmbargoEvent)` the sender itself sent. Only the CASE_MANAGER
      sends it, when it abandons an open proposal (EMB-16-001, ADR-0152).
    rationale: >-
      An actor undoes only an activity it performed, so withdrawing an
      invitation one sent is an `Undo` and declining one received is a `Reject`
      (ADR-0152). The shape is told apart from the ownership-transfer `Undo`
      (VAM-04-015) by its object, an embargo Invite.
    verification: >-
      `test_undo_of_an_embargo_invite_maps_to_its_semantic` in
      `test/test_semantic_activity_patterns.py` confirms that
      `Undo(Invite(EmbargoEvent))[context=VulnerabilityCase]` maps to
      `UNDO_INVITE_TO_EMBARGO_ON_CASE`, and inspection of `_instances.py`
      confirms `UndoInviteToEmbargoOnCasePattern` uses `TAtype.UNDO` with
      `InviteToEmbargoOnCasePattern` as its object.
    relationships:
    - rel_type: satisfies
      spec_id: EMB-16-001
    adr:
    - ADR-0152
    stories:
    - story_2022_014
    - story_2022_080
  - id: VAM-05-014
    priority: MUST
    kind: protocol
    statement: >-
      `CREATE_EMBARGO_CONSENT` MUST be represented as `Create(EmbargoConsent)`,
      carrying the new consent row in full. Only the CASE_MANAGER sends it, as its own
      act when it brings a consent row into existence (ADR-0122, CLP-07-013), and it
      is not handled on receipt (SE-05-002, ADR-0140).
    rationale: >-
      An entry's semantic type is the registry's label for its payload (ADR-0140). The
      record is a case-file change, not a PEC transition (MSM-07-001).
    verification: >-
      `test_case_manager_acts_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the
      `create_embargo_consent` example maps to `CREATE_EMBARGO_CONSENT`.
    relationships:
    - rel_type: refines
      spec_id: MSM-07-001
    adr:
    - ADR-0140
    stories:
    - story_2022_014
    - story_2022_080
  - id: VAM-05-015
    priority: MUST
    kind: protocol
    statement: >-
      `UPDATE_EMBARGO_CONSENT` MUST be represented as `Update(EmbargoConsent)`,
      carrying the changed consent row in full. Only the CASE_MANAGER sends it, as its
      own act when it changes a consent row, its own consent included (MSM-07-004,
      CLP-07-013), and it is not handled on receipt (SE-05-002, ADR-0140).
    rationale: >-
      An entry's semantic type is the registry's label for its payload (ADR-0140).
      An expired invitation is this `Update` carrying the invitee's `TIMED_OUT` row
      (ADR-0140 item 4).
    verification: >-
      `test_case_manager_acts_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the
      `update_embargo_consent` example maps to `UPDATE_EMBARGO_CONSENT`.
    relationships:
    - rel_type: refines
      spec_id: MSM-07-004
    adr:
    - ADR-0140
    stories:
    - story_2022_014
    - story_2022_080
  - id: VAM-05-016
    priority: MUST
    kind: protocol
    statement: >-
      `CREATE_EMBARGO_EVENT` MUST be represented as `Create(EmbargoEvent)`, carrying
      the embargo in full, its start and end times included. Only the CASE_MANAGER
      commits it, as a ledger entry and never as a sent message, once for each
      embargo a case's creation writes, such as the default embargo (EP-04-002),
      right after the case's genesis entry and before the case's other creation
      entries (CLP-07-013). It is not handled on receipt
      (SE-05-002, ADR-0140): a replica stores the embargo from the entry.
    rationale: >-
      The genesis entry carries only the case's active embargo inline, and a replica
      copies each record from its own entry (ADR-0124). No other entry carries a
      creation-time embargo until the embargo is removed. Without this entry, a replica
      built from the ledger alone could not read the end time that its embargo decisions
      need. An entry's semantic type is the registry's label for its payload (ADR-0140).
    verification: >-
      `test_case_manager_acts_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the
      `create_embargo_event` example maps to `CREATE_EMBARGO_EVENT`.
      `test_the_default_embargo_follows_the_genesis_entry_in_full` and
      `test_the_default_embargo_rebuilds_from_the_ledger_alone` in
      `test/core/use_cases/received/test_rebuild_from_ledger.py` confirm the entry
      follows the genesis entry and a replica built from the ledger holds the embargo
      whole.
    relationships:
    - rel_type: refines
      spec_id: CLP-07-013
    adr:
    - ADR-0140
    stories:
    - story_2022_014
    - story_2022_080
- id: VAM-06
  title: Case Participant Management Messages
  specs:
  - id: VAM-06-002
    priority: MUST
    kind: protocol
    statement: '`ADD_CASE_PARTICIPANT_TO_CASE` MUST be represented as `Add(CaseParticipant)[target=VulnerabilityCase]`'
    rationale: >-
      The message is the Case Owner's request to reinstate a removed participant into the case's
      `activeParticipants` (CM-31-011, ADR-0116); it does not seat a new member, which joins by
      accepting a stub Invite.
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AddCaseParticipantToCasePattern` uses `TAtype.ADD`, `AOtype.CASE_PARTICIPANT`,
      and `target_=VULNERABILITY_CASE`; integration tests in
      `test/demo/test_manage_participants_demo.py` exercise this flow.
      `test_wire_form_examples_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the
      `add_vendor_participant_to_case` vocabulary example maps to
      `ADD_CASE_PARTICIPANT_TO_CASE`.
    adr:
    - ADR-0116
    stories:
    - story_2022_013
    - story_2022_052
  - id: VAM-06-003
    priority: MUST
    kind: protocol
    statement: '`REMOVE_CASE_PARTICIPANT_FROM_CASE` MUST be represented as `Remove(CaseParticipant)[target=VulnerabilityCase]`'
    rationale: >-
      The message removes a participant from the case's `activeParticipants`, not from
      `caseParticipants`: the record stays and the participant stops receiving case content
      (CM-31-001, CM-31-004, ADR-0116).
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `RemoveCaseParticipantFromCasePattern` uses `TAtype.REMOVE`,
      `AOtype.CASE_PARTICIPANT`, and `target_=VULNERABILITY_CASE`; integration tests in
      `test/demo/test_manage_participants_demo.py` exercise this flow.
      `test_wire_form_examples_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the
      `remove_participant_from_case` vocabulary example maps to
      `REMOVE_CASE_PARTICIPANT_FROM_CASE`.
    adr:
    - ADR-0116
    stories:
    - story_2022_066
    - story_2022_067
  - id: VAM-06-004
    priority: MUST
    kind: protocol
    statement: >-
      `CREATE_CASE_PARTICIPANT` MUST be represented as `Create(CaseParticipant)`,
      carrying the record in full. Only the CASE_MANAGER sends it, as its own act
      when it brings a participant record into existence (ADR-0114, CLP-07-013), and
      it is not handled on receipt (SE-05-002, ADR-0140).
    rationale: >-
      An entry's semantic type is the registry's label for its payload (ADR-0140).
      A received `Create(CaseParticipant)` is still not a protocol message
      (VAM-01-011): it is recognized only so that it is reported, not acted on.
    verification: >-
      `test_case_manager_acts_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the
      `create_participant` example maps to `CREATE_CASE_PARTICIPANT`.
    relationships:
    - rel_type: refines
      spec_id: VAM-01-011
    adr:
    - ADR-0140
    stories:
    - story_2022_013
  - id: VAM-06-005
    priority: MUST
    kind: protocol
    statement: >-
      `UPDATE_CASE_PARTICIPANT` MUST be represented as `Update(CaseParticipant)`,
      carrying the changed record in full. Only the CASE_MANAGER sends it, as its own
      act when it changes a participant record, such as moving the `CASE_OWNER` role
      (CM-21-002, CLP-07-013), and it is not handled on receipt (SE-05-002,
      ADR-0140).
    rationale: >-
      An entry's semantic type is the registry's label for its payload (ADR-0140), so
      each participant-record change the CASE_MANAGER commits needs a registry entry.
    verification: >-
      `test_case_manager_acts_map_to_their_semantics` in
      `test/test_semantic_activity_patterns.py` confirms that the
      `update_participant` example maps to `UPDATE_CASE_PARTICIPANT`.
    relationships:
    - rel_type: satisfies
      spec_id: CM-21-002
    adr:
    - ADR-0140
    stories:
    - story_2022_050
- id: VAM-07
  title: Note Management Messages
  specs:
  - id: VAM-07-002
    priority: MUST
    kind: protocol
    statement: '`ADD_NOTE_TO_CASE` MUST be represented as `Add(Note)[target=VulnerabilityCase]`'
    rationale: >-
      A note means nothing apart from its case, so it enters the case only by the `Add`
      that attaches it, with the case as `target` (VAM-01-011, ADR-0137). One attaching
      message means that a note has no state in which it exists but is not in a case.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `AddNoteToCasePattern`
      uses `TAtype.ADD`, `AOtype.NOTE`, and `target_=VULNERABILITY_CASE`; integration tests in `test/demo/`
      exercise the full add-note flow.
    adr:
    - ADR-0137
    stories:
    - story_2022_039
    - story_2022_074
  - id: VAM-07-003
    priority: MUST
    kind: protocol
    statement: '`REMOVE_NOTE_FROM_CASE` MUST be represented as `Remove(Note)[target=VulnerabilityCase]`'
    rationale: >-
      A removal takes the note out of the case named in `target`, which is what AS2
      `Remove` means. The `Note` object tells it apart from the other `Remove` forms,
      such as the removal of a participant (VAM-06-003).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `RemoveNoteFromCasePattern`
      uses `TAtype.REMOVE`, `AOtype.NOTE`, and `target_=VULNERABILITY_CASE`; integration tests in `test/demo/`
      exercise the full remove-note flow.
    stories:
    - story_2022_074
- id: VAM-08
  title: Status Tracking Messages
  specs:
  - id: VAM-08-002
    priority: MUST
    kind: protocol
    statement: '`ADD_CASE_STATUS_TO_CASE` MUST be represented as `Add(CaseStatus)[target=VulnerabilityCase]`'
    rationale: >-
      A case status means nothing apart from its case, so it enters the case only by the
      `Add` that attaches it (VAM-01-011, ADR-0137). The case in `target` names the case
      that the status belongs to.
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AddCaseStatusToCasePattern` uses `TAtype.ADD`, `AOtype.CASE_STATUS`, and `target_=VULNERABILITY_CASE`;
      integration tests in `test/demo/test_status_updates_demo.py` exercise this flow.
      `test/test_semantic_activity_patterns.py::test_wire_form_examples_map_to_their_semantics`
      asserts that the `add_status_to_case` vocabulary example extracts as this
      semantic type.
    adr:
    - ADR-0137
    stories:
    - story_2022_062
    - story_2022_081
    - story_2022_088
  - id: VAM-08-004
    priority: MUST
    kind: protocol
    statement: '`ADD_PARTICIPANT_STATUS_TO_PARTICIPANT` MUST be represented as `Add(ParticipantStatus)[target=CaseParticipant]`'
    rationale: >-
      A participant status belongs to one participant in one case, so its `target` is
      that `CaseParticipant` and not the case. The `Add` is the only way the status
      enters the case (VAM-01-011, ADR-0137).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AddParticipantStatusToParticipantPattern` uses `TAtype.ADD`, `AOtype.PARTICIPANT_STATUS`, and
      `target_=CASE_PARTICIPANT`; integration tests in `test/demo/` exercise this flow.
    adr:
    - ADR-0137
    stories:
    - story_2022_062
    - story_2022_075
    - story_2022_088
- id: VAM-09
  title: Unrecognized Activities
  specs:
  - id: VAM-09-001
    priority: MUST
    kind: project
    statement: >-
      An inbound AS2 activity that does not match any registered pattern MUST be
      assigned `MessageSemantics.UNKNOWN`, except where VAM-01-009 requires
      `MessageSemantics.UNKNOWN_UNRESOLVABLE_OBJECT`
    rationale: >-
      A received activity needs one defined result even when no pattern describes it, so
      that the inbox can refuse and log it in place of failing on an exception.
    verification: A unit test confirms that when the `SEMANTIC_REGISTRY` loop exhausts all entries without a
      match, `find_matching_semantics()` returns `MessageSemantics.UNKNOWN` as the fallback value.
  - id: VAM-09-002
    priority: MUST_NOT
    kind: project
    statement: '`MessageSemantics.UNKNOWN` MUST NOT have a matchable pattern: its `SEMANTIC_REGISTRY` entry MUST carry
      `pattern=None`, and the fallback is implemented by `find_matching_semantics()` returning `UNKNOWN` when the pattern
      loop exhausts all entries without a match'
    rationale: >-
      `UNKNOWN` needs a registry entry, because `lookup_entry()` resolves the event
      class and the use case for the fallback through it. If that entry had a pattern,
      `UNKNOWN` could come from a match as well as from no match, and a reader of the
      result could not tell which. The statement says "no matchable pattern" and not "no
      entry" for that reason.
    verification: >-
      A unit test confirms that the `SEMANTIC_REGISTRY` entry for
      `MessageSemantics.UNKNOWN` has `pattern is None` and is ordered last.
