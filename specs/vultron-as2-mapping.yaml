- id: VAM-09
  title: Unrecognized Activities
  specs:
  - id: VAM-09-001
    priority: MUST
    kind: project
    statement: An inbound AS2 activity that does not match any registered pattern MUST be assigned `MessageSemantics.UNKNOWN`
    verification: A unit test confirms that when the `SEMANTIC_REGISTRY` loop exhausts all entries without a
      match, `find_matching_semantics()` returns `MessageSemantics.UNKNOWN` as the fallback value.
  - id: VAM-09-002
    priority: MUST_NOT
    kind: project
    statement: '`MessageSemantics.UNKNOWN` MUST NOT have a matchable pattern: its `SEMANTIC_REGISTRY` entry MUST carry
      `pattern=None`, and the fallback is implemented by `find_matching_semantics()` returning `UNKNOWN` when the pattern
      loop exhausts all entries without a match'
    rationale: >-
      Stated as "no matchable pattern" rather than "no entry" because `SEMANTIC_REGISTRY`
      is an ordered list of `SemanticEntry` values, not the `MessageSemantics` →
      `ActivityPattern` dict it replaced. `UNKNOWN` does have a registry entry — it has
      to, since `lookup_entry()` resolves the event class and use case for the fallback
      through it. What it must not have is a pattern the match loop could select.
    verification: >-
      A unit test confirms that the `SEMANTIC_REGISTRY` entry for
      `MessageSemantics.UNKNOWN` has `pattern is None` and is ordered last.
