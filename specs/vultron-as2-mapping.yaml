    - missing_story_reference
  - id: VAM-02-006
    priority: MUST
    kind: protocol
    statement: '`CLOSE_REPORT` MUST be represented as `Reject(Offer(VulnerabilityReport))`'
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `CloseReportPattern`
