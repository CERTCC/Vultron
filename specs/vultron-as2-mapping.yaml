      is registered as `Leave(VulnerabilityCase)`; integration tests in `test/demo/test_manage_case_demo.py`
      exercise the close-case flow.
    stories:
    - story_2022_066
    - story_2022_067
- id: VAM-04
  title: Actor Suggestion and Invitation Messages
  specs:
  - id: VAM-04-001
    priority: MUST
    kind: protocol
    statement: '`OFFER_ACTOR_TO_CASE` MUST be represented as `Offer(Actor)[target=VulnerabilityCase]`'
    rationale: 'This is the first hop of the two-offer actor-suggestion exchange: a participant suggests an Actor to the
      CASE_MANAGER. Corrected from an earlier revision that named `SUGGEST_ACTOR_TO_CASE`, which is not and never was a
      `MessageSemantics` member. Note the crossed spelling in the code — `SuggestActorToCasePattern` is the pattern bound
      to `OFFER_ACTOR_TO_CASE`, while `OfferActorToCasePattern` is bound to `OFFER_CASE_PARTICIPANT` (VAM-04-010).'
    verification: Inspection of `vultron/semantic_registry/actor.py` confirms that `MessageSemantics.OFFER_ACTOR_TO_CASE`
      is keyed to `SuggestActorToCasePattern`, which uses `TAtype.OFFER`, `AOtype.ACTOR`, and
      `target_=VULNERABILITY_CASE`; integration tests in `test/demo/test_suggest_actor_demo.py` exercise this flow.
    stories:
    - story_2022_053
    - story_2022_013
  - id: VAM-04-002
    priority: MUST
    kind: protocol
    statement: '`ACCEPT_OFFER_CASE_PARTICIPANT` MUST be represented as
      `Accept(Offer(CaseParticipant)[target=VulnerabilityCase])`'
    rationale: 'The accept wraps the *second* offer of the exchange, not the first: the Case Owner accepts the CASE_MANAGER''s
      `Offer(CaseParticipant)` (VAM-04-010), not the original `Offer(Actor)`. Corrected from an earlier revision that named
      a nonexistent `ACCEPT_SUGGEST_ACTOR_TO_CASE` and wrapped `Offer(Actor)` — wrong in both the semantic name and the
      wire form. See CM-16-003, CM-16-004 and ADR-0026.'
    verification: Inspection of `vultron/semantic_registry/actor.py` confirms that
      `MessageSemantics.ACCEPT_OFFER_CASE_PARTICIPANT` is keyed to `AcceptActorRecommendationPattern`, whose nested
      sub-pattern has `object_=CASE_PARTICIPANT` rather than `ACTOR`; integration tests in
      `test/demo/test_suggest_actor_demo.py` exercise this flow.
    stories:
    - story_2022_054
  - id: VAM-04-003
    priority: MUST
    kind: protocol
    statement: '`REJECT_OFFER_CASE_PARTICIPANT` MUST be represented as
      `Reject(Offer(CaseParticipant)[target=VulnerabilityCase])`'
    rationale: 'Symmetric with VAM-04-002: the rejection wraps the CASE_MANAGER''s `Offer(CaseParticipant)`, not the
      originating `Offer(Actor)`. Corrected from an earlier revision that named a nonexistent
      `REJECT_SUGGEST_ACTOR_TO_CASE` and wrapped the wrong inner object.'
    verification: Inspection of `vultron/semantic_registry/actor.py` confirms that
      `MessageSemantics.REJECT_OFFER_CASE_PARTICIPANT` is keyed to `RejectActorRecommendationPattern`, whose nested
      sub-pattern has `object_=CASE_PARTICIPANT`; integration tests in `test/demo/test_suggest_actor_demo.py`
      exercise this flow.
    stories:
    - story_2022_054
  - id: VAM-04-004
    priority: MUST
    kind: protocol
    statement: >-
      `INVITE_ACTOR_TO_CASE` (the stub Invite) MUST be represented as
      `Invite(Actor)[target=VulnerabilityCaseStub]`, with the stub shaped as CM-11-013
      requires.
    verification: >-
      Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `InviteActorToCasePattern` uses `TAtype.INVITE`, `object_=ACTOR` and a
      `VulnerabilityCaseStub` target; integration tests in
      `test/demo/test_invite_actor_demo.py` exercise this flow.
    adr:
    - ADR-0114
    stories:
    - story_2022_013
    - story_2022_052
  - id: VAM-04-005
    priority: MUST
    kind: protocol
    statement: >-
      `ACCEPT_INVITE_ACTOR_TO_CASE` MUST be represented as
      `Accept(Invite(Actor)[target=VulnerabilityCaseStub])`
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `AcceptInviteActorToCasePattern`
      wraps `InviteActorToCasePattern` inside an `Accept` outer pattern; integration tests in
      `test/demo/test_invite_actor_demo.py` exercise this flow.
    adr:
    - ADR-0114
    stories:
    - story_2022_013
    - story_2022_054
  - id: VAM-04-006
    priority: MUST
    kind: protocol
    statement: >-
      `REJECT_INVITE_ACTOR_TO_CASE` MUST be represented as
      `Reject(Invite(Actor)[target=VulnerabilityCaseStub])`
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `RejectInviteActorToCasePattern`
      wraps `InviteActorToCasePattern` inside a `Reject` outer pattern; integration tests in
      `test/demo/test_invite_actor_demo.py` exercise this flow.
    adr:
    - ADR-0114
    stories:
    - story_2022_006
  - id: VAM-04-007
    priority: MUST
    kind: protocol
    statement: >-
      `OFFER_CASE_OWNERSHIP_TRANSFER` MUST be represented as
      `Offer(VulnerabilityCase)`: the one Offer of a transfer, which the
      CASE_MANAGER makes from the Case Owner's proposal (CM-21-005).
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `OfferCaseOwnershipTransferActivityPattern` uses `TAtype.OFFER` and
      `AOtype.VULNERABILITY_CASE`; a test marked `VAM-04-007` in
      `test/test_semantic_activity_patterns.py` matches an Offer of the case to it.
    stories:
    - story_2022_050
    - story_2022_047
  - id: VAM-04-008
    priority: MUST
    kind: protocol
    statement: '`ACCEPT_CASE_OWNERSHIP_TRANSFER` MUST be represented as `Accept(Offer(VulnerabilityCase))`'
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `AcceptCaseOwnershipTransferActivityPattern` wraps
      `OfferCaseOwnershipTransferActivityPattern` inside an `Accept` outer
      pattern; a test marked `VAM-04-008` in `test/test_semantic_activity_patterns.py`
      matches an Accept of the Offer to it.
    stories:
    - story_2022_050
    - story_2022_048
  - id: VAM-04-009
    priority: MUST
    kind: protocol
    statement: '`REJECT_CASE_OWNERSHIP_TRANSFER` MUST be represented as `Reject(Offer(VulnerabilityCase))`'
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `RejectCaseOwnershipTransferActivityPattern` wraps
      `OfferCaseOwnershipTransferActivityPattern` inside a `Reject` outer
      pattern; a test marked `VAM-04-009` in `test/test_semantic_activity_patterns.py`
      matches a Reject of the Offer to it.
    stories:
    - story_2022_048
    - story_2022_050
  - id: VAM-04-010
    priority: MUST
    kind: protocol
    statement: '`OFFER_CASE_PARTICIPANT` MUST be represented as `Offer(CaseParticipant)[target=VulnerabilityCase]`'
    rationale: 'The second hop of the actor-suggestion exchange, and the one VAM previously omitted entirely: having
      received `Offer(Actor)` (VAM-04-001), the CASE_MANAGER offers case participation to the Case Owner as a
      `CaseParticipant` carrying the proposed roles. This hop is what VAM-04-002 and VAM-04-003 accept and reject, so
      leaving it unspecified made those two entries look like they wrapped `Offer(Actor)`. See CM-16-003, CM-16-004 and
      ADR-0026.'
    verification: Inspection of `vultron/semantic_registry/actor.py` confirms that
      `MessageSemantics.OFFER_CASE_PARTICIPANT` is keyed to `OfferActorToCasePattern` (note the crossed spelling
      described in VAM-04-001), which uses `TAtype.OFFER`, `object_=CASE_PARTICIPANT`, and
      `target_=VULNERABILITY_CASE`; integration tests in `test/demo/test_suggest_actor_demo.py` exercise this flow.
    stories:
    - story_2022_053
  - id: VAM-04-011
    priority: MUST
    kind: protocol
    statement: >-
      The full-case Invite (CM-11-010) MUST be represented as
      `Invite(Actor)[target=VulnerabilityCase]`, with the case referenced by its plain
      URI in `target` (AKM-02-003) and the CASE_MANAGER's ledger position carried in the
      Invite's `content`. The `content` string MUST be the JSON dump, under the model's
      wire aliases, of the core `LedgerPosition` model, for example
      `{"logIndex":3,"entryHash":"<hash>"}`, and MUST be produced only by
      `vultron.wire.as2.factories`. The position of an empty ledger is `logIndex` -1 with
      the case's `genesisHash` as `entryHash` (CLP-08-004). A receiver MUST parse
      `content` with `LedgerPosition.model_validate_json` at the parse edge and MUST
      refuse an activity whose `content` is missing, blank or does not parse, naming the
      activity and writing nothing (ADR-0032).
    rationale: >-
      The participant already holds the case from the replica, so the Invite references
      it by ID. Because the stub is its own type (VAM-04-004, CM-11-013), this shape and
      the stub Invite differ in their target's `type` and are classified without a
      lookup. `content` is the existing AS2 slot, used here for a machine-readable
      record, so no AS2 verb gains a field.
    verification: >-
      A unit test confirms that an `Invite` whose `target` is a `VulnerabilityCase`
      matches the full-case Invite pattern and not the stub Invite pattern, and that one
      whose `target` is a `VulnerabilityCaseStub` matches only the stub Invite pattern.
      Tests confirm the factory's `content` round-trips through
      `LedgerPosition.model_validate_json` and that a missing, blank or non-parsing
      `content` is refused at extraction.
    adr:
    - ADR-0121
    - ADR-0114
    stories:
    - story_2022_013
    - story_2022_054
  - id: VAM-04-012
    priority: MUST
    kind: protocol
    statement: >-
      The RV reply to the full-case Invite MUST be represented as
      `Accept(Invite(Actor)[target=VulnerabilityCase])`, carrying the replier's ledger
      position in `content`, in the form VAM-04-011 defines (CM-11-011).
    verification: >-
      A unit test confirms that `Accept(Invite(Actor)[target=VulnerabilityCase])`
      matches the full-case Invite's RV pattern and not the stub Invite's `Accept`
      pattern (VAM-04-005).
    adr:
    - ADR-0121
    stories:
    - story_2022_012
    - story_2022_054
  - id: VAM-04-013
    priority: MUST
    kind: protocol
    statement: >-
      The RI reply to the full-case Invite MUST be represented as
      `TentativeReject(Invite(Actor)[target=VulnerabilityCase])`, carrying the replier's
      ledger position in `content`, in the form VAM-04-011 defines (CM-11-011).
    verification: >-
      A unit test confirms that
      `TentativeReject(Invite(Actor)[target=VulnerabilityCase])` matches the full-case
      Invite's RI pattern, and that a `TentativeReject` of a stub Invite matches no
      pattern (CM-11-007).
    adr:
    - ADR-0121
    stories:
    - story_2022_101
    - story_2022_006
  - id: VAM-04-014
    priority: MUST
    kind: protocol
    statement: >-
      The RC reply to the full-case Invite MUST be represented as
      `Reject(Invite(Actor)[target=VulnerabilityCase])`, carrying the replier's ledger
      position in `content`, in the form VAM-04-011 defines (CM-11-011).
    verification: >-
      A unit test confirms that `Reject(Invite(Actor)[target=VulnerabilityCase])`
      matches the full-case Invite's RC pattern and not the stub Invite's `Reject`
      pattern (VAM-04-006).
    adr:
    - ADR-0121
    stories:
    - story_2022_066
    - story_2022_006
  - id: VAM-04-015
    priority: MUST
    kind: protocol
    statement: >-
      `UNDO_CASE_OWNERSHIP_TRANSFER` MUST be represented as
      `Undo(Offer(Offer(VulnerabilityCase)))`: the Case Owner's withdrawal of its
      own proposal, and with it of the open Offer the CASE_MANAGER made from it
      (CM-21-015).
    verification: >-
      A unit test confirms that `Undo(Offer(Offer(VulnerabilityCase)))` matches
      `UndoCaseOwnershipTransferActivityPattern`, which wraps
      `ProposeCaseOwnershipTransferActivityPattern` inside an `Undo` outer
      pattern, and resolves to `UNDO_CASE_OWNERSHIP_TRANSFER`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-015
    stories:
    - story_2022_050
  - id: VAM-04-016
    priority: MUST
    kind: protocol
    statement: >-
      `ACCEPT_ACTOR_RECOMMENDATION` MUST be represented as
      `Accept(Offer(Actor)[target=VulnerabilityCase])`: the CASE_MANAGER's answer to
      the recommender, wrapping the recommender's own `Offer(Actor)` (VAM-04-001), with
      `inReplyTo` naming that Offer (CM-16-006, CM-16-009).
    rationale: >-
      This is the third hop of the exchange, addressed back to the recommender. It
      wraps the first offer, where the Case Owner's decision (VAM-04-002) wraps the
      second, so the inner object type tells the two `Accept`s apart.
    verification: >-
      A unit test confirms that the answer the CASE_MANAGER's adapter builds matches
      `AcceptSuggestActorToCasePattern`, resolves to `ACCEPT_ACTOR_RECOMMENDATION` and
      carries `inReplyTo`.
    relationships:
    - rel_type: refines
      spec_id: CM-16-006
    stories:
    - story_2022_054
  - id: VAM-04-017
    priority: MUST
    kind: protocol
    statement: >-
      `REJECT_ACTOR_RECOMMENDATION` MUST be represented as
      `Reject(Offer(Actor)[target=VulnerabilityCase])`: the CASE_MANAGER's answer to
      the recommender after the Case Owner declines, with `inReplyTo` naming the
      recommender's `Offer(Actor)` (CM-16-007).
    rationale: >-
      Symmetric with VAM-04-016; the Case Owner's `Reject` (VAM-04-003) wraps
      `Offer(CaseParticipant)` instead.
    verification: >-
      A unit test confirms that the answer the CASE_MANAGER's adapter builds matches
      `RejectSuggestActorToCasePattern`, resolves to `REJECT_ACTOR_RECOMMENDATION` and
      carries `inReplyTo`.
    relationships:
    - rel_type: refines
      spec_id: CM-16-007
    stories:
    - story_2022_054
  - id: VAM-04-018
    priority: MUST
    kind: protocol
    statement: >-
      `PROPOSE_CASE_OWNERSHIP_TRANSFER` MUST be represented as
      `Offer(Offer(VulnerabilityCase))` with the case as the proposal's
      `context`: the Case Owner's proposal to the CASE_MANAGER, whose inner Offer
      is the template of the Offer the CASE_MANAGER makes (CM-21-005).
    rationale: >-
      The proposal and the CASE_MANAGER's `Offer(VulnerabilityCase)` (VAM-04-007)
      are told apart by shape, an Offer of an Offer against an Offer of a case,
      so neither pattern needs a sender check and no new vocabulary type is
      needed (ADR-0148).
    verification: >-
      A unit test confirms that a proposal matches
      `ProposeCaseOwnershipTransferActivityPattern`, which wraps
      `OfferCaseOwnershipTransferActivityPattern` inside an `Offer` outer
      pattern, and resolves to `PROPOSE_CASE_OWNERSHIP_TRANSFER`, while its inner
      Offer alone resolves to `OFFER_CASE_OWNERSHIP_TRANSFER` and neither matches
      the other's pattern.
    relationships:
    - rel_type: refines
      spec_id: CM-21-005
    adr:
    - ADR-0148
    stories:
    - story_2022_050
- id: VAM-05
  title: Embargo Management Messages
  specs:
