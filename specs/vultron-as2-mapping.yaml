id: VAM
title: Vultron Semantic–AS2 Mapping
description: Defines the authoritative mapping from each Vultron semantic message type (MessageSemantics enum value) to its
  ActivityStreams 2.0 wire representation. This is the single source of truth for how Vultron domain semantics are encoded
  as AS2 activity structures, isolating transport and wire-encoding concerns from the core domain logic and case-state machines.
version: 1.0.0
scope:
- prototype
- production
tags:
- messaging
- wire-format
groups:
- id: VAM-01
  title: General Mapping Conventions
  specs:
  - id: VAM-01-001
    priority: MUST
    kind: protocol
    statement: Every `MessageSemantics` enum value except `UNKNOWN` MUST have exactly one entry in `SEMANTICS_ACTIVITY_PATTERNS`
      that defines its AS2 wire representation
    verification: A unit test confirms that every `MessageSemantics` value except `UNKNOWN` and
      `UNKNOWN_UNRESOLVABLE_OBJECT` has a non-None `pattern` in `SEMANTIC_REGISTRY`.
    lint_suppress:
    - missing_story_reference
  - id: VAM-01-002
    priority: MUST
    kind: project
    statement: >-
      The AS2 activity patterns defined in this document MUST be implemented as
      `ActivityPattern` objects in `vultron/wire/as2/extractor/_instances.py`.
  - id: VAM-01-002b
    priority: MUST_NOT
    kind: project
    statement: >-
      AS2 activity pattern objects MUST NOT be defined in any module other than
      `vultron/wire/as2/extractor/_instances.py`.
    relationships:
    - rel_type: refines
      spec_id: VAM-01-002
  - id: VAM-01-003
    priority: MUST
    kind: protocol
    statement: Pattern entries in `SEMANTICS_ACTIVITY_PATTERNS` MUST be ordered from most-specific to least-specific so that
      `find_matching_semantics()` returns the correct semantic for overlapping patterns
    verification: Inspection of `vultron/semantic_registry/__init__.py` confirms that `_validate_registry_order()`
      is called at module load time and raises `RegistryOrderError` if a less-specific pattern precedes a
      more-specific one in the same activity-type group.
    lint_suppress:
    - missing_story_reference
  - id: VAM-01-004
    priority: MUST_NOT
    kind: protocol
    statement: An AS2 activity MUST be rehydrated (URI string references expanded to full objects via the DataLayer) before
      pattern matching; pattern matching MUST NOT rely on unhydrated string fields for type discrimination
  - id: VAM-01-005
    priority: MUST
    kind: protocol
    statement: When a pattern specifies a nested activity as the `object` field, the outer activity's `object` MUST be a fully
      rehydrated AS2 activity object matching the inner `ActivityPattern`
    verification: A unit test confirms that `ActivityPattern.match()` recurses into a nested `ActivityPattern`
      for the `object_` field, requiring the outer activity's rehydrated `object_` to satisfy the inner
      pattern's type and field constraints.
    lint_suppress:
    - missing_story_reference
  - id: VAM-01-006
    priority: MUST
    kind: protocol
    statement: 'Pattern matching MUST be conservative when a non-`object_` field is a non-rehydratable URI string: such a
      field MUST be treated as matching any expected type rather than failing the match'
    rationale: Peripheral reference fields (`actor`, `target`, `context`, etc.) do not drive semantic dispatch; conservatively
      matching them avoids false negatives when the DataLayer cannot expand every reference
    verification: A unit test confirms that a URI string in a non-`object_` field (e.g., `actor`) does not cause
      `ActivityPattern.match()` to return `False`, preserving pattern matches when peripheral references are
      not rehydratable.
    lint_suppress:
    - missing_story_reference
  - id: VAM-01-009
    priority: MUST
    kind: protocol
    statement: If the `object_` field of an activity remains a bare string URI after rehydration (i.e., the DataLayer does
      not have a record for that URI), `find_matching_semantics()` MUST return `MessageSemantics.UNKNOWN`
    rationale: Semantic dispatch depends on the object type. A bare string in `object_` makes the object type unknowable;
      proceeding as if the pattern matches would route the activity to the wrong handler
    verification: A unit test confirms that `find_matching_semantics()` returns `MessageSemantics.UNKNOWN` when
      the activity's `object_` remains a bare string URI after rehydration because the DataLayer has no record
      for that URI.
    lint_suppress:
    - missing_story_reference
  - id: VAM-01-007
    priority: MUST
    kind: protocol
    statement: '`MessageSemantics.UNKNOWN` MUST be returned when no registered pattern matches the incoming activity'
    verification: A unit test (`test_find_matching_semantics_returns_unknown_for_unmatched_activity`) in
      `test/wire/as2/test_extractor.py` confirms that `find_matching_semantics()` returns
      `MessageSemantics.UNKNOWN` for an activity matching no registered pattern.
    lint_suppress:
    - missing_story_reference
  - id: VAM-01-008
    priority: MUST
    kind: protocol
    statement: Inbound activities represent state-change notifications, not commands; the AS2 activity type used for each
      semantic MUST reflect the completed state transition, not a requested action
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that every registered
      `ActivityPattern` uses a completed-action activity type (e.g., `Create`, `Accept`, `Reject`) and that
      no imperative or request-type activity variant appears in any pattern.
    lint_suppress:
    - missing_story_reference
- id: VAM-02
  title: Report Management Messages
  specs:
  - id: VAM-02-001
    priority: MUST
    kind: protocol
    statement: '`CREATE_REPORT` MUST be represented as `Create(VulnerabilityReport)`'
    verification: A unit test in `test/wire/as2/test_extractor.py` confirms that `find_matching_semantics()`
      returns `CREATE_REPORT` for a `Create(VulnerabilityReport)` activity, and inspection of `_instances.py`
      confirms `CreateReportPattern` matches this shape.
    lint_suppress:
    - missing_story_reference
  - id: VAM-02-002
    priority: MUST
    kind: protocol
    statement: '`SUBMIT_REPORT` MUST be represented as `Offer(VulnerabilityReport)`'
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that `SubmitReportPattern`
      is registered as `Offer(VulnerabilityReport)`; integration tests in `test/demo/` exercise the full
      report-submission flow end-to-end.
    relationships:
    - rel_type: satisfies
      spec_id: MSM-01-001
      note: RS shorthand → SUBMIT_REPORT → this wire form
    stories:
    - story_2022_012
  - id: VAM-02-003
    priority: MUST
    kind: protocol
    statement: '`ACK_REPORT` MUST be represented as `Read(Offer(VulnerabilityReport))`'
