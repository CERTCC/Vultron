  - id: VAM-05-007
    priority: MUST
    kind: protocol
    statement: '`REJECT_INVITE_TO_EMBARGO_ON_CASE` MUST be represented as `Reject(Invite(Event)[context=VulnerabilityCase])`'
    verification: Inspection of `vultron/wire/as2/extractor/_instances.py` confirms that
      `RejectInviteToEmbargoOnCasePattern` wraps `InviteToEmbargoOnCasePattern` inside a `Reject` outer
      pattern; integration tests in `test/demo/test_establish_embargo_demo.py` exercise this flow.
    relationships:
    - rel_type: satisfies
      spec_id: MSM-02-006
      note: ER shorthand → REJECT_INVITE_TO_EMBARGO_ON_CASE → this wire form
    - rel_type: satisfies
      spec_id: MSM-02-004
      note: EJ shorthand (revision rejected) → same wire form as ER
    stories:
