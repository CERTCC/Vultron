id: PAD
title: Parallel Agentic Development
description: >-
  Requirements for coordinating multiple parallel AI agents and human developers via
  GitHub Issues. Defines the issue hierarchy, label taxonomy, task claiming protocol,
  size labeling, orphan recovery, bundle selection and execution, and revised workflows
  for the build, plan-issue, review-priorities, and update-plan skills, and the
  two paths through GitHub Project #24: Schedule on Epics, and a Status path for
  every other Issue and a ship stage for PRs, both mirrored from facts, and where
  the build-to-merge pipeline places its local test gates.
scope:
  - prototype
  - production
tags:
- tooling
groups:
  - id: PAD-01
    title: Issue Hierarchy
    specs:
      - id: PAD-01-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Tasks MUST be represented as GitHub Issues in the CERTCC/Vultron
          repository. All work is tracked exclusively as GitHub Issues.
        rationale: >-
          Every agent and human contributor reads, claims and links work through GitHub.
          Thus one tracker is the only place where all of them see a claim, a blocker or
          a priority. Selection and the stale-claim sweeper cannot see work in a second
          tracker.
      - id: PAD-01-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Issues MUST be organized in up to three levels: Epic (thematic
          group), Task (coherent unit of work), and Subtask (atomic PR-sized
          chunk). Leaf issues (those with no sub-issues) are the claimable
          work units.
        rationale: >-
          Selection, claiming and sizing all operate on leaf Issues, so the hierarchy
          must end in pieces that one PR can close. Capping the depth at three keeps the
          Epic that sets a leaf's priority tier at most two links away.
      - id: PAD-01-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Epic Issues MUST be wired on GitHub Project #24 with a `Schedule`
          field value (Focus/Now/Next/Later/Someday) that reflects the current
          priority tier of the thematic group they represent.
        rationale: >-
          Agents choose work by Epic tier (PAD-03-003, PAD-08-001). An Epic with no
          `Schedule` value gives no priority to the leaves under it, and tier-ordered
          selection does not find those leaves.
      - id: PAD-01-005
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Task Issues MUST be sub-issues of their parent Epic.
        rationale: >-
          A Task takes its priority tier from its Epic (PAD-02-001), and GitHub shows
          and queries that link only as a sub-issue relationship.
        relationships:
        - rel_type: part_of
          spec_id: PAD-01-002
        - rel_type: refines
          spec_id: PAD-01-007
      - id: PAD-01-006
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Subtask Issues MUST be sub-issues of their parent Task.
        rationale: >-
          Leaf selection and the `Ready` check (PAD-16-004) follow sub-issue links. They
          cannot see a Subtask that has a different link, and its Task then looks like a
          leaf.
        relationships:
        - rel_type: part_of
          spec_id: PAD-01-002
      - id: PAD-01-004
        priority: SHOULD
        kind: process
        statement: >-
          The minimum depth that produces right-sized leaf issues SHOULD be
          used. Not every Epic requires Task or Subtask children.
        rationale: >-
          Each extra level is one more Issue to create, wire and close. An intermediate
          Issue with a single child adds that cost without dividing the work.
      - id: PAD-01-007
        priority: MUST
        kind: process
        statement: >-
          Every open non-Epic Issue (Task, Feature, Bug, Idea, Concern) MUST
          have an
          Epic ancestor. A non-Epic Issue with no Epic ancestor is untriaged,
          and triage consists of routing it to an Epic.
        rationale: >-
          A non-Epic Issue carries no `Schedule` value of its own (PAD-02-001),
          so its only priority signal is its Epic's tier. Without an Epic
          ancestor it is invisible to every tier-ordered selector. Small work
          that belongs to no thematic group goes under a long-lived catch-all
          Epic, whose tier is set like any other Epic's.
        verification: >-
          A query for open non-Epic Issues with no Epic ancestor returns none.
          `theme-fit` is that query, in two parts: it lists each such Issue
          with no parent at all in its untriaged list, for routing, and
          reports one whose parent chain reaches no open Epic as an
          `unparented` finding. `TestUntriaged` and `TestHierarchy` in
          `test/metadata/test_theme_fit.py` check both.
      - id: PAD-01-008
        priority: MUST
        kind: process
        statement: >-
          When the last open sub-issue of an Epic is closed, the Epic MUST be
          closed. This rule does not apply to an Epic that has never had a
          sub-issue.
        rationale: >-
          An Epic reaches "all children closed" only once its tasks are done
          and no further planning is open. Work that arrives later belongs to a
          new Epic, so closing needs no human confirmation and the `Schedule`
          field needs no end-of-life value.
        verification: >-
          No open Epic has sub-issues that are all closed.

  - id: PAD-02
    title: Label Taxonomy
    specs:
      - id: PAD-02-001
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          A non-Epic Issue on GitHub Project #24 MUST NOT carry a `Schedule`
          value. Its priority tier is the `Schedule` value of its nearest Epic
          ancestor.
        rationale: >-
          A child's own `Schedule` value could only restate its Epic's or
          silently differ from it, and skills could not tell deliberate from
          drifted. Holding back one member of an active Epic is done by moving
          it to a separate Epic, or with the `needs-info` hold (PAD-16-004), not
          with a per-issue tier. Priority grouping is by Epic sub-issue
          relationships, not by `group:` labels.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-03-001
      - id: PAD-02-004
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          A `stale-claim` label MUST be applied by the sweeper job (PAD-10)
          when a claimed Issue has no open PR and the claim branch has not
          received a commit within 3 days.
        rationale: >-
          A claim branch is a lock that does not expire (PAD-04-001). If a session stops
          or its owner abandons it, the session holds its Issue until something marks
          the claim. The label makes the stale claim visible, and agents skip the Issue
          (PAD-02-011) until a human decides.
      - id: PAD-02-011
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Agents MUST skip Issues that carry the `stale-claim` label.
        rationale: >-
          A stale claim can still have work behind it that nobody pushed. An agent that
          takes the Issue can conflict with that work. Thus only a human, who can ask
          the claimant, releases the Issue.
        relationships:
        - rel_type: refines
          spec_id: PAD-04-003
      - id: PAD-02-005
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          A `needs-rebase` label MUST be applied when an open PR has merge
          conflicts that cannot be automatically resolved (PAD-11). Human
          intervention is required before the label is removed.
        rationale: >-
          An unresolvable conflict means that an agent stopped (PAD-11-005). Without a
          marker, other agents and the merge step continue to select the PR. The label
          shows that the PR waits for a person. Only the person who resolved the
          conflict knows when it is safe to remove the label.
      - id: PAD-02-006
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Docs-only PRs (containing only `specs/` and `notes/` changes) MUST
          carry the `specs-notes` label to identify them as docs-only for
          reviewers.
        rationale: >-
          The label tells a reviewer that the PR changes no code and needs no test
          review. It also lets skills and humans find planning PRs with a query.
      - id: PAD-02-008
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Every thematic group that has two or more open leaf Issues MUST have
          exactly one open Epic Issue on GitHub Project #24. A leaf Issue is
          any Issue with no open sub-issues.
        rationale: >-
          A group with several open leaves needs one place that holds their shared
          priority tier and shows their progress. With two Epics for one group, the same
          work can have two tiers. With no Epic, the leaves have no tier (PAD-02-001).
      - id: PAD-02-009
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          An agent or person who creates an Epic Issue MUST give it the GitHub
          `Epic` issue type. They set it through the GraphQL `createIssue`
          mutation with the type's `issueTypeId`, which the `issueTypes` query
          returns.
        rationale: >-
          Skills identify an Epic by its issue type, not by a label. Only GraphQL can
          set the issue type, and it needs the ID of the type, which a query must find
          first.
      - id: PAD-02-013
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `create-epic` skill MUST be used to create Epic Issues to ensure
          consistent sub-issue wiring, correct issue type assignment, and
          addition to Project #24.
        rationale: >-
          To create an Epic takes several API calls, and a missed call gives no error. A
          missing type, a missing board item or an unwired child each hides work from
          selection. One skill that makes every call gives the same result each time.
        relationships:
        - rel_type: implements
          spec_id: PAD-02-009
      - id: PAD-02-014
        priority: MUST
        kind: process
        statement: >-
          Every open leaf Issue MUST carry exactly one `theme:` label, chosen
          from the active themes in the theme catalog in
          `notes/epic-themes.md`.
        rationale: >-
          A theme names the outcome an Issue delivers. With no theme, nobody can
          check that the Issue belongs in its Epic. With two, the Issue serves two
          outcomes, and it cannot be ranked with either one.
        verification: >-
          A query for open leaf Issues returns none that carries no `theme:`
          label, more than one, or one that is not active in the catalog that
          `load_theme_catalog()` reads. `theme-fit` is that query: it reports
          each such Issue as a `leaf-theme-count`, `unknown-theme` or
          `retiring-theme` finding, and `TestLeafThemeCount` and
          `TestCatalogMembership` in `test/metadata/test_theme_fit.py` check each case.
      - id: PAD-02-015
        priority: MUST
        kind: process
        statement: >-
          An Epic Issue MUST carry one `theme:` label, chosen from the active
          themes in the theme catalog, and a second one only when its body
          names the split between the two themes.
        rationale: >-
          An Epic is one design idea, and one design idea serves one outcome. An
          unexplained second theme shows that the Epic holds two ideas. A named
          split shows that a person decided that the two themes share one idea.
        verification: >-
          A query for open Epics returns none with no `theme:` label, more
          than two, or one that is not active in the catalog that
          `load_theme_catalog()` reads, and none with two whose body has no
          line that names the split. `theme-fit` is that query; it takes a
          body line that names both labels as the named split and reports a
          breach as an `epic-theme-count` finding, which `TestEpicThemeCount`
          in `test/metadata/test_theme_fit.py` checks.
      - id: PAD-02-016
        priority: MUST
        kind: process
        statement: >-
          An Issue's `theme:` label MUST name the outcome that the Issue's own
          content delivers. The label is not copied from the parent Epic or
          from the work that found the Issue.
        rationale: >-
          A copied theme hides the case that this rule exists to find: an Issue
          in the wrong Epic. A bug that a test Epic finds is still a protocol
          bug, and an Issue that has its parent's label looks as if it fits.
        verification: >-
          A blind classification of an Issue, made from its body without its
          labels or its parent, picks the theme the Issue carries.
      - id: PAD-02-017
        priority: MUST
        kind: process
        statement: >-
          Every sub-issue of an Epic MUST carry a `theme:` label that the Epic
          also carries.
        rationale: >-
          Epics are cut by design idea, and each design idea sits inside one
          theme. When the children of an Epic serve different outcomes, the Epic
          has no single priority. The child must move, its label must change, or
          the Epic must split.
        verification: >-
          A query for open Epics returns none with a sub-issue whose `theme:`
          label the Epic does not carry. `theme-fit` is that query: it reports
          each such sub-issue as a `theme-mismatch` finding, which
          `TestMismatch` in `test/metadata/test_theme_fit.py` checks.
      - id: PAD-02-018
        priority: MUST
        kind: process
        statement: >-
          An Issue body with a `theme:` label MUST include a line of the form
          `Theme: <label> — <outcome>`. The `<outcome>` is what this Issue
          delivers toward that theme.
        rationale: >-
          A label alone gives a reviewer nothing to check. The reason line states
          why the theme fits, so that a reviewer can compare it with the body and
          a wrong classification is visible.
        verification: >-
          A query for open Issues with a `theme:` label returns none whose body
          has no line that starts with `Theme:`, names that label, and follows
          it with a spaced dash and outcome text.
          `theme-fit` is that query: it reports each such Issue as a
          `missing-reason-line` finding, which `TestReasonLine` in
          `test/metadata/test_theme_fit.py` checks.
      - id: PAD-02-019
        priority: MUST
        kind: process
        statement: >-
          The `theme:` labels on GitHub MUST be created and updated from the
          theme catalog block in `notes/epic-themes.md` with the `theme-labels`
          command, not edited by hand.
        rationale: >-
          A label made by hand has no in-bounds or out-of-bounds text, so the
          next person who classifies an Issue has only the label name. One
          source also stops the GitHub description and the note from becoming
          different.
        verification: >-
          In `test/metadata/test_theme_catalog.py`, `TestRepositoryCatalog`
          loads the committed catalog, and
          `TestMain::test_apply_creates_and_edits_never_deletes` checks that
          `theme-labels --apply` creates the missing labels and edits the
          changed labels from a catalog.
      - id: PAD-02-020
        priority: MUST_NOT
        kind: process
        statement: >-
          The `theme-labels` command MUST NOT delete a label.
        rationale: >-
          When a label is deleted, GitHub removes it from every Issue that has
          it, and the Issues do not keep a record of it. Only a person can decide
          that a theme is no longer used.
        verification: >-
          `TestMain::test_apply_creates_and_edits_never_deletes` in
          `test/metadata/test_theme_catalog.py` checks that an apply run with an
          unlisted label makes only create and edit calls.
        relationships:
        - rel_type: constrains
          spec_id: PAD-02-021
      - id: PAD-02-021
        priority: MUST
        kind: process
        statement: >-
          The `theme-labels` command MUST report each `theme:` label on GitHub
          that the theme catalog does not list.
        rationale: >-
          The command does not delete labels (PAD-02-020), so an unlisted label
          stays on GitHub. Without a report, it stays there unseen, and agents
          can still apply a theme that the catalog does not define.
        verification: >-
          `TestDrift::test_missing_changed_unlisted` in
          `test/metadata/test_theme_catalog.py` checks that a `theme:` label
          absent from the catalog is reported as unlisted.
      - id: PAD-02-022
        priority: MUST
        kind: process
        statement: >-
          Agents MUST create every Issue except an Epic only through the
          `create-issue` skill, which picks the Issue's one theme by its own
          outcome, writes its `Theme:` line, and makes it a sub-issue of an
          open Epic with the same theme. Epics are created through
          `create-epic` (PAD-02-013). This rule covers agents only; an Issue
          that a GitHub Actions workflow files follows PAD-02-026 to PAD-02-029.
        rationale: >-
          When each skill files Issues its own way, each one drops a different
          rule. Bugs then land under the Epic of the work that found them, and
          Issues get no theme. One path applies every rule the same way.
        relationships:
        - rel_type: implements
          spec_id: PAD-02-017
        verification: >-
          `TestCreationPath` in `test/metadata/test_theme_gate.py` checks that
          no skill under `.agents/skills/` except `create-issue`,
          `manage-github-issue`, and `create-epic` calls the create mode of
          `manage_github_issue.sh`, `create_epic.sh`, `gh issue create`, or a
          `createIssue` mutation.
        see_also:
        - spec_id: PAD-02-013
          reason: 'scope boundary: Epics are created another way'
        - spec_id: PAD-02-026
          reason: 'scope boundary: workflow-filed Issues follow other rules'
        - spec_id: PAD-02-029
          reason: 'scope boundary: workflow-filed Issues follow other rules'
      - id: PAD-02-023
        priority: MUST
        kind: process
        statement: >-
          `manage_github_issue.sh` MUST refuse to create an Issue that does not
          carry exactly one active catalog `theme:` label, has no `Theme:` line
          naming it, or has a parent that is closed or does not carry that
          theme. The refusal names every rule broken and creates nothing.
        rationale: >-
          A skill is text that an agent can misread. A check in the script that
          creates the Issue stops an Issue that breaks a theme rule before it
          exists, so the `theme-fit` report does not have to find it later.
        relationships:
        - rel_type: implements
          spec_id: PAD-02-014
        - rel_type: implements
          spec_id: PAD-02-018
        verification: >-
          In `test/metadata/test_theme_gate.py`, `TestManageScriptGate` runs the
          script against a stand-in `gh` and checks that a missing theme, two
          themes, a missing `Theme:` line, and a parent with another theme
          each exit 1 with no `createIssue` call. `TestLeaf` checks the rules
          the script calls: an unknown or retiring theme, a closed parent, a
          parent with no theme, and that every broken rule is reported.
      - id: PAD-02-024
        priority: MUST
        kind: process
        statement: >-
          When no open Epic with the new Issue's theme fits it and no user is
          present, the `create-issue` skill MUST create a `Someday` Epic in that
          theme, marked as auto-calved, and make the Issue its sub-issue.
        rationale: >-
          An Issue without a parent has no tier and is invisible to planning
          (PAD-01-007). An unattended run cannot ask, so an Epic that a person
          reviews later is better than an orphan; the auto-calved marker lets
          `theme-fit` show it until someone does.
        relationships:
        - rel_type: implements
          spec_id: PAD-01-007
        verification: >-
          `TestUnattendedAutoCalve` in `test/metadata/test_theme_gate.py`
          fails if the `create-issue` skill's no-user branch stops calving
          through `create-epic`, at `Someday`, with the `<!-- auto-calved -->`
          marker, or stops forbidding an Issue with no parent. The
          `manage_github_issue.sh` create mode refuses an Issue with no
          `--parent` (PAD-02-023). Whether an unattended run followed the
          branch is checked at review, and after the fact by `theme-fit`'s
          `single-child-calved-epic` finding, which
          `test/metadata/test_theme_fit.py` checks.
      - id: PAD-02-025
        priority: MUST
        kind: process
        statement: >-
          `create_epic.sh` MUST refuse to create an Epic that does not carry one
          active catalog theme, or two with a body line naming both, and a
          `Theme:` line naming it.
        rationale: >-
          An Epic is the parent every new Issue's theme is checked against
          (PAD-02-023). An Epic created without a theme would refuse every
          child, and one with an unnamed second theme holds two design ideas.
        relationships:
        - rel_type: implements
          spec_id: PAD-02-015
        verification: >-
          `TestCreateEpicScriptGate` in `test/metadata/test_theme_gate.py`
          checks that a missing theme argument, a missing `Theme:` line, and
          two themes with no named split each fail before any `gh` call.
      - id: PAD-02-026
        priority: MUST
        kind: process
        statement: >-
          An Issue that a GitHub Actions workflow files MUST carry exactly one
          `theme:` label and a `Theme:` line naming it, set by the workflow.
        rationale: >-
          The theme and the `Theme:` line show which Epics are candidates for
          an Issue that has no parent (PAD-02-027), so routing it later is
          quick. A workflow sets them because no agent or skill is in the loop
          to do it.
        relationships:
        - rel_type: refines
          spec_id: PAD-02-014
        - rel_type: refines
          spec_id: PAD-02-018
        verification: >-
          In `test/ci/test_bot_issue_triage.py`, the `notify-failure` action and
          the Demo Recordings workflow run against a stand-in `gh` on both the
          file and the update arm. The tests check that each issue gets one
          theme and a `Theme:` line, and that `theme-fit` reports no finding
          on it.
      - id: PAD-02-027
        priority: MUST_NOT
        kind: process
        statement: >-
          A GitHub Actions workflow that files an Issue MUST NOT make it a
          sub-issue. The Issue starts untriaged (PAD-01-007) until someone
          routes it to an Epic.
        rationale: >-
          A workflow cannot ask anyone and cannot calve an Epic, so it can only
          use an Epic that someone names in advance. A fixed Epic number needs
          upkeep each time that Epic closes, is rethemed or split, or fills
          up, and the workflow fails until someone edits it.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-01-007
        verification: >-
          In `test/ci/test_bot_issue_triage.py`, the tests that run each filer
          against a stand-in `gh` check that no call sets a parent. A scan
          checks that no file under `.github/` names a `vars.*EPIC*` variable
          or sets a parent through `addSubIssue` or a write to the REST
          `sub_issues` endpoint.
      - id: PAD-02-028
        priority: MUST
        kind: process
        statement: >-
          `theme-fit` MUST list each open non-Epic Issue that has no parent as
          untriaged, apart from its findings, without counting it against a
          clean report.
        rationale: >-
          Workflows file Issues with no parent on purpose (PAD-02-027), so a
          report that counted them as findings would never come back clean.
          Listing them still shows triage what to route (PAD-01-007).
        relationships:
        - rel_type: verifies
          spec_id: PAD-01-007
        verification: >-
          `TestUntriaged` and `TestMain::test_only_untriaged_issues_exit_zero`
          in `test/metadata/test_theme_fit.py` check the list, the clean
          report and exit 0. `test/ci/test_bot_issue_triage.py` checks that
          each issue a workflow files is listed as untriaged.
      - id: PAD-02-029
        priority: MUST_NOT
        kind: process
        statement: >-
          A GitHub Actions workflow MUST NOT change the `theme:` label or the
          body of an Issue whose `theme:` label a person set.
        rationale: >-
          A person who chose another theme read the Issue; the workflow did
          not. Leaving their choice keeps a later run from undoing triage.
        relationships:
        - rel_type: constrains
          spec_id: PAD-02-026
        verification: >-
          `test_helper_leaves_an_issue_a_person_re_themed_alone` in
          `test/ci/test_bot_issue_triage.py` checks that the helper makes no
          edit to an Issue that carries another theme.
      - id: PAD-02-030
        priority: MUST
        kind: process
        statement: >-
          An Epic's title MUST be a done-state claim: a present-tense sentence
          in domain terms, false when the Epic opens and true when it closes.
        rationale: >-
          The board shows Epics by title alone. A feature name, an activity or
          a mechanism says what area is being worked, not what changes, so
          sibling Epics cannot be told apart and nobody can tell from the
          board whether one is done. A claim says what the Epic changes and
          doubles as its close test. It fits a guarantee ("X never happens")
          as well as a feature ("X can do Y").
        verification: >-
          A reviewer checks each new or retitled Epic's title when
          `calve-epics` proposes it or `create-epic` creates it; whether a
          title states the right claim is judgment. The one label form a
          script can see, a title that starts with `Epic:`, `theme-gate --epic`
          refuses and `theme-fit` reports as an `epic-title-prefix` finding,
          which `TestEpicForm` in `test/metadata/test_theme_gate.py` and in
          `test/metadata/test_theme_fit.py` checks.
      - id: PAD-02-031
        priority: SHOULD
        kind: process
        statement: >-
          An Epic's title SHOULD name, as its subject, the audience its claim
          serves when one is natural. For protocol work the audience is a
          reporter, vendor, coordinator, participant or the CASE_MANAGER; for
          project work it is a maintainer, agent or docs reader.
        rationale: >-
          A named audience tells a board reader whom the Epic serves. It is a
          SHOULD because a guarantee often has no natural subject, and a
          forced one ("case managers can count on…") reads worse than the
          claim alone.
        relationships:
        - rel_type: extends
          spec_id: PAD-02-030
        verification: >-
          A reviewer checks the title with PAD-02-030.
      - id: PAD-02-032
        priority: MUST_NOT
        kind: process
        statement: >-
          An Epic's title MUST NOT contain an ADR number or a spec ID.
        rationale: >-
          A bare ID means nothing to a board reader and turns the title toward
          mechanism. IDs belong in the `Design idea:` line (PAD-02-038).
        relationships:
        - rel_type: extends
          spec_id: PAD-02-030
        verification: >-
          `theme-gate --epic`, which `create_epic.sh` runs with the title,
          refuses a title holding an ADR number, a spec ID, or a group ID whose
          prefix is a spec topic, and
          `theme-fit` reports each open Epic with one as an `epic-title-id`
          finding. `TestEpicForm` in `test/metadata/test_theme_gate.py` and in
          `test/metadata/test_theme_fit.py` checks both, and
          `test_refuses_an_id_in_the_title` checks that the script stops
          before any `gh` call.
      - id: PAD-02-033
        priority: MUST
        kind: process
        statement: >-
          An Epic's `Theme:` line MUST give, as the outcome PAD-02-018 asks
          for, the consequence of the title's claim that a reader of the theme
          notices.
        rationale: >-
          The title already states the claim, so the `Theme:` line adds what
          the title cannot show: how the claim serves the theme the Epic is
          ranked in. Read as "why the claim matters", the line was written as
          a second copy of the claim in most Epics; naming the consequence a
          reader notices gives it its own content.
        relationships:
        - rel_type: refines
          spec_id: PAD-02-018
        verification: >-
          A reviewer checks the body when `calve-epics` proposes the Epic.
      - id: PAD-02-034
        priority: MUST_NOT
        kind: process
        statement: >-
          An Epic body MUST NOT restate its title, its `Theme:` line or its
          `Design idea:` line in another line or section.
        rationale: >-
          Each repeat is one more copy to keep in step when the Epic changes,
          and copies drift. Every section of the body has to add something the
          others do not say.
        verification: >-
          A reviewer checks the body with PAD-02-033. The repeats a script can
          see, `theme-gate --epic` refuses and `theme-fit` reports: a
          `Theme:` outcome holding, or a cut-down copy of, the title
          (`theme-outcome-repeats`), a `Design idea:` line holding, or a
          cut-down copy of, the title or a `Theme:` outcome
          (`design-idea-repeats`), and a `## Design idea` section that repeats
          the line (`design-section-repeats`). `TestEpicForm` in
          `test/metadata/test_theme_gate.py` and in
          `test/metadata/test_theme_fit.py` checks all three.
      - id: PAD-02-035
        priority: SHOULD
        kind: process
        statement: >-
          An Epic SHOULD hold no more than 12 open Task, Feature and Bug
          leaves, about what one `work-epic-tasks` run drains.
        rationale: >-
          An Epic that one run can drain has one clear point at which its
          claim comes true. A larger one stays open across many sessions and
          its claim stays false long after most of its work is done.
          `work-epic-tasks` drains Tasks and Bugs and never Ideas or Concerns,
          which `plan-issue` works one at a time, so only the kinds a run
          drains count; an Epic of 12 Ideas is a planning queue, not an
          oversized Epic. The number 12 gives a point to act: "about 10" left
          Epics at 11 and 12 with no clear call.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-01-002
        verification: >-
          A reviewer checks the open Task, Feature and Bug count when
          `calve-epics` proposes, fuses or splits an Epic; Mode 3 proposes a
          split for an Epic over the bound, and a kept-whole one gets a
          comment giving the reason.
      - id: PAD-02-036
        priority: SHOULD
        kind: process
        statement: >-
          Two Epics SHOULD be fused only when they share an outcome and the
          fused Epic fits PAD-02-035.
        rationale: >-
          A shared outcome is not a reason to merge when the result is too big
          to work. Epics that share an outcome but would be too large together
          stay separate, split by size (PAD-02-037). It is a SHOULD because
          the size bound it tests against is approximate.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-02-035
        verification: >-
          A reviewer checks the outcomes and child counts when `calve-epics`
          fuses Epics.
      - id: PAD-02-037
        priority: MUST
        kind: process
        statement: >-
          Epics that share an outcome but stay separate for size MUST each
          claim their own slice of that outcome in their titles.
        rationale: >-
          A size split is a valid cut, but two titles that make the same claim
          cannot be told apart on the board. Each sibling names the slice it
          makes true: a layer, a set of spec groups, or a phase.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-02-030
        verification: >-
          A reviewer checks sibling titles when `calve-epics` splits an Epic
          or proposes one beside a sibling with the same outcome.
      - id: PAD-02-038
        priority: MUST
        kind: process
        statement: >-
          An Epic body MUST include a `Design idea:` line that states the
          approach tying the Epic's children together, including any
          mechanism, ADR numbers and spec IDs.
        rationale: >-
          The title carries no mechanism and no IDs (PAD-02-032), so the
          approach needs one home in the body. The design idea as an approach
          is also the grain `calve-epics` cuts Epics along.
        verification: >-
          `theme-gate --epic` refuses an Epic body with no `Design idea:` line
          that has text after the colon, and `theme-fit` reports each open
          Epic without one as a `missing-design-idea` finding. `TestEpicForm`
          in `test/metadata/test_theme_gate.py` and in
          `test/metadata/test_theme_fit.py` checks both, and
          `test_refuses_a_missing_design_idea` checks that `create_epic.sh`
          stops before any `gh` call. Whether the line states the approach is
          a reviewer's call when `calve-epics` proposes the Epic.
      - id: PAD-02-039
        priority: MUST
        kind: process
        statement: >-
          A proposal to fuse Epics at different Schedule tiers MUST state the
          tier the fused Epic takes.
        rationale: >-
          Leaves take their Epic's tier (PAD-02-001), so fusing a Someday Epic
          into a Next one moves every child it brings to Next. Stated, the
          change is the user's to accept; unstated, the children are promoted
          or buried without anyone deciding it.
        relationships:
        - rel_type: extends
          spec_id: PAD-02-036
        verification: >-
          A reviewer checks the fuse proposal when `calve-epics` Mode 3 makes
          it.
      - id: PAD-02-040
        priority: MUST
        kind: process
        statement: >-
          An Epic split off another MUST take its parent's Schedule tier,
          unless the split proposal states a different one.
        rationale: >-
          A size split changes how work is grouped, not when it is done. A
          slice that keeps its parent's tier keeps every child's rank, so no
          in-flight work moves; a different tier is a ranking decision the
          user makes on its own.
        verification: >-
          A reviewer checks the split proposal when `calve-epics` Mode 3 makes
          it.
      - id: PAD-02-041
        priority: MUST_NOT
        kind: process
        statement: >-
          An Issue opened during other work (any `opened-as` reason) that does
          not block the Issue being worked, and that the PR working that Issue
          does not also close, MUST NOT be routed to a Focus or Now Epic unless
          that Epic's title claim stays false while the Issue is open. It is
          routed among the same-theme Epics in Next, Later and Someday instead.
        rationale: >-
          A finding about code an agent is touching always matches best the
          Epic that is working on that code, and it inherits that Epic's tier.
          Routed by grain alone, discovered work piles into Focus Epics, which
          then never finish and crowd out the work the quarter planned. The
          title test keeps a discovery that is part of the Epic's claim, such
          as a mismatch an audit Epic exists to find, and sends the rest to be
          ranked on its own. An Issue the same PR closes is part of delivering
          the worked Issue, not backlog to rank, so it may go under the worked
          Issue's Epic whatever its tier.
        relationships:
        - rel_type: extends
          spec_id: PAD-02-022
        verification: >-
          A reviewer checks the routing `create-issue` Phase 8 reports for each
          discovered Issue: a Focus or Now parent comes with the Issue blocking
          the worked Issue, the PR that also closes it, or the reason its
          parent's title claim needs it.

  - id: PAD-03
    title: Priority Ordering Authority
    specs:
      - id: PAD-03-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `Schedule` field (Focus/Now/Next/Later/Someday) on Epic Issues on
          GitHub Project #24 MUST be the authoritative source for work
          priority ordering.
        rationale: >-
          The Project #24 board is the single source of truth for scheduling,
          and scheduling is decided per body of work, not per issue.
      - id: PAD-03-004
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          A person or skill that changes work priority MUST update the
          `Schedule` field on the relevant Epic, not an external file.
        rationale: >-
          Selection reads only the `Schedule` field (PAD-03-003). A priority
          change kept in a file does not reach selection, and the file and the
          board then disagree.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-03-001
      - id: PAD-03-002
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          Agents MUST NOT create or write to any external priority-ordering
          file. Only the `review-priorities` skill (and humans directly) may
          change `Schedule` field values on GitHub Project #24.
        rationale: >-
          With a second ordering source, two places can disagree, and no rule says which
          one is correct. When only one skill and humans write `Schedule`, each priority
          change is a deliberate decision, not a side effect of other work.
      - id: PAD-03-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          When the `build` skill selects a task, it MUST query GitHub
          Project #24 for Epics with `Schedule=Focus` or `Schedule=Now`
          (Focus first), then select an open unblocked leaf Issue that is a
          sub-issue of one of those Epics and passes the PAD-08-001 filters
          (no `stale-claim`, `needs-info`, or `ready-for-human` label, and not
          already assigned).
        rationale: >-
          Selecting from the top tiers keeps parallel agents on the work humans ranked
          highest, and the filters keep them off work that is claimed, held or waiting
          on a person.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-08-001

  - id: PAD-04
    title: Task Claiming Protocol
    specs:
      - id: PAD-04-001
        priority: MUST
        kind: process
        statement: >-
          An agent MUST claim an Issue before beginning work on it by having
          GitHub create a branch named `<prefix>/<issue-number>-<slug>` linked
          to the Issue, then checking that branch out. The branch's existence
          on GitHub is the authoritative distributed lock: if it already
          exists, the Issue is already claimed. A bundle member other than the
          first is claimed by the first member's branch instead (PAD-15-009),
          so "the Issue's claim branch" means its own branch or, for such a
          member, its bundle's branch.
        rationale: >-
          A branch that exists only in a local clone locks nothing across machines or
          cloud agents. The stale-claim sweeper also cannot see it until the agent
          pushes a PR. A linked branch that GitHub creates also shows in the Development
          sidebar of the Issue. When the name exists, `createLinkedBranch` returns a
          null `linkedBranch`, not an error, and that null is the "already claimed"
          signal. `gh issue develop` exits 0 in the same case, so it is not a lock.
        verification: >-
          `test/metadata/test_claim_scripts.py`: `claim-issue.sh` creates the
          branch through `createLinkedBranch`, checks it out, and refuses
          without assigning anyone when the branch already exists on GitHub.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-15-009
      - id: PAD-04-002
        priority: MUST
        kind: process
        statement: >-
          After creating the claim branch, the agent MUST assign the Issue to
          the triggering user.
        rationale: >-
          The branch is the lock, but humans read the assignee. A claim that does not
          set it holds the Issue but shows it as free.
        verification: >-
          `test/metadata/test_claim_scripts.py`: a successful claim assigns
          `@me` through `announce-claim.sh`.
      - id: PAD-04-005
        priority: MUST
        kind: process
        statement: >-
          After creating the claim branch, the agent MUST set the Issue's
          Project #24 `Status` to `In Progress` (PAD-16-008).
        rationale: >-
          The board reads `Status`. A claim that does not set it holds the Issue but
          shows it on the board as free.
        verification: >-
          `test/metadata/test_claim_scripts.py`: a successful claim sets
          `Status` through `announce-claim.sh`.
        relationships:
        - rel_type: extends
          spec_id: PAD-04-002
        - rel_type: implements
          spec_id: PAD-16-008
      - id: PAD-04-006
        priority: MUST
        kind: process
        statement: >-
          After creating the claim branch, the agent MUST post a comment on the
          Issue that identifies the agent session and the branch name.
        rationale: >-
          The comment connects the Issue to its session and branch, so a person can
          trace a stale claim.
        verification: >-
          `test/metadata/test_claim_scripts.py`: a successful claim comments
          with the branch name through `announce-claim.sh`, and a claim on an
          Epic comments too. Nothing yet checks that the comment identifies the
          agent session: the comment `announce-claim.sh` posts names only the
          branch.
        relationships:
        - rel_type: extends
          spec_id: PAD-04-002
      - id: PAD-04-007
        priority: MUST_NOT
        kind: process
        statement: >-
          An agent that claims an Epic this way, to plan it, MUST NOT assign
          the Epic or set its `Status`.
        rationale: >-
          An Epic carries no `Status` (PAD-16-012). Its assignee is the epic-run
          claim (PAD-19-001), so it shows that an epic run holds the Epic. A planning
          claim must not set that signal.
        verification: >-
          `test/metadata/test_claim_scripts.py`: a claim on an Epic only
          comments, with no assignment and no `Status`.
        relationships:
        - rel_type: supersedes
          spec_id: PAD-04-002
        - rel_type: supersedes
          spec_id: PAD-04-005
      - id: PAD-04-003
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          Agents MUST NOT begin implementation work on an Issue whose claim
          branch already exists, whose `stale-claim` label is set, or that
          is already assigned to another user.
        rationale: >-
          Each of these facts means that another session can own the work. If an agent
          starts anyway, one Issue gets two branches that diverge, and the work on one
          of them is wasted.
      - id: PAD-04-004
        priority: SHOULD
        kind: process
        statement: >-
          An agent working on a claimed Issue SHOULD push the claim branch at
          each checkpoint of its workflow, so that the branch's last commit on
          GitHub reflects current activity.
        rationale: >-
          The stale-claim sweeper (PAD-10-001) judges activity by the claim
          branch's last commit on GitHub, so work kept only in a local clone
          reads as abandoned.

  - id: PAD-05
    title: Size Labeling
    specs:
      - id: PAD-05-001
        priority: MUST
        kind: process
        statement: >-
          At Issue creation, an Issue with 1 acceptance-criteria (AC)
          checkbox MUST receive the `size:S` label.
        rationale: >-
          Provides an objective, count-based size estimate at the point the
          Issue is created, before any implementation diff is available.
        verification: >-
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          AC ceiling itself, and
          `::TestBandForAcs::test_each_ceiling_and_the_one_after_it_land_correctly`
          pins that the ceiling is inclusive.
      - id: PAD-05-002
        priority: MUST
        kind: process
        statement: >-
          At PR open time, the actual diff (total lines added plus removed
          across all changed files) MUST be measured and the corresponding
          `size:` label applied to the **pull request**. This applies to PRs
          whose head branch is in this repository; a PR from a fork is exempt,
          because the workflow that applies the label holds a read-only token
          there.
        rationale: >-
          The diff is the objective measure of the work delivered, and it exists only
          when the PR exists. The label goes on the PR because the measurement describes
          the PR. On the Issue, the label would replace the estimate (PAD-05-010) on an
          Issue that is about to close.
        verification: >-
          `.github/workflows/pr-size-label.yml` applies it on every push to a
          same-repo PR;
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          thresholds themselves and `::TestBandForDiff` pins their inclusivity.
      - id: PAD-05-003
        priority: MUST
        kind: process
        statement: >-
          The measured `size:` label on the pull request (PAD-05-002) is the
          authoritative size of the delivered change; the AC-count label on the
          Issue is an estimate only.
        rationale: >-
          The estimate and the measurement answer different questions, so each keeps its
          own label. Naming the PR label as authoritative tells a reader which one
          describes the change that shipped.
        verification: >-
          `.github/workflows/pr-size-label.yml` writes the measured label with
          `gh pr edit` only and never touches the Issue, so the two coexist;
          `.agents/skills/shared/sizing.md` records which of them is
          authoritative for what.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-05-002
      - id: PAD-05-010
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          The PR-open measurement MUST NOT overwrite the AC-count estimate
          label on the Issue.
        rationale: >-
          Keeping both makes estimate-versus-actual a queryable calibration
          signal. Overwriting the estimate destroys the only record of what the
          work was predicted to cost, and does so at the moment the Issue
          closes, where no consumer reads the result.
      - id: PAD-05-011
        # The survey figures live in this rationale and nowhere else (#3544),
        # so it is long on purpose.
        lint_suppress:
        - rationale_too_long
        priority: MUST
        kind: process
        statement: >-
          Every `size:` label — estimate or measurement — MUST be derived from
          the shared band table in
          `vultron/metadata/planning/size_bands.py`, via the `pr-size` console
          script.
        rationale: >-
          A threshold that prose restates can contain a typing error, and each copy
          changes independently. With one table and one tool that applies it, every
          label uses the same bands. This rationale is also the one place that states
          the survey figures behind the bands; every other site points here, and a
          recalibration replaces them here (re-run with `pr-size --calibrate`).
          Survey of 2026-11-03, PRs merged 2026-09-22..2026-11-03: under the previous
          bands and AC rule, 22% of estimates matched the measured band and 76% were
          too small. The current AC rule scored 42% exact, 95% within one band and
          23% too small on held-out Issues, against 14% / 62% / 83% for the
          previous rule. The current diff
          ceilings sit near the p23 / p61 / p87 quantiles the previous bands were cut
          at, recomputed on those PRs. Later bug fixes per 1,000 diff lines are flat
          from 200 to 3,500 lines (0.4–0.7, overlapping intervals), so no size marks a
          quality break; above about 2,500 lines the CI-fix rate doubles (about 40%
          against 20%), which is where `size:XL` starts. Drift baseline,
          `pr-size --calibrate` on 2026-11-05 over 60 days (1081 merged PRs): band
          shares S / M / L / XL 27.5% / 34.5% / 23.3% / 14.7% against targets 23 /
          38 / 26 / 13; p23 / p61 / p87 at 156 / 970 / 2665 diff lines; the existing
          Issue estimates, made under the previous AC rule, 32% exact and 80% within
          one band of 898; median 262 diff lines per AC. Earlier, while the rule
          lived only in skill prose, a survey of 692 PRs merged
          2026-07-22..2026-09-22 found 40% with no `size:` label and `size:S`
          applied correctly 24% of the time, which is why `pr-size-label` applies
          the measured label (PAD-05-002).
        verification: >-
          `test/metadata/test_size_bands.py::TestDerivation` asserts every
          derived constant reads the table rather than restating it, and
          `::TestCalibratedValues` pins the one table it all derives from.
      - id: PAD-05-004
        priority: MUST
        kind: process
        statement: >-
          At Issue creation, an Issue with 2–3 acceptance-criteria (AC)
          checkboxes MUST receive the `size:M` label.
        rationale: >-
          Provides an objective, count-based size estimate at the point the
          Issue is created, before any implementation diff is available.
        verification: >-
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          AC ceiling itself, and
          `::TestBandForAcs::test_each_ceiling_and_the_one_after_it_land_correctly`
          pins that the ceiling is inclusive.
      - id: PAD-05-005
        priority: MUST
        kind: process
        statement: >-
          At Issue creation, an Issue with 4–8 acceptance-criteria (AC)
          checkboxes MUST receive the `size:L` label.
        rationale: >-
          Provides an objective, count-based size estimate at the point the
          Issue is created, before any implementation diff is available.
        verification: >-
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          AC ceiling itself, and
          `::TestBandForAcs::test_the_last_ceiling_is_inclusive_and_one_past_it_decomposes`
          pins that the ceiling is inclusive.
      - id: PAD-05-006
        priority: MUST
        kind: process
        statement: >-
          At PR open time, a diff of ≤200 lines MUST receive the `size:S`
          label.
        rationale: >-
          The size label shows the implementation effort measured at PR open time
          (PAD-05-002). The `size:S` ceiling sits near the quantile of merged-PR diff
          size it was cut at (the survey in the PAD-05-011 rationale). Thus `size:S`
          holds the small changes, and it is not a band that almost no PR falls in.
        verification: >-
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          threshold value itself, and
          `::TestBandForDiff::test_each_ceiling_and_the_line_after_it_land_correctly`
          pins that the ceiling is inclusive.
      - id: PAD-05-007
        priority: MUST
        kind: process
        statement: >-
          At PR open time, a diff of 201–1000 lines MUST receive the `size:M`
          label.
        rationale: >-
          The size label shows the implementation effort measured at PR open time
          (PAD-05-002). Merged-PR diff size has no natural clusters (the survey in the
          PAD-05-011 rationale). This band holds the median merged PR, so `size:M`
          covers the normal unit of work.
        verification: >-
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          threshold value itself, and
          `::TestBandForDiff::test_each_ceiling_and_the_line_after_it_land_correctly`
          pins that the ceiling is inclusive.
      - id: PAD-05-008
        priority: MUST
        kind: process
        statement: >-
          At PR open time, a diff of 1001–2500 lines MUST receive the `size:L`
          label.
        rationale: >-
          The size label shows the implementation effort measured at PR open time
          (PAD-05-002). The upper bound separates a large change from one whose CI-fix
          rate doubles (PAD-05-009). Without an upper bound, the band would put both
          changes under one label.
        verification: >-
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          threshold value itself, and
          `::TestBandForDiff::test_each_ceiling_and_the_line_after_it_land_correctly`
          pins that the ceiling is inclusive.
      - id: PAD-05-009
        priority: MUST
        kind: process
        statement: >-
          At PR open time, a diff of 2501+ lines MUST receive the `size:XL`
          label.
        rationale: >-
          `size:XL` marks the size where a PR's CI-fix rate doubles, not a quality
          break. Later bug fixes per diff line stay flat from small PRs through the
          largest band, so a large PR is not shipping more defects per line. Above
          the XL floor, though, a PR needs CI repair about twice as often as below
          it, which is a cost worth splitting the work to avoid. The survey figures
          are in the PAD-05-011 rationale.
        verification: >-
          `test/metadata/test_size_bands.py::TestCalibratedValues` pins the
          threshold value itself, and
          `::TestBandForDiff::test_each_ceiling_and_the_line_after_it_land_correctly`
          pins that the ceiling is inclusive.
      - id: PAD-05-012
        priority: MUST_NOT
        kind: process
        statement: >-
          An Issue MUST NOT receive the `size:XL` label from an AC-count
          estimate; `size:XL` is reachable only by measuring a diff.
        rationale: >-
          An Issue predicted to need more work than `size:L` should be
          decomposed, not labelled (PAD-05-013). XL is a retrospective finding —
          the PR grew past the size where CI-fix rates double — and "estimated
          L, landed XL" is the signal worth keeping.
        verification: >-
          `test/metadata/test_size_bands.py::TestBandForAcs::test_no_ac_count_can_reach_a_measured_only_band`
      - id: PAD-05-013
        priority: MUST
        kind: process
        statement: >-
          At Issue creation, an Issue with 9+ acceptance-criteria (AC)
          checkboxes MUST be decomposed into smaller Issues rather than given a
          `size:` label; `pr-size --acs` reports `decompose` for it.
        rationale: >-
          An AC costs a roughly steady number of diff lines once its tests,
          specs and docs are counted (`.agents/skills/shared/sizing.md`), so
          nine or more ACs predict a PR past the `size:L` ceiling.
          Labelling such an Issue would record an estimate in a band the AC
          rule does not cover; splitting it gives each part an estimate that
          can land in its measured band.
        verification: >-
          `test/metadata/test_size_bands.py::TestBandForAcs::test_the_last_ceiling_is_inclusive_and_one_past_it_decomposes`
          pins the boundary, and
          `::TestCLI::test_acs_past_the_ceiling_reports_decompose_and_no_label`
          pins what `pr-size --acs` reports.
        relationships:
        - rel_type: refines
          spec_id: PAD-05-012

  - id: PAD-07
    title: Pre-PR Review Protocol
    description: >-
      Who reviews a branch before its first push, and how the post-push
      triage reuses that review. The author runs a four-item self-check; a
      fresh agent then runs the `pr-triage` phases that need no Pull Request,
      and the post-push triage runs only the phases that do, plus the delta.
    specs:
      - id: PAD-07-001
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Before invoking `create-pr`, the `build` skill MUST have the
          PR-independent phases of `pr-triage` (its pre-push mode) run on the
          branch by a subagent that did not write the change. Those phases
          include the code-review subagent.
        rationale: >-
          An author reviewing its own change misses what it overlooked while
          writing it; the post-push fresh-agent triage still found a median of
          six problems per PR, each fixed after the push at the cost of a fix
          commit and a CI run.
      - id: PAD-07-005
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST run the pre-push review against the branch
          diff relative to `origin/main`, with every change committed.
        rationale: >-
          The reviewer reads only committed work, so it does not see uncommitted work.
          The comparison with `origin/main` keeps the review on the change that the
          branch makes.
        relationships:
        - rel_type: refines
          spec_id: PAD-07-001
      - id: PAD-07-011
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST give the pre-push review the draft PR body.
        rationale: >-
          The draft body lets the reviewer check the author's `Self-check:` record
          (PAD-07-009), which exists only in that body before the push.
        relationships:
        - rel_type: extends
          spec_id: PAD-07-005
      - id: PAD-07-002
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Every pre-push review finding MUST carry a `pr-triage` severity
          (`FAIL`, `IMPROVE`, or `NEW-ISSUE`) and a `pr-triage` decision
          outcome (`fix-now`, `fix-now-file`, `defer-ask`, or
          `inversion-halt`).
        rationale: >-
          One taxonomy across the pre-push and post-push reviews lets the
          post-push triage carry a pre-push finding forward unchanged.
      - id: PAD-07-003
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST resolve every pre-push review finding by its
          decision outcome before invoking `create-pr`.
        rationale: >-
          An unresolved finding is a known defect that reaches the PR anyway, at the
          cost of a fix commit and a CI run.
        relationships:
        - rel_type: extends
          spec_id: PAD-07-001
      - id: PAD-07-010
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST record each pre-push review finding's
          resolution in the pre-push artifact.
        rationale: >-
          The recorded resolution lets the post-push triage confirm each fix on the PR
          head (PAD-07-013).
        relationships:
        - rel_type: extends
          spec_id: PAD-07-003
      - id: PAD-07-006
        adr:
        - ADR-0139
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST NOT re-run the pre-push review after
          resolving its findings. The post-push triage reviews those fixes as
          part of its delta (PAD-07-012).
        rationale: >-
          A second full review before the push would repeat every phase on a
          diff that changed only where the fixes landed; the delta review
          covers exactly those lines, once.
        relationships:
        - rel_type: extends
          spec_id: PAD-07-003
        see_also:
        - spec_id: PAD-07-012
          reason: 'explanation: the post-push delta reviews the fixes'
      - id: PAD-07-004
        adr:
        - ADR-0139
        priority: SHOULD
        kind: process
        statement: >-
          After a PR is opened, the pre-push review's findings and their
          resolutions SHOULD be posted as a comment on the PR for human
          review.
        rationale: >-
          The pre-push review runs before the PR exists, so its findings are otherwise
          only in a gitignored local artifact. A comment lets a human see what the
          review caught and how each finding was handled.
      - id: PAD-07-007
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        statement: >-
          This rule applies when a PR's branch has a pre-push artifact and
          PAD-07-008 does not call for a full triage. Then `pr-triage` MUST
          run the phases that need the PR. These are issue linkage as
          posted, PR body format, the `Docs:` line comparison, CI status, and
          merge state.
        rationale: >-
          The pre-push review ran before the PR existed, so it could not run these
          phases. Running them here means that every phase still runs, once per
          change.
        verification: >-
          Inspection: `pr-triage` § "Modes" assigns each phase to the
          pre-push or the delta run.
      - id: PAD-07-012
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        statement: >-
          In the triage that PAD-07-007 describes, `pr-triage` MUST re-run the
          PR-independent phases on the delta alone. The delta is the change to
          the branch's own added and removed lines between the reviewed head
          and the PR head.
        rationale: >-
          The pre-push review already ran these phases on the rest of the change.
          Defining the delta on the branch's own lines keeps `create-pr`'s cherry-pick
          onto a newer base out of it.
        verification: >-
          Inspection: `prepush-delta.sh` compares only the added and removed
          lines of the reviewed and current branch diffs.
        relationships:
        - rel_type: extends
          spec_id: PAD-07-007
      - id: PAD-07-013
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        statement: >-
          In the triage that PAD-07-007 describes, `pr-triage` MUST confirm each
          pre-push finding's recorded resolution on the PR head, re-emitting each
          finding whose fix is absent.
        rationale: >-
          A recorded resolution is a claim by the author. A fix that did not reach the
          PR head leaves the defect in the change that merges.
        verification: >-
          Inspection: the "Carry-forward check (delta mode)" of `pr-triage`
          § "Modes" checks each recorded resolution on the PR head and
          re-emits a finding whose fix is absent.
        relationships:
        - rel_type: extends
          spec_id: PAD-07-007
      - id: PAD-07-008
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        statement: >-
          `pr-triage` MUST run the full triage when the PR carries the
          `needs-rebase` label, when the PR's branch has no usable pre-push
          artifact (none exists, it is not a JSON object, it lacks a reviewed
          SHA, it names another branch, or a reviewed commit is not in the
          object store), when the reviewed diff is empty, or when the delta's
          changed lines exceed half of the reviewed diff's changed lines.
        rationale: >-
          A PR not opened by `build`, a conflict resolved by hand, or a
          delta most of the size of the change gives the pre-push review too
          little claim on the tree that will merge.
        verification: >-
          Inspection: `prepush-delta.sh` exits 3 (full triage) for each
          artifact, empty-diff and delta-size cause this requirement lists,
          and `pr-triage` § "Modes" runs the full triage on exit 3 or on a
          `needs-rebase` PR.
        relationships:
        - rel_type: supersedes
          spec_id: PAD-07-007
      - id: PAD-07-009
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        statement: >-
          The `build` and `bugfix` skills MUST run the four-item pre-review
          self-check on the finished diff and record its results. They record
          the four results under `Self-check:` in the `## Verification`
          section of the PR body. The four items are the affected-text sweep,
          the failure-path pass, branch coverage, and the reuse check.
        rationale: >-
          About 45% of post-push triage findings fall into these four
          oversights. A written result per item shows the reviewer the check
          ran.
        verification: >-
          Inspection: `build` Phase 5 and `bugfix` Phase 4 run
          `shared/pre-review-self-check.md`, and `pr-body-guide.md` carries the
          `Self-check:` lines.
      - id: PAD-07-014
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        statement: >-
          `pr-triage` MUST give its code-review subagent the four items of the
          PAD-07-009 self-check as review prompts.
        rationale: >-
          A reviewer that checks the same four items against the diff catches what the
          author missed.
        verification: >-
          Inspection: `pr-triage` Phase 8 passes
          `shared/pre-review-self-check.md` to the code-review subagent.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-07-009
      - id: PAD-07-015
        priority: MUST
        kind: process
        statement: >-
          After `deepen-context`, before the branch's first commit, the `build`
          and `bugfix` skills MUST write the build context file with
          `build-context write`. The file records the branch, the head and base
          commits, the Spec manifest's loaded IDs, the domain hints, and the
          notes and glossary sections loaded, and no other field.
        rationale: >-
          Each later pipeline phase is a fresh agent that would load the same
          context again. A list of facts found, with no reasoning, lets the
          phase skip that work and still review with a fresh eye (PAD-07-001).
        verification: >-
          Test: `test/metadata/test_build_context.py` checks that the file
          holds the listed fields and that a record carrying any other field is
          refused. Inspection: `build` Phase 3 and `bugfix` Phase 2g run
          `build-context write`.
      - id: PAD-07-016
        priority: MUST
        kind: process
        statement: >-
          A pull-request pipeline phase (`pr-triage` in every mode,
          `pr-execute`) MUST reuse the build context file only when
          `build-context check` reports it usable. Usable means that the file
          exists, holds a valid record, names the PR's branch, and was recorded
          at a commit that is an ancestor of the PR head.
        rationale: >-
          pr-ship often runs from another agent system or machine, or on a
          branch whose file was written for older work. Only a file that
          provably describes this branch may stand in for loading context.
        verification: >-
          Test: `test/metadata/test_build_context.py` checks that `check` reports
          `mode=reuse` only for a valid file of the current branch recorded at
          an ancestor of `HEAD`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-07-015
      - id: PAD-07-017
        priority: MUST
        kind: process
        statement: >-
          When `build-context check` reports the build context file unusable,
          the phase MUST load its context with `orient-agent` and
          `deepen-context`, as it does when no file exists.
        rationale: >-
          The file is an optimization. A phase that cannot use it must reach
          the same context, and so the same verdict, as before the file
          existed.
        verification: >-
          Test: `test/metadata/test_build_context.py` checks that `check` reports
          `mode=fallback` with a reason for an absent, malformed, other-branch
          and stale file. Inspection: `pr-triage` Phase 1 and `pr-execute`
          Phase 1 run `orient-agent` or `deepen-context` on that result.
        relationships:
        - rel_type: refines
          spec_id: PAD-07-016
      - id: PAD-07-018
        priority: MUST_NOT
        kind: process
        statement: >-
          A pull-request pipeline phase MUST NOT fail, skip a check, or narrow a
          check because the build context file is missing or unusable.
        rationale: >-
          A PR shipped from a checkout that never ran `build` is the ordinary
          case, not an error. Making the file a precondition would block those
          PRs or review them less.
        verification: >-
          Inspection: `.agents/skills/shared/build-context.md` § "Reading it"
          sends exit 2 and exit 3 to the same context load as no file, and no
          `pr-triage`, `pr-execute` or `pr-verify` step reads the file for a
          check.
        relationships:
        - rel_type: extends
          spec_id: PAD-07-016
      - id: PAD-07-019
        priority: MUST
        kind: process
        statement: >-
          `pr-triage` MUST name in its comment header whether it reused the
          build context file, and the `build-context check` reason when it did
          not.
        rationale: >-
          A reviewer reading the triage needs to know which context the findings
          rest on. When the file was unusable, the reason shows why.
        verification: >-
          Inspection: the `pr-triage` REFERENCE.md comment format carries a
          `**Context**:` line, and `pr_metadata.build_context` records the mode
          and reason.
        relationships:
        - rel_type: extends
          spec_id: PAD-07-016

  - id: PAD-08
    title: Build Skill — Issue-Based Task Selection
    specs:
      - id: PAD-08-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST select work by querying GitHub Project #24
          for Epics with `Schedule=Focus` or `Schedule=Now` (Focus first),
          then querying for open unblocked leaf Issues that are sub-issues of
          those Epics, filtered to exclude Issues that carry `stale-claim`,
          `needs-info`, or `ready-for-human`, that are already assigned, or
          that are held by an epic run (PAD-19-002).
        rationale: >-
          The filters skip Issues that another session owns, that wait on a person, or
          that an epic run holds, so parallel agents do not pick the same work or work a
          human reserved. Ordering by Epic tier puts effort where humans ranked it.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-19-002
      - id: PAD-08-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST open a GitHub Pull Request with "Closes #N"
          in the body after completing implementation and passing all
          validations.
        rationale: >-
          `Closes #N` closes the Issue when the PR merges. This moves the Issue to
          `Done` and keeps the board correct with no manual step. When the PR opens only
          after validation, known-broken work stays out of review and CI.
      - id: PAD-08-004
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `build` skill MUST NOT commit directly to `main`.
        rationale: >-
          A direct commit to `main` skips review and CI. When several agents work in
          parallel, it can break every branch that starts from `main`.
      - id: PAD-08-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          After implementation, the `build` skill MUST compute the diff size
          and update the size label on both the Issue and the PR per
          PAD-05-002 before opening the PR.
        rationale: >-
          A size taken from the measured diff tells a reviewer how much review the PR
          needs before review starts (PAD-05-002).
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-05-002
        - rel_type: conflicts
          spec_id: PAD-05-010

  - id: PAD-09
    title: Ingest-Idea — Docs-Only PR and Issue Creation
    specs:
      - id: PAD-09-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          After writing `specs/<topic>.yaml` and `notes/<topic>.md`, the
          `plan-issue` skill MUST open a docs-only PR carrying the
          `specs-notes` label before creating the implementation GitHub Issue.
          This ensures spec and notes files are on `main` and referenceable
          from Issues before any implementation work begins.
        rationale: >-
          An implementation Issue that links a spec not yet on `main` points at text
          that can still change or never merge. Thus an agent could implement a
          requirement that does not exist. When the docs merge first, the Issue has a
          stable target.
      - id: PAD-09-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          After the docs-only PR is opened, `plan-issue` MUST create a
          GitHub Issue for the spec. The Issue has a title and description
          derived from the spec, and a link to the spec file in its body. It
          carries the `size:` label derived from the AC count per PAD-05-001.
        rationale: >-
          The Issue is the unit agents select and claim, so it must carry what selection
          reads: a size estimate and a link to the governing spec.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-05-001
      - id: PAD-09-004
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          `plan-issue` MUST add the Issue to GitHub Project #24 as a sub-issue
          of an Epic (PAD-01-007), with no `Schedule` value (PAD-02-001).
        rationale: >-
          The Epic ancestor gives the Issue its tier, so selection can reach it. A
          `Schedule` value of its own would only restate or contradict its Epic's
          (PAD-02-001).
        relationships:
        - rel_type: extends
          spec_id: PAD-09-002
        - rel_type: refines
          spec_id: PAD-01-007
        - rel_type: refines
          spec_id: PAD-02-001
      - id: PAD-09-003
        priority: MUST_NOT
        kind: process
        verification_debt: '#2571'
        statement: >-
          `plan-issue` MUST NOT begin implementation work.
        rationale: >-
          Planning and building are separate steps, so a human can review the plan and
          its docs PR before code depends on them. Implementation work begins only when
          the Issue is Ready (PAD-16-004) and is selected under its Epic's `Schedule`
          tier on GitHub Project #24 (PAD-15-003). If planning starts the build at
          once, it skips the Epic tier that decides when the work is worth doing.
      - id: PAD-09-005
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          `plan-issue` MUST stop after creating the Issue.
        rationale: >-
          A clear end point keeps the planning run from doing any step that belongs to
          a later run, such as claiming or building the Issue.
        relationships:
        - rel_type: refines
          spec_id: PAD-09-003

  - id: PAD-10
    title: Orphan Recovery — Stale Claim Sweeper
    specs:
      - id: PAD-10-001
        priority: MUST
        kind: process
        statement: >-
          A scheduled GitHub Actions workflow (weekly cadence, also
          triggerable on `workflow_dispatch`) MUST scan for Issues that are
          assigned, have a claim branch on GitHub under any claim prefix
          (PAD-04-001), have no open PR, and have had neither a branch commit
          nor their claim within 3 days.
        rationale: >-
          GitHub creates a claim branch at the `main` tip, whose last commit
          can already be older than 3 days when the claim is taken. The claim
          time (the Issue's latest assignment) is therefore activity too.
        verification: >-
          `test/ci/test_stale_claim_sweeper.py` pins the claim-branch parse for
          every prefix and the staleness decision in
          `.github/scripts/stale_claim_sweeper.py`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-04-001
      - id: PAD-10-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          When the sweeper identifies an orphaned claim, it MUST apply the
          `stale-claim` label to the Issue.
        rationale: >-
          The sweeper cannot tell abandoned work from slow work, so it marks the claim
          instead of releasing it.
      - id: PAD-10-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          When the sweeper identifies an orphaned claim, it MUST post a comment
          on the Issue that names the orphaned branch and asks for human review.
        rationale: >-
          Only a person can decide whether the claimed work is abandoned. The comment
          names the branch so that the person can check what is on it.
        relationships:
        - rel_type: extends
          spec_id: PAD-10-002
  - id: PAD-11
    title: Merge Conflict Recovery
    specs:
      - id: PAD-11-001
        priority: MUST
        kind: process
        statement: >-
          When an open PR conflicts with its base branch, the syncing agent
          MUST merge the base into the task branch and resolve the conflicts.
        rationale: >-
          A merge commit keeps the commits that reviewers commented on and the
          `commit_ref` values that the triage and execute artifacts recorded.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 2 resolves a `CONFLICTING` PR
          with `sync-with-main.sh`, which merges the base.
      - id: PAD-11-006
        priority: MUST_NOT
        kind: process
        statement: >-
          The agent syncing an open PR MUST NOT rebase its branch.
        rationale: >-
          Rebasing a pushed branch rewrites the commits reviewers commented on
          and the `commit_ref` values the triage and execute artifacts
          recorded.
        verification: >-
          Inspection: no step of `pr-execute` rebases the branch.
        relationships:
        - rel_type: extends
          spec_id: PAD-11-001
      - id: PAD-11-002
        priority: MUST
        kind: process
        statement: >-
          After resolving the merge, the agent MUST push the merge commit with
          a normal push, not a force-push.
        rationale: >-
          A merge only adds commits, so a normal push succeeds unless the
          remote branch moved. A push that git rejects as non-fast-forward
          means another push landed or someone rewrote the remote branch;
          either is a reason to fetch and inspect, never to force. CI re-runs
          automatically on the updated head.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 4 pushes without `--force`
          and, when git rejects the push as non-fast-forward, stops and
          reports instead of forcing.
      - id: PAD-11-003
        priority: MUST
        kind: process
        statement: >-
          If the agent cannot resolve the merge safely, it MUST abort the
          merge and post a comment on the PR explaining the conflict.
        rationale: >-
          Ensures human reviewers have visibility into the nature of the
          conflict before intervening.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 2's unresolved-conflict path
          runs `sync-with-main.sh --abort` and posts a PR comment naming the
          conflicted paths.
      - id: PAD-11-004
        priority: MUST
        kind: process
        statement: >-
          If the agent cannot resolve the merge safely, it MUST apply the
          `needs-rebase` label to the PR.
        rationale: >-
          The label tells the sweeper and other agents that the PR needs a human before
          it can continue. The name says "rebase", but recovery uses a merge
          (PAD-11-001). The name stays so that existing queries and skills still find
          the label.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 2's unresolved-conflict path
          adds the `needs-rebase` label.
      - id: PAD-11-005
        priority: MUST_NOT
        kind: process
        statement: >-
          If the agent cannot resolve the merge safely, it MUST NOT attempt
          further changes; human intervention is required to resolve the
          conflict and remove the `needs-rebase` label.
        rationale: >-
          Prevents the agent from making the conflict worse or creating
          additional commits on a branch that requires human resolution.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 2's unresolved-conflict path
          stops the execute run without pushing.

  - id: PAD-12
    title: Review-Priorities — Issue Triage
    specs:
      - id: PAD-12-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          The `review-priorities` skill MUST surface as a triage list for the
          current review session every open Epic with `Schedule=Someday` or no
          `Schedule` value, and every open non-Epic Issue with no Epic ancestor
          (PAD-01-007).
        rationale: >-
          An Epic at `Someday` or with no tier, and an Issue with no Epic, are where
          work gets lost, because selection never reaches them. The skill shows them at
          each review, so a human can schedule, route or close each one.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-01-007
      - id: PAD-12-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          For each Epic surfaced in triage, the `review-priorities` skill MUST
          use `ask_user` to choose its `Schedule` tier, or to close or defer
          it.
        rationale: >-
          Scheduling is a human decision (PAD-03-002), so the skill asks rather than
          guesses a tier.
      - id: PAD-12-004
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          For each unparented non-Epic Issue, the `review-priorities` skill
          MUST ask which Epic the Issue belongs under.
        rationale: >-
          An Issue with no Epic has no tier at all, so the question for it is where it
          belongs. The skill asks rather than guesses a parent, because placement is a
          human decision (PAD-03-002).
        relationships:
        - rel_type: extends
          spec_id: PAD-12-002
      - id: PAD-12-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          After the user confirms a placement, the `review-priorities` skill
          MUST apply it via the GitHub API: the Epic's `Schedule` field on
          GitHub Project #24, or the Issue's sub-issue relationship to the
          chosen Epic.
        rationale: >-
          A placement that only the session holds is lost when the session ends, and
          selection reads only the board and the sub-issue links. When the skill applies
          the placement immediately after confirmation, the board stays the single
          source of priority (PAD-03-001).

  - id: PAD-13
    title: Update-Plan — Issue Creation
    specs:
      - id: PAD-13-001
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          When the `update-plan` skill identifies a new implementation gap (a
          spec requirement with no corresponding code or test), it MUST create
          a GitHub Issue for the gap.
        rationale: >-
          A gap noted only in a report is not selectable work, so it goes unbuilt. An
          Issue puts it where agents select work.
      - id: PAD-13-002
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          Issues created by `update-plan` MUST be added to GitHub Project #24
          as sub-issues of an Epic (PAD-01-007), with no `Schedule` value
          (PAD-02-001) and the initial `size:` label derived from the AC count
          per PAD-05-001.
        rationale: >-
          An Issue outside an Epic has no tier, so no selector reaches it (PAD-01-007).
          The size estimate lets bundle selection weigh it before any diff exists
          (PAD-15-005).
        relationships:
        - rel_type: refines
          spec_id: PAD-01-007
        - rel_type: refines
          spec_id: PAD-02-001
        - rel_type: uses_definition
          spec_id: PAD-05-001

  - id: PAD-14
    title: GitHub Actions Requirements
    specs:
      - id: PAD-14-003
        priority: MUST
        kind: process
        verification_debt: '#2571'
        statement: >-
          A GitHub Actions workflow MUST implement the stale-claim sweeper
          (PAD-10). It runs on `schedule` (weekly) and `workflow_dispatch`.
          It scans for orphaned claims per PAD-10-001, applies the
          `stale-claim` label per PAD-10-002, and posts a comment per
          PAD-10-003.
        rationale: >-
          Abandoned claims come from sessions that ended, so the sweeper must run when
          no agent session is active. A scheduled workflow runs without one, and
          `workflow_dispatch` lets a human run it on demand.
        relationships:
        - rel_type: implements
          spec_id: PAD-10-001
        - rel_type: implements
          spec_id: PAD-10-002
        - rel_type: implements
          spec_id: PAD-10-003
      - id: PAD-14-004
        priority: MUST
        kind: process
        statement: >-
          A GitHub Actions workflow MUST run `theme-fit` daily and on
          `workflow_dispatch`, and write its report into one standing
          "Theme fit report" Issue.
        rationale: >-
          `calve-epics` needs a current work list when no agent session is running,
          and one Issue rewritten in place stays the single place to look.
        verification: >-
          `test/ci/test_theme_fit_report.py::test_workflow_runs_daily_and_on_dispatch`
          and `::test_an_open_report_is_rewritten_in_place`.
      - id: PAD-14-005
        priority: MUST
        kind: process
        statement: >-
          The PAD-14-004 workflow MUST find the report Issue by its
          `theme-fit-report` label through the list-issues endpoint. It
          rewrites the oldest open one, else reopens the oldest closed one, and
          creates one only when none exists.
        rationale: >-
          The search index lags, and that lag once let a workflow file a second
          tracker (#5105). Reopening a closed report keeps one Issue, where a new one
          would leave two.
        verification: >-
          `test/ci/test_theme_fit_report.py::test_pick_report_issue`,
          `::test_a_closed_report_is_reopened_not_replaced`,
          `::test_the_report_is_created_only_when_none_exists` and
          `::test_the_lookup_uses_the_list_endpoint_any_state`.
        relationships:
        - rel_type: extends
          spec_id: PAD-14-004
      - id: PAD-14-006
        priority: MUST
        kind: process
        statement: >-
          The PAD-14-004 workflow MUST publish the report and end green only
          when `theme-fit` exits 0 or 1 with a report on stdout (text that
          starts with `# Theme fit report`), and fail the run on any other
          outcome: exit 2, or exit 0 or 1 without a report.
        rationale: >-
          A finding (exit 1) is what the report exists to show, so failing on one
          would file a CI failure every day the board is imperfect. Python also
          exits 1 on an uncaught crash, so the exit code alone cannot tell findings
          from a crash, and a crash published as a report would blank the Issue. A
          failed run must reach `notify-failure` (CISEC-05).
        verification: >-
          `test/ci/test_theme_fit_report.py::test_findings_publish_and_the_run_ends_green`
          (exit 1 with a report),
          `::test_a_finding_publishes_and_a_failed_run_does_not` (exit codes),
          `::test_a_failed_theme_fit_run_fails_the_script` (exit 2),
          `::test_a_run_without_a_report_is_not_published` and
          `::test_a_crashed_theme_fit_run_fails_the_script` (exit 0 or 1 without a
          report).
        relationships:
        - rel_type: extends
          spec_id: PAD-14-004
      - id: PAD-14-007
        priority: MUST_NOT
        kind: process
        statement: >-
          The PAD-14-004 workflow MUST NOT label, move or otherwise change any
          Issue but the report Issue.
        rationale: >-
          The report is read-only by design: a person or `calve-epics` decides each
          finding (`notes/epic-themes.md` § "Acting on a Theme-Fit Finding").
        verification: >-
          `test/ci/test_theme_fit_report.py::test_it_writes_to_no_issue_but_the_report`.
        relationships:
        - rel_type: extends
          spec_id: PAD-14-004


  - id: PAD-15
    title: Bundle Selection and Execution
    specs:
      - id: PAD-15-001
        priority: MUST
        kind: process
        statement: >-
          Bundle selection MUST pick a work bundle in two stages: eligibility,
          then fit. An eligible Issue is open, unassigned and a leaf, and every
          `blockedBy` Issue is CLOSED. It carries no `stale-claim`,
          `needs-info`, or `ready-for-human` label, and no epic run holds it
          (PAD-19-002).
        rationale: >-
          Eligibility rules out the Issues that are not free to take before any fit rule
          weighs them. Each refusal then belongs to one stage (PAD-15-006).
        verification: >-
          `test/metadata/test_bundle_fit.py::TestEligibility` covers stage one.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-19-002
      - id: PAD-15-012
        priority: MUST_NOT
        kind: process
        statement: >-
          Bundle selection MUST NOT make an Issue a bundle member only because
          it clears eligibility.
        rationale: >-
          Clearing eligibility shows only that an Issue is free to take. Without a fit
          stage, selection takes candidates in sub-issue order and can propose an Idea,
          a `Someday` Concern and two `size:L` Tasks as equal members of one bundle.
        verification: >-
          In `test/metadata/test_bundle_fit.py`, `TestWorkflowPartition`,
          `TestScheduleTier`, `TestSizeBudget`, `TestBundleSizeCeiling` and
          `TestCoherenceHints` cover the fit rules applied after eligibility.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-15-001
      - id: PAD-15-002
        priority: MUST
        kind: process
        statement: >-
          A bundle MUST be homogeneous by executing skill, determined from each
          candidate's `issueType`: Task and Feature are executed by `build`,
          Bug by `bugfix`, and Idea, Concern and Epic by `plan-issue`.
        rationale: >-
          An Idea or Concern leaf clears every eligibility gate but cannot be
          implemented; it needs planning first. Routing by type is the rule
          `work-issue` already applies to a single issue.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestWorkflowPartition` asserts an
          Idea, a Concern and a Bug are each rejected from a `build` bundle with
          the owning skill named in the reason.
      - id: PAD-15-003
        priority: MUST
        kind: process
        statement: >-
          Bundle selection MUST order candidates by their governing Project #24
          `Schedule` tier per PAD-03-001. That tier is the tier of the
          candidate's nearest Epic ancestor (PAD-02-001).
        rationale: >-
          The `Schedule` field is the authoritative priority signal (PAD-03-001), and
          only Epics carry it, so a candidate's priority is its Epic's tier.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestScheduleTier` asserts tier
          ordering (including that `Focus` outranks `Now`), and that the Epic's
          tier reaches the sort inside `select_bundle` and not only
          `effective_schedule`.
          `test_every_board_tier_is_ranked_or_excluded` ratchets the tier list
          against the Schedule options documented in
          `.agents/skills/shared/board-id.sh`, because a tier in neither set
          ranks last rather than failing.
        relationships:
        - rel_type: refines
          spec_id: PAD-03-001
        - rel_type: uses_definition
          spec_id: PAD-02-001
      - id: PAD-15-013
        priority: MUST_NOT
        kind: process
        statement: >-
          Bundle selection MUST NOT read a leaf's own `Schedule` value.
        rationale: >-
          Only Epics carry `Schedule` (PAD-02-001), so a value on a leaf is always
          drift.
        verification: >-
          Not met today: `effective_schedule` in
          `vultron/metadata/planning/bundle_fit/select.py` lets an explicit leaf
          tier win, and `test_bundle_fit.py` asserts it. #3710 owns the fix,
          which adds a test that a leaf's own `Schedule` changes no rank or
          exclusion.
        relationships:
        - rel_type: extends
          spec_id: PAD-15-003
      - id: PAD-15-014
        priority: MUST
        kind: process
        statement: >-
          Bundle selection MUST use sub-issue list order only to break ties.
        rationale: >-
          The order of the sub-issue list is a manual order and has no priority meaning.
          If selection used it as the priority signal, it would override the
          authoritative field.
        verification: >-
          `TestScheduleTier::test_ties_break_on_list_order` in
          `test/metadata/test_bundle_fit.py` asserts that ties fall back to
          list order.
        relationships:
        - rel_type: extends
          spec_id: PAD-15-003
      - id: PAD-15-004
        priority: MUST_NOT
        kind: process
        statement: >-
          An Issue whose governing `Schedule` tier is `Someday` MUST NOT be
          proposed as a bundle member.
        rationale: >-
          `Someday` is explicit human deprioritisation; bundling such an Issue
          reverses a scheduling decision the board already recorded.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestScheduleTier::test_someday_is_excluded_below_tier`
      - id: PAD-15-005
        priority: MUST
        kind: process
        statement: >-
          Bundle selection MUST bound a bundle by a total size budget computed
          from the PAD-05 `size:` label weights. It weights an unlabelled Issue
          as the largest bundlable size.
        rationale: >-
          A bundle is implemented as one PR, so the budget is a review budget.
          An unlabelled Issue is unmeasured rather than small, so counting it as
          the largest bundlable size fails safe. The weights themselves are not
          restated here: they are derived from the band table (PAD-05-011), so
          a recalibration cannot leave this requirement behind.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestSizeBudget` asserts the weights
          derive from the band table, the unsized-as-largest rule, that the
          largest of several `size:` labels is both the weight and the label
          reported, the budget ceiling, and that a refused oversized candidate
          does not end the scan.
      - id: PAD-15-015
        priority: MUST
        kind: process
        statement: >-
          Bundle selection MUST bound the number of members in a bundle.
        rationale: >-
          The size budget alone admits many small members. Each member adds acceptance
          criteria and a `Closes #N` line that one review must cover.
        verification: >-
          `TestSizeBudget::test_member_ceiling_applies_under_budget` in
          `test/metadata/test_bundle_fit.py` asserts the member ceiling.
        relationships:
        - rel_type: extends
          spec_id: PAD-15-005
      - id: PAD-15-011
        priority: MUST_NOT
        kind: process
        statement: >-
          An Issue labelled `size:XL` MUST NOT be proposed as a bundle member.
        rationale: >-
          `size:XL` means a change already past the size where its CI-fix rate
          doubles (PAD-05-009), and a bundle is one PR, so adding members only
          makes it bigger. It is refused outright rather than given a
          weight. A weight would say "fits alongside something smaller", which
          is precisely what this band rules out, and a raised `--budget` could
          then reopen it.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestBundleSizeCeiling` asserts the
          refusal is categorical, survives a raised budget, does not end the
          scan, and names the band rather than a weight.
      - id: PAD-15-006
        priority: MUST
        kind: process
        statement: >-
          A bundle proposal MUST report every candidate it excluded with a
          per-candidate reason, distinguishing exclusion at the eligibility
          stage from exclusion at the fit stage.
        rationale: >-
          A candidate held back for size or tier needs a different action from one that
          is blocked or already claimed. Without the stage in the reason, a reader
          cannot tell which of the two happened.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestRejectionStages` asserts the two
          stages are distinguishable and that every non-member is accounted for.
      - id: PAD-15-007
        priority: MUST
        kind: process
        statement: >-
          The agent proposing a bundle MUST decide its thematic coherence by
          stating, in one sentence, the single design idea its members share.
        rationale: >-
          Cutting by a superficial shared keyword rather than design grain produces
          plausible-looking but wrong work units — the same failure `calve-epics`
          guards against when shaping the Epic forest.
        verification: >-
          A bundle proposal states the shared design idea in one sentence.
      - id: PAD-15-016
        priority: MAY
        kind: process
        statement: >-
          The agent proposing a bundle MAY surface mechanical overlap signals as
          evidence of coherence.
        rationale: >-
          A shared spec ID, label or file path can point a person to a design idea that
          members share, even though it cannot prove one.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestCoherenceHints` asserts the
          tool emits overlap evidence.
      - id: PAD-15-017
        priority: MUST_NOT
        kind: process
        statement: >-
          The agent proposing a bundle MUST NOT treat mechanical overlap signals
          as the coherence verdict.
        rationale: >-
          A shared keyword is a superficial match, not design grain. A verdict taken
          from it gives the same wrong work units that PAD-15-007 exists to stop.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestCoherenceHints` asserts the
          tool emits overlap evidence only, and never a member decision.
        relationships:
        - rel_type: constrains
          spec_id: PAD-15-016
        - rel_type: constrains
          spec_id: PAD-15-007
      - id: PAD-15-008
        priority: MUST
        kind: process
        statement: >-
          A skill given several Issue numbers MUST implement every member and
          open one Pull Request whose body carries one `Closes #N` line per
          member.
        rationale: >-
          Getting more than one Issue done in a single PR is the entire purpose
          of bundling; executing one member and discarding the rest defeats it.
        verification: >-
          A bundle PR body lists one `Closes #N` per member in bundle order.
      - id: PAD-15-018
        priority: MUST_NOT
        kind: process
        statement: >-
          A skill given several Issue numbers MUST NOT silently work only the
          first member or silently drop a member.
        rationale: >-
          A member dropped for grain is reported, not silently omitted, so the person
          who asked for the bundle sees what it did not deliver.
        verification: >-
          A bundle PR body names any member dropped for grain, with its reason.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-15-008
      - id: PAD-15-009
        priority: MUST
        kind: process
        statement: >-
          The agent claiming a bundle MUST claim every member onto the single
          branch named for the first member.
        rationale: >-
          Branch creation is the distributed lock (PAD-04), so one bundle is one
          lock.
        verification: >-
          `.agents/skills/shared/claim-issue.sh` assigns and comments on every
          member of the bundle it is given while creating exactly one branch. It
          validates every member number before mutating anything, rejects a
          repeated member, and on a mid-bundle failure names the members already
          claimed and deletes the branch, locally and on GitHub, so the claim
          can be retried (`test/metadata/test_claim_scripts.py`).
      - id: PAD-15-019
        priority: MUST
        kind: process
        statement: >-
          A skill working a bundle MUST give each member the tests and
          acceptance-criteria coverage it would receive if worked alone.
        rationale: >-
          A bundle saves the cost of loading context once per Issue. It does not
          lower the rigor that each Issue needs.
        verification: >-
          Inspection: `.agents/skills/shared/bundling.md` § "Executing a bundle"
          and the `build` skill's Constraints require each member to be built to
          the standard it would get alone, with its own tests and its own
          acceptance criteria.
        relationships:
        - rel_type: extends
          spec_id: PAD-15-008

  - id: PAD-16
    title: Project Board Status Path
    specs:
      - id: PAD-16-001
        priority: MUST
        kind: process
        statement: >-
          Every non-Epic Issue on GitHub Project #24 MUST carry exactly one
          `Status` value: `Backlog`, `Ready`, `In Progress`, `In Review`, or
          `Done`, determined by the first of PAD-16-010, PAD-16-009,
          PAD-16-008, PAD-16-004/PAD-16-005, and PAD-16-011 whose condition
          holds.
        rationale: >-
          `Schedule` answers "which body of work matters now" and lives on
          Epics. `Status` answers "where does this piece of work stand" and
          lives on everything else, so the two paths never describe the same
          item.
        verification: >-
          Inspection: every open non-Epic item on Project #24 has a `Status`
          value, and it is the one the listed conditions select.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-16-004
        - rel_type: uses_definition
          spec_id: PAD-16-005
        - rel_type: uses_definition
          spec_id: PAD-16-008
        - rel_type: uses_definition
          spec_id: PAD-16-009
        - rel_type: uses_definition
          spec_id: PAD-16-010
        - rel_type: uses_definition
          spec_id: PAD-16-011
      - id: PAD-16-002
        priority: MUST
        kind: process
        statement: >-
          An Issue's `Status` MUST be reproducible from facts recorded
          elsewhere alone. These facts are its open or closed state, issue
          type, sub-issues, acceptance-criteria lines, `blockedBy`
          relationships and labels. They also include its Epic ancestor,
          assignee and claim branch, and linked Pull Requests.
        rationale: >-
          A second copy of claim or review state that a person maintains drifts from the
          branch and PR it describes.
        verification: >-
          Recomputing `Status` from the listed facts for every item on
          Project #24 reproduces every recorded value.
      - id: PAD-16-013
        priority: MUST
        kind: process
        statement: >-
          A `Status` value that the PAD-16-002 facts do not produce is drift.
          An agent or tool that finds drift MUST correct the value to the
          reproduced value.
        rationale: >-
          A computed copy can drift too, but a new computation repairs it with no
          human.
        verification: >-
          Inspection: after a correction pass, every `Status` value on
          Project #24 equals the value that the PAD-16-002 facts produce.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-16-002
      - id: PAD-16-003
        priority: MUST_NOT
        kind: process
        statement: >-
          An agent MUST NOT decide whether an Issue is claimable or selectable
          from its `Status` value. Claimability and selection are decided from
          the facts `Status` mirrors (PAD-04-003, PAD-08-001, PAD-15-001).
        rationale: >-
          `Status` is a display of situation for humans. If a stale mirror
          could cause two agents to claim one Issue, drift would stop being
          cosmetic.
        verification: >-
          No skill or script under `.agents/skills/` reads the `Status` field
          to filter claim or selection candidates.
        relationships:
        - rel_type: constrains
          spec_id: PAD-08-001
        - rel_type: constrains
          spec_id: PAD-04-003
        - rel_type: constrains
          spec_id: PAD-15-001
      - id: PAD-16-004
        priority: MUST
        kind: process
        statement: >-
          A Task, Feature, or Bug MUST be `Ready` ("ready to build") when it is
          open, unassigned, a leaf, has no claim branch (PAD-04-001), has an
          Epic ancestor, carries at least one
          `- [ ] AC-N:` line, has every `blockedBy` Issue closed, and does not
          carry the `needs-info` label.
        rationale: >-
          These are the conditions `build` already applies privately when it
          auto-selects work, made visible so that a wrong or missing condition
          shows on the board instead of in a surprising pick. `needs-info`
          ("waiting on a person or decision") is the only hold.
        verification: >-
          Inspection: every Task, Feature, or Bug item at `Ready` meets each
          listed condition, and every open item that meets them all and is not
          claimed is at `Ready`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-04-001
      - id: PAD-16-005
        priority: MUST
        kind: process
        statement: >-
          An Idea or Concern MUST be `Ready` ("ready to plan") when it is
          open, unassigned, has no claim branch (PAD-04-001), has an Epic
          ancestor, and does not carry the `needs-info` label.
        rationale: >-
          An Idea or Concern is input to `plan-issue`, which consumes it, so it
          can be planned from the moment it is triaged. The board separates
          ready-to-plan from ready-to-build by issue type, not by a second
          column.
        verification: >-
          Inspection: every Idea or Concern item at `Ready` meets each listed
          condition.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-04-001
      - id: PAD-16-006
        priority: MUST_NOT
        kind: process
        statement: >-
          The `Schedule` tier of an Issue's Epic ancestor MUST NOT affect the
          Issue's `Status`. The tier orders selection among `Ready` Issues
          only.
        rationale: >-
          "Could this be started?" and "should it be started now?" are
          different questions. Keeping the tier out of `Status` means
          reprioritising an Epic changes no child's `Status`, and planning a
          `Next`-tier Idea early or fixing a Bug under a `Later` Epic is an
          ordinary choice among `Ready` Issues, not an exception.
        verification: >-
          Changing an Epic's `Schedule` value leaves the `Status` of every
          descendant unchanged.
      - id: PAD-16-007
        priority: MUST_NOT
        kind: process
        statement: >-
          An agent MUST NOT auto-select or claim an Issue carrying the
          `ready-for-human` label. The label does not affect the Issue's
          `Status`.
        rationale: >-
          The label reserves the Issue for a human, so an agent that claims it takes the
          work away from that person. The label says who works the Issue, not whether it
          is ready, so it does not change `Status`.
        verification: >-
          Agent selection (`build`, `bugfix`, `bundle-fit`, `propose-bundle`)
          excludes Issues carrying `ready-for-human`.
      - id: PAD-16-008
        priority: MUST
        kind: process
        statement: >-
          An open Issue that is claimed (PAD-04-001, PAD-04-002), including a
          bundle member claimed by its bundle's branch (PAD-15-009), and has no
          open, non-draft Pull Request that closes it MUST be `In Progress`.
          A draft Pull Request keeps the Issue `In Progress`.
        rationale: >-
          A draft PR says its author is not finished. Marking it ready for
          review is the author's "done" signal.
        verification: >-
          Inspection: every claimed open Issue with no open non-draft closing
          PR is at `In Progress`, including one carrying `stale-claim`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-04-001
        - rel_type: uses_definition
          spec_id: PAD-04-002
        - rel_type: uses_definition
          spec_id: PAD-15-009
      - id: PAD-16-009
        priority: MUST
        kind: process
        statement: >-
          An open Issue with an open, non-draft Pull Request that closes it
          MUST be `In Review`. `In Review` means `pr-ship` may be run on that
          Pull Request.
        rationale: >-
          Review here is agent-driven, so `In Review` marks work handed to the
          ship pipeline. Progress through that pipeline is tracked on the PR
          (PAD-17), not on the Issue, because one bundle PR closes several
          Issues.
        verification: >-
          Inspection: every open Issue closed by an open non-draft PR is at
          `In Review`.
      - id: PAD-16-010
        priority: MUST
        kind: process
        statement: >-
          A closed Issue MUST be `Done`, whatever its close reason.
        rationale: >-
          A closed Issue is finished as far as the board is concerned, so one value
          covers every close.
        verification: >-
          Inspection: every closed non-Epic item on Project #24 is at `Done`.
      - id: PAD-16-014
        priority: MUST
        kind: process
        statement: >-
          Whoever decides not to action an Issue MUST close it with the "not
          planned" or "duplicate" close reason, not a label.
        rationale: >-
          GitHub's close reason already records why the Issue closed, and a label would
          be a second copy that can drift (PAD-16-002).
        verification: >-
          Inspection: no `wontfix` label exists.
      - id: PAD-16-011
        priority: MUST
        kind: process
        statement: >-
          An open, unclaimed Issue that does not meet the `Ready` conditions
          (PAD-16-004, PAD-16-005) MUST be `Backlog`.
        rationale: >-
          Every open non-Epic Issue needs a `Status` value (PAD-16-001), and an
          unclaimed one that is not `Ready` cannot be built or planned yet. `Backlog` is
          that remainder, so no item is left without a value.
        verification: >-
          Inspection: every open unclaimed item not meeting the `Ready`
          conditions is at `Backlog`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-16-004
        - rel_type: uses_definition
          spec_id: PAD-16-005
      - id: PAD-16-012
        priority: MUST_NOT
        kind: process
        statement: >-
          An Epic Issue MUST NOT carry a `Status` value.
        rationale: >-
          An Epic is a container, not work that is claimed, reviewed, and
          merged. Its progress is the sub-issue progress GitHub already shows,
          and an Epic that still needs planning is identified by its
          `needs-planning` label.
        verification: >-
          Inspection: no Epic item on Project #24 has a `Status` value.

  - id: PAD-17
    title: Pull Request Ship Stage
    specs:
      - id: PAD-17-001
        priority: MUST
        kind: process
        statement: >-
          Every open, non-draft Pull Request MUST be an item on GitHub Project
          #24 carrying a `Ship stage` value: `Awaiting ship`, `Triage`,
          `Execute`, `Verify`, `Needs you`, or `Ready to merge`.
        rationale: >-
          `pr-ship` records its progress in gitignored local files, so no
          other machine or session can see whether a PR's triage has run,
          whether it is paused at a gate, or whether it is ready to merge. With
          several agents working in parallel, "which PRs need me?" is the
          question the board most needs to answer.
        verification: >-
          Inspection: every open non-draft PR is on Project #24 with a
          `Ship stage` value.
      - id: PAD-17-002
        adr:
        - ADR-0139
        priority: MUST
        kind: process
        statement: >-
          `pr-ship` MUST set a Pull Request's `Ship stage` to `Triage`,
          `Execute`, or `Verify` on entering that phase, including when it
          resumes into it and when its triage reviews only the delta over a
          pre-push review (PAD-07-007); to `Needs you` while paused at a gate
          awaiting a human; and to `Ready to merge` when verification
          completes. The pre-push review sets no `Ship stage`, because no
          Pull Request exists yet.
        rationale: >-
          The one skill that knows its own phase writes the value, so the
          field is a mirror of pipeline progress that needs no manual upkeep.
        verification: >-
          A `pr-ship` run leaves its PR at `Ready to merge`, and a run paused
          at `defer-ask` or `inversion-halt` leaves it at `Needs you`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-07-007
      - id: PAD-17-003
        priority: MUST
        kind: process
        statement: >-
          Opening a non-draft Pull Request, or marking a draft Pull Request
          ready for review, MUST add it to GitHub Project #24 with
          `Ship stage` set to `Awaiting ship`.
        rationale: >-
          PAD-17-002 covers only the stages `pr-ship` itself enters. Without
          an entry rule, a PR nobody has shipped yet is either absent from
          the board or has no `Ship stage`, and PAD-17-001 cannot hold.
        verification: >-
          Inspection: a newly opened non-draft PR appears on Project #24 at
          `Awaiting ship` before any `pr-ship` run.
        relationships:
        - rel_type: refines
          spec_id: PAD-17-001
      - id: PAD-17-004
        priority: MUST
        kind: process
        statement: >-
          When a Pull Request is converted to draft, closed, or merged, its
          `Ship stage` value MUST be cleared. Marking it ready for review again
          re-enters it at `Awaiting ship` (PAD-17-003).
        rationale: >-
          PAD-17-001 covers only open non-draft PRs. Without an exit rule, a
          PR that leaves that set keeps its last stage, and the board shows a
          merged or abandoned PR as `Ready to merge` or `Needs you`.
        verification: >-
          Inspection: no draft, closed, or merged PR on Project #24 has a
          `Ship stage` value.
        relationships:
        - rel_type: extends
          spec_id: PAD-17-001
        see_also:
        - spec_id: PAD-17-003
          reason: 'restates PAD-17-003''s consequence for a re-readied PR'

  - id: PAD-18
    title: Pipeline Test-Gate Placement
    description: >-
      Where the build-to-merge pipeline runs tests locally, and when it merges
      the base branch into a PR. CI on `pull_request` runs the full suite
      against the PR merged into its base as of the push, and GitHub refuses a
      merge while that run is red or has not run. So a local check is worth its
      cost only when it answers before CI would (ADR-0179).
    specs:
      - id: PAD-18-001
        adr:
        - ADR-0126
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          Before an implementation Pull Request's first push, `create-pr` MUST
          gate it with the linters and the branch diff's targeted test set.
          It pushes only when both pass.
        rationale: >-
          The full local suites took a median of 11.6 minutes, longer than CI
          takes to run both. The linters and the targeted set keep an obviously
          broken branch out of CI in a few minutes, and CI's required run tests
          the rest on the merge with the base.
        verification: >-
          Inspection: `create-pr` Phase 3 runs the linters and
          `targeted-tests` on its implementation-PR path before its push step
          and stops on a non-zero `exit:` line.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-18-026
        - rel_type: uses_definition
          spec_id: PAD-18-002
      - id: PAD-18-010
        adr:
        - ADR-0126
        priority: MUST
        kind: process
        statement: >-
          Before a Pull Request that changes no Python is first pushed,
          `create-pr` MUST gate it with the linters and `prepush-ci-mirror`.
          That gate runs no unit or integration suite.
        rationale: >-
          A docs-only branch has nothing for the suites to catch. The mirror's
          cheap checks still read its Markdown and specs: generated-file sync,
          front matter, the ADR index, spec-lint and Markdown lint. Three of
          the #5580 audit's failures came from docs-typed PRs that ran no local
          check at all.
        verification: >-
          Inspection: `create-pr` Phase 3 runs only the linters on its
          docs-PR path, and Phase 3c runs `prepush-ci-mirror` on every PR
          type.
      - id: PAD-18-002
        adr:
        - ADR-0126
        - ADR-0143
        priority: MUST
        kind: process
        statement: >-
          After a PR's first push, an agent MUST gate each fix commit locally
          with the linters and the branch diff's targeted test set. The set
          holds each test file that imports a changed symbol, the mirror test
          file of each changed module, and each changed test file.
          It also holds `test/architecture/` and `test/metadata/`. A conflict
          merge with no fix in it is not a fix commit; PAD-18-015 sets its
          gate.
        rationale: >-
          After a one-line fix, a full local run costs 9 to 18 minutes on a
          2-CPU slot, and CI then runs the full suite again in 6 to 9. The
          targeted set catches a broken fix first, at a fraction of that cost.
          The checks in `test/architecture/` and `test/metadata/` read the
          tree, not an imported symbol, and nearly every red local full run
          failed there (ADR-0143). The import index cannot reach a changed test
          file: no `vultron` symbol changed, and the mirror lookup covers only
          `vultron/` paths.
        verification: >-
          Inspection: `pr-execute` gates post-first-push fixes with the
          targeted-test command, not the full suite.
        see_also:
        - spec_id: PAD-18-015
          reason: >-
            scope boundary: a conflict merge's gate is set elsewhere, and PAD-18-002
            never binds one, so PAD-18-015 supersedes nothing it requires
      - id: PAD-18-011
        adr:
        - ADR-0126
        - ADR-0143
        priority: MUST
        kind: process
        statement: >-
          Every local gate that selects test files MUST select them with the
          integration marker enabled.
        rationale: >-
          `addopts` carries `-m 'not integration'`, which drops marker-bearing tests
          from a file list. Enabling the marker keeps those tests in the gate.
          Stated over every gate, not the fix-commit gate alone: the first-push
          gate selects the same way (PAD-18-001), and so does the conflict-merge
          gate (PAD-18-015), so a rule scoped to one of the three would leave the
          marker unspecified for the other two.
        verification: >-
          Inspection: the gate command in `create-pr` Phase 3, in `pr-execute`
          Phase 5 Step 3, and after a conflict merge overrides the
          `not integration` default. Test: `test/metadata/test_targeted_tests.py`
          checks that the command `pytest_argv` prints carries `-m ""` for every
          selection, whatever the diff.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-18-002
      - id: PAD-18-003
        adr:
        - ADR-0126
        - ADR-0143
        - ADR-0179
        priority: MUST_NOT
        kind: process
        statement: >-
          The PAD-18-002 gate MUST NOT escalate to the full unit and
          integration suites, whatever paths the branch diff touches.
        rationale: >-
          A full local run takes longer than CI's run of both suites, which
          GitHub requires before the merge. Escalating would make the agent
          wait for the slower of two runs that give the same answer.
        verification: >-
          Inspection: `pr-execute` gates each post-first-push fix with
          `targeted-tests` and runs no full suite, whatever the command
          reports for the branch diff. Test:
          `test/metadata/test_gate_ceiling.py::test_no_agent_gate_runs_the_whole_suite`
          reports every redirect-and-re-raise `pytest` gate in an
          agent-facing file (`**/AGENTS.md`, `.agents/skills/**`,
          `notes/*.md`, `docs/reference/codebase/*.md`,
          `.github/copilot-instructions.md`, `Makefile`) that names no path
          narrower than the whole tree, and
          `test/metadata/test_targeted_tests.py` checks that `pytest_argv`
          carries paths for every selection and refuses an empty one.
        relationships:
        - rel_type: refines
          spec_id: PAD-18-002
      - id: PAD-18-012
        adr:
        - ADR-0126
        - ADR-0143
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          When a local test gate's paths include shared test infrastructure,
          it MUST run the targeted set it can select and the always-selected
          directories of PAD-18-002. Shared test infrastructure is
          `conftest.py`, `pyproject.toml`, `uv.lock`, `vultron/__init__.py`,
          and the test fixtures, factories, helpers and data files outside
          those directories.
        rationale: >-
          The import index cannot see the tests that reach a change through
          fixtures or configuration, so no targeted set bounds such a path.
          The gate still runs what it can select, and the directories where
          nearly every red local run failed. CI's required full run covers
          the rest.
        verification: >-
          Inspection: for a branch diff that touches `conftest.py`,
          `pyproject.toml`, `uv.lock`, `vultron/__init__.py` or a shared
          fixture, factory, helper or data file, the gate in `create-pr` and
          `pr-execute` runs the importers and mirror tests it can select,
          with `test/architecture/` and `test/metadata/`, and no gate command
          expands to the whole suite. Stated over the paths, not over any
          verdict the selection tool reports for them.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-003
        - rel_type: uses_definition
          spec_id: PAD-18-002
      - id: PAD-18-013
        adr:
        - ADR-0126
        - ADR-0143
        priority: MUST
        kind: process
        statement: >-
          When a fix targets a CI failure outside the targeted set, the agent
          MUST add the failing test's file to the PAD-18-002 gate.
        rationale: >-
          For a CI failure outside the set, the gate runs that test, not the whole
          suite, because CI runs the rest again on the push.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 3 appends the file of a CI
          failure outside a targeted set to the gate command.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-002
      - id: PAD-18-004
        adr:
        - ADR-0126
        - ADR-0138
        - ADR-0143
        priority: MUST
        kind: process
        statement: >-
          After a Pull Request's first push, an agent MUST merge the base
          branch into it locally only when the Pull Request conflicts with
          the base. A conflict means that GitHub reports it `CONFLICTING` or
          `DIRTY`, or that a trial merge (`git merge-tree`) conflicts. Files
          changed on both sides without a conflict are not a conflict.
        rationale: >-
          CI already tests the merge of the PR into its base at each push, and no
          repository rule requires branches to be up to date. A conflict is the only
          sync that needs an agent, because someone must resolve it. GitHub can make
          every clean merge, and CI tests it. A merge on file overlap alone would add
          a local merge and a local test run for paths that the merge did not
          change.
        verification: >-
          Test: `test/metadata/test_sync_decision_script.py` runs
          `sync-decision.sh`, which `pr-execute` Phase 5 Step 2 calls, and checks
          that it answers `merge` on `CONFLICTING`, `DIRTY`, or a
          `git merge-tree` conflict only, and `no-merge` with
          `merge_reason=deferred` on an overlap alone.
        relationships:
        - rel_type: extends
          spec_id: PAD-11-001
          note: >-
            PAD-11-001 and PAD-11-006 say how a conflicted PR is synced
            (merge, never rebase); this adds when a pushed PR is synced at
            all (on conflict only).
      - id: PAD-18-014
        adr:
        - ADR-0126
        - ADR-0138
        - ADR-0143
        priority: MUST
        kind: process
        statement: >-
          When GitHub reports a pushed PR `BEHIND` without a conflict, the
          agent MUST update it on GitHub with `gh pr update-branch`. It does
          no local merge and no local suite run.
        rationale: >-
          In the `BEHIND` state, GitHub itself refuses the merge until the branch
          contains the base. `gh pr update-branch` makes the same merge commit that a
          local merge makes, and CI tests it. No ruleset causes `BEHIND` today.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 2 runs `gh pr update-branch`
          on a conflict-free `BEHIND`.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-004
      - id: PAD-18-015
        adr:
        - ADR-0126
        - ADR-0138
        - ADR-0143
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          After resolving a conflict, the agent MUST gate the merge with the
          linters and the targeted set for the conflicted files alone. Each
          conflicted file counts as wholly changed. The gate also runs
          `test/architecture/` and `test/metadata/`.
        rationale: >-
          A gate from the whole branch diff would test paths that the merge did
          not change. The gate treats a conflicted file as wholly changed,
          because both sides edited it. The rest of the merge changed no line
          that the PR wrote, and CI runs the full suite on the push.
        verification: >-
          Inspection: `pr-execute` Phase 5 Step 3 gates a conflict merge with
          `targeted-tests --paths` over the conflicted files, adds
          `test/architecture/` and `test/metadata/`, and runs no full suite.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-004
      - id: PAD-18-005
        adr:
        - ADR-0126
        priority: MUST_NOT
        kind: process
        statement: >-
          `pr-verify` MUST NOT compute base-tip containment itself, nor
          withhold `READY-TO-MERGE` on the strength of its own containment
          check, when the PR is conflict-free and PAD-18-004 did not call for
          a merge. Only GitHub's reported merge state governs: a
          `mergeStateStatus` of `BEHIND` still blocks.
        rationale: >-
          Requiring the base tip in the branch makes every merge to `main`
          invalidate every other ready PR, which is the loop PAD-18-004 exists
          to break. GitHub reports `BEHIND` only when a ruleset requires
          up-to-date branches, so deferring to it keeps the one case where
          being behind genuinely blocks a merge, without re-deriving it on
          every verify.
        verification: >-
          Inspection: `pr-verify`'s `UNSYNCED-EXECUTE` check reads the
          execute artifact's conflict-free result and GitHub's reported merge
          state, and performs no base-tip containment comparison of its own.
          Test: `test/metadata/test_verify_gate_scripts.py` checks that
          `verify-merge-gate.sh` answers `clear` for a branch behind its base
          that GitHub reports `CLEAN`, and raises `BRANCH-BEHIND` only when
          GitHub reports `BEHIND`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-18-004
      - id: PAD-18-006
        adr:
        - ADR-0126
        priority: MUST
        kind: process
        statement: >-
          `pr-execute`'s summary comment MUST record the local suite runs the
          Pull Request has cost in a fixed line,
          `Suite runs: <N> full, <M> targeted`.
        rationale: >-
          Local suite runs are the one pipeline cost GitHub does not record.
          The execute artifact is gitignored and deleted by `pr-verify`, so
          the PR comment is the only place the count survives.
        verification: >-
          Inspection: the execute comment format in
          `.agents/skills/pr-execute/REFERENCE.md` specifies the line.
      - id: PAD-18-016
        adr:
        - ADR-0126
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          The PAD-18-006 count MUST include only runs that happened. The
          first-push gate of PAD-18-001 counts as one targeted run when
          `create-pr` ran the targeted set. A Pull Request that `create-pr`
          gated by the linters alone starts both counts at zero.
        rationale: >-
          The first-push run happens in `create-pr`, before any execute artifact
          or comment exists, so it has to be counted explicitly. Leaving it out
          would understate every Pull Request, and counting a run that did not
          happen would overstate it. PAD-18-007 needs the true figure. No gate
          can now produce a full local run (PAD-18-003, PAD-18-008,
          PAD-18-015), so the full count reads zero on every Pull Request; the
          field stays because merged comments and velocity reporting parse it.
        verification: >-
          Inspection: the documented derivation in
          `.agents/skills/pr-execute/REFERENCE.md` starts the targeted count at
          one when `create-pr` ran the targeted set before the first push and
          at zero when it did not, and starts the full count at zero.
        relationships:
        - rel_type: refines
          spec_id: PAD-18-006
        - rel_type: uses_definition
          spec_id: PAD-18-001
      - id: PAD-18-007
        adr:
        - ADR-0126
        priority: SHOULD
        kind: process
        statement: >-
          Velocity reporting SHOULD report, per merged Pull Request and by
          week: CI runs and failed CI runs, merges from the base branch, local
          suite runs (PAD-18-006), and open-to-merge time, plus failed CI runs
          on `main`.
        rationale: >-
          Without these, the cost of the pipeline is invisible, and a change
          to gate placement cannot show that it saved time without moving
          failures onto CI or `main`.
        verification: >-
          The output of `scripts/velocity.py` carries the per-PR and weekly
          fields.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-18-006
      - id: PAD-18-008
        adr:
        - ADR-0126
        - ADR-0179
        priority: MUST_NOT
        kind: process
        statement: >-
          The gates before a Pull Request's first push MUST NOT run the full
          unit or integration suites.
        rationale: >-
          CI runs both suites on the first push, faster than a local run, and
          GitHub refuses the merge until they pass. A local full run only makes
          the agent wait for an answer that CI gives sooner. This retires the
          one standing exception, a full local run for a change under
          `vultron/demo/` or `test/demo/`: CI runs those tests, and the
          required `CI gate` judges the run. Which workflow depends on the
          path — `demo-integration.yml` for `vultron/demo/`, and
          `python-app.yml`'s `rest` part for `test/demo/`, whose `paths`
          `demo-integration.yml` does not list.
        verification: >-
          Inspection: no gate that runs before a first push — `create-pr`'s,
          and those of the skills handing off to it (`build`, `bugfix`,
          `learn`, `plan-issue`) — runs `pytest` on the whole unit or
          integration suite. Test:
          `test/metadata/test_gate_ceiling.py::test_no_agent_gate_runs_the_whole_suite`
          reads the same corpus for a gate command that collects everything,
          and `guard-tests.yml` runs it on every pull request, including the
          Markdown-only ones the suite's path filters miss.
        relationships:
        - rel_type: refines
          spec_id: PAD-18-001
      - id: PAD-18-017
        adr:
        - ADR-0126
        priority: MUST_NOT
        kind: process
        statement: >-
          A skill that hands off to `create-pr` MUST NOT run the unit or
          integration suites itself.
        rationale: >-
          CI runs both suites on the push, and GitHub requires that run. A suite
          run in a skill before `create-pr` repeats it more slowly, before the
          gate that guards the push has even run.
        verification: >-
          Inspection: `build` Phase 6 runs the linters but no `pytest`
          invocation.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-18-008
      - id: PAD-18-009
        adr:
        - ADR-0138
        priority: MUST
        kind: process
        statement: >-
          Immediately before merging a Pull Request, the agent merging it
          MUST check that Pull Request alone against the current base.
        rationale: >-
          The base that the Pull Request lands on is known only at the time of the
          merge.
        verification: >-
          Inspection: `work-epic-tasks` step 4 runs the merge-state,
          `git merge-tree`, and `targeted-tests --overlap` checks on the Pull
          Request about to merge. None of them runs a test.
      - id: PAD-18-018
        adr:
        - ADR-0138
        priority: MUST
        kind: process
        statement: >-
          When the PAD-18-009 check finds a conflict, the agent MUST send the
          Pull Request back through the review pipeline instead of merging it.
        rationale: >-
          Someone must resolve a conflict, and the resolved tree needs review and CI
          again before it can merge.
        verification: >-
          Inspection: `work-epic-tasks` step 4 re-runs `pr-ship` only on a
          conflict.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-009
      - id: PAD-18-019
        adr:
        - ADR-0138
        priority: MUST
        kind: process
        statement: >-
          When the PR is `BEHIND`, or the base changed files that it also
          changes, the agent MUST update it on GitHub before the merge. It
          uses `gh pr update-branch`, updates at most once per merge, and
          merges only after CI passes on the updated head.
        rationale: >-
          Where files overlap, a clean merge is most likely to hide a behavior conflict.
          An update on GitHub tests that exact combination in CI, with no agent, no
          local merge and no local suite run. An update each time the base moves during
          the CI wait would make every merge invalidate every other ready Pull
          Request.
        verification: >-
          Inspection: `work-epic-tasks` step 4 runs `gh pr update-branch` and
          `wait-for-ci.sh` before merging a `BEHIND` or overlapping Pull
          Request.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-009
      - id: PAD-18-020
        adr:
        - ADR-0138
        priority: MUST_NOT
        kind: process
        statement: >-
          The agent merging a Pull Request MUST NOT re-check or re-sync other
          open Pull Requests because a merge moved the base.
        rationale: >-
          A sweep of every open Pull Request after each merge makes every merge
          invalidate every other ready Pull Request. CI on `main` catches a semantic
          conflict between files that neither side shares (ADR-0126).
        verification: >-
          Inspection: `work-epic-tasks` step 4 has no post-merge sweep of other
          Pull Requests.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-009
      - id: PAD-18-021
        adr:
        - ADR-0173
        priority: MUST
        kind: process
        statement: >-
          Before each push of a Pull Request branch, the agent MUST run
          `prepush-ci-mirror` on the whole branch diff and push only when it
          exits 0. That covers `create-pr`'s first push and each push
          `pr-execute` makes.
        rationale: >-
          About one Pull Request in seven spent a push and a CI round on
          something CI found without running a suite: a line limit, a line
          ceiling, a link, an ADR epoch. Pre-commit hooks see only staged
          files, and several of those checks run only in CI, so a local
          step must run them on the diff the push sends (#5580).
        verification: >-
          Inspection: `create-pr` Phase 3c and `pr-execute` Phase 5 Step 3 run
          `prepush-ci-mirror` before their push steps and stop on a non-zero
          `exit:` line. `test/metadata/test_ci_mirror_skill_wiring.py` pins
          both placements.
        relationships:
        - rel_type: extends
          spec_id: PAD-18-001
        - rel_type: extends
          spec_id: PAD-18-002
      - id: PAD-18-022
        adr:
        - ADR-0173
        priority: MUST
        kind: process
        statement: >-
          Every step that a `pull_request` run of `.github/workflows/` can
          execute MUST be either mirrored by `prepush-ci-mirror` or excluded in
          its registry with a reason.
        rationale: >-
          A mirror that silently misses a new workflow step drifts back into
          the gap it closes. Checking each step against the registry makes a
          new CI check a failing test until someone decides whether it runs
          locally.
        verification: >-
          `test/ci/test_prepush_ci_mirror_parity.py`: the registry accounts for
          every pull-request step, names no step that does not run, and a
          step that is neither mirrored nor excluded fails it.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-18-021
      - id: PAD-18-023
        adr:
        - ADR-0173
        - ADR-0179
        priority: MUST_NOT
        kind: process
        statement: >-
          `prepush-ci-mirror` MUST NOT run pyright, the spec-corpus suite, its
          separate guard-test check, the site build, or a check that reads the
          built site.
        rationale: >-
          These checks took most of the mirror's median 824 seconds on each
          push, and CI's spec and docs jobs answer them in about two to three
          minutes. The mirror keeps the cheap checks, which find the most
          frequent push failures in a few minutes. CI owns the guard tests, on
          a job reaching the Markdown, `specs/`, `AGENTS.md` and `notes/`
          inputs its suite's path filters miss; that job lands with the
          removal, so PAD-18-031 holds throughout.
        verification: >-
          Inspection: `vultron/metadata/planning/ci_mirror/_registry.py` lists
          each of these checks in its exclusions, with a reason that names CI
          as its owner.
        relationships:
        - rel_type: constrains
          spec_id: PAD-18-021
      - id: PAD-18-024
        adr:
        - ADR-0173
        - ADR-0179
        priority: MUST_NOT
        kind: process
        statement: >-
          An agent MUST NOT run tests on a scratch merge of a Pull Request with
          its base. A scratch merge is one the agent does not commit.
        rationale: >-
          CI on `pull_request` tests the merge of the branch into its base on
          every push, and GitHub requires that run to pass. A local run on a
          scratch merge repeats it, more slowly. A conflict merge the agent
          commits is not a scratch merge, so PAD-18-015 still gates one.
        verification: >-
          Inspection: no skill step runs `merged-tree-tests` or another test
          run on a scratch merge. `pr-execute` and `work-epic-tasks` held the
          two such steps; `pr-triage`, `create-pr` and
          `resolving-merge-conflicts` are read too, because the statement
          binds every agent.
      - id: PAD-18-025
        adr:
        - ADR-0173
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          A conflict check of a Pull Request against its base MUST use a trial
          merge that moves no branch and writes no worktree.
        rationale: >-
          The check decides whether a merge into the branch is needed, so it
          must leave no trace in the branch. `.git` is shared across host and
          container mounts, and a stray worktree can only be cleaned with
          `git worktree remove`, because `git worktree prune` would destroy
          live worktrees.
        verification: >-
          Inspection: `sync-decision.sh` and `work-epic-tasks` step 4 find a
          conflict with `git merge-tree`, and neither runs `git worktree add`.
        relationships:
        - rel_type: constrains
          spec_id: PAD-18-004
      - id: PAD-18-026
        adr:
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          A local gate's linter step MUST run ruff's linter and formatter, and
          mypy.
        rationale: >-
          These checks find most type and style failures in seconds, before CI
          would. mypy keeps a cache, so a run on a small change takes
          seconds.
        verification: >-
          Inspection: the `run-linters` skill runs `ruff check`, `ruff format`
          and `mypy`.
      - id: PAD-18-027
        adr:
        - ADR-0179
        priority: MUST_NOT
        kind: process
        statement: >-
          A local gate MUST NOT run pyright.
        rationale: >-
          pyright took a median of two minutes in each local linter step and
          used enough memory to starve parallel test runs. CI runs it on every
          push, and GitHub requires that run to pass.
        verification: >-
          Inspection: no step of `run-linters`, `create-pr` or `pr-execute`
          runs `pyright`.
        relationships:
        - rel_type: constrains
          spec_id: PAD-18-026
      - id: PAD-18-028
        adr:
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          `create-pr` MUST open an implementation Pull Request as a draft.
        rationale: >-
          No full suite has run on the branch when it is first pushed. The
          draft state tells a human reviewer that CI has not yet answered.
          PAD-16-008 keeps such an Issue `In Progress` and PAD-16-009 grants
          `pr-ship` its run on a non-draft Pull Request, so the two read
          together on a Pull Request opened as a draft here.
        verification: >-
          Inspection: `create-pr` opens an implementation Pull Request with
          `gh pr create --draft`. Test:
          `test/metadata/test_draft_pr_wiring.py` checks that `create-pr`'s
          push step carries `--draft` and that its constraints forbid opening
          one without it.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-18-008
      - id: PAD-18-029
        adr:
        - ADR-0179
        priority: MUST
        kind: process
        statement: >-
          An agent MUST mark a draft Pull Request ready for review when, and
          only when, CI's latest run on its head has passed.
        rationale: >-
          No full suite runs locally, so a CI run is the first proof that the
          branch works, and the draft state says so until it passes. The
          obligation runs both ways because each direction answers a different
          failure: marked ready early, the Pull Request claims an answer nothing
          gave; left a draft once the run passed, it claims one is still coming,
          and GitHub refuses to merge a draft, so it cannot merge at all. A
          failed run leaves it a draft until a fix passes, never for good.
        verification: >-
          Inspection: `pr-ship` runs `gh pr ready` when, and only when, every CI
          run on the head commit has finished and the newest of them passed, so
          a cancelled or superseded run beside a live one decides nothing
          (PAD-18-032); its `pr-execute` phase runs it on the CI-green step, and
          no step of `create-pr` runs it. Test:
          `test/metadata/test_draft_pr_wiring.py` checks that the CI-green step
          marks any draft ready, not only one labelled `needs-rebase`.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-18-028
      - id: PAD-18-030
        adr:
        - ADR-0179
        priority: MUST_NOT
        kind: process
        statement: >-
          `pr-execute`'s limit on CI rounds MUST NOT count CI's first run on a
          draft Pull Request.
        rationale: >-
          That run is the full-suite run that the local gate no longer makes,
          not a round spent on a fix. Counting it would leave one round fewer
          for fixes than before.
        verification: >-
          Inspection: the CI-loop iteration cap in
          `.agents/skills/pr-execute/SKILL.md`, which holds the count, starts
          after CI's first run on a draft; `REFERENCE.md` names the same cap
          as an eject condition. Test:
          `test/metadata/test_draft_pr_wiring.py` checks that both files say
          the cap counts iterations that applied a fix, and that neither
          states a bare four-iteration cap.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-18-028
      - id: PAD-18-031
        adr:
        - ADR-0179
        priority: MUST_NOT
        kind: process
        statement: >-
          A local gate MUST NOT drop one of its checks in favor of CI unless
          GitHub requires that check. GitHub requires a check when it refuses a
          merge into the base while the check is red or has not run.
        rationale: >-
          Never merge on red holds only for a check that something enforces.
          A check moved to CI that GitHub does not require can be merged past
          unseen.
        verification: >-
          Inspection: for each check a pull request removes from a local gate,
          an active ruleset on `main` (`gh api repos/CERTCC/Vultron/rulesets`)
          lists that check as a required status check, with no bypass actors,
          such as `main-3 Require CI gate` (#5945).
      - id: PAD-18-032
        priority: MUST
        kind: process
        statement: >-
          `pr-verify` MUST withhold `READY-TO-MERGE` when GitHub reports a Pull
          Request `BLOCKED` and the required `CI gate` check on its head commit
          is red, pending, absent or unreadable. An unfinished run makes it
          pending; only when every run has finished does the newest one decide.
        rationale: >-
          A required check with no bypass actor means GitHub refuses the merge,
          so a pipeline that calls the Pull Request ready sends the agent to a
          merge that cannot succeed. A cancelled or superseded run stays on the
          head commit beside the live one, and an unfinished run carries no
          usable start time, so ranking the runs before ruling out the pending
          ones would answer with an older green one.
        verification: >-
          Inspection: `pr-verify`'s overall-verdict rules list
          `CI-GATE-NOT-GREEN` among the flags that withhold `READY-TO-MERGE`,
          and its Phase 2 reads that flag from `verify-merge-gate.sh` rather
          than judging the checks itself. Test:
          `test/metadata/test_verify_gate_scripts.py` checks that
          `verify-merge-gate.sh` answers `blocks-ready` with the
          `CI-GATE-NOT-GREEN` flag for a `BLOCKED` Pull Request whose `CI gate`
          is red, pending, absent or unreadable, answers `clear` only when it
          passed, and treats an unfinished run as pending even when an older
          run on the same commit passed.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-18-031
        - rel_type: extends
          spec_id: PAD-18-005

  - id: PAD-19
    title: Epic Claim for an Epic Run
    description: >-
      An epic run is `work-epic-tasks` driving one Epic's open children to
      completion across several waves. Its plan lives in a gitignored local
      file, and claiming each child only when its wave starts left later-wave
      Tasks looking free to every other agent. The Epic claim makes the run
      visible on GitHub and holds the lane it owns.
    specs:
      - id: PAD-19-001
        priority: MUST
        kind: process
        statement: >-
          An epic run MUST claim its Epic after plan approval and before any
          build starts. It assigns the Epic and posts a claim comment.
        rationale: >-
          The run's plan lives in a gitignored local file. Until the run marks its Epic
          on GitHub, other agents see the Tasks of later waves as free.
        verification: >-
          `test/metadata/test_claim_scripts.py::TestEpicClaim`: `claim-epic.sh`
          assigns and comments, and refuses a closed or non-Epic issue.
          `TestWorkEpicTasksSkill` pins that `work-epic-tasks` calls it at step 3
          (approval), before step 4 starts any build.
      - id: PAD-19-007
        priority: MUST_NOT
        kind: process
        statement: >-
          An epic run's claim MUST NOT use a label, a branch, or a Project #24
          field.
        rationale: >-
          An Epic carries no `Status` (PAD-16-012) and no claim branch, and the
          assignee is a fact GitHub keeps rather than a marker someone must
          maintain.
        verification: >-
          `test/metadata/test_claim_scripts.py::TestEpicClaim`: `claim-epic.sh`
          claims without setting `Status` or creating a branch.
        relationships:
        - rel_type: extends
          spec_id: PAD-19-001
      - id: PAD-19-008
        priority: MUST
        kind: process
        statement: >-
          An epic run MUST refuse to claim an Epic that is already assigned.
        rationale: >-
          Refusing an assigned Epic stops a second run on one Epic. The check and the
          assignment are two calls, so two runs started at the same moment can both
          pass. A person starts each run, so the project accepts that race and does not
          lock against it.
        verification: >-
          `test/metadata/test_claim_scripts.py::TestEpicClaim`: `claim-epic.sh`
          refuses an assigned Epic.
        relationships:
        - rel_type: extends
          spec_id: PAD-19-001
      - id: PAD-19-002
        priority: MUST
        kind: process
        statement: >-
          While an Epic is assigned, every open Task and Feature whose nearest
          Epic ancestor it is MUST be held. Selection then reports each one as
          not workable, with the reason.
        rationale: >-
          The run owns the build lane, including Tasks planned for later waves.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestEpicClaim` and
          `test/metadata/test_claim_scripts.py`: `bundle-fit` rejects Task and
          Feature candidates under an assigned Epic at the eligibility stage,
          and `claim-issue.sh` refuses a held Task.
      - id: PAD-19-009
        priority: MUST_NOT
        kind: process
        statement: >-
          The epic-run hold (PAD-19-002) MUST NOT apply to a Bug, Idea, or
          Concern under an assigned Epic.
        rationale: >-
          Bugs, Ideas, and Concerns are left open on purpose so other agents
          can keep fixing and planning while the run builds.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestEpicClaim` and
          `test/metadata/test_claim_scripts.py`: `bundle-fit` keeps Bug, Idea,
          and Concern candidates under an assigned Epic, and `claim-issue.sh`
          claims a Bug.
        relationships:
        - rel_type: extends
          spec_id: PAD-19-002
      - id: PAD-19-003
        priority: MUST
        kind: process
        statement: >-
          An agent explicitly asked to build a held Task or Feature MUST stop
          and ask the user, unless the caller passes `--epic-run <Epic>` for
          that Epic.
        rationale: >-
          Every agent runs as the same GitHub user, so the Epic's assignee
          cannot tell the run from a stray session. Asking the user keeps a stray
          session out of the lane that the run holds.
        verification: >-
          `test/metadata/test_claim_scripts.py`: `claim-issue.sh` exits 3 for a
          held Task, and claims it when `--epic-run` names its Epic but not
          another one.
        relationships:
        - rel_type: refines
          spec_id: PAD-19-002
      - id: PAD-19-010
        priority: MUST
        kind: process
        statement: >-
          An epic run MUST name its Epic with `--epic-run <Epic>` for every
          build it starts.
        rationale: >-
          Only the run knows it is the run. A build that does not name the Epic stops
          at the PAD-19-003 check, even for the run's own Tasks.
        verification: >-
          `TestWorkEpicTasksSkill` in `test/metadata/test_claim_scripts.py`
          pins that `work-epic-tasks` step 4 starts every build as
          `build <N> --epic-run <EPIC>`.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-19-003
      - id: PAD-19-004
        priority: MUST
        kind: process
        statement: >-
          An epic run MUST release its Epic at every stop, finished or not, by
          removing the assignee and posting a comment with the run's summary.
        rationale: >-
          A claim that outlives its run holds the Epic's Tasks from everyone.
          Running the skill again claims the Epic again and resumes from its
          status file, so releasing loses nothing.
        verification: >-
          `test/metadata/test_claim_scripts.py::TestEpicClaim`:
          `release-epic.sh` removes the assignee and posts the summary, and
          still posts it when the Epic was already unassigned.
          `TestWorkEpicTasksSkill` pins that `work-epic-tasks` step 6 runs it
          first, on every stop.
      - id: PAD-19-005
        priority: MUST
        kind: process
        statement: >-
          The stale-claim sweeper (PAD-10) MUST flag an assigned Epic with
          `stale-claim`, and comment on it, when the claim is older than 3 days
          and none of the issues it holds (its descendants whose nearest Epic
          it is) has an open Pull Request or claim-branch activity within 3
          days.
        rationale: >-
          A run that crashes before its release step leaves the Epic assigned.
          The held issues' activity, not the Epic's, shows whether the run is
          still working.
        verification: >-
          `test/ci/test_stale_claim_sweeper.py` pins the Epic staleness
          decision in `.github/scripts/stale_claim_sweeper.py`.
        relationships:
        - rel_type: extends
          spec_id: PAD-10-001
      - id: PAD-19-006
        priority: MUST_NOT
        kind: process
        statement: >-
          An epic run MUST NOT hold the Bugs it plans.
        rationale: >-
          Holding Bugs would stop other agents fixing them for the whole run.
        verification: >-
          `test/metadata/test_claim_scripts.py::TestClaimIssue`:
          `claim-issue.sh` claims a Bug under an assigned Epic.
      - id: PAD-19-011
        priority: MUST
        kind: process
        statement: >-
          When a wave starts, an epic run MUST drop each planned Bug that
          another agent claimed first and report it as taken elsewhere.
        rationale: >-
          Dropping a Bug that was taken is cheaper than coordinating over it.
        verification: >-
          `test/metadata/test_claim_scripts.py::TestWorkEpicTasksSkill`:
          `work-epic-tasks` step 4 drops a Bug taken elsewhere and step 6
          reports it.
        relationships:
        - rel_type: derives_from
          spec_id: PAD-19-006

  - id: PAD-20
    title: Pre-Push Mechanical PR Checks
    description: >-
      About one triage finding in ten is mechanical: a tool could have caught
      it before the first push, and each one found after the push costs an
      execute round. These checks run before the push and again in triage, so
      triage stops finding them and judges only what needs judgment.
    specs:
      - id: PAD-20-001
        priority: MUST
        kind: process
        statement: >-
          `pr-body-lint` MUST check, each under a stable rule ID, every rule of
          `.agents/skills/shared/pr-body-guide.md` that needs no judgment.
        rationale: >-
          A rule that needs no judgment is one a tool can apply the same way every
          time. A stable ID lets the guide, a finding and a test name the same rule.
        verification: >-
          `test/metadata/test_pr_body_lint.py` has a test class per rule.
        tags:
          - tooling
      - id: PAD-20-006
        priority: MUST
        kind: process
        statement: >-
          `.agents/skills/shared/pr-body-guide.md` MUST list every rule ID that
          `pr-body-lint` checks.
        rationale: >-
          One list in two places drifts. Pinning the guide's rule table to the
          tool's own rule list makes a rule the tool adds, or one the guide
          drops, fail a test instead of a later triage.
        verification: >-
          `TestGuideListsTheRules` in `test/metadata/test_pr_body_lint.py`
          fails when the guide's rule table and `RULES` disagree in either
          direction.
        relationships:
          - rel_type: extends
            spec_id: PAD-20-001
        tags:
          - tooling
      - id: PAD-20-002
        priority: MUST
        kind: process
        statement: >-
          Before a Pull Request's first push, `create-pr` MUST run
          `pr-body-lint` on the composed body and push only when it exits 0.
        rationale: >-
          A gate that is run but not required to pass catches nothing.
        verification: >-
          `test/metadata/test_pr_body_lint.py::TestSkillsRunTheGates` pins that
          `create-pr`'s pre-push gate runs `pr-body-lint`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-20-001
        tags:
          - tooling
      - id: PAD-20-007
        priority: MUST
        kind: process
        statement: >-
          Before an implementation Pull Request's first push, `create-pr` MUST
          run `spec-backstop --manifest` and push only when it exits 0.
        rationale: >-
          A gate that is run but not required to pass catches nothing. The manifest
          names the specs that the change claims to follow, so a failed resolution
          stops the push.
        verification: >-
          `test/metadata/test_pr_body_lint.py::TestSkillsRunTheGates` pins that
          `create-pr`'s pre-push gate runs `spec-backstop --manifest`.
        relationships:
        - rel_type: uses_definition
          spec_id: SR-12-019
        tags:
          - tooling
      - id: PAD-20-008
        priority: MUST
        kind: process
        statement: >-
          The `## Specs` section of an implementation Pull Request's body MUST
          carry the manifest file that `spec-backstop` resolved, verbatim.
        rationale: >-
          A body that reports a tool's result by hand can misstate it. Pasting the file
          that the tool resolved leaves nothing to retype.
        verification: >-
          `test/metadata/test_pr_body_lint.py::TestSkillsRunTheGates` pins that
          `create-pr`'s pre-push gate runs `pr-body-lint --manifest`, and
          `TestManifestVerbatim` covers the verbatim check.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-20-007
        tags:
          - tooling
      - id: PAD-20-003
        priority: MUST
        kind: process
        statement: >-
          Before a Pull Request's first push, `create-pr` MUST run `spec-lint
          --changed-since <base>` and push only when it exits 0, whatever the
          Pull Request's type.
        rationale: >-
          The marker rule for named tests (MS-10-011), the spec line limit
          (PD-10-002) and the one-obligation rule for statements (MS-03-007)
          have a backlog, so plain `spec-lint` cannot fail on them. Scoped to
          the branch they can, and a docs Pull Request runs no test suite to
          catch them otherwise.
        verification: >-
          `test/metadata/test_pr_body_lint.py::TestSkillsRunTheGates` pins the
          `create-pr` call; `test/metadata/specs/test_branch_checks.py` covers
          what the flag reports.
        relationships:
        - rel_type: uses_definition
          spec_id: MS-10-027
        - rel_type: uses_definition
          spec_id: PD-10-005
        tags:
          - tooling
      - id: PAD-20-004
        priority: MUST
        kind: process
        statement: >-
          `pr-triage` MUST run `pr-body-lint --stage final` first in its body
          phase and report each finding it prints.
        rationale: >-
          A manual reading of a tool-checked rule from the guide can miss findings that
          the tool catches every time.
        verification: >-
          `test/metadata/test_pr_body_lint.py::TestSkillsRunTheGates` pins that
          `pr-triage` Phase 3 runs `pr-body-lint --stage final`.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-20-001
        tags:
          - tooling
      - id: PAD-20-009
        priority: MUST
        kind: process
        statement: >-
          In its body phase, `pr-triage` MUST judge by hand only the body rules
          that `pr-body-lint` does not check.
        rationale: >-
          Triage keeps every check, but a rule that a tool checks is not a judgment.
        verification: >-
          Inspection: `pr-triage` Phase 3 says not to re-check by hand what
          `pr-body-lint` checks, then lists the rules that it judges by hand.
        relationships:
        - rel_type: uses_definition
          spec_id: PAD-20-001
        tags:
          - tooling
      - id: PAD-20-005
        priority: MUST
        kind: process
        statement: >-
          After it records the `Docs:` line (PD-03-013), the session that opened
          a PR MUST run `pr-body-lint --stage final` on the body and fix every
          finding.
        rationale: >-
          The placeholder `create-pr` writes is legal before the push and a FAIL
          after it. The final stage is the point where the placeholder must be
          gone, so that is where the check runs.
        verification: >-
          `test/metadata/test_pr_body_lint.py::TestSkillsRunTheGates` pins the
          call in `check-docs-sync`, and `TestDocsLine` covers the
          final-stage refusal of the placeholder.
        relationships:
        - rel_type: extends
          spec_id: PD-03-013
        tags:
          - tooling
