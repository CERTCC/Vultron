id: PAD
title: Parallel Agentic Development
description: >-
  Requirements for coordinating multiple parallel AI agents and human developers via
  GitHub Issues. Defines the issue hierarchy, label taxonomy, task claiming protocol,
  size labeling, orphan recovery, bundle selection and execution, and revised workflows
  for the build, ingest-idea, review-priorities, and update-plan skills.
version: 1.2.0
scope:
  - prototype
  - production
tags:
- tooling
groups:
  - id: PAD-01
    title: Issue Hierarchy
    specs:
      - id: PAD-01-001
        priority: MUST
        kind: process
        statement: >-
          Tasks MUST be represented as GitHub Issues in the CERTCC/Vultron
          repository. All work is tracked exclusively as GitHub Issues.
      - id: PAD-01-002
        priority: MUST
        kind: process
        statement: >-
          Issues MUST be organized in up to three levels: Epic (thematic
          group), Task (coherent unit of work), and Subtask (atomic PR-sized
          chunk). Leaf issues (those with no sub-issues) are the claimable
          work units.
      - id: PAD-01-003
        priority: MUST
        kind: process
        statement: >-
          Epic Issues MUST be wired on GitHub Project #24 with a `Schedule`
          field value (Now/Next/Later/Someday) that reflects the current
          priority tier of the thematic group they represent.
      - id: PAD-01-005
        priority: MUST
        kind: process
        statement: >-
          Task Issues MUST be sub-issues of their parent Epic.
        relationships:
        - rel_type: refines
          spec_id: PAD-01-002
      - id: PAD-01-006
        priority: MUST
        kind: process
        statement: >-
          Subtask Issues MUST be sub-issues of their parent Task.
        relationships:
        - rel_type: refines
          spec_id: PAD-01-002
      - id: PAD-01-004
        priority: SHOULD
        kind: process
        statement: >-
          The minimum depth that produces right-sized leaf issues SHOULD be
          used. Not every Epic requires Task or Subtask children.

  - id: PAD-02
    title: Label Taxonomy
    specs:
      - id: PAD-02-001
        priority: MUST
        kind: process
        statement: >-
          Every Issue added to GitHub Project #24 MUST have a `Schedule`
          field value (Now/Next/Later/Someday). Issues not yet prioritised
          default to `Schedule=Someday`.
        rationale: >-
          `group:<name>` labels and `PRIORITIES.md` were retired in June 2026
          in favour of the Project #24 `Schedule` field. Do not create new
          `group:` labels.
      - id: PAD-02-004
        priority: MUST
        kind: process
        statement: >-
          A `stale-claim` label MUST be applied by the sweeper job (PAD-10)
          when a claimed Issue has no open PR and the claim branch has not
          received a commit within 3 days.
      - id: PAD-02-011
        priority: MUST
        kind: process
        statement: >-
          Agents MUST skip Issues that carry the `stale-claim` label.
        relationships:
        - rel_type: refines
          spec_id: PAD-04-003
      - id: PAD-02-005
        priority: MUST
        kind: process
        statement: >-
          A `needs-rebase` label MUST be applied when an open PR has merge
          conflicts that cannot be automatically resolved (PAD-11). Human
          intervention is required before the label is removed.
      - id: PAD-02-006
        priority: MUST
        kind: process
        statement: >-
          Docs-only PRs (containing only `specs/` and `notes/` changes) MUST
          carry the `specs-notes` label to identify them as docs-only for
          reviewers.
      - id: PAD-02-008
        priority: MUST
        kind: process
        statement: >-
          Every thematic group that has two or more open leaf Issues MUST have
          exactly one open Epic Issue on GitHub Project #24. A leaf Issue is
          any Issue with no open sub-issues.
      - id: PAD-02-009
        priority: MUST
        kind: process
        statement: >-
          Epic Issues MUST be created using the GitHub `Epic` issue type (via
          GraphQL `createIssue` with the Epic issue type's `issueTypeId`, discovered
          via the GraphQL `issueTypes` query) and MUST be added to GitHub Project #24
          with a `Schedule` value (Now/Next/Later/Someday) matching the work's priority.
      - id: PAD-02-013
        priority: MUST
        kind: process
        statement: >-
          The `create-epic` skill MUST be used to create Epic Issues to ensure
          consistent sub-issue wiring, correct issue type assignment, and
          addition to Project #24.
        relationships:
        - rel_type: implements
          spec_id: PAD-02-009

  - id: PAD-03
    title: Priority Ordering Authority
    specs:
      - id: PAD-03-001
        priority: MUST
        kind: process
        statement: >-
          The `Schedule` field (Now/Next/Later/Someday) on GitHub Project #24
          MUST be the authoritative source for work priority ordering.
          Priority changes MUST be made by updating the `Schedule` field on
          the relevant Epic or Issue — not by maintaining any external file.
        rationale: >-
          `plan/PRIORITIES.md` was archived in June 2026 (PR #693). The
          Project #24 board is the single source of truth for scheduling.
      - id: PAD-03-002
        priority: MUST_NOT
        kind: process
        statement: >-
          Agents MUST NOT create or write to any external priority-ordering
          file. Only the `review-priorities` skill (and humans directly) may
          change `Schedule` field values on GitHub Project #24.
      - id: PAD-03-003
        priority: MUST
        kind: process
        statement: >-
          When the `build` skill selects a task, it MUST query GitHub
          Project #24 for Epics with `Schedule=Now`, then select an open
          unblocked leaf Issue that is a sub-issue of one of those Epics.

  - id: PAD-04
    title: Task Claiming Protocol
    specs:
      - id: PAD-04-001
        priority: MUST
        kind: process
        statement: >-
          An agent MUST claim a task by creating a branch named
          `task/<issue-number>-<slug>` before beginning any implementation
          work. Branch existence is the authoritative distributed lock: if the
          branch already exists, the task is already claimed.
      - id: PAD-04-002
        priority: MUST
        kind: process
        statement: >-
          After creating the claim branch, the agent MUST assign the Issue to
          the triggering user and MUST post a comment on the Issue identifying
          the agent session and branch name.
      - id: PAD-04-003
        priority: MUST_NOT
        kind: process
        statement: >-
          Agents MUST NOT begin implementation work on an Issue whose claim
          branch already exists, whose `stale-claim` label is set, or that
          is already assigned to another user.

  - id: PAD-05
    title: Size Labeling
    specs:
      - id: PAD-05-001
        priority: MUST
        kind: process
        statement: >-
          At Issue creation, an Issue with 1–2 acceptance-criteria (AC)
          checkboxes MUST receive the `size:S` label.
        rationale: >-
          Provides an objective, count-based size estimate at the point the
          Issue is created, before any implementation diff is available.
      - id: PAD-05-002
        priority: MUST
        kind: process
        statement: >-
          At PR open time, the agent MUST measure the actual diff (total lines
          added plus removed across all changed files) and update the size
          label accordingly. Downgrading from the AC-count estimate is
          permitted and expected when the work was smaller than predicted.
        rationale: >-
          Replaces the creation-time AC-count estimate with an objective
          implementation measurement before the PR is reviewed.
      - id: PAD-05-003
        priority: MUST
        kind: process
        statement: >-
          The size label at PR-open time (after the diff-based update per
          PAD-05-002) is the authoritative size for the PR, not the
          Issue-creation-time AC-count estimate.
      - id: PAD-05-004
        priority: MUST
        kind: process
        statement: >-
          At Issue creation, an Issue with 3–6 acceptance-criteria (AC)
          checkboxes MUST receive the `size:M` label.
        rationale: >-
          Provides an objective, count-based size estimate at the point the
          Issue is created, before any implementation diff is available.
      - id: PAD-05-005
        priority: MUST
        kind: process
        statement: >-
          At Issue creation, an Issue with 7+ acceptance-criteria (AC)
          checkboxes MUST receive the `size:L` label.
        rationale: >-
          Provides an objective, count-based size estimate at the point the
          Issue is created, before any implementation diff is available.
      - id: PAD-05-006
        priority: MUST
        kind: process
        statement: >-
          At PR open time, a diff of ≤50 lines MUST receive the `size:S`
          label.
        rationale: >-
          Calibrates the size label to the actual implementation effort
          measured at PR open time (see PAD-05-002).
      - id: PAD-05-007
        priority: MUST
        kind: process
        statement: >-
          At PR open time, a diff of 51–300 lines MUST receive the `size:M`
          label.
        rationale: >-
          Calibrates the size label to the actual implementation effort
          measured at PR open time (see PAD-05-002).
      - id: PAD-05-008
        priority: MUST
        kind: process
        statement: >-
          At PR open time, a diff of 301+ lines MUST receive the `size:L`
          label.
        rationale: >-
          Calibrates the size label to the actual implementation effort
          measured at PR open time (see PAD-05-002).

  - id: PAD-07
    title: Pre-PR Code Review Protocol
    specs:
      - id: PAD-07-001
        priority: MUST
        kind: process
        statement: >-
          The `build` skill MUST invoke the `code-review` agent before
          opening a PR.
      - id: PAD-07-005
        priority: MUST
        kind: process
        statement: >-
          The `code-review` agent MUST run against the current branch diff
          relative to `main`.
        relationships:
        - rel_type: refines
          spec_id: PAD-07-001
      - id: PAD-07-002
        priority: MUST
        kind: process
        statement: >-
          Every finding produced by the `code-review` agent MUST be tagged
          either `[BLOCKING]` or `[ADVISORY]`. `[BLOCKING]` findings are bugs
          and security issues that MUST be resolved before the PR is opened.
          `[ADVISORY]` findings are style and quality observations that do not
          block PR creation.
      - id: PAD-07-003
        priority: MUST
        kind: process
        statement: >-
          The `build` skill MUST resolve all `[BLOCKING]` findings before
          opening a PR.
      - id: PAD-07-006
        priority: MUST
        kind: process
        statement: >-
          After resolving `[BLOCKING]` findings, the `build` skill MUST re-run
          the code review to confirm no new `[BLOCKING]` findings were
          introduced.
        relationships:
        - rel_type: refines
          spec_id: PAD-07-003
      - id: PAD-07-004
        priority: SHOULD
        kind: process
        statement: >-
          After a PR is opened, `[ADVISORY]` findings SHOULD be posted as a
          comment on the PR for human review.

  - id: PAD-08
    title: Build Skill — Issue-Based Task Selection
    specs:
      - id: PAD-08-001
        priority: MUST
        kind: process
        statement: >-
          The `build` skill MUST select work by querying GitHub Project #24
          for Epics with `Schedule=Now`, then querying for open unblocked
          leaf Issues that are sub-issues of those Epics, filtered to exclude
          Issues with `stale-claim` or that are already assigned.
      - id: PAD-08-002
        priority: MUST
        kind: process
        statement: >-
          The `build` skill MUST open a GitHub Pull Request with "Closes #N"
          in the body after completing implementation and passing all
          validations.
      - id: PAD-08-004
        priority: MUST_NOT
        kind: process
        statement: >-
          The `build` skill MUST NOT commit directly to `main`.
      - id: PAD-08-003
        priority: MUST
        kind: process
        statement: >-
          After implementation, the `build` skill MUST compute the diff size
          and update the size label on both the Issue and the PR per
          PAD-05-002 before opening the PR.

  - id: PAD-09
    title: Ingest-Idea — Docs-Only PR and Issue Creation
    specs:
      - id: PAD-09-001
        priority: MUST
        kind: process
        statement: >-
          After writing `specs/<topic>.yaml` and `notes/<topic>.md`, the
          `ingest-idea` skill MUST open a docs-only PR carrying the
          `specs-notes` label before creating the implementation GitHub Issue.
          This ensures spec and notes files are on `main` and referenceable
          from Issues before any implementation work begins.
      - id: PAD-09-002
        priority: MUST
        kind: process
        statement: >-
          After the docs-only PR is opened, `ingest-idea` MUST create a
          GitHub Issue with: a title and description derived from the spec,
          the `size:` label derived from the AC count per PAD-05-001, and a
          link to the spec file in the body. The Issue MUST be added to
          GitHub Project #24 (defaulting to `Schedule=Someday`).
      - id: PAD-09-003
        priority: MUST_NOT
        kind: process
        statement: >-
          `ingest-idea` MUST NOT begin implementation work. It MUST stop after
          creating the Issue. Implementation work begins only when a human (or
          the `review-priorities` skill) promotes the Issue to an active
          `Schedule` tier on GitHub Project #24.

  - id: PAD-10
    title: Orphan Recovery — Stale Claim Sweeper
    specs:
      - id: PAD-10-001
        priority: MUST
        kind: process
        statement: >-
          A scheduled GitHub Actions workflow (weekly cadence, also
          triggerable on `workflow_dispatch`) MUST scan for Issues that are
          assigned, have a `task/<N>-slug` branch, have no open PR, and have
          not received a branch commit within 3 days.
      - id: PAD-10-002
        priority: MUST
        kind: process
        statement: >-
          When the sweeper identifies an orphaned claim, it MUST apply the
          `stale-claim` label to the Issue and MUST post a comment identifying
          the orphaned branch and requesting human review.
  - id: PAD-11
    title: Merge Conflict Recovery
    specs:
      - id: PAD-11-001
        priority: MUST
        kind: process
        statement: >-
          When a PR has merge conflicts, the `build` skill MUST attempt an
          automatic rebase of the task branch onto `main`.
      - id: PAD-11-002
        priority: MUST
        kind: process
        statement: >-
          If the automatic rebase succeeds, the agent MUST force-push the
          rebased branch. CI re-runs automatically on the updated head.
      - id: PAD-11-003
        priority: MUST
        kind: process
        statement: >-
          If the automatic rebase fails, the agent MUST post a comment on the
          PR explaining the conflict.
        rationale: >-
          Ensures human reviewers have visibility into the nature of the
          conflict before intervening.
      - id: PAD-11-004
        priority: MUST
        kind: process
        statement: >-
          If the automatic rebase fails, the agent MUST apply the
          `needs-rebase` label to the PR.
        rationale: >-
          The label signals to the sweeper and other agents that human
          intervention is required before the PR can proceed.
      - id: PAD-11-005
        priority: MUST_NOT
        kind: process
        statement: >-
          If the automatic rebase fails, the agent MUST NOT attempt further
          changes; human intervention is required to resolve the conflict and
          remove the `needs-rebase` label.
        rationale: >-
          Prevents the agent from making the conflict worse or creating
          additional commits on a branch that requires human resolution.

  - id: PAD-12
    title: Review-Priorities — Issue Triage
    specs:
      - id: PAD-12-001
        priority: MUST
        kind: process
        statement: >-
          The `review-priorities` skill MUST query GitHub Project #24 for
          Issues with `Schedule=Someday` and surface them as a triage list
          for the current review session.
      - id: PAD-12-002
        priority: MUST
        kind: process
        statement: >-
          For each `Schedule=Someday` Issue surfaced in triage, the
          `review-priorities` skill MUST use `ask_user` to determine which
          Schedule tier (Now/Next/Later) to promote it to, or whether to
          close or defer it.
      - id: PAD-12-003
        priority: MUST
        kind: process
        statement: >-
          After the user confirms a placement, the `review-priorities` skill
          MUST update the Issue's `Schedule` field on GitHub Project #24 to
          the chosen tier via the GitHub API.

  - id: PAD-13
    title: Update-Plan — Issue Creation
    specs:
      - id: PAD-13-001
        priority: MUST
        kind: process
        statement: >-
          When the `update-plan` skill identifies a new implementation gap (a
          spec requirement with no corresponding code or test), it MUST create
          a GitHub Issue for the gap.
      - id: PAD-13-002
        priority: MUST
        kind: process
        statement: >-
          Issues created by `update-plan` MUST be added to GitHub Project #24
          with `Schedule=Someday` and the initial `size:` label derived from
          the AC count per PAD-05-001.

  - id: PAD-14
    title: GitHub Actions Requirements
    specs:
      - id: PAD-14-003
        priority: MUST
        kind: process
        statement: >-
          A GitHub Actions workflow MUST be created to implement the
          stale-claim sweeper (PAD-10): run on `schedule` (weekly) and
          `workflow_dispatch`, scan for orphaned claims per PAD-10-001,
          apply `stale-claim` label and post comment per PAD-10-002.


  - id: PAD-15
    title: Bundle Selection and Execution
    specs:
      - id: PAD-15-001
        priority: MUST
        kind: process
        statement: >-
          A work bundle MUST be selected in two stages: eligibility (open,
          unassigned, no `stale-claim`, all `blockedBy` CLOSED, leaf), then
          fit. Clearing eligibility MUST NOT by itself make an Issue a bundle
          member.
        rationale: >-
          Selection was eligibility-only and took the first five candidates in
          sub-issue order, so an Idea, a `Someday` Concern and two `size:L`
          Tasks were all proposed as equally valid members of one bundle
          (ISSUE-3482).
        verification: >-
          `test/metadata/test_bundle_fit.py::TestEligibility` covers stage one
          and every other class in that file covers a fit rule applied after it.
      - id: PAD-15-002
        priority: MUST
        kind: process
        statement: >-
          A bundle MUST be homogeneous by executing skill, determined from each
          candidate's `issueType`: Task and Feature are executed by `build`,
          Bug by `bugfix`, and Idea, Concern and Epic by `plan-issue`.
        rationale: >-
          An Idea or Concern leaf clears every eligibility gate but cannot be
          implemented; it needs planning first. Routing by type is the rule
          `work-issue` already applies to a single issue.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestWorkflowPartition` asserts an
          Idea, a Concern and a Bug are each rejected from a `build` bundle with
          the owning skill named in the reason.
      - id: PAD-15-003
        priority: MUST
        kind: process
        statement: >-
          Bundle candidates MUST be ordered by their governing Project #24
          `Schedule` tier per PAD-03-001, where a leaf with no tier of its own
          inherits its parent Epic's tier and an explicit leaf tier always
          wins. Sub-issue list order MUST be used only to break ties.
        rationale: >-
          Sub-issue list order is manual drag-order and carries no priority
          meaning, so treating it as the priority signal silently overrode the
          authoritative field.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestScheduleTier` asserts tier
          ordering (including that `Focus` outranks `Now`), that inheritance
          reaches the sort inside `select_bundle` and not only
          `effective_schedule`, that an explicit leaf tier beats the Epic's, and
          that ties fall back to list order.
          `test_every_board_tier_is_ranked_or_excluded` ratchets the tier list
          against the Schedule options documented in
          `.agents/skills/shared/board-id.sh`, because a tier in neither set
          ranks last rather than failing.
      - id: PAD-15-004
        priority: MUST_NOT
        kind: process
        statement: >-
          An Issue whose governing `Schedule` tier is `Someday` MUST NOT be
          proposed as a bundle member.
        rationale: >-
          `Someday` is explicit human deprioritisation; bundling such an Issue
          reverses a scheduling decision the board already recorded.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestScheduleTier::test_someday_is_excluded_below_tier`
      - id: PAD-15-005
        priority: MUST
        kind: process
        statement: >-
          A bundle MUST be bounded by a total size budget computed from the
          PAD-05 `size:` labels, weighting `size:S` as 1, `size:M` as 2 and
          `size:L` as 3, and weighting an unlabelled Issue as the largest
          size. Member count MUST also remain bounded.
        rationale: >-
          A bundle is implemented as one PR, so the budget is a review budget.
          An unlabelled Issue is unmeasured rather than small, and `size:L` is
          unbounded above, so counting it as the largest size fails safe.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestSizeBudget` asserts the weights,
          the unsized-as-largest rule, that the largest of several `size:` labels
          is both the weight and the label reported, the budget and member
          ceilings, and that a refused oversized candidate does not end the scan.
      - id: PAD-15-006
        priority: MUST
        kind: process
        statement: >-
          A bundle proposal MUST report every candidate it excluded with a
          per-candidate reason, distinguishing exclusion at the eligibility
          stage from exclusion at the fit stage.
        rationale: >-
          The excluded-candidate report listed only eligibility reasons, so a
          candidate held back for size or tier was indistinguishable from one
          that was blocked or already claimed.
        verification: >-
          `test/metadata/test_bundle_fit.py::TestRejectionStages` asserts the two
          stages are distinguishable and that every non-member is accounted for.
      - id: PAD-15-007
        priority: MUST
        kind: process
        statement: >-
          Thematic coherence of a bundle MUST be decided by stating the single
          design idea its members share in one sentence. Mechanical overlap
          signals MAY be surfaced as evidence but MUST NOT be treated as the
          coherence verdict.
        rationale: >-
          Cutting by superficial theme rather than design grain produces
          plausible-looking but wrong work units — the same failure `calve-epics`
          guards against when shaping the Epic forest.
        verification: >-
          A bundle proposal states the shared design idea in one sentence;
          `test/metadata/test_bundle_fit.py::TestCoherenceHints` asserts the tool
          emits overlap evidence only, and never a member decision.
      - id: PAD-15-008
        priority: MUST
        kind: process
        statement: >-
          A skill given several Issue numbers MUST implement every member and
          open one Pull Request whose body carries one `Closes #N` line per
          member. It MUST NOT silently work only the first member or silently
          drop a member.
        rationale: >-
          Getting more than one Issue done in a single PR is the entire purpose
          of bundling; executing one member and discarding the rest defeats it.
          A member dropped for grain is reported, not silently omitted.
        verification: >-
          A bundle PR body lists one `Closes #N` per member in bundle order, and
          any member dropped for grain is named with its reason.
      - id: PAD-15-009
        priority: MUST
        kind: process
        statement: >-
          Every bundle member MUST be claimed onto the single branch named for
          the first member, and each member MUST receive the tests and
          acceptance-criteria coverage it would receive if worked alone.
        rationale: >-
          Branch creation is the distributed lock (PAD-04), so one bundle is one
          lock. A bundle amortises context loading, never rigor.
        verification: >-
          `.agents/skills/shared/claim-issue.sh` assigns and comments on every
          member of the bundle it is given while creating exactly one branch. It
          validates every member number before mutating anything, rejects a
          repeated member, and on a mid-bundle failure names the members already
          claimed and deletes the branch so the claim can be retried.
