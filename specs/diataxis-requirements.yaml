id: DF
title: Diátaxis documentation requirements
description: >-
  Brief requirements for organizing project documentation according to the Diátaxis framework.
version: 1.4.0
scope:
- prototype
- production
tags:
- documentation
groups:
- id: DF-01
  title: General architecture
  specs:
  - id: DF-01-001
    priority: SHOULD
    kind: process
    statement: >-
      Organize the main documentation into the four Diátaxis categories: Tutorials, How-to
      guides, Reference, and Explanation.
  - id: DF-01-002
    priority: MUST
    kind: process
    statement: >-
      Ensure each documentation page maps to exactly one of the four user needs (Learning,
      Goals, Information, or Understanding).
  - id: DF-01-003
    priority: SHOULD_NOT
    kind: process
    statement: 'Documentation pages SHOULD NOT combine multiple Diataxis content types within a single page or section; where a combined view is temporarily unavoidable, the parts MUST be clearly separated and each part MUST link to the canonical full page of the appropriate type.'
  - id: DF-01-004
    priority: SHOULD
    kind: process
    statement: >-
      Use hyperlinks to connect related but distinct content types instead of embedding cross-type
      content.
  - id: DF-01-005
    priority: SHOULD
    kind: process
    statement: >-
      Write documentation in Markdown and prepare it for the MkDocs site defined by `mkdocs.yml`.
- id: DF-02
  title: Documentation maintenance
  specs:
  - id: DF-02-001
    priority: SHOULD
    kind: process
    statement: >-
      Build the documentation architecture iteratively from the inside-out by improving pages
      until their Diátaxis category is clear.
  - id: DF-02-002
    priority: SHOULD
    kind: process
    statement: >-
      Maintain navigation structure to avoid link breakage when moving or renaming files.
- id: DF-03
  title: Tutorials
  specs:
  - id: DF-03-001
    priority: MUST
    kind: process
    statement: >-
      Author tutorials as practical lessons that help learners acquire new skills through
      guided, hands-on experience.
  - id: DF-03-002
    priority: MUST
    kind: process
    statement: Require that each tutorial is an activity where the learner learns by doing.
  - id: DF-03-003
    priority: MUST
    kind: process
    statement: >-
      Ensure tutorials produce visible results early and often to maintain learner confidence.
  - id: DF-03-004
    priority: MUST
    kind: process
    statement: >-
      Use first-person plural ("we") in the tutorial narrative to establish tutor/learner
      rapport.
  - id: DF-03-005
    priority: MUST_NOT
    kind: process
    statement: >-
      Forbid alternative learning paths within a single tutorial's primary flow; present a
      single prescribed learning path.
  - id: DF-03-006
    priority: MUST_NOT
    kind: process
    statement: >-
      Exclude in-depth explanations and theoretical discussions from the body of tutorials;
      link to explanatory pages for background.
  - id: DF-03-007
    priority: MUST
    kind: process
    statement: >-
      Require every tutorial step to produce a comprehensible result that gives immediate
      feedback.
  - id: DF-03-008
    priority: MUST
    kind: process
    statement: >-
      State at the start of each tutorial exactly what the learner will have accomplished.
  - id: DF-03-009
    priority: MUST
    kind: process
    statement: >-
      Point out specific signs or changes the learner should notice during the tutorial.
  - id: DF-03-010
    priority: SHOULD
    kind: process
    statement: >-
      provide explicit links to the related Reference and Explanation pages (prerequisites,
      background, deeper rationale). Keep these resources out of the tutorial body.
  - id: DF-03-011
    priority: MUST
    kind: process
    statement: >-
      Tutorials MUST reserve first-person plural ("we") for the shared journey and use second
      person ("you") for the learner's own actions, possessions, and state.
    rationale: >-
      DF-03-004 establishes "we" as the tutorial voice but does not say what it covers. The
      division of labor is what makes the voice work: "we" affirms the tutor/learner
      relationship, while "you" identifies who is acting and what they now have. Writing "we
      need Docker installed" misattributes the learner's prerequisite to the tutor, and
      pervasive "you should understand that" signals a tutorial drifting into Explanation.
- id: DF-04
  title: How-to guides
  specs:
  - id: DF-04-001
    priority: MUST
    kind: process
    statement: >-
      Present how-to guides as goal-oriented directions that resolve a specific real-world
      task or problem.
  - id: DF-04-002
    priority: MUST
    kind: process
    statement: >-
      Assume the reader is a competent user with required basic skills; surface prerequisites
      explicitly rather than embedding lessons.
  - id: DF-04-003
    priority: MUST
    kind: process
    statement: >-
      Require how-to titles to state exactly what the guide shows the user how to do (e.g.,
      start with "How to ...").
  - id: DF-04-004
    priority: MUST
    kind: process
    statement: Use conditional imperatives (e.g., "If you want X, do Y") when the step applies only under a specific condition.
  - id: DF-04-005
    priority: MUST_NOT
    kind: process
    statement: >-
      Exclude pedagogical teaching, background history, and extended lessons from how-to bodies.
  - id: DF-04-006
    priority: SHOULD
    kind: process
    statement: >-
      Prefer concise branching ("if this, then that") to prepare users for real-world complexity.
  - id: DF-04-007
    priority: MUST
    kind: process
    statement: Omit unnecessary steps that do not contribute directly to the specified goal.
  - id: DF-04-008
    priority: SHOULD
    kind: process
    statement: >-
      provide a short "Prerequisites" or "Starting points" section (or link to one) that handles
      different starting states and messy real-world setups instead of embedding multiple
      alternative flows.
- id: DF-05
  title: Reference
  specs:
  - id: DF-05-001
    priority: MUST
    kind: process
    statement: Produce reference material that is neutral, objective, and technical in tone.
  - id: DF-05-002
    priority: MUST
    kind: process
    statement: >-
      Structure reference content to mirror the physical or logical architecture of the system
      or code being described.
  - id: DF-05-003
    priority: MUST
    kind: process
    statement: Keep reference content dry and free from instruction, discussion, or opinion.
  - id: DF-05-004
    priority: MUST
    kind: process
    statement: State facts about behaviors, commands, parameters, versions, and limitations.
  - id: DF-05-005
    priority: MUST
    kind: process
    statement: >-
      Use consistent, standard patterns and formatting in reference documents to make information
      easy to find.
  - id: DF-05-006
    priority: MAY
    kind: process
    statement: >-
      Allow brief code examples in reference material only to illustrate usage, not to provide
      step-by-step instruction.
  - id: DF-05-007
    priority: MUST
    kind: process
    statement: >-
      Reference material MUST make the system, not the reader, the grammatical subject of its
      descriptive sentences.
    rationale: >-
      DF-05-001 and DF-05-003 require neutral, instruction-free description without saying how to
      achieve it. Naming the grammatical subject is the operational test: "A value of `0`
      disables the timeout" describes the machinery, while "Set `timeout` to `0` to disable it"
      has crossed into instruction and belongs in a How-to guide. The subject test catches the
      drift that "be neutral" alone does not.
- id: DF-06
  title: Explanation
  specs:
  - id: DF-06-001
    priority: MUST
    kind: process
    statement: >-
      Provide explanatory material that focuses on understanding and context for a topic.
  - id: DF-06-002
    priority: MUST
    kind: process
    statement: >-
      Address "Why?" questions by discussing history, design decisions, or technical constraints.
  - id: DF-06-003
    priority: MAY
    kind: process
    statement: >-
      Permit opinion, perspective, and weighing of approaches in explanatory documents.
  - id: DF-06-004
    priority: MUST_NOT
    kind: process
    statement: >-
      Exclude practical instructions and dry technical descriptions that belong in Tutorials,
      How-to, or Reference.
  - id: DF-06-005
    priority: SHOULD
    kind: process
    statement: Prefer titles that can be read as "About X" for explanatory topics.
  - id: DF-06-006
    priority: MUST
    kind: process
    statement: Weave connections to related topics to build a web of understanding.
  - id: DF-06-007
    priority: MAY
    kind: process
    statement: >-
      Explanation MAY use first-person plural ("we") for the author's reasoning and second person
      ("you") to invite the reader to consider a point.
    rationale: >-
      DF was silent on Explanation voice, which left the most-used voice in the corpus formally
      unaddressed. Explanation is discursive and DF-06-003 already permits opinion and
      perspective, so both pronouns are legitimate here — "we chose a state-machine model
      because…" and "you might expect this to behave like a queue; it does not" each do work that
      impersonal prose cannot.
- id: DF-08
  title: File metadata
  specs:
  - id: DF-08-001
    priority: SHOULD
    kind: process
    statement: >-
      Name Diátaxis specification files using snake_case and concise topic descriptors.
  - id: DF-08-002
    priority: SHOULD
    kind: process
    statement: >-
      Place cross-reference sources only in the header metadata and use inline links for cross-spec
      references.
- id: DF-09
  title: Prose style
  description: >-
    Requirements governing the prose itself, as distinct from the architecture of the
    documentation set. The detailed rules, their `SG-nn` identifiers, and their worked examples
    live in `.claude/skills/shared/docs-style-guide.md`; these entries make that file normative
    and give reviewers citable IDs.
  specs:
  - id: DF-09-001
    priority: MUST
    kind: process
    statement: >-
      Hand-written prose under `docs/` MUST follow the documentation style guide at
      `.claude/skills/shared/docs-style-guide.md`.
    rationale: >-
      Style rules are numerous, example-heavy, and change more often than requirements do, so
      they are maintained as a guide rather than as several dozen spec entries. This entry is the
      anchor that gives the guide normative force and lets `lint-docs` findings cite a spec ID.
      Generated trees (`docs/reference/code/`, `docs/reference/case_states/`) and `docs/adr/` are
      outside the guide's scope; fix the generator or the template instead.
    verification: >-
      A `lint-docs` run over a hand-written `docs/` page reports findings that each cite a
      style-guide rule ID, and pages outside the guide's scope are excluded from the target set.
  - id: DF-09-002
    priority: MUST
    kind: process
    statement: >-
      Domain terminology in `docs/` MUST match the canonical term in `docs/reference/glossary.md`,
      with `docs/reference/vultron-taxonomy.md` canonical for Vultron concept names.
    rationale: >-
      "Avoid jargon" and "use domain language" are the same rule with the glossary as arbiter: a
      term in the glossary is domain language and should be used, and a term in neither the
      glossary nor the taxonomy is jargon that must be expanded, replaced, or registered. Naming
      one arbiter also prevents the three overlapping term sources from drifting further apart.
    verification: >-
      Inspection of a `docs/` page confirms each domain term used matches the canonical spelling in
      `docs/reference/glossary.md`, or in `docs/reference/vultron-taxonomy.md` for Vultron concepts.
  - id: DF-09-003
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      Acronyms MUST be expanded on first use on each rendered `docs/` page, where "page" means
      the page as published rather than the source file it was authored in.
    rationale: >-
      First use resets per page because readers arrive from search results and deep links rather
      than by reading in nav order. Site-wide `abbr` tooltips do not survive print output and are
      invisible in raw Markdown. "Page" names the rendered artifact because an assembled page has
      one first use, not one per fragment: applied to the Protocol Specification's fragments
      standalone, the rule would demand twelve expansions of "VFD" and ten of "RM" on one rendered
      page. See DF-09-007.
    verification: >-
      Inspection of a page assembled from `{% include-markdown %}` fragments confirms each
      acronym is expanded once in the rendered output.
  - id: DF-09-004
    priority: MUST
    kind: process
    statement: >-
      Every acronym used in `docs/` MUST be registered in `docs/_acronyms/index.md`.
    rationale: >-
      `pymdownx.snippets` auto-appends that file to every page, so a registered acronym gets a
      hover definition everywhere it appears. An unregistered one silently gets nothing.
    verification: >-
      Every acronym appearing in `docs/` resolves to an entry in `docs/_acronyms/index.md`, and the
      rendered page shows a hover definition for it.
  - id: DF-09-005
    priority: SHOULD
    kind: process
    statement: >-
      A `docs/` page SHOULD introduce, define, or link out for each concept before the sections
      that depend on it.
    rationale: >-
      Prose is a directed acyclic graph of topics. A forward reference forces the reader to hold
      an undefined term until the page explains it, or to leave the page to find out. Across
      pages the dependency edge is a hyperlink from first use to the concept's canonical
      introduction, so the glossary and the taxonomy serve as the concept registry and no
      separate dependency file is required.
  - id: DF-09-006
    priority: SHOULD
    kind: process
    statement: >-
      Every diagram in `docs/` SHOULD be accompanied by prose stating what the diagram shows.
    rationale: >-
      The page must stay comprehensible when the Mermaid render fails, in print-site output, and
      to a screen reader. The accompanying sentence also disciplines the author: a diagram whose
      point cannot be stated in a sentence usually has not earned its place.
  - id: DF-09-007
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      Style rules whose scope is a page MUST be evaluated against the rendered page, and style
      rules whose scope is a sentence or a block MUST be evaluated against the source file that
      contains them, including source files that are `{% include-markdown %}` fragments rather
      than pages in their own right.
    rationale: >-
      A fragment is prose, so exempting it leaves it unchecked: roughly 2,800 lines of the Protocol
      Specification went uncovered because its filenames carried a nav-exclusion prefix. But a
      fragment is not a page, so page-scoped rules applied to one yield artifacts of the split
      rather than prose defects — acronym first use (DF-09-003), concept order (DF-09-005), and
      any rule naming the H1 or nav label. `.markdownlint-cli2.yaml` set the precedent by
      disabling MD041 for this reason.
    verification: >-
      Resolving the lint target set over a directory of `{% include-markdown %}` fragments yields
      a non-empty list, and findings cite the fragment's own line numbers.
  - id: DF-09-008
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      The Diátaxis quadrant of an `{% include-markdown %}` fragment MUST be taken from the pages
      that include it, and a fragment with more than one host MUST satisfy the quadrant rules of
      each host.
    rationale: >-
      Quadrant selects the voice rules (DF-03-004, DF-04-004, DF-05-001, DF-06-007), and a
      fragment's own path does not determine it. `docs/tutorials/worked_example.md` and
      `docs/topics/measuring_cvd/possible_histories.md` are both included into the reference
      Protocol Specification's annexes, and `includes/_rm-states-table.md` has four host pages.
      Inferring quadrant from the fragment's directory would apply tutorial voice rules to
      reference content and vice versa.
    verification: >-
      Inspection confirms each fragment's voice is assessed against the quadrant of every page
      that includes it, not against its own directory.
  - id: DF-09-009
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      A documentation check that acts as a blocking gate MUST report an empty target set as a
      distinct failure, and MUST NOT report success when it has resolved no targets.
    rationale: >-
      A gate that checks nothing and reports success is worse than no gate, because it produces a
      false clean signal that suppresses the review the gate replaced. This is not hypothetical:
      the `lint-docs` gate in `check-docs-sync` resolved to zero targets for every fragment of
      the Protocol Specification and passed, and an American-spelling regression reached `main`
      through it.
    verification: >-
      Invoking the gate on a path with no lintable targets reports the empty target set and does
      not report success.

  - id: DF-09-010
    priority: MUST
    kind: process
    statement: >-
      Reader-facing `docs/` MUST name a protocol activity by its formal protocol message name and
      code paired with its AS2 wire form — "Report Valid (RV) is implemented in ActivityStreams as
      `Accept(Offer(VulnerabilityReport))`" — and MUST NOT name it by its prototype class name.
      Where a shorthand has no formal name, or one shorthand expands across several activities, the
      plain-English name from the corresponding `docs/reference/messages/` heading stands in for the
      formal name. The prototype class name MAY survive only as a non-rendered identifier, such as a
      mermaid node id.
    rationale: >-
      Three layers name every activity — the formal protocol message, the prototype class, and the
      AS2 wire form — and only the first and last are reader-facing. The protocol semantics are not
      recoverable from the wire form: `Accept(Offer(VulnerabilityReport))`,
      `TentativeReject(Offer(VulnerabilityReport))` and `Reject(Offer(VulnerabilityReport))` are
      valid, invalid and closed, and nothing in the wire form says which. So substituting the wire
      form for the protocol name deletes a layer rather than translating one — the premise #3456 was
      originally filed on, and rejected. The prototype class name is dropped instead, because an
      implementer building a conformant peer in another language has no `RmValidateReport`. Naming
      the pairing here gives the ratchet in `test/architecture/test_docs_activity_verbs.py` a spec ID
      to cite, the same anchoring DF-09-001 provides for the style guide.
    verification: >-
      `test/architecture/test_docs_activity_verbs.py` derives each activity's wire form from the
      registered `ActivityPattern` and fails when a guide's mermaid label or prose states a form no
      pattern produces, when a labelled node resolves to no known activity, or when the scan
      resolves fewer targets than the corpus carries.

- id: DF-10
  title: Sweep verification
  description: >-
    Requirements that apply whenever a documentation sweep (naming sweep, Diátaxis extraction,
    page split, or any mechanical pass that moves or republishes existing prose) touches content
    in `docs/`. Faithful copying is insufficient — re-reading content in a new context is a
    different act from reading it in place, and a sweep carries source errors forward with full
    authority unless each moved claim is actively verified.
  specs:
  - id: DF-10-001
    priority: MUST
    kind: process
    statement: >-
      When a claim is moved, extracted, or republished in a new `docs/` location, it MUST be
      verified against its authority (source code, `specs/*.yaml` entry, or `docs/reference/`
      page) before the change is committed. Faithful copying is not verification.
    rationale: >-
      A sweep's success criterion is usually "all content accounted for," which a faithful copy
      satisfies perfectly while propagating a false statement to a second location with more
      authority than it had in the first. Such a defect is invisible in the source context and
      becomes falsifiable only once it is read as a first-class assertion in the destination. Two
      sessions confirmed the mechanism (#3002 under `docs/`, #3342 over `specs/`); witnesses and
      defect detail in `notes/documentation-sweeps.md`.
    verification: >-
      For any diff that adds a block to a `docs/` page which appears verbatim or near-verbatim
      elsewhere under `docs/` (or removes it from another page in the same change), each claim in
      that block is traceable to a code path, spec entry, or reference page that confirms it. The
      check is driven by the diff, not by whether the change describes itself as a sweep.
  - id: DF-10-002
    priority: SHOULD
    kind: process
    statement: >-
      When the same content is needed in more than one `docs/` location, use an
      `{% include-markdown %}` fragment instead of copying prose — one authoritative source,
      multiple render points.
    rationale: >-
      Copied prose drifts silently: one copy is updated, the other is not, and both pass lint
      because neither is wrong by itself. DRY is already a project standard (CS-22-001) and the
      tree already assembles pages from fragments, so this names the existing mechanism as the
      required one. Extraction moves prose out of `lint-docs`' target set until #3318 lands,
      raising rather than lowering the DF-10-001 obligation. Placement and include-path mechanics:
      `notes/documentation-sweeps.md`.
    verification: >-
      Inspection confirms that content appearing on more than one page either (a) uses
      `{% include-markdown %}` with a path relative to each including file or (b) has a documented
      reason why a shared fragment is inappropriate for that case.
- id: DF-11
  title: Site information architecture — tracks, levels, and routing
  specs:
  - id: DF-11-001
    priority: MUST
    kind: process
    adr:
      - ADR-0101
    statement: >-
      Every reader-facing `docs/` page MUST declare an audience `track` and a prerequisite
      `level` in its YAML frontmatter, where `track` is one of adopter-implementer,
      project-developer, or process-researcher, and `level` is one of 100, 200, 300, 400,
      or 500.
    rationale: >-
      Track and level are the two axes the site is organized on, and both must be machine
      readable so that ordering can be checked and landing pages generated rather than
      hand-maintained. Declaring them per page rather than deriving them from directory
      position keeps a page's classification intact when it moves. Definitions of each
      track and level: `notes/site-information-architecture.md`.
    verification: >-
      A frontmatter validator resolves every reader-facing page under `docs/` and confirms
      each declares both keys with a permitted value. Pages belonging to the project
      working record are exempt per DF-11-003 and are confirmed to declare no `level`.
  - id: DF-11-002
    priority: MUST
    kind: process
    adr:
      - ADR-0101
    statement: >-
      A `docs/` page MUST NOT depend on a page whose declared `level` is higher than its
      own, where depending means using a concept the higher-level page introduces without
      introducing, defining, or linking out for it.
    rationale: >-
      This is the rule levels exist to support, and the reviewable ordering rationale that
      was previously absent: before it, no ordering decision could be shown to be wrong,
      so none could be reviewed and drift was undetectable. A violation means the page is
      misplaced, its prerequisites are unstated, or it is doing two jobs. It extends
      DF-09-005 from within a page to between pages, and SG-11's rule that a cross-page
      concept edge is a hyperlink supplies the escape: linking out satisfies the rule.
    verification: >-
      A check compares each page's declared `level` against the levels of the pages it
      depends on and fails on any dependency whose level is higher.
  - id: DF-11-003
    priority: MUST
    kind: process
    adr:
      - ADR-0101
    statement: >-
      Project working-record pages — decision records, generated code documentation,
      exhaustively enumerated state pages, and retained design-history pages — MUST be
      excluded from the reader-facing navigation and MUST NOT be assigned a `level`, while
      remaining published and reachable.
    rationale: >-
      The working record is a different kind of content rather than a greater depth of the
      same content, so assigning it a level is a category error. It is also the bulk of the
      site: roughly 200 of 333 navigated pages are written by the team for the team or for
      the record, which is what makes the tree read as accretion. Exclusion is demotion and
      not retirement — #3281 decided deliberately to retain the design-history pages as the
      design-intent view, and nothing here reopens that.
    verification: >-
      Inspection of `mkdocs.yml` confirms no working-record page appears in the
      reader-facing navigation, and that each remains reachable through a routing page or a
      `not_in_nav` entry rather than being unreferenced.
  - id: DF-11-004
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0101
    statement: >-
      The `level` of a `docs/` page MUST NOT appear in rendered page content or in the
      site navigation.
    rationale: >-
      Levels describe prerequisite depth, which is a property of the content, while readers
      sort themselves by goal: someone wiring a scanner into report validation thinks "how
      do I plug this in", not "I need a 300-level page". Exposing levels would ask a
      newcomer to rank their own knowledge before their first click, which is the same
      self-classification problem the Study/Work split already has. The reader sees a linear
      flow; the hierarchy that produced it belongs to the author.
    verification: >-
      Inspection of rendered output and of `mkdocs.yml` confirms no level value or
      level-derived label is presented to readers.
  - id: DF-11-005
    priority: MUST
    kind: process
    adr:
      - ADR-0101
    statement: >-
      Section landing pages that enumerate their section's contents MUST be generated from
      page frontmatter and gated by a check mode, and MUST NOT be hand-maintained.
    rationale: >-
      Every section landing page was a hand-written duplicate of the navigation and every
      one had drifted from it — children missing, order disagreeing, and one describing a
      retired taxonomy to readers. The defect class is the duplication, so correcting
      individual omissions does not prevent recurrence. Two existing tools supply the
      pattern: `vultron/metadata/adr/index_gen.py` and `demo-scenarios-sync` (ADR-0098).
    verification: >-
      The generator's `--check` mode runs as a pre-commit hook and in CI, failing when a
      generated landing page differs from what frontmatter implies. Per DF-09-009 the check
      fails rather than passes when it resolves no targets.
  - id: DF-11-006
    priority: SHOULD
    kind: process
    adr:
      - ADR-0101
    statement: >-
      A set of sibling leaf pages that is too large to browse SHOULD be reached through a
      routing page that links each member, with the navigation carrying the group rather
      than enumerating the members.
    rationale: >-
      The pattern is already proven here and applied inconsistently:
      `docs/reference/user_stories/` holds 111 story pages kept out of the navigation
      entirely and reached through `traceability.md`, so two nav entries carry 111 pages.
      The same navigation meanwhile enumerates 100 decision records, 33 enumerated case
      states, and 22 generated code pages inline. Same shape of content, opposite treatment;
      the routing-page treatment is the one to generalize.
    verification: >-
      Inspection of `mkdocs.yml` confirms large sibling leaf sets appear as a single group
      entry, and that a routing page links every member so no page becomes unreachable.
  - id: DF-11-007
    priority: MUST
    kind: process
    adr:
      - ADR-0101
    statement: >-
      A `docs/` page MUST remain self-sufficient for a reader arriving directly at it;
      repeated openings, restated prerequisites, and re-expanded acronyms on adjacent pages
      MUST NOT be removed in order to make those pages read as a continuous sequence.
    rationale: >-
      Readers arrive from search results and deep links rather than in navigation order,
      which is why DF-09-003 resets acronym first use per page and SG-12 requires stated
      rather than inherited prerequisites. Content that looks duplicated between neighbors
