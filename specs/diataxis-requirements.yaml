id: DF
title: Diátaxis documentation requirements
description: >-
  Brief requirements for organizing project documentation according to the Diátaxis framework.
scope:
- prototype
- production
tags:
- documentation
groups:
- id: DF-01
  title: General architecture
  specs:
  - id: DF-01-001
    priority: SHOULD
    kind: process
    adr:
      - ADR-0136
    statement: >-
      Each reader-facing page SHOULD be one of the four Diátaxis content types —
      tutorial, how-to guide, explanation or reference — and declare it as its
      `page_type` (DF-11-018); the content types label pages and need not organize the
      site's navigation.
    rationale: >-
      A reader arriving from search learns what kind of page they landed on from the
      page itself, while the navigation is free to group pages by subject and reader
      (ADR-0136). Keeping Diátaxis as a per-page property preserves its authoring
      discipline (DF-01-002 through DF-01-004) without making it the site's top level.
  - id: DF-01-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Ensure each documentation page maps to exactly one of the four user needs (Learning,
      Goals, Information, or Understanding).
    rationale: >-
      A reader comes to a page with one need: to learn, to do a task, to look up a fact,
      or to understand. A page that serves one need can give that reader what they came
      for. A page that tries to serve two needs gives each reader text they did not ask
      for, and the author cannot tell which rules for voice and content apply.
  - id: DF-01-003
    priority: SHOULD_NOT
    kind: process
    statement: >-
      A documentation page SHOULD NOT combine more than one Diataxis content type in
      one page or section.
    rationale: >-
      Each content type has its own rules for voice and content (DF-03 to DF-06). When
      one page mixes two types, the reader cannot tell which part to follow and which
      part to study, and a reviewer cannot apply one set of rules to the page.
  - id: DF-01-006
    priority: MUST
    kind: process
    statement: >-
      Where a combined view of Diataxis content types is temporarily unavoidable, the
      page's author MUST separate the parts clearly.
    rationale: >-
      A reader of a combined page must see where one content type stops and the next
      starts. Clear separation lets the reader find the part that serves their need, and
      lets a reviewer apply the rules of one type to each part.
    verification: >-
      Inspection of a page that combines content types confirms that a reader can see
      where each part starts and stops.
    relationships:
    - rel_type: extends
      spec_id: DF-01-003
  - id: DF-01-007
    priority: MUST
    kind: process
    statement: >-
      Where a page combines Diataxis content types, its author MUST link each part to
      the canonical full page of that part's content type.
    rationale: >-
      A part of a combined page is a short view of one content type, not the full
      content. A link to the full page lets the reader go to the complete material, and
      keeps the full page as the one source for that content.
    verification: >-
      Inspection of a page that combines content types confirms each part links to the
      full page of its content type.
    relationships:
    - rel_type: extends
      spec_id: DF-01-003
  - id: DF-01-004
    priority: SHOULD
    kind: process
    statement: >-
      Use hyperlinks to connect related but distinct content types instead of embedding cross-type
      content.
    rationale: >-
      A link keeps each page to its own content type and lets the reader choose to go
      deeper. Text copied from a page of a different type mixes the types (DF-01-003)
      and makes a second copy that can become different from its source.
  - id: DF-01-005
    priority: SHOULD
    kind: process
    statement: >-
      Write documentation in Markdown and prepare it for the MkDocs site defined by `mkdocs.yml`.
    rationale: >-
      One source format and one site build let every page go through the same lint
      checks and the same strict build. A page in a different format gets neither
      check. A page outside the site that `mkdocs.yml` defines gets no strict build and
      does not appear in the published site.
- id: DF-02
  title: Documentation maintenance
  specs:
  - id: DF-02-001
    priority: SHOULD
    kind: process
    statement: >-
      Build the documentation architecture iteratively from the inside-out by improving pages
      until their Diátaxis category is clear.
    rationale: >-
      A complete structure that is planned before the pages exist is usually wrong,
      because the content shows where it belongs only when it is written well. When
      authors improve one page at a time until its type is clear, the structure follows
      the content, and each change is small enough to review.
  - id: DF-02-002
    priority: SHOULD
    kind: process
    statement: >-
      Maintain navigation structure to avoid link breakage when moving or renaming files.
    rationale: >-
      Readers and other pages link to a page by its path. When a file moves or changes
      its name and nothing points the old path to the new one, those links break, and a
      reader who follows them finds nothing.
- id: DF-03
  title: Tutorials
  specs:
  - id: DF-03-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Author tutorials as practical lessons that help learners acquire new skills through
      guided, hands-on experience.
    rationale: >-
      A tutorial is for a reader who does not yet have the skill. That reader learns
      from doing the work with guidance, not from a description of the work. A tutorial
      that only describes gives the learner nothing to practice.
  - id: DF-03-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Require that each tutorial is an activity where the learner learns by doing.
    rationale: >-
      A learner gets a skill from doing the steps, not from reading about them. When
      each part of the tutorial is an action, the learner practices the skill as they
      read.
  - id: DF-03-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Ensure tutorials produce visible results early and often to maintain learner confidence.
    rationale: >-
      A learner does not yet know if they are on the correct track. A visible result
      after each short part tells them that they are, and keeps them working. A long run
      of steps with no result lets one early error stop the learner with no way to find
      it.
  - id: DF-03-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Use first-person plural ("we") in the tutorial narrative to establish tutor/learner
      rapport.
    rationale: >-
      "We" tells the learner that the tutor goes through the steps with them. This makes
      the tutorial a shared activity, not a list of commands, and keeps the learner
      confident through the steps (DF-03-011 gives the scope of each pronoun).
  - id: DF-03-005
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      Forbid alternative learning paths within a single tutorial's primary flow; present a
      single prescribed learning path.
    rationale: >-
      A learner cannot yet judge which of two paths is better for them. Each choice adds
      a decision they cannot make well and a path the author must test. One prescribed
      path lets the learner finish, and lets the author make sure that every step works.
  - id: DF-03-006
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      Exclude in-depth explanations and theoretical discussions from the body of tutorials;
      link to explanatory pages for background.
    rationale: >-
      Explanation in a tutorial stops the activity and gives the learner theory before
      they have the experience to use it. A link to the explanation page keeps the steps
      short and lets the learner read the background when they are ready.
  - id: DF-03-007
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Require every tutorial step to produce a comprehensible result that gives immediate
      feedback.
    rationale: >-
      Each step must show the learner that it worked. Without a result they can see and
      understand, the learner cannot tell an error from success, and an error stays
      hidden until a later step fails.
  - id: DF-03-008
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      State at the start of each tutorial exactly what the learner will have accomplished.
    rationale: >-
      A learner who knows the goal at the start can decide if the tutorial is the
      correct one for them. They can also see their progress toward the goal while they
      do the steps.
  - id: DF-03-009
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Point out specific signs or changes the learner should notice during the tutorial.
    rationale: >-
      A new learner does not know which outputs are important. When the tutorial names
      the signs to look for, the learner can confirm each step and starts to learn what
      correct operation looks like.
  - id: DF-03-010
    priority: SHOULD
    kind: process
    statement: >-
      provide explicit links to the related Reference and Explanation pages (prerequisites,
      background, deeper rationale). Keep these resources out of the tutorial body.
    rationale: >-
      A learner who finishes a tutorial often wants the facts or the reasons behind it.
      Explicit links let them find those pages, and keeping the pages out of the
      tutorial body keeps the steps short (DF-03-006).
  - id: DF-03-011
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Tutorials MUST reserve first-person plural ("we") for the shared journey and use second
      person ("you") for the learner's own actions, possessions, and state.
    rationale: >-
      DF-03-004 establishes "we" as the tutorial voice but does not say what it covers. The
      division of labor is what makes the voice work: "we" affirms the tutor/learner
      relationship, while "you" identifies who is acting and what they now have. Writing "we
      need Docker installed" misattributes the learner's prerequisite to the tutor, and
      pervasive "you should understand that" signals a tutorial drifting into Explanation.
- id: DF-04
  title: How-to guides
  specs:
  - id: DF-04-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Present how-to guides as goal-oriented directions that resolve a specific real-world
      task or problem.
    rationale: >-
      A reader of a how-to guide has a task to do now. A guide that starts from that
      task, and stops when the task is done, gives that reader the steps and nothing
      more. A guide organized around a feature makes the reader find their task in it.
  - id: DF-04-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Assume the reader is a competent user with required basic skills; surface prerequisites
      explicitly rather than embedding lessons.
    rationale: >-
      A how-to reader already has the basic skills and wants to finish a task. A lesson
      in the guide slows that reader down. A stated list of prerequisites lets a reader
      without the skills see the gap and go to the tutorial first.
  - id: DF-04-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Require how-to titles to state exactly what the guide shows the user how to do (e.g.,
      start with "How to ...").
    rationale: >-
      A reader looks for a how-to guide by the task they must do. A title that names the
      task lets the reader find the correct guide in a list or a search result before
      they open it.
  - id: DF-04-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Use conditional imperatives (e.g., "If you want X, do Y") when the step applies only under a specific condition.
    rationale: >-
      Real tasks have conditions. A conditional imperative puts the condition before the
      command, so a reader to whom the condition does not apply can skip the step
      without doing it first.
  - id: DF-04-005
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      Exclude pedagogical teaching, background history, and extended lessons from how-to bodies.
    rationale: >-
      A how-to reader wants to finish a task, not to learn the subject. Teaching and
      history in the guide hide the steps the reader needs. Those parts belong in a
      tutorial or an explanation page that the guide can link to.
  - id: DF-04-006
    priority: SHOULD
    kind: process
    statement: >-
      Prefer concise branching ("if this, then that") to prepare users for real-world complexity.
    rationale: >-
      Real tasks start from different states and can go differently. Short branches show
      the reader what to do in each case without a separate guide for each case.
  - id: DF-04-007
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Omit unnecessary steps that do not contribute directly to the specified goal.
    rationale: >-
      Each extra step costs the reader time and is one more place where the task can
      fail. A step that does not move the reader toward the goal gives no value for that
      cost.
  - id: DF-04-008
    priority: SHOULD
    kind: process
    statement: >-
      provide a short "Prerequisites" or "Starting points" section (or link to one) that handles
      different starting states and messy real-world setups instead of embedding multiple
      alternative flows.
    rationale: >-
      Readers start a task from different setups. One section that handles those setups
      lets the main steps stay one path. Alternative flows inside the steps make each
      reader find the part of the guide that applies to them.
  - id: DF-04-009
    priority: SHOULD
    kind: process
    statement: >-
      A how-to guide that covers the same demonstration as a tutorial SHOULD lead with
      the task and place the demonstration's invocation last, as confirmation. The task
      is what the reader's actor sends, in order, with its branches, and how to verify
      the result.
    rationale: >-
      Each page answers its own reader's question: "I need my actor to propose an
      embargo" is work, answered by the activities to send; "I want to see an embargo
      negotiation happen" is study, answered by the demo. Leading a how-to with the
      command the tutorial opens with writes it to the tutorial's question. DF-01-003
      forbids mixing quadrants within a page and says nothing about two pages; this item
      covers the pair.
    relationships:
    - rel_type: refines
      spec_id: DF-01-003
  - id: DF-04-011
    priority: MAY
    kind: process
    statement: >-
      A how-to guide MAY cover the same demonstration as a tutorial.
    rationale: >-
      Overlap across quadrants is not duplication when each page answers its own
      reader's question. A reader who must do a task and a reader who wants to study it
      can both need the same demonstration, so neither page has to give it up.
  - id: DF-04-012
    priority: SHOULD
    kind: process
    statement: >-
      A how-to guide with nothing to place before the demonstration's invocation SHOULD
      be a tutorial instead.
    rationale: >-
      A how-to guide that only runs the demonstration has no task steps for the reader
      to follow. It answers the tutorial's question, so it belongs in the tutorial's
      content type.
    relationships:
    - rel_type: extends
      spec_id: DF-04-009
  - id: DF-04-010
    priority: SHOULD
    kind: process
    statement: >-
      When a how-to guide and a tutorial show the same demonstration, the section both
      pages show SHOULD be one `{% include-markdown %}` fragment that both include.
    rationale: >-
      Two copies of a demo invocation and its expected result drift apart; one fragment
      cannot (DF-10-002), and placement stays with each host page, so DF-04-009's
      ordering survives. A fragment with two hosts satisfies both hosts' quadrant rules
      (DF-09-012).
    relationships:
    - rel_type: refines
      spec_id: DF-04-009
  - id: DF-04-013
    priority: SHOULD
    kind: process
    statement: >-
      When a how-to guide and a tutorial show the same demonstration, the how-to
      guide's `level` SHOULD be higher than the tutorial's.
    rationale: >-
      A how-to assumes a competent reader (DF-04-002), and the tutorial is where that
      competence comes from, so the how-to sits above it and may link down to it
      (DF-11-002).
    relationships:
    - rel_type: depends_on
      spec_id: DF-11-002
- id: DF-05
  title: Reference
  specs:
  - id: DF-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Produce reference material that is neutral, objective, and technical in tone.
    rationale: >-
      A reader uses reference material to get facts that they can trust. A neutral,
      technical tone shows that the text describes the system as it is, not as the
      author would like it to be.
  - id: DF-05-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Structure reference content to mirror the physical or logical architecture of the system
      or code being described.
    rationale: >-
      A reader who knows the system looks up a fact by where it is in the system. When
      the reference uses the same structure as the system, the reader can find the fact
      without a search. It is also easy to see when a part of the system has no
      reference entry.
  - id: DF-05-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Keep reference content dry and free from instruction, discussion, or opinion.
    rationale: >-
      A reader goes to reference material to look up a fact, often more than one time.
      Instructions, discussion or opinion make each fact harder to find, and they belong
      in a how-to guide or an explanation page.
  - id: DF-05-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: State facts about behaviors, commands, parameters, versions, and limitations.
    rationale: >-
      Reference material is where a reader goes to confirm what the system does. If it
      does not state the behaviors, parameters, versions and limits, the reader must
      read the code or guess.
  - id: DF-05-005
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Use consistent, standard patterns and formatting in reference documents to make information
      easy to find.
    rationale: >-
      When every reference entry has the same structure, a reader learns the structure
      one time and then finds each fact in the same location on every entry. Different
      formats make the reader read each entry from the start.
  - id: DF-05-006
    priority: MAY
    kind: process
    statement: >-
      Allow brief code examples in reference material only to illustrate usage, not to provide
      step-by-step instruction.
    rationale: >-
      A short example often shows the use of a command or field more clearly than a
      description. A step-by-step procedure makes the page a how-to guide, which mixes
      content types (DF-01-003).
  - id: DF-05-007
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Reference material MUST make the system, not the reader, the grammatical subject of its
      descriptive sentences.
    rationale: >-
      DF-05-001 and DF-05-003 require neutral, instruction-free description without saying how to
      achieve it. Naming the grammatical subject is the operational test: "A value of `0`
      disables the timeout" describes the machinery, while "Set `timeout` to `0` to disable it"
      has crossed into instruction and belongs in a How-to guide. The subject test catches the
      drift that "be neutral" alone does not.
- id: DF-06
  title: Explanation
  specs:
  - id: DF-06-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Provide explanatory material that focuses on understanding and context for a topic.
    rationale: >-
      Explanation is the content type for a reader who wants to understand a subject,
      not do a task. The other types do not give context or reasons. Without explanation
      pages, a reader can follow the steps but cannot apply them to a new case.
  - id: DF-06-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Address "Why?" questions by discussing history, design decisions, or technical constraints.
    rationale: >-
      The reason for a design is what lets a reader apply it to a case that the
      documentation does not cover. Design decisions, constraints and their history are
      the content that the other types leave out.
  - id: DF-06-003
    priority: MAY
    kind: process
    statement: >-
      Permit opinion, perspective, and weighing of approaches in explanatory documents.
    rationale: >-
      To understand a design, a reader must see the alternatives and why one was chosen.
      Opinion and the comparison of approaches are how an explanation page shows that
      choice.
  - id: DF-06-004
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      Exclude practical instructions and dry technical descriptions that belong in Tutorials,
      How-to, or Reference.
    rationale: >-
      Instructions and dry technical descriptions have their own content types. In an
      explanation page, they make the text longer and mix content types (DF-01-003), and
      they become a second copy of a how-to guide or a reference page that can become
      different from it.
  - id: DF-06-005
    priority: SHOULD
    kind: process
    statement: Prefer titles that can be read as "About X" for explanatory topics.
    rationale: >-
      A title that reads as "About X" tells the reader that the page explains a subject,
      not a task or a list of facts. The reader can then choose the page by what they
      want to understand.
  - id: DF-06-006
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Weave connections to related topics to build a web of understanding.
    rationale: >-
      Understanding comes from how concepts relate to each other. Links from an
      explanation page to related subjects let the reader see those relations and move
      to the next subject that they need.
  - id: DF-06-007
    priority: MAY
    kind: process
    statement: >-
      Explanation MAY use first-person plural ("we") for the author's reasoning and second person
      ("you") to invite the reader to consider a point.
    rationale: >-
      Explanation is discussion, and DF-06-003 lets it give opinion. "We" lets the
      author show their reasons, as in "we chose a state-machine model because…". "You"
      lets the author ask the reader to think about a point, as in "you might expect
      this to behave like a queue". Impersonal text cannot do these two jobs as well.
- id: DF-08
  title: File metadata
  specs:
  - id: DF-08-001
    priority: SHOULD
    kind: process
    statement: >-
      Name Diátaxis specification files using snake_case and concise topic descriptors.
    rationale: >-
      A consistent file-name style lets a contributor predict the path of a page and its
      URL. Short topic names keep the URLs short.
  - id: DF-08-002
    priority: SHOULD
    kind: process
    statement: >-
      Place cross-reference sources only in the header metadata and use inline links for cross-spec
      references.
    rationale: >-
      When the list of sources is only in the header metadata, a reader finds every
      source of a page in one location. An inline link puts each cross-reference at the
      point where the reader needs it.
- id: DF-09
  title: Prose style
  description: >-
    Requirements governing the prose itself, as distinct from the architecture of the
    documentation set. The detailed rules, their `SG-nn` identifiers, and their worked examples
    live in `.claude/skills/shared/docs-style-guide.md`; these entries make that file normative
    and give reviewers citable IDs.
  specs:
  - id: DF-09-001
    priority: MUST
    kind: process
    statement: >-
      Hand-written prose under `docs/` MUST follow the documentation style guide at
      `.claude/skills/shared/docs-style-guide.md`.
    rationale: >-
      Style rules are numerous, example-heavy, and change more often than requirements do, so
      they are maintained as a guide rather than as several dozen spec entries. This entry is the
      anchor that gives the guide normative force and lets `lint-docs` findings cite a spec ID.
      Generated trees (`docs/reference/code/`, `docs/reference/case_states/`) and `docs/adr/` are
      outside the guide's scope; fix the generator or the template instead.
    verification: >-
      A `lint-docs` run over a hand-written `docs/` page reports findings that each cite a
      style-guide rule ID, and pages outside the guide's scope are excluded from the target set.
  - id: DF-09-002
    priority: MUST
    kind: process
    statement: >-
      Domain terminology in `docs/` MUST match the canonical term in `docs/reference/glossary.md`,
      with `docs/reference/vultron-taxonomy.md` canonical for Vultron concept names.
    rationale: >-
      "Avoid jargon" and "use domain language" are the same rule with the glossary as arbiter: a
      term in the glossary is domain language and should be used, and a term in neither the
      glossary nor the taxonomy is jargon that must be expanded, replaced, or registered. Naming
      one arbiter also prevents the three overlapping term sources from drifting further apart.
    verification: >-
      Inspection of a `docs/` page confirms each domain term used matches the canonical spelling in
      `docs/reference/glossary.md`, or in `docs/reference/vultron-taxonomy.md` for Vultron concepts.
  - id: DF-09-003
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      Acronyms MUST be expanded on first use on each rendered `docs/` page, where "page"
      means the page as published rather than the source file it was authored in. Site
      navigation rendered by the theme (the sidebar and tabs) is not page content and is
      exempt. In a generated listing of child pages, each entry is one unit: an acronym
      in an entry's link label is expanded on first use when that entry's own
      description expands it.
    rationale: >-
      First use resets per page because readers arrive from search results and deep
      links rather than by reading in nav order. Site-wide `abbr` tooltips do not
      survive print output and are invisible in raw Markdown. "Page" names the rendered
      artifact because an assembled page has one first use, not one per fragment
      (DF-09-011). A generated listing reuses navigation labels as link text, so each
      entry's description carries the expansion.
    verification: >-
      Inspection of a page assembled from `{% include-markdown %}` fragments confirms
      each acronym is expanded once in the rendered output, and inspection of a
      generated landing page confirms each entry whose label carries an acronym expands
      it in its description.
  - id: DF-09-004
    priority: MUST
    kind: process
    statement: >-
      Every acronym used in `docs/` MUST be registered in `docs/_acronyms/index.md`.
    rationale: >-
      `pymdownx.snippets` auto-appends that file to every page, so a registered acronym gets a
      hover definition everywhere it appears. An unregistered one silently gets nothing.
    verification: >-
      Every acronym appearing in `docs/` resolves to an entry in `docs/_acronyms/index.md`, and the
      rendered page shows a hover definition for it.
  - id: DF-09-005
    priority: SHOULD
    kind: process
    statement: >-
      A `docs/` page SHOULD introduce, define, or link out for each concept before the sections
      that depend on it.
    rationale: >-
      Prose is a directed acyclic graph of topics. A forward reference forces the reader to hold
      an undefined term until the page explains it, or to leave the page to find out. Across
      pages the dependency edge is a hyperlink from first use to the concept's canonical
      introduction, so the glossary and the taxonomy serve as the concept registry and no
      separate dependency file is required.
  - id: DF-09-006
    priority: SHOULD
    kind: process
    statement: >-
      Every diagram in `docs/` SHOULD be accompanied by prose stating what the diagram shows.
    rationale: >-
      The page must stay comprehensible when the Mermaid render fails, in print-site output, and
      to a screen reader. The accompanying sentence also disciplines the author: a diagram whose
      point cannot be stated in a sentence usually has not earned its place.
  - id: DF-09-007
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      A documentation style check MUST evaluate a sentence-scoped or block-scoped rule
      against the source file that holds it, including an `{% include-markdown %}`
      fragment.
    rationale: >-
      A fragment is prose, so it must be checked. If the check skips fragments, a large
      part of a page that is assembled from fragments, such as the Protocol
      Specification, gets no check.
    verification: >-
      Resolving the lint target set over a directory of `{% include-markdown %}` fragments yields
      a non-empty list, and findings cite the fragment's own line numbers.
  - id: DF-09-011
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      A documentation style check MUST evaluate a rule whose scope is a page against the
      rendered page.
    rationale: >-
      A fragment is not a page. A rule about a page, such as the first use of an acronym
      (DF-09-003) or the order of concepts (DF-09-005), gives false findings when it is
      applied to one part of a page. For the same reason, `.markdownlint-cli2.yaml`
      turns off MD041, which wants a top-level heading as the first line.
    verification: >-
      Inspection of a page assembled from `{% include-markdown %}` fragments confirms a
      page-scoped rule, such as acronym first use, is assessed once over the rendered
      page and not once per fragment.
    relationships:
    - rel_type: extends
      spec_id: DF-09-007
  - id: DF-09-008
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      A reviewer or style check MUST take the Diátaxis quadrant of an
      `{% include-markdown %}` fragment from the pages that include it.
    rationale: >-
      Quadrant selects the voice rules (DF-03-004, DF-04-004, DF-05-001, DF-06-007), and a
      fragment's own path does not determine it. `docs/tutorials/worked_example.md` and
      `docs/topics/measuring_cvd/possible_histories.md` are both included into the reference
      Protocol Specification's annexes. Inferring quadrant from the fragment's directory
      would apply tutorial voice rules to reference content and vice versa.
    verification: >-
      Inspection confirms each fragment's voice is assessed against the quadrant of the
      pages that include it, not against its own directory.
  - id: DF-09-012
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      The author of an `{% include-markdown %}` fragment with more than one host MUST
      make it satisfy the quadrant rules of each host.
    rationale: >-
      A fragment renders in every page that includes it, and each reader sees it under
      that page's quadrant. `includes/_rm-states-table.md` has four host pages. A
      fragment that fits only one host breaks the voice rules on the others.
    verification: >-
      Inspection confirms the voice of a fragment with more than one host is assessed
      against the quadrant of every host, not one of them.
    relationships:
    - rel_type: depends_on
      spec_id: DF-09-008
  - id: DF-09-009
    priority: MUST
    kind: process
    adr:
      - ADR-0092
    statement: >-
      A documentation check that acts as a blocking gate MUST report an empty target set
      as a distinct failure, not as success.
    rationale: >-
      A gate that checks nothing and reports success is worse than no gate. It gives a
      false clean signal, and reviewers then skip the review that the gate replaced. A
      target set that is empty because of a wrong path or a wrong pattern looks the same
      as a clean result unless the gate reports it as a failure.
    verification: >-
      Invoking the gate on a path with no lintable targets reports the empty target set and does
      not report success.

  - id: DF-09-010
    priority: MUST
    kind: process
    adr:
      - ADR-0083
    statement: >-
      A reader-facing `docs/` page MUST name a protocol activity by its formal protocol
      message name and code, paired with its AS2 wire form. An example is "Report Valid
      (RV) is implemented in ActivityStreams as `Accept(Offer(VulnerabilityReport))`".
      Where a shorthand has no formal name, or expands across several activities, the
      page uses the plain-English name from the matching `docs/reference/messages/`
      heading.
    rationale: >-
      Three names identify each activity: the formal protocol message, the prototype
      class and the AS2 wire form. Only the first and the last are for readers. The wire
      form does not give the protocol meaning: `Accept(Offer(VulnerabilityReport))`,
      `TentativeReject(Offer(VulnerabilityReport))` and
      `Reject(Offer(VulnerabilityReport))` mean valid, invalid and closed, and nothing
      in the wire form tells which. Thus, a page that uses only the wire form loses the
      protocol layer. A spec ID for the pairing lets the check in
      `test/architecture/test_docs_activity_verbs.py` cite the rule, as DF-09-001 does
      for the style guide.
    verification: >-
      `test/architecture/test_docs_activity_verbs.py` derives each activity's wire form from the
      registered `ActivityPattern` and fails when a guide's mermaid label or prose states a form no
      pattern produces, when a labelled node resolves to no known activity, or when the scan
      resolves fewer targets than the corpus carries.
  - id: DF-09-013
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0083
    statement: >-
      A reader-facing `docs/` page MUST NOT name a protocol activity by its prototype
      class name.
    rationale: >-
      An implementer who builds a peer in a different language has no
      `RmValidateReport` class (ADR-0083). A prototype class name tells that reader
      nothing about the protocol, and it ties the page to one implementation.
    verification: >-
      Inspection of a reader-facing `docs/` page confirms that no rendered text names a
      protocol activity by its prototype class name.
    relationships:
    - rel_type: extends
      spec_id: DF-09-010
  - id: DF-09-014
    priority: MAY
    kind: process
    adr:
      - ADR-0083
    statement: >-
      A reader-facing `docs/` page MAY keep a prototype class name only as a
      non-rendered identifier, such as a mermaid node id.
    rationale: >-
      A non-rendered identifier is not shown to the reader, so it does not break
      DF-09-013. The checks in `test/architecture/test_docs_activity_verbs.py` read the
      mermaid node id to identify the activity, so the class name is useful there.
    relationships:
    - rel_type: refines
      spec_id: DF-09-013

- id: DF-10
  title: Sweep verification
  description: >-
    Requirements that apply whenever a documentation sweep (naming sweep, Diátaxis extraction,
    page split, or any mechanical pass that moves or republishes existing prose) touches content
    in `docs/`. Faithful copying is insufficient — re-reading content in a new context is a
    different act from reading it in place, and a sweep carries source errors forward with full
    authority unless each moved claim is actively verified.
  specs:
  - id: DF-10-001
    priority: MUST
    kind: process
    statement: >-
      When a claim is moved, extracted, or republished in a new `docs/` location, it MUST be
      verified against its authority (source code, `specs/*.yaml` entry, or `docs/reference/`
      page) before the change is committed. Faithful copying is not verification.
    rationale: >-
      A sweep usually counts as done when all content is accounted for. A faithful copy
      meets that test, even when it moves a false statement to a new location where it
      has more authority than before. The error is often not visible in the source
      context and shows only when the claim is read as a statement on its own in the new
      location. Only a check against the authority finds it.
    verification: >-
      For any diff that adds a block to a `docs/` page which appears verbatim or near-verbatim
      elsewhere under `docs/` (or removes it from another page in the same change), each claim in
      that block is traceable to a code path, spec entry, or reference page that confirms it. The
      check is driven by the diff, not by whether the change describes itself as a sweep.
  - id: DF-10-002
    priority: SHOULD
    kind: process
    statement: >-
      When the same content is needed in more than one `docs/` location, use an
      `{% include-markdown %}` fragment instead of copying prose — one authoritative source,
      multiple render points.
    rationale: >-
      Copied prose drifts silently: one copy is updated, the other is not, and both pass lint
      because neither is wrong by itself. DRY is already a project standard (CS-22-001) and the
      tree already assembles pages from fragments, so this names the existing mechanism as the
      required one. An extracted fragment stays in `lint-docs`' target set for sentence- and
      block-scoped rules (DF-09-007), but the claims it carries are still verified at the moment
      of the move (DF-10-001). Placement and include-path mechanics:
      `notes/documentation-sweeps.md`.
    verification: >-
      Inspection confirms that content appearing on more than one page either (a) uses
      `{% include-markdown %}` with a path relative to each including file or (b) has a documented
      reason why a shared fragment is inappropriate for that case.
- id: DF-11
  title: Site information architecture — stakeholder types, levels, and routing
  specs:
  - id: DF-11-001
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      Every reader-facing `docs/` page MUST declare an audience `stakeholder_type` and a
      prerequisite `level` in its YAML frontmatter. The `stakeholder_type` value is a
      list whose members are drawn from cvd-practitioner, platform-developer,
      process-researcher, and project-contributor, or the bare scalar `ALL`. The `level`
      value is one of 100, 200, 300, 400, or 500. A reader-facing page is a published
      page under `docs/` that is neither a project working-record page (DF-11-003) nor
      an `{% include-markdown %}` fragment (DF-11-010).
    rationale: >-
      Both axes must be machine readable so ordering can be checked and landing
      pages generated rather than hand-maintained. The key is list-valued because
      a page may serve exactly two audiences. No member is a `CVDRole` value,
      making the reader-type versus case-role conflation structurally impossible.
      This item is the normative enumeration; its derivation chain is in
      `notes/site-information-architecture.md`.
    verification: >-
      A frontmatter validator resolves every reader-facing page under `docs/` and confirms
      each declares both keys with permitted values. Project working-record pages
      declare `[project-contributor]` and are confirmed to declare no `level` per
      DF-11-033.
  - id: DF-11-027
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A reader-facing page that serves every stakeholder type MUST declare the bare
      scalar `stakeholder_type: ALL`, not a list naming every type and not `[ALL]`.
    rationale: >-
      Requiring `ALL` over a full enumeration stops one fact having two forms. A tool
      or reviewer that looks for the pages that serve every reader then needs to match
      only one value.
    verification: >-
      `test/metadata/docs/test_page_frontmatter.py::TestPageSchema` accepts the bare
      scalar `ALL` and rejects a `stakeholder_type` list that enumerates every type and
      the list `[ALL]`.
    relationships:
    - rel_type: refines
      spec_id: DF-11-001
  - id: DF-11-002
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A `docs/` page MUST NOT depend on a page whose declared `level` is higher than its
      own, where depending means using a concept the higher-level page introduces without
      introducing, defining, or linking out for it.
    rationale: >-
      This is the rule that levels exist to support. It makes each ordering decision one
      that a reviewer can show to be wrong, so a page that goes out of order can be
      found. A violation means that the page is in the wrong location, that its
      prerequisites are not stated, or that it does two jobs. It extends DF-09-005 from
      the inside of a page to the relation between pages. A link to the page that
      introduces the concept satisfies the rule, because SG-11 makes a link the
      connection between concepts on different pages.
    verification: >-
      A check compares each page's declared `level` against the levels of the pages it
      depends on and fails on any dependency whose level is higher. `docs-level-order`
      implements it: a page that is a glossary term's canonical introduction declares
      the term in `introduces:`, and the first unlinked prose use of the term on a
      lower-level page is a finding at `path:line:col`, with pre-existing violations in
      a shrink-only baseline that names a reason for each.
  - id: DF-11-003
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      Project working-record pages — decision records, generated code documentation,
      exhaustively enumerated state pages, retained design-history pages, individual
      requirements-traceability records (the `docs/reference/user_stories/` story pages and the
      traceability matrix that routes them, but not the stories' reader-facing index), and agent- and
      contributor-facing material such as `docs/agents/`, `docs/developer/` and
      `docs/reference/codebase/` — MUST be excluded from the reader-facing navigation while
      remaining published and reachable.
    rationale: >-
      The working record is a different kind of content, not a deeper level of the same
      content. It is also a large part of the site, so if it stays in the reader-facing
      navigation, readers must go through it to find the pages for them. Research pages
      are not working record. They are reader-facing material for `process-researcher`
      and declare a level (ADR-0102), so this requirement does not apply to them. User
      stories are working record because each story records a requirement that the
      implementation was traced against. A contributor reads a story when a question
      about that requirement comes up, not in sequence. The reader-facing index that
      introduces the stories keeps its level. The pages stay published and reachable,
      because contributors still need them and other pages link to them.
    verification: >-
      `uv run docs-frontmatter` fails when a page matched by `WORKING_RECORD_PATTERNS`
      (`vultron/metadata/docs/page_schema.py`) is listed in the `mkdocs.yml` nav or matched
      by no `not_in_nav` pattern, and
      `test/metadata/docs/test_working_record_routing.py` fails when a working-record page
      is not reached by following links from `docs/about/project_record.md`.
  - id: DF-11-012
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A project working-record page (DF-11-003) MUST declare
      `stakeholder_type: [project-contributor]`.
    rationale: >-
      The working record is for a specific audience, contributors, so it declares a
      type. This rule is separate from DF-11-003 because it is checked against page
      frontmatter, and DF-11-003 is checked against `mkdocs.yml`. One combined rule
      could pass on the navigation while every declaration is missing.
    verification: >-
      The frontmatter validator confirms each working-record page declares
      `[project-contributor]`.
  - id: DF-11-033
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A project working-record page (DF-11-003) MUST NOT be assigned a `level`.
    rationale: >-
      A level on the working record has no meaning, because the working record is not
      part of the reader path that levels order. Because the page still declares its
      audience (DF-11-012), the absent level is a property of the material for one
      audience, not an exemption.
    verification: >-
      The frontmatter validator enforces the absence of `level` on each working-record
      page rather than defaulting one. `test/metadata/docs/test_page_frontmatter.py`
      covers it in `TestWorkingRecordSchema::test_any_declared_level_is_rejected` and
      `TestCheck::test_working_record_page_with_a_level_fails`.
    relationships:
    - rel_type: extends
      spec_id: DF-11-012
  - id: DF-11-004
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A page's own `level` MUST NOT appear in its rendered content or in the site
      navigation. Documenting the level ladder itself — in the glossary, in an ADR, or in a
      shared fragment they include — is not a page declaring its own level and is
      unaffected.
    rationale: >-
      Levels describe prerequisite depth, which is a property of the content, while readers
      sort themselves by goal: someone wiring a scanner into report validation thinks "how
      do I plug this in", not "I need a 300-level page". Exposing levels would ask a
      newcomer to rank their own knowledge before their first click, which is the same
      self-classification problem the Study/Work split already has. The reader sees a linear
      flow; the hierarchy that produced it belongs to the author.
    verification: >-
      Inspection of rendered output and of `mkdocs.yml` confirms no level value or
      level-derived label is presented to readers.
  - id: DF-11-005
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      This codebase MUST generate each section landing page that enumerates its contents
      from page frontmatter, gated by a check mode, not by hand.
    rationale: >-
      A hand-written landing page is a second copy of the navigation, and it becomes
      different from the navigation when a page is added, moved or removed. A fix to
      each missing entry does not stop the next one, because the copy is the cause. A
      generated page that a check mode gates cannot drift without a failure, as
      `vultron/metadata/adr/index_gen.py` (from ADR frontmatter) and
      `demo-scenarios-sync` (from the scenario registry, ADR-0098) already show.
    verification: >-
      The generator's `--check` mode (`uv run docs-site --check`) runs as a pre-commit hook
      and in CI, failing when a generated landing page differs from what frontmatter
      implies. Per DF-09-009 the check fails rather than passes when it resolves no
      generated page.
  - id: DF-11-028
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      Every section index MUST declare its shape in its frontmatter as `generated`,
      `routing` or `rendered`. A section index is an `index.md` that opens a navigation
      group, or the only navigation entry for a directory holding reader pages the
      navigation omits. The `generated` shape is the enumeration DF-11-005 requires. The
      `routing` shape is an index whose links to its members are part of its framing, or
      of a themed grouping that is editorial content. The `rendered` shape is an
      enumeration produced at build time from a registry (DEMOCI-11-009). A `routing` or
      `rendered` index is exempt from DF-11-005.
    rationale: >-
      The shape is a required declaration, so that no section can be left without a
      decision. The two exempt shapes exist because generation can only list pages, and
      it cannot give an argument or a theme. A `rendered` index is exempt because
      nothing is committed to drift. Each index records its decision in its `contents:`
      frontmatter, and `test/metadata/docs/test_site_sync.py` pins that set.
    verification: >-
      `uv run docs-site --check` fails when a section index declares no shape or an
      unknown one. `test/metadata/docs/test_site_sync.py::TestSectionIndexDecisions`
      covers each shape, and
      `TestSiteSync::test_committed_generated_pages_are_the_decided_set` pins the
      committed set of generated, routing, and rendered indexes.
    relationships:
    - rel_type: uses_definition
      spec_id: DF-11-005
  - id: DF-11-029
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      `uv run docs-site --check` MUST fail when a `routing` section index (DF-11-028)
      does not link every member of its section.
    rationale: >-
      A routing page is exempt from generation, but it must still link every member of
      its section. That completeness can be derived, so a check enforces it.
      DEMOCI-11-007 makes the same split between what is generated and what is checked.
    verification: >-
      The check, run as a pre-commit hook and in CI, fails when a routing index does
      not link a member of its section — the group's navigation members plus any
      reader page in its own directory the navigation omits. A link counts when the
      index writes it or carries it in a fragment it includes uncut (no `start=` or
      `end=`), so cards shared with another page route both (DF-10-002).
      `test/metadata/docs/test_site_sync.py::TestSectionIndexDecisions` covers the
      routing faults, and `TestSiteSync::test_committed_routing_pages_link_every_member`
      runs the check over the committed tree.
    relationships:
    - rel_type: depends_on
      spec_id: DF-11-028
  - id: DF-11-006
    priority: SHOULD
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A set of sibling leaf pages that is too large to browse SHOULD be reached through a
      routing page that links each member, with the navigation carrying the group rather
      than enumerating the members.
    rationale: >-
      A navigation that lists a large set of sibling pages one by one is too long to
      scan, and the pages around the set become hard to find. A routing page keeps the
      navigation short and still links each member, so no page becomes unreachable. The
      `docs/reference/user_stories/` set uses this shape: the navigation carries one
      entry, and `traceability.md` reaches each story.
    verification: >-
      Inspection of `mkdocs.yml` confirms large sibling leaf sets appear as a single group
      entry, and that a routing page links every member so no page becomes unreachable.
  - id: DF-11-007
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A rendered `docs/` page MUST remain self-sufficient for a reader arriving directly
      at it.
    rationale: >-
      Readers arrive from search results and deep links rather than in navigation order
      (DF-09-003, SG-12). A page that needs its predecessor fails every reader who
      arrives at it by a deep link. Nav order carries dependency and prominence, not
      narrative.
    verification: >-
      Inspection of a rendered page confirms it stands alone for a reader who did not
      read its predecessor.
  - id: DF-11-030
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0102
    statement: >-
      An author MUST NOT remove a repeated opening, restated prerequisite, or
      re-expanded acronym from a rendered page to make adjacent pages read continuously.
      Sourcing a repeated block from one `{% include-markdown %}` fragment that each
      page includes satisfies this requirement.
    rationale: >-
      A block repeated between neighbors is usually DF-11-007 working, and removing it
      degrades every deep-link arrival. The requirement is on what the reader sees, not
      on the source: a block one authority owns, such as a banner, a pointer, or a
      shared prerequisite list, is sourced once (DF-10-002) and still renders on every
      page.
    verification: >-
      Inspection of any change that removes an opening, a prerequisite statement, or an
      acronym expansion from a rendered page confirms the page still stands alone for a
      reader who did not read its predecessor. A change that replaces such a block with
      an include of a fragment carrying it is not a removal.
    relationships:
    - rel_type: refines
      spec_id: DF-11-007
  - id: DF-11-008
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      This codebase MUST generate a `stakeholder_type` × `level` coverage matrix from
      page frontmatter into an unpublished location outside `docs/`, gated by a check
      mode. The check fails when the committed matrix disagrees with the tree.
    rationale: >-
      The matrix turns "we do not serve audience X" from an impression into a
      recorded fact planning can act on. Gating currency keeps it a checked object
      rather than an advisory one. It sits outside `docs/` because it is a planning
      artifact, and a per-page level table shown to readers would defeat DF-11-004
      page by page.
    verification: >-
      The generator's `--check` mode runs as a pre-commit hook and in CI, failing when the
      committed matrix differs from what page frontmatter implies. Per DF-09-009 the
      check fails rather than passes when it resolves no targets.
  - id: DF-11-031
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0102
    statement: >-
      The coverage matrix check (DF-11-008) MUST NOT fail because a cell is empty.
    rationale: >-
      The check gates currency, not fullness. Requiring fullness would harden into
      "every type at every level", which the divergence-above-100 shape contradicts. An
      empty cell is a recorded fact about the site, not a fault.
    verification: >-
      In `test/metadata/docs/test_site_sync.py`,
      `TestCoverageMatrix::test_empty_cells_render_and_pass` passes a tree in which one
      or more cells are empty.
    relationships:
    - rel_type: refines
      spec_id: DF-11-008
  - id: DF-11-009
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A page's own `stakeholder_type` MUST NOT appear in its rendered content or in the
      site navigation. This rule does not cover the vocabulary itself, documented in the
      glossary, in an ADR, or in a shared fragment they include.
    rationale: >-
      Extends DF-11-004's reasoning one step. A reader should not have to classify
      themselves before their first click. Documenting the vocabulary itself is not a
      page declaring its own audience. The rule also keeps the enumeration free to
      change: `cvd-practitioner` may be split later on evidence, and a reader never
      taught the term loses nothing when it happens, whereas a published label would
      make the split a change to something readers had been taught.
    verification: >-
      Inspection of rendered output and of `mkdocs.yml` confirms no page presents its own
      stakeholder type or a label derived from it.
  - id: DF-11-032
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      A routing page generated for a stakeholder type MUST be titled by the reader's
      situation, not by the stakeholder type.
    rationale: >-
      A situation is recognizable without asking anyone to identify with a label. A
      title that named the type would show the reader the label that DF-11-009 keeps
      off the page.
    verification: >-
      Inspection of rendered output confirms that each generated routing page's title
      states a reader situation.
    relationships:
    - rel_type: extends
      spec_id: DF-11-009
  - id: DF-11-010
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0102
    statement: >-
      An `{% include-markdown %}` fragment MUST NOT declare `stakeholder_type` or `level` of
      its own; both are taken from the pages that include it, and a fragment with more than
      one host is governed by each host's declarations.
    rationale: >-
      A fragment is not a page, so a page-scoped declaration applied to one yields
      artifacts of the authoring split rather than facts about a reader — the same
      reason DF-09-008 takes a fragment's quadrant from its hosts. Without this
      the validator's target set is ambiguous for the published-but-unnavved
      fragments under `docs/includes/`, and `stakeholder_types.md` would have to
      declare an audience for a table with no reader.
    verification: >-
      The frontmatter validator's resolved target set excludes `{% include-markdown %}`
      fragments, and a fragment carrying either key is reported as a finding.
  - id: DF-11-011
    priority: MUST
    kind: process
    adr:
      - ADR-0102
    statement: >-
      This codebase MUST generate the shared fragment defining the `stakeholder_type`
      members from the frontmatter schema, gated by a check mode, not by hand.
    rationale: >-
      The fragment has a different source from a landing page. A landing page comes from
      the frontmatter of many pages, but this fragment comes from the schema that
      defines the vocabulary. Thus, it needs its own requirement and its own check. A
      generated fragment keeps the list that readers see the same as the normative list
      in DF-11-001. A fragment that is maintained by hand can become different from the
      schema with no failure.
    verification: >-
      The generator's `--check` mode runs as a pre-commit hook and in CI, failing when the
      committed fragment differs from what the schema implies. Per DF-09-009 the check fails
      rather than passes when it resolves no targets.
  - id: DF-11-013
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      A reading-path thread MUST be declared once, as data in the frontmatter of the
      start page that opens it, one thread per start page, as an ordered list of stages,
      where each stage has a title naming the reader's goal, may be marked as a stopping
      point, and is either an unordered set of reader-facing pages or an ordered chain of
      them, each member carrying its page path and a blurb written for this thread.
    rationale: >-
      A reader's route through the site is a partial order: at some points order
      matters, and at others any of several pages will do. Ordered stages of sets or
      chains express that directly without forcing a sequence, and cannot contain a
      cycle. Declaring the thread once is what lets the start-page listing and every
      member page's directions be renders of one source (DF-10-002) instead of copies
      that drift.
    verification: >-
      The frontmatter validator parses each start page's thread declaration against the
      stage schema and reports a malformed stage, an empty stage, a stage with no title,
      a member with no blurb, or a member that is not a page path as a finding.
  - id: DF-11-014
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      This codebase MUST generate a start page's thread listing from the thread's data,
      gated by a check mode, not by hand. Framing prose outside the generated block
      stays hand-written.
    rationale: >-
      The listing is an enumeration of the thread, the defect class DF-11-005 exists to
      remove when it is hand-maintained. Generating it into the committed source keeps
      the diff showing what readers will see, the way generated landing pages do.
    verification: >-
      The generator's check mode runs as a pre-commit hook and in CI, failing when a
      start page's committed generated block differs from what its thread data implies.
  - id: DF-11-015
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      Every page that is a member of a thread, and every start page, MUST show one box
      per thread it is on. Each box is titled by the reader's situation rather than by
      `stakeholder_type` (DF-11-009). It names the stage the page belongs to, and a
      start page's box names none. It holds a table with the columns start, previous,
      current and next.
    rationale: >-
      A reader who followed a thread into a page needs directions onward. A page on
      several threads shows each, so it never needs to know which thread a reader is
      on, and it still stands alone (DF-11-007).
    verification: >-
      A test renders the boxes of a fixture tree with a page on two threads and a start
      page, and confirms one box per thread with the expected stage name, the four
      columns, a title taken from the start page's situation, and no
      `stakeholder_type` or `level` value. That every member page and start page shows
      its boxes is checked over the built site by DF-11-045. Covered by
      `test/metadata/docs/test_thread_boxes.py::TestBoxTable`.
  - id: DF-11-034
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      Each cell of a thread box's table (DF-11-015) MUST be a list. Start holds the
      thread's start page. Previous holds the set of thread pages immediately before the
      page. Current holds the page itself as text, not a link. Next holds the set
      immediately after it. An empty set is shown as `---`. On a start page, start and
      current are the start page as text, previous is `---`, and next is the first
      stage's entry pages. The set before a member page is the preceding member of its
      chain, or else the previous stage's exit pages. The set after it is the next
      member of its chain, or else the next stage's entry pages. A set stage's entry and
      exit pages are all its members. A chain's entry page is its first member, and its
      exit page is its last.
    rationale: >-
      A reader who followed a thread into a page needs directions onward without being
      forced down one next page, so predecessors and successors are sets. The start
      column gives a deep-linked reader the way back, and the same table on the start
      page shows the first step.
    verification: >-
      `test/metadata/docs/test_thread_boxes.py::TestBoxTable` renders a fixture tree
      with a page in a chain and one in a set stage, a first and a last member, and a
      start page. It confirms the expected start, previous, current and next lists,
      `---` for an empty set, and an unlinked current cell.
    relationships:
    - rel_type: refines
      spec_id: DF-11-015
  - id: DF-11-035
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      The build MUST render a page that shows thread boxes (DF-11-015) the same for
      every reader.
    rationale: >-
      A page that rendered differently by reader would need to know which thread the
      reader is on. With no query parameter, script or referrer involved, the page
      renders the same on a deep link.
    verification: >-
      In `test/metadata/docs/test_thread_boxes.py`,
      `TestBoxTable::test_titled_by_situation_and_the_same_for_every_reader` confirms a
      rendered box has no script element and no link carrying a query string.
    relationships:
    - rel_type: extends
      spec_id: DF-11-015
  - id: DF-11-016
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      A thread check MUST fail when a thread lists a page that does not exist or is not
      reader-facing (DF-11-001), when a page appears more than once in one thread, or
      when it resolves no threads at all (DF-09-009).
    rationale: >-
      A thread that routes a reader to a missing or working-record page is a broken
      route, and a page listed twice in one thread has two places in a partial order.
      The build's broken-link check catches only the first, and only on the start page.
    verification: >-
      Unit tests cover each failure — a missing page, a working-record page, a duplicate
      member, and an empty set of threads — and the check runs as a pre-commit hook and
      in CI.
  - id: DF-11-018
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      Every reader-facing `docs/` page (DF-11-001) MUST declare exactly one `page_type`
      in its YAML frontmatter: `tutorial`, `how-to`, `explanation`, `reference` or
      `routing`. The `routing` type is for a page that mainly gives directions, such as
      the home page, the start pages, and indexes that only route. A page's `page_type`
      is independent of its `contents:` shape (DF-11-028), so an index whose prose
      mostly explains is `explanation`.
    rationale: >-
      Once the navigation stops grouping pages by Diátaxis type, the type survives
      only as a declaration on the page. A required key makes a missing one a fault
      rather than a silent gap, for the same reason `contents:` is required on landing
      pages.
    verification: >-
      `test/metadata/docs/test_page_frontmatter.py::TestPageTypeSchema` covers the
      permitted values and rejects every other spelling;
      `TestCheck::test_reader_facing_page_without_a_page_type_fails` covers the
      check; `test_committed_tree_passes` runs it over the committed tree, and
      `docs-frontmatter` runs as a pre-commit hook and in CI.
  - id: DF-11-036
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0136
    statement: >-
      A project working-record page (DF-11-003) and an `{% include-markdown %}`
      fragment (DF-11-010) MUST NOT declare a `page_type` (DF-11-018).
    rationale: >-
      The working record's door already says what kind of page it is, and a fragment
      takes its declarations from its hosts, so a `page_type` on either would be a
      declaration nothing reads.
    verification: >-
      In `test/metadata/docs/test_page_frontmatter.py`,
      `TestWorkingRecordSchema::test_any_declared_page_type_is_rejected`,
      `TestCheck::test_working_record_page_with_a_page_type_fails` and
      `TestFragments::test_fragment_declaring_a_page_type_is_reported` cover the
      check; `test_committed_tree_passes` runs it over the committed tree, and
      `docs-frontmatter` runs as a pre-commit hook and in CI.
  - id: DF-11-025
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      Every reader-facing `docs/` page (DF-11-001) MUST declare exactly one `subject`
      in its YAML frontmatter: `protocol` for a page about the Vultron protocol — its
      specification, requirements, messages, models and design, including a
      tutorial that teaches protocol behavior on the reference implementation;
      `implementation` for a page about CERT/CC's reference implementation — its
      code, demos, architecture and project record, however protocol-shaped the
      subject; or `neutral` for a page about neither, which may sit in any section.
    rationale: >-
      Whether a page is about the protocol or about the reference implementation
      is a fact about the page, so it lives on the page; the nav-section check
      (DF-11-020) reads it rather than restating a list that drifts. A required key
      makes an unclassified page a fault rather than a silent pass.
    verification: >-
      `test/metadata/docs/test_page_frontmatter.py::TestSubjectSchema` covers the
      permitted values and rejects every other spelling;
      `TestCheck::test_reader_facing_page_without_a_subject_fails` covers the
      check; `test_committed_tree_passes` runs it over the committed tree, and
      `docs-frontmatter` runs as a pre-commit hook and in CI.
  - id: DF-11-026
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      A project working-record page (DF-11-003) and an `{% include-markdown %}`
      fragment (DF-11-010) MUST NOT declare a `subject` (DF-11-025).
    rationale: >-
      The working record is out of the nav the nav-section check (DF-11-020) walks,
      and a fragment takes its declarations from its hosts, so a `subject` on either
      would be a declaration nothing reads.
    verification: >-
      `test/metadata/docs/test_page_frontmatter.py::TestCheck::test_working_record_page_with_a_subject_fails`,
      `TestWorkingRecordSchema::test_any_declared_subject_is_rejected` and
      `TestFragments::test_fragment_declaring_a_subject_is_reported` cover the
      check; `test_committed_tree_passes` runs it over the committed tree, and
      `docs-frontmatter` runs as a pre-commit hook and in CI.
  - id: DF-11-019
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      On every reader-facing page whose `page_type` (DF-11-018) is not `routing`, the
      built site MUST show a badge naming that type. The badge is rendered from the
      page's own frontmatter.
    rationale: >-
      A badge tells a reader arriving from search what kind of page they landed on. A
      badge read from the page's own declaration cannot drift from it.
    verification: >-
      `test/metadata/docs/test_page_type_badge.py` renders the badge template for
      every `page_type`, confirming the label for each rendered type and no output for
      an undeclared page or a malformed value; confirms a stylesheet rule for every
      rendered type, that the theme override includes the template in the content
      block every page renders, and that no reader-facing page replaces that template.
      With `test/metadata/docs/test_page_frontmatter.py::test_committed_tree_passes`
      (every reader-facing page declares a valid `page_type`), a page that rendered
      the wrong badge or none would fail one of these.
  - id: DF-11-037
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0136
    statement: >-
      The built site MUST NOT show a page-type badge on a `routing` page.
    rationale: >-
      A routing page only gives directions, so a badge there would be noise.
    verification: >-
      `test/metadata/docs/test_page_type_badge.py` confirms the badge template renders
      no output for `routing` and that the stylesheet has no rule for it.
    relationships:
    - rel_type: extends
      spec_id: DF-11-019
  - id: DF-11-038
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0136
    statement: >-
      An author MUST NOT hand-write a page-type badge beside a link unless a check fails
      when the badge differs from the linked page's `page_type`.
    rationale: >-
      A hand-written badge beside a link restates the target's declaration and drifts
      silently when the target changes type. A check that compares the two is the only
      thing that keeps such a badge true.
    verification: >-
      `test/metadata/docs/test_page_type_badge.py::test_no_page_writes_a_badge_by_hand`
      fails on any `docs/` Markdown file that writes the badge markup by hand.
  - id: DF-11-020
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0136
    statement: >-
      A navigation section MUST NOT hold both a page about the Vultron protocol and a
      page about the reference implementation.
    rationale: >-
      A reader who wants the protocol must be able to trust that every page in a
      protocol section binds them or explains what binds them; a
      reference-implementation page beside them reads as part of the protocol. The nav
      is the only place the two are grouped together, and pages move between its
      sections often enough that a review rule alone would let one slip.
    verification: >-
      `docs-nav-subjects`, run as a pre-commit hook and by
      `test/metadata/docs/test_nav_subjects.py`, reads each nav page's `subject`
      (DF-11-025) and fails, naming the section's label trail and the pages of its
      less numerous subject, for every nav group at any depth whose pages include
      both a `protocol` page and an `implementation` page. A nav entry naming a
      missing file is a finding, and a nav with no section or no page fails
      (DF-09-009).
  - id: DF-11-021
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      The site MUST have one lookup page, linked from the home page and from every
      start page, that lists the reader-facing `reference` pages (DF-11-018). The
      lookup page groups them by top-level navigation section, in navigation order,
      each with its `description:`.
    rationale: >-
      Reference is not a top-level tab (ADR-0136), so a returning reader has no view of
      the site by content type. One page gives that view without a top level organized
      by type.
    verification: >-
      `test/metadata/docs/test_lookup_page.py::TestListing` covers the grouping and
      each entry's description, and
      `TestCommittedLookupPage::test_home_and_every_start_page_link_the_lookup_page`
      confirms the links on the committed tree.
    tracking_issue: '#5150'
  - id: DF-11-039
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0136
    statement: >-
      The lookup page (DF-11-021) MUST NOT be a start page (DF-11-013).
    rationale: >-
      A start page opens one reading-path thread for one reader situation. The lookup
      page serves a returning reader of any kind who wants a view by content type, so it
      does not fit one thread.
    verification: >-
      Inspection of `docs/lookup.md` confirms its frontmatter declares no `thread:`.
    relationships:
    - rel_type: extends
      spec_id: DF-11-021
    tracking_issue: '#5150'
  - id: DF-11-040
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      The lookup page MUST list a reference page in a navigation group below the top
      level once, through the `index.md` opening the outermost such group. A reference
      page with no such group, or whose groups below the top level have no opening
      `index.md`, is listed on its own.
    rationale: >-
      A subgroup listed through its index keeps the page short enough to scan
      (DF-11-006).
    verification: >-
      `test/metadata/docs/test_lookup_page.py::TestSubgroups` covers a nested group
      listed through its outermost index and a group without an index, and
      `TestCommittedLookupPage::test_subgroups_are_one_entry_each` checks the committed
      page.
    relationships:
    - rel_type: refines
      spec_id: DF-11-021
    tracking_issue: '#5150'
  - id: DF-11-041
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      The lookup page MUST place a reference page the navigation omits by the
      navigation-reachable `index.md` of its directory, then list it by DF-11-040.
    rationale: >-
      A page the navigation omits has no navigation group of its own. The index of its
      directory is the nearest place in the navigation, so the page is listed where a
      reader would look for it.
    verification: >-
      `test/metadata/docs/test_lookup_page.py::TestOmittedPages` covers an omitted page
      placed beside its directory's index and one that cannot be placed, which
      `uv run docs-site --check` reports as a fault.
    relationships:
    - rel_type: refines
      spec_id: DF-11-021
    tracking_issue: '#5150'
  - id: DF-11-042
    priority: MUST
    kind: process
    adr:
      - ADR-0136
    statement: >-
      This codebase MUST generate the lookup page's listing and gate it with a check
      mode. The check also fails when a reference page has no entry. It also fails when
      the home page or a start page does not link the lookup page.
    rationale: >-
      The check mode fails when the listing differs from the navigation and the
      frontmatter, so the page stays current (DF-11-005).
    verification: >-
      `uv run docs-site --check` (the `docs-site-sync` pre-commit hook, and
      `TestSiteSync::test_committed_site_artifacts_are_in_sync` in
      `test/metadata/docs/test_site_sync.py` in CI) regenerates the listing between the
      markers on `docs/lookup.md` from the nav and frontmatter
      (`vultron/metadata/docs/lookup_page.py`). It fails when the committed listing
      differs, when an omitted reference page cannot be placed, when an entry's page
      declares no `description:`, or when the home page or a start page does not link
      the lookup page. `test/metadata/docs/test_lookup_page.py` covers staleness on a
      new reference page and on a changed description, and a missing link.
    relationships:
    - rel_type: extends
      spec_id: DF-11-021
    tracking_issue: '#5150'
  - id: DF-11-022
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      The box (DF-11-015) of a thread member whose path names a section
      (`page.md#anchor`) MUST say the section, not the page, is on the thread.
    rationale: >-
      A reader who followed the thread to one section of a page must know that the
      thread goes through that section, not the whole page. Otherwise the reader
      reads parts of the page the thread does not need.
    verification: >-
      A test renders a section member's box and confirms the section wording, and
      that a whole-page member's box keeps the page wording. Covered by
      `test/metadata/docs/test_thread_boxes.py::TestSectionWording`.
    relationships:
    - rel_type: refines
      spec_id: DF-11-015
  - id: DF-11-043
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      The author of a page with a section member (DF-11-022) MUST place that member's
      box at the end of the section (DF-11-045).
    rationale: >-
      A box at the end of a long page is out of reach for a reader who followed the
      thread to one section of it. The end of the section is where that reader
      looks for directions onward. No build pass can find it reliably (DF-11-044),
      but the page's author knows where the section ends, and the built site, where
      the anchor is an id, can check it.
    verification: >-
      The DF-11-045 built-site check fails when a section member's box is not inside
      its section. Covered by `TestBuiltSiteCheck` in
      `test/metadata/docs/test_path_boxes.py`, in
      `test_a_section_box_outside_its_section_fails`,
      `test_a_section_box_before_its_heading_fails` and
      `test_a_section_box_whose_anchor_is_gone_fails`.
    relationships:
    - rel_type: refines
      spec_id: DF-11-015
  - id: DF-11-023
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      Each box (DF-11-015) MUST be a committed fragment under
      `docs/start/_paths/<thread>/`, generated from the thread's data and gated by a
      check mode. There is one fragment per thread and member, and the build excludes it
      as a page. A section member's anchor is part of its fragment's name.
    rationale: >-
      A committed fragment shows the box in a diff. The generator's check mode fails
      when the fragment differs from the thread, so a box that the author places by
      hand keeps the content of the thread. The message-vocabulary fragments use the
      same pattern (ADR-0128).
    verification: >-
      The generator's check mode fails when a committed fragment differs from what its
      thread implies, or when a fragment exists for a page no longer on its thread.
      A test confirms `docs/start/_paths/` is in `exclude_docs`. Covered by
      `test/metadata/docs/test_thread_boxes.py::TestFragments` (generation, check
      mode, stale-fragment deletion and `exclude_docs`).
    lint_suppress:
    - phantom_path_ref
  - id: DF-11-044
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      A box (DF-11-023) MUST reach a page only through an `include-markdown` directive
      that the page's author places, never through one the build adds.
    rationale: >-
      The author knows where on a page the directions to the next page belong. An
      automatic insert can only guess, and the only safe guess is the end of the page,
      which is wrong for a long page.
    verification: >-
      In `test/metadata/docs/test_thread_boxes.py`,
      `TestFragments::test_the_build_adds_no_box` confirms no build hook adds a box.
      In `test/metadata/docs/test_path_boxes.py`,
      `TestBuiltSiteCheck::test_a_box_with_no_include_directive_fails` covers a
      rendered box with no matching directive in its page's source, which is how a box
      added by the build shows.
    relationships:
    - rel_type: extends
      spec_id: DF-11-023
  - id: DF-11-045
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      A built-site check MUST fail when a member page or start page does not render its
      box for each of its threads. It also fails when a page renders a box made for
      another page, and when a section member's box (DF-11-022) is outside its section.
      A box is in its section when it is after the anchor's element and before the next
      heading of the same or higher level. Each failure names the page and the directive
      to add.
    rationale: >-
      A check over the built site finds a missing box however the page is assembled,
      and the placement does not need to be mechanical.
    verification: >-
      Unit tests over a fixture site cover each built-site check failure, asserting that
      the message names the page and the `include-markdown` line to add: a member page
      with no box, a start page with no box, a page on two threads with one box, a page
      that includes another page's fragment, and a section member's box outside its
      section. The check fails when it resolves no targets (DF-09-009). The check runs
      in CI beside the other built-site checks, not as a pre-commit hook, since it
      needs a full site build. Covered by `test/metadata/docs/test_path_boxes.py`
      (`TestBuiltSiteCheck`, one test per failure, and
      `test_the_check_runs_in_ci_beside_the_built_site_checks`).
    relationships:
    - rel_type: verifies
      spec_id: DF-11-015
    - rel_type: verifies
      spec_id: DF-11-043
  - id: DF-11-024
    priority: MUST
    kind: process
    adr:
      - ADR-0150
    statement: >-
      A page on a reading-path thread (DF-11-013) MUST NOT depend on a member that
      comes after it on that thread, where depending is as DF-11-002 defines it and a
      member comes after another when it is in a later stage, or later in the same
      chain; members of one set stage are unordered among themselves.
    rationale: >-
      A thread's order is a claim that a reader can follow it, and this makes the claim
      falsifiable in the same way DF-11-002 makes navigation order falsifiable: a reader
      who meets a concept before the page that introduces it either needs a link out
      or a different order. The level rule cannot see this, since a thread need not
      climb in level.
    verification: >-
      `docs-thread-order` reuses the `docs-level-order` term-dependency scan: for each
      thread member, and each include fragment it renders, the first unlinked prose use
      of a term that a later member declares in `introduces:` is a finding at
      `path:line:col`, where a link to the introducer before or at the use, or a use
      that is itself a glossary link, passes. Pre-existing findings go in a shrink-only
      baseline keyed by thread, page and term. The check fails when it resolves no
      threads (DF-09-009) and runs as a pre-commit hook and in CI; unit tests cover a
      violation, a linked use, and a glossary-link use.
    relationships:
    - rel_type: refines
      spec_id: DF-11-013
    - rel_type: extends
      spec_id: DF-11-002
- id: DF-12
  title: Protocol Specification normative text rendered from the requirement tiers
  description: >-
    The Protocol Specification presents the `protocol` and `foundation` requirement
    tiers of `specs/*.yaml` as rendered content, never as restated prose, so the
    specification cannot state a requirement differently from the YAML and presents
    every one of them; the normative banner marks exactly the normative set
    (ADR-0136, ADR-0147).
  specs:
  - id: DF-12-001
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      The Protocol Specification MUST contain a Requirements Catalog body section that
      renders every requirement of kind `protocol` or `foundation` exactly once. The
      section is placed after the Conformance section and before the back matter.
    rationale: >-
      The specification is the complete normative text only if every rule a
      conformant implementation must obey renders in it, and normative content
      belongs in the body rather than in an annex, which the specification declares
      informative.
    verification: >-
      A test loads the requirement registry and the catalog's placement table and
      fails when any `protocol` or `foundation` requirement renders in the catalog
      zero times or more than once; a test over the specification's navigation fails
      when the catalog section is not placed directly after the Conformance section
      and before the back matter. Not yet written; owned by #4895 (placement and
      rendering) and #4901 (section placement).
    tracking_issue: '#4895'
  - id: DF-12-008
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      A Requirements Catalog subsection (DF-12-001) MUST be one requirement file.
    rationale: >-
      A subsection that matches one requirement file gives each rule one predictable
      place in the catalog. A reader who knows the file a rule comes from can find the
      rule, and an author who adds a file knows where it renders.
    verification: >-
      A test loads the requirement registry and the catalog's placement table and fails
      when a catalog subsection holds requirements from more than one requirement
      file. Not yet written; owned by #4895.
    relationships:
    - rel_type: refines
      spec_id: DF-12-001
    tracking_issue: '#4895'
  - id: DF-12-009
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      The Requirements Catalog MUST render `foundation` requirements on a catalog page
      of their own.
    rationale: >-
      Keeping the inherited `foundation` rules apart keeps visible what Vultron adds and
      what it takes unchanged from the standards beneath it.
    verification: >-
      A test loads the requirement registry and the catalog's placement table and fails
      when a `foundation` requirement renders on a page other than the
      inherited-requirements page. Not yet written; owned by #4895.
    relationships:
    - rel_type: refines
      spec_id: DF-12-001
    tracking_issue: '#4895'
  - id: DF-12-002
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      A `protocol` or `foundation` requirement's anchor MUST be defined only by its
      Requirements Catalog row and that row's copy in the single-page edition
      (`full.md`). The single-page edition of the specification includes the catalog in
      document order.
    rationale: >-
      A requirement with two published anchors gives two answers to where it lives,
      and links written against either can disagree. One home also lets the
      retired per-kind pages for the two tiers redirect to a single place.
    verification: >-
      A test fails when a rendered page other than a catalog page or the single-page
      edition defines a requirement anchor. The test reads the rendered output,
      because anchors printed by an exec block are invisible to the strict build. Not
      yet written; owned by #4901.
    tracking_issue: '#4901'
  - id: DF-12-010
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      Every page that shows or links a `protocol` or `foundation` requirement without
      defining its anchor (DF-12-002) MUST link to its Requirements Catalog row. This
      includes the inline callouts of DF-12-003 and the requirement pages for the
      other kinds.
    rationale: >-
      A link to the one anchor that DF-12-002 defines keeps every reference to a
      requirement pointing at the same place, so no page can send a reader to a stale
      or second copy.
    verification: >-
      A test fails when a rendered requirement link on any page does not resolve to
      its catalog row. The test reads the rendered output, because links printed by an
      exec block are invisible to the strict build.
      In `test/metadata/docs/test_requirement_catalog.py`,
      `test_published_catalog_links_the_catalog_row` covers the link the renderer
      prints.
    relationships:
    - rel_type: depends_on
      spec_id: DF-12-002
    tracking_issue: '#4901'
  - id: DF-12-011
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      On the single-page edition of the specification, a requirement link (DF-12-010)
      MUST target the in-page copy of the catalog row.
    rationale: >-
      The single-page edition holds its own copy of the catalog. A link that left the
      page would take a reader of the one-page view away from the text they are
      reading.
    verification: >-
      A test fails when a rendered requirement link on the single-page edition does not
      resolve to the in-page copy.
      In `test/metadata/docs/test_requirement_catalog.py`,
      `test_full_page_links_the_in_page_catalog_copy` covers the link the renderer
      prints.
    relationships:
    - rel_type: refines
      spec_id: DF-12-010
    tracking_issue: '#4901'
  - id: DF-12-003
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      Outside the Requirements Catalog, the Protocol Specification MUST present a
      normative requirement only as a callout rendered by ID from its YAML entry. The
      callout uses the catalog's row format.
    rationale: >-
      A callout shows the YAML's own words, so the narrative cannot paraphrase a rule
      into something different.
    verification: >-
      A test renders a callout for a `protocol` ID and checks its text equals the
      YAML statement and links the catalog row. Not yet written; owned by #4895.
    tracking_issue: '#4895'
  - id: DF-12-012
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      The callout renderer (DF-12-003) MUST fail the documentation build when a
      callout ID names no requirement of kind `protocol` or `foundation`.
    rationale: >-
      Failing on a non-normative ID stops the specification from presenting a Project
      or Architecture rule as protocol.
    verification: >-
      A test renders a callout for a `project` ID and checks that it raises.
      In `test/metadata/docs/test_requirement_catalog.py`,
      `test_catalog_location_refuses_another_kind` covers the lookup the renderer
      uses. The rendering test is not yet written;
      owned by #4895.
    relationships:
    - rel_type: extends
      spec_id: DF-12-003
    tracking_issue: '#4895'
  - id: DF-12-004
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0147
    statement: >-
      A fragment of the Protocol Specification MUST NOT contain an RFC 2119 keyword
      outside a rendered requirement block. The exception is the §1.4 Document
      Conventions paragraph that states the keyword convention.
    rationale: >-
      Every hand-written normative sentence is a restatement that can drift from the
      YAML, and an unlabeled one may have no YAML counterpart at all. Banning the
      keywords in prose makes the YAML the only place a normative sentence can be
      written.
    verification: >-
      The DF-12-013 check runs in the test suite over the specification's fragments
      and fails on a keyword in prose, and passes on the same keyword inside a
      rendered block or the convention paragraph. Not yet written; owned by #4895
      (the check, over reconciled fragments) and #4902 (every fragment).
    tracking_issue: '#4895'
  - id: DF-12-013
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      A check MUST enforce DF-12-004 over the fragments of the Protocol Specification.
    rationale: >-
      A rule against keywords in prose that only reviewers apply lets a keyword slip
      through. A check finds each one on every change.
    verification: >-
      `test/metadata/docs/test_rfc2119_keywords.py` runs the check in the test suite
      over the specification's fragments:
      `test_reconciled_fragments_hold_no_keyword_in_prose` runs it over the reconciled
      fragments. Owned by #4895 (the check, over reconciled fragments) and #4902 (every
      fragment).
    relationships:
    - rel_type: verifies
      spec_id: DF-12-004
    tracking_issue: '#4895'
  - id: DF-12-014
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      The DF-12-013 check MUST report an empty target set as a failure.
    rationale: >-
      A keyword check that resolves no fragments and reports success gives a false
      clean signal, the fault DF-09-009 exists to stop.
    verification: >-
      `test/metadata/docs/test_rfc2119_keywords.py::test_empty_target_set_fails` fails
      the check when it resolves no fragments.
    relationships:
    - rel_type: refines
      spec_id: DF-09-009
    tracking_issue: '#4895'
  - id: DF-12-005
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      The placement of requirement files on Requirements Catalog pages MUST be
      declared once, on the documentation side, without a field in the requirement
      files.
    rationale: >-
      Declaring the placement where it is rendered keeps the requirement file format
      unchanged, and one declaration lets callouts and the other kinds' pages find
      the catalog page that holds a requirement.
    verification: >-
      Inspection confirms that `CATALOG_PAGES` in
      `vultron/metadata/docs/requirement_catalog.py` is the only declaration of where
      each requirement file renders, and that no requirement file carries a placement
      field.
    tracking_issue: '#4895'
  - id: DF-12-015
    priority: MUST
    kind: process
    adr:
      - ADR-0147
    statement: >-
      A check MUST fail when a requirement file that holds `protocol` or `foundation`
      requirements is placed on no catalog page (DF-12-005). It also fails when such a
      file is on more than one catalog page for the same tier.
    rationale: >-
      A new requirement file would otherwise be silently missing from the catalog, and
      a file placed twice would render its requirements twice.
    verification: >-
      A test fails when a requirement file holding either tier is absent from the
      placement table, or appears in it twice for one tier:
      `test_real_placement_table_is_sound` in
      `test/metadata/docs/test_requirement_catalog.py`.
    relationships:
    - rel_type: extends
      spec_id: DF-12-005
    tracking_issue: '#4895'
  - id: DF-12-006
    priority: MUST
    kind: process
    adr:
      - ADR-0136
      - ADR-0147
    statement: >-
      Every page of the normative set MUST include the shared normative banner
      (`docs/includes/normative.md`) in the page itself, not through a shared
      fragment. The normative set is the Protocol Specification's body section pages
      and the `protocol` and `foundation` requirement-tier pages. It excludes the
      specification's landing page, its single-page full view, its annexes and its
      open-questions page.
    rationale: >-
      A reader trusts the normative banner only if it is true. A check against one
      declared list of normative pages finds each missing banner.
    verification: >-
      A check over the `include-markdown` directives in `docs/` fails, naming
      `path:line`, when a declared page does not include the banner in the page itself,
      or when it resolves no targets: `docs-normative-banner`, run as a pre-commit
      hook and by `test/metadata/docs/test_normative_banner.py`.
  - id: DF-12-016
    priority: MUST_NOT
    kind: process
    adr:
      - ADR-0136
      - ADR-0147
    statement: >-
      A page outside the normative set (DF-12-006) MUST NOT include the shared
      normative banner, except the page that documents the banners.
    rationale: >-
      Banners that authors place by hand can stay on pages after those pages leave the
      normative set, so a page outside the set can call itself normative. A check
      against one declared list of normative pages finds each wrong banner.
    verification: >-
      `docs-normative-banner`, run as a pre-commit hook and by
      `test/metadata/docs/test_normative_banner.py::TestNormativeSet`, fails, naming
      `path:line`, when any other page or a shared fragment includes the banner.
    relationships:
    - rel_type: extends
      spec_id: DF-12-006
  - id: DF-12-017
    priority: MUST
    kind: process
    adr:
      - ADR-0136
      - ADR-0147
    statement: >-
      The normative-set pages (DF-12-006) MUST be declared once, in the check that
      enforces DF-12-006 and DF-12-016.
    rationale: >-
      One declared list is what lets the check find both a wrong banner and a missing
      one. A second list could drift from the first and let a page pass one check while
      it fails the other.
    verification: >-
      Inspection confirms that `NORMATIVE_PAGES` in
      `vultron/metadata/docs/normative_banner.py` is the only declaration of the
      normative set.
  - id: DF-12-018
    priority: MUST
    kind: process
    adr:
      - ADR-0136
      - ADR-0147
    statement: >-
      The normative banner check MUST fail when a declared normative-set page
      (DF-12-017) does not exist.
    rationale: >-
      A failure on a declared page that does not exist keeps the list current when
      pages move, for example when the Requirements Catalog replaces the per-tier pages.
    verification: >-
      In `test/metadata/docs/test_normative_banner.py`,
      `TestNormativeSet::test_missing_declared_page_fails` fails
      `docs-normative-banner` when a declared page is missing.
    relationships:
    - rel_type: depends_on
      spec_id: DF-12-017
  - id: DF-12-007
    priority: SHOULD
    kind: process
    adr:
      - ADR-0136
    statement: >-
      An informative page that explains the protocol's design SHOULD carry the shared
      "specification governs" banner, which states that the page is informative and
      that where it differs from the Protocol Specification the specification
      governs, instead of the not-normative banner, which says a page is not part of
      the protocol.
    rationale: >-
      Pages such as Formal Protocol and the RM, EM and CS process models still
      explain how the protocol is defined, but they predate the specification and
      may lag it. Neither the normative banner nor the not-normative banner is true
      of them; a precedence statement keeps their standing and names the tiebreaker.
    verification: >-
      `docs-normative-banner`, run as a pre-commit hook and by
      `test/metadata/docs/test_normative_banner.py`, declares the informative
      protocol-design pages in `SPECIFICATION_GOVERNS_PAGES`, because
      `subject: protocol` (DF-11-025) does not single them out from the
      protocol-floor companions, and fails, naming `path:line`, when a declared
      page is missing, does not include the banner in the page itself, declares a
      `subject` other than `protocol` or also includes the not-normative banner;
      when any other page or a shared fragment includes the banner; when a page is
      listed twice, or in both this set and the normative set; or when the declared
      set is empty. The test also checks that the banner states the
      precedence without an RFC 2119 keyword.
