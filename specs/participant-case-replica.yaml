id: PCR
title: Participant Case Replica
description: >-
  Requirements for how each Vultron Actor maintains and manages its local copy (replica) of
  a VulnerabilityCase. Covers replica identity, bootstrap, update authority, case-context
  message routing, reporter case discovery, and unknown-context handling.
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: PCR-01
  title: Replica Identity (No Stub CASE_MANAGER)
  specs:
  - id: PCR-01-001
    priority: MUST
    kind: protocol
    statement: >-
      Each Vultron Actor MUST maintain its local case replica as an internal concern — there
      is exactly one externally-addressable Actor identity per participant, regardless of
      how many cases that Actor is involved in.
    rationale: >-
      Other actors address an Actor, and decide whether to trust it, by its one id. A
      separate identity for each case would need its own discovery and its own trust
      anchor for every case, and a message sent to the Actor's main id would not reach
      the case. Keeping each replica inside the Actor gives every case the same inbox
      and the same identity.
    verification: >-
      Inspection of `vultron/core/models/actor.py` confirms that case replicas
      are maintained as an internal data structure of each Actor, with no
      separate externally-addressable actor created per case.
    relationships:
    - rel_type: refines
      spec_id: CM-01-001
    - rel_type: refines
      spec_id: AKM-01-002
    stories:
    - story_2022_092
  - id: PCR-01-002
    priority: MUST
    kind: protocol
    statement: >-
      There is exactly one CASE_MANAGER per case, acting on the Case Owner's behalf.
    rationale: >-
      The CASE_MANAGER is the single writer of the case ledger. Two CASE_MANAGERs
      could each commit a different entry at the same index, and the replicas would
      then disagree with no rule to pick one. A participant also needs exactly one
      sender whose case updates it accepts (PCR-03-001).
    verification: >-
      `test_exactly_one_participant_holds_case_manager` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` confirms that the
      case a proposal creates has exactly one participant holding `CASE_MANAGER`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
    stories:
    - story_2022_046
  - id: PCR-01-003
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      Actor co-location is an implementation choice the protocol MUST remain indifferent to.
      Whether every Actor runs on one host or on many, Actors MUST exchange information only
      through protocol messages. An Actor MUST NOT read, write, or otherwise reach into another
      Actor's store, and MUST NOT rely on out-of-band communication with a co-located Actor.
      In particular, an Actor that has asked a CASE_MANAGER to create a case MUST treat the case as
      absent from its own knowledge until the CASE_MANAGER's `Create(VulnerabilityCase)` replica has
      been delivered to it, and MUST NOT assume co-location makes the case visible sooner.
    rationale: >-
      Co-location is a deployment choice. Code that reads another Actor's store, or
      waits for a side channel, works only while two Actors share a host. Per-actor
      stores (ADR-0073) prevent direct reads and writes, but not code that expects the
      case to be visible early. The report receiver does not create the case
      (ADR-0041), so it holds the case only after the CASE_MANAGER's
      `Create(VulnerabilityCase)` arrives. A tree that acts on the case sooner has
      nothing to act on.
    relationships:
    - rel_type: refines
      spec_id: CM-01-001
    - rel_type: refines
      spec_id: AKM-01-002
    - rel_type: implements
      spec_id: DL-07-001
    adr:
    - ADR-0073
    stories:
    - story_2022_088
- id: PCR-02
  title: Replica Bootstrap
  specs:
  - id: PCR-02-001
    priority: MUST
    kind: protocol
    statement: >-
      `Announce(VulnerabilityCase)` is the unified mechanism for delivering a full case snapshot
      to a participant, at every lifecycle stage.
    rationale: >-
      A participant that gets every full case copy in one activity type applies each
      copy through one path, with one sender check (PCR-03-001) and one
      ledger-position check (SYNC-16-006). Two delivery types would need two sets of
      checks, and a gap in either set would let a copy in that the other set refuses.
    verification: >-
      `test_late_joiner_receives_case_replica` in `test/demo/test_pcr_late_joiner.py`
      confirms that a participant that joins later gets its case copy in
      `Announce(VulnerabilityCase)`. The strict `xfail`
      `test_the_creation_copy_is_not_delivered_in_the_create` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` records that at
      case creation the copy travels in the bootstrap `Create(VulnerabilityCase)`
      instead (CBT-01-002).
    relationships:
    - rel_type: implements
      spec_id: AKM-03-001
    - rel_type: implements
      spec_id: SYNC-02-001
    stories:
    - story_2022_088
    - story_2022_045
  - id: PCR-02-002
    priority: MUST
    kind: protocol
    statement: >-
      When a participant becomes active (CM-10-004) — at case creation, or on accepting
      the stub Invite (CM-11-008) — the CASE_MANAGER MUST send
      `Announce(VulnerabilityCase)` to that participant to deliver its initial case
      copy. It MUST NOT send one to an inert participant.
    rationale: >-
      A participant cannot act on a case it does not hold, and only the CASE_MANAGER
      holds the canonical copy. Sending the copy when the participant becomes active
      gives it the case at the moment it is entitled to it. An inert participant is
      not entitled to case content (CM-10-004), so it gets no copy.
    verification: >-
      `test_late_joiner_receives_case_replica` in `test/demo/test_pcr_late_joiner.py`
      confirms that a participant that accepts the stub Invite gets
      `Announce(VulnerabilityCase)` from the CASE_MANAGER. The strict `xfail`
      `test_the_creation_copy_is_not_delivered_in_the_create` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` records that at
      case creation the copy travels in the bootstrap `Create(VulnerabilityCase)`
      instead (CBT-01-002). No test yet checks that an inert participant gets no
      `Announce(VulnerabilityCase)` (#5377).
    relationships:
    - rel_type: implements
      spec_id: CM-06-001
    adr:
    - ADR-0114
    stories:
    - story_2022_092
  - id: PCR-02-003
    priority: MUST
    kind: protocol
    statement: >-
      When a participant actor receives `Announce(VulnerabilityCase)` and has no existing
      local copy for that case ID, it MUST create a local replica from the received case object.
    rationale: >-
      The first case copy a participant receives is its only source for the case. If
      the participant did not store it, every later ledger entry for the case would
      name a case the participant does not hold.
    verification: >-
      A unit test confirms that receiving `Announce(VulnerabilityCase)` when no
      prior local replica exists causes the participant actor to create and
      persist a new case replica in its DataLayer.
    stories:
    - story_2022_088
    - story_2022_045
  - id: PCR-02-004
    priority: MUST
    kind: protocol
    statement: >-
      When a participant actor receives `Announce(VulnerabilityCase)` and already has a local
      replica for that case ID, it MUST apply the received case state as an authoritative
      update, subject to PCR-03-001 and to the ledger-tail comparison of SYNC-16-006.
    rationale: >-
      An update is safe only when the copy names the ledger position it reflects, because
      an old copy can arrive late over an unordered transport (ADR-0142).
    verification: >-
      `test/core/behaviors/sync/test_divergence_recovery.py` confirms that an
      `Announce(VulnerabilityCase)` from the CASE_MANAGER replaces an existing replica's
      case file.
    adr:
    - ADR-0142
    stories:
    - story_2022_088
    - story_2022_045
  - id: PCR-02-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      `Create(VulnerabilityCase)` retains its semantic meaning ("a case was created") but
      MUST NOT be used as the mechanism for delivering a full case snapshot to participants.
    rationale: >-
      `Create(VulnerabilityCase)` says that a case exists. If it also delivered full
      copies, a receiver would have two kinds of copy to apply, and each would need
      the sender check (PCR-03-001) and the ledger-position check (SYNC-16-006). One
      delivery type for copies (PCR-02-001) keeps those checks in one place.
    verification: >-
      `test_the_creation_copy_is_not_delivered_in_the_create` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts that the
      creation `Create(VulnerabilityCase)` does not carry the case inline. It is a
      strict `xfail`: the bootstrap `Create` carries the full case (CBT-01-002).
- id: PCR-03
  title: Replica Update Authority
  specs:
  - id: PCR-03-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant actor's local case replica MUST only accept case-state updates that originate
      from the CASE_MANAGER for that case.
    rationale: >-
      The CASE_MANAGER is the single writer of the case. A replica that accepted a
      case-state update from any other sender would let that sender change the
      participant's view of the case without the CASE_MANAGER's checks and without a
      ledger entry, and the replicas would then disagree.
    verification: >-
      A unit test confirms that `Announce(VulnerabilityCase)` sent by any
      actor other than the designated CASE_MANAGER is rejected and a WARNING is
      logged.
    relationships:
    - rel_type: implements
      spec_id: CM-06-002
    stories:
    - story_2022_088
    - story_2022_089
  - id: PCR-03-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: The case owner actor MUST NOT write directly to its own local case copy.
    rationale: >-
      When the Case Owner is not the CASE_MANAGER, its copy of the case is a replica
      like every other, and it changes only after the CASE_MANAGER has checked the
      change and recorded it in the ledger. A direct write skips both steps, so the
      other replicas never learn of the change and the owner's copy then disagrees with
      the canonical case.
    relationships:
    - rel_type: refines
      spec_id: CM-02-010
  - id: PCR-03-003
    priority: MUST
    kind: protocol
    statement: >-
      A participant actor MUST authenticate `Announce(VulnerabilityCase)` activities before
      accepting them as authoritative updates to its local replica.
    rationale: >-
      The sender check of PCR-03-001 compares the activity's `actor` id, and a sender
      writes that id itself. Without authentication, any sender can write the
      CASE_MANAGER's id there and have its copy applied. Actor signatures are not yet
      available, so this rule applies to production only.
    verification: >-
      Inspection of `vultron/core/` confirms that the replica update handler
      verifies the sender's identity against the registered CASE_MANAGER ID
      before applying any case-state update.
    scope:
    - production
    stories:
    - story_2022_089
    - story_2022_090
  - id: PCR-03-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant actor MUST NOT create a local case replica from an
      `Announce(VulnerabilityCase)` message unless prior trust for that case has been
      established: either (a) the actor has already processed a
      `Create(VulnerabilityCase)` from the report receiver that introduced the
      CASE_MANAGER identity, or (b) the actor has completed an `InviteActorToCase`
      exchange (the Invite and its `Accept`) that records a pending-expectation for that
      case. Accepting any `Announce(VulnerabilityCase)` from an unauthenticated or
      unexpected sender as a bootstrap signal is not permitted. For path (b), the
      pending-expectation record MUST be created only when the Invite's `object` is the
      receiving actor; the record MUST bind to the Invite's `actor` id (the named
      CASE_MANAGER), not to the transport-level delivering sender; and a later Invite
      for the same case naming a different CASE_MANAGER MUST replace the anchor while
      the receiver has not accepted the Invite that set it, and MUST be refused, leaving
      the anchor unchanged, once the receiver has accepted that Invite. Whether the
      named CASE_MANAGER is genuine cannot be verified without actor identity and
      signatures (#2841); this requirement records the structural rules that apply
      before that verification is available.
    rationale: >-
      An `Announce(VulnerabilityCase)` roster is supplied by the sender; a fabricated case
      naming the sender as its own CASE_MANAGER passes a roster-only check. Permitting a
      first-contact Announce when no locally derived record exists lets an attacker pre-seed
      a fake replica, blocking the real CASE_MANAGER on the seeded path (PCR-03-001 fails
      closed). No legitimate protocol sequence delivers an unsolicited first-contact Announce
      without a preceding `Create(VulnerabilityCase)` or `InviteActorToCase`.
      The path (b) sub-rules prevent a misaddressed Invite from anchoring trust on behalf of
      a different actor and prevent a second Invite from replacing the anchor the receiver
      has accepted. Until the receiver accepts, a later Invite replaces the anchor, so a
      forged stub Invite cannot lock out the real CASE_MANAGER's Invite until the bootstrap;
      a forged Invite the receiver accepts first still wins, a residual risk accepted until
      signatures (#2841).
    verification: >-
      A unit test confirms that `Announce(VulnerabilityCase)` from an actor with no prior
      local trust record — no matching `VultronReportCaseLink` and no invite trust anchor for
      the announced case — is rejected with a WARNING log entry and the case is NOT seeded in
      the receiver's DataLayer (PCR-07-010).  A separate unit test confirms that once the
      receiver has processed an `InviteActorToCase` from the CASE_MANAGER, a subsequent
      `Announce(VulnerabilityCase)` from that same actor IS admitted (CBT-05-004).
      Unit tests for `RecordInviteTrustAnchorNode` confirm: (path b, rule 1) a node whose
      `invitee_id` differs from the receiving actor returns FAILURE and writes no record;
      (path b, rule 2) the anchor records the Invite's `actor` id, not the transport sender;
      (path b, rule 3) after `FixInviteTrustAnchorNode` records the receiver's Accept, a
      second invocation naming a different CaseActor returns FAILURE at WARNING level and
      leaves the original anchor unchanged, while before it the second invocation replaces
      the anchor and logs both CaseActor ids at INFO.
    relationships:
    - rel_type: refines
      spec_id: PCR-03-001
    - rel_type: refines
      spec_id: PCR-02-003
  - id: PCR-03-005
    priority: MUST
    kind: protocol
    statement: The case owner actor MUST follow the same replica rules as all other participants.
    rationale: >-
      Exempting the case owner from replica rules would create an inconsistent
      update path that bypasses the CASE_MANAGER consistency checks.
    verification: >-
      Integration tests in `test/demo/test_pcr_bootstrap.py` confirm that
      the case owner receives and applies `Announce(VulnerabilityCase)` through
      the same code path as all non-owner participants.
    relationships:
    - rel_type: refines
      spec_id: PCR-03-002
    stories:
    - story_2022_045
    - story_2022_106
  - id: PCR-03-006
    priority: MUST
    kind: protocol
    statement: The case owner actor MUST route all case-state changes through the CASE_MANAGER.
    rationale: >-
      Routing through the CASE_MANAGER ensures all case-state mutations go through the
      single-writer authority and are recorded in the case ledger.
    verification: >-
      Integration tests in `test/demo/test_pcr_bootstrap.py` confirm that
      the case owner's outbound case-state activities are addressed to the
      CASE_MANAGER, not applied directly to its own replica.
    relationships:
    - rel_type: refines
      spec_id: PCR-03-002
    stories:
    - story_2022_045
    - story_2022_088
- id: PCR-04
  title: Case Context Routing
  specs:
  - id: PCR-04-001
    priority: MUST
    kind: protocol
    statement: >-
      The `context` field of an ActivityStreams activity is the canonical mechanism by
      which a participant actor identifies the local case replica a case-scoped message
      belongs to.
    rationale: >-
      An Actor holds replicas of many cases behind one inbox (PCR-01-001), so each
      case-scoped activity must say which case it is about. One standard field for that
      lets every receiver find the replica the same way.
    verification: >-
      Inspection of `vultron/core/models/activity.py` confirms the `context`
      field is present on case-scoped activities, and a unit test confirms the
      dispatcher uses this field to route activities to the correct case
      handler.
    relationships:
    - rel_type: implements
      spec_id: CM-01-002
    stories:
    - story_2022_088
  - id: PCR-04-002
    priority: MUST
    kind: protocol
    statement: >-
      All case-scoped protocol activities sent by the CASE_MANAGER to participants MUST carry
      `context` set to the case ID.
    rationale: >-
      A participant finds the replica an activity belongs to from its `context`
      (PCR-04-001). An activity from the CASE_MANAGER with no case `context` also skips
      the hold for unknown cases (PCR-06-002), so the participant can process it before
      it holds the case.
    verification: >-
      A unit test confirms that `Announce(CaseLedgerEntry)` and
      `Announce(VulnerabilityCase)` emitted by the CASE_MANAGER each carry
      `context` equal to the case's ID.
    stories:
    - story_2022_092
  - id: PCR-04-003
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The participant actor MUST be the only externally-addressable entity for receiving case-scoped
      messages on behalf of all cases it participates in; there MUST NOT be a separate per-case
      inbox.
    rationale: >-
      Other actors reach a participant at its one Actor identity (PCR-01-001). A
      separate inbox for each case would be a second address that senders must
      discover and trust for every case, and a message sent to the wrong address would
      not reach the replica.
- id: PCR-05
  title: Reporter Case Discovery
  specs:
  - id: PCR-05-001
    priority: MUST
    kind: protocol
    statement: >-
      Each actor MUST keep, for each report it has submitted, a link from the report's
      id to the id of the case created for it.
    rationale: >-
      A reporter learns about the case for its report only from the activities it
      receives later. The link from the report to the case lets it find the case for
      the report it submitted, and it lets the reporter check that a case it receives
      is the case for that report (CBT-01-005).
    verification: >-
      Inspection of `vultron/core/models/report_case_link.py` confirms that
      `ReportCaseLink` persists the report-to-case mapping in the DataLayer,
      and a unit test confirms the mapping is queryable by report ID.
    stories:
    - story_2022_030
    - story_2022_031
  - id: PCR-05-002
    priority: MUST
    kind: protocol
    statement: >-
      When a participant actor receives `Announce(VulnerabilityCase)` and the case references
      a report whose report-to-case link is not yet bound to a case, the actor MUST bind
      that link to the local case replica; a link already bound to another case MUST
      stay bound to that case.
    rationale: >-
      The report-to-case link is how a reporter finds the case for its report
      (PCR-05-001). If a received case copy did not update the link, the reporter
      would hold the case but could not find it from the report. A bound link also
      records the CASE_MANAGER trusted for its case (CBT-01-006). Moving it to a second
      case holding the same report would take that trust from the first case and give
      the second case a CASE_MANAGER it never had (CBT-02-003).
    verification: >-
      `test_updates_report_case_link_when_case_contains_report` in
      `test/core/use_cases/received/actor/test_announce.py` confirms that an admitted
      `Announce(VulnerabilityCase)` naming a report sets the case on that report's
      `VultronReportCaseLink`. `TestLinkReportCaseLinksBindsOnlyPendingLinks` in
      `test/core/services/test_case_replica_seeding.py` confirms that a link bound to
      another case keeps its case and CASE_MANAGER when a second case holding the
      report is seeded.
    stories:
    - story_2022_030
    - story_2022_088
- id: PCR-06
  title: Unknown Case Context Handling
  specs:
  - id: PCR-06-001
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      When a participant actor receives an activity whose `context` field does not match any
      known local case replica, the actor MUST NOT silently discard the activity.
    rationale: >-
      Activities can arrive before the case they name, because the transport does not
      keep order (ADR-0161). The receiver has already taken delivery, so the sender
      has no reason to send the activity again, and a discarded activity is lost.
      Keeping it, or reporting the drop, keeps the participant from losing a case
      change without a record.
  - id: PCR-06-002
    priority: SHOULD
    kind: protocol
    statement: >-
      When an activity with an unknown case context arrives, the actor SHOULD queue the activity
      briefly and request a case snapshot from the CASE_MANAGER.
    rationale: >-
      An activity for an unknown case usually arrives before the case copy that would
      let the participant apply it. Holding it for a short time gives that copy time
      to arrive. Asking the CASE_MANAGER for a copy covers the case where the copy was
      lost.
  - id: PCR-06-003
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      Activities with unknown case context MUST NOT update any local state until a valid case
      replica has been established.
    rationale: >-
      Until a replica exists, the participant has nothing to check an activity
      against: not the case, not its CASE_MANAGER, not its roster. A write made then
      could seed case state from an untrusted sender, which PCR-03-004 forbids for the
      case itself.
    note: >-
      The stub Invite is the one exception: it precedes its case by design, and PCR-06-005
      bounds what it may write.
    relationships:
    - rel_type: depends_on
      spec_id: PCR-06-005
  - id: PCR-06-005
    priority: MUST
    kind: protocol
    statement: >-
      A stub Invite (CM-11-013) MUST be processed on arrival, not queued under PCR-06-002,
      even though its receiver holds no replica of the case it names. Processing it MUST
      write nothing but the intake archive of the Invite (CLP-10-017) and the trust anchor
      of PCR-03-004 path (b). Every other activity naming a case the receiver does not hold
      is still queued.
    rationale: >-
      An invitee decides whether to join a case before the case is delivered to it
      (MV-10-005), and the case arrives only after it accepts. An Invite held until
      the case arrives would wait for the `Announce` that only its own Accept can
      bring, so the invitee could never answer it, except from a copy stored under the
      sender's id, which DL-06-006 forbids. The Invite writes only its intake archive
      and its trust anchor, so it sets no case state before the replica exists
      (PCR-06-003).
    relationships:
    - rel_type: refines
      spec_id: PCR-06-002
    - rel_type: depends_on
      spec_id: PCR-03-004
    adr:
    - ADR-0114
    verification: >-
      `test/core/behaviors/inbox/nodes/test_defer_check_node.py` asserts the deferral gate
      passes a stub Invite for an unknown case and still defers a full-case Invite, an
      Accept of the stub Invite and a ledger-entry Announce.
      `test/adapters/driving/fastapi/test_stub_invite_on_arrival.py` delivers the
      CASE_MANAGER's sealed stub Invite through the real inbox to an invitee holding no
      case and asserts it is processed, archived as a `ReceivedActivityRecord`, anchored,
      that the archive and the anchor are its only writes, and that it is answerable with
      no sender-keyed copy present.
    stories:
    - story_2022_088
    - story_2022_023
  - id: PCR-06-004
    priority: MUST
    kind: project
    statement: >-
      The pending-activity queue for unknown case contexts MUST be actor-scoped: deferred
      activities for a given case ID MUST be keyed by both the receiving actor's ID and the
      case ID, so that replaying deferred activities after replica seeding is isolated to the
      correct actor's DataLayer and cannot affect a different co-located actor's case state.
    rationale: >-
      Two Actors can run on one host. If they shared one queue for unknown cases, the
      replay after one Actor's replica is seeded could apply an activity to the other
      Actor's case state, which PCR-01-003 forbids. A queue held for each Actor keeps
      each replay inside the Actor that received the activity.
    verification: >-
      Inspection of `vultron/core/models/pending_case_inbox.py` confirms that
      deferred activities are keyed by case ID in the receiving actor's own
      DataLayer, which ADR-0073 keeps apart from every other actor's.
    relationships:
    - rel_type: refines
      spec_id: PCR-06-002
- id: PCR-08
  title: Outbound Participant Message Routing
  specs:
  - id: PCR-08-001
    priority: MUST
    kind: protocol
    statement: >-
      After a case is created and the CASE_MANAGER is introduced, a participant actor MUST address
      all case-scoped outbound messages (notes, status updates, embargo proposals, RM transitions,
      and any other protocol messages targeting the case) exclusively to the CASE_MANAGER for that
      case. A participant actor MUST NOT send these messages directly to other participants.
      The one exception is RK, `Read(Offer(VulnerabilityReport))`: it answers the
      reporter's original Offer, outside the case, so an addressee of that Offer sends it to
      the reporter directly and never to the CASE_MANAGER (RMB-08-003).
    rationale: >-
      A participant sends each case-scoped message to the CASE_MANAGER, so that the
      CASE_MANAGER can check the sender, record the change in the case ledger and send
      it on to the other participants (PCR-08-003). A message sent straight to a peer
      gets none of these steps, so the peer's replica and the canonical case disagree.
      RK is not a case message: it answers the reporter's Offer, which the reporter
      sent to that receiver before the case existed, so the answer goes back to the
      reporter (RMB-08-003).
    verification: >-
      Integration tests in `test/demo/test_pcr_engage_case.py` confirm that
      every outbound participant activity carries `to` set solely to the
      CASE_MANAGER's ID, with no direct peer-to-peer addressing. Tests marked
      `PCR-08-001` in `test/core/use_cases/triggers/test_ack_report.py` confirm that
      the RK exception reaches the reporter alone once a case exists.
    stories:
    - story_2022_045
    - story_2022_088
  - id: PCR-08-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A participant actor MUST NOT assume that other participants will receive its case-scoped
      messages through any channel other than the CASE_MANAGER's `Announce(CaseLedgerEntry)` broadcast.
      Sending to the whole roster or any multi-recipient list that includes non-CASE_MANAGER actors
      is a violation of this rule.
    rationale: >-
      Only the CASE_MANAGER's `Announce(CaseLedgerEntry)` tells a participant what the
      case ledger holds. A participant that sends its message to other participants as
      well gives them a change that the CASE_MANAGER has not yet checked or recorded,
      and they may act on a change that the CASE_MANAGER later refuses.
  - id: PCR-08-003
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST, for every participant message it receives and accepts,
      commit a `CaseLedgerEntry` recording the outcome and broadcast
      `Announce(CaseLedgerEntry)` to the case's active participants (CM-10-004) as the
      standard cascade. This cascade is the only mechanism by which participants learn
      of accepted case-state changes.
    rationale: >-
      Participants learn of case changes only from the ledger. If the CASE_MANAGER
      applied a change without an entry, or recorded an entry without sending it, the
      other replicas would never learn of the change and would disagree with the
      canonical case.
    verification: >-
      `test_add_note_commits_log_entry_when_sync_port_provided` in
      `test/core/use_cases/received/test_note.py` asserts that the CASE_MANAGER's
      processing of an `Add(Note)` commits exactly one `CaseLedgerEntry` and queues
      its `Announce(CaseLedgerEntry)` to exactly the two participants.
      `test_ledger_fanout_reaches_only_active_participants` in
      `test/core/behaviors/sync/nodes/test_active_participant_fanout.py` asserts that
      the announcement reaches only the active participants (CM-10-004).
    stories:
    - story_2022_045
    - story_2022_088
  - id: PCR-08-004
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms the demo scripts and external trigger endpoints expose no
      operation that commits a `CaseLedgerEntry` or starts its broadcast directly; the
      cascade starts only from the CASE_MANAGER's received-side processing.
    statement: >-
      The `CaseLedgerEntry + broadcast` cascade MUST NOT be manually triggered by demo
      scripts or external clients.
    rationale: >-
      The ledger records what the CASE_MANAGER processed. An entry that a script or
      client creates directly records no processed activity, skips the CASE_MANAGER's
      checks, and lets a demo pass when the protocol path it shows does not work.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-003
  - id: PCR-08-013
    priority: MUST
    kind: protocol
    statement: >-
      The `CaseLedgerEntry` commit and `Announce(CaseLedgerEntry)` broadcast
      (PCR-08-003) MUST follow automatically from the CASE_MANAGER processing any
      accepted participant message, without any further request or operator action.
    rationale: >-
      If the commit and the broadcast needed a separate request, a CASE_MANAGER that
      did not get the request would apply a change that no replica learns about.
      Making them part of processing the message means every processed change reaches
      the ledger and the participants.
    verification: >-
      `test/core/use_cases/received/test_note.py::TestNoteUseCases::test_add_note_commits_log_entry_when_sync_port_provided`
      confirms the CASE_MANAGER commits the entry as part of processing a received
      `Add(Note)`, with no further request.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-003
    adr:
    - ADR-0021
    stories:
    - story_2022_045
    - story_2022_088
  - id: PCR-08-005
    priority: MUST
    kind: protocol
    statement: >-
      A participant sending a case-scoped message MUST take its recipient from its
      replica of the case: the participant holding the `CASE_MANAGER` role, as the
      message's sole `to:` recipient. The case's full participant list MUST NOT serve as
      the recipients of such a message.
    rationale: >-
      The case's full participant list includes actors that are not entitled to every
      message (CM-10-004), and it reaches peers that the CASE_MANAGER has not yet
      checked the message for. Taking the CASE_MANAGER from the participant's own
      replica gives one recipient that the participant already trusts.
    verification: >-
      `test/core/use_cases/triggers/case/test_add_object.py::TestSvcAddObjectToCaseUseCase::test_add_object_to_case_addresses_case_manager_alone`
      and
      `test/core/use_cases/triggers/case/test_add_report.py::TestSvcAddReportToCaseUseCase::test_add_report_to_case_addresses_case_manager_alone`
      assert the queued activity's sole `to:` recipient is the CASE_MANAGER.
    stories:
    - story_2022_046
    - story_2022_039
  - id: PCR-08-006
    priority: MUST
    kind: project
    statement: >-
      Unit and integration tests MUST verify that a participant's outbound activity is addressed
      only to the CASE_MANAGER, and that no direct peer-to-peer delivery is attempted.
    rationale: >-
      Routing every message through the CASE_MANAGER (PCR-08-001) fails without an
      error when a sender adds one more recipient: the message still arrives, but at a
      peer as well. Only a test that checks the recipient list finds that.
    verification: >-
      Integration tests in `test/demo/test_pcr_engage_case.py` assert that
      every outbound participant activity has exactly one entry in `to` and
      that recipient is the CASE_MANAGER's ID.
  - id: PCR-08-007
    priority: MUST
    kind: protocol
    statement: >-
      An `Invite` that invites an actor to a case (`InviteActorToCase`) MUST be sent
      with `actor` set to the CASE_MANAGER's ID, not the case owner's ID. The case owner
      triggers the invite action, but the CASE_MANAGER MUST be the ActivityStreams actor
      performing the send. Optionally, `attributedTo` on the activity MAY carry the case
      owner's ID to record who initiated the invitation.
    rationale: >-
      A receiver records the Invite's `actor` as its trust anchor (PCR-03-004), and it
      later accepts the case copy only from that actor. If the Case Owner were the
      `actor`, the invitee would anchor its trust on the wrong actor and answer the
      wrong actor. `attributedTo` keeps a record of who asked for the Invite.
    verification: >-
      `test/demo/test_remote_case_actor_invite.py::TestOwnerInviteThroughARemoteCaseActor`
      confirms the case owner's trigger sends its own request and the CASE_MANAGER, on
      another container, is the `actor` of the `Invite`, not the case owner.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-001
    stories:
    - story_2022_053
    - story_2022_052
  - id: PCR-08-008
    priority: MUST
    kind: protocol
    statement: >-
      The invitee's `Accept` of that Invite (PCR-08-007) MUST be addressed to the
      CASE_MANAGER (not the case owner). The CASE_MANAGER is the authoritative recipient
      and processor of all case-management handshake messages after case creation.
    rationale: >-
      Only the CASE_MANAGER records the invitee's join in the case and in the ledger.
      When the Case Owner is not the CASE_MANAGER, an Accept addressed to the Case Owner
      reaches an actor that cannot record the join, so the join is never recorded.
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py::TestSvcAcceptCaseInviteUseCase::test_accept_addresses_case_manager_not_case_owner`
      confirms that, for a case another actor owns, the invitee's `Accept` is
      addressed `to` the `Invite`'s actor, the CASE_MANAGER, alone, and not to
      the case owner.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-001
    stories:
    - story_2022_054
    - story_2022_052
  - id: PCR-08-009
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST process an invitee's replies and record their effect on its
      own copy of the case: a reply to the stub Invite as CM-11-001 and CM-11-007
      require, and a reply to the full-case Invite as CM-11-011 requires.
    rationale: >-
      The invitee's replies are the only source of its join and its judgment of the
      case. If the CASE_MANAGER did not record them, the case would show the invitee
      as not joined, and the invitee would get no case content.
    verification: >-
      `test/demo/test_invite_actor_demo.py::test_demo` runs the invite demo, whose
      checks confirm that after the invitee's reply the CASE_MANAGER's store records the
      invitee's RM state as CM-11-011 states and lists the invitee as a case
      participant.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-001
    - rel_type: refines
      spec_id: PCR-08-003
    adr:
    - ADR-0114
    - ADR-0121
    stories:
    - story_2022_054
    - story_2022_088
  - id: PCR-08-014
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The case owner MUST NOT author or emit any RM state-change activity on behalf of
      the invitee.
    rationale: >-
      RM state belongs to each participant, and it is the participant's own judgment
      (ADR-0121). Outside the bootstrap record of CBT-01-008, only that participant
      declares it. An RM change that the Case Owner emits for the invitee records a
      decision the invitee never made, and the case then shows the invitee engaged when
      it is not.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-010
  - id: PCR-08-010
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection of the received-side use cases and the factories they call confirms
      each emitted activity's `actor` is the executing actor's own ID.
    statement: >-
      An actor processing a received activity MUST NOT construct or emit an activity whose
      `actor` is a different actor's ID (identity spoofing).
    rationale: >-
      Receivers trust the `actor` field to name the actor that made the decision, and
      the sender checks depend on that. An activity that names another actor forges
      that actor's decision, and every receiver applies it as if that actor had sent
      it.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-001
  - id: PCR-08-015
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection of received-side use cases confirms each behavior tree runs with
      `actor_id` set to the actor whose DataLayer is active for that invocation.
    statement: >-
      A received-side use case MUST NOT execute a Behavior Tree with `actor_id` set to
      any actor other than the one whose DataLayer is active for that use case invocation.
    rationale: >-
      A store belongs to one actor (ADR-0073). A tree that runs as a different actor
      writes records into this store under that actor's identity, and it emits
      activities that claim to come from an actor that did not send them (PCR-08-010).
    relationships:
    - rel_type: refines
      spec_id: PCR-08-010
    adr:
    - ADR-0021
    - ADR-0073
  - id: PCR-08-011
    priority: MUST
    kind: project
    statement: >-
      An emit node in a case-scoped trigger BT MUST resolve the CASE_MANAGER
      recipient before enqueueing the activity.
    rationale: >-
      An emit node that queues an activity with no recipient leaves the outbox to fail
      later, with `VultronOutboxToFieldMissingError`, far from the cause. Resolving
      the CASE_MANAGER first makes the failure happen, and name its cause, at the node
      that builds the message.
    verification: >-
      Inspection of `vultron/core/behaviors/` confirms that case-scoped emit
      nodes invoke a CASE_MANAGER-resolution step before setting `to`, and a
      unit test confirms the node returns FAILURE when no CASE_MANAGER can be
      resolved.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-001
      note: Participant outbound activities route through the CASE_MANAGER only;
        failure to resolve the CASE_MANAGER is a trigger-side error
    - rel_type: refines
      spec_id: PCR-08-002
      note: Using a roster-wide list or None as the recipient in a trigger BT is
        the specific violation this requirement prevents
    stories:
    - story_2022_039
  - id: PCR-08-016
    priority: MUST
    kind: project
    statement: >-
      An emit node in a case-scoped trigger BT MUST fail fast (return FAILURE or raise
      immediately) when no routable CASE_MANAGER can be found.
    rationale: >-
      A case-scoped message with no CASE_MANAGER to send it to reaches no one. Failing
      at once tells the caller that the message was not sent, at the node where the
      cause is known.
    verification: >-
      A unit test confirms that a case-scoped emit node returns FAILURE or
      raises immediately when the participant list contains no actor with
      `CVDRole.CASE_MANAGER`.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-011
  - id: PCR-08-017
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection of the case-scoped emit nodes confirms each fails rather than enqueuing
      an activity whose `to` field is `None` or empty.
    statement: >-
      An emit node in a case-scoped trigger BT MUST NOT silently enqueue an activity
      with a `None` or empty `to` field.
    rationale: >-
      An activity with no recipient is never delivered, but the trigger that queued it
      still reports success. The participant then waits for an answer to a message
      that nobody received.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-011
  - id: PCR-08-018
    priority: MUST
    kind: project
    statement: >-
      Trigger use cases and their supporting BTs that cause a participant to send a
      case-scoped message MUST resolve the CASE_MANAGER's actor ID from the case's
      participant list (the participant with `CVDRole.CASE_MANAGER`) and use that ID as
      the sole `to:` recipient (PCR-08-005). Any helper that returns all participants
      (e.g. the roster index) MUST NOT be used as the sole source of recipients for
      outbound participant activities.
    rationale: >-
      A participant messages only the CASE_MANAGER (PCR-08-005). A roster-wide recipient
      list sends case messages to actors that are not entitled to them, and those actors
      act on messages that the CASE_MANAGER never committed.
    verification: >-
      `test/core/use_cases/triggers/case/test_add_object.py::TestSvcAddObjectToCaseUseCase::test_add_object_to_case_addresses_case_manager_alone`
      and
      `test/core/use_cases/triggers/case/test_add_report.py::TestSvcAddReportToCaseUseCase::test_add_report_to_case_addresses_case_manager_alone`
      seed a case with other participants and confirm the trigger use case resolves the
      participant holding `CVDRole.CASE_MANAGER` as the sole `to:` recipient.
    relationships:
    - rel_type: implements
      spec_id: PCR-08-005
  - id: PCR-08-012
    priority: MUST
    kind: protocol
    statement: >-
      The invitee's `Accept(Invite(Actor, VulnerabilityCaseStub))` is a join and
      embargo-consent decision, not an RM engagement decision. The CASE_MANAGER MUST NOT
      record any RM transition from it (CM-11-001), and MUST record the invitee as
      RM.ACCEPTED only on receiving `Join(VulnerabilityCase)` from it (CM-11-004).
    rationale: >-
      PCR-08-014 prohibits the case owner from emitting RM state-change activities on
      behalf of the invitee. The invitee's own messages are the authoritative signals,
      and each carries only the decision it names: accepting the stub joins the case,
      the full-case Invite reply judges it (CM-11-011), and `Join` engages.
    verification: >-
      Integration tests in `test/demo/test_invite_actor_demo.py` confirm that
      the CASE_MANAGER leaves the invitee at RM.RECEIVED on its stub-Invite
      `Accept` and records RM.ACCEPTED only after the invitee's
      `Join(VulnerabilityCase)`.
    relationships:
    - rel_type: refines
      spec_id: PCR-08-009
    adr:
    - ADR-0114
    stories:
    - story_2022_054
    - story_2022_006
- id: PCR-07
  title: Testing
  specs:
  - id: PCR-07-001
    priority: MUST
    kind: project
    statement: >-
      Unit tests MUST verify that `Announce(VulnerabilityCase)` from the CASE_MANAGER creates
      a local replica when none exists.
    rationale: >-
      A participant that cannot create its first replica from the CASE_MANAGER's copy
      cannot take part in the case at all. A unit test finds that failure before a
      demo or a deployment does.
    verification: >-
      `test_creates_case_when_absent` in
      `test/core/use_cases/received/actor/test_announce.py` asserts that an admitted
      `Announce(VulnerabilityCase)` creates the case in a store that did not hold it.
  - id: PCR-07-002
    priority: MUST
    kind: project
    statement: >-
      Unit tests MUST verify that `Announce(VulnerabilityCase)` from the CASE_MANAGER updates
      the local replica when one exists.
    rationale: >-
      A replica that does not apply a later copy from the CASE_MANAGER stays at its
      old state while the case moves on. A unit test finds that failure before the
      replicas disagree in use.
    verification: >-
      `test_replaces_a_case_already_present` in
      `test/core/behaviors/case/nodes/test_actor_and_announce_nodes.py` and
      `test_a_copy_at_the_replicas_tail_replaces_its_case` in
      `test/core/behaviors/sync/test_divergence_recovery.py` assert that an admitted
      copy replaces the case the replica holds.
  - id: PCR-07-003
    priority: MUST
    kind: project
    statement: >-
      Unit tests MUST verify that `Announce(VulnerabilityCase)` from an actor that is NOT
      the CASE_MANAGER is rejected and logged at WARNING.
    rationale: >-
      Refusing a copy from any sender other than the CASE_MANAGER is what keeps a
      replica from being rewritten by an untrusted actor (PCR-03-001). A test of the
      refusal, and of its WARNING log, keeps that protection from being lost without
      notice.
    verification: >-
      `test_rejects_announce_from_non_case_actor` in
      `test/core/use_cases/received/actor/test_announce.py` asserts that a copy from a
      sender other than the expected CASE_MANAGER is not stored and that a WARNING
      names the refused sender.
  - id: PCR-07-004
    priority: MUST
    kind: project
    statement: >-
      Unit tests MUST verify that the `context` field is used to route incoming activities
      to the correct case handler.
    rationale: >-
      If the `context` field stops selecting the replica, activities apply to the
      wrong case or to none. A test of the routing finds that failure where it starts.
    verification: >-
      `test_subsequent_case_scoped_activity_routes_without_deferral` in
      `test/demo/test_pcr_bootstrap.py` asserts that an `Add(Note)` whose `context`
      names a case the actor holds is processed at once, not deferred.
  - id: PCR-07-005
    priority: MUST
    kind: project
    statement: >-
      Unit tests MUST verify that activities with an unknown case context are queued, a resync
      request is emitted, and the activity is dropped after timeout without updating any state.
    rationale: >-
      The handling of unknown case context (PCR-06-001 to PCR-06-003) has three parts:
      hold the activity, ask for the case, and drop it later without changing state. A
      failure in any part loses an activity or writes untrusted state, so each part
      needs a test.
    verification: >-
      `test/core/behaviors/inbox/nodes/test_defer_check_node.py` asserts that
      activities for an unknown case are deferred.
      `test_pending_case_queue_expiry_emits_question` and
      `test_pending_case_queue_expires_drops_and_warns` in
      `test/adapters/driving/fastapi/test_inbox_handler.py` assert that an expired
      queue sends a replay request and is dropped with a WARNING. No test yet
      asserts that a dropped activity changed no local state (#5377).
  - id: PCR-07-006
    priority: MUST
    kind: project
    statement: >-
      Integration tests MUST verify the full bootstrap sequence: case creation → CASE_MANAGER
      sends `Announce(VulnerabilityCase)` → participant creates local replica → subsequent
      case-scoped activities are routed correctly.
    rationale: >-
      Each step of the bootstrap can pass its own unit test while the steps together
      still fail, for example when one step sends an activity that the next step does
      not accept. Only a test of the whole sequence shows that a new participant ends
      up with a working replica.
    verification: >-
      Inspection of `test/demo/test_pcr_bootstrap.py` confirms a test case
      walks the complete bootstrap sequence: case creation, CASE_MANAGER sending
      `Announce(VulnerabilityCase)`, participant replica creation, and correct
      routing of subsequent case-scoped activities.
  - id: PCR-07-007
    priority: MUST
    kind: project
    statement: >-
      Integration tests MUST verify the late-joiner sequence: `Invite` → `Accept` → CASE_MANAGER
      sends `Announce(VulnerabilityCase)` to new participant → new participant creates local
      replica.
    rationale: >-
      A late joiner gets its replica by a different path than the first participants:
      through the Invite and its Accept. A test of that whole sequence shows that a
      participant that joins later also ends up with a working replica.
    verification: >-
      Inspection of `test/demo/test_pcr_late_joiner.py` confirms a test case
      walks the complete late-joiner sequence: Invite → Accept → CASE_MANAGER
      sending `Announce(VulnerabilityCase)` → new participant creating its
      local replica.
  - id: PCR-07-008
    priority: MUST
    kind: project
    statement: >-
      Integration tests MUST verify that `RmInviteToCaseActivity` carries `actor` set to
      the CASE_MANAGER's ID, and that the invitee's `RmAcceptInviteToCaseActivity` is
      processed by the CASE_MANAGER (not the case owner).
    rationale: >-
      If the Invite named the Case Owner as its `actor`, the invitee would answer the
      Case Owner, and the CASE_MANAGER would never record the join. A test of both
      messages keeps the invite exchange routed through the CASE_MANAGER (PCR-08-007,
      PCR-08-008).
    verification: >-
      Inspection of `test/demo/test_invite_actor_demo.py` confirms a test case
      asserts `RmInviteToCaseActivity` carries `actor` equal to the CASE_MANAGER's
      ID and that the invitee's `RmAcceptInviteToCaseActivity` is handled by
      the CASE_MANAGER.
    relationships:
    - rel_type: verifies
      spec_id: PCR-08-007
    - rel_type: verifies
      spec_id: PCR-08-008
  - id: PCR-07-009
    priority: MUST
    kind: project
    statement: >-
      Integration tests MUST assert that no RM state-change activity is emitted with
      `actor` set to the invitee's ID from the case owner's context.
    rationale: >-
      An RM change that the Case Owner emits under the invitee's id is a forged
      decision (PCR-08-010). The forgery passes every check that trusts the `actor`
      field, so only a test that looks for it can find it.
    verification: >-
      Inspection of `test/demo/test_invite_actor_demo.py` confirms a test case
      asserts no actor-spoofed RM state-change activity is emitted for the
      invitee from the case owner's execution context.
    relationships:
    - rel_type: verifies
      spec_id: PCR-08-009
    - rel_type: verifies
      spec_id: PCR-08-010
  - id: PCR-07-010
    priority: MUST
    kind: project
    statement: >-
      Unit tests MUST verify that `Announce(VulnerabilityCase)` from an actor with no
      prior local trust record — no matching `VultronReportCaseLink.case_manager_id`
      and no invite trust anchor for the announced case ID — is rejected with a WARNING
      log entry and the case is NOT seeded in the receiver's DataLayer.
    rationale: >-
      A first-contact copy from an unknown sender is the attack that PCR-03-004
      prevents: it lets the sender seed a fake case. A test that the copy is refused,
      and the case not stored, keeps that protection in place.
    verification: >-
      A unit test in `test/core/use_cases/received/actor/test_announce.py`
      confirms that when the receiver's DataLayer contains no `VultronReportCaseLink`
      for the announced case and no invite trust anchor, a first-contact
      `Announce(VulnerabilityCase)` is rejected (WARNING logged, case not stored).
    relationships:
    - rel_type: verifies
      spec_id: PCR-03-004
