id: SIG
title: Signing
description: >-
  Requirements for signing the activities an actor sends and verifying the activities
  it receives, using object-level proofs carried inside the activity (FEP-8b32) so that a
  proof stays checkable after a relay or a ledger commit. HTTP Signatures and production
  key handling are out of scope here (ENC-01, OX-10).
scope:
- prototype
- production
tags:
- security
- authentication
groups:
- id: SIG-01
  title: Proofs on Sent Activities
  specs:
  - id: SIG-01-001
    priority: MUST
    kind: protocol
    statement: >-
      Every activity an actor sends MUST carry a `proof` made with its author's key.
    rationale: >-
      A receiver cannot otherwise tell who wrote an activity, so any client could post an
      activity in another actor's name (#509). The proof sits inside the activity, so it
      still shows who wrote the content after the CASE_MANAGER relays it or commits it to
      the ledger, which a signature on one HTTP delivery cannot show.
    verification: >-
      `test/core/use_cases/received/test_signed_ledger_entries.py::test_a_sent_activity_carries_its_authors_proof`
      and
      `test/core/use_cases/received/test_signed_ledger_entries.py::test_a_ledger_announce_carries_the_case_managers_proof`
      check the sealed bodies a participant and the CASE_MANAGER send;
      `test/demo/test_sealed_body_wire.py::TestTheWireCarriesTheSealedBody::test_every_delivered_body_carries_its_senders_proof`
      verifies every body the in-process router delivers.
    adr:
    - ADR-0164
    stories:
    - story_2022_089
    - story_2022_035
  - id: SIG-01-002
    priority: MUST
    kind: protocol
    statement: >-
      A `proof` MUST be a `DataIntegrityProof` using the `eddsa-jcs-2022` cryptosuite, with
      `proofPurpose` `assertionMethod` and a `verificationMethod` naming a key in its
      author's actor profile.
    rationale: >-
      Signer and verifier must agree on one proof form, or a correct proof is refused.
      FEP-8b32 with `eddsa-jcs-2022` (Ed25519 over the RFC 8785 canonical form) is the
      form ActivityPub implementations use for object integrity, and naming the key by
      the author's profile tells the receiver where to get it (SIG-02-001).
    verification: >-
      `test/core/use_cases/received/test_signed_ledger_entries.py::test_a_sent_proof_names_the_cryptosuite_and_the_authors_key`
      checks the proof on a participant's sealed body.
    relationships:
    - rel_type: extends
      spec_id: SIG-01-001
    adr:
    - ADR-0164
    stories:
    - story_2022_089
  - id: SIG-01-003
    priority: MUST
    kind: protocol
    statement: >-
      A `proof` MUST cover the whole activity as sent, every nested object included,
      except the `proof` itself.
    rationale: >-
      A proof that covers only part of an activity lets anyone change the rest without
      detection. The objects nested in an activity carry most of what a receiver acts
      on, such as a report's content or a ledger entry's snapshot.
    verification: >-
      `test/adapters/driving/fastapi/test_signed_delivery_refusal.py::test_a_body_changed_after_signing_is_refused`
      posts a signed body whose nested object was changed afterwards.
    adr:
    - ADR-0164
    stories:
    - story_2022_089
- id: SIG-02
  title: Key Discovery
  specs:
  - id: SIG-02-001
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST take the key that verifies a `proof` only from the author's actor
      profile, fetched from the author's URL, or a cached copy of that fetch.
    rationale: >-
      A key the receiver got anywhere else, such as from the activity itself or from a
      third actor, proves nothing about the author: anyone can sign with a key they made
      and name it. The author's profile is where the author's identity is already
      published, so it is the one source the receiver can trust as far as it trusts the
      author's id.
    verification: >-
      `test/adapters/driving/fastapi/test_signed_delivery_refusal.py::test_a_proof_naming_a_key_outside_the_authors_profile_is_refused`
      posts an activity whose proof names another actor's key.
    adr:
    - ADR-0164
    stories:
    - story_2022_035
    - story_2022_089
  - id: SIG-02-002
    priority: MUST
    kind: protocol
    statement: >-
      An actor MUST serve its actor profile, its key included, to a request that carries
      no proof or signature.
    rationale: >-
      A receiver fetches the author's profile to get the key that verifies the author's
      proof. Demanding a proof on that fetch would need a key the requester may not have
      yet, so key discovery could never start.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actor_profile_key.py::test_an_unsigned_get_returns_the_profile_with_its_key`
      fetches a profile with a plain GET.
    adr:
    - ADR-0164
    stories:
    - story_2022_035
  - id: SIG-02-003
    priority: MUST
    kind: protocol
    statement: >-
      A verifier MUST take a proof's key only from the author's own profile as served at
      the author's profile URL, freshly fetched or a cached copy of such a fetch, and
      never from a profile embedded in a received activity (SIG-02-004) or any other
      copy it did not obtain from that URL.
    rationale: >-
      A copy of a peer's profile that came from somewhere other than that peer, such as
      an activity that embedded it, may carry a planted key that would let the planter
      sign as the peer. The peer's own URL is the one source the receiver can trust as
      far as it trusts the peer's id, so a fetch from it, or a cache of that fetch, is
      authoritative. The prototype fetches every time and keeps no cache; that is an
      implementation choice, not a protocol rule. Whether to pin the first key fetched
      (trust on first use), and how a fetched key is cached or rotated, are #1184's to
      decide.
    verification: >-
      `test/adapters/driving/fastapi/test_signed_delivery_refusal.py::test_a_stored_peer_key_is_ignored`
      stores a copy of the author's profile listing another key and checks the
      author's genuine body is verified by the fetched key, and
      `test/core/services/test_verification_key.py::test_the_resolver_takes_no_store`
      checks the key lookup takes no store.
    relationships:
    - rel_type: refines
      spec_id: SIG-02-001
    adr:
    - ADR-0164
    stories:
    - story_2022_035
    - story_2022_089
  - id: SIG-02-004
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST discard the keys of every actor profile a received activity
      embeds, before it parses or stores the activity, except inside a ledger entry's
      `payloadSnapshot`, which it keeps as received and reads no key from.
    rationale: >-
      A key embedded in a received activity was put there by its sender, who need not
      be the profile's actor. Discarding it at the parse edge means no parsed object
      and no stored copy carries a peer's key (SIG-02-003). The received body itself is
      kept as received, as evidence (VM-08-002), and no key is read from it. A
      `payloadSnapshot` is kept byte for byte, since its author's proof covers it
      (SIG-04-002), so a profile inside it keeps its keys; no key is read from a
      stored copy, so they are never used.
    verification: >-
      `test/wire/as2/test_embedded_profile_keys.py` parses activities embedding a sender
      and a peer profile with `assertionMethod` and checks the parsed objects carry no
      key, and
      `test/adapters/driving/fastapi/test_inbox_verification.py::test_an_embedded_profile_reaches_storage_without_its_keys`
      checks the stored record of the embedded actor has none.
    relationships:
    - rel_type: implements
      spec_id: SIG-02-003
    adr:
    - ADR-0164
    stories:
    - story_2022_035
    - story_2022_089
- id: SIG-03
  title: Verification and Refusal
  specs:
  - id: SIG-03-001
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST verify an activity's `proof` before it acts on any of the activity's
      content.
    rationale: >-
      Content acted on before verification has already been trusted: a forged activity
      could change state, be stored or be relayed before its refusal. Verifying first
      means a refused activity leaves nothing behind.
    verification: >-
      `test/adapters/driving/fastapi/test_signed_delivery_refusal.py::test_an_activity_without_a_valid_proof_is_refused_and_stores_nothing`
      checks that a refused activity leaves nothing in the receiver's store.
    adr:
    - ADR-0164
    stories:
    - story_2022_089
  - id: SIG-03-002
    priority: MUST
    kind: protocol
    statement: A receiver MUST refuse an activity whose `proof` is missing or does not verify.
    rationale: >-
      Verification that admits an unsigned activity protects nothing, since a forger
      simply leaves the proof out. The refusal holds in every deployment, test and demo:
      a switch that turns it off becomes the way a test passes and a deployment is left
      open.
    verification: >-
      `test/adapters/driving/fastapi/test_signed_delivery_refusal.py::test_an_activity_without_a_valid_proof_is_refused_and_stores_nothing`
      posts an activity with no proof and one with a proof that does not verify.
    relationships:
    - rel_type: depends_on
      spec_id: SIG-03-001
    adr:
    - ADR-0164
    stories:
    - story_2022_089
    - story_2022_090
  - id: SIG-03-003
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST verify a `proof` as its own ingress stage, after the body-size,
      media-type and JSON-shape checks and before `parse_activity`.
    rationale: >-
      Verifying before the parser keeps a forged body away from expansion, validation and
      hydration, and keeps semantic extraction a mapping from verified AS2 to semantics
      that tests can exercise without keys. The cheap transport checks run first, so an
      oversized or malformed body is refused without a key fetch.
    verification: >-
      `test/adapters/driving/fastapi/test_signed_delivery_refusal.py::test_a_bad_proof_is_refused_before_the_schema_is_checked`
      posts a body with an invalid proof and a schema fault.
    relationships:
    - rel_type: implements
      spec_id: SIG-03-001
    adr:
    - ADR-0164
  - id: SIG-03-004
    priority: MUST
    kind: project
    statement: >-
      When this codebase archives a received activity, its `ReceivedActivityRecord`
      MUST record, for each proof the inbox verified on the delivery, the author, the
      key id (`verificationMethod`) and the public key as fetched
      (`publicKeyMultibase`), written in the same save as the archive.
    rationale: >-
      A receiver can then say which key a past message verified against, which key
      rotation needs (#1184), and a demo can check from the receiver's own store that
      it fetched the sender's key and verified with it, without re-deriving anything.
      Writing the facts with the archive means no record says "verified" for an activity
      the receiver refused. For an `Announce(CaseLedgerEntry)` the record names both the
      CASE_MANAGER's proof and the snapshot author's (SIG-04-002). A delivery left in
      holding keeps the facts on its held record, so the replay that archives it keeps
      them too.
    verification: >-
      `test/adapters/driving/fastapi/test_verified_proofs_archived.py` posts signed
      bodies to an inbox and checks the archived record names each verified proof and
      key, a refused body stores nothing, and a deferred delivery keeps them through
      its replay; `vultron/demo/helpers/workflow/report.py::reporter_submits_report`
      checks it across containers in every scenario.
    relationships:
    - rel_type: depends_on
      spec_id: SIG-03-001
    adr:
    - ADR-0164
  - id: SIG-03-005
    priority: MUST_NOT
    kind: project
    statement: >-
      A receipt stub that a refusal leaves MUST NOT record verified proofs.
    rationale: >-
      A refused message was not accepted, so its record must not read as verified;
      the stub keeps only who sent what, when and why it was refused (CLP-10-018).
    verification: >-
      `test/adapters/driving/fastapi/test_verified_proofs_archived.py::test_a_receipt_stub_keeps_no_proofs`
      refuses a held delivery that carried proofs, and
      `test_a_stub_carrying_proofs_is_refused_at_construction` builds one.
    relationships:
    - rel_type: refines
      spec_id: SIG-03-004
    adr:
    - ADR-0164
- id: SIG-04
  title: Proofs in the Case Ledger
  specs:
  - id: SIG-04-001
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST keep the sender's `proof`, unchanged, in the `payloadSnapshot`
      of the ledger entry that records a received activity.
    rationale: >-
      A replica acts on a participant's words that the CASE_MANAGER delivers. Only the
      participant's own proof, kept in the snapshot, lets the replica check that the
      participant wrote them; a snapshot without it asks the replica to trust the
      CASE_MANAGER for what another actor said. The snapshot is the activity as received
      (VM-08-003), so dropping the proof would also change it.
    verification: >-
      `test/core/use_cases/received/test_signed_ledger_entries.py::test_a_ledger_snapshot_keeps_the_senders_proof`
      commits a participant's signed activity and reads the relayed snapshot.
    adr:
    - ADR-0164
    stories:
    - story_2022_089
  - id: SIG-04-002
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST refuse the whole `Announce(CaseLedgerEntry)` when a `proof` it
      needs is missing or fails to verify. These are the CASE_MANAGER's `proof` on the
      `Announce` and, when the `payloadSnapshot`'s `actor` is not the CASE_MANAGER, the
      author's `proof` on the snapshot.
    rationale: >-
      The CASE_MANAGER's proof shows the entry came from the case's authority; the
      author's proof shows the participant wrote the act the entry records. Applying the
      entry on either alone would let a forged act enter the case through a genuine
      relay, or a genuine act be replayed by a forger. Refusing the whole entry keeps the
      replica's ledger a prefix of the CASE_MANAGER's.
    verification: >-
      `test/core/use_cases/received/test_signed_ledger_entries.py::test_a_replica_refuses_an_entry_whose_author_proof_fails`
      posts to a replica's inbox an entry whose snapshot lost its author's proof,
      and one whose snapshot was altered, each re-signed by the CASE_MANAGER.
    adr:
    - ADR-0164
    stories:
    - story_2022_089
    - story_2022_035
- id: SIG-05
  title: Prototype Keys and the Signing Module
  scope:
  - prototype
  specs:
  - id: SIG-05-001
    priority: MUST
    kind: project
    statement: >-
      In the prototype, each actor's key pair MUST be computed from a fixed seed tied to
      its actor id.
    rationale: >-
      Tests, demos and documentation examples compare and show exact wire bodies, so
      their proofs must be the same on every run. A seeded key makes no security claim:
      anyone who knows the scheme can compute the private key, so a seeded key must
      never be deployed. Production key generation is ENC-01-001.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_actor_profile_key.py::test_an_actors_key_is_the_same_in_every_store`
      compares the key two independent stores publish for one actor id.
    adr:
    - ADR-0164
  - id: SIG-05-002
    priority: MUST_NOT
    kind: project
    statement: Verification MUST NOT derive a key from a seed.
    rationale: >-
      A verifier that derives the author's key from the seed scheme verifies against a
      key the author never published, so it would admit a body from an actor whose
      profile it cannot read. Only a key's owner computes its key pair from its seed;
      every other actor gets the key from the owner's profile (SIG-02-001).
    verification: >-
      `test/adapters/driving/fastapi/test_signed_delivery_refusal.py::test_an_author_whose_profile_cannot_be_read_is_refused`
      posts an activity from an author whose profile the receiver holds no copy of and
      cannot fetch.
    relationships:
    - rel_type: refines
      spec_id: SIG-02-001
    adr:
    - ADR-0164
  - id: SIG-05-003
    priority: MUST
    kind: project
    statement: >-
      Every proof this codebase creates or verifies, in tests too, MUST go through one
      shared signing module.
    rationale: >-
      Canonicalization, key encoding and proof options must match exactly between signer
      and verifier, and each hand-rolled copy is a place for them to drift apart. One
      module, as the activity factories are for outbound construction, keeps one copy to
      test against published test vectors.
    verification: >-
      `test/architecture/test_signing_helper_module.py::test_one_module_calls_the_signing_primitives`
      lists the modules under `vultron/` and `test/` that import the Ed25519 or JCS
      primitives.
    adr:
    - ADR-0164
  - id: SIG-05-004
    priority: MUST
    kind: project
    statement: >-
      An actor's outbox MUST refuse an activity whose `actor` names another actor,
      before signing or storing anything.
    rationale: >-
      An actor holds only its own private key, so it signs only its own messages. Seeded
      keys (SIG-05-001) are guessable by design, so any code could compute any actor's
      key; the prototype keeps an actor from signing for another in code instead: only
      the owning actor's outbox calls the signer for that actor. The one other caller is
      the docs example renderer, which signs documentation examples, bodies no server
      sends, each only as its own `actor` (`signing.sign_docs_example`);
      `test/architecture/test_seeded_signer_callers.py` lists both callers. Real
      per-actor secret keys are ENC-01-001.
    verification: >-
      `test/adapters/test_outbox_sealed_body.py::test_seal_refuses_an_activity_another_actor_wrote`
      seals an activity naming another actor and checks nothing is signed or stored.
    adr:
    - ADR-0164
  - id: SIG-05-005
    priority: MUST
    kind: project
    statement: >-
      An activity's `actor` MUST be the actor that signs it; when another actor
      initiated it, that initiator is carried in `attributed_to`, which is absent when
      the actor is the initiator.
    rationale: >-
      A proof names its signer's key, and a receiver reads the author's key from the
      `actor` (SIG-02-001), so an `actor` that is not the signer is a claim the
      signer cannot back with its own key. The maintainer's rule: actor is always the
      signing actor; `attributed_to` is the actor who initiated the thing, set only
      when that initiator differs from the actor, since a copy of the actor is
      redundant. This
      supersedes ADR-0041 on one point: the CASE_MANAGER's genesis
      `add_case_status_to_case` entry names the CASE_MANAGER as `actor`, and the case
      owner that set the status stays in the status's `attributed_to`.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py::TestADR0041LedgerEntries::test_add_case_status_is_signed_by_the_case_actor`
      checks the genesis case-status entry's `actor` and the status's `attributedTo`.
    adr:
    - ADR-0164
