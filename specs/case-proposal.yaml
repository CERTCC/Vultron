id: CP
title: CaseProposal Protocol
description: Requirements for the CaseProposal protocol flow, which separates the act of requesting case initialization from
  the act of creating the case. Covers the wire vocabulary type, the Create/Accept/Reject message flow, and the corresponding
  MessageSemantics values and received-side use cases.
scope:
- prototype
- production
tags:
- protocol
- messaging
groups:
- id: CP-01
  title: Wire Vocabulary
  specs:
  - id: CP-01-001
    priority: MUST
    kind: project
    statement: The wire layer MUST define an `as_CaseProposal` object type that extends `as_VultronObject`.
    rationale: A dedicated object type enables pattern-discriminated routing in the semantic extractor and preserves AS2 semantics
      by separating the proposal object from the eventual `VulnerabilityCase`.
    verification: Inspection of `vultron/wire/as2/vocab/objects/case_proposal.py` confirms `as_CaseProposal` is declared as
      a class that extends `as_VultronObject`.
    adr:
    - ADR-0023
  - id: CP-01-002
    priority: MUST
    kind: project
    statement: '`as_CaseProposal` MUST include an `id_` field containing a full URI that uniquely identifies the proposal.'
    rationale: >-
      Every later message about the proposal names it by this id: the `Accept` or
      `Reject` that answers it, the duplicate check (CP-05-006) and the sender check
      (CP-05-010). A full URI is unique across actors, so two proposals never share a
      key.
    verification: Inspection of `vultron/wire/as2/vocab/objects/case_proposal.py` confirms `id_` is inherited from
      `as_VultronObject` as a required URI field on every `as_CaseProposal` instance.
    adr:
    - ADR-0023
  - id: CP-01-003
    priority: MUST
    kind: project
    statement: '`as_CaseProposal` MUST include an `attributed_to` field identifying the report receiver that originated
      the proposal (the proposer, who becomes the CASE_OWNER if the proposal is accepted).'
    rationale: >-
      The CASE_MANAGER seats the actor this field names as the Case Owner of the new
      case (CP-09-001), and it checks that the `actor` of the `Create` names the same
      actor (CP-01-015). Without the field, the case would have no owner to record.
    verification: Inspection of `vultron/wire/as2/vocab/objects/case_proposal.py` confirms `attributed_to` is a required
      `NonEmptyString` field on `as_CaseProposal`.
    adr:
    - ADR-0023
  - id: CP-01-004
    priority: MUST
    kind: project
    statement: '`as_CaseProposal` MUST include an `object_` field containing a fully inline `as_VulnerabilityReport` around
      which the case is to be created. URI references to the report are NOT permitted (see AKM-03-003).'
    rationale: The case-actor service needs the vulnerability report to initialize the case. URI references are prohibited
      because the receiver may not have the referenced object, and this codebase
      dereferences only the few references AKM-05-007 lists (AKM-03-003).
    verification: Inspection of `vultron/wire/as2/vocab/objects/case_proposal.py` confirms `object_` is typed as
      `ActivityStreamRequiredRef[as_VulnerabilityReport]`, enforcing an inline report and rejecting bare URI references.
    adr:
    - ADR-0023
  - id: CP-01-005
    priority: MUST
    kind: project
    statement: '`as_CaseProposal` MUST include a `target` field containing the URI of the prospective case-actor service to
      which the proposal is addressed.'
    rationale: >-
      A proposal is a request to one service. The `target` records in the proposal
      itself which service the report receiver asked to create the case, so the request
      names its addressee wherever it is stored or read, not only in the delivery's
      `to`.
    verification: Inspection of `vultron/wire/as2/vocab/objects/case_proposal.py` confirms `target` is a required
      `NonEmptyString` field on `as_CaseProposal`.
    adr:
    - ADR-0023
  - id: CP-01-006
    priority: MAY
    kind: protocol
    statement: >-
      A `CaseProposal` MAY include an optional `summary` field with a human-readable
      description of the proposal.
    rationale: >-
      A person who reviews proposals at the case-actor service may need to know why the
      report receiver asks for a case. A short description gives that context. The field
      is optional because the proposal is complete without it.
    adr:
    - ADR-0023
  - id: CP-01-007
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: project
    statement: >-
      When the proposing actor knows which `Offer(VulnerabilityReport)` brought it the report,
      `as_CaseProposal` MUST carry that provenance as `offerId` and `offerActorId`, and the case-actor MUST
      use it for the `offerId` of the canonical `add_report_to_case` ledger entry whenever its own store
      holds no `OfferRecord` for the report.
    rationale: >-
      The canonical `add_report_to_case` entry records which Offer brought the report
      into the case, so every replica and every auditor of the ledger can trace the
      report to its submission (SYNC-02-002). The case-actor cannot supply that
      provenance from storage: the `OfferRecord` belongs to the actor that received the
      Offer, and a co-located case-actor has its own store with no read into a sibling's
      (PCR-01-003, DL-07-005). So it travels on the proposal for the same reason and by
      the same rule as the report itself (CP-01-004). A participant that joined through
      an Invite does not use it to answer the Offer, which was never sent to it
      (CM-11-018).
    relationships:
    - rel_type: refines
      spec_id: CP-01-004
    - rel_type: implements
      spec_id: PCR-01-003
    verification: >-
      `test/core/behaviors/case/test_offer_provenance_on_proposal.py`
    adr:
    - ADR-0073
    - ADR-0121
  - id: CP-01-008
    priority: MUST
    kind: project
    statement: >-
      When the proposing actor holds the `Offer(VulnerabilityReport)` that brought it the report,
      `as_CaseProposal` MUST carry that Offer whole, inline, as `inReplyTo`. When both `inReplyTo` and
      the bare provenance of CP-01-007 are present they MUST name the same Offer. The case-actor MUST
      read the Reporter's proposed embargo terms (EP-04-004) from the Offer so carried, and MUST NOT
      fetch or reconstruct them from anywhere else.
    rationale: >-
      The case-actor has never seen the Offer, and a sender inlines the objects it introduces
      (ADR-0107); the bare `offerId` of CP-01-007 lets the case-actor *name* the submission but not
      read it. Carrying the Offer whole is what lets the Reporter's terms arrive as the Reporter stated
      them — the same activity the report receiver received, not the receiver's paraphrase of one field — and it
      is the only path by which EP-04-003's shortest-wins comparison at case creation ever gets a sender
      candidate. `inReplyTo` is AS2's own name for the relationship: the proposal answers the report
      submission.
    relationships:
    - rel_type: refines
      spec_id: CP-01-007
    - rel_type: implements
      spec_id: EP-04-004
    verification: >-
      `test/wire/as2/test_report_offer_proposed_embargo.py` (parse round trip of an Offer nested in a
      CaseProposal; provenance/inline consistency) and
      `test/core/behaviors/case/test_offer_provenance_on_proposal.py`
      (`TestProposalCarriesTheOfferItself`).
    adr:
    - ADR-0096
    - ADR-0107
  - id: CP-01-009
    priority: MAY
    kind: protocol
    statement: >-
      The `actor` of `Create(CaseProposal)` MAY be the proposing actor's full actor
      profile inline, or a reference to that profile which the CASE_MANAGER dereferences
      by an API call (AKM-05-003, AKM-05-004).
    rationale: >-
      The proposing actor becomes the CASE_OWNER (CP-09-001), and its published embargo
      policy lives on its profile (EP-01-001), in its own store, which the CASE_MANAGER
      cannot read (PCR-01-003). That policy is the CASE_OWNER's actor default at case
      creation (EP-04-003), so it has to reach case creation; whether the profile
      travels inline or is fetched is an implementation choice. This codebase sends the
      inline form and accepts either (CP-01-010).
    relationships:
    - rel_type: depends_on
      spec_id: EP-04-003
    - rel_type: depends_on
      spec_id: EP-01-001
    - rel_type: depends_on
      spec_id: AKM-05-003
    adr:
    - ADR-0096
    stories:
    - story_2022_014
  - id: CP-01-010
    priority: MUST
    kind: project
    statement: >-
      In this implementation, a sender MUST carry the proposing actor's full actor
      profile inline as the `actor` of `Create(as_CaseProposal)`, carrying its embargo
      policy when it has published one.
    rationale: >-
      A sender inlines the objects it introduces, as CP-01-008 does the Reporter's terms
      (ADR-0107), so a receiver that already supports dereference still needs no fetch
      for a proposal this codebase sends.
    verification: >-
      Tests of the case-proposal send path confirm the `actor` of the sent
      `Create(as_CaseProposal)` is the proposer's full profile, carrying its embargo
      policy.
    relationships:
    - rel_type: refines
      spec_id: CP-01-009
    adr:
    - ADR-0096
    - ADR-0107
  - id: CP-01-014
    priority: MUST
    kind: project
    statement: >-
      In this implementation, the CASE_MANAGER MUST accept as the `actor` of
      `Create(as_CaseProposal)` the proposer's inline profile or its id, which it
      dereferences from the proposer's published profile before processing the
      proposal (AKM-05-007).
    rationale: >-
      A receiver dereferences the reference CP-01-009 allows (AKM-05-003), so a sender
      that names its proposer by id is not refused for it.
    verification: >-
      Tests of the case-proposal receive path confirm that a proposal naming its
      proposer by id parses; `test/adapters/driving/fastapi/test_inbox_dereference.py`
      checks a profile named by id is fetched from the proposer and handed to the
      proposal.
    relationships:
    - rel_type: refines
      spec_id: CP-01-009
    - rel_type: depends_on
      spec_id: AKM-05-007
    adr:
    - ADR-0107
  - id: CP-01-015
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST refuse at the parse edge, with a reason naming the fault, a
      `Create(as_CaseProposal)` whose `actor` is a `Link` or does not name the
      proposal's `attributed_to`.
    rationale: >-
      The proposer's profile supplies the CASE_OWNER's actor default, so a profile that
      is not the proposer's would let another actor's terms bind the case.
    verification: >-
      `test/wire/as2/test_case_proposal_envelope.py` confirms that a `Link` `actor` and
      an `actor` whose `id` differs from `attributed_to` are refused at parse.
    relationships:
    - rel_type: refines
      spec_id: CP-01-014
    adr:
    - ADR-0107
  - id: CP-01-016
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST read the CASE_OWNER's actor default only from the inline or
      fetched proposer profile, never from its own store. A profile with no embargo
      policy means the CASE_OWNER has no actor default.
    rationale: >-
      The profile the proposal carries or names is the one the owner published for this
      proposal; a record in the CASE_MANAGER's store may be stale or someone else's.
    verification: >-
      Tests of the case-proposal receive path confirm that the actor default comes from
      the inline `actor` profile's embargo policy and that a profile without one yields
      no actor default.
    relationships:
    - rel_type: refines
      spec_id: CP-01-014
    adr:
    - ADR-0096
    - ADR-0107
  - id: CP-01-017
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST NOT store a fetched proposer profile, or retain an inline or
      fetched one as a candidate for any other case.
    rationale: >-
      A policy read from one proposal reflects that profile as sent; keeping it for
      later cases would let a stale policy win shortest-wins.
    verification: >-
      Tests of the case-proposal receive path confirm that a policy carried on one
      proposal does not supply the default for a later case;
      `test/adapters/driving/fastapi/test_inbox_dereference.py` checks a fetched
      profile is not stored.
    relationships:
    - rel_type: refines
      spec_id: CP-01-016
    adr:
    - ADR-0107
  - id: CP-01-018
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST refuse a proposal whose proposer profile could not be
      fetched (AKM-05-015).
    rationale: >-
      Refusing a profile it cannot fetch, rather than creating the case without an actor
      default, keeps the owner's published terms from being silently dropped.
    verification: >-
      Tests of the case-proposal receive path confirm that a proposal naming its
      proposer by id is refused when the profile was not fetched.
    relationships:
    - rel_type: refines
      spec_id: CP-01-014
    adr:
    - ADR-0107
  - id: CP-01-011
    priority: MUST
    kind: protocol
    statement: >-
      A `CaseProposal` MUST carry, as `proposerCaseRoles`, the CVD roles the proposing actor
      holds in a case it owns. An absent or empty `proposerCaseRoles` states no role beyond
      `CASE_OWNER`.
    rationale: >-
      The CASE_MANAGER seats the proposer with these roles (CP-09-007) and has no other
      source for them: it may run in a different container, and it cannot read another
      actor's configuration or store (ADR-0073). Carrying them follows the rule CP-01-010
      applies to the proposer's embargo policy.
    verification: >-
      Tests confirm that `proposerCaseRoles` round-trips through the wire form, that an
      absent one states no role beyond `CASE_OWNER`, and that the roles a proposal states
      reach the CASE_MANAGER's received event.
    relationships:
    - rel_type: refines
      spec_id: CP-01-001
    adr:
    - ADR-0133
    stories:
    - story_2022_063
  - id: CP-01-012
    priority: MUST
    kind: protocol
    statement: >-
      A `Create(CaseProposal)` whose `proposerCaseRoles` names `CASE_MANAGER` MUST be
      refused before anything is written, with a reason naming the fault.
    rationale: >-
      Only the CaseActor holds `CASE_MANAGER`. A proposer that could state it would seat
      itself as the manager of the case it proposes.
    verification: >-
      Tests confirm that parsing an `as_CaseProposal` whose `proposerCaseRoles` includes
      `CASE_MANAGER` raises a validation error naming CP-01-012.
    relationships:
    - rel_type: extends
      spec_id: CP-01-011
    adr:
    - ADR-0133
    stories:
    - story_2022_063
  - id: CP-01-013
    priority: MUST
    kind: project
    statement: >-
      In this implementation, the roles a report receiver states in `proposerCaseRoles`
      (CP-01-011, CP-09-007) MUST be copied from its own `ActorConfig.default_case_roles`
      (CFG-07-002).
    rationale: >-
      The receiver's configuration is the one place this codebase records the roles an
      actor holds in the cases it owns, so a proposal copied from anywhere else would seat
      the owner with roles its operator never configured. The CASE_MANAGER cannot read
      that configuration (ADR-0073), so the copy has to happen on the sender's side.
    verification: >-
      `test/core/behaviors/case/test_proposer_case_roles_on_proposal.py::TestReceiverStatesItsRoles`
      confirms that a proposal built by the report receiver carries its configured
      `default_case_roles` as `proposerCaseRoles`, and none when none are configured.
    relationships:
    - rel_type: implements
      spec_id: CP-01-011
    - rel_type: implements
      spec_id: CP-09-007
    - rel_type: depends_on
      spec_id: CFG-07-002
- id: CP-02
  title: MessageSemantics Values
  specs:
  - id: CP-02-001
    priority: MUST
    kind: project
    statement: The `MessageSemantics` enum MUST include `CREATE_CASE_PROPOSAL` for the pattern `Create(as_CaseProposal)`.
    rationale: >-
      The dispatcher sends each received activity to one use case by its
      `MessageSemantics` value. Without a value for `Create(as_CaseProposal)`, a
      received proposal has no use case to handle it.
    verification: Inspection of `vultron/core/models/events/base.py` confirms `CREATE_CASE_PROPOSAL` is present in
      `MessageSemantics`; `test/test_semantic_activity_patterns.py::test_create_case_proposal_dispatches_correctly` validates it.
    adr:
    - ADR-0023
  - id: CP-02-002
    priority: MUST
    kind: project
    statement: The `MessageSemantics` enum MUST include `ACCEPT_CASE_PROPOSAL` for the pattern `Accept(as_CaseProposal)`.
    rationale: >-
      The dispatcher sends each received activity to one use case by its
      `MessageSemantics` value. Without a value for `Accept(as_CaseProposal)`, the
      report receiver cannot record that its proposal was accepted.
    verification: Inspection of `vultron/core/models/events/base.py` confirms `ACCEPT_CASE_PROPOSAL` is present in
      `MessageSemantics`; `test/test_semantic_activity_patterns.py::test_accept_case_proposal_dispatches_correctly` validates it.
    adr:
    - ADR-0023
  - id: CP-02-003
    priority: MUST
    kind: project
    statement: The `MessageSemantics` enum MUST include `REJECT_CASE_PROPOSAL` for the pattern `Reject(as_CaseProposal)`.
    rationale: >-
      The dispatcher sends each received activity to one use case by its
      `MessageSemantics` value. Without a value for `Reject(as_CaseProposal)`, the
      report receiver cannot record that its proposal was rejected.
    verification: Inspection of `vultron/core/models/events/base.py` confirms `REJECT_CASE_PROPOSAL` is present in
      `MessageSemantics`; `test/test_semantic_activity_patterns.py::test_reject_case_proposal_dispatches_correctly` validates it.
    adr:
    - ADR-0023
- id: CP-03
  title: Extractor Patterns
  specs:
  - id: CP-03-001
    priority: MUST
    kind: project
    statement: '`SEMANTIC_REGISTRY` MUST contain a pattern entry for `(Create, as_CaseProposal) -> CREATE_CASE_PROPOSAL`.'
    rationale: >-
      Semantic extraction finds the `MessageSemantics` of a received activity from the
      patterns in `SEMANTIC_REGISTRY`. With no entry for `(Create, as_CaseProposal)`,
      the activity is not classified as part of the proposal flow and reaches none of
      its use cases.
    verification: A unit test in `test/test_semantic_activity_patterns.py::test_create_case_proposal_dispatches_correctly`
      confirms `(Create, as_CaseProposal)` resolves to `CREATE_CASE_PROPOSAL` via `SEMANTIC_REGISTRY`.
    adr:
    - ADR-0023
  - id: CP-03-002
    priority: MUST
    kind: project
    statement: '`SEMANTIC_REGISTRY` MUST contain a pattern entry for `(Accept, as_CaseProposal) -> ACCEPT_CASE_PROPOSAL`.'
    rationale: >-
      Semantic extraction finds the `MessageSemantics` of a received activity from the
      patterns in `SEMANTIC_REGISTRY`. With no entry for `(Accept, as_CaseProposal)`,
      the activity is not classified as part of the proposal flow and reaches none of
      its use cases.
    verification: A unit test in `test/test_semantic_activity_patterns.py::test_accept_case_proposal_dispatches_correctly`
      confirms `(Accept, as_CaseProposal)` resolves to `ACCEPT_CASE_PROPOSAL` via `SEMANTIC_REGISTRY`.
    adr:
    - ADR-0023
  - id: CP-03-003
    priority: MUST
    kind: project
    statement: '`SEMANTIC_REGISTRY` MUST contain a pattern entry for `(Reject, as_CaseProposal) -> REJECT_CASE_PROPOSAL`.'
    rationale: >-
      Semantic extraction finds the `MessageSemantics` of a received activity from the
      patterns in `SEMANTIC_REGISTRY`. With no entry for `(Reject, as_CaseProposal)`,
      the activity is not classified as part of the proposal flow and reaches none of
      its use cases.
    verification: A unit test in `test/test_semantic_activity_patterns.py::test_reject_case_proposal_dispatches_correctly`
      confirms `(Reject, as_CaseProposal)` resolves to `REJECT_CASE_PROPOSAL` via `SEMANTIC_REGISTRY`.
    adr:
    - ADR-0023
  - id: CP-03-004
    priority: MUST
    kind: project
    statement: All three `CaseProposal` extractor patterns MUST appear before any more-general patterns that could match the
      same activity types (e.g., generic `Accept` or `Reject` catch-all entries), to prevent misrouting (per SE-03-002).
    rationale: >-
      The registry is ordered from the most specific pattern to the least specific
      (SE-03-002), and extraction uses the first pattern that matches. A general
      `Accept` or `Reject` pattern placed first would match the answer to a proposal,
      and the report receiver would handle it as a different message.
    verification: A unit test in `test/test_semantic_activity_patterns.py::test_non_overlapping_activity_patterns` confirms
      all three CaseProposal patterns appear before generic Accept/Reject catch-all entries in `SEMANTIC_REGISTRY`.
    relationships:
    - rel_type: depends_on
      spec_id: SE-03-002
    adr:
    - ADR-0023
- id: CP-04
  title: Protocol Flow — Sending
  specs:
  - id: CP-04-001
    priority: MUST
    kind: protocol
    statement: >-
      A report receiver that wishes to request case initialization at a dedicated
      case-actor service MUST send `Create(CaseProposal)` to the case-actor service's
      inbox, with `actor` set to the receiver's own URI.
    rationale: Using `Create` with the report receiver as `actor` accurately declares that the receiver created the proposal object,
      not the case itself. Sending `Create(VulnerabilityCase)` from the receiver would violate AS2 semantics because the receiver
      is not the authoritative creator of the case.
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm a report receiver sends
      `Create(as_CaseProposal)` to the case-actor inbox with its own URI set as `actor`.
    relationships:
    - rel_type: implements
      spec_id: CP-01-001
    stories:
    - story_2022_012
    - story_2022_046
    adr:
    - ADR-0023
  - id: CP-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The BT node responsible for sending `Create(as_CaseProposal)` MUST be a
      distinct node (`ProposeReportCaseToActorNode`) separate from
      `EnsureCaseActorHostedNode`. `EnsureCaseActorHostedNode` is responsible only for
      making the case-actor a hosted actor; it MUST NOT send a `CaseProposal` activity.
    rationale: Conflating actor registration with proposal sending violates single responsibility and causes the proposal
      to be sent before the case-actor service is ready. See `notes/case-proposal.md` for the pitfall.
  - id: CP-04-003
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: protocol
    statement: >-
      `Create(CaseProposal)` MUST be addressed to the case-actor service's own actor
      identity, which exists before the report does, and MUST NOT be addressed to an
      identity derived per case or per report.
    rationale: >-
      A derived identity names an actor that no container hosts. The sender computes it,
      so no container has registered it, and delivery to it fails with a permanent 404.
      It also cannot be set up in advance, because the sender can compute it only after
      the report exists, and by then the proposal is already sent. A container identity
      comes from configuration, so the container can register it once, when it is
      seeded. The proposal loses nothing: it carries its report (CP-01-004), and every
      later case-scoped message carries `activity.context`.
    relationships:
    - rel_type: refines
      spec_id: CP-04-001
    - rel_type: refines
      spec_id: BT-10-002
    verification: >-
      `test/core/behaviors/case/test_case_actor_identity.py`;
      `test/demo/test_rv_demo.py` exercises the full round-trip with no stand-in, which
      is what a 404 here would break.
    stories:
    - story_2022_012
    - story_2022_046
  - id: CP-04-005
    priority: MUST
    kind: project
    statement: >-
      In this implementation, the case-actor service's actor identity (CP-04-003) MUST be
      `{case_actor_service_url}/actors/case-actor`, built from the sender's configured
      `ActorConfig.case_actor_service_url`, one identity per case-actor container.
    rationale: >-
      A sender can address the service only if it can compute the identity from what it
      already knows, and the configured base URL is the one thing every actor of this
      deployment is given about the service. A fixed path under it lets the container
      register that identity once, at seed time.
    verification: >-
      `test/core/behaviors/case/test_case_actor_identity.py::TestCaseActorIdentity`
      confirms the identity is the configured base URL with the `actors/case-actor`
      path, that an explicit base overrides the configured one, and that an unconfigured
      base yields no identity.
    relationships:
    - rel_type: implements
      spec_id: CP-04-003
  - id: CP-04-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Whatever provisions the case-actor's record MUST write it into the *case-actor's own* store, since
      the inbox route resolves an actor from the store its URI names. A copy in the sending actor's store
      does not make the case-actor addressable.
    rationale: >-
      Each actor has its own store (ADR-0073), and the inbox route finds an actor in the
      store its URI names. A record in the case-actor's own store makes it an actor that
      can receive messages. A record in the sender's store only says that the sender
      knows of a peer. If only the sender's record exists, the inbox answers `404 Actor
      not found` and the proposal is not delivered.
    relationships:
    - rel_type: refines
      spec_id: CP-04-003
    - rel_type: refines
      spec_id: DL-07-001
    adr:
    - ADR-0073
- id: CP-05
  title: Protocol Flow — Receiving (Case-Actor Side)
  specs:
  - id: CP-05-001
    priority: MUST
    kind: project
    statement: A `CreateCaseProposalReceivedUseCase` MUST be implemented on the case-actor side to handle incoming `Create(as_CaseProposal)`
      activities.
    rationale: >-
      The case-actor service must answer each proposal it receives (CP-05-002). The
      dispatcher sends each `Create(as_CaseProposal)` to this use case, so without it a
      proposal reaches no code that can answer it.
    verification: Inspection of `vultron/core/use_cases/received/case_proposal.py` confirms `CreateCaseProposalReceivedUseCase`
      is implemented and tested in `test/core/behaviors/case/test_case_proposal_received_tree.py`.
    stories:
    - story_2022_012
    - story_2022_046
    adr:
    - ADR-0023
  - id: CP-05-002
    priority: MUST
    kind: protocol
    statement: >-
      The case-actor service MUST evaluate each `Create(CaseProposal)` it receives and
      either accept or reject the proposal, emitting an `Accept(CaseProposal)` or
      `Reject(CaseProposal)` activity accordingly.
    rationale: >-
      A report receiver that sends a proposal treats the case as absent until the answer
      comes (PCR-01-003, CP-06-003). If the case-actor service stays silent, the
      receiver waits until its deadline (CP-05-007). Each proposal needs a decision
      because the service can refuse one, for example a proposal for a fully closed case
      (CP-05-008).
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm `CreateCaseProposalReceivedUseCase`
      evaluates a proposal and emits either `Accept(CaseProposal)` or `Reject(CaseProposal)` in response.
    stories:
    - story_2022_006
    - story_2022_012
    - story_2022_101
    adr:
    - ADR-0023
  - id: CP-05-003
    priority: MUST
    kind: protocol
    statement: >-
      When accepting a proposal, the case-actor service MUST send two activities in
      sequence: first `Accept(CaseProposal)` (with the `CaseProposal`, inline or by
      reference, as `object`), then `Create(VulnerabilityCase)` (with `actor` set to the
      case-actor URI, `context` set to the URI of the new `VulnerabilityCase`, and
      `inReplyTo` set to the URI of the `Accept(CaseProposal)` activity).
    rationale: '`Accept(CaseProposal)` acknowledges the report receiver''s proposal. `Create(VulnerabilityCase)` with `actor=case-actor`
      preserves AS2 "I created this" semantics: only the authoritative creator MUST be the `actor` of a `Create` activity.
      `context` MUST be the case URI (consistent with all other case-scoped activities; required for inbox deferral routing).
      `in_reply_to` carries the causal antecedent (the Accept URI) in the AS2-correct field for responses.
      See ADR-0045.'
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py::TestCaseProposalRoundTrip::test_case_actor_sends_accept_and_create_case`
      confirm the two-activity sequence with correct `actor`, `context`, and `in_reply_to` on `Create(VulnerabilityCase)`.
    stories:
    - story_2022_012
    - story_2022_016
    adr:
    - ADR-0023
    - ADR-0045
  - id: CP-05-004
    priority: MUST
    kind: protocol
    statement: >-
      When rejecting a proposal, the case-actor service MUST send `Reject(CaseProposal)`
      with the `CaseProposal`, inline or by reference, as `object`.
    rationale: >-
      The `Reject` is how the report receiver learns that no case will be created for
      its proposal, so it can stop waiting (CP-06-004). The `object` names which
      proposal the answer is for, because one receiver can have more than one proposal
      open.
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_admission.py` confirm the reject path emits
      `Reject(as_CaseProposal)` with the proposal as `object_`.
    stories:
    - story_2022_006
    - story_2022_016
    adr:
    - ADR-0023
  - id: CP-05-009
    priority: MUST
    kind: project
    statement: This codebase MUST carry the `as_CaseProposal` inline as the `object_` of the `Accept(as_CaseProposal)`
      of CP-05-003 and of the `Reject(as_CaseProposal)` of CP-05-004, and the inline object MUST survive the outbox
      store round-trip rather than dehydrating to a bare URI.
    rationale: >-
      CP-05-003 and CP-05-004 allow the proposal inline or by reference; this item
      states how this codebase meets them (MS-12-010). The report receiver reads the
      report from the proposal in the answer to find its pending request (CP-06-003),
      and this codebase dereferences only the few references AKM-05-007 lists. So the
      proposal travels inline and stays inline through the outbox store. This is a
      prototype choice, not a protocol rule.
    verification: '`test/core/use_cases/received/test_case_proposal.py::TestCreateCaseProposalReceivedUseCase::test_execute_creates_case_and_queues_activities`
      confirms the accept path emits `Accept(as_CaseProposal)` whose `object_` is the typed proposal, not a bare URI string;
      unit tests in `test/core/behaviors/case/test_case_proposal_admission.py` confirm the reject path emits
      `Reject(as_CaseProposal)` with the proposal object embedded inline as `object_`; and adapter tests in
      `test/adapters/driven/trigger_activity_adapter/test_cases.py` confirm the inline object survives the store round-trip
      rather than dehydrating to a bare URI.'
    relationships:
    - rel_type: implements
      spec_id: CP-05-003
    - rel_type: implements
      spec_id: CP-05-004
  - id: CP-05-005
    priority: MUST
    kind: protocol
    statement: >-
      The case-actor service MUST queue `Accept(CaseProposal)` and
      `Create(VulnerabilityCase)` for an accepted proposal together or not at all, and
      MUST NOT send the `Accept` without the `Create`. Once queued, each one MUST be
      retried until it is delivered or its delivery attempts are exhausted (OX-13). The
      `Accept` is irrevocable once sent: a retry or a re-send MUST carry the same
      `Accept` under its original identifier, never a second one (CP-05-006).
    rationale: >-
      The two sends are not atomic on the network, so they are made atomic where they
      are queued: an `Accept` with no `Create` behind it tells the report receiver of a
      case nothing announces. Once both are queued, the outbox retries each one, so a
      failed `Create` needs no retry of its own. A second `Accept` reads as a second,
      independent decision.
    verification: >-
      The `Accept`, the `Create` and the case commit in one DataLayer transaction
      (ADR-0146, CLP-07-015, CP-09-009). A `Create` that cannot be queued rolls back the
      `Accept` with it, so no `Accept` is ever sent without its `Create`:
      `test/core/behaviors/case/test_case_proposal_received_tree.py::TestCreateCaseProposalReceivedBTCreateWiring::test_a_failed_create_emit_rolls_back_the_accept`
      pins that. After the commit, a `Create` whose first delivery attempt fails
      is retried by the outbox and delivered, with no marker involved:
      `TestCreateCaseProposalReceivedBTCreateWiring::test_a_failed_first_delivery_of_the_create_is_retried_by_the_outbox`.
      The Create's id is derived from the proposal, so a redelivery queues no
      second `Create(VulnerabilityCase)`; `TestARedeliveryAnnouncesTheCaseOnce`
      pins this after a late-tree failure and after a full success (#4146).
    stories:
    - story_2022_012
    adr:
    - ADR-0080
  - id: CP-05-006
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST handle a duplicate `Create(CaseProposal)` idempotently: if the
      same proposal (the same proposal identifier) has already been accepted, it MUST
      re-send the stored `Accept(CaseProposal)` unchanged, with its original identifier, and
      MUST NOT create a second `VulnerabilityCase`. When that case is fully closed (its
      ledger holds the CASE_MANAGER's own RM.CLOSED status entry, CM-23-013), it MUST
      instead answer with `Reject(CaseProposal)`
      and MUST NOT commit any `CaseLedgerEntry` for the case or change its state
      (CM-23-013).
    rationale: >-
      A duplicate proposal is the only signal the CASE_MANAGER gets that its acceptance
      was lost, so the answer to it is how the proposer recovers. The stored original,
      sent again unchanged (VM-08-003), reads as the first acceptance arriving late. A
      new `Accept` reads as a second, independent decision, which CP-05-005's
      irrevocability rule forbids.
    note: >-
      Raised from SHOULD to MUST and changed from "a new Accept" to the stored original
      by ADR-0080 (CONCERN-2367). The duplicate is keyed on the proposal, not the report:
      the report identifier is chosen by the sender, and a proposal under a new identifier
      is a new ask the requester is tracking separately, so the stored `Accept` for the old
      one would answer a proposal the requester may already have expired. A new proposal
      that names an already-accepted report is governed by CP-05-008 (#3977).
      The closed-case exception follows CM-23-013: the stored `Accept` would reach the
      accept path, which writes to the case. The `Reject` declines only the re-delivery; it
      does not revoke the stored `Accept` (CP-05-005), and the case that `Accept` created
      still exists, closed. It cannot be read as a reversal: the re-delivering proposer
      already holds the `Accept`, and the `Reject` tells it only that nothing more will be
      done for the proposal. That proposer is usually the Case Owner who closed the case;
      after an ownership transfer it may be a former owner, and the reading is the same
      (#4464). Whether a closed case can be reopened, or a new case created for its report,
      is the reopen design (#3066), not this requirement.
    verification: A duplicate `Create(as_CaseProposal)` after acceptance produces an outbound `Accept(as_CaseProposal)`
      identical to the stored original including its `id`, and no second `VulnerabilityCase`. A duplicate after the case is
      fully closed produces `Reject(as_CaseProposal)`, no outbound `Accept`, no new `CaseLedgerEntry` for the case, and no
      change to case or participant state.
    adr:
    - ADR-0080
    relationships:
    - rel_type: refines
      spec_id: ASK-08-001
    - rel_type: depends_on
      spec_id: CM-23-013
    lint_suppress:
    - missing_story_reference
  - id: CP-05-007
    priority: MUST
    kind: protocol
    statement: >-
      A report receiver that has sent `Create(CaseProposal)` and received neither
      `Accept(CaseProposal)` nor `Reject(CaseProposal)` by the proposal's deadline MUST
      treat the proposal as expired and MUST NOT continue waiting indefinitely.
    rationale: >-
      Without a deadline, a lost `Accept` stops the handshake for good, because no party
      waits with a timeout. The proposal is an ask (ASK-01-001), so it carries a
      deadline (ASK-03-004) and the report receiver records it with its other
      outstanding asks (ASK-04-001). That record belongs to the actor, so it works
      before a case exists. To propose again is a new decision, not an automatic retry
      (ASK-05-004), and a repeated proposal is also how the CASE_MANAGER gets a chance
      to answer again (CP-05-006).
    verification: With no reply recorded past the proposal's deadline, the receiver's proposal register entry is expired and
      the receiver emits no further activity until a behaviour decides to re-propose.
    adr:
    - ADR-0080
    relationships:
    - rel_type: depends_on
      spec_id: ASK-05-001
    lint_suppress:
    - missing_story_reference
  - id: CP-05-008
    priority: MUST
    kind: protocol
    statement: >-
      A `Create(CaseProposal)` under a new proposal identifier is a new request even
      when it names a report that already has a case. The case-actor service MUST
      subject it to the admission decision (CP-05-002) and MUST answer it with its own
      `Accept(CaseProposal)` or `Reject(CaseProposal)`. When the proposer is that case's
      owner it MUST reuse the existing case and MUST NOT create a second
      `VulnerabilityCase`, unless that case is fully closed (its ledger holds the
      CASE_MANAGER's own RM.CLOSED status entry), in which case it MUST answer with
      `Reject(CaseProposal)` and MUST NOT commit any `CaseLedgerEntry` for the case or
      change its state (CM-23-013). For any other proposer it MUST create a separate
      case and MUST NOT add that proposer to the existing case.
    rationale: >-
      The report identifier is chosen by the sender. A reuse keyed on the report alone lets a
      proposer join another party's case by naming its report, and collapses the one-case-per-recipient
      rule (CBT-06-002) into a shared case. The proposer is the second half of the key that
      makes the reuse safe: the same proposer re-proposing after its first proposal expired
      (CP-05-007) converges on its own case, and a different proposer gets its own.
    note: >-
      A fully closed case accepts no further writes (CM-23-013, ADR-0085), so the owner's
      new proposal is declined rather than answered from the closed case; reopening it, or
      creating a fresh case for the report, is left to the reopen design (#3066, #4464).
      The record of the decline is keyed on the proposal, not the case, so writing it is
      neither a `CaseLedgerEntry` nor a change to case or participant state, and CM-23-013
      does not bar it. The case's closure is part of the admission decision: the reference
      CASE_MANAGER checks it before the `EvaluateCaseProposal` call-out point and does not
      tick that point, because no answer from it can change the `Reject`.
    verification: A second proposal from the case's owner, under a new identifier, yields a new `Accept` naming the existing
      case and no second case. A proposal for the same report from a different proposer yields a separate case owned by that
      proposer, and the first case gains no participant. A new proposal from the owner of a fully closed case yields
      `Reject(as_CaseProposal)`, no `Accept`, no new case, no new `CaseLedgerEntry` for the closed case, and no change to case
      or participant state.
    adr:
    - ADR-0080
    relationships:
    - rel_type: refines
      spec_id: CP-05-002
    - rel_type: depends_on
      spec_id: CM-23-013
    stories:
    - story_2022_006
    - story_2022_012
    - story_2022_101
  - id: CP-05-010
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on a `Create(CaseProposal)` whose proposal
      identifier it has already recorded, by admitting, declining or storing that
      proposal, only when the sender is the proposer it recorded for that
      identifier. A delivery of that identifier from any other sender MUST be
      refused, with no case created, no proposal-keyed record written and nothing
      sent. A proposal identifier it has not recorded is a new proposal, which any
      actor may send (CP-05-002).
    rationale: >-
      The sender chooses the proposal identifier, and every record the CASE_MANAGER keys
      on a proposal uses that identifier alone. If any sender could reuse an admitted
      identifier, the CASE_MANAGER would treat the delivery as a redelivery: the other
      actor could get a stray case, or a closed case's decline could be recorded under
      the first proposer's identifier.
    note: >-
      This is the sender clause for `Create(CaseProposal)` (HP-01-006). The
      proposer is the proposal's author, so the use case declares the `AUTHOR`
      kind for an actor outside any case (HP-01-009). Whether the sender must also
      be the report receiver once CaseActors are spawned is #812.
    verification: >-
      Tests marked `CP-05-010` admit, decline and close a proposal, deliver its
      identifier again from another actor, and assert `REFUSED`, no new case, no
      new or changed proposal-keyed record, and an empty outbox.
      `test/core/behaviors/test_sender_guard.py::test_author_kind_admits_only_a_proposals_recorded_proposer`
      covers a stored proposal read on its own: another sender is refused.
    stories:
    - story_2022_035
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CP-05-006
    adr:
    - ADR-0115
- id: CP-06
  title: Protocol Flow — Receiving (Report-Receiver Side)
  specs:
  - id: CP-06-001
    priority: MUST
    kind: project
    statement: An `AcceptCaseProposalReceivedUseCase` MUST be implemented on the report-receiver side to handle incoming `Accept(as_CaseProposal)`
      activities.
    rationale: >-
      The report receiver must know that the case-actor service accepted its proposal,
      so that it can match the `Create(VulnerabilityCase)` that follows to its own
      request and check its sender. The dispatcher sends each `Accept(as_CaseProposal)`
      to this use case.
    verification: Inspection of `vultron/core/use_cases/received/case_proposal.py` confirms
      `AcceptCaseProposalReceivedUseCase` is implemented with an `execute()` method.
    stories:
    - story_2022_012
    - story_2022_088
    adr:
    - ADR-0023
  - id: CP-06-002
    priority: MUST
    kind: project
    statement: A `RejectCaseProposalReceivedUseCase` MUST be implemented on the report-receiver side to handle incoming `Reject(as_CaseProposal)`
      activities.
    rationale: >-
      The report receiver must know when the case-actor service declines its proposal,
      so that it stops waiting for a case. The dispatcher sends each
      `Reject(as_CaseProposal)` to this use case.
    verification: Inspection of `vultron/core/use_cases/received/case_proposal.py` confirms
      `RejectCaseProposalReceivedUseCase` is implemented with an `execute()` method.
    stories:
    - story_2022_006
    - story_2022_088
    adr:
    - ADR-0023
  - id: CP-06-003
    priority: MUST
    kind: project
    statement: '`AcceptCaseProposalReceivedUseCase` MUST update the report receiver''s local state to reflect that the case-actor service
      has accepted the proposal (e.g., record the case-actor URI and await the subsequent `Create(VulnerabilityCase)`).'
    rationale: >-
      The report receiver holds no case until the CASE_MANAGER's
      `Create(VulnerabilityCase)` arrives (PCR-01-003). The record of the acceptance
      lets the receiver match that `Create` to its own request and check that it comes
      from the actor that accepted.
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm
      `AcceptCaseProposalReceivedUseCase` updates the receiver's local state to record the case-actor acceptance.
    stories:
    - story_2022_074
    - story_2022_088
    adr:
    - ADR-0023
  - id: CP-06-004
    priority: MUST
    kind: project
    statement: '`RejectCaseProposalReceivedUseCase` MUST update the report receiver''s local state to reflect the rejection (e.g.,
      mark the pending case as rejected and surface the rejection reason if present).'
    rationale: >-
      Without a record of the rejection, the report receiver keeps the proposal pending
      and waits for a case that will not come. The reason, when the service gives one,
      tells the receiver's operator why, so they can decide whether to propose again
      (ASK-05-004).
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm
      `RejectCaseProposalReceivedUseCase` updates the receiver's local state to reflect the rejection.
    stories:
    - story_2022_074
    - story_2022_088
    adr:
    - ADR-0023
  - id: CP-06-005
    priority: MUST
    kind: protocol
    statement: >-
      The vendor MUST record the actor it addressed a `CaseProposal` to, and MUST act on
      `Accept(CaseProposal)` or `Reject(CaseProposal)` only when the sender is that actor.
      Once a case is established for the report, a reply MUST NOT replace the trusted
      CASE_MANAGER. A reply from any other sender MUST be refused with the report's case
      link unchanged.
    rationale: >-
      The accept handler records the replying actor as the report's CASE_MANAGER, and
      routing and `Announce` trust both read that record. If the report receiver acted
      on a reply from any sender, an actor that knows a report id could redirect the
      receiver's case traffic to itself.
    verification: >-
      A test marked `CP-06-005`
      sends the Accept from an actor the proposal was not addressed to and asserts `REFUSED`
      with the trusted CASE_MANAGER unchanged.
    stories:
    - story_2022_035
    - story_2022_074
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0115
- id: CP-07
  title: Testing
  specs:
  - id: CP-07-001
    priority: MUST
    kind: project
    statement: Unit tests MUST cover pattern matching for all three `CaseProposal` extractor patterns (`CREATE_CASE_PROPOSAL`,
      `ACCEPT_CASE_PROPOSAL`, `REJECT_CASE_PROPOSAL`).
    rationale: >-
      These three patterns decide whether a proposal and its answers reach their use
      cases at all. A missing or wrong pattern sends the activity to the handling for
      unknown activities, and the proposal flow stops, so each pattern needs its own
      test.
    verification: Unit tests `test_create_case_proposal_dispatches_correctly`, `test_accept_case_proposal_dispatches_correctly`,
      and `test_reject_case_proposal_dispatches_correctly` in `test/test_semantic_activity_patterns.py` cover all three patterns.
    adr:
    - ADR-0023
  - id: CP-07-002
    priority: MUST
    kind: project
    statement: Unit tests MUST cover `CreateCaseProposalReceivedUseCase`, `AcceptCaseProposalReceivedUseCase`, and `RejectCaseProposalReceivedUseCase`
      execute() paths.
    rationale: >-
      These use cases make the decisions and state changes of the proposal flow. Tests
      of each `execute()` path check that a received proposal, acceptance or rejection
      has its required effect, which pattern tests alone cannot show.
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_received_tree.py` cover the `execute()` paths of
      `CreateCaseProposalReceivedUseCase`, `AcceptCaseProposalReceivedUseCase`, and `RejectCaseProposalReceivedUseCase`.
    adr:
    - ADR-0023
  - id: CP-07-003
    priority: MUST
    kind: project
    statement: Integration tests MUST cover the full `Create(CaseProposal)` → `Accept(CaseProposal)` + `Create(VulnerabilityCase)`
      round-trip between a report receiver and a case-actor service.
    rationale: >-
      Each side of the flow can pass its own unit tests while the two sides disagree on
      what is sent, for example on the `actor`, `context` or `inReplyTo` that CP-05-003
      requires. Only a test that runs both sides together shows that a proposal ends in
      a case the report receiver accepts.
    verification: Integration tests in
      `test/demo/test_case_proposal_round_trip.py::TestCaseProposalDemo::test_demo_round_trip`
      confirm the full
      `Create(CaseProposal)` → `Accept(CaseProposal)` + `Create(VulnerabilityCase)` round-trip completes successfully.
    adr:
    - ADR-0023
- id: CP-08
  title: Case-Actor Service URL Configuration
  specs:
  - id: CP-08-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Every actor that may propose a case for a report it receives (CP-04-001) MUST
      supply a `case_actor_service_url` value in its `ActorConfig`.
    rationale: >-
      The CaseActor service runs in its own container, with its own URL (DEMOMA-01-001).
      A sender cannot derive that URL from its own base URL: in a deployment with more
      than one container, that sends the proposal to the wrong endpoint. An actor URL is
      an opaque identifier, so nothing in it says where the service runs. This codebase
      has no way to resolve an actor id to its endpoint, so explicit configuration is
      the only correct source.
    relationships:
    - rel_type: implements
      spec_id: CP-01-005
  - id: CP-08-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `case_actor_service_url` field in `ActorConfig` MUST be a valid `HttpUrl`.
    rationale: >-
      A non-URL value cannot be used to construct a valid inbox endpoint address, so
      validation at configuration load time is required to surface errors early.
    relationships:
    - rel_type: refines
      spec_id: CP-08-001
  - id: CP-08-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Absence of `case_actor_service_url` in `ActorConfig` MUST produce a runtime
      `FAILURE` at each BT node that needs the CaseActor identity, with a clear error
      message identifying the missing configuration, not a silently mis-routed proposal.
    rationale: >-
      Silent mis-routing sends the proposal to the wrong endpoint without any
      observable error signal, making the failure hard to diagnose.
    relationships:
    - rel_type: refines
      spec_id: CP-08-001
  - id: CP-08-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `case_actor_identity()` MUST read `case_actor_service_url` from
      `ActorConfig` (via `get_config().actor.case_actor_service_url`) to derive the
      CaseActor service URL.
    rationale: >-
      One function computes the CaseActor service identity from the configured URL, so
      every node that addresses the service uses the same value, and the value never
      comes from the container's own address (CP-08-006).
    relationships:
    - rel_type: refines
      spec_id: CP-08-001
  - id: CP-08-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      A BT node MUST NOT use `server_base_url`, from the blackboard or from the
      server configuration, to construct the CaseActor identity.
    rationale: >-
      Using `server_base_url` hard-wires a co-location assumption; in a multi-container
      topology the CaseActor has its own container and URL.
    relationships:
    - rel_type: refines
      spec_id: CP-08-002
  - id: CP-08-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      In all multi-container demo scenarios, every actor that may propose a case for
      a report it receives (CP-04-001) MUST have `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL`
      set in its Docker Compose environment block (or equivalent config mechanism).
    rationale: >-
      The demo containers have no directory service to find the CaseActor service. A
      variable in each container's environment gives every actor that proposes cases the
      service URL when the container starts. It uses the same mechanism as
      `VULTRON_SERVER__BASE_URL`, so no new discovery mechanism is needed.
    relationships:
    - rel_type: refines
      spec_id: CP-08-001
  - id: CP-08-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The `VULTRON_ACTOR__CASE_ACTOR_SERVICE_URL` value MUST be the full base URL of
      the dedicated CaseActor container (e.g., `http://case-actor:7999/api/v2`).
    rationale: >-
      A partial URL or path-only value cannot be used to construct a valid inbox
      endpoint; the full base URL is required to route proposals correctly.
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
  - id: CP-08-009
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Demo scripts MUST NOT rely on `server_base_url` derivation for the CaseActor identity.
    rationale: >-
      `server_base_url` is the running container's own base URL and does not identify a
      separate CaseActor container; relying on it silently routes proposals to the wrong endpoint.
    relationships:
    - rel_type: refines
      spec_id: CP-08-003
- id: CP-09
  title: CASE_MANAGER-Authoritative Initialization on Accept(CaseProposal)
  description: >-
    Requirements for the CASE_MANAGER to perform all case initialization natively
    when accepting a CaseProposal, per ADR-0041.  These replace the
    receiver-side case-creation and prologue back-fill that ADR-0015 introduced.
  specs:
  - id: CP-09-001
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER accepts a `Create(CaseProposal)`, it MUST create
      the `VulnerabilityCase` object with `attributedTo` set to the proposing
      actor (the report receiver, who becomes the CASE_OWNER), and MUST itself be
      the `actor` of the `Create(VulnerabilityCase)` it emits. It MUST NOT set
      `attributedTo` to its own actor ID.
    rationale: >-
      `VulnerabilityCase.attributed_to` records the case owner (CM-02-008), and
      ownership checks and ownership transfer read and write it as such (MSM-07-008,
      CM-21-002). AS2's "I created this" is carried by the `actor` of `Create(X)`
      (ADR-0023), not by the created object's `attributedTo`, so the CASE_MANAGER
      creating the case and the report receiver owning it are both recorded without
      conflict (ADR-0041).
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm the created
      `VulnerabilityCase` has `attributed_to` set to the proposing actor's URI and that the emitted
      `Create(VulnerabilityCase)` has the CASE_MANAGER as `actor`.
    relationships:
    - rel_type: refines
      spec_id: CP-05-003
    - rel_type: refines
      spec_id: CM-02-008
    adr:
    - ADR-0023
    - ADR-0041
    stories:
    - story_2022_012
    - story_2022_046
  - id: CP-09-002
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER creates the `VulnerabilityCase` on proposal acceptance,
      it MUST add the report receiver as a `CASE_OWNER` participant at
      `RM.RECEIVED` and the reporter as a participant at `RM.ACCEPTED` to the
      case.
    rationale: >-
      The receiver's replica is seeded from the embedded participant objects in
      `Create(VulnerabilityCase)`.  If participants are absent at emission time
      the replica starts with no participant records and downstream operations
      that require them (e.g. embargo consent, role guards) fail.  Hard-coding
      `CVDRole.VENDOR` for the receiver additionally mislabels coordinators,
      which makes VFD fix-lifecycle checks demand a fix they never produce.
    verification: Unit tests `test_owner_participant_created` and `test_reporter_participant_created` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm both participants are seeded with correct RM states and roles.
    relationships:
    - rel_type: refines
      spec_id: CP-09-001
    stories:
    - story_2022_012
    - story_2022_013
    adr:
    - ADR-0041
  - id: CP-09-006
    priority: MUST
    kind: project
    statement: >-
      The report receiver and reporter participant records MUST be created in the
      CASE_MANAGER's DataLayer before the CASE_MANAGER emits `Create(VulnerabilityCase)`
      to the receiver.
    rationale: >-
      The receiver's replica is seeded from participant objects embedded in
      `Create(VulnerabilityCase)`; participants absent at emission time leave the
      replica without the records required for role guards and embargo consent.
    verification: Unit tests `test_owner_participant_created` and `test_reporter_participant_created` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm participants exist before `Create(VulnerabilityCase)` is emitted.
    relationships:
    - rel_type: refines
      spec_id: CP-09-002
    stories:
    - story_2022_013
    - story_2022_088
    adr:
    - ADR-0041
  - id: CP-09-007
    priority: MUST
    kind: protocol
    statement: >-
      Any additional CVD roles the report receiver holds MUST be the ones its proposal states
      in `proposerCaseRoles` (CP-01-011). The CASE_MANAGER MUST NOT take them from its own
      configuration.
    rationale: >-
      Only the report receiver knows the roles it holds; a report receiver may be a
      coordinator rather than a vendor, so role inference is unsound. The CASE_MANAGER is
      a different actor and may run elsewhere, so nothing it holds of its own says
      anything about the receiver (ADR-0133).
    verification: Unit tests `test_vendor_proposal_yields_vendor_role`, `test_coordinator_proposal_does_not_yield_vendor_role`
      and `test_case_actor_config_does_not_supply_owner_roles` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm the roles come from the proposal.
    relationships:
    - rel_type: refines
      spec_id: CP-09-002
    - rel_type: depends_on
      spec_id: CP-01-011
    adr:
    - ADR-0133
    stories:
    - story_2022_063
    - story_2022_093
  - id: CP-09-008
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: Additional CVD roles for the report receiver MUST NOT be inferred.
    rationale: >-
      Inferring roles (e.g. hard-coding `CVDRole.VENDOR`) mislabels coordinators
      and causes VFD fix-lifecycle checks to demand a fix they never produce.
    relationships:
    - rel_type: refines
      spec_id: CP-09-002
  - id: CP-09-003
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST initialize the default embargo for the new case before
      emitting `Create(VulnerabilityCase)`.
    rationale: >-
      Embargo state is protocol-significant.  Deferring initialization to the
      report receiver or to a later message would produce a window in which
      embargo-gated operations are undefined (ADR-0041).
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_received_tree.py::TestADR0041EmbargoInit::test_active_embargo_set`
      confirm the default embargo is initialized before `Create(VulnerabilityCase)` is emitted.
    relationships:
    - rel_type: refines
      spec_id: CP-09-001
    adr:
    - ADR-0041
    stories:
    - story_2022_014
    - story_2022_023
  - id: CP-09-004
    priority: MUST
    kind: protocol
    statement: >-
      The `Create(VulnerabilityCase)` activity emitted by the CASE_MANAGER
      MUST carry the case's participant records, inline or by reference, so
      that the report receiver can seed its replica's participants (CP-09-002).
    rationale: >-
      The report receiver seeds its Participant Case Replica from the
      `Create(VulnerabilityCase)`, and it cannot read the CASE_MANAGER's store
      (PCR-01-003). Without the participant records, the replica starts with no
      participants, and checks that need them, such as role checks and embargo consent,
      fail.
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm `Create(VulnerabilityCase)`
      carries the case's participant objects; `test_owner_participant_created` verifies the owner's `CaseParticipant` is present.
    relationships:
    - rel_type: refines
      spec_id: CP-09-002
    stories:
    - story_2022_013
    - story_2022_045
    adr:
    - ADR-0041
  - id: CP-09-010
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST embed the participant objects of the CASE_MANAGER's
      `Create(VulnerabilityCase)` inline, not as bare ID strings, so that the
      report receiver's `CreateCaseReceivedUseCase` can seed its local
      participant records without a DataLayer round-trip to the CASE_MANAGER.
    rationale: >-
      CP-09-004 allows participant records inline or by reference; this item states how
      this codebase meets it (MS-12-010). This codebase dereferences only the few
      references AKM-05-007 lists, so it embeds the participants inline.
      `store_embedded_participants` seeds the receiver's replica from them and skips a
      bare id, so bare ids would leave the replica with no participant records, and role
      checks would fail. This is a prototype choice, not a protocol rule.
    verification: Unit tests in `test/core/behaviors/case/test_case_proposal_received_tree.py` confirm `Create(VulnerabilityCase)`
      embeds participant objects inline.
    relationships:
    - rel_type: implements
      spec_id: CP-09-004
    adr:
    - ADR-0041
  - id: CP-09-005
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection of `receive_report_case_tree` confirms it stores the inbound report,
      writes a pending `VultronReportCaseLink` and sends `Create(as_CaseProposal)`
      without creating a `VulnerabilityCase` in the receiver's DataLayer.
    statement: >-
      The report receiver MUST NOT create a `VulnerabilityCase` object in its
      own DataLayer before receiving `Create(VulnerabilityCase)` from the
      CASE_MANAGER.  The receiver's `receive_report_case_tree` MUST store the
      inbound report and write a pending `VultronReportCaseLink`, then send
      `Create(as_CaseProposal)` and wait.
    rationale: >-
      A `VulnerabilityCase` that the report receiver creates for itself before the
      CASE_MANAGER answers is a second case object with no authority. The two copies
      then need extra work to reconcile them, such as a node that writes the missing
      ledger entries afterwards. The CASE_MANAGER creates the one authoritative case
      (ADR-0041), so the receiver waits for it.
    relationships:
    - rel_type: refines
      spec_id: CP-09-001
    adr:
    - ADR-0041
  - id: CP-09-009
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER accepts a `Create(CaseProposal)`, it MUST enqueue
      `Accept(CaseProposal)` and `Create(VulnerabilityCase)` before it fans out
      any `Announce(CaseLedgerEntry)` for the new case. The canonical ledger
      entries that record the initialization are committed after the
      `Create(VulnerabilityCase)` is queued, so that every recipient holds the case
      object before its first ledger entry arrives.
    rationale: >-
      The outbox is FIFO (OX-01-002), so the order of the queue is the order on the
      wire. If a ledger entry is committed before the `Create` is queued, its `Announce`
      reaches each recipient before the case does. Each recipient then holds an entry
      for a case it does not have and takes the SYNC-15 path for such entries (hold the
      entry, `Reject`, replay from the genesis entry), while the `Create` waits behind
      the whole fan-out. That path, meant for recovery, would then run for every case
      creation and delay the `Create`. This is CM-14-011's rule applied to the
      CASE_MANAGER path: the receiver must hold the case object before any fan-out that
      references it. It is also SYNC-09-002's order: the entries record a case whose
      creation was sent, and only the `Announce(CaseLedgerEntry)` fan-out follows the
      commit. The create-case trigger uses the same order. On both paths, the case, its
      records, the queued `Accept` and `Create`, and every creation entry are written in
      one DataLayer transaction (ADR-0146). If any creation entry fails, all of them
      roll back before delivery is told of either activity (DL-02-004, CLP-07-013). If
      the `Create` were held back until after the commit, the genesis entry's fan-out
      would go ahead of it, which is the path this rule prevents.
    verification: >-
      `test/core/behaviors/case/test_case_proposal_received_tree.py::test_accept_and_create_are_queued_before_any_ledger_fanout`
      runs the accept tree with a real sync adapter and asserts the outbox order is
      Accept, Create, then every Announce;
      `test_a_genesis_commit_failure_queues_neither_accept_nor_create` asserts a
      failed genesis leaves a non-APPLIED verdict, an empty outbox and no case,
      and `TestADR0041GenesisCommitFailure::test_each_creation_entry_that_fails_leaves_nothing_of_the_case`
      fails each creation entry in turn and asserts nothing of the case is kept.
    relationships:
    - rel_type: refines
      spec_id: CP-05-003
    - rel_type: depends_on
      spec_id: CM-14-011
    - rel_type: depends_on
      spec_id: OX-01-002
    adr:
    - ADR-0041
    - ADR-0119
    stories:
    - story_2022_013
    - story_2022_088
