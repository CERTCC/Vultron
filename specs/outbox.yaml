id: OX
title: Outbox
description: >-
  Requirements for actor outboxes, which hold response activities generated by handlers.
  Covers outbox structure, population, delivery, local and federated dispatch, idempotency,
  outbound reference dehydration, and outbox addressing rules.
scope:
- prototype
- production
tags:
- messaging
groups:
- id: OX-01
  title: Outbox Structure
  specs:
  - id: OX-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Each actor MUST have an outbox collection
    rationale: >-
      ActivityPub gives each actor an outbox, and Vultron delivers every outbound
      activity from it. The outbox holds an activity until its delivery succeeds or
      fails for good. Thus every actor that sends activities must have one.
  - id: OX-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Outbox MUST preserve insertion order (FIFO)
    rationale: >-
      Recipients apply some activities in order, for example ledger entries (OX-01-005).
      If the outbox does not keep the order in which the actor queued its activities,
      delivery cannot keep that order either.
  - id: OX-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Activities added to outbox MUST be persisted to DataLayer immediately
    rationale: >-
      An activity that is queued only in memory is lost when the process stops, and its
      recipients never receive it. When the outbox entry is in the DataLayer at once, a
      restart can continue delivery from the stored queue.
    adr:
    - ADR-0012
  - id: OX-01-004
    priority: MUST
    kind: project
    statement: >-
      At most one drain of an actor's outbox MUST run at a time. A drain requested while
      another is draining the same outbox MUST wait for it (or be satisfied by it) rather
      than pop rows from the same queue concurrently.
    rationale: >-
      The background task of each inbound activity and the OutboxMonitor can each start
      a drain of the same outbox. Each concurrent drain pops the next row and waits for
      its POST. Thus rows complete delivery in an order that has no relation to their
      enqueue order. One drain at a time keeps the FIFO order of OX-01-002 at the
      recipient. See ADR-0112.
    verification: >-
      `test/adapters/driving/fastapi/test_outbox_handler_lanes.py` runs two drains of one
      outbox concurrently and asserts per-recipient enqueue order and that the second drain
      pops nothing while the first holds the outbox; the architecture ratchet
      `test/architecture/test_outbox_drain_under_actor_lock.py` pins that every drain enters
      through `outbox_handler` and its lock.
    relationships:
    - rel_type: implements
      spec_id: OX-01-002
    adr:
    - ADR-0112
  - id: OX-01-005
    priority: MUST
    kind: project
    statement: >-
      Delivery MUST preserve enqueue order per recipient: for any two queued activities
      that share a recipient, the earlier-enqueued one MUST have completed its delivery
      attempt to that recipient before the later one is attempted.
    rationale: >-
      A ledger fan-out is one Announce(CaseLedgerEntry) row per participant, and a replica
      that receives entry N+1 before entry N buffers a forward gap and sends a
      Reject(CaseLedgerEntry) (SYNC-14-002), which the CASE_MANAGER answers with a
      full-suffix replay into the same outbox. Per-recipient order at delivery is the
      property the ledger transport actually needs; order *across* recipients is not.
      See ADR-0112 (docs/adr/0112-per-recipient-ordered-outbox-delivery.md).
    verification: >-
      `test/adapters/driving/fastapi/test_outbox_handler_lanes.py` asserts that rows to one
      recipient complete in enqueue order under concurrent drains and that a row addressed
      to two recipients waits for the earlier row in each of its lanes.
    relationships:
    - rel_type: refines
      spec_id: OX-01-002
    adr:
    - ADR-0112
  - id: OX-01-006
    priority: MUST
    kind: project
    statement: >-
      An actor's outbox MUST NOT have more than one delivery in flight to the same
      recipient at a time. Deliveries to distinct recipients MAY proceed concurrently.
    rationale: >-
      One in-flight delivery per (actor, recipient) is how OX-01-005 is enforced without
      falling back to a single serial drain, in which one slow or unreachable recipient
      (a 30 s POST timeout, SYNC-05-004) would hold up every other recipient's rows.
      See ADR-0112 (docs/adr/0112-per-recipient-ordered-outbox-delivery.md).
    verification: >-
      `test/adapters/driving/fastapi/test_outbox_handler_lanes.py` asserts at most one
      in-flight delivery per recipient and that a slow recipient does not delay the row
      queued behind it for a different recipient.
    relationships:
    - rel_type: implements
      spec_id: OX-01-005
    adr:
    - ADR-0112
- id: OX-02
  title: Outbox Population
  specs:
  - id: OX-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Handlers that generate response activities MUST add them to the actor's outbox
    rationale: >-
      The outbox is the only path by which an activity leaves an actor (OX-12-001). A
      response that a handler does not queue there never reaches its recipient. The
      outbox also cannot retry it or record a failed delivery.
  - id: OX-02-002
    priority: MUST
    kind: foundation
    statement: Each outbox activity MUST conform to ActivityStreams 2.0 structure
    rationale: >-
      Recipients are ActivityStreams 2.0 (AS2) and ActivityPub peers. A peer routes a
      body by its AS2 `type`, and it reads the terms of the body through `@context`. A
      body without that structure does not mean anything to the recipient.
    verification: >-
      `test_handle_outbox_item_delivers_an_activitystreams_activity` in
      `test/adapters/driving/fastapi/test_outbox_handle_item_delivery.py` confirms
      that the body the outbox delivers for a factory-built activity carries the
      ActivityStreams `@context` and a `type`, and parses as an ActivityStreams
      activity.
    tags:
    - as2
  - id: OX-02-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      When an adapter enqueues an activity on behalf of a specific emitting actor, it MUST
      enqueue against that actor's outbox explicitly (e.g. record_outbox_item(actor_id, ...)),
      NOT via a scope-dependent append that targets the DataLayer instance's own actor scope.
      A scope-dependent append is correct only when the DataLayer is guaranteed to be scoped
      to the emitting actor.
    rationale: >-
      An activity that is queued in the wrong actor's outbox goes out from the wrong
      actor, or it does not go out. For example, the CASE_MANAGER then does not receive
      a participant's Reject(CaseLedgerEntry), and the participant's replica stays out
      of step. See ADR-0037.
    adr:
    - ADR-0037
- id: OX-03
  title: Outbox Delivery
  specs:
  - id: OX-03-001
    priority: MUST
    kind: foundation
    statement: Activities in an actor's outbox MUST be delivered to recipient inboxes
    rationale: >-
      ActivityPub's delivery rule: a server posts each activity in an actor's outbox
      to the inbox of every addressee. Vultron inherits it.
    verification: Integration tests in `test/demo/` confirm that activities queued in an actor's outbox are delivered
      via HTTP POST to each recipient's inbox endpoint.
    stories:
    - story_2022_041
    - story_2022_042
    - story_2022_043
    - story_2022_044
    - story_2022_098
    - story_2022_099
    - story_2022_100
    tags:
    - activitypub
  - id: OX-03-002
    priority: MUST
    kind: project
    statement: Delivery MUST occur after the generating handler completes
    rationale: >-
      A response activity reports the result of the handler that made it. If delivery
      starts before that handler completes, a recipient can receive a response for work
      that later fails or changes.
    verification: Integration tests confirm that outbox delivery does not begin until the inbox handler returns, and
      the HTTP response is sent before delivery is attempted.
  - id: OX-03-003
    priority: MUST_NOT
    kind: project
    statement: Delivery MUST NOT block inbox HTTP response
    rationale: >-
      The sender's POST waits for the inbox response. If that response waited for the
      deliveries of the receiving actor, one slow or unreachable recipient would slow
      every sender whose delivery waits behind it, and their POST requests could time
      out. Thus the inbox answers 202 first (IE-07-002) and delivers later.
    verification: >-
      Inspection of `post_actor_inbox` in
      `vultron/adapters/driving/fastapi/routers/actors/_routes.py` confirms the endpoint
      schedules `run_inbox_pipeline`, which runs the handlers and then drains the outbox,
      with `BackgroundTasks.add_task` and returns without awaiting it;
      `test/adapters/driving/fastapi/test_inbox_orchestration_offloop.py::test_event_loop_keeps_serving_while_a_payload_is_processed`
      confirms the inbox keeps serving requests while a payload is processed.
- id: OX-04
  title: Local Delivery
  specs:
  - id: OX-04-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'For actors on the same server, delivery MUST use HTTP POST to the recipient actor''s inbox endpoint ({actor}/inbox/) in the same manner as remote delivery, per OX-12-001. Direct DataLayer writes that bypass the HTTP path are prohibited.'
    rationale: >-
      A co-located actor is a separate actor, and it knows only the activities that
      arrive at its inbox (AKM-01). A direct DataLayer write skips the inbox checks. It
      also makes local delivery behave differently from remote delivery, and that hides
      delivery defects (OX-12-005).
    relationships:
    - rel_type: refines
      spec_id: OX-12-001
  - id: OX-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Local delivery MUST persist the inbox update immediately
    rationale: >-
      A recipient must not lose an activity that was delivered to it. The sender has the
      202 answer and does not send the activity again. If the inbox update stays only in
      memory, a restart loses the activity.
- id: OX-05
  title: Federation Delivery
  specs:
  - id: OX-05-001
    priority: MAY
    kind: project
    statement: >-
      For remote actors, the system MAY deliver via HTTP POST to the remote actor's inbox
      URL
    rationale: >-
      A remote actor can receive an activity only at its inbox URL, and HTTP POST is the
      ActivityPub way to deliver there. The rule is MAY because federation with other
      servers is a production capability that the prototype does not need.
    scope:
    - production
  - id: OX-05-002
    priority: SHOULD
    kind: project
    statement: Remote delivery failures SHOULD be logged at WARNING level and retried
    rationale: >-
      A remote server can be unreachable for a short time. A retry delivers the activity
      when the server is available again. The WARNING tells the operator that delivery
      to that server has a problem. A failed delivery with no log and no retry is lost
      with no trace.
    scope:
    - production
- id: OX-06
  title: Delivery Idempotency
  specs:
  - id: OX-06-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Outbox delivery MUST be idempotent
    rationale: >-
      A delivery can occur more than once. The outbox retries after a failure, and a
      retry can rebuild an activity that was already sent. Idempotent delivery keeps a
      repeat from changing the state of the recipient a second time. The receiver drops
      an activity whose id it already holds (ID-02-001).
    relationships:
    - rel_type: depends_on
      spec_id: ID-02-001
  - id: OX-06-002
    priority: MUST
    kind: project
    statement: >-
      An actor's outbox MUST hold at most one pending entry per activity id: queuing an
      activity whose id is already pending in that outbox MUST NOT add a second entry, and the
      queuing operation MUST report whether it added one. An id that is no longer pending MUST be
      queued again when asked, under the same id. An emitting tree whose retry rebuilds its
      activity under the id the earlier attempt used therefore sends that activity once.
    rationale: >-
      A retry after a partial failure must not send an act twice. When the retry rebuilds the
      activity under its first id (ID-04-004), the outbox alone can tell it is already on its way,
      whatever the order of commit and send (ADR-0119). The check is in the queue
      operation so no caller can omit it. A delivered id is queued again and the receiver drops it
      by id (ID-02-001), as for a re-sent response (CP-05-006).
    verification: >-
      `test/adapters/driven/test_sqlite_inbox_outbox.py::test_the_store_refuses_a_second_pending_outbox_row`
      inserts a raw duplicate outbox row and asserts the store's partial UNIQUE index rejects it;
      `test/adapters/driven/test_sqlite_inbox_outbox.py::test_a_store_without_the_outbox_index_is_refused_at_open`
      asserts a store lacking that index is refused when opened;
      the remainder of `test/adapters/driven/test_sqlite_inbox_outbox.py` asserts a pending id is
      not queued again, also by concurrent writers on a file-backed store, that a popped id is, and
      that the enqueue callback fires only for a new row;
      `test/core/use_cases/triggers/test_actor_triggers.py::TestInviteRetrySendsOnce` retries
      the owner-direct invite after an attempt that queued its Invite without committing it and
      asserts one outbox entry and one ledger entry;
      `test/core/behaviors/sync/nodes/test_chain_timestamp_guard.py::test_create_log_entry_node_reuses_a_recorded_entry_past_the_staleness_window`
      asserts the rebuilt act reuses its recorded entry however old its claimed time.
    relationships:
    - rel_type: implements
      spec_id: OX-06-001
- id: OX-07
  title: Outbound Body Sealing and Relay
  specs:
  - id: OX-07-001
    priority: MUST
    kind: project
    statement: >-
      Every adapter that persists an outbound activity for its actor's outbox MUST seal the
      activity's body — the factory object's own JSON dump — in that actor's store at the moment
      it persists the activity, and the outbox handler MUST deliver that sealed body exactly as
      sealed. The handler MUST NOT read the activity record back to build the payload, MUST NOT
      dehydrate, expand, hydrate, re-type, or re-serialise any field of the body, and MUST drop
      (with an ERROR log) a queued id for which no sealed body exists rather than deliver a
      reconstruction.
    rationale: >-
      The activity record cannot serve as the delivery body. Persistence stores
      reference fields as ids, and a read-back fills them from what the store holds at
      that time. Thus a re-read is a reconstruction, and it can differ from the body
      that the ledger records as `payloadSnapshot` (VM-08-003). For example, the case
      stub in an Invite can reach the invitee as a bare URI. The factory sets the shape
      of each reference field, so the handler sends the sealed body as it is. See
      ADR-0074.
    relationships:
    - rel_type: implements
      spec_id: VM-08-003
    verification: >-
      `test/adapters/driving/fastapi/test_outbox_sealed_body_delivery.py` seals through the real
      adapter and asserts the emitter receives the identical text;
      `test/adapters/driven/trigger_activity_adapter/test_sealed_body_audit.py` checks every
      `TriggerActivityPort` method seals what it returns.
    adr:
    - ADR-0074
  - id: OX-07-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      The `object` field of an outbound activity MUST NOT be dehydrated to a reference at any
      stage — construction, persistence of the sealed body, or delivery. A sealed body whose
      `object` is a bare URI or `as_Link` on an initiating activity is a factory defect that the
      handler refuses (AKM-03-002), never repairs.
    rationale: >-
      A recipient needs the full `object` to act on an initiating activity. A bare URI
      makes it fetch the object from the sender, and the fetched copy can differ from
      the object at send time. The factory must put the object inline. If the handler
      repaired the reference, it would hide the factory defect.
    relationships:
    - rel_type: refines
      spec_id: AKM-03-001
- id: OX-08
  title: Outbox Addressing
  specs:
  - id: OX-08-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Every activity posted to an actor's outbox MUST have a non-empty `to:` field
    rationale: >-
      Vultron exchanges are direct messages; there are no public or broadcast activities in
      the protocol
  - id: OX-08-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The `to:` field on outbound activities MUST be a list containing at least one URI string
    rationale: >-
      The outbox handler reads `to:` to find the recipients. A list of URI strings is
      the one shape that it reads. A list with no entry names no recipient, so the
      activity cannot go anywhere.
  - id: OX-08-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `handle_outbox_item` MUST raise `VultronOutboxToFieldMissingError` when it detects a
      missing or empty `to:` field
    rationale: >-
      An activity with no recipient cannot be delivered, and a silent skip hides the
      factory defect that made it. A specific error lets the outbox handler move the
      activity to the dead-letter store at once (OX-13-013). It also lets tests check
      for the defect.
  - id: OX-08-004
    priority: SHOULD
    kind: project
    statement: >-
      If an outbound activity carries non-empty `cc:`, `bto:`, or `bcc:` fields,
      the outbox handler SHOULD log a WARNING. There is no exemption.
    rationale: >-
      Vultron direct messages name every recipient in `to:` (OX-08-001). The `cc:`,
      `bto:` and `bcc:` fields have no handler semantics (HP-10-001), so a value there
      is most likely a factory defect. An emitting tree commits its own ledger entry
      (CLP-10-027, CLP-10-013), so no outbound activity has a reason to copy its own
      sender. See ADR-0109.
    adr:
    - ADR-0109
- id: OX-09
  title: Outbox Monitor Efficiency
  rationale: >-
    Fixed-interval polling grows O(N) with actor count: every tick iterates all registered
    actor DataLayers regardless of queue depth. Event-driven wakeup eliminates idle
    iteration cost and scales to large deployments.
  specs:
  - id: OX-09-001
    priority: SHOULD
    kind: project
    statement: >-
      The outbox monitor SHOULD use event-driven wakeup so that it drains actor outboxes
      immediately when an activity is enqueued, rather than waiting for the next fixed
      polling interval
    rationale: >-
      Reduces median delivery latency from up to poll_interval to near-zero at no extra
      CPU cost
  - id: OX-09-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Even when event-driven wakeup is enabled, the outbox monitor MUST retain a
      safety-net polling interval so that outbox items are eventually delivered even if
      an enqueue notification is missed
    rationale: >-
      An enqueue notification can be lost, for example when the callback fails. Without
      a poll, a queued activity then waits until the next enqueue for the same actor,
      which may not come. The poll limits that wait to one poll interval.
  - id: OX-09-003
    priority: SHOULD
    kind: project
    statement: >-
      The enqueue notification mechanism SHOULD be injected into the DataLayer adapter as
      a callback so that the DataLayer does not import from the monitor layer
    rationale: Preserves the hexagonal architecture boundary between driven adapters
  - id: OX-09-004
    priority: SHOULD
    kind: project
    statement: >-
      The outbox monitor SHOULD log the total number of pending outbox items across all
      actors at DEBUG level on each drain pass
    rationale: >-
      The pending count shows an operator whether the outboxes drain or grow. At DEBUG
      level it does not add noise to normal operation, and it is available when the
      operator looks for a delivery problem.
  - id: OX-09-005
    priority: SHOULD
    kind: project
    statement: >-
      If any single actor's outbox depth exceeds a configurable threshold, the outbox
      monitor SHOULD emit a WARNING-level log entry identifying the actor and depth
    rationale: >-
      A deep outbox shows that delivery to some recipient fails or is slow. The WARNING
      names the actor, so the operator can find the problem before the queue grows more.
      A configurable threshold lets each deployment set its own normal load.
- id: OX-10
  title: Signed Remote Delivery
  scope:
  - production
  rationale: >-
    The `proof` inside each activity shows who wrote it (SIG-01-001), but not which
    server delivered the request. Production federation adds HTTP Message Signatures so
    a recipient can authenticate the delivering server, as mainstream ActivityPub
    servers expect. Prototype delivery (DemoHttpDeliveryAdapter) sends no HTTP
    signature.
    vultron/adapters/driven/prod_http_delivery.py is a documented stub for this capability.
  specs:
  - id: OX-10-001
    priority: SHOULD
    kind: project
    statement: >-
      For remote actor delivery, the outgoing HTTP POST SHOULD be signed using HTTP
      Message Signatures (RFC 9421) with the sending actor's private key
    rationale: >-
      Production federation sends activities to peers that the sender does not control,
      and mainstream ActivityPub servers authenticate the delivering server by its HTTP
      signature. The activity's own `proof` already shows its author (SIG-01-001); the
      HTTP signature adds who delivered it. RFC 9421 is the standard way to sign an HTTP
      message.
    scope:
    - production
  - id: OX-10-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The signing key pair MUST be per-actor and MUST NOT be shared across actors
    rationale: >-
      If two actors share a key, a signature cannot tell them apart. One actor can then
      sign activities as the other. Also, one leaked key exposes every actor that uses
      it.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: OX-10-001
  - id: OX-10-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The signed delivery adapter MUST be transport-only: it MUST NOT construct or
      inspect ActivityStreams objects; serialization happens before the payload reaches
      the adapter
    rationale: Preserves the hexagonal layer boundary
    relationships:
    - rel_type: extends
      spec_id: OX-10-001
  - id: OX-10-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Until signed delivery is implemented, the production HTTP delivery adapter MUST raise NotImplementedError
      if instantiated, so that callers receive an explicit signal rather than a silent no-op.
    rationale: >-
      A delivery adapter that does nothing loses every activity with no error. A
      NotImplementedError at once tells the caller that signed delivery does not exist
      yet. Thus nobody can use the stub as a working transport by mistake.
    scope:
    - prototype
- id: OX-11
  title: Shared-Inbox Fan-Out
  scope:
  - production
  rationale: >-
    ActivityPub shared-inbox delivers a single activity addressed to multiple local
    actors via one HTTP POST, avoiding N separate deliveries for large groups. This
    reduces network overhead for multi-party cases with many co-located participants.
    vultron/adapters/driving/shared_inbox.py is a documented stub for this capability.
  specs:
  - id: OX-11-001
    priority: MAY
    kind: project
    statement: >-
      The system MAY expose a shared inbox endpoint that accepts activities addressed
      to multiple local actors in a single HTTP request
    rationale: >-
      Shared-inbox delivery sends one POST for many local recipients, not one POST for
      each. That decreases network load for cases with many participants on one server.
      The rule is MAY because each per-actor inbox already delivers correctly, so the
      shared inbox is only an optimization.
    scope:
    - production
  - id: OX-11-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      If a shared inbox is implemented, it MUST validate the HTTP Signature on the
      inbound request before any fan-out processing
    rationale: >-
      A shared inbox delivers one request to many actors. If it starts the fan-out
      before it checks the signature, one false request reaches every addressed actor.
      When the check comes first, a false request reaches none of them.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: OX-11-001
  - id: OX-11-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      If a shared inbox is implemented, it MUST enqueue one per-actor inbox delivery
      for each addressed local actor identified in the activity to/cc fields
    rationale: >-
      Each actor processes and stores its activities separately. Thus each addressed
      local actor must receive its own inbox delivery, as if the sender had posted to it
      directly. The shared inbox then changes only the transport and not the result.
    scope:
    - production
    relationships:
    - rel_type: extends
      spec_id: OX-11-001
  - id: OX-11-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Until shared-inbox is implemented, adapters/driving/shared_inbox.py MUST raise
      NotImplementedError if instantiated, so that callers receive an explicit signal
      rather than a silent no-op
    rationale: >-
      A shared inbox that does nothing loses every activity with no error. A
      NotImplementedError at once tells the caller that the shared inbox does not exist
      yet. Thus nobody can use the stub as a working endpoint by mistake.
    scope:
    - prototype
- id: OX-12
  title: Uniform HTTP Delivery
  scope:
  - prototype
  - production
  rationale: >-
    Actors are independent federated peers. Each actor knows only the activities that
    arrive at its inbox (AKM-01). If delivery to a co-located actor used an in-process
    path, that delivery would behave differently from remote delivery. It would hide
    delivery defects, and demos would give false confidence. Thus all delivery between
    actors behaves as if every recipient were remote. See ADR-0042.
  specs:
  - id: OX-12-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      All inter-actor activity delivery MUST occur over the REST inbox/outbox HTTP API
      (HTTP POST to {actor}/inbox/).
    rationale: >-
      Each actor knows only the activities that reach its inbox (AKM-01). With one
      delivery path for every actor, the same checks apply to every activity. A delivery
      defect then shows in local tests as it does between servers. See ADR-0042.
    adr:
    - ADR-0042
  - id: OX-12-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Delivery to a co-located actor MUST use the same HTTP path as delivery to a
      remote actor.
    rationale: >-
      Uniform delivery exposes inter-actor delivery bugs that in-process shortcuts
      would mask, giving accurate confidence in demos and production. See ADR-0042.
    relationships:
    - rel_type: refines
      spec_id: OX-12-001
    adr:
    - ADR-0042
  - id: OX-12-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      There MUST NOT be an in-process delivery shortcut that bypasses HTTP for
      same-server recipients.
    rationale: >-
      An in-process shortcut makes co-located delivery behave differently from
      remote delivery, masking bugs and giving false confidence. See ADR-0042.
    relationships:
    - rel_type: refines
      spec_id: OX-12-001
    adr:
    - ADR-0042
  - id: OX-12-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The default production ActivityEmitter MUST be the HTTP delivery adapter.
    rationale: >-
      A deployment uses the default emitter when nobody configures a different one. If
      the default is not the HTTP delivery adapter, a deployment can send activities on
      a path that is not the one that the protocol uses (OX-12-001).
    adr:
    - ADR-0042
  - id: OX-12-007
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      The ASGIEmitter in-process delivery adapter MUST NOT be wired as the default
      emitter.
    rationale: >-
      Wiring ASGIEmitter as default restores the in-process shortcut prohibited by
      OX-12-001 and masks inter-actor delivery bugs. See ADR-0042.
    relationships:
    - rel_type: derives_from
      spec_id: OX-12-002
    adr:
    - ADR-0042
  - id: OX-12-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The ASGIEmitter in-process delivery adapter MUST be removed from the codebase.
    rationale: >-
      Retaining dead code invites accidental re-use and contradicts the ADR-0042
      decision to retire the in-process delivery path entirely.
    relationships:
    - rel_type: supersedes
      spec_id: ARCH-17-001
    - rel_type: supersedes
      spec_id: ARCH-17-002
    - rel_type: supersedes
      spec_id: ARCH-17-003
    - rel_type: implements
      spec_id: OX-12-006
    adr:
    - ADR-0042
  - id: OX-12-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Application code MUST NOT construct httpx.ASGITransport directly. The sole
      exception is FastAPI's TestClient, which uses ASGITransport internally to drive a
      single application's own endpoints and is not an inter-actor delivery mechanism.
    rationale: >-
      An `httpx.ASGITransport` calls an application in-process and does not use the
      network. Application code that builds one makes an in-process delivery shortcut,
      which OX-12-006 prohibits. FastAPI's TestClient is the exception because it tests
      the endpoints of one application and does not deliver between actors.
    adr:
    - ADR-0042
  - id: OX-12-009
    priority: MUST
    kind: project
    verification: >-
      `test/adapters/driven/test_delivery_inbox_url.py` asserts that the inbox a held
      profile names is posted to in place of the derived address, that only a recipient
      with no held inbox falls back to `{actor}/inbox/`, that `held_inboxes` reads the
      sender's store, and that the inbox a hosted profile states accepts a POST;
      `test_handle_outbox_item_hands_over_the_held_inbox` in
      `test/adapters/driving/fastapi/test_outbox_handle_item_delivery.py` asserts the
      outbox handler hands the held inbox to the emitter.
    statement: >-
      Delivery MUST POST to the `inbox` named by the sender's held profile of the
      recipient when that profile names one, and MUST fall back to the address
      `{actor}/inbox/` derived from the recipient's URI only when it holds no inbox for
      that recipient.
    rationale: >-
      An actor's profile states where its inbox is, and a peer on another node need
      not follow this codebase's URL layout. The derived address is a reasonable guess
      for a peer known only by URI (AKM-05-001), and is used only when nothing better
      is known (AKM-02-006, ADR-0159).
    relationships:
    - rel_type: supersedes
      spec_id: OX-12-001
    adr:
    - ADR-0159
- id: OX-13
  title: Delivery Terminal State
  rationale: >-
    Without a limit on total attempts, the outbox retries an undeliverable activity
    forever. The retries use delivery capacity, hide the first failure and give the
    operator no signal. A per-activity attempt count that persists across drain passes,
    and a dead-letter store for an activity that uses all its attempts, give a finite
    retry budget and a visible failure. See ADR-0066.
  specs:
  - id: OX-13-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Each outbox queue entry MUST track a total attempt count that is persisted across
      drain passes and incremented on every delivery failure, so that the count survives
      outbox_handler invocations and reflects the activity's cumulative delivery history.
    rationale: >-
      A count that resets at each drain pass lets an undeliverable activity retry
      forever. The count must persist and increase with each failure, so that the total
      budget (OX-13-002) can stop the retries.
    adr:
    - ADR-0066
  - id: OX-13-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The maximum total delivery attempts MUST be configurable.
    rationale: >-
      The correct number of attempts depends on the deployment: how long a recipient can
      be unavailable, and how much retry traffic is acceptable. A configurable limit
      lets each deployment set that balance without a code change.
    adr:
    - ADR-0066
  - id: OX-13-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The maximum total delivery attempts MUST have a documented default value.
    rationale: >-
      A documented default makes the system's reliability envelope observable and
      predictable without requiring explicit per-deployment configuration.
    relationships:
    - rel_type: extends
      spec_id: OX-13-002
    adr:
    - ADR-0066
  - id: OX-13-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      When an activity exhausts its total attempt budget, it MUST be moved to a
      dead-letter store.
    rationale: >-
      Moving exhausted activities to a dead-letter store preserves them for operator
      inspection and provides an observable signal for the terminal failure state.
    adr:
    - ADR-0066
    relationships:
    - rel_type: uses_definition
      spec_id: OX-13-002
  - id: OX-13-009
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      When an activity exhausts its total attempt budget, it MUST NOT be requeued.
    rationale: >-
      Requeuing an exhausted activity restarts the attempt counter, defeating the
      total-attempt bound and allowing indefinite retries.
    adr:
    - ADR-0066
    relationships:
    - rel_type: uses_definition
      spec_id: OX-13-002
  - id: OX-13-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      On activity exhaustion, the system MUST log at ERROR level, including the
      activity ID, the recipient(s) that could not be reached, and the total number of
      attempts made, so that the operator has a visible signal of the terminal failure.
    rationale: >-
      A dead-lettered activity means that a recipient did not receive an event. The
      ERROR log is the signal to the operator. The activity id, the unreached recipients
      and the attempt count let the operator find the activity and decide what to do.
    adr:
    - ADR-0066
    relationships:
    - rel_type: uses_definition
      spec_id: OX-13-002
  - id: OX-13-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Dead-letter entries MUST be readable from the DataLayer so that operators can
      inspect exhausted activities without access to application logs.
    rationale: >-
      Logs can rotate, and an operator can have no access to them. Entries in the
      dead-letter store stay in the DataLayer, so an operator or a tool can list and
      inspect the exhausted activities.
    adr:
    - ADR-0066
  - id: OX-13-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      HTTP 4xx responses from a recipient inbox MUST be treated as terminal delivery
      failures: the activity MUST NOT consume inner retry slots for a 4xx response.
      Only HTTP 5xx responses, connection errors, and timeouts are retryable.
    rationale: >-
      A 4xx response is a deterministic refusal, for example 422 for a body that fails
      validation. The same body gets the same response each time. A retry uses the retry
      budget and adds load on the recipient, but it does not deliver the activity. See
      ADR-0066.
    adr:
    - ADR-0066
  - id: OX-13-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      A single failing activity in an actor's outbox MUST NOT abort delivery of other
      activities in the same drain pass.
    rationale: >-
      A drain pass delivers many activities, and some of them are ledger entries that
      participants wait for. If one failing activity stops the pass, the healthy
      activities behind it wait, and participants can reach a timeout. Thus the failure
      of an activity must stay with that activity. See ADR-0066.
    adr:
    - ADR-0066
  - id: OX-13-010
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Each activity's per-pass error count MUST be tracked independently.
    rationale: >-
      Independent per-activity tracking prevents a single bad activity from consuming
      the shared cap and blocking delivery of healthy activities in the same pass.
    relationships:
    - rel_type: implements
      spec_id: OX-13-006
    adr:
    - ADR-0066
  - id: OX-13-011
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Hitting the per-pass cap for one activity MUST skip that activity for the current
      pass (deferring it to the next drain) without breaking the drain loop.
    rationale: >-
      Skipping rather than aborting keeps the drain loop running so that subsequent
      activities in the same pass are delivered on schedule.
    relationships:
    - rel_type: implements
      spec_id: OX-13-006
    adr:
    - ADR-0066
  - id: OX-13-012
    priority: MUST
    kind: project
    statement: >-
      When a delivery attempt fails and the activity is re-queued, every later-enqueued
      activity that shares a recipient with it MUST be re-queued behind it in enqueue
      order and MUST NOT be attempted before it in that drain pass. Activities that share
      no recipient with the failed one are unaffected.
    rationale: >-
      If a failed activity goes to the tail of one FIFO, later rows go before it. One
      transient failure on ledger entry N then delivers entry N+1 first, and each
      recipient sees a forward gap (SYNC-14) that the sender caused. When only the rows
      that share a recipient wait behind the failed row, each recipient keeps its order
      (OX-01-005), and other recipients do not wait (OX-01-006). See ADR-0112.
    verification: >-
      `test/adapters/driving/fastapi/test_outbox_handler_lanes.py` fails a row past the
      per-pass cap and asserts the row queued behind it for the same recipient is not
      attempted, the queue afterwards reads in enqueue order, a row appended during the
      stalled pass lands behind the stalled rows, and a different recipient's row is
      delivered.
    relationships:
    - rel_type: refines
      spec_id: OX-01-005
    adr:
    - ADR-0112
  - id: OX-13-013
    priority: MUST
    kind: project
    statement: >-
      When the outbox refuses an activity's sealed body before any delivery attempt (a
      `to:` naming no recipient, OX-08-003, or an `object` that is not inline,
      OX-07-002), the activity MUST be moved to the dead-letter store on that first
      refusal, with reason `undeliverable_body`, and MUST NOT be retried.
    rationale: >-
      The sealed body does not change (VM-08-003), so every retry is refused for the
      same reason. Retries spend the full attempt budget on backoff delay, and they show
      a deterministic defect as a transient failure. This is the local counterpart of
      the 4xx rule (OX-13-005).
    verification: >-
      `test/adapters/driving/fastapi/test_outbox_handler.py` queues a body with no
      recipient and a body whose `object` is a bare URI, and asserts each is
      dead-lettered with reason `undeliverable_body` after one attempt, with no backoff.
    relationships:
    - rel_type: extends
      spec_id: OX-13-008
    - rel_type: extends
      spec_id: OX-08-003
    - rel_type: extends
      spec_id: OX-07-002
    adr:
    - ADR-0066
- id: OX-14
  title: Undelivered-Activity Correlation
  description: >
    Requirements linking a permanently undelivered activity back to the canonical case
    ledger entry that recorded the event the activity carries, so that divergence
    between the canonical log and a participant's replica is observable rather than
    silent. Derived from CONCERN-2657 and ADR-0080.
  specs:
  - id: OX-14-001
    priority: MUST
    kind: architecture
    statement: >-
      A dead-lettered activity MUST be correlatable to the canonical `CaseLedgerEntry`
      whose event it carries, where such an entry exists.
    rationale: >-
      A permanently undelivered activity leaves the canonical ledger with an event that
      a participant never received. The order of the writes is correct (OX-14-002). The
      problem is that nothing links the dead-letter store (OX-13-008) to the entry that
      records the event, so nobody can detect that the replica is behind.
    verification: >-
      Given a dead-lettered activity carrying a committed event, the corresponding
      ledger entry is resolvable from the dead-letter record.
    adr:
    - ADR-0080
    - ADR-0066
    tags:
    - observability
  - id: OX-14-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A canonical `CaseLedgerEntry` commit MUST NOT be deferred until delivery of the
      corresponding outbound activity is confirmed.
    rationale: >-
      Gating the commit on delivery makes an actor's own decision history hostage to
      the network, inverts the guards-then-commit-then-effects ordering CLP-10-006
      requires, and creates an unanswerable partial-delivery question when some
      recipients succeed and others fail. Delivery confirmation is a transport-level
      receipt and is not agreement to the delivered content; the two layers stay
      separate.
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py::TestStubInviteIsRecordedAfterItIsSent`
      asserts the Invite's entry is committed in the same tree run that queues it, right
      after the outbox write, with no wait for delivery: the outbox write, and so the first
      delivery attempt, may come before the commit (SYNC-09-002), but the commit never waits
      for the attempt.
    adr:
    - ADR-0080
    - ADR-0119
    lint_suppress:
    - missing_story_reference
  - id: OX-14-003
    priority: MUST
    kind: architecture
    statement: >-
      Exhaustion of an activity's delivery budget MUST produce an observable that names
      the recipients that never received it and the canonical entry the activity was
      replicating, where one exists.
    rationale: >-
      A participant whose replica is missing an entry cannot ask for it if it does not
      know the entry exists; naming the unreached recipients is what makes targeted
      replay (SBT-03-002) possible instead of a full resynchronisation.
    verification: >-
      The exhaustion observable includes the unreached recipient identifiers and the
      associated canonical entry reference.
    adr:
    - ADR-0080
    - ADR-0066
    tags:
    - observability
