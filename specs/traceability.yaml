id: TRACE
title: Specification Traceability
description: >-
  Requirements for maintaining the traceability matrix that maps user stories to specification
  requirements, including coverage flagging and maintenance obligations.
scope:
- prototype
- production
tags:
- documentation
- tooling
groups:
- id: TRACE-01
  title: Traceability Matrix
  specs:
  - id: TRACE-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A traceability file MUST exist at `docs/reference/user_stories/traceability.md` mapping each user story
      in `docs/reference/user_stories/` to the implementing specification(s) and specific requirement
      ID(s)
    rationale: >-
      Without one map from stories to requirement IDs, nobody can tell which user needs
      the specs cover, or which stories a requirement change affects. Keeping the map in
      the docs tree publishes it next to the stories it describes.
  - id: TRACE-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      User stories without specification coverage MUST be flagged with an explicit note indicating
      they lack coverage
    rationale: >-
      An unmapped story reads the same as one whose coverage was never checked. An
      explicit note separates a known gap from an oversight and makes the gap
      searchable.
  - id: TRACE-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The traceability matrix MUST be updated when new specifications are added or existing
      requirements are significantly changed in a way that affects story coverage
    rationale: >-
      A matrix that lags the specs claims coverage the specs have dropped, or misses
      coverage they added. Updating it in the change that moves coverage keeps it
      true while the author still knows what changed.
- id: TRACE-02
  title: Maintenance
  specs:
  - id: TRACE-02-001
    priority: SHOULD
    kind: project
    statement: >-
      The traceability matrix SHOULD be reviewed and updated as part of any spec-authoring
      or user-story-authoring activity
    rationale: >-
      Spec and story authoring are when coverage changes, and the author holds the
      context then. Reviewing the matrix in the same activity costs less than a later
      audit that has to rebuild that context.
  - id: TRACE-02-002
    priority: SHOULD
    kind: project
    statement: >-
      Stories with insufficient spec coverage SHOULD be documented as incoming
      learning files in `plan/incoming/learnings/` with specific technical
      details describing the gap and concrete steps toward remediation
    rationale: >-
      A gap recorded only in the matrix says that coverage is missing, not what to do
      about it. A learning file enters the queue that `learn` turns into specs and
      Issues, so the gap reaches someone who can close it.
