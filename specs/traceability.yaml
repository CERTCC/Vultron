id: TRACE
title: Specification Traceability
description: >-
  Requirements for maintaining the traceability matrix that maps user stories to specification
  requirements, including coverage flagging and maintenance obligations.
scope:
- prototype
- production
tags:
- documentation
- tooling
groups:
- id: TRACE-01
  title: Traceability Matrix
  specs:
  - id: TRACE-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A traceability file MUST exist at `docs/reference/user_stories/traceability.md` mapping each user story
      in `docs/reference/user_stories/` to the implementing specification(s) and specific requirement
      ID(s)
    rationale: >-
      Without one map from stories to requirement IDs, nobody can tell which user needs
      the specs cover. Nobody can tell which stories a requirement change affects. The
      map is in the docs tree, so it is published next to the stories that it describes.
  - id: TRACE-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      User stories without specification coverage MUST be flagged with an explicit note indicating
      they lack coverage
    rationale: >-
      An unmapped story looks the same as a story that nobody checked. An explicit note
      shows a known gap, not an error by omission, and a search can find the note.
  - id: TRACE-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The traceability matrix MUST be updated when new specifications are added or existing
      requirements are significantly changed in a way that affects story coverage
    rationale: >-
      If the matrix is not current, it shows coverage that the specs removed, or it does
      not show coverage that they added. Update the matrix in the change that changes
      coverage, because the author knows then what changed.
- id: TRACE-02
  title: Maintenance
  specs:
  - id: TRACE-02-001
    priority: SHOULD
    kind: project
    statement: >-
      The traceability matrix SHOULD be reviewed and updated as part of any spec-authoring
      or user-story-authoring activity
    rationale: >-
      Coverage changes when authors write specs and stories, and the author has the
      context at that time. A review of the matrix in the same activity costs less than
      a later audit, which must find that context again.
  - id: TRACE-02-002
    priority: SHOULD
    kind: project
    statement: >-
      Stories with insufficient spec coverage SHOULD be documented as incoming
      learning files in `plan/incoming/learnings/` with specific technical
      details describing the gap and concrete steps toward remediation
    rationale: >-
      A gap in the matrix shows only that coverage is missing. It does not show what to
      do. A learning file goes into the queue that `learn` turns into specs and Issues,
      so the gap goes to a person who can close it.
