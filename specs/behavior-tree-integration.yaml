id: BT
title: Behavior Tree Integration
description: Requirements for integrating py_trees behavior trees into Vultron handler functions. Covers the BT execution
  model, state management via the DataLayer, handler integration patterns, actor isolation, concurrency constraints, and failure
  diagnosis. Complex protocol workflows such as report validation, case creation, and embargo management must be implemented
  as BT nodes or subtrees.
version: 1.1.0
scope:
- prototype
- production
tags:
- behavior-tree
groups:
- id: BT-01
  title: BT Execution Model
  specs:
  - id: BT-01-001
    priority: MUST
    kind: project
    statement: BT execution MUST be event-driven, triggered by handler invocation
  - id: BT-01-002
    priority: MUST
    kind: project
    statement: BTs MUST execute to completion (or max iterations) per invocation
  - id: BT-01-003
    priority: MUST_NOT
    kind: project
    statement: BT execution MUST NOT use continuous tick-based polling loops
  - id: BT-01-004
    priority: MUST
    kind: project
    statement: BTs MUST be single-shot executions within handler context
- id: BT-02
  title: BT Library
  specs:
  - id: BT-02-001
    priority: MUST
    kind: project
    statement: Prototype handlers MUST implement BT execution using industry- standard BT library
    rationale: Mature libraries provide visualization, debugging, and standard BT semantics
  - id: BT-02-002
    priority: MUST
    kind: project
    statement: Simulation code in `vultron/bt/` MUST remain unchanged
- id: BT-03
  title: State Management
  specs:
  - id: BT-03-001
    priority: MUST
    kind: protocol
    statement: BTs MUST use DataLayer as persistent state store
    verification: >-
      Inspection of BT node implementations in `vultron/core/behaviors/` confirms that
      all state reads and writes go through DataLayer method calls, with no in-memory-only
      persistence outside the DataLayer.
    stories:
    - story_2022_088
    - story_2022_074
  - id: BT-03-002
    priority: MUST_NOT
    kind: project
    statement: BTs MUST NOT maintain separate blackboard persistence
  - id: BT-03-003
    priority: MAY
    kind: project
    statement: BT blackboard MAY cache DataLayer state during execution
  - id: BT-03-004
    priority: MUST
    kind: protocol
    statement: State changes MUST be committed to DataLayer on successful execution
    verification: >-
      A unit test confirms that a BT node's successful `update()` path calls `dl.save()`
      (or equivalent DataLayer commit) before returning `Status.SUCCESS`.
    stories:
    - story_2022_088
    - story_2022_074
- id: BT-04
  title: Handler Integration
  specs:
  - id: BT-04-001
    priority: MUST
    kind: project
    statement: Handler protocol MUST be preserved (decorator, signature, registration)
  - id: BT-04-002
    priority: MAY
    kind: project
    statement: Handlers MAY invoke BTs via bridge layer
  - id: BT-04-003
    priority: MUST
    kind: project
    statement: Handlers MUST remain synchronous (BT execution within handler)
  - id: BT-04-004
    priority: MUST
    kind: project
    statement: BT execution errors MUST propagate to handler error handling
- id: BT-05
  title: BT Bridge Layer
  specs:
  - id: BT-05-001
    priority: SHOULD
    kind: project
    statement: System SHOULD provide BT execution bridge for handler-to-BT invocation
  - id: BT-05-002
    priority: SHOULD
    kind: project
    statement: Bridge SHOULD set up py_trees context with DataLayer access
  - id: BT-05-003
    priority: SHOULD
    kind: project
    statement: Bridge SHOULD populate blackboard with activity and actor state
  - id: BT-05-004
    priority: SHOULD
    kind: project
    statement: Bridge SHOULD execute tree and return execution result
- id: BT-06
  title: Workflow-Specific Trees
  specs:
  - id: BT-06-001
    priority: MUST
    kind: project
    statement: All protocol-significant behavior MUST be implemented as BT nodes or subtrees. There is no "simple enough to
      skip" threshold.
    rationale: The BT is the domain documentation; behaviors outside the tree are invisible to analysis, audit, and explainability.
  - id: BT-06-002
    priority: MUST
    kind: protocol
    statement: Prototype use-case BTs MUST correspond to identifiable subtrees of the canonical CVD protocol BT
    verification: >-
      Inspection of `vultron/core/behaviors/` confirms that each use-case BT implements a
      subtree identifiable in `vultron/bt/` by name or documented correspondence in the
      spec.
    lint_suppress:
    - missing_story_reference
  - id: BT-06-003
    priority: SHOULD
    kind: project
    statement: BT nodes SHOULD be deterministic
  - id: BT-06-004
    priority: MUST
    kind: project
    statement: Individual BT nodes MUST be simple and focused on a single concern (e.g., a single exception check or a single
      boolean condition)
    rationale: Surfacing logic in the tree makes the process auditable without reading implementation code; if it is not in
      the tree it cannot be reasoned about from the tree alone.
  - id: BT-06-005
    priority: MUST
    kind: protocol
    statement: Cascades from a parent subtree to a child subtree in the canonical BT MUST be expressed as BT subtrees within
      the use case's BT — not as procedural calls in `execute()` after `bt.run()` returns.
    verification: >-
      Inspection of all use-case `execute()` methods confirms that no protocol-observable
      state changes or message sends occur in procedural code after
      `BTBridge.execute_with_setup()` returns.
    lint_suppress:
    - missing_story_reference
  - id: BT-06-006
    priority: MUST_NOT
    kind: protocol
    statement: Protocol-observable actions and state transitions MUST NOT be performed as procedural code outside the BT.
- id: BT-07
  title: DataLayer Integration
  specs:
  - id: BT-07-001
    priority: MUST
    kind: project
    statement: BT nodes MUST interact with DataLayer via Protocol interface
  - id: BT-07-002
    priority: MUST
    kind: project
    statement: BT nodes MUST use type-safe DataLayer operations
  - id: BT-07-003
    priority: MUST
    kind: protocol
    statement: State transitions MUST be logged at the level specified by SL-04-001
    verification: >-
      Integration tests in `test/demo/` confirm that every RM, EM, and CS state
      transition produces a structured log entry at the level specified by SL-04-001.
    relationships:
    - rel_type: depends_on
      spec_id: SL-03-001
    - rel_type: depends_on
      spec_id: SL-04-001
    stories:
    - story_2022_074
    - story_2022_088
- id: BT-08
  title: Command-Line Execution
  specs:
  - id: BT-08-001
    priority: MAY
    kind: project
    statement: System MAY provide CLI interface for BT execution
  - id: BT-08-002
    priority: SHOULD
    kind: project
    statement: CLI SHOULD support invoking specific trees with test data
  - id: BT-08-003
    priority: SHOULD
    kind: project
    statement: CLI SHOULD log BT execution visualization
- id: BT-09
  title: Actor Isolation
  specs:
  - id: BT-09-001
    priority: MUST
    kind: protocol
    statement: Each actor MUST have isolated BT execution context
    verification: >-
      Integration tests in `test/demo/` confirm that processing messages for two
      different actors produces independent DataLayer writes with no cross-actor state
      overlap.
    stories:
    - story_2022_088
    - story_2022_106
  - id: BT-09-002
    priority: MUST_NOT
    kind: project
    statement: Actor blackboards MUST NOT share state
- id: BT-10
  title: CaseActor Management
  specs:
  - id: BT-10-001
    priority: MUST
    kind: protocol
    statement: Report validation MUST trigger VulnerabilityCase creation
    verification: >-
      Integration tests in `test/demo/test_receive_report_demo.py` confirm that
      processing a valid `CreateReport` activity results in a new `VulnerabilityCase`
      record in the DataLayer.
    relationships:
    - rel_type: implements
      spec_id: VP-02-015
    - rel_type: implements
      spec_id: VP-02-020
    stories:
    - story_2022_012
    - story_2022_101
  - id: BT-10-002
    priority: MUST
    kind: protocol
    statement: Case creation MUST create corresponding CaseActor (Service)
    verification: >-
      Integration tests in `test/demo/test_initialize_case_demo.py` confirm that the
      case-creation BT produces both a `VulnerabilityCase` and a corresponding
      `CaseActor` service record in the DataLayer.
    stories:
    - story_2022_012
    - story_2022_046
  - id: BT-10-003
    priority: MUST
    kind: protocol
    statement: CaseActor MUST manage case-related message processing
    verification: >-
      Integration tests in `test/demo/` confirm that case-scoped activities
      (`Announce`, `Invite`, `Accept`) are dispatched through the `CaseActor` service
      rather than the top-level inbox handler.
    stories:
    - story_2022_088
    - story_2022_039
  - id: BT-10-004
    priority: MUST
    kind: protocol
    statement: CaseActor MUST enforce case-level authorization
    verification: >-
      Integration tests in `test/demo/` confirm that case-scoped activities from a
      non-participant actor are rejected by the `CaseActor` with an authorization error
      rather than processed.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: CLP-09-001
    - rel_type: refines
      spec_id: CLP-09-003
    - rel_type: refines
      spec_id: CLP-09-004
    stories:
    - story_2022_035
    - story_2022_036
  - id: BT-10-005
    priority: SHOULD
    kind: protocol
    statement: >-
      When an actor accepts a case invitation, the system SHOULD automatically record the accepting actor's RM state as
      RM.RECEIVED via BT or use-case execution. The invitee's subsequent triage (RM.VALID/INVALID → RM.ACCEPTED/DEFERRED)
      is driven by RM status messages from the invitee after the full case replica has been delivered to them.
    note: >-
      Prior text read "advance the accepting actor's RM state to ACCEPTED", which conflated joining the case with validating
      its vulnerability content. Corrected to align with CM-11-001 (as amended in CONCERN-1756).
    relationships:
    - rel_type: implements
      spec_id: CM-11-001
- id: BT-12
  title: VFD/PXA State Machine Usage
  specs:
  - id: BT-12-001
    priority: MUST
    kind: project
    statement: When implementing VFD (vendor fix deployed) or PXA (public exploit/attack) state transitions, new code MUST
      use `create_vfd_machine()` and `create_pxa_machine()` (defined in `vultron/core/states/cs.py`) as the authoritative
      source of valid transition sequences. Hand-rolled transition logic for these state dimensions MUST NOT be introduced.
    rationale: Ensures the `transitions` machines remain the normative definition of valid VFD/PXA state progressions as new
      features are added, preventing divergence between the machines and the implementation.
  - id: BT-12-002
    priority: SHOULD
    kind: project
    statement: >-
      A high-level BT node that writes a target VFD state SHOULD advance
      through all required intermediate states automatically when the actor
      starts below the required entry point. Callers MUST NOT be required to
      pre-advance through intermediate states before invoking such a node.
    rationale: >-
      TransitionCStoFixReady (DevelopFixBT) writes VFd (fix ready). The VFD
      state machine requires passing through Vfd (vendor aware) first.
      A vendor who reports a fix ready for a new case has implicitly been
      vendor-aware since engagement; requiring callers to pre-advance to Vfd
      is a leaky abstraction. The node checks whether the actor is still at
      vfd and, if so, writes Vfd first (implicit V event) then VFd. This
      produces two ParticipantStatus records and two CS INFO log lines when
      called from the vfd starting state. Source: ISSUE-2478.
- id: BT-11
  title: Concurrency
  specs:
  - id: BT-11-001
    priority: MUST
    kind: protocol
    statement: Prototype MUST process messages sequentially (FIFO order)
    rationale: Eliminates race conditions in prototype phase
    verification: >-
      Integration tests in `test/demo/` confirm that inbox messages are processed
      sequentially, with each BT execution completing before the next message is
      dispatched.
    stories:
    - story_2022_088
    - story_2022_039
  - id: BT-11-002
    priority: MUST_NOT
    kind: protocol
    statement: Sequential processing MUST NOT block HTTP response (BackgroundTasks)
  - id: BT-11-003
    priority: MAY
    kind: protocol
    statement: Future optimizations MAY introduce resource-level locking
    scope:
    - production
  - id: BT-11-004
    priority: MUST
    kind: protocol
    statement: '`BTBridge` MUST acquire a `threading.RLock` (re-entrant lock), not a plain `threading.Lock`, when serializing
      BT execution. Any code path in which `execute_with_setup()` calls back into `BTBridge` (directly or transitively) will
      deadlock with a plain `Lock` because the same thread attempts to acquire a non-reentrant lock it already holds.'
    rationale: '`BTBridge.execute_with_setup()` invokes user-supplied setup and teardown hooks. In integration and demo scenarios
      these hooks may trigger secondary BT executions via the same bridge instance. A plain `Lock` would deadlock on the second
      acquisition from the same thread. An `RLock` allows re-entry by the owning thread while still blocking other threads.'
    verification: >-
      Inspection of `vultron/core/behaviors/bridge.py` confirms `BTBridge` uses
      `threading.RLock`; a unit test confirms that a re-entrant call from a setup hook
      does not deadlock.
    relationships:
    - rel_type: refines
      spec_id: BT-11-001
    lint_suppress:
    - missing_story_reference
- id: BT-13
  title: BT Failure Diagnosis
  specs:
  - id: BT-13-001
    priority: MUST
    kind: project
    statement: 'After any BT execution that returns FAILURE, code MUST retrieve the failure reason via `BTBridge.get_failure_reason(tree)`
      (a depth-first walk to the first failing leaf node). Code MUST NOT log or inspect `result.feedback_message` or `bt.root.feedback_message`
      for diagnostic purposes: a `py_trees` Sequence root''s `feedback_message` is always `""` when a child fails, regardless
      of what the failing child set.'
    rationale: '`py_trees` sets `feedback_message` on the failing child node, not on the parent Sequence. Logging the root
      message produces an empty string that is indistinguishable from "no error" in logs, making failures completely silent.
      `get_failure_reason()` walks to the actual failing leaf and returns its message.'
  - id: BT-13-002
    priority: MUST
    kind: project
    statement: The `BTBridge.get_failure_reason()` pattern MUST be applied consistently across all BT execution sites, not
      only for a single BT class or protocol flow. Any place in the codebase that logs a BT result MUST use this helper.
    relationships:
    - rel_type: refines
      spec_id: BT-13-001
      note: Scope is all BT execution sites, not just sync
- id: BT-14
  title: Peer Broadcast Failure Semantics
  specs:
  - id: BT-14-001
    priority: MUST
    kind: project
    statement: Any BT node or subtree that performs protocol-visible peer broadcast fan-out MUST return FAILURE when broadcast
      preparation or outbox enqueueing fails. A guaranteed SUCCESS fallback that masks delivery failure MUST_NOT be used.
    rationale: Silent success on failed fan-out causes undetected peer state divergence and hides correctness faults from
      parent tree control flow.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
      note: Broadcast fan-out is protocol-significant behavior
    - rel_type: refines
      spec_id: BT-04-004
      note: Delivery failures must propagate to handler error paths
  - id: BT-14-002
    priority: SHOULD
    kind: protocol
    statement: Peer broadcast fan-out paths SHOULD reuse a shared helper/subtree for recipient filtering, activity construction,
      and outbox enqueueing so the failure contract is consistent across workflow domains.
    rationale: Duplicated fan-out implementations drift over time and re-introduce silent-failure behavior in only some pathways.
- id: BT-15
  title: Trigger-Side Use-Case Contract
  specs:
  - id: BT-15-001
    priority: MUST
    kind: project
    statement: Trigger-side execute() methods MUST delegate state-machine transitions (RM, EM, CS) to BT leaf nodes via BTBridge,
      following the same pattern as received-side use cases.
    rationale: State machine transitions are protocol-significant behavior (BT-06-001). Inline transitions in execute() bypass
      BT audit, logging, and failure introspection via get_failure_reason(). The historical asymmetry between trigger-side
      and received-side use cases arose from the now-retired "simple CRUD" guidance.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
      note: SM transitions are protocol-significant behavior with no skip threshold
    - rel_type: refines
      spec_id: BT-06-006
      note: SM transitions performed outside a BT violate BT-06-006
  - id: BT-15-002
    priority: MUST_NOT
    kind: protocol
    statement: Trigger-side execute() methods MUST NOT call domain lifecycle methods (e.g., EmbargoLifecycle, EMAdapter, direct
      ParticipantStatus writes with rm_state/em_state) outside a BT execution context.
    rationale: Direct lifecycle calls in execute() make protocol transitions invisible to BT-level audit and observability
      tooling. The BTBridge pattern (instantiate BT → execute_with_setup() → introspect result) is the required contract for
      all use-case execute() methods that perform state transitions.
    relationships:
    - rel_type: refines
      spec_id: BT-06-006
- id: BT-17
  title: Role-Gated BT Subtrees and Blackboard Hygiene
  specs:
  - id: BT-17-001
    priority: MUST
    kind: project
    statement: Any BT subtree whose semantics are restricted to the `CVDRole.CASE_MANAGER` actor MUST be wrapped in a role-guard
      composite using `CheckIsCaseManagerNode` at tree-composition time, not enforced via application-layer guards outside
      the tree.
    rationale: 'Received-side use cases execute BTs with the receiving actor''s identity. Without a role guard inside the
      tree, a CASE_MANAGER-only node fires for every actor that receives the triggering activity — including participants
      who should be silent recipients. Issue #1030 observed `AutoCloseBranchNode` firing on `finder-actor` because no role
      guard existed inside the tree; combined with a module-level idempotency set, the phantom fire claimed the slot and prevented
      the legitimate CASE_MANAGER fire. The canonical role-guard composite is a Selector with a guarded Sequence (CheckIsCaseManagerNode
      + action node) and a `Success("Skipped")` fallback.'
    verification: For any BT node whose docstring or name implies CASE_MANAGER-only semantics, grep the tree-composition function
      that instantiates it and confirm a `CheckIsCaseManagerNode` wraps the subtree.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
      note: CASE_MANAGER-only behavior is protocol-significant; it must live inside the tree with an explicit guard
  - id: BT-17-002
    priority: MUST
    kind: project
    statement: A module-level idempotency set (a `set[str]` used to track "already fired" state for a BT node) MUST be paired
      with a role guard (BT-17-001) that prevents any actor other than the intended role from writing to the set.
    rationale: 'Module-level sets are per-process, not per-container. In a Docker deployment, each actor process has its own
      set; a phantom fire in process A does not affect process B. However, within a single process, two phantom fires (the
      wrong actor fires before the correct one) can race: the phantom claims the set slot first and silently blocks the legitimate
      fire. Pairing the set with a role guard ensures only the correct actor can claim the slot.'
    verification: Inspect every module-level `set` used for BT idempotency; confirm the node that writes to it is also guarded
      by `CheckIsCaseManagerNode` or equivalent role-check at tree-composition time.
    relationships:
    - rel_type: refines
      spec_id: BT-17-001
  - id: BT-17-003
    priority: MUST
    kind: project
    statement: When a BT node takes a no-op path (e.g., an empty recipient list or a guard condition that is not met), it
      MUST explicitly write `None` to any output blackboard key it would normally set before returning FAILURE or SUCCESS.
      It MUST NOT leave a stale value from a previous execution in the blackboard.
    rationale: '`py_trees.blackboard.Blackboard.storage` is process-global and is not cleared between `execute_with_setup`
      calls for domain-specific keys. `execute_with_setup` only cleans the `datalayer` and `trigger_activity_factory` keys
      on exit. A consumer node that reads an output key may receive the value from a prior execution if the producer node
      short-circuits without writing `None`. This causes silent state contamination across otherwise independent BT executions
      (issue #834).'
    verification: Add a regression test that runs two `execute_with_setup` calls back-to-back without clearing the blackboard
      between them; assert the second run does not observe output values from the first when the node takes a no-op path.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
      note: Blackboard cleanup is part of the blackboard management contract
  - id: BT-17-004
    priority: MUST
    kind: project
    statement: A consumer BT node that reads an output key set by a peer producer node MUST treat both `KeyError` (key never
      written) and a `None` value (producer took no-op path per BT-17-003) as equivalent no-op sentinels and skip any write-dependent
      action.
    rationale: A node that only handles `KeyError` but not `None` will incorrectly proceed with a `None` value on the second
      run after the producer has cleared the key to `None`. Both states mean "producer had nothing to produce this cycle."
    verification: Unit tests for consumer nodes MUST include a case where the blackboard key is `None` and assert the consumer
      skips the dependent action.
    relationships:
    - rel_type: refines
      spec_id: BT-17-003
  - id: BT-17-005
    priority: MUST
    kind: project
    statement: Tests for a received-side use case that exercises a BT guarded-commit path MUST pass `receiving_actor_id` equal
      to the actor holding `CVDRole.CASE_MANAGER` in `actor_participant_index`, not the `VultronCaseActor` service entity
      ID.
    rationale: '`CheckIsCaseManagerNode` compares `actor_id` against the participant registered with `CVDRole.CASE_MANAGER`
      in `actor_participant_index`, not against the `VultronCaseActor` service resource ID. Passing the service entity ID
      causes the role check to fail silently: the guarded commit never fires, the RM state falls through to the deferred path,
      and the test may pass for the wrong reason. Issue #1050 discovered this after migrating `AcceptInviteToEmbargoOnCaseReceivedUseCase`
      to the single-BT pattern.'
    verification: In any test fixture for a received-side use case with a guarded-commit BT, assert that `receiving_actor_id`
      matches the actor whose ID is stored as `CVDRole.CASE_MANAGER` in the test case's `actor_participant_index`.
    relationships:
    - rel_type: refines
      spec_id: BT-17-001
      note: The role guard identity check is what makes this fixture requirement necessary
  - id: BT-17-006
    priority: MUST
    kind: project
    statement: >-
      A received-side use case that executes a BT containing
      `GuardedCommitCaseLedgerEntryBT` MUST call `execute_with_setup` with
      `actor_id=request.receiving_actor_id`, not `request.actor_id`. When a BT
      node inside that tree also needs to target the sender's participant (e.g.
      to advance their RM state), it MUST store the sender's ID in a private
      attribute (e.g. `_target_actor_id`) that `DataLayerAction.setup()` does
      not overwrite.
    rationale: >-
      In received-side use cases, `request.actor_id` is the sender of the
      inbound activity; `request.receiving_actor_id` is the CaseActor that owns
      the ledger and whose role must be verified by `CheckIsCaseManagerNode`.
      Passing the sender ID as `actor_id` causes the role check to fail:
      the guarded commit never fires, and the ledger entry is silently skipped.
      `EngageCaseReceivedUseCase` and `DeferCaseReceivedUseCase` both carried
      this defect until issue #2300 corrected them.
    verification: >-
      Search all received-side use-case call sites of `execute_with_setup` that
      contain a `GuardedCommitCaseLedgerEntryBT`; assert each passes
      `actor_id=request.receiving_actor_id`.
    relationships:
    - rel_type: refines
      spec_id: BT-17-005
      note: BT-17-005 covers tests; this entry covers production call sites
- id: BT-16
  title: Simulation Fuzzer Node Layout
  specs:
  - id: BT-16-001
    priority: MUST
    kind: project
    statement: Probabilistic simulation (fuzzer) BT nodes MUST reside in `vultron/demo/fuzzer/` and MUST NOT be placed in
      `vultron/core/behaviors/` or `vultron/bt/`.
    rationale: Demo/simulation nodes are external-dependency touchpoints, not production protocol behaviors. Keeping them
      in `vultron/demo/fuzzer/` makes the simulation/production boundary explicit and prevents simulation artifacts from leaking
      into core protocol logic.
  - id: BT-16-002
    priority: MUST
    kind: project
    statement: The probabilistic base types (WeightedBehavior subclasses) for simulation nodes MUST be defined in `vultron/demo/fuzzer/base.py`
      using the `py_trees.behaviour.Behaviour` base class.
    rationale: All py_trees-based BT execution uses the standard py_trees library (ADR-0008). Centralizing probabilistic base
      types in one module provides a single implementation point for all weighted-probability simulation nodes and avoids
      duplication across domain modules.
    relationships:
    - rel_type: implements
      spec_id: BT-02-001
      note: py_trees.behaviour.Behaviour is the required base for all prototype BT nodes
    adr:
    - ADR-0008
  - id: BT-16-003
    priority: MUST
    kind: project
    statement: Each simulation fuzzer node MUST be named after the external-dependency touchpoint it represents (e.g., `EvaluateEmbargoProposal`,
      `DeployFix`) and MUST include a docstring describing its semantic function in the CVD process, the category of external
      input it simulates (system integration, human decision, or environmental check), and its approximate success probability.
    rationale: Fuzzer nodes are named integration points where production logic will eventually replace the probabilistic
      stub. Explicit naming and documentation preserves the connection between simulation behavior and future implementation
      targets.
  - id: BT-16-004
    priority: MUST
    kind: project
    statement: 'Simulation fuzzer modules MUST be organized by CVD domain: `vultron/demo/fuzzer/base.py` (probabilistic infrastructure),
      `vultron/demo/fuzzer/embargo.py` (embargo management), `vultron/demo/fuzzer/messaging.py` (inbound message handling),
      and `vultron/demo/fuzzer/report_management/` (report lifecycle sub-workflows as parallel submodules).'
    rationale: Domain-aligned module organization mirrors the workflow structure of the existing `vultron/bt/` simulation
      and makes cross-references between simulation stubs and production use cases straightforward for future implementers.
  - id: BT-16-005
    priority: SHOULD
    kind: project
    statement: 'Each simulation fuzzer node SHOULD be categorized in its docstring by automation potential: High (fully automatable
      via API or policy rule), Medium (partially automatable with human oversight required), Low (inherently human-driven;
      automation limited to notifications or task triggers), or TerminalPlaceholder (terminal placeholder node with no real
      decision logic — an AlwaysSucceed or AlwaysFail fallback leaf with no external dependency).'
    rationale: Automation-potential categorization guides future implementers toward the correct integration pattern when
      replacing stubs with production logic, supporting the future real-integration roadmap. The TerminalPlaceholder value
      replaces the former ambiguous "N/A" label to make the meaning explicit and prevent it from being conflated with "not
      applicable due to high automation potential."
- id: BT-18
  title: Call-Out Point Abstraction Layer
  specs:
  - id: BT-18-001
    priority: MUST
    kind: project
    statement: 'Every call-out point node MUST declare its blackboard contract in its class docstring: the set of input keys
      read before dispatch and the set of output keys (with types) written to the blackboard on SUCCESS.'
    rationale: The blackboard contract is the integration seam between the tree and the backend. Without an explicit contract,
      swapping from a fuzzer backend to a real implementation is a guess — the real backend may omit writing a key that a
      downstream node expects, causing silent failures.
    relationships:
    - rel_type: implements
      spec_id: BT-16-003
      note: Call-out points are the named integration seam that BT-16-003 requires to be documented; the blackboard contract
        is the required documentation format for data-producing nodes.
  - id: BT-18-002
    priority: MUST
    kind: project
    statement: A call-out point backend — fuzzer or real implementation — MUST write to all declared output keys when it returns
      SUCCESS. A backend MUST NOT return SUCCESS without writing the declared outputs.
    rationale: 'Downstream BT nodes rely on declared output keys being present after a call-out point succeeds. A fuzzer that
      returns SUCCESS without writing synthetic output to those keys produces a contract violation: a downstream node reads
      a missing key and fails, but the failure is attributed to the downstream node rather than the backend. Both fuzzer and
      real backends must be contract-conformant to make backend swaps transparent.'
  - id: BT-18-003
    priority: MUST
    kind: project
    statement: The fuzzer backend for a data-producing call-out point (Evaluator, Retriever, or Composer shape) MUST write
      synthetic but type-conformant data to the declared output keys. The synthetic data MUST be of the correct type; it does
      not need to be semantically meaningful.
    rationale: If the fuzzer backend omits output writes that a real backend would perform, the demo/simulation layer cannot
      serve as a faithful stand-in during development. Maintaining the same output contract ensures that demo scenarios exercise
      the same downstream code paths as production runs.
  - id: BT-18-004
    priority: MUST
    kind: project
    statement: A call-out point node MUST be constructed via a backend factory callable.
    rationale: Factory-based injection is the established BT construction pattern in this codebase. Requiring the factory
      as a parameter (rather than hardcoding the fuzzer import) is what makes each call-out point an actual injection seam
      rather than a tightly-coupled stub. Without this, replacing any backend requires editing the tree-building function,
      defeating the abstraction layer's purpose.
    relationships:
    - rel_type: implements
      spec_id: BT-04-001
      note: Factory-based injection for call-out points is an application of the existing factory pattern required for all
        BT construction.
  - id: BT-18-008
    priority: MUST
    kind: project
    statement: Tree-building functions that contain call-out points MUST accept the backend factory as a parameter (or as
      an entry in a factory mapping).
    rationale: Accepting the factory as a parameter makes each call-out point an actual injection seam rather than a
      tightly-coupled stub; replacing a backend then requires no changes to the tree-building function.
  - id: BT-18-009
    priority: MUST
    kind: project
    statement: The fuzzer factory MUST be the default value for the backend factory parameter of tree-building functions.
    rationale: A fuzzer default ensures demo scenarios work without explicit backend configuration until a real
      implementation is available, while still allowing injection of alternative backends at call sites that opt in.
  - id: BT-18-005
    priority: MUST
    kind: project
    statement: The call-out point shape of a fuzzer node MUST be determined solely by the ADR-0024 seam-structure decision
      tree (how external input enters and output exits the call-out point). Automation potential MUST NOT be used as a criterion
      for assigning shape = ProtocolInternal. A node whose automation potential is High but whose inputs arrive from an external
      source or whose outputs affect an external system is a Retriever, Sentinel, Evaluator, Composer, or Actuator — not ProtocolInternal
      — regardless of how automated the implementation may be.
    rationale: 'Automation potential and call-out point shape are orthogonal dimensions. Automation potential describes whether
      the call-out point logic can be executed without human involvement; shape describes the structural pattern of the seam
      (what flows in, what flows out, and in what direction). A Retriever backed by a REST API is still a Retriever; the automation
      just means the Retriever implementation does not require human action. Conflating the two dimensions caused the FUZZ-08a
      misclassification tracked in issue #1188, where ~38 nodes with High automation potential were incorrectly assigned ProtocolInternal
      shape, causing downstream work (FUZZ-08a-bis, FUZZ-08d through FUZZ-08g) to build wrong seams. The five canonical shapes
      are: Sentinel, Evaluator, Retriever, Composer, and Actuator (added in issue #1239). Nodes that invoke external systems
      to cause side effects without producing a content artifact MUST be classified as Actuator, not Composer.'
    relationships:
    - rel_type: implements
      spec_id: BT-16-005
      note: BT-16-005 defines automation potential categories; BT-18-005 clarifies that those categories govern the automation-potential
        field only and have no bearing on call-out point shape assignment.
  - id: BT-18-006
    priority: MUST
    kind: project
    statement: A node that queries an external system synchronously and returns only a binary (SUCCESS/FAILURE) result MUST
      be classified as a Retriever, not a Sentinel. The defining criterion for Retriever shape is the synchronous on-demand
      query pattern, not the richness of the returned data; a boolean is the simplest possible structured fact a Retriever
      may return. A Sentinel, by contrast, monitors a condition continuously or is triggered by an external event and calls
      a trigger endpoint when the condition becomes true — the flow direction is Sentinel → trigger endpoint → protocol, not
      protocol → query → external system.
    rationale: 'The Sentinel vs. Retriever ambiguity surfaced with nodes such as MitigationDeployed, MitigationAvailable,
      and HaveExploit (issue #1240). These nodes appear sentinel-like because they return only SUCCESS/FAILURE, but they are
      invoked synchronously by the BT (on-demand) and query an external system to determine the current status. That is the
      Retriever pattern. A true Sentinel is not invoked by the BT; it runs independently and calls a trigger endpoint when
      a condition fires. Clarifying this distinction prevents future misclassification of on-demand binary-query nodes as
      Sentinels.'
    relationships:
    - rel_type: refines
      spec_id: BT-18-005
      note: BT-18-005 establishes that shape is determined by the seam-structure decision tree; BT-18-006 resolves the specific
        Sentinel vs. Retriever ambiguity for binary-result external queries.
  - id: BT-18-010
    priority: MUST
    kind: project
    statement: A binary-result Retriever MUST declare an empty blackboard output-key set in the node docstring; the structured
      fact is expressed as the BT return value (SUCCESS/FAILURE), not as a blackboard write.
    rationale: BT-18-001 through BT-18-003 require every call-out point to declare its complete blackboard contract. A
      binary-result Retriever has an empty output-key set; that empty set MUST still be explicitly declared so that the
      absence of output keys is documented as intentional rather than an oversight, and backend swaps remain transparent.
  - id: BT-18-007
    priority: MUST
    kind: project
    statement: An Evaluator call-out point that needs to block downstream BT execution — for any reason (editorial rejection,
      legal hold, compliance failure, or other non-approval decision) — MUST return Status.FAILURE from its update() method.
      Setting a structured output field to a "rejected" value while returning Status.SUCCESS does not block a Sequence and
      MUST NOT be used as a blocking mechanism.
    rationale: >
      A BT Sequence halts and returns FAILURE as soon as any child returns FAILURE; this is the universal py_trees
      blocking idiom. Relying on a field value (e.g., approved=False) to signal rejection is ineffective because
      the Sequence has no gate that reads it — only Status.FAILURE stops execution. This requirement resolves the
      deferred design question from ADR-0030 / issue #1312 (whether AdvisoryReviewDecision.approved=False should
      gate submission): the answer is no, because the field was redundant with Status.FAILURE. The approved field
      was removed from AdvisoryReviewDecision (issue #1783) to eliminate the trap. The principle generalises: any
      Evaluator whose output record carries a boolean approval flag is a design smell unless that flag is the
      sole input to a subsequent ProtocolInternal gate node.
    tracking_issue: '#1783'
    relationships:
    - rel_type: refines
      spec_id: BT-18-002
      note: BT-18-002 states that SUCCESS MUST accompany all declared output writes; BT-18-007 is the complementary
        rule — FAILURE is the correct signal when the Evaluator's decision is to block, regardless of output field values.
- id: BT-19
  title: Routing-Gated State Mutation in Lifecycle BT Sequences
  specs:
  - id: BT-19-001
    priority: MUST
    kind: project
    statement: A BT Sequence that performs a state mutation and then routes an outbound message MUST resolve all routing prerequisites
      in a read-only guard node placed BEFORE the state-mutation node. The Sequence MUST fail at the guard with no state change
      when routing prerequisites are absent.
    rationale: 'Committing a state change before verifying that the resulting outbound message can be constructed and queued
      creates a divergence window: local state reflects the new value while peers still hold the prior value because the broadcast
      was never sent. Moving the routing guard before the mutation eliminates the most common divergence cause without requiring
      full transactional rollback. The outbox is the reliability boundary: once the message is written to the outbox, delivery
      and retry are the outbox''s responsibility.'
    relationships:
    - rel_type: refines
      spec_id: BT-14-001
      note: 'Routing-gated mutation is the pre-condition counterpart to BT-14-001''s fail-fast-on-broadcast-failure rule:
        guard before mutation addresses the common prerequisite-missing case; BT-14-001 addresses the post-mutation delivery
        failure case.'
    - rel_type: refines
      spec_id: BT-06-001
      note: State-mutation ordering relative to routing checks is part of the tree's auditable behavioral contract.
  - id: BT-19-003
    priority: MUST
    kind: protocol
    statement: In Vultron protocol lifecycle BTs, routing prerequisites for EM/RM/CS state-transition sequences MUST include
      Case Manager actor ID resolution and outbox availability. A missing Case Manager entry in `actor_participant_index`
      MUST cause the sequence to fail at the guard with zero DataLayer state change.
    rationale: Protocol state divergence (e.g., local EM=EXITED while peers hold EM=ACTIVE) is the primary failure mode when
      routing prerequisites are absent. Residual mid-send failures after state mutation are recoverable via ledger-sync catch-up
      (SYNC-10); prerequisite-missing failures are not, because the broadcast was never attempted.
    relationships:
    - rel_type: refines
      spec_id: BT-19-001
      note: Specifies the CVD-protocol-specific routing prerequisites that BT-19-001 requires to be resolved in the guard
        node.
    - rel_type: refines
      spec_id: BT-06-001
      note: Protocol state transitions are protocol-significant behavior; their ordering relative to routing checks is part
        of the tree's auditable contract.
    verification: 'For any embargo lifecycle BT Sequence that includes both a state-mutation node and a send/dispatch node:
      confirm via code review and test that a simulated missing Case Manager (empty `actor_participant_index`, no `CVDRole.CASE_MANAGER`
      entry) causes the tree to return FAILURE with zero DataLayer state change.'
    stories:
    - story_2022_046
    - story_2022_014
    - story_2022_088
  - id: BT-19-002
    priority: MUST
    kind: project
    statement: A shared BT factory function MUST be used for all paths that trigger the same protocol lifecycle transition
      (e.g., embargo termination). Duplicate monolithic BT nodes that inline both state mutation and activity dispatch in
      a single `update()` method MUST NOT exist alongside a canonical factory-composed equivalent.
    rationale: 'Duplicated implementations drift independently: the canonical trigger-side BT may correctly separate routing
      guards from state mutation while the automatic-cascade BT retains the old ordering or the old inline EMAdapter pattern,
      re-introducing the divergence bug in one pathway only. A single shared factory guarantees consistent semantics and the
      correct guard ordering across all call sites. Issue #1054 observed this exact drift between `TerminateEmbargoNode` (monolith,
      inline EMAdapter) and `terminate_embargo_trigger_bt` (factory-composed). Concretely: `TerminateEmbargoNode` (used by
      `PublicDisclosureBranchNode`) and `TerminateEmbargoLifecycleNode` + `sender_side_bt` (used by `SvcTerminateEmbargoUseCase`)
      represent the same protocol operation with divergent implementations — only the factory-composed path applied the correct
      routing-guard ordering (BT-19-001); the monolith committed state before verifying Case Manager availability.'
    relationships:
    - rel_type: refines
      spec_id: BT-14-002
      note: BT-14-002 requires shared helpers for broadcast fan-out; BT-19-002 extends this to the full lifecycle-plus-routing
        sequence.
    - rel_type: implements
      spec_id: BT-19-001
      note: Shared factory composition is the mechanism that enforces consistent BT-19-001 guard ordering across all call
        sites.
    verification: For each protocol lifecycle operation with more than one call site (trigger path and automatic-cascade path),
      confirm that all call sites use the same BT factory function and that no standalone monolithic node class exists that
      inlines both state mutation and dispatch in a single `update()` method for the same operation.
- id: BT-20
  title: Production BT Collapse Patterns
  description: Requirements for production BT subtrees that replace groups of simulator fuzzer nodes. Each collapse candidate
    reduces multiple granular simulator leaves to a smaller set of production call-out points with cleaner seam structure;
    individual requirements are provisional and subject to revision at implementation time.
  specs:
  - id: BT-20-001
    priority: SHOULD
    kind: project
    statement: The production `create_acquire_exploit_strategy_tree` factory SHOULD provide a `HaveExploit` Retriever and
      an `EvaluateExploitStrategy` Evaluator call-out point in place of the five simulator nodes (`HaveExploit`, `ExploitPrioritySet`,
      `EvaluateExploitPriority`, `ExploitDeferred`, `ExploitDesired`). The Evaluator SHOULD receive case context (vulnerability
      state, org policy, threat landscape, and the `HaveExploit` query result) and return a structured `ExploitStrategyDecision`
      record containing `have_exploit`, `acquire`, and `rationale`. The `HaveExploit` Retriever is kept as a separate seam
      for independent swapability (ADR-0027, Option 2).
    rationale: 'The five-node simulator sequence encodes a single policy-driven decision ("should we acquire an exploit?")
      in granular boolean flags that are unnecessary in production. Collapsing to two call-out points (Retriever + Evaluator)
      reduces seam count while keeping the exploit-repo query independently swappable. Implemented by issue #1309 (PR #1566).
      See `notes/bt-fuzzer-nodes-report-management.md` § "Production Collapse 1: Exploit-strategy subtree" and ADR-0027.'
    tracking_issue: '#1200 (planning); #1249 (factory-fn Idea — already implemented on main); #1309 (implementation — closed by PR #1566)'
    adr:
    - ADR-0027
  - id: BT-20-002
    priority: SHOULD
    kind: project
    statement: The production `create_publication_tree` factory SHOULD use `PrioritizePublicationIntents` (Evaluator) output
      to gate per-artifact arms directly, without separate `NoPublish*` bypass leaves or a `PublicationIntentsSet` flag check.
      The Evaluator SHOULD return a structured `PublicationIntentDecision` record containing `publish_exploit`, `publish_fix`,
      `publish_report`, and `rationale`. The intent record SHOULD drive which of three named arms (exploit, fix, report) execute;
      each arm SHOULD be a `Selector(Sequence(ShouldPublishX, PrepareX, Publish), Inverter(ShouldPublishX))` so a not-intended
      arm is a graceful SUCCESS no-op. Each arm SHOULD consist of a Composer (prepare artifact) followed by a Publish pipeline
      (see BT-20-004).
    rationale: 'The `NoPublish*` bypass leaves and `PublicationIntentsSet` flag check are structural artifacts of the simulator
      BT representation; they do not represent real call-out points. In production the `PrioritizePublicationIntents` Evaluator
      output drives arm execution directly. The `ShouldPublishX` gate nodes are named positively per BTND-08-001. Implemented
      by issue #1310. See `notes/bt-fuzzer-nodes-report-management.md` § "Production Collapse 2: Publication-intent subtree"
      and ADR-0028.'
    tracking_issue: '#1200 (planning); #1310 (implementation)'
    adr:
    - ADR-0028
  - id: BT-20-003
    priority: SHOULD
    kind: project
    statement: The production report-to-others workflow SHOULD be driven by a Sentinel capability that proactively
      queries the case for actors who are not yet participants but should be (party discovery), then fires `suggest-actor-to-case`
      for each candidate. The `suggest-actor-to-case` protocol (Offer → CaseActor → CaseOwner → Invite → Accept → Record
      cascade) handles the downstream flow; no inline tick-driven BT loop is needed at the outer level. If an inline subtree
      is required (e.g. for a single-pass trigger-driven invocation), it SHOULD consist of a Retriever call-out that returns
      candidate (actor_id, role) pairs and an Actuator per pair that fires `suggest-actor-to-case` with the explicit
      `CVDRole` parameter.
    rationale: >
      The original Production Collapse 3 design (#1311, ADR-0029) retained a three-typed-sub-loop BT structure whose
      inner blackboard queues (identified_vendors, identified_coordinators, identified_others) had no production
      mechanism to populate them. Planning of #1252 surfaced that the identification step belongs in a Sentinel
      capability (see #1147/#1143) that periodically or event-triggered inspects the case and asynchronously
      fires suggest-actor-to-case for each uninvited candidate. The downstream accept/invite/bootstrap cascade already
      works; no inline BT loop is required. The tick-driven `create_report_to_others_tree` module from #1311 is an
      implementation artifact of the intermediate design and is tracked for removal in a follow-on Task (see
      notes/bt-fuzzer-rm-reporting.md § "Sentinel supersession note").
    tracking_issue: '#1311 (partial implementation, superseded); #1252 (planning — closed; sentinel approach adopted)'
    adr:
    - ADR-0029
    - ADR-0047
  - id: BT-20-004
    priority: SHOULD
    kind: project
    statement: 'The production `create_publish_artifact_tree` factory SHOULD implement a multi-step pipeline replacing the
      single `Publish` Actuator leaf: at minimum (1) a Composer node drafts the advisory artifact from case data, (2) an Evaluator
      node reviews and approves the draft, and (3) an Actuator node submits the finalized artifact to the external advisory
      platform. An optional revision Composer MAY be included between the Evaluator and Actuator. Whether the review phase
      includes a broadcast-for-participant-comment step is an open design question to be resolved at implementation time.'
    rationale: 'The single `Publish` simulator leaf stood in for a full advisory publication workflow. In production, drafting,
      review, and submission are distinct operations with separate external seams. The Actuator shape for submission is confirmed
      by ADR-0024 (Actuator amendment, 2026-07-07). See `notes/bt-fuzzer-nodes-report-management.md` § "Production Collapse 4:
      Publish leaf" and ADR-0030 (accepted 2026-07-22). The participant-comment broadcast question in the review phase was deferred
      to a follow-on issue (AC-4, issue #1312).'
    tracking_issue: '#1200 (planning); #1312 (implemented)'
    adr:
    - ADR-0024
    - ADR-0030
  - id: BT-20-005
    priority: SHOULD
    kind: project
    statement: >-
      The production `create_deploy_mitigation_tree` factory SHOULD implement
      a `DeployMitigationBT` Fallback tree with four arms: a short-circuit arm
      for already-active mitigations, a deferred-RM arm, a deploy-if-available
      arm, and a monitor-if-desired arm.
    rationale: >
      Mitigation deployment is the fallback path when a definitive fix is not
      yet available, as noted in the Phase 1 scoping of `create_deploy_fix_tree`
      (issue #1248). This makes `MitigationDeployed` and `MitigationAvailable`
      call-out Retrievers rather than DataLayerCondition nodes.
    tracking_issue: '#1826 (planning Idea — peer to #1248)'
    relationships:
    - rel_type: extends
      spec_id: BT-23-003
      note: >
        DeployMitigationCallOutBundle and DeploymentMonitoringBundle follow the
        domain bundle pattern from BT-23-003.
  - id: BT-20-006
    priority: MUST_NOT
    kind: project
    statement: The `create_deploy_mitigation_tree` tree MUST NOT include a CS state transition or protocol activity emission
      node; mitigation deployment is tracked externally (CMDB or case record) and the protocol has no dedicated
      mitigation-deployed message type.
    rationale: The VFD state machine tracks only vendor-aware/fix-ready/fix-deployed bits; there is no mitigation-deployed
      bit. Emitting a CS state transition or protocol activity from the mitigation tree would conflate fix-deployment
      semantics with mitigation tracking.
  - id: BT-20-007
    priority: SHOULD
    kind: project
    statement: The shared monitoring/prioritization call-out seams (`PrioritizeDeployment`, `MonitoringRequirement`,
      `MonitorDeployment`) SHOULD be factored into a `DeploymentMonitoringBundle` base dataclass inherited by both
      `DeployFixCallOutBundle` and `DeployMitigationCallOutBundle`.
    rationale: Sharing the monitoring/prioritization seams via a base dataclass follows BT-23-003 (domain bundle pattern)
      and avoids field duplication across two closely-related bundles.
  - id: BT-20-008
    priority: SHOULD
    kind: project
    statement: A `create_deploy_tree` combinator factory SHOULD compose fix and mitigation arms into an overarching
      `DeployOrMitigateBT` Fallback (fix arm first).
    rationale: The combinator tree delivers the stated goal of the parent epic (#1285) — a composed deployment decision
      tree that prefers fix deployment over mitigation deployment.

- id: BT-21
  title: Fuzzer Node Replacement Lifecycle
  specs:
  - id: BT-21-001
    priority: MUST
    kind: process
    statement: 'Each fuzzer (simulator) BT node targeted for replacement by a production implementation MUST have a corresponding
      tracking issue that captures: the fuzzer node name, the production replacement design (as a BT-20 entry or equivalent),
      and the blocking dependencies. The tracking issue MUST be linked from the relevant BT-20 `tracking_issue` field.'
    rationale: Without a tracking issue per fuzzer node, the replacement backlog is invisible in the project board. The BT-20
      entries document the design; this entry mandates the process artefact (issue) that makes the work schedulable.
    relationships:
    - rel_type: refines
      spec_id: BT-20-001
  - id: BT-21-002
    priority: MUST
    kind: process
    statement: When a fuzzer node is replaced by its production equivalent, the corresponding BT-20 `PROVISIONAL` rationale
      note MUST be updated to remove the `PROVISIONAL` marker and the BT-21-001 tracking issue MUST be closed in the same
      PR.
    rationale: Provisional notes that survive after the production replacement is merged become misleading documentation.
      The two-step close (update spec + close issue) ensures the spec and the project board remain consistent.
    relationships:
    - rel_type: refines
      spec_id: BT-21-001
- id: BT-22
  title: BT Layer Dependency Model
  description: Rules governing the dependency direction between BT nodes and use-case classes. Violations
    of these rules create circular dependency risk, un-auditable call chains, and excessively large update() methods.
  specs:
  - id: BT-22-001
    priority: MUST
    kind: architecture
    statement: A BT leaf node's `update()` method MUST NOT directly instantiate or call a use-case class. Use-case
      classes are the handlers that create BTs; they are not work items to be called from within a BT node. Calling
      a use case from inside a BT node creates a BT→UseCase→BT→UseCase call chain that cannot be audited or preempted.
      Multi-step workflows needed by a BT leaf MUST be modeled as a child subtree of the current tree, not as a use-case
      call embedded in `update()`.
    rationale: The BT tree structure is the source of truth for protocol behavior; any logic that executes outside it
      is invisible to analysis and audit. An in-tree child subtree keeps the full behavior visible in the tree and lets
      it be preempted by a parent Selector. Identified as BT-IDM-01 in notes/bt-canonical-reference.md.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
  - id: BT-22-002
    priority: MUST_NOT
    kind: architecture
    statement: BT nodes in `vultron/core/behaviors/` MUST NOT import private helpers or functions from
      `vultron/core/use_cases/`.
    rationale: Importing a use-case helper into a BT node inverts the hexagonal layer boundary and creates circular
      dependency risk. The import direction is the enforcement mechanism for the layer rule. Identified as BT-IDM-02
      in notes/bt-canonical-reference.md.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
  - id: BT-22-004
    priority: MUST
    kind: architecture
    statement: The dependency direction between BT nodes and use cases MUST be `use_cases/ → behaviors/` (use cases
      create BTs), never `behaviors/ → use_cases/` (BT nodes importing from use cases).
    rationale: The one-way dependency from use cases into behaviors is the structural enforcement of the hexagonal
      layer boundary; reversing it creates circular dependency risk.
  - id: BT-22-005
    priority: MUST
    kind: architecture
    statement: If a helper is needed by both a use case and a BT node, it MUST be extracted to a shared utility module
      (e.g., `vultron/core/behaviors/shared/` or a domain-model method) that neither layer owns.
    rationale: A shared utility module is the canonical resolution when a helper is needed at both layers; placing it
      in either layer would invert or entangle the layer boundary.
    lint_suppress:
    - phantom_path_ref
  - id: BT-22-003
    priority: SHOULD
    kind: architecture
    statement: A BT leaf node's `update()` method SHOULD NOT exceed approximately 30 lines of logic. Nodes whose
      `update()` grows to 60–100+ lines typically encode multiple responsibilities (read, validate, create, persist,
      broadcast) that are better expressed as distinct leaf nodes in a named subtree. Smell signals include more than
      3–4 distinct responsibilities, multiple `dl.save()` calls, Boolean constructor parameters that silently activate
      optional branches, and internal `if/else` chains that should be separate `Sequence`/`Selector` children.
    rationale: Long `update()` methods defeat the core purpose of behavior trees — simple, auditable, composable leaves
      whose complexity is visible in tree structure rather than in individual nodes. Decomposing a god node into a named
      subtree factory makes the workflow readable by inspection. Identified as BT-IDM-03 in notes/bt-canonical-reference.md;
      see also `specs/behavior-tree-node-design.yaml` BTND-02-001.
    relationships:
    - rel_type: refines
      spec_id: BTND-02-001
- id: BT-23
  title: Call-Out Point Backend Selection
  description: >
    Requirements for how running code selects and injects backend factories into
    BT tree builders. Covers the three-mode model (deterministic / stochastic /
    real), the domain bundle dataclass pattern, pre-built singletons, the
    CallOutBackendFactory Protocol, and the default direction rule. Derived from
    the planning session for issue #1631.
  specs:
  - id: BT-23-001
    priority: MUST
    kind: project
    statement: >
      Call-out point backends MUST be organised into three logical modes:
      DETERMINISTIC (AlwaysSucceed/AlwaysFail derived from the ceiling/floor of
      stochastic probabilities), STOCHASTIC (probabilistic fuzzer classes), and
      REAL (production implementations — currently deferred to FUZZ-08d through
      FUZZ-08h). The DETERMINISTIC mode MUST be the default for all tree
      builders, integration tests, and demo scenarios that do not explicitly
      opt into STOCHASTIC or REAL.
    rationale: >
      Deterministic defaults make integration tests and demo scenarios
      repeatable without per-call-site configuration. The probabilistic
      (stochastic) mode is useful only for simulation and fuzz-testing; making
      it the default (as in the original fuzzer heritage) causes non-determinism
      in CI. The three-mode naming also documents the intended migration path:
      DETERMINISTIC → REAL as production implementations are built.
    relationships:
    - rel_type: extends
      spec_id: BT-18-004
      note: >
        BT-18-004 requires factory injection; BT-23-001 specifies that the
        default factory must be the DETERMINISTIC backend, not the stochastic
        fuzzer.
  - id: BT-23-002
    priority: MUST
    kind: project
    statement: When the stochastic success probability p > 0.5, the DETERMINISTIC backend for that call-out point MUST
      be AlwaysSucceed.
    rationale: Grounding the deterministic backend in the stochastic probability preserves the semantic intent of each
      node. Nodes that the simulation expects to usually succeed map to AlwaysSucceed so that deterministic demo
      scenarios make forward protocol progress.
    relationships:
    - rel_type: refines
      spec_id: BT-23-001
  - id: BT-23-006
    priority: MUST
    kind: project
    statement: When the stochastic success probability p < 0.5, the DETERMINISTIC backend for that call-out point MUST
      be AlwaysFail.
    rationale: Nodes that the simulation expects to usually fail map to AlwaysFail, preserving the semantic intent that
      such a call-out point is unlikely to succeed in a realistic scenario.
  - id: BT-23-007
    priority: MUST
    kind: project
    statement: When the stochastic success probability p == 0.5, the DETERMINISTIC backend for that call-out point MUST
      be AlwaysSucceed (happy-path default).
    rationale: The p == 0.5 tie-breaking rule selects the happy-path direction so that deterministic demo scenarios make
      forward protocol progress when the simulation assigns equal probability to success and failure.
  - id: BT-23-003
    priority: MUST
    kind: project
    statement: Call-out point factories for a domain area MUST be collected into a domain bundle — a frozen @dataclass
      (one per domain area) whose fields are typed `CallOutBackendFactory` values.
    rationale: >
      Individual per-node factory kwargs accumulate quickly (a tree builder may
      have 5–10 call-out points); a bundle dataclass keeps the tree builder
      signature clean while enforcing completeness (all fields must be supplied).
      The frozen constraint prevents accidental mutation after construction.
    relationships:
    - rel_type: refines
      spec_id: BT-23-001
    - rel_type: extends
      spec_id: BT-18-004
      note: Replaces the individual factory-kwarg API with the bundle API.
  - id: BT-23-008
    priority: MUST
    kind: project
    statement: The domain bundle dataclass and its DETERMINISTIC singleton (e.g., `VALIDATION_DETERMINISTIC`) MUST be
      defined in the core layer (`vultron/core/behaviors/call_out/bundles/<domain>.py`).
    rationale: The DETERMINISTIC bundle is the production-usable happy-path backend a real actor uses before a
      capability implementation is wired in, so a core tree builder must resolve its default without reaching into the
      simulation layer. Locating it in vultron/demo/ inverts the core→demo dependency (corrects the original
      2026-07-23 amendment).
  - id: BT-23-009
    priority: MUST
    kind: project
    statement: The STOCHASTIC singleton (e.g., `VALIDATION_STOCHASTIC`) MUST be defined in the simulation layer
      (`vultron/demo/fuzzer/bundles/<domain>.py`).
    rationale: The probabilistic STOCHASTIC wiring is a simulation artefact; keeping it in vultron/demo/ respects
      the BT-16-001 rule that simulation artefacts do not appear in vultron/core/.
  - id: BT-23-010
    priority: MUST
    kind: project
    statement: >-
      Tree builders that accept call-out factories MUST accept the bundle as a single typed
      parameter (e.g., `call_out: ValidationCallOutBundle`) rather than individual per-node
      factory kwargs.
    rationale: A bundle parameter keeps the tree builder signature clean and enforces completeness — all fields must
      be supplied, making missing call-out points a static type error rather than a silent runtime omission.
  - id: BT-23-011
    priority: MUST
    kind: project
    statement: Tree builders MUST default the bundle parameter to the core DETERMINISTIC singleton without importing
      from `vultron/demo/` (per BT-16-001 and ARCH-01-001).
    rationale: Pre-built singletons avoid non-DRY construction in every demo script and test fixture. Defaulting to
      the core DETERMINISTIC singleton ensures the tree builder has no simulation-layer import dependency.
  - id: BT-23-004
    priority: MUST
    kind: project
    statement: >
      The CallOutBackendFactory type MUST be defined as a typing.Protocol (not
      a bare Callable type alias). The Protocol MUST declare a single __call__
      method accepting name: str and returning py_trees.behaviour.Behaviour.
      Static type checking (mypy/pyright) is the validation mechanism; no
      central registration or base class inheritance is required.
    rationale: >
      A Protocol produces IDE completion and pyright/mypy enforcement of the
      factory signature without requiring runtime registration overhead. Duck-
      typing via Protocol is consistent with how other ports in the codebase are
      typed (vultron/core/ports/use_case.py), and avoids the coupling risk of a
      central registry (name-key typos are silent runtime failures rather than
      static errors).
    relationships:
    - rel_type: refines
      spec_id: BT-23-003
    - rel_type: extends
      spec_id: BT-18-004
  - id: BT-23-005
    priority: SHOULD
    kind: project
    statement: >
      Domain bundle classes SHOULD follow the naming convention
      <Domain>CallOutBundle (e.g. ValidationCallOutBundle,
      EmbargoCallOutBundle) and the pre-built singletons SHOULD be named
      <DOMAIN>_DETERMINISTIC and <DOMAIN>_STOCHASTIC (e.g.
      VALIDATION_DETERMINISTIC, EMBARGO_STOCHASTIC). The dataclass and the
      DETERMINISTIC singleton SHOULD live in
      vultron/core/behaviors/call_out/bundles/<domain>.py; the STOCHASTIC
      singleton SHOULD live in vultron/demo/fuzzer/bundles/<domain>.py, which
      MAY re-export the core dataclass and DETERMINISTIC singleton for
      backward-compatible import paths.
    rationale: >
      Consistent naming makes the available bundles discoverable without reading
      the implementation. Splitting the seam by layer keeps the deterministic,
      production-usable default in core while co-locating the STOCHASTIC wiring
      with the probabilistic fuzzer nodes it references, respecting the
      BT-16-001 rule that simulation artefacts stay in vultron/demo/ and do not
      appear in vultron/core/. The core→demo boundary is enforced by
      test/architecture/test_core_no_demo_imports.py.
    relationships:
    - rel_type: refines
      spec_id: BT-23-003
