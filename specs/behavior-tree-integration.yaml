id: BT
title: Behavior Tree Integration
description: Requirements for integrating py_trees behavior trees into Vultron handler functions. Covers the BT execution
  model, state management via the DataLayer, handler integration patterns, actor isolation, concurrency constraints, and failure
  diagnosis. Complex protocol workflows such as report validation, case creation, and embargo management must be implemented
  as BT nodes or subtrees.
scope:
- prototype
- production
tags:
- behavior-tree
groups:
- id: BT-01
  title: BT Execution Model
  specs:
  - id: BT-01-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: BT execution MUST be event-driven, triggered by handler invocation
    rationale: >-
      Case state changes only when an event occurs: a received message or a local
      trigger. A tree that runs on any other cue can change state with no activity to
      record, attribute or answer for.
  - id: BT-01-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: BTs MUST execute to completion (or max iterations) per invocation
    rationale: >-
      The bridge keeps no tree between requests, so a tree that stops part of the way
      loses its place. Each tree runs to completion. An iteration limit stops a node
      that never settles. Thus every request gets a known result.
  - id: BT-01-003
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: BT execution MUST NOT use continuous tick-based polling loops
    rationale: >-
      A polling loop needs a long-lived process that ticks trees between messages, and
      this design has no place for that process. A polling loop also does unnecessary
      work, and it can change state with no event to answer for. Event-driven runs
      (BT-01-001) cover every case that the protocol needs.
  - id: BT-01-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: BTs MUST be single-shot executions within handler context
    rationale: >-
      A tree that runs once inside the handler call uses the same store, actor and error
      handling as that call. Thus the result of the tree is the result of the handler. A
      tree that continues after the handler returns acts after the inbox outcome is
      already set.
- id: BT-02
  title: BT Library
  specs:
  - id: BT-02-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Prototype handlers MUST implement BT execution using industry- standard BT library
    rationale: Mature libraries provide visualization, debugging, and standard BT semantics
    adr:
    - ADR-0008
  - id: BT-02-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Simulation code in `vultron/bt/` MUST remain unchanged
    rationale: >-
      New trees are checked against the legacy simulator in `vultron/bt/` (BTC-01-002).
      If you change the simulator to suit new code, you remove the reference that it
      keeps. You also put the demos and tests of the simulator at risk, with no gain for
      the protocol.
    adr:
    - ADR-0003
- id: BT-03
  title: State Management
  specs:
  - id: BT-03-001
    priority: MUST
    kind: project
    statement: BTs MUST use DataLayer as persistent state store
    rationale: >-
      The DataLayer is the only state that continues after a tree run, and the only
      state that other components read. If a tree keeps state in a different location,
      that state is lost when the run ends, or it does not agree with the store.
    verification: >-
      Inspection of BT node implementations in `vultron/core/behaviors/` confirms that
      all state reads and writes go through DataLayer method calls, with no in-memory-only
      persistence outside the DataLayer.
    stories:
    - story_2022_088
    - story_2022_074
  - id: BT-03-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: BTs MUST NOT maintain separate blackboard persistence
    rationale: >-
      A second persistent copy of state on the blackboard gradually becomes different
      from the DataLayer. Then one question has two answers. Blackboard storage is
      process-global, so persisted values also go from one run into the next
      (BT-17-003).
  - id: BT-03-003
    priority: MAY
    kind: project
    statement: BT blackboard MAY cache DataLayer state during execution
    rationale: >-
      A node that reads the same object many times in one run causes unnecessary store
      reads. A cache that exists only for that run stays close to the store, because
      every write still goes to the store (BT-03-001, BT-03-004).
  - id: BT-03-004
    priority: MUST
    kind: project
    statement: State changes MUST be committed to DataLayer on successful execution
    rationale: >-
      A successful run shows that the protocol step occurred. If the run does not save
      its changes, the actor reports the step as done, but its store still shows the
      earlier state. Then peers act on a step that the actor does not record.
    verification: >-
      A unit test confirms that a BT node's successful `update()` path calls `dl.save()`
      (or equivalent DataLayer commit) before returning `Status.SUCCESS`.
    stories:
    - story_2022_088
    - story_2022_074
- id: BT-04
  title: Handler Integration
  specs:
  - id: BT-04-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Handler protocol MUST be preserved (decorator, signature, registration)
    rationale: >-
      When the work inside a handler moves into a tree, the path of messages to the
      handler must not change. A fixed handler contract keeps the dispatcher, the
      routing table and the current tests the same while the internal parts of the
      handler change.
  - id: BT-04-002
    priority: MAY
    kind: project
    statement: Handlers MAY invoke BTs via bridge layer
    rationale: >-
      A bridge gives every handler one procedure to set up and run a tree. Thus each
      handler does not repeat the setup of the store, the actor and the blackboard.
  - id: BT-04-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Handlers MUST remain synchronous (BT execution within handler)
    rationale: >-
      The inbox runs handlers outside the request path (BT-11-002), so a synchronous
      handler does not delay the HTTP response. When the tree runs inside that
      synchronous call, the run finishes and its errors show before the handler returns.
  - id: BT-04-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: BT execution errors MUST propagate to handler error handling
    rationale: >-
      If an error stops at the tree, the handler reports success for a step that failed.
      When the error goes up to the caller, the inbox outcome and the logs show the
      failure.
- id: BT-05
  title: BT Bridge Layer
  specs:
  - id: BT-05-001
    priority: SHOULD
    kind: project
    statement: System SHOULD provide BT execution bridge for handler-to-BT invocation
    rationale: >-
      The bridge is the one connection between handlers and trees. With one bridge, the
      code for locking (BT-11-004), blackboard cleanup (BT-17-007) and failure reports
      (BT-13-001) exists once for every tree. Thus it cannot be different between
      handlers.
  - id: BT-05-002
    priority: SHOULD
    kind: project
    statement: Bridge SHOULD set up py_trees context with DataLayer access
    rationale: >-
      Nodes read and write through the DataLayer (BT-03-001). When the store is on the
      blackboard, every node in a tree gets the same store, and no node must receive it
      separately.
  - id: BT-05-003
    priority: SHOULD
    kind: project
    statement: Bridge SHOULD populate blackboard with activity and actor state
    rationale: >-
      Nodes need the activity that the tree processes and the identity of the actor that
      runs the tree. When both are on the blackboard, every node in the tree has the
      same view of the request.
  - id: BT-05-004
    priority: SHOULD
    kind: project
    statement: Bridge SHOULD execute tree and return execution result
    rationale: >-
      The caller uses the outcome of the tree to set its own result and to report why a
      run failed (BT-13-001). The bridge returns the outcome, so callers do not tick
      trees or read the internal parts of trees.
  - id: BT-05-005
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: project
    statement: >-
      A behavior tree's blackboard `datalayer` MUST be the store of its blackboard `actor_id`. The
      bridge MUST reconcile the two rather than accepting whatever store the caller injected.
    rationale: >-
      With per-actor storage, each store belongs to one actor. Thus the identity of the
      executing actor selects the store that the tree uses. If the store and the actor
      on the blackboard do not agree, a tree that emits for the Case Actor can create an
      activity in one store and queue it in the outbox of a different actor. Then the
      Case Actor never delivers the activity, and its outbox names an activity that its
      own store does not hold. The bridge makes the store and the actor agree one time.
      Thus every node writes to the correct store, and each caller does not have to
      supply a matching DataLayer. A fix only at the trigger is not sufficient. Store
      isolation must not depend on each caller doing the correct thing, in the same way
      that it must not depend on each query using a filter. If the store authority does
      not host the `actor_id`, no store is available to agree with. Thus the bridge
      raises an error and does not run the tree in the store of the requester. A
      participant whose container does not host the CASE_MANAGER sends a message to it
      (CM-24-004, ADR-0109).
    relationships:
    - rel_type: implements
      spec_id: DL-07-001
    - rel_type: refines
      spec_id: BT-05-002
    verification: >-
      `test/core/behaviors/test_bridge.py` asserts that the blackboard's `datalayer.actor_id` equals
      the blackboard's `actor_id`, that an injected store which already belongs to the executing
      actor is passed through un-cloned, and that an `actor_id` under an authority the injected
      store does not host raises rather than falling through to the injected store.
    exceptions:
    - >-
      A store that cannot name its own actor — a test double, or any
      implementation that reports no `actor_id` — is passed through unchanged.
      There is nothing to reconcile against, and such callers were correct
      before per-actor storage.
    tags:
    - behavior-tree
    - persistence
    adr:
    - ADR-0073
    - ADR-0109
  - id: BT-05-006
    lint_suppress:
    - rationale_too_long
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The executing actor of a role-gated tree MUST hold the gating role, and the tree's store MUST be
      that actor's. Where a tree is gated on a role held in the case, the role holder, the receiving
      actor and the store owner MUST be one actor.
    rationale: >-
      These are three separately-specified identities, and letting any two drift produces a silent skip
      rather than an error: the gate evaluates against an actor that holds no role, returns
      SUCCESS-by-skip, and nothing is written. This is the invariant that made the delegated-emit defect
      class possible in the first place. Stated as a MUST rather than a note because production
      satisfying it today is not the same as it being required — without one, a future BT node can
      re-separate the three identities and the failure mode is again a silent skip. A static
      architecture ratchet was considered and rejected: role holding is data-dependent, so a check
      could only approximate it and would be noisy.
    relationships:
    - rel_type: refines
      spec_id: BT-05-005
    - rel_type: refines
      spec_id: CLP-09-001
    exceptions:
    - >-
      A test may deliberately let the three differ in order to assert the *skip* path, in which case it
      MUST assert the skip rather than a commit.
    references:
    - plan/incoming/learnings/20260819-role-holder-receiver-store-must-agree.md
    tags:
    - behavior-tree
    - persistence
    adr:
    - ADR-0073
- id: BT-06
  title: Workflow-Specific Trees
  specs:
  - id: BT-06-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: All protocol-significant behavior MUST be implemented as BT nodes or subtrees. There is no "simple enough to
      skip" threshold.
    rationale: The BT is the domain documentation; behaviors outside the tree are invisible to analysis, audit, and explainability.
    adr:
    - ADR-0002
  - id: BT-06-002
    priority: MUST
    kind: project
    statement: Prototype use-case BTs MUST correspond to identifiable subtrees of the canonical CVD protocol BT
    rationale: >-
      When a use-case tree agrees with the canonical protocol tree, a reviewer can check
      it against the protocol design. A tree with no known equivalent can become
      different from the protocol, and nothing shows the difference (BTC-01-001).
    verification: >-
      Inspection of `vultron/core/behaviors/` confirms that each use-case BT implements a
      subtree identifiable in `vultron/bt/` by name or documented correspondence in the
      spec.
  - id: BT-06-003
    priority: SHOULD
    kind: project
    statement: BT nodes SHOULD be deterministic
    rationale: >-
      A deterministic node gives the same result for the same store and input. Thus a
      test can repeat a run, and you can find the cause of a failure. Randomness belongs
      in the simulation backends (BT-23-001), not in protocol nodes.
  - id: BT-06-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Individual BT nodes MUST be simple and focused on a single concern (e.g., a single exception check or a single
      boolean condition)
    rationale: Surfacing logic in the tree makes the process auditable without reading implementation code; if it is not in
      the tree it cannot be reasoned about from the tree alone.
  - id: BT-06-005
    priority: MUST
    kind: architecture
    statement: >-
      Cascades from a parent subtree to a child subtree MUST be expressed as subtrees within
      the use case's behavior tree, not as procedural calls made after the tree has run.
    rationale: >-
      A cascade that runs after the tree returns is outside the guards, logs and failure
      reports of the tree. It can also run when the outcome of the tree must stop it. As
      a subtree, the cascade shows in the tree structure, and it does not run when its
      parent fails.
    verification: >-
      Inspection of all use-case `execute()` methods confirms that no protocol-observable
      state changes or message sends occur in procedural code after
      `BTBridge.execute_with_setup()` returns.
  - id: BT-06-006
    priority: MUST_NOT
    kind: architecture
    verification: >-
      Marked tests in `test/core/behaviors/report/test_develop_fix_tree.py` and
      `test/core/use_cases/received/test_embargo_invite_lapse.py` confirm the guarded
      transitions run inside the tree; inspection of use-case `execute()` methods
      confirms no protocol-observable action or state transition is performed outside
      the BT.
    statement: Protocol-observable actions and state transitions MUST NOT be performed as procedural code outside the BT.
    rationale: >-
      Code outside the tree is not subject to the guards, the ledger commit or the
      failure reports of the tree. Thus a protocol action in that code has no audit, and
      the tree cannot refuse it. When every such action is in the tree, the tree is the
      full record of what the actor did.
- id: BT-07
  title: DataLayer Integration
  specs:
  - id: BT-07-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: BT nodes MUST interact with DataLayer via Protocol interface
    rationale: >-
      Nodes that depend on the DataLayer Protocol, not on one specific store, operate
      with any adapter. This includes per-actor stores and test doubles. It also keeps
      adapter imports out of the core.
  - id: BT-07-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: BT nodes MUST use type-safe DataLayer operations
    rationale: >-
      Typed reads and writes find an object of the incorrect type at the point where a
      node reads it. They do not let a later node trust that value. With an untyped
      read, a node can act on the incorrect kind of object and fail far from the cause.
  - id: BT-07-003
    priority: MUST
    kind: project
    statement: State transitions MUST be logged at the level specified by SL-04-001
    rationale: >-
      An operator follows state transitions to understand a case. When each transition
      goes to the log at the agreed level, the operator can find it in the log of every
      component. It also stays separate from debug messages.
    verification: >-
      Integration tests in `test/demo/` confirm that every RM, EM, and CS state
      transition produces a structured log entry at the level specified by SL-04-001.
    relationships:
    - rel_type: depends_on
      spec_id: SL-03-001
    - rel_type: depends_on
      spec_id: SL-04-001
    stories:
    - story_2022_074
    - story_2022_088
- id: BT-08
  title: Command-Line Execution
  specs:
  - id: BT-08-001
    priority: MAY
    kind: project
    statement: System MAY provide CLI interface for BT execution
    rationale: >-
      When a developer can run a tree from the command line, the developer can test it
      without a server, an inbox or a peer.
  - id: BT-08-002
    priority: SHOULD
    kind: project
    statement: CLI SHOULD support invoking specific trees with test data
    rationale: >-
      When you run one tree with selected data, the inbox and dispatch path do not have
      an effect on it. Thus you can find and repeat a defect in the tree more easily.
  - id: BT-08-003
    priority: SHOULD
    kind: project
    statement: CLI SHOULD log BT execution visualization
    rationale: >-
      A diagram of the tree as it ran shows which branch the tree took and where it
      failed. A result of pass or fail alone does not show this.
- id: BT-09
  title: Actor Isolation
  specs:
  - id: BT-09-001
    priority: MUST
    kind: project
    statement: Each actor MUST have isolated BT execution context
    rationale: >-
      Each actor makes its own decisions from its own state. If two actors use one run
      context, the run of one actor can read or change the state of the other actor.
      Then the case records of the two actors are not independent.
    verification: >-
      Integration tests in `test/demo/` confirm that processing messages for two
      different actors produces independent DataLayer writes with no cross-actor state
      overlap.
    stories:
    - story_2022_088
    - story_2022_106
  - id: BT-09-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: Actor blackboards MUST NOT share state
    rationale: >-
      Blackboard storage is process-global, and many actors can run in one process. With
      a shared key, the run of one actor can read a value that the run of a different
      actor wrote (BT-17-007).
- id: BT-10
  title: Case Manager Role Management
  specs:
  - id: BT-10-001
    priority: MUST
    kind: project
    statement: Report validation MUST trigger VulnerabilityCase creation
    rationale: >-
      When a report is valid, the receiving actor starts to coordinate the
      vulnerability. Every later CVD activity is part of a case. Without the case, the
      activities that follow have no context.
    verification: >-
      Integration tests in `test/demo/test_receive_report_demo.py` confirm that
      processing a valid `CreateReport` activity results in a new `VulnerabilityCase`
      record in the DataLayer.
    relationships:
    - rel_type: implements
      spec_id: VP-02-015
    - rel_type: implements
      spec_id: VP-02-020
    stories:
    - story_2022_012
    - story_2022_101
  - id: BT-10-002
    priority: MUST
    kind: protocol
    statement: >-
      Case creation MUST establish the case's CASE_MANAGER by recording a participant
      that holds the `CASE_MANAGER` role. It MUST NOT require a per-case `Service`
      actor, and MUST NOT mint a per-case actor identity: the actor enacting the role
      keeps its own actor identity, and the case a message concerns is carried by the
      activity's `context`.
    rationale: >-
      The CASE_MANAGER is a role that a participant holds. It is not a separate entity.
      An actor takes part in many cases and keeps one identity in all of them. The
      activity's `context` identifies the case that a message is about. A container
      cannot host a per-case actor identity. The sender calculates that identity from
      the report id or case id. Thus no container can register it, and every message to
      it fails. A container cannot prepare it before use either, because the id is not
      known until a report exists. A `Service` record for each case only repeats what
      the role already shows. A future process that runs one case gets its own actor
      identity for the same reason.
    relationships:
    - rel_type: refines
      spec_id: CP-04-002
    verification: >-
      `test/core/behaviors/case/test_case_actor_identity.py` asserts the identity does
      not vary by case and that the slugged form is rejected;
      `test/core/behaviors/case/test_receive_report_case_tree.py` asserts
      `case_creator_id` is the container identity and contains no slug.
    adr:
    - ADR-0041
    stories:
    - story_2022_012
    - story_2022_046
  - id: BT-10-003
    priority: MUST
    kind: protocol
    statement: >-
      The actor holding the `CASE_MANAGER` role for a case MUST process that case's
      messages. The authority is that role, not any particular actor that enacts it.
    rationale: >-
      When message processing follows the role and not one specific object, any actor
      that holds the role can do the work. This includes an actor that the Case Owner
      delegates the role to, and the Case Owner itself. If an obligation names a
      separate case actor, implementations create one for each case, which BT-10-002
      forbids.
    relationships:
    - rel_type: refines
      spec_id: BT-10-002
    verification: >-
      `test/core/behaviors/case/nodes/test_role_gates.py::TestCaseManagerGate` asserts
      the role holder runs the case-scoped children and a non-holder does not, with the
      holder identified by `CVDRole.CASE_MANAGER` on its participant record rather than
      by any actor object.
    stories:
    - story_2022_088
    - story_2022_039
  - id: BT-10-004
    priority: MUST
    kind: protocol
    statement: >-
      The actor holding the `CASE_MANAGER` role for a case MUST enforce that case's
      authorization decisions, and MUST do so because it holds that role, not because of
      a per-case actor identity.
    rationale: >-
      When authority follows the role, it moves with a delegation, and it does not
      depend on one specific software actor. It also operates when the Case Manager is a
      person or an organization and not a service, which is the general case. BT-10-006
      tells how the gates in this codebase test for the role.
    scope:
    - production
    relationships:
    - rel_type: refines
      spec_id: CLP-09-001
    - rel_type: refines
      spec_id: CLP-09-003
    - rel_type: refines
      spec_id: CLP-09-004
    verification: >-
      `test/core/behaviors/case/nodes/test_role_gates.py::TestCaseManagerGate` asserts
      the gate admits only the `CVDRole.CASE_MANAGER` holder and that a failure by that
      holder is reported rather than masked by the skip path a non-holder takes.
    stories:
    - story_2022_035
    - story_2022_036
  - id: BT-10-005
    priority: SHOULD
    kind: protocol
    statement: >-
      The CASE_MANAGER SHOULD record an invitee's RM state as RM.RECEIVED when it emits
      the stub Invite (CM-11-006), and SHOULD leave it at RM.RECEIVED when the invitee
      accepts the stub (CM-11-001). The invitee's triage is driven by its replies to the
      full-case Invite (RM.VALID, RM.INVALID or RM.CLOSED, CM-11-011) and then by
      `Join(VulnerabilityCase)` or `Ignore(VulnerabilityCase)` (RM.ACCEPTED or
      RM.DEFERRED).
    rationale: >-
      When the invitee accepts the Stub Invite, it only asks for the full case. It does
      not say if the report is valid. RM.RECEIVED shows that the invitee holds the case
      but has not made a triage decision. The invitee stays in RM.RECEIVED until it
      answers the Full-Case Invite. Thus the record of the CASE_MANAGER does not show a
      decision that the invitee has not made.
    relationships:
    - rel_type: implements
      spec_id: CM-11-006
    - rel_type: implements
      spec_id: CM-11-001
    adr:
    - ADR-0114
    - ADR-0121
  - id: BT-10-006
    priority: MUST
    kind: project
    statement: >-
      This codebase's CASE_MANAGER gates (BT-10-004) MUST test for the
      `CVDRole.CASE_MANAGER` role on the actor's participant record, not for a CaseActor
      object or a per-case actor identity.
    rationale: >-
      `CheckIsCaseManagerNode` reads the role from the participant record and needs no
      notion of a CaseActor entity, so the gate works for any actor the case owner
      delegates the role to.
    verification: >-
      `test/core/behaviors/case/nodes/test_role_gates.py::TestCaseManagerGate` asserts the
      gate admits the actor whose participant record carries `CVDRole.CASE_MANAGER` and
      skips one whose record does not, with no CaseActor object or per-case actor
      identity in the setup.
    relationships:
    - rel_type: implements
      spec_id: BT-10-004
- id: BT-12
  title: VFD/PXA State Machine Usage
  specs:
  - id: BT-12-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: When implementing VFD (vendor fix deployed) or PXA (public exploit/attack) state transitions, new code MUST
      use `create_vfd_machine()` and `create_pxa_machine()` (defined in `vultron/core/states/cs.py`) as the authoritative
      source of valid transition sequences. Hand-rolled transition logic for these state dimensions MUST NOT be introduced.
    rationale: Ensures the `transitions` machines remain the normative definition of valid VFD/PXA state progressions as new
      features are added, preventing divergence between the machines and the implementation.
  - id: BT-12-002
    priority: SHOULD
    kind: project
    statement: >-
      A high-level BT node that writes a target VFD state SHOULD advance
      through all required intermediate states automatically when the actor
      starts below the required entry point. Callers MUST NOT be required to
      pre-advance through intermediate states before invoking such a node.
    rationale: >-
      A vendor that reports a fix as ready has known about the vulnerability since it
      engaged. But the VFD machine gets to fix-ready (VFd) only through vendor-aware
      (Vfd). If each caller must go through Vfd first, each call site must know the
      order of the machine. Thus, when the actor is still at vfd, the node does the
      implied V step itself. The node then records two ParticipantStatus entries and
      logs two CS transitions, one for each step.
- id: BT-11
  title: Concurrency
  specs:
  - id: BT-11-001
    priority: MUST
    kind: project
    statement: Prototype MUST process messages sequentially (FIFO order)
    rationale: Eliminates race conditions in prototype phase
    verification: >-
      Integration tests in `test/demo/` confirm that inbox messages are processed
      sequentially, with each BT execution completing before the next message is
      dispatched.
    stories:
    - story_2022_088
    - story_2022_039
  - id: BT-11-002
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_orchestration_offloop.py::test_event_loop_keeps_serving_while_a_payload_is_processed`
      confirms the inbox keeps serving requests while a payload is processed in the
      background.
    statement: Sequential processing MUST NOT block HTTP response (BackgroundTasks)
    rationale: >-
      A sending peer waits for the HTTP response. If the inbox processes a payload
      inside the request, every sender waits for the tree runs of the receiver, and
      requests time out under load. Thus the inbox answers first and then processes the
      payload in the background.
  - id: BT-11-003
    priority: MAY
    kind: project
    statement: Future optimizations MAY introduce resource-level locking
    rationale: >-
      When the inbox processes one message at a time, the design is simple, but
      throughput is low. A lock for each resource, for example each case, lets unrelated
      messages run at the same time. Messages that touch the same state still run one
      after the other.
    scope:
    - production
  - id: BT-11-004
    priority: MUST
    kind: project
    statement: '`BTBridge` MUST acquire a `threading.RLock` (re-entrant lock), not a plain `threading.Lock`, when serializing
      BT execution. Any code path in which `execute_with_setup()` calls back into `BTBridge` (directly or transitively) will
      deadlock with a plain `Lock` because the same thread attempts to acquire a non-reentrant lock it already holds.'
    rationale: '`BTBridge.execute_with_setup()` invokes user-supplied setup and teardown hooks. In integration and demo scenarios
      these hooks may trigger secondary BT executions via the same bridge instance. A plain `Lock` would deadlock on the second
      acquisition from the same thread. An `RLock` allows re-entry by the owning thread while still blocking other threads.'
    verification: >-
      Inspection of `vultron/core/behaviors/bridge.py` confirms `BTBridge` uses
      `threading.RLock`; a unit test confirms that a re-entrant call from a setup hook
      does not deadlock.
    relationships:
    - rel_type: refines
      spec_id: BT-11-001
- id: BT-13
  title: BT Failure Diagnosis
  specs:
  - id: BT-13-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'After any BT execution that returns FAILURE, code MUST retrieve the failure reason via `BTBridge.get_failure_reason(tree)`
      (a walk down the chain of failed nodes to the failing leaf, taking the last failed child of each composite). Code MUST
      NOT log or inspect `result.feedback_message` or `bt.root.feedback_message` for diagnostic purposes: a `py_trees` Sequence
      root''s `feedback_message` is always `""` when a child fails, regardless of what the failing child set. The one exception
      is a node that raised: it never set a status, so `get_failure_reason` finds no failing leaf, and `result.feedback_message`
      then carries the bridge''s composed exception message.'
    rationale: '`py_trees` sets `feedback_message` on the failing child node, not on the parent Sequence. Logging the root
      message produces an empty string that is indistinguishable from "no error" in logs, making failures completely silent.
      `get_failure_reason()` walks to the actual failing leaf and returns its message.'
  - id: BT-13-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The `BTBridge.get_failure_reason()` pattern MUST be applied consistently across all BT execution sites, not
      only for a single BT class or protocol flow. Any place in the codebase that logs a BT result MUST use this helper.
    rationale: >-
      If one execution site reports a failure reason and a different site loses it, some
      failures stay silent. One helper at every site puts the message of the failing
      node in every log (BT-13-001).
    relationships:
    - rel_type: refines
      spec_id: BT-13-001
      note: Scope is all BT execution sites, not just sync
- id: BT-14
  title: Peer Broadcast Failure Semantics
  specs:
  - id: BT-14-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Any BT node or subtree that performs protocol-visible peer broadcast fan-out MUST return FAILURE when broadcast
      preparation or outbox enqueueing fails. A guaranteed SUCCESS fallback that masks delivery failure MUST_NOT be used.
    rationale: Silent success on failed fan-out causes undetected peer state divergence and hides correctness faults from
      parent tree control flow.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
      note: Broadcast fan-out is protocol-significant behavior
    - rel_type: refines
      spec_id: BT-04-004
      note: Delivery failures must propagate to handler error paths
  - id: BT-14-002
    priority: SHOULD
    kind: project
    statement: Peer broadcast fan-out paths SHOULD reuse a shared helper/subtree for recipient filtering, activity construction,
      and outbox enqueueing so the failure contract is consistent across workflow domains.
    rationale: Duplicated fan-out implementations drift over time and re-introduce silent-failure behavior in only some pathways.
- id: BT-15
  title: Trigger-Side Use-Case Contract
  specs:
  - id: BT-15-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Trigger-side execute() methods MUST delegate state-machine transitions (RM, EM, CS) to BT leaf nodes via BTBridge,
      following the same pattern as received-side use cases.
    rationale: >-
      State machine transitions are protocol-significant behavior (BT-06-001). A
      transition inside `execute()` is not subject to the audit, logs and failure
      reports of the tree through `get_failure_reason()`. When both sides use one
      pattern, a reader finds every transition in a tree, on whichever side it started.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
      note: SM transitions are protocol-significant behavior with no skip threshold
    - rel_type: refines
      spec_id: BT-06-006
      note: SM transitions performed outside a BT violate BT-06-006
  - id: BT-15-002
    priority: MUST_NOT
    kind: project
    verification: >-
      Marked tests in `test/core/behaviors/report/test_trigger_report_trees.py` confirm
      trigger state changes run inside the trigger tree; inspection of trigger-side
      `execute()` methods confirms no domain lifecycle method or direct status write is
      called outside a BT execution context.
    statement: Trigger-side execute() methods MUST NOT call domain lifecycle methods (e.g., EmbargoLifecycle, direct
      ParticipantStatus writes of rm/em state) outside a BT execution context.
    rationale: Direct lifecycle calls in execute() make protocol transitions invisible to BT-level audit and observability
      tooling. The BTBridge pattern (instantiate BT → execute_with_setup() → introspect result) is the required contract for
      all use-case execute() methods that perform state transitions.
    relationships:
    - rel_type: refines
      spec_id: BT-06-006
  - id: BT-15-003
    priority: MUST
    kind: project
    statement: >-
      A BT-backed trigger whose request names a case MUST run the case-wide
      clock decisions (the embargo end-time check, EMB-13-003) as the leading,
      CASE_MANAGER-gated step of its own one tree, the same clock-decision
      stage a received tree runs (CLP-10-025), and never as a separate tree
      run before it. The terminate-embargo trigger is the one exception: its
      own tree takes the end-time path once the end time has passed and
      answers for it. An embargo trigger also takes the overdue-invitation
      sweep (CM-28-015) in that stage, after the case-wide decisions;
      terminate-embargo takes the sweep alone. A trigger that runs no tree
      changes no case state and takes no clock decision.
    rationale: >-
      An overdue embargo is a fact about the case, at every entry point. Without the
      check, a trigger can extend an embargo whose end time has passed, for example when
      it accepts a pending revision. The check runs as the first stage of the trigger
      tree. Thus each request has one tree, and the check and the trigger effects have
      one run and one outcome (ADR-0135).
    verification: >-
      `test/core/use_cases/triggers/test_base.py` asserts a case-scoped
      trigger's tree leads with the gated clock-decision stage, that a trigger
      naming no case or an unknown one runs its own tree alone, that every
      case-scoped trigger in the registry takes the case-wide decisions
      except terminate-embargo and the one trigger that runs no tree, and
      that an embargo trigger's stage adds the sweep, terminate-embargo's
      holding the sweep alone;
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py`
      asserts a trigger after the end time finds the embargo ended at its end
      time, that accepting, revising or withdrawing from the embargo then
      commits nothing for it, and that a trigger still runs when the ledger
      refuses the termination.
    relationships:
    - rel_type: refines
      spec_id: BT-15-001
    - rel_type: refines
      spec_id: CLP-10-025
    adr:
    - ADR-0135
- id: BT-17
  title: Role-Gated BT Subtrees and Blackboard Hygiene
  specs:
  - id: BT-17-001
    priority: MUST
    kind: project
    statement: Any BT subtree whose semantics are restricted to the `CVDRole.CASE_MANAGER` actor MUST be wrapped in a role-guard
      composite using `CheckIsCaseManagerNode` at tree-composition time, not enforced via application-layer guards outside
      the tree.
    rationale: >-
      Received-side trees run as the receiving actor. Without a role guard in the tree,
      a CASE_MANAGER-only node runs at every actor that receives the activity. This
      includes participants that must only record it. If such a run also sets a
      once-only marker, it can take the slot and stop the run of the CASE_MANAGER
      (BT-17-002). A guard in the tree shows in the tree structure, and it applies on
      every path that runs the subtree. The canonical role-guard composite is a
      Selector. It has a guarded Sequence (`CheckIsCaseManagerNode` and the action node)
      and a `Success("Skipped")` fallback.
    verification: For any BT node whose docstring or name implies CASE_MANAGER-only semantics, grep the tree-composition function
      that instantiates it and confirm a `CheckIsCaseManagerNode` wraps the subtree.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
      note: CASE_MANAGER-only behavior is protocol-significant; it must live inside the tree with an explicit guard
  - id: BT-17-002
    priority: MUST
    kind: project
    statement: A module-level idempotency set (a `set[str]` used to track "already fired" state for a BT node) MUST be paired
      with a role guard (BT-17-001) that prevents any actor other than the intended role from writing to the set.
    rationale: 'Module-level sets are per-process, not per-container. In a Docker deployment, each actor process has its own
      set; a phantom fire in process A does not affect process B. However, within a single process, two phantom fires (the
      wrong actor fires before the correct one) can race: the phantom claims the set slot first and silently blocks the legitimate
      fire. Pairing the set with a role guard ensures only the correct actor can claim the slot.'
    verification: Inspect every module-level `set` used for BT idempotency; confirm the node that writes to it is also guarded
      by `CheckIsCaseManagerNode` or equivalent role-check at tree-composition time.
    relationships:
    - rel_type: refines
      spec_id: BT-17-001
  - id: BT-17-003
    priority: MUST
    kind: project
    statement: When a BT node takes a no-op path (e.g., an empty recipient list or a guard condition that is not met), it
      MUST explicitly write `None` to any output blackboard key it would normally set before returning FAILURE or SUCCESS.
      It MUST NOT leave a stale value from a previous execution in the blackboard.
    rationale: >-
      `py_trees.blackboard.Blackboard.storage` is process-global. On exit,
      `execute_with_setup` resets only the keys on its `managed_keys` allowlist. Thus a
      key that a node writes stays after the run, unless the allowlist includes it. A
      consumer that reads such a key can get the value from an earlier run, when the
      producer stops early and does not write `None`. Then independent runs share data,
      and no error shows it.
    verification: Add a regression test that runs two `execute_with_setup` calls back-to-back without clearing the blackboard
      between them; assert the second run does not observe output values from the first when the node takes a no-op path.
    relationships:
    - rel_type: refines
      spec_id: BT-06-004
      note: Blackboard cleanup is part of the blackboard management contract
  - id: BT-17-004
    priority: MUST
    kind: project
    statement: A consumer BT node that reads an output key set by a peer producer node MUST treat both `KeyError` (key never
      written) and a `None` value (producer took no-op path per BT-17-003) as equivalent no-op sentinels and skip any write-dependent
      action.
    rationale: A node that only handles `KeyError` but not `None` will incorrectly proceed with a `None` value on the second
      run after the producer has cleared the key to `None`. Both states mean "producer had nothing to produce this cycle."
    verification: Unit tests for consumer nodes MUST include a case where the blackboard key is `None` and assert the consumer
      skips the dependent action.
    relationships:
    - rel_type: refines
      spec_id: BT-17-003
  - id: BT-17-005
    priority: MUST
    kind: project
    statement: Tests for a received-side use case that exercises a BT guarded-commit path MUST pass `receiving_actor_id` equal
      to the actor holding `CVDRole.CASE_MANAGER` in `actor_participant_index`, not the `CaseActor` service entity
      ID.
    rationale: >-
      `CheckIsCaseManagerNode` compares `actor_id` with the participant that holds
      `CVDRole.CASE_MANAGER` in `actor_participant_index`. It does not compare it with
      the id of the `CaseActor` service resource. A test that uses the service id fails
      the role check, and no error shows. The guarded commit does not run, the RM state
      takes the deferred path, and the test can pass for the incorrect reason.
    verification: In any test fixture for a received-side use case with a guarded-commit BT, assert that `receiving_actor_id`
      matches the actor whose ID is stored as `CVDRole.CASE_MANAGER` in the test case's `actor_participant_index`.
    relationships:
    - rel_type: refines
      spec_id: BT-17-001
      note: The role guard identity check is what makes this fixture requirement necessary
  - id: BT-17-006
    priority: MUST
    kind: project
    statement: >-
      A received-side use case that executes a BT containing
      `GuardedCommitCaseLedgerEntryBT` MUST call `execute_with_setup` with the
      *receiving* actor, never with `request.actor_id` (the sender). When
      `request.receiving_actor_id` is absent, the receiving actor MUST be taken to
      be the owner of the store the use case was handed, and the call MUST fail
      rather than proceed if neither source yields an identity. When a BT node
      inside that tree also needs to target the sender's participant (e.g. to
      advance their RM state), it MUST store the sender's ID in a private
      attribute (e.g. `_target_actor_id`) that `DataLayerAction.setup()` does
      not overwrite.
    rationale: >-
      In a received-side use case, `request.actor_id` is the sender of the inbound
      activity. The receiving actor is the CASE_MANAGER that owns the ledger, and
      `CheckIsCaseManagerNode` checks its role. If the tree runs as the sender, that
      check fails. Then the guarded commit does not run, and the tree skips the ledger
      entry with no error. With per-actor storage, `actor_id` also selects the store.
      Thus any identity that is not the receiver sends every read and write to a store
      that is not the replica under update. The system always calls a received-side use
      case with the store of the receiving actor. Thus the owner of that store is the
      one safe fallback, and the sender never is. A write about the sender still needs
      the sender id, so that id goes in an attribute that the setup does not overwrite.
    verification: >-
      Search all received-side use-case call sites of `execute_with_setup` that
      contain a `GuardedCommitCaseLedgerEntryBT`; assert each passes
      `actor_id=request.receiving_actor_id`.
    relationships:
    - rel_type: refines
      spec_id: BT-17-005
      note: BT-17-005 covers tests; this entry covers production call sites
    adr:
    - ADR-0073
  - id: BT-17-007
    priority: MUST
    kind: project
    statement: >-
      `BTBridge.execute_with_setup` MUST restore every blackboard key it or
      `setup_tree` writes to that key's pre-execution state before returning, on
      every outcome. That set MUST comprise the injected ports, `actor_id`,
      `activity`, and each `**context_data` key. It MUST also be extensible to a
      key written by a *node* mid-tree, where no single node can guarantee
      clearing it on every outcome because a `memory=False` Sequence may
      short-circuit before the owning node ticks. Because managed keys are
      restored, a caller MUST NOT use any of them as an output channel; a node
      returns a value to its caller through a mutable object the caller holds a
      reference to (e.g. a `result_out` dict), not through a managed key.
    rationale: >-
      `Blackboard.storage` is process-global. Thus a nested `execute_with_setup` that
      uses the same key overwrites the value of the outer run. Nodes read `/actor_id`
      again in `initialise()`. Thus a nested run as a different actor can give its
      identity to later siblings and to `payloadSnapshot.actor` (CLP-07-003). A key that
      a node writes during the tree needs the same reset, because a `memory=False`
      Sequence can stop before the owning node ticks. A restored key cannot carry a
      result out.
    verification: >-
      For each managed key, assert that a nested `execute_with_setup` passing
      that key leaves the outer execution's value in place after it returns, and
      that a key absent before the call is absent after it. For `actor_id`,
      assert on the value a *later sibling node* resolves rather than on raw
      blackboard storage, so the `initialise()` re-read is exercised, and assert
      the inner execution did run as a different actor so the check cannot pass
      vacuously.
    relationships:
    - rel_type: refines
      spec_id: BT-17-003
      note: BT-17-003 covers node-owned output keys; this entry covers bridge-managed execution-scoped keys
    adr:
    - ADR-0087
  - id: BT-17-008
    priority: MUST
    kind: project
    statement: >-
      Every emit node in the effect section of a received-side tree MUST sit
      inside the CASE_MANAGER gate (BT-17-001) or behind a check that the
      executing actor is the actor the emit speaks for. A received-side tree
      MUST NOT emit, as the executing actor's own act, an activity that another
      actor authored, and MUST NOT emit an activity whose only recipient is the
      executing actor. `create_receive_activity_tree` MUST be the only place a
      received-side tree acquires that gate: it MUST take the gated effects as
      `manager_effects`, the ungated effects as `replica_effects`, and the
      effects owed on a refusal as `refusal_effects`, which it gates on the
      CASE_MANAGER the same way (CLP-10-022), and it
      MUST refuse an emit-capable node in `replica_effects` unless the tree
      declares a named exemption carrying a reason.
    rationale: >-
      An emit outside the gate runs at every receiver. If an actor sends the act of a
      different actor again under its own name, it claims an act that it did not author.
      An on-behalf send names the doer in `actor` and the requester in `attributedTo`
      (CM-24-001, CM-24-002). An actor does not send its own emission to itself
      (ADR-0109), so a self-addressed emit is a loop. When only the factory adds the
      gate, every received tree gets the same gate. The exemption check makes each
      ungated emit a choice.
    verification: >-
      `test_every_effect_is_inside_the_case_manager_gate` in
      `test/core/behaviors/case/test_suggest_actor_tree.py` checks gate
      placement for the suggest-actor trees.
      `test/core/behaviors/case/test_receive_activity_tree.py` checks that
      the factory gates `manager_effects` after the commit and refuses an
      emit-capable node in `replica_effects` that no registered exemption
      covers. The corpus-wide check is
      `test/architecture/test_received_tree_case_manager_gate.py`: a ratchet
      that no received tree calls `create_case_manager_gated_tree` itself, a
      plain assertion that no caller passes the legacy `effect_nodes` (retired
      in #4307 once the close-case tree moved its decline emit onto
      `manager_effects`, #3825), and the exemption uses as a pinned exemption
      set (ARCH-18-001, ARCH-18-005).
    relationships:
    - rel_type: refines
      spec_id: BT-17-001
      note: >-
        BT-17-001 requires the gate for CASE_MANAGER-only subtrees; this entry says
        every received-side emit is gated by role or by sender
    adr:
    - ADR-0109
- id: BT-16
  title: Simulation Fuzzer Node Layout
  specs:
  - id: BT-16-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Probabilistic simulation (fuzzer) BT nodes MUST reside in `vultron/demo/fuzzer/` and MUST NOT be placed in
      `vultron/core/behaviors/` or `vultron/bt/`.
    rationale: Demo/simulation nodes are external-dependency touchpoints, not production protocol behaviors. Keeping them
      in `vultron/demo/fuzzer/` makes the simulation/production boundary explicit and prevents simulation artifacts from leaking
      into core protocol logic.
  - id: BT-16-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The probabilistic base types (WeightedBehavior subclasses) for simulation nodes MUST be defined in `vultron/demo/fuzzer/base.py`
      using the `py_trees.behaviour.Behaviour` base class.
    rationale: All py_trees-based BT execution uses the standard py_trees library (ADR-0008). Centralizing probabilistic base
      types in one module provides a single implementation point for all weighted-probability simulation nodes and avoids
      duplication across domain modules.
    relationships:
    - rel_type: implements
      spec_id: BT-02-001
      note: py_trees.behaviour.Behaviour is the required base for all prototype BT nodes
    adr:
    - ADR-0008
  - id: BT-16-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Each simulation fuzzer node MUST be named after the external-dependency touchpoint it represents (e.g., `EvaluateEmbargoProposal`,
      `DeployFix`) and MUST include a docstring describing its semantic function in the CVD process, the category of external
      input it simulates (system integration, human decision, or environmental check), and its approximate success probability.
    rationale: Fuzzer nodes are named integration points where production logic will eventually replace the probabilistic
      stub. Explicit naming and documentation preserves the connection between simulation behavior and future implementation
      targets.
  - id: BT-16-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'Simulation fuzzer modules MUST be organized by CVD domain: `vultron/demo/fuzzer/base.py` (probabilistic infrastructure),
      `vultron/demo/fuzzer/embargo.py` (embargo management), `vultron/demo/fuzzer/messaging.py` (inbound message handling),
      and `vultron/demo/fuzzer/report_management/` (report lifecycle sub-workflows as parallel submodules).'
    rationale: Domain-aligned module organization mirrors the workflow structure of the existing `vultron/bt/` simulation
      and makes cross-references between simulation stubs and production use cases straightforward for future implementers.
  - id: BT-16-005
    priority: SHOULD
    kind: project
    statement: 'Each simulation fuzzer node SHOULD be categorized in its docstring by automation potential: High (fully automatable
      via API or policy rule), Medium (partially automatable with human oversight required), Low (inherently human-driven;
      automation limited to notifications or task triggers), or TerminalPlaceholder (terminal placeholder node with no real
      decision logic — an AlwaysSucceed or AlwaysFail fallback leaf with no external dependency).'
    rationale: >-
      Automation potential tells a future implementer which type of integration a stub
      needs: an API or policy rule, a step that a person supervises, or only a
      notification or task. TerminalPlaceholder identifies a leaf with no decision
      logic. Thus nobody reads it as "not applicable" or as a node with high automation
      potential.
- id: BT-18
  title: Call-Out Point Abstraction Layer
  specs:
  - id: BT-18-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'Every call-out point node MUST describe its blackboard contract in its class docstring: the set of input keys
      read before dispatch and the set of output keys (with types) written to the blackboard on SUCCESS. The docstring describes
      the contract for a human reader; the authoritative, machine-readable declaration is the typed-port declaration required
      by BT-18-012, and the two MUST agree.'
    rationale: The blackboard contract is the integration seam between the tree and the backend. Without an explicit contract,
      swapping from a fuzzer backend to a real implementation is a guess — the real backend may omit writing a key that a
      downstream node expects, causing silent failures. The docstring earns its place alongside the typed-port declaration
      because a reader deciding whether a capability fits their system should not have to reconstruct intent from port
      metadata; the declaration is what a test enforces, and the prose is what makes the seam legible.
    relationships:
    - rel_type: implements
      spec_id: BT-16-003
      note: Call-out points are the named integration seam that BT-16-003 requires to be documented; the blackboard contract
        is the required documentation format for data-producing nodes.
    adr:
    - ADR-0025
    - ADR-0097
  - id: BT-18-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A call-out point backend — fuzzer or real implementation — MUST write to all declared output keys when it returns
      SUCCESS. A backend MUST NOT return SUCCESS without writing the declared outputs.
    rationale: 'Downstream BT nodes rely on declared output keys being present after a call-out point succeeds. A fuzzer that
      returns SUCCESS without writing synthetic output to those keys produces a contract violation: a downstream node reads
      a missing key and fails, but the failure is attributed to the downstream node rather than the backend. Both fuzzer and
      real backends must be contract-conformant to make backend swaps transparent.'
    adr:
    - ADR-0025
  - id: BT-18-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The fuzzer backend for a data-producing call-out point (Evaluator, Retriever, or Composer shape) MUST write
      synthetic but type-conformant data to the declared output keys. The synthetic data MUST be of the correct type; it does
      not need to be semantically meaningful.
    rationale: If the fuzzer backend omits output writes that a real backend would perform, the demo/simulation layer cannot
      serve as a faithful stand-in during development. Maintaining the same output contract ensures that demo scenarios exercise
      the same downstream code paths as production runs.
    adr:
    - ADR-0025
  - id: BT-18-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A call-out point node MUST be constructed via a backend factory callable.
    rationale: Factory-based injection is the established BT construction pattern in this codebase. Requiring the factory
      as a parameter (rather than hardcoding the fuzzer import) is what makes each call-out point an actual injection seam
      rather than a tightly-coupled stub. Without this, replacing any backend requires editing the tree-building function,
      defeating the abstraction layer's purpose.
    relationships:
    - rel_type: implements
      spec_id: BT-04-001
      note: Factory-based injection for call-out points is an application of the existing factory pattern required for all
        BT construction.
    adr:
    - ADR-0025
  - id: BT-18-008
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Tree-building functions that contain call-out points MUST accept the backend factory as a parameter (or as
      an entry in a factory mapping).
    rationale: Accepting the factory as a parameter makes each call-out point an actual injection seam rather than a
      tightly-coupled stub; replacing a backend then requires no changes to the tree-building function.
  - id: BT-18-009
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The fuzzer factory MUST be the default value for the backend factory parameter of tree-building functions.
    rationale: A fuzzer default ensures demo scenarios work without explicit backend configuration until a real
      implementation is available, while still allowing injection of alternative backends at call sites that opt in.
  - id: BT-18-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The call-out point shape of a fuzzer node MUST be determined solely by the ADR-0024 seam-structure decision
      tree (how external input enters and output exits the call-out point). Automation potential MUST NOT be used as a criterion
      for assigning shape = ProtocolInternal. A node whose automation potential is High but whose inputs arrive from an external
      source or whose outputs affect an external system is a Retriever, Evaluator, Composer, or Actuator — not ProtocolInternal
      — regardless of how automated the implementation may be.
    rationale: >-
      Automation potential and call-out shape describe different things. Automation
      potential tells if the logic can run without a person. Shape tells what goes into
      and out of the call-out point, and in which direction. A Retriever that uses a
      REST API is still a Retriever. The automation only means that its implementation
      needs no human action. If you select the shape from the automation potential, you
      build the incorrect call-out point, and you must then do the work on it again.
      BT-18-013 lists the canonical shapes. A node that calls an external system to
      cause a side effect, and makes no content artifact, is an Actuator, not a
      Composer. The reason is that the effect, not an artifact, comes out of the
      call-out point.
    relationships:
    - rel_type: implements
      spec_id: BT-16-005
      note: BT-16-005 defines automation potential categories; BT-18-005 clarifies that those categories govern the automation-potential
        field only and have no bearing on call-out point shape assignment.
  - id: BT-18-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A node that queries an external system synchronously and returns only a binary (SUCCESS/FAILURE) result MUST
      be classified as a Retriever, not a Sentinel — and per BT-18-013 Sentinel is not a call-out capability shape at all,
      so Retriever is the only available classification. The defining criterion for Retriever shape is the synchronous on-demand
      query pattern, not the richness of the returned data; a boolean is the simplest possible structured fact a Retriever
      may return. A Sentinel, by contrast, monitors a condition continuously or is triggered by an external event and calls
      a trigger endpoint when the condition becomes true — the flow direction is Sentinel → trigger endpoint → protocol, not
      protocol → query → external system.
    rationale: >-
      Nodes such as MitigationDeployed, MitigationAvailable and HaveExploit return only
      SUCCESS or FAILURE, so they look like Sentinels. But the tree calls them when it
      needs them, and they ask an external system for the current status. That is the
      Retriever pattern. The tree does not call a true Sentinel. A Sentinel runs by
      itself and calls a trigger endpoint when a condition is true. This criterion
      prevents the classification of on-demand binary queries as Sentinels.
    relationships:
    - rel_type: refines
      spec_id: BT-18-005
      note: BT-18-005 establishes that shape is determined by the seam-structure decision tree; BT-18-006 resolves the specific
        Sentinel vs. Retriever ambiguity for binary-result external queries.
    adr:
    - ADR-0097
  - id: BT-18-010
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A binary-result Retriever MUST declare an empty output-port set; the structured fact is expressed as the BT
      return value (SUCCESS/FAILURE), not as a blackboard write. As with every capability contract, the authoritative
      declaration is the typed-port declaration required by BT-18-012 and the node docstring describes it (BT-18-001).
    rationale: BT-18-001 through BT-18-003 require every call-out point to declare its complete blackboard contract. A
      binary-result Retriever has an empty output-key set; that empty set MUST still be explicitly declared so that the
      absence of output keys is documented as intentional rather than an oversight, and backend swaps remain transparent. An
      empty declaration is also what makes the BT-23-013 check decidable, because a capability that declares no output ports
      is not data-producing, so a bare constant-status default is a conforming default for it.
    relationships:
    - rel_type: refines
      spec_id: BT-18-012
      note: >
        BT-18-012 makes the typed-port declaration the authority for every
        capability contract; BT-18-010 states what that declaration contains for
        a binary-result Retriever — the empty set, declared rather than omitted.
  - id: BT-18-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: An Evaluator call-out point that needs to block downstream BT execution — for any reason (editorial rejection,
      legal hold, compliance failure, or other non-approval decision) — MUST return Status.FAILURE from its update() method.
      Setting a structured output field to a "rejected" value while returning Status.SUCCESS does not block a Sequence and
      MUST NOT be used as a blocking mechanism.
    rationale: >-
      A Sequence stops and returns FAILURE when a child returns FAILURE. That is how
      py_trees blocks a path. A field value such as `approved=False` does not stop a
      Sequence, because no node reads it as a gate. Thus, if a rejection uses such a
      field, the next step runs. A boolean approval flag on the output record of an
      Evaluator is thus a sign of a bad design. The exception is a flag that is the only
      input to a later ProtocolInternal gate node.
    tracking_issue: '#1783'
    relationships:
    - rel_type: refines
      spec_id: BT-18-002
      note: BT-18-002 states that SUCCESS MUST accompany all declared output writes; BT-18-007 is the complementary
        rule — FAILURE is the correct signal when the Evaluator's decision is to block, regardless of output field values.
    adr:
    - ADR-0030
  - id: BT-18-011
    priority: MUST
    kind: project
    statement: A call-out point backend MUST answer synchronously — its update() MUST return Status.SUCCESS or Status.FAILURE
      and MUST NOT return Status.RUNNING. This is the general case of the codebase-wide invariant that no Vultron BT node
      returns RUNNING (ADR-0080). A runtime guard at the call-out seam MUST reject a RUNNING return by raising an error
      (not a VultronError, so the bridge classifies it as an internal error rather than a protocol outcome), and a static
      architecture check MUST fail if any node under vultron/ returns Status.RUNNING.
    rationale: >-
      The execution model of Vultron cannot pause a tree. If the root returns RUNNING,
      the bridge ticks it again until max_iterations, and then fails without the name of
      the node. A node asks and stops, and it does not pause (ADR-0080). A call-out
      backend comes from outside the repository, so a static scan cannot see it. Only a
      runtime guard at the call-out point can. The guard raises an error that is not a
      VultronError, so bad backend wiring shows as an internal error, not as a protocol
      outcome.
    adr:
    - ADR-0080
    verification: A test injects a call-out backend whose update() returns Status.RUNNING and asserts the guard raises a
      non-VultronError (surfaced by the bridge as internal_error); a test/architecture check asserts no node under vultron/
      returns Status.RUNNING.
    relationships:
    - rel_type: refines
      spec_id: BT-18-002
      note: BT-18-002 requires SUCCESS to accompany all declared output writes and BT-18-007 requires FAILURE to block;
        BT-18-011 closes the trichotomy by forbidding the third py_trees status, RUNNING, at the call-out seam.
  - id: BT-18-012
    priority: MUST
    kind: project
    statement: >
      A named capability MUST declare its blackboard contract as py_trees typed
      ports (ADR-0044 INPUT_PORTS / OUTPUT_PORTS) on a declaration owned by
      the core layer. The typed-port declaration is the authoritative contract;
      the class docstring required by BT-18-001 describes it but is not the
      authority. A capability declaration MUST NOT live in vultron/demo/.
      Because a shape base class is shared by many capabilities, it cannot carry
      a per-capability contract: the declaration MUST therefore be a core-owned
      per-capability artifact carrying that capability's own ports, and the
      probabilistic simulation node that stands in for it stays in
      vultron/demo/fuzzer/ (BT-16-001) and binds to the core declaration rather
      than restating the contract.
    rationale: >-
      BT-18-002 is enforceable only if the layer that must obey the contract can read it
      as data. Nobody can check a contract that is only docstring text. Core cannot read
      a contract in vultron/demo/ at all (BTND-04-002 forbids the import, and BT-16-001
      tells why the probabilistic nodes are there). Without a contract that core can
      read, the DETERMINISTIC default cannot know which outputs to write (BT-23-013).
      When the declaration is separate from the simulation node, both rules apply at the
      same time. Core owns what the capability promises, and demo owns one way to
      simulate it. ADR-0044 already requires typed ports for every node in
      vultron/core/behaviors/. Typed ports check types at runtime on read and on write.
      Thus, with typed ports, the capability contract is enforceable without a second
      registry.
    adr:
    - ADR-0097
    - ADR-0044
    verification: >
      A test reads a capability's declared output ports (not its docstring) and
      asserts each declared port is written when the backend returns SUCCESS; an
      architecture check asserts no capability declaration is imported into
      vultron/core/ from vultron/demo/.
    relationships:
    - rel_type: refines
      spec_id: BT-18-001
      note: >
        BT-18-001 governs the human-readable description of the contract;
        BT-18-012 governs the authoritative machine-readable declaration. The two
        describe one contract in two registers and must agree.
    - rel_type: implements
      spec_id: BT-18-002
      note: >
        BT-18-002's "declared output keys" are the declared output ports, which
        is what makes the requirement checkable rather than reviewable.
  - id: BT-18-013
    priority: MUST
    kind: project
    statement: >
      There are exactly four call-out capability shapes: Evaluator, Retriever,
      Composer, and Actuator. Sentinel MUST NOT be classified as a call-out
      capability shape; it is a call-in integration pattern in which a process
      monitors a condition and acts on its own initiative rather than being
      consulted by the protocol. A Sentinel therefore has no call-out point node,
      no blackboard contract, no domain bundle field, and no backend factory. The
      classifying criterion is which party initiates, not whether the monitored
      information originates outside the case: a Sentinel MAY be a case
      participant that observes case state through ledger replication and acts by
      emitting protocol messages.
    rationale: >-
      The call-out machinery that a capability shape uses defines that shape. This
      machinery is a backend factory, a domain bundle field, a blackboard contract, the
      synchronous-answer guard (BT-18-011), and a ceiling or floor default (BT-23-002).
      None of this applies to a monitor, because the protocol never calls it. The flow
      goes from the monitor to a trigger endpoint and then to the protocol, which is the
      opposite direction of a call-out. Thus a monitor classified as a capability shape
      claims a contract that it cannot have. That causes the incorrect classification
      that BT-18-006 prevents. The name call-in pattern tells the flow direction that
      makes the monitor different. It also puts the monitor with the concerns of a
      process that acts independently: its own schedule, its own credentials, and
      possibly its own protocol identity. A definition by information source gives the
      incorrect classification for a participant monitor. That monitor reads the
      replicated state of the case, but the protocol never asks it for an answer.
    adr:
    - ADR-0097
    verification: >
      No class in the call-out taxonomy is named as a Sentinel shape base or
      subclass; no domain bundle exposes a Sentinel factory field; no blackboard
      key is documented as written by a Sentinel.
    relationships:
    - rel_type: refines
      spec_id: BT-18-006
      note: >
        BT-18-006 classifies a synchronous on-demand external query as a
        Retriever; BT-18-013 is why Retriever is the only available answer, since
        Sentinel is not a call-out shape.
  - id: BT-18-014
    priority: MUST
    kind: project
    statement: >
      A question that a service the actor itself operates can answer within a
      single BT tick MUST be modelled as a call-out point. A question requiring a
      decision from another actor in the case MUST NOT be modelled as a call-out
      point; it is a protocol ask, in which the actor emits the request,
      terminates successfully, and acts on the reply when it arrives (ADR-0080).
      An action with no representable not-yet state MUST be refused rather than
      asked about.
    rationale: >-
      A call-out point gives its answer in the same tick that asks. Thus you can use it
      only where an answer already exists. A decision that belongs to a different actor
      does not exist when the tree asks for it. Thus a gate that is a call-out point can
      only answer no. The Case Owner approval gates show this problem (ADR-0080). The
      two mechanisms are not interchangeable. The party that holds the answer sets the
      choice. Thus the rule is a MUST, not a recommendation.
    adr:
    - ADR-0097
    - ADR-0080
    verification: >
      No call-out point's declared semantics require a reply from another case
      participant; gates that do are implemented as conversation-state routing
      subtrees per ADR-0080.
    relationships:
    - rel_type: refines
      spec_id: RSH-07-004
      note: >
        RSH-07-004 replaced the two status gates' call-out mechanism with a
        routing subtree; BT-18-014 generalises the criterion that forced it.
    - rel_type: constrains
      spec_id: BT-18-005
      note: >
        BT-18-005 assigns shape by seam structure once a seam is known to be a
        call-out point; BT-18-014 decides whether it is one at all.
  - id: BT-18-015
    priority: MUST
    kind: project
    statement: >
      A call-out point backend MUST answer within a bounded time budget and MUST
      NOT perform unbounded blocking I/O in update(). The budget MUST be
      configurable per actor rather than fixed by this specification or hard-coded
      in an implementation, and a backend that exceeds it MUST surface as an
      internal error naming the offending node, not as a protocol FAILURE.
    rationale: >-
      A backend runs on the ticking thread under FastAPI BackgroundTasks. Thus unlimited
      blocking I/O in update() stops a worker, and no diagnostic shows. The bridge ticks
      until it gets to max_iterations, and then it fails without the name of the node.
      That is the same unclear failure that BT-18-011 refuses, but it comes from
      blocking, not from a pause. Thus a synchronous answer is necessary, but it is not
      sufficient. The answer must also be fast. The duration is not part of the
      protocol, because it is local to one actor and no peer can see it. Thus two
      deployments with different values do not become different in their protocol
      behavior. An ask deadline is different in one important way. It goes on the wire
      in the AS2 endTime field, so both parties read the same number (ASK-03-004). Both
      durations are actor configuration (compare ASK-03-005). Wire visibility, not
      configuration, makes them different.
    adr:
    - ADR-0097
    verification: >
      A test configures a short budget, injects a backend that exceeds it, and
      asserts an internal error naming the node; a test asserts the budget is read
      from actor configuration and that no literal duration appears at the seam.
      Note the limit of what this verifies: a py_trees tick is synchronous, so a
      guard at the seam detects an overrun and names the node but does not by
      itself interrupt the offending backend. Interrupting one requires running it
      off the ticking thread, and an implementation MUST state which of the two it
      provides (ADR-0097#bounded-configurable-call-out-latency).
    relationships:
    - rel_type: refines
      spec_id: BT-18-011
      note: >
        BT-18-011 forbids suspending; BT-18-015 closes the remaining way a
        call-out can stall a worker — answering synchronously but too slowly.
    - rel_type: refines
      spec_id: BT-18-014
      note: >
        Work that cannot meet the budget is not a call-out point; BT-18-014 says
        what it is instead.
- id: BT-19
  title: Routing-Gated State Mutation in Lifecycle BT Sequences
  specs:
  - id: BT-19-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A BT Sequence that performs a state mutation and then routes an outbound message MUST resolve all routing prerequisites
      in a read-only guard node placed BEFORE the state-mutation node. The Sequence MUST fail at the guard with no state change
      when routing prerequisites are absent.
    rationale: 'Committing a state change before verifying that the resulting outbound message can be constructed and queued
      creates a divergence window: local state reflects the new value while peers still hold the prior value because the broadcast
      was never sent. Moving the routing guard before the mutation eliminates the most common divergence cause without requiring
      full transactional rollback. The outbox is the reliability boundary: once the message is written to the outbox, delivery
      and retry are the outbox''s responsibility.'
    relationships:
    - rel_type: refines
      spec_id: BT-14-001
      note: 'Routing-gated mutation is the pre-condition counterpart to BT-14-001''s fail-fast-on-broadcast-failure rule:
        guard before mutation addresses the common prerequisite-missing case; BT-14-001 addresses the post-mutation delivery
        failure case.'
    - rel_type: refines
      spec_id: BT-06-001
      note: State-mutation ordering relative to routing checks is part of the tree's auditable behavioral contract.
  - id: BT-19-003
    priority: MUST
    kind: project
    statement: In Vultron protocol lifecycle BTs, routing prerequisites for EM/RM/CS state-transition sequences MUST include
      Case Manager actor ID resolution and outbox availability. A missing Case Manager entry in `actor_participant_index`
      MUST cause the sequence to fail at the guard with zero DataLayer state change.
    rationale: Protocol state divergence (e.g., local EM=EXITED while peers hold EM=ACTIVE) is the primary failure mode when
      routing prerequisites are absent. Residual mid-send failures after state mutation are recoverable via ledger-sync catch-up
      (SYNC-10); prerequisite-missing failures are not, because the broadcast was never attempted.
    relationships:
    - rel_type: refines
      spec_id: BT-19-001
      note: Specifies the CVD-protocol-specific routing prerequisites that BT-19-001 requires to be resolved in the guard
        node.
    - rel_type: refines
      spec_id: BT-06-001
      note: Protocol state transitions are protocol-significant behavior; their ordering relative to routing checks is part
        of the tree's auditable contract.
    verification: 'For any embargo lifecycle BT Sequence that includes both a state-mutation node and a send/dispatch node:
      confirm via code review and test that a simulated missing Case Manager (empty `actor_participant_index`, no `CVDRole.CASE_MANAGER`
      entry) causes the tree to return FAILURE with zero DataLayer state change.'
    stories:
    - story_2022_046
    - story_2022_014
    - story_2022_088
  - id: BT-19-002
    priority: MUST
    kind: project
    statement: A shared BT factory function MUST be used for all paths that trigger the same protocol lifecycle transition
      (e.g., embargo termination). Duplicate monolithic BT nodes that inline both state mutation and activity dispatch in
      a single `update()` method MUST NOT exist alongside a canonical factory-composed equivalent.
    rationale: >-
      Copies of one lifecycle operation gradually become different. One copy can check
      routing before it changes state, while a different copy changes state first. Then
      the defect that BT-19-001 prevents occurs again on one path. A single shared
      factory gives every call site the same semantics and the same guard order.
    relationships:
    - rel_type: refines
      spec_id: BT-14-002
      note: BT-14-002 requires shared helpers for broadcast fan-out; BT-19-002 extends this to the full lifecycle-plus-routing
        sequence.
    - rel_type: implements
      spec_id: BT-19-001
      note: Shared factory composition is the mechanism that enforces consistent BT-19-001 guard ordering across all call
        sites.
    verification: For each protocol lifecycle operation with more than one call site (trigger path and automatic-cascade path),
      confirm that all call sites use the same BT factory function and that no standalone monolithic node class exists that
      inlines both state mutation and dispatch in a single `update()` method for the same operation.
- id: BT-20
  title: Production BT Collapse Patterns
  description: Requirements for production BT subtrees that replace groups of simulator fuzzer nodes. Each collapse candidate
    reduces multiple granular simulator leaves to a smaller set of production call-out points with cleaner seam structure;
    individual requirements are provisional and subject to revision at implementation time.
  specs:
  - id: BT-20-001
    priority: SHOULD
    kind: project
    statement: The production `create_acquire_exploit_strategy_tree` factory SHOULD provide a `HaveExploit` Retriever and
      an `EvaluateExploitStrategy` Evaluator call-out point in place of the five simulator nodes (`HaveExploit`, `ExploitPrioritySet`,
      `EvaluateExploitPriority`, `ExploitDeferred`, `ExploitDesired`). The Evaluator SHOULD receive case context (vulnerability
      state, org policy, threat landscape, and the `HaveExploit` query result) and return a structured `ExploitStrategyDecision`
      record containing `have_exploit`, `acquire`, and `rationale`. The `HaveExploit` Retriever is kept as a separate seam
      for independent swapability (ADR-0027).
    rationale: >-
      The five-node simulator sequence uses boolean flags to show one policy decision:
      if the actor gets an exploit. Production does not need these flags. Two call-out
      points, a Retriever and an Evaluator, replace the five simulator nodes. They also
      let you replace the exploit-repository query by itself. See ADR-0027 and
      `docs/developer/reference/bt-fuzzer/rm-exploit.md`.
    tracking_issue: '#1200 (planning); #1249 (factory-fn Idea — already implemented on main); #1309 (implementation — closed by PR #1566)'
    adr:
    - ADR-0027
  - id: BT-20-002
    priority: SHOULD
    kind: project
    statement: The production `create_publication_tree` factory SHOULD use `PrioritizePublicationIntents` (Evaluator) output
      to gate per-artifact arms directly, without separate `NoPublish*` bypass leaves or a `PublicationIntentsSet` flag check.
      The Evaluator SHOULD return a structured `PublicationIntentDecision` record containing `publish_exploit`, `publish_fix`,
      `publish_report`, and `rationale`. The intent record SHOULD drive which of three named arms (exploit, fix, report) execute;
      each arm SHOULD be a `Selector(Sequence(ShouldPublishX, PrepareX, Publish), Inverter(ShouldPublishX))` so a not-intended
      arm is a graceful SUCCESS no-op. Each arm SHOULD consist of a Composer (prepare artifact) followed by a Publish pipeline
      (see BT-20-004).
    rationale: >-
      The `NoPublish*` bypass leaves and the `PublicationIntentsSet` flag check exist
      only because of how the simulator shows the tree. They are not call-out points. In
      production, the output of the `PrioritizePublicationIntents` Evaluator selects
      which arms run. The `ShouldPublishX` gate nodes have positive names per
      BTND-08-001. See ADR-0028 and
      `docs/developer/reference/bt-fuzzer/rm-publication.md`.
    tracking_issue: '#1200 (planning); #1310 (implementation)'
    adr:
    - ADR-0028
  - id: BT-20-003
    priority: SHOULD
    kind: project
    statement: The production report-to-others workflow SHOULD be driven by an external call-in monitor (the Sentinel
      pattern, BT-18-013 — not a call-out capability) that proactively
      queries the case for actors who are not yet participants but should be (party discovery), then fires `suggest-actor-to-case`
      for each candidate. The `suggest-actor-to-case` protocol (Offer → CASE_MANAGER → CaseOwner → Invite → Accept → Record
      cascade) handles the downstream flow; no inline tick-driven BT loop is needed at the outer level. If an inline subtree
      is required (e.g. for a single-pass trigger-driven invocation), it SHOULD consist of a Retriever call-out that returns
      candidate (actor_id, role) pairs and an Actuator per pair that fires `suggest-actor-to-case` with the explicit
      `CVDRole` parameter.
    rationale: >-
      The tree has no source for party discovery. No production mechanism can fill
      blackboard queues of identified vendors, coordinators and other parties. An
      external monitor examines the case on a schedule or on an event. It sends
      `suggest-actor-to-case` for each candidate that has no invitation. Thus the
      identification occurs where the information is. The monitor is on the call-in
      surface, not a call-out capability (BT-18-013). Thus it connects through a trigger
      endpoint, not a bundle field. The accept, invite and bootstrap cascade that
      follows already does the remaining work, so no inline loop is necessary.
    tracking_issue: '#1311 (partial implementation, superseded); #1252 (planning — closed; sentinel approach adopted); #1848 (removal — closed by PR)'
    adr:
    - ADR-0029
    - ADR-0047
    - ADR-0097
  - id: BT-20-004
    priority: SHOULD
    kind: project
    statement: 'The production `create_publish_artifact_tree` factory SHOULD implement a multi-step pipeline replacing the
      single `Publish` Actuator leaf: at minimum (1) a Composer node drafts the advisory artifact from case data, (2) an Evaluator
      node reviews and approves the draft, and (3) an Actuator node submits the finalized artifact to the external advisory
      platform. An optional revision Composer MAY be included between the Evaluator and Actuator. Whether the review phase
      includes a broadcast-for-participant-comment step is an open design question to be resolved at implementation time.'
    rationale: >-
      The single `Publish` leaf of the simulator represents a full advisory publication
      workflow. In production, draft, review and submission are different operations,
      each with its own external call-out point. Submission causes an external effect
      but makes no artifact, so it is an Actuator (ADR-0024). See ADR-0030 and
      `docs/developer/reference/bt-fuzzer/rm-publication.md`.
    tracking_issue: '#1200 (planning); #1312 (implemented)'
    adr:
    - ADR-0024
    - ADR-0030
  - id: BT-20-005
    priority: SHOULD
    kind: project
    statement: >-
      The production `create_deploy_mitigation_tree` factory SHOULD implement
      a `DeployMitigationBT` Fallback tree with four arms: a short-circuit arm
      for already-active mitigations, a deferred-RM arm, a deploy-if-available
      arm, and a monitor-if-desired arm.
    rationale: >-
      Mitigation deployment is the fallback when no definitive fix is available. Each
      arm covers one condition of the deployer, so the tree gets to a defined outcome in
      each condition. `MitigationDeployed` and `MitigationAvailable` ask an external
      system for the current state. Thus they are call-out Retrievers, not
      DataLayerCondition nodes.
    tracking_issue: '#1826 (planning Idea — peer to #1248)'
    relationships:
    - rel_type: extends
      spec_id: BT-23-003
      note: >
        DeployMitigationCallOutBundle and DeploymentMonitoringBundle follow the
        domain bundle pattern from BT-23-003.
  - id: BT-20-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: The `create_deploy_mitigation_tree` tree MUST NOT include a CS state transition or protocol activity emission
      node; mitigation deployment is tracked externally (CMDB or case record) and the protocol has no dedicated
      mitigation-deployed message type.
    rationale: The VFD state machine tracks only vendor-aware/fix-ready/fix-deployed bits; there is no mitigation-deployed
      bit. Emitting a CS state transition or protocol activity from the mitigation tree would conflate fix-deployment
      semantics with mitigation tracking.
  - id: BT-20-007
    priority: SHOULD
    kind: project
    statement: The shared monitoring/prioritization call-out seams (`PrioritizeDeployment`, `MonitoringRequirement`,
      `MonitorDeployment`) SHOULD be factored into a `DeploymentMonitoringBundle` base dataclass inherited by both
      `DeployFixCallOutBundle` and `DeployMitigationCallOutBundle`.
    rationale: Sharing the monitoring/prioritization seams via a base dataclass follows BT-23-003 (domain bundle pattern)
      and avoids field duplication across two closely-related bundles.
  - id: BT-20-008
    priority: SHOULD
    kind: project
    statement: A `create_deploy_tree` combinator factory SHOULD compose fix and mitigation arms into an overarching
      `DeployOrMitigateBT` Fallback (fix arm first).
    rationale: >-
      A deployer that has a fix must deploy it, and use a mitigation only when it
      cannot. A combinator with the fix arm first shows that preference in one tree.
      Thus no call site can put the two deploy trees in the incorrect order.

- id: BT-21
  title: Fuzzer Node Replacement Lifecycle
  specs:
  - id: BT-21-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: 'Each fuzzer (simulator) BT node targeted for replacement by a production implementation MUST have a corresponding
      tracking issue that captures: the fuzzer node name, the production replacement design (as a BT-20 entry or equivalent),
      and the blocking dependencies. The tracking issue MUST be linked from the relevant BT-20 `tracking_issue` field.'
    rationale: Without a tracking issue per fuzzer node, the replacement backlog is invisible in the project board. The BT-20
      entries document the design; this entry mandates the process artefact (issue) that makes the work schedulable.
    relationships:
    - rel_type: refines
      spec_id: BT-20-001
  - id: BT-21-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: When a fuzzer node is replaced by its production equivalent, the corresponding BT-20 `PROVISIONAL` rationale
      note MUST be updated to remove the `PROVISIONAL` marker and the BT-21-001 tracking issue MUST be closed in the same
      PR.
    rationale: Provisional notes that survive after the production replacement is merged become misleading documentation.
      The two-step close (update spec + close issue) ensures the spec and the project board remain consistent.
    relationships:
    - rel_type: refines
      spec_id: BT-21-001
- id: BT-22
  title: BT Layer Dependency Model
  description: Rules governing the dependency direction between BT nodes and use-case classes. Violations
    of these rules create circular dependency risk, un-auditable call chains, and excessively large update() methods.
  specs:
  - id: BT-22-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: A BT leaf node's `update()` method MUST NOT directly instantiate or call a use-case class. Use-case
      classes are the handlers that create BTs; they are not work items to be called from within a BT node. Calling
      a use case from inside a BT node creates a BT→UseCase→BT→UseCase call chain that cannot be audited or preempted.
      Multi-step workflows needed by a BT leaf MUST be modeled as a child subtree of the current tree, not as a use-case
      call embedded in `update()`.
    rationale: The BT tree structure is the source of truth for protocol behavior; any logic that executes outside it
      is invisible to analysis and audit. An in-tree child subtree keeps the full behavior visible in the tree and lets
      it be preempted by a parent Selector. Identified as BT-IDM-01 in notes/bt-canonical-reference.md.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
  - id: BT-22-002
    priority: MUST_NOT
    kind: architecture
    verification_debt: '#2569'
    statement: BT nodes in `vultron/core/behaviors/` MUST NOT import private helpers or functions from
      `vultron/core/use_cases/`.
    rationale: Importing a use-case helper into a BT node inverts the hexagonal layer boundary and creates circular
      dependency risk. The import direction is the enforcement mechanism for the layer rule. Identified as BT-IDM-02
      in notes/bt-canonical-reference.md.
    relationships:
    - rel_type: refines
      spec_id: BT-06-001
  - id: BT-22-004
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: The dependency direction between BT nodes and use cases MUST be `use_cases/ → behaviors/` (use cases
      create BTs), never `behaviors/ → use_cases/` (BT nodes importing from use cases).
    rationale: The one-way dependency from use cases into behaviors is the structural enforcement of the hexagonal
      layer boundary; reversing it creates circular dependency risk.
  - id: BT-22-005
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: If a helper is needed by both a use case and a BT node, it MUST be extracted to a shared utility module
      (e.g., `vultron/core/behaviors/shared/` or a domain-model method) that neither layer owns.
    rationale: A shared utility module is the canonical resolution when a helper is needed at both layers; placing it
      in either layer would invert or entangle the layer boundary.
    lint_suppress:
    - phantom_path_ref
  - id: BT-22-003
    priority: SHOULD
    kind: architecture
    statement: A BT leaf node's `update()` method SHOULD NOT exceed approximately 30 lines of logic. Nodes whose
      `update()` grows to 60–100+ lines typically encode multiple responsibilities (read, validate, create, persist,
      broadcast) that are better expressed as distinct leaf nodes in a named subtree. Smell signals include more than
      3–4 distinct responsibilities, multiple `dl.save()` calls, Boolean constructor parameters that silently activate
      optional branches, and internal `if/else` chains that should be separate `Sequence`/`Selector` children.
    rationale: Long `update()` methods defeat the core purpose of behavior trees — simple, auditable, composable leaves
      whose complexity is visible in tree structure rather than in individual nodes. Decomposing a god node into a named
      subtree factory makes the workflow readable by inspection. Identified as BT-IDM-03 in notes/bt-canonical-reference.md;
      see also `specs/behavior-tree-node-design.yaml` BTND-02-001.
    relationships:
    - rel_type: refines
      spec_id: BTND-02-001
- id: BT-23
  title: Call-Out Point Backend Selection
  description: >
    Requirements for how running code selects and injects backend factories into
    BT tree builders. Covers the three-mode model (deterministic / stochastic /
    real), the domain bundle dataclass pattern, pre-built singletons, the
    CallOutBackendFactory Protocol, and the default direction rule. Derived from
    the planning session for issue #1631.
  specs:
  - id: BT-23-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >
      Call-out point backends MUST be organised into three logical modes:
      DETERMINISTIC (AlwaysSucceed/AlwaysFail derived from the ceiling/floor of
      stochastic probabilities), STOCHASTIC (probabilistic fuzzer classes), and
      REAL (production implementations — currently deferred to FUZZ-08d through
      FUZZ-08h). The DETERMINISTIC mode MUST be the default for all tree
      builders, integration tests, and demo scenarios that do not explicitly
      opt into STOCHASTIC or REAL.
    rationale: >-
      Deterministic defaults make integration tests and demo scenarios repeatable, with
      no configuration at each call site. A stochastic default makes CI
      non-deterministic. The probabilistic mode is useful only for simulation and fuzz
      tests. The three mode names also show the intended path from DETERMINISTIC to REAL
      as the production implementations become available.
    relationships:
    - rel_type: extends
      spec_id: BT-18-004
      note: >
        BT-18-004 requires factory injection; BT-23-001 specifies that the
        default factory must be the DETERMINISTIC backend, not the stochastic
        fuzzer.
    adr:
    - ADR-0025
  - id: BT-23-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: When the stochastic success probability p > 0.5, the DETERMINISTIC backend for that call-out point MUST
      be AlwaysSucceed.
    rationale: Grounding the deterministic backend in the stochastic probability preserves the semantic intent of each
      node. Nodes that the simulation expects to usually succeed map to AlwaysSucceed so that deterministic demo
      scenarios make forward protocol progress.
    relationships:
    - rel_type: refines
      spec_id: BT-23-001
    adr:
    - ADR-0025
  - id: BT-23-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: When the stochastic success probability p < 0.5, the DETERMINISTIC backend for that call-out point MUST
      be AlwaysFail.
    rationale: Nodes that the simulation expects to usually fail map to AlwaysFail, preserving the semantic intent that
      such a call-out point is unlikely to succeed in a realistic scenario.
  - id: BT-23-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: When the stochastic success probability p == 0.5, the DETERMINISTIC backend for that call-out point MUST
      be AlwaysSucceed (happy-path default).
    rationale: The p == 0.5 tie-breaking rule selects the happy-path direction so that deterministic demo scenarios make
      forward protocol progress when the simulation assigns equal probability to success and failure.
  - id: BT-23-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Call-out point factories for a domain area MUST be collected into a domain bundle — a frozen @dataclass
      (one per domain area) whose fields are typed `CallOutBackendFactory` values.
    rationale: >
      Individual per-node factory kwargs accumulate quickly (a tree builder may
      have 5–10 call-out points); a bundle dataclass keeps the tree builder
      signature clean while enforcing completeness (all fields must be supplied).
      The frozen constraint prevents accidental mutation after construction.
    relationships:
    - rel_type: refines
      spec_id: BT-23-001
    - rel_type: extends
      spec_id: BT-18-004
      note: Replaces the individual factory-kwarg API with the bundle API.
    adr:
    - ADR-0025
  - id: BT-23-008
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The domain bundle dataclass and its DETERMINISTIC singleton (e.g., `VALIDATION_DETERMINISTIC`) MUST be
      defined in the core layer (`vultron/core/behaviors/call_out/bundles/<domain>.py`).
    rationale: >-
      The DETERMINISTIC bundle is the default backend that lets the protocol move
      forward. A real actor can use it in production before a capability implementation
      is available. Thus a core tree builder must find its default without access to the
      simulation layer. If the bundle is in vultron/demo/, core depends on demo
      (BT-16-001, BTND-04-002).
    adr:
    - ADR-0025
  - id: BT-23-009
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The STOCHASTIC singleton (e.g., `VALIDATION_STOCHASTIC`) MUST be defined in the simulation layer
      (`vultron/demo/fuzzer/bundles/<domain>.py`).
    rationale: The probabilistic STOCHASTIC wiring is a simulation artefact; keeping it in vultron/demo/ respects
      the BT-16-001 rule that simulation artefacts do not appear in vultron/core/.
  - id: BT-23-010
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Tree builders that accept call-out factories MUST accept the bundle as a single typed
      parameter (e.g., `call_out: ValidationCallOutBundle`) rather than individual per-node
      factory kwargs.
    rationale: A bundle parameter keeps the tree builder signature clean and enforces completeness — all fields must
      be supplied, making missing call-out points a static type error rather than a silent runtime omission.
  - id: BT-23-011
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Tree builders MUST default the bundle parameter to the core DETERMINISTIC singleton without importing
      from `vultron/demo/` (per BT-16-001 and ARCH-01-001).
    rationale: Pre-built singletons avoid non-DRY construction in every demo script and test fixture. Defaulting to
      the core DETERMINISTIC singleton ensures the tree builder has no simulation-layer import dependency.
  - id: BT-23-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >
      The CallOutBackendFactory type MUST be defined as a typing.Protocol (not
      a bare Callable type alias). The Protocol MUST declare a single __call__
      method accepting name: str and returning py_trees.behaviour.Behaviour.
      Static type checking (mypy/pyright) is the validation mechanism; no
      central registration or base class inheritance is required.
    rationale: >
      A Protocol produces IDE completion and pyright/mypy enforcement of the
      factory signature without requiring runtime registration overhead. Duck-
      typing via Protocol is consistent with how other ports in the codebase are
      typed (vultron/core/ports/use_case.py), and avoids the coupling risk of a
      central registry (name-key typos are silent runtime failures rather than
      static errors).
    relationships:
    - rel_type: refines
      spec_id: BT-23-003
    - rel_type: extends
      spec_id: BT-18-004
    adr:
    - ADR-0025
  - id: BT-23-005
    priority: SHOULD
    kind: project
    statement: >
      Domain bundle classes SHOULD follow the naming convention
      <Domain>CallOutBundle (e.g. ValidationCallOutBundle,
      EmbargoCallOutBundle) and the pre-built singletons SHOULD be named
      <DOMAIN>_DETERMINISTIC and <DOMAIN>_STOCHASTIC (e.g.
      VALIDATION_DETERMINISTIC, EMBARGO_STOCHASTIC). The dataclass and the
      DETERMINISTIC singleton SHOULD live in
      vultron/core/behaviors/call_out/bundles/<domain>.py; the STOCHASTIC
      singleton SHOULD live in vultron/demo/fuzzer/bundles/<domain>.py, which
      MAY re-export the core dataclass and DETERMINISTIC singleton for
      backward-compatible import paths.
    rationale: >
      Consistent naming makes the available bundles discoverable without reading
      the implementation. Splitting the seam by layer keeps the deterministic,
      production-usable default in core while co-locating the STOCHASTIC wiring
      with the probabilistic fuzzer nodes it references, respecting the
      BT-16-001 rule that simulation artefacts stay in vultron/demo/ and do not
      appear in vultron/core/. The core→demo boundary is enforced by
      test/architecture/test_core_no_demo_imports.py.
    relationships:
    - rel_type: refines
      spec_id: BT-23-003
    adr:
    - ADR-0025
  - id: BT-23-012
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >
      A call-out gate whose permissive backend would let a party other than the
      Case Owner unilaterally cause canonical case-state adoption or embargo
      teardown on the received side MUST default to the conservative (floor)
      backend regardless of its stochastic success probability. The
      ceiling/floor rules BT-23-002, BT-23-006, and BT-23-007 apply only to
      gates that do NOT have this property.
    rationale: >-
      BT-23-002, BT-23-006 and BT-23-007 select the DETERMINISTIC backend from the
      success probability of the simulation. For a security-significant gate, this gives
      a high-probability node the permissive AlwaysSucceed. Then, by default, a party
      that is not the Case Owner can adopt case state or end an embargo. For such a
      gate, a permissive default is a protocol-security risk, not a prototype
      convenience. Thus the floor (the most restrictive backend with correct semantics)
      is the default. A permissive backend is an explicit operator choice that the
      operator must document (ADR-0076). Because the rule is general, each gate author
      applies it when the gate is added, and an audit does not have to find it later.
      notes/call-out-configuration.md tells which gates qualify. It also tells why
      similar gates do not qualify, for example the accept-direction
      CaseOwnerApprovesEmbargoResponse (EMB-15-001) and the trigger-side
      EmbargoExitPolicyGuard. This rule sets only the default posture. RSH-07-004
      (ADR-0080) tells how to compose a qualifying gate. A backend factory that always
      returns FAILURE must not be that default (RSH-07-004).
    relationships:
    - rel_type: supersedes
      spec_id: BT-23-002
      note: >
        Carves out security-significant gates from the p>0.5 → AlwaysSucceed
        rule; the same carve-out applies to BT-23-006 and BT-23-007.
    - rel_type: refines
      spec_id: RSH-07-001
      note: Generalizes the two-gate conservative-default requirement.
    - rel_type: refines
      spec_id: RSH-07-004
      note: >
        Posture (conservative default) is orthogonal to composition; RSH-07-004
        replaces the unconditional-FAILURE mechanism with a routing subtree
        without changing the default posture BT-23-012 mandates.
    adr:
    - ADR-0076
    - ADR-0080
  - id: BT-23-013
    priority: MUST
    kind: project
    statement: >
      For a capability that declares one or more output ports, the DETERMINISTIC
      backend MUST write type-conformant values to every declared output port
      when it returns SUCCESS — notwithstanding BT-23-002 and BT-23-007, which
      name AlwaysSucceed by class. Where this requirement and those apply to the
      same capability, this one governs: a bare constant SUCCESS backend MUST NOT
      be used as the DETERMINISTIC default for a capability that declares output
      ports. BT-23-002 and BT-23-007 remain authoritative for the SUCCESS/FAILURE
      direction, which this requirement does not change.
    rationale: >-
      BT-23-002 and BT-23-007 select the deterministic backend so that deterministic
      demo scenarios move the protocol forward. For a capability that makes data, a
      constant SUCCESS with no data prevents that. The capability reports success, the
      downstream gate reads a missing key, and the arm does nothing. To move forward
      through an arm that needs data, the tree must have the data. Thus the status
      direction alone does not fully specify the default. The failure is silent, because
      a downstream read declared optional gives FAILURE, not an error. Thus the rule
      puts the obligation on the default. A reviewer does not have to find the problem
      by chance. BT-18-012 lets core read the declared contract, so a conforming default
      is possible. The same obligation applies to a STOCHASTIC backend under BT-18-003.
      This includes the generic WeightedBehavior backends for production-only domains
      that have no named fuzzer node.
    adr:
    - ADR-0097
    verification: >
      A ratchet enumerates every domain bundle field, resolves its DETERMINISTIC
      default, and fails if the capability declares output ports that the default
      does not write; the equivalent check covers the STOCHASTIC singletons.
    relationships:
    - rel_type: supersedes
      spec_id: BT-23-002
      note: >
        BT-23-002 names AlwaysSucceed by class; for a data-producing capability
        BT-23-013 substitutes a contract-honouring backend in the same
        SUCCESS direction. The same constraint applies to BT-23-007.
    - rel_type: constrains
      spec_id: BT-23-012
      note: >
        BT-23-012 and BT-23-013 are the two constraints on the ceiling/floor
        rule, and they do not overlap: BT-23-012 overrides the status direction
        for a security-significant gate, BT-23-013 overrides the backend class
        for a data-producing capability while leaving the direction intact. A
        gate covered by BT-23-012 declares no output ports, so BT-23-013 does
        not reach it.
    - rel_type: implements
      spec_id: BT-18-002
      note: >
        BT-23-013 applies BT-18-002 to the specific backend that BT-23-001 makes
        the default everywhere.
    - rel_type: refines
      spec_id: BT-18-003
      note: >
        BT-18-003 requires type-conformant synthetic writes from a fuzzer
        backend; BT-23-013 extends the same obligation to the DETERMINISTIC
        default and to generic stochastic backends with no named fuzzer node.
