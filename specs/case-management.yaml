id: CM
title: Case Management
description: Requirements for VulnerabilityCase lifecycle management, CASE_MANAGER responsibilities, and the RM/EM/CS/VFD state
  model. Covers actor isolation at the protocol level, the distinction between participant-specific and participant-agnostic
  state, case initialization sequencing, embargo acceptance ownership, and the invitation acceptance lifecycle.
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: CM-01
  title: Actor Isolation
  specs:
  - id: CM-01-001
    priority: MUST
    kind: protocol
    statement: Each actor MUST have an isolated protocol state domain
    verification: Integration tests in `test/demo/` confirm that each actor maintains its own
      isolated RM/EM/CS state domain without cross-actor interference.
    stories:
    - story_2022_088
  - id: CM-01-002
    priority: MUST
    kind: protocol
    statement: Each actor's RM state MUST be maintained independently per case
    verification: Integration tests in `test/demo/` confirm that each actor's RM state for a
      case is tracked independently in its own `ParticipantStatus` records.
    stories:
    - story_2022_088
- id: CM-02
  title: CASE_MANAGER Lifecycle
  specs:
  - id: CM-02-001
    priority: MUST
    kind: protocol
    statement: Each VulnerabilityCase MUST have exactly one associated CASE_MANAGER
    verification: Inspection of `vultron/core/` confirms that each `VulnerabilityCase` is
      associated with exactly one participant holding `CVDRole.CASE_MANAGER`.
    stories:
    - story_2022_029
    - story_2022_031
  - id: CM-02-002
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER MUST be the authoritative source of truth for case state
    verification: Integration tests in `test/demo/` confirm that participants fetch canonical
      state from the CASE_MANAGER rather than from each other.
    stories:
    - story_2022_088
    - story_2022_045
  - id: CM-02-003
    priority: MUST
    kind: project
    statement: CASE_MANAGER MUST persist until the associated VulnerabilityCase is closed
    note: >-
      Read this as the *role assignment* persisting, not an object's lifetime. The CASE_MANAGER is
      whichever participant holds `CVDRole.CASE_MANAGER` (BT-10-002, as revised for ISSUE-1872); the
      actor itself participates in many cases and its existence is not scoped to any one of them.
      This group's statements are now phrased in terms of the CASE_MANAGER role directly, rather than
      an obligation on a distinct "CaseActor" component — the earlier framing produced the phantom
      per-case CaseActor identity. ADR-0088 settles this: authority is the `CVDRole.CASE_MANAGER`
      role, and "CaseActor" names only the concrete prototype/demo actor that enacts it — never the
      authority, and never an identity to match on (see CM-02-011 through CM-02-013).
    verification: >-
      Inspection of `vultron/core/` confirms nothing revokes `CVDRole.CASE_MANAGER` from the holding
      participant before the case closes. Read per the note: what must persist is the role assignment
      on the participant record, not an object's lifetime.
  - id: CM-02-004
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER MUST know the case owner
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `VulnerabilityCase.attributed_to` records the case owner and is readable by the CASE_MANAGER.
    stories:
    - story_2022_046
    - story_2022_047
    - story_2022_050
    - story_2022_051
  - id: CM-02-005
    priority: MUST
    kind: protocol
    statement: >-
      CASE_MANAGER MUST restrict the following activities to the case owner: case closure,
      approving an embargo proposal to become active on the case and terminating an active embargo,
      approving or rejecting participant invitations, and case ownership transfer
      (see CM-02-006 for the authorisation mechanism).
    verification: Integration tests in `test/demo/` confirm that case closure, embargo approval,
      participant invitation approval, and ownership transfer are only executed when triggered
      by the case owner.
    scope:
    - production
    stories:
    - story_2022_048
    - story_2022_050
  - id: CM-02-006
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER MUST enforce case-level authorization for all case mutations
    verification: Inspection of `vultron/core/` confirms that every case mutation path checks
      actor authorization before applying the mutation.
    scope:
    - production
    stories:
    - story_2022_036
  - id: CM-02-007
    priority: MUST
    kind: protocol
    statement: '`VulnerabilityCase` MUST include a `notes: list[as_NoteRef]` field to record case-scoped notes created via
      `AddNoteToCase` activities'
    verification: 'Inspection of `vultron/core/models/case.py` confirms that `VulnerabilityCase`
      declares a `notes: list[as_NoteRef]` field.'
    stories:
    - story_2022_083
  - id: CM-02-008
    priority: MUST
    kind: protocol
    statement: >-
      When a `VulnerabilityCase` is created from an originating `VulnerabilityReport` Offer, the actor
      that received the Offer (the CASE_OWNER) MUST be recorded as the initial primary participant,
      and `VulnerabilityCase.attributed_to` MUST be set to that actor's ID on every creation path,
      including when the CASE_MANAGER creates the case (CP-09-001).
    rationale: >-
      `attributed_to` is the case's owner field: ownership checks read it (MSM-07-008) and ownership
      transfer rewrites it alongside the `CASE_OWNER` role (CM-21-002). Who *created* the case is
      carried by the `actor` of `Create(VulnerabilityCase)`, not by `attributed_to`.
    verification: Integration tests in `test/demo/` confirm that the report-receiving actor is recorded as
      the initial primary participant, and is the case's `attributed_to`, when a `VulnerabilityCase` is
      created from an `Offer(Report)`.
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-02-009
    priority: MUST
    kind: protocol
    statement: The CASE_MANAGER MUST apply its own trusted timestamp to every state-changing event it receives, regardless of
      any timestamp supplied by the sending participant
    rationale: The CASE_MANAGER's clock is the only trusted source of time for event ordering within a case; using participant-supplied
      timestamps would allow different copies of a case (held by different actors) to disagree on event order, undermining
      auditability and the single-source-of-truth guarantee
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER timestamps every
      state-changing event with its own clock, discarding any timestamp supplied by the sender.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    stories:
    - story_2022_074
    - story_2022_045
  - id: CM-02-010
    priority: MUST
    kind: project
    statement: The actor enacting CASE_MANAGER and the case owner (named actor) MUST have distinct actor identities — each with their own actor
      ID — even when co-located on the same server
    rationale: Enforcing distinct identities ensures that all case-state transitions pass through the wire protocol regardless
      of deployment topology, preserving audit integrity and enabling future separation onto independent containers without
      protocol changes
    verification: Inspection of `vultron/core/` confirms that the actor enacting CASE_MANAGER and
      the case owner named actor each hold distinct actor IDs, even in single-server
      deployments.
    relationships:
    - rel_type: refines
      spec_id: CM-01-001
    - rel_type: depends_on
      spec_id: CM-02-001
  - id: CM-02-011
    priority: MUST
    kind: architecture
    statement: >-
      An actor is the single-writer authority for a case if and only if it enacts
      `CVDRole.CASE_MANAGER` in that case's participant roster (`CaseParticipant.case_roles`).
      Authority MUST be determined from the role, never from hosting location or from the
      actor's name or URL shape.
    rationale: >-
      Authority was determined several ways, some keyed off where an actor was hosted or the
      shape of its URL rather than the role. The role is the only protocol-salient signal;
      the `case-actor` name is a demo convenience.
    verification: >-
      Inspection of `vultron/core/` confirms every authority determination reads
      `CaseParticipant.case_roles` via the single role-authority resolver (ARCH-24-001), ratcheted
      by `test/architecture/test_role_authority_resolver.py`. Behavioural coverage:
      `test/core/behaviors/sync/nodes/test_replay.py::TestFindCaseActorNode` (whose fixture makes
      the role-holder neither the store owner nor the executing actor, so echoing the executing
      actor fails), `test/core/use_cases/test_helpers.py::TestFindCaseActorId`, and
      `test/core/use_cases/received/test_reject_sync.py::TestRejectLedgerEntryReceivedUseCase::test_replay_triggered_when_the_case_manager_is_resolvable`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-002
    adr:
    - ADR-0088
  - id: CM-02-012
    priority: MUST
    kind: architecture
    statement: >-
      The actor enacting `CVDRole.CASE_MANAGER` MUST recognize its own canonical ledger
      entries as authoritative from replica-seed onward, including during the bootstrap window
      before any co-located `Service` object carries the case `context`.
    rationale: >-
      The hosting-based check had a bootstrap window in which the real CASE_MANAGER failed its own
      hosting test and would take the participant arm on its own ledger. Role membership is
      stable from replica-seed onward and has no such window.
    verification: >-
      `test/core/behaviors/sync/test_announce_tree.py::test_case_manager_role_takes_authority_arm_without_service_object`
      confirms the actor enacting `CVDRole.CASE_MANAGER` takes the authority arm on its own ledger
      entry even before any `Service` object carries `context`. Address-resolution window:
      `test/core/behaviors/sync/nodes/test_replay.py::TestFindCaseActorNode::test_resolves_without_any_service_object_carrying_context`.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-011
    adr:
    - ADR-0088
  - id: CM-02-013
    priority: MUST_NOT
    kind: architecture
    statement: >-
      The `case-actor` name and any `.../actors/case-actor` URL MUST NOT be treated by any
      protocol logic as evidence of authority, recognition, or routing; they are provisioning
      conveniences with no protocol meaning.
    rationale: >-
      ADR-0041 gave the enacting actor a stable inbox URL, which stands as a provisioning fix.
      ADR-0088 narrows that identity narrative: the stable URL is a convenience, and no protocol
      logic may treat the `case-actor` name or URL shape as evidence of authority.
    verification: >-
      Ratchet ARCH-24-004 asserts no protocol-logic module branches on `is_case_actor_identity`,
      the `case-actor` URL substring, the segment constant, the identity `case_actor_identity()`
      builds, or a `Service`-hosting `context` scan. `vultron/demo/` is outside that corpus by
      design (provisioning at a readable URL is the convenience ADR-0088 preserves).
    relationships:
    - rel_type: refines
      spec_id: CM-02-011
    adr:
    - ADR-0088
  - id: CM-02-014
    priority: MUST
    kind: project
    statement: >-
      A `VulnerabilityCase` MUST have both a `CVDRole.CASE_OWNER` participant and a
      `CVDRole.CASE_MANAGER` participant from the moment of creation. Neither slot may be left
      empty or deferred to a later operation.
    rationale: >-
      An unoccupied `CASE_OWNER` or `CASE_MANAGER` slot makes role-guard checks undefined from
      the moment the case exists. Any creation path that omits either participant leaves the case
      in a state that cannot be self-healed without an explicit remediation step, and causes
      `resolve_case_manager_id` to return `None` immediately — making the role ledger unreliable
      as the single source of authority (ADR-0088, ARCH-24-001).
    verification: >-
      `test_create_case_trigger_registers_owner_and_manager` in
      `test/core/use_cases/triggers/case/test_create.py` asserts both `CVDRole.CASE_OWNER`
      and `CVDRole.CASE_MANAGER` are present on a `CaseParticipant` after
      `SvcCreateCaseUseCase` executes. The `Accept(CaseProposal)` path is covered by existing
      tests in `test/core/behaviors/case/test_case_proposal_received_tree.py`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
  - id: CM-02-015
    priority: MUST
    kind: project
    statement: >-
      When a `VulnerabilityCase` is created via the direct-mint path (e.g. `trigger/create-case`,
      without a `Create(as_CaseProposal)` round-trip), the creating actor MUST be registered as a
      `CaseParticipant` carrying both `CVDRole.CASE_OWNER` and `CVDRole.CASE_MANAGER` as part of
      the same atomic case-creation operation.
    rationale: >-
      In the direct-mint path there is no intermediary proposer; the creating actor is the sole
      authority holder from the start and holds both roles until it delegates `CASE_MANAGER` via
      an `Offer(role)` → `Accept` exchange. Deferring or omitting participant registration means
      the case roster is empty at birth, violating CM-02-014 and breaking any caller that queries
      the role ledger immediately after creation.
    verification: >-
      `test_create_case_trigger_registers_owner_and_manager` in
      `test/core/use_cases/triggers/case/test_create.py` asserts both roles are present on
      the `CaseParticipant` after `SvcCreateCaseUseCase.execute()`. The demo-layer invariant is
      enforced by `test/demo/test_invite_actor_demo.py` asserting `resolve_case_manager_id`
      returns a non-`None` value after `setup_initialized_case`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-014
- id: CM-03
  title: Case State Model
  specs:
  - id: CM-03-001
    priority: MUST
    kind: protocol
    statement: 'The system MUST implement the three interacting state machines: RM (Report Management), EM (Embargo Management),
      and CS (Case State)'
    verification: Integration tests in `test/demo/` confirm that RM, EM, and CS state machines
      are each instantiated and advance independently.
    relationships:
    - rel_type: implements
      spec_id: VP-01-001
    - rel_type: implements
      spec_id: VP-13-001
    - rel_type: implements
      spec_id: VP-14-001
    stories:
    - story_2022_107
  - id: CM-03-002
    priority: MUST
    kind: protocol
    statement: RM state MUST be participant-specific
    verification: Inspection of `vultron/core/` confirms that RM state is stored on
      `ParticipantStatus.rm_state`, a per-participant field, not on a shared case-level
      structure.
    relationships:
    - rel_type: implements
      spec_id: VP-01-002
    - rel_type: implements
      spec_id: VP-02-002
    - rel_type: implements
      spec_id: VP-03-001
    stories:
    - story_2022_088
    - story_2022_075
  - id: CM-03-003
    priority: MUST
    kind: protocol
    statement: A shared EM state MUST be tracked at the case level in `CaseStatus.em_state` to represent the collective embargo
      agreement
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `CaseStatus.em_state` exists as a case-level field tracking the collective embargo state.
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: implements
      spec_id: VP-14-001
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-03-008
    priority: MUST
    kind: protocol
    statement: Each `CaseParticipant` MUST track their own embargo consent through its per-embargo consent rows
      (CM-10-001, CM-18-001)
    verification: Inspection of `vultron/core/` confirms that the consent rows (`embargo_consents`) are a
      per-participant field on `CaseParticipant`.
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
    stories:
    - story_2022_023
    - story_2022_027
  - id: CM-03-004
    priority: MUST
    kind: protocol
    statement: CS (PXA sub-state) MUST be participant-agnostic (shared per case)
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `CaseStatus.pxa_state` is a case-level field shared across all participants.
    stories:
    - story_2022_088
    - story_2022_107
  - id: CM-03-005
    priority: MUST
    kind: protocol
    statement: VFD (Vendor Fix Deployment) state MUST be participant-specific
    verification: Inspection of `vultron/core/` confirms that VFD state is stored on a
      per-participant `ParticipantStatus.vfd_state` field.
    stories:
    - story_2022_107
    - story_2022_088
  - id: CM-03-006
    priority: MUST
    kind: project
    statement: Collection fields that hold status histories MUST be pluralized and documented as history collections
    verification: Inspection of `vultron/core/models/` confirms that history collection fields
      (e.g., `case_statuses`, `participant_statuses`) are pluralized list fields.
  - id: CM-03-007
    priority: MUST
    kind: protocol
    statement: RM state transitions MUST use the established protocol activity types without introducing new activity types
      for reverse transitions
    rationale: Keeps the RM symbol set minimal and produces clean audit histories; `Undo` conflates historical negation with
      a new forward transition
    verification: Static analysis (grep) confirms that no RM-reverse transition handler
      introduces an activity type outside the established protocol symbol set.
    relationships:
    - rel_type: implements
      spec_id: VP-02-004
    lint_suppress:
    - missing_story_reference
- id: CM-04
  title: State Transition Correctness
  specs:
  - id: CM-04-001
    priority: MUST
    kind: protocol
    statement: Handlers processing RM state transitions MUST update `ParticipantStatus.rm_state` for the sending actor's CaseParticipant
    verification: Integration tests in `test/demo/` confirm that processing an RM status message
      updates the sender's `CaseParticipant` with a new `ParticipantStatus.rm_state` entry.
    relationships:
    - rel_type: implements
      spec_id: VP-02-002
    - rel_type: implements
      spec_id: VP-02-003
    - rel_type: implements
      spec_id: VP-03-001
    - rel_type: implements
      spec_id: VP-13-005
    stories:
    - story_2022_107
  - id: CM-04-002
    priority: MUST
    kind: protocol
    statement: Handlers processing VFD state transitions MUST update `ParticipantStatus.vfd_state` for the sending actor's
      CaseParticipant
    verification: Integration tests in `test/demo/` confirm that processing a VFD status message
      updates the sender's `ParticipantStatus.vfd_state`.
    stories:
    - story_2022_107
    - story_2022_062
  - id: CM-04-003
    priority: MUST
    kind: protocol
    statement: >-
      When processing an EM state transition and the accepting actor is the case owner,
      the handler MUST update CaseStatus.em_state.
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from the case
      owner advances `CaseStatus.em_state`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-001
    - rel_type: implements
      spec_id: VP-09-001
    - rel_type: implements
      spec_id: VP-11-001
    - rel_type: implements
      spec_id: VP-11-002
    - rel_type: implements
      spec_id: VP-14-001
    - rel_type: implements
      spec_id: VP-14-002
    - rel_type: depends_on
      spec_id: CM-03-008
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-04-004
    priority: MUST
    kind: protocol
    statement: Handlers processing PXA state transitions (public disclosure, exploit publication, attack observation) MUST
      update `CaseStatus.pxa_state`
    verification: Integration tests in `test/demo/` confirm that processing a PXA transition
      (public disclosure, exploit publication, or attack observation) updates
      `CaseStatus.pxa_state`.
    relationships:
    - rel_type: implements
      spec_id: VP-03-002
    - rel_type: implements
      spec_id: VP-14-003
    - rel_type: implements
      spec_id: VP-14-004
    stories:
    - story_2022_018
    - story_2022_019
    - story_2022_069
  - id: CM-04-005
    priority: MUST
    kind: project
    statement: Handlers that implement VFD or PXA transitions MUST validate the requested transition against the authoritative
      current state before persisting it
    verification: Inspection of `vultron/core/` confirms that VFD and PXA transition handlers
      call the state machine's transition validator before persisting any state change.
  - id: CM-04-006
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: 'A state transition handler for a participant-specific transition (RM or VFD) MUST NOT update any case-level (participant-agnostic) state field (em_state, pxa_state). A state transition handler for a case-level transition (PXA or EM) MUST NOT update any participant-specific state field (rm_state, vfd_state).'
    relationships:
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: depends_on
      spec_id: CM-03-008
  - id: CM-04-007
    priority: MUST
    kind: protocol
    statement: RM transition validation MUST treat `RM.CLOSED` as terminal before applying any same-state no-op shortcut.
      A repeated `CLOSED -> CLOSED` update MUST be treated as a terminal no-op that does not append new participant status
      records, trigger broadcast, or create new case-ledger entries.
    rationale: Checking equality first can let duplicate close retries flow into downstream append/broadcast paths as fresh
      state changes.
    verification: A unit test confirms that a `RM.CLOSED -> RM.CLOSED` duplicate close attempt
      is handled as a terminal no-op without appending a new `ParticipantStatus` record.
    stories:
    - story_2022_066
  - id: CM-04-008
    priority: MUST
    kind: protocol
    statement: >-
      When processing an EM state transition and the accepting actor is any participant other
      than the case owner, the handler MUST update only that participant's own
      consent row for the accepted embargo.
    rationale: >-
      Non-owner participants do not advance the shared EM state; their individual acceptance
      updates only their own consent record.
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from a
      non-owner participant updates only that participant's
      consent row for the accepted embargo, not `CaseStatus.em_state`.
    stories:
    - story_2022_023
    - story_2022_027
- id: CM-05
  title: Object Model Relationships
  specs:
  - id: CM-05-001
    priority: MUST
    kind: protocol
    statement: >-
      The system MUST distinguish the following domain objects as separate, non-interchangeable
      types: VulnerabilityReport, VulnerabilityCase, VulnerabilityRecord, CaseReference, CaseActor,
      CaseParticipant, and ParticipantStatus. Each of these types MUST NOT be substituted for
      another at any API boundary, persistence layer, or wire message.
    verification: Static analysis (mypy) confirms that `VulnerabilityReport`,
      `VulnerabilityCase`, `VulnerabilityRecord`, `CaseReference`, `CaseActor`,
      `CaseParticipant`, and `ParticipantStatus` are declared as distinct non-interchangeable
      types.
    lint_suppress:
    - missing_story_reference
  - id: CM-05-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: A `VulnerabilityCase` MUST reference at least one `VulnerabilityReport`; a case with zero reports MUST NOT
      exist
    relationships:
    - rel_type: implements
      spec_id: VP-02-015
    - rel_type: implements
      spec_id: VP-02-020
    stories:
    - story_2022_102
  - id: CM-05-003
    priority: SHOULD
    kind: protocol
    statement: A `VulnerabilityCase` SHOULD reference at least one `VulnerabilityRecord` before closure; cases with no associated
      record at closure SHOULD log a warning
  - id: CM-05-004
    priority: MAY
    kind: protocol
    statement: A `VulnerabilityCase` MAY have zero or more associated `CaseReference` objects
  - id: CM-05-005
    priority: MUST
    kind: project
    statement: '`CaseReference` objects MUST include at minimum a `url` field.'
    verification: Inspection of `vultron/core/models/case.py` confirms that the `CaseReference`
      model declares a required `url` field.
  - id: CM-05-006
    priority: MAY
    kind: protocol
    statement: One report MAY describe multiple vulnerabilities; one case MAY group multiple reports (e.g., when overlapping
      participants are involved)
    stories:
    - story_2022_104
    - story_2022_105
    - story_2022_111
  - id: CM-05-007
    priority: MAY
    kind: protocol
    statement: Multiple `CaseReference` objects MAY arise from a single case (e.g., coordinated simultaneous disclosure by
      multiple vendors)
  - id: CM-05-008
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: '`VulnerabilityRecord` identifiers MUST be treated as opaque strings; the system MUST NOT restrict identifier
      values to CVE ID format or any other specific namespace'
    rationale: Different organizations use different identifier namespaces (CVE, CERT/CC VU#, vendor-assigned IDs, etc.);
      requiring a specific format excludes valid records and prevents multi-namespace support
  - id: CM-05-009
    priority: SHOULD
    kind: protocol
    statement: A `VulnerabilityRecord` SHOULD support a list of alias identifiers from different namespaces for the same vulnerability
    rationale: Multiple IDs from different namespaces may refer to the same underlying vulnerability (e.g., a CVE ID and a
      CERT/CC VU# ID)
  - id: CM-05-010
    priority: MUST
    kind: project
    statement: When a `VulnerabilityRecord` is a `CVERecord` (i.e., it carries a CVE ID), its data MUST conform to the CVE
      JSON schema (<https://github.com/CVEProject/cve-schema>)
    verification: Inspection of `vultron/core/` confirms that `CVERecord` (or the equivalent
      CVE-typed `VulnerabilityRecord`) validates its data against the CVE JSON schema.
  - id: CM-05-011
    priority: SHOULD
    kind: protocol
    statement: '`CaseReference` objects SHOULD include a `name` field containing a human-readable title.'
    rationale: A human-readable title makes references easier to identify in case summaries and reports.
  - id: CM-05-012
    priority: MAY
    kind: protocol
    statement: >-
      `CaseReference` objects MAY include a `tags` field (array of one or more type
      descriptors, e.g., "patch", "vendor-advisory", "third-party-advisory", "exploit",
      "release-notes").
    rationale: >-
      Type descriptor tags allow consumers to filter or categorise references without
      parsing the URL or name.
- id: CM-06
  title: Case Update Broadcast
  specs:
  - id: CM-06-001
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER updates canonical case state, it MUST notify every active
      participant (CM-10-004).
    rationale: >-
      An owner's `Update(VulnerabilityCase)` is not a ledgered assertion (ADR-0111,
      #3936); the CASE_MANAGER announces a received update to the participants as
      a broadcast, and every ledgered change reaches them as `Announce(CaseLedgerEntry)`.
    verification: >-
      Integration tests in `test/demo/` confirm that after the CASE_MANAGER updates
      canonical case state it fans out `Announce(CaseLedgerEntry)` to every active
      participant and to no inert participant.
    relationships:
    - rel_type: implements
      spec_id: VP-02-019
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: implements
      spec_id: VP-08-001
    adr:
    - ADR-0114
    stories:
    - story_2022_043
    - story_2022_098
  - id: CM-06-002
    priority: MUST
    kind: protocol
    statement: Participants receiving a case update notification MUST treat the update as authoritative only when it originates
      from the CASE_MANAGER
    verification: Integration tests in `test/demo/` confirm that a state update message from a
      non-CASE_MANAGER participant is not treated as authoritative case state.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    stories:
    - story_2022_088
    - story_2022_089
  - id: CM-06-003
    priority: MUST
    kind: protocol
    statement: Case update notifications MUST include the updated CASE_MANAGER's actor URL so participants can fetch the current case
      state if needed
    verification: Inspection of `vultron/core/` confirms that case update notification payloads
      include the CASE_MANAGER's actor URL so recipients can fetch current state.
    scope:
    - production
    stories:
    - story_2022_088
    - story_2022_028
  - id: CM-06-004
    priority: MUST
    kind: protocol
    statement: Participants MUST authenticate case update notifications before accepting them as authoritative
    verification: Inspection of `vultron/core/` confirms that the case update notification
      handler verifies the sender's identity against the known CASE_MANAGER before processing the
      update.
    scope:
    - production
    stories:
    - story_2022_089
    - story_2022_090
  - id: CM-06-005
    priority: MUST
    kind: protocol
    statement: >-
      When a note is added to a case, the CASE_MANAGER MUST broadcast the note to every
      active participant (CM-10-004), excluding the note author.
    verification: >-
      Integration tests in `test/demo/` confirm that adding a note to a case causes the
      CASE_MANAGER to broadcast the note to every active participant except the note
      author.
    relationships:
    - rel_type: depends_on
      spec_id: OX-03-001
    - rel_type: depends_on
      spec_id: CM-02-001
    adr:
    - ADR-0114
    stories:
    - story_2022_041
    - story_2022_083
- id: CM-07
  title: CVD Action Rules API
  specs:
  - id: CM-07-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD expose an endpoint that returns the set of valid actions available to a case participant
      given the current case state and their role
    relationships:
    - rel_type: refines
      spec_id: AR-07-001
    - rel_type: refines
      spec_id: AR-07-002
    stories:
    - story_2022_031
    - story_2022_088
  - id: CM-07-002
    priority: MUST
    kind: protocol
    statement: The action rules response MUST include the participant's role and the current RM, EM, CS, and VFD states relevant
      to that participant
    verification: Integration tests in `test/demo/` confirm that the action rules endpoint
      returns the participant's role and current RM, EM, CS, and VFD states.
    stories:
    - story_2022_088
    - story_2022_061
  - id: CM-07-003
    priority: MUST
    kind: protocol
    statement: The action rules response MUST list valid next actions as structured objects including the action name and
      any required parameters
    verification: Integration tests in `test/demo/` confirm that the action rules endpoint lists
      valid next actions as structured objects containing at minimum the action name.
    stories:
    - story_2022_086
    - story_2022_088
- id: CM-08
  title: Domain Model Architecture
  specs:
  - id: CM-08-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD maintain a clear separation between the wire representation, domain model, and persistence
      model for CVD objects
  - id: CM-08-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: Domain objects MUST NOT directly inherit from ActivityStreams base types, and wire classes MUST NOT carry
      translation methods; AS2 serialization MUST be performed by the rendering port (ARCH-20-001)
      (see `notes/domain-model-separation.md` and ADR-0099)
    rationale: The two branches stay distinct type hierarchies, and the translation between them lives on the adapter side —
      the one layer permitted to see both — so neither branch imports the other.
    adr:
    - ADR-0082
- id: CM-09
  title: Redacted Case View
  specs:
  - id: CM-09-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD support a `RedactedVulnerabilityCase` type for sharing case information with invited-but-not-yet-accepted
      participants
    scope:
    - production
  - id: CM-09-002
    priority: MUST
    kind: protocol
    statement: >-
      The ID of a `RedactedVulnerabilityCase` MUST be cryptographically unrelated to the
      full `VulnerabilityCase` ID. The prototype case stub (CM-11-013) is not a
      `RedactedVulnerabilityCase`, and this requirement does not apply to it.
    rationale: Prevents an attacker who obtains a redacted case ID from inferring the full case ID
    verification: Inspection of `vultron/core/` confirms that `RedactedVulnerabilityCase` ID
      generation does not derive from or encode the full `VulnerabilityCase` ID.
    scope:
    - production
    adr:
    - ADR-0114
    stories:
    - story_2022_033
    - story_2022_024
  - id: CM-09-003
    priority: MUST
    kind: protocol
    statement: Each invitee MUST receive a distinct `RedactedVulnerabilityCase` ID
    rationale: Prevents cross-correlation of redacted IDs to infer participant list size or identities
    verification: Inspection of `vultron/core/` confirms that each invitee's
      `RedactedVulnerabilityCase` is generated with a unique ID distinct from every other
      invitee's redacted case ID.
    scope:
    - production
    stories:
    - story_2022_033
    - story_2022_024
  - id: CM-09-004
    priority: MAY
    kind: protocol
    statement: >-
      For the prototype, the stub Invite MAY carry the case stub of CM-11-013, which
      names the full case ID, deferring the redacted view to a later phase.
    adr:
    - ADR-0114
- id: CM-10
  title: Per-Participant Embargo Acceptance
  specs:
  - id: CM-10-001
    priority: MUST
    kind: protocol
    statement: >-
      `CaseParticipant` MUST record its consent per embargo: one consent row for each embargo the
      participant was asked about, naming the embargo and the participant's answer to it (CM-18-001).
      A participant accepts an embargo explicitly, by an `Accept`, or by containment, when the case
      owner activates a revision that ends no later than terms the participant had accepted
      (EP-05-001). No other record of embargo consent may exist on the participant.
    rationale: >-
      Consent is per embargo (ADR-0093, ADR-0122). The rows are what the CM-10-004 content gate
      reads, so they must name every embargo the participant is bound to, including one carried over
      by containment: agreeing to N days is agreeing to every shorter period, so no explicit
      `Accept` is owed for it. A second record of consent beside the rows — the scalar PEC state this
      replaced — could disagree with them (Concern #3884); there is now nothing to disagree with.
    verification: Inspection of `vultron/core/models/case_participant.py` confirms that
      `CaseParticipant` carries `embargo_consents` rows and declares no scalar consent field and no
      `accepted_embargo_ids`.
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-10-002
    priority: MUST
    kind: protocol
    statement: Embargo acceptances MUST be timestamped by the CASE_MANAGER at the time of receipt, not using the participant's
      claimed timestamp
    rationale: The CASE_MANAGER applies the only trusted timestamp; the participant's reported time cannot be verified
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER's own clock
      timestamp is stored on embargo acceptance records, not the participant's claimed
      timestamp.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    - rel_type: implements
      spec_id: CM-02-009
    stories:
    - story_2022_074
  - id: CM-10-003
    priority: SHOULD
    kind: protocol
    statement: >-
      The `CaseParticipant` model SHOULD expose the IDs of the `EmbargoEvent` objects the participant has
      invited to, accepted, declined or let expire as `embargo_consents` rows (CM-10-001, CM-18-001), from which
      the embargoes it accepted, explicitly or by containment, are read.
    adr:
    - ADR-0093
  - id: CM-10-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST share case content only with active participants. A
      participant is active when it was seated by the case initialization
      sequence (CM-14-001: the Case Owner, the CASE_MANAGER and the reporter) or
      has accepted the stub Invite
      (`Accept(Invite(Actor, VulnerabilityCaseStub))`), has not been removed
      (CM-31-001), and, only when an embargo is active, its consent row for that
      embargo is `ACCEPTED` (CM-18-001). Every other participant is inert and MUST NOT receive case
      content: no `CaseLedgerEntry` announcements, no
      `Announce(VulnerabilityCase)`, no status broadcasts, no embargo
      announcements (ADR-0114).
    rationale: >-
      Many cases have no active embargo — one not yet established, or one
      already exited — so "has accepted the active embargo" alone cannot be the entitlement test.
      Before ADR-0114 this rule held only because a participant that had not
      accepted was absent from the roster; the Invite now creates the record, so
      entitlement has to be checked rather than implied by membership.
    verification: >-
      Tests confirm that an invitee that has not accepted the stub Invite, and a
      joined participant whose row for the active embargo is not `ACCEPTED`, receive no
      case content, and that an active participant does, including one seated by
      case initialization that was never sent a stub. A test confirms a removed
      participant receives no case content whatever its embargo consent.
    adr:
    - ADR-0114
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_025
  - id: CM-10-005
    priority: MUST
    kind: protocol
    statement: >-
      While a case has an active embargo, the CASE_MANAGER MUST NOT send an `Announce(CaseLedgerEntry)`
      to a participant that has not accepted that embargo (the CM-10-004 content gate), whether as
      fan-out of a new entry or as a replay answering that participant's `Reject(CaseLedgerEntry)`
      (SYNC-03-002); the participant's replica stays at the last entry it was sent. Embargo meta-protocol activities addressed to the
      participant directly (an embargo `Invite` and its responses) are not ledger fan-out and MUST still
      be delivered.
    rationale: >-
      The ledger fan-out is how participants learn every accepted case change, and each entry carries
      its payload verbatim — an added report or note reaches the recipient whole. Fan-out is therefore
      "sharing case updates" in CM-10-004's sense. An entry cannot be redacted per recipient without
      breaking the hash chain. Skipping a single entry does not work either: the replica buffers the
      next one as a forward gap and Rejects to request the missing entry (SYNC-14-002), so the replay
      would deliver the withheld content anyway. The gate therefore pauses the participant's whole
      stream, replay included, rather than filtering entries.
    verification: >-
      Unit tests on the fan-out recipient collectors confirm that, under an active embargo, a participant
      that is not `SIGNATORY` to the active embargo is excluded from the recipients while a
      signatory is included, and that with no active embargo both are included. A unit test on the
      replay sender confirms that a replay to such a participant sends no entry.
    relationships:
    - rel_type: refines
      spec_id: CM-10-004
    stories:
    - story_2022_023
    - story_2022_025
  - id: CM-10-006
    priority: MUST
    kind: protocol
    statement: >-
      When the CM-10-004 content gate admits a participant whose ledger stream it had paused (CM-10-005)
      — whenever the active check turns from false to true for that participant, whether because it
      accepts the active embargo, the embargo ends, or it is reinstated (CM-31-011) — the
      CASE_MANAGER MUST send that participant every canonical entry it was not sent, in log order
      starting with the first entry withheld from it, before or together with the entry that records
      the change admitting it.
    rationale: >-
      A paused participant's replica is a contiguous prefix of the ledger; backfilling the withheld suffix
      in order restores it to the leader's tip without a gap the catch-up gate (SYNC-10-004) would block
      on. Ending the embargo lifts the gate for everyone, so a participant that never accepted it is
      caught up at that point too. The trigger is the active check itself, not any one message
      (ADR-0116).
    verification: >-
      A received-side test confirms that when a participant accepts the active embargo, the
      CASE_MANAGER's outbox holds an `Announce(CaseLedgerEntry)` addressed to it for each entry committed
      while it was outside the gate, in log order and ahead of any later entry, and that none of those
      entries is re-sent to a participant that already had it.
    relationships:
    - rel_type: depends_on
      spec_id: CM-10-005
    - rel_type: depends_on
      spec_id: SYNC-04-001
    stories:
    - story_2022_023
    - story_2022_025
  - id: CM-10-007
    priority: MUST
    kind: architecture
    statement: >-
      The active-participant check (CM-10-004) MUST live in the shared recipient
      selection that every case-content send uses, not at individual send
      sites. Invites addressed to a participant so that it can join (the stub
      Invite) or consent (an embargo Invite, EP-09) are not case content and
      MUST reach an inert participant that has not been removed (CM-31-013).
      The embargo-ending notices owed to a bound participant that is not active
      (CM-31-009) are likewise not case content.
    rationale: >-
      Nearly every case-content send selected its recipients from the roster
      through one helper (`case_addressees`, retired by #4046). A per-site
      check would be missed by the next send site written; one shared check
      (`vultron/core/participants/recipients.py`) cannot be.
    verification: >-
      An architecture test asserts every case-content send selects recipients
      through the shared active-participant selection.
    adr:
    - ADR-0114
- id: CM-11
  title: Joining a Case — Stub Invite, Inert Participant, Full-Case Invite
  description: >-
    How an actor goes from invited to participating: the stub Invite creates an
    inert participant record, the participant's reply to it decides whether it
    joins, and a joined participant judges the case by replying to a full-case
    Invite (ADR-0114, ADR-0121; notes/case-joining.md).
  specs:
  - id: CM-11-001
    priority: MUST
    kind: protocol
    statement: >-
      When a participant accepts the stub Invite
      (`Accept(Invite(Actor, VulnerabilityCaseStub))`), the CASE_MANAGER MUST
      leave the participant's RM state at `RM.RECEIVED`, set its VF state to
      `V` when it holds the VENDOR role, and, when an embargo is active, mark its consent row for that embargo `ACCEPTED`, making it a signatory. Accepting the stub is joining the case
      and consenting to the active embargo; it is not a judgement of the case.
    rationale: >-
      The invitee has seen only the stub. Its judgement of the case comes after
      it has received the case and its history, as its reply to the full-case
      Invite (CM-11-010).
    verification: Tests confirm that `Accept(Invite(Actor, VulnerabilityCaseStub))`
      leaves the participant at `RM.RECEIVED`, sets VF `V` for a vendor, and
      records consent `SIGNATORY` when an embargo is active.
    relationships:
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: depends_on
      spec_id: CM-03-001
    adr:
    - ADR-0114
    stories:
    - story_2022_054
    - story_2022_088
  - id: CM-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      After joining a case, a participant SHOULD judge the case by replying to
      the full-case Invite (CM-11-010, CM-11-011) and then SHOULD decide to
      engage or defer with `Join(VulnerabilityCase)` (RM.ACCEPTED) or
      `Ignore(VulnerabilityCase)` (RM.DEFERRED).
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    - rel_type: depends_on
      spec_id: CM-11-001
    adr:
    - ADR-0121
    stories:
    - story_2022_006
  - id: CM-11-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT treat a joined participant as having committed to
      the case (RM.ACCEPTED) until it receives `Join(VulnerabilityCase)` from
      that participant.
    rationale: >-
      Only the participant can say it has chosen to engage. Neither accepting
      the stub Invite (joining) nor accepting the full-case Invite (RM.VALID)
      is an engagement decision.
    verification: Tests confirm that the CASE_MANAGER does not record a joined
      participant at `RM.ACCEPTED` until it receives `Join(VulnerabilityCase)`
      from it.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-001
    stories:
    - story_2022_054
    - story_2022_088
  - id: CM-11-003
    priority: MUST
    kind: protocol
    statement: >-
      When processing a reply to a stub Invite
      (`Accept`/`Reject(Invite(Actor, VulnerabilityCaseStub))`), the use case
      MUST resolve `case_id` from the case the nested Invite's stub names,
      never by deriving it from the stub's ID; the top-level `target` of the
      reply is not populated.
    rationale: >-
      The reply wraps the Invite as its `object_`, so the stub is on
      `object_.target`, which `extract_event` maps to `inner_target`. The stub
      has its own ID (`<case-id>/stub`) and names the case explicitly
      (CM-11-013); parsing one ID out of the other would couple every receiver
      to the ID scheme.
    verification: A unit test confirms the reply use case resolves `case_id` from
      the case named by the stub on the nested Invite.
    adr:
    - ADR-0114
    lint_suppress:
    - missing_story_reference
  - id: CM-11-006
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER sends a stub Invite
      (`Invite(Actor, VulnerabilityCaseStub)`), it MUST create the invitee's
      `CaseParticipant` in the same step, carrying the roles the Invite names,
      at RM `RECEIVED`, VF `v` when it holds the VENDOR role, and an `INVITED` consent row for the active embargo when one is active, and MUST commit the creation
      to the case ledger. The participant is inert (CM-10-004). A replica
      applying that ledger entry MUST create the same inert participant
      record.
    rationale: >-
      The CASE_MANAGER needs to track every invitee from the moment it is
      invited — whether it has been told and how it answered — including the
      invitees that decline (ADR-0114).
    verification: A test sends a stub Invite and finds the invitee's participant
      at RM `RECEIVED`, VF `v` (vendor) and consent `INVITED` (active embargo),
      with a ledger entry recording its creation.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_061
  - id: CM-11-007
    priority: MUST
    kind: protocol
    statement: >-
      A stub Invite has exactly two valid replies, `Accept` (CM-11-001) and
      `Reject`. On `Reject(Invite(Actor, VulnerabilityCaseStub))` the
      CASE_MANAGER MUST move the participant's RM state to `RM.CLOSED`, set VF
      `V` when it holds the VENDOR role, record embargo consent `DECLINED` when
      an embargo is active, and keep the participant record, which stays inert.
      `TentativeReject(Invite(Actor, VulnerabilityCaseStub))` MUST be refused.
    rationale: >-
      A stub reject is a hard no to joining. Keeping the record keeps the
      history that the actor was told and declined, which is what the early
      record exists for. Accepting the stub is not a judgement of the case, so
      there is nothing for a tentative reject to say.
    verification: Tests drive each stub reply and check the participant record,
      including that `TentativeReject` of a stub Invite is refused.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_006
  - id: CM-11-008
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER processes `Accept(Invite(Actor,
      VulnerabilityCaseStub))` and the participant is active (CM-10-004), it
      MUST send the participant `Announce(VulnerabilityCase)` and begin
      replaying the case ledger to it without waiting for any further signal
      from the participant.
    rationale: >-
      The participant is entitled to case content from the moment it is active,
      and the history is part of what it then judges. The Accept is the
      readiness signal; out-of-order arrival is buffered (SYNC-14, SYNC-15) and
      a real gap is recovered by `Reject(CaseLedgerEntry)` and replay.
    verification: A test confirms that processing the Accept queues
      `Announce(VulnerabilityCase)` and the ledger replay to the participant.
    adr:
    - ADR-0114
    stories:
    - story_2022_023
    - story_2022_045
  - id: CM-11-009
    priority: MUST
    kind: protocol
    statement: >-
      Any reply from a VENDOR-role invitee to its stub Invite MUST set its VF
      state to `V`. The CASE_MANAGER or Case Owner MAY set an inert invitee's VF
      to `V` before it replies (PRM-06-003); that write MUST NOT change its RM
      state.
    rationale: >-
      Any reply is evidence the vendor is aware of the case.
    verification: Tests confirm each stub reply sets a vendor's VF to `V`.
    adr:
    - ADR-0114
    - ADR-0121
    stories:
    - story_2022_061
  - id: CM-11-010
    priority: MUST
    kind: protocol
    statement: >-
      After CM-11-008, the CASE_MANAGER MUST send the participant
      `Invite(Actor, VulnerabilityCase)` — the full-case Invite — queued after
      the last replayed ledger entry, referencing the case by ID and carrying
      the `log_index` and `entry_hash` of its own ledger tail when it issued
      the Invite. A receiver MUST refuse a full-case Invite whose sender is not
      the case's CASE_MANAGER, as recorded on its replica or, before the
      replica exists, as the trust anchor recorded from the stub Invite
      (PCR-03-004), and a receiver with neither MUST refuse it.
    rationale: >-
      The participant already holds the case from the Announce, so the Invite
      only asks the question and carries no copy of the case. Delivery to each
      recipient is ordered (ADR-0112), so queuing the Invite after the replay
      means it arrives once the participant can answer it; its ledger position
      is the floor the participant must reach before answering (ADR-0121).
    verification: A test confirms the full-case Invite is queued after the last
      replayed ledger entry and carries the CASE_MANAGER's ledger tail position.
      Tests confirm a full-case Invite from the CASE_MANAGER is accepted, and
      one from any other actor, or with no known CASE_MANAGER, is refused.
    adr:
    - ADR-0121
    stories:
    - story_2022_006
  - id: CM-11-011
    priority: MUST
    kind: protocol
    statement: >-
      A reply to the full-case Invite MUST carry the replier's own ledger
      position (`log_index` and `entry_hash` of its tail when it decided). The
      CASE_MANAGER MUST record `Accept(Invite(Actor, VulnerabilityCase))` (RV)
      as `RM.RECEIVED → RM.VALID`, `TentativeReject(Invite(Actor,
      VulnerabilityCase))` (RI) as `RM.RECEIVED → RM.INVALID`, and
      `Reject(Invite(Actor, VulnerabilityCase))` (RC) as
      `RM.RECEIVED → RM.CLOSED`.
    verification: Tests drive each of the three replies and check the
      participant's RM state.
    adr:
    - ADR-0121
    stories:
    - story_2022_006
    - story_2022_062
  - id: CM-11-012
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a reply to the full-case Invite whose ledger
      position is behind the Invite's, or names an entry its own ledger does not
      hold at that index. It MUST accept a reply at or beyond the Invite's
      position. It MUST also refuse a reply from a participant that has not
      joined the case (an inert participant), and write nothing.
    rationale: >-
      The Invite's position is a floor, not a pin. A reply behind it was made
      without seeing what the participant was asked to judge; a reply beyond it
      is better informed. Pinning the reply to the Invite's position would make
      every reply on a busy case stale (ADR-0121).
    verification: Tests confirm a reply behind the floor, or naming an entry the
      ledger does not hold, is refused, a reply beyond the floor is accepted, and a reply from a
      participant that has not joined is refused and writes no ledger
      entry.
    adr:
    - ADR-0121
    stories:
    - story_2022_045
  - id: CM-11-013
    priority: MUST
    kind: protocol
    statement: >-
      A case stub MUST carry its own wire `type`, `VulnerabilityCaseStub`, and
      its own ID, the case's ID with `/stub` appended, and MUST name the case it
      stands for in a field of its own. A receiver MUST classify a stub by its
      `type`, never by which fields it carries or by parsing its ID.
    rationale: >-
      A receiver classifies an activity by its shape. Sharing the case's type
      and ID made the stub Invite and the full-case Invite indistinguishable
      (ADR-0114).
    verification: Tests confirm a stub serializes with `type`
      `VulnerabilityCaseStub` and ID `<case-id>/stub`, and that an inbound
      sparse `VulnerabilityCase` is validated as a case, not a stub.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-014
    priority: MUST
    kind: protocol
    statement: >-
      A stub Invite MUST carry a reply deadline. When the deadline passes
      unanswered, the CASE_MANAGER MUST close the Invite as an expired ask and
      MUST NOT change the invitee's participant state: the record stays inert at
      `RM.RECEIVED`, and its consent row for the embargo stays `INVITED` — the CM-28-004
      expiry-to-`EXPIRED` rule applies to an `Invite(EmbargoEvent)`, not to the
      embargo terms a stub Invite carries. Case-wide closure checks ("all
      participants closed") MUST count only participants that have joined: those
      seated by the case initialization sequence (CM-14-001) and those that have
      accepted their stub Invite.
    rationale: >-
      RM is the participant's own judgement (ADR-0121), so a timeout cannot
      stand in for one. An invitee that never answered must not keep the case
      from closing (ADR-0114).
    verification: >-
      A test lets a stub Invite expire and finds the Invite closed and the
      record unchanged at `RM.RECEIVED` with consent still `INVITED`, and finds
      that an all-participants-closed check ignores the unanswered invitee.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_006
  - id: CM-11-015
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER re-invites an invitee that has not answered its stub
      Invite, or whose stub Invite expired, the re-invite MUST be a fresh stub
      Invite on the same participant record with a new deadline, and its
      `inReplyTo` MUST be the id of the invitee's earlier stub Invite. A stub
      Invite to a participant that has joined or is at `RM.CLOSED` MUST be
      refused, wherever the CASE_MANAGER would send one, before any ledger entry
      is committed for it (ADR-0085).
    rationale: >-
      One actor has one participant record per case. `RM.CLOSED` is terminal
      with no rejoin path, and a stub reject is a closure (CM-11-007). Naming
      the earlier stub in the standard AS2 `inReplyTo` property leaves the
      invitee one live stub, and CM-11-016 then refuses an `Accept` of the
      earlier one, naming the fresh one.
    verification: >-
      Tests confirm a re-invite reuses the existing record with a new deadline
      and names the earlier stub in `inReplyTo`, a re-invite to a participant
      at `RM.CLOSED` is refused, and the Case Owner's `Accept(Offer(CaseParticipant))`
      naming a participant that has joined or is at `RM.CLOSED` is refused with
      no ledger entry committed.
    adr:
    - ADR-0114
    - ADR-0085
    stories:
    - story_2022_052
  - id: CM-11-016
    priority: MUST
    kind: protocol
    statement: >-
      When the active embargo is activated, revised or terminated while a stub
      Invite is outstanding, the CASE_MANAGER MUST re-issue the stub Invite on
      the same participant record with the current embargo terms and a new
      deadline, and the replacement MUST name the Invite it supersedes by
      setting its `inReplyTo` to that Invite's id. The
      CASE_MANAGER MUST refuse an `Accept` of a superseded stub Invite, naming
      the replacement in the refusal, and MUST honour a `Reject` of it.
    rationale: >-
      Accepting a stub consents to the terms it carried. Accepting stale terms
      would make the participant join already lapsed, or join without
      consent, and need a second answer at once. Naming the superseded Invite
      tells the invitee the old one is dead in whichever order the two arrive;
      a retraction (`Undo`) was considered and rejected (ADR-0114). Declining to
      join does not depend on the terms.
    note: >-
      A revision proposal does not change the active embargo, so it re-issues no
      stub. An invitee with an outstanding stub receives the relayed embargo
      Invite like any non-closed participant (EP-09-002); answering it records
      consent to the proposed terms and does not join the case, which only an
      `Accept` of the stub does. If the revision is activated, this requirement
      re-issues the stub.
    verification: >-
      A test changes the active embargo while a stub Invite is outstanding and
      finds a replacement stub Invite naming the superseded one, an `Accept` of
      the superseded Invite refused with the replacement named, and a `Reject`
      of it honoured.
    adr:
    - ADR-0114
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-11-017
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on a reply to a stub Invite only when the sender is the
      invitee of a stub Invite it sent and recorded, and MUST take the participant's roles
      from that recorded Invite, never from the copy of the Invite embedded in the reply.
      A reply from any other sender MUST be refused with no participant created or changed.
    rationale: >-
      Today the Accept handler admits whichever actor the embedded Invite names, with the
      roles that copy carries, without looking for an Invite in the store; any actor can
      therefore admit itself or a third party as, say, a VENDOR and then receive the case
      and its full ledger. See #3733.
    verification: >-
      A test marked `CM-11-017`
      sends an Accept of a stub Invite the CASE_MANAGER never sent and asserts `REFUSED`
      with no participant created.
    stories:
    - story_2022_035
    - story_2022_054
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-11-001
    adr:
    - ADR-0115
  - id: CM-11-018
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives `Reject(Invite(Actor,
      VulnerabilityCaseStub))` and holds no participant record for the invitee,
      it MUST refuse the reject with a reported reason. A Reject whose invitee
      has no recorded participant MUST NOT succeed as a silent no-op.
    rationale: >-
      The participant record created at invite-send time (CM-11-006) is the
      evidence that the CASE_MANAGER sent the stub Invite. A Reject with no
      matching record is either a protocol violation (the CASE_MANAGER never
      sent the Invite) or a replay of a Reject already processed to
      RM.CLOSED; both cases are erroneous and must be reported, not silently
      accepted. Accepting them would hide inconsistencies in the CASE_MANAGER's
      own audit trail.
    verification: >-
      A test marked `CM-11-018` delivers a Reject to the CASE_MANAGER when no
      inert participant record for the invitee exists, and asserts
      `REFUSED` with a reason naming the missing participant record.
    stories:
    - story_2022_052
    relationships:
    - rel_type: refines
      spec_id: CM-11-007
    adr:
    - ADR-0114
  - id: CM-11-021
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives `Accept(Invite(Actor,
      VulnerabilityCaseStub))` and holds no participant record for the invitee,
      it MUST refuse the accept with a reported reason, and MUST NOT create a
      participant record, commit a ledger entry or send any activity. An
      Accept never creates a participant: the record exists from the stub
      Invite (CM-11-006).
    rationale: >-
      The participant record created at invite-send time (CM-11-006) is the
      evidence that the CASE_MANAGER sent the stub Invite, and CM-11-017 ties
      every reply to a recorded Invite. An Accept that finds no record would
      otherwise rebuild one on acceptance, which is the old join model
      (participant created on `Accept(Invite)`) and would admit an actor whose
      Invite the CASE_MANAGER's roster no longer vouches for. This is the
      Accept counterpart of CM-11-018.
    verification: >-
      A test marked `CM-11-021` delivers an Accept of a recorded stub Invite to
      the CASE_MANAGER when no participant record for the invitee exists, and
      asserts `REFUSED` with a reason naming the missing participant record,
      no participant created, no ledger entry committed and nothing queued.
    stories:
    - story_2022_052
    relationships:
    - rel_type: refines
      spec_id: CM-11-017
    - rel_type: refines
      spec_id: CM-11-001
    adr:
    - ADR-0114
  - id: CM-11-019
    priority: MUST
    kind: protocol
    statement: >-
      A stub Invite MUST carry at least one CVD role for the invitee. The
      CASE_MANAGER MUST refuse to emit a stub Invite with an empty role list
      and MUST NOT create a participant record with an empty `case_roles` list.
      The CASE_MANAGER MUST NOT substitute a default role (such as VENDOR)
      when the inviter provides no roles. This applies to the case owner's own
      stub Invite, where the owner names the roles and no role is guessed; the
      default role list for a suggested actor is a separate flow (CM-16-003).
    rationale: >-
      A participant with no roles cannot be routed to the right recipients or
      granted the right access. Defaulting to VENDOR would silently assign a
      role the inviter never requested, violating the inviter's intent.
      Refusing at send time catches missing roles before the Invite is
      delivered, keeping the error close to its source.
    verification: >-
      A test marked `CM-11-019` asks the CASE_MANAGER to emit a stub Invite
      with no roles and asserts a refusal, with no participant record created
      and no Invite emitted.
    stories:
    - story_2022_052
    relationships:
    - rel_type: refines
      spec_id: CM-11-006
    adr:
    - ADR-0114
  - id: CM-11-020
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant that joined a case through an Invite MUST NOT send
      `Accept`, `TentativeReject` or `Reject` of the original
      `Offer(VulnerabilityReport)`, and MUST NOT run `validate-report`,
      `invalidate-report` or `reject-report` for the case's report. It was never
      offered that report; it judges the case by replying to the full-case
      Invite (CM-11-011).
    rationale: >-
      A reply must answer a message sent to the replier. And a joined
      participant — a late joiner especially — judges the case as it stands,
      with its history, not the original submission, which may have been far
      sparser (ADR-0121).
    verification: A test confirms a joined participant's triage emits no
      activity whose object is the original `Offer(VulnerabilityReport)`.
    adr:
    - ADR-0121
- id: CM-12
  title: Case Creation Timing
  specs:
  - id: CM-12-001
    priority: MUST
    kind: protocol
    statement: A `VulnerabilityCase` MUST be created when an `Offer(Report)` activity is received by the vendor actor
    verification: Integration tests in `test/demo/` confirm that receiving an `Offer(Report)`
      activity causes a `VulnerabilityCase` to be created.
    note: >-
      Superseded by CM-22-001 (ADR-0041): the vendor actor MUST NOT create the
      `VulnerabilityCase` directly.  The vendor stores the report and waits for
      `Create(VulnerabilityCase)` from the CASE_MANAGER.  CM-12-001 applies only in
      single-actor deployments where the vendor IS the CASE_MANAGER.
    relationships:
    - rel_type: supersedes
      spec_id: CM-22-001
      note: CM-22-001 (ADR-0041) is the authoritative replacement for multi-actor deployments
    stories:
    - story_2022_012
    - story_2022_038
  - id: CM-12-002
    priority: MUST
    kind: protocol
    statement: At case creation, the system MUST create two initial `CaseParticipant` records in the order defined by CM-14-001
    verification: Integration tests in `test/demo/` confirm that case creation produces exactly
      two initial `CaseParticipant` records ordered as defined by CM-14-001.
    relationships:
    - rel_type: depends_on
      spec_id: CM-03-001
    - rel_type: depends_on
      spec_id: CM-02-008
    - rel_type: part_of
      spec_id: CM-14-001
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-12-003
    priority: MUST
    kind: protocol
    statement: When a case is created from an `Offer(Report)`, the case owner MUST queue a `Create(Case)` activity to notify
      the reporter that a case has been opened
    verification: Integration tests in `test/demo/` confirm that a `Create(Case)` activity is
      queued for the reporter when a case is created from an `Offer(Report)`.
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    stories:
    - story_2022_012
    - story_2022_081
  - id: CM-12-004
    priority: MUST
    kind: protocol
    statement: A default embargo MUST be initialized at case creation (RM.RECEIVED) following the
      sequence in CM-14-001 whenever the case is embargo-eligible — from the receiver's actor
      default where one is configured, and otherwise from the protocol default of EP-04-005
    note: >-
      Amended by ADR-0096. The condition was previously "if a default embargo policy is
      configured", which left no embargo at all when none was. EP-04-005 now supplies a bounded
      protocol default for that case, so the only condition on initialization is
      embargo-eligibility (EP-04-008).
    verification: Integration tests in `test/demo/` confirm that a default embargo is initialized
      during case creation at RM.RECEIVED both when an actor default embargo policy is configured
      and when none is, and that no embargo is initialized when the case is not embargo-eligible.
    relationships:
    - rel_type: refines
      spec_id: DUR-07-002
      note: which now applies at case receipt
    - rel_type: part_of
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-12-005
    priority: MUST
    kind: project
    statement: '`InvalidateReportReceivedUseCase`, `CloseReportReceivedUseCase`, and `ValidateReportReceivedUseCase` MUST
      dereference the incoming report ID to the associated case ID before delegating to the corresponding case-level use case'
    verification: Inspection of `vultron/core/` confirms that `InvalidateReportReceivedUseCase`,
      `CloseReportReceivedUseCase`, and `ValidateReportReceivedUseCase` each resolve the report
      ID to its associated case ID before delegating.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
- id: CM-13
  title: Embargo Acceptance Ownership
  specs:
  - id: CM-13-005
    priority: MUST
    kind: protocol
    statement: 'Embargo accept/reject handlers MUST be idempotent: if the participant''s consent row for the embargo is already `ACCEPTED` (for accept) or `DECLINED` (for reject), the handler MUST succeed silently without re-running state machine transitions
      or emitting invalid-transition warnings'
    verification: A unit test confirms that a repeated embargo accept on an already-`ACCEPTED` consent row returns success without re-running state machine transitions or emitting
      invalid-transition warnings.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-006
    priority: MUST
    kind: project
    statement: When a case is created with a default embargo that reaches `EM.ACTIVE` at creation time, the case owner MUST
      be initialized as a `SIGNATORY` in the same BT node or an immediately following sibling node in the same BT subtree
    rationale: The case creator is the case owner by default; seeding them as a signatory prevents the case owner from being
      locked out of their own active embargo until a separate accept step occurs. The consent state must be set via the PEC
      state machine (not by direct field assignment) to preserve state machine invariants.
    verification: Integration tests in `test/demo/` confirm that when a case is created with a
      default embargo, the case owner's consent row for it is marked `ACCEPTED` in the same BT
      subtree that activates the embargo.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-004
  - id: CM-13-007
    priority: MUST
    kind: protocol
    statement: Note attachment idempotency MUST be checked by testing whether the note's `id_` is present in `VulnerabilityCase.notes`,
      NOT by testing whether the note object exists in the DataLayer
    rationale: A note may be stored in the DataLayer by one path and never attached to `case.notes` by another path. Checking
      DataLayer existence produces false idempotency.
    verification: A unit test confirms that note idempotency is checked by testing `note.id_` in
      `VulnerabilityCase.notes`, not by querying the DataLayer for the note object's existence.
    lint_suppress:
    - missing_story_reference
- id: CM-14
  title: Case Initialization Sequence
  description: Defines the canonical ordered sequence of initialization steps that MUST occur when a VulnerabilityCase is
    created at Offer(Report) receipt (CM-12-001). All steps MUST complete before the case is considered fully initialized.
  specs:
  - id: CM-14-001
    priority: MUST
    kind: protocol
    statement: >-
      The case initialization sequence MUST execute exactly 6 ordered steps
      (CM-14-008 through CM-14-013) before the case is considered fully initialized.
      No step may be omitted or reordered.
    rationale: Step CM-14-009 precedes CM-14-010 so that the embargo is always created by a participant (the case owner). The
      Create(Case) notification in CM-14-011 is flushed before the reporter is added in CM-14-012 so the reporter's system
      receives the case object before any subsequent Announce(CaseLedgerEntry) fan-out that references it.
    verification: Integration tests in `test/demo/` confirm that the case initialization
      sequence completes exactly 6 ordered steps (CM-14-008 through CM-14-013) and that no step
      is skipped or reordered.
    note: >-
      Superseded by CM-22 (ADR-0041) for multi-actor deployments: in the
      CASE_MANAGER-authoritative model the `VulnerabilityCase` is created by the
      CASE_MANAGER rather than the receiving actor; the receiving actor remains
      the case's `attributed_to` (CM-14-008, CP-09-001).  CM-14-001 applies only in
      single-actor deployments where the receiving actor IS the CASE_MANAGER.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
    - rel_type: refines
      spec_id: CM-12-002
    - rel_type: refines
      spec_id: CM-12-004
    - rel_type: supersedes
      spec_id: CM-22-001
      note: CM-22-001 (ADR-0041) moves case creation to the CASE_MANAGER for multi-actor deployments
    stories:
    - story_2022_012
    - story_2022_046
  - id: CM-14-002
    priority: MUST
    kind: protocol
    statement: The case-owner `CaseParticipant` MUST be created before the default embargo is initialized, so that the
      embargo is always associated with an existing participant
    rationale: An embargo without any participant lacks an owning actor. Creating the owner participant first ensures that
      the embargo is initialized in the context of an actor who can be responsible for it.
    verification: Inspection of `vultron/core/` confirms that the case-owner
      `CaseParticipant` creation step precedes the default embargo initialization step in the
      initialization sequence.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    stories:
    - story_2022_046
    - story_2022_014
  - id: CM-14-003
    priority: MUST
    kind: protocol
    statement: When the case initialization sequence creates a default embargo, the case owner MUST be seeded as `SIGNATORY`
      on that embargo immediately after the embargo reaches `EM.ACTIVE` state
    rationale: The case owner initiated the embargo by accepting the default policy on behalf of the case. Requiring a separate
      accept step would leave the case owner as a non-signatory on their own active embargo.
    verification: Integration tests in `test/demo/` confirm that the case owner is seeded as
      `SIGNATORY` on the default embargo immediately after it reaches `EM.ACTIVE` during case
      initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: refines
      spec_id: CM-13-006
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-14-004
    priority: MUST
    kind: protocol
    statement: The `Create(Case)` notification MUST be queued and the outbox flushed before the reporter is added as a `CaseParticipant`
      in step 5 of CM-14-001
    rationale: The reporter's system must receive and store the case object before any Announce(CaseLedgerEntry) fan-out that
      lists them as a participant. Reversing this order causes "case not found" errors on the reporter side when the log entry
      arrives referencing a case the reporter has not yet seen.
    verification: Integration tests in `test/demo/` confirm that the `Create(Case)` outbox flush
      occurs before the reporter `CaseParticipant` record is created during case
      initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-003
    stories:
    - story_2022_012
    - story_2022_081
  - id: CM-14-005
    priority: MUST
    kind: protocol
    statement: When the reporter is added as a `CaseParticipant` during case initialization, they MUST be seeded as `SIGNATORY`
      on any active embargo
    rationale: 'The reporter already possesses the vulnerability information before the case is created. Requiring an explicit
      embargo acceptance before sharing case content would create a paradoxical deadlock: the reporter has the information
      that the embargo is meant to protect, yet cannot receive case updates until they accept the embargo. Seeding them as
      SIGNATORY reflects their implicit consent, expressed by submitting the report.'
    verification: Integration tests in `test/demo/` confirm that the reporter is seeded as
      `SIGNATORY` on any active embargo when added as a `CaseParticipant` during case
      initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    stories:
    - story_2022_013
    - story_2022_023
  - id: CM-14-006
    priority: SHOULD
    kind: protocol
    statement: If the reporter included an embargo proposal with their `Offer(Report)`, the case initialization SHOULD reconcile
      the reporter's proposed duration against the CASE_OWNER's published embargo policy (its actor default, EP-04-003) and
      initialize the embargo at the shorter of the two durations
    note: >-
      EP-04-004 now specifies the mechanism: the reporter embeds a proposed `EmbargoEvent` in the
      `Offer(VulnerabilityReport)` activity. This requirement is therefore reachable, and the
      reconciliation it describes is the shortest-wins comparison of EP-04-003. Note that the
      protocol default of EP-04-005 is not a candidate in that comparison (EP-04-006). Amended by
      ADR-0096; see `notes/embargo-default-semantics.md` § "Resolved: Reporter Embargo Proposal
      Mechanism (EP-04-004)".
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-004
    - rel_type: depends_on
      spec_id: EP-04-004
    adr:
    - ADR-0096
  - id: CM-14-007
    priority: MUST
    kind: project
    statement: Additional participants MUST NOT be invited and embargo modifications MUST NOT be initiated until the case
      initialization sequence defined in CM-14-001 (including any applicable conditional steps) is complete
    rationale: 'The initialization sequence establishes the minimum valid case state: a case object, an owner, an optional
      embargo, and a reporter. Inviting third parties or modifying the embargo before this baseline is in place creates race
      conditions and protocol violations.'
    verification: Integration tests in `test/demo/` confirm that no Invite or embargo
      modification is emitted until all 6 initialization steps have completed.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
  - id: CM-14-008
    priority: MUST
    kind: protocol
    statement: >-
      Step 1 of the case initialization sequence MUST create the `VulnerabilityCase`
      with the receiving actor set as `attributed_to`.
    rationale: Creating the case object first establishes the anchor to which all subsequent
      initialization steps (participants, embargo, ledger) are attached.
    verification: Integration tests in `test/demo/` confirm that step 1 of case initialization
      creates the `VulnerabilityCase` with `attributed_to` set to the receiving actor.
    stories:
    - story_2022_012
  - id: CM-14-009
    priority: MUST
    kind: protocol
    statement: >-
      Step 2 of the case initialization sequence MUST create the case-owner
      `CaseParticipant` with `RM.RECEIVED` and `CVDRole.CASE_OWNER`.
    rationale: The case-owner participant must exist before the default embargo can be
      initialized, so that the embargo is always associated with an existing participant.
    verification: Integration tests in `test/demo/` confirm that step 2 creates the case-owner
      `CaseParticipant` with `RM.RECEIVED` and `CVDRole.CASE_OWNER`.
    stories:
    - story_2022_046
  - id: CM-14-010
    priority: MUST
    kind: protocol
    statement: >-
      Step 3 of the case initialization sequence MUST initialize the default embargo to
      `EM.ACTIVE` and seed the case owner as `SIGNATORY` whenever the case is embargo-eligible,
      using the actor default where one is configured and the EP-04-005 protocol default
      otherwise.
    rationale: The embargo must be in place before any participant other than the case owner is
      added, so that all subsequent participants are subject to the embargo from the moment they
      join.
    note: >-
      Amended by ADR-0096. The step was previously conditional on a configured default embargo
      policy; EP-04-005 now supplies a bounded protocol default when none is configured, so the
      only condition is embargo-eligibility (EP-04-008).
    verification: Integration tests in `test/demo/` confirm that step 3 sets the default embargo
      to `EM.ACTIVE` and seeds the case owner as `SIGNATORY` both when an actor default policy is
      configured and when none is, and that it is skipped when the case is not embargo-eligible.
    relationships:
    - rel_type: depends_on
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-14-011
    priority: MUST
    kind: protocol
    statement: >-
      Step 4 of the case initialization sequence MUST queue a `Create(Case)` activity
      addressed to the reporter and flush the outbox.
    rationale: The reporter's system must receive and store the case object before any
      Announce(CaseLedgerEntry) fan-out that references it.
    verification: Integration tests in `test/demo/` confirm that step 4 queues `Create(Case)`
      addressed to the reporter and flushes the outbox.
    stories:
    - story_2022_012
    - story_2022_038
  - id: CM-14-012
    priority: MUST
    kind: protocol
    statement: >-
      Step 5 of the case initialization sequence MUST add the reporter as a
      `CaseParticipant` with `RM.ACCEPTED` and `CVDRole.FINDER`/`REPORTER`, and seed
      them as `SIGNATORY` on any active embargo.
    rationale: The reporter is added after the Create(Case) notification is flushed
      (CM-14-011) so that the case object exists on the reporter's system before the
      fan-out of the ledger entry that records their participation.
    verification: Integration tests in `test/demo/` confirm that step 5 adds the reporter as a
      `CaseParticipant` with `RM.ACCEPTED` and seeds them as `SIGNATORY` on any active
      embargo.
    stories:
    - story_2022_013
    - story_2022_063
  - id: CM-14-013
    priority: MUST
    kind: protocol
    statement: >-
      Step 6 of the case initialization sequence MUST commit a case ledger entry,
      triggering `Announce(CaseLedgerEntry)` fan-out to all participants.
    rationale: The ledger entry commits the completed initialization as a single
      protocol-significant event and notifies all participants atomically.
    verification: Integration tests in `test/demo/` confirm that step 6 commits a case ledger
      entry that triggers `Announce(CaseLedgerEntry)` fan-out to all participants.
    stories:
    - story_2022_045
    - story_2022_041
- id: CM-15
  title: Case Creation Policy
  description: Requirements for the configurable auto_create_case policy on ActorConfig, which controls whether a VulnerabilityCase
    is created automatically upon receipt of an Offer(Report).
  specs:
  - id: CM-15-001
    priority: MUST
    kind: project
    statement: 'ActorConfig MUST expose an `auto_create_case` boolean field with a default value of `True`.'
    rationale: Receivers that follow the Option 3 protocol path (send Read(Offer(Report)) before deciding to accept or reject)
      require the ability to delay case creation. The default (True) preserves the original ADR-0015 Option 4 "always create
      at RM.RECEIVED" behavior for all existing actors and demos.
    verification: Inspection of `vultron/core/` confirms that `ActorConfig` declares an
      `auto_create_case` boolean field defaulting to `True`.
    relationships:
    - rel_type: refines
      spec_id: CM-12-001
    adr:
    - ADR-0015
    - ADR-0041
  - id: CM-15-002
    priority: MUST
    kind: project
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(Report)` MUST store the `VulnerabilityReport` and the `Offer(Report)`
      activity in the DataLayer.
    rationale: The report materials must be persisted even when case creation is suppressed
      so that they can be retrieved if the operator later enables case creation or reviews
      the offer manually.
    verification: Integration tests in `test/demo/` confirm that when `auto_create_case` is
      `False`, processing an `Offer(Report)` persists the report and offer in the DataLayer
      without creating a `VulnerabilityCase`.
  - id: CM-15-003
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(Report)` MUST NOT create a `VulnerabilityCase`.
    rationale: The purpose of the flag is to suppress automatic case creation; creating a
      case anyway would make the flag meaningless.
  - id: CM-15-004
    priority: MUST
    kind: project
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(Report)` MUST leave the receiver's outbox unchanged (no outbound activities
      are enqueued).
    rationale: Suppressing case creation also suppresses the associated outbound activities
      (e.g., Create(Case) to the reporter); the observable outcome is no outbound messages.
    verification: Integration tests in `test/demo/` confirm that when `auto_create_case` is
      `False`, processing an `Offer(Report)` leaves the actor's outbox empty.
  - id: CM-15-005
    priority: MUST
    kind: project
    statement: >-
      The `auto_create_case` gate MUST be enforced as an in-tree condition node in
      `create_receive_report_case_tree`, after the intake node and ahead of any
      case-creating effect. A routing-level short-circuit in
      `SubmitReportReceivedUseCase` is not a conforming enforcement location, because
      it stores the report and the `Offer(Report)` before any tree runs (CLP-10-019).
      The observable outcome (no case, no outbound activities; report and Offer
      stored per CM-15-002) remains normative.
    rationale: Case creation is protocol-significant behavior (BT-15-001), so the gate
      lives in the behavior tree as a condition node. This requirement previously
      allowed a use-case short-circuit as an equivalent optimization; ADR-0111 retired
      that option because the short-circuit had to store the report and Offer itself,
      which is the store path CLP-10-019 forbids. The intake node now stores them for
      every inbound `Offer(Report)`, so the gate has nothing left to do outside the
      tree (#3872).
    verification: A received-side handler test posts an `Offer(Report)` to a receiver
      with `auto_create_case=False`, asserts the disposition is SKIPPED, that no case
      and no outbound activity exist, and that the report and the Offer are readable
      from the receiver's DataLayer. The mutation ratchet
      `test/architecture/test_no_dl_mutations_in_execute.py` (CLP-10-020) fails if
      `SubmitReportReceivedUseCase.execute()` reaches a store helper.
    adr:
    - ADR-0111
- id: CM-16
  title: Actor Suggestion Routing (Recommend-Actor Flow)
  specs:
  - id: CM-16-001
    priority: MUST
    kind: protocol
    statement: A participant wishing to suggest that another actor be invited to the case MUST send `Offer(object=Actor, target=Case)`
      to the CASE_MANAGER's inbox, not directly to the Case Owner's inbox.
    rationale: All case-scoped protocol messages MUST route through the CASE_MANAGER so the event can be recorded in the canonical
      case ledger before any downstream action is taken (ADR-0021, PCR-08-001).
    verification: Integration tests in `test/demo/` confirm that an actor-suggestion
      `Offer(object=Actor, target=Case)` is sent to the CASE_MANAGER's inbox, not directly to the
      Case Owner.
    relationships:
    - rel_type: implements
      spec_id: PCR-08-001
    adr:
    - ADR-0021
    stories:
    - story_2022_053
    - story_2022_052
  - id: CM-16-002
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives `Offer(object=Actor, target=Case)`, it MUST commit
      a `CaseLedgerEntry` for the received Offer and fan out the entry to every active
      participant (CM-10-004) BEFORE taking any downstream action.
    rationale: Ledger entries record events that have already occurred; pre-committing a decision before communicating it
      is not permitted (CLP-10-006 commit ordering).
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER commits a
      `CaseLedgerEntry` and fans it out to participants before taking any downstream action on a
      received `Offer(Actor)`.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
    adr:
    - ADR-0114
    stories:
    - story_2022_045
    - story_2022_053
  - id: CM-16-003
    priority: MUST
    kind: project
    statement: >-
      After recording the received `Offer(Actor)`, the CASE_MANAGER MUST assign a non-empty
      default role list for the suggested actor via an Evaluator BT node (ADR-0024 shape:
      Evaluator). This applies to a suggested actor, where the CASE_MANAGER chooses the
      roles through its policy hook; the case owner's own stub Invite names its roles and
      guesses none (CM-11-019).
    verification: Inspection of `vultron/core/` confirms that an Evaluator BT node assigns a
      non-empty default role list for a suggested actor before the downstream consumer node
      processes the offer.
    note: 'The Evaluator node is a call-out point (ADR-0025 abstraction; ADR-0024 shape: Evaluator) that MAY be replaced by
      a more sophisticated role-inference implementation in future. The non-empty invariant is enforced at write time so the
      downstream consumer never needs to treat an empty list as a sentinel. See CM-16-011 and CM-16-012 for the recommended
      and permitted default values.'
  - id: CM-16-011
    priority: SHOULD
    kind: protocol
    statement: The default role list SHOULD be `[CVDRole.VENDOR]` for actors whose type cannot be determined from context,
      because in CVD cases the most likely role for a newly added participant is Vendor.
  - id: CM-16-012
    priority: MAY
    kind: protocol
    statement: The default role list MAY be `[CVDRole.OBSERVER]` when the Evaluator can determine that the suggested actor
      does not fit any known CVD role but still requires case membership (e.g., a security researcher with no vendor
      affiliation). `CVDRole.OBSERVER` is the most conservative choice because it makes no assumption about the actor's
      function in the CVD process beyond case observation (CM-25-001).
  - id: CM-16-013
    priority: MAY
    kind: protocol
    statement: The Evaluator's default role assignment MAY be overridden by actor-level configuration (e.g., a policy that
      maps known actor URIs to specific roles) or by the Case Owner at accept time when the Case Owner selects different roles
      for the suggested participant.
    rationale: The Case Owner has ultimate authority over who participates in their case and in what role. The Evaluator's
      output is a suggested starting point to reduce friction, not a binding decision. The Case Owner can always update role
      assignments to whatever they determine is appropriate.
  - id: CM-16-004
    priority: MUST
    kind: protocol
    statement: The CASE_MANAGER MUST transform the received `Offer(Actor)` into `Offer(object=CaseParticipant{attributed_to=actor,
      case_roles=roles}, target=Case)` and send it to the Case Owner's inbox, with `origin` set to the ID of the original
      recommender's Offer activity.
    rationale: The Case Owner makes a membership decision about a CaseParticipant (actor + roles), not about a bare Actor
      identity. The `origin` field preserves the causal chain without a side-channel data store.
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER sends a
      transformed `Offer(object=CaseParticipant, target=Case)` to the Case Owner with `origin`
      set to the recommender's Offer ID.
    stories:
    - story_2022_053
    - story_2022_046
  - id: CM-16-005
    priority: MAY
    kind: protocol
    statement: The recommender's `Offer(Actor)` MAY include a `content` or `summary` field explaining why the actor is being
      suggested. The CASE_MANAGER SHOULD forward this text as the `content` of the transformed `Offer(CaseParticipant)` it sends
      to the Case Owner.
  - id: CM-16-006
    priority: MUST
    kind: protocol
    statement: >-
      After receiving `Accept(Offer(CaseParticipant))` from the Case Owner, the
      CASE_MANAGER MUST (1) commit a ledger entry for the Accept, (2) fan out the ledger
      entry, (3) send `AcceptActorRecommendation` to the original recommender with
      `in_reply_to` set to the ID of the original recommender's `Offer` activity, and
      (4) send the stub Invite (`Invite(Actor, VulnerabilityCaseStub)`, CM-11-013) to
      the suggested actor per CM-17. It MUST refuse the Accept, with a reported
      reason and before it commits or sends anything, when the suggested actor
      has already joined or is at `RM.CLOSED` (CM-11-015).
    verification: Integration tests in `test/demo/` confirm that after the Case Owner accepts a
      participant recommendation, the CASE_MANAGER commits a ledger entry, fans it out, sends
      `AcceptActorRecommendation`, and sends `Invite` to the suggested actor. Tests marked
      `CM-16-006` in `test/core/use_cases/received/actor/test_offer_case_participant.py` confirm
      that an Accept naming an actor that has joined, or is at `RM.CLOSED`, is refused with
      nothing committed or sent.
    relationships:
    - rel_type: implements
      spec_id: CM-17-001
    adr:
    - ADR-0114
    stories:
    - story_2022_054
    - story_2022_052
  - id: CM-16-007
    priority: MUST
    kind: protocol
    statement: After receiving `Reject(Offer(CaseParticipant))` from the Case Owner, the CASE_MANAGER MUST (1) commit a ledger
      entry for the Reject, (2) fan out the ledger entry, and (3) send `RejectActorRecommendation` to the original recommender
      with `in_reply_to` set to the ID of the original recommender's `Offer` activity.
    verification: Integration tests in `test/demo/` confirm that after the Case Owner rejects a
      participant recommendation, the CASE_MANAGER commits a ledger entry, fans it out, and sends
      `RejectActorRecommendation` to the recommender.
    stories:
    - story_2022_054
  - id: CM-16-008
    priority: MUST
    kind: protocol
    statement: >-
      When a second `Offer(Actor X, Case)` arrives while a pending decision for Actor X is
      still outstanding (no Accept or Reject yet received from the Case Owner), the CASE_MANAGER
      MUST record the duplicate recommendation in the ledger.
    verification: Integration tests in `test/demo/` confirm that a duplicate `Offer(Actor X,
      Case)` arriving while a prior decision is pending is recorded in the case ledger.
    stories:
    - story_2022_053
    - story_2022_045
  - id: CM-16-009
    priority: MUST
    kind: protocol
    statement: When a second `Offer(Actor X, Case)` arrives after an Invite has already been sent to Actor X (i.e., the invite
      is in-flight or the actor is already a participant), the CASE_MANAGER MUST record the recommendation in the ledger, fan
      out the entry, and auto-send `AcceptActorRecommendation` (with `in_reply_to` = original recommender's Offer ID) back
      to the second recommender. The CASE_MANAGER MUST NOT send a duplicate Invite to Actor X.
    verification: Integration tests in `test/demo/` confirm that when Actor X is already invited
      or a participant, a second `Offer(Actor X)` is recorded, `AcceptActorRecommendation` is
      sent to the second recommender, and no duplicate Invite is sent.
    stories:
    - story_2022_013
    - story_2022_053
  - id: CM-16-010
    priority: MUST
    kind: project
    statement: In every step of the actor suggestion flow, the CASE_MANAGER MUST commit the ledger entry for a protocol event
      AFTER the corresponding message has been sent or received, never before.
    rationale: Pre-announcing a decision in the ledger before communicating the decision creates a window where the ledger
      shows an effect without its cause.
    verification: Integration tests in `test/demo/` confirm that ledger entries in the actor
      suggestion flow are committed only after the corresponding message has been sent or
      received, never before.
  - id: CM-16-014
    priority: MUST
    kind: project
    statement: >-
      The Evaluator BT node assigned to default role list assignment MUST return `FAILURE`
      if it cannot produce a non-empty role list.
    rationale: A FAILURE return forces the enclosing BT subtree to handle the empty-list
      case explicitly rather than propagating an empty list to downstream consumers.
    verification: Inspection of `vultron/core/` confirms that the Evaluator BT node for default
      role assignment returns `FAILURE` when it cannot produce a non-empty role list.
  - id: CM-16-015
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      The downstream consumer node of the Evaluator BT node MUST NOT silently substitute a
      default for an empty list written by the Evaluator (ADR-0032 BT-HELPER-01).
    rationale: Silent substitution by the consumer hides Evaluator failures and produces
      participants with unexpected role assignments.
  - id: CM-16-016
    priority: MUST
    kind: protocol
    statement: >-
      When a second `Offer(Actor X, Case)` arrives while a pending decision for Actor X is
      still outstanding, the CASE_MANAGER MUST send a `Note` to the Case Owner's inbox
      indicating that a reinforcing suggestion was received, including the second
      recommender's identity and any `content` from the Offer.
    rationale: Notifying the Case Owner of reinforcing suggestions provides additional
      context for the pending decision without creating a duplicate offer workflow.
    verification: Integration tests in `test/demo/` confirm that a duplicate `Offer(Actor X,
      Case)` with a pending decision causes the CASE_MANAGER to send a `Note` to the Case Owner
      naming the second recommender.
    stories:
    - story_2022_053
    - story_2022_046
  - id: CM-16-017
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      When a second `Offer(Actor X, Case)` arrives while a pending decision for Actor X is
      still outstanding, the CASE_MANAGER MUST NOT send a second transformed
      `Offer(CaseParticipant)` to the Case Owner.
    rationale: Sending a duplicate transformed Offer would create a second pending decision
      for the same actor, leading to conflicting state if the Case Owner responds to both.
  - id: CM-16-018
    priority: MUST
    kind: project
    statement: >-
      When the CASE_MANAGER processes `Accept(Offer(CaseParticipant))` from the Case
      Owner, the roles assigned to the new participant MUST be read from the stored
      outgoing `Offer(CaseParticipant)` that the CASE_MANAGER constructed and sent —
      not from the embedded `CaseParticipant` object inside the received `Accept`.
    rationale: >-
      The received `Accept` is untrusted: the accepting actor may have modified or
      omitted roles, or sent only a bare ID reference. Reading roles from the
      received `Accept` would allow a malicious or minimally-conformant acceptor to
      substitute unauthorized roles. The stored `Offer` is the CASE_MANAGER's own
      record of the intended participant roles and is the authoritative source of
      truth.
    verification: >-
      Inspection of
      `vultron/core/use_cases/received/actor/offer_case_participant.py`
      (`AcceptOfferCaseParticipantReceivedUseCase.execute()`) confirms that roles
      are read from the DataLayer-stored Offer activity (`self._dl.read(offer_id)`),
      not from the embedded `CaseParticipant` in the received `Accept`.
    adr:
    - ADR-0026
    relationships:
    - rel_type: refines
      spec_id: CM-16-006
  - id: CM-16-019
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on `Accept(Offer(CaseParticipant))` or
      `Reject(Offer(CaseParticipant))` only when the sender is the case's Case Owner, and
      MUST take the actor to invite from the `Offer(CaseParticipant)` it recorded, never
      from the reply. A reply from any other sender MUST be refused, and the CASE_MANAGER
      MUST NOT invite anyone or notify the recommender.
    rationale: >-
      The Case Owner decides on a recommendation (CM-16-006), but the handler checks only
      that the recommendation was recorded, and reads the invitee from the inbound message;
      anyone who learns a recommendation id can accept it and choose who is invited. See
      #3733.
    verification: >-
      A test marked `CM-16-019`
      sends the Accept from a participant that is not the Case Owner and asserts `REFUSED`
      with an empty outbox.
    stories:
    - story_2022_035
    - story_2022_054
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-16-006
    adr:
    - ADR-0115
- id: CM-17
  title: Invitation Flow — Enrichment and Roles
  specs:
  - id: CM-17-001
    priority: MUST
    kind: protocol
    statement: >-
      The stub Invite sent by the CASE_MANAGER to a new actor MUST be
      `Invite(object=Actor, target=VulnerabilityCaseStub)`, with the stub shaped as
      CM-11-013 requires. This requirement is extended by CM-17-002 and CM-17-003.
    verification: >-
      Integration tests in `test/demo/` confirm that the stub Invite emitted by the
      CASE_MANAGER names the invitee as its `object` and carries a
      `VulnerabilityCaseStub` as its `target`.
    adr:
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_054
  - id: CM-17-002
    priority: MUST
    kind: protocol
    statement: When `CaseStatus.em_state == ACTIVE` at the time the Invite is sent, the case stub MUST include at minimum
      the `activeEmbargo` reference (ID + `end_time`) and the embedded `CaseStatus.em_state` field so the invitee can give
      informed consent before accepting.
    rationale: 'The invite-accept cycle is the only consent signal for late-joining participants when an active embargo already
      exists. Accepting without seeing embargo terms is not meaningfully informed consent (issue #1289, MV-10-006).'
    verification: Integration tests in `test/demo/` confirm that when `CaseStatus.em_state ==
      ACTIVE` at invite time, the case stub includes the `activeEmbargo` reference and embedded
      `em_state` field.
    relationships:
    - rel_type: implements
      spec_id: MV-10-006
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-17-003
    priority: MUST
    kind: project
    statement: >-
      The `Invite` activity MUST embed the intended `case_roles: list[CVDRole]` for the
      invitee so that `EmitInviteActorToCaseNode` can include them in the wire activity.
    rationale: >-
      All invited participants getting `caseRoles=[]` is a protocol defect (issue
      #1288). The participant record created with the stub Invite (CM-11-006) MUST
      reflect the roles the Case Owner intended, whether those roles arrived via a
      direct trigger request or via the suggest-actor round-trip.
    verification: Integration tests in `test/demo/` confirm that the `Invite` activity emitted
      for a new participant embeds a non-empty `case_roles` list for the invitee.
    adr:
    - ADR-0114
  - id: CM-17-004
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives `Accept(Invite(Actor, VulnerabilityCaseStub))` from
      an invitee, it MUST, in this order: (1) commit a ledger entry for the Accept and
      fan it out to every active participant (CM-10-004); (2) record the Accept's effect
      on the participant (CM-11-001); (3) when the participant is now active, send it
      `Announce(VulnerabilityCase)` and replay all prior `CaseLedgerEntry` records to it
      in log-index order (CM-11-008); and (4) send it the full-case Invite (CM-11-010).
    verification: >-
      Integration tests in `test/demo/` confirm that `Accept(Invite(Actor,
      VulnerabilityCaseStub))` triggers the CASE_MANAGER's sequence in order: ledger
      commit and fan-out, the CM-11-001 record update, full case snapshot and ledger
      replay, and the full-case Invite.
    adr:
    - ADR-0114
    - ADR-0121
    relationships:
    - rel_type: implements
      spec_id: CM-11-001
    - rel_type: implements
      spec_id: CM-11-008
    - rel_type: implements
      spec_id: CM-11-010
    - rel_type: implements
      spec_id: PCR-08-010
    stories:
    - story_2022_054
    - story_2022_052
    - story_2022_088
  - id: CM-17-005
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      Presence in the case participant list MUST NOT be treated as acceptance of the
      invitation or as entitlement to case content. An invitee is in the list from the
      stub Invite onward (CM-11-006); only an active participant (CM-10-004) is entitled
      to case content.
    rationale: >-
      The CASE_MANAGER tracks every invitee from the moment it is invited, including one
      that declines, so the participant list holds inert participants. Any consumer that
      reads membership as "accepted" would hand case content to an actor that has not
      consented.
    adr:
    - ADR-0114
  - id: CM-17-006
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST commit exactly one `CaseLedgerEntry` for an emitted `Invite`
      activity, in the tree that emits it, after the Invite activity has been constructed and
      before it is appended to the outbox. The Invite MUST NOT be addressed to the CASE_MANAGER
      itself, and no received-side path MUST commit a second entry for it.
    rationale: >-
      Build, commit, then enqueue is the order `vultron/core/behaviors/case/AGENTS.md` enforces
      for every emit that also commits: a commit that fails after the outbox write orphans an
      activity queued for delivery with no ledger entry, and the next duplicate check then takes
      the fresh path (ISSUE-1325). An earlier wording required the commit to follow the queueing;
      the code never did that, and the loopback copy that wording assumed committed the same
      Invite a second time (#2996, ADR-0109).
    verification: >-
      `test/core/behaviors/case/nodes/test_actor_and_announce_nodes.py` asserts the emit node
      commits before it appends to the outbox and sets no `cc`; the case-ledger invariant harness
      asserts a single entry per Invite activity id (CLP-07-002).
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
    adr:
    - ADR-0109
  - id: CM-17-007
    priority: MUST
    kind: project
    statement: >-
      In the direct-trigger path (the Case Owner calls `invite-actor-to-case` with a
      `roles` list), `SvcInviteActorToCaseUseCase` MUST send the Case Owner's own
      recommend-actor `Offer(Actor, Case)` carrying that `roles` list as its suggested
      roles to the CASE_MANAGER, from the Case
      Owner's identity and outbox. It MUST NOT execute the invite tree locally as the
      CASE_MANAGER. The CASE_MANAGER's recommend-actor received tree MUST, when the
      recommender holds `CVDRole.CASE_OWNER` for the case, emit the `Invite` directly with the
      offered roles instead of forwarding the Offer to the Case Owner (CM-16-003, CM-16-004),
      and the emit MUST carry those roles so that `caseRoles` is never empty (CM-17-003).
    rationale: >-
      The owner's direct invite is the recommend-actor flow with the recommender and the
      decider being the same participant, so it reuses that flow rather than adding a message
      type. This is one path for every topology: when the Case Owner's container also hosts the
      CASE_MANAGER the Offer loops back over HTTP (OX-12-001), and when it does not the Offer
      is the only way to reach the CASE_MANAGER without emitting in its name from a store that
      is not the ledger's home (ADR-0109). The former wording had the trigger write
      `suggested_roles` to the blackboard for a locally executed emit; the roles now travel in
      the Offer, and the CASE_MANAGER reads them from the received Offer it stored — the
      stored activity, not a value the trigger response carried, the same discipline
      CM-16-018 applies to the CASE_MANAGER's own outgoing Offer on `Accept`.
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py` asserts the trigger enqueues an
      `Offer(Actor, Case)` addressed to the CASE_MANAGER with the offered roles, from the
      owner's outbox only, and runs no tree as the CASE_MANAGER;
      `test/core/behaviors/case/test_suggest_actor_tree.py` asserts the CASE_OWNER branch sits
      behind the duplicate branches and ahead of the fresh path;
      `test/core/use_cases/received/actor/test_suggest.py` asserts the CASE_MANAGER emits the
      Invite with those roles, commits it, and does not forward the Offer; and
      `test/demo/test_remote_case_actor_invite.py` runs the flow on three containers and
      asserts the Invite is emitted and committed on the CASE_MANAGER's container with no `cc`.
    adr:
    - ADR-0109
  - id: CM-17-008
    priority: MUST
    kind: project
    statement: >-
      In the suggest-actor received path (the CASE_MANAGER receives
      `Accept(Offer(CaseParticipant))`), the invitee's `CaseParticipant.case_roles` MUST
      be populated when the CASE_MANAGER emits the stub Invite (CM-11-006), from the
      roles that Invite carries, originating from the Case Owner's Accept response
      (CM-16-006) or the CASE_MANAGER's default role assignment (CM-16-003).
    rationale: >-
      In this path `AcceptOfferCaseParticipantReceivedUseCase` does not write
      `suggested_roles`. The roles the Invite carries are the originally intended roles,
      and the participant record is born with the Invite.
    verification: >-
      Integration tests in `test/demo/` confirm that in the suggest-actor path the
      invitee's `CaseParticipant.case_roles` equals the roles on the emitted stub
      Invite.
    adr:
    - ADR-0114
  - id: CM-17-009
    priority: MUST
    kind: project
    statement: >-
      Any canonical `CaseLedgerEntry` the CASE_MANAGER commits while processing a stub
      Invite's `Accept` whose fan-out reaches the joining participant — every entry
      committed once that participant is active (CM-10-004) — MUST be committed after
      CM-17-004 step (3), the `Announce(VulnerabilityCase)` and the start of the ledger
      replay, so the participant's first ledger entries arrive after its case seed and
      in log-index order.
    rationale: >-
      CM-17-004 orders the announce and the replay with no fan-out to the joiner in
      between, but an entry committed during the same admission whose fan-out includes
      the newly active participant would otherwise reach it ahead of its case. The late
      joiner received a ledger entry before its case
      (SYNC-15 pre-genesis `Reject`, then a from-genesis replay that interleaved with
      the backfill): in the fcvcv scenario vendor2 received entry 19 one second before
      the case, and vendor-deployer received entries 26 and 0 before it (#2898).
      Committed last, the entry reaches the invitee as the next entry in chain order.
    verification: >-
      `test/core/use_cases/received/actor/test_invite.py::TestInviteActorUseCases::test_accept_invite_seeds_the_case_before_any_ledger_entry_reaches_the_invitee`
      asserts `Announce(VulnerabilityCase)` precedes every `Announce(CaseLedgerEntry)`
      addressed to the invitee, and `test_accept_invite_backfills_canonical_ledger_from_genesis`
      asserts the invitee receives entries 0, 1, 2, 3 in order;
      `test/core/behaviors/case/test_accept_invite_tree.py::test_case_announce_and_backfill_precede_the_add_participant_fanout`
      pins the effect order in the tree.
    relationships:
    - rel_type: refines
      spec_id: CM-17-004
    - rel_type: depends_on
      spec_id: SYNC-15-004
    adr:
    - ADR-0114
  - id: CM-17-010
    priority: MUST
    kind: protocol
    statement: >-
      A case stub that a sender emits MUST carry exactly its `id`, its `type`, the
      `caseId` naming the case it stands for (CM-11-013) and a non-empty `summary`
      (MV-10-001), plus, when an embargo is active, the embargo terms CM-17-002
      requires (`activeEmbargo` and `caseStatus.emState`). The sender chooses the
      `summary`: it MAY be the case name, or a deliberately less revealing string,
      and the sender MUST NOT assume the case name is safe to share with an invitee
      not yet bound by the embargo. The sender MUST NOT put any other case content
      in the stub, and MUST NOT name the case's coordinator or Case Owner in it: the
      Invite that carries it already identifies the inviter in its `actor` and
      `attributedTo`. This constrains what is sent; the JSON-LD `@context` is not
      content.
    rationale: >-
      An invitee is entitled to no case content yet (CM-10-004, CM-17-005). Informed
      consent needs the case's identity, a human-readable account of what it is asked to
      join, and the embargo terms (CM-17-002); the Invite envelope says who is asking.
      The case name can itself be an opsec concern, so the summary is chosen for the
      invitee, not copied from the case. #4165 implemented this. Whether the stub should
      name the coordinator and the Case Owner explicitly, for Invites relayed by a third
      party, is the open Idea #4184; until it is decided the rule above stands.
    verification: >-
      `test/wire/as2/factories/test_case_factories.py::test_rm_invite_stub_carries_a_non_empty_summary`
      asserts a stub projected from a full case serialises with only `id`, `type`,
      `caseId` and a non-empty `summary`; #4165 removed the strict-xfail marker when the
      factory was implemented.
      `test_rm_invite_stub_carries_no_case_content` and
      `test_enriched_stub_carries_only_the_embargo_terms` in the same file assert the
      stub carries no other case content, and that an embargo-active stub adds only
      `activeEmbargo` and `caseStatus`.
    relationships:
    - rel_type: refines
      spec_id: CM-11-013
    - rel_type: refines
      spec_id: MV-10-001
    - rel_type: depends_on
      spec_id: CM-17-002
    stories:
    - story_2022_023
    - story_2022_014
    adr:
    - ADR-0114
- id: CM-18
  title: Participant Embargo Consent (per-embargo rows)
  specs:
  - id: CM-18-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant's embargo consent MUST be tracked per embargo, as one row for each embargo it was
      asked about, each row holding one of four states: `INVITED` (asked; no answer yet), `ACCEPTED`,
      `DECLINED` (explicitly refused, or withdrawn from) and `EXPIRED` (invited, and the RSVP
      deadline passed with no answer). A participant with no row for an embargo has not been asked
      about it. A participant is a *signatory* when its row for the case's active embargo is
      `ACCEPTED`; a participant has *lapsed* when it holds an `ACCEPTED` row for another embargo and
      has no accepting row for the active one. Both are derived from the rows and the case's active
      embargo, never stored, and nothing is derived from the rows once the embargo has terminated
      (EM `EXITED`, no active embargo).
    rationale: >-
      The scalar `ParticipantEmbargoConsent` value this replaces answered one question — is this
      participant bound by the *active* embargo? — while `accepted_embargo_ids` recorded which terms
      it had accepted. The two disagreed (Concern #3884) and were kept in step by reconciliation
      rules. One row per (participant, embargo) states each answer once; "bound by the active
      embargo" is a lookup of the active embargo's row, so there is nothing to reconcile and no
      first-proposal versus revision asymmetry (ADR-0122, which supersedes the seven-state machine of
      ADR-0048, ADR-0093 and ADR-0118). The "pocket veto" survives as the `EXPIRED` row state, kept
      distinct from `DECLINED` so every reader can tell silence from a refusal (ADR-0118).
      `UNBOUND` and `UNBOUND_EXITED` are not states: an embargo the participant was never asked about
      has no row, and a terminated embargo is the case's fact (EM `EXITED`), not a per-participant
      one.
    verification: >-
      Inspection of `vultron/core/states/participant_embargo_consent.py` confirms that
      `EmbargoConsentState` declares exactly `INVITED`, `ACCEPTED`, `DECLINED` and `EXPIRED`.
      Inspection of `vultron/core/models/case_participant.py` confirms that `is_signatory()` and
      `has_lapsed()` are computed from `embargo_consents` and the active embargo id, and that no
      consent state is stored beside the rows.
    adr:
    - ADR-0048
    - ADR-0091
    - ADR-0093
    - ADR-0118
    - ADR-0122
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-18-002
    priority: MUST
    kind: protocol
    statement: >-
      The `INVITED → EXPIRED` transition MAY be driven by a timer expiry (pocket veto) rather than
      requiring an explicit participant action. The timer period SHOULD be a configurable policy
      window (default: 7 days). The pocket veto materialises when the timer fires without a prior
      answer; the system applies the `EXPIRE` trigger and records `EXPIRED`, never `DECLINED`, which
      only an explicit refusal reaches. A lapse is NOT timer-based and is not a stored transition:
      it is what the rows say once the case owner activates a revised embargo that ends later than
      the one the participant accepted and the participant has not accepted the revised terms
      (CM-18-001, EP-05-001). A lapsed participant is re-invited (an `INVITED` row for the embargo
      in force), and the deadline attaches to that invitation.
    note: >-
      The policy window is the FALLBACK, not the primary mechanism. When the
      inviting `Invite(EmbargoEvent)` activity carries an explicit
      `Invite.end_time`, that value is authoritative and supersedes this window
      (CM-28-002). The pocket veto and the explicit RSVP deadline are ONE
      mechanism at two levels of explicitness, not two competing timeouts.
    rationale: >-
      Per ADR-0093, ADR-0122 and `notes/participant-embargo-consent.md`: a participant has lapsed when
      the active embargo was replaced by longer terms it has not accepted. While a revision is merely
      proposed the prior embargo is still in force and every signatory to it is still bound by it, so
      nothing about their consent has changed. Per ADR-0118, a participant that did not answer has
      made no decision, so a timeout records `EXPIRED`, distinct from an explicit `DECLINED`; both are
      re-invitable. A pocket veto exists so that an unanswered *invitation* cannot stall
      coordination; nothing stalls on a lapsed participant, who is already excluded from embargoed
      content by the CM-10-004 gate, and there is no invitation from which to derive a deadline.
      An RSVP deadline attaches to the participant's outstanding invitation, so when it passes every
      row still `INVITED` expires with it.
    verification: >-
      Inspection of `vultron/core/services/embargo_lifecycle/consent.py` confirms that
      `detect_and_apply_expiry()` applies `EXPIRE` only to `INVITED` rows of a participant whose
      `invite_rsvp_deadline` has passed. Inspection of `vultron/core/services/embargo_lifecycle/`
      confirms that `propose_embargo()` and the owner's revision acceptance write no row to record a
      lapse.
    adr:
    - ADR-0093
    - ADR-0118
    - ADR-0122
    stories:
    - story_2022_027
    - story_2022_014
  - id: CM-18-003
    priority: MUST
    kind: project
    statement: >-
      The consent row machine MUST implement exactly the following valid triggers, each applied to
      the row for one embargo: INVITE (from no row, `DECLINED` or `EXPIRED`, to `INVITED`), ACCEPT
      (from no row, `INVITED` or `EXPIRED`, to `ACCEPTED`), DECLINE (from no row, `INVITED`,
      `ACCEPTED` or `EXPIRED`, to `DECLINED`) and EXPIRE (from `INVITED` only, to `EXPIRED`). No
      other trigger is valid from any state.
    rationale: >-
      `DECLINED` and `EXPIRED` are not terminal: a participant who declined or let an invitation
      expire can be re-invited (e.g., when embargo terms change). `ACCEPTED` is not re-invitable and
      `DECLINED` does not accept directly, so a consent already given is not silently undone and a
      refusal is not silently reversed. Per ADR-0048, `ACCEPT` and `DECLINE` are valid directly from
      no row, because consent is not always mediated by an invitation: a Finder who sets the embargo
      on their own case has no inviter; participants added during case initialization already have
      an embargo in scope (ADR-0041); and the reporter's consent is implicit in submitting the report
      (CM-14-005). Requiring a synthetic `INVITED` step for these paths would record an invitation
      event that never occurred. Per ADR-0093, `DECLINE` is also valid from `ACCEPTED`: a participant
      bound by an embargo MAY explicitly withdraw consent by rejecting the *active* embargo
      (VP-13-007, VP-13-008). A rejection of a *proposed* embargo declines only that embargo's row
      and leaves the participant's row for the embargo in force alone (MSM-07-004). Per ADR-0118,
      `EXPIRE` is the timer path only (CM-18-002); a late Accept the CASE_MANAGER honours moves
      `EXPIRED → ACCEPTED` directly (EMB-17-002), and a late explicit Reject moves `EXPIRED →
      DECLINED`. A lapse and a termination are not triggers: they are derived (CM-18-001, CM-18-016).
    verification: >-
      Inspection of `vultron/core/states/participant_embargo_consent.py` confirms that the
      transition table implements exactly the triggers INVITE, ACCEPT, DECLINE and EXPIRE with the
      specified source-state constraints, and a unit test applies every (state, trigger) pair and
      confirms each unlisted one raises.
    relationships:
    - rel_type: refines
      spec_id: CM-18-001
    adr:
    - ADR-0048
    - ADR-0093
    - ADR-0118
    - ADR-0122
  - id: CM-18-004
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A participant's consent row MUST NOT move from `ACCEPTED` to `INVITED` directly. The only paths
      back to `INVITED` from a resolved row are `DECLINED → INVITED` (re-invite after explicit
      decline) and `EXPIRED → INVITED` (re-invite after an unanswered invitation expired); a
      participant that has lapsed is re-invited by the absence of an accepting row for the new
      embargo (an `INVITED` row for it), which leaves its `ACCEPTED` row for the old embargo alone.
    rationale: >-
      Consent already given cannot be withdrawn by re-inviting the participant. A signatory to the
      active embargo is bound by it; only replacing that embargo with longer terms (which lapses the
      participant by derivation — ADR-0093, ADR-0122) or the participant's own withdrawal (`DECLINE`)
      ends that position.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0093
    - ADR-0118
    - ADR-0122
  - id: CM-18-005
    priority: MUST
    kind: project
    statement: A participant's consent row MUST be changed by applying a `PEC_Trigger` through
      `CaseParticipant.apply_pec_transition(embargo_id, trigger)` and persisting the participant.
      Code MUST NOT assign `CaseParticipant.embargo_consents` directly as the means of recording a
      consent change.
    rationale: '`apply_pec_transition()` validates the trigger against the consent table and raises
      `VultronInvalidStateTransitionError` on an illegal transition, making consent writes
      fail-closed regardless of upstream BT guard coverage. Direct assignment to the rows bypasses
      the table, so a row could reach a state no trigger leads to. The legacy `apply_pec_trigger()`
      soft-fail helper was removed (CONCERN-1871); all consent-write sites MUST use
      `CaseParticipant.apply_pec_transition()` (or `apply_pec_transition_if_legal()` where an
      illegal trigger is a recorded no-op). Per ADR-0048, ADR-0122.'
    verification: Inspection of `vultron/core/` confirms that all consent-write sites call
      `CaseParticipant.apply_pec_transition()` or `apply_pec_transition_if_legal()` and that no site
      assigns `embargo_consents` outside `CaseParticipant`.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0048
    - ADR-0122
  - id: CM-18-006
    priority: MUST
    kind: project
    statement: >-
      A protocol-significant consent change MUST be reproducible on every replica from the canonical
      case ledger: it is applied by the same `EmbargoLifecycle` operation on the CASE_MANAGER after
      it commits the entry of the activity that caused it (the relayed Invite, the Accept or
      Reject, the expiry, the late-Accept honour), and by replay of that entry on each replica. The
      consent rows are not carried in any `ParticipantStatus` snapshot.
    rationale: 'Consent lives on the `CaseParticipant` rows, not on `ParticipantStatus`, so an
      `Add(ParticipantStatus)` entry carries no consent. The ledger entry of the causing activity is
      the record, and replaying it through the lifecycle operation gives every store the same rows.
      Per ADR-0048, ADR-0122.'
    verification: Integration tests in `test/demo/` confirm that, after an embargo Invite, Accept,
      Reject and expiry, the participant's consent rows on a replica equal those on the
      CASE_MANAGER.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-005
    adr:
    - ADR-0048
    - ADR-0122
  - id: CM-18-007
    priority: MUST
    kind: project
    statement: >-
      The case-initialization sequence MUST establish the default embargo before seeding each
      participant's consent row for it, so that the participant record written at initialization
      carries its true post-initialization rows.
    rationale: 'Because `ACCEPT` is valid directly from no row (CM-18-003, ADR-0048), an
      initialization participant reaches its consent in a single transition, so a placeholder is
      unnecessary. Emitting two entries per participant would also shift every downstream
      `log_index`; PR #1746 was reverted for exactly that, having broken `fvcv-extension` VFD
      replication timing. Holding initialization to one entry per participant keeps `log_index` order
      stable and preserves the ADR-0079 property that `log_index` order is causal order
      (CLP-14-001).'
    verification: Integration tests in `test/demo/` confirm that the default embargo is
      established before each participant's consent row is written during case initialization, so
      each initial participant record carries the correct rows.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-006
    - rel_type: depends_on
      spec_id: CM-14-003
    adr:
    - ADR-0048
    - ADR-0122
  - id: CM-18-009
    priority: MUST
    kind: project
    statement: >-
      Any consent trigger not listed in CM-18-003 MUST be rejected as a protocol error.
    rationale: Rejecting unlisted transitions fail-closes the consent table, preventing
      consent corruption from malformed or unexpected triggers.
    verification: A unit test confirms that applying an unlisted PEC trigger raises
      `VultronInvalidStateTransitionError` rather than silently succeeding.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0048
  - id: CM-18-012
    priority: MUST
    kind: project
    statement: >-
      The case initialization sequence MUST commit exactly one
      `add_participant_status_to_participant` ledger entry per participant, and MUST NOT commit a
      placeholder entry for a participant followed by a corrective entry for the same participant.
    rationale: >-
      Emitting two entries per participant shifts every downstream `log_index`; PR #1746
      was reverted for exactly that, having broken `fvcv-extension` VFD replication timing.
      Holding initialization to one entry per participant keeps `log_index` order stable.
      Because `ACCEPT` is valid directly from no row (CM-18-003, ADR-0048), an initialization
      participant reaches its consent in a single transition, so a placeholder is unnecessary.
    verification: Integration tests in `test/demo/` confirm that case initialization commits
      exactly one `add_participant_status_to_participant` ledger entry per participant.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-007
    adr:
    - ADR-0048
  - id: CM-18-016
    priority: MUST_NOT
    kind: project
    statement: >-
      The embargo lifecycle MUST NOT write a consent row to record a lapse or an exit. A proposal,
      the activation of a longer revision and the termination of the embargo write no row for a
      participant that has not itself been invited, has not itself answered, or whose acceptance is
      not being carried over by containment (EP-05-001); a participant's lapsed or exited position
      is read from its rows and the case (CM-18-001).
    rationale: >-
      The reconciliation rules that lapsed signatories at activation, advanced holders of the
      activated id and exited every record at termination existed only to keep a scalar state in
      step with the per-embargo list (Concern #3884). With one row per embargo they have nothing to
      keep in step, and a write that re-introduced one would re-create the second record of consent
      that ADR-0122 removed.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/` assert that activating a longer revision
      and terminating the embargo report no participant consent change and leave every
      `embargo_consents` row as it was, and that the lapsed and exited positions read as such.
    relationships:
    - rel_type: refines
      spec_id: CM-18-001
    adr:
    - ADR-0122
- id: CM-19
  title: Participant Index Discipline
  specs:
  - id: CM-19-001
    priority: MUST
    kind: protocol
    statement: '`case_participants` (the persisted set of `CaseParticipant` records) is the authoritative source of participant
      membership. `actor_participant_index` (the in-memory dict mapping actor IDs to participants) is a cache derived from
      it. Divergence between these two structures is a hard error, not a recoverable state.'
    rationale: A divergence means the cache has entries the authority doesn't know about (or vice versa), producing silently
      incorrect routing and access-control decisions.
    verification: Inspection of `vultron/core/models/case.py` confirms that `case_participants`
      is the persisted authority and `actor_participant_index` is declared as a derived cache,
      with any divergence treated as a hard error.
    stories:
    - story_2022_092
    - story_2022_093
  - id: CM-19-002
    priority: MUST
    kind: protocol
    statement: Any code path that modifies `case_participants` (add, remove, update) MUST also update `actor_participant_index`
      atomically within the same transaction or method call. The index MUST NOT be allowed to lag the authority.
    verification: Inspection of `vultron/core/` confirms that every code path modifying
      `case_participants` through the canonical mutators also updates `actor_participant_index`
      atomically in the same call.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
    stories:
    - story_2022_093
  - id: CM-19-003
    priority: MUST
    kind: protocol
    statement: Code that needs a participant by actor ID MUST read from `actor_participant_index` (the cache). Code that needs
      the canonical participant set (e.g., for broadcast or audit) MUST read from `case_participants`. Using the cache for
      canonical iteration is prohibited because cache population order is undefined.
    verification: Inspection of `vultron/core/` confirms that actor-ID lookups read from
      `actor_participant_index` and canonical iteration (broadcast, audit) reads from
      `case_participants`.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
    stories:
    - story_2022_093
- id: CM-20
  title: Coordinator-as-Participant Role Constraints
  specs:
  - id: CM-20-001
    priority: MUST
    kind: protocol
    statement: >-
      A Coordinator invited to a case as a regular participant MUST hold
      `CVDRole.COORDINATOR` in their `case_roles` list.
    rationale: '`CASE_OWNER` confers case administration authority (CM-02-001, CM-02-004, CM-02-005). `CASE_MANAGER` is a distinct
      role: it grants single-writer authority over the canonical ledger (CLP-09) and is held by the case-creating actor enacting
      `CVDRole.CASE_MANAGER`, which SHOULD also carry `CVDRole.COORDINATOR` (CBT-01-003). It is not conferred merely for being
      invited as a facilitation participant, so a Coordinator invited as a regular participant holds neither `CASE_OWNER` nor
      `CASE_MANAGER`.'
    verification: Integration tests in `test/demo/` confirm that a Coordinator actor admitted to
      a case holds `CVDRole.COORDINATOR` in their `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-003
    stories:
    - story_2022_063
    - story_2022_052
  - id: CM-20-002
    priority: MUST
    kind: protocol
    statement: When a Coordinator is suggested via the `Offer(Actor, Case)` path (CM-16) and the Case Owner approves the invitation,
      the roles assigned to the Coordinator participant MUST include `CVDRole.COORDINATOR` and MUST NOT include `CVDRole.CASE_MANAGER`
      or `CVDRole.CASE_OWNER`.
    rationale: Invitation and case ownership transfer are distinct protocol operations. An `Offer(Actor, Case)` invite adds
      a participant; it does not transfer `CASE_OWNER` authority (CM-02-001) or the `CASE_MANAGER` single-writer authority (CM-20-001).
      Role assignments at invite time must reflect the invited actor's actual function in the case, not their organizational
      identity.
    verification: Integration tests in `test/demo/` confirm that a Coordinator admitted via
      `Offer(Actor, Case)` is assigned `CVDRole.COORDINATOR` without `CVDRole.CASE_MANAGER` or
      `CVDRole.CASE_OWNER`.
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
    - rel_type: refines
      spec_id: CM-16-004
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-20-003
    priority: MUST
    kind: protocol
    statement: When a Coordinator participant (holding `CVDRole.COORDINATOR` without `CVDRole.CASE_MANAGER`) suggests that
      another actor be added to the case via `Offer(Actor, Case)`, the suggestion MUST route through the CASE_MANAGER inbox per
      ADR-0026 (CM-16-001). The Case Owner — not the Coordinator — MUST remain the sole decision-maker for approving or rejecting
      the invitation (CM-02-001).
    rationale: 'A Coordinator-as-participant should be able to exercise their facilitation role (suggesting additional vendors)
      without requiring ownership transfer. The CASE_MANAGER-routed suggest flow (ADR-0026) already provides this: the Coordinator
      sends `Offer(Actor, Case)` to the CASE_MANAGER, which records and forwards it to the Case Owner for approval.'
    verification: Integration tests in `test/demo/` confirm that a Coordinator participant's
      actor-suggestion message routes through the CASE_MANAGER and the Case Owner must approve or
      reject the invitation.
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-001
    adr:
    - ADR-0026
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-20-004
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A Coordinator invited to a case as a regular participant MUST NOT hold
      `CVDRole.CASE_MANAGER` in their `case_roles` list.
    rationale: '`CVDRole.CASE_MANAGER` grants single-writer authority over the canonical ledger and is held by the actor that
      created the case and enacts that role (CBT-01-003, ADR-0088). It MUST NOT be conferred on an organizational or human
      actor invited to the case as a regular facilitation participant.'
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
  - id: CM-20-005
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      `CVDRole.CASE_MANAGER` MUST NOT be assigned to any organizational or human participant
      joining a case as a facilitation actor rather than as the actor enacting the
      `CVDRole.CASE_MANAGER` role (CBT-01-003).
    rationale: '`CVDRole.CASE_MANAGER` grants single-writer authority over the canonical ledger (CLP-09). Conferring it on a
      participant invited for facilitation would let them author ledger entries that only the actor enacting `CVDRole.CASE_MANAGER`
      is authorized to write.'
    relationships:
    - rel_type: refines
      spec_id: CM-20-004
- id: CM-21
  title: Ownership Transfer Protocol Effects
  specs:
  - id: CM-21-001
    priority: MUST
    kind: protocol
    statement: >-
      A `VulnerabilityCase` MUST have at most one participant holding
      `CVDRole.CASE_OWNER` at any point in time.  If a participant already
      holds `CVDRole.CASE_OWNER` when a new owner is designated, the system
      MUST remove `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant` record before or atomically with granting it to the
      new owner.
    rationale: >-
      `CASE_OWNER` confers exclusive case administration authority
      (CM-02-004, CM-02-005).  Two simultaneous holders would create
      conflicting authority: both could terminate embargoes, authorise
      invitations, and mutate case state independently.  The invariant must
      be enforced at the data-layer level, not just assumed by convention.
    verification: Integration tests in `test/demo/` confirm that at no point does a case have
      more than one participant holding `CVDRole.CASE_OWNER`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-004
    - rel_type: refines
      spec_id: CM-02-005
    stories:
    - story_2022_046
    - story_2022_050
  - id: CM-21-002
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity
      is processed, the system MUST add `CVDRole.CASE_OWNER` to the accepting
      actor's `CaseParticipant.case_roles` and MUST update
      `VulnerabilityCase.attributed_to` to the accepting actor's ID.
    rationale: >-
      A role-gated protocol node (for example `CheckIsCaseOwnerNode`)
      determines case-owner authority by reading `CaseParticipant.case_roles`,
      not by comparing actor IDs against `attributed_to`.  Updating only
      `attributed_to` without also updating the participant record leaves the
      new owner unable to trigger embargo teardown, case closure, and other
      CASE_OWNER-gated operations.  Both fields MUST be kept in sync.
      Root cause of the FCCV-handoff CI failure (2026-07-23):
      `AcceptCaseOwnershipTransferNode` updated `attributed_to` but did not
      add `CVDRole.CASE_OWNER` to C2's participant record, so
      `_sender_is_case_owner()` returned False and embargo teardown was
      skipped.
    verification: Integration tests in `test/demo/` confirm that processing
      `Accept(Offer(VulnerabilityCase))` adds `CVDRole.CASE_OWNER` to the accepting actor's
      `case_roles` and updates `VulnerabilityCase.attributed_to` to the accepting actor's ID.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
    stories:
    - story_2022_050
    - story_2022_048
  - id: CM-21-003
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity is processed,
      the system MUST remove `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant.case_roles`.
    rationale: >-
      Transferring ownership does not evict the previous owner from the case;
      they continue to participate but no longer hold administrative authority.
      Stripping only `CASE_OWNER` (and not other roles) preserves their
      standing as a Coordinator, Vendor, or other role while satisfying the
      at-most-one invariant (CM-21-001).
    verification: Integration tests in `test/demo/` confirm that processing
      `Accept(Offer(VulnerabilityCase))` removes `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
    stories:
    - story_2022_050
    - story_2022_051
  - id: CM-21-004
    priority: MUST
    kind: project
    statement: >-
      The strip of `CVDRole.CASE_OWNER` from the previous holder (CM-21-003),
      the update of `VulnerabilityCase.attributed_to`, and the grant of
      `CVDRole.CASE_OWNER` to the new holder (CM-21-002) MUST be committed to
      storage as a single atomic transaction.  If any part of the write fails,
      the entire set MUST be rolled back so that no partial state is observable.
    rationale: >-
      Without atomicity a crash or exception between the strip and the grant
      produces a case with zero `CASE_OWNER` holders — a state worse than two
      simultaneous holders because it cannot be recovered by any subsequent
      normal protocol message.  The invariant in CM-21-001 ("at most one at any
      point in time") logically implies that the case MUST have exactly one
      `CASE_OWNER` at all times; this spec makes the storage-transaction
      requirement explicit so that DataLayer implementations cannot satisfy
      CM-21-001 through sequential saves.
    verification: Integration tests in `test/demo/` confirm that an ownership transfer writes
      the role-strip, `attributed_to` update, and role-grant as a single atomic transaction that
      either completes fully or is rolled back.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-003
  - id: CM-21-005
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Offer(VulnerabilityCase)` (ownership-transfer variant)
      MUST address the activity to the CASE_MANAGER's inbox (`to: [case_actor_id]`)
      rather than directly to the transferee.  The CASE_MANAGER MUST forward the
      Offer to the transferee's inbox after recording it.
    rationale: >-
      Routing the Offer through the CASE_MANAGER enables it to commit a
      `CaseLedgerEntry` for the offer-in-flight and broadcast
      `Announce(CaseLedgerEntry)` to every active participant (CM-10-004),
      including those not involved in the transfer, such as a Finder or second
      Vendor.  Direct
      actor-to-actor delivery bypasses the canonical log and leaves non-involved
      participants unaware that a transfer is being negotiated.
    verification: Integration tests in `test/demo/` confirm that an ownership-transfer
      `Offer(VulnerabilityCase)` is addressed to the CASE_MANAGER's inbox, which then forwards it
      to the transferee.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    adr:
    - ADR-0053
    - ADR-0114
    stories:
    - story_2022_050
  - id: CM-21-006
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Accept(Offer(VulnerabilityCase))` (ownership-transfer
      variant) MUST address the activity to the CASE_MANAGER's inbox
      (`to: [case_actor_id]`) rather than directly to the offerer.
    rationale: >-
      Routing the Accept through the CASE_MANAGER is required for the
      `AcceptCaseOwnershipTransferReceivedUseCase` to run on the authoritative
      CASE_MANAGER and trigger the post-transfer CaseLedgerEntry cascade
      (CM-21-007).  Addressing the Accept to the offerer's inbox means the use
      case only runs there; the CASE_MANAGER never learns of the completed transfer
      and cannot broadcast it.
    verification: Integration tests in `test/demo/` confirm that an ownership-transfer
      `Accept(Offer(VulnerabilityCase))` is addressed to the CASE_MANAGER's inbox.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-005
    adr:
    - ADR-0053
    stories:
    - story_2022_050
  - id: CM-21-007
    priority: MUST
    kind: protocol
    statement: >-
      After `AcceptCaseOwnershipTransferReceivedUseCase` successfully applies
      the ownership-role changes (CM-21-002, CM-21-003, CM-21-004), the
      CASE_MANAGER MUST commit a `CaseLedgerEntry` recording the completed transfer
      and MUST broadcast `Announce(CaseLedgerEntry)` to all case participants.
    rationale: >-
      The CaseLedgerEntry broadcast is the only mechanism by which participants
      not involved in the transfer (e.g., a Finder or second Vendor) learn that
      the case owner has changed.  Without it, those participants have no
      reliable way to determine who is currently responsible for the case,
      leading to messages being directed to the wrong actor and coordination
      breakdown.  This requirement closes the surface-level symptom described
      in CONCERN-1755.
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer is
      applied, the CASE_MANAGER commits a `CaseLedgerEntry` and broadcasts
      `Announce(CaseLedgerEntry)` to all case participants.
    relationships:
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-006
    adr:
    - ADR-0053
    stories:
    - story_2022_050
    - story_2022_049
    - story_2022_045
  - id: CM-21-008
    priority: MUST
    kind: protocol
    statement: >-
      When an ownership transfer is processed, the previous owner MUST retain any other
      roles they held (e.g., `CVDRole.COORDINATOR`, `CVDRole.VENDOR`) in their
      `CaseParticipant.case_roles`.
    rationale: >-
      Stripping only `CASE_OWNER` (and not other roles) preserves the previous owner's
      standing as a Coordinator, Vendor, or other role while satisfying the at-most-one
      `CASE_OWNER` invariant (CM-21-001).
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer the
      previous owner retains their non-`CASE_OWNER` roles (e.g., `CVDRole.COORDINATOR`) in their
      `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-003
    stories:
    - story_2022_050
    - story_2022_051
  - id: CM-21-009
    priority: MUST
    kind: protocol
    statement: >-
      When an ownership transfer is processed, the previous owner MUST remain a participant
      in the case.
    rationale: >-
      Ownership transfer is not case departure. The previous owner has institutional
      knowledge of the case and continues to participate; only their administrative
      authority is transferred.
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer the
      previous owner remains in the case participants list.
    relationships:
    - rel_type: refines
      spec_id: CM-21-003
    stories:
    - story_2022_050
    - story_2022_051
  - id: CM-21-010
    priority: MUST
    kind: project
    statement: >-
      An actor emitting `Reject(Offer(VulnerabilityCase))` (ownership-transfer
      variant) MUST address the activity to the CASE_MANAGER's inbox
      (`to: [case_actor_id]`) rather than directly to the offerer.
    rationale: >-
      Rejection routing must be symmetric with the Accept path (CM-21-006): the
      Offer was addressed to the CASE_MANAGER (CM-21-005), so its rejection must be
      too.  If the transferee's Reject goes only to the offerer, the CASE_MANAGER —
      the authoritative record of ownership — never learns the transfer was
      declined and its view of who owns the case can silently diverge from
      reality.  What the CASE_MANAGER does on receiving a rejection (whether it
      ledgers the declined transfer, whether the offerer is notified, and
      whether the case may be re-offered) is a separate open question tracked in
      `notes/ownership-transfer.md`.
    note: >-
      This entry governs *addressing* only, mirroring CM-21-005/CM-21-006. The
      downstream received-side behavior of the rejection is deliberately out of
      scope here — see the Open Question in `notes/ownership-transfer.md`.
    verification: >-
      Inspection of `vultron/demo/exchange/transfer_ownership_demo.py` confirms that an
      ownership-transfer `Reject(Offer(VulnerabilityCase))` is addressed to the CASE_MANAGER's inbox
      (`to: [case_actor_id]`), symmetric with the Accept path.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-006
    adr:
    - ADR-0053
  - id: CM-21-011
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on `Accept(Offer(VulnerabilityCase))` only when the sender
      is the transferee named in a pending ownership-transfer Offer it recorded for that
      case and that has not been answered; a participant replica MUST apply the ownership
      change only from the CASE_MANAGER (PCR-03-001). Any other sender MUST be refused, with
      `VulnerabilityCase.attributed_to` and every participant's `CASE_OWNER` role unchanged.
    rationale: >-
      The handler takes the sender to be the new owner and never looks up the Offer, so any
      actor that knows a case id can claim ownership on every receiver holding the case.
      See #3733.
    verification: >-
      A test marked `CM-21-011`
      sends the Accept with no pending Offer naming the sender and asserts `REFUSED` with
      the case owner unchanged.
    stories:
    - story_2022_035
    - story_2022_050
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-21-002
    adr:
    - ADR-0115
- id: CM-22
  title: CASE_MANAGER-Authoritative Case Creation
  description: >-
    Requirements on the CASE_MANAGER's obligations when accepting a CaseProposal,
    per ADR-0041.  These replace the receiver-authored case-creation described in
    ADR-0015 and govern how the CASE_MANAGER initializes CaseStatus, participants,
    and embargo in its DataLayer before emitting `Create(VulnerabilityCase)`.
  specs:
  - id: CM-22-001
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST create the `VulnerabilityCase` object in its own
      DataLayer when accepting a `Create(as_CaseProposal)`, with `attributed_to`
      equal to the proposing actor's ID (the CASE_OWNER, CM-02-008), and MUST be
      the `actor` of the `Create(VulnerabilityCase)` it emits.
    rationale: >-
      ADR-0041 supersedes ADR-0015.  The CASE_MANAGER is the case's authoritative
      creator, which AS2 records as the `actor` of `Create(VulnerabilityCase)`
      (ADR-0023); `attributed_to` records the case owner, which ownership checks
      read and ownership transfer rewrites (MSM-07-008, CM-21-002).
    verification: Integration tests in `test/demo/` confirm that the `VulnerabilityCase` created
      by the CASE_MANAGER has `attributed_to` equal to the proposing actor's ID and that the
      emitted `Create(VulnerabilityCase)` has the CASE_MANAGER as `actor`.
    relationships:
    - rel_type: implements
      spec_id: CP-09-001
    adr:
    - ADR-0023
    - ADR-0041
    stories:
    - story_2022_012
    - story_2022_046
    lint_suppress:
    - dangling_adr_ref
  - id: CM-22-002
    priority: MUST
    kind: protocol
    statement: >-
      After creating the `VulnerabilityCase`, the CASE_MANAGER MUST create
      `CaseParticipant` records for at minimum: (a) the report receiver with
      `CVDRole.CASE_OWNER` and `RM.RECEIVED`, and (b) the reporter with
      `RM.ACCEPTED`.  These records MUST be written before `Create(VulnerabilityCase)`
      is emitted to the report receiver.
    rationale: >-
      The `Create(VulnerabilityCase)` payload embeds participants inline so the
      receiver's `store_embedded_participants` can seed
      its local replica.  Absent participant records at emission time produce an
      empty replica and break role-guard checks (CP-09-002, CP-09-004).
    verification: Integration tests in `test/demo/` confirm that `Create(VulnerabilityCase)` is
      emitted by the CASE_MANAGER only after `CaseParticipant` records for the report receiver and reporter
      are written to its DataLayer.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-002
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-22-003
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit all canonical ledger entries for case
      initialization (`create_case`, `add_report_to_case`, participant-status
      entries, `add_case_status_to_case`) natively in its own DataLayer.  These
      entries MUST NOT be authored by the report receiver and back-filled via
      `WritePrologueLedgerEntriesNode` or any equivalent mechanism.
    rationale: >-
      `_validate_canonical_entry` (in `sync/nodes/canonical_entry.py`) rejects
      entries where the
      `actor_id` does not match `_CASE_AUTHORED_SIGNATURES`.  Receiver-authored
      entries fail this check (the root cause of Issue #1767).  Native
      CASE_MANAGER authorship is the only compliant path.
    verification: Inspection of `vultron/core/` confirms that the canonical initialization
      ledger entries (`create_case`, `add_report_to_case`, participant-status entries,
      `add_case_status_to_case`) are authored by the CASE_MANAGER, not the report receiver.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    stories:
    - story_2022_045
  - id: CM-22-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST initialize the default embargo for the new case before
      emitting `Create(VulnerabilityCase)` to the report receiver (the CASE_OWNER).
    rationale: >-
      Embargo state is protocol-significant.  Deferring initialization to the
      report receiver or to a later message would produce a window in which
      embargo-gated operations are undefined (ADR-0041, CP-09-003).  The
      CASE_MANAGER is the only actor that can initialize it authoritatively at
      case creation; the actor default it applies is the CASE_OWNER's policy,
      carried on the proposal (CP-01-009, CP-01-010).
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER initializes the
      default embargo before emitting `Create(VulnerabilityCase)` to the report receiver.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-003
    adr:
    - ADR-0041

    stories:
    - story_2022_014
    - story_2022_023
- id: CM-23
  title: RM Case Closure via Leave(VulnerabilityCase)
  description: >-
    Requirements for the canonical RM case closure path: Leave(VulnerabilityCase)
    is the sole mechanism for advancing a participant's RM state to CLOSED.
    Add(ParticipantStatus, rm_state=RM.CLOSED) is not a valid closure trigger.
    See ADR-0050 (Leave is canonical for RM closure) and ADR-0051
    (CASE_MANAGER RM lifecycle).

    Pending decision: the closure semantics in CM-23-002, CM-23-013 and CM-23-014
    (what the owner's close does to pending Invites and to later Leaves; #4065, #4066)
    await a separate decision by the maintainer. Nothing in this group changes
    them until that decision is recorded.
  specs:
  - id: CM-23-001
    priority: MUST
    kind: protocol
    statement: >-
      RM case closure MUST be triggered by Leave(VulnerabilityCase), and the
      CASE_MANAGER's ledger commits are the authority for it.  A participant-sent
      Add(ParticipantStatus, rm_state=RM.CLOSED) MUST NOT be used as a closure
      trigger.  The CASE_MANAGER MUST commit a close_case entry recording the
      received Leave, and then, in the order it writes them, one
      add_participant_status_to_participant entry for each RM transition it
      writes for the leaving participant (CM-23-012; V → D → C is two entries).
      These status entries are the Leave's recorded consequence, written by the
      CASE_MANAGER as its own RM writes for the leaving participant (CLP-07-001,
      CLP-07-002, CLP-07-003).  Each replica still receiving case content
      (CM-23-004) advances the leaving participant's RM state to RM.CLOSED only by
      applying those status entries, in ledger order, from the Announce(CaseLedgerEntry)
      fan-out.  A replica
      MUST NOT work out a closure path from its own stored state, and applying the
      close_case entry MUST NOT change any participant's RM state.  A status entry
      that cannot be committed is logged at WARNING and does not abort the
      closure, as for the CASE_MANAGER's own closure (CM-23-005).
    rationale: >-
      The Leave round-trip makes the CASE_MANAGER the authority for closure and
      prevents ghost-departures from lost messages: a participant cannot
      silently reach RM.CLOSED on peers without the CASE_MANAGER having committed
      and broadcast a ledger entry.  The ledger records each move as the
      CASE_MANAGER makes it, so a replica applies moves and cannot invent a step
      no entry backs (#4091).  See ADR-0050.
    verification: Integration tests in `test/demo/` confirm that RM closure flows through
      `Leave(VulnerabilityCase)` -> CASE_MANAGER ledger commit -> broadcast, and that
      `Add(ParticipantStatus, rm_state=RM.CLOSED)` is not used as a closure trigger.
      Unit tests confirm that a Leave from RM.VALID commits the close_case entry and
      then a VALID -> DEFERRED and a DEFERRED -> CLOSED status entry, in that order;
      that a replica which accepts each of those entries ends with the same per-actor
      status history as the CASE_MANAGER and writes no step the ledger lacks; that a
      replica whose participant-status effect refuses an entry (RSH-05-021) logs a
      WARNING and still writes no step of its own; and that applying the close_case
      entry alone changes no participant's RM state.
    adr:
    - ADR-0050
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-002
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives Leave(VulnerabilityCase) from the Case Owner,
      it MUST execute the following sequence:
      (0) commit the close_case entry recording the Leave (CLP-10-006),
      (1) advance the Case Owner participant to RM.CLOSED, committing one status
          entry per RM transition it writes, in order (CM-23-001),
      (2) advance the CASE_MANAGER's own CaseParticipant to RM.CLOSED, committing
          one status entry per RM transition it writes, in order (CM-23-005),
      (3) emit a case_fully_closed CaseLedgerEntry marking the owner-close write
          boundary (ADR-0085),
      (4) fan-out that entry to every active participant whose closure the ledger
          does not already record (CM-10-004, CM-23-004).
      Every entry of steps (0) to (2) MUST precede case_fully_closed, because no
      later entry records an external participant's act (CM-23-013).
      The case_fully_closed entry is NOT a log-complete marker: it records that
      no later entry will record an external participant's act (CM-23-013), and
      consumers MUST NOT treat it as the highest logIndex of the case or as proof
      that a replica holds the complete ledger.
    rationale: >-
      The Case Owner's departure is the authoritative termination event for a case.
      ADR-0085's boundary refuses external participants' appends, not the CASE_MANAGER's
      own housekeeping, so a consumer that stopped reading at case_fully_closed could
      miss an entry the CASE_MANAGER writes later. The guarantee is the boundary, not
      chain finality. See ADR-0050, ADR-0051, ADR-0085.
    verification: >-
      Integration tests in `test/demo/` confirm that a Case Owner's
      `Leave(VulnerabilityCase)` triggers the closure sequence: the `close_case`
      entry, the Case Owner's status entries, the CASE_MANAGER's own status entries,
      then the `case_fully_closed` entry, in that order, fanned out to every active
      participant whose closure the ledger does not already record.  Unit tests
      confirm that the ledger holds no entry for the Case Owner or the CASE_MANAGER
      after `case_fully_closed`.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
    - ADR-0051
    - ADR-0085
    - ADR-0114
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-003
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives Leave(VulnerabilityCase) from a non-owner
      participant, it MUST advance only that participant's RM state to RM.CLOSED
      and commit a CaseLedgerEntry recording the departure (close_case), then one
      status entry per RM transition it writes for that participant, in order
      (CM-23-001).  The close_case entry is committed first, before any of those
      writes (CLP-10-006).  The case MUST remain
      open for the remaining participants.  This applies only while the case is
      open; a non-owner Leave that arrives after owner close is governed by
      CM-23-013.
    rationale: >-
      Non-owner departure is a participant-scoped event, not a case termination
      event.  Treating a non-owner Leave identically to an owner Leave would
      prematurely close the case and violate the Case Owner's authority over the
      case lifecycle.  See ADR-0050.
    verification: Integration tests in `test/demo/` confirm that a non-owner
      `Leave(VulnerabilityCase)` advances only that participant's RM state to RM.CLOSED and
      leaves the case open for remaining participants. Unit tests confirm that the
      `close_case` entry precedes one status entry per RM transition, that a replica
      applying them writes no step of its own, and that a leaver at RM.RECEIVED or
      RM.START (S -> R -> C) is recorded the same way.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT send a participant whose closure an earlier ledger
      entry already records (its status entry with rm_state=RM.CLOSED) any case
      content: no CaseLedgerEntry announcements, no Announce(VulnerabilityCase), no
      status broadcasts and no embargo announcements.  The entries that record a
      participant's own closure, the close_case entry and the status entries that
      follow it (CM-23-001), are not withheld from that participant, so the leaving
      participant's replica receives every step, the one that reaches RM.CLOSED
      included.  Those entries are identified by their subject being the recipient,
      not by the recipient's status, which is already RM.CLOSED when the last of
      them is fanned out.  They never widen entitlement (CM-10-004): a participant
      that is inert or removed when it leaves is not sent them.  The only other
      message a closed participant receives is the direct embargo notice to a
      SIGNATORY that CM-31-009 requires, which carries no other case content.  A
      participant that has left stops at the entries that record its departure: it
      does not receive later entries, case_fully_closed included.  A closing
      participant waits for those entries and MUST NOT write its own RM.CLOSED to
      its replica in place of them.  The CASE_MANAGER's own store, not any
      participant's replica, is where every participant's closure is verified.
    rationale: >-
      RM.CLOSED is the participant's own declaration that it has stopped paying
      attention to the case, made while the case may still be open, and its case
      replication process is assumed to have exited, so nothing is there to receive
      a later entry (the same assumption governs the CASE_MANAGER after
      case_fully_closed, CM-23-013).  It receives no further content, so it does not
      go on seeing embargoed material after it has left, and continuing to send it
      entries wastes bandwidth and may trigger erroneous processing on stale
      replicas.  The entries that record its own closure come before it exits, so it
      still receives them (a replica is advanced only by the ledger, CM-23-001).  A
      closed replica therefore does not converge on later closures; that is
      intended.  Resolves CONCERN-4100.
    verification: >-
      Unit tests on the shared recipient selection assert a participant whose
      closure the ledger records is left out of every case-content send except the
      entries recording its own closure.  Integration tests in `test/demo/` confirm
      that `Announce(CaseLedgerEntry)` fan-out skips a participant once a ledger
      entry has recorded its `rm_state=RM.CLOSED`, that the leaving participant's
      replica still receives the `close_case` entry and every status entry up to and
      including the one that reaches `RM.CLOSED`, but not the later
      `case_fully_closed` entry, and that the CASE_MANAGER's store holds every
      participant at RM.CLOSED.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    - rel_type: refines
      spec_id: CM-10-004
    - rel_type: refines
      spec_id: CM-31-009
    adr:
    - ADR-0114
    stories:
    - story_2022_068
  - id: CM-23-005
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST track its own RM lifecycle via a CaseParticipant
      record with ParticipantStatus entries that advance through
      RM.RECEIVED, RM.VALID, and RM.ACCEPTED during case initialization,
      and RM.CLOSED on case termination (owner Leave).  Each transition
      MUST be recorded as a CaseLedgerEntry.
    rationale: >-
      Uniform RM lifecycle tracking across all participants (including the
      coordinator) enables case-level RM state to be read consistently from
      the ledger without special-casing the CASE_MANAGER.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that the CASE_MANAGER holds its own
      `CaseParticipant` record that advances through RM states with a ledger entry for each
      transition.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    adr:
    - ADR-0051
    stories:
    - story_2022_088
    - story_2022_074
  - id: CM-23-006
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.RECEIVED` MUST denote that a CaseProposal
      has been received and is being evaluated.
    rationale: >-
      The RM state machine models a lifecycle that applies to any actor processing a case,
      but its transition labels map to case-level events for the coordinator rather than to
      report-validation events as for other participants.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.RECEIVED` on the CASE_MANAGER's
      own `CaseParticipant` denotes receipt of a `CaseProposal` under evaluation.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    adr:
    - ADR-0051
    stories:
    - story_2022_088
  - id: CM-23-007
    priority: MUST
    kind: protocol
    statement: >-
      During case initialization (after accepting a CaseProposal), the Case
      Actor MUST emit CaseLedgerEntry records for each of its own RM transitions:
      (a) CASE_MANAGER→RM.RECEIVED when the CaseProposal arrives,
      (b) CASE_MANAGER→RM.VALID when the proposal is validated and case creation
          begins,
      (c) CASE_MANAGER→RM.ACCEPTED when the VulnerabilityCase is successfully
          created and initialized.
    rationale: >-
      Ledger entries for the CASE_MANAGER's own RM transitions create a traceable,
      timestamped protocol-significant history of case initialization, consistent
      with CM-02-009 (CASE_MANAGER applies its own timestamp to every state-changing
      event).  See ADR-0051.
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER emits
      `CaseLedgerEntry` records for its own `RM.RECEIVED`, `RM.VALID`, and `RM.ACCEPTED`
      transitions during case initialization.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    - rel_type: refines
      spec_id: CM-02-009
    adr:
    - ADR-0051
    stories:
    - story_2022_045
    - story_2022_074
  - id: CM-23-008
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.VALID` MUST denote that the CaseProposal
      is correctly formatted and actionable by this CASE_MANAGER, and that case creation has
      begun.
    rationale: >-
      `RM.VALID` is the CASE_MANAGER's signal that the proposal passed structural validation
      and that initialization is in progress; it distinguishes a validated-but-incomplete
      case from one still under evaluation.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.VALID` on the CASE_MANAGER's
      `CaseParticipant` denotes that the `CaseProposal` passed structural validation and case
      creation has begun.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051
    stories:
    - story_2022_088
  - id: CM-23-009
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.ACCEPTED` MUST denote that the case has
      been successfully created and is being coordinated.
    rationale: >-
      `RM.ACCEPTED` marks the end of the initialization phase and the start of active
      coordination; it is the CASE_MANAGER's counterpart to a reporter's or vendor's
      RM.ACCEPTED (engagement decision).  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.ACCEPTED` on the CASE_MANAGER's
      `CaseParticipant` denotes that the `VulnerabilityCase` has been successfully created and
      is being coordinated.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051
    stories:
    - story_2022_088
  - id: CM-23-010
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.CLOSED` MUST denote that the Case Owner
      has left the case and the case is fully closed.
    rationale: >-
      `RM.CLOSED` on the CASE_MANAGER's own participant record is the terminal state; it
      signals that no further ledger entries will be authored for this case.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.CLOSED` on the CASE_MANAGER's
      `CaseParticipant` denotes that the Case Owner has left the case and the case is fully
      closed.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051

    stories:
    - story_2022_088
    - story_2022_066
  - id: CM-23-011
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives `Leave(VulnerabilityCase)` from the Case Owner
      while the case still holds an active embargo (`active_embargo` is non-None
      and the current EM state is `EM.ACTIVE` or `EM.REVISE`), it MUST decline the
      closure with an `as:Reject` response ("received and understood but declined",
      MSM-05-001) and MUST NOT execute the CM-23-002 closure sequence (no
      participant advances to `RM.CLOSED`; no `case_fully_closed` entry is
      emitted). The decline MUST suppress the receipt commit itself: a declined
      owner-close records NO `close_case` `CaseLedgerEntry` at all. Gating the
      receive-and-commit path behind the decline is required, not optional,
      because that receipt commit opens the closure — it is committed
      before any role-specific effect (CLP-10-006), and the status entries
      that follow it (CM-23-001) are what advance the departing participant to
      `RM.CLOSED` on each replica (CLP-10-001, CM-23-003). Skipping only the local
      CM-23-002 steps while still committing the receipt would leave a recorded
      departure the case then declined, contradicting "no participant advances
      to `RM.CLOSED`" (ISSUE-3137).
      The Case Owner MUST terminate the active embargo first, then
      re-issue the close. Declining the close does NOT itself terminate the
      embargo — the embargo remains active until terminated through the normal EM
      path. This is the terminal, case-global counterpart to the
      participant-scoped VP-13-005 (participants SHOULD NOT close while embargoed)
      and VP-13-009 (a participant close while others remain engaged does not
      auto-terminate the embargo): owner-close ends the case for everyone, so the
      soft participant-level guidance is raised to a hard case-actor refusal.
    rationale: >-
      Owner-close is a hard, terminal write boundary (ADR-0085): the CASE_MANAGER
      then accepts no further external ledger writes. VP-13-009 keeps an embargo
      alive across a participant close only while others remain engaged;
      owner-close leaves none and no authority to lift it, so an embargo left
      active could never be discharged. Refusing the premature close forces an
      explicit terminate-then-close ordering. `Leave` is understood but declined —
      hence `as:Reject`, not `Create(ProcessingFault)` (MSM-05-001).
    verification: >-
      A test confirms that a Case Owner `Leave(VulnerabilityCase)` on a case with
      an active embargo produces an `as:Reject` response and does not advance any
      participant to `RM.CLOSED` or emit `case_fully_closed`; after the embargo is
      terminated, the same close proceeds through the CM-23-002 sequence.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    - rel_type: refines
      spec_id: VP-13-005
    adr:
    - ADR-0085
    - ADR-0050
    stories:
    - story_2022_066
  - id: CM-23-012
    priority: MUST
    kind: protocol
    statement: >-
      Leave(VulnerabilityCase) advances only the leaving actor's own RM state to
      RM.CLOSED, regardless of which RM rung that actor currently holds (RECEIVED,
      INVALID, VALID, ACCEPTED, or DEFERRED). Each closure is written as transitions
      the RM transition function permits: a Leave from RM.VALID is recorded as
      V → D → C (RMB-14-005), and a Leave from RM.START, by an actor that has
      not yet recorded receiving the case it is leaving, is recorded as
      S → R → C, because S → C is not a transition. Case closure MUST NOT
      advance any non-leaving ("bystander") participant's RM state: on owner
      Leave, only the Case Owner and the CASE_MANAGER advance to RM.CLOSED
      (CM-23-002); every other participant MUST retain its last RM state. The
      characterization of owner-close as ending "the case for everyone"
      (CM-23-011) refers to the case-level write boundary — the CASE_MANAGER
      accepts no further external ledger entries (ADR-0085) — and MUST NOT be
      read as a directive to force each remaining participant's RM dimension to
      RM.CLOSED.
    rationale: >-
      A participant's RM state is the self-declaratory record of how that
      participant handled the report (ADR-0121). A Leave is that participant's
      own authoritative closure act, so advancing the leaving actor to RM.CLOSED
      regardless of rung is legitimate self-declaration, not an externally
      imposed jump. Every closure is an ordinary transition: the RM transition
      function closes from Received, Invalid, Accepted and Deferred (ADR-0114),
      and a Leave from Valid passes through Deferred first, so no leave/close
      write site overrides the transition table (RMB-14-005). A bystander that
      never sent Leave has made no closure declaration; forcing its RM to
      RM.CLOSED would fabricate a declaration it never made. Such a participant
      simply remains at its last rung when the case ends around it (the library
      closes before every book is returned). The demos' "all participants
      RM.CLOSED" milestone (DEMOMA-07-003) is reached because every participant
      closes its own handling through the protocol before the Case Owner closes
      the case (CM-23-013), not because closure pushes them there.
    verification: >-
      A test confirms that an owner Leave(VulnerabilityCase) advances only the
      Case Owner and CASE_MANAGER to RM.CLOSED and leaves a bystander participant
      that was at RM.RECEIVED or RM.VALID at its prior RM state; that a leaving
      actor at RM.RECEIVED is advanced R → C; and that a leaving actor at
      RM.VALID is recorded V → D → C, with no write overriding the transition
      table.  The CASE_MANAGER writes every step of the leaving actor's path, the
      S → R step of S → R → C included, and commits each as a status entry
      (CM-23-001); a test confirms that a replica applying those entries ends with
      the same per-actor status history and writes no step the ledger lacks.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    - rel_type: refines
      spec_id: CM-23-002
    adr:
    - ADR-0050
    - ADR-0121
    - ADR-0085
    - ADR-0114
    stories:
    - story_2022_066
  - id: CM-23-013
    priority: MUST
    kind: protocol
    statement: >-
      After the case_fully_closed entry has been committed, the CASE_MANAGER MUST
      behave toward the case as if its process had exited: for any inbound
      activity for the case — a non-owner participant's Leave(VulnerabilityCase)
      included — it MUST NOT commit any CaseLedgerEntry, the receipt entry
      included, and MUST NOT change any case or participant state. It MAY reply
      with an `as:Reject` ("received and understood but declined", MSM-05-001),
      or MAY drop the activity with no reply at all. A participant MUST NOT rely
      on receiving a reply to an activity it sends after the case has closed.
      The sender's RM state on the canonical ledger stays at its last rung
      (CM-23-012).
    rationale: >-
      In a deployment the process managing a closed case can exit once closure has
      fanned out, leaving nothing to receive a late message. This rule makes the
      prototype's CASE_MANAGER behave the same way: nothing reaches the ledger, and a
      reply is a courtesy. The receipt commit is suppressed because it opens the closure
      whose status entries would close the sender on the replicas (CLP-10-006,
      CM-23-001). A participant that wants its
      departure recorded leaves first (CM-23-015). #4162 owns this.
    verification: >-
      A test confirms that after an owner Leave(VulnerabilityCase) has committed
      `case_fully_closed`, a later inbound activity for the case — a bystander's
      Leave(VulnerabilityCase) among them — commits no CaseLedgerEntry and changes no RM
      or case state, and that the CASE_MANAGER either sends an `as:Reject` or sends
      nothing:
      `test/core/use_cases/received/test_close_case_role_semantics.py::TestPostCloseBoundary::test_bystander_leave_after_owner_close_is_refused`,
      a strict `xfail` naming #4162 and #4065 until they land.
    relationships:
    - rel_type: refines
      spec_id: CM-23-003
    - rel_type: refines
      spec_id: CM-23-002
    - rel_type: depends_on
      spec_id: MSM-05-001
    adr:
    - ADR-0085
    - ADR-0050
    stories:
    - story_2022_066
  - id: CM-23-014
    priority: MUST
    kind: protocol
    statement: >-
      As part of the CM-23-002 owner-close sequence, after the CASE_MANAGER advances its own
      CaseParticipant to RM.CLOSED and before it commits `case_fully_closed`, it MUST expire every
      embargo Invite still awaiting a reply on the case (every consent row that is `INVITED` moves to `EXPIRED`), without waiting for its RSVP deadline. It MUST commit
      an expired-invitation CaseLedgerEntry for each (CM-28-009, CM-28-014). A pending case Invite
      carries no RSVP deadline and so needs no settling: an answer to it after close is an external
      append, refused at the ADR-0085 boundary.
    rationale: >-
      After close a pending Invite can only expire. Waiting for its RSVP deadline would keep the
      CASE_MANAGER running for a closed case, possibly for years, only to write one more entry after
      `case_fully_closed`. Settling first leaves no timer, so the CASE_MANAGER can stop once the
      closure has fanned out. This keeps the boundary clean in practice; it does not promise chain
      finality (CM-23-002).
    verification: >-
      A test confirms that an owner Leave(VulnerabilityCase) on a case with an unanswered Invite
      whose RSVP deadline is in the future moves that participant's consent to `EXPIRED`, commits
      the expired-invitation entry, and orders that entry after the CASE_MANAGER's RM.CLOSED entry
      and before `case_fully_closed`.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    - rel_type: depends_on
      spec_id: CM-28-009
    - rel_type: depends_on
      spec_id: CM-28-014
    adr:
    - ADR-0118
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-015
    priority: SHOULD
    kind: protocol
    statement: >-
      The Case Owner SHOULD leave a case last, or nearly last, after the other
      participants have left, so that their departures are recorded before
      case_fully_closed; a departure sent after closure is not recorded
      (CM-23-013).
    rationale: >-
      The owner's Leave closes the case for everyone (CM-23-002), and nothing a
      participant sends afterwards reaches the ledger. A participant that has
      not left by then keeps its last RM state on every replica that receives it,
      which is harmless but leaves the ledger without a record of its departure.
      Leaving last is the owner's normal course, not a hard ordering: a
      participant that never leaves cannot hold a case open. #4163 owns
      reordering the demo scenarios, which today close the owner first.
    verification: >-
      `test/demo/test_fv_demo.py::TestFvMilestoneAssertions::test_phase_case_closure_closes_the_case_owner_last`
      asserts the FV closure phase closes the Finder before the Vendor, the Case Owner;
      it is a strict `xfail` naming #4163 until the demos are reordered.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    - rel_type: depends_on
      spec_id: CM-23-013
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-016
    priority: MUST
    kind: protocol
    statement: >-
      A participant's case replica is the case as it stood when the replica was seeded
      plus the ledger entries since. A replica MUST apply the transitions the ledger
      records, in ledger order, and MUST NOT derive a transition the ledger does not
      record, for example by walking the RM transition table from its own stored state
      to a target state.
    rationale: >-
      The CASE_MANAGER is the single mover (ADR-0108) and the ledger records each move
      as it makes it. A replica that re-derives a path from its own, possibly lagging,
      state can write an RM rung the ledger never recorded, so replicas diverge from the
      CASE_MANAGER's history (#4091). CM-23-001 states the rule for closure; this states
      it for every replicated transition.
    verification: >-
      A unit test replays a ledger whose entries skip a rung that a table walk would
      insert, and asserts the replica's per-actor status history equals the ledger's and
      that no step the ledger lacks is written.
    relationships:
    - rel_type: extends
      spec_id: CM-23-001
    adr:
    - ADR-0108
    - ADR-0114
    stories:
    - story_2022_066
- id: CM-24
  title: CASE_MANAGER-Delegated Activity Authorship Contract
  description: >-
    Requirements for how trigger use cases assign `actor` and `attributed_to`
    when the CASE_MANAGER emits an Activity on behalf of a requesting participant
    (delegated message).  The reference implementation is `delegated_authorship()`
    (`vultron/core/behaviors/delegated_authorship.py`).
    Codified from CONCERN-2170.
  specs:
  - id: CM-24-001
    priority: MUST
    kind: protocol
    statement: >-
      When a trigger use case causes the CASE_MANAGER to emit a protocol Activity
      on behalf of a requesting participant (delegated message), the `actor`
      field of the emitted Activity MUST be set to the CASE_MANAGER's actor ID,
      not the requesting participant's actor ID.
    rationale: >-
      Receiving actors authenticate messages by matching the `actor` field
      against known case participants.  An Activity whose `actor` names a
      non-CASE_MANAGER participant is not recognised as a CASE_MANAGER-authorised
      delegation and may be rejected or misrouted.  Bug ISSUE-2142
      (ownership-transfer offer delivery timeout) is direct evidence:
      the Coordinator rejected an Offer whose `actor` named the Finder.
    verification: Integration tests in `test/demo/` confirm that a delegated Activity emitted by
      the CASE_MANAGER on behalf of a participant carries the CASE_MANAGER's actor ID in the `actor`
      field.
    relationships:
    - rel_type: refines
      spec_id: CM-02-009
    stories:
    - story_2022_089
    - story_2022_036
  - id: CM-24-002
    priority: MUST
    kind: protocol
    statement: >-
      When a delegated Activity is emitted by the CASE_MANAGER, the
      `attributed_to` field MUST be set to the requesting participant's actor
      ID so that receivers can recover the originating identity.
    rationale: >-
      `attributed_to` is the AS2-standard field for recording who delegated an
      action.  Without it, the intent of the message cannot be attributed to the
      correct participant, and audit trails are incomplete.
    verification: Integration tests in `test/demo/` confirm that a delegated Activity carries
      the requesting participant's actor ID in the `attributed_to` field.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    stories:
    - story_2022_089
    - story_2022_034
  - id: CM-24-004
    priority: MUST
    kind: architecture
    statement: >-
      Trigger use cases that emit delegated Activities MUST queue the
      constructed Activity in the CASE_MANAGER's outbox, not in the requesting
      participant's outbox.  The emit MUST sit inside a composite gated on the
      executing actor holding `CVDRole.CASE_MANAGER` for the case; code MUST NOT
      instead compare `actor_id` against a computed `case_actor_id`. The delegated
      emit MUST execute on the container that hosts the CASE_MANAGER: a requesting
      participant whose container does not host it reaches the CASE_MANAGER by
      sending it the participant's own activity, and the CASE_MANAGER's received
      tree performs the delegated emit. A container MUST NOT execute a tree, or
      enqueue an activity, as an actor it does not host (ADR-0109).
    rationale: >-
      The CASE_MANAGER's outbox is the delivery path to other participants.
      Queuing a delegated Activity in the requesting actor's outbox bypasses
      the CASE_MANAGER as the authoritative intermediary and breaks the
      CaseLedgerEntry audit trail. Emitting in the CASE_MANAGER's name from a
      container that does not host it is the same bypass in a different coat:
      the activity leaves a store that is not the ledger's home, the canonical
      entry can only be minted by mailing the CASE_MANAGER a copy of its own
      emission, and no such container could ever sign the activity (OX-10).

      The mechanism changed in ADR-0073. This entry previously required setting
      `self._actor_id = case_actor_id` in `_prepare()`. That is a convention, and
      it conflated three separate ideas CM-24 otherwise keeps apart: the
      activity's `actor` (CM-24-001), its `attributed_to` (CM-24-002), and whose
      store this is. Spelling the first and third with one variable made a local
      write look like a foreign one, and it left the identity comparison as the
      only guard — but the authority is a *role* held in the case, and its holder
      may be any Actor type. Once the emit is role-gated the executing actor *is*
      the case manager, so both the activity and its outbox entry land in one
      store by construction (BT-05-006). Ungated, the helper is identity
      spoofing: any actor reaching it could emit an `Announce` authored as the
      CASE_MANAGER to every participant.
    verification: >-
      `test/core/behaviors/test_store_scope.py::TestStoreForActorScoping` asserts a delegated emit
      reaches the co-hosted CASE_MANAGER's store, so the Activity and the outbox entry naming it land
      together; `test/core/behaviors/case/nodes/test_role_gates.py::TestCaseManagerGate` asserts the
      gate admits only the `CVDRole.CASE_MANAGER` holder. Verified this way rather than by inspecting
      for `self._actor_id = case_actor_id`, which ADR-0073 removed.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    adr:
    - ADR-0073
    - ADR-0109
  - id: CM-24-005
    priority: MUST
    kind: project
    statement: >-
      Every path that emits an Activity on another participant's behalf — a
      trigger use case, or a received-side tree performing the CM-24-004
      delegated emit — MUST obtain the Activity's `actor` and `attributed_to`
      from one shared helper. The helper MUST set `actor` to the actor doing
      what was asked (the CASE_MANAGER executing the gated tree) and
      `attributed_to` to the actor that asked (the trigger's requesting actor,
      or the sender of the activity the received tree acts on). It MUST live in
      a module that both use cases and BT nodes may import (BTND-04-003). No
      callsite may reconstruct the delegated-authorship pattern without it.
    rationale: >-
      Rebuilding the actor/attributed_to assignment at each callsite drifted:
      CONCERN-2170 found two wrong callsites. Neither value needs computing, since the
      doer and the asker are known where the emit happens, and the received-side relay
      is a delegated emit too (CM-24-004). Today the helper sits in the trigger layer,
      which BT nodes may not import, and the relay rebuilds the pattern by hand; #4160
      owns moving it.
    verification: >-
      Inspection of `vultron/core/` confirms that every trigger use case and
      every received-side tree emitting a delegated Activity takes `actor` and
      `attributed_to` from one shared helper importable from both
      `vultron/core/use_cases/` and `vultron/core/behaviors/`; until #4160
      lands, the trigger-side callsites satisfy this and the received-side
      relay does not.
    relationships:
    - rel_type: refines
      spec_id: CM-24-004
    - rel_type: depends_on
      spec_id: BTND-04-003
  - id: CM-24-006
    priority: MUST
    kind: protocol
    statement: >-
      A case MUST have a participant holding `CVDRole.CASE_MANAGER` from case creation
      onward: both creation paths register one (the CaseActor as `COORDINATOR` +
      `CASE_MANAGER` under ADR-0041, or the creating actor as `CASE_OWNER` + `CASE_MANAGER`
      under CM-02-015), and role delegation transfers it without a gap. No trigger, received
      tree or shared helper MAY carry an arm for a case with no CASE_MANAGER: a resolver that
      finds none MUST fail, and MUST NOT succeed with a warning or send the activity
      directly.
    rationale: >-
      An earlier requirement (retired; `plan/retired-specs/CM-24-003.md`) codified a "no dedicated CASE_MANAGER, send directly" fallback that no
      creation path can produce; it survived in the delegated-context helper, in two nodes
      that returned SUCCESS with a warning when the resolver found nobody, and in tests that
      asserted the fallback. An arm for an unreachable state is where a corrupt roster hides
      (#3918, ADR-0113 as amended).
    verification: >-
      Tests of both case-creation trees assert a `CASE_MANAGER` holder exists in
      `actor_participant_index` after creation; a test of the close-case emit and the
      embargo teardown announce asserts FAILURE, not SUCCESS, when no holder is found; the
      delegated-context helper has no fallback branch. Until the retirement lands the
      failure tests are strict `xfail`s naming their tracking issue.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    - rel_type: depends_on
      spec_id: CM-22-002
    adr:
    - ADR-0113
    - ADR-0109
    stories:
    - story_2022_106

- id: CM-25
  title: Observer Participant Semantics
  description: >-
    Requirements for the CVDRole.OBSERVER role (formerly CVDRole.OTHER):
    what an Observer IS, how it is admitted, what content it receives,
    and how the RM lifecycle applies. Codified by ADR-0057
    (docs/adr/0057-observer-participant-role.md). Source: CONCERN-2093.
  specs:
  - id: CM-25-001
    priority: MUST
    kind: protocol
    statement: >-
      An Observer (`CVDRole.OBSERVER`) is a Tier-1 case participant: it MUST
      hold a `CaseParticipant` record, run the standard RM lifecycle, and satisfy
      the same embargo-consent gate (MV-10-005) as any other participant.
      CVDRole.OBSERVER is the base role — the lowest non-null privilege set in
      the Vultron protocol. All other CVD roles are additive to it.
    rationale: >-
      Defining Observer as a full participant (not a passive consumer or an
      external T0 actor) ensures it is subject to the same admission and
      embargo-consent rules as Vendors and Coordinators. The "base role" framing
      establishes OBSERVER as the correct fallback when no other role applies,
      rather than leaving CVDRole.OTHER as an unspecified catch-all.
      See ADR-0057.
    verification: Integration tests in `test/demo/` confirm that an Observer participant holds a
      `CaseParticipant` record, runs the standard RM lifecycle, and satisfies the
      embargo-consent gate before receiving case content.
    adr:
    - ADR-0057
    stories:
    - story_2022_063
    - story_2022_013
  - id: CM-25-002
    priority: MUST
    kind: protocol
    statement: >-
      An Observer MUST be admitted to a case via the standard `Invite`/`Accept` flow
      defined in CM-17.
    rationale: >-
      Requiring a non-empty `case_roles` value is load-bearing: the participant
      record created with the stub Invite (CM-11-006) carries the roles that
      Invite names. A missing or empty list would create an
      Observer participant with no role — indistinguishable from a defect.
    verification: Integration tests in `test/demo/` confirm that an Observer is admitted to a
      case only via the standard `Invite`/`Accept` flow defined in CM-17.
    relationships:
    - rel_type: refines
      spec_id: CM-17-003
    - rel_type: refines
      spec_id: CM-16-003
    adr:
    - ADR-0057
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_054
    - story_2022_063
  - id: CM-25-003
    priority: MUST
    kind: protocol
    statement: >-
      An Observer MUST receive full case content once it is an active participant
      (CM-10-004). That check is the sole gate on case content for an Observer. No
      additional or reduced delivery tier applies.
    rationale: >-
      An Observer that accepts the stub Invite consents to the active embargo
      (MV-10-006). The absence of a remediation function does not change what
      the Observer is entitled to receive once it is active. Introducing a separate
      reduced delivery tier for Observers is deferred: `notes/stub-objects.md`
      describes the potential future mechanism but it is not yet implemented.
    verification: >-
      Integration tests in `test/demo/` confirm that an active Observer receives full
      case content with no additional content restrictions.
    relationships:
    - rel_type: depends_on
      spec_id: CM-10-004
    - rel_type: depends_on
      spec_id: MV-10-005
    - rel_type: depends_on
      spec_id: MV-10-006
    adr:
    - ADR-0057
    - ADR-0114
    stories:
    - story_2022_063
    - story_2022_082
  - id: CM-25-004
    priority: SHOULD
    kind: protocol
    statement: >-
      After accepting a case invitation and receiving the full case replica, an
      Observer SHOULD run the standard RM triage cycle (CM-11-002):
      RM.VALID or RM.INVALID, then RM.ACCEPTED or RM.DEFERRED.
      For an Observer, RM.ACCEPTED means "I am actively engaged with / monitoring
      this case" — it does NOT imply commitment to develop or deploy a fix.
    rationale: >-
      The RM triage cycle represents an Observer's assessment of whether the
      case is relevant to them and whether they intend to remain engaged. An
      Observer that determines the case is outside their scope should transition
      to RM.INVALID or RM.DEFERRED, not silently stay at RM.RECEIVED. This
      preserves the RM machine's semantics as a participation-intent signal.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-002
    adr:
    - ADR-0057
  - id: CM-25-005
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A participant whose `case_roles` list contains ONLY `CVDRole.OBSERVER`
      MUST NOT emit VFD state-transition messages (CV, CF, or CD). An Observer
      has no vendor-fix-deployment obligations and no authority to advance the
      VFD dimension on behalf of a product or service.
    note: >-
      This restriction is scoped to sole-OBSERVER participants. When
      CVDRole.OBSERVER is combined with any role that carries VFD obligations
      (CVDRole.VENDOR, CVDRole.DEPLOYER), the union-of-permissions rule (CM-26-001)
      applies: the VFD obligations of the co-role supersede this restriction.
      Code checking this exclusion MUST test `case_roles == [CVDRole.OBSERVER]`
      (or equivalent sole-role check), NOT merely `CVDRole.OBSERVER in case_roles`.
    rationale: >-
      An Observer joined the case to monitor it, not to own a fix path. Permitting
      VFD emissions from a role with no fix obligations would corrupt the VFD state
      machine for the case (e.g., a monitoring actor falsely claiming fix deployment).
    relationships:
    - rel_type: refines
      spec_id: CM-03-005
    adr:
    - ADR-0057
  - id: CM-25-006
    priority: MUST
    kind: protocol
    statement: >-
      The `Invite` activity sent by the CASE_MANAGER for an Observer MUST embed
      `case_roles=[CVDRole.OBSERVER]`.
    rationale: >-
      The participant record created with the stub Invite (CM-11-006) carries the roles
      that Invite names; omitting `CVDRole.OBSERVER` would create a participant with an
      empty role list, indistinguishable from the `caseRoles=[]` defect (issue #1288).
    verification: Integration tests in `test/demo/` confirm that the `Invite` activity for an
      Observer embeds `case_roles=[CVDRole.OBSERVER]`.
    relationships:
    - rel_type: refines
      spec_id: CM-25-002
    adr:
    - ADR-0057
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-25-007
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      An empty `case_roles` list MUST NOT be used for Observer invitations; `[]` is
      indistinguishable from the `caseRoles=[]` admission defect (issue #1288) and
      violates the CM-16-003 non-empty invariant.
    rationale: >-
      `[]` provides no role information to the CASE_MANAGER's participant-creation path
      on the stub Invite (CM-11-006), producing a participant record that violates the
      non-empty role invariant enforced by CM-16-003.
    relationships:
    - rel_type: refines
      spec_id: CM-25-006
    adr:
    - ADR-0057
    - ADR-0114

- id: CM-26
  title: Role Stacking — Union of Permissions
  description: >-
    Requirement governing how conflicting obligations are resolved when a
    participant holds multiple CVD roles simultaneously. Codified by ADR-0057.
    Source: CONCERN-2093.
  specs:
  - id: CM-26-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant's permitted and obligated actions are determined by the
      **union** of what their role list permits. A MUST NOT restriction
      attached to one role is superseded when any other role in the participant's
      `case_roles` list carries a MAY, SHOULD, or MUST for the same action class.
    note: >-
      Example: CVDRole.OBSERVER MUST NOT emit VFD transitions (CM-25-005), but
      CVDRole.DEPLOYER SHOULD emit the D transition when a fix is deployed.
      A participant holding both roles SHOULD emit VFD/D transitions, because
      DEPLOYER's SHOULD overrides OBSERVER's MUST NOT.
    rationale: >-
      CVD roles represent orthogonal functions a participant may perform. When a
      participant holds more than one function (e.g., a security researcher who
      is also a Deployer for an affected product), restricting them based on their
      least-capable role would incorrectly limit their protocol participation.
      The union model prevents role restrictions from blocking obligations that
      exist under a co-role.
    verification: Integration tests in `test/demo/` confirm that a participant holding both
      `CVDRole.OBSERVER` and `CVDRole.DEPLOYER` is permitted to emit VFD transitions because the
      DEPLOYER obligation supersedes the OBSERVER restriction.
    relationships:
    - rel_type: refines
      spec_id: CM-25-005
    adr:
    - ADR-0057
    stories:
    - story_2022_036
    - story_2022_063
- id: CM-28
  title: Embargo Invite RSVP Deadlines
  description: >-
    Requirements for the optional RSVP-by deadline carried on an embargo
    invitation, the authority relationship between that wire value and the
    CM-18-002 pocket-veto policy window, and how an expiry is recorded.
    Codified by ADR-0065. Source: IDEA-2066.
  specs:
  - id: CM-28-001
    priority: MUST
    kind: protocol
    statement: >-
      An `Invite(EmbargoEvent)` activity MAY carry an activity-level `end_time`.
      When present, `Invite.end_time` MUST be interpreted as the RSVP-by
      deadline for that invitation — the instant after which the invitation is
      no longer open. It MUST NOT be interpreted as the embargo's expiry.
    note: >-
      CRITICAL naming hazard: an embargo invitation carries TWO `end_time`
      fields one nesting level apart in the same JSON document.
      `Invite.end_time` is the RSVP-by deadline for the invitation;
      `Invite.object_.end_time` (on the nested `as_EmbargoEvent`) is when the
      embargo itself ends. Code MUST read these independently and MUST NOT
      substitute one for the other. The embargo invitation is an `as_Invite`,
      not an `as_Offer` — see `em_propose_embargo_activity()` in
      `vultron/wire/as2/factories/embargo.py`.
    rationale: >-
      `as_Object.end_time` is inherited by `as_Activity` and therefore by every
      Vultron activity, so no vocabulary extension is required. On an Activity,
      AS2 `end_time` already means "valid until", making the RSVP reading
      idiomatic rather than a repurposing. Placing the deadline on the activity
      rather than on the embargo object is what allows the same embargo to be
      offered to several actors with different deadlines, and to one actor twice.
      See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that `Invite.end_time` on an embargo
      invitation is parsed as the RSVP-by deadline for the invitation, not as the embargo's own
      expiry.
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-002
    priority: MUST
    kind: protocol
    statement: >-
      When `Invite.end_time` is present it MUST be authoritative for that
      invitation's expiry, superseding the receiver's local policy window. When
      `Invite.end_time` is absent, the CM-18-002 policy window MUST apply,
      preserving the pre-existing behaviour. Either way the resulting deadline is
      subject to the EP-07-006 ceiling.
    rationale: >-
      An explicit wire value lets both parties compute the same lapse instant
      from the same field, with no additional message exchange. A
      receiver-local-only window leaves the two parties unable to agree on
      whether an invitation is still open — the coordination ambiguity that
      motivated IDEA-2066. See ADR-0065.
    note: >-
      Amended by ADR-0096. "Authoritative" settles precedence between the wire value and the
      receiver's local policy window; it does not exempt the wire value from EP-07-006, which
      clamps any computed deadline down to the embargo's own `end_time`. CM-28-011 binds the same
      ceiling to the CM-18-002 fallback path. An explicit `Invite.end_time` that outlives the
      embargo is still clamped.
    verification: Integration tests in `test/demo/` confirm that when `Invite.end_time` is
      present it is used as the authoritative invitation expiry, that when absent the configured
      policy window from CM-18-002 is applied, and that in both cases the effective deadline is
      clamped down to the embargo's `end_time` where it would otherwise overshoot it.
    relationships:
    - rel_type: refines
      spec_id: CM-18-002
    - rel_type: depends_on
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-003
    priority: MUST
    kind: protocol
    statement: >-
      The actor holding `CVDRole.CASE_MANAGER` MUST be the enforcement authority for
      embargo invite expiry.
    note: >-
      The `EmbargoTimerExpired` Sentinel (#1893) is an OPTIONAL proactive
      accelerator that narrows the gap between the deadline and the recorded
      lapse. It MUST NOT be a prerequisite for CM-28 conformance.
    rationale: >-
      Centralising enforcement at the CASE_MANAGER matches the case-communication model
      (PCR-08) and the CASE_MANAGER's role as canonical ledger author (ADR-0019, ADR-0021).
      See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that the CASE_MANAGER holding
      `CVDRole.CASE_MANAGER` is the entity that records a PEC `DECLINED` transition when an
      embargo invitation lapses.
    adr:
    - ADR-0065
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-28-004
    priority: MUST
    kind: protocol
    statement: >-
      An expired invitation MUST be recorded as the consent row's `EXPIRED` state via the `EXPIRE` trigger (`INVITED → EXPIRED`), never as `DECLINED`. `DECLINED` MUST be reached only by an explicit refusal, so the consent row distinguishes "never responded" from "explicitly declined".
    rationale: >-
      A participant that did not answer made no decision, and code, logs, demos and replicas read
      the consent row, not ledger provenance (ADR-0118). An expired participant is re-invitable
      (CM-18-003), excluded from embargoed content like any non-signatory (CM-10-004), and made a
      signatory by a late Accept the CASE_MANAGER honours (EMB-17-002). ADR-0118 reverses ADR-0065
      part 5, which chose `DECLINED`.
    note: >-
      "Invitation" here is an `Invite(EmbargoEvent)`. An expired stub Invite
      (`Invite(Actor, VulnerabilityCaseStub)`) carries embargo terms but changes
      no participant state, consent included (CM-11-014): an unanswered stub is
      not a refusal to join, and the CASE_MANAGER may re-invite on the same
      record (CM-11-015, ADR-0114).
    verification: >-
      A unit test confirms that the CASE_MANAGER's expiry evaluation moves an `INVITED` participant
      past its deadline to `EXPIRED`, not `DECLINED`, and that `DECLINE` is not applied on the timer
      path.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0065
    - ADR-0118
    stories:
    - story_2022_027
    - story_2022_014
  - id: CM-28-005
    priority: MUST
    kind: protocol
    statement: >-
      An expired embargo invitation MUST be distinguishable from an explicit refusal both in the participant's consent row (`EXPIRED` versus `DECLINED`, CM-28-004) and in the canonical case
      ledger (CM-28-009).
    rationale: >-
      The canonical ledger is the project's history mechanism (ADR-0019), so expiry-versus-refusal
      is recoverable from it; since ADR-0118 the consent row carries the distinction too, so a
      reader that consults only the participant record also sees it. See ADR-0065, ADR-0118.
    verification: >-
      Inspection of `vultron/core/` confirms that the expired-invitation ledger entry type
      (`invite_to_embargo_on_case_expired`) differs from the `Reject(Invite(EmbargoEvent))` entry
      type used for explicit refusals, and that the participant records `EXPIRED` rather than
      `DECLINED`.
    adr:
    - ADR-0065
    stories:
    - story_2022_045
    - story_2022_074
  - id: CM-28-006
    priority: MUST
    kind: protocol
    statement: >-
      An inbound `Invite.end_time` MUST be normalised to UTC before any
      comparison against the current time, per CS-13-001. A naive (non
      timezone-aware) `Invite.end_time` MUST be normalised to UTC at the wire
      edge per ADR-0032, so that downstream comparisons are always against
      timezone-aware values.
    note: >-
      CS-13-001 governs datetimes the application *produces*; an inbound
      `end_time` is produced by a remote peer and may legitimately carry a
      non-UTC offset (e.g. `+05:00`). Normalising on receipt keeps deadline
      comparison correct without requiring peers to send `Z`. ADR-0032
      (`validate_datetime` on `as_Object`) ensures all datetime fields —
      including `end_time` — are UTC-aware before leaving the wire layer, so
      naive values are never forwarded to the extractor or core.
    rationale: >-
      A deadline compared in the wrong timezone lapses at the wrong instant,
      breaking the bilateral determinism CM-28-002 exists to provide. ADR-0032's
      edge normalisation (naive → UTC) prevents this without per-field guarding
      in the extractor. See CS-13-001 through CS-13-005 and ADR-0065.
    verification: A unit test confirms that a naive `Invite.end_time` is normalised to UTC
      by `validate_datetime` at the wire edge and produces a valid
      `rsvp_deadline` (not rejected or dropped).
    relationships:
    - rel_type: refines
      spec_id: CS-13-001
    adr:
    - ADR-0065
    - ADR-0032
    lint_suppress:
    - missing_story_reference
  - id: CM-28-007
    priority: MUST
    kind: project
    statement: >-
      Embargo invite expiry MUST be evaluated lazily: expiry is derived from `(end_time, now)`
      whenever a participant's consent rows are read or an inbound `Accept`/`Reject` for the invitation
      is processed.
    rationale: >-
      Lazy derivation from an explicit deadline is deterministic and requires no new
      infrastructure. No scheduler exists in production, and the Sentinel invocation
      model remains an open question (notes/coordination-agents.md). See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that embargo invite expiry is evaluated
      lazily at read or process time from `(end_time, now)` rather than via a scheduled job.
    relationships:
    - rel_type: refines
      spec_id: CM-28-003
    adr:
    - ADR-0118
    - ADR-0065
  - id: CM-28-008
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      Implementations MUST NOT require a scheduler or Sentinel runtime for embargo invite
      expiry correctness.
    rationale: >-
      No scheduler exists in production; making correctness depend on one would render
      conformance impossible without new infrastructure. The Sentinel is an optional
      accelerator only. See ADR-0065.
    relationships:
    - rel_type: refines
      spec_id: CM-28-003
    adr:
    - ADR-0065
  - id: CM-28-009
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST author a distinct ledger entry to record an expired invitation,
      different from the `Reject(Invite(EmbargoEvent))` entry used to record an explicit refusal.
    rationale: >-
      The ledger entry makes expiry-versus-refusal distinguishable in the ledger (CM-28-005), and it
      is how a replica learns the `EXPIRED` state without computing it (CM-28-014); authoring a
      single entry type for both events would conflate them. See ADR-0065, ADR-0118.
    verification: >-
      Inspection of `vultron/core/` confirms that the expired-invitation ledger entry
      (`INVITE_EXPIRED_EVENT_TYPE`, snapshot type `Expire`) is authored as a distinct entry type
      separate from the `Reject(Invite(EmbargoEvent))` entry.
    relationships:
    - rel_type: refines
      spec_id: CM-28-005
    adr:
    - ADR-0065
    stories:
    - story_2022_045
    - story_2022_074
  - id: CM-28-010
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The expiry-versus-refusal provenance MUST NOT be duplicated onto a consent row as
      a reason field.
    rationale: >-
      A `reason` discriminator on a consent row — which holds only the embargo id and the
      state — would be a second source of truth able to drift from the ledger. The canonical
      ledger is the sole record of provenance (ADR-0019). See ADR-0065.
    relationships:
    - rel_type: refines
      spec_id: CM-28-005
    adr:
    - ADR-0065
  - id: CM-28-011
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CM-18-002 policy window MUST NOT be applied so as to place the effective RSVP
      deadline after the embargo's own `end_time`. Where the window would overshoot, the
      deadline is the embargo's `end_time`.
    rationale: >-
      The policy window is an absolute duration (default 7 days) measured from the
      invitation's `published` timestamp, with no reference to the embargo it concerns.
      Applied to a short embargo it produces a pocket veto that fires after the embargo has
      already ended, recording an expiry for a decision that no longer exists. EP-07-006
      states the general rule; this requirement binds the specific fallback path CM-18-002
      defines. See ADR-0096.
    verification: >-
      A unit test confirms that when the CM-18-002 policy window would place the deadline
      after the embargo's `end_time`, the embargo's `end_time` is used instead.
    relationships:
    - rel_type: refines
      spec_id: CM-18-002
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-012
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER relays an `Invite(EmbargoEvent)` to a participant (EP-09-002) it
      MUST set `Invite.end_time` to that Invite's `published` time plus the configured RSVP
      window, subject to the EP-07-002 minimum and the EP-07-006 ceiling. The Invites of one
      relay round are emitted in sequence and need not share one deadline.
    rationale: >-
      No trigger put a deadline on the wire, so every receiving store fell to the EP-07-001
      fallback and derived a deadline from its own `ActorConfig` window, and two replicas
      could disagree about when the same invitation closed. The relaying CASE_MANAGER is the
      enforcement authority (CM-28-003); it states the deadline once and everyone reads the
      same number off the same object, which is also what ASK-03-004 requires of an ask
      (#3918, ADR-0113 as amended).
    verification: >-
      A test of the relay asserts every emitted Invite carries `end_time` equal to its
      `published` plus the configured window, clamped per EP-07-002 and EP-07-006. Until the
      implementation lands the test is a strict `xfail` naming its tracking issue.
    relationships:
    - rel_type: refines
      spec_id: CM-28-002
    - rel_type: depends_on
      spec_id: EP-09-002
    - rel_type: depends_on
      spec_id: EP-07-002
    - rel_type: depends_on
      spec_id: EP-07-006
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-013
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record the RSVP deadline on the invitee's participant record at
      its commit of the Invite emission, and the replica apply node for that entry MUST
      record the same deadline (EP-09-007). A participant MUST NOT derive or store an RSVP
      deadline on receipt of an Invite (EP-09-003).
    rationale: >-
      The deadline is case state about the invitee; like every other case state it is written
      once by the CASE_MANAGER and reaches replicas through the ledger (ADR-0108). Writing it
      at receipt was the one-store shape ADR-0113 retired for EM (#3918).
    verification: >-
      A test asserts the invitee's `invite_rsvp_deadline` is set in the CASE_MANAGER's store
      when the Invite emission is committed and in a replica's store when the entry is
      replayed, and is unset on a participant that received the Invite directly. Until the
      implementation lands the tests are strict `xfail`s naming their tracking issue.
    relationships:
    - rel_type: depends_on
      spec_id: CM-28-012
    - rel_type: depends_on
      spec_id: EP-09-007
    - rel_type: refines
      spec_id: EP-09-003
    adr:
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-014
    priority: MUST
    kind: protocol
    statement: >-
      Only the CASE_MANAGER evaluates invite expiry (CM-28-003). The expired-invitation ledger entry
      (CM-28-009) MUST be committed behind the CASE_MANAGER role gate (BT-17-001) and MUST have a
      replica apply node reachable from `create_announce_log_entry_tree` (RSH-08-004); a replica
      learns an expiry from that entry and never computes one.
    rationale: >-
      The expiry commit ran unconditionally in whichever store processed a late `Accept`, so a
      non-manager could author a ledger entry, and no replay node existed for the event type, so an
      expiry recorded by the manager reached no replica (#3918).
    verification: >-
      A test runs the late-`Accept` path as a non-manager and asserts no expiry entry is committed;
      a test replays an `invite_to_embargo_on_case_expired` entry into a replica and asserts the
      participant reads `EXPIRED`. Until the implementation lands the tests are strict `xfail`s
      naming their tracking issue.
    relationships:
    - rel_type: refines
      spec_id: CM-28-009
    - rel_type: depends_on
      spec_id: RSH-08-004
    - rel_type: depends_on
      spec_id: BT-17-001
    adr:
    - ADR-0118
    - ADR-0113
    stories:
    - story_2022_014
    - story_2022_027

- id: CM-27
  title: Case Collection Mutation Discipline
  description: >-
    Requirements governing post-construction mutation of the case collections
    whose items exist in incompatible wire and core shapes. `validate_assignment`
    does not cover in-place mutation — `list.append` is not an attribute
    assignment, so Pydantic never observes it — so these collections need a
    separate prohibition. Codified by ADR-0064. Source: CONCERN-2261.
  specs:
  - id: CM-27-001
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/architecture/test_validate_assignment_ratchet.py` scans every core
      module for a direct `case_participants` or `case_statuses` write —
      attribute assignment or in-place list mutation — outside the canonical
      mutator module and fails on any hit; its backlog test pins the enumerated
      set in both directions so a new violation and a stale entry both fail.
    statement: >-
      Core code under `vultron/core/` MUST NOT mutate `case_participants` or
      `case_statuses` directly on a `VulnerabilityCase` instance after
      construction (e.g. `case.case_participants.append(...)`,
      `case.case_statuses = [...]`). The canonical mutators on
      `VulnerabilityCase` MUST be used for all post-construction changes. The
      mutator methods themselves, in `vultron/core/models/case.py`, are exempt.
    rationale: >-
      A wire-shaped participant or status appended to a core-typed list does not
      raise when read — it reads as absent, and readers substitute an initial
      state, silently resetting the case's ladder (#2232, #2264).
      `validate_assignment` cannot close this door because `append` is not an
      assignment. This mirrors PRM-03-001, whose identical prohibition drove
      direct `case_roles` mutation in `vultron/` to zero sites.
    relationships:
    - rel_type: refines
      spec_id: ARCH-21-001
    adr:
    - ADR-0064
  - id: CM-27-002
    priority: MUST
    kind: project
    statement: >-
      Passing `case_participants=[...]` or `case_statuses=[...]` as a constructor
      argument when creating a `VulnerabilityCase` is permitted and does not
      violate CM-27-001; the prohibition applies only to post-construction
      mutation.
    rationale: >-
      Constructor arguments are validated, which is precisely the guarantee
      CM-27-001 exists to restore. This clarification prevents over-application
      of the rule, mirroring PRM-03-002.
    verification: Inspection of `vultron/core/models/case.py` confirms that constructor-time
      `case_participants` and `case_statuses` arguments pass through Pydantic validation,
      consistent with the post-construction mutation prohibition in CM-27-001.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
    adr:
    - ADR-0064
  - id: CM-27-003
    priority: MUST
    kind: project
    statement: >-
      `VulnerabilityCase` MUST expose a canonical mutator for appending a case
      status, so that CM-27-001 can be satisfied without direct list mutation.
      `add_participant()` already provides this for `case_participants`;
      removal keeps the record on the roster (CM-31-001), so the roster has no
      deleting mutator.
    rationale: >-
      A prohibition with no sanctioned alternative is unimplementable. At the
      time of writing `case_statuses` had no mutator at all — only the
      `current_status` and `case_status` readers — so the rule requires one to be
      added.
    verification: Inspection of `vultron/core/models/case.py` confirms that `VulnerabilityCase`
      exposes a canonical mutator method for appending a case status to `case_statuses`.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
    adr:
    - ADR-0064
- id: CM-29
  title: Case Status Recency Resolution
  description: Rules for determining which CaseStatus snapshot is the most recent
    when multiple snapshots exist in the case_statuses history.
  specs:
  - id: CM-29-001
    priority: MUST
    kind: project
    statement: >-
      `VulnerabilityCase.current_status` MUST determine the most-recent
      `CaseStatus` by comparing `updated` then `published` timestamps only.
      The `id_` field MUST NOT be used as a sort tiebreaker.
    rationale: >-
      Using `id_` as a fallback when timestamps are absent produces
      scheme-dependent ordering: auto-seeded statuses carry UUID-based IDs
      (`urn:uuid:…`, starting with `'u'`) which sort lexically higher than
      HTTPS-scheme IDs (`https://…`, starting with `'h'`), causing the
      initial auto-seeded status to beat a legitimately newer received status
      when both lack explicit timestamps. ID scheme is an implementation
      artefact, not a time proxy. When timestamps are absent or equal, the
      fallback MUST resolve to the earliest possible time (e.g., `datetime.min`)
      so that timestampless statuses sort to the bottom rather than the top.
      Source: #2737.
    verification: >-
      Unit test the ordering key `status_recency_key` in
      `vultron/core/models/_helpers.py` directly, since that is where both the
      `current_status` and the wire `as_CaseStatus` readers converge. Construct
      two status projections that carry no `updated`/`published` timestamps —
      one with a `urn:uuid:` ID and one with an `https://` ID — and assert the
      key orders them by neither ID scheme (both must sort to the bottom via the
      `datetime.min` fallback). Note: only the wire-side projection can actually
      present timestampless statuses; core `CaseStatus` re-narrows `published`
      and `updated` to non-`Optional` aware datetimes via `CoreObject`, so the
      timestamp-absent branch is unreachable defensive code on the core path and
      only exercisable on the `as_CaseStatus` wire branch.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
- id: CM-30
  title: Sender Entitlement for Case Content Changes
  description: >-
    Who may remove a note from a case or attach a report to it. Neither message has a
    trigger today; these entries name the sender a receiver accepts (HP-01-006).
  specs:
  - id: CM-30-001
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on `Remove(Note)[target=VulnerabilityCase]` only when the
      sender is the note's author and an active participant (CM-10-004), or the case's Case
      Owner; a participant replica MUST apply the removal only from the CASE_MANAGER
      (PCR-03-001). Any other sender MUST be refused with the note left in the case.
    rationale: >-
      The handler removes any note for any sender. An author may withdraw its own note, and
      the Case Owner may remove anyone's; nobody else has a reason to. See #3733.
    verification: >-
      A test marked `CM-30-001`
      sends the Remove from an actor that is neither the author nor the Case Owner and
      asserts `REFUSED` with the note still in the case.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0115
  - id: CM-30-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on `Add(VulnerabilityReport)[target=VulnerabilityCase]`
      only when the sender is the case's Case Owner; a participant replica MUST apply the
      addition only from the CASE_MANAGER (PCR-03-001). Any other sender MUST be refused
      with the case's reports unchanged.
    rationale: >-
      The handler appends any report id to any case for any sender. See #3733.
    verification: >-
      A test marked `CM-30-002`
      sends the Add from a non-owner and asserts `REFUSED` with the report not attached.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0115
- id: CM-31
  title: Participant Removal and Reinstatement
  description: >-
    Removing a participant withdraws its entitlement to case content and keeps its record. The Case
    Owner requests removal and reinstatement; the CASE_MANAGER applies them, records each as one ledger
    entry, and tells the affected participant directly (ADR-0116).
  specs:
  - id: CM-31-001
    priority: MUST
    kind: protocol
    statement: >-
      Removing a participant MUST record a removal fact on its `CaseParticipant` and MUST NOT delete the
      record from `case_participants`. The participant's status history and the ledger entries it
      authored MUST remain, and a removed participant MUST be inert (CM-10-004).
    rationale: >-
      Deleting the record erases who took part in the case and leaves ledger entries naming an actor
      the roster no longer holds. Removal is a decision about entitlement to case content, not about
      membership, so it is a fact the active check reads (ADR-0116).
    verification: >-
      A received-side test applies a Case Owner's `Remove(CaseParticipant)` at the CASE_MANAGER and
      asserts the participant is still in `case_participants` and `actor_participant_index` and is
      not active.
    relationships:
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-002
    priority: MUST
    kind: architecture
    statement: >-
      Whether a participant is active MUST be computed by one case-level check from stored facts —
      the CM-10-004 definition: joined (seated by case initialization or accepted the stub Invite),
      not removed, and a signatory to the active embargo (its consent row for it is `ACCEPTED`) when an embargo is active — and MUST NOT be stored. RM `CLOSED`
      is not an input (#4100). A participant-level
      property MUST NOT compute a partial answer under a name that reads as "active".
    rationale: >-
      An inferred status that is stored goes stale whenever one of its inputs changes without
      rewriting it; the precedent is signatory and lapsed consent (CM-18-001). Whether an embargo is
      active is case state a participant record cannot see, so the full answer lives on the case. A
      partial participant-level property would read as "active" at a send site and leak embargoed
      content to a non-signatory.
    verification: >-
      Inspection confirms no stored field holds the active answer and that the shared recipient
      selection (CM-10-007) calls the one case-level check.
    relationships:
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0116
  - id: CM-31-003
    priority: MUST
    kind: protocol
    statement: >-
      `VulnerabilityCase` MUST expose a computed `activeParticipants` collection on the wire holding
      exactly the participants the CM-31-002 check finds active. It MUST NOT be stored, and reading a
      serialized case back in MUST recompute it rather than refuse it as an unknown key; a supplied
      value that contradicts the recomputed one is refused (ARCH-23-005).
    rationale: >-
      `case_participants` stays the full roster that role resolution and `actor_participant_index`
      read (CM-19-001). Publishing the active set as its own collection makes
      `Remove(CaseParticipant)` literally true: the participant leaves that collection. Core types
      refuse unknown keys on input, so a computed field in the dump refuses the case's own serialized
      form unless input handles it.
    verification: >-
      A unit test asserts `activeParticipants` lists active participants only, and that a case dumped
      by alias validates back to an equal case.
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-004
    priority: MUST
    kind: protocol
    statement: >-
      `Remove(CaseParticipant, target=VulnerabilityCase)` is the Case Owner's request to the
      CASE_MANAGER to remove a participant from active participation. The CASE_MANAGER MUST refuse it
      (`HandlerResult.refused`) when the sender does not hold `CVDRole.CASE_OWNER`, when the named
      participant holds `CVDRole.CASE_MANAGER` or `CVDRole.CASE_OWNER`, or when it names no participant
      of the case, and MUST report a removal of an already-removed participant as skipped. The
      CASE_MANAGER MUST NOT remove a participant on its own initiative.
    rationale: >-
      The Case Owner decides who takes part in the case; the CASE_MANAGER applies case changes and
      decides none (ADR-0108). The CASE_MANAGER role is never unfilled (CM-24-006), and the Case Owner
      leaves only by transferring ownership (CM-21). A participant that wants to stop taking part
      sends `Leave(VulnerabilityCase)` (CM-23), not `Remove`.
    verification: >-
      Received-side tests assert a removal from a non-owner, of the CASE_MANAGER, and of the Case
      Owner is refused, a repeat removal is skipped, and a removal from the Case Owner is applied.
    relationships:
    - rel_type: depends_on
      spec_id: PCR-03-006
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-005
    priority: MUST
    kind: protocol
    statement: >-
      An accepted removal MUST be recorded as exactly one ledger entry: the Case Owner's received
      `Remove(CaseParticipant)`, committed by the receive pipeline (CLP-10-006).
      `("Remove", "CaseParticipant")` MUST be a canonical ledger signature, and the CASE_MANAGER MUST
      NOT commit a second entry of its own for the same removal.
    rationale: >-
      One move gets one entry, authored by the actor that made it, so the ledger shows the removal as
      the Case Owner's decision rather than the CASE_MANAGER acting alone (ADR-0108). Without the
      canonical signature a removal cannot be committed, so it never reaches a replica.
    verification: >-
      A test asserts `("Remove", "CaseParticipant")` is a canonical signature and that an accepted
      removal grows the ledger by one entry whose snapshot is the Case Owner's activity.
    relationships:
    - rel_type: depends_on
      spec_id: CLP-10-006
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-006
    priority: MUST
    kind: protocol
    statement: >-
      After committing a removal the CASE_MANAGER MUST send the removed participant a direct
      `Remove(CaseParticipant)` naming it, with `actor` the CASE_MANAGER and `attributedTo` the Case
      Owner (CM-24), and MUST NOT ledger that notice. The removal entry's fan-out MUST include the
      removed participant, and MUST be the last canonical entry it is sent, by fan-out or by replay,
      until it is reinstated.
    rationale: >-
      Learning of removal only from silence is indistinguishable from a network fault, and the removed
      party needs to know it is still bound and how it will hear of the embargo's end. The notice is
      delivery, not a second record of the move; the ledger entry keeps the removed party's replica
      continuous up to the removal.
    verification: >-
      A received-side test asserts the CASE_MANAGER's outbox holds a `Remove(CaseParticipant)`
      addressed to the removed participant and an `Announce(CaseLedgerEntry)` of the removal addressed
      to it, and that an entry committed afterwards is not addressed to it.
    relationships:
    - rel_type: depends_on
      spec_id: CM-31-005
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-007
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST apply a removal from its ledger entry through a replica apply node, recording the
      same removal fact the CASE_MANAGER recorded (RSH-08-004). A replica MUST NOT apply a removal from a directly received `Remove(CaseParticipant)`
      (RSH-08-003).
    rationale: >-
      Replicas take case state from the ledger. The direct notice tells the removed party what
      happened; the entry is what changes every replica, the removed party's included.
    verification: >-
      A test announces a removal entry to a replica and asserts the participant's record remains,
      carries the removal fact, and is not active on the replica.
    relationships:
    - rel_type: depends_on
      spec_id: RSH-08-004
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-008
    priority: MUST
    kind: protocol
    statement: >-
      Removal MUST NOT change the participant's embargo consent rows. A removed
      signatory remains bound by the embargo it accepted.
    rationale: >-
      Releasing a removed participant from the embargo would reward the conduct that got it removed.
      Consent is the participant's own statement (CM-18-005); removal is a separate fact.
    verification: >-
      A received-side test removes a signatory and asserts its consent rows are unchanged.
    relationships:
    - rel_type: constrains
      spec_id: CM-18-005
    adr:
    - ADR-0116
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-31-009
    priority: MUST
    kind: protocol
    statement: >-
      When the active embargo is terminated (including by the case becoming public) or replaced by a
      shorter revision, the CASE_MANAGER MUST send every `SIGNATORY` participant the ledger fan-out
      does not reach — removed (CM-31-001), or at RM `CLOSED` and skipped by the CM-23-004 fan-out —
      a direct notice outside the ledger stream:
      `Remove(EmbargoEvent)` for a termination, `Announce(EmbargoEvent)` with the new terms for a
      shorter revision. The notice MUST carry no other case content. No notice is owed for a longer
      revision or for expiry on the agreed date.
    rationale: >-
      A participant that stopped receiving case content while bound stays bound, and without this it
      never learns that the obligation ended early or shortened. A longer revision does not bind a
      participant that never agreed to it, and expiry on the agreed date is already known to it. A
      past-dated `Announce(EmbargoEvent)` is not used: its meaning would depend on the receiver's
      clock, and an early end is an event, not a date that passed. "Shorter" and "longer" follow the
      EP-05-001 split: a revision that ends at the same time as the embargo it replaces is on the
      carry-over arm, so the bound participant is bound by it and is sent it like a shorter one.
    verification: >-
      Tests terminate the embargo and activate a shorter revision on a case with a removed signatory
      and a departed signatory, and assert each is sent the matching notice and no ledger entry;
      a declined or never-joined participant is sent nothing.
    relationships:
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0116
    - ADR-0093
    stories:
    - story_2022_014
  - id: CM-31-010
    priority: MUST
    kind: protocol
    statement: >-
      A participant whose ledger stream is paused — withheld under CM-10-005, removed (CM-31-001), or
      skipped at RM `CLOSED` (CM-23-004) — MUST apply a CM-31-009 notice sent by the CASE_MANAGER
      for the case, and MUST ignore one from any other sender. Replaying the corresponding ledger entry
      after the participant becomes active again MUST change nothing further.
    rationale: >-
      A paused replica cannot take the change from the ledger, so the notice is its only channel. The
      exception is to the channel, not the authority: the notice still originates from the
      CASE_MANAGER (PCR-03-001).
    verification: >-
      A received-side test applies the notice at a removed participant's replica and asserts the
      embargo ended; the same notice from a non-manager changes nothing; a later replay of the entry
      leaves the replica unchanged.
    relationships:
    - rel_type: refines
      spec_id: RSH-08-003
    adr:
    - ADR-0116
    stories:
    - story_2022_014
  - id: CM-31-011
    priority: MUST
    kind: protocol
    statement: >-
      `Add(CaseParticipant, target=VulnerabilityCase)` is the Case Owner's request to the CASE_MANAGER
      to reinstate a removed participant. It MUST follow the CM-31-004 through CM-31-007 pipeline
      (Case Owner only, one ledger entry, a direct notice, a replica apply node), MUST clear the
      removal fact, and MUST NOT require the participant to accept again. The CASE_MANAGER MUST refuse
      an `Add` naming a participant that is not removed or that never joined.
    rationale: >-
      Owners make mistakes and disputes resolve, so removal is reversible. The participant never
      withdrew, so it does not rejoin; `Leave` remains open to it. Joining requires accepting a stub
      Invite (ADR-0114), and `Add` must not become a way around that. A participant reinstated into a
      case whose embargo it has not accepted stays inert, and its CM-10-006 backfill waits for its
      consent.
    verification: >-
      Received-side tests assert the Case Owner's `Add` reinstates a removed participant, and that an
      `Add` naming a never-joined invitee or a participant that is not removed is refused.
    relationships:
    - rel_type: depends_on
      spec_id: CM-31-004
    adr:
    - ADR-0116
    stories:
    - story_2022_052
  - id: CM-31-012
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT emit `Add(CaseParticipant)`, or commit an `add_case_participant` ledger
      entry, as a consequence of an invitee accepting the stub Invite. A replica creates the
      invitee's inert record from the stub Invite's ledger entry (CM-11-006) and marks it joined
      from the `Accept(Invite)` entry.
    rationale: >-
      CM-17-004 does not call for it, the `Accept(Invite)` entry already carries the change, and a
      replica usually refuses the direct message for want of the participant record it names. It also
      records one move twice, and `Add(CaseParticipant)` now means reinstatement only (CM-31-011).
    verification: >-
      A test drives an invitee's stub-Invite acceptance at the CASE_MANAGER and asserts no
      `Add(CaseParticipant)` is enqueued and no `add_case_participant` entry is committed.
    relationships:
    - rel_type: refines
      spec_id: CM-17-004
    adr:
    - ADR-0116
    stories:
    - story_2022_052
  - id: CM-31-013
    priority: MUST
    kind: protocol
    statement: >-
      A removed participant MUST NOT be sent a stub Invite, a full-case Invite, or an embargo Invite;
      the CM-31-009 notices are its only exception. When a participant is reinstated into a case with
      an active embargo it has not accepted, the CASE_MANAGER MUST send it that embargo's Invite.
    rationale: >-
      Invites reach inert participants because they ask them to join or consent (CM-10-007). A removed
      participant was taken out by the Case Owner's decision; inviting it to vote on embargo revisions
      would undo that decision. A reinstated participant that is not `SIGNATORY` stays inert until it
      consents, so it must be asked.
    verification: >-
      Tests assert the embargo-Invite recipient selection excludes a removed participant, and that
      reinstating a participant that is not `SIGNATORY` to the active embargo enqueues that embargo's
      Invite to it.
    relationships:
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0116
    stories:
    - story_2022_023
- id: CM-32
  title: Case Split — Child Case Creation, Links, Inheritance, and Sibling Notices
  description: >-
    How the parent case's Case Owner splits off a child case through the parent's CASE_MANAGER,
    what the child records and inherits, how its participants stay apart from the parent, and how
    the cases of one split family tell each other about embargo changes (ADR-0125, VP-10).
  specs:
  - id: CM-32-001
    priority: MUST
    kind: protocol
    statement: >-
      A case split MUST be requested by the parent case's Case Owner sending `Create(CaseProposal)`
      to the parent's CASE_MANAGER, with the activity's `context` naming the parent case. The
      CASE_MANAGER MUST act on a split proposal only when its sender holds `CASE_OWNER` on the
      parent case; a split proposal from any other sender MUST be refused, with no case created
      and the parent unchanged.
    rationale: >-
      The parent's Owner decides what the parent's coordination becomes, as it does for an
      ownership transfer or a merge (ADR-0053, ADR-0105). The parent `context` is what tells a
      split apart from a report-born proposal, whose sender entitlement differs (HP-01-006).
    verification: >-
      A test marked `CM-32-001` sends a split proposal from a parent participant that does not hold
      `CASE_OWNER` and asserts `REFUSED` with no child case stored and the parent's `child_cases`
      empty, and sends it from the Owner and asserts a child is created.
    stories:
    - story_2022_104
    - story_2022_105
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CP-05-002
    adr:
    - ADR-0125
  - id: CM-32-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST answer a split proposal as it answers any `Create(CaseProposal)`
      (CP-05): `Accept(CaseProposal)` naming the child case in `result`, then
      `Create(VulnerabilityCase)` for the child, both addressed to the Owner; or
      `Reject(CaseProposal)`. A redelivered split proposal with the same proposal identifier
      MUST NOT create a second child case (CP-05-006).
    rationale: >-
      Reusing the proposal answer gives the split the admission decision, the durable-delivery
      marker and the duplicate handling the creation flow already has, rather than a second
      creation path to keep in step with it.
    verification: >-
      A test marked `CM-32-002` delivers one split proposal twice and asserts one child case, an
      `Accept(CaseProposal)` whose `result` names it, and one `Create(VulnerabilityCase)` for it.
    stories:
    - story_2022_104
    relationships:
    - rel_type: depends_on
      spec_id: CP-05-003
    - rel_type: depends_on
      spec_id: CP-05-006
    adr:
    - ADR-0125
  - id: CM-32-003
    priority: MUST
    kind: protocol
    statement: >-
      The parent's CASE_MANAGER MUST create the child case in its own store and MUST be the child's
      CASE_MANAGER. The child's `attributed_to` MUST be the Case Owner that requested the split, and
      its genesis hash MUST be derived from the child's own ID, creation time and Owner
      (CLP-08-002), never from the parent's.
    rationale: >-
      The split creates a case like any other (CM-22-001, ADR-0041), so the child has a
      CASE_MANAGER from creation (CM-24-006) and a ledger of its own that shares no chain with
      the parent's. Hosting the whole family at one CASE_MANAGER (CM-32-016) is what lets
      siblings be read from the parent (CM-32-006).
    verification: >-
      A test marked `CM-32-003` splits a case and asserts the child's `attributed_to` is the
      splitter, the CASE_MANAGER participant of the child is the parent's CASE_MANAGER, and the
      child's genesis hash differs from the parent's and matches the CLP-08-002 derivation over the
      child's own inputs.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: depends_on
      spec_id: CLP-08-002
    adr:
    - ADR-0125
    - ADR-0117
  - id: CM-32-004
    priority: MUST
    kind: protocol
    statement: >-
      A child case MUST be created with `parent_cases` holding exactly the parent case's ID, and
      with `child_cases` and `sibling_cases` empty. The cross-references MUST be case IDs, never
      embedded cases.
    rationale: >-
      The child must know the case its embargo came from, so its CASE_MANAGER can route VP-10
      notices. IDs, not embedded cases, because related cases are the exception ADR-0017 made to
      the full-object rule.
    verification: >-
      A test marked `CM-32-004` splits a case and asserts the child's `parent_cases` is the parent ID
      alone and its other two link fields are empty, on the CASE_MANAGER and on the Owner's replica.
    stories:
    - story_2022_104
    adr:
    - ADR-0125
  - id: CM-32-005
    priority: MUST
    kind: protocol
    statement: >-
      After committing the child case's creation entry, the CASE_MANAGER MUST add the child's ID to
      the parent case's `child_cases` and commit that change as one entry in the parent's ledger.
      A parent replica MUST take the child link from that entry. A split MUST NOT write
      `sibling_cases` on any case.
    rationale: >-
      Ordering the parent entry after the child's creation means the parent never names a case that
      does not exist. One write per split keeps the links consistent: no existing sibling changes
      when a new child appears, and `sibling_cases` stays free for the merge spec (ADR-0105).
    verification: >-
      A test marked `CM-32-005` splits a case and asserts the parent's ledger gains one entry naming
      the child, committed after the child's creation entry, that a parent replica replaying it
      holds the child in `child_cases`, and that no case's `sibling_cases` changed.
    stories:
    - story_2022_104
    relationships:
    - rel_type: depends_on
      spec_id: CLP-02-001
    adr:
    - ADR-0125
    - ADR-0124
  - id: CM-32-006
    priority: MUST
    kind: protocol
    statement: >-
      A split family MUST be read as a parent case together with the cases its `child_cases`
      lists, and a child's siblings as the other cases in its parent's `child_cases`. A case
      that is both a child and a parent belongs to both families, and a notice it owes under
      CM-32-013 or CM-32-014 goes to every other member case of each. Only a split writes
      `child_cases` (CM-32-005): a case merge MUST NOT record a merged case there, so that
      merged cases never join a split family.
    rationale: >-
      The parent stays open after a split, so it is coordinated alongside its children and
      counts as their sibling for VP-10-002 and VP-10-003. Reading siblings from the parent
      needs no stored sibling list, because one CASE_MANAGER hosts the parent and every child
      (CM-32-003, CM-32-016). Keeping merges out of `child_cases` leaves the merge spec the
      other two link fields (ADR-0105).
    verification: >-
      A test marked `CM-32-006` splits one case twice and splits the first child again, and
      asserts the notice recipient cases computed for the first child are the parent, the
      second child and the grandchild.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: VP-10-002
    - rel_type: refines
      spec_id: VP-10-003
    adr:
    - ADR-0125
  - id: CM-32-007
    priority: MUST
    kind: protocol
    statement: >-
      When the parent case has an active embargo at the split, the child MUST be created with
      a new `EmbargoEvent` of its own, scoped to the child, carrying the active embargo's end
      time and active from creation, with the child Owner's consent row for that embargo
      written `AGREED`, so the Owner reads as its signatory (ADR-0122). The parent embargo's
      consent rows MUST NOT carry over, and the parent's open proposals and revisions MUST NOT
      be inherited.
    rationale: >-
      VP-10-005 transfers the embargo; ADR-0125 limits the transfer to its terms. A new embargo
      object keeps consent per (participant, embargo) (ADR-0122): a child participant consents to
      the child's embargo, and its answer says nothing about the parent's.
    verification: >-
      A test marked `CM-32-007` splits a case with an active embargo and an open revision and
      asserts the child's register holds one active embargo with a new ID and the parent's end
      time, the Owner's consent row on it `AGREED`, no other consent row, and no open
      proposal.
    stories:
    - story_2022_105
    relationships:
    - rel_type: refines
      spec_id: VP-10-005
    - rel_type: constrains
      spec_id: CM-14-010
    adr:
    - ADR-0125
    - ADR-0122
  - id: CM-32-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the parent case has no active embargo at the split, the child MUST NOT be given an
      embargo, and the creation-time default embargo initialization (CM-14-010, EP-04-012) MUST NOT
      run for it.
    rationale: >-
      The child inherits the parent's embargo state, not a default: a parent whose embargo has ended
      or was never agreed must not gain an embargoed child the parent's participants never agreed to.
    verification: >-
      A test marked `CM-32-008` splits a case whose embargo has exited and asserts the child's EM
      state is `NONE` with an empty embargo register.
    stories:
    - story_2022_105
    relationships:
    - rel_type: refines
      spec_id: VP-10-005
    - rel_type: constrains
      spec_id: CM-14-010
    adr:
    - ADR-0125
  - id: CM-32-009
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A child case MUST NOT receive any of the parent case's reports, notes, ledger entries,
      participants, case statuses, vulnerability records or case references. Its ledger MUST begin
      at its own genesis hash.
    rationale: >-
      The split exists to keep the child's participants apart from the parent's content. Creating
      the child empty and adding only what the splitter wrote makes isolation the default; copying
      and pruning would disclose whatever the pruning missed.
    verification: >-
      A test marked `CM-32-009` splits a case holding a report, a note, several ledger entries and
      several participants, and asserts that none of them appears in the child and that the child's
      first ledger entry chains from the child's genesis hash.
    stories:
    - story_2022_104
    adr:
    - ADR-0125
  - id: CM-32-010
    priority: MUST
    kind: protocol
    statement: >-
      A split proposal MUST carry a new `VulnerabilityReport` attributed to the splitter,
      which becomes the child's only report, and the stub summary the child's stub Invites
      carry (CM-17-010). The CASE_MANAGER MUST refuse a split proposal whose report is one of
      the parent case's reports, or that carries no stub summary.
    rationale: >-
      Every case has a report (CM-05-002). A report the splitter writes for the child is the
      child's fresh description, and refusing a parent report keeps the parent's description
      out of the child (CM-32-009). The splitter, not the CASE_MANAGER, decides how much an
      invitee not yet bound by the embargo may learn from the stub (CM-17-010).
    verification: >-
      A test marked `CM-32-010` sends a split proposal carrying a parent report, and one
      carrying no stub summary, and asserts `REFUSED` with no child each time; and sends one
      carrying a new report and a stub summary and asserts the child holds that report alone
      and its stub Invites carry that summary.
    stories:
    - story_2022_104
    relationships:
    - rel_type: depends_on
      spec_id: CM-05-002
    - rel_type: depends_on
      spec_id: CM-17-010
    adr:
    - ADR-0125
  - id: CM-32-011
    priority: MUST
    kind: protocol
    statement: >-
      Child case initialization MUST run the case initialization sequence (CM-14-001) with its
      embargo step (CM-14-010) replaced by CM-32-007 or CM-32-008 and its reporter steps
      (CM-14-011, CM-14-012) skipped, and MUST seat only the CASE_MANAGER and the Owner, the
      Owner holding `CASE_OWNER` at `RM.RECEIVED` (CM-14-009). Authoring the child's report
      MUST NOT give the splitter a Finder or Reporter role. These two are the participants
      seated by case initialization for CM-10-004, and a participant MUST NOT be invited to
      the child before its creation entry is committed (CM-14-007).
    rationale: >-
      The child has no outside reporter; the Owner wrote its description. Every other participant
      joins the child by accepting its stub Invite (ADR-0114).
    verification: >-
      A test marked `CM-32-011` splits a case and asserts the child's roster holds exactly the
      CASE_MANAGER and the Owner, with no `FINDER` or `REPORTER` role on the Owner.
    stories:
    - story_2022_104
    relationships:
    - rel_type: constrains
      spec_id: CM-14-001
    - rel_type: constrains
      spec_id: CM-14-011
    - rel_type: constrains
      spec_id: CM-14-012
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-012
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A child-case activity MUST NOT add a participant to the parent case's roster, and the
      parent's recipient selection (CM-10-007) MUST NOT return a participant of the child that
      is not separately a participant of the parent. Such a participant MUST receive no parent
      ledger entry.
    rationale: >-
      Joining the child is joining the child only. A participant in both cases, such as the Owner,
      is a participant of each separately, and parent content reaches it only as a parent
      participant.
    verification: >-
      A test marked `CM-32-012` invites a vendor to a child case, has it accept, commits a parent
      ledger entry, and asserts the vendor is absent from the parent roster and from the parent
      entry's recipients.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: CM-10-004
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-013
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER of a child case commits an embargo proposal or revision whose end
      time is earlier than the end time the child inherited, it MUST, before the proposal can
      be activated, commit a split-family embargo notice to the ledger of every other member
      case of the child's split family (CM-32-006), carrying the child's ID, the proposed end
      time and the proposer's rationale, and MUST commit the rationale to the child's ledger.
      The rationale is the proposing activity's `content`, and the CASE_MANAGER MUST refuse
      such a proposal whose `content` is empty.
    rationale: >-
      This is how VP-10-002 is carried out. An earlier end in one child can reveal the
      vulnerability in the products the others cover (VP-10, split discussion), so the other
      cases hear of it while it is still a proposal, and the reason is on record. The
      activity's `content` carries it because embargo proposals have no rationale field of
      their own.
    verification: >-
      A test marked `CM-32-013` proposes an earlier end time in a child and asserts a notice
      entry in each other family member's ledger and a child ledger entry carrying the
      rationale, and that the same proposal with empty `content` is refused.
    stories:
    - story_2022_105
    relationships:
    - rel_type: implements
      spec_id: VP-10-002
    adr:
    - ADR-0125
    - ADR-0113
  - id: CM-32-014
    priority: MUST
    kind: protocol
    statement: >-
      When the active embargo of any member of a split family changes — a revision is
      activated or the embargo is terminated — the family's CASE_MANAGER MUST commit a
      split-family embargo notice to the ledger of every other member case of the family
      (CM-32-006), carrying the changed member's ID, its new end time or the fact of
      termination, and the rationale when the change's proposal gave one.
    rationale: >-
      This is how VP-10-003 is carried out. Participants address case messages only to their
      CASE_MANAGER (PCR-08-001), and every member case has the same CASE_MANAGER (CM-32-016),
      so a change agreed in one case reaches the others' participants through their own
      ledgers rather than from participant to participant.
    verification: >-
      A test marked `CM-32-014` activates a revision in one child, and separately terminates
      its embargo, and asserts a notice entry in the parent's and each sibling's ledger each
      time.
    stories:
    - story_2022_105
    relationships:
    - rel_type: implements
      spec_id: VP-10-003
    adr:
    - ADR-0125
  - id: CM-32-015
    priority: MUST
    kind: protocol
    statement: >-
      A split-family embargo notice MUST be committed to a member case's ledger only by that
      case's CASE_MANAGER, so that it reaches the case's active participants through the
      shared recipient selection (CM-10-004). The notice MUST NOT change the receiving case's
      EM state or any consent row, and MUST carry no content of the case it reports on beyond
      that case's ID, its new end time or the fact of termination, and the rationale.
    rationale: >-
      A notice informs and proposes nothing: a case's embargo changes only through its own
      negotiation (ADR-0125, decision part 7). Committing it to the receiving ledger delivers
      it through the shared recipient selection, so the participants of one case learn of
      another's change without ever being addressed by it, and learn nothing else of that
      case.
    verification: >-
      A test marked `CM-32-015` commits a notice about a sibling and asserts one entry in the
      receiving ledger fanned out to that case's active participants, EM state and consent
      rows unchanged, and no field in the notice beyond the three it may carry.
    stories:
    - story_2022_105
    relationships:
    - rel_type: implements
      spec_id: VP-10-003
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0125
  - id: CM-32-016
    priority: MUST_NOT
    kind: protocol
    statement: >-
      While a case is a member of a split family, its CASE_MANAGER role MUST NOT be delegated to
      an actor other than the CASE_MANAGER of the family's other member cases; such a delegation
      MUST be refused with the case's CASE_MANAGER unchanged.
    rationale: >-
      Siblings are read from the parent (CM-32-006), and notices are ledger commits by the one
      CASE_MANAGER hosting the family (CM-32-013, CM-32-014). A member moved to another
      CASE_MANAGER could neither find its siblings nor reach them. ADR-0125 leaves a family
      spread across CASE_MANAGERs to a later decision.
    verification: >-
      A test marked `CM-32-016` requests delegation of a child case's CASE_MANAGER role to
      another actor and asserts it is refused with the child's CASE_MANAGER unchanged.
    stories:
    - story_2022_104
    relationships:
    - rel_type: constrains
      spec_id: CM-24-006
    adr:
    - ADR-0125
