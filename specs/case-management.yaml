id: CM
title: Case Management
description: Requirements for VulnerabilityCase lifecycle management, CaseActor responsibilities, and the RM/EM/CS/VFD state
  model. Covers actor isolation at the protocol level, the distinction between participant-specific and participant-agnostic
  state, case initialization sequencing, embargo acceptance ownership, and the invitation acceptance lifecycle.
version: 1.3.0
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: CM-01
  title: Actor Isolation
  specs:
  - id: CM-01-001
    priority: MUST
    kind: protocol
    statement: Each actor MUST have an isolated protocol state domain
    verification: Integration tests in `test/demo/` confirm that each actor maintains its own
      isolated RM/EM/CS state domain without cross-actor interference.
    stories:
    - story_2022_088
  - id: CM-01-002
    priority: MUST
    kind: protocol
    statement: Each actor's RM state MUST be maintained independently per case
    verification: Integration tests in `test/demo/` confirm that each actor's RM state for a
      case is tracked independently in its own `ParticipantStatus` records.
    stories:
    - story_2022_088
- id: CM-02
  title: CaseActor Lifecycle
  specs:
  - id: CM-02-001
    priority: MUST
    kind: protocol
    statement: Each VulnerabilityCase MUST have exactly one associated CaseActor
    verification: Inspection of `vultron/core/` confirms that each `VulnerabilityCase` is
      associated with exactly one `CaseActor` instance.
    stories:
    - story_2022_029
    - story_2022_031
  - id: CM-02-002
    priority: MUST
    kind: protocol
    statement: CaseActor MUST be the authoritative source of truth for case state
    verification: Integration tests in `test/demo/` confirm that participants fetch canonical
      state from the CaseActor rather than from each other.
    lint_suppress:
    - missing_story_reference
  - id: CM-02-003
    priority: MUST
    kind: protocol
    statement: CaseActor MUST persist until the associated VulnerabilityCase is closed
    verification: Inspection of `vultron/core/` confirms that the `CaseActor` is not torn down
      until the associated `VulnerabilityCase` is closed.
    lint_suppress:
    - missing_story_reference
  - id: CM-02-004
    priority: MUST
    kind: protocol
    statement: CaseActor MUST know the case owner
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `VulnerabilityCase.attributed_to` records the case owner and is readable by the CaseActor.
    stories:
    - story_2022_046
    - story_2022_047
    - story_2022_050
    - story_2022_051
  - id: CM-02-005
    priority: MUST
    kind: protocol
    statement: >-
      CaseActor MUST restrict the following activities to the case owner: case closure,
      approving an embargo proposal to become active on the case and terminating an active embargo,
      approving or rejecting participant invitations, and case ownership transfer
      (see CM-02-006 for the authorisation mechanism).
    verification: Integration tests in `test/demo/` confirm that case closure, embargo approval,
      participant invitation approval, and ownership transfer are only executed when triggered
      by the case owner.
    scope:
    - production
    stories:
    - story_2022_048
    - story_2022_050
  - id: CM-02-006
    priority: MUST
    kind: protocol
    statement: CaseActor MUST enforce case-level authorization for all case mutations
    verification: Inspection of `vultron/core/` confirms that every case mutation path checks
      actor authorization before applying the mutation.
    scope:
    - production
    stories:
    - story_2022_036
  - id: CM-02-007
    priority: MUST
    kind: protocol
    statement: '`VulnerabilityCase` MUST include a `notes: list[as_NoteRef]` field to record case-scoped notes created via
      `AddNoteToCase` activities'
    verification: 'Inspection of `vultron/core/models/case.py` confirms that `VulnerabilityCase`
      declares a `notes: list[as_NoteRef]` field.'
    stories:
    - story_2022_083
  - id: CM-02-008
    priority: MUST
    kind: protocol
    statement: When a `VulnerabilityCase` is created from an originating `VulnerabilityReport` Offer, the vendor (case recipient
      / owner) MUST be recorded as the initial primary participant
    verification: Integration tests in `test/demo/` confirm that the vendor actor is recorded as
      the initial primary participant when a `VulnerabilityCase` is created from an
      `Offer(Report)`.
    lint_suppress:
    - missing_story_reference
  - id: CM-02-009
    priority: MUST
    kind: protocol
    statement: The CaseActor MUST apply its own trusted timestamp to every state-changing event it receives, regardless of
      any timestamp supplied by the sending participant
    rationale: The CaseActor's clock is the only trusted source of time for event ordering within a case; using participant-supplied
      timestamps would allow different copies of a case (held by different actors) to disagree on event order, undermining
      auditability and the single-source-of-truth guarantee
    verification: Integration tests in `test/demo/` confirm that the CaseActor timestamps every
      state-changing event with its own clock, discarding any timestamp supplied by the sender.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    lint_suppress:
    - missing_story_reference
  - id: CM-02-010
    priority: MUST
    kind: protocol
    statement: The CaseActor and the case owner (named actor) MUST have distinct actor identities — each with their own actor
      ID — even when co-located on the same server
    rationale: Enforcing distinct identities ensures that all case-state transitions pass through the wire protocol regardless
      of deployment topology, preserving audit integrity and enabling future separation onto independent containers without
      protocol changes
    verification: Inspection of `vultron/core/` confirms that the CaseActor service actor and
      the case owner named actor each hold distinct actor IDs, even in single-server
      deployments.
    relationships:
    - rel_type: refines
      spec_id: CM-01-001
    - rel_type: depends_on
      spec_id: CM-02-001
    lint_suppress:
    - missing_story_reference
- id: CM-03
  title: Case State Model
  specs:
  - id: CM-03-001
    priority: MUST
    kind: protocol
    statement: 'The system MUST implement the three interacting state machines: RM (Report Management), EM (Embargo Management),
      and CS (Case State)'
    verification: Integration tests in `test/demo/` confirm that RM, EM, and CS state machines
      are each instantiated and advance independently.
    relationships:
    - rel_type: implements
      spec_id: VP-01-001
    - rel_type: implements
      spec_id: VP-13-001
    - rel_type: implements
      spec_id: VP-14-001
    stories:
    - story_2022_107
  - id: CM-03-002
    priority: MUST
    kind: protocol
    statement: RM state MUST be participant-specific
    verification: Inspection of `vultron/core/` confirms that RM state is stored on
      `ParticipantStatus.rm_state`, a per-participant field, not on a shared case-level
      structure.
    relationships:
    - rel_type: implements
      spec_id: VP-01-002
    - rel_type: implements
      spec_id: VP-02-002
    - rel_type: implements
      spec_id: VP-03-001
    lint_suppress:
    - missing_story_reference
  - id: CM-03-003
    priority: MUST
    kind: protocol
    statement: A shared EM state MUST be tracked at the case level in `CaseStatus.em_state` to represent the collective embargo
      agreement
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `CaseStatus.em_state` exists as a case-level field tracking the collective embargo state.
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: implements
      spec_id: VP-14-001
    lint_suppress:
    - missing_story_reference
  - id: CM-03-008
    priority: MUST
    kind: protocol
    statement: Each `CaseParticipant` MUST track their own embargo consent state via the `ParticipantStatus.embargo_adherence`
      field
    verification: Inspection of `vultron/core/` confirms that `ParticipantStatus.consent` (or
      `embargo_adherence`) is a per-participant field on `CaseParticipant`.
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
    lint_suppress:
    - missing_story_reference
  - id: CM-03-004
    priority: MUST
    kind: protocol
    statement: CS (PXA sub-state) MUST be participant-agnostic (shared per case)
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `CaseStatus.pxa_state` is a case-level field shared across all participants.
    lint_suppress:
    - missing_story_reference
  - id: CM-03-005
    priority: MUST
    kind: protocol
    statement: VFD (Vendor Fix Deployment) state MUST be participant-specific
    verification: Inspection of `vultron/core/` confirms that VFD state is stored on a
      per-participant `ParticipantStatus.vfd_state` field.
    lint_suppress:
    - missing_story_reference
  - id: CM-03-006
    priority: MUST
    kind: protocol
    statement: Collection fields that hold status histories MUST be pluralized and documented as history collections
    verification: Inspection of `vultron/core/models/` confirms that history collection fields
      (e.g., `case_statuses`, `participant_statuses`) are pluralized list fields.
    lint_suppress:
    - missing_story_reference
  - id: CM-03-007
    priority: MUST
    kind: protocol
    statement: RM state transitions MUST use the established protocol activity types without introducing new activity types
      for reverse transitions
    rationale: Keeps the RM symbol set minimal and produces clean audit histories; `Undo` conflates historical negation with
      a new forward transition
    verification: Static analysis (grep) confirms that no RM-reverse transition handler
      introduces an activity type outside the established protocol symbol set.
    relationships:
    - rel_type: implements
      spec_id: VP-02-004
    lint_suppress:
    - missing_story_reference
- id: CM-04
  title: State Transition Correctness
  specs:
  - id: CM-04-001
    priority: MUST
    kind: protocol
    statement: Handlers processing RM state transitions MUST update `ParticipantStatus.rm_state` for the sending actor's CaseParticipant
    verification: Integration tests in `test/demo/` confirm that processing an RM status message
      updates the sender's `CaseParticipant` with a new `ParticipantStatus.rm_state` entry.
    relationships:
    - rel_type: implements
      spec_id: VP-02-002
    - rel_type: implements
      spec_id: VP-02-003
    - rel_type: implements
      spec_id: VP-03-001
    - rel_type: implements
      spec_id: VP-13-005
    stories:
    - story_2022_107
  - id: CM-04-002
    priority: MUST
    kind: protocol
    statement: Handlers processing VFD state transitions MUST update `ParticipantStatus.vfd_state` for the sending actor's
      CaseParticipant
    verification: Integration tests in `test/demo/` confirm that processing a VFD status message
      updates the sender's `ParticipantStatus.vfd_state`.
    lint_suppress:
    - missing_story_reference
  - id: CM-04-003
    priority: MUST
    kind: protocol
    statement: >-
      When processing an EM state transition and the accepting actor is the case owner,
      the handler MUST update CaseStatus.em_state.
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from the case
      owner advances `CaseStatus.em_state`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-001
    - rel_type: implements
      spec_id: VP-09-001
    - rel_type: implements
      spec_id: VP-11-001
    - rel_type: implements
      spec_id: VP-11-002
    - rel_type: implements
      spec_id: VP-14-001
    - rel_type: implements
      spec_id: VP-14-002
    - rel_type: depends_on
      spec_id: CM-03-008
    lint_suppress:
    - missing_story_reference
  - id: CM-04-004
    priority: MUST
    kind: protocol
    statement: Handlers processing PXA state transitions (public disclosure, exploit publication, attack observation) MUST
      update `CaseStatus.pxa_state`
    verification: Integration tests in `test/demo/` confirm that processing a PXA transition
      (public disclosure, exploit publication, or attack observation) updates
      `CaseStatus.pxa_state`.
    relationships:
    - rel_type: implements
      spec_id: VP-03-002
    - rel_type: implements
      spec_id: VP-14-003
    - rel_type: implements
      spec_id: VP-14-004
    lint_suppress:
    - missing_story_reference
  - id: CM-04-005
    priority: MUST
    kind: protocol
    statement: Handlers that implement VFD or PXA transitions MUST validate the requested transition against the authoritative
      current state before persisting it
    verification: Inspection of `vultron/core/` confirms that VFD and PXA transition handlers
      call the state machine's transition validator before persisting any state change.
    lint_suppress:
    - missing_story_reference
  - id: CM-04-006
    priority: MUST_NOT
    kind: protocol
    statement: 'A state transition handler for a participant-specific transition (RM or VFD) MUST NOT update any case-level (participant-agnostic) state field (em_state, pxa_state). A state transition handler for a case-level transition (PXA or EM) MUST NOT update any participant-specific state field (rm_state, vfd_state).'
    relationships:
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: depends_on
      spec_id: CM-03-008
  - id: CM-04-007
    priority: MUST
    kind: protocol
    statement: RM transition validation MUST treat `RM.CLOSED` as terminal before applying any same-state no-op shortcut.
      A repeated `CLOSED -> CLOSED` update MUST be treated as a terminal no-op that does not append new participant status
      records, trigger broadcast, or create new case-ledger entries.
    rationale: Checking equality first can let duplicate close retries flow into downstream append/broadcast paths as fresh
      state changes.
    verification: A unit test confirms that a `RM.CLOSED -> RM.CLOSED` duplicate close attempt
      is handled as a terminal no-op without appending a new `ParticipantStatus` record.
    lint_suppress:
    - missing_story_reference
  - id: CM-04-008
    priority: MUST
    kind: protocol
    statement: >-
      When processing an EM state transition and the accepting actor is any participant other
      than the case owner, the handler MUST update only that participant's
      ParticipantStatus.embargo_adherence.
    rationale: >-
      Non-owner participants do not advance the shared EM state; their individual acceptance
      updates only their own consent record.
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from a
      non-owner participant updates only that participant's
      `ParticipantStatus.embargo_adherence`, not `CaseStatus.em_state`.
    lint_suppress:
    - missing_story_reference
  - id: CM-04-009
    priority: MUST
    kind: protocol
    statement: >-
      A handler processing an EM state transition accept event MUST update at most one of
      CaseStatus.em_state or ParticipantStatus.embargo_adherence per accept event, except when
      the accepting actor simultaneously satisfies both the case-owner and non-owner conditions
      (see CM-13-001 through CM-13-003 for the full decision logic).
    rationale: >-
      Updating both fields unconditionally would conflate the shared embargo state with a
      participant's individual consent state, corrupting the EM state machine.
    verification: Integration tests in `test/demo/` confirm that a single embargo-accept event
      updates either `CaseStatus.em_state` or `ParticipantStatus.embargo_adherence` but never
      both unconditionally.
    lint_suppress:
    - missing_story_reference
- id: CM-05
  title: Object Model Relationships
  specs:
  - id: CM-05-001
    priority: MUST
    kind: protocol
    statement: >-
      The system MUST distinguish the following domain objects as separate, non-interchangeable
      types: VulnerabilityReport, VulnerabilityCase, VulnerabilityRecord, CaseReference, CaseActor,
      CaseParticipant, and ParticipantStatus. Each of these types MUST NOT be substituted for
      another at any API boundary, persistence layer, or wire message.
    verification: Static analysis (mypy) confirms that `VulnerabilityReport`,
      `VulnerabilityCase`, `VulnerabilityRecord`, `CaseReference`, `CaseActor`,
      `CaseParticipant`, and `ParticipantStatus` are declared as distinct non-interchangeable
      types.
    lint_suppress:
    - missing_story_reference
  - id: CM-05-002
    priority: MUST_NOT
    kind: protocol
    statement: A `VulnerabilityCase` MUST reference at least one `VulnerabilityReport`; a case with zero reports MUST NOT
      exist
    relationships:
    - rel_type: implements
      spec_id: VP-02-015
    - rel_type: implements
      spec_id: VP-02-020
    stories:
    - story_2022_102
  - id: CM-05-003
    priority: SHOULD
    kind: protocol
    statement: A `VulnerabilityCase` SHOULD reference at least one `VulnerabilityRecord` before closure; cases with no associated
      record at closure SHOULD log a warning
  - id: CM-05-004
    priority: MAY
    kind: protocol
    statement: A `VulnerabilityCase` MAY have zero or more associated `CaseReference` objects
  - id: CM-05-005
    priority: MUST
    kind: protocol
    statement: '`CaseReference` objects MUST include at minimum a `url` field.'
    verification: Inspection of `vultron/core/models/case.py` confirms that the `CaseReference`
      model declares a required `url` field.
    lint_suppress:
    - missing_story_reference
  - id: CM-05-006
    priority: MAY
    kind: protocol
    statement: One report MAY describe multiple vulnerabilities; one case MAY group multiple reports (e.g., when overlapping
      participants are involved)
    stories:
    - story_2022_104
    - story_2022_105
    - story_2022_111
  - id: CM-05-007
    priority: MAY
    kind: protocol
    statement: Multiple `CaseReference` objects MAY arise from a single case (e.g., coordinated simultaneous disclosure by
      multiple vendors)
  - id: CM-05-008
    priority: MUST_NOT
    kind: protocol
    statement: '`VulnerabilityRecord` identifiers MUST be treated as opaque strings; the system MUST NOT restrict identifier
      values to CVE ID format or any other specific namespace'
    rationale: Different organizations use different identifier namespaces (CVE, CERT/CC VU#, vendor-assigned IDs, etc.);
      requiring a specific format excludes valid records and prevents multi-namespace support
  - id: CM-05-009
    priority: SHOULD
    kind: protocol
    statement: A `VulnerabilityRecord` SHOULD support a list of alias identifiers from different namespaces for the same vulnerability
    rationale: Multiple IDs from different namespaces may refer to the same underlying vulnerability (e.g., a CVE ID and a
      CERT/CC VU# ID)
  - id: CM-05-010
    priority: MUST
    kind: protocol
    statement: When a `VulnerabilityRecord` is a `CVERecord` (i.e., it carries a CVE ID), its data MUST conform to the CVE
      JSON schema (<https://github.com/CVEProject/cve-schema>)
    verification: Inspection of `vultron/core/` confirms that `CVERecord` (or the equivalent
      CVE-typed `VulnerabilityRecord`) validates its data against the CVE JSON schema.
    lint_suppress:
    - missing_story_reference
  - id: CM-05-011
    priority: SHOULD
    kind: protocol
    statement: '`CaseReference` objects SHOULD include a `name` field containing a human-readable title.'
    rationale: A human-readable title makes references easier to identify in case summaries and reports.
  - id: CM-05-012
    priority: MAY
    kind: protocol
    statement: >-
      `CaseReference` objects MAY include a `tags` field (array of one or more type
      descriptors, e.g., "patch", "vendor-advisory", "third-party-advisory", "exploit",
      "release-notes").
    rationale: >-
      Type descriptor tags allow consumers to filter or categorise references without
      parsing the URL or name.
- id: CM-06
  title: Case Update Broadcast
  specs:
  - id: CM-06-001
    priority: MUST
    kind: protocol
    statement: When the CaseActor updates canonical case state, it MUST notify all current case participants
    verification: Integration tests in `test/demo/` confirm that after the CaseActor updates
      canonical case state it fans out `Announce(CaseLedgerEntry)` to all current case
      participants.
    relationships:
    - rel_type: implements
      spec_id: VP-02-019
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: implements
      spec_id: VP-08-001
    stories:
    - story_2022_043
    - story_2022_098
  - id: CM-06-002
    priority: MUST
    kind: protocol
    statement: Participants receiving a case update notification MUST treat the update as authoritative only when it originates
      from the CaseActor
    verification: Integration tests in `test/demo/` confirm that a state update message from a
      non-CaseActor participant is not treated as authoritative case state.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    lint_suppress:
    - missing_story_reference
  - id: CM-06-003
    priority: MUST
    kind: protocol
    statement: Case update notifications MUST include the updated CaseActor URL so participants can fetch the current case
      state if needed
    verification: Inspection of `vultron/core/` confirms that case update notification payloads
      include the CaseActor URL so recipients can fetch current state.
    scope:
    - production
    lint_suppress:
    - missing_story_reference
  - id: CM-06-004
    priority: MUST
    kind: protocol
    statement: Participants MUST authenticate case update notifications before accepting them as authoritative
    verification: Inspection of `vultron/core/` confirms that the case update notification
      handler verifies the sender's identity against the known CaseActor before processing the
      update.
    scope:
    - production
    lint_suppress:
    - missing_story_reference
  - id: CM-06-005
    priority: MUST
    kind: protocol
    statement: When a note is added to a case, the CaseActor MUST broadcast the note to all case participants (excluding the
      note author)
    verification: Integration tests in `test/demo/` confirm that adding a note to a case causes
      the CaseActor to broadcast the note to all case participants except the note author.
    relationships:
    - rel_type: depends_on
      spec_id: OX-03-001
    - rel_type: depends_on
      spec_id: CM-02-001
    lint_suppress:
    - missing_story_reference
- id: CM-07
  title: CVD Action Rules API
  specs:
  - id: CM-07-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD expose an endpoint that returns the set of valid actions available to a case participant
      given the current case state and their role
    relationships:
    - rel_type: refines
      spec_id: AR-07-001
    - rel_type: refines
      spec_id: AR-07-002
    stories:
    - story_2022_031
    - story_2022_088
  - id: CM-07-002
    priority: MUST
    kind: protocol
    statement: The action rules response MUST include the participant's role and the current RM, EM, CS, and VFD states relevant
      to that participant
    verification: Integration tests in `test/demo/` confirm that the action rules endpoint
      returns the participant's role and current RM, EM, CS, and VFD states.
    lint_suppress:
    - missing_story_reference
  - id: CM-07-003
    priority: MUST
    kind: protocol
    statement: The action rules response MUST list valid next actions as structured objects including the action name and
      any required parameters
    verification: Integration tests in `test/demo/` confirm that the action rules endpoint lists
      valid next actions as structured objects containing at minimum the action name.
    lint_suppress:
    - missing_story_reference
- id: CM-08
  title: Domain Model Architecture
  specs:
  - id: CM-08-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD maintain a clear separation between the wire representation, domain model, and persistence
      model for CVD objects
  - id: CM-08-002
    priority: MUST_NOT
    kind: protocol
    statement: Domain objects MUST NOT directly inherit from ActivityStreams base types; explicit `from_core()` / `to_core()`
      translation methods MUST be provided at the wire boundary (see `specs/architecture.yaml` ARCH-12-001 through ARCH-12-007
      and `notes/domain-model-separation.md`)
- id: CM-09
  title: Redacted Case View
  specs:
  - id: CM-09-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD support a `RedactedVulnerabilityCase` type for sharing case information with invited-but-not-yet-accepted
      participants
    scope:
    - production
  - id: CM-09-002
    priority: MUST
    kind: protocol
    statement: The ID of a `RedactedVulnerabilityCase` MUST be cryptographically unrelated to the full `VulnerabilityCase`
      ID
    rationale: Prevents an attacker who obtains a redacted case ID from inferring the full case ID
    verification: Inspection of `vultron/core/` confirms that `RedactedVulnerabilityCase` ID
      generation does not derive from or encode the full `VulnerabilityCase` ID.
    scope:
    - production
    lint_suppress:
    - missing_story_reference
  - id: CM-09-003
    priority: MUST
    kind: protocol
    statement: Each invitee MUST receive a distinct `RedactedVulnerabilityCase` ID
    rationale: Prevents cross-correlation of redacted IDs to infer participant list size or identities
    verification: Inspection of `vultron/core/` confirms that each invitee's
      `RedactedVulnerabilityCase` is generated with a unique ID distinct from every other
      invitee's redacted case ID.
    scope:
    - production
    lint_suppress:
    - missing_story_reference
  - id: CM-09-004
    priority: MAY
    kind: protocol
    statement: For the prototype, the `Invite` activity MAY reference the case by full case ID only, deferring the redacted
      view to a later phase
- id: CM-10
  title: Per-Participant Embargo Acceptance
  specs:
  - id: CM-10-001
    priority: MUST
    kind: protocol
    statement: '`CaseParticipant` MUST track which embargo(es) a participant has explicitly accepted'
    verification: Inspection of `vultron/core/` confirms that `CaseParticipant` tracks embargo
      acceptances via the PEC consent state or an `accepted_embargo_ids` field.
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    lint_suppress:
    - missing_story_reference
  - id: CM-10-002
    priority: MUST
    kind: protocol
    statement: Embargo acceptances MUST be timestamped by the CaseActor at the time of receipt, not using the participant's
      claimed timestamp
    rationale: The CaseActor applies the only trusted timestamp; the participant's reported time cannot be verified
    verification: Integration tests in `test/demo/` confirm that the CaseActor's own clock
      timestamp is stored on embargo acceptance records, not the participant's claimed
      timestamp.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    - rel_type: implements
      spec_id: CM-02-009
    lint_suppress:
    - missing_story_reference
  - id: CM-10-003
    priority: SHOULD
    kind: protocol
    statement: 'The `CaseParticipant` model SHOULD include an `accepted_embargo_ids: list[str]` field recording the IDs of
      `EmbargoEvent` objects the participant has explicitly accepted'
  - id: CM-10-004
    priority: MUST
    kind: protocol
    statement: Before sharing case updates with a participant, the system MUST verify that the participant has accepted the
      current active embargo
    verification: Integration tests in `test/demo/` confirm that a participant without an active
      embargo acceptance is excluded from case update fan-outs.
    lint_suppress:
    - missing_story_reference
- id: CM-11
  title: Invitation Acceptance Lifecycle
  specs:
  - id: CM-11-001
    priority: MUST
    kind: protocol
    statement: >-
      When an actor accepts a case invitation, the CaseActor MUST record the accepting actor's
      RM state as RM.RECEIVED — not RM.ACCEPTED. `Accept(Invite)` signals willingness to join
      the case and, when an active embargo is in scope, consent to the embargo. It does NOT
      constitute validation of the vulnerability report. The accepting actor has received only
      a case stub at that point and has not yet seen the full case (report details, vulnerability
      description, etc.). The full VALID/INVALID and ACCEPTED/DEFERRED triage cycle is a
      distinct subsequent step that the invitee runs after the case replica has been replicated
      to them.
    note: >-
      This corrects the prior statement ("MUST advance to ACCEPTED"), which conflated two
      distinct protocol acts: joining the case and validating its content. The correction
      applies only to post-initialization invitees — the initial reporter and receiver
      participants are established during case creation at their correct RM states.
    rationale: >-
      An actor who accepts an invitation has seen only a redacted or stub view of the
      `VulnerabilityCase`. Recording them at RM.ACCEPTED before they have reviewed the
      full case violates the RM state machine semantics (a participant cannot accept what
      they have not seen). The `Accept(Invite)` message means "I am willing to participate
      and I accept the embargo terms"; it does not mean "I have validated the vulnerability
      and committed to remediation." Only after the full case replica is delivered and the
      invitee has run their triage cycle (RECEIVED → VALID or INVALID → ACCEPTED or DEFERRED)
      should their RM state advance past RECEIVED.
    verification: Integration tests in `test/demo/` confirm that `Accept(Invite)` causes the
      CaseActor to record the accepting actor's RM state as `RM.RECEIVED`, not `RM.ACCEPTED`.
    relationships:
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: depends_on
      spec_id: CM-03-001
    lint_suppress:
    - missing_story_reference
  - id: CM-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      After accepting a case invitation and receiving the full case replica, the accepting
      actor SHOULD run the standard RM triage cycle: validating the reported vulnerability
      (RM.VALID or RM.INVALID), then deciding to engage or defer (RM.ACCEPTED or RM.DEFERRED).
      Each transition SHOULD be communicated to the CaseActor via the appropriate RM status
      message so the CaseActor can update its representation of the invitee's RM state.
    note: Prior text read "After auto-engagement (CM-11-001), the accepting actor SHOULD emit an RmEngageCaseActivity
      to notify the case owner." That text assumed CM-11-001 advanced the state to ACCEPTED;
      under the corrected CM-11-001 the engagement notification is part of the triage cycle
      described here.
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    - rel_type: depends_on
      spec_id: CM-11-001
  - id: CM-11-004
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST NOT treat an invited participant as having committed to the case
      (RM.ACCEPTED) until it receives the corresponding RM status message from the invitee
      confirming that state transition.
    rationale: >-
      Only the invitee can confirm they have validated the vulnerability and chosen to
      engage. The CaseActor cannot infer acceptance from the `Accept(Invite)` alone
      because at that point the invitee has not yet received the full case content.
    verification: Integration tests in `test/demo/` confirm that the CaseActor does not set an
      invited participant's RM state to `RM.ACCEPTED` until it receives the corresponding RM
      status message from the invitee.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-001
    lint_suppress:
    - missing_story_reference
  - id: CM-11-003
    priority: MUST
    kind: protocol
    statement: >-
      When processing a `Reject(Invite(actor, case))` activity, the use case MUST resolve
      `case_id` from the nested Invite's `target` field (`inner_target_id`) rather than from
      the top-level `target` of the Reject activity; the top-level `target` is not populated
      by `extract_event` for this activity pattern and will always be `None`.
    note: >-
      `Accept(Invite(actor, case))` follows the same nesting — `AcceptInviteActorToCaseReceivedEvent`
      already exposes a `case_id` property as `inner_target_id`. The symmetric property must
      be present on `RejectInviteActorToCaseReceivedEvent` and used in
      `RejectInviteActorToCaseReceivedUseCase.execute()`. Failure to read `inner_target_id`
      causes the use case to early-return without committing the canonical `CaseLedgerEntry`
      for the rejection (pre-existing gap introduced in #1293, documented in #1747).
    rationale: >-
      The `Reject(Invite(actor, case))` wire activity wraps the Invite as its `object_`; the
      case reference is therefore on `object_.target`, which `extract_event` maps to
      `inner_target`. There is no top-level `target` on the Reject itself.
    verification: A unit test confirms that `RejectInviteActorToCaseReceivedUseCase.execute()`
      reads `case_id` from `inner_target_id` rather than from the top-level Reject `target`.
    lint_suppress:
    - missing_story_reference
  - id: CM-11-005
    priority: MUST
    kind: architecture
    statement: >-
      An invited actor MUST obtain its `VultronOfferRecord` for the case's vulnerability
      report by processing the `add_report_to_case` `CaseLedgerEntry` backfilled from the
      CaseActor — not by any form of synthetic injection or out-of-band seeding. The
      `add_report_to_case` ledger entry embeds the full `VulnerabilityReport` and the
      original offer metadata; processing it creates both the `VulnerabilityReport` replica
      and the `VultronOfferRecord` in the invited actor's DataLayer, enabling the standard
      `validate-report` trigger to proceed without modification.
    rationale: >-
      Three options were evaluated when CONCERN-2320 was filed: (1) reuse `validate-report`
      with the `VultronOfferRecord` obtained from the ledger backfill, (2) add a separate
      `engage-case`/`validate-case` trigger that advances RM without an OfferRecord, and
      (3) exempt invited actors from the RM.VALID step entirely. Option 1 was chosen because
      it preserves protocol uniformity (all participants run the same triage cycle), avoids
      forking the RM state-machine path, and is already fully supported by the
      `add_report_to_case` ledger backfill mechanism. See ADR-0070.
    verification: Inspection of `vultron/core/` confirms that the `add_report_to_case`
      ledger-backfill path creates both the `VulnerabilityReport` replica and the
      `VultronOfferRecord`, enabling the standard `validate-report` trigger without synthetic
      injection.
    note: >-
      This requirement supersedes the prior `seed-offer-record` demo-only scaffold
      (`vultron/adapters/driving/fastapi/routers/demo_triggers.py`), which was introduced
      as a temporary workaround before the ledger backfill mechanism existed. That endpoint
      MUST be removed; see TRIG-02-006 and the tracking issue created when CONCERN-2320
      was resolved.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-002
    - rel_type: implements
      spec_id: CM-11-002
    adr:
    - ADR-0070
- id: CM-12
  title: Case Creation Timing
  specs:
  - id: CM-12-001
    priority: MUST
    kind: protocol
    statement: A `VulnerabilityCase` MUST be created when an `Offer(Report)` activity is received by the vendor actor
    verification: Integration tests in `test/demo/` confirm that receiving an `Offer(Report)`
      activity causes a `VulnerabilityCase` to be created.
    note: >-
      Superseded by CM-22-001 (ADR-0041): the vendor actor MUST NOT create the
      `VulnerabilityCase` directly.  The vendor stores the report and waits for
      `Create(VulnerabilityCase)` from the CaseActor.  CM-12-001 applies only in
      single-actor deployments where the vendor IS the CaseActor.
    relationships:
    - rel_type: supersedes
      spec_id: CM-22-001
      note: CM-22-001 (ADR-0041) is the authoritative replacement for multi-actor deployments
    lint_suppress:
    - missing_story_reference
  - id: CM-12-002
    priority: MUST
    kind: protocol
    statement: At case creation, the system MUST create two initial `VultronParticipant` records in the order defined by CM-14-001
    verification: Integration tests in `test/demo/` confirm that case creation produces exactly
      two initial `VultronParticipant` records ordered as defined by CM-14-001.
    relationships:
    - rel_type: depends_on
      spec_id: CM-03-001
    - rel_type: depends_on
      spec_id: CM-02-008
    - rel_type: part_of
      spec_id: CM-14-001
    lint_suppress:
    - missing_story_reference
  - id: CM-12-003
    priority: MUST
    kind: protocol
    statement: When a case is created from an `Offer(Report)`, the case owner MUST queue a `Create(Case)` activity to notify
      the reporter that a case has been opened
    verification: Integration tests in `test/demo/` confirm that a `Create(Case)` activity is
      queued for the reporter when a case is created from an `Offer(Report)`.
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    lint_suppress:
    - missing_story_reference
  - id: CM-12-004
    priority: MUST
    kind: protocol
    statement: If a default embargo policy is configured, a default embargo MUST be initialized at case creation (RM.RECEIVED)
      following the sequence in CM-14-001
    verification: Integration tests in `test/demo/` confirm that when a default embargo policy
      is configured, a default embargo is initialized during case creation at RM.RECEIVED.
    relationships:
    - rel_type: refines
      spec_id: DUR-07-002
      note: which now applies at case receipt
    - rel_type: part_of
      spec_id: CM-14-001
    lint_suppress:
    - missing_story_reference
  - id: CM-12-005
    priority: MUST
    kind: protocol
    statement: '`InvalidateReportReceivedUseCase`, `CloseReportReceivedUseCase`, and `ValidateReportReceivedUseCase` MUST
      dereference the incoming report ID to the associated case ID before delegating to the corresponding case-level use case'
    verification: Inspection of `vultron/core/` confirms that `InvalidateReportReceivedUseCase`,
      `CloseReportReceivedUseCase`, and `ValidateReportReceivedUseCase` each resolve the report
      ID to its associated case ID before delegating.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
    lint_suppress:
    - missing_story_reference
- id: CM-13
  title: Embargo Acceptance Ownership
  specs:
  - id: CM-13-001
    priority: MUST
    kind: protocol
    statement: When processing an `Accept(Invite(EmbargoEvent))` or embargo-accept trigger, the handler MUST determine whether
      the accepting actor is the case owner (`VulnerabilityCase.attributed_to == actor_id`) and apply the correct state transitions
      accordingly
    rationale: The case owner's acceptance is the authoritative signal for advancing the shared EM state. Non-owner participants
      update only their own consent state.
    verification: Integration tests in `test/demo/` confirm that the embargo-accept handler
      checks `VulnerabilityCase.attributed_to == actor_id` before applying state transitions.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-002
    priority: MUST
    kind: protocol
    statement: If the accepting actor is the case owner, the handler MUST transition the shared `CaseStatus.em_state` to `ACTIVE`
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from the case
      owner advances `CaseStatus.em_state` to `ACTIVE`.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-003
    priority: MUST
    kind: protocol
    statement: If the accepting actor is NOT the case owner, the handler MUST update only that participant's own `ParticipantStatus.embargo_adherence`
      consent state to `SIGNATORY`; it MUST NOT advance the shared EM state
    rationale: Non-owner participants do not hold a pocket veto; their individual acceptance does not constitute case-level
      embargo activation
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from a
      non-owner participant updates only that participant's
      `ParticipantStatus.embargo_adherence` to `SIGNATORY` without touching
      `CaseStatus.em_state`.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-004
    priority: MUST
    kind: protocol
    statement: If `VulnerabilityCase.attributed_to` is `None` (legacy or single-actor case), the handler MUST treat the triggering
      actor as the case owner for the purposes of EM state transitions
    rationale: Backward compatibility with cases created before the `attributed_to` field was introduced; prevents single-actor
      embargo triggers from silently failing
    verification: A unit test confirms that when `VulnerabilityCase.attributed_to` is `None`,
      the embargo-accept handler treats the triggering actor as the case owner for EM state
      transitions.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-005
    priority: MUST
    kind: protocol
    statement: 'Embargo accept/reject handlers MUST be idempotent: if the participant''s consent state is already `SIGNATORY`
      (for accept) or `DECLINED` (for reject), the handler MUST succeed silently without re-running state machine transitions
      or emitting invalid-transition warnings'
    verification: A unit test confirms that a repeated embargo accept on an already-`SIGNATORY`
      participant returns success without re-running state machine transitions or emitting
      invalid-transition warnings.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-006
    priority: MUST
    kind: project
    statement: When a case is created with a default embargo that reaches `EM.ACTIVE` at creation time, the case owner MUST
      be initialized as a `SIGNATORY` in the same BT node or an immediately following sibling node in the same BT subtree
    rationale: The case creator is the case owner by default; seeding them as a signatory prevents the case owner from being
      locked out of their own active embargo until a separate accept step occurs. The consent state must be set via the PEC
      state machine (not by direct field assignment) to preserve state machine invariants.
    verification: Integration tests in `test/demo/` confirm that when a case is created with a
      default embargo, the case owner's consent state is set to `SIGNATORY` in the same BT
      subtree that activates the embargo.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-004
  - id: CM-13-007
    priority: MUST
    kind: protocol
    statement: Note attachment idempotency MUST be checked by testing whether the note's `id_` is present in `VulnerabilityCase.notes`,
      NOT by testing whether the note object exists in the DataLayer
    rationale: A note may be stored in the DataLayer by one path and never attached to `case.notes` by another path. Checking
      DataLayer existence produces false idempotency.
    verification: A unit test confirms that note idempotency is checked by testing `note.id_` in
      `VulnerabilityCase.notes`, not by querying the DataLayer for the note object's existence.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-008
    priority: MUST
    kind: protocol
    statement: When reusing an existing report-phase `ParticipantStatus` record on embargo accept/reject retries, handlers
      MUST preserve a non-null existing consent value and MUST NOT overwrite it with the default `NO_EMBARGO` value.
    rationale: Retry/idempotent paths must not silently downgrade previously established consent snapshots.
    verification: A unit test confirms that when an embargo accept retry reuses an existing
      `ParticipantStatus`, a pre-existing non-null consent value is preserved and not
      overwritten with `NO_EMBARGO`.
    lint_suppress:
    - missing_story_reference
- id: CM-14
  title: Case Initialization Sequence
  description: Defines the canonical ordered sequence of initialization steps that MUST occur when a VulnerabilityCase is
    created at Offer(Report) receipt (CM-12-001). All steps MUST complete before the case is considered fully initialized.
  specs:
  - id: CM-14-001
    priority: MUST
    kind: protocol
    statement: >-
      The case initialization sequence MUST execute exactly 6 ordered steps
      (CM-14-008 through CM-14-013) before the case is considered fully initialized.
      No step may be omitted or reordered.
    rationale: Step CM-14-009 precedes CM-14-010 so that the embargo is always created by a participant (the case owner). The
      Create(Case) notification in CM-14-011 is flushed before the reporter is added in CM-14-012 so the reporter's system
      receives the case object before any subsequent Announce(CaseLedgerEntry) fan-out that references it.
    verification: Integration tests in `test/demo/` confirm that the case initialization
      sequence completes exactly 6 ordered steps (CM-14-008 through CM-14-013) and that no step
      is skipped or reordered.
    note: >-
      Superseded by CM-22 (ADR-0041) for multi-actor deployments: in the
      CaseActor-authoritative model the `VulnerabilityCase` is created by the
      CaseActor (not the receiving vendor), so `attributed_to` is the CaseActor's
      actor ID, not the receiving actor's.  CM-14-001 applies only in single-actor
      deployments where the vendor IS the CaseActor.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
    - rel_type: refines
      spec_id: CM-12-002
    - rel_type: refines
      spec_id: CM-12-004
    - rel_type: supersedes
      spec_id: CM-22-001
      note: CM-22-001 (ADR-0041) replaces the attributed_to=receiving_actor semantics for multi-actor deployments
    lint_suppress:
    - missing_story_reference
  - id: CM-14-002
    priority: MUST
    kind: protocol
    statement: The case-owner `VultronParticipant` MUST be created before the default embargo is initialized, so that the
      embargo is always associated with an existing participant
    rationale: An embargo without any participant lacks an owning actor. Creating the owner participant first ensures that
      the embargo is initialized in the context of an actor who can be responsible for it.
    verification: Inspection of `vultron/core/` confirms that the case-owner
      `VultronParticipant` creation step precedes the default embargo initialization step in the
      initialization sequence.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    lint_suppress:
    - missing_story_reference
  - id: CM-14-003
    priority: MUST
    kind: protocol
    statement: When the case initialization sequence creates a default embargo, the case owner MUST be seeded as `SIGNATORY`
      on that embargo immediately after the embargo reaches `EM.ACTIVE` state
    rationale: The case owner initiated the embargo by accepting the default policy on behalf of the case. Requiring a separate
      accept step would leave the case owner as a non-signatory on their own active embargo.
    verification: Integration tests in `test/demo/` confirm that the case owner is seeded as
      `SIGNATORY` on the default embargo immediately after it reaches `EM.ACTIVE` during case
      initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: refines
      spec_id: CM-13-006
    lint_suppress:
    - missing_story_reference
  - id: CM-14-004
    priority: MUST
    kind: protocol
    statement: The `Create(Case)` notification MUST be queued and the outbox flushed before the reporter is added as a `VultronParticipant`
      in step 5 of CM-14-001
    rationale: The reporter's system must receive and store the case object before any Announce(CaseLedgerEntry) fan-out that
      lists them as a participant. Reversing this order causes "case not found" errors on the reporter side when the log entry
      arrives referencing a case the reporter has not yet seen.
    verification: Integration tests in `test/demo/` confirm that the `Create(Case)` outbox flush
      occurs before the reporter `VultronParticipant` record is created during case
      initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-003
    lint_suppress:
    - missing_story_reference
  - id: CM-14-005
    priority: MUST
    kind: protocol
    statement: When the reporter is added as a `VultronParticipant` during case initialization, they MUST be seeded as `SIGNATORY`
      on any active embargo
    rationale: 'The reporter already possesses the vulnerability information before the case is created. Requiring an explicit
      embargo acceptance before sharing case content would create a paradoxical deadlock: the reporter has the information
      that the embargo is meant to protect, yet cannot receive case updates until they accept the embargo. Seeding them as
      SIGNATORY reflects their implicit consent, expressed by submitting the report.'
    verification: Integration tests in `test/demo/` confirm that the reporter is seeded as
      `SIGNATORY` on any active embargo when added as a `VultronParticipant` during case
      initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    lint_suppress:
    - missing_story_reference
  - id: CM-14-006
    priority: SHOULD
    kind: protocol
    statement: If the reporter included an embargo proposal with their `Offer(Report)`, the case initialization SHOULD reconcile
      the reporter's proposed duration against the receiver's default embargo policy and initialize the embargo at the shorter
      of the two durations
    note: 'No wire-format mechanism currently exists for a reporter to include an embargo proposal in an `Offer(Report)`.
      This requirement is forward-looking and cannot be exercised until that mechanism is implemented. See notes/embargo-default-semantics.md
      "Known Gap: No Reporter Embargo Proposal Mechanism" and specs/embargo-policy.yaml EP-04-003.'
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-004
  - id: CM-14-007
    priority: MUST
    kind: protocol
    statement: Additional participants MUST NOT be invited and embargo modifications MUST NOT be initiated until the case
      initialization sequence defined in CM-14-001 (including any applicable conditional steps) is complete
    rationale: 'The initialization sequence establishes the minimum valid case state: a case object, an owner, an optional
      embargo, and a reporter. Inviting third parties or modifying the embargo before this baseline is in place creates race
      conditions and protocol violations.'
    verification: Integration tests in `test/demo/` confirm that no Invite or embargo
      modification is emitted until all 6 initialization steps have completed.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    lint_suppress:
    - missing_story_reference
  - id: CM-14-008
    priority: MUST
    kind: protocol
    statement: >-
      Step 1 of the case initialization sequence MUST create the `VulnerabilityCase`
      with the receiving actor set as `attributed_to`.
    rationale: Creating the case object first establishes the anchor to which all subsequent
      initialization steps (participants, embargo, ledger) are attached.
    verification: Integration tests in `test/demo/` confirm that step 1 of case initialization
      creates the `VulnerabilityCase` with `attributed_to` set to the receiving actor.
    lint_suppress:
    - missing_story_reference
  - id: CM-14-009
    priority: MUST
    kind: protocol
    statement: >-
      Step 2 of the case initialization sequence MUST create the case-owner
      `VultronParticipant` with `RM.RECEIVED` and `CVDRole.CASE_OWNER`.
    rationale: The case-owner participant must exist before the default embargo can be
      initialized, so that the embargo is always associated with an existing participant.
    verification: Integration tests in `test/demo/` confirm that step 2 creates the case-owner
      `VultronParticipant` with `RM.RECEIVED` and `CVDRole.CASE_OWNER`.
    lint_suppress:
    - missing_story_reference
  - id: CM-14-010
    priority: MUST
    kind: protocol
    statement: >-
      Step 3 of the case initialization sequence MUST initialize the default embargo to
      `EM.ACTIVE` and seed the case owner as `SIGNATORY`, if a default embargo policy is
      configured.
    rationale: If a default embargo policy is active it must be in place before any
      participant other than the case owner is added, so that all subsequent participants
      are subject to the embargo from the moment they join.
    verification: Integration tests in `test/demo/` confirm that step 3 sets the default embargo
      to `EM.ACTIVE` and seeds the case owner as `SIGNATORY` when a default policy is
      configured.
    lint_suppress:
    - missing_story_reference
  - id: CM-14-011
    priority: MUST
    kind: protocol
    statement: >-
      Step 4 of the case initialization sequence MUST queue a `Create(Case)` activity
      addressed to the reporter and flush the outbox.
    rationale: The reporter's system must receive and store the case object before any
      Announce(CaseLedgerEntry) fan-out that references it.
    verification: Integration tests in `test/demo/` confirm that step 4 queues `Create(Case)`
      addressed to the reporter and flushes the outbox.
    lint_suppress:
    - missing_story_reference
  - id: CM-14-012
    priority: MUST
    kind: protocol
    statement: >-
      Step 5 of the case initialization sequence MUST add the reporter as a
      `VultronParticipant` with `RM.ACCEPTED` and `CVDRole.FINDER`/`REPORTER`, and seed
      them as `SIGNATORY` on any active embargo.
    rationale: The reporter is added after the Create(Case) notification is flushed
      (CM-14-011) so that the case object exists on the reporter's system before the
      fan-out of the ledger entry that records their participation.
    verification: Integration tests in `test/demo/` confirm that step 5 adds the reporter as a
      `VultronParticipant` with `RM.ACCEPTED` and seeds them as `SIGNATORY` on any active
      embargo.
    lint_suppress:
    - missing_story_reference
  - id: CM-14-013
    priority: MUST
    kind: protocol
    statement: >-
      Step 6 of the case initialization sequence MUST commit a case ledger entry,
      triggering `Announce(CaseLedgerEntry)` fan-out to all participants.
    rationale: The ledger entry commits the completed initialization as a single
      protocol-significant event and notifies all participants atomically.
    verification: Integration tests in `test/demo/` confirm that step 6 commits a case ledger
      entry that triggers `Announce(CaseLedgerEntry)` fan-out to all participants.
    lint_suppress:
    - missing_story_reference
- id: CM-15
  title: Case Creation Policy
  description: Requirements for the configurable auto_create_case policy on ActorConfig, which controls whether a VulnerabilityCase
    is created automatically upon receipt of an Offer(Report).
  specs:
  - id: CM-15-001
    priority: MUST
    kind: protocol
    statement: 'ActorConfig MUST expose an `auto_create_case` boolean field with a default value of `True`.'
    rationale: Receivers that follow the Option 3 protocol path (send Read(Offer(Report)) before deciding to accept or reject)
      require the ability to delay case creation. The default (True) preserves the original ADR-0015 Option 4 "always create
      at RM.RECEIVED" behavior for all existing actors and demos.
    verification: Inspection of `vultron/core/` confirms that `ActorConfig` declares an
      `auto_create_case` boolean field defaulting to `True`.
    relationships:
    - rel_type: refines
      spec_id: CM-12-001
    adr:
    - ADR-0015
    - ADR-0041
    lint_suppress:
    - missing_story_reference
  - id: CM-15-002
    priority: MUST
    kind: protocol
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(Report)` MUST store the `VulnerabilityReport` and the `Offer(Report)`
      activity in the DataLayer.
    rationale: The report materials must be persisted even when case creation is suppressed
      so that they can be retrieved if the operator later enables case creation or reviews
      the offer manually.
    verification: Integration tests in `test/demo/` confirm that when `auto_create_case` is
      `False`, processing an `Offer(Report)` persists the report and offer in the DataLayer
      without creating a `VulnerabilityCase`.
    lint_suppress:
    - missing_story_reference
  - id: CM-15-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(Report)` MUST NOT create a `VulnerabilityCase`.
    rationale: The purpose of the flag is to suppress automatic case creation; creating a
      case anyway would make the flag meaningless.
  - id: CM-15-004
    priority: MUST
    kind: protocol
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(Report)` MUST leave the receiver's outbox unchanged (no outbound activities
      are enqueued).
    rationale: Suppressing case creation also suppresses the associated outbound activities
      (e.g., Create(Case) to the reporter); the observable outcome is no outbound messages.
    verification: Integration tests in `test/demo/` confirm that when `auto_create_case` is
      `False`, processing an `Offer(Report)` leaves the actor's outbox empty.
    lint_suppress:
    - missing_story_reference
  - id: CM-15-005
    priority: MAY
    kind: protocol
    statement: >-
      The `auto_create_case` gate MAY be enforced as a routing-level short-circuit in
      `SubmitReportReceivedUseCase` or as an in-tree condition node at the root of
      `create_receive_report_case_tree`; the observable outcome (no case, no outbound
      activities) is normative, not the enforcement location.
    rationale: Case creation is protocol-significant behavior (BT-15-001), so the canonical
      gate lives in the behavior tree as a condition node; the use-case short-circuit is an
      equivalent optimization that avoids invoking the BT for a decision already known at
      dispatch time. Either placement yields the same observable outcome.
- id: CM-16
  title: Actor Suggestion Routing (Recommend-Actor Flow)
  specs:
  - id: CM-16-001
    priority: MUST
    kind: protocol
    statement: A participant wishing to suggest that another actor be invited to the case MUST send `Offer(object=Actor, target=Case)`
      to the CaseActor's inbox, not directly to the Case Owner's inbox.
    rationale: All case-scoped protocol messages MUST route through the CaseActor so the event can be recorded in the canonical
      case ledger before any downstream action is taken (ADR-0021, PCR-08-001).
    verification: Integration tests in `test/demo/` confirm that an actor-suggestion
      `Offer(object=Actor, target=Case)` is sent to the CaseActor's inbox, not directly to the
      Case Owner.
    relationships:
    - rel_type: implements
      spec_id: PCR-08-001
    adr:
    - ADR-0021
    lint_suppress:
    - missing_story_reference
  - id: CM-16-002
    priority: MUST
    kind: protocol
    statement: When the CaseActor receives `Offer(object=Actor, target=Case)`, it MUST commit a `CaseLedgerEntry` for the
      received Offer and fan out the entry to all participants BEFORE taking any downstream action.
    rationale: Ledger entries record events that have already occurred; pre-committing a decision before communicating it
      is not permitted (CLP-10-006 commit ordering).
    verification: Integration tests in `test/demo/` confirm that the CaseActor commits a
      `CaseLedgerEntry` and fans it out to participants before taking any downstream action on a
      received `Offer(Actor)`.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
    lint_suppress:
    - missing_story_reference
  - id: CM-16-003
    priority: MUST
    kind: project
    statement: >-
      After recording the received `Offer(Actor)`, the CaseActor MUST assign a non-empty
      default role list for the suggested actor via an Evaluator BT node (ADR-0024 shape:
      Evaluator).
    verification: Inspection of `vultron/core/` confirms that an Evaluator BT node assigns a
      non-empty default role list for a suggested actor before the downstream consumer node
      processes the offer.
    note: 'The Evaluator node is a call-out point (ADR-0025 abstraction; ADR-0024 shape: Evaluator) that MAY be replaced by
      a more sophisticated role-inference implementation in future. The non-empty invariant is enforced at write time so the
      downstream consumer never needs to treat an empty list as a sentinel. See CM-16-011 and CM-16-012 for the recommended
      and permitted default values.'
  - id: CM-16-011
    priority: SHOULD
    kind: protocol
    statement: The default role list SHOULD be `[CVDRole.VENDOR]` for actors whose type cannot be determined from context,
      because in CVD cases the most likely role for a newly added participant is Vendor.
  - id: CM-16-012
    priority: MAY
    kind: protocol
    statement: The default role list MAY be `[CVDRole.OBSERVER]` when the Evaluator can determine that the suggested actor
      does not fit any known CVD role but still requires case membership (e.g., a security researcher with no vendor
      affiliation). `CVDRole.OBSERVER` is the most conservative choice because it makes no assumption about the actor's
      function in the CVD process beyond case observation (CM-25-001).
  - id: CM-16-013
    priority: MAY
    kind: protocol
    statement: The Evaluator's default role assignment MAY be overridden by actor-level configuration (e.g., a policy that
      maps known actor URIs to specific roles) or by the Case Owner at accept time when the Case Owner selects different roles
      for the suggested participant.
    rationale: The Case Owner has ultimate authority over who participates in their case and in what role. The Evaluator's
      output is a suggested starting point to reduce friction, not a binding decision. The Case Owner can always update role
      assignments to whatever they determine is appropriate.
  - id: CM-16-004
    priority: MUST
    kind: protocol
    statement: The CaseActor MUST transform the received `Offer(Actor)` into `Offer(object=CaseParticipant{attributed_to=actor,
      case_roles=roles}, target=Case)` and send it to the Case Owner's inbox, with `origin` set to the ID of the original
      recommender's Offer activity.
    rationale: The Case Owner makes a membership decision about a CaseParticipant (actor + roles), not about a bare Actor
      identity. The `origin` field preserves the causal chain without a side-channel data store.
    verification: Integration tests in `test/demo/` confirm that the CaseActor sends a
      transformed `Offer(object=CaseParticipant, target=Case)` to the Case Owner with `origin`
      set to the recommender's Offer ID.
    lint_suppress:
    - missing_story_reference
  - id: CM-16-005
    priority: MAY
    kind: protocol
    statement: The recommender's `Offer(Actor)` MAY include a `content` or `summary` field explaining why the actor is being
      suggested. The CaseActor SHOULD forward this text as the `content` of the transformed `Offer(CaseParticipant)` it sends
      to the Case Owner.
  - id: CM-16-006
    priority: MUST
    kind: protocol
    statement: After receiving `Accept(Offer(CaseParticipant))` from the Case Owner, the CaseActor MUST (1) commit a ledger
      entry for the Accept, (2) fan out the ledger entry, (3) send `AcceptActorRecommendation` to the original recommender
      with `in_reply_to` set to the ID of the original recommender's `Offer` activity, and (4) send `Invite(CaseStub[+embargo])`
      to the suggested actor per CM-17.
    verification: Integration tests in `test/demo/` confirm that after the Case Owner accepts a
      participant recommendation, the CaseActor commits a ledger entry, fans it out, sends
      `AcceptActorRecommendation`, and sends `Invite` to the suggested actor.
    relationships:
    - rel_type: implements
      spec_id: CM-17-001
    lint_suppress:
    - missing_story_reference
  - id: CM-16-007
    priority: MUST
    kind: protocol
    statement: After receiving `Reject(Offer(CaseParticipant))` from the Case Owner, the CaseActor MUST (1) commit a ledger
      entry for the Reject, (2) fan out the ledger entry, and (3) send `RejectActorRecommendation` to the original recommender
      with `in_reply_to` set to the ID of the original recommender's `Offer` activity.
    verification: Integration tests in `test/demo/` confirm that after the Case Owner rejects a
      participant recommendation, the CaseActor commits a ledger entry, fans it out, and sends
      `RejectActorRecommendation` to the recommender.
    lint_suppress:
    - missing_story_reference
  - id: CM-16-008
    priority: MUST
    kind: protocol
    statement: >-
      When a second `Offer(Actor X, Case)` arrives while a pending decision for Actor X is
      still outstanding (no Accept or Reject yet received from the Case Owner), the CaseActor
      MUST record the duplicate recommendation in the ledger.
    verification: Integration tests in `test/demo/` confirm that a duplicate `Offer(Actor X,
      Case)` arriving while a prior decision is pending is recorded in the case ledger.
    lint_suppress:
    - missing_story_reference
  - id: CM-16-009
    priority: MUST
    kind: protocol
    statement: When a second `Offer(Actor X, Case)` arrives after an Invite has already been sent to Actor X (i.e., the invite
      is in-flight or the actor is already a participant), the CaseActor MUST record the recommendation in the ledger, fan
      out the entry, and auto-send `AcceptActorRecommendation` (with `in_reply_to` = original recommender's Offer ID) back
      to the second recommender. The CaseActor MUST NOT send a duplicate Invite to Actor X.
    verification: Integration tests in `test/demo/` confirm that when Actor X is already invited
      or a participant, a second `Offer(Actor X)` is recorded, `AcceptActorRecommendation` is
      sent to the second recommender, and no duplicate Invite is sent.
    lint_suppress:
    - missing_story_reference
  - id: CM-16-010
    priority: MUST
    kind: protocol
    statement: In every step of the actor suggestion flow, the CaseActor MUST commit the ledger entry for a protocol event
      AFTER the corresponding message has been sent or received, never before.
    rationale: Pre-announcing a decision in the ledger before communicating the decision creates a window where the ledger
      shows an effect without its cause.
    verification: Integration tests in `test/demo/` confirm that ledger entries in the actor
      suggestion flow are committed only after the corresponding message has been sent or
      received, never before.
    lint_suppress:
    - missing_story_reference
  - id: CM-16-014
    priority: MUST
    kind: project
    statement: >-
      The Evaluator BT node assigned to default role list assignment MUST return `FAILURE`
      if it cannot produce a non-empty role list.
    rationale: A FAILURE return forces the enclosing BT subtree to handle the empty-list
      case explicitly rather than propagating an empty list to downstream consumers.
    verification: Inspection of `vultron/core/` confirms that the Evaluator BT node for default
      role assignment returns `FAILURE` when it cannot produce a non-empty role list.
  - id: CM-16-015
    priority: MUST_NOT
    kind: project
    statement: >-
      The downstream consumer node of the Evaluator BT node MUST NOT silently substitute a
      default for an empty list written by the Evaluator (ADR-0032 BT-HELPER-01).
    rationale: Silent substitution by the consumer hides Evaluator failures and produces
      participants with unexpected role assignments.
  - id: CM-16-016
    priority: MUST
    kind: protocol
    statement: >-
      When a second `Offer(Actor X, Case)` arrives while a pending decision for Actor X is
      still outstanding, the CaseActor MUST send a `Note` to the Case Owner's inbox
      indicating that a reinforcing suggestion was received, including the second
      recommender's identity and any `content` from the Offer.
    rationale: Notifying the Case Owner of reinforcing suggestions provides additional
      context for the pending decision without creating a duplicate offer workflow.
    verification: Integration tests in `test/demo/` confirm that a duplicate `Offer(Actor X,
      Case)` with a pending decision causes the CaseActor to send a `Note` to the Case Owner
      naming the second recommender.
    lint_suppress:
    - missing_story_reference
  - id: CM-16-017
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When a second `Offer(Actor X, Case)` arrives while a pending decision for Actor X is
      still outstanding, the CaseActor MUST NOT send a second transformed
      `Offer(CaseParticipant)` to the Case Owner.
    rationale: Sending a duplicate transformed Offer would create a second pending decision
      for the same actor, leading to conflicting state if the Case Owner responds to both.
- id: CM-17
  title: Invitation Flow — Enrichment and Roles
  specs:
  - id: CM-17-001
    priority: MUST
    kind: protocol
    statement: The `Invite` activity sent by the CaseActor to a new actor MUST include a case stub as the `object`, with the
      case stub containing at minimum the case ID and type. This requirement is extended by CM-17-002 and CM-17-003.
    verification: Integration tests in `test/demo/` confirm that the `Invite` activity emitted
      by the CaseActor contains a case stub object with at minimum the case ID and type.
    lint_suppress:
    - missing_story_reference
  - id: CM-17-002
    priority: MUST
    kind: protocol
    statement: When `CaseStatus.em_state == ACTIVE` at the time the Invite is sent, the case stub MUST include at minimum
      the `activeEmbargo` reference (ID + `end_time`) and the embedded `CaseStatus.em_state` field so the invitee can give
      informed consent before accepting.
    rationale: 'The invite-accept cycle is the only consent signal for late-joining participants when an active embargo already
      exists. Accepting without seeing embargo terms is not meaningfully informed consent (issue #1289, MV-10-006).'
    verification: Integration tests in `test/demo/` confirm that when `CaseStatus.em_state ==
      ACTIVE` at invite time, the case stub includes the `activeEmbargo` reference and embedded
      `em_state` field.
    relationships:
    - rel_type: implements
      spec_id: MV-10-006
    lint_suppress:
    - missing_story_reference
  - id: CM-17-003
    priority: MUST
    kind: project
    statement: >-
      The `Invite` activity MUST embed the intended `case_roles: list[CVDRole]` for the
      invitee so that `EmitInviteActorToCaseNode` can include them in the wire activity.
    rationale: 'All invited participants getting `caseRoles=[]` is a protocol defect (issue #1288). The participant record
      created on `Accept(Invite)` MUST reflect the roles the Case Owner intended, whether those roles arrived via a direct
      trigger request or via the suggest-actor round-trip.'
    verification: Integration tests in `test/demo/` confirm that the `Invite` activity emitted
      for a new participant embeds a non-empty `case_roles` list for the invitee.
  - id: CM-17-004
    priority: MUST
    kind: protocol
    statement: When the CaseActor receives `Accept(Invite)` from the invitee, it MUST (1) commit a ledger entry for the Accept,
      (2) fan out the ledger entry to ALL existing participants, (3) create a `CaseParticipant` record for the invitee at
      `RM.RECEIVED` with the roles from the Invite, (4) sign embargo consent if `em_state == EM.ACTIVE` (CM-10-001), (5) send
      `Announce(VulnerabilityCase)` with the current full case snapshot to the invitee, and (6) backfill all prior `CaseLedgerEntry`
      records to the invitee in log-index order.
    verification: 'Integration tests in `test/demo/` confirm that `Accept(Invite)` triggers the
      CaseActor''s 6-step sequence: ledger commit, fan-out, participant creation at
      `RM.RECEIVED`, embargo consent, full case snapshot delivery, and ledger backfill.'
    note: >-
      Step (3) previously read `RM.ACCEPTED`. That contradicted CM-11-001, which requires the CaseActor to record
      `RM.RECEIVED` on `Accept(Invite)` — `Accept(Invite)` signals willingness to join, not validation of the report.
      The implementation follows CM-11-001 (`CreateInviteeParticipantAtReceivedNode` in
      `vultron/core/behaviors/case/accept_invite_tree.py`); this text was not updated when CM-11-001 was corrected.
      The ordering of steps (3), (4), and (5) is load-bearing: the gate on full case delivery is admission to the
      case plus embargo consent, NOT completion of RM triage. The invitee is created at `RM.RECEIVED` (3), embargo
      consent is signed if an embargo is active (4), and only then is the full case snapshot sent (5). See MV-10-005
      as corrected, and MV-10-006 for the accept-implies-consent rule.
    relationships:
    - rel_type: implements
      spec_id: CM-11-001
    - rel_type: implements
      spec_id: CM-10-001
    - rel_type: implements
      spec_id: PCR-08-010
    lint_suppress:
    - missing_story_reference
  - id: CM-17-005
    priority: MUST_NOT
    kind: protocol
    statement: The invitee MUST NOT appear in the case participant list until their `Accept(Invite)` has been received and
      processed by the CaseActor. A pending invitation (Invite sent, no response yet) is tracked only as a ledger entry, not
      as a participant record.
    rationale: A participant record implies an active RM state (`RM.RECEIVED` per CM-17-004) and the associated permissions.
      Creating one before the invitee has consented would grant protocol access prematurely.
  - id: CM-17-006
    priority: MUST
    kind: protocol
    statement: The CaseActor MUST commit a `CaseLedgerEntry` for the emitted `Invite` activity (recording the fact of its
      emission) AFTER the Invite has been queued for delivery to the invitee. The commit MUST NOT precede the emission.
    verification: Integration tests in `test/demo/` confirm that the CaseActor commits the
      `CaseLedgerEntry` for an emitted `Invite` only after the Invite has been queued for
      delivery.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
    lint_suppress:
    - missing_story_reference
  - id: CM-17-007
    priority: MUST
    kind: project
    statement: >-
      In the direct-trigger path (the Case Owner calls `invite-actor-to-case` with a
      `roles` list), `SvcInviteActorToCaseUseCase` MUST write that list to the blackboard
      key `suggested_roles` via `_extra_execute_kwargs()` before BT execution so that
      `EmitInviteActorToCaseNode` can read it.
    rationale: >-
      Without writing to `suggested_roles` before BT execution, `EmitInviteActorToCaseNode`
      has no roles to embed and will emit the Invite with `roles=None`, producing the
      `caseRoles=[]` defect described in CM-17-003.
    verification: Inspection of `vultron/core/` confirms that
      `SvcInviteActorToCaseUseCase._extra_execute_kwargs()` writes the `roles` list to the
      blackboard key `suggested_roles` before BT execution.
  - id: CM-17-008
    priority: MUST
    kind: project
    statement: >-
      In the suggest-actor received path (the CaseActor receives
      `Accept(Offer(CaseParticipant))`), the invitee's `CaseParticipant.case_roles` MUST
      be populated on `Accept(Invite)` by reading roles from the persisted `Invite` wire
      object (CM-17-004), with roles originating from the Case Owner's Accept response
      (CM-16-006) or the CaseActor's default role assignment (CM-16-003).
    rationale: >-
      In this path `AcceptOfferCaseParticipantReceivedUseCase` does not write
      `suggested_roles`; the Invite is emitted with `roles=None`. The persisted wire object
      is the only place the originally intended roles are available at Accept(Invite) time.
    verification: Integration tests in `test/demo/` confirm that in the suggest-actor path the
      invitee's `CaseParticipant.case_roles` is populated from the persisted `Invite` wire
      object on `Accept(Invite)` processing.
- id: CM-18
  title: Participant Embargo Consent State Machine
  specs:
  - id: CM-18-001
    priority: MUST
    kind: protocol
    statement: 'Each participant''s embargo consent MUST be tracked as a `ParticipantEmbargoConsent` (PEC) value with five
      possible states: `NO_EMBARGO` (no embargo is in scope for this participant), `INVITED` (invite sent, awaiting response),
      `SIGNATORY` (accepted the current terms), `LAPSED` (was `SIGNATORY`; the case embargo entered `REVISE`, so prior consent
      no longer covers the revised terms), and `DECLINED` (explicitly refused, or timed out without responding).'
    rationale: 'The five-state PEC machine formalizes the "pocket veto" mechanism: a participant who is invited but never
      responds is recorded as `DECLINED` when the timer fires, rather than blocking progress indefinitely.
      Source: `notes/participant-embargo-consent.md`.
      `LAPSED` is NOT the timer path — it is reached only from `SIGNATORY` via the `REVISE` trigger (CM-18-002, CM-18-003).
      Confusing `LAPSED` with the pocket-veto timeout is a known documentation pitfall; both timer paths
      (`INVITED → DECLINED`, `LAPSED → DECLINED`) terminate in `DECLINED`.
      Per ADR-0048, `NO_EMBARGO` denotes the *absence of an embargo in scope*, not a "not yet consented" pre-consent state:
      it is correct for a participant in a case with `EM.NONE`, and it is the `RESET` destination when an embargo is
      terminated. It MUST NOT be read as implying that consent is pending or that an invitation is owed.'
    verification: 'Inspection of `vultron/core/states/participant_embargo_consent.py` confirms
      that `ParticipantEmbargoConsent` declares exactly five states: `NO_EMBARGO`, `INVITED`,
      `SIGNATORY`, `LAPSED`, and `DECLINED`.'
    adr:
    - ADR-0048
    lint_suppress:
    - missing_story_reference
  - id: CM-18-002
    priority: MUST
    kind: protocol
    statement: 'The `INVITED → DECLINED` and `LAPSED → DECLINED` transitions MAY be driven by a timer expiry (pocket veto)
      rather than requiring an explicit participant action. The timer period SHOULD be a configurable policy window (default:
      7 days). The pocket veto materialises when the timer fires without a prior acceptance; the system records the transition
      to `DECLINED` as if the participant had declined. The `SIGNATORY → LAPSED` transition is NOT timer-based: it fires when
      the embargo enters the `REVISE` state, invalidating prior consent for the new terms.'
    note: >-
      The policy window is the FALLBACK, not the primary mechanism. When the
      inviting `Invite(EmbargoEvent)` activity carries an explicit
      `Invite.end_time`, that value is authoritative and supersedes this window
      (CM-28-002). The pocket veto and the explicit RSVP deadline are ONE
      mechanism at two levels of explicitness, not two competing timeouts.
    rationale: 'Per `notes/participant-embargo-consent.md`: `LAPSED` means "embargo terms changed; prior consent no longer
      applies." `DECLINED` includes both explicit refusals and timeout-based implicit refusals. Confusing `LAPSED` with the
      timer path is a known documentation pitfall.'
    verification: Inspection of `vultron/core/` confirms that the PEC state machine implements
      timer-driven `INVITED->DECLINED` and `LAPSED->DECLINED` transitions with a configurable
      policy window.
    lint_suppress:
    - missing_story_reference
  - id: CM-18-003
    priority: MUST
    kind: project
    statement: >-
      The PEC state machine MUST implement exactly the following valid triggers:
      INVITE (from NO_EMBARGO, LAPSED, or DECLINED), ACCEPT (from NO_EMBARGO,
      INVITED, or LAPSED), DECLINE (from NO_EMBARGO, INVITED, or LAPSED),
      REVISE (from SIGNATORY only), and RESET (from any state).
    rationale: 'The `LAPSED` and `DECLINED` states are not terminal: a participant who lapsed or declined can be re-invited
      (e.g., when embargo terms change). `SIGNATORY → LAPSED` occurs when the embargo enters REVISE and the participant''s
      prior consent no longer covers the revised terms. Per ADR-0048, `ACCEPT` and `DECLINE` are valid directly from
      `NO_EMBARGO`, because consent is not always mediated by an invitation: a Finder who sets the embargo on their own case
      has no inviter; participants added during case initialization already have an embargo in scope (ADR-0041); and the
      reporter''s consent is implicit in submitting the report (CM-14-005). Requiring a synthetic `INVITED` step for these
      paths would record an invitation event that never occurred. `DECLINE` is valid from `NO_EMBARGO` for symmetry, so a
      participant added to an embargoed case can refuse without a formal invitation. See
      `vultron/core/states/participant_embargo_consent.py`.'
    verification: Inspection of `vultron/core/states/participant_embargo_consent.py` confirms
      that `PecDimension` implements exactly the triggers INVITE, ACCEPT, DECLINE, REVISE, and
      RESET with the specified source-state constraints.
    relationships:
    - rel_type: refines
      spec_id: CM-18-001
    adr:
    - ADR-0048
  - id: CM-18-004
    priority: MUST_NOT
    kind: protocol
    statement: A participant's PEC state MUST NOT move from `SIGNATORY` to `INVITED` directly (bypassing `LAPSED`). The only
      path back to `INVITED` from resolved states is via `LAPSED → INVITED` (after a REVISE trigger) or `DECLINED → INVITED`
      (re-invite after explicit decline). `SIGNATORY → INVITED` is not a valid transition.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
  - id: CM-18-005
    priority: MUST
    kind: project
    statement: A participant's PEC state MUST be changed by applying a `PEC_Trigger` through `PecDimension.transition()` and
      persisting the resulting `ParticipantStatus`. Code MUST NOT set `CaseParticipant.embargo_consent_state` by direct field
      assignment as the means of recording a consent change.
    rationale: '`PecDimension.transition()` (ADR-0036, SDO-01-001) validates the trigger against the PEC machine and raises
      `VultronInvalidStateTransitionError` on an illegal transition, making consent writes fail-closed regardless of upstream
      BT guard coverage. Direct assignment to the scalar `embargo_consent_state` field bypasses both the state machine and
      `_sync_latest_status_metadata()`, so the participant''s latest `ParticipantStatus` retains its previous `consent.state`,
      causing the emitted ledger snapshot to contradict itself (e.g. `{"embargoAdherence": true, "emConsentState": "NO_EMBARGO"}`).
      The legacy `apply_pec_trigger()` soft-fail helper was removed (CONCERN-1871); all consent-write sites MUST use
      `CaseParticipant.apply_pec_transition()`, which delegates to `PecDimension.transition()` and syncs the resulting
      `ParticipantStatus`. Per ADR-0048.'
    verification: Inspection of `vultron/core/` confirms that all consent-write sites call
      `CaseParticipant.apply_pec_transition()` (which delegates to `PecDimension.transition()`)
      and that no site sets `embargo_consent_state` by direct field assignment.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0048
  - id: CM-18-006
    priority: MUST
    kind: project
    statement: >-
      A PEC state change that is protocol-significant MUST be recorded in the canonical case
      ledger as an `Add(ParticipantStatus)` entry whose `payloadSnapshot` carries the
      participant's post-transition PEC value.
    rationale: 'PEC state lives on `ParticipantStatus.consent`, so `Add(ParticipantStatus)` is the correct ledger entry type
      for a consent change; no separate embargo-event entry type is needed. Per ADR-0048.'
    verification: Integration tests in `test/demo/` confirm that a protocol-significant PEC
      state change produces an `Add(ParticipantStatus)` ledger entry whose `payloadSnapshot`
      carries the post-transition PEC value.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-005
    adr:
    - ADR-0048
    - ADR-0056
  - id: CM-18-007
    priority: MUST
    kind: project
    statement: >-
      The case-initialization sequence MUST establish the default embargo before setting each
      participant's PEC state, so that each participant's initial `ParticipantStatus` carries
      its true post-initialization consent value.
    rationale: 'Because `ACCEPT` is valid directly from `NO_EMBARGO` (CM-18-003, ADR-0048), an initialization participant reaches
      its consent state in a single transition, so a placeholder entry is unnecessary. Emitting two entries per participant would
      also shift every downstream `log_index`; PR #1746 was reverted for exactly that, having broken `fvcv-extension` VFD
      replication timing. Holding initialization to one entry per participant keeps `log_index` order stable and preserves the
      ADR-0041 property that `log_index` order is causal order.'
    verification: Integration tests in `test/demo/` confirm that the default embargo is
      established before each participant's PEC state is written during case initialization, so
      each initial `ParticipantStatus` carries the correct post-initialization consent value.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-006
    - rel_type: depends_on
      spec_id: CM-14-003
    adr:
    - ADR-0048
  - id: CM-18-008
    priority: MUST
    kind: project
    statement: >-
      `ParticipantStatus.embargo_adherence` MUST be implemented as a computed property
      (e.g., Pydantic `@computed_field`) that returns `True` if and only if
      `consent.state == PEC.SIGNATORY`.
    rationale: >
      A stored boolean field can drift from the PEC state it is meant to project and its fail-open default (`True`)
      violates the principle that unset consent should not be treated as active consent. Making `embargo_adherence` a
      computed property eliminates the drift risk permanently and makes the fail-closed invariant unbypassable.
      Resolved by ADR-0056, closing the open question recorded in the draft specification §6.4.6.
    verification: Inspection of `vultron/core/models/` confirms that
      `ParticipantStatus.embargo_adherence` is implemented as a `@computed_field` (or
      equivalent) that returns `True` if and only if `consent.state == PEC.SIGNATORY`.
    relationships:
    - rel_type: refines
      spec_id: CM-18-006
    adr:
    - ADR-0056
  - id: CM-18-009
    priority: MUST
    kind: project
    statement: >-
      Any PEC state transition not listed in CM-18-003 MUST be rejected as a protocol error.
    rationale: Rejecting unlisted transitions fail-closes the PEC state machine, preventing
      consent-state corruption from malformed or unexpected triggers.
    verification: A unit test confirms that applying an unlisted PEC trigger raises
      `VultronInvalidStateTransitionError` rather than silently succeeding.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0048
  - id: CM-18-010
    priority: MUST
    kind: project
    statement: >-
      The ledger entry snapshot's `emConsentState` field MUST agree with the participant's
      `embargo_consent_state` at the time of recording.
    rationale: >-
      Disagreement between the snapshot and the participant record produces the
      contradictory-snapshot defect described in CM-18-005, causing ledger consumers to
      read an incorrect consent state (DRPT-02-008).
    verification: A unit test confirms that the ledger entry snapshot's `emConsentState` field
      matches the participant's `embargo_consent_state` at the time the entry is committed.
    relationships:
    - rel_type: refines
      spec_id: CM-18-006
    adr:
    - ADR-0048
  - id: CM-18-011
    priority: MUST
    kind: project
    statement: >-
      The ledger entry snapshot's `embargoAdherence` field MUST be `true` if and only if
      `embargo_consent_state` is `SIGNATORY`.
    rationale: >-
      `embargoAdherence` is a projection of the PEC state; allowing it to be `true` for
      any state other than `SIGNATORY` would grant content-delivery access to participants
      who have not consented to the embargo.
    verification: A unit test confirms that the ledger entry snapshot's `embargoAdherence` field
      is `true` when and only when `embargo_consent_state` is `SIGNATORY`.
    relationships:
    - rel_type: refines
      spec_id: CM-18-006
    adr:
    - ADR-0048
  - id: CM-18-012
    priority: MUST
    kind: project
    statement: >-
      The case initialization sequence MUST commit exactly one
      `add_participant_status_to_participant` ledger entry per participant.
    rationale: >-
      Emitting two entries per participant shifts every downstream `log_index`; PR #1746
      was reverted for exactly that, having broken `fvcv-extension` VFD replication timing.
      Holding initialization to one entry per participant keeps `log_index` order stable.
    verification: Integration tests in `test/demo/` confirm that case initialization commits
      exactly one `add_participant_status_to_participant` ledger entry per participant.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-007
    adr:
    - ADR-0048
  - id: CM-18-013
    priority: MUST_NOT
    kind: project
    statement: >-
      The case initialization sequence MUST NOT commit a `NO_EMBARGO` placeholder ledger
      entry for a participant followed by a corrective consent entry for the same
      participant.
    rationale: >-
      Because `ACCEPT` is valid directly from `NO_EMBARGO` (CM-18-003, ADR-0048), an
      initialization participant reaches its consent state in a single transition, making a
      placeholder entry unnecessary and harmful to `log_index` stability.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-012
    adr:
    - ADR-0048
  - id: CM-18-014
    priority: MUST_NOT
    kind: project
    statement: '`ParticipantStatus.embargo_adherence` MUST NOT be declared as a stored field.'
    rationale: >-
      A stored field can drift from the PEC state it projects and its fail-open default
      (`True`) would treat unset consent as active consent.
    relationships:
    - rel_type: refines
      spec_id: CM-18-008
    adr:
    - ADR-0056
  - id: CM-18-015
    priority: MUST
    kind: project
    statement: >-
      The wire projection (`as_ParticipantStatus.from_core()`) MUST derive the
      `embargoAdherence` value from the consent state rather than copying a stored field.
    rationale: >-
      Deriving from consent state at projection time ensures the wire value is always
      consistent with the authoritative PEC state, eliminating the drift risk that arises
      when a stored boolean is copied.
    verification: Inspection of `vultron/core/` confirms that `as_ParticipantStatus.from_core()`
      derives the `embargoAdherence` wire value from `consent.state` rather than copying a
      stored boolean.
    relationships:
    - rel_type: refines
      spec_id: CM-18-008
    adr:
    - ADR-0056
- id: CM-19
  title: Participant Index Discipline
  specs:
  - id: CM-19-001
    priority: MUST
    kind: protocol
    statement: '`case_participants` (the persisted set of `CaseParticipant` records) is the authoritative source of participant
      membership. `actor_participant_index` (the in-memory dict mapping actor IDs to participants) is a cache derived from
      it. Divergence between these two structures is a hard error, not a recoverable state.'
    rationale: A divergence means the cache has entries the authority doesn't know about (or vice versa), producing silently
      incorrect routing and access-control decisions.
    verification: Inspection of `vultron/core/models/case.py` confirms that `case_participants`
      is the persisted authority and `actor_participant_index` is declared as a derived cache,
      with any divergence treated as a hard error.
    lint_suppress:
    - missing_story_reference
  - id: CM-19-002
    priority: MUST
    kind: protocol
    statement: Any code path that modifies `case_participants` (add, remove, update) MUST also update `actor_participant_index`
      atomically within the same transaction or method call. The index MUST NOT be allowed to lag the authority.
    verification: Inspection of `vultron/core/` confirms that every code path modifying
      `case_participants` through the canonical mutators also updates `actor_participant_index`
      atomically in the same call.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
    lint_suppress:
    - missing_story_reference
  - id: CM-19-003
    priority: MUST
    kind: protocol
    statement: Code that needs a participant by actor ID MUST read from `actor_participant_index` (the cache). Code that needs
      the canonical participant set (e.g., for broadcast or audit) MUST read from `case_participants`. Using the cache for
      canonical iteration is prohibited because cache population order is undefined.
    verification: Inspection of `vultron/core/` confirms that actor-ID lookups read from
      `actor_participant_index` and canonical iteration (broadcast, audit) reads from
      `case_participants`.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
    lint_suppress:
    - missing_story_reference
- id: CM-20
  title: Coordinator-as-Participant Role Constraints
  specs:
  - id: CM-20-001
    priority: MUST
    kind: protocol
    statement: >-
      A Coordinator invited to a case as a regular participant MUST hold
      `CVDRole.COORDINATOR` in their `case_roles` list.
    rationale: '`CASE_OWNER` is the role that confers case administration authority (CM-02-001, CM-02-004, CM-02-005). `CASE_MANAGER`
      is a distinct role reserved exclusively for the CaseActor service; it grants write authority to the canonical ledger
      (CLP-09) and MUST NOT be held by any participant actor regardless of their organizational role. These two constraints
      are independent: a Coordinator participant lacks both `CASE_OWNER` (they are not the case administrator) and `CASE_MANAGER`
      (they are not the case management service).'
    verification: Integration tests in `test/demo/` confirm that a Coordinator actor admitted to
      a case holds `CVDRole.COORDINATOR` in their `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-003
    lint_suppress:
    - missing_story_reference
  - id: CM-20-002
    priority: MUST
    kind: protocol
    statement: When a Coordinator is suggested via the `Offer(Actor, Case)` path (CM-16) and the Case Owner approves the invitation,
      the roles assigned to the Coordinator participant MUST include `CVDRole.COORDINATOR` and MUST NOT include `CVDRole.CASE_MANAGER`
      or `CVDRole.CASE_OWNER`.
    rationale: Invitation and case ownership transfer are distinct protocol operations. An `Offer(Actor, Case)` invite adds
      a participant; it does not transfer `CASE_OWNER` authority (CM-02-001) or the `CASE_MANAGER` service role (CM-20-001).
      Role assignments at invite time must reflect the invited actor's actual function in the case, not their organizational
      identity.
    verification: Integration tests in `test/demo/` confirm that a Coordinator admitted via
      `Offer(Actor, Case)` is assigned `CVDRole.COORDINATOR` without `CVDRole.CASE_MANAGER` or
      `CVDRole.CASE_OWNER`.
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
    - rel_type: refines
      spec_id: CM-16-004
    lint_suppress:
    - missing_story_reference
  - id: CM-20-003
    priority: MUST
    kind: protocol
    statement: When a Coordinator participant (holding `CVDRole.COORDINATOR` without `CVDRole.CASE_MANAGER`) suggests that
      another actor be added to the case via `Offer(Actor, Case)`, the suggestion MUST route through the CaseActor inbox per
      ADR-0026 (CM-16-001). The Case Owner — not the Coordinator — MUST remain the sole decision-maker for approving or rejecting
      the invitation (CM-02-001).
    rationale: 'A Coordinator-as-participant should be able to exercise their facilitation role (suggesting additional vendors)
      without requiring ownership transfer. The CaseActor-routed suggest flow (ADR-0026) already provides this: the Coordinator
      sends `Offer(Actor, Case)` to the CaseActor, which records and forwards it to the Case Owner for approval.'
    verification: Integration tests in `test/demo/` confirm that a Coordinator participant's
      actor-suggestion message routes through the CaseActor and the Case Owner must approve or
      reject the invitation.
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-001
    adr:
    - ADR-0026
    lint_suppress:
    - missing_story_reference
  - id: CM-20-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Coordinator invited to a case as a regular participant MUST NOT hold
      `CVDRole.CASE_MANAGER` in their `case_roles` list.
    rationale: '`CVDRole.CASE_MANAGER` is reserved exclusively for the CaseActor service (CBT-01-003); it grants write authority
      to the canonical ledger and MUST NOT be held by any organizational or human participant.'
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
  - id: CM-20-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      `CVDRole.CASE_MANAGER` MUST NOT be assigned to any organizational or human participant
      joining a case as a facilitation actor rather than as the CaseActor service
      (CBT-01-003).
    rationale: '`CVDRole.CASE_MANAGER` grants write authority to the canonical ledger (CLP-09). Assigning it to a human or
      organizational participant would allow them to author ledger entries that the CaseActor is the sole authorized author of.'
    relationships:
    - rel_type: refines
      spec_id: CM-20-004
- id: CM-21
  title: Ownership Transfer Protocol Effects
  specs:
  - id: CM-21-001
    priority: MUST
    kind: protocol
    statement: >-
      A `VulnerabilityCase` MUST have at most one participant holding
      `CVDRole.CASE_OWNER` at any point in time.  If a participant already
      holds `CVDRole.CASE_OWNER` when a new owner is designated, the system
      MUST remove `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant` record before or atomically with granting it to the
      new owner.
    rationale: >-
      `CASE_OWNER` confers exclusive case administration authority
      (CM-02-004, CM-02-005).  Two simultaneous holders would create
      conflicting authority: both could terminate embargoes, authorise
      invitations, and mutate case state independently.  The invariant must
      be enforced at the data-layer level, not just assumed by convention.
    verification: Integration tests in `test/demo/` confirm that at no point does a case have
      more than one participant holding `CVDRole.CASE_OWNER`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-004
    - rel_type: refines
      spec_id: CM-02-005
    lint_suppress:
    - missing_story_reference
  - id: CM-21-002
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity
      is processed, the system MUST add `CVDRole.CASE_OWNER` to the accepting
      actor's `CaseParticipant.case_roles` and MUST update
      `VulnerabilityCase.attributed_to` to the accepting actor's ID.
    rationale: >-
      `PublicDisclosureBranchNode` (and any other role-gated protocol node)
      determines case-owner authority by reading `CaseParticipant.case_roles`,
      not by comparing actor IDs against `attributed_to`.  Updating only
      `attributed_to` without also updating the participant record leaves the
      new owner unable to trigger embargo teardown, case closure, and other
      CASE_OWNER-gated operations.  Both fields MUST be kept in sync.
      Root cause of the FCCV-handoff CI failure (2026-07-23):
      `AcceptCaseOwnershipTransferNode` updated `attributed_to` but did not
      add `CVDRole.CASE_OWNER` to C2's participant record, so
      `_sender_is_case_owner()` returned False and embargo teardown was
      skipped.
    verification: Integration tests in `test/demo/` confirm that processing
      `Accept(Offer(VulnerabilityCase))` adds `CVDRole.CASE_OWNER` to the accepting actor's
      `case_roles` and updates `VulnerabilityCase.attributed_to` to the accepting actor's ID.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
    lint_suppress:
    - missing_story_reference
  - id: CM-21-003
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity is processed,
      the system MUST remove `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant.case_roles`.
    rationale: >-
      Transferring ownership does not evict the previous owner from the case;
      they continue to participate but no longer hold administrative authority.
      Stripping only `CASE_OWNER` (and not other roles) preserves their
      standing as a Coordinator, Vendor, or other role while satisfying the
      at-most-one invariant (CM-21-001).
    verification: Integration tests in `test/demo/` confirm that processing
      `Accept(Offer(VulnerabilityCase))` removes `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
    lint_suppress:
    - missing_story_reference
  - id: CM-21-004
    priority: MUST
    kind: project
    statement: >-
      The strip of `CVDRole.CASE_OWNER` from the previous holder (CM-21-003),
      the update of `VulnerabilityCase.attributed_to`, and the grant of
      `CVDRole.CASE_OWNER` to the new holder (CM-21-002) MUST be committed to
      storage as a single atomic transaction.  If any part of the write fails,
      the entire set MUST be rolled back so that no partial state is observable.
    rationale: >-
      Without atomicity a crash or exception between the strip and the grant
      produces a case with zero `CASE_OWNER` holders — a state worse than two
      simultaneous holders because it cannot be recovered by any subsequent
      normal protocol message.  The invariant in CM-21-001 ("at most one at any
      point in time") logically implies that the case MUST have exactly one
      `CASE_OWNER` at all times; this spec makes the storage-transaction
      requirement explicit so that DataLayer implementations cannot satisfy
      CM-21-001 through sequential saves.
    verification: Integration tests in `test/demo/` confirm that an ownership transfer writes
      the role-strip, `attributed_to` update, and role-grant as a single atomic transaction that
      either completes fully or is rolled back.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-003
  - id: CM-21-005
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Offer(VulnerabilityCase)` (ownership-transfer variant)
      MUST address the activity to the CaseActor's inbox (`to: [case_actor_id]`)
      rather than directly to the transferee.  The CaseActor MUST forward the
      Offer to the transferee's inbox after recording it.
    rationale: >-
      Routing the Offer through the CaseActor enables it to commit a
      `CaseLedgerEntry` for the offer-in-flight and broadcast
      `Announce(CaseLedgerEntry)` to all participants (including those not
      involved in the transfer, such as a Finder or second Vendor).  Direct
      actor-to-actor delivery bypasses the canonical log and leaves non-involved
      participants unaware that a transfer is being negotiated.
    verification: Integration tests in `test/demo/` confirm that an ownership-transfer
      `Offer(VulnerabilityCase)` is addressed to the CaseActor's inbox, which then forwards it
      to the transferee.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    adr:
    - ADR-0053
    lint_suppress:
    - missing_story_reference
  - id: CM-21-006
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Accept(Offer(VulnerabilityCase))` (ownership-transfer
      variant) MUST address the activity to the CaseActor's inbox
      (`to: [case_actor_id]`) rather than directly to the offerer.
    rationale: >-
      Routing the Accept through the CaseActor is required for the
      `AcceptCaseOwnershipTransferReceivedUseCase` to run on the authoritative
      CaseActor and trigger the post-transfer CaseLedgerEntry cascade
      (CM-21-007).  Addressing the Accept to the offerer's inbox means the use
      case only runs there; the CaseActor never learns of the completed transfer
      and cannot broadcast it.
    verification: Integration tests in `test/demo/` confirm that an ownership-transfer
      `Accept(Offer(VulnerabilityCase))` is addressed to the CaseActor's inbox.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-005
    adr:
    - ADR-0053
    lint_suppress:
    - missing_story_reference
  - id: CM-21-007
    priority: MUST
    kind: protocol
    statement: >-
      After `AcceptCaseOwnershipTransferReceivedUseCase` successfully applies
      the ownership-role changes (CM-21-002, CM-21-003, CM-21-004), the
      CaseActor MUST commit a `CaseLedgerEntry` recording the completed transfer
      and MUST broadcast `Announce(CaseLedgerEntry)` to all case participants.
    rationale: >-
      The CaseLedgerEntry broadcast is the only mechanism by which participants
      not involved in the transfer (e.g., a Finder or second Vendor) learn that
      the case owner has changed.  Without it, those participants have no
      reliable way to determine who is currently responsible for the case,
      leading to messages being directed to the wrong actor and coordination
      breakdown.  This requirement closes the surface-level symptom described
      in CONCERN-1755.
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer is
      applied, the CaseActor commits a `CaseLedgerEntry` and broadcasts
      `Announce(CaseLedgerEntry)` to all case participants.
    relationships:
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-006
    adr:
    - ADR-0053
    lint_suppress:
    - missing_story_reference
  - id: CM-21-008
    priority: MUST
    kind: protocol
    statement: >-
      When an ownership transfer is processed, the previous owner MUST retain any other
      roles they held (e.g., `CVDRole.COORDINATOR`, `CVDRole.VENDOR`) in their
      `CaseParticipant.case_roles`.
    rationale: >-
      Stripping only `CASE_OWNER` (and not other roles) preserves the previous owner's
      standing as a Coordinator, Vendor, or other role while satisfying the at-most-one
      `CASE_OWNER` invariant (CM-21-001).
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer the
      previous owner retains their non-`CASE_OWNER` roles (e.g., `CVDRole.COORDINATOR`) in their
      `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-003
    lint_suppress:
    - missing_story_reference
  - id: CM-21-009
    priority: MUST
    kind: protocol
    statement: >-
      When an ownership transfer is processed, the previous owner MUST remain a participant
      in the case.
    rationale: >-
      Ownership transfer is not case departure. The previous owner has institutional
      knowledge of the case and continues to participate; only their administrative
      authority is transferred.
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer the
      previous owner remains in the case participants list.
    relationships:
    - rel_type: refines
      spec_id: CM-21-003
    lint_suppress:
    - missing_story_reference
- id: CM-22
  title: CaseActor-Authoritative Case Creation
  description: >-
    Requirements on the CaseActor's obligations when accepting a CaseProposal,
    per ADR-0041.  These replace the vendor-authored case-creation described in
    ADR-0015 and govern how the CaseActor initializes CaseStatus, participants,
    and embargo in its DataLayer before emitting `Create(VulnerabilityCase)`.
  specs:
  - id: CM-22-001
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST create the `VulnerabilityCase` object in its own
      DataLayer with `attributed_to` equal to the CaseActor's own actor ID when
      accepting a `Create(as_CaseProposal)`.
    rationale: >-
      ADR-0041 supersedes ADR-0015.  `attributed_to` names the authoritative
      creator of the case; only the CaseActor is the authoritative creator
      (ADR-0023).  Assigning `attributed_to` to the vendor violates AS2
      semantics and the chain-of-custody model in `chain.py`.
    verification: Integration tests in `test/demo/` confirm that the `VulnerabilityCase` created
      by the CaseActor has `attributed_to` equal to the CaseActor's own actor ID.
    relationships:
    - rel_type: implements
      spec_id: CP-09-001
    adr:
    - ADR-0023
    - ADR-0041
    lint_suppress:
    - dangling_adr_ref
    - missing_story_reference
  - id: CM-22-002
    priority: MUST
    kind: protocol
    statement: >-
      After creating the `VulnerabilityCase`, the CaseActor MUST create
      `CaseParticipant` records for at minimum: (a) the receiver (vendor) with
      `CVDRole.CASE_OWNER` and `RM.RECEIVED`, and (b) the reporter with
      `RM.ACCEPTED`.  These records MUST be written before `Create(VulnerabilityCase)`
      is emitted to the vendor.
    rationale: >-
      The `Create(VulnerabilityCase)` payload embeds participants inline so the
      vendor's `CreateCaseReceivedUseCase._store_embedded_participants` can seed
      its local replica.  Absent participant records at emission time produce an
      empty replica and break role-guard checks (CP-09-002, CP-09-004).
    verification: Integration tests in `test/demo/` confirm that `Create(VulnerabilityCase)` is
      emitted by the CaseActor only after `CaseParticipant` records for the vendor and reporter
      are written to its DataLayer.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-002
    lint_suppress:
    - missing_story_reference
  - id: CM-22-003
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST commit all canonical ledger entries for case
      initialization (`create_case`, `add_report_to_case`, participant-status
      entries, `add_case_status_to_case`) natively in its own DataLayer.  These
      entries MUST NOT be authored by the vendor and back-filled via
      `WritePrologueLedgerEntriesNode` or any equivalent mechanism.
    rationale: >-
      `_validate_canonical_entry` (in `sync/nodes/canonical_entry.py`) rejects
      entries where the
      `actor_id` does not match `_CASE_AUTHORED_SIGNATURES`.  Vendor-authored
      entries fail this check (the root cause of Issue #1767).  Native
      CaseActor authorship is the only compliant path.
    verification: Inspection of `vultron/core/` confirms that the canonical initialization
      ledger entries (`create_case`, `add_report_to_case`, participant-status entries,
      `add_case_status_to_case`) are authored by the CaseActor, not the vendor.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    lint_suppress:
    - missing_story_reference
  - id: CM-22-004
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST initialize the default embargo for the new case before
      emitting `Create(VulnerabilityCase)` to the vendor.
    rationale: >-
      Embargo state is protocol-significant.  Deferring initialization to the
      vendor or to a later message would produce a window in which
      embargo-gated operations are undefined (ADR-0041, CP-09-003).  The
      CaseActor holds the default embargo policy and is the only actor that
      can initialize it authoritatively at case creation.
    verification: Integration tests in `test/demo/` confirm that the CaseActor initializes the
      default embargo before emitting `Create(VulnerabilityCase)` to the vendor.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-003
    adr:
    - ADR-0041

    lint_suppress:
    - missing_story_reference
- id: CM-23
  title: RM Case Closure via Leave(VulnerabilityCase)
  description: >-
    Requirements for the canonical RM case closure path: Leave(VulnerabilityCase)
    is the sole mechanism for advancing a participant's RM state to CLOSED.
    Add(ParticipantStatus, rm_state=RM.CLOSED) is not a valid closure trigger.
    See ADR-0050 (Leave is canonical for RM closure) and ADR-0051
    (CaseActor RM lifecycle).
  specs:
  - id: CM-23-001
    priority: MUST
    kind: protocol
    statement: >-
      RM case closure MUST flow through Leave(VulnerabilityCase) → Case Actor
      ledger commit → broadcast → each replica advances the leaving participant's
      RM state to RM.CLOSED on receipt of the Announce(CaseLedgerEntry).
      Add(ParticipantStatus, rm_state=RM.CLOSED) MUST NOT be used as a closure
      trigger.
    rationale: >-
      The Leave round-trip makes the Case Actor the authority for closure and
      prevents ghost-departures from lost messages: a participant cannot
      silently reach RM.CLOSED on peers without the Case Actor having committed
      and broadcast a ledger entry.  See ADR-0050.
    verification: Integration tests in `test/demo/` confirm that RM closure flows through
      `Leave(VulnerabilityCase)` -> CaseActor ledger commit -> broadcast, and that
      `Add(ParticipantStatus, rm_state=RM.CLOSED)` is not used as a closure trigger.
    adr:
    - ADR-0050
    lint_suppress:
    - missing_story_reference
  - id: CM-23-002
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Actor receives Leave(VulnerabilityCase) from the Case Owner,
      it MUST execute the following sequence:
      (1) advance the Case Owner participant to RM.CLOSED,
      (2) advance the Case Actor's own CaseParticipant to RM.CLOSED,
      (3) emit a final case_fully_closed CaseLedgerEntry as the last ledger entry
          for the case,
      (4) fan-out the final entry to all participants not already at RM.CLOSED.
    rationale: >-
      The Case Owner's departure is the authoritative termination event for a
      case.  Making the Case Actor's own RM.CLOSED the penultimate step and
      case_fully_closed the final entry gives all replicas an unambiguous
      terminal anchor in the ledger chain.  See ADR-0050, ADR-0051.
    verification: 'Integration tests in `test/demo/` confirm that a Case Owner''s
      `Leave(VulnerabilityCase)` triggers the 4-step closure sequence: advance Case Owner to
      RM.CLOSED, advance CaseActor to RM.CLOSED, emit `case_fully_closed` entry, fan out to
      remaining participants.'
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
    - ADR-0051
    lint_suppress:
    - missing_story_reference
  - id: CM-23-003
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Actor receives Leave(VulnerabilityCase) from a non-owner
      participant, it MUST advance only that participant's RM state to RM.CLOSED
      and commit a CaseLedgerEntry recording the departure.  The case MUST remain
      open for the remaining participants.
    rationale: >-
      Non-owner departure is a participant-scoped event, not a case termination
      event.  Treating a non-owner Leave identically to an owner Leave would
      prematurely close the case and violate the Case Owner's authority over the
      case lifecycle.  See ADR-0050.
    verification: Integration tests in `test/demo/` confirm that a non-owner
      `Leave(VulnerabilityCase)` advances only that participant's RM state to RM.CLOSED and
      leaves the case open for remaining participants.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
    lint_suppress:
    - missing_story_reference
  - id: CM-23-004
    priority: MUST
    kind: protocol
    statement: >-
      Case Actor fan-out of CaseLedgerEntry MUST NOT send entries to participants
      whose latest ParticipantStatus has rm_state=RM.CLOSED.
    rationale: >-
      Once a participant reaches RM.CLOSED they have departed the case and no
      longer need (or should receive) case updates.  Continuing to send them
      entries wastes bandwidth and may trigger erroneous processing on stale
      replicas.
    verification: Integration tests in `test/demo/` confirm that `Announce(CaseLedgerEntry)`
      fan-out skips participants whose latest `ParticipantStatus` has `rm_state=RM.CLOSED`.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    lint_suppress:
    - missing_story_reference
  - id: CM-23-005
    priority: MUST
    kind: protocol
    statement: >-
      The Case Actor MUST track its own RM lifecycle via a CaseParticipant
      record with ParticipantStatus entries that advance through
      RM.RECEIVED, RM.VALID, and RM.ACCEPTED during case initialization,
      and RM.CLOSED on case termination (owner Leave).  Each transition
      MUST be recorded as a CaseLedgerEntry.
    rationale: >-
      Uniform RM lifecycle tracking across all participants (including the
      coordinator) enables case-level RM state to be read consistently from
      the ledger without special-casing the Case Actor.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that the CaseActor holds its own
      `CaseParticipant` record that advances through RM states with a ledger entry for each
      transition.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    adr:
    - ADR-0051
    lint_suppress:
    - missing_story_reference
  - id: CM-23-006
    priority: MUST
    kind: protocol
    statement: >-
      For the Case Actor's CaseParticipant, `RM.RECEIVED` MUST denote that a CaseProposal
      has been received and is being evaluated.
    rationale: >-
      The RM state machine models a lifecycle that applies to any actor processing a case,
      but its transition labels map to case-level events for the coordinator rather than to
      report-validation events as for other participants.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.RECEIVED` on the CaseActor's
      own `CaseParticipant` denotes receipt of a `CaseProposal` under evaluation.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    adr:
    - ADR-0051
    lint_suppress:
    - missing_story_reference
  - id: CM-23-007
    priority: MUST
    kind: protocol
    statement: >-
      During case initialization (after accepting a CaseProposal), the Case
      Actor MUST emit CaseLedgerEntry records for each of its own RM transitions:
      (a) CaseActor→RM.RECEIVED when the CaseProposal arrives,
      (b) CaseActor→RM.VALID when the proposal is validated and case creation
          begins,
      (c) CaseActor→RM.ACCEPTED when the VulnerabilityCase is successfully
          created and initialized.
    rationale: >-
      Ledger entries for the Case Actor's own RM transitions create a traceable,
      timestamped protocol-significant history of case initialization, consistent
      with CM-02-009 (CaseActor applies its own timestamp to every state-changing
      event).  See ADR-0051.
    verification: Integration tests in `test/demo/` confirm that the CaseActor emits
      `CaseLedgerEntry` records for its own `RM.RECEIVED`, `RM.VALID`, and `RM.ACCEPTED`
      transitions during case initialization.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    - rel_type: refines
      spec_id: CM-02-009
    adr:
    - ADR-0051
    lint_suppress:
    - missing_story_reference
  - id: CM-23-008
    priority: MUST
    kind: protocol
    statement: >-
      For the Case Actor's CaseParticipant, `RM.VALID` MUST denote that the CaseProposal
      is correctly formatted and actionable by this Case Actor, and that case creation has
      begun.
    rationale: >-
      `RM.VALID` is the Case Actor's signal that the proposal passed structural validation
      and that initialization is in progress; it distinguishes a validated-but-incomplete
      case from one still under evaluation.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.VALID` on the CaseActor's
      `CaseParticipant` denotes that the `CaseProposal` passed structural validation and case
      creation has begun.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051
    lint_suppress:
    - missing_story_reference
  - id: CM-23-009
    priority: MUST
    kind: protocol
    statement: >-
      For the Case Actor's CaseParticipant, `RM.ACCEPTED` MUST denote that the case has
      been successfully created and is being coordinated.
    rationale: >-
      `RM.ACCEPTED` marks the end of the initialization phase and the start of active
      coordination; it is the Case Actor's counterpart to a reporter's or vendor's
      RM.ACCEPTED (engagement decision).  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.ACCEPTED` on the CaseActor's
      `CaseParticipant` denotes that the `VulnerabilityCase` has been successfully created and
      is being coordinated.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051
    lint_suppress:
    - missing_story_reference
  - id: CM-23-010
    priority: MUST
    kind: protocol
    statement: >-
      For the Case Actor's CaseParticipant, `RM.CLOSED` MUST denote that the Case Owner
      has left the case and the case is fully closed.
    rationale: >-
      `RM.CLOSED` on the Case Actor's own participant record is the terminal state; it
      signals that no further ledger entries will be authored for this case.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.CLOSED` on the CaseActor's
      `CaseParticipant` denotes that the Case Owner has left the case and the case is fully
      closed.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051

    lint_suppress:
    - missing_story_reference
- id: CM-24
  title: CaseActor-Delegated Activity Authorship Contract
  description: >-
    Requirements for how trigger use cases assign `actor` and `attributed_to`
    when the CaseActor emits an Activity on behalf of a requesting participant
    (delegated message).  The reference implementation is
    SvcInviteActorToCaseUseCase._prepare().  Codified from CONCERN-2170.
  specs:
  - id: CM-24-001
    priority: MUST
    kind: protocol
    statement: >-
      When a trigger use case causes the CaseActor to emit a protocol Activity
      on behalf of a requesting participant (delegated message), the `actor`
      field of the emitted Activity MUST be set to the CaseActor's actor ID,
      not the requesting participant's actor ID.
    rationale: >-
      Receiving actors authenticate messages by matching the `actor` field
      against known case participants.  An Activity whose `actor` names a
      non-CaseActor participant is not recognised as a CaseActor-authorised
      delegation and may be rejected or misrouted.  Bug ISSUE-2142
      (ownership-transfer offer delivery timeout) is direct evidence:
      the Coordinator rejected an Offer whose `actor` named the Finder.
    verification: Integration tests in `test/demo/` confirm that a delegated Activity emitted by
      the CaseActor on behalf of a participant carries the CaseActor's actor ID in the `actor`
      field.
    relationships:
    - rel_type: refines
      spec_id: CM-02-009
    lint_suppress:
    - missing_story_reference
  - id: CM-24-002
    priority: MUST
    kind: protocol
    statement: >-
      When a delegated Activity is emitted by the CaseActor, the
      `attributed_to` field MUST be set to the requesting participant's actor
      ID so that receivers can recover the originating identity.
    rationale: >-
      `attributed_to` is the AS2-standard field for recording who delegated an
      action.  Without it, the intent of the message cannot be attributed to the
      correct participant, and audit trails are incomplete.
    verification: Integration tests in `test/demo/` confirm that a delegated Activity carries
      the requesting participant's actor ID in the `attributed_to` field.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    lint_suppress:
    - missing_story_reference
  - id: CM-24-003
    priority: MUST
    kind: protocol
    statement: >-
      When no dedicated CaseActor exists for a case (no participant with
      CVDRole.CASE_MANAGER in the actor_participant_index), the Activity is sent
      directly by the requesting participant.  In this case `actor` MUST be the
      requesting participant's actor ID and `attributed_to` MUST be None.
    rationale: >-
      Without a CaseActor the delegation channel does not exist.  Forcing
      `actor=None` or a fallback CaseActor ID would produce an invalid wire
      message.  The SvcInviteActorToCaseUseCase reference implementation
      demonstrates this fallback at actor.py:160-166.
    verification: Integration tests in `test/demo/` confirm that when no dedicated CaseActor is
      found, the Activity is sent with `actor` set to the requesting participant's actor ID and
      `attributed_to` set to `None`.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    lint_suppress:
    - missing_story_reference
  - id: CM-24-004
    priority: MUST
    kind: architecture
    statement: >-
      Trigger use cases that emit delegated Activities MUST queue the
      constructed Activity in the CaseActor's outbox, not in the requesting
      participant's outbox.  self._actor_id MUST be set to case_actor_id in
      _prepare() so that the BT bridge runs under the CaseActor's identity.
    rationale: >-
      The CaseActor's outbox is the delivery path to other participants.
      Queuing a delegated Activity in the requesting actor's outbox bypasses
      the CaseActor as the authoritative intermediary and breaks the
      CaseLedgerEntry audit trail.
    verification: Inspection of `vultron/core/` confirms that trigger use cases queue delegated
      Activities in the CaseActor's outbox (not the requesting participant's outbox) by setting
      `self._actor_id = case_actor_id` in `_prepare()`.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
  - id: CM-24-005
    priority: MUST
    kind: architecture
    statement: >-
      All trigger use cases that emit delegated Activities MUST use a shared
      helper (e.g. _prepare_delegated_context() or equivalent) that enforces
      the CM-24-001 through CM-24-004 invariants.  No callsite may independently
      reconstruct the delegated-authorship pattern without going through this
      shared helper.
    rationale: >-
      Independent reconstruction of the actor/attributed_to assignment at each
      callsite is structurally fragile.  CONCERN-2170 documents two callsites
      that deviated: SvcOfferCaseOwnershipTransferUseCase (wrong actor, no
      attributed_to) proved the pattern is re-broken every time a new callsite
      is added.  A shared helper eliminates the entire class of defect.

    verification: Inspection of `vultron/core/` confirms that all trigger use cases emitting
      delegated Activities share a single helper (e.g., `_prepare_delegated_context()`) that
      enforces the actor/attributed_to/outbox invariants.
- id: CM-25
  title: Observer Participant Semantics
  description: >-
    Requirements for the CVDRole.OBSERVER role (formerly CVDRole.OTHER):
    what an Observer IS, how it is admitted, what content it receives,
    and how the RM lifecycle applies. Codified by ADR-0057
    (docs/adr/0057-observer-participant-role.md). Source: CONCERN-2093.
  specs:
  - id: CM-25-001
    priority: MUST
    kind: protocol
    statement: >-
      An Observer (`CVDRole.OBSERVER`) is a Tier-1 case participant: it MUST
      hold a `CaseParticipant` record, run the standard RM lifecycle, and satisfy
      the same embargo-consent gate (MV-10-005) as any other participant.
      CVDRole.OBSERVER is the base role — the lowest non-null privilege set in
      the Vultron protocol. All other CVD roles are additive to it.
    rationale: >-
      Defining Observer as a full participant (not a passive consumer or an
      external T0 actor) ensures it is subject to the same admission and
      embargo-consent rules as Vendors and Coordinators. The "base role" framing
      establishes OBSERVER as the correct fallback when no other role applies,
      rather than leaving CVDRole.OTHER as an unspecified catch-all.
      See ADR-0057.
    verification: Integration tests in `test/demo/` confirm that an Observer participant holds a
      `CaseParticipant` record, runs the standard RM lifecycle, and satisfies the
      embargo-consent gate before receiving case content.
    adr:
    - ADR-0057
    lint_suppress:
    - missing_story_reference
  - id: CM-25-002
    priority: MUST
    kind: protocol
    statement: >-
      An Observer MUST be admitted to a case via the standard `Invite`/`Accept` flow
      defined in CM-17.
    rationale: >-
      Requiring a non-empty `case_roles` value is load-bearing: the participant
      record created on `Accept(Invite)` (CM-17-004 step 3) reads roles from
      the persisted Invite wire object. A missing or empty list would create an
      Observer participant with no role — indistinguishable from a defect.
    verification: Integration tests in `test/demo/` confirm that an Observer is admitted to a
      case only via the standard `Invite`/`Accept` flow defined in CM-17.
    relationships:
    - rel_type: refines
      spec_id: CM-17-003
    - rel_type: refines
      spec_id: CM-16-003
    adr:
    - ADR-0057
    lint_suppress:
    - missing_story_reference
  - id: CM-25-003
    priority: MUST
    kind: protocol
    statement: >-
      An Observer MUST receive full case content. The existing MV-10-005 delivery
      gate (participant admitted at RM.RECEIVED AND embargo signatory, or no
      active embargo) is the sole gate on case content for an Observer. No
      additional or reduced delivery tier applies.
    rationale: >-
      An Observer has accepted the embargo terms by admitting to the case
      (MV-10-006). Presence-based consent is the substantive gate; the absence
      of a remediation function does not change what the Observer is entitled
      to receive once admitted and embargo-consenting. Introducing a separate
      reduced delivery tier for Observers is deferred: `notes/stub-objects.md`
      describes the potential future mechanism but it is not yet implemented.
    verification: Integration tests in `test/demo/` confirm that an admitted and
      embargo-consenting Observer receives full case content under the MV-10-005 delivery gate
      with no additional content restrictions.
    relationships:
    - rel_type: depends_on
      spec_id: MV-10-005
    - rel_type: depends_on
      spec_id: MV-10-006
    adr:
    - ADR-0057
    lint_suppress:
    - missing_story_reference
  - id: CM-25-004
    priority: SHOULD
    kind: protocol
    statement: >-
      After accepting a case invitation and receiving the full case replica, an
      Observer SHOULD run the standard RM triage cycle (CM-11-002):
      RM.VALID or RM.INVALID, then RM.ACCEPTED or RM.DEFERRED.
      For an Observer, RM.ACCEPTED means "I am actively engaged with / monitoring
      this case" — it does NOT imply commitment to develop or deploy a fix.
    rationale: >-
      The RM triage cycle represents an Observer's assessment of whether the
      case is relevant to them and whether they intend to remain engaged. An
      Observer that determines the case is outside their scope should transition
      to RM.INVALID or RM.DEFERRED, not silently stay at RM.RECEIVED. This
      preserves the RM machine's semantics as a participation-intent signal.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-002
    adr:
    - ADR-0057
  - id: CM-25-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant whose `case_roles` list contains ONLY `CVDRole.OBSERVER`
      MUST NOT emit VFD state-transition messages (CV, CF, or CD). An Observer
      has no vendor-fix-deployment obligations and no authority to advance the
      VFD dimension on behalf of a product or service.
    note: >-
      This restriction is scoped to sole-OBSERVER participants. When
      CVDRole.OBSERVER is combined with any role that carries VFD obligations
      (CVDRole.VENDOR, CVDRole.DEPLOYER), the union-of-permissions rule (CM-26-001)
      applies: the VFD obligations of the co-role supersede this restriction.
      Code checking this exclusion MUST test `case_roles == [CVDRole.OBSERVER]`
      (or equivalent sole-role check), NOT merely `CVDRole.OBSERVER in case_roles`.
    rationale: >-
      An Observer joined the case to monitor it, not to own a fix path. Permitting
      VFD emissions from a role with no fix obligations would corrupt the VFD state
      machine for the case (e.g., a monitoring actor falsely claiming fix deployment).
    relationships:
    - rel_type: refines
      spec_id: CM-03-005
    adr:
    - ADR-0057
  - id: CM-25-006
    priority: MUST
    kind: protocol
    statement: >-
      The `Invite` activity sent by the CaseActor for an Observer MUST embed
      `case_roles=[CVDRole.OBSERVER]`.
    rationale: >-
      The participant record created on `Accept(Invite)` reads roles from the persisted
      Invite wire object; omitting `CVDRole.OBSERVER` would create a participant with an
      empty role list, indistinguishable from the `caseRoles=[]` defect (issue #1288).
    verification: Integration tests in `test/demo/` confirm that the `Invite` activity for an
      Observer embeds `case_roles=[CVDRole.OBSERVER]`.
    relationships:
    - rel_type: refines
      spec_id: CM-25-002
    adr:
    - ADR-0057
    lint_suppress:
    - missing_story_reference
  - id: CM-25-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An empty `case_roles` list MUST NOT be used for Observer invitations; `[]` is
      indistinguishable from the `caseRoles=[]` admission defect (issue #1288) and
      violates the CM-16-003 non-empty invariant.
    rationale: >-
      `[]` provides no role information to the CaseActor's participant-creation path on
      `Accept(Invite)`, producing a participant record that violates the non-empty role
      invariant enforced by CM-16-003.
    relationships:
    - rel_type: refines
      spec_id: CM-25-006
    adr:
    - ADR-0057

- id: CM-26
  title: Role Stacking — Union of Permissions
  description: >-
    Requirement governing how conflicting obligations are resolved when a
    participant holds multiple CVD roles simultaneously. Codified by ADR-0057.
    Source: CONCERN-2093.
  specs:
  - id: CM-26-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant's permitted and obligated actions are determined by the
      **union** of what their role list permits. A MUST NOT restriction
      attached to one role is superseded when any other role in the participant's
      `case_roles` list carries a MAY, SHOULD, or MUST for the same action class.
    note: >-
      Example: CVDRole.OBSERVER MUST NOT emit VFD transitions (CM-25-005), but
      CVDRole.DEPLOYER SHOULD emit the D transition when a fix is deployed.
      A participant holding both roles SHOULD emit VFD/D transitions, because
      DEPLOYER's SHOULD overrides OBSERVER's MUST NOT.
    rationale: >-
      CVD roles represent orthogonal functions a participant may perform. When a
      participant holds more than one function (e.g., a security researcher who
      is also a Deployer for an affected product), restricting them based on their
      least-capable role would incorrectly limit their protocol participation.
      The union model prevents role restrictions from blocking obligations that
      exist under a co-role.
    verification: Integration tests in `test/demo/` confirm that a participant holding both
      `CVDRole.OBSERVER` and `CVDRole.DEPLOYER` is permitted to emit VFD transitions because the
      DEPLOYER obligation supersedes the OBSERVER restriction.
    relationships:
    - rel_type: refines
      spec_id: CM-25-005
    adr:
    - ADR-0057
    lint_suppress:
    - missing_story_reference
- id: CM-28
  title: Embargo Invite RSVP Deadlines
  description: >-
    Requirements for the optional RSVP-by deadline carried on an embargo
    invitation, the authority relationship between that wire value and the
    CM-18-002 pocket-veto policy window, and how a lapse is recorded.
    Codified by ADR-0065. Source: IDEA-2066.
  specs:
  - id: CM-28-001
    priority: MUST
    kind: protocol
    statement: >-
      An `Invite(EmbargoEvent)` activity MAY carry an activity-level `end_time`.
      When present, `Invite.end_time` MUST be interpreted as the RSVP-by
      deadline for that invitation — the instant after which the invitation is
      no longer open. It MUST NOT be interpreted as the embargo's expiry.
    note: >-
      CRITICAL naming hazard: an embargo invitation carries TWO `end_time`
      fields one nesting level apart in the same JSON document.
      `Invite.end_time` is the RSVP-by deadline for the invitation;
      `Invite.object_.end_time` (on the nested `as_EmbargoEvent`) is when the
      embargo itself ends. Code MUST read these independently and MUST NOT
      substitute one for the other. The embargo invitation is an `as_Invite`,
      not an `as_Offer` — see `em_propose_embargo_activity()` in
      `vultron/wire/as2/factories/embargo.py`.
    rationale: >-
      `as_Object.end_time` is inherited by `as_Activity` and therefore by every
      Vultron activity, so no vocabulary extension is required. On an Activity,
      AS2 `end_time` already means "valid until", making the RSVP reading
      idiomatic rather than a repurposing. Placing the deadline on the activity
      rather than on the embargo object is what allows the same embargo to be
      offered to several actors with different deadlines, and to one actor twice.
      See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that `Invite.end_time` on an embargo
      invitation is parsed as the RSVP-by deadline for the invitation, not as the embargo's own
      expiry.
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-002
    priority: MUST
    kind: protocol
    statement: >-
      When `Invite.end_time` is present it MUST be authoritative for that
      invitation's expiry, superseding the receiver's local policy window. When
      `Invite.end_time` is absent, the CM-18-002 policy window MUST apply,
      preserving the pre-existing behaviour.
    rationale: >-
      An explicit wire value lets both parties compute the same lapse instant
      from the same field, with no additional message exchange. A
      receiver-local-only window leaves the two parties unable to agree on
      whether an invitation is still open — the coordination ambiguity that
      motivated IDEA-2066. See ADR-0065.
    verification: Integration tests in `test/demo/` confirm that when `Invite.end_time` is
      present it is used as the authoritative invitation expiry, and when absent the configured
      policy window from CM-18-002 is applied.
    relationships:
    - rel_type: refines
      spec_id: CM-18-002
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-003
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor holding `CVDRole.CASE_MANAGER` MUST be the enforcement authority for
      embargo invite expiry.
    note: >-
      The `EmbargoTimerExpired` Sentinel (#1893) is an OPTIONAL proactive
      accelerator that narrows the gap between the deadline and the recorded
      lapse. It MUST NOT be a prerequisite for CM-28 conformance.
    rationale: >-
      Centralising enforcement at the CaseActor matches the case-communication model
      (PCR-08) and the CaseActor's role as canonical ledger author (ADR-0019, ADR-0021).
      See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that the CaseActor holding
      `CVDRole.CASE_MANAGER` is the entity that records a PEC `DECLINED` transition when an
      embargo invitation lapses.
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-004
    priority: MUST
    kind: protocol
    statement: >-
      A lapsed invitation MUST be recorded as PEC `DECLINED` via the DECLINE
      trigger, identically to an explicit refusal. Implementations MUST NOT
      introduce an additional PEC state to distinguish "never responded" from
      "explicitly declined".
    rationale: >-
      No protocol behaviour branches on the distinction: re-invitation
      (`DECLINED → INVITED`, CM-18-003), embargo-protected content gating, and
      embargo meta-protocol delivery all treat the two identically. The
      difference is provenance, not state, and encoding it as state would put
      path history into the machine and re-expand the table ADR-0048
      deliberately simplified. See ADR-0065.
    verification: A unit test confirms that a lapsed invitation is recorded as PEC `DECLINED`
      via the DECLINE trigger, using the same state-machine path as an explicit refusal.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-005
    priority: MUST
    kind: protocol
    statement: >-
      A lapsed embargo invitation MUST be distinguishable from an explicit refusal in the
      canonical case ledger.
    rationale: >-
      The canonical ledger is the project's history mechanism (ADR-0019), so
      lapse-versus-refusal is recoverable from it without a state or a parallel
      field. See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that the lapsed-invitation ledger entry
      type differs from the `Reject(Invite(EmbargoEvent))` entry type used for explicit
      refusals.
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-006
    priority: MUST
    kind: protocol
    statement: >-
      An inbound `Invite.end_time` MUST be normalised to UTC before any
      comparison against the current time, per CS-13-001. A naive (non
      timezone-aware) `Invite.end_time` MUST be rejected as malformed rather
      than assumed to be UTC.
    note: >-
      CS-13-001 governs datetimes the application *produces*; an inbound
      `end_time` is produced by a remote peer and may legitimately carry a
      non-UTC offset (e.g. `+05:00`). Normalising on receipt keeps deadline
      comparison correct without requiring peers to send `Z`.
    rationale: >-
      A deadline compared in the wrong timezone lapses at the wrong instant,
      breaking the bilateral determinism CM-28-002 exists to provide. Silently
      assuming UTC for a naive value would produce an off-by-hours lapse with no
      diagnostic. See CS-13-001 through CS-13-005 and ADR-0065.
    verification: A unit test confirms that an inbound `Invite.end_time` with a non-UTC timezone
      offset is normalised to UTC before deadline comparison, and that a naive
      (timezone-unaware) value is rejected as malformed.
    relationships:
    - rel_type: refines
      spec_id: CS-13-001
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-007
    priority: MUST
    kind: protocol
    statement: >-
      Embargo invite expiry MUST be evaluated lazily: lapse is derived from
      `(end_time, now)` whenever a participant's PEC state is read or an inbound
      `Accept`/`Reject` for the invitation is processed.
    rationale: >-
      Lazy derivation from an explicit deadline is deterministic and requires no new
      infrastructure. No scheduler exists in production, and the Sentinel invocation
      model remains an open question (notes/coordination-agents.md). See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that embargo invite expiry is evaluated
      lazily at read or process time from `(end_time, now)` rather than via a scheduled job.
    relationships:
    - rel_type: refines
      spec_id: CM-28-003
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Implementations MUST NOT require a scheduler or Sentinel runtime for embargo invite
      expiry correctness.
    rationale: >-
      No scheduler exists in production; making correctness depend on one would render
      conformance impossible without new infrastructure. The Sentinel is an optional
      accelerator only. See ADR-0065.
    relationships:
    - rel_type: refines
      spec_id: CM-28-003
    adr:
    - ADR-0065
  - id: CM-28-009
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST author a distinct ledger entry to record a lapsed invitation,
      different from the `Reject(Invite(EmbargoEvent))` entry used to record an explicit
      refusal.
    rationale: >-
      The ledger entry is the mechanism that makes lapse-versus-refusal distinguishable
      (CM-28-005); authoring a single entry type for both events would conflate them and
      make the distinction unrecoverable from the ledger. See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that the lapsed-invitation ledger entry
      is authored as a distinct entry type separate from the `Reject(Invite(EmbargoEvent))`
      entry.
    relationships:
    - rel_type: refines
      spec_id: CM-28-005
    adr:
    - ADR-0065
    lint_suppress:
    - missing_story_reference
  - id: CM-28-010
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The lapse-versus-refusal provenance MUST NOT be duplicated onto `PecDimension` as
      a reason field.
    rationale: >-
      A `reason` discriminator on `PecDimension` — which currently holds only `state` —
      would be a second source of truth able to drift from the ledger. The canonical
      ledger is the sole record of provenance (ADR-0019). See ADR-0065.
    relationships:
    - rel_type: refines
      spec_id: CM-28-005
    adr:
    - ADR-0065

- id: CM-27
  title: Case Collection Mutation Discipline
  description: >-
    Requirements governing post-construction mutation of the case collections
    whose items exist in incompatible wire and core shapes. `validate_assignment`
    does not cover in-place mutation — `list.append` is not an attribute
    assignment, so Pydantic never observes it — so these collections need a
    separate prohibition. Codified by ADR-0064. Source: CONCERN-2261.
  specs:
  - id: CM-27-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Core code under `vultron/core/` MUST NOT mutate `case_participants` or
      `case_statuses` directly on a `VulnerabilityCase` instance after
      construction (e.g. `case.case_participants.append(...)`,
      `case.case_statuses = [...]`). The canonical mutators on
      `VulnerabilityCase` MUST be used for all post-construction changes. The
      mutator methods themselves, in `vultron/core/models/case.py`, are exempt.
    rationale: >-
      A wire-shaped participant or status appended to a core-typed list does not
      raise when read — it reads as absent, and readers substitute an initial
      state, silently resetting the case's ladder (#2232, #2264).
      `validate_assignment` cannot close this door because `append` is not an
      assignment. This mirrors PRM-03-001, whose identical prohibition drove
      direct `case_roles` mutation in `vultron/` to zero sites.
    relationships:
    - rel_type: refines
      spec_id: ARCH-21-001
    adr:
    - ADR-0064
  - id: CM-27-002
    priority: MUST
    kind: protocol
    statement: >-
      Passing `case_participants=[...]` or `case_statuses=[...]` as a constructor
      argument when creating a `VulnerabilityCase` is permitted and does not
      violate CM-27-001; the prohibition applies only to post-construction
      mutation.
    rationale: >-
      Constructor arguments are validated, which is precisely the guarantee
      CM-27-001 exists to restore. This clarification prevents over-application
      of the rule, mirroring PRM-03-002.
    verification: Inspection of `vultron/core/models/case.py` confirms that constructor-time
      `case_participants` and `case_statuses` arguments pass through Pydantic validation,
      consistent with the post-construction mutation prohibition in CM-27-001.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
    adr:
    - ADR-0064
    lint_suppress:
    - missing_story_reference
  - id: CM-27-003
    priority: MUST
    kind: project
    statement: >-
      `VulnerabilityCase` MUST expose a canonical mutator for appending a case
      status, so that CM-27-001 can be satisfied without direct list mutation.
      `add_participant()` and `remove_participant()` already provide this for
      `case_participants`.
    rationale: >-
      A prohibition with no sanctioned alternative is unimplementable. At the
      time of writing `case_statuses` had no mutator at all — only the
      `current_status` and `case_status` readers — so the rule requires one to be
      added.
    verification: Inspection of `vultron/core/models/case.py` confirms that `VulnerabilityCase`
      exposes a canonical mutator method for appending a case status to `case_statuses`.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
    adr:
    - ADR-0064
