id: CM
title: Case Management
description: Requirements for VulnerabilityCase lifecycle management, CASE_MANAGER responsibilities, and the RM/EM/CS/VFD state
  model. Covers actor isolation at the protocol level, the distinction between participant-specific and participant-agnostic
  state, case initialization sequencing, embargo acceptance ownership, and the invitation acceptance lifecycle.
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: CM-01
  title: Actor Isolation
  specs:
  - id: CM-01-001
    priority: MUST
    kind: protocol
    statement: Each actor MUST have an isolated protocol state domain
    rationale: >-
      Each actor is a separate party, with its own view of the case and its own
      authority over its state. If the records of one actor can change what another
      actor reads, a fault or a hostile peer in a shared deployment can change the case
      history of another party. Then no actor can trust its own copy.
    verification: Integration tests in `test/demo/` confirm that each actor maintains its own
      isolated RM/EM/CS state domain without cross-actor interference.
    stories:
    - story_2022_088
  - id: CM-01-002
    priority: MUST
    kind: protocol
    statement: Each actor's RM state MUST be maintained independently per case
    rationale: >-
      RM is a process for each participant. Each participant receives, validates,
      accepts, defers and closes a report on its own schedule (CM-03-002). One RM state
      for each actor in each case lets an actor be at different RM stages in different
      cases. It also stops the progress of one actor from counting as the progress of
      another actor.
    verification: Integration tests in `test/demo/` confirm that each actor's RM state for a
      case is tracked independently in its own `ParticipantStatus` records.
    stories:
    - story_2022_088
- id: CM-02
  title: CASE_MANAGER Lifecycle
  specs:
  - id: CM-02-001
    priority: MUST
    kind: protocol
    statement: Each VulnerabilityCase MUST have exactly one associated CASE_MANAGER
    rationale: >-
      The CASE_MANAGER is the only writer of canonical case state (CM-02-002). With no
      CASE_MANAGER, no actor can commit a case change. With two, two actors can commit
      changes that conflict. The copies of the case then become different, and no rule
      can make them agree again.
    verification: Inspection of `vultron/core/` confirms that each `VulnerabilityCase` is
      associated with exactly one participant holding `CVDRole.CASE_MANAGER`.
    stories:
    - story_2022_029
    - story_2022_031
  - id: CM-02-002
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER MUST be the authoritative source of truth for case state
    rationale: >-
      Every participant has its own copy of the case. Without one source of authority,
      two participants that disagree have no rule to decide which copy is correct, and
      the copies become different. When the CASE_MANAGER is that source, every replica
      gets the same state (ADR-0108).
    verification: Integration tests in `test/demo/` confirm that participants fetch canonical
      state from the CASE_MANAGER rather than from each other.
    stories:
    - story_2022_088
    - story_2022_045
  - id: CM-02-003
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER MUST persist until the associated VulnerabilityCase is closed
    rationale: >-
      The authority for a case must be clear for as long as the case accepts changes. If
      the CASE_MANAGER role stops before the case closes, messages that need its
      decision have no valid recipient. Then the case cannot close in the correct
      sequence.
    note: >-
      Read this as the *role assignment* persisting, not an object's lifetime. The CASE_MANAGER is
      whichever participant holds `CVDRole.CASE_MANAGER` (BT-10-002, as revised for ISSUE-1872); the
      actor itself participates in many cases and its existence is not scoped to any one of them.
      This group's statements are now phrased in terms of the CASE_MANAGER role directly, rather than
      an obligation on a distinct "CaseActor" component — the earlier framing produced the phantom
      per-case CaseActor identity. ADR-0088 settles this: authority is the `CVDRole.CASE_MANAGER`
      role, and "CaseActor" names only the concrete prototype/demo actor that enacts it — never the
      authority, and never an identity to match on (see CM-02-011 through CM-02-013).
    verification: >-
      Inspection of `vultron/core/` confirms nothing revokes `CVDRole.CASE_MANAGER` from the holding
      participant before the case closes. Read per the note: what must persist is the role assignment
      on the participant record, not an object's lifetime.
    lint_suppress:
    - missing_story_reference
  - id: CM-02-004
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER MUST know the Case Owner
    rationale: >-
      Only the Case Owner can do some case actions (CM-02-005). The CASE_MANAGER can
      enforce this only if it knows the Case Owner. The case records the Case Owner in
      `attributed_to`.
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `VulnerabilityCase.attributed_to` records the Case Owner and is readable by the
      CASE_MANAGER.
    stories:
    - story_2022_046
    - story_2022_047
    - story_2022_050
    - story_2022_051
  - id: CM-02-005
    priority: MUST
    kind: protocol
    statement: >-
      CASE_MANAGER MUST restrict the following activities to the Case Owner: case
      closure, approving an embargo proposal to become active on the case and
      terminating an active embargo, approving or rejecting participant invitations,
      case ownership transfer, and offering a participant an additional role
      (CM-33-002) (see CM-02-006 for the authorisation
      mechanism).
    rationale: >-
      These actions decide who learns about the vulnerability, under what embargo, and
      who is responsible for the case. In CVD, the Case Owner makes these decisions. If
      any participant can start them through the CASE_MANAGER, a participant can close
      the case, change the embargo, admit a party that nobody checked, or take the case.
    verification: Integration tests in `test/demo/` confirm that case closure, embargo approval,
      participant invitation approval, and ownership transfer are only executed when triggered
      by the Case Owner.
    scope:
    - production
    stories:
    - story_2022_048
    - story_2022_050
  - id: CM-02-006
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER MUST enforce case-level authorization for all case mutations
    rationale: >-
      The CASE_MANAGER applies every change to canonical case state. Thus it is the one
      place that can stop an unauthorized change before every replica copies it. If a
      change path skips the check, any actor that can get to the inbox can change the
      case.
    verification: Inspection of `vultron/core/` confirms that every case mutation path checks
      actor authorization before applying the mutation.
    scope:
    - production
    stories:
    - story_2022_036
  - id: CM-02-007
    priority: MUST
    kind: protocol
    statement: >-
      A `VulnerabilityCase` MUST carry a `notes` collection recording the case-scoped
      notes added to it by `Add(Note)` activities that target the case
    rationale: >-
      Case notes are the discussion of the case by the participants, and they must stay
      with the case. A `notes` collection on the case gives each `Add(Note)` a location.
      It also lets a participant that joins later see the notes from before it joined.
    verification: 'Inspection of `vultron/core/models/case.py` confirms that `VulnerabilityCase`
      declares a `notes: list[as_NoteRef]` field.'
    stories:
    - story_2022_083
  - id: CM-02-008
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers every path that creates a `VulnerabilityCase` from an
      `Offer(VulnerabilityReport)`, the CASE_MANAGER's path included (CP-09-001).
      Each such path MUST set the case's `attributed_to` to the ID of the actor that
      received the Offer, the CASE_OWNER.
    rationale: >-
      `attributed_to` is the owner field of the case. Ownership checks read it
      (MSM-07-027), and ownership transfer changes it together with the `CASE_OWNER`
      role (CM-21-002, CM-21-024). The `actor` of `Create(VulnerabilityCase)` records
      who *created* the case, not `attributed_to`. Thus the CASE_MANAGER does not
      become the owner when it creates the case.
    adr:
    - ADR-0041
    verification: >-
      Integration tests in `test/demo/` confirm that the report-receiving actor is the
      case's `attributed_to` when a `VulnerabilityCase` is created from an
      `Offer(VulnerabilityReport)`.
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-02-017
    priority: MUST
    kind: protocol
    statement: >-
      A path that creates a `VulnerabilityCase` from an `Offer(VulnerabilityReport)`
      MUST record the actor that received the Offer, the CASE_OWNER, as the case's
      initial primary participant.
    rationale: >-
      The actor that received the report is the first party that must act on it, and
      it owns the case. When it is the first participant, the case has a participant
      record for its owner before any other party joins.
    verification: >-
      `test_owner_field_and_case_owner_participant_name_the_same_actor` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts that
      the case created from the proposal records the report receiver as its
      `CASE_OWNER` participant.
    relationships:
    - rel_type: extends
      spec_id: CM-02-008
    adr:
    - ADR-0041
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-02-009
    priority: MUST
    kind: protocol
    statement: >-
      For each state-changing event it receives, the CASE_MANAGER MUST take the commit
      stamp on the event's ledger entry as its trusted time. That stamp is the envelope
      `published` of CLP-14-002.
    rationale: >-
      The CASE_MANAGER's clock is the only trusted source of time for the order of
      events in a case. If each copy of the case used the time a participant
      supplied, the copies could disagree on the order of events. The ledger entry
      carries two times (ADR-0103): the CASE_MANAGER's commit stamp, which orders the
      case, and the sender's claim, which CM-02-018 keeps.
    verification: >-
      `test_create_log_entry_node_stamps_the_envelope_and_keeps_the_claimed_time` in
      `test/core/behaviors/sync/nodes/test_chain.py` commits an entry whose snapshot
      claims an earlier `published`, and asserts that the envelope `published` is the
      commit clock.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    - rel_type: uses_definition
      spec_id: CLP-14-002
    adr:
    - ADR-0103
    stories:
    - story_2022_074
    - story_2022_045
  - id: CM-02-018
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST keep the sender's claimed time on each state-changing event
      as sent in the entry's `payloadSnapshot`, never overwriting it.
    rationale: >-
      The sender's claim is evidence of when the sender says the event happened
      (ADR-0103). The CASE_MANAGER cannot verify it, so it does not order the case by
      it (CM-02-009). If the CASE_MANAGER overwrote it, the record of what the sender
      said would be lost, and the received body would change (CLP-07-011).
    verification: >-
      `test_create_log_entry_node_stamps_the_envelope_and_keeps_the_claimed_time` in
      `test/core/behaviors/sync/nodes/test_chain.py` asserts that the snapshot's
      claimed `published` is unchanged after the commit.
    relationships:
    - rel_type: extends
      spec_id: CM-02-009
    adr:
    - ADR-0103
    stories:
    - story_2022_074
  - id: CM-02-010
    priority: MAY
    kind: project
    statement: >-
      One actor MAY enact the CASE_MANAGER and also be the Case Owner (the named
      actor).
    rationale: >-
      A deployment may enact both roles in one actor. An actor holding both roles
      still routes case traffic through its CASE_MANAGER role (CBT-01-014).
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-001
  - id: CM-02-019
    priority: MUST
    kind: project
    statement: >-
      Two different actors enacting the CASE_MANAGER and the Case Owner MUST each have
      their own actor ID, even on one server.
    rationale: >-
      When the proposal flow (CP-09-001) yields two actors, distinct identities keep
      every case-state transition on the wire protocol, whatever the topology. They
      also let the two actors separate later without protocol changes.
    verification: >-
      Inspection of `vultron/core/` confirms that, when the actor enacting CASE_MANAGER
      and the Case Owner named actor are different actors, they hold distinct actor IDs
      even in single-server deployments.
    relationships:
    - rel_type: extends
      spec_id: CM-02-010
    - rel_type: refines
      spec_id: CM-01-001
  - id: CM-02-011
    priority: MUST
    kind: architecture
    statement: >-
      An actor is the single-writer authority for a case if and only if it enacts
      `CVDRole.CASE_MANAGER` in that case's participant roster (`CaseParticipant.case_roles`).
      Authority MUST be determined from the role, never from hosting location or from the
      actor's name or URL shape.
    rationale: >-
      The role is the only signal of authority in the protocol. The case roster records
      it, only a ledgered act changes it, and every replica reads the same value. The
      hosting location, the name of an actor and the shape of its URL are deployment
      facts that are different between topologies. A check that uses them gives
      different answers for the same case. The `case-actor` name is only a demo
      convenience.
    verification: >-
      Inspection of `vultron/core/` confirms every authority determination reads
      `CaseParticipant.case_roles` via the single role-authority resolver (ARCH-24-001), ratcheted
      by `test/architecture/test_role_authority_resolver.py`. Behavioural coverage:
      `test/core/behaviors/sync/nodes/test_replay.py::TestFindCaseActorNode` (whose fixture makes
      the role-holder neither the store owner nor the executing actor, so echoing the executing
      actor fails), `test/core/use_cases/test_helpers.py::TestFindCaseActorId`, and
      `test/core/use_cases/received/test_reject_sync.py::TestRejectLedgerEntryReceivedUseCase::test_replay_triggered_when_the_case_manager_is_resolvable`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-002
    adr:
    - ADR-0088
  - id: CM-02-012
    priority: MUST
    kind: architecture
    statement: >-
      The actor enacting `CVDRole.CASE_MANAGER` MUST recognize its own canonical ledger
      entries as authoritative from replica-seed onward, including during the bootstrap window
      before any co-located `Service` object carries the case `context`.
    rationale: >-
      The replica holds the role membership from the moment it is seeded. A check that
      needs a co-located `Service` object with the case `context` fails before that
      object exists. Until that object exists, such a check makes the CASE_MANAGER treat
      its own ledger entry as the entry of a participant.
    verification: >-
      `test/core/behaviors/sync/test_announce_tree.py::test_case_manager_role_takes_authority_arm_without_service_object`
      confirms the actor enacting `CVDRole.CASE_MANAGER` takes the authority arm on its own ledger
      entry even before any `Service` object carries `context`. Address-resolution window:
      `test/core/behaviors/sync/nodes/test_replay.py::TestFindCaseActorNode::test_resolves_without_any_service_object_carrying_context`.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-011
    adr:
    - ADR-0088
  - id: CM-02-013
    priority: MUST_NOT
    kind: architecture
    statement: >-
      The `case-actor` name and any `.../actors/case-actor` URL MUST NOT be treated by any
      protocol logic as evidence of authority, recognition, or routing; they are provisioning
      conveniences with no protocol meaning.
    rationale: >-
      A stable inbox URL for the enacting actor is a convenience for provisioning
      (ADR-0041). The authority is the role in the case roster (CM-02-011, ADR-0088).
      Logic that reads authority from the `case-actor` name or the shape of the URL
      gives an incorrect answer in a deployment that names or hosts its CASE_MANAGER
      differently.
    verification: >-
      Ratchet ARCH-24-004 asserts no protocol-logic module branches on `is_case_actor_identity`,
      the `case-actor` URL substring, the segment constant, the identity `case_actor_identity()`
      builds, or a `Service`-hosting `context` scan. `vultron/demo/` is outside that corpus by
      design (provisioning at a readable URL is the convenience ADR-0088 preserves).
    relationships:
    - rel_type: refines
      spec_id: CM-02-011
    adr:
    - ADR-0088
  - id: CM-02-014
    priority: MUST
    kind: project
    statement: >-
      A `VulnerabilityCase` MUST have both a `CVDRole.CASE_OWNER` participant and a
      `CVDRole.CASE_MANAGER` participant from the moment of creation. Neither slot may be left
      empty or deferred to a later operation.
    rationale: >-
      An unoccupied `CASE_OWNER` or `CASE_MANAGER` slot makes role-guard checks undefined from
      the moment the case exists. Any creation path that omits either participant leaves the case
      in a state that cannot be self-healed without an explicit remediation step, and causes
      `resolve_case_manager_id` to return `None` immediately — making the role ledger unreliable
      as the single source of authority (ADR-0088, ARCH-24-001).
    verification: >-
      `test_create_case_trigger_registers_owner_and_manager` in
      `test/core/use_cases/triggers/case/test_create.py` asserts both `CVDRole.CASE_OWNER`
      and `CVDRole.CASE_MANAGER` are present on a `CaseParticipant` after
      `SvcCreateCaseUseCase` executes. The `Accept(CaseProposal)` path is covered by existing
      tests in `test/core/behaviors/case/test_case_proposal_received_tree.py`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-001
  - id: CM-02-015
    priority: MUST
    kind: project
    statement: >-
      When a `VulnerabilityCase` is created via the direct-mint path (e.g.
      `trigger/create-case`, without a `Create(CaseProposal)` round-trip), the
      creating actor MUST be registered as a `CaseParticipant` carrying both
      `CVDRole.CASE_OWNER` and `CVDRole.CASE_MANAGER` as part of the same atomic
      case-creation operation.
    rationale: >-
      In the direct-mint path there is no intermediary proposer; the creating actor is the sole
      authority holder from the start and holds both roles until it delegates `CASE_MANAGER` via
      an `Offer(role)` → `Accept` exchange. Deferring or omitting participant registration means
      the case roster is empty at birth, violating CM-02-014 and breaking any caller that queries
      the role ledger immediately after creation.
    verification: >-
      `test_create_case_trigger_registers_owner_and_manager` in
      `test/core/use_cases/triggers/case/test_create.py` asserts both roles are present on
      the `CaseParticipant` after `SvcCreateCaseUseCase.execute()`. The demo-layer invariant is
      enforced by `test/demo/test_invite_actor_demo.py` asserting `resolve_case_manager_id`
      returns a non-`None` value after `setup_initialized_case`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-014
  - id: CM-02-016
    priority: MUST
    kind: project
    statement: >-
      When the CASE_MANAGER commits an `accept_case_participant_role` ledger entry, it
      MUST grant the offered `CVDRole` to the target Actor's `CaseParticipant` on its
      own
      replica. That entry records the acceptance of an `Offer(CaseParticipantRole)`
      (ADR-0039).
    rationale: >-
      An `Offer(CaseParticipantRole)` is a proposal, not the grant. The role changes
      only when the CASE_MANAGER commits the acceptance. The CASE_MANAGER applies the
      grant to its own copy at commit. This keeps the authority for roles with the
      CASE_MANAGER and keeps every replica the same (ADR-0108, ADR-0124).
    verification: >-
      `test/core/behaviors/case/nodes/test_delegation.py` asserts the CASE_MANAGER
      grants
      the role on its own copy when it commits the accept.
    adr:
    - ADR-0039
    relationships:
    - rel_type: refines
      spec_id: CM-02-015
  - id: CM-02-020
    priority: MUST
    kind: project
    statement: >-
      Every participant other than the CASE_MANAGER MUST grant the offered `CVDRole` to
      the target Actor's `CaseParticipant` when it replays a committed
      `accept_case_participant_role` entry (RSH-08-004).
    rationale: >-
      The CASE_MANAGER's ledger is the authority for roles. Every other replica learns
      of the grant only from the entry, so it applies the grant when it replays that
      entry. Then every replica holds the same roles (ADR-0108, ADR-0124).
    verification: >-
      `test/core/behaviors/sync/nodes/test_role_grant_effect.py` applies an
      `accept_case_participant_role` entry to a replica via the shared `grant_role_to_target`
      and asserts the target participant gains the offered role, that redelivery is idempotent,
      and that a replica missing the target participant is a non-fatal skip; and
      `test/architecture/test_ledger_semantic_types_are_replayed.py` holds the semantic
      type in the replayed set.
    adr:
    - ADR-0039
    relationships:
    - rel_type: extends
      spec_id: CM-02-016
  - id: CM-02-021
    priority: MUST_NOT
    kind: project
    statement: >-
      A participant MUST NOT change `case_roles` directly from an `Accept` of an
      `Offer(CaseParticipantRole)` that it receives.
    rationale: >-
      Only a committed ledger entry grants a role (CM-02-016, CM-02-020). If a
      participant changes `case_roles` from an `Accept` that it sees directly, it can
      have a role that the ledger did not grant.
    verification: >-
      `test_a_participant_refuses_an_answer_sent_to_it` in
      `test/core/use_cases/received/actor/test_role_offer_routing.py` asserts that a
      participant other than the CASE_MANAGER refuses an `Accept` sent to it and the
      target gains no role.
    adr:
    - ADR-0039
    relationships:
    - rel_type: extends
      spec_id: CM-02-016
- id: CM-03
  title: Case State Model
  specs:
  - id: CM-03-001
    priority: MUST
    kind: protocol
    statement: 'The system MUST implement the three interacting state machines: RM (Report Management), EM (Embargo Management),
      and CS (Case State)'
    rationale: >-
      Report handling, embargo negotiation, and the public and fix state of a case
      change for different reasons and at different times. Three interacting machines
      let an implementation validate each one on its own. The interactions between them
      stay explicit and do not hide in one combined state.
    verification: Integration tests in `test/demo/` confirm that RM, EM, and CS state machines
      are each instantiated and advance independently.
    relationships:
    - rel_type: implements
      spec_id: VP-01-001
    - rel_type: implements
      spec_id: VP-13-001
    - rel_type: implements
      spec_id: VP-06-001
    stories:
    - story_2022_107
  - id: CM-03-002
    priority: MUST
    kind: protocol
    statement: RM state MUST be participant-specific
    rationale: >-
      Each participant moves through report handling on its own. One participant can
      accept a report that another has not yet validated. A single shared RM state
      cannot show this, and one participant's transition would overwrite the state of
      another (CM-01-002).
    verification: Inspection of `vultron/core/` confirms that RM state is stored on
      `ParticipantStatus.rm`, a per-participant field, not on a shared case-level
      structure.
    relationships:
    - rel_type: implements
      spec_id: VP-01-002
    - rel_type: implements
      spec_id: VP-03-001
    stories:
    - story_2022_088
    - story_2022_075
  - id: CM-03-003
    priority: MUST
    kind: protocol
    statement: >-
      A shared EM state MUST be tracked at the case level in the case's `CaseStatus`, to
      represent the collective embargo agreement
    rationale: >-
      An embargo binds every participant in the case. Thus, whether an embargo is
      proposed, active or ended is one fact for the whole case. One case-level record
      gives every participant the same answer. The consent rows keep each participant's
      agreement separately (CM-03-008).
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `CaseStatus.em.state` exists as a case-level field tracking the collective embargo state.
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: implements
      spec_id: VP-09-001
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-03-008
    priority: MUST
    kind: protocol
    statement: Each `CaseParticipant` MUST track their own embargo consent through its per-embargo consent rows
      (CM-10-001, CM-18-001)
    rationale: >-
      Agreement to an embargo is the decision of one participant, about one specific
      embargo. One row for each participant and embargo records each answer one time.
      Thus, a revision does not inherit an agreement that a participant gave to an
      earlier version (CM-18-001).
    verification: Inspection of `vultron/core/` confirms that the consent rows (`embargo_consents`) are a
      per-participant field on `CaseParticipant`.
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
    stories:
    - story_2022_023
    - story_2022_027
  - id: CM-03-004
    priority: MUST
    kind: protocol
    statement: CS (PXA sub-state) MUST be participant-agnostic (shared per case)
    rationale: >-
      Public awareness, exploit publication and attacks in the wild are facts about the
      world, not about one participant. When the vulnerability is public, it is public
      for all participants. A copy for each participant can only disagree with the
      facts.
    verification: Inspection of `vultron/core/models/case.py` confirms that
      `CaseStatus.pxa.state` is a case-level field shared across all participants.
    stories:
    - story_2022_088
    - story_2022_107
  - id: CM-03-005
    priority: MUST
    kind: protocol
    statement: VFD (Vendor Fix Deployment) state MUST be participant-specific
    rationale: >-
      Fix readiness and deployment are different for each participant. One vendor can
      ship a fix before another vendor, and a deployer has its own deployment state. A
      shared VFD state would let the progress of one participant show as the progress of
      another (ADR-0075).
    verification: Inspection of `vultron/core/` confirms that VFD state is stored on a
      per-participant `ParticipantStatus.vf` or `ParticipantStatus.d` field (ADR-0075).
    stories:
    - story_2022_107
    - story_2022_088
  - id: CM-03-006
    priority: MUST
    kind: project
    statement: Collection fields that hold status histories MUST be pluralized and documented as history collections
    rationale: >-
      A reader reads a status field that holds a history differently from a field that
      holds a current value. A plural name and documentation that calls the field a
      history prevent two errors. The reader does not take the latest entry as the full
      record, or the full record as one value.
    verification: Inspection of `vultron/core/models/` confirms that history collection fields
      (e.g., `case_statuses`, `participant_statuses`) are pluralized list fields.
  - id: CM-03-007
    priority: MUST
    kind: protocol
    statement: RM state transitions MUST use the established protocol activity types without introducing new activity types
      for reverse transitions
    rationale: Keeps the RM symbol set minimal and produces clean audit histories; `Undo` conflates historical negation with
      a new forward transition
    verification: Static analysis (grep) confirms that no RM-reverse transition handler
      introduces an activity type outside the established protocol symbol set.
    relationships:
    - rel_type: implements
      spec_id: VP-02-004
    lint_suppress:
    - missing_story_reference
- id: CM-04
  title: State Transition Correctness
  specs:
  - id: CM-04-001
    priority: MUST
    kind: protocol
    statement: >-
      A receiver of a participant-status message MUST record the declared RM state on
      the sending actor's `CaseParticipant`, as its model of the sender (SM-10-001).
    rationale: >-
      RM state is self-declared: each participant reports its own report-handling
      progress (CM-03-002). A participant-status message updates the receiver's model
      of its sender. A record on any other participant would give one participant the
      progress of another. Other messages move the receiver's own state instead
      (SM-10-001). RSH-08-003 says which receiver writes the record directly.
    verification: Integration tests in `test/demo/` confirm that processing an RM status message
      updates the sender's `CaseParticipant` with a new `ParticipantStatus.rm` entry.
    relationships:
    - rel_type: refines
      spec_id: SM-10-001
    - rel_type: implements
      spec_id: VP-02-003
    - rel_type: implements
      spec_id: VP-03-001
    - rel_type: implements
      spec_id: VP-13-005
    stories:
    - story_2022_107
  - id: CM-04-002
    priority: MUST
    kind: protocol
    statement: >-
      A receiver processing a VFD state transition MUST update the VFD state in the
      participant status of the sending actor's `CaseParticipant`
    rationale: >-
      VFD state is participant-specific (CM-03-005). A VFD message reports the fix
      readiness or deployment of the sender. A record on any other participant would
      claim a fix that this participant did not make.
    verification: Integration tests in `test/demo/` confirm that processing a VFD status message
      updates the sender's `ParticipantStatus.vf` or `ParticipantStatus.d`.
    relationships:
    - rel_type: refines
      spec_id: SM-10-001
    stories:
    - story_2022_107
    - story_2022_062
  - id: CM-04-003
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Owner accepts an embargo, the CASE_MANAGER MUST activate it in the
      case's embargo register, from which the case-level EM state derives (ADR-0122).
      Every other replica takes that state from the CASE_MANAGER's
      ledger (RSH-08-003).
    rationale: >-
      The shared embargo binds the case only when the Case Owner accepts it (CM-02-005).
      A case-level record of that acceptance puts the embargo in force for all
      participants at the same time. Only the CASE_MANAGER writes canonical case state
      (ADR-0108), and the EM state is derived from the append-only register, with
      `CaseStatus.em` only a stamped copy (ADR-0122). The acceptances of other
      participants stay in their own consent rows (CM-04-008).
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from
      the Case Owner activates the embargo's entry in the CASE_MANAGER's embargo
      register, so the derived EM state advances.
    adr:
    - ADR-0108
    - ADR-0122
    relationships:
    - rel_type: implements
      spec_id: VP-06-001
    - rel_type: implements
      spec_id: VP-09-001
    - rel_type: implements
      spec_id: VP-11-002
    - rel_type: depends_on
      spec_id: CM-03-008
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-04-004
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER adopts a PXA transition (public disclosure, exploit
      publication or attack observation), it MUST record the case-level PXA state in
      the case's `CaseStatus`. Every other replica takes that state from the
      CASE_MANAGER's ledger (RSH-08-003).
    rationale: >-
      PXA state is a case-level fact (CM-03-004). A record of a reported disclosure,
      exploit or attack on the shared `CaseStatus` makes it visible to all participants
      at the same time. This is important because each of these events can end an
      embargo early. Only the CASE_MANAGER writes canonical case state (ADR-0108).
    verification: >-
      Integration tests in `test/demo/` confirm that the CASE_MANAGER's adoption of a
      PXA transition (public disclosure, exploit publication, or attack observation)
      updates `CaseStatus.pxa.state`.
    adr:
    - ADR-0108
    relationships:
    - rel_type: implements
      spec_id: VP-03-002
    - rel_type: implements
      spec_id: VP-06-001
    - rel_type: implements
      spec_id: VP-14-004
    stories:
    - story_2022_018
    - story_2022_019
    - story_2022_069
  - id: CM-04-005
    priority: MUST
    kind: protocol
    statement: >-
      A receiver processing a VFD or PXA transition MUST validate the requested
      transition against the authoritative current state before recording it
    rationale: >-
      A transition is valid only from the current state of the case or participant. If
      the receiver records a transition without a check against the authoritative
      current state, a stale or out-of-order message can move the state backward or skip
      a necessary step. Every replica then copies the incorrect state.
    verification: Inspection of `vultron/core/` confirms that VFD and PXA transition handlers
      call the state machine's transition validator before persisting any state change.
    lint_suppress:
    - missing_story_reference
  - id: CM-04-006
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection of the state transition handlers confirms each RM or VFD handler writes
      only participant-specific fields.
    statement: >-
      A participant-specific transition (RM or VFD) MUST NOT change any case-level
      (participant-agnostic) state (EM or PXA).
    rationale: >-
      Participant-specific state and case-level state are separate by design (CM-03-002
      through CM-03-005). If an RM or VFD transition of one participant wrote across
      this boundary, it could change the shared embargo or public state.
    relationships:
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: depends_on
      spec_id: CM-03-008
  - id: CM-04-010
    priority: MUST_NOT
    kind: protocol
    verification: >-
      `test_an_embargo_activation_changes_no_participant_state` in
      `test/core/use_cases/received/test_embargo_owner_decision.py` asserts that an
      EM activation leaves every participant's RM and VFD status history unchanged.
    statement: >-
      A case-level transition (EM or PXA) MUST NOT change any participant-specific
      state (RM or VFD).
    rationale: >-
      Participant-specific state and case-level state are separate by design (CM-03-002
      through CM-03-005). If a shared event wrote across this boundary, it could
      overwrite the progress of one participant.
    relationships:
    - rel_type: extends
      spec_id: CM-04-006
    - rel_type: depends_on
      spec_id: CM-03-008
  - id: CM-04-007
    priority: MUST
    kind: protocol
    statement: >-
      RM transition validation MUST treat `RM.CLOSED` as terminal before it applies any
      same-state no-op shortcut.
    rationale: >-
      If the validator checks for equality first, a duplicate close retry can flow into
      the later append and broadcast paths as a fresh state change.
    verification: A unit test confirms that a `RM.CLOSED -> RM.CLOSED` duplicate close attempt
      is handled as a terminal no-op without appending a new `ParticipantStatus` record.
    stories:
    - story_2022_066
  - id: CM-04-011
    priority: MUST
    kind: protocol
    statement: >-
      RM transition validation MUST treat a repeated `RM.CLOSED -> RM.CLOSED` update as
      a terminal no-op: no new participant status record, broadcast or case-ledger
      entry.
    rationale: >-
      A participant can send its close again, for example on a retry. A repeat of the
      close is not a new decision. If it appended a record, broadcast or ledgered, every
      replica would record a second close that never happened.
    verification: >-
      `test_terminal_closed_update_does_not_commit_log_entry` in
      `test/core/use_cases/received/test_status.py` asserts that a repeated
      `RM.CLOSED` update appends no `ParticipantStatus`, commits no ledger entry and
      queues nothing.
    relationships:
    - rel_type: extends
      spec_id: CM-04-007
    stories:
    - story_2022_066
  - id: CM-04-008
    priority: MUST
    kind: protocol
    statement: >-
      When processing an EM state transition and the accepting actor is any participant
      other than the Case Owner, the receiver MUST update only that participant's own
      consent row for the accepted embargo.
    rationale: >-
      Non-owner participants do not advance the shared EM state; their individual acceptance
      updates only their own consent record.
    verification: Integration tests in `test/demo/` confirm that an embargo-accept from a
      non-owner participant updates only that participant's
      consent row for the accepted embargo, not `CaseStatus.em.state`.
    stories:
    - story_2022_023
    - story_2022_027
- id: CM-05
  title: Object Model Relationships
  specs:
  - id: CM-05-001
    priority: MUST
    kind: protocol
    statement: >-
      VulnerabilityReport, VulnerabilityCase, VulnerabilityRecord, CaseReference,
      CaseParticipant, and ParticipantStatus MUST be distinct, non-interchangeable object
      types.
    rationale: >-
      Each of these objects has its own meaning and its own rules. If two of them were
      one type, a receiver could not tell which one a message carries. The
      CASE_MANAGER is not in this list: it is an ordinary actor designated for a case,
      not an identity or a distinct object type (ADR-0088).
    verification: >-
      `test/core/models/test_distinct_domain_types.py` confirms that the serialized form
      of each of the six types validates as that type.
    lint_suppress:
    - missing_story_reference
  - id: CM-05-015
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A message MUST NOT carry one of the six object types of CM-05-001 where the
      protocol expects another of them.
    rationale: >-
      A receiver acts on an object by its type. If a message carried a case where a
      report is expected, the receiver would apply the rules of one object to a
      different object.
    verification: >-
      `test/core/models/test_distinct_domain_types.py` confirms that the serialized form
      of each of the six types is refused with a validation error when parsed as any of
      the others.
    relationships:
    - rel_type: extends
      spec_id: CM-05-001
  - id: CM-05-013
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST model VulnerabilityReport, VulnerabilityCase, VulnerabilityRecord,
      CaseReference, CaseParticipant, and ParticipantStatus as separate types.
    rationale: >-
      CM-05-001 states only what other participants observe (MS-12-010). This
      requirement records how this codebase satisfies CM-05-001. Separate types keep the
      validation rules of each object in one place. The Case Actor is not in this list.
      It is an ordinary `VultronService` that holds the CASE_MANAGER role, not a
      different type (ADR-0088).
    verification: >-
      Static analysis (mypy) confirms that `VulnerabilityReport`, `VulnerabilityCase`,
      `VulnerabilityRecord`, `CaseReference`, `CaseParticipant`, and `ParticipantStatus` are
      declared as distinct types.
    relationships:
    - rel_type: implements
      spec_id: CM-05-001
  - id: CM-05-016
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT substitute one of the six types of CM-05-013 for another at
      any API boundary or in the persistence layer.
    rationale: >-
      How this codebase meets CM-05-015. Separate types let the type checker find an
      object that the code passes in place of a different object.
    verification: >-
      Static analysis (mypy) confirms that no typed signature accepts one of the six
      types
      in place of another, and `test/core/models/test_distinct_domain_types.py` confirms
      that each type's serialized form is refused when parsed as any of the others.
    relationships:
    - rel_type: implements
      spec_id: CM-05-015
  - id: CM-05-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A `VulnerabilityCase` MUST NOT exist without a reference to at least one
      `VulnerabilityReport`.
    rationale: >-
      A case exists to coordinate the response to a reported vulnerability. A case with
      no report has nothing to coordinate and gives participants nothing to act on.
      Also, a participant that joins later reads the report to learn what the case is
      about.
    relationships:
    - rel_type: implements
      spec_id: VP-02-015
    stories:
    - story_2022_102
  - id: CM-05-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A `VulnerabilityCase` SHOULD reference at least one `VulnerabilityRecord` before
      closure
    rationale: >-
      A `VulnerabilityRecord` identifies the vulnerability outside the case, for example
      with a CVE ID. If a case closes without one, the outcome is difficult to find and
      to cross-reference. Some cases close without one for a good reason, thus the rule
      is a SHOULD.
  - id: CM-05-014
    priority: SHOULD
    kind: project
    statement: >-
      This codebase SHOULD log a warning when a `VulnerabilityCase` closes with no
      associated `VulnerabilityRecord` (CM-05-003).
    rationale: >-
      How this codebase reports a miss of CM-05-003; split from it so CM-05-003 states
      only what the case carries (MS-12-010). A log line is not something another
      participant can observe.
    relationships:
    - rel_type: implements
      spec_id: CM-05-003
  - id: CM-05-004
    priority: MAY
    kind: protocol
    statement: A `VulnerabilityCase` MAY have zero or more associated `CaseReference` objects
    rationale: >-
      Advisories, patches and other public material can exist for a case or not. Their
      number depends on how many parties publish. Zero or more items let the case record
      what exists, with no placeholder.
  - id: CM-05-005
    priority: MUST
    kind: protocol
    statement: '`CaseReference` objects MUST include at minimum a `url` field.'
    rationale: >-
      A reference points a reader to a public resource. Without a `url`, it identifies
      nothing that a consumer can get or examine.
    verification: Inspection of `vultron/core/models/case.py` confirms that the `CaseReference`
      model declares a required `url` field.
    lint_suppress:
    - missing_story_reference
  - id: CM-05-006
    priority: MAY
    kind: protocol
    statement: One report MAY describe several vulnerabilities.
    rationale: >-
      Reports and vulnerabilities do not always map one to one. One finder can report
      several flaws together.
    stories:
    - story_2022_104
    - story_2022_105
    - story_2022_111
  - id: CM-05-017
    priority: MAY
    kind: protocol
    statement: >-
      One case MAY group several reports, for example when the reports involve
      overlapping participants.
    rationale: >-
      Several finders can report the same flaw. Then one case can coordinate the
      response to the related reports, and the same work does not divide across cases.
    relationships:
    - rel_type: extends
      spec_id: CM-05-006
    stories:
    - story_2022_104
  - id: CM-05-007
    priority: MAY
    kind: protocol
    statement: Multiple `CaseReference` objects MAY arise from a single case (e.g., coordinated simultaneous disclosure by
      multiple vendors)
    rationale: >-
      When several vendors fix the same vulnerability, each vendor usually publishes its
      own advisory. The case must record all of these advisories, not only one.
  - id: CM-05-008
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      An actor MUST NOT interpret a `VulnerabilityRecord` identifier, nor restrict it to
      the CVE ID format or any other namespace.
    rationale: Different organizations use different identifier namespaces (CVE, CERT/CC VU#, vendor-assigned IDs, etc.);
      requiring a specific format excludes valid records and prevents multi-namespace support
  - id: CM-05-009
    priority: SHOULD
    kind: protocol
    statement: A `VulnerabilityRecord` SHOULD support a list of alias identifiers from different namespaces for the same vulnerability
    rationale: Multiple IDs from different namespaces may refer to the same underlying vulnerability (e.g., a CVE ID and a
      CERT/CC VU# ID)
  - id: CM-05-010
    priority: MUST
    kind: protocol
    statement: When a `VulnerabilityRecord` is a `CVERecord` (i.e., it carries a CVE ID), its data MUST conform to the CVE
      JSON schema (<https://github.com/CVEProject/cve-schema>)
    rationale: >-
      Tools that read a record with a CVE ID expect the CVE JSON schema. Data that
      conforms goes to the CVE ecosystem without translation. Those tools refuse or
      misread data that does not conform.
    verification: Inspection of `vultron/core/` confirms that `CVERecord` (or the equivalent
      CVE-typed `VulnerabilityRecord`) validates its data against the CVE JSON schema.
    lint_suppress:
    - missing_story_reference
  - id: CM-05-011
    priority: SHOULD
    kind: protocol
    statement: '`CaseReference` objects SHOULD include a `name` field containing a human-readable title.'
    rationale: A human-readable title makes references easier to identify in case summaries and reports.
  - id: CM-05-012
    priority: MAY
    kind: protocol
    statement: >-
      `CaseReference` objects MAY include a `tags` field (array of one or more type
      descriptors, e.g., "patch", "vendor-advisory", "third-party-advisory", "exploit",
      "release-notes").
    rationale: >-
      Type descriptor tags allow consumers to filter or categorise references without
      parsing the URL or name.
- id: CM-06
  title: Case Update Broadcast
  specs:
  - id: CM-06-001
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER updates canonical case state, it MUST notify every active
      participant (CM-10-004).
    rationale: >-
      Every change the CASE_MANAGER makes to the case file is its own ledger entry
      (CLP-07-013), so the ledger fan-out is the notice: each change reaches the
      active participants as `Announce(CaseLedgerEntry)`. The CASE_MANAGER also
      announces the updated case as `Announce(VulnerabilityCase)` after admitting
      an engagement that moved the sender's recorded RM state. An engagement that
      restates a move already recorded changes no case state, so it announces
      nothing (RSH-08-002, ID-05-003). No participant sends
      the CASE_MANAGER an `Update(VulnerabilityCase)`; one that arrives is the shape
      of the CASE_MANAGER's own `update_case_owner` act, which no received use case
      handles, so it is reported "no use case found" (SE-05-002, ADR-0140).
    verification: >-
      Integration tests in `test/demo/` confirm that after the CASE_MANAGER updates
      canonical case state it fans out `Announce(CaseLedgerEntry)` to every active
      participant and to no inert participant.
    relationships:
    - rel_type: implements
      spec_id: VP-02-019
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: implements
      spec_id: VP-08-001
    adr:
    - ADR-0114
    stories:
    - story_2022_043
    - story_2022_098
  - id: CM-06-002
    priority: MUST
    kind: protocol
    statement: Participants receiving a case update notification MUST treat the update as authoritative only when it originates
      from the CASE_MANAGER
    rationale: >-
      Only the CASE_MANAGER writes canonical case state, and replicas get it from the
      CASE_MANAGER (ADR-0108). If a replica accepts a case update from any other
      participant, any peer can make that replica diverge from the canonical case.
    adr:
    - ADR-0108
    verification: Integration tests in `test/demo/` confirm that a state update message from a
      non-CASE_MANAGER participant is not treated as authoritative case state.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    stories:
    - story_2022_088
    - story_2022_089
  - id: CM-06-003
    priority: MUST
    kind: protocol
    statement: Case update notifications MUST include the updated CASE_MANAGER's actor URL so participants can fetch the current case
      state if needed
    rationale: >-
      A notification can be a summary, can arrive late, or can arrive out of order. The
      actor URL of the CASE_MANAGER lets a participant that thinks its copy is stale get
      the current state from the authoritative source, not from a peer.
    verification: Inspection of `vultron/core/` confirms that case update notification payloads
      include the CASE_MANAGER's actor URL so recipients can fetch current state.
    scope:
    - production
    stories:
    - story_2022_088
    - story_2022_028
  - id: CM-06-004
    priority: MUST
    kind: protocol
    statement: Participants MUST authenticate case update notifications before accepting them as authoritative
    rationale: >-
      Participants accept an update as authoritative only when it comes from the
      CASE_MANAGER (CM-06-002). Without authentication, any party can claim to be the
      CASE_MANAGER and send false case state, for example an embargo that it says is
      lifted.
    verification: Inspection of `vultron/core/` confirms that the case update notification
      handler verifies the sender's identity against the known CASE_MANAGER before processing the
      update.
    scope:
    - production
    stories:
    - story_2022_089
    - story_2022_090
  - id: CM-06-005
    priority: MUST
    kind: protocol
    statement: >-
      When a note is added to a case, the CASE_MANAGER MUST broadcast the note to every
      active participant (CM-10-004), excluding the note author.
    rationale: >-
      A note is part of the case discussion, and every active participant must see it.
      The author already has the note. A copy back to the author adds traffic and a
      duplicate that the author must ignore.
    verification: >-
      Integration tests in `test/demo/` confirm that adding a note to a case causes the
      CASE_MANAGER to broadcast the note to every active participant except the note
      author.
    relationships:
    - rel_type: depends_on
      spec_id: OX-03-001
    - rel_type: depends_on
      spec_id: CM-02-001
    adr:
    - ADR-0114
    stories:
    - story_2022_041
    - story_2022_083
- id: CM-07
  title: CVD Action Rules API
  specs:
  - id: CM-07-001
    priority: SHOULD
    kind: project
    statement: The system SHOULD expose an endpoint that returns the set of valid actions available to a case participant
      given the current case state and their role
    rationale: >-
      The valid next actions depend on several state machines and on the role of the
      participant. It is difficult for a client to calculate them correctly. An endpoint
      that returns them gives every client the same answer and keeps the rules in one
      place.
    relationships:
    - rel_type: refines
      spec_id: AR-07-001
    - rel_type: refines
      spec_id: AR-07-002
    stories:
    - story_2022_031
    - story_2022_088
  - id: CM-07-002
    priority: MUST
    kind: project
    statement: The action rules response MUST include the participant's role and the current RM, EM, CS, and VFD states relevant
      to that participant
    rationale: >-
      A client must know the state that produced the list of valid actions. It uses that
      state to explain the list to a user and to find when the list is stale. The role
      and the related states in the response give that context.
    verification: Integration tests in `test/demo/` confirm that the action rules endpoint
      returns the participant's role and current RM, EM, CS, and VFD states.
    stories:
    - story_2022_088
    - story_2022_061
  - id: CM-07-003
    priority: MUST
    kind: project
    statement: The action rules response MUST list valid next actions as structured objects including the action name and
      any required parameters
    rationale: >-
      A client uses the response directly. Structured objects with the action name and
      its parameters let the client build the request. The client does not parse prose
      or hard-code which action needs which input.
    verification: Integration tests in `test/demo/` confirm that the action rules endpoint lists
      valid next actions as structured objects containing at minimum the action name.
    stories:
    - story_2022_086
    - story_2022_088
- id: CM-08
  title: Domain Model Architecture
  specs:
  - id: CM-08-001
    priority: SHOULD
    kind: architecture
    statement: The system SHOULD maintain a clear separation between the wire representation, domain model, and persistence
      model for CVD objects
    rationale: >-
      Wire shape, domain rules and storage change for different reasons. There is one
      object model, and AS2 is its serialization (ADR-0099). Thus, the separation is at
      the edges: the parse edge, the rendering port and the store. A new storage backend
      or an AS2 rendering detail then changes one edge and does not change the domain
      rules.
  - id: CM-08-002
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms no core domain class inherits from an ActivityStreams base
      type, and AS2 rendering goes through the rendering port.
    statement: >-
      A core domain class in this codebase MUST NOT inherit directly from an
      ActivityStreams base type. Its AS2 serialization goes through the rendering port
      (ARCH-20-001, ADR-0099).
    rationale: >-
      The two branches stay distinct type hierarchies, so neither branch imports the
      other. The rendering port gives core a wire form without core code building it
      (`notes/wire-core-boundary.md`).
    adr:
    - ADR-0082
  - id: CM-08-003
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms no wire class defines a method that translates it to or from
      a core domain object.
    statement: >-
      A wire class in this codebase MUST NOT carry a translation method to or from a
      core domain object.
    rationale: >-
      The translation between the two branches lives on the adapter side, the one
      layer permitted to see both. A translation method on a wire class would make the
      wire branch import the core branch.
    relationships:
    - rel_type: extends
      spec_id: CM-08-002
    adr:
    - ADR-0082
- id: CM-09
  title: Redacted Case View
  specs:
  - id: CM-09-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD support a `RedactedVulnerabilityCase` type for sharing case information with invited-but-not-yet-accepted
      participants
    rationale: >-
      An invitee has not yet agreed to the embargo. Thus, it must learn only enough
      about the case to decide whether to join. A redacted view gives it this
      information and does not disclose case details that it has no obligation to
      protect yet.
    scope:
    - production
  - id: CM-09-002
    priority: MUST
    kind: protocol
    statement: >-
      The ID of a `RedactedVulnerabilityCase` MUST be cryptographically unrelated to the
      full `VulnerabilityCase` ID. The prototype case stub (CM-11-013) is not a
      `RedactedVulnerabilityCase`, and this requirement does not apply to it.
    rationale: Prevents an attacker who obtains a redacted case ID from inferring the full case ID
    verification: Inspection of `vultron/core/` confirms that `RedactedVulnerabilityCase` ID
      generation does not derive from or encode the full `VulnerabilityCase` ID.
    scope:
    - production
    adr:
    - ADR-0114
    stories:
    - story_2022_033
    - story_2022_024
  - id: CM-09-003
    priority: MUST
    kind: protocol
    statement: Each invitee MUST receive a distinct `RedactedVulnerabilityCase` ID
    rationale: Prevents cross-correlation of redacted IDs to infer participant list size or identities
    verification: Inspection of `vultron/core/` confirms that each invitee's
      `RedactedVulnerabilityCase` is generated with a unique ID distinct from every other
      invitee's redacted case ID.
    scope:
    - production
    stories:
    - story_2022_033
    - story_2022_024
  - id: CM-09-004
    priority: MAY
    kind: project
    statement: >-
      For the prototype, the stub Invite MAY carry the case stub of CM-11-013, which
      names the full case ID, deferring the redacted view to a later phase.
    rationale: >-
      The redacted view (CM-09-001) is a production feature that the prototype does not
      have. The stub Invite of the prototype carries the case stub of CM-11-013, so
      invitations work from start to end without the redacted view. The cost is that the
      invitee sees the full case ID. CM-09-002 forbids this only for a
      `RedactedVulnerabilityCase`.
    adr:
    - ADR-0114
- id: CM-10
  title: Per-Participant Embargo Acceptance
  specs:
  - id: CM-10-001
    priority: MUST
    kind: protocol
    statement: >-
      `CaseParticipant` MUST record its consent per embargo: one consent row for every
      entry in the case's embargo register, naming the embargo and the participant's
      answer to it, `UNINVITED` until it is asked (CM-18-001). A participant agrees to
      an embargo explicitly, by an `Accept`, as its proposer, by seeding (CM-14-003,
      CM-14-005), or by containment, when the Case Owner activates a revision that ends
      no later than terms the participant had agreed to (EP-05-001). Each invitation's
      RSVP deadline is stored on that invitation's `INVITED` row (CM-28-013). No other
      record of embargo consent may exist on the participant.
    rationale: >-
      Consent is per embargo (ADR-0093, ADR-0122). The CM-10-004 content gate reads the
      rows. Thus, the rows must name every embargo that binds the participant. This
      includes an embargo that containment carries over: an agreement to N days is an
      agreement to every shorter period, so no explicit `Accept` is necessary for it. A
      second record of consent next to the rows can disagree with them. A reader then
      cannot know which record is correct.
    verification: Inspection of `vultron/core/models/case_participant.py` confirms that
      `CaseParticipant` carries `embargo_consents` rows and declares no scalar consent field and no
      `accepted_embargo_ids` or `invite_rsvp_deadline`.
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
    adr:
    - ADR-0093
    - ADR-0122
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-10-002
    priority: MUST
    kind: protocol
    statement: Embargo acceptances MUST be timestamped by the CASE_MANAGER at the time of receipt, not using the participant's
      claimed timestamp
    rationale: The CASE_MANAGER applies the only trusted timestamp; the participant's reported time cannot be verified
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER's own clock
      timestamp is stored on embargo acceptance records, not the participant's claimed
      timestamp.
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    - rel_type: implements
      spec_id: CM-02-009
    stories:
    - story_2022_074
  - id: CM-10-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST share case content only with active participants, never
      with an inert one. A participant is active when three conditions hold. First,
      the case initialization sequence seated it (CM-14-001: the Case Owner, the
      CASE_MANAGER and the reporter), or it accepted the stub Invite
      (`Accept(Invite(Actor)[target=VulnerabilityCaseStub])`). Second, it has not been
      removed (CM-31-001). Third, while an embargo is active, its consent row for that
      embargo is `AGREED` (CM-18-001). Every other participant is inert. Case content
      includes `CaseLedgerEntry` announcements, `Announce(VulnerabilityCase)`, status
      broadcasts and embargo announcements (ADR-0114).
    rationale: >-
      Many cases have no active embargo: the embargo is not yet established, or it has
      already ended. Thus, "has accepted the active embargo" cannot be the only
      entitlement test. The stub Invite creates the participant record (ADR-0114), and a
      removed participant keeps its record (ADR-0116). Thus, the roster holds actors
      that have no entitlement. A sender must check entitlement, because membership does
      not show it. While an embargo is active, the `AGREED` row of the participant for
      that embargo is its agreement to protect what it receives (ADR-0122).
    verification: >-
      Tests confirm that an invitee that has not accepted the stub Invite, and a
      joined participant whose row for the active embargo is not `AGREED`, receive no
      case content, and that an active participant does, including one seated by
      case initialization that was never sent a stub. A test confirms a removed
      participant receives no case content whatever its embargo consent.
    adr:
    - ADR-0114
    - ADR-0116
    - ADR-0122
    stories:
    - story_2022_023
    - story_2022_025
  - id: CM-10-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      This rule covers each `Announce(CaseLedgerEntry)` the CASE_MANAGER sends, as
      fan-out of a new entry or as a replay answering a `Reject(CaseLedgerEntry)`
      (SYNC-03-002). While an embargo is active, the CASE_MANAGER MUST NOT send one to a
      participant that has not accepted that embargo (the CM-10-004 content gate).
    rationale: >-
      The ledger fan-out is how participants learn every accepted case change, and each entry carries
      its payload verbatim — an added report or note reaches the recipient whole. Fan-out is therefore
      "sharing case updates" in CM-10-004's sense. An entry cannot be redacted per recipient without
      breaking the hash chain. Skipping a single entry does not work either: the replica buffers the
      next one as a forward gap and Rejects to request the missing entry (SYNC-14-002), so the replay
      would deliver the withheld content anyway. The gate therefore pauses the participant's whole
      stream, replay included, rather than filtering entries; the replica stays at the
      last entry it was sent.
    verification: >-
      Unit tests on the fan-out recipient collectors confirm that, under an active embargo, a participant
      that is not a signatory to the active embargo is excluded from the recipients while a
      signatory is included, and that with no active embargo both are included. A unit test on the
      replay sender confirms that a replay to such a participant sends no entry.
    relationships:
    - rel_type: refines
      spec_id: CM-10-004
    stories:
    - story_2022_023
    - story_2022_025
  - id: CM-10-008
    priority: MUST
    kind: protocol
    statement: >-
      While an embargo is active, the CASE_MANAGER MUST still deliver an embargo
      `Invite`, and its responses, to a participant that has not accepted the embargo.
      These are embargo meta-protocol activities addressed to the participant directly,
      not ledger fan-out.
    rationale: >-
      These activities are not ledger fan-out, so the CM-10-005 pause does not cover
      them. A participant that never receives the embargo `Invite` cannot accept the
      embargo, so its paused stream could never resume.
    verification: >-
      `test_embargo_invite_still_reaches_non_signatory` in
      `test/core/behaviors/sync/nodes/test_fanout_embargo_gate.py` confirms that an
      embargo `Invite` reaches a participant that has not accepted the active embargo.
    relationships:
    - rel_type: extends
      spec_id: CM-10-005
    stories:
    - story_2022_023
    - story_2022_025
  - id: CM-10-006
    priority: MUST
    kind: protocol
    statement: >-
      When the CM-10-004 content gate admits a participant whose ledger stream it had paused (CM-10-005)
      — whenever the active check turns from false to true for that participant, whether because it
      accepts the active embargo, the embargo ends, or it is reinstated (CM-31-011) — the
      CASE_MANAGER MUST send that participant every canonical entry it was not sent, in log order
      starting with the first entry withheld from it, before or together with the entry that records
      the change admitting it.
    rationale: >-
      A paused participant's replica is a contiguous prefix of the ledger; backfilling the withheld suffix
      in order restores it to the leader's tip without a gap the catch-up gate (SYNC-10-004) would block
      on. Ending the embargo lifts the gate for everyone, so a participant that never accepted it is
      caught up at that point too. The trigger is the active check itself, not any one message
      (ADR-0116).
    adr:
    - ADR-0116
    verification: >-
      A received-side test confirms that when a participant accepts the active embargo, the
      CASE_MANAGER's outbox holds an `Announce(CaseLedgerEntry)` addressed to it for each entry committed
      while it was outside the gate, in log order and ahead of any later entry, and that none of those
      entries is re-sent to a participant that already had it.
    relationships:
    - rel_type: depends_on
      spec_id: CM-10-005
    - rel_type: depends_on
      spec_id: SYNC-04-001
    stories:
    - story_2022_023
    - story_2022_025
  - id: CM-10-007
    priority: MUST
    kind: architecture
    statement: >-
      This codebase MUST run the active-participant check (CM-10-004) in the shared
      recipient selection that every case-content send uses, never at individual send
      sites. An embargo-ending notice owed to a bound participant that is not active
      (CM-31-009, CM-31-030) is not case content.
    rationale: >-
      Almost every send of case content selects its recipients from the roster. If each
      send site has its own check, the next send site that someone writes can omit it.
      One shared selection (`vultron/core/participants/recipients.py`) prevents this.
      The embargo-ending notices are an exception. They must reach participants that
      are not active, including the due notices of a removed participant (ADR-0116).
    verification: >-
      An architecture test asserts every case-content send selects recipients
      through the shared active-participant selection.
    adr:
    - ADR-0114
    - ADR-0116
  - id: CM-10-009
    priority: MUST
    kind: architecture
    statement: >-
      The shared recipient selection MUST deliver a stub Invite, or an embargo Invite
      (EP-09), to an inert participant that has not been removed (CM-31-013). Such an
      Invite is not case content.
    rationale: >-
      An Invite asks a participant to join the case or to consent to an embargo. An
      inert participant is the one that has to answer it. If the content gate held the
      Invite back, the participant could never become active.
    verification: >-
      `test_invitations_reach_inert_participants_but_not_closed_ones` in
      `test/core/participants/test_recipients.py` confirms that the Invite recipients
      include inert participants and exclude a closed one.
    relationships:
    - rel_type: extends
      spec_id: CM-10-007
    adr:
    - ADR-0114
- id: CM-11
  title: Joining a Case — Stub Invite, Inert Participant, Full-Case Invite
  description: >-
    How an actor goes from invited to participating: the stub Invite creates an
    inert participant record, the participant's reply to it decides whether it
    joins, and a joined participant judges the case by replying to a full-case
    Invite (ADR-0114, ADR-0121; notes/case-joining.md).
  specs:
  - id: CM-11-001
    priority: MUST
    kind: protocol
    statement: >-
      When a participant accepts the stub Invite
      (`Accept(Invite(Actor)[target=VulnerabilityCaseStub])`), the CASE_MANAGER MUST
      leave the participant's RM state at `RM.RECEIVED`, set its VF state to
      `V` when it holds the VENDOR role, and, when an embargo is active, mark
      its consent row for that embargo `AGREED`, making it a signatory. A
      `DECLINED` row is the exception, and the CASE_MANAGER leaves it unchanged:
      an explicit refusal outranks the consent that joining implies. Accepting
      the stub is joining the case and, unless the row is `DECLINED`, consenting
      to the active embargo. It is not a judgement of the case.
    rationale: >-
      The invitee has seen only the stub. Its judgement of the case comes after
      it has received the case and its history, as its reply to the full-case
      Invite (CM-11-010).
    verification: Tests confirm that `Accept(Invite(Actor)[target=VulnerabilityCaseStub])`
      leaves the participant at `RM.RECEIVED`, sets VF `V` for a vendor, and
      marks its consent row for the active embargo `AGREED` when an embargo is active,
      and that it leaves a `DECLINED` row for that embargo unchanged.
    relationships:
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: depends_on
      spec_id: CM-03-001
    adr:
    - ADR-0114
    stories:
    - story_2022_054
    - story_2022_088
  - id: CM-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      After joining a case, a participant SHOULD judge the case by replying to
      the full-case Invite (CM-11-010, CM-11-011).
    rationale: >-
      The CASE_MANAGER cannot count a joined participant as engaged until the
      participant says so (CM-11-004). The other participants plan their work from the
      list of engaged participants. The participant receives the full-case Invite,
      examines the case and its history, and then engages or defers. Every replica then
      records the RM decision of the participant itself, not a decision that the
      CASE_MANAGER infers from silence.
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    - rel_type: depends_on
      spec_id: CM-11-001
    adr:
    - ADR-0121
    stories:
    - story_2022_006
  - id: CM-11-022
    priority: SHOULD
    kind: protocol
    statement: >-
      After it replies to the full-case Invite, a participant SHOULD engage with
      `Join(VulnerabilityCase)` (RM.ACCEPTED) or defer with
      `Ignore(VulnerabilityCase)` (RM.DEFERRED).
    rationale: >-
      Judging the case says whether the report is valid. It does not say whether the
      participant will work on the case. Only the participant can make that choice, and
      `Join` or `Ignore` records it, so no replica has to infer it from silence
      (CM-11-004).
    relationships:
    - rel_type: extends
      spec_id: CM-11-002
    adr:
    - ADR-0121
    stories:
    - story_2022_006
  - id: CM-11-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT treat a joined participant as having committed to
      the case (RM.ACCEPTED) until it receives `Join(VulnerabilityCase)` from
      that participant.
    rationale: >-
      Only the participant can say it has chosen to engage. Neither accepting
      the stub Invite (joining) nor accepting the full-case Invite (RM.VALID)
      is an engagement decision.
    verification: Tests confirm that the CASE_MANAGER does not record a joined
      participant at `RM.ACCEPTED` until it receives `Join(VulnerabilityCase)`
      from it.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-001
    stories:
    - story_2022_054
    - story_2022_088
  - id: CM-11-003
    priority: MUST
    kind: protocol
    statement: >-
      A receiver processing a reply to a stub Invite (`Accept` or `Reject` of
      `Invite(Actor)[target=VulnerabilityCaseStub]`) MUST identify the case from the
      case the nested Invite's stub
      names, never by deriving it from the stub's ID; the top-level `target` of the reply is
      not populated.
    rationale: >-
      The reply wraps the Invite as its `object_`, so the stub is on
      `object_.target`, which `extract_event` maps to `inner_target`. The stub
      has its own ID (`<case-id>/stub`) and names the case explicitly
      (CM-11-013, CM-11-037); parsing one ID out of the other would couple every
      receiver
      to the ID scheme.
    verification: A unit test confirms the reply use case resolves `case_id` from
      the case named by the stub on the nested Invite.
    adr:
    - ADR-0114
    lint_suppress:
    - missing_story_reference
  - id: CM-11-006
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER sends a stub Invite
      (`Invite(Actor)[target=VulnerabilityCaseStub]`), it MUST create the invitee's
      `CaseParticipant` in the same step. The participant is inert (CM-10-004).
    rationale: >-
      The CASE_MANAGER needs to track every invitee from the moment it is
      invited — whether it has been told and how it answered — including the
      invitees that decline (ADR-0114).
    verification: >-
      `test/core/use_cases/triggers/test_case_joining_trigger.py::test_stub_invite_creates_inert_invitee_participant`
      finds the invitee's record created when the Invite is sent.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_061
  - id: CM-11-026
    priority: MUST
    kind: protocol
    statement: >-
      The `CaseParticipant` a stub Invite creates MUST hold the Invite's roles,
      RM `RECEIVED`, VF `v` (VENDOR), and an `INVITED` row for an active embargo.
    rationale: >-
      The invitee has been told of the case and has decided nothing. RM `RECEIVED`
      and VF `v` record exactly that. The `INVITED` row records that it was asked
      about the embargo in force and has not answered (CM-18-001).
    verification: >-
      `test_seats_inert_vendor_invitee_at_rm_received` and
      `test_active_embargo_gives_invited_consent_row` in
      `test/core/behaviors/case/nodes/test_invite_inert_participant.py` find the
      invitee's participant at RM `RECEIVED`, VF `v` (vendor) and consent
      `INVITED` (active embargo).
    relationships:
    - rel_type: extends
      spec_id: CM-11-006
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_061
  - id: CM-11-023
    priority: MUST
    kind: protocol
    statement: >-
      When it sends a stub Invite, the CASE_MANAGER MUST commit its own
      `create_case_participant` (`Create(CaseParticipant)`) entry, separate from
      the Invite's `invite_actor_to_case` entry.
    rationale: >-
      The ledger holds the wire messages that the actors exchanged, and every state
      change has a message. The Invite is one message. Creating the invitee's record
      is the CASE_MANAGER's own act, so it is a second message with its own entry
      (ADR-0114, ADR-0124).
    verification: >-
      `test_creating_the_record_emits_its_own_entry_carrying_it` in
      `test/core/behaviors/case/nodes/test_invitee_accept_entries.py` and
      `test_the_ledger_holds_the_messages_and_the_one_creation_entry` in
      `test/core/use_cases/received/test_stub_invite_replay.py` find the
      `create_case_participant` entry beside the Invite's entry.
    relationships:
    - rel_type: extends
      spec_id: CM-11-006
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-11-024
    priority: MUST
    kind: protocol
    statement: >-
      The `create_case_participant` entry MUST carry the whole participant record
      as stored: its statuses and consent rows, with their ids and times.
    rationale: >-
      A replica copies the record from the entry and derives nothing (CM-11-025,
      ADR-0124). The entry must therefore carry every field the CASE_MANAGER holds,
      or the replica's record differs from the CASE_MANAGER's.
    verification: >-
      `test_creating_the_record_emits_its_own_entry_carrying_it` in
      `test/core/behaviors/case/nodes/test_invitee_accept_entries.py` finds the
      entry carrying the record as stored.
    relationships:
    - rel_type: extends
      spec_id: CM-11-023
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-11-025
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST store an invitee's record exactly as the
      `create_case_participant` entry carries it, and derive none of it from the
      Invite's entry.
    rationale: >-
      Replicas copy; they never mint ids, read clocks or run lifecycle logic
      (ADR-0124). A record a replica derived could differ from the CASE_MANAGER's in
      an id or a time, and the copies of the case would then disagree.
    verification: >-
      `test_create_entry_stores_the_record_exactly_as_carried` in
      `test/core/behaviors/sync/test_announce_tree.py` finds the stored record equal
      to the one the entry carries;
      `test_replicas_hold_the_managers_whole_record_after_invite_and_accept` in
      `test/core/use_cases/received/test_stub_invite_replay.py` finds each
      replica's record equal to the CASE_MANAGER's in every field, status ids and
      times included.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-024
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-11-007
    priority: MUST
    kind: protocol
    statement: >-
      A stub Invite has exactly two valid replies, `Accept` (CM-11-001) and
      `Reject`. On `Reject(Invite(Actor)[target=VulnerabilityCaseStub])`, the
      CASE_MANAGER MUST close the participant and keep its record, which stays
      inert. Closing it moves its RM state to `RM.CLOSED`, sets VF `V` for a
      VENDOR, and records consent `DECLINED` when an embargo is active.
    rationale: >-
      A stub reject is a hard no to joining. Keeping the record keeps the
      history that the actor was told and declined, which is what the early
      record exists for.
    verification: >-
      `test_stub_invite_reject_closes_and_keeps_the_record` in
      `test/core/use_cases/received/actor/test_case_joining_replies.py` drives the
      stub Reject and checks the participant record.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_006
  - id: CM-11-027
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST apply a stub `Reject` from two entries: the invitee's
      `reject_invite_actor_to_case`, which carries the `DECLINED` row, and the
      CASE_MANAGER's `add_participant_status_to_participant` closing status.
    rationale: >-
      The invitee's `Reject` is a message, so it is its own ledger entry, and it is the
      entry for the `DECLINED` row. A replica applies that row through the same write
      the CASE_MANAGER uses. The closing status is the CASE_MANAGER's own act, with an
      entry of its own that a replica stores. Each replica then holds the record the
      CASE_MANAGER holds (ADR-0114, ADR-0124).
    verification: >-
      `test_the_reject_entry_declines_the_embargo_in_force` in
      `test/core/behaviors/sync/test_announce_tree.py` applies the Reject entry on a
      replica; `test_replicas_hold_the_managers_whole_record_after_a_reject` in
      `test/core/use_cases/received/test_stub_invite_replay.py` finds each
      replica's record equal to the CASE_MANAGER's after a reject.
    relationships:
    - rel_type: extends
      spec_id: CM-11-007
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-11-028
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse
      `TentativeReject(Invite(Actor)[target=VulnerabilityCaseStub])`.
    rationale: >-
      Accepting the stub is not a judgement of the case, so there is nothing for a
      tentative reject to say. Only the full-case Invite asks for a judgement
      (CM-11-011).
    verification: >-
      `test_full_case_invite_tentative_reject_is_ri_and_stub_has_none` in
      `test/wire/as2/test_case_joining_wire.py` finds that a `TentativeReject` of a
      stub Invite matches no semantic, so the receiver refuses it at the edge.
    relationships:
    - rel_type: extends
      spec_id: CM-11-007
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-008
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER processes
      `Accept(Invite(Actor)[target=VulnerabilityCaseStub])` and the participant is
      active (CM-10-004), it
      MUST send the participant `Announce(VulnerabilityCase)` and begin
      replaying the case ledger to it without waiting for any further signal
      from the participant.
    rationale: >-
      The participant is entitled to case content from the moment it is active,
      and the history is part of what it then judges. The Accept is the
      readiness signal; out-of-order arrival is buffered (SYNC-14, SYNC-15) and
      a real gap is recovered by `Reject(CaseLedgerEntry)` and replay.
    verification: A test confirms that processing the Accept queues
      `Announce(VulnerabilityCase)` and the ledger replay to the participant.
    adr:
    - ADR-0114
    stories:
    - story_2022_023
    - story_2022_045
  - id: CM-11-009
    priority: MUST
    kind: protocol
    statement: >-
      Any reply from a VENDOR-role invitee to its stub Invite MUST set its VF
      state to `V`.
    rationale: >-
      Any reply is evidence the vendor is aware of the case.
    verification: Tests confirm each stub reply sets a vendor's VF to `V`.
    adr:
    - ADR-0114
    - ADR-0121
    stories:
    - story_2022_061
  - id: CM-11-029
    priority: MAY
    kind: protocol
    statement: >-
      The CASE_MANAGER or the Case Owner MAY set an inert invitee's VF state to
      `V` before the invitee replies (PRM-06-003).
    rationale: >-
      The CASE_MANAGER or the Case Owner can learn that a vendor is aware of the case
      before the vendor answers its stub Invite, for example from a direct contact.
      Recording that awareness early keeps the VF history correct.
    verification: >-
      `test_changes_only_vf_of_an_inert_vendor_invitee` in
      `test/core/use_cases/triggers/case/test_add_on_behalf_status.py` sets an inert
      vendor invitee's VF to `V` on its behalf.
    relationships:
    - rel_type: refines
      spec_id: PRM-06-003
    adr:
    - ADR-0121
    stories:
    - story_2022_061
  - id: CM-11-030
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A write that sets an inert invitee's VF state to `V` before it replies
      MUST NOT change the invitee's RM state.
    rationale: >-
      RM is the invitee's own judgement (ADR-0121). Awareness of the case is not a
      decision about it, so the write that records awareness must not move RM.
    verification: >-
      `test_changes_only_vf_of_an_inert_vendor_invitee` in
      `test/core/use_cases/triggers/case/test_add_on_behalf_status.py` asserts that
      the invitee's RM stays at `RECEIVED`.
    relationships:
    - rel_type: extends
      spec_id: CM-11-029
    adr:
    - ADR-0121
    stories:
    - story_2022_061
  - id: CM-11-010
    priority: MUST
    kind: protocol
    statement: >-
      After CM-11-008, the CASE_MANAGER MUST send the participant the full-case
      Invite, `Invite(Actor)[target=VulnerabilityCase]`, queued after the last replayed
      ledger entry.
    rationale: >-
      The participant already holds the case from the Announce, so the Invite
      only asks the question and carries no copy of the case. Delivery to each
      recipient is ordered (ADR-0112), so queuing the Invite after the replay
      means it arrives once the participant can answer it.
    verification: >-
      `test_stub_accept_sends_announce_then_replay_then_full_case_invite` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` confirms the
      full-case Invite is queued after the last replayed ledger entry.
    adr:
    - ADR-0121
    stories:
    - story_2022_006
  - id: CM-11-031
    priority: MUST
    kind: protocol
    statement: >-
      The full-case Invite MUST name the case by ID and carry the `log_index` and
      `entry_hash` of the CASE_MANAGER's ledger tail when it issued the Invite.
    rationale: >-
      The Invite's ledger position is the floor the participant must reach before
      answering (ADR-0121). It travels as the Invite's `ledgerPosition`, the property
      every case activity carries (VAM-04-011, SYNC-18-001, ADR-0156).
    verification: >-
      `test_full_case_invite_carries_the_position_as_its_ledger_position` and
      `test_stored_invite_floor_is_the_invites_ledger_position` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` confirm the
      Invite carries the CASE_MANAGER's ledger tail position.
    relationships:
    - rel_type: extends
      spec_id: CM-11-010
    adr:
    - ADR-0121
    - ADR-0156
    stories:
    - story_2022_006
  - id: CM-11-032
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST refuse a full-case Invite whose sender is not the
      CASE_MANAGER on its replica or, with no replica, its stub-Invite trust
      anchor (PCR-03-004).
    rationale: >-
      Only the case's CASE_MANAGER may ask a participant to judge the case. Before the
      Announce arrives, the invitee has no replica, so the CASE_MANAGER it recorded
      from the stub Invite is the one it trusts (PCR-03-004).
    verification: >-
      `test_a_full_case_invite_from_the_case_manager_is_accepted`,
      `test_a_full_case_invite_from_another_actor_is_refused_and_writes_nothing` and
      `test_before_the_announce_the_recorded_trust_anchor_is_the_case_manager` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` confirm a
      full-case Invite from the CASE_MANAGER is accepted and one from any other
      actor is refused.
    relationships:
    - rel_type: refines
      spec_id: PCR-03-004
    adr:
    - ADR-0121
    stories:
    - story_2022_006
  - id: CM-11-033
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that holds neither a replica of the case nor a trust anchor for
      it MUST refuse a full-case Invite.
    rationale: >-
      With neither record, the receiver cannot tell the case's CASE_MANAGER from any
      other sender. It fails closed, so no sender can ask it to judge a case it never
      joined.
    verification: >-
      `test_with_no_replica_and_no_trust_anchor_a_full_case_invite_is_refused` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` confirms the
      refusal.
    relationships:
    - rel_type: extends
      spec_id: CM-11-032
    adr:
    - ADR-0121
    stories:
    - story_2022_006
  - id: CM-11-011
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record each full-case Invite reply as a move from
      `RM.RECEIVED`: RV `Accept` to `RM.VALID`, RI `TentativeReject` to
      `RM.INVALID`, RC `Reject` to `RM.CLOSED`.
    rationale: >-
      Each reply is the participant's own judgement of the case (ADR-0121). The three
      replies map to the three RM triage outcomes, so every replica records the
      judgement the participant made.
    verification: >-
      `test_full_case_invite_reply_moves_rm_from_received` in
      `test/core/use_cases/received/actor/test_case_joining_replies.py` drives each
      of the three replies and checks the participant's RM state.
    adr:
    - ADR-0121
    stories:
    - story_2022_006
    - story_2022_062
  - id: CM-11-034
    priority: MUST
    kind: protocol
    statement: >-
      A reply to the full-case Invite MUST carry the replier's own ledger
      position: the `log_index` and `entry_hash` of its tail when it decided.
    rationale: >-
      The position is the reply's `ledgerPosition`, the property every case
      activity carries (VAM-04-012..014, SYNC-18-001, ADR-0156), so the
      CASE_MANAGER judges it against the Invite's floor (CM-11-012) from the
      one field it reads on every case activity.
    verification: >-
      `test_reply_carries_the_participants_own_position` in
      `test/core/use_cases/triggers/test_full_case_invite_triggers.py` confirms the
      reply carries the participant's own position, and
      `test_a_reply_is_recorded_in_the_ledger_with_its_position` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` confirms the
      ledger entry records it.
    relationships:
    - rel_type: extends
      spec_id: CM-11-011
    adr:
    - ADR-0121
    - ADR-0156
    stories:
    - story_2022_006
  - id: CM-11-012
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a full-case Invite reply whose position is
      behind the Invite's, or names an entry missing from its ledger at that
      index.
    rationale: >-
      The Invite's position is a floor. A reply behind it was made without
      seeing what the participant was asked to judge. A reply that names an
      entry the CASE_MANAGER's ledger does not hold was not made on its ledger.
    verification: >-
      `test_reply_position_check_against_the_floor` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` and
      `test_full_case_invite_reply_position_is_checked_against_the_floor` in
      `test/core/use_cases/received/actor/test_case_joining_replies.py` confirm a
      reply behind the floor, or naming an entry the ledger does not hold, is
      refused.
    adr:
    - ADR-0121
    stories:
    - story_2022_045
  - id: CM-11-035
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST accept a full-case Invite reply whose position is at
      or beyond the Invite's.
    rationale: >-
      The Invite's position is a floor, not a pin. A reply beyond it is better
      informed. Pinning the reply to the Invite's position would make every reply on
      a busy case stale (ADR-0121).
    verification: >-
      `test_reply_position_check_against_the_floor` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` and the
      `beyond-the-floor` case of
      `test_full_case_invite_reply_position_is_checked_against_the_floor` in
      `test/core/use_cases/received/actor/test_case_joining_replies.py` confirm a
      reply at or beyond the floor is accepted.
    relationships:
    - rel_type: extends
      spec_id: CM-11-012
    adr:
    - ADR-0121
    stories:
    - story_2022_045
  - id: CM-11-036
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a full-case Invite reply from a participant
      that has not joined the case (an inert participant), writing nothing.
    rationale: >-
      Only a joined participant judges the case. An inert participant has not
      received the case or its history, so it has nothing to judge (CM-10-004).
    verification: >-
      `test_a_reply_from_a_participant_that_has_not_joined_is_refused` in
      `test/core/use_cases/received/actor/test_full_case_invite.py` confirms the
      reply is refused and writes no ledger entry.
    relationships:
    - rel_type: extends
      spec_id: CM-11-012
    adr:
    - ADR-0121
    stories:
    - story_2022_045
  - id: CM-11-013
    priority: MUST
    kind: protocol
    statement: >-
      A case stub MUST carry its own wire `type`, `VulnerabilityCaseStub`, and
      its own ID, the case's ID with `/stub` appended.
    rationale: >-
      A receiver classifies an activity by its shape. Sharing the case's type
      and ID made the stub Invite and the full-case Invite indistinguishable
      (ADR-0114).
    verification: >-
      `test_stub_invite_target_has_its_own_type_and_id` in
      `test/wire/as2/test_case_joining_wire.py` and
      `test_the_stub_id_is_derived_from_the_case_it_names` in
      `test/wire/as2/test_parser_case_stub.py` confirm a stub serializes with
      `type` `VulnerabilityCaseStub` and ID `<case-id>/stub`.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-037
    priority: MUST
    kind: protocol
    statement: >-
      A case stub MUST name the case it stands for in a field of its own.
    rationale: >-
      A receiver must find the case without parsing the stub's ID (CM-11-003).
      Parsing one ID out of the other would couple every receiver to the ID scheme.
    verification: >-
      `test_the_stub_serialises_its_type_id_and_case` and
      `test_a_stub_without_its_case_is_refused` in
      `test/wire/as2/test_parser_case_stub.py` confirm the stub carries its case in
      `caseId` and is refused without it.
    relationships:
    - rel_type: extends
      spec_id: CM-11-013
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-038
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST classify a case stub by its `type`, never by which fields
      it carries or by parsing its ID.
    rationale: >-
      A sparse case and an enriched stub can carry the same fields, so only the
      `type` tells them apart. A classifier that read the fields would take a sparse
      `VulnerabilityCase` for a stub (ADR-0114).
    verification: >-
      `test_a_stub_is_recognised_by_its_type` and
      `test_a_sparse_case_validates_as_a_case` in
      `test/wire/as2/test_parser_case_stub.py`, and
      `test_the_type_alone_selects_the_stub_or_the_case` in
      `test/wire/as2/test_unknown_key_disposition.py`, confirm that the `type`
      alone decides, and that an inbound sparse `VulnerabilityCase` is validated
      as a case, not a stub.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-013
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-014
    priority: MUST
    kind: protocol
    statement: >-
      A stub Invite MUST carry a reply deadline.
    rationale: >-
      An invitee that never answers must not hold the CASE_MANAGER in an open wait
      for ever. The deadline tells both sides when the ask ends (ADR-0114).
    verification: >-
      `test_deadline_is_the_configured_window_after_published` in
      `test/core/use_cases/triggers/test_stub_invite_lifetime.py` finds the stub
      Invite's deadline.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_006
  - id: CM-11-039
    priority: MUST
    kind: protocol
    statement: >-
      When a stub Invite's deadline passes unanswered, the CASE_MANAGER MUST
      close the Invite as an expired ask.
    rationale: >-
      An expired ask is over. Closing it ends the CASE_MANAGER's wait for an answer,
      so the case does not wait on an invitee that never replies (ADR-0114).
    verification: >-
      `test_expiry_writes_nothing_and_a_late_accept_still_joins` and
      `test_the_deadline_itself_is_expired` in
      `test/core/use_cases/triggers/test_stub_invite_lifetime.py` let a stub Invite
      expire and find the Invite closed.
    relationships:
    - rel_type: extends
      spec_id: CM-11-014
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-040
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When a stub Invite expires unanswered, the CASE_MANAGER MUST NOT change the
      invitee's record, which stays inert at `RM.RECEIVED` with its consent row
      `INVITED`.
    rationale: >-
      RM is the participant's own judgement (ADR-0121), so a timeout cannot stand in
      for one. The CM-28-004 time-out to `TIMED_OUT` applies to an
      `Invite(EmbargoEvent)`, not to the embargo terms a stub Invite carries, so the
      consent row stays `INVITED`.
    verification: >-
      `test_expiry_writes_nothing_and_a_late_accept_still_joins` in
      `test/core/use_cases/triggers/test_stub_invite_lifetime.py` finds the record
      unchanged at `RM.RECEIVED` with consent still `INVITED`.
    relationships:
    - rel_type: extends
      spec_id: CM-11-039
    adr:
    - ADR-0114
    - ADR-0121
    stories:
    - story_2022_052
  - id: CM-11-041
    priority: MUST
    kind: protocol
    statement: >-
      A case-wide closure check ("all participants closed") MUST count only
      joined participants: those seated by case initialization (CM-14-001) or
      that accepted their stub Invite.
    rationale: >-
      An invitee that never answered must not keep the case from closing
      (ADR-0114). An invitee that has not joined has made no judgement, so it has
      nothing to close.
    verification: >-
      `test_closure_check_skips_only_participants_that_never_joined` in
      `test/core/use_cases/triggers/test_case_joining_trigger.py` and
      `test_inert_invitee_is_not_counted` in
      `test/core/predicates/test_participants.py` find that an
      all-participants-closed check ignores the unanswered invitee.
    relationships:
    - rel_type: uses_definition
      spec_id: CM-10-004
    adr:
    - ADR-0114
    stories:
    - story_2022_006
  - id: CM-11-015
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER re-invites an unanswered or expired invitee, it MUST
      send a fresh stub Invite on the same record, with a new deadline.
    rationale: >-
      One actor has one participant record per case. A fresh stub Invite with a new
      deadline gives the invitee a live ask, and keeps the record that already holds
      its history.
    verification: >-
      `test_reinvite_reuses_the_invitee_record_with_a_new_deadline` in
      `test/core/use_cases/triggers/test_case_joining_trigger.py` confirms a
      re-invite reuses the existing record with a new deadline.
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-042
    priority: MUST
    kind: protocol
    statement: >-
      A re-invite's `inReplyTo` MUST be the id of the invitee's earlier stub
      Invite.
    rationale: >-
      Naming the earlier stub in the standard AS2 `inReplyTo` property leaves the
      invitee one live stub. CM-11-045 then refuses an `Accept` of the earlier one,
      naming the fresh one.
    verification: >-
      `test_reinvite_replaces_the_earlier_stub_on_the_same_record` and
      `test_in_reply_to_on_a_stub_invite_survives_parse_and_extraction` in
      `test/core/use_cases/triggers/test_stub_invite_lifetime.py` confirm the
      re-invite names the earlier stub in `inReplyTo`.
    relationships:
    - rel_type: extends
      spec_id: CM-11-015
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-043
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse, before committing any ledger entry, every
      stub Invite to a participant that has joined or is at `RM.CLOSED`.
    rationale: >-
      One actor has one participant record per case. `RM.CLOSED` is terminal
      with no rejoin path, and a stub reject is a closure (CM-11-007). The refusal
      comes before the commit, so a refused Invite leaves no ledger entry
      (ADR-0085).
    verification: >-
      `test_reinvite_to_closed_participant_is_refused` in
      `test/core/use_cases/triggers/test_case_joining_trigger.py` confirms a
      re-invite to a participant at `RM.CLOSED` is refused;
      `test_second_accept_after_join_is_refused_and_commits_nothing` and
      `test_accept_for_a_closed_invitee_is_refused_and_commits_nothing` in
      `test/core/use_cases/received/actor/test_offer_case_participant.py` confirm
      the Case Owner's `Accept(Offer(CaseParticipant))` naming a participant that
      has joined or is at `RM.CLOSED` is refused with no ledger entry committed.
    relationships:
    - rel_type: extends
      spec_id: CM-11-015
    adr:
    - ADR-0114
    - ADR-0085
    stories:
    - story_2022_052
  - id: CM-11-016
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a stub Invite still outstanding when the active embargo is
      activated, revised or terminated. The CASE_MANAGER MUST re-issue that stub
      Invite on the same participant record, with the embargo terms that now apply and
      a new deadline.
    rationale: >-
      Accepting a stub consents to the terms it carried. Accepting stale terms
      would make the participant join already lapsed, or join without
      consent, and need a second answer at once.
    note: >-
      A revision proposal does not change the active embargo, so it re-issues no
      stub. An invitee with an outstanding stub receives the relayed embargo
      Invite like any non-closed participant (EP-09-002); answering it records
      consent to the proposed terms and does not join the case, which only an
      `Accept` of the stub does. If the revision is activated, this requirement
      re-issues the stub.
    verification: >-
      `test_embargo_change_reissues_outstanding_stub_invite` in
      `test/core/use_cases/triggers/test_case_joining_trigger.py` and
      `test_a_replacement_carries_a_new_deadline_and_current_terms_and_roles` in
      `test/core/use_cases/triggers/test_stub_invite_lifetime.py` change the active
      embargo while a stub Invite is outstanding and find a replacement stub Invite
      with the current terms and a new deadline.
    adr:
    - ADR-0114
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-11-044
    priority: MUST
    kind: protocol
    statement: >-
      A replacement stub Invite MUST name the Invite it supersedes by setting its
      `inReplyTo` to that Invite's id.
    rationale: >-
      Naming the superseded Invite tells the invitee the old one is dead in
      whichever order the two arrive. A retraction (`Undo`) was considered and
      rejected (ADR-0114).
    verification: >-
      `test_a_replacement_carries_a_new_deadline_and_current_terms_and_roles` and
      `test_in_reply_to_on_a_stub_invite_survives_parse_and_extraction` in
      `test/core/use_cases/triggers/test_stub_invite_lifetime.py` find the
      replacement naming the superseded Invite.
    relationships:
    - rel_type: extends
      spec_id: CM-11-016
    adr:
    - ADR-0114
    stories:
    - story_2022_014
  - id: CM-11-045
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an `Accept` of a superseded stub Invite,
      naming the replacement in the refusal.
    rationale: >-
      An `Accept` of a superseded Invite consents to terms that are no longer in
      force. Naming the replacement tells the invitee which Invite it can accept.
    verification: >-
      `test_accept_of_a_superseded_stub_names_the_replacement_and_it_can_be_accepted`
      in `test/core/use_cases/triggers/test_stub_invite_lifetime.py` finds an
      `Accept` of the superseded Invite refused with the replacement named.
    relationships:
    - rel_type: extends
      spec_id: CM-11-016
    adr:
    - ADR-0114
    stories:
    - story_2022_014
  - id: CM-11-046
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST honour a `Reject` of a superseded stub Invite.
    rationale: >-
      Declining to join does not depend on the terms, so a `Reject` of any version of
      the ask is a hard no.
    verification: >-
      `test_reject_of_superseded_stub_invite_is_honoured` in
      `test/core/use_cases/triggers/test_case_joining_trigger.py` finds a `Reject`
      of a superseded stub Invite honoured.
    relationships:
    - rel_type: extends
      spec_id: CM-11-016
    adr:
    - ADR-0114
    stories:
    - story_2022_014
  - id: CM-11-017
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a stub-Invite reply, and create or change no
      participant, unless the sender is the invitee its own recorded stub Invite
      names.
    rationale: >-
      If the CASE_MANAGER trusts an Accept by itself, any actor can admit itself or a
      third party. That actor then receives the case and its full ledger. The
      recorded stub Invite is the CASE_MANAGER's own record of whom it invited
      (CM-11-006). Thus, it is the only source against which the CASE_MANAGER can
      check a reply (HP-01-006, ADR-0115).
    verification: >-
      A test marked `CM-11-017`
      sends an Accept of a stub Invite the CASE_MANAGER never sent and asserts `REFUSED`
      with no participant created.
    stories:
    - story_2022_035
    - story_2022_054
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-11-001
    adr:
    - ADR-0115
  - id: CM-11-047
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST take a stub invitee's roles from the stub Invite it
      recorded, never from the copy of the Invite embedded in the reply.
    rationale: >-
      The embedded copy is the sender's claim. If the CASE_MANAGER read the roles
      from it, an invitee could give itself any role by editing its copy. The
      recorded Invite holds the roles the CASE_MANAGER chose (CM-11-006, ADR-0115).
    verification: >-
      `test_accept_of_invite_takes_roles_from_recorded_invite` in
      `test/core/use_cases/received/test_sender_entitlement.py` sends an Accept
      whose embedded Invite carries a forged role and finds the participant
      holding the recorded roles.
    relationships:
    - rel_type: extends
      spec_id: CM-11-017
    adr:
    - ADR-0115
    stories:
    - story_2022_035
  - id: CM-11-018
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives
      `Reject(Invite(Actor)[target=VulnerabilityCaseStub])`
      for an invitee with no participant record, it MUST refuse it with a
      reported reason, not as a silent no-op.
    rationale: >-
      The participant record created at invite-send time (CM-11-006) is the
      evidence that the CASE_MANAGER sent the stub Invite. A Reject with no
      matching record is either a protocol violation (the CASE_MANAGER never
      sent the Invite) or a replay of a Reject already processed to
      RM.CLOSED; both cases are erroneous and must be reported, not silently
      accepted. Accepting them would hide inconsistencies in the CASE_MANAGER's
      own audit trail.
    verification: >-
      A test marked `CM-11-018` delivers a Reject to the CASE_MANAGER when no
      inert participant record for the invitee exists, and asserts
      `REFUSED` with a reason naming the missing participant record.
    stories:
    - story_2022_052
    relationships:
    - rel_type: refines
      spec_id: CM-11-007
    adr:
    - ADR-0114
  - id: CM-11-021
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives
      `Accept(Invite(Actor)[target=VulnerabilityCaseStub])` and holds no participant
      record for the invitee,
      it MUST refuse the Accept with a reported reason.
    rationale: >-
      The CASE_MANAGER creates the participant record when it sends the stub Invite
      (CM-11-006). That record is the evidence that the CASE_MANAGER sent the Invite.
      CM-11-017 ties every reply to a recorded Invite. If an Accept rebuilt a missing
      record, it would admit an actor whose Invite the CASE_MANAGER's roster does not
      show, and it would skip that check. This rule is the Accept counterpart of
      CM-11-018.
    verification: >-
      A test marked `CM-11-021` delivers an Accept of a recorded stub Invite to
      the CASE_MANAGER when no participant record for the invitee exists, and
      asserts `REFUSED` with a reason naming the missing participant record.
    stories:
    - story_2022_052
    relationships:
    - rel_type: refines
      spec_id: CM-11-017
    - rel_type: refines
      spec_id: CM-11-001
    adr:
    - ADR-0114
  - id: CM-11-052
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT create a participant record, commit a ledger
      entry or send any activity for a stub-Invite Accept it refuses under
      CM-11-021.
    rationale: >-
      An Accept never creates a participant: the record exists from the stub Invite
      (CM-11-006). A refused Accept that still wrote a record, an entry or a message
      would admit the actor in part.
    verification: >-
      `test_accept_invite_refused_when_no_participant_record` in
      `test/core/use_cases/received/actor/test_invite.py` asserts no participant
      created, no ledger entry committed and nothing queued;
      `test_accept_with_no_participant_record_is_refused_before_any_write` in
      `test/core/behaviors/case/test_accept_invite_tree.py` asserts the refusal
      comes before any write.
    relationships:
    - rel_type: extends
      spec_id: CM-11-021
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-019
    priority: MUST
    kind: protocol
    statement: >-
      A stub Invite MUST carry at least one CVD role for the invitee.
    rationale: >-
      A participant with no roles cannot be routed to the right recipients or
      granted the right access.
    verification: >-
      A test marked `CM-11-019` asks the CASE_MANAGER to emit a stub Invite
      with no roles and asserts a refusal, with no participant record created
      and no Invite emitted.
    stories:
    - story_2022_052
    relationships:
    - rel_type: refines
      spec_id: CM-11-006
    adr:
    - ADR-0114
  - id: CM-11-048
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse to emit a stub Invite with an empty role
      list.
    rationale: >-
      Refusing at send time catches missing roles before the Invite is delivered,
      keeping the error close to its source.
    verification: >-
      `test_no_roles_requested_is_refused` and
      `test_no_roles_is_refused_not_defaulted` in
      `test/core/use_cases/triggers/test_actor_triggers.py` ask the CASE_MANAGER to
      emit a stub Invite with no roles and assert a refusal with no Invite emitted.
    relationships:
    - rel_type: implements
      spec_id: CM-11-019
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-049
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT create a participant record with an empty
      `case_roles` list.
    rationale: >-
      A participant record with no roles could not be routed or granted access.
      Refusing the record keeps every participant in the roster routable.
    verification: >-
      `test_no_roles_fails_and_writes_nothing` in
      `test/core/behaviors/case/nodes/test_invite_inert_participant.py` and
      `test_no_roles_invite_refused_not_applied` in
      `test/core/use_cases/received/actor/test_invite.py` find no participant
      record created when the roles are empty.
    relationships:
    - rel_type: extends
      spec_id: CM-11-019
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-050
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When an inviter, the Case Owner included, names no roles for a stub
      Invite, the CASE_MANAGER MUST NOT substitute a default role such as VENDOR.
    rationale: >-
      Defaulting to VENDOR would silently assign a role the inviter never requested,
      violating the inviter's intent. In the Case Owner's own stub Invite the owner
      names the roles, so no role is guessed.
    note: >-
      The default role list for a suggested actor is a separate flow (CM-16-003).
    verification: >-
      `test_validated_invitee_roles_never_defaults` and
      `test_require_explicit_roles_fails_when_no_roles_given` in
      `test/core/behaviors/case/test_suggest_actor_tree.py` find no VENDOR default
      when no roles are given.
    relationships:
    - rel_type: extends
      spec_id: CM-11-019
    adr:
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-11-020
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant that joined a case through an Invite MUST NOT send `Accept`,
      `TentativeReject` or `Reject` of the original `Offer(VulnerabilityReport)`.
    rationale: >-
      A reply must answer a message sent to the replier. A joined participant
      was never offered that report.
    verification: A test confirms a joined participant's triage emits no
      activity whose object is the original `Offer(VulnerabilityReport)`.
    adr:
    - ADR-0121
  - id: CM-11-051
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant that joined a case through an Invite MUST NOT validate,
      invalidate or reject the case's report. It judges the case by replying to
      the full-case Invite (CM-11-011).
    rationale: >-
      A joined participant — a late joiner especially — judges the case as it
      stands, with its history, not the original submission, which may have been
      far sparser (ADR-0121).
    verification: >-
      `test_actor_not_sent_the_offer_is_refused_with_a_reason` in
      `test/core/use_cases/triggers/test_report_triggers.py` refuses a report
      triage by an actor that was never sent the report's Offer.
    relationships:
    - rel_type: extends
      spec_id: CM-11-020
    adr:
    - ADR-0121
- id: CM-12
  title: Case Creation Timing
  specs:
  - id: CM-12-001
    priority: MUST
    kind: project
    statement: >-
      When a report receiver's `auto_create_case` is `True` (CM-15-001), it MUST propose
      a case to the CASE_MANAGER for each `Offer(VulnerabilityReport)` it receives
      (CP-04-001). The CASE_MANAGER, not the receiver, creates the `VulnerabilityCase`
      (CM-22-001).
    rationale: >-
      The vendor that receives a report is the first party that must act on it. When it
      proposes the case at receipt, the report has a case, and its participants have an
      RM state, from `RM.RECEIVED` onward. The receiver does not create the case itself,
      because the CASE_MANAGER is the case's authoritative creator (ADR-0041). With
      `auto_create_case` set to `False`, no case starts (CM-15-003).
    verification: >-
      Integration tests in `test/demo/` confirm that receiving an
      `Offer(VulnerabilityReport)` activity causes a `VulnerabilityCase` to be
      created, and
      `test/core/behaviors/case/test_receive_report_case_tree.py` confirms the
      receiver's tree proposes the case instead of creating it.
    note: >-
      Restated for #5358. The statement used to say, unconditionally, that the vendor
      creates the case. CM-15-003 and CM-22-001 already refused that, so the statement
      now carries both conditions.
    stories:
    - story_2022_012
    - story_2022_038
  - id: CM-12-002
    priority: MUST
    kind: protocol
    statement: At case creation, the system MUST create two initial `CaseParticipant` records in the order defined by CM-14-001
    rationale: >-
      At receipt, the case knows two parties: the Case Owner and the reporter. Each
      party needs its own RM state (CM-01-002). Thus each party needs a record before
      the case records anything else about it. The CM-14-001 order makes sure that an
      existing participant creates the embargo, and that the reporter has the case
      before any entry about the case arrives.
    verification: Integration tests in `test/demo/` confirm that case creation produces exactly
      two initial `CaseParticipant` records ordered as defined by CM-14-001.
    relationships:
    - rel_type: depends_on
      spec_id: CM-03-001
    - rel_type: depends_on
      spec_id: CM-02-008
    - rel_type: part_of
      spec_id: CM-14-001
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-12-003
    priority: MUST
    kind: protocol
    statement: >-
      When a case is created from an `Offer(VulnerabilityReport)`, the Case Owner (the
      report receiver) MUST queue a `Create(VulnerabilityCase)` activity to notify the
      reporter that a case has been opened, naming the CASE_MANAGER it delegated to
      (CBT-01-001)
    rationale: >-
      The reporter must learn that its report became a case, and which actor coordinates
      the case. The reporter does not know the CASE_MANAGER. It trusts only the actor
      that it reported to. Thus the report receiver introduces the CASE_MANAGER to the
      reporter (CBT-01-001, ADR-0132).
    adr:
    - ADR-0132
    verification: >-
      Integration tests in `test/demo/` confirm that a `Create(VulnerabilityCase)`
      activity is queued for the reporter when a case is created from an
      `Offer(VulnerabilityReport)`.
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    stories:
    - story_2022_012
    - story_2022_081
  - id: CM-12-004
    priority: MUST
    kind: protocol
    statement: A default embargo MUST be initialized at case creation (RM.RECEIVED) following the
      sequence in CM-14-001 whenever the case is embargo-eligible — from the receiver's actor
      default where one is configured, and otherwise from the protocol default of EP-04-005
    rationale: >-
      If a case has no embargo, the reporter's information has no protection when
      another party joins. The receiver initializes the default embargo at
      `RM.RECEIVED`, before it adds any other participant. Thus every later participant
      joins under the embargo (CM-14-010). The protocol default makes sure that a
      receiver with no configured policy also gets an embargo with a limit (EP-04-019,
      ADR-0096).
    note: >-
      Amended by ADR-0096. The condition was previously "if a default embargo policy is
      configured", which left no embargo at all when none was. EP-04-019 now
      supplies a bounded protocol default for that case, so the only condition on
      initialization is
      embargo-eligibility (EP-04-008).
    verification: Integration tests in `test/demo/` confirm that a default embargo is initialized
      during case creation at RM.RECEIVED both when an actor default embargo policy is configured
      and when none is, and that no embargo is initialized when the case is not embargo-eligible.
    relationships:
    - rel_type: refines
      spec_id: DUR-07-002
      note: which now applies at case receipt
    - rel_type: part_of
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-12-005
    priority: MUST
    kind: project
    statement: '`InvalidateReportReceivedUseCase`, `CloseReportReceivedUseCase`, and `ValidateReportReceivedUseCase` MUST
      dereference the incoming report ID to the associated case ID before delegating to the corresponding case-level use case'
    rationale: >-
      The report-level messages name the report. But each participant's RM state that
      these messages change is on the case. When the use case resolves the report to its
      case first, one case-level use case applies the change. Thus the report-level path
      and the case-level path cannot become different.
    verification: Inspection of `vultron/core/` confirms that `InvalidateReportReceivedUseCase`,
      `CloseReportReceivedUseCase`, and `ValidateReportReceivedUseCase` each resolve the report
      ID to its associated case ID before delegating.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
- id: CM-13
  title: Embargo Acceptance Ownership
  specs:
  - id: CM-13-005
    priority: MUST
    kind: protocol
    statement: >-
      A repeated embargo answer is a second `Accept`, or a second `Reject`, of one
      embargo invitation by the same participant, whatever its activity id. The receiver
      of a repeated answer MUST change no state, add no ledger entry and send no message
      because of it. Answers from different participants are separate consents.
    rationale: >-
      Delivery is at least once. A participant can send the same answer again under a
      new activity id. If a repeat counted, the receiver would add a ledger entry and a
      fan-out for a consent that did not change. Every replica would then record an
      answer that was not a new decision. Each participant gives consent for itself.
      Thus the answer of one participant is never a repeat of the answer of a different
      participant.
    verification: >-
      `test_a_redelivered_embargo_answer_has_no_effect` in
      `test/core/use_cases/received/test_embargo_propose_accept_reject.py` delivers an
      answered `Accept` or `Reject` of an embargo Invite to the CASE_MANAGER a second time,
      with the same activity id, and confirms the redelivery leaves the case, the sender's
      participant record, the ledger and the outbox unchanged. In
      `test/core/use_cases/received/test_embargo_answer_idempotency.py`,
      `test_a_repeat_answer_under_a_new_id_changes_nothing` confirms the same for a repeat
      under a new activity id (no entry, no Announce, no state change), and
      `test_another_participants_answer_is_still_its_own_consent` confirms that a different
      participant's answer is still recorded as its own consent.
    lint_suppress:
    - missing_story_reference
  - id: CM-13-009
    priority: MUST
    kind: project
    statement: >-
      The embargo accept and reject use cases MUST succeed silently when the participant's
      consent row for the embargo is already `AGREED` (for accept) or `DECLINED` (for
      reject), without re-running state machine transitions or emitting invalid-transition
      warnings.
    rationale: >-
      How this codebase meets CM-13-005; split from it so CM-13-005 states only what other
      participants observe (MS-12-010).
    verification: >-
      `test_a_fresh_repeat_of_an_embargo_answer_changes_no_consent` in
      `test/core/use_cases/received/test_embargo_propose_accept_reject.py` confirms that a
      new `Accept` or `Reject` from a participant whose row is already `AGREED` or
      `DECLINED` leaves the case and the row unchanged, and
      `test_accept_embargo_invite_idempotent` in
      `test/core/services/embargo_lifecycle/test_answers.py` confirms that a second accept
      of an `AGREED` row reports no participant or case change.
    relationships:
    - rel_type: implements
      spec_id: CM-13-005
  - id: CM-13-006
    priority: MUST
    kind: project
    statement: When a case is created with a default embargo that reaches `EM.ACTIVE` at
      creation time, the Case Owner MUST be initialized as a signatory in the same BT
      node or an immediately following sibling node in the same BT subtree
    rationale: The case creator is the Case Owner by default; seeding them as a
      signatory prevents the Case Owner from being locked out of their own active
      embargo until a separate accept step occurs. The consent state must be set via the
      PEC state machine (not by direct field assignment) to preserve state machine
      invariants.
    verification: Integration tests in `test/demo/` confirm that when a case is created
      with a default embargo, the Case Owner's consent row for it is marked `AGREED` in
      the same BT subtree that activates the embargo.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-004
  - id: CM-13-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST treat a received `Add(Note)` as an idempotent redelivery only
      when the case's ledger already records that same `Add`. A note stored in the
      DataLayer under that id refuses a new `Add` instead (HP-08-006).
    rationale: >-
      A note stored under an id does not show that this `Add` attached the note to this
      case. The note can belong to a different case, or to a different `Add`. If the
      receiver used the stored note as the idempotency test, an `Add` that names the
      note of a different case would pass as a redelivery. The ledger shows that this
      case already took this `Add`.
    relationships:
    - rel_type: depends_on
      spec_id: HP-08-006
    verification: >-
      `test/core/use_cases/received/test_note.py::TestNoteUseCases::test_redelivered_add_note_is_skipped`
      and `::test_new_add_naming_an_attached_note_is_refused` confirm a redelivery
      of the ledgered `Add` is `SKIPPED` while a different `Add` naming the stored
      note is refused.
  - id: CM-13-010
    priority: MUST
    kind: project
    statement: >-
      The note attach step MUST test whether the note's `id_` is present in
      `VulnerabilityCase.notes`, never whether the note is stored in the DataLayer.
    rationale: >-
      A note stored under an id can belong to a different case. The case's own `notes`
      list shows that this case already holds the note.
    relationships:
    - rel_type: extends
      spec_id: CM-13-007
    verification: >-
      `test/core/behaviors/note/nodes/test_storage.py` confirms the attach step tests
      `note.id_` in `VulnerabilityCase.notes`.
- id: CM-14
  title: Case Initialization Sequence
  description: >-
    Defines the canonical ordered sequence of initialization steps that MUST occur
    when a VulnerabilityCase is created at Offer(VulnerabilityReport) receipt
    (CM-12-001). All steps MUST complete before the case is considered fully
    initialized.
  specs:
  - id: CM-14-001
    priority: MUST
    kind: protocol
    statement: >-
      The case initialization sequence MUST execute exactly 6 ordered steps
      (CM-14-008 through CM-14-013) before the case is considered fully initialized.
      No step may be omitted or reordered.
    rationale: >-
      Step CM-14-009 precedes CM-14-010 so that the embargo is always created by a
      participant (the Case Owner). The Create(VulnerabilityCase) notification in
      CM-14-011 is flushed before the reporter is added in CM-14-012 so the reporter's
      system receives the case object before any subsequent Announce(CaseLedgerEntry)
      fan-out that references it.
    verification: Integration tests in `test/demo/` confirm that the case initialization
      sequence completes exactly 6 ordered steps (CM-14-008 through CM-14-013) and that no step
      is skipped or reordered.
    note: >-
      Superseded by CM-22 (ADR-0041) for multi-actor deployments: in the
      CASE_MANAGER-authoritative model the `VulnerabilityCase` is created by the
      CASE_MANAGER rather than the receiving actor; the receiving actor remains
      the case's `attributed_to` (CM-14-008, CP-09-001).  CM-14-001 applies only in
      single-actor deployments where the receiving actor IS the CASE_MANAGER.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
    stories:
    - story_2022_012
    - story_2022_046
  - id: CM-14-002
    priority: MUST
    kind: protocol
    statement: The Case Owner's `CaseParticipant` MUST be created before the default
      embargo is initialized, so that the embargo is always associated with an existing
      participant
    rationale: An embargo without any participant lacks an owning actor. Creating the owner participant first ensures that
      the embargo is initialized in the context of an actor who can be responsible for it.
    verification: Inspection of `vultron/core/` confirms that the Case Owner's
      `CaseParticipant` creation step precedes the default embargo initialization step in the
      initialization sequence.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    stories:
    - story_2022_046
    - story_2022_014
  - id: CM-14-003
    priority: MUST
    kind: protocol
    statement: When the case initialization sequence creates a default embargo, the Case
      Owner MUST be seeded as a signatory on that embargo immediately after the embargo
      reaches `EM.ACTIVE` state
    rationale: The Case Owner initiated the embargo by accepting the default policy on
      behalf of the case. Requiring a separate accept step would leave the Case Owner as
      a non-signatory on their own active embargo.
    verification: Integration tests in `test/demo/` confirm that the Case Owner is
      seeded as a signatory on the default embargo immediately after it reaches
      `EM.ACTIVE` during case initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: refines
      spec_id: CM-13-006
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-14-004
    priority: MUST
    kind: protocol
    statement: >-
      The `Create(VulnerabilityCase)` notification MUST be queued and the outbox
      flushed before the reporter is added as a `CaseParticipant` in step 5 of
      CM-14-001
    rationale: The reporter's system must receive and store the case object before any Announce(CaseLedgerEntry) fan-out that
      lists them as a participant. Reversing this order causes "case not found" errors on the reporter side when the log entry
      arrives referencing a case the reporter has not yet seen.
    verification: Integration tests in `test/demo/` confirm that the
      `Create(VulnerabilityCase)` outbox flush occurs before the reporter
      `CaseParticipant` record is created during case initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-003
    stories:
    - story_2022_012
    - story_2022_081
  - id: CM-14-005
    priority: MUST
    kind: protocol
    statement: When the reporter is added as a `CaseParticipant` during case initialization, they MUST be seeded as a signatory
      on any active embargo
    rationale: 'The reporter already possesses the vulnerability information before the case is created. Requiring an explicit
      embargo acceptance before sharing case content would create a paradoxical deadlock: the reporter has the information
      that the embargo is meant to protect, yet cannot receive case updates until they accept the embargo. Seeding them as
      signatory reflects their implicit consent, expressed by submitting the report.'
    verification: Integration tests in `test/demo/` confirm that the reporter is seeded as
      a signatory on any active embargo when added as a `CaseParticipant` during case
      initialization.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    stories:
    - story_2022_013
    - story_2022_023
  - id: CM-14-006
    priority: SHOULD
    kind: protocol
    statement: >-
      If the reporter included an embargo proposal with their
      `Offer(VulnerabilityReport)`, the case initialization SHOULD reconcile the
      reporter's proposed duration against the CASE_OWNER's published embargo policy
      (its actor default, EP-04-003) and initialize the embargo at the shorter of the
      two durations
    rationale: >-
      An agreement to an embargo of N days is also an agreement to every shorter
      embargo. Thus the shorter of the two terms is the term that both the reporter and
      the Case Owner accepted (EP-04-003). The longer term would bind a party to terms
      that it did not offer.
    note: >-
      EP-04-004 now specifies the mechanism: the reporter embeds a proposed `EmbargoEvent` in the
      `Offer(VulnerabilityReport)` activity. This requirement is therefore reachable, and the
      reconciliation it describes is the shortest-wins comparison of EP-04-003. Note that the
      protocol default of EP-04-005 is not a candidate in that comparison (EP-04-006). Amended by
      ADR-0096; see `notes/embargo-default-semantics.md` § "Reporter Embargo Proposal
      Mechanism (EP-04-004)".
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-004
    - rel_type: depends_on
      spec_id: EP-04-004
    adr:
    - ADR-0096
  - id: CM-14-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT invite an additional participant to a case until the case's
      initialization sequence (CM-14-001), with any applicable conditional steps, is
      complete.
    rationale: >-
      The initialization sequence establishes the minimum valid case state: a case
      object, an owner, an optional embargo and a reporter. An Invite to a third party
      before this baseline is in place causes race conditions and protocol violations.
    verification: >-
      `test_each_creation_entry_that_fails_leaves_nothing_of_the_case` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts that a
      case whose initialization fails leaves no record behind, and
      `test_missing_case_fails` in
      `test/core/behaviors/case/nodes/test_invite_inert_participant.py` asserts that
      the stub-Invite seating fails and records no invitee when the case is absent.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    stories:
    - story_2022_052
    - story_2022_014
  - id: CM-14-014
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT initiate an embargo modification on a case until the case's
      initialization sequence (CM-14-001), with any applicable conditional steps, is
      complete.
    rationale: >-
      The initialization sequence establishes the embargo that later changes modify. A
      modification before this baseline is in place causes race conditions and
      protocol violations.
    verification: >-
      Integration tests in `test/demo/` confirm that no embargo modification is emitted
      until all 6 initialization steps have completed.
    relationships:
    - rel_type: extends
      spec_id: CM-14-007
    - rel_type: depends_on
      spec_id: CM-14-001
    stories:
    - story_2022_014
  - id: CM-14-008
    priority: MUST
    kind: protocol
    statement: >-
      Step 1 of the case initialization sequence MUST create the `VulnerabilityCase`
      with the receiving actor set as `attributed_to`.
    rationale: Creating the case object first establishes the anchor to which all subsequent
      initialization steps (participants, embargo, ledger) are attached.
    verification: Integration tests in `test/demo/` confirm that step 1 of case initialization
      creates the `VulnerabilityCase` with `attributed_to` set to the receiving actor.
    stories:
    - story_2022_012
  - id: CM-14-009
    priority: MUST
    kind: protocol
    statement: >-
      Step 2 of the case initialization sequence MUST create the Case Owner's
      `CaseParticipant` with `RM.RECEIVED` and the `CASE_OWNER` role.
    rationale: The Case Owner's participant must exist before the default embargo can be
      initialized, so that the embargo is always associated with an existing participant.
    verification: Integration tests in `test/demo/` confirm that step 2 creates the Case
      Owner's `CaseParticipant` with `RM.RECEIVED` and `CVDRole.CASE_OWNER`.
    stories:
    - story_2022_046
  - id: CM-14-010
    priority: MUST
    kind: protocol
    statement: >-
      Step 3 of the case initialization sequence MUST initialize the default embargo to
      `EM.ACTIVE` and seed the Case Owner as a signatory whenever the case is embargo-eligible,
      using the actor default where one is configured and the EP-04-005 protocol default
      otherwise.
    rationale: The embargo must be in place before any participant other than the Case
      Owner is added, so that all subsequent participants are subject to the embargo
      from the moment they join.
    note: >-
      Amended by ADR-0096. The step was previously conditional on a configured default embargo
      policy; EP-04-019 now supplies a bounded protocol default when none is
      configured, so the only condition is embargo-eligibility (EP-04-008).
    verification: Integration tests in `test/demo/` confirm that step 3 sets the default
      embargo to `EM.ACTIVE` and seeds the Case Owner as a signatory both when an actor
      default policy is configured and when none is, and that it is skipped when the
      case is not embargo-eligible.
    relationships:
    - rel_type: depends_on
      spec_id: EP-04-005
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-14-011
    priority: MUST
    kind: protocol
    statement: >-
      Step 4 of the case initialization sequence MUST queue a
      `Create(VulnerabilityCase)` activity addressed to the reporter and flush the
      outbox.
    rationale: The reporter's system must receive and store the case object before any
      Announce(CaseLedgerEntry) fan-out that references it.
    adr:
    - ADR-0119
    verification: Integration tests in `test/demo/` confirm that step 4 queues
      `Create(VulnerabilityCase)` addressed to the reporter and flushes the outbox.
    stories:
    - story_2022_012
    - story_2022_038
  - id: CM-14-012
    priority: MUST
    kind: protocol
    statement: >-
      Step 5 of the case initialization sequence MUST add the reporter as a
      `CaseParticipant` with `RM.ACCEPTED` and the `REPORTER` role, and seed them as a
      signatory on any active embargo.
    rationale: The reporter is added after the Create(VulnerabilityCase) notification is
      flushed (CM-14-011) so that the case object exists on the reporter's system
      before the fan-out of the ledger entry that records their participation.
    verification: Integration tests in `test/demo/` confirm that step 5 adds the reporter as a
      `CaseParticipant` with `RM.ACCEPTED` and seeds them as a signatory (an `AGREED` row)
      on any active embargo.
    stories:
    - story_2022_013
    - story_2022_063
  - id: CM-14-013
    priority: MUST
    kind: protocol
    statement: >-
      Step 6 of the case initialization sequence MUST commit a case ledger entry,
      triggering `Announce(CaseLedgerEntry)` fan-out to all participants.
    rationale: The ledger entry commits the completed initialization as a single
      protocol-significant event and notifies all participants atomically.
    verification: Integration tests in `test/demo/` confirm that step 6 commits a case ledger
      entry that triggers `Announce(CaseLedgerEntry)` fan-out to all participants.
    stories:
    - story_2022_045
    - story_2022_041
- id: CM-15
  title: Case Creation Policy
  description: >-
    Requirements for the configurable auto_create_case policy on ActorConfig, which
    controls whether a VulnerabilityCase is created automatically upon receipt of an
    Offer(VulnerabilityReport).
  specs:
  - id: CM-15-001
    priority: MUST
    kind: project
    statement: 'ActorConfig MUST expose an `auto_create_case` boolean field with a default value of `True`.'
    rationale: >-
      Receivers that acknowledge a report (send Read(Offer(VulnerabilityReport)),
      VAM-02-003) before deciding to accept or reject it require the ability to delay
      case creation. The default (True) starts a case at every
      `Offer(VulnerabilityReport)` receipt (RM.RECEIVED) for all existing actors and
      demos; the receiver proposes it and the CASE_MANAGER creates it (CM-12-001,
      CM-22-001).
    verification: Inspection of `vultron/core/` confirms that `ActorConfig` declares an
      `auto_create_case` boolean field defaulting to `True`.
    relationships:
    - rel_type: refines
      spec_id: CM-12-001
    adr:
    - ADR-0015
    - ADR-0041
  - id: CM-15-002
    priority: MUST
    kind: project
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(VulnerabilityReport)` MUST store the `VulnerabilityReport` and the
      `Offer(VulnerabilityReport)` activity in the DataLayer.
    rationale: The report materials must be persisted even when case creation is suppressed
      so that they can be retrieved if the operator later enables case creation or reviews
      the offer manually.
    verification: Integration tests in `test/demo/` confirm that when `auto_create_case` is
      `False`, processing an `Offer(VulnerabilityReport)` persists the report and offer
      in the DataLayer without creating a `VulnerabilityCase`.
  - id: CM-15-003
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/core/behaviors/case/test_receive_report_case_tree.py::TestPolicyGate`
      confirms that with `auto_create_case=False` the receive tree returns FAILURE and
      writes no `VultronReportCaseLink`; inspection confirms no
      `Offer(VulnerabilityReport)` receive path creates a `VulnerabilityCase`.
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(VulnerabilityReport)` MUST NOT create a `VulnerabilityCase`.
    rationale: The purpose of the flag is to suppress automatic case creation; creating a
      case anyway would make the flag meaningless.
  - id: CM-15-004
    priority: MUST
    kind: project
    statement: >-
      When a receiver's `auto_create_case` is `False`, processing an inbound
      `Offer(VulnerabilityReport)` MUST leave the receiver's outbox unchanged (no
      outbound activities are enqueued).
    rationale: Suppressing case creation also suppresses the associated outbound activities
      (e.g., Create(VulnerabilityCase) to the reporter); the observable outcome is no
      outbound messages.
    verification: Integration tests in `test/demo/` confirm that when `auto_create_case` is
      `False`, processing an `Offer(VulnerabilityReport)` leaves the actor's outbox
      empty.
  - id: CM-15-005
    priority: MUST
    kind: project
    statement: >-
      The `auto_create_case` gate MUST be enforced as an in-tree condition node in
      `create_receive_report_case_tree`, after the intake node and ahead of any
      case-creating effect. A routing-level short-circuit in
      `SubmitReportReceivedUseCase` is not a conforming enforcement location, because
      it stores the report and the `Offer(VulnerabilityReport)` before any tree runs
      (CLP-10-019).
      The observable outcome (no case, no outbound activities; report and Offer
      stored per CM-15-002) remains normative.
    rationale: >-
      Case creation is protocol-significant behavior (BT-15-001). Thus the gate is a
      condition node in the behavior tree. A short-circuit in the use case must store
      the report and the Offer before it returns. That is a store path outside the tree,
      which CLP-10-019 forbids. The intake node stores the report and the Offer for
      every inbound `Offer(VulnerabilityReport)` (ADR-0111). Thus a gate outside the
      tree has nothing to do.
    verification: A received-side handler test posts an `Offer(VulnerabilityReport)`
      to a receiver with `auto_create_case=False`, asserts the disposition is
      SKIPPED, that no case and no outbound activity exist, and that the report and
      the Offer are readable from the receiver's DataLayer. The mutation ratchet
      `test/architecture/test_no_dl_mutations_in_execute.py` (CLP-10-020) fails if
      `SubmitReportReceivedUseCase.execute()` reaches a store helper.
    adr:
    - ADR-0111
  - id: CM-15-006
    priority: SHOULD
    kind: project
    statement: >-
      The `auto_create_case=True` default in `ActorConfig` is a reference
      implementation choice, not a Vultron protocol requirement. An implementation
      that sets `auto_create_case=False` creates the case in a later, separate
      step (for example `SvcCreateCaseUseCase` with the report's `report_id`);
      once that case is linked to the report, the implementation SHOULD close it
      through the `leave-case` trigger (the Case Owner's Leave(VulnerabilityCase),
      TRIG-13-001) when the operator or user requests closure, as with an
      auto-created case.
    rationale: >-
      The protocol does not say when to create a case. Thus `auto_create_case=True` is a
      choice of this reference implementation, and other implementations do not have to
      copy it (ADR-0085). When a case holds the report, its Case Owner closes the case
      with Leave, as for a case created automatically. No trigger sends
      `Reject(Offer(VulnerabilityReport))` for the case (CM-23-019, ADR-0145). With one
      closure path, a case created in a later step does not need a second path.
    verification: >-
      The `leave-case` tests in `test/core/use_cases/triggers/case/test_leave.py`
      assert the Case Owner's Leave is sent, the reject-report tests in
      `test/core/use_cases/triggers/test_trignotify.py` assert no
      `Reject(Offer(VulnerabilityReport))` is sent on a case, and the Leave tests in
      `test/core/use_cases/received/test_close_case_role_semantics.py` cover the
      closure path.
    adr:
    - ADR-0085
- id: CM-16
  title: Actor Suggestion Routing (Recommend-Actor Flow)
  specs:
  - id: CM-16-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant wishing to suggest that another actor be invited to the case MUST
      send `Offer(Actor)[target=VulnerabilityCase]` to the CASE_MANAGER's inbox, not
      directly to the Case Owner's inbox.
    rationale: All case-scoped protocol messages MUST route through the CASE_MANAGER so the event can be recorded in the canonical
      case ledger before any downstream action is taken (ADR-0021, PCR-08-001).
    verification: >-
      Integration tests in `test/demo/` confirm that an actor-suggestion
      `Offer(Actor)[target=VulnerabilityCase]` is sent to the CASE_MANAGER's inbox, not
      directly to the Case Owner.
    relationships:
    - rel_type: implements
      spec_id: PCR-08-001
    adr:
    - ADR-0021
    stories:
    - story_2022_053
    - story_2022_052
  - id: CM-16-002
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives `Offer(Actor)[target=VulnerabilityCase]`, it MUST
      commit
      a `CaseLedgerEntry` for the received Offer and fan out the entry to every active
      participant (CM-10-004) BEFORE taking any downstream action.
    rationale: Ledger entries record events that have already occurred; pre-committing a decision before communicating it
      is not permitted (CLP-10-006 commit ordering).
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER commits a
      `CaseLedgerEntry` and fans it out to participants before taking any downstream action on a
      received `Offer(Actor)`.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
    adr:
    - ADR-0114
    stories:
    - story_2022_045
    - story_2022_053
  - id: CM-16-003
    priority: MUST
    kind: project
    statement: >-
      After recording the received `Offer(Actor)`, the CASE_MANAGER MUST assign a non-empty
      default role list for the suggested actor via an Evaluator BT node (ADR-0024 shape:
      Evaluator). This applies to a suggested actor, where the CASE_MANAGER chooses the
      roles through its policy hook; the Case Owner's own stub Invite names its roles and
      guesses none (CM-11-019).
    rationale: >-
      A suggestion names only an actor. But the stub Invite must carry at least one role
      (CM-11-019). Thus the CASE_MANAGER must choose a role. The correct role is a
      policy decision. Thus the choice is an Evaluator call-out (ADR-0024) that a
      deployment can replace. The CASE_MANAGER writes only a list that is not empty.
      Thus no later node has to read an empty list as a signal.
    verification: Inspection of `vultron/core/` confirms that an Evaluator BT node assigns a
      non-empty default role list for a suggested actor before the downstream consumer node
      processes the offer.
    note: 'The Evaluator node is a call-out point (ADR-0025 abstraction; ADR-0024 shape: Evaluator) that MAY be replaced by
      a more sophisticated role-inference implementation in future. The non-empty invariant is enforced at write time so the
      downstream consumer never needs to treat an empty list as a sentinel. See CM-16-011 and CM-16-012 for the recommended
      and permitted default values.'
  - id: CM-16-011
    priority: SHOULD
    kind: project
    statement: The default role list SHOULD be `[CVDRole.VENDOR]` for actors whose type cannot be determined from context,
      because in CVD cases the most likely role for a newly added participant is Vendor.
    rationale: >-
      A default that fits most suggestions lets the Case Owner usually accept the
      default without a change. When the default does not fit, the Case Owner can change
      it when it accepts (CM-16-013).
  - id: CM-16-012
    priority: MAY
    kind: project
    statement: The default role list MAY be `[CVDRole.OBSERVER]` when the Evaluator can determine that the suggested actor
      does not fit any known CVD role but still requires case membership (e.g., a security researcher with no vendor
      affiliation). `CVDRole.OBSERVER` is the most conservative choice because it makes no assumption about the actor's
      function in the CVD process beyond case observation (CM-25-001).
    rationale: >-
      An actor that fits no CVD role must also see the case. `CVDRole.OBSERVER` lets the
      actor see the case without the obligations or the authority of a role such as
      VENDOR. Thus a wrong guess gives nothing that the Case Owner must then remove.
  - id: CM-16-013
    priority: MAY
    kind: project
    statement: The Evaluator's default role assignment MAY be overridden by actor-level configuration (e.g., a policy that
      maps known actor URIs to specific roles) or by the Case Owner at accept time when the Case Owner selects different roles
      for the suggested participant.
    rationale: The Case Owner has ultimate authority over who participates in their case and in what role. The Evaluator's
      output is a suggested starting point to reduce friction, not a binding decision. The Case Owner can always update role
      assignments to whatever they determine is appropriate.
  - id: CM-16-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST transform the received `Offer(Actor)` into
      `Offer(CaseParticipant)[target=VulnerabilityCase]`, whose `CaseParticipant` has
      `attributed_to` set to the actor and `case_roles` set to the roles, and send it to
      the Case Owner's inbox, with `origin` set to the ID of the original recommender's
      Offer activity.
    rationale: The Case Owner makes a membership decision about a CaseParticipant (actor + roles), not about a bare Actor
      identity. The `origin` field preserves the causal chain without a side-channel data store.
    verification: >-
      Integration tests in `test/demo/` confirm that the CASE_MANAGER sends a
      transformed `Offer(CaseParticipant)[target=VulnerabilityCase]` to the Case Owner
      with `origin` set to the recommender's Offer ID.
    stories:
    - story_2022_053
    - story_2022_046
  - id: CM-16-005
    priority: MAY
    kind: protocol
    statement: >-
      The recommender's `Offer(Actor)` MAY include a `content` or `summary`
      field that explains why it suggests the actor.
    rationale: >-
      The recommender often knows why the actor belongs in the case, for example
      that it maintains the affected code. A short reason gives the Case Owner that
      knowledge. The field is optional, because the actor's identity can be reason
      enough.
    stories:
    - story_2022_053
  - id: CM-16-020
    priority: SHOULD
    kind: protocol
    statement: >-
      The CASE_MANAGER SHOULD forward the reason text of a recommender's
      `Offer(Actor)` as the `content` of the transformed `Offer(CaseParticipant)`
      it sends to the Case Owner.
    rationale: >-
      The Case Owner decides about the recommendation. The recommender's reason is the
      main evidence that the Case Owner has. If the CASE_MANAGER removed that text when
      it transforms the Offer, the Case Owner would decide without it.
    verification: >-
      `test_offer_actor_to_case_forwards_the_recommenders_reason` in
      `test/core/use_cases/received/actor/test_suggest.py` is a strict expected
      failure until the forwarded Offer carries the recommender's reason.
    relationships:
    - rel_type: extends
      spec_id: CM-16-005
    stories:
    - story_2022_053
  - id: CM-16-006
    priority: MUST
    kind: protocol
    statement: >-
      After it receives `Accept(Offer(CaseParticipant))` from the Case Owner, the
      CASE_MANAGER MUST take four steps. (1) It commits a ledger entry for the
      Accept. (2) It fans out the ledger entry. (3) It sends the original
      recommender an `Accept` of its `Offer(Actor)[target=VulnerabilityCase]`, with
      `in_reply_to` set
      to that Offer's ID. (4) It sends the suggested actor the stub Invite
      (`Invite(Actor)[target=VulnerabilityCaseStub]`, CM-11-013) per CM-17.
    rationale: >-
      The ledger records the Case Owner's decision before any step acts on it
      (CLP-10-006). Thus every replica sees the cause before its effects. The
      recommender waits for an answer to its Offer, and `in_reply_to` tells it which
      suggestion the answer closes.
    verification: Integration tests in `test/demo/` confirm that after the Case Owner accepts a
      participant recommendation, the CASE_MANAGER commits a ledger entry, fans it out, sends
      `AcceptActorRecommendation`, and sends `Invite` to the suggested actor.
    relationships:
    - rel_type: implements
      spec_id: CM-17-001
    adr:
    - ADR-0114
    stories:
    - story_2022_054
    - story_2022_052
  - id: CM-16-021
    priority: MUST
    kind: protocol
    statement: >-
      When the suggested actor has joined or is at `RM.CLOSED`, the CASE_MANAGER
      MUST refuse the `Accept(Offer(CaseParticipant))` before committing or
      sending anything, with a reported reason.
    rationale: >-
      The CASE_MANAGER refuses an Accept for an actor that joined or is at
      `RM.CLOSED`. This keeps one participant record for each actor, and keeps
      `RM.CLOSED` terminal (CM-11-043). The refusal comes first, so nothing of the
      Accept is recorded or sent.
    verification: >-
      `test_second_accept_after_join_is_refused_and_commits_nothing` and
      `test_accept_for_a_closed_invitee_is_refused_and_commits_nothing` in
      `test/core/use_cases/received/actor/test_offer_case_participant.py` confirm
      that an Accept naming an actor that has joined, or is at `RM.CLOSED`, is
      refused with nothing committed or sent.
    relationships:
    - rel_type: extends
      spec_id: CM-16-006
    adr:
    - ADR-0114
    stories:
    - story_2022_054
  - id: CM-16-007
    priority: MUST
    kind: protocol
    statement: >-
      After receiving `Reject(Offer(CaseParticipant))` from the Case Owner, the
      CASE_MANAGER MUST (1) commit a ledger entry for the Reject, (2) fan out the ledger
      entry, and (3) send a `Reject` of the recommender's
      `Offer(Actor)[target=VulnerabilityCase]` to the
      original recommender with `in_reply_to` set to the ID of the original
      recommender's `Offer` activity.
    rationale: >-
      The ledger records the Case Owner's refusal. Thus every replica knows that the
      suggestion is closed. The recommender waits for an answer to its Offer. The
      `Reject` tells the recommender which of its suggestions the Case Owner declined.
      Without the answer, the recommender cannot tell a refusal from a decision that is
      not made yet.
    verification: Integration tests in `test/demo/` confirm that after the Case Owner rejects a
      participant recommendation, the CASE_MANAGER commits a ledger entry, fans it out, and sends
      `RejectActorRecommendation` to the recommender.
    stories:
    - story_2022_054
  - id: CM-16-008
    priority: MUST
    kind: protocol
    statement: >-
      When a second `Offer(Actor)[target=VulnerabilityCase]` for Actor X arrives while a
      pending decision for Actor X is still outstanding (no Accept or Reject yet
      received from the Case Owner), the CASE_MANAGER MUST record the duplicate
      recommendation in the ledger.
    rationale: >-
      A second suggestion for the same actor is a case event, so the ledger records it.
      The Case Owner can use it as evidence for the pending decision (CM-16-016). The
      CASE_MANAGER records it but does not forward a second Offer. This keeps one
      pending decision for each actor (CM-16-017).
    verification: >-
      Integration tests in `test/demo/` confirm that a duplicate
      `Offer(Actor)[target=VulnerabilityCase]` for Actor X arriving while a prior
      decision is pending is recorded in the case ledger.
    stories:
    - story_2022_053
    - story_2022_045
  - id: CM-16-009
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a second `Offer(Actor)[target=VulnerabilityCase]` for
      Actor X after an Invite went to X, so the Invite is in flight or X
      participates.
      The CASE_MANAGER MUST commit the recommendation's ledger entry, fan it out,
      and auto-send the second recommender an `Accept` of its Offer, with
      `in_reply_to` naming it.
    rationale: >-
      When the CASE_MANAGER has invited Actor X, the goal of the second recommender is
      complete. Thus the second recommender gets the answer that it would get after the
      Case Owner accepted.
    verification: Integration tests in `test/demo/` confirm that when Actor X is already invited
      or a participant, a second `Offer(Actor X)` is recorded and
      `AcceptActorRecommendation`
      is sent to the second recommender.
    stories:
    - story_2022_013
    - story_2022_053
  - id: CM-16-022
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When a second `Offer(Actor)[target=VulnerabilityCase]` for Actor X arrives after
      an Invite went to Actor
      X, the CASE_MANAGER MUST NOT send Actor X a duplicate Invite.
    rationale: >-
      A second Invite would create a second open stub for the same participant
      record, or the receiver would refuse it (CM-11-043). In both cases, nothing
      changes for X.
    verification: >-
      `test_the_in_flight_and_participant_arms_emit_no_invite` in
      `test/core/behaviors/case/test_suggest_actor_tree.py` asserts that the
      duplicate arms for an in-flight Invite or an existing participant hold no
      Invite emit.
    relationships:
    - rel_type: extends
      spec_id: CM-16-009
    stories:
    - story_2022_013
  - id: CM-16-010
    priority: MUST
    kind: protocol
    statement: In every step of the actor suggestion flow, the CASE_MANAGER MUST commit the ledger entry for a protocol event
      AFTER the corresponding message has been sent or received, never before.
    rationale: Pre-announcing a decision in the ledger before communicating the decision creates a window where the ledger
      shows an effect without its cause. A sent message is sent once it is in the CASE_MANAGER's outbox (SYNC-09-002).
    verification: >-
      `test/core/use_cases/received/actor/test_offer_case_participant.py::TestActorSuggestionFlowRecordsEachMessageAfterItIsSent`
      records the CASE_MANAGER's outbox writes and commits at each step — the
      forwarded `Offer(CaseParticipant)`, the Case Owner's `Accept` with the
      Invite and `AcceptActorRecommendation` it sends, and the owner's `Reject`
      with the `RejectActorRecommendation` — and asserts the received message is
      recorded first and each sent one is queued before its entry;
      `TestActorSuggestionAnswersAreSentOnceOnRetry` in the same file asserts a
      retry after a failed commit queues each answer once and records it once.
    adr:
    - ADR-0119
    stories:
    - story_2022_053
    - story_2022_045
  - id: CM-16-014
    priority: MUST
    kind: project
    statement: >-
      The Evaluator BT node assigned to default role list assignment MUST return `FAILURE`
      if it cannot produce a non-empty role list.
    rationale: A FAILURE return forces the enclosing BT subtree to handle the empty-list
      case explicitly rather than propagating an empty list to downstream consumers.
    verification: Inspection of `vultron/core/` confirms that the Evaluator BT node for default
      role assignment returns `FAILURE` when it cannot produce a non-empty role list.
  - id: CM-16-015
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      The downstream consumer node of the Evaluator BT node MUST NOT silently substitute a
      default for an empty list written by the Evaluator (ADR-0032 BT-HELPER-01).
    rationale: Silent substitution by the consumer hides Evaluator failures and produces
      participants with unexpected role assignments.
  - id: CM-16-016
    priority: MUST
    kind: protocol
    statement: >-
      When a second `Offer(Actor)[target=VulnerabilityCase]` for Actor X arrives while a
      pending decision for Actor X is still outstanding, the CASE_MANAGER MUST record a
      `Note` for the Case Owner indicating that a reinforcing suggestion was received,
      including the Case Owner's identity, the second recommender's identity and any
      `content` from the Offer. The note is the CASE_MANAGER's own `add_note_to_case`
      entry, attached to the case, and reaches the Case Owner's inbox as that entry's
      `Announce(CaseLedgerEntry)` (SYNC-02-002); a direct `Add(Note)` to the Case Owner
      is refused there (HP-01-005).
    rationale: >-
      A note about reinforcing suggestions gives the Case Owner more context for the
      pending decision, without a second offer workflow (CM-16-017). Participants send
      messages only to the CASE_MANAGER, and the Case Owner refuses a direct `Add(Note)`
      (HP-01-005). Thus the note goes as a ledger entry. Every active participant sees
      it, because the protocol has no private channel to the Case Owner.
    verification: >-
      `test/core/use_cases/received/test_case_manager_note_replay.py` sends two
      recommendations of one actor to the CASE_MANAGER and delivers what it queued to the
      Case Owner's replica: nothing is refused, one `Offer(CaseParticipant)` is sent, and
      the replica lists the note naming the second recommender.
      `test/core/behaviors/case/nodes/test_suggest_actor_owner_recipient.py` asserts the
      entry is announced to the Case Owner.

    stories:
    - story_2022_053
    - story_2022_046
  - id: CM-16-017
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      When a second `Offer(Actor)[target=VulnerabilityCase]` for Actor X arrives while a
      pending decision for Actor X is still outstanding, the CASE_MANAGER MUST NOT send
      a second transformed `Offer(CaseParticipant)` to the Case Owner.
    rationale: Sending a duplicate transformed Offer would create a second pending decision
      for the same actor, leading to conflicting state if the Case Owner responds to both.
  - id: CM-16-018
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER processes `Accept(Offer(CaseParticipant))` from the Case
      Owner, the roles assigned to the new participant MUST be read from the stored
      outgoing `Offer(CaseParticipant)` that the CASE_MANAGER constructed and sent —
      not from the embedded `CaseParticipant` object inside the received `Accept`.
    rationale: >-
      The received `Accept` is untrusted: the accepting actor may have modified or
      omitted roles, or sent only a bare ID reference. Reading roles from the
      received `Accept` would allow a malicious or minimally-conformant acceptor to
      substitute unauthorized roles. The stored `Offer` is the CASE_MANAGER's own
      record of the intended participant roles and is the authoritative source of
      truth.
    verification: >-
      Inspection of
      `vultron/core/use_cases/received/actor/offer_case_participant.py`
      (`AcceptOfferCaseParticipantReceivedUseCase.execute()`) confirms that roles
      are read from the DataLayer-stored Offer activity (`self._dl.read(offer_id)`),
      not from the embedded `CaseParticipant` in the received `Accept`.
    adr:
    - ADR-0026
    relationships:
    - rel_type: refines
      spec_id: CM-16-006
    stories:
    - story_2022_053
    - story_2022_054
  - id: CM-16-019
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse `Accept(Offer(CaseParticipant))` or
      `Reject(Offer(CaseParticipant))` from any sender but the case's Case Owner,
      and then invite no one and notify no recommender.
    rationale: >-
      The Case Owner decides about a recommendation (CM-16-006). If any sender could
      answer it, any actor that knows a recommendation id could accept it, and the
      CASE_MANAGER would invite whoever that actor chose (HP-01-006).
    verification: >-
      A test marked `CM-16-019`
      sends the Accept from a participant that is not the Case Owner and asserts `REFUSED`
      with an empty outbox.
    stories:
    - story_2022_035
    - story_2022_054
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-16-006
    adr:
    - ADR-0115
  - id: CM-16-023
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST take the actor to invite from the
      `Offer(CaseParticipant)` it recorded, never from the Case Owner's reply.
    rationale: >-
      The reply carries a copy of the Offer, and the copy is the sender's claim.
      Assume that the CASE_MANAGER checked only that the recommendation is recorded,
      and read the invitee from the reply. Then the reply could choose the invitee.
      The recorded Offer is the CASE_MANAGER's own record (CM-16-018).
    verification: >-
      `test_invitee_comes_from_the_recorded_offer_not_the_reply` and
      `test_invite_roles_are_the_recorded_offers_not_the_replys` in
      `test/core/use_cases/received/actor/test_offer_case_participant.py` find the
      invitee and its roles taken from the recorded Offer, not the reply's copy.
    relationships:
    - rel_type: extends
      spec_id: CM-16-019
    adr:
    - ADR-0115
    stories:
    - story_2022_054
- id: CM-17
  title: Invitation Flow — Enrichment and Roles
  specs:
  - id: CM-17-001
    priority: MUST
    kind: protocol
    statement: >-
      The stub Invite sent by the CASE_MANAGER to a new actor MUST be
      `Invite(Actor)[target=VulnerabilityCaseStub]`, with the stub shaped as
      CM-11-013 requires. This requirement is extended by CM-17-002 and CM-17-003.
    rationale: >-
      An AS2 `Invite` names the invited party as its `object`, and the thing it is
      invited to as its `target`. When the target is a stub, no case content goes to an
      invitee that is not yet entitled to it (CM-10-004, CM-17-022). The stub's own type
      lets a receiver tell this Invite from the full-case Invite (CM-11-013).
    verification: >-
      Integration tests in `test/demo/` confirm that the stub Invite emitted by the
      CASE_MANAGER names the invitee as its `object` and carries a
      `VulnerabilityCaseStub` as its `target`.
    adr:
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_054
  - id: CM-17-002
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a stub Invite sent while an embargo is in force. Then EM
      is `ACTIVE` or `REVISE`, and the case's embargo register holds an `ACTIVE`
      entry. Its case stub MUST carry the active embargo (`activeEmbargo`), inline
      or by an ID that the invitee can ask the inviter to resolve.
    rationale: >-
      The invite-accept cycle is the only consent signal for a late joiner. An Accept
      without the embargo terms is not informed consent (MV-10-006). The invitee has
      only the invitation, so the invitation must let it learn the terms before it
      accepts: inline in the stub, or by the ID that the stub names.
      CM-17-011 says which form this prototype sends. In EM `REVISE`, the prior
      embargo stays in force (EP-05-002), so the invitee needs its terms then too.
    verification: >-
      Integration tests in `test/demo/` confirm that when an embargo is in force at
      invite time, the case stub on the wire carries `activeEmbargo`; unit tests
      marked `CM-17-002` in
      `test/core/use_cases/triggers/test_actor_triggers.py` and
      `test/wire/as2/factories/test_case_factories.py` confirm the same for EM
      `ACTIVE` and `REVISE`, and that a stub sent with no embargo in force (none
      yet, a proposal only, or an ended one) carries no embargo.
    relationships:
    - rel_type: implements
      spec_id: MV-10-006
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-17-013
    priority: MUST
    kind: protocol
    statement: >-
      When an embargo is in force as the CASE_MANAGER sends a stub Invite, the
      case stub MUST carry the case's EM state (`caseStatus.emState`).
    rationale: >-
      The EM state tells the invitee whether a revision of the embargo is open. In EM
      `REVISE`, the invitee learns from it that a proposal is pending, which it
      receives after it joins (EP-09-011). The `caseStatus` is a `CaseStatus`, so it
      also carries the `published` time every status carries (CLP-15-010).
    verification: >-
      `test_active_embargo_enriches_case_stub` and
      `test_revise_stub_carries_the_embargo_in_force` in
      `test/core/use_cases/triggers/test_actor_triggers.py` confirm the stub carries
      `emState` `ACTIVE` or `REVISE`.
    relationships:
    - rel_type: extends
      spec_id: CM-17-002
    stories:
    - story_2022_023
  - id: CM-17-014
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A case stub MUST NOT carry an open embargo revision proposal. The invitee
      learns of the proposal from `caseStatus.emState` and receives it after
      joining (EP-09-011).
    rationale: >-
      The revision is not yet binding, and CM-17-022 keeps other case content out of
      the stub. When the joiner holds the case, EP-09-011 relays to it each open
      proposal that it has not answered.
    verification: >-
      `test_revise_stub_carries_the_embargo_in_force_not_the_revision` in
      `test/wire/as2/factories/test_case_factories.py` confirms that a `REVISE` stub
      carries the embargo in force and not the revision.
    relationships:
    - rel_type: extends
      spec_id: CM-17-002
    stories:
    - story_2022_014
  - id: CM-17-003
    priority: MUST
    kind: project
    statement: >-
      The `Invite` activity MUST embed the intended `case_roles: list[CVDRole]` for the
      invitee so that `EmitInviteActorToCaseNode` can include them in the wire activity.
    rationale: >-
      The CASE_MANAGER cannot route messages for a participant with no roles, or give it
      the correct access (CM-11-019). The participant record that the stub Invite
      creates (CM-11-026) gets its roles from the Invite. Thus the Invite must carry the
      roles that the Case Owner intended. These roles can come from a direct trigger
      request or from the suggest-actor round-trip.
    verification: Integration tests in `test/demo/` confirm that the `Invite` activity emitted
      for a new participant embeds a non-empty `case_roles` list for the invitee.
    adr:
    - ADR-0114
  - id: CM-17-004
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives
      `Accept(Invite(Actor)[target=VulnerabilityCaseStub])` from
      an invitee, it MUST, in this order: (1) commit a ledger entry for the Accept and
      fan it out to every active participant (CM-10-004); (2) record the Accept's effect
      on the participant (CM-11-001); (3) when the participant is now active, send it
      `Announce(VulnerabilityCase)` and replay all prior `CaseLedgerEntry` records to it
      in log-index order (CM-11-008); and (4) send it the full-case Invite (CM-11-010).
    rationale: >-
      Each step needs the step before it. The ledger records the Accept before any step
      acts on it (CLP-10-006). The participant's record must show that it joined before
      the participant is active and entitled to content (CM-10-004). The participant
      must hold the case and its history before it can make a decision about the case.
      Delivery to each recipient is in order (ADR-0112). Thus the full-case Invite,
      which the CASE_MANAGER queues last, arrives when the participant can answer it
      (CM-11-010).
    verification: >-
      Integration tests in `test/demo/` confirm that
      `Accept(Invite(Actor)[target=VulnerabilityCaseStub])` triggers the CASE_MANAGER's
      sequence in order: ledger
      commit and fan-out, the CM-11-001 record update, full case snapshot and ledger
      replay, and the full-case Invite.
    adr:
    - ADR-0114
    - ADR-0121
    relationships:
    - rel_type: implements
      spec_id: CM-11-001
    - rel_type: implements
      spec_id: CM-11-008
    - rel_type: implements
      spec_id: CM-11-010
    - rel_type: implements
      spec_id: PCR-08-010
    stories:
    - story_2022_054
    - story_2022_052
    - story_2022_088
  - id: CM-17-005
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      Presence in the case participant list MUST NOT be treated as acceptance of the
      invitation or as entitlement to case content. An invitee is in the list from the
      stub Invite onward (CM-11-006); only an active participant (CM-10-004) is entitled
      to case content.
    rationale: >-
      The CASE_MANAGER tracks every invitee from the moment it is invited, including one
      that declines, so the participant list holds inert participants. Any consumer that
      reads membership as "accepted" would hand case content to an actor that has not
      consented.
    adr:
    - ADR-0114
  - id: CM-17-006
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST commit exactly one `CaseLedgerEntry` for an Invite it
      emits, in the emitting tree, after it appends the Invite to the outbox.
    rationale: >-
      The entry records an Invite that the CASE_MANAGER sent (SYNC-09-002, ADR-0119).
      If a send succeeds but its commit fails, the retry builds the Invite again under
      its first id. Thus the outbox does not queue it two times while it is pending
      (OX-06-002). If the Invite was delivered, it gets to its receiver again under the
      same id, and the receiver drops it (ID-02-001). The commit records the Invite one
      time.
    verification: >-
      `test/core/behaviors/case/nodes/test_actor_and_announce_nodes.py::TestEmitInviteActorToCaseNodeQueuesBeforeCommitting`
      asserts the emit node appends to the outbox before it commits;
      `test/core/use_cases/triggers/test_actor_triggers.py::TestInviteRetrySendsOnce` asserts a
      retry queues and commits the Invite once.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
    adr:
    - ADR-0109
    - ADR-0119
  - id: CM-17-015
    priority: MUST_NOT
    kind: project
    statement: >-
      The CASE_MANAGER MUST NOT address an Invite it emits to itself.
    rationale: >-
      A copy addressed to the CASE_MANAGER would loop back to its own inbox, where a
      received-side path could record the same Invite a second time (ADR-0109).
    verification: >-
      `test/core/behaviors/case/nodes/test_actor_and_announce_nodes.py::TestEmitInviteActorToCaseNodeQueuesBeforeCommitting`
      asserts the emitted Invite sets no `cc`.
    relationships:
    - rel_type: extends
      spec_id: CM-17-006
    adr:
    - ADR-0109
  - id: CM-17-016
    priority: MUST_NOT
    kind: project
    statement: >-
      A received-side path MUST NOT commit a second ledger entry for an Invite
      that the CASE_MANAGER emitted.
    rationale: >-
      The commit in the emitting tree is the only commit for the Invite. A
      received-side commit of a loopback copy would record the same Invite a second
      time (ADR-0109).
    verification: >-
      The case-ledger invariant harness asserts a single entry per Invite activity id
      (CLP-07-002).
    relationships:
    - rel_type: extends
      spec_id: CM-17-006
    adr:
    - ADR-0109
  - id: CM-17-007
    priority: MUST
    kind: project
    statement: >-
      This rule covers the direct-trigger path, where the Case Owner calls
      `invite-actor-to-case` with a `roles` list. In that path,
      `SvcInviteActorToCaseUseCase` MUST send the CASE_MANAGER the Case Owner's
      own recommend-actor `Offer(Actor)[target=VulnerabilityCase]`, carrying those
      roles, from the
      Case Owner's identity and outbox.
    rationale: >-
      The owner's direct invite is the recommend-actor flow with the recommender and the
      decider being the same participant, so it reuses that flow rather than adding a message
      type. This is one path for every topology: when the Case Owner's container also hosts the
      CASE_MANAGER the Offer loops back over HTTP (OX-12-001), and when it does not the Offer
      is the only way to reach the CASE_MANAGER without emitting in its name from a store that
      is not the ledger's home (ADR-0109).
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py` asserts the trigger enqueues an
      `Offer(Actor)[target=VulnerabilityCase]` addressed to the CASE_MANAGER with the
      offered roles, from the
      owner's outbox only; and
      `test/demo/test_remote_case_actor_invite.py` runs the flow on three containers and
      asserts the Invite is emitted and committed on the CASE_MANAGER's container with no `cc`.
    adr:
    - ADR-0109
  - id: CM-17-017
    priority: MUST_NOT
    kind: project
    statement: >-
      In the direct-trigger path, `SvcInviteActorToCaseUseCase` MUST NOT execute
      the invite tree locally as the CASE_MANAGER.
    rationale: >-
      A local run would emit in the CASE_MANAGER's name from a store that is not the
      ledger's home (ADR-0109). The CASE_MANAGER emits the Invite on its own
      container, from the Offer it received.
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py::TestSvcInviteActorToCaseUseCase::test_invite_sends_the_owners_own_offer_to_the_case_manager`
      asserts the trigger runs no tree as the CASE_MANAGER.
    relationships:
    - rel_type: extends
      spec_id: CM-17-007
    adr:
    - ADR-0109
  - id: CM-17-018
    priority: MUST
    kind: project
    statement: >-
      This rule covers an `Offer(Actor)[target=VulnerabilityCase]` whose recommender
      holds
      `CVDRole.CASE_OWNER` for the case. The CASE_MANAGER's recommend-actor
      received tree MUST emit the `Invite` directly with the offered roles,
      instead of forwarding the Offer to the Case Owner (CM-16-003, CM-16-004).
    rationale: >-
      When the recommender is the Case Owner, the recommender and the decider are the
      same participant. Forwarding the Offer would ask the Case Owner a question it
      has already answered.
    verification: >-
      `test/core/behaviors/case/test_suggest_actor_tree.py` asserts the CASE_OWNER
      branch sits behind the duplicate branches and ahead of the fresh path;
      `test/core/use_cases/received/actor/test_suggest.py` asserts the CASE_MANAGER
      emits the Invite, commits it, and does not forward the Offer.
    relationships:
    - rel_type: extends
      spec_id: CM-17-007
    adr:
    - ADR-0109
  - id: CM-17-019
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER's Invite for the Case Owner's direct invite MUST carry the
      offered roles, so its `caseRoles` is never empty (CM-17-003).
    rationale: >-
      The roles travel in the Offer, and the CASE_MANAGER reads them from the received
      Offer it stored. That is the stored activity, not a value the trigger response
      carried, the same discipline CM-16-018 applies to the CASE_MANAGER's own
      outgoing Offer on `Accept`.
    verification: >-
      `test/core/use_cases/received/actor/test_suggest.py::TestOwnerDirectInviteAtCaseManager::test_requested_roles_are_carried`
      asserts the Invite carries the offered roles.
    relationships:
    - rel_type: extends
      spec_id: CM-17-018
    adr:
    - ADR-0109
  - id: CM-17-008
    priority: MUST
    kind: project
    statement: >-
      In the suggest-actor received path (the CASE_MANAGER receives
      `Accept(Offer(CaseParticipant))`), the invitee's `CaseParticipant.case_roles` MUST
      be populated when the CASE_MANAGER emits the stub Invite (CM-11-006), from the
      roles that Invite carries, originating from the Case Owner's Accept response
      (CM-16-006) or the CASE_MANAGER's default role assignment (CM-16-003).
    rationale: >-
      In this path, `AcceptOfferCaseParticipantReceivedUseCase` does not write
      `suggested_roles`. The roles in the stub Invite are the roles that the Case Owner
      or the CASE_MANAGER's default assignment chose. The participant record is created
      with the Invite. Thus the Invite is the only source for its roles.
    verification: >-
      Integration tests in `test/demo/` confirm that in the suggest-actor path the
      invitee's `CaseParticipant.case_roles` equals the roles on the emitted stub
      Invite.
    adr:
    - ADR-0114
  - id: CM-17-009
    priority: MUST
    kind: protocol
    statement: >-
      Any canonical `CaseLedgerEntry` the CASE_MANAGER commits while processing a stub
      Invite's `Accept` whose fan-out reaches the joining participant — every entry
      committed once that participant is active (CM-10-004) — MUST be committed after
      CM-17-004 step (3), the `Announce(VulnerabilityCase)` and the start of the ledger
      replay, so the participant's first ledger entries arrive after its case seed and
      in log-index order.
    rationale: >-
      CM-17-004 puts the announce and the replay in order, with no fan-out to the joiner
      between them. But an entry committed during the same admission can have a fan-out
      that includes the new active participant. That entry would then get to the
      participant before its case. A replica that receives a ledger entry before its
      case cannot anchor the entry. It rejects the entry and asks for a replay from
      genesis, and that replay can mix with the backfill (SYNC-15). When the
      CASE_MANAGER commits the entry last, the entry gets to the invitee as the next
      entry in chain order.
    verification: >-
      `test/core/use_cases/received/actor/test_invite.py::TestInviteActorUseCases::test_accept_invite_seeds_the_case_before_any_ledger_entry_reaches_the_invitee`
      asserts `Announce(VulnerabilityCase)` precedes every `Announce(CaseLedgerEntry)`
      addressed to the invitee, and `test_accept_invite_backfills_canonical_ledger_from_genesis`
      asserts the invitee receives entries 0, 1, 2, 3 in order;
      `test/core/behaviors/case/test_accept_invite_tree.py::test_case_announce_and_backfill_precede_the_first_committing_effect`
      pins the effect order in the tree.
    relationships:
    - rel_type: refines
      spec_id: CM-17-004
    - rel_type: depends_on
      spec_id: SYNC-15-004
    adr:
    - ADR-0114
    stories:
    - story_2022_052
    - story_2022_088
  - id: CM-17-010
    priority: MUST
    kind: protocol
    statement: >-
      A sender's case stub MUST carry exactly `id`, `type`, `caseId` (CM-11-013),
      a non-empty `summary` (MV-10-001) and, with an embargo in force, the
      CM-17-002 embargo terms. The JSON-LD `@context` is not content.
    rationale: >-
      An invitee is not yet entitled to case content (CM-10-004, CM-17-005). For
      informed consent, the invitee needs the case's identity, a summary that a person
      can read of what it is asked to join, and the embargo terms (CM-17-002).
    note: >-
      Open question: whether a stub relayed by a third party should name the
      coordinator and Case Owner is tracked in #4184.
    verification: >-
      `test/wire/as2/factories/test_case_factories.py::test_rm_invite_stub_carries_a_non_empty_summary`
      asserts a stub projected from a full case serialises with only `id`, `type`,
      `caseId` and a non-empty `summary`; #4165 removed the strict-xfail marker when the
      factory was implemented. `test_enriched_stub_carries_only_the_embargo_terms` in
      the same file asserts that a stub sent with an embargo in force adds only
      `activeEmbargo` and `caseStatus`.
    relationships:
    - rel_type: refines
      spec_id: CM-11-013
    - rel_type: refines
      spec_id: MV-10-001
    - rel_type: depends_on
      spec_id: CM-17-002
    stories:
    - story_2022_023
    - story_2022_014
    adr:
    - ADR-0114
  - id: CM-17-020
    priority: MAY
    kind: protocol
    statement: >-
      The sender chooses the stub's `summary`, which MAY be the case name or a
      deliberately less revealing string.
    rationale: >-
      The case name can be an opsec risk. Thus the sender writes the summary for the
      invitee, and does not have to copy it from the case.
    verification: >-
      `test_rm_invite_to_case_refuses_when_no_stub_summary` in
      `test/wire/as2/factories/test_case_factories.py` confirms the factory takes
      the summary the sender set, and does not fall back to the case name.
    relationships:
    - rel_type: extends
      spec_id: CM-17-010
    stories:
    - story_2022_023
  - id: CM-17-021
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The sender MUST NOT assume the case name is safe to share with an invitee
      not yet bound by the embargo.
    rationale: >-
      The case name can reveal what the embargo protects. An invitee that has not
      joined has not agreed to the embargo, so the sender decides what the stub's
      summary reveals to it.
    verification: >-
      `test_rm_invite_to_case_refuses_when_no_stub_summary` in
      `test/wire/as2/factories/test_case_factories.py` confirms the factory refuses
      a stub with no summary set by the sender, instead of sending the case name.
    relationships:
    - rel_type: extends
      spec_id: CM-17-020
    stories:
    - story_2022_023
  - id: CM-17-022
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A sender MUST NOT put any other case content in a case stub.
    rationale: >-
      An invitee is not yet entitled to case content (CM-10-004, CM-17-005). This
      constrains what is sent.
    verification: >-
      `test_rm_invite_stub_carries_no_case_content` and
      `test_enriched_stub_carries_only_the_embargo_terms` in
      `test/wire/as2/factories/test_case_factories.py` assert the stub carries no
      other case content.
    relationships:
    - rel_type: extends
      spec_id: CM-17-010
    stories:
    - story_2022_023
  - id: CM-17-023
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A sender MUST NOT name the case's coordinator or Case Owner in a case stub.
    rationale: >-
      The Invite that carries the stub already identifies the inviter in its `actor`
      and `attributedTo`. If the stub named the coordinator or the Case Owner, it
      would repeat what the Invite states.
    note: >-
      Open question: whether a stub relayed by a third party should name the
      coordinator and Case Owner is tracked in #4184.
    verification: >-
      `test_rm_invite_stub_carries_no_case_content` in
      `test/wire/as2/factories/test_case_factories.py` asserts the case's
      `attributedTo` never travels in the stub.
    relationships:
    - rel_type: extends
      spec_id: CM-17-010
    stories:
    - story_2022_023
  - id: CM-17-011
    priority: MUST
    kind: project
    statement: >-
      When a stub carries the active embargo, this codebase MUST embed the whole
      `EmbargoEvent` as the inviter holds it, not just its ID and `end_time`.
    rationale: >-
      This is a prototype decision, not a protocol decision. An implementation can let
      the invitee get the embargo from the inviter by its ID. This prototype does not
      supply that fetch. Thus the stub carries the full embargo. When the stub embeds
      the object as the inviter holds it, the stub keeps the sender's own start time
      and name. A copy built again from the ID and end time would not keep them.
    verification: >-
      `test_rm_invite_stub_embeds_the_full_active_embargo` in
      `test/wire/as2/factories/test_case_factories.py`, run once with the case naming
      the embargo by ID and once with it holding the embargo inline, confirms the
      stub's `activeEmbargo` equals the stored embargo's full serialization;
      `test_invite_stub_embeds_the_stored_embargo` in
      `test/adapters/driven/trigger_activity_adapter/test_actors.py` confirms the
      same for an embargo the inviter reads from its store.
    relationships:
    - rel_type: refines
      spec_id: CM-17-002
      note: CM-17-002 lets the stub carry the embargo inline or by ID; this codebase always carries it inline
  - id: CM-17-024
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT send a stub Invite whose active embargo the inviter
      cannot embed. It cannot embed it when it holds only the ID, or another
      embargo object.
    rationale: >-
      A stub that names the embargo only by ID would give the invitee no method to
      read the terms, because this prototype supplies no fetch (CM-17-002). A stub
      that carried another embargo would state the wrong terms.
    verification: >-
      `test_rm_invite_refuses_an_active_embargo_it_cannot_embed`,
      `test_rm_invite_refuses_an_embargo_object_that_is_not_the_active_one` and
      `test_stub_embargo_refuses_when_no_active_embargo_is_named` in
      `test/wire/as2/factories/test_case_factories.py` confirm the Invite is refused
      when the active embargo cannot be embedded;
      `test_invite_is_refused_when_the_embargo_is_not_in_the_store` in
      `test/adapters/driven/trigger_activity_adapter/test_actors.py` confirms the
      refusal when it is missing from the inviter's store.
    relationships:
    - rel_type: extends
      spec_id: CM-17-011
  - id: CM-17-012
    priority: MUST
    kind: project
    statement: >-
      When the CASE_MANAGER receives `Accept(Invite(Actor)[target=VulnerabilityCaseStub])`
      from an invitee whose participant record is already joined, or removed,
      it MUST treat the Accept as a duplicate: it commits no ledger entry,
      changes no participant record or consent row, and sends no case snapshot,
      backfill or full-case Invite. A participant is joined when the case
      initialization sequence seated it or it has already accepted the stub
      Invite (CM-10-004). The test is the participant record alone, not any
      replication state the CASE_MANAGER holds for that participant.
    rationale: >-
      When a joined participant accepts a stub Invite, the Accept is a redundant signal.
      Case creation seeds the participants that it seats as signatories (CM-14-003,
      CM-14-005). Thus the Accept changes nothing. The consent of a joined participant
      to a later embargo comes only from its answers to the Invite for that embargo. An
      Accept from a removed participant must not admit it again. Reinstatement is a
      separate act (CM-31-011). Replication state is not a correct test, because the
      embargo pause and ledger sync also write it.
    verification: >-
      Tests marked `CM-17-012` deliver a stub-Invite Accept from three joined or
      removed participants and assert the duplicate answer for each: no ledger entry,
      no record or consent change and nothing queued. The three are a joined
      participant with no replication state, a joined participant with an
      embargo-pause replication state, and a removed participant. A further test
      delivers an inert invitee's first Accept and asserts it joins and is backfilled
      (CM-17-004). The three are
      `test/core/use_cases/received/actor/test_invite.py::TestJoinedOrRemovedStubAcceptIsADuplicate`;
      the inert invitee's Accept is
      `test/core/use_cases/received/actor/test_invite.py::TestInviteActorUseCases::test_accept_invite_backfills_canonical_ledger_from_genesis`.
      The guard alone is
      `test/core/behaviors/case/nodes/test_idempotency_guards.py::TestCheckInviteeNotAlreadyParticipantNode`,
      and a stored replication-state row that still carries a retired `join_backfill_*`
      key is refused in `test/core/models/test_replication_state.py`.
    relationships:
    - rel_type: refines
      spec_id: CM-17-004
    - rel_type: depends_on
      spec_id: CLP-13-001
- id: CM-18
  title: Participant Embargo Consent (per-embargo rows)
  specs:
  - id: CM-18-001
    priority: MUST
    kind: protocol
    statement: >-
      Each participant record MUST hold one embargo consent row for every entry in the
      case's embargo register. Each row holds one of five states. The `UNINVITED` state
      means not asked, and is the start state. The `INVITED` state means asked, with no
      answer yet. The `AGREED` state records agreement, and `DECLINED` records an
      explicit refusal or a withdrawal. The `TIMED_OUT` state means invited, with the
      RSVP deadline passed and no answer. A participant is a *signatory* when its row
      for the register's `ACTIVE` entry is `AGREED`. A participant has *lapsed* when
      three things hold. An entry is `ACTIVE`, and the participant's row for it is
      neither `AGREED` nor `DECLINED`. Following `replaces` back from the `ACTIVE`
      entry, the first entry whose row is `AGREED` or `DECLINED` has an `AGREED` row.
      Both positions are read from the rows and the register, never stored (CM-18-016).
      With no `ACTIVE` entry, nobody is a signatory and nobody has lapsed.
    rationale: >-
      One row for each pair of participant and embargo records each answer one time. To
      find if a participant is bound by the active embargo, a reader looks at the row
      for the active embargo. Thus there is no second record to reconcile, and a first
      proposal and a revision use the same rules (ADR-0122). `TIMED_OUT` is different
      from `DECLINED`, so that every reader can tell silence from a refusal (ADR-0118).
      A terminated embargo is a fact of the register, not a fact about each participant.
      A lapse follows the `replaces` chain. Thus only an embargo that was in force can
      bind, and a withdrawal from a later embargo ends the binding of an earlier
      embargo.
    verification: >-
      Inspection of `vultron/core/states/participant_embargo_consent.py` confirms that
      `EmbargoConsentState` declares exactly `UNINVITED`, `INVITED`, `AGREED`,
      `DECLINED` and `TIMED_OUT`. Unit tests confirm that every participant holds
      exactly one row per register entry after case setup, a proposal and a join, and
      that `has_lapsed()` reads the `replaces` chain (a three-step chain, an agreed
      proposal that never took effect, and a withdrawal).
    adr:
    - ADR-0048
    - ADR-0091
    - ADR-0093
    - ADR-0118
    - ADR-0122
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-18-019
    priority: MUST
    kind: protocol
    statement: >-
      Proposing an embargo MUST write an `UNINVITED` consent row for it on every current
      participant.
    rationale: >-
      A participant that was not asked holds a row that says so. Thus no reader infers
      "not asked" from a missing record, and a check can use the register to find a row
      for each participant and each embargo (CM-18-001).
    verification: >-
      `test_proposing_writes_an_uninvited_row_for_every_current_participant` in
      `test/core/services/embargo_lifecycle/test_proposals.py` asserts that a proposal
      writes an `UNINVITED` row on every current participant.
    relationships:
    - rel_type: extends
      spec_id: CM-18-001
    adr:
    - ADR-0122
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-18-020
    priority: MUST
    kind: protocol
    statement: >-
      Creating a participant record MUST write an `UNINVITED` consent row on it for
      every entry already in the case's embargo register.
    rationale: >-
      A participant that joins after embargoes were proposed was asked about none of
      them. A row for each entry records that, so the participant holds a row for every
      entry from its creation on (CM-18-001), and no reader meets a missing row.
    verification: >-
      `test_add_participant_writes_an_uninvited_row_per_register_entry` in
      `test/core/models/test_case.py` and `test_writes_one_uninvited_row_per_embargo` in
      `test/core/models/test_case_participant.py` assert that a new participant record
      gets one `UNINVITED` row for each register entry.
    relationships:
    - rel_type: extends
      spec_id: CM-18-001
    adr:
    - ADR-0122
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-18-021
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A reader MUST NOT read a missing consent row as any consent state. A missing row
      is a defect.
    rationale: >-
      Every row is written (CM-18-019, CM-18-020), so a missing row comes only from a
      fault. A reader that treated it as `UNINVITED`, or as any other state, would hide
      the fault, and could count a participant as asked, bound or free when it is not.
    verification: >-
      `test_missing_row_raises` in `test/core/models/test_case_participant.py` and
      `test_a_case_refuses_an_inline_participant_missing_a_row` in
      `test/core/models/test_case.py` assert that a missing row is refused, not read as
      a state.
    relationships:
    - rel_type: extends
      spec_id: CM-18-001
    adr:
    - ADR-0122
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-18-017
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST raise when it reads a participant's missing consent row for a
      register entry, never reading it as a consent state (CM-18-021).
    rationale: >-
      How this codebase treats the defect CM-18-021 names; split from CM-18-001 so that
      item states only the rows every participant holds (MS-12-010). Raising is how one
      implementation fails fast, and no other participant observes it.
    verification: >-
      Unit tests in `test/core/models/test_embargo_consent_move.py` confirm that reading
      a missing row for a register entry, and for the embargo in force, raises.
    relationships:
    - rel_type: implements
      spec_id: CM-18-021
  - id: CM-18-002
    priority: MUST
    kind: protocol
    statement: >-
      When an invitation's RSVP deadline passes with no answer, the CASE_MANAGER MUST
      apply the `TIME_OUT` trigger to that invitation's row only, recording `TIMED_OUT`,
      never `DECLINED`. A lapse has no timer and is not a stored transition (CM-18-001,
      CM-18-016). A lapsed participant's deadline is the one on its re-invitation to the
      embargo in force (CM-28-013).
    rationale: >-
      Per ADR-0093, ADR-0122 and `notes/participant-embargo-consent.md`, a participant
      has lapsed when the active embargo was replaced by longer terms it has not
      accepted. While a revision is only proposed, the prior embargo is still in force
      and binds every signatory, so nothing about their consent has changed. Per
      ADR-0118, a participant that did not answer has made no decision. Thus a timeout
      records `TIMED_OUT`, distinct from an explicit `DECLINED`, and both are
      re-invitable. Nothing stalls on a lapsed participant: the CM-10-004 gate already
      excludes it from embargoed content, and no invitation gives it a deadline. An RSVP
      deadline belongs to one invitation and is stored on that invitation's `INVITED`
      row (CM-28-013). Its passing times out only that row, never the participant's
      other invitations.
    verification: >-
      Unit tests confirm that the expiry's row decision (`consent_row_move()` with `TIME_OUT`)
      and `detect_and_apply_expiry()` move only the named invitation's row once its own
      deadline has passed, leaving a
      concurrent invitation with a later deadline `INVITED`, and that `propose_embargo()` and the
      owner's revision acceptance write no row to record a lapse.
    adr:
    - ADR-0093
    - ADR-0118
    - ADR-0122
    - ADR-0065
    stories:
    - story_2022_027
    - story_2022_014
  - id: CM-18-022
    priority: MAY
    kind: protocol
    statement: >-
      A timer expiry (pocket veto) MAY drive a row's `INVITED → TIMED_OUT` transition,
      with no explicit participant action.
    rationale: >-
      A pocket veto exists so that an unanswered invitation cannot stall coordination.
      A participant that does not answer has made no decision, so the transition needs
      no act from it (ADR-0118).
    relationships:
    - rel_type: extends
      spec_id: CM-18-002
    adr:
    - ADR-0093
    - ADR-0118
    stories:
    - story_2022_027
  - id: CM-18-023
    priority: SHOULD
    kind: protocol
    statement: >-
      The pocket-veto timer period SHOULD be a policy window of 7 days.
    note: >-
      The policy window is the FALLBACK, not the primary mechanism. When the
      inviting `Invite(EmbargoEvent)` activity carries an explicit
      `Invite.end_time`, that value is authoritative and supersedes this window
      (CM-28-002). The pocket veto and the explicit RSVP deadline are ONE
      mechanism at two levels of explicitness, not two competing timeouts.
    rationale: >-
      An Invite that names no deadline still needs one, or an unanswered invitation can
      stall coordination. A fixed default window gives every such invitation the same
      deadline, so every participant can predict when silence becomes `TIMED_OUT`.
    relationships:
    - rel_type: extends
      spec_id: CM-18-022
    adr:
    - ADR-0093
    - ADR-0118
    stories:
    - story_2022_027
  - id: CM-18-003
    priority: MUST
    kind: protocol
    statement: >-
      The consent row machine MUST implement exactly the following valid triggers, each applied to
      the row for one embargo: INVITE (from `UNINVITED`, `DECLINED` or `TIMED_OUT`, to `INVITED`),
      AGREE (from `UNINVITED`, `INVITED`, `DECLINED` or `TIMED_OUT`, to `AGREED`), DECLINE (from
      `UNINVITED`,
      `INVITED`, `AGREED` or `TIMED_OUT`, to `DECLINED`), TIME_OUT (from `INVITED` only, to
      `TIMED_OUT`) and CARRY_OVER (from every state except `AGREED`, to `AGREED`). No other trigger
      is valid from any state, and a row for an entry in a final register status (`SUPERSEDED`,
      `REJECTED`, `CANCELLED`, `TERMINATED`) accepts no trigger at all.
    rationale: >-
      `DECLINED` and `TIMED_OUT` are not terminal. The CASE_MANAGER can invite again a
      participant that declined or that let an invitation time out, for example when the
      embargo terms change. `AGREED` does not accept a new invitation, so a second
      request does not cancel a consent that the participant gave. `AGREE` is valid from
      `DECLINED`, because an Accept after a decline is a change of answer by the
      participant. The participant has just said that it accepts. Thus its row moves
      directly, with no re-invite step. Only the participant's own answer moves a
      `DECLINED` row in this way. Seeding (CM-14-003, CM-14-005) and the Accept of the
      full-case Invite never cancel a decline. Per ADR-0048, `AGREE` and `DECLINE` are
      valid directly from `UNINVITED`, because consent does not always come through an
      invitation. A Finder who sets the embargo on its own case has no inviter.
      Participants added during case initialization already have an embargo in scope
      (ADR-0041). The reporter gives its consent when it submits the report (CM-14-005).
      A required synthetic `INVITED` step for these paths would record an invitation
      that did not occur. Per ADR-0093, `DECLINE` is also valid from `AGREED`. A
      participant bound by an embargo MAY withdraw its consent when it rejects the
      *active* embargo (VP-13-007, VP-13-008). A rejection of a *proposed* embargo
      declines only the row for that embargo. It does not change the participant's row
      for the embargo in force (MSM-07-004). Per ADR-0118, `TIME_OUT` is only the timer
      path (CM-18-002). A late Accept that the CASE_MANAGER honours moves `TIMED_OUT →
      AGREED` directly (EMB-17-002), and a late explicit Reject moves `TIMED_OUT →
      DECLINED`. Only the activation of a revision that ends at or before the end of the
      embargo it replaces causes `CARRY_OVER` (EP-05-003). `CARRY_OVER` also lifts a
      `DECLINED` row. An agreement to N days is an agreement to every shorter period. A
      decline of a shorter revision objects to the loss of time, not to the embargo. A
      row whose embargo is final records the past. Thus a participant cannot give more
      consent to it. The CASE_MANAGER answers a late Accept of such terms with an
      invitation to the case's current terms, which are the Active Embargo or, with
      none in force, the earliest-expiring open proposal (EMB-17-003, EP-08-002). A
      lapse and a termination are not triggers. They are derived (CM-18-001,
      CM-18-016).
    verification: >-
      Inspection of `vultron/core/states/participant_embargo_consent.py` confirms that the
      transition table implements exactly the triggers INVITE, AGREE, DECLINE, TIME_OUT and
      CARRY_OVER with the specified source-state constraints; a unit test applies every (state,
      trigger) pair and confirms each unlisted one raises, and another confirms that no trigger
      moves a row whose register entry is final.
    relationships:
    - rel_type: refines
      spec_id: CM-18-001
    adr:
    - ADR-0048
    - ADR-0093
    - ADR-0118
    - ADR-0122
    stories:
    - story_2022_014
  - id: CM-18-004
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A participant's consent row MUST NOT move from `AGREED` to `INVITED` directly. The only paths
      back to `INVITED` from a resolved row are `DECLINED → INVITED` (re-invite after explicit
      decline) and `TIMED_OUT → INVITED` (re-invite after an unanswered invitation timed out); a
      participant that has lapsed is re-invited on its row for the new embargo (an `INVITED` row for
      it), which leaves its `AGREED` row for the old embargo alone.
    rationale: >-
      Consent already given cannot be withdrawn by re-inviting the participant. A signatory to the
      active embargo is bound by it; only replacing that embargo with longer terms (which lapses the
      participant by derivation — ADR-0093, ADR-0122) or the participant's own withdrawal (`DECLINE`)
      ends that position.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0093
    - ADR-0118
    - ADR-0122
  - id: CM-18-005
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST change a participant's consent row only through one of three
      `CaseParticipant` methods. The method `apply_pec_transition(embargo_id, trigger,
      entry_status=...)` applies a `PEC_Trigger`, given the register status of the
      embargo's entry. The method `copy_consent_row()` writes a row that a ledger entry
      carries in full (ADR-0124). The method `write_uninvited_rows()` writes the
      `UNINVITED` rows that record no answer.
    rationale: >-
      `apply_pec_transition()` validates the trigger against the consent table and the
      register status. It raises `VultronInvalidStateTransitionError` on an illegal
      transition or a frozen row. Thus consent writes fail closed, whatever the upstream
      BT guard coverage. A soft-fail write path would let a site skip an illegal
      transition and nobody would see it. Thus `apply_pec_transition_if_legal()` is the
      only place where an illegal trigger is a recorded no-op. Per ADR-0048, ADR-0122,
      ADR-0124.
    verification: >-
      Inspection of `vultron/core/` confirms that all consent-write sites call
      `CaseParticipant.apply_pec_transition()` or `apply_pec_transition_if_legal()`,
      copy a carried row through `apply_embargo_change()` in
      `vultron/core/models/embargo_apply.py`, or write the start rows through
      `CaseParticipant.write_uninvited_rows()`.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0048
    - ADR-0122
    - ADR-0124
  - id: CM-18-024
    priority: MUST
    kind: project
    statement: >-
      Code that changes a consent row through `CaseParticipant.apply_pec_transition()`
      MUST then persist the participant.
    rationale: >-
      The transition changes the row on the participant object in memory only. A caller
      that does not persist the participant loses the change, and the next reader sees
      the old row.
    verification: >-
      Inspection of `vultron/core/` confirms that each caller of
      `CaseParticipant.apply_pec_transition()` persists the participant afterwards.
    relationships:
    - rel_type: extends
      spec_id: CM-18-005
    adr:
    - ADR-0048
    - ADR-0122
  - id: CM-18-025
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST call `CaseParticipant.copy_consent_row()` only from
      `apply_embargo_change()`, after that function checks the row's starting state
      (CM-23-016).
    rationale: >-
      The copy write takes a row as a ledger entry carries it and does not consult the
      consent table. It stays fail-closed only because its one caller first checks that
      the row starts where the entry implies (CM-23-016, ADR-0124).
    verification: >-
      `test/core/models/test_embargo_apply.py` asserts the copy write refuses a row that
      does not start where its entry implies, and
      `test/architecture/test_consent_copy_write_has_one_caller.py` asserts that only
      `apply_embargo_change()` calls `CaseParticipant.copy_consent_row()`.
    relationships:
    - rel_type: extends
      spec_id: CM-18-005
    adr:
    - ADR-0124
  - id: CM-18-026
    priority: MUST_NOT
    kind: project
    statement: >-
      Code MUST NOT assign `CaseParticipant.embargo_consents` directly to record a
      consent change.
    rationale: >-
      A direct assignment to the rows skips the consent table, so a row could get a
      state that no trigger leads to (CM-18-003).
    verification: >-
      Inspection of `vultron/core/` confirms that no site assigns `embargo_consents`
      outside `CaseParticipant`.
    relationships:
    - rel_type: extends
      spec_id: CM-18-005
    adr:
    - ADR-0048
    - ADR-0122
  - id: CM-18-006
    priority: MUST
    kind: project
    statement: >-
      A protocol-significant consent change MUST be reproducible on every replica from the canonical
      case ledger: it is applied by the same `EmbargoLifecycle` operation on the CASE_MANAGER after
      it commits the entry of the activity that caused it (the relayed Invite, the Accept or
      Reject, the expiry, the late-Accept honour), and by replay of that entry on each replica. The
      consent rows are not carried in any `ParticipantStatus` snapshot.
    rationale: 'Consent lives on the `CaseParticipant` rows, not on `ParticipantStatus`, so an
      `Add(ParticipantStatus)` entry carries no consent. The ledger entry of the causing activity is
      the record, and replaying it through the lifecycle operation gives every store the same rows.
      Per ADR-0048, ADR-0122.'
    verification: Integration tests in `test/demo/` confirm that, after an embargo Invite, Accept,
      Reject and expiry, the participant's consent rows on a replica equal those on the
      CASE_MANAGER.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-005
    adr:
    - ADR-0048
    - ADR-0122
  - id: CM-18-007
    priority: MUST
    kind: project
    statement: >-
      The case-initialization sequence MUST establish the default embargo before seeding each
      participant's consent row for it, so that the participant record written at initialization
      carries its true post-initialization rows.
    rationale: >-
      `AGREE` is valid directly from `UNINVITED` (CM-18-003, ADR-0048). Thus an
      initialization participant gets its consent in one transition. The record written
      at initialization can then carry its true rows, and no placeholder is necessary. A
      placeholder entry and then a corrective entry would move every downstream
      `log_index`. Replicas that wait for an entry by its `log_index` would then apply
      later changes at the wrong time. One entry for each participant at initialization
      keeps `log_index` order stable. It also keeps the ADR-0079 property that
      `log_index` order is causal order (CLP-14-001).
    verification: Integration tests in `test/demo/` confirm that the default embargo is
      established before each participant's consent row is written during case initialization, so
      each initial participant record carries the correct rows.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-006
    - rel_type: depends_on
      spec_id: CM-14-003
    adr:
    - ADR-0048
    - ADR-0122
  - id: CM-18-009
    priority: MUST
    kind: project
    statement: >-
      Any consent trigger not listed in CM-18-003 MUST be rejected as a protocol error.
    rationale: Rejecting unlisted transitions fail-closes the consent table, preventing
      consent corruption from malformed or unexpected triggers.
    verification: A unit test confirms that applying an unlisted PEC trigger raises
      `VultronInvalidStateTransitionError` rather than silently succeeding.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0048
  - id: CM-18-012
    priority: MUST
    kind: project
    statement: >-
      The case initialization sequence MUST commit exactly one
      `add_participant_status_to_participant` ledger entry per participant, never a
      placeholder entry followed by a corrective entry.
    rationale: >-
      Two entries for each participant would move every downstream `log_index`. Replicas
      that wait for an entry by its `log_index` would then apply later changes at the
      wrong time. One entry for each participant keeps `log_index` order stable. `AGREE`
      is valid directly from `UNINVITED` (CM-18-003, ADR-0048). Thus an initialization
      participant gets its consent in one transition, and a placeholder is not
      necessary.
    verification: Integration tests in `test/demo/` confirm that case initialization commits
      exactly one `add_participant_status_to_participant` ledger entry per participant.
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-007
    adr:
    - ADR-0048
  - id: CM-18-016
    priority: MUST_NOT
    kind: project
    statement: >-
      The embargo lifecycle MUST NOT write a consent row to record a lapse or an exit.
      Beyond the `UNINVITED` row a proposal writes for every participant (CM-18-001), a
      proposal, the activation of a longer revision and the termination of the embargo
      change no row of a participant that has not itself been invited, has not itself
      answered, is not the Case Owner activating the embargo, or whose agreement is not
      being carried over by containment (EP-05-001); a participant's lapsed or exited
      position is read from its rows and the register (CM-18-001).
    rationale: >-
      A reader gets a lapse or an exit from the rows and the register (CM-18-001). A row
      written to record a lapse or an exit would be a second record of consent next to
      the rows. That record could disagree with the rows, and ADR-0122 does not allow
      this. Reconciliation writes at activation or termination would have nothing to
      keep in step. One row for each embargo already gives all the information that
      those writes would give.
    verification: >-
      Unit tests in `test/core/services/embargo_lifecycle/` assert that activating a longer revision
      changes no row but the owner's, that terminating the embargo reports no participant consent
      change and leaves every `embargo_consents` row as it was, and that the lapsed and exited
      positions read as such.
    relationships:
    - rel_type: refines
      spec_id: CM-18-001
    adr:
    - ADR-0122
- id: CM-19
  title: Participant Index Discipline
  specs:
  - id: CM-19-001
    priority: MUST
    kind: project
    statement: '`case_participants` (the persisted set of `CaseParticipant` records) is the authoritative source of participant
      membership. `actor_participant_index` (the in-memory dict mapping actor IDs to participants) is a cache derived from
      it. Divergence between these two structures is a hard error, not a recoverable state.'
    rationale: A divergence means the cache has entries the authority doesn't know about (or vice versa), producing silently
      incorrect routing and access-control decisions.
    verification: Inspection of `vultron/core/models/case.py` confirms that `case_participants`
      is the persisted authority and `actor_participant_index` is declared as a derived cache,
      with any divergence treated as a hard error.
    stories:
    - story_2022_092
    - story_2022_093
  - id: CM-19-002
    priority: MUST
    kind: project
    statement: >-
      Each code path that adds, removes or updates `case_participants` MUST update
      `actor_participant_index` atomically, in the same transaction or method call,
      never later.
    rationale: >-
      Lookups by actor use `actor_participant_index` (CM-19-003). If the index lags
      `case_participants`, a sender check or a role check can get a participant that the
      authority does not hold, or get no participant for one that it holds. CM-19-001
      makes that difference a hard error. The only way to prevent it is that every write
      to the set updates the index in the same step.
    verification: Inspection of `vultron/core/` confirms that every code path modifying
      `case_participants` through the canonical mutators also updates `actor_participant_index`
      atomically in the same call.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
    stories:
    - story_2022_093
  - id: CM-19-003
    priority: MUST
    kind: project
    statement: >-
      Code that needs a participant by actor ID MUST read it from
      `actor_participant_index`, the cache.
    rationale: >-
      The index gives a fast lookup of the participant for one actor. It comes from
      `case_participants` and holds one participant id per actor, so it answers a lookup
      by actor without a scan of the records.
    verification: Inspection of `vultron/core/` confirms that actor-ID lookups read from
      `actor_participant_index`.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
    stories:
    - story_2022_093
  - id: CM-19-004
    priority: MUST
    kind: project
    statement: >-
      Code that needs the canonical participant set, as for broadcast or audit, MUST
      read `case_participants`, never `actor_participant_index`.
    rationale: >-
      The index holds one participant id per actor, so it is not the set of records, and
      its population order is undefined. Broadcast and audit must cover every
      participant record in a reproducible order. Only the authoritative set gives that
      order (CM-19-001).
    verification: Inspection of `vultron/core/` confirms that canonical iteration
      (broadcast, audit) reads from `case_participants`.
    relationships:
    - rel_type: extends
      spec_id: CM-19-003
    stories:
    - story_2022_093
- id: CM-20
  title: Coordinator-as-Participant Role Constraints
  specs:
  - id: CM-20-001
    priority: MUST
    kind: protocol
    statement: >-
      A Coordinator invited to a case as a regular participant MUST hold `COORDINATOR`
      in their `case_roles` list.
    rationale: '`CASE_OWNER` confers case administration authority (CM-02-001, CM-02-004, CM-02-005). `CASE_MANAGER` is a distinct
      role: it grants single-writer authority over the canonical ledger (CLP-09) and is held by the case-creating actor enacting
      `CVDRole.CASE_MANAGER`, which SHOULD also carry `CVDRole.COORDINATOR`
      (CBT-01-015).
      It is not conferred merely for being invited as a facilitation participant,
      so a Coordinator invited as a regular participant holds neither `CASE_OWNER`
      nor `CASE_MANAGER`.'
    verification: Integration tests in `test/demo/` confirm that a Coordinator actor admitted to
      a case holds `CVDRole.COORDINATOR` in their `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CBT-01-003
    stories:
    - story_2022_063
    - story_2022_052
  - id: CM-20-002
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Owner approves a Coordinator suggested through the
      `Offer(Actor)[target=VulnerabilityCase]` path (CM-16), the Coordinator's roles
      MUST include
      `COORDINATOR`.
    rationale: Role assignments at invite time must reflect the invited actor's actual
      function in the case, not its organizational identity. A Coordinator invited to
      facilitate holds the `COORDINATOR` role, so role checks find it as one.
    verification: >-
      Integration tests in `test/demo/` confirm that a Coordinator admitted via
      `Offer(Actor)[target=VulnerabilityCase]` is assigned `CVDRole.COORDINATOR`.
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
    - rel_type: refines
      spec_id: CM-16-004
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-20-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the Case Owner approves a Coordinator suggested through the
      `Offer(Actor)[target=VulnerabilityCase]` path (CM-16), the Coordinator's roles
      MUST NOT include
      `CASE_MANAGER` or `CASE_OWNER`.
    rationale: >-
      Invitation and case ownership transfer are distinct protocol operations. An
      `Offer(Actor)[target=VulnerabilityCase]` invite adds a participant. It does not
      transfer `CASE_OWNER`
      authority (CM-02-001) or the `CASE_MANAGER` single-writer authority (CM-20-001).
    verification: >-
      `test_an_approved_coordinator_is_invited_without_authority_roles` in
      `test/core/use_cases/received/actor/test_offer_case_participant.py`, a strict
      xfail until the roles are filtered, asserts that the Invite sent on the
      owner's approval carries neither `CASE_MANAGER` nor `CASE_OWNER`.
    relationships:
    - rel_type: extends
      spec_id: CM-20-002
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-20-003
    priority: MUST
    kind: protocol
    statement: >-
      A Coordinator participant that holds `COORDINATOR` without `CASE_MANAGER` MUST
      route its `Offer(Actor)[target=VulnerabilityCase]` suggestion to add another actor
      through the
      CASE_MANAGER inbox, per ADR-0026 (CM-16-001).
    rationale: 'A Coordinator-as-participant should be able to exercise their facilitation role (suggesting additional vendors)
      without requiring ownership transfer. The CASE_MANAGER-routed suggest flow (ADR-0026) already provides this: the Coordinator
      sends `Offer(Actor)[target=VulnerabilityCase]` to the CASE_MANAGER, which records
      and forwards it to the Case Owner for approval.'
    verification: >-
      Integration tests in `test/demo/` confirm that a Coordinator participant's
      actor-suggestion message routes through the CASE_MANAGER.
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-001
    adr:
    - ADR-0026
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-20-007
    priority: MUST
    kind: protocol
    statement: >-
      The Case Owner, not the Coordinator, MUST remain the sole decision-maker on
      approving or rejecting an invitation that a Coordinator participant suggests
      (CM-02-001).
    rationale: >-
      A Coordinator facilitates the case; it does not own it. Approving a new
      participant is Case Owner authority (CM-02-001), and a suggestion transfers none
      of that authority.
    verification: >-
      `test_a_coordinators_suggestion_is_left_to_the_case_owner` in
      `test/core/use_cases/received/actor/test_suggest.py` asserts that the
      CASE_MANAGER forwards a Coordinator's suggestion to the Case Owner and sends no
      Invite itself.
    relationships:
    - rel_type: extends
      spec_id: CM-20-003
    adr:
    - ADR-0026
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-20-004
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection of the invitation flow confirms a Coordinator invited as a regular
      participant is given `case_roles` that exclude `CVDRole.CASE_MANAGER`.
    statement: >-
      A Coordinator invited to a case as a regular participant MUST NOT hold the
      CASE_MANAGER role in its case roles.
    rationale: '`CVDRole.CASE_MANAGER` grants single-writer authority over the canonical ledger and is held by the actor that
      created the case and enacts that role (CBT-01-014, ADR-0088).
      It MUST NOT be conferred on an organizational or human actor invited to the
      case as a regular facilitation participant.'
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
  - id: CM-20-005
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection confirms `CVDRole.CASE_MANAGER` is assigned only to the actor that
      enacts the CASE_MANAGER role at case creation (CBT-01-014) and never to a
      participant added through the invitation flow.
    statement: >-
      The CASE_MANAGER role MUST NOT be assigned to any organizational or human participant
      joining a case as a facilitation actor rather than as the actor enacting the
      CASE_MANAGER role (CBT-01-003).
    rationale: '`CVDRole.CASE_MANAGER` grants single-writer authority over the canonical ledger (CLP-09). Conferring it on a
      participant invited for facilitation would let them author ledger entries that only the actor enacting `CVDRole.CASE_MANAGER`
      is authorized to write.'
    relationships:
    - rel_type: refines
      spec_id: CM-20-004
- id: CM-21
  title: Ownership Transfer Protocol Effects
  specs:
  - id: CM-21-001
    priority: MUST
    kind: protocol
    statement: >-
      A `VulnerabilityCase` MUST have at most one participant that holds `CASE_OWNER` at
      any point in time.
    rationale: >-
      `CASE_OWNER` confers exclusive case administration authority
      (CM-02-004, CM-02-005).  Two simultaneous holders would create
      conflicting authority: both could terminate embargoes, authorise
      invitations, and mutate case state independently.  The invariant must
      be enforced at the data-layer level, not just assumed by convention.
    verification: Integration tests in `test/demo/` confirm that at no point does a case have
      more than one participant holding `CVDRole.CASE_OWNER`.
    relationships:
    - rel_type: refines
      spec_id: CM-02-004
    - rel_type: refines
      spec_id: CM-02-005
    stories:
    - story_2022_046
    - story_2022_050
  - id: CM-21-023
    priority: MUST
    kind: protocol
    statement: >-
      When a new owner is designated, the system MUST remove `CASE_OWNER` from the
      previous holder before, or atomically with, granting it to the new owner.
    rationale: >-
      A grant made before the strip would leave two holders for a moment, which
      CM-21-001 forbids. Stripping first, or in the same step, keeps the invariant at
      every point in time.
    verification: >-
      `test_at_most_one_case_owner_after_transfer` and
      `test_strips_the_role_from_an_old_owner_held_only_inline` in
      `test/core/behaviors/case/nodes/test_actor_and_announce_nodes.py` assert that a
      transfer leaves one `CASE_OWNER` and strips the role from the previous owner.
    relationships:
    - rel_type: extends
      spec_id: CM-21-001
    stories:
    - story_2022_046
    - story_2022_050
  - id: CM-21-002
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity is
      processed, the system MUST add `CASE_OWNER` to the accepting actor's `case_roles`.
    rationale: >-
      Role-gated nodes such as `CheckIsCaseOwnerNode` read Case Owner authority from
      `CaseParticipant.case_roles`. A transfer that did not grant the role would leave a
      new owner whose CASE_OWNER-gated acts are refused, such as embargo teardown and
      case closure.
    verification: >-
      Integration tests in `test/demo/` confirm that processing
      `Accept(Offer(VulnerabilityCase))` adds `CVDRole.CASE_OWNER` to the accepting
      actor's `case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
    stories:
    - story_2022_050
    - story_2022_048
  - id: CM-21-024
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity is
      processed, the system MUST update the case's `attributed_to` to the accepting
      actor's ID.
    rationale: >-
      `attributed_to` is the owner that the case names to every reader (MSM-07-027). A
      transfer that grants the role (CM-21-002) but leaves `attributed_to` alone makes
      the case name an owner that no longer holds the role. Thus a transfer writes both.
    verification: >-
      `test_accept_case_ownership_transfer_updates_attributed_to` in
      `test/core/use_cases/received/actor/test_ownership.py` asserts that the case's
      `attributed_to` names the accepting actor after the transfer.
    relationships:
    - rel_type: extends
      spec_id: CM-21-002
    stories:
    - story_2022_050
    - story_2022_048
  - id: CM-21-003
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity is
      processed, the system MUST remove `CASE_OWNER` from the previous owner's
      `case_roles`.
    rationale: >-
      Transferring ownership does not evict the previous owner from the case;
      they continue to participate but no longer hold administrative authority.
      Stripping only `CASE_OWNER` (and not other roles) preserves their
      standing as a Coordinator, Vendor, or other role while satisfying the
      at-most-one invariant (CM-21-001).
    verification: Integration tests in `test/demo/` confirm that processing
      `Accept(Offer(VulnerabilityCase))` removes `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
    stories:
    - story_2022_050
    - story_2022_051
  - id: CM-21-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST commit the three writes of an ownership transfer to storage as
      one atomic transaction, rolled back whole when any part fails. They are the strip
      of `CVDRole.CASE_OWNER` from the previous holder (CM-21-003), the `attributed_to`
      update (CM-21-024) and the role's grant to the new holder (CM-21-002).
    rationale: >-
      Without atomicity a crash or exception between the strip and the grant
      produces a case with zero `CASE_OWNER` holders — a state worse than two
      simultaneous holders because it cannot be recovered by any subsequent
      normal protocol message.  The invariant in CM-21-001 ("at most one at any
      point in time") logically implies that the case MUST have exactly one
      `CASE_OWNER` at all times; this spec makes the storage-transaction
      requirement explicit so that DataLayer implementations cannot satisfy
      CM-21-001 through sequential saves.
    verification: Integration tests in `test/demo/` confirm that an ownership transfer writes
      the role-strip, `attributed_to` update, and role-grant as a single atomic transaction that
      either completes fully or is rolled back.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-003
    - rel_type: refines
      spec_id: CM-21-024
  - id: CM-21-005
    priority: MUST
    kind: protocol
    statement: >-
      A Case Owner MUST propose an ownership transfer by sending
      `Offer(Offer(VulnerabilityCase))`, with the case as `context`, to the CASE_MANAGER
      only, never to the transferee (PCR-08-001).
    rationale: >-
      Routing the transfer through the CASE_MANAGER lets it ledger the offer in
      flight and broadcast it to every active participant (CM-10-004), so no
      participant is unaware a transfer is being negotiated. The CASE_MANAGER cannot
      be the transferee: its Offer would have itself as its only recipient, which
      BT-17-008 forbids, the same ground on which CM-33-003 refuses a role offer to it.
    verification: >-
      A test marked `CM-21-005` asserts that the owner's proposal is addressed to
      the CASE_MANAGER only. Integration tests in `test/demo/` confirm the proposal is
      addressed to the CASE_MANAGER's inbox.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    adr:
    - ADR-0053
    - ADR-0114
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-025
    priority: MUST
    kind: protocol
    statement: >-
      The inner Offer of an ownership-transfer proposal MUST name the case as its object
      and the transferee as its `target`. It optionally carries the deadline to answer
      as its `end_time` (CM-21-016).
    rationale: >-
      The inner Offer says what the owner asks the CASE_MANAGER to offer and to whom.
      Without the case and the transferee in it, the CASE_MANAGER cannot make the Offer
      the owner asked for (CM-21-028).
    verification: >-
      A test marked `CM-21-025` asserts that the proposal's inner Offer names the case
      as its object and the transferee as its `target`.
    relationships:
    - rel_type: extends
      spec_id: CM-21-005
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-026
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an ownership-transfer proposal, with no ledger commit
      and no outbound Offer, unless its inner Offer passes two checks. The inner Offer's
      object is the proposal's case. Its `target` is an actor the CASE_MANAGER can
      address (present, neither itself nor the proposer) and an active participant of
      the case (CM-21-021).
    rationale: >-
      A proposal is a request the CASE_MANAGER acts on. An inner Offer that names
      another case, or a transferee the CASE_MANAGER cannot address, would make an Offer
      nobody can answer, or one about a case the proposal did not concern.
    verification: >-
      Tests marked `CM-21-026` deliver a proposal whose inner Offer names another case
      or no addressable target and assert it is refused with no entry and no Offer.
    relationships:
    - rel_type: extends
      spec_id: CM-21-005
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-027
    priority: MUST
    kind: protocol
    statement: >-
      When it admits an ownership-transfer proposal, the CASE_MANAGER MUST ignore any
      id, `actor` or `to` inside the inner Offer.
    rationale: >-
      The CASE_MANAGER makes the Offer itself (CM-21-028). An id, actor or recipient
      list that the owner wrote into the inner Offer would let the owner choose fields
      that only the CASE_MANAGER sets, such as an id that collides with a stored object.
    verification: >-
      A test marked `CM-21-027` delivers a proposal whose inner Offer carries its own
      id, `actor` and `to`, and asserts that the made Offer takes none of them.
    relationships:
    - rel_type: extends
      spec_id: CM-21-005
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-028
    priority: MUST
    kind: protocol
    statement: >-
      On admitting a proposal, the CASE_MANAGER MUST make the single ownership-transfer
      `Offer(VulnerabilityCase)` itself, under an id it derives from the proposal,
      addressed to the transferee. The Offer's `actor` is the CASE_MANAGER and its
      `attributed_to` the owner (CM-24-001, CM-24-002).
    rationale: >-
      Making the Offer itself rather than forwarding the owner's gives a transfer one
      Offer, under an id no other party chose, told apart from the proposal by its shape
      (ADR-0148, DL-06-006).
    verification: >-
      A test marked `CM-21-028` delivers the owner's proposal and asserts one
      `Offer(VulnerabilityCase)` is queued to the transferee with the derived id,
      `actor` the CASE_MANAGER and `attributedTo` the owner.
    relationships:
    - rel_type: extends
      spec_id: CM-21-005
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-029
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST ledger the Offer it made from a proposal once that Offer is
      in its outbox (SYNC-09-002). That Offer is the one that is ledgered, answered,
      closed and expired.
    rationale: >-
      Ledgering the Offer after it is queued keeps the ledger from recording an Offer
      that was never sent. One ledgered Offer gives every reader one transfer to answer,
      close or expire (CM-21-014).
    verification: >-
      A test marked `CM-21-029` asserts that the `offer_case_ownership_transfer`
      entry's snapshot is the queued Offer.
    relationships:
    - rel_type: extends
      spec_id: CM-21-028
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-006
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Accept(Offer(VulnerabilityCase))` (ownership-transfer variant)
      MUST address the activity only to the CASE_MANAGER (PCR-08-001), not directly to
      the offerer.
    rationale: >-
      Routing the Accept through the CASE_MANAGER is required for the
      `AcceptCaseOwnershipTransferReceivedUseCase` to run on the authoritative
      CASE_MANAGER and trigger the post-transfer CaseLedgerEntry cascade
      (CM-21-007).  Addressing the Accept to the offerer's inbox means the use
      case only runs there; the CASE_MANAGER never learns of the completed transfer
      and cannot broadcast it.
    verification: Integration tests in `test/demo/` confirm that an ownership-transfer
      `Accept(Offer(VulnerabilityCase))` is addressed to the CASE_MANAGER's inbox.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-005
    adr:
    - ADR-0053
    stories:
    - story_2022_050
  - id: CM-21-007
    priority: MUST
    kind: protocol
    statement: >-
      After the CASE_MANAGER applies the ownership-role changes of an admitted
      ownership-transfer Accept (CM-21-002, CM-21-003, CM-21-004), it MUST commit a
      `CaseLedgerEntry` recording the completed transfer.
    rationale: >-
      The ledger is the record every replica follows (PCR-03-001). Without an entry for
      the completed transfer, no replica can learn from the ledger that the Case Owner
      changed.
    verification: >-
      `test_accept_ownership_transfer_commit_is_role_gated` and
      `test_accept_ownership_transfer_no_double_commit` in
      `test/core/behaviors/case/nodes/test_accept_ownership_transfer_tree.py` assert
      that the CASE_MANAGER commits one entry for the completed transfer.
    relationships:
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-006
    adr:
    - ADR-0053
    stories:
    - story_2022_050
    - story_2022_049
    - story_2022_045
  - id: CM-21-030
    priority: MUST
    kind: protocol
    statement: >-
      After it commits the entry for a completed ownership transfer (CM-21-007), the
      CASE_MANAGER MUST broadcast `Announce(CaseLedgerEntry)` to all case participants.
    rationale: >-
      The `CaseLedgerEntry` broadcast is the only way that participants outside the
      transfer learn that the Case Owner changed. Examples are a Finder or a second
      Vendor. Without it, these participants cannot reliably find the actor that is
      responsible for the case. They then send messages to the wrong actor, and
      coordination fails.
    verification: >-
      `test_a_handoff_verifies_the_transfer_reached_a_non_party_replica` in
      `test/architecture/test_handoff_scenarios_verify_broadcast.py` asserts that each
      handoff scenario checks the transfer reached a replica that took no part in it.
      Integration tests in `test/demo/` confirm the broadcast reaches all case
      participants.
    relationships:
    - rel_type: extends
      spec_id: CM-21-007
    adr:
    - ADR-0053
    stories:
    - story_2022_050
    - story_2022_049
    - story_2022_045
  - id: CM-21-008
    priority: MUST
    kind: protocol
    statement: >-
      When an ownership transfer is processed, the previous owner MUST retain any other
      roles they held (e.g., `COORDINATOR`, `VENDOR`) in their `case_roles`.
    rationale: >-
      Stripping only `CASE_OWNER` (and not other roles) preserves the previous owner's
      standing as a Coordinator, Vendor, or other role while satisfying the at-most-one
      `CASE_OWNER` invariant (CM-21-001).
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer the
      previous owner retains their non-`CASE_OWNER` roles (e.g., `CVDRole.COORDINATOR`) in their
      `CaseParticipant.case_roles`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-003
    stories:
    - story_2022_050
    - story_2022_051
  - id: CM-21-009
    priority: MUST
    kind: protocol
    statement: >-
      When an ownership transfer is processed, the previous owner MUST remain a participant
      in the case.
    rationale: >-
      Ownership transfer is not case departure. The previous owner has institutional
      knowledge of the case and continues to participate; only their administrative
      authority is transferred.
    verification: Integration tests in `test/demo/` confirm that after an ownership transfer the
      previous owner remains in the case participants list.
    relationships:
    - rel_type: refines
      spec_id: CM-21-003
    stories:
    - story_2022_050
    - story_2022_051
  - id: CM-21-010
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Reject(Offer(VulnerabilityCase))` (ownership-transfer variant)
      MUST address the activity only to the CASE_MANAGER (PCR-08-001), not directly to
      the offerer.
    rationale: >-
      Rejection routing must be symmetric with the Accept path (CM-21-006): the
      transfer was proposed to the CASE_MANAGER (CM-21-005), so its rejection must
      be too.  If the transferee's Reject goes only to the offerer, the CASE_MANAGER —
      the authoritative record of ownership — never learns the transfer was
      declined and its view of who owns the case can silently diverge from
      reality.
    note: >-
      This entry governs *addressing* only, mirroring CM-21-005/CM-21-006. What
      the CASE_MANAGER does on receiving the Reject is CM-21-012 and CM-21-013;
      whether the case may be offered again is CM-21-014.
    verification: >-
      Inspection of `vultron/demo/exchange/transfer_ownership_demo.py` confirms that an
      ownership-transfer `Reject(Offer(VulnerabilityCase))` is addressed to the CASE_MANAGER's inbox
      (`to: [case_actor_id]`), symmetric with the Accept path.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-006
    adr:
    - ADR-0053
    stories:
    - story_2022_050
  - id: CM-21-011
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an `Accept(Offer(VulnerabilityCase))`, leaving the
      owner unchanged, unless its sender is the transferee of an unanswered Offer it
      recorded for the case. The owner is the case's `attributed_to` and every
      participant's `CASE_OWNER` role.
    rationale: >-
      Without the match to a recorded, unanswered Offer, a receiver takes the sender of
      the Accept to be the new owner. Then any actor that knows a case id can claim
      ownership at every receiver that holds the case.
    verification: >-
      A test marked `CM-21-011`
      sends the Accept with no pending Offer naming the sender and asserts `REFUSED` with
      the Case Owner unchanged.
    stories:
    - story_2022_035
    - story_2022_050
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-21-002
    adr:
    - ADR-0115
  - id: CM-21-031
    priority: MUST
    kind: protocol
    statement: >-
      A participant replica MUST apply an ownership change only when it comes from the
      CASE_MANAGER (PCR-03-001).
    rationale: >-
      A replica that takes the change only from the CASE_MANAGER keeps one authority for
      the owner of the case (PCR-03-001). A transferee's Accept sent to a replica would
      otherwise move ownership there without the CASE_MANAGER.
    verification: >-
      `test_accept_from_the_transferee_is_refused_at_a_replica` in
      `test/core/use_cases/received/actor/test_ownership.py` asserts that a replica
      refuses the transferee's Accept with the owner unchanged.
    relationships:
    - rel_type: refines
      spec_id: PCR-03-001
    - rel_type: extends
      spec_id: CM-21-011
    adr:
    - ADR-0115
    stories:
    - story_2022_050
  - id: CM-21-012
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER admits an ownership-transfer
      `Reject(Offer(VulnerabilityCase))` under CM-21-013, it MUST commit a
      `CaseLedgerEntry` recording the Reject, as it does for the Accept (CM-21-007).
      From that entry on, the Offer is closed and no longer pending on any replica
      (CM-21-014).
    rationale: >-
      The Offer is ledgered and broadcast (CM-21-029), so every replica holds a transfer
      in progress. A Reject that adds no ledger entry never closes that transfer. The
      offerer does not receive the Reject (CM-21-010), so it never learns of the
      decline. A participant's `Reject` is a case event, as its `Accept` is. It is
      ledgered for the same reason (CLP-02-016).
    verification: >-
      A test marked `CM-21-012` confirms that
      `RejectCaseOwnershipTransferReceivedUseCase` reaches a canonical commit for the
      `reject_case_ownership_transfer` semantic type.
    relationships:
    - rel_type: refines
      spec_id: CM-21-010
    - rel_type: refines
      spec_id: CLP-02-012
    adr:
    - ADR-0053
    stories:
    - story_2022_050
  - id: CM-21-032
    priority: MUST
    kind: protocol
    statement: >-
      After it commits the entry for an admitted ownership-transfer Reject (CM-21-012),
      the CASE_MANAGER MUST broadcast `Announce(CaseLedgerEntry)` to all case
      participants.
    rationale: >-
      The broadcast is how every replica learns the Offer is closed, as it learns of a
      completed transfer (CM-21-030). Without it, replicas keep showing a transfer in
      progress.
    verification: >-
      `test_transferee_reject_is_ledgered_and_broadcast` in
      `test/core/use_cases/received/actor/test_ownership.py` asserts the Reject is
      ledgered and announced to the case participants.
    relationships:
    - rel_type: extends
      spec_id: CM-21-012
    adr:
    - ADR-0053
    stories:
    - story_2022_050
  - id: CM-21-033
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A replica that applies the entry of an ownership-transfer Reject MUST NOT change
      the case's `attributed_to` or any participant's `CASE_OWNER` role. The entry only
      closes the Offer (CM-21-014).
    rationale: >-
      A Reject declines the transfer, so the owner stays who it was. A replica that
      moved any ownership state on the entry would disagree with the CASE_MANAGER about
      who owns the case.
    verification: >-
      `test_reject_entry_is_persisted_and_ownership_unchanged` in
      `test/core/behaviors/sync/test_announce_tree.py` asserts that a replica stores the
      Reject entry and leaves ownership unchanged.
    relationships:
    - rel_type: extends
      spec_id: CM-21-012
    adr:
    - ADR-0053
    stories:
    - story_2022_050
  - id: CM-21-013
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse, with nothing committed or sent, a
      `Reject(Offer(VulnerabilityCase))` whose sender is not the transferee of an open
      Offer it recorded. The Offer then stays pending. CM-21-014 defines when an Offer
      is open, read from the ledger.
    rationale: >-
      The same standing CM-21-011 requires for the Accept. Without it any actor that
      knows an Offer id could close a transfer it is not party to, and the closed
      Offer could no longer be accepted by the transferee it names.
    verification: >-
      A test marked `CM-21-013` sends the Reject from an actor the pending Offer does
      not name and asserts `REFUSED` with an empty outbox and no new
      `CaseLedgerEntry`; a companion test confirms the named transferee's Reject is
      not refused.
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-21-011
    adr:
    - ADR-0115
    stories:
    - story_2022_050
  - id: CM-21-014
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an ownership-transfer proposal (CM-21-005) for a case
      while an ownership-transfer Offer for that case is open, making no Offer from it.
      An Offer is open until the ledger holds an Accept (CM-21-007), Reject (CM-21-012)
      or withdrawal (CM-21-015) entry for it. It is also closed once the `end_time` the
      ledgered Offer carries has passed (CM-21-017).
    rationale: >-
      Two pending Offers would let two transferees accept the same case, and
      CM-21-001 allows one owner. Withdrawal and expiry exist so that a transferee who
      never answers cannot block every later transfer of the case.
    verification: >-
      A test marked `CM-21-014` delivers a second proposal for a case whose first
      Offer is open and asserts it is `REFUSED` with no Offer made.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-005
    - rel_type: refines
      spec_id: CLP-11-001
    adr:
    - ADR-0053
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-034
    priority: MUST
    kind: protocol
    statement: >-
      A reader MUST read whether an ownership-transfer Offer is open from the case
      ledger (CLP-11-001).
    rationale: >-
      Reading "open" from the ledger rather than from local offer records keeps the
      CASE_MANAGER and every replica in agreement (CLP-07-014).
    verification: >-
      Tests marked `CM-21-034` assert that an Offer's open or closed state is read from
      the ledgered entries.
    relationships:
    - rel_type: refines
      spec_id: CLP-11-001
    - rel_type: extends
      spec_id: CM-21-014
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-035
    priority: MUST
    kind: protocol
    statement: >-
      Once a case's ownership-transfer Offer is closed, the CASE_MANAGER MUST admit a
      new proposal for the case, to any transferee, with no waiting period. This
      includes the transferee that declined, and nothing has to be cleared first. A
      redelivered proposal whose Offer the ledger already records is not a new proposal:
      it changes nothing (HP-01-003).
    rationale: >-
      A decline does not bar a later offer, so no memory of who declined is needed. A
      closed Offer no longer blocks the case (CM-21-014), so the owner can try again at
      once.
    verification: >-
      Tests marked `CM-21-035` assert that a new proposal is admitted once the first
      Offer is closed by an answer, a Reject, a withdrawal or its deadline.
    relationships:
    - rel_type: extends
      spec_id: CM-21-014
    adr:
    - ADR-0053
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-015
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER admits the proposing Case Owner's
      `Undo(Offer(Offer(VulnerabilityCase)))`, it MUST commit a `CaseLedgerEntry`
      recording the withdrawal. The entry closes the Offer the CASE_MANAGER made from
      that proposal.
    rationale: >-
      Without a withdrawal, one open Offer per case (CM-21-014) lets a transferee
      who never answers block every later transfer of the case. Ledgering the
      withdrawal tells the transferee and every replica that the Offer can no
      longer be accepted, the same way the Reject entry does (CM-21-012).
    verification: >-
      A test marked `CM-21-015` delivers the owner's `Undo` of its proposal and
      asserts the CASE_MANAGER ledgers the withdrawal, which closes the Offer it
      made from that proposal.
    relationships:
    - rel_type: refines
      spec_id: CM-21-014
    - rel_type: refines
      spec_id: CLP-02-012
    adr:
    - ADR-0053
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-036
    priority: MAY
    kind: protocol
    statement: >-
      The proposing Case Owner MAY withdraw the Offer made from its proposal while that
      Offer is open (CM-21-014), by sending the CASE_MANAGER
      `Undo(Offer(Offer(VulnerabilityCase)))`.
    rationale: >-
      The owner names its own proposal, the one activity of the transfer it holds, so
      it needs nothing it learned from the ledger to withdraw (ADR-0148).
    relationships:
    - rel_type: extends
      spec_id: CM-21-015
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-037
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST resolve the Offer that an owner's Undo withdraws by the id
      it derived for that Offer from the proposal (CM-21-028).
    rationale: >-
      The owner names only its proposal. The derived id links the proposal to the one
      Offer made from it, so the CASE_MANAGER closes that Offer and no other.
    verification: >-
      A test marked `CM-21-037` asserts that the Undo of a proposal closes the Offer
      made from it.
    relationships:
    - rel_type: extends
      spec_id: CM-21-015
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-038
    priority: MUST
    kind: protocol
    statement: >-
      After it commits a withdrawal entry (CM-21-015), the CASE_MANAGER MUST broadcast
      `Announce(CaseLedgerEntry)` to all case participants.
    rationale: >-
      The broadcast is how the transferee and every replica learn that the Offer can no
      longer be accepted.
    verification: >-
      `test_offerer_withdrawal_is_ledgered_and_broadcast` in
      `test/core/use_cases/received/actor/test_ownership.py` asserts that the
      withdrawal is ledgered and announced to the case participants.
    relationships:
    - rel_type: extends
      spec_id: CM-21-015
    adr:
    - ADR-0053
    stories:
    - story_2022_050
  - id: CM-21-039
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse, with nothing committed or sent, an
      ownership-transfer Undo from any sender but the proposing owner, or for a closed
      Offer.
    rationale: >-
      Only the owner that proposed the transfer may withdraw it. An Undo of a closed
      Offer has nothing left to close, so recording it would add an entry that changes
      nothing.
    verification: >-
      Tests marked `CM-21-039` deliver an Undo from a non-offerer and an Undo of an
      answered or withdrawn Offer, and assert each is refused with no entry and nothing
      sent.
    relationships:
    - rel_type: extends
      spec_id: CM-21-015
    adr:
    - ADR-0115
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-016
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a late Accept or Reject of an ownership-transfer
      Offer, with no role change and no ledger entry for the answer. An answer is late
      when the CASE_MANAGER processes it after the Offer's `end_time`. That `end_time`
      is the deadline to answer: the instant after which the Offer can no longer be
      accepted or rejected.
    rationale: >-
      An embargo deadline is a strong suggestion, so participants may still answer
      late (CM-28-001). A transfer deadline has to hold, so that the offerer, the
      transferee and every other participant know who decides for the case once it
      passes. `end_time` keeps the meaning CM-28-001 gives it on an Invite — the
      deadline to answer — so it adds no new meaning to the field.
    verification: >-
      A test marked `CM-21-016` delivers an Accept for an Offer whose `end_time`
      has passed and asserts it is `REFUSED` and the Case Owner is unchanged.
    relationships:
    - rel_type: refines
      spec_id: CM-21-011
    - rel_type: refines
      spec_id: CM-21-013
    adr:
    - ADR-0053
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-040
    priority: MAY
    kind: protocol
    statement: >-
      An ownership-transfer `Offer(VulnerabilityCase)` MAY carry an activity-level
      `end_time`. An Offer without one stays open until it is answered or withdrawn
      (CM-21-014).
    rationale: >-
      An owner may want the transfer settled by a date, or may leave it open. A deadline
      lets a transfer end without an answer (CM-21-017).
    relationships:
    - rel_type: extends
      spec_id: CM-21-016
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-041
    priority: MUST
    kind: protocol
    statement: >-
      When the inner Offer of the owner's proposal carries an `end_time`, the
      CASE_MANAGER MUST copy it onto the Offer it makes (CM-21-028).
    rationale: >-
      The deadline is the owner's choice, stated in its proposal. The Offer the
      transferee answers is the CASE_MANAGER's, so the deadline must travel onto it.
    verification: >-
      A test marked `CM-21-041` asserts that the made Offer carries the proposal's
      `end_time`.
    relationships:
    - rel_type: extends
      spec_id: CM-21-016
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-042
    priority: MUST
    kind: project
    statement: >-
      The wire layer MUST normalise an ownership-transfer Offer's `end_time` to UTC at
      the wire edge (CS-13-001, ADR-0032).
    rationale: >-
      The deadline is compared with the CASE_MANAGER's clock. A time with an offset, or
      none, compared without normalising could move the deadline by hours.
    verification: >-
      `test_ownership_offer_deadline_is_normalised_to_utc_at_the_edge` in
      `test/wire/as2/test_extractor.py` asserts that the extracted deadline is in UTC.
    relationships:
    - rel_type: refines
      spec_id: CS-13-001
    - rel_type: extends
      spec_id: CM-21-016
    - rel_type: refines
      spec_id: CS-13-009
    adr:
    - ADR-0032
  - id: CM-21-017
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER, never a replica, MUST evaluate ownership-transfer Offer expiry,
      lazily, from the ledgered Offer's `end_time` and its own clock, behind its role
      gate (BT-17-001). Lazily means when it processes an Accept, Reject or Undo of the
      Offer, or a new proposal for the case, with no scheduler. An Offer past its
      `end_time` is closed: a late answer is refused (CM-21-016), an Undo is refused
      (CM-21-039) and a new proposal admitted (CM-21-035).
    rationale: >-
      Expiry evaluated in one place keeps the decision about a late answer with
      the actor that judges answers. Lazy evaluation needs no timer, and the next
      act on the case is the first moment the expiry matters. Unlike an embargo
      Invite's expiry, which moves a consent row (CM-28-009), an Offer's expiry
      changes no case-file record.
    verification: >-
      Tests in `test/core/use_cases/received/actor/test_ownership_deadline.py` assert a
      late Accept, Reject or Undo of an expired Offer is refused, and that a replica
      never evaluates the Offer's deadline.
    relationships:
    - rel_type: refines
      spec_id: CM-21-014
    - rel_type: refines
      spec_id: CM-21-016
    adr:
    - ADR-0053
    - ADR-0152
    stories:
    - story_2022_050
  - id: CM-21-043
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT commit a ledger entry or send an activity to record an
      ownership-transfer Offer's expiry (ADR-0152).
    rationale: >-
      The expiry is an observation, not an act. Anything that holds the case and its
      ledger can read the deadline from the Offer, and no receiver changes on it. An
      expiry entry would record a fact every holder of the ledger can already derive,
      so it would be noise on the wire and in the ledger (ADR-0152).
    verification: >-
      `test_new_offer_after_an_expired_one_ledgers_no_expiry` in
      `test/core/use_cases/received/actor/test_ownership.py` and
      `test_an_offer_past_its_end_time_is_closed_with_no_entry` in
      `test/core/participants/test_ownership_offer.py` assert that no entry or
      activity records the expiry.
    relationships:
    - rel_type: extends
      spec_id: CM-21-017
    adr:
    - ADR-0152
    stories:
    - story_2022_050
  - id: CM-21-019
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an ownership-transfer proposal (CM-21-005), writing
      nothing, unless its sender holds `CASE_OWNER` on the case when the proposal is
      processed. Writing nothing means no ledger commit, no Offer made, and the case's
      `attributed_to` and every `CASE_OWNER` role unchanged. A redelivered proposal the
      CASE_MANAGER already made its Offer from keeps the standing it was admitted with
      (HP-01-003).
    rationale: >-
      CM-21-011 admits an Accept from the transferee of a recorded Offer. Thus the actor
      that gets an Offer recorded chooses the next owner. Without a sender rule, any
      actor that knows a case id can propose the case to itself and accept it, even from
      outside the roster. Only the Case Owner has the authority to transfer the case
      (CM-02-005). The redelivery clause makes a late copy of an answered proposal a
      duplicate, not a refusal, after its sender transfers ownership.
    verification: >-
      A test marked `CM-21-019` delivers a proposal from an actor off the roster and
      from a participant without `CASE_OWNER` to the CASE_MANAGER and asserts each
      is `REFUSED` with no ledger entry, no Offer made and the owner unchanged; a
      test confirms such a proposal is refused even when an earlier Offer has
      expired.
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-21-005
    - rel_type: refines
      spec_id: CM-21-011
    adr:
    - ADR-0115
    - ADR-0129
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-044
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse every ownership-transfer `Offer(VulnerabilityCase)`
      it receives, from any sender. It makes that Offer itself (CM-21-028).
    rationale: >-
      An Offer the CASE_MANAGER admitted from another sender would be a second Offer
      for the transfer, under an id it did not derive, and would bypass the owner's
      proposal and its sender rule (CM-21-019).
    verification: >-
      A test marked `CM-21-044` sends an `Offer(VulnerabilityCase)` to the CASE_MANAGER
      and asserts it is refused.
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: extends
      spec_id: CM-21-019
    adr:
    - ADR-0115
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-045
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant replica MUST NOT admit an ownership-transfer proposal (CM-21-005).
    rationale: >-
      A proposal is sent to the CASE_MANAGER alone (CM-21-005). A replica that admitted
      one would act for the CASE_MANAGER, which only the CASE_MANAGER may do.
    verification: >-
      `test_own_copy_is_refused_by_the_sender_guard` in
      `test/core/use_cases/received/actor/test_ownership.py` asserts that a replica
      refuses the owner's own copy of its proposal and writes nothing.
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: extends
      spec_id: CM-21-019
    adr:
    - ADR-0115
    stories:
    - story_2022_050
  - id: CM-21-046
    priority: MUST
    kind: protocol
    statement: >-
      A participant replica MUST take an ownership-transfer Offer only from the case's
      CASE_MANAGER (PCR-03-001), refusing it before anything is written. A replica that
      holds no such case, or whose case names no CASE_MANAGER, has none to recognise,
      so it refuses the Offer.
    rationale: >-
      The CASE_MANAGER makes the one Offer of a transfer (CM-21-028). An Offer from any
      other sender is not that Offer, and a replica that took it would hold a transfer
      the CASE_MANAGER never offered.
    verification: >-
      Tests marked `CM-21-046` assert that the transferee takes the CASE_MANAGER's
      Offer and refuses an Offer from any other sender, or when it holds no case.
    relationships:
    - rel_type: refines
      spec_id: PCR-03-001
    - rel_type: extends
      spec_id: CM-21-019
    adr:
    - ADR-0115
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-021
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an ownership-transfer proposal (CM-21-005) whose
      transferee may not act on the case, with no ledger commit and no Offer made. A
      transferee may act when it is an active participant (CM-10-004) whose closure the
      case's ledger does not record (CM-23-018). An owner that means to transfer a case
      to an actor not active in it invites that actor first.
    rationale: >-
      The new owner administers the case, its active embargo included, so it must
      first have agreed to that embargo and be entitled to the case content, as joining
      requires. An active participant holds the case, which is also what lets the Offer
      name the case by reference rather than carry it (ADR-0165). `CASE_OWNER` is held
      on a participant record (CM-21-002), so only a transferee with one can end the
      transfer as the single owner CM-21-001 requires. A closed participant stays
      active by CM-10-004, but it receives no further case content (CM-23-004) and may
      not act on the case (CM-23-018), so it cannot take the case on. The test is the
      one every sender guard and case-content selection uses, `may_act_on_case` in
      `vultron/core/participants/recipients.py`.
    verification: >-
      Tests marked `CM-21-021` deliver to the CASE_MANAGER a proposal naming an actor
      off the roster, an invitee that has not accepted, a removed participant, a
      participant that is not a signatory to the active embargo and a closed
      participant, and assert each is `REFUSED` with no ledger entry and no Offer made.
    relationships:
    - rel_type: refines
      spec_id: CM-21-005
    - rel_type: depends_on
      spec_id: CM-10-004
    adr:
    - ADR-0148
    stories:
    - story_2022_050
  - id: CM-21-022
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse, with ownership unchanged, the transferee's
      `Accept(Offer(VulnerabilityCase))` (CM-21-011) when the transferee may no longer
      act on the case (CM-21-021) as the Accept is processed. Ownership unchanged means
      the case's `attributed_to` and every participant's `CASE_OWNER` role stay as they
      were.
    rationale: >-
      The proposal check (CM-21-021) runs when the Offer is made. A participant can be
      removed, lapse by an embargo revision, or close between the Offer and its answer,
      so the Accept is checked again with the same test, `may_act_on_case`. A closed
      transferee's Accept is also refused by its sender check (CM-23-018).
    verification: >-
      Tests marked `CM-21-022` let the transferee stop being an active participant
      between the Offer and its Accept and assert the Accept is `REFUSED` with the owner
      unchanged; a test asserts that no admitted Accept leaves the case with no
      participant holding `CASE_OWNER`.
    relationships:
    - rel_type: refines
      spec_id: CM-21-011
    - rel_type: refines
      spec_id: CM-21-021
    adr:
    - ADR-0148
    stories:
    - story_2022_050
- id: CM-22
  title: CASE_MANAGER-Authoritative Case Creation
  description: >-
    Requirements on the CASE_MANAGER's obligations when accepting a CaseProposal,
    per ADR-0041.  These replace the receiver-authored case-creation described in
    ADR-0015 and govern how the CASE_MANAGER initializes CaseStatus, participants,
    and embargo in its DataLayer before emitting `Create(VulnerabilityCase)`.
  specs:
  - id: CM-22-001
    priority: MUST
    kind: protocol
    statement: >-
      When it accepts a `Create(CaseProposal)`, the CASE_MANAGER MUST create the
      `VulnerabilityCase` in its own store, with `attributed_to` the proposing actor's
      ID (the CASE_OWNER, CM-02-008).
    rationale: >-
      ADR-0041 supersedes ADR-0015.  The CASE_MANAGER is the case's authoritative
      creator. `attributed_to` records the Case Owner, which ownership checks
      read and ownership transfer rewrites (MSM-07-027, CM-21-024).
    verification: >-
      Integration tests in `test/demo/` confirm that the `VulnerabilityCase` created by
      the CASE_MANAGER has `attributed_to` equal to the proposing actor's ID.
    relationships:
    - rel_type: implements
      spec_id: CP-09-001
    - rel_type: supersedes
      spec_id: CM-14-001
      note: In multi-actor deployments, where the CASE_MANAGER creates the case (ADR-0041)
    adr:
    - ADR-0041
    stories:
    - story_2022_012
    - story_2022_046
    lint_suppress:
    - dangling_adr_ref
  - id: CM-22-005
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST be the `actor` of the `Create(VulnerabilityCase)` it emits
      for a case it creates from a proposal (CM-22-001).
    rationale: >-
      AS2 records the authoritative creator of an object as the `actor` of its `Create`
      (ADR-0023). The CASE_MANAGER creates the case, so it is that `actor`, while
      `attributed_to` names the owner.
    verification: >-
      `test_create_is_by_the_case_manager_about_an_owner_attributed_case` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts that the
      emitted `Create(VulnerabilityCase)` has the CASE_MANAGER as `actor`.
    relationships:
    - rel_type: extends
      spec_id: CM-22-001
    adr:
    - ADR-0023
    - ADR-0041
    stories:
    - story_2022_012
    - story_2022_046
  - id: CM-22-006
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST address that `Create(VulnerabilityCase)` (CM-22-005) to the
      report receiver, the CASE_OWNER, only. The report receiver introduces the
      CASE_MANAGER to the reporter (CBT-01-001, ADR-0132).
    rationale: >-
      The report receiver proposed the case and owns it. The reporter has not yet met
      the CASE_MANAGER, so the report receiver introduces it (ADR-0132), and a `Create`
      sent to the reporter first would come from an actor it does not know.
    verification: >-
      `test_case_manager_create_is_addressed_to_the_owner_only` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts that the
      `Create(VulnerabilityCase)` is addressed to the report receiver only.
    relationships:
    - rel_type: extends
      spec_id: CM-22-005
    adr:
    - ADR-0132
    stories:
    - story_2022_012
    - story_2022_046
  - id: CM-22-002
    priority: MUST
    kind: protocol
    statement: >-
      After it creates the `VulnerabilityCase`, the CASE_MANAGER MUST create
      `CaseParticipant` records for at least the report receiver (`CASE_OWNER`,
      `RM.RECEIVED`) and the reporter (`RM.ACCEPTED`).
    rationale: >-
      The report receiver and the reporter are the case's first participants. Without
      their records, role-guard checks find no Case Owner and no reporter in the case
      (CP-09-002, CP-09-004).
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER writes
      `CaseParticipant` records for the report receiver and reporter to its DataLayer.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-002
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-22-007
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST write the participant records of CM-22-002 before it emits
      `Create(VulnerabilityCase)` to the report receiver.
    rationale: >-
      The `Create(VulnerabilityCase)` payload embeds participants inline so the
      receiver's `store_embedded_participants` can seed
      its local replica.  Absent participant records at emission time produce an
      empty replica and break role-guard checks (CP-09-002, CP-09-004).
    verification: >-
      `test_the_create_carries_the_participants_written_before_it` in
      `test/core/behaviors/case/test_case_proposal_received_tree.py` asserts that
      the queued `Create(VulnerabilityCase)` carries the owner's and the reporter's
      participant records.
    relationships:
    - rel_type: extends
      spec_id: CM-22-002
    stories:
    - story_2022_012
    - story_2022_013
  - id: CM-22-003
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit every canonical ledger entry for case initialization
      natively in its own ledger, never authored by the report receiver and back-filled.
      The entries are `create_case`, `create_embargo_event`, `add_report_to_case`, the
      participant-record and participant-status entries, and `add_case_status_to_case`.
    rationale: >-
      The ledger of the CASE_MANAGER is the authority for case state (CLP-07-003). Only
      the store that holds the canonical ledger may assign its indexes and extend its
      hash chain. An entry that the report receiver writes and then copies in gives the
      case a second writer. Its ids, times and chain positions then come from outside
      the CASE_MANAGER. Replicas that copy the ledger then cannot agree on the first
      entries of the case.
    verification: Inspection of `vultron/core/` confirms that the canonical initialization
      ledger entries (`create_case`, `create_embargo_event`, `add_report_to_case`,
      participant-record and participant-status entries, `add_case_status_to_case`)
      are authored by the
      CASE_MANAGER, not the report receiver.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    stories:
    - story_2022_045
  - id: CM-22-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST initialize the default embargo for the new case before
      emitting `Create(VulnerabilityCase)` to the report receiver (the CASE_OWNER).
    rationale: >-
      Embargo state is protocol-significant.  Deferring initialization to the
      report receiver or to a later message would produce a window in which
      embargo-gated operations are undefined (ADR-0041, CP-09-003).  The
      CASE_MANAGER is the only actor that can initialize it authoritatively at
      case creation; the actor default it applies is the CASE_OWNER's policy,
      carried on the proposal (CP-01-009, CP-01-010).
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER initializes the
      default embargo before emitting `Create(VulnerabilityCase)` to the report receiver.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-003
    adr:
    - ADR-0041

    stories:
    - story_2022_014
    - story_2022_023
- id: CM-23
  title: RM Case Closure via Leave(VulnerabilityCase)
  description: >-
    Requirements for the canonical RM case closure path: Leave(VulnerabilityCase)
    is the sole mechanism for advancing a participant's RM state to CLOSED.
    An Add(ParticipantStatus) whose status carries rmState=CLOSED is not a valid
    closure trigger.
    See ADR-0050 (Leave is canonical for RM closure) and ADR-0051
    (CASE_MANAGER RM lifecycle).

    Decided: the maintainer decided the closure semantics in CM-23-002, CM-23-013
    and CM-23-014 (what the owner's close does to pending Invites and to later
    Leaves) on 2026-10-12. ADR-0085 sets the owner-close write boundary.
    ADR-0131 sets the CM-23-013 reply to late traffic: by default it is dropped,
    and only a late Leave may get an as:Reject (#4065). The CM-23-014 settle step
    is #4066 (PR #4489).
  specs:
  - id: CM-23-001
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST close a participant's RM state only in response to a
      Leave(VulnerabilityCase), never to a participant-sent Add(ParticipantStatus)
      whose status carries rmState=CLOSED. Its ledger commits are the authority for
      the closure.
    rationale: >-
      The Leave round trip makes the CASE_MANAGER the authority for closure. It also
      prevents false departures that lost messages cause. A participant cannot silently
      reach `RM.CLOSED` at its peers unless the CASE_MANAGER commits and broadcasts a
      ledger entry (ADR-0108). See ADR-0050.
    verification: Integration tests in `test/demo/` confirm that RM closure flows through
      `Leave(VulnerabilityCase)` -> CASE_MANAGER ledger commit -> broadcast, and that
      `Add(ParticipantStatus)` whose status carries `rmState=CLOSED` is not used as a
      closure trigger.
    adr:
    - ADR-0050
    - ADR-0108
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-021
    priority: MUST
    kind: protocol
    statement: >-
      On a Leave(VulnerabilityCase), the CASE_MANAGER MUST commit a close_case entry
      that records the received Leave.
    rationale: >-
      The close_case entry is the ledger's record that the participant asked to leave.
      Every replica learns of the departure from it, and the closure steps that follow
      are its recorded consequence (CLP-07-001, CLP-07-002, CLP-07-003).
    verification: >-
      `test_non_owner_leave_from_valid_commits_two_steps` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that a
      Leave commits the close_case entry before its status entries.
    relationships:
    - rel_type: extends
      spec_id: CM-23-001
    adr:
    - ADR-0050
    - ADR-0108
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-022
    priority: MUST
    kind: protocol
    statement: >-
      After the close_case entry, the CASE_MANAGER MUST commit one
      add_participant_status_to_participant entry per RM transition it writes for the
      leaver, in write order. A Leave from RM.VALID, recorded V → D → C (CM-23-012),
      gives two entries.
    rationale: >-
      These status entries are the Leave's recorded consequence. The CASE_MANAGER writes
      them as its own RM writes for the leaving participant (CLP-07-001, CLP-07-002,
      CLP-07-003). The ledger records each change when the CASE_MANAGER makes it. Thus a
      replica applies changes and cannot add a step that no entry supports (ADR-0114,
      ADR-0124).
    verification: >-
      `test_non_owner_leave_from_valid_commits_two_steps` and
      `test_owner_leave_orders_every_entry_before_the_boundary` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that a
      Leave from RM.VALID commits the close_case entry and then a VALID -> DEFERRED and
      a
      DEFERRED -> CLOSED status entry, in that order.
    relationships:
    - rel_type: extends
      spec_id: CM-23-021
    adr:
    - ADR-0108
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-023
    priority: MUST
    kind: protocol
    statement: >-
      A replica that still receives case content (CM-23-004) MUST move a leaving
      participant to RM.CLOSED only by applying the ledger's status entries, in ledger
      order.
    rationale: >-
      The status entries reach the replica in the Announce(CaseLedgerEntry) fan-out. A
      replica that works out a closure path from its own stored state can write an RM
      step the ledger never recorded, so it diverges from the CASE_MANAGER (ADR-0114,
      ADR-0124).
    verification: >-
      `test_replica_closes_the_leaver_from_the_ledger`,
      `test_replica_history_equals_the_case_managers`,
      `test_replica_refusing_a_step_writes_no_step_of_its_own` and
      `test_lagging_replica_writes_no_step_the_ledger_lacks` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that a
      replica which accepts each status entry ends with the same per-actor status
      history as the CASE_MANAGER, and that a replica whose participant-status effect
      refuses an entry (RSH-09-006) logs a WARNING and still writes no step of its own.
      `test/architecture/test_replica_never_walks_rm_closure_path.py` asserts no ledger
      replay node walks the closure path.
    relationships:
    - rel_type: extends
      spec_id: CM-23-022
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-024
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A replica applying a close_case entry MUST NOT change any participant's RM state
      from that entry.
    rationale: >-
      The close_case entry records the request to leave. The status entries after it
      carry the RM steps (CM-23-022). If the close_case entry moved RM state too, a
      replica would write a step that no status entry records.
    verification: >-
      `test_close_case_entry_alone_changes_no_rm_state` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` and in
      `test/core/behaviors/sync/test_announce_tree.py` asserts that applying the
      close_case entry alone changes no participant's RM state.
    relationships:
    - rel_type: extends
      spec_id: CM-23-021
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-025
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST take back each RM transition, the leaver's or its own, whose
      status entry for a Leave did not commit (CLP-07-013).
    rationale: >-
      A status entry that cannot be committed leaves its RM transition unwritten. If the
      CASE_MANAGER kept the transition, its RM state would be ahead of the ledger that
      the replicas copy (ADR-0146).
    verification: >-
      `test_failed_step_commit_leaves_the_case_file_unchanged`,
      `test_a_later_step_failing_takes_back_the_committed_one` and
      `test_a_raise_while_building_a_step_entry_takes_the_steps_back` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that a
      status entry whose commit is forced to fail leaves the CASE_MANAGER's participant
      record and status records unchanged.
    relationships:
    - rel_type: extends
      spec_id: CM-23-022
    adr:
    - ADR-0146
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-026
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT report a Leave as applied while any status entry for it
      failed to commit.
    rationale: >-
      A Leave reported as applied tells the sender that its departure is on the ledger.
      If a status entry did not commit, that is false, and a redelivery of the Leave
      would not walk the closure again.
    verification: >-
      `test_a_refused_step_keeps_none_of_the_closure`,
      `test_failed_step_commit_leaves_the_case_file_unchanged` and
      `test_a_redelivered_leave_completes_the_withdrawn_closure` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that a
      failed status entry leaves the Leave not applied, and that a redelivery then
      completes the closure.
    relationships:
    - rel_type: extends
      spec_id: CM-23-025
    adr:
    - ADR-0146
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-002
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives Leave(VulnerabilityCase) from the Case Owner, it
      MUST run the following steps in order. Step (0): it commits the close_case entry
      recording the Leave (CLP-10-006), then expires every embargo Invite still awaiting
      a reply (CM-23-014). Step (1): it advances the Case Owner participant to
      RM.CLOSED, with one status entry per RM transition, in order (CM-23-022). Step
      (2): it advances its own CaseParticipant to RM.CLOSED in the same way (CM-23-005).
      In each step it fans each entry out to every active participant whose closure the
      ledger does not already record (CM-10-004, CM-23-004).
      The owner-close write boundary (ADR-0085) is the CASE_MANAGER's own status entry
      reaching RM.CLOSED. It is the last entry of step (2), or of step (1) when the Case
      Owner is the CASE_MANAGER itself. Once the ledger holds it, the case is fully
      closed, and no later entry records an external participant's act (CM-23-013).
    rationale: >-
      The Case Owner's departure is the authoritative termination event for a case.
      The CASE_MANAGER's own RM.CLOSED is the last thing the closure changes, so its
      entry marks the boundary. See ADR-0050, ADR-0051, ADR-0085.
    verification: >-
      Integration tests in `test/demo/` confirm that a Case Owner's
      `Leave(VulnerabilityCase)` triggers the closure sequence: the `close_case`
      entry, the pending-Invite expiries, the Case Owner's status entries, then
      the CASE_MANAGER's own status entries, the one reaching RM.CLOSED last, in that
      order, fanned out to every
      active participant whose closure the ledger does not already record.  Unit
      tests in `test/core/use_cases/received/test_close_case_role_semantics.py`
      confirm that the ledger holds no entry after the CASE_MANAGER's own
      RM.CLOSED status entry.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
    - ADR-0051
    - ADR-0085
    - ADR-0114
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-027
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT commit a separate entry that marks a case's closure.
    rationale: >-
      The CASE_MANAGER's own RM.CLOSED status entry already marks the boundary
      (CM-23-002). A marker entry records nothing that a replica does not already hold,
      because every holder of the ledger could derive it (ADR-0152).
    verification: >-
      `test_no_node_commits_a_closure_marker` in
      `test/core/behaviors/case/test_receive_close_case_tree.py` asserts that no node of
      the close-case tree commits a closure-marker entry.
    relationships:
    - rel_type: extends
      spec_id: CM-23-002
    adr:
    - ADR-0152
    stories:
    - story_2022_066
  - id: CM-23-028
    priority: MUST
    kind: project
    statement: >-
      Every check of the owner-close write boundary (CM-23-002) in this codebase MUST
      use one shared predicate, keyed on the CASE_MANAGER's own RM.CLOSED status entry.
    rationale: >-
      If each check computed the boundary for itself, two checks could disagree on
      whether a case is fully closed. Then one path could refuse an act that another
      path records. The predicate lives in `vultron/core/predicates/case_closure.py`.
    verification: >-
      `test/core/predicates/test_case_closure.py` asserts that the shared predicate keys
      on the CASE_MANAGER's own RM.CLOSED status entry and reads an exported ledger. The
      received-tree guard (`vultron/core/behaviors/case/nodes/post_close.py`) and the
      CI invariant (`test/ci/invariants/common.py`) both call it.
    relationships:
    - rel_type: implements
      spec_id: CM-23-002
    adr:
    - ADR-0085
  - id: CM-23-029
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A ledger consumer MUST NOT treat the owner-close boundary entry as the case's
      highest logIndex, or as proof that a replica holds the whole ledger.
    rationale: >-
      ADR-0085's boundary refuses external participants' appends, not the
      CASE_MANAGER's own housekeeping. Thus a consumer that stopped reading at the
      boundary could miss an entry that the CASE_MANAGER writes later. The guarantee is
      the boundary, not chain finality.
    verification: >-
      `test_post_close_invariant_allows_the_case_managers_own_entries` in
      `test/ci/invariants/test_common.py` asserts that the post-close invariant accepts
      a CASE_MANAGER entry after the boundary.
    relationships:
    - rel_type: extends
      spec_id: CM-23-002
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-003
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives Leave(VulnerabilityCase) from a non-owner
      participant while the case is open, it MUST advance only that participant's RM
      state to RM.CLOSED. It records the departure as CM-23-021 and CM-23-022 require:
      the close_case entry first (CLP-10-006), then one status entry per RM transition,
      in order. A non-owner Leave that arrives after owner close falls under CM-23-013.
    rationale: >-
      Non-owner departure is a participant-scoped event, not a case termination
      event.  Treating a non-owner Leave identically to an owner Leave would
      prematurely close the case and violate the Case Owner's authority over the
      case lifecycle.  See ADR-0050.
    verification: Integration tests in `test/demo/` confirm that a non-owner
      `Leave(VulnerabilityCase)` advances only that participant's RM state to RM.CLOSED.
      Unit tests confirm that the
      `close_case` entry precedes one status entry per RM transition, that a replica
      applying them writes no step of its own, and that a leaver at RM.RECEIVED or
      RM.START (S -> R -> C) is recorded the same way.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-030
    priority: MUST
    kind: protocol
    statement: >-
      When a non-owner participant leaves an open case, the CASE_MANAGER MUST keep the
      case open for the remaining participants.
    rationale: >-
      Only the Case Owner's Leave ends the case (CM-23-002). A non-owner Leave ends one
      participant's part in it, and the other participants still coordinate.
    verification: >-
      `test_non_owner_leave_does_not_close_owner` and
      `test_non_owner_leave_does_not_close_case_actor` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that a
      non-owner Leave leaves the Case Owner and the CASE_MANAGER open, so the case stays
      open for the remaining participants.
    relationships:
    - rel_type: extends
      spec_id: CM-23-003
    adr:
    - ADR-0050
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT send any case content to a participant whose closure an
      earlier ledger entry records, except as CM-23-031, CM-31-009 and CM-31-030
      allow. That entry
      is the participant's status entry with rmState=CLOSED. Case content is
      CaseLedgerEntry announcements, Announce(VulnerabilityCase), status broadcasts and
      embargo announcements. A participant that has left receives no entry after those
      that record its departure, the CASE_MANAGER's own closure included.
    note: >-
      Each participant's closure is verified in the CASE_MANAGER's own store, not in
      any participant's replica.
    rationale: >-
      `RM.CLOSED` is the participant's own statement that it stops its work on the case,
      possibly while the case is still open. Its replication process is then assumed to
      have stopped, as the CASE_MANAGER's is once the case is fully closed (CM-23-013).
      A closed participant receives no more content, so it does not see embargoed
      material after it leaves. Only the ledger advances a replica, so a closed replica
      does not converge on later closures, by design.
    verification: >-
      Unit tests on the shared recipient selection in
      `test/core/participants/test_recipients.py` assert a participant whose
      closure the ledger records is left out of every case-content send except the
      entries recording its own closure.  Integration tests in `test/demo/` confirm
      that `Announce(CaseLedgerEntry)` fan-out skips a participant once a ledger
      entry has recorded its `rmState=CLOSED`, that the leaving participant's
      replica does not receive the CASE_MANAGER's own
      later closure entries, and that the CASE_MANAGER's store holds every
      participant at RM.CLOSED.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    - rel_type: refines
      spec_id: CM-10-004
    - rel_type: refines
      spec_id: CM-31-009
    adr:
    - ADR-0114
    - ADR-0050
    stories:
    - story_2022_068
  - id: CM-23-031
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST send each entitled leaver the entries that record its own
      closure, chosen by their subject, not by the leaver's status. These are the
      close_case entry and each status entry after it, up to the one reaching RM.CLOSED
      (CM-23-021, CM-23-022). They never widen entitlement (CM-10-004): an inert or
      removed leaver is not sent them.
    rationale: >-
      The entries that record a participant's own closure come before it stops, so its
      replica still receives every step, the one that reaches RM.CLOSED included. The
      leaver's status is already RM.CLOSED when the last of them is fanned out. Thus a
      choice by status would withhold that last step.
    verification: >-
      `test_leaver_receives_the_entries_recording_its_own_closure`,
      `test_own_closure_entries_never_widen_entitlement` and
      `test_a_slash_spelled_leave_still_records_the_leavers_own_closure` in
      `test/core/participants/test_recipients.py`, and
      `test_the_leaver_receives_every_step_entry` and
      `test_closed_owner_receives_its_own_closure_and_nothing_after` in
      `test/core/use_cases/received/test_close_case_role_semantics.py`, assert that the
      leaver's replica receives the `close_case` entry and every status entry up to and
      including the one that reaches `RM.CLOSED`, and that an inert leaver receives
      none.
    relationships:
    - rel_type: refines
      spec_id: CM-23-004
    - rel_type: uses_definition
      spec_id: CM-10-004
    adr:
    - ADR-0114
    - ADR-0050
    stories:
    - story_2022_068
  - id: CM-23-032
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A closing participant MUST NOT write its own RM.CLOSED to its replica in place of
      the CASE_MANAGER's closure entries (CM-23-031).
    rationale: >-
      The CASE_MANAGER writes the leaver's closure and commits each step (CM-23-022).
      A participant that wrote its own RM.CLOSED would hold a step that no ledger entry
      records, and its replica would diverge from the CASE_MANAGER (ADR-0114).
    verification: >-
      `test_leavers_replica_closes_only_from_what_it_is_sent` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that the
      leaver's replica reaches RM.CLOSED only from the closure entries it is sent.
    relationships:
    - rel_type: extends
      spec_id: CM-23-031
    adr:
    - ADR-0114
    - ADR-0050
    stories:
    - story_2022_068
  - id: CM-23-005
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST track its own RM lifecycle on a CaseParticipant record,
      through RM.RECEIVED, RM.VALID and RM.ACCEPTED during case initialization and
      RM.CLOSED on owner Leave.
    rationale: >-
      Uniform RM lifecycle tracking across all participants (including the
      coordinator) enables case-level RM state to be read consistently from
      the ledger without special-casing the CASE_MANAGER.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that the CASE_MANAGER holds its own
      `CaseParticipant` record that advances through RM states.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    adr:
    - ADR-0051
    stories:
    - story_2022_088
    - story_2022_074
  - id: CM-23-033
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record each transition of its own RM state as a
      CaseLedgerEntry.
    rationale: >-
      A ledger entry for each of the CASE_MANAGER's own RM transitions lets every
      replica read its RM lifecycle from the ledger, the same way as any other
      participant's. Its own RM.CLOSED entry is also the owner-close write boundary
      (CM-23-002). See ADR-0051.
    verification: >-
      `test_owner_leave_records_case_actor_rm_closed_as_ledger_entry` and
      `test_case_manager_closure_records_every_rung` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that the
      CASE_MANAGER's own RM transitions are committed as ledger entries.
    relationships:
    - rel_type: extends
      spec_id: CM-23-005
    adr:
    - ADR-0051
    stories:
    - story_2022_088
    - story_2022_074
  - id: CM-23-006
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.RECEIVED` MUST denote that a CaseProposal
      has been received and is being evaluated.
    rationale: >-
      The RM state machine models a lifecycle that applies to any actor processing a case,
      but its transition labels map to case-level events for the coordinator rather than to
      report-validation events as for other participants.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.RECEIVED` on the CASE_MANAGER's
      own `CaseParticipant` denotes receipt of a `CaseProposal` under evaluation.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    adr:
    - ADR-0051
    stories:
    - story_2022_088
  - id: CM-23-007
    priority: MUST
    kind: protocol
    statement: >-
      During case initialization (after accepting a CaseProposal), the Case
      Actor MUST emit CaseLedgerEntry records for each of its own RM transitions:
      (a) CASE_MANAGER→RM.RECEIVED when the CaseProposal arrives,
      (b) CASE_MANAGER→RM.VALID when the proposal is validated and case creation
          begins,
      (c) CASE_MANAGER→RM.ACCEPTED when the VulnerabilityCase is successfully
          created and initialized.
    rationale: >-
      Ledger entries for the CASE_MANAGER's own RM transitions create a traceable,
      timestamped protocol-significant history of case initialization, consistent
      with CM-02-009 (CASE_MANAGER applies its own timestamp to every state-changing
      event).  See ADR-0051.
    verification: Integration tests in `test/demo/` confirm that the CASE_MANAGER emits
      `CaseLedgerEntry` records for its own `RM.RECEIVED`, `RM.VALID`, and `RM.ACCEPTED`
      transitions during case initialization.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    - rel_type: refines
      spec_id: CM-02-009
    adr:
    - ADR-0051
    stories:
    - story_2022_045
    - story_2022_074
  - id: CM-23-008
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.VALID` MUST denote that the CaseProposal
      is correctly formatted and actionable by this CASE_MANAGER, and that case creation has
      begun.
    rationale: >-
      `RM.VALID` is the CASE_MANAGER's signal that the proposal passed structural validation
      and that initialization is in progress; it distinguishes a validated-but-incomplete
      case from one still under evaluation.  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.VALID` on the CASE_MANAGER's
      `CaseParticipant` denotes that the `CaseProposal` passed structural validation and case
      creation has begun.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051
    stories:
    - story_2022_088
  - id: CM-23-009
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.ACCEPTED` MUST denote that the case has
      been successfully created and is being coordinated.
    rationale: >-
      `RM.ACCEPTED` marks the end of the initialization phase and the start of active
      coordination; it is the CASE_MANAGER's counterpart to a reporter's or vendor's
      RM.ACCEPTED (engagement decision).  See ADR-0051.
    verification: Inspection of `vultron/core/` confirms that `RM.ACCEPTED` on the CASE_MANAGER's
      `CaseParticipant` denotes that the `VulnerabilityCase` has been successfully created and
      is being coordinated.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051
    stories:
    - story_2022_088
  - id: CM-23-010
    priority: MUST
    kind: protocol
    statement: >-
      For the CASE_MANAGER's CaseParticipant, `RM.CLOSED` MUST denote that the Case Owner
      has left the case and the case is fully closed.
    rationale: >-
      `RM.CLOSED` on the CASE_MANAGER's own participant record is the terminal state; it
      signals that no further ledger entries will be authored for this case.  See ADR-0051.
    verification: >-
      A test marked `CM-23-010` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` delivers a
      Leave from a CASE_MANAGER that is not the Case Owner and asserts it is refused
      with nothing committed and the case not fully closed; the owner-close tests
      there assert the CASE_MANAGER reaches `RM.CLOSED` only on the Case Owner's Leave.
    relationships:
    - rel_type: refines
      spec_id: CM-23-006
    adr:
    - ADR-0051

    stories:
    - story_2022_088
    - story_2022_066
  - id: CM-23-011
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Owner's `Leave(VulnerabilityCase)` arrives while the case's EM state
      is `EM.ACTIVE` or `EM.REVISE`, the CASE_MANAGER MUST decline it with an
      `as:Reject`
      (MSM-05-001).
    rationale: >-
      Owner-close is a hard, terminal write boundary (ADR-0085). VP-13-009 keeps an
      embargo alive across a participant close only while others remain engaged.
      Owner-close leaves none, and no authority to lift it, so an embargo left active
      could never end. This raises the participant-level VP-13-005 guidance to a hard
      refusal. `Leave` is understood but declined, hence `as:Reject`, not
      `Create(ProcessingFault)` (MSM-05-001).
    verification: >-
      `test_owner_leave_during_embargo_emits_reject_to_owner` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that a
      Case Owner `Leave(VulnerabilityCase)` on a case with an active embargo produces an
      `as:Reject` of the Leave, addressed to the owner.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    - rel_type: refines
      spec_id: VP-13-005
    adr:
    - ADR-0085
    - ADR-0050
    stories:
    - story_2022_066
  - id: CM-23-034
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When it declines an owner-close under CM-23-011, the CASE_MANAGER MUST NOT run the
      CM-23-002 closure sequence: no participant reaches `RM.CLOSED`, itself included.
    rationale: >-
      If any step of the closure ran, the Case Owner or the CASE_MANAGER would be
      closed while the embargo is still active. Then no authority would remain to end
      the embargo (CM-23-011).
    verification: >-
      `test_owner_leave_during_embargo_runs_no_closure` and
      `test_owner_close_not_closed_when_reject_emit_cannot_run` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that the
      declined close advances no participant to `RM.CLOSED`, the CASE_MANAGER
      included, even when the `as:Reject` cannot be emitted.
    relationships:
    - rel_type: extends
      spec_id: CM-23-011
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-035
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST suppress the receipt commit of an owner-close it declines
      (CM-23-011), so the ledger holds no `close_case` entry for it.
    rationale: >-
      The receipt commit opens the closure. It is committed before any role-specific
      effect (CLP-10-006), and the status entries after it (CM-23-022) advance the
      departing participant to `RM.CLOSED` on each replica (CLP-10-001, CM-23-003).
      Skipping only the CM-23-002 steps while still committing the receipt would leave
      a recorded departure that the case then declined (ISSUE-3137).
    verification: >-
      `test_declined_owner_leave_commits_nothing_and_keeps_the_embargo` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that a
      declined owner-close leaves the case's ledger empty.
    relationships:
    - rel_type: extends
      spec_id: CM-23-034
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-036
    priority: MUST
    kind: protocol
    statement: >-
      To close a case that holds an active embargo, the Case Owner MUST first terminate
      the embargo and then send its `Leave(VulnerabilityCase)` again.
    rationale: >-
      The CASE_MANAGER declines an owner-close while an embargo is active (CM-23-011).
      Thus the only path to a closed case is to end the embargo first through the normal
      EM path.
    verification: >-
      `test_close_proceeds_after_embargo_terminated` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that,
      after the embargo is terminated, the same close proceeds through the CM-23-002
      sequence.
    relationships:
    - rel_type: depends_on
      spec_id: CM-23-011
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-037
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT terminate the embargo as part of declining an
      owner-close (CM-23-011). The embargo stays active until the normal EM path ends
      it.
    rationale: >-
      The decline answers the close; it is not a decision on the embargo. Only the EM
      path ends an embargo, so its participants see the termination in the usual way.
    verification: >-
      `test_declined_owner_leave_commits_nothing_and_keeps_the_embargo` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that the
      case's EM state is still `EM.ACTIVE` after the decline.
    relationships:
    - rel_type: extends
      spec_id: CM-23-011
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-012
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Case closure MUST NOT advance the RM state of a participant that did not send a
      Leave(VulnerabilityCase): such a bystander keeps its last RM state. On an owner
      Leave, only the Case Owner and the CASE_MANAGER advance to RM.CLOSED (CM-23-002).
    note: >-
      CM-23-011's rationale says owner-close ends "the case for everyone". That phrase
      means the case-level write boundary: the CASE_MANAGER accepts no further external
      ledger entries (ADR-0085). It is not a directive to force each remaining
      participant's RM dimension to RM.CLOSED.
    rationale: >-
      A participant's RM state is its own record of how it handled the report
      (ADR-0121). A bystander that never sent Leave has made no closure declaration, and
      forcing it to RM.CLOSED would fabricate one. It stays at its last rung when the
      case ends around it. The demos' "all participants RM.CLOSED" milestone
      (DEMOMA-07-003) holds because each participant closes its own handling before the
      Case Owner closes the case (CM-23-013).
    verification: >-
      `test_owner_leave_leaves_bystander_at_prior_rung` and
      `test_fanout_leaves_bystander_at_prior_rung` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that an
      owner Leave(VulnerabilityCase) advances only the Case Owner and CASE_MANAGER to
      RM.CLOSED and leaves a bystander participant that was at RM.RECEIVED or RM.VALID
      at its prior RM state, at the CASE_MANAGER and on a replica.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    - rel_type: refines
      spec_id: CM-23-002
    adr:
    - ADR-0050
    - ADR-0121
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-038
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST advance a leaving actor to RM.CLOSED from any RM rung it
      holds, using only transitions the RM transition function permits. Thus a Leave
      from RM.VALID is recorded V → D → C (RMB-14-005). A Leave from RM.START, by an
      actor that has not yet recorded receiving the case, is recorded S → R → C.
    rationale: >-
      A Leave is the participant's own closure act, so closing it from any rung is
      self-declaration, not an imposed jump (ADR-0121). The RM transition function
      closes from Received, Invalid, Accepted and Deferred (ADR-0114). A Leave from
      Valid passes through Deferred, and one from Start through Received, since S → C is
      not a transition. Thus no write site overrides the transition table (RMB-14-005).
    verification: >-
      `test_leave_from_closable_rung_records_one_transition`,
      `test_leave_from_valid_is_recorded_through_deferred` and
      `test_leave_from_start_receives_then_closes` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that a
      leaving actor at a closable rung is advanced in one step, one at RM.VALID is
      recorded V → D → C and one at RM.START S → R → C, with no write overriding the
      transition table. The CASE_MANAGER commits each step as a status entry
      (CM-23-022), and `test_replica_history_equals_the_case_managers` confirms that a
      replica applying those entries ends with the same per-actor status history.
    relationships:
    - rel_type: extends
      spec_id: CM-23-012
    adr:
    - ADR-0050
    - ADR-0121
    - ADR-0114
    stories:
    - story_2022_066
  - id: CM-23-013
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Once the CASE_MANAGER has committed its own status entry reaching RM.CLOSED
      (CM-23-002 step 2), the case is fully closed. For any later inbound activity for
      the case, the CASE_MANAGER MUST NOT commit any CaseLedgerEntry, the receipt entry
      included. Any inbound activity includes a non-owner participant's
      Leave(VulnerabilityCase), and every activity class: RM (R*), EM, CS and
      general-inquiry (GI) traffic such as `Add(Note)`.
    rationale: >-
      A deployment's process for a closed case can exit once closure has fanned out.
      The prototype's CASE_MANAGER behaves toward the case as if its process had
      exited: nothing reaches the ledger. The boundary is a hard kill switch, not a
      selective gate (ADR-0085). The receipt commit is suppressed because it opens the
      closure whose status entries would close the sender on the replicas (CLP-10-006,
      CM-23-022). A participant that wants its departure recorded leaves first
      (CM-23-015).
    verification: >-
      Tests confirm that after an owner Leave(VulnerabilityCase) has committed the
      CASE_MANAGER's own RM.CLOSED status entry, a later inbound activity for the case —
      a bystander's
      Leave(VulnerabilityCase) and an `Add(Note)[target=VulnerabilityCase]` among them —
      commits no
      CaseLedgerEntry:
      `test/core/use_cases/received/test_close_case_role_semantics.py::TestPostCloseBoundary::test_bystander_leave_after_owner_close_is_refused`
      and `TestPostCloseWriteBoundary`. `test/core/behaviors/case/test_receive_activity_tree.py::TestPostCloseStage`
      confirms every received tree carries the guard. Over each demo scenario's exported
      ledger,
      `test_invariant_18_no_participant_act_after_case_closure` in
      `test/ci/invariants/universal_harness.py` confirms no
      participant act follows that entry, using the same predicate as the
      received-tree guard
      (`vultron/core/predicates/case_closure.py`).
    relationships:
    - rel_type: refines
      spec_id: CM-23-003
    - rel_type: refines
      spec_id: CM-23-002
    adr:
    - ADR-0085
    - ADR-0050
    stories:
    - story_2022_066
  - id: CM-23-039
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Once a case is fully closed (CM-23-013), the CASE_MANAGER MUST NOT change any case
      or participant state for an inbound activity for the case. The sender's RM state
      on the canonical ledger stays at its last rung (CM-23-012).
    rationale: >-
      A state change with no ledger entry would leave the CASE_MANAGER's store ahead of
      every replica, which can no longer catch up. The closed case behaves as if its
      process had exited (ADR-0085).
    verification: >-
      `test_bystander_leave_after_owner_close_is_refused` and
      `test_a_repeat_owner_leave_after_full_close_is_refused` in
      `test/core/use_cases/received/test_close_case_role_semantics.py`, and
      `test_a_late_reply_changes_nothing_once_the_case_is_fully_closed` in
      `test/core/use_cases/received/actor/test_ownership_deadline.py`, assert that a
      late activity changes no RM or case state.
    relationships:
    - rel_type: extends
      spec_id: CM-23-013
    adr:
    - ADR-0085
    - ADR-0050
    stories:
    - story_2022_066
  - id: CM-23-040
    priority: MAY
    kind: protocol
    statement: >-
      Once a case is fully closed (CM-23-013), the CASE_MANAGER MAY answer an inbound
      activity for it with an `as:Reject` (MSM-05-001), or drop it unanswered.
    rationale: >-
      A reply is a courtesy, since nothing reaches the ledger either way. An `as:Reject`
      means "received and understood but declined" (MSM-05-001). A drop is what an
      exited process does.
    verification: >-
      `test_late_leave_follows_the_reply_policy` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that the
      CASE_MANAGER either sends an `as:Reject` or sends nothing for a late Leave.
    relationships:
    - rel_type: extends
      spec_id: CM-23-013
    - rel_type: depends_on
      spec_id: MSM-05-001
    adr:
    - ADR-0085
    - ADR-0131
    stories:
    - story_2022_066
  - id: CM-23-041
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant MUST NOT rely on receiving a reply to an activity it sends after
      the case is fully closed (CM-23-013).
    rationale: >-
      The CASE_MANAGER may drop a late activity with no reply (CM-23-040), so a
      participant that waits for one may wait forever.
    verification: >-
      `test_leave_case_queues_activity_in_outbox` in
      `test/core/use_cases/triggers/case/test_leave.py` asserts that the participant's
      `leave-case` trigger completes once its Leave is queued, with no reply awaited.
    relationships:
    - rel_type: depends_on
      spec_id: CM-23-040
    adr:
    - ADR-0085
    - ADR-0131
    stories:
    - story_2022_066
  - id: CM-23-042
    priority: MAY
    kind: protocol
    statement: >-
      Once a case is fully closed (CM-23-013), the CASE_MANAGER MAY still answer a
      replica's resync request (`Reject(CaseLedgerEntry)`) by replaying entries the
      ledger already holds.
    rationale: >-
      A replay appends nothing, so it does not cross the boundary. The CASE_MANAGER
      still appends no new entry on behalf of an external participant (CM-23-013).
    verification: >-
      `test/core/behaviors/case/test_receive_activity_tree.py::TestPostCloseStage`
      confirms that the resync tree is exempt from the post-close guard.
    relationships:
    - rel_type: extends
      spec_id: CM-23-013
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-014
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers the CM-23-002 owner-close sequence, after the close_case entry
      and before any closure step. There the CASE_MANAGER MUST expire every embargo
      Invite on the case still awaiting a reply, without waiting for its RSVP deadline.
      Each consent row that is `INVITED` moves to `TIMED_OUT`. A pending case Invite
      carries no RSVP deadline and needs no settling. An answer to it after close is an
      external append, refused at the ADR-0085 boundary.
    rationale: >-
      After close a pending Invite can only expire. Waiting for its RSVP deadline would keep the
      CASE_MANAGER running for a closed case, possibly for years, only to write one more entry after
      the write boundary. Settling first leaves no timer, so the CASE_MANAGER can stop
      once the
      closure has fanned out. This keeps the boundary clean in practice; it does not promise chain
      finality (CM-23-002).
    verification: >-
      A test confirms that an owner Leave(VulnerabilityCase) on a case with an unanswered Invite
      whose RSVP deadline is in the future moves that participant's consent to
      `TIMED_OUT`
      before every closure step, so it precedes the write boundary even when the
      Case Owner is the CASE_MANAGER:
      `test/core/use_cases/received/test_close_case_role_semantics.py::TestPostCloseBoundary::test_owner_close_expires_pending_invite_before_boundary`.
      `TestOwnerCloseSettlesPendingInvites` in the same file covers a case with no pending
      Invite, several pending Invites, a row frozen by a final register entry, a stub
      invitee's row on the embargo the close required to end, and replica replay of the
      settled entry.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    - rel_type: depends_on
      spec_id: CM-28-009
    adr:
    - ADR-0118
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-043
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit each owner-close expiry (CM-23-014) as its own
      `Update(EmbargoConsent)` that carries the `TIMED_OUT` row (CM-28-009, CM-28-014).
    rationale: >-
      Each expiry changes one consent row, and every case-file change is its own ledger
      entry (CLP-07-013). Thus the replicas copy each `TIMED_OUT` row, and the expiries
      are on the ledger before the write boundary.
    verification: >-
      `test_every_pending_invite_gets_one_entry`,
      `test_entry_names_the_invite_the_ledger_recorded` and
      `test_owner_close_expires_pending_invite_before_boundary` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` assert that the
      CASE_MANAGER commits one `TIMED_OUT` `Update(EmbargoConsent)` per pending Invite.
    relationships:
    - rel_type: extends
      spec_id: CM-23-014
    - rel_type: depends_on
      spec_id: CM-28-014
    adr:
    - ADR-0118
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-015
    priority: SHOULD
    kind: protocol
    statement: >-
      The Case Owner SHOULD leave a case last, or nearly last, after the other
      participants have left, so that their departures are recorded before the
      case is fully closed; a departure sent after closure is not recorded
      (CM-23-013).
    rationale: >-
      The owner's Leave closes the case for everyone (CM-23-002), and nothing a
      participant sends afterwards reaches the ledger. A participant that has
      not left by then keeps its last RM state on every replica that receives it,
      which is harmless but leaves the ledger without a record of its departure.
      Leaving last is the owner's normal course, not a hard ordering: a
      participant that never leaves cannot hold a case open. Every demo
      scenario closes through `close_case_owner_last`
      (`vultron/demo/helpers/closure.py`), which sends the owner's Leave only
      once the CASE_MANAGER has recorded each other departure.
    verification: >-
      `test/demo/test_rv_demo.py::TestBothClose::test_the_vendor_is_the_owner_and_leaves_after_the_reporter`
      asserts the rv closure fragment closes the Reporter before the Vendor, the Case Owner;
      `test/demo/test_case_closure.py` asserts the shared closure phase gates the
      owner's Leave on every other departure and that the closure milestone reports
      a departure recorded after the CASE_MANAGER's own RM.CLOSED status entry.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    - rel_type: depends_on
      spec_id: CM-23-013
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-016
    priority: MUST
    kind: protocol
    statement: >-
      A participant's case replica is the case as it stood when the replica was seeded,
      plus the ledger entries since. A replica MUST apply the entries in ledger order by
      copying the objects they carry, so replicas at one ledger position hold identical
      case files.
    rationale: >-
      The CASE_MANAGER is the single writer (ADR-0108), and the ledger records each
      change when the CASE_MANAGER makes it (CLP-07-013). If each replica copies what
      the entries carry, in the same order, two replicas at the same position hold the
      same case file as each other and as the CASE_MANAGER. CM-23-023 gives the rule for
      closure. This requirement gives it for every replicated change (ADR-0124).
    verification: >-
      A unit test replays a ledger whose entries skip a rung that a table walk would
      insert, and asserts the replica's per-actor status history equals the ledger's.
      `test_two_replicas_applying_one_ledger_hold_identical_case_files` in
      `test/core/models/test_embargo_apply.py` applies one ledger to two replicas and
      asserts they hold identical case files.
    relationships:
    - rel_type: extends
      spec_id: CM-23-023
    adr:
    - ADR-0108
    - ADR-0124
    - ADR-0114
    stories:
    - story_2022_066
  - id: CM-23-044
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A replica applying an entry MUST NOT mint an id, read a clock, read local policy
      or state outside the case, or run lifecycle logic. Walking the RM
      transition table from its own stored state to a target state is such logic.
    rationale: >-
      A replica can find its own path from its own state, which can be out of date. It
      can then write an RM state that the ledger never recorded. A replica that builds a
      record itself gives it an id and a time that differ from those of the
      CASE_MANAGER. In both cases, the replicas diverge from the CASE_MANAGER
      (ADR-0124).
    verification: >-
      `test_two_fresh_replicas_write_identical_records` in
      `test/core/behaviors/status/test_participant_status_acceptance.py` applies one
      entry to two fresh replicas and asserts they write identical records, every id and
      time included, so a minted id or a clock read fails it.
      `test_the_apply_function_reads_no_clock_mints_no_id_and_reads_no_store` in
      `test/core/models/test_embargo_apply.py` asserts the embargo apply function reads
      no clock, mints no id and reads no store, and
      `test/architecture/test_replica_never_walks_rm_closure_path.py` asserts no ledger
      replay node walks the RM closure path.
    relationships:
    - rel_type: extends
      spec_id: CM-23-016
    adr:
    - ADR-0108
    - ADR-0124
    stories:
    - story_2022_066
  - id: CM-23-017
    priority: MUST
    kind: project
    statement: >-
      The reference CASE_MANAGER MUST choose its CM-23-040 reply at one configuration
      point, `ActorConfig.post_close_reply`, whose default is `drop`.
    rationale: >-
      A Reject that wraps most activities already carries a protocol meaning for its
      recipient: Reject(Invite) is a declined invitation and Reject(Offer(...)) a
      declined offer, so a reply to a late Invite or Offer would be misread as a
      decision. Reject(Leave(VulnerabilityCase)) already means "close declined"
      (CM-23-011) and cannot be misread. Dropping is the default because it is what an
      exited process does, and CM-23-041 already tells participants not to rely on a
      reply.
    verification: >-
      `test/core/use_cases/received/test_close_case_role_semantics.py::TestPostCloseWriteBoundary`
      drives a late Leave under both settings (one Reject under `reject`, none under
      `drop`) and confirms the default is `drop`.
    relationships:
    - rel_type: refines
      spec_id: CM-23-040
    adr:
    - ADR-0131
    - ADR-0085
  - id: CM-23-056
    priority: MUST
    kind: project
    statement: >-
      With `post_close_reply` set to `drop`, the reference CASE_MANAGER MUST send
      nothing for a late activity. A late activity is one that arrives for the case
      after it is fully closed (CM-23-013).
    rationale: >-
      Dropping is what an exited process does, and CM-23-041 already tells participants
      not to rely on a reply.
    verification: >-
      `test_default_policy_drops_a_late_leave` and
      `test_late_leave_follows_the_reply_policy` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` drive a late
      Leave under `drop` and assert nothing is sent.
    relationships:
    - rel_type: extends
      spec_id: CM-23-017
    adr:
    - ADR-0131
  - id: CM-23-057
    priority: MUST
    kind: project
    statement: >-
      With `post_close_reply` set to `reject`, the reference CASE_MANAGER MUST answer a
      late Leave(VulnerabilityCase) with Reject(Leave(VulnerabilityCase)).
    rationale: >-
      Reject(Leave(VulnerabilityCase)) already means "close declined" (CM-23-011), so
      the
      leaver cannot misread it as a decision on anything else.
    verification: >-
      `test_late_leave_follows_the_reply_policy` and
      `test_a_late_reply_is_answered_at_most_once` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` drive a late
      Leave under `reject` and assert one Reject is sent.
    relationships:
    - rel_type: extends
      spec_id: CM-23-017
    adr:
    - ADR-0131
  - id: CM-23-045
    priority: MUST
    kind: project
    statement: >-
      Under both `post_close_reply` settings, the reference CASE_MANAGER MUST drop with
      no reply every late activity other than a Leave(VulnerabilityCase) (CM-23-017). A
      `Create(CaseProposal)` names a report, not a case, so it is not a late activity
      (ADR-0131). One that resolves to a fully closed case gets a `Reject(CaseProposal)`
      under both settings (CP-05-014, CP-05-018).
    rationale: >-
      A Reject of any other late activity would be misread as a decision on it, such as
      a declined invitation or a declined offer (CM-23-017). A late activity here is one
      for the case, as in CM-23-013. A `Reject(CaseProposal)` is a decision on the
      proposal, so it cannot be misread, and the proposer learns that it must not wait
      for a case.
    verification: >-
      `test_dispatcher_wires_the_policy_point` and
      `test_a_late_participant_status_gets_no_processing_fault` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` confirm a late
      Add(Note) and a late participant status get no reply under both settings, through
      the inbox dispatcher. `test_proposal_for_a_fully_closed_case_is_refused` in
      `test/core/use_cases/received/test_case_proposal.py` confirms a proposal for a
      fully closed case is declined.
    relationships:
    - rel_type: extends
      spec_id: CM-23-017
    adr:
    - ADR-0131
    - ADR-0085
  - id: CM-23-046
    priority: MUST
    kind: project
    statement: >-
      The reference CASE_MANAGER MUST report every late activity as `REFUSED`, under
      both `post_close_reply` settings.
    rationale: >-
      The verdict tells the inbox that nothing was applied, whether or not a Reject was
      sent. If a reply setting changed the verdict, the same late activity would read
      as applied under one setting and refused under the other.
    verification: >-
      `test_late_leave_follows_the_reply_policy` and
      `test_dispatcher_wires_the_policy_point` in
      `test/core/use_cases/received/test_close_case_role_semantics.py`, and
      `test_a_late_embargo_activity_is_refused_before_any_write` in
      `test/core/use_cases/received/test_post_close_handlers.py`, assert that a late
      activity is reported `REFUSED` under both settings.
    relationships:
    - rel_type: extends
      spec_id: CM-23-017
    adr:
    - ADR-0131
    - ADR-0085
  - id: CM-23-047
    priority: MUST
    kind: project
    statement: >-
      On dropping a late activity, the reference CASE_MANAGER MUST log it at INFO with
      the activity id, the sender's actor id and the case id.
    rationale: >-
      A drop sends nothing, so the log line is the only record that the activity
      arrived and was dropped. An operator needs the ids to find the activity and the
      case (SL-01).
    verification: >-
      `test_late_leave_drop_is_logged_with_activity_and_actor` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` confirms the INFO
      log line.
    relationships:
    - rel_type: extends
      spec_id: CM-23-017
    adr:
    - ADR-0131
  - id: CM-23-018
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse every activity for a case from a sender whose closure
      that case's ledger records, committing no entry and sending nothing.
      That record is the sender's status entry with rmState=CLOSED. The refusal is the
      sender guard's, so no refusal notice is sent either (CLP-05-001, HP-01-006).
      CM-23-048, CM-23-049 and CM-23-050 give the exceptions.
    rationale: >-
      `RM.CLOSED` is terminal (ADR-0085). The CASE_MANAGER sends no more case content to
      a closed participant (CM-23-004). Thus an act from that participant would be
      recorded in a case that it cannot see. CM-23-013 stops writes only when the case
      is fully closed.
    verification: >-
      A received-use-case test drives an `Add(Note)` and a status update from a closed
      sender and asserts `REFUSED` with no ledger entry and no outbound activity. For
      every use case whose rule names the `CASE_OWNER` standing, a test composes its
      guard and asserts a Case Owner whose closure the case records is refused, and
      received-use-case tests drive an `Add(VulnerabilityReport)`, an owner embargo
      decision and a `Remove(EmbargoEvent)` from a closed owner and assert `REFUSED`
      with nothing committed or sent. A test drives a closed sender's
      `Reject(Offer(VulnerabilityReport))` and asserts `REFUSED`.
    relationships:
    - rel_type: refines
      spec_id: CM-23-004
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0085
    - ADR-0114
    - ADR-0115
    stories:
    - story_2022_066
  - id: CM-23-048
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST answer a closed sender's `Reject(CaseLedgerEntry)` with a
      replay of only the entries that record that sender's own closure (CM-23-031). The
      active check of SYNC-03-005 admits that resync request, so it is not refused as a
      closed sender's (CM-23-020).
    rationale: >-
      The resync request stays available to a closed participant whose replica missed
      one of its own closure entries. Its replay adds nothing to the ledger and has a
      limit: the entries that record the sender's own closure.
    verification: >-
      `test_a_closed_peers_reject_is_answered_up_to_its_own_closure` in
      `test/core/behaviors/sync/nodes/test_fanout_embargo_gate.py` asserts that a closed
      sender's `Reject(CaseLedgerEntry)` gets a replay that stops at its own closure
      entries, and `test_ledger_peer_kind_composes_the_resync_guard` in
      `test/core/behaviors/test_sender_guard.py` asserts the resync guard is the active
      check.
    relationships:
    - rel_type: extends
      spec_id: CM-23-018
    - rel_type: refines
      spec_id: SYNC-03-005
    adr:
    - ADR-0085
    - ADR-0114
    stories:
    - story_2022_066
  - id: CM-23-049
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST report as `SKIPPED` a repeated act that would close a closed
      sender, whatever its activity id, committing no entry and sending nothing. Such an
      act is a Leave(VulnerabilityCase), or a `Reject` of the sender's stub or full-case
      Invite. A `Reject(Offer(VulnerabilityReport))` closes no sender on a case, so it
      is not such a repeat (CM-23-019).
    rationale: >-
      A second closing act changes nothing, whichever act closed the sender first: its
      effect is already in place (ID-05-003). The effect of an act, not its activity
      id, decides if it is a repeat.
    verification: >-
      `test_a_second_leave_with_a_new_id_is_skipped_and_records_nothing` in
      `test/core/use_cases/received/test_remaining_sender_rules.py`,
      `test_a_repeated_stub_reject_from_the_closed_invitee_is_skipped` in
      `test/core/use_cases/received/actor/test_case_joining_replies.py` and
      `test_closed_sender_verdict_skips_a_repeated_closing_act` in
      `test/core/use_cases/received/test_bt_verdict.py` drive a second Leave and a
      repeated `Reject` of an Invite, each with a new activity id, from a closed sender,
      and assert `SKIPPED` with no ledger entry and no outbound activity.
      `test_close_report_from_a_closed_sender_is_refused_not_skipped` in
      `test/core/use_cases/received/test_close_report_on_case.py` asserts a closed
      sender's `Reject(Offer(VulnerabilityReport))` is `REFUSED`.
    relationships:
    - rel_type: extends
      spec_id: CM-23-018
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-050
    priority: MUST
    kind: protocol
    statement: >-
      While a case is not fully closed, the CASE_MANAGER MUST process a closed Case
      Owner's Leave(VulnerabilityCase) to complete the case's closure (CM-23-002).
    rationale: >-
      The Case Owner's Leave includes the case's closure, which is not in place while
      the case is open, so it is not a repeat. A failed owner Leave keeps none of the
      closure (CLP-07-015). Thus this owner's closure was recorded by an act other than
      its Leave, and only its Leave can close the case.
    verification: >-
      `test_a_closed_owners_leave_closes_the_open_case` in
      `test/core/use_cases/received/test_close_case_role_semantics.py` asserts that a
      closed Case Owner's Leave on an open case completes the closure, and
      `test_a_closed_case_owner_still_passes_the_leave_guard` in
      `test/core/behaviors/test_closed_case_owner_rules.py` asserts the guard admits it.
    relationships:
    - rel_type: extends
      spec_id: CM-23-018
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: CM-23-020
    priority: MUST
    kind: project
    statement: >-
      In this codebase the `ACTIVE_PARTICIPANT` sender standing (HP-01-009) MUST mean an
      active participant (CM-10-004) whose closure the case's ledger does not record.
    rationale: >-
      How this codebase's sender guards meet CM-23-018; split from it so CM-23-018
      states only what a closed sender is refused and sent (MS-12-010). Sender standings
      and guard composition are this codebase's mechanism (HP-01-007).
    verification: >-
      Unit tests in `test/core/behaviors/test_sender_guard.py` and
      `test/core/behaviors/status/nodes/test_conditions.py` confirm the
      `ACTIVE_PARTICIPANT` guard refuses a sender at RM.CLOSED, an inert sender and a
      removed sender.
    relationships:
    - rel_type: implements
      spec_id: CM-23-018
    - rel_type: refines
      spec_id: HP-01-007
  - id: CM-23-054
    priority: MUST
    kind: project
    statement: >-
      Every guard that enforces the `ACTIVE_PARTICIPANT` standing (CM-23-020) MUST ask
      one shared predicate (HP-01-007).
    rationale: >-
      If guards each checked the standing in their own way, two use cases could disagree
      on whether one sender may act. One predicate gives every guard the same answer.
    verification: >-
      `test_each_active_participant_guard_refuses_a_sender_that_may_not_act` in
      `test/core/behaviors/test_sender_guard.py` and
      `test_the_sender_predicate_matches_the_case_content_selection` in
      `test/core/participants/test_recipients.py` confirm that every guard composed for
      the standing gives the same answer for a closed, an inert and a removed sender,
      and that the shared predicate (`may_act_on_case`) matches the case-content
      selection.
    relationships:
    - rel_type: extends
      spec_id: CM-23-020
  - id: CM-23-055
    priority: MUST_NOT
    kind: project
    statement: >-
      The `Reject(CaseLedgerEntry)` use case MUST NOT declare the `ACTIVE_PARTICIPANT`
      standing, keeping the active check of SYNC-03-005 as its guard.
    rationale: >-
      A closed sender's resync request must reach the closure-entry replay that
      CM-23-048 requires. The `ACTIVE_PARTICIPANT` standing refuses a closed sender, so
      declaring it would refuse that request.
    verification: >-
      `test_ledger_reject_does_not_declare_the_active_participant_standing` in
      `test/core/use_cases/received/test_sender_entitlement.py` confirms the
      `Reject(CaseLedgerEntry)` use case does not declare it.
    relationships:
    - rel_type: extends
      spec_id: CM-23-020
  - id: CM-23-019
    priority: MUST
    kind: protocol
    statement: >-
      Once a report belongs to a case, only that case's Case Owner holds the report. The
      Case Owner closes the case by Leave(VulnerabilityCase) (CM-23-001, CM-23-002),
      never by `Reject(Offer(VulnerabilityReport))`. The CASE_MANAGER, and each
      participant holding a case replica, MUST refuse a
      `Reject(Offer(VulnerabilityReport))` for a report that belongs to the case, from
      every sender. From the Case Owner it is the wrong closing act. From any other
      sender it is a message about a report that sender does not hold. A
      `Reject(Offer(VulnerabilityReport))` for a report that belongs to no case is
      unaffected.
    rationale: >-
      A `Reject(Offer(VulnerabilityReport))` moves its sender to `RM.CLOSED` without the
      Leave round trip. Thus a Case Owner that sends one can close itself while its case
      stays open. It can then continue to act as Case Owner, and the case is never fully
      closed. If the Case Owner's `Reject(Offer(VulnerabilityReport))` became a full
      close, the case would have two closing messages. If only the later acts of a
      closed Case Owner were refused, the wrong message would stay admitted (ADR-0144).
    verification: >-
      `test/core/use_cases/received/test_close_report_on_case.py` drives a
      `Reject(Offer(VulnerabilityReport))` on an open case from the Case Owner and from
      a participant that is not the owner, at the CASE_MANAGER and at a participant
      holding a replica, and asserts `REFUSED`.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    - rel_type: refines
      spec_id: CM-23-018
    adr:
    - ADR-0144
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-051
    priority: MUST
    kind: protocol
    statement: >-
      On refusing a `Reject(Offer(VulnerabilityReport))` (CM-23-019), the CASE_MANAGER
      or replica holder MUST write no RM state, commit no entry and send nothing, a
      refusal notice included.
      The refusal is the sender guard's: no sender is entitled to send it to a case
      actor (CLP-02-005, HP-01-006).
    rationale: >-
      A sender guard refuses before any write (HP-01-006), so the refused act leaves no
      trace. A refusal notice would answer a message that no sender may send.
    verification: >-
      `test/core/use_cases/received/test_close_report_on_case.py` asserts no RM change,
      no ledger entry and no outbound activity for each refused
      `Reject(Offer(VulnerabilityReport))`.
      `test_close_on_a_case_commits_nothing_anywhere` in
      `test/core/use_cases/received/test_receive_tree_ledger_commit.py` asserts nothing
      is committed at any actor.
    relationships:
    - rel_type: extends
      spec_id: CM-23-019
    adr:
    - ADR-0144
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-052
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT send `Reject(Offer(VulnerabilityReport))` for a report that
      belongs to a case it holds.
    rationale: >-
      Every case actor refuses such a `Reject(Offer(VulnerabilityReport))` (CM-23-019).
      The actor closes its part in the case by Leave(VulnerabilityCase) instead
      (CM-23-001).
    verification: >-
      `test_close_report_is_sent_to_no_one_when_a_case_exists` in
      `test/core/use_cases/triggers/test_trignotify.py` and
      `test_reject_report_on_a_case_raises_and_sends_nothing` in
      `test/core/use_cases/triggers/test_report_triggers.py` assert that no
      `Reject(Offer(VulnerabilityReport))` is sent for a report that belongs to a case.
      The `leave-case` tests in `test/core/use_cases/triggers/case/test_leave.py`
      cover how an actor on a case closes its part in it instead.
    relationships:
    - rel_type: extends
      spec_id: CM-23-019
    adr:
    - ADR-0144
    stories:
    - story_2022_066
    - story_2022_067
  - id: CM-23-053
    priority: MUST
    kind: protocol
    statement: >-
      An actor's report-closing trigger MUST fail, before it writes or sends anything,
      for a report that belongs to a case the actor holds.
    rationale: >-
      The trigger is where the actor would build the
      `Reject(Offer(VulnerabilityReport))` that CM-23-052 forbids. Failing there, before
      any write, leaves no local closure that the case never recorded.
    verification: >-
      Tests in `test/core/use_cases/triggers/test_trignotify.py`,
      `test/core/use_cases/triggers/test_report_triggers.py`,
      `test/core/behaviors/report/test_trigger_report_trees.py` and
      `test/adapters/driving/fastapi/routers/test_trigger_report.py` assert that
      the reject-report trigger fails on a case, from the Case Owner and from a
      participant that is not the owner, with nothing written or queued, and that
      it still closes a report that belongs to no case.
    relationships:
    - rel_type: implements
      spec_id: CM-23-052
    adr:
    - ADR-0144
    stories:
    - story_2022_066
    - story_2022_067
- id: CM-24
  title: CASE_MANAGER-Delegated Activity Authorship Contract
  description: >-
    Requirements for how trigger use cases assign `actor` and `attributed_to`
    when the CASE_MANAGER emits an Activity on behalf of a requesting participant
    (delegated message).  The reference implementation is `delegated_authorship()`
    (`vultron/core/behaviors/delegated_authorship.py`).
    Codified from CONCERN-2170.
  specs:
  - id: CM-24-001
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER emits a protocol Activity on behalf of a requesting
      participant (delegated message), the `actor` field of the emitted Activity MUST be
      set to the CASE_MANAGER's actor ID, not the requesting participant's actor ID.
    rationale: >-
      Receiving actors authenticate messages: they compare the `actor` field with the
      known case participants. Case-scoped messages come to participants from the
      CASE_MANAGER (PCR-08-001). An Activity whose `actor` names the requesting
      participant is not a delegation that the CASE_MANAGER authorized. Thus the
      receiver can reject it or route it incorrectly. For example, a Coordinator refuses
      an ownership-transfer Offer whose `actor` names the Finder.
    verification: Integration tests in `test/demo/` confirm that a delegated Activity emitted by
      the CASE_MANAGER on behalf of a participant carries the CASE_MANAGER's actor ID in the `actor`
      field.
    relationships:
    - rel_type: refines
      spec_id: CM-02-009
    stories:
    - story_2022_089
    - story_2022_036
  - id: CM-24-002
    priority: MUST
    kind: protocol
    statement: >-
      When a delegated Activity is emitted by the CASE_MANAGER, the
      `attributed_to` field MUST be set to the requesting participant's actor
      ID so that receivers can recover the originating identity.
    rationale: >-
      `attributed_to` is the AS2-standard field for recording who delegated an
      action.  Without it, the intent of the message cannot be attributed to the
      correct participant, and audit trails are incomplete.
    verification: Integration tests in `test/demo/` confirm that a delegated Activity carries
      the requesting participant's actor ID in the `attributed_to` field.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    stories:
    - story_2022_089
    - story_2022_034
  - id: CM-24-004
    priority: MUST
    kind: architecture
    statement: >-
      Trigger use cases that emit delegated Activities MUST queue the constructed
      Activity in the CASE_MANAGER's outbox, not in the requesting participant's outbox.
    rationale: >-
      The outbox of the CASE_MANAGER is the delivery path to other participants. If the
      requesting actor's outbox holds a delegated Activity, the activity bypasses the
      CASE_MANAGER as the authoritative intermediary. This breaks the `CaseLedgerEntry`
      audit trail.
    verification: >-
      `test/core/behaviors/test_store_scope.py::TestStoreForActorScoping` asserts a delegated emit
      reaches the co-hosted CASE_MANAGER's store, so the Activity and the outbox entry naming it land
      together.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    adr:
    - ADR-0073
    - ADR-0109
  - id: CM-24-009
    priority: MUST
    kind: architecture
    statement: >-
      Each delegated emit MUST sit in a composite gated on the executing actor holding
      `CVDRole.CASE_MANAGER` for the case, not on an `actor_id` comparison.
    rationale: >-
      The authority is a role in the case, and any Actor type can hold it. Thus a
      comparison of `actor_id` with a computed `case_actor_id` checks the wrong thing.
      When a role gate controls the emit, the executing actor is the CASE_MANAGER. Thus
      the activity and its outbox entry are always in one store (BT-05-006, ADR-0073).
      Without the gate, the helper allows identity spoofing. Any actor that reaches it
      can emit an `Announce` with the CASE_MANAGER as author to every participant.
    verification: >-
      `test/core/behaviors/case/nodes/test_role_gates.py::TestCaseManagerGate` asserts
      the
      gate admits only the `CVDRole.CASE_MANAGER` holder. Verified this way rather than
      by
      inspecting for `self._actor_id = case_actor_id`, which ADR-0073 removed.
    relationships:
    - rel_type: extends
      spec_id: CM-24-004
    adr:
    - ADR-0073
  - id: CM-24-010
    priority: MUST
    kind: architecture
    statement: >-
      The delegated emit MUST execute on the container that hosts the CASE_MANAGER. A
      requesting participant whose container does not host it sends the CASE_MANAGER its
      own activity, and the CASE_MANAGER's received tree performs the delegated emit.
    rationale: >-
      An emit in the name of the CASE_MANAGER from a container that does not host it
      bypasses the CASE_MANAGER. The activity leaves a store that does not hold the
      ledger. The canonical entry can then come only from a copy of the emit that is
      delivered to the CASE_MANAGER. Also, such a container cannot sign the activity
      (OX-10).
    verification: >-
      `test_invite_is_queued_in_the_owners_outbox_only` and
      `test_offer_is_queued_in_the_owners_outbox_only` in
      `test/core/use_cases/triggers/test_actor_triggers.py` assert that a requester's
      trigger queues only its own activity, and
      `test_case_manager_makes_the_offer_the_owner_proposed` in the same file asserts
      the CASE_MANAGER's received tree makes the delegated emit.
    relationships:
    - rel_type: extends
      spec_id: CM-24-004
    adr:
    - ADR-0109
  - id: CM-24-011
    priority: MUST_NOT
    kind: architecture
    statement: >-
      A container MUST NOT execute a tree, or enqueue an activity, as an actor it does
      not host (ADR-0109).
    rationale: >-
      A container holds the stores, keys and outboxes of its own actors only. A tree
      run as another actor would write to a store that is not that actor's, and an
      activity enqueued for it would leave from an outbox that cannot sign for it
      (OX-10).
    verification: >-
      `test_a_trigger_cannot_execute_as_a_foreign_authority` in
      `test/architecture/test_triggers_execute_only_as_hosted_actors.py` asserts that a
      trigger cannot execute as an actor its container does not host.
    relationships:
    - rel_type: depends_on
      spec_id: CM-24-010
    adr:
    - ADR-0109
  - id: CM-24-005
    priority: MUST
    kind: project
    statement: >-
      Every path that emits an Activity on another participant's behalf MUST obtain the
      Activity's `actor` and `attributed_to` from one shared helper. Such a path is a
      trigger use case, or a received-side tree performing the CM-24-010 delegated emit.
    rationale: >-
      If each call site builds the `actor`/`attributed_to` pair again, the pair can
      become different at different sites. A wrong pair attributes the act to the wrong
      actor, or makes the act fail authentication (CM-24-001, CM-24-002). The
      received-side relay is also a delegated emit (CM-24-010).
    verification: >-
      `test/architecture/test_delegated_attribution_uses_helper.py` confirms
      that every trigger use case and every received-side tree emitting a
      delegated Activity takes `actor` and `attributed_to` from the one shared
      helper (`delegated_authorship()` in
      `vultron/core/behaviors/delegated_authorship.py`).
    relationships:
    - rel_type: refines
      spec_id: CM-24-004
  - id: CM-24-012
    priority: MUST
    kind: project
    statement: >-
      The shared delegated-authorship helper (CM-24-005) MUST set `actor` to the actor
      doing what was asked, and `attributed_to` to the actor that asked. The doer is the
      CASE_MANAGER executing the gated tree. The asker is the trigger's requesting
      actor,
      or the sender of the activity the received tree acts on.
    rationale: >-
      Neither value needs a calculation, because the emit point knows the doer and the
      requester. The CASE_MANAGER is the `actor` that receivers authenticate
      (CM-24-001), and `attributed_to` recovers who asked (CM-24-002).
    verification: >-
      `test_actor_is_the_doing_actor` and `test_attributed_to_is_the_requesting_actor`
      in `test/core/behaviors/test_delegated_authorship.py` assert the helper's two
      values.
    relationships:
    - rel_type: extends
      spec_id: CM-24-005
  - id: CM-24-013
    priority: MUST
    kind: project
    statement: >-
      The shared delegated-authorship helper (CM-24-005) MUST live in a module that both
      use cases and BT nodes may import (BTND-04-003).
    rationale: >-
      The received side builds delegated emits in BT nodes, and the trigger side in use
      cases. If BT nodes could not import the helper, the received side would have to
      build the pattern again by hand.
    verification: >-
      `test/architecture/test_delegated_attribution_uses_helper.py` reads the helper
      from
      `vultron/core/behaviors/delegated_authorship.py` and passes only when callers
      under
      both `vultron/core/use_cases/` and `vultron/core/behaviors/` take their
      attribution from it, which they can do only by importing it.
    relationships:
    - rel_type: extends
      spec_id: CM-24-005
    - rel_type: depends_on
      spec_id: BTND-04-003
  - id: CM-24-006
    priority: MUST
    kind: protocol
    statement: >-
      A case MUST have a participant holding `CASE_MANAGER` from case creation onward.
      Both creation paths register one: a dedicated CASE_MANAGER actor holding
      `COORDINATOR` + `CASE_MANAGER` under ADR-0041, or the creating actor as
      `CASE_OWNER` + `CASE_MANAGER` under CM-02-015. Role delegation transfers it
      without a gap.
    rationale: >-
      Both creation paths register a CASE_MANAGER, and delegation transfers the role
      without a gap. Thus no correct path creates a case without one, and every
      case-scoped message has the CASE_MANAGER to go through (PCR-08-001).
    verification: >-
      Tests of both case-creation trees, such as
      `test_create_case_trigger_registers_owner_and_manager` in
      `test/core/use_cases/triggers/case/test_create.py`, assert a `CASE_MANAGER` holder
      exists in `actor_participant_index` after creation.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
    - rel_type: depends_on
      spec_id: CM-22-002
    adr:
    - ADR-0113
    - ADR-0109
    stories:
    - story_2022_106
  - id: CM-24-014
    priority: MUST
    kind: protocol
    statement: >-
      An actor that finds no CASE_MANAGER for a case MUST fail the act, never sending
      the
      activity directly to another participant instead (CM-24-008).
    rationale: >-
      An actor that finds no CASE_MANAGER reads a corrupt roster, since a case always
      has one (CM-24-006). A direct send to a participant would bypass the ledger and
      the recipient rules (PCR-08-001). It would also hide the corruption behind an
      apparent success. A failed act shows the corruption (ADR-0113).
    verification: >-
      Tests of the close-case emit and the embargo teardown announce assert the act
      fails, sending nothing, when no holder is found:
      `test/core/behaviors/status/nodes/test_lifecycle.py::TestEmitCloseCaseNode::test_fails_when_case_manager_id_missing`
      and
      `test/core/behaviors/embargo/nodes/test_teardown.py::TestSendAnnounceEmbargoEventNode::test_fails_when_no_case_manager`.
      Until the retirement lands these failure tests are strict `xfail`s naming their
      tracking issue. `test_delegated_trigger_fails_when_no_case_manager_holds_the_role`
      in `test/core/use_cases/triggers/test_case_manager_never_unfilled.py` asserts a
      delegated trigger fails when no participant holds the role.
    relationships:
    - rel_type: depends_on
      spec_id: CM-24-006
    adr:
    - ADR-0113
    - ADR-0109
    stories:
    - story_2022_106
  - id: CM-24-008
    priority: MUST_NOT
    kind: project
    statement: >-
      A trigger, received tree or shared helper in this codebase MUST NOT carry an arm
      for a case with no CASE_MANAGER (CM-24-014).
    rationale: >-
      How this codebase keeps CM-24-014 from being bypassed; split from CM-24-006 so
      CM-24-006 states only that a case always has a CASE_MANAGER and that no activity
      goes around it (MS-12-010). Trees, helpers and resolvers are this codebase's
      structure.
    verification: >-
      Until #3964 retires the success-with-a-warning arms, the strict `xfail`s
      `test/core/behaviors/status/nodes/test_lifecycle.py::TestEmitCloseCaseNode::test_fails_when_case_manager_id_missing`
      and `test/core/behaviors/embargo/nodes/test_teardown.py::TestSendAnnounceEmbargoEventNode::test_fails_when_no_case_manager`
      track the two that remain.
    relationships:
    - rel_type: implements
      spec_id: CM-24-014
  - id: CM-24-015
    priority: MUST
    kind: project
    statement: >-
      A resolver in this codebase that finds no CASE_MANAGER for a case MUST fail, never
      succeeding with a warning.
    rationale: >-
      A success with a warning lets the caller go on as if a CASE_MANAGER were found,
      which is the arm CM-24-008 forbids. A failure stops the act, as CM-24-014
      requires.
    verification: >-
      `test/core/test_fail_fast_silent_sites.py` confirms the sender node and the
      CASE_MANAGER check return FAILURE when no CASE_MANAGER holder is found, and
      `test/core/use_cases/triggers/test_case_manager_never_unfilled.py` confirms a
      delegated trigger fails when no participant holds the CASE_MANAGER role.
    relationships:
    - rel_type: extends
      spec_id: CM-24-008
  - id: CM-24-007
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER forwards a recorded activity for its sender (CM-33-008), the
      forward MUST carry one id, derived from that activity, on every attempt.
    rationale: >-
      One id makes a resend safe. The outbox holds one pending entry for each id
      (OX-06-002). The addressee commits nothing, and it builds its answer again with
      the same id.
    verification: >-
      `test_a_repeated_forward_is_answered_under_the_same_id_at_the_target` and
      `test_a_forward_that_fails_keeps_nothing_and_redelivery_runs_afresh` in
      `test/core/use_cases/received/actor/test_role_offer_routing.py` assert the forward
      carries its derived id on every attempt. The ownership-transfer Offer is not a
      forward: the CASE_MANAGER makes it from the owner's proposal and ledgers it once
      queued (CM-21-028,
      CM-21-029, ADR-0148), so it is out of scope here.
    relationships:
    - rel_type: refines
      spec_id: CM-24-004
    - rel_type: depends_on
      spec_id: OX-06-002
    stories:
    - story_2022_050
    - story_2022_035
  - id: CM-24-016
    priority: MUST
    kind: protocol
    statement: >-
      A forwarded activity's record and its forward (CM-24-007) MUST commit as one act
      (CLP-07-015), so a failure to build or send the forward keeps neither.
    rationale: >-
      The record comes before the forward (CLP-10-006). If a forward fails after the
      CASE_MANAGER keeps its record, the ledger holds a request that its addressee never
      received and cannot answer. When the record and the forward are in one act, every
      recorded request has its forward.
    verification: >-
      `test_a_forward_that_fails_keeps_nothing_and_redelivery_runs_afresh` and
      `test_a_forward_stored_but_not_queued_is_queued_on_redelivery` in
      `test/core/use_cases/received/actor/test_role_offer_routing.py` fail the forward
      after the record, and fail queuing a stored forward, and assert that no entry and
      no forward is kept: a stored copy is not proof it was sent.
    relationships:
    - rel_type: extends
      spec_id: CM-24-007
    - rel_type: depends_on
      spec_id: CLP-10-006
    stories:
    - story_2022_050
    - story_2022_035
  - id: CM-24-017
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT report a failure to build or send a forward (CM-24-016)
      as a refusal of the sender (HP-01-003).
    rationale: >-
      A failed forward is a fault of the CASE_MANAGER, not of the sender. A refusal
      would tell the sender that its request is not valid, which is false.
    verification: >-
      `test_a_forward_that_fails_keeps_nothing_and_redelivery_runs_afresh` in
      `test/core/use_cases/received/actor/test_role_offer_routing.py` asserts the
      handler raises an internal error, not `REFUSED`.
    relationships:
    - rel_type: extends
      spec_id: CM-24-016
    stories:
    - story_2022_050
    - story_2022_035
  - id: CM-24-018
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST process a redelivery of an activity whose first delivery
      failed to forward (CM-24-016) as a new delivery.
    rationale: >-
      The failed act kept nothing, so the redelivery has no record or forward to
      complete. Processing it afresh records the activity once and sends its forward.
    verification: >-
      `test_a_forward_that_fails_keeps_nothing_and_redelivery_runs_afresh` and
      `test_a_forward_stored_but_not_queued_is_queued_on_redelivery` in
      `test/core/use_cases/received/actor/test_role_offer_routing.py`, and
      `test_a_failed_role_offer_forward_commits_when_posted_again` in
      `test/adapters/driving/fastapi/test_failed_case_act_redelivery.py`, assert that a
      redelivery records the activity once and sends one forward under the derived id.
    relationships:
    - rel_type: extends
      spec_id: CM-24-016
    stories:
    - story_2022_050
    - story_2022_035
  - id: CM-24-019
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST send nothing for a redelivery of an activity it has already
      recorded and forwarded (CM-24-007).
    rationale: >-
      Every recorded request already has its forward (CM-24-016). Thus a redelivery
      never has a forward to complete, and a second forward would only repeat the
      first.
    verification: >-
      `test_redelivered_offer_is_skipped_with_no_second_entry_or_forward` and
      `test_a_redelivery_after_the_forward_was_sent_sends_nothing` in
      `test/core/use_cases/received/actor/test_role_offer_routing.py` assert that a
      redelivery after the role Offer was recorded sends nothing, and adds no second
      outbox entry while the forward is pending.
    relationships:
    - rel_type: extends
      spec_id: CM-24-016
    stories:
    - story_2022_050
    - story_2022_035

- id: CM-25
  title: Observer Participant Semantics
  description: >-
    Requirements for the CVDRole.OBSERVER role (formerly CVDRole.OTHER):
    what an Observer IS, how it is admitted, what content it receives,
    and how the RM lifecycle applies. Codified by ADR-0057
    (docs/adr/0057-observer-participant-role.md). Source: CONCERN-2093.
  specs:
  - id: CM-25-001
    priority: MUST
    kind: protocol
    statement: >-
      An Observer (`OBSERVER`) is a Tier-1 case participant: it MUST hold a
      `CaseParticipant` record, run the standard RM lifecycle, and satisfy the same
      embargo-consent gate (MV-10-005) as any other participant. `OBSERVER` is the base
      role — the lowest non-null privilege set in the Vultron protocol. All other CVD
      roles are additive to it.
    rationale: >-
      Defining Observer as a full participant (not a passive consumer or an
      external T0 actor) ensures it is subject to the same admission and
      embargo-consent rules as Vendors and Coordinators. The "base role" framing
      establishes OBSERVER as the correct fallback when no other role applies,
      rather than leaving CVDRole.OTHER as an unspecified catch-all.
      See ADR-0057.
    verification: Integration tests in `test/demo/` confirm that an Observer participant holds a
      `CaseParticipant` record, runs the standard RM lifecycle, and satisfies the
      embargo-consent gate before receiving case content.
    adr:
    - ADR-0057
    stories:
    - story_2022_063
    - story_2022_013
  - id: CM-25-002
    priority: MUST
    kind: protocol
    statement: >-
      An Observer MUST be admitted to a case via the standard `Invite`/`Accept` flow
      defined in CM-17.
    rationale: >-
      Requiring a non-empty `case_roles` value is load-bearing: the participant
      record created with the stub Invite (CM-11-026) carries the roles that
      Invite names. A missing or empty list would create an
      Observer participant with no role — indistinguishable from a defect.
    verification: Integration tests in `test/demo/` confirm that an Observer is admitted to a
      case only via the standard `Invite`/`Accept` flow defined in CM-17.
    relationships:
    - rel_type: refines
      spec_id: CM-17-003
    - rel_type: refines
      spec_id: CM-16-003
    adr:
    - ADR-0057
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_054
    - story_2022_063
  - id: CM-25-003
    priority: MUST
    kind: protocol
    statement: >-
      An Observer MUST receive full case content once it is an active participant
      (CM-10-004). That check is the sole gate on case content for an Observer. No
      additional or reduced delivery tier applies.
    rationale: >-
      An Observer that accepts the stub Invite consents to the active embargo
      (MV-10-006). The absence of a remediation function does not change what
      the Observer is entitled to receive once it is active. Introducing a separate
      reduced delivery tier for Observers is deferred: `notes/selective-disclosure.md`
      describes the potential future mechanism but it is not yet implemented.
    verification: >-
      Integration tests in `test/demo/` confirm that an active Observer receives full
      case content with no additional content restrictions.
    relationships:
    - rel_type: depends_on
      spec_id: CM-10-004
    - rel_type: depends_on
      spec_id: MV-10-005
    - rel_type: depends_on
      spec_id: MV-10-006
    adr:
    - ADR-0057
    - ADR-0114
    stories:
    - story_2022_063
    - story_2022_082
  - id: CM-25-004
    priority: SHOULD
    kind: protocol
    statement: >-
      After accepting a case invitation and receiving the full case replica, an
      Observer SHOULD run the standard RM triage cycle (CM-11-002):
      RM.VALID or RM.INVALID, then RM.ACCEPTED or RM.DEFERRED.
      For an Observer, RM.ACCEPTED means "I am actively engaged with / monitoring
      this case" — it does NOT imply commitment to develop or deploy a fix.
    rationale: >-
      The RM triage cycle represents an Observer's assessment of whether the
      case is relevant to them and whether they intend to remain engaged. An
      Observer that determines the case is outside their scope should transition
      to RM.INVALID or RM.DEFERRED, not silently stay at RM.RECEIVED. This
      preserves the RM machine's semantics as a participation-intent signal.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-002
    adr:
    - ADR-0057
  - id: CM-25-005
    priority: MUST_NOT
    kind: protocol
    verification: >-
      `test/core/behaviors/case/nodes/test_vfd_role_guards.py::test_not_sole_observer_failure_for_sole_observer_actor`
      and
      `test/core/use_cases/triggers/case/test_add_participant_status.py::TestSoleObserverVfdGuard::test_sole_observer_vf_transition_blocked_end_to_end`
      confirm a sole-Observer participant cannot emit a VFD transition.
    statement: >-
      A participant whose only case role is OBSERVER MUST NOT emit VFD state-transition
      messages (CV, CF, or CD). An Observer has no vendor-fix-deployment obligations and no
      authority to advance the VFD dimension on behalf of a product or service.
    note: >-
      This restriction is scoped to sole-OBSERVER participants. When
      CVDRole.OBSERVER is combined with any role that carries VFD obligations
      (CVDRole.VENDOR, CVDRole.DEPLOYER), the union-of-permissions rule (CM-26-001)
      applies: the VFD obligations of the co-role supersede this restriction.
      Code checking this exclusion MUST test `case_roles == [CVDRole.OBSERVER]`
      (or equivalent sole-role check), NOT merely `CVDRole.OBSERVER in case_roles`.
    rationale: >-
      An Observer joined the case to monitor it, not to own a fix path. Permitting
      VFD emissions from a role with no fix obligations would corrupt the VFD state
      machine for the case (e.g., a monitoring actor falsely claiming fix deployment).
    relationships:
    - rel_type: refines
      spec_id: CM-03-005
    adr:
    - ADR-0057
  - id: CM-25-006
    priority: MUST
    kind: protocol
    statement: >-
      The `Invite` activity sent by the CASE_MANAGER for an Observer MUST carry
      `case_roles` naming `OBSERVER` only.
    rationale: >-
      The stub Invite creates the participant record and gives it the roles that the
      Invite names (CM-11-006). An Invite without `CVDRole.OBSERVER` would create a
      participant with an empty role list. Role checks cannot tell that record from a
      record that lost its roles. An Invite that names other roles would give the
      Observer obligations or authority that it was not invited to hold.
    verification: Integration tests in `test/demo/` confirm that the `Invite` activity for an
      Observer embeds `case_roles=[CVDRole.OBSERVER]`.
    relationships:
    - rel_type: refines
      spec_id: CM-25-002
    adr:
    - ADR-0057
    - ADR-0114
    stories:
    - story_2022_053
    - story_2022_063
  - id: CM-25-007
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection confirms Observer invitations carry `case_roles=[CVDRole.OBSERVER]` and
      that the CM-16-003 non-empty invariant rejects an empty `case_roles` list.
    statement: >-
      An Observer invitation MUST NOT carry an empty case-roles list: an empty list names no
      role, so the invitee's participant record would violate the CM-16-003 non-empty
      invariant.
    rationale: >-
      `[]` provides no role information to the CASE_MANAGER's participant-creation path
      on the stub Invite (CM-11-006), producing a participant record that violates the
      non-empty role invariant enforced by CM-16-003.
    relationships:
    - rel_type: refines
      spec_id: CM-25-006
    adr:
    - ADR-0057
    - ADR-0114

- id: CM-26
  title: Role Stacking — Union of Permissions
  description: >-
    Requirement governing how conflicting obligations are resolved when a
    participant holds multiple CVD roles simultaneously. Codified by ADR-0057.
    Source: CONCERN-2093.
  specs:
  - id: CM-26-001
    priority: MUST
    kind: protocol
    statement: >-
      Each actor MUST judge a participant's permitted and obligated actions by the
      **union** of what its case roles permit. A `MUST NOT` attached to one role gives
      way when another of its `case_roles` carries a `MAY`, `SHOULD` or `MUST` for the
      same action class.
    note: >-
      Example: CVDRole.OBSERVER MUST NOT emit VFD transitions (CM-25-005), but
      CVDRole.DEPLOYER SHOULD emit the D transition when a fix is deployed.
      A participant holding both roles SHOULD emit VFD/D transitions, because
      DEPLOYER's SHOULD overrides OBSERVER's MUST NOT.
    rationale: >-
      CVD roles represent orthogonal functions a participant may perform. When a
      participant holds more than one function (e.g., a security researcher who
      is also a Deployer for an affected product), restricting them based on their
      least-capable role would incorrectly limit their protocol participation.
      The union model prevents role restrictions from blocking obligations that
      exist under a co-role.
    verification: Integration tests in `test/demo/` confirm that a participant holding both
      `CVDRole.OBSERVER` and `CVDRole.DEPLOYER` is permitted to emit VFD transitions because the
      DEPLOYER obligation supersedes the OBSERVER restriction.
    relationships:
    - rel_type: refines
      spec_id: CM-25-005
    adr:
    - ADR-0057
    stories:
    - story_2022_036
    - story_2022_063
- id: CM-28
  title: Embargo Invite RSVP Deadlines
  description: >-
    Requirements for the optional RSVP-by deadline carried on an embargo
    invitation, the authority relationship between that wire value and the
    CM-18-023 pocket-veto policy window, and how an expiry is recorded.
    Codified by ADR-0065. Source: IDEA-2066.
  specs:
  - id: CM-28-001
    priority: MUST
    kind: protocol
    statement: >-
      An actor that reads an `Invite(EmbargoEvent)` MUST read its activity-level
      `end_time`, when present, as the RSVP-by deadline for that invitation. After
      that instant the invitation is no longer open.
    note: >-
      CRITICAL naming hazard: an embargo invitation carries TWO `end_time`
      fields one nesting level apart in the same JSON document.
      `Invite.end_time` is the RSVP-by deadline for the invitation;
      `Invite.object_.end_time` (on the nested `as_EmbargoEvent`) is when the
      embargo itself ends. Code MUST read these independently and MUST NOT
      substitute one for the other. The embargo invitation is an `as_Invite`,
      not an `as_Offer` — see `em_propose_embargo_activity()` in
      `vultron/wire/as2/factories/embargo.py`.
    rationale: >-
      `as_Object.end_time` is inherited by `as_Activity` and therefore by every
      Vultron activity, so no vocabulary extension is required. On an Activity,
      AS2 `end_time` already means "valid until", making the RSVP reading
      idiomatic rather than a repurposing. Placing the deadline on the activity
      rather than on the embargo object is what allows the same embargo to be
      offered to several actors with different deadlines, and to one actor twice.
      See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that `Invite.end_time` on an embargo
      invitation is parsed as the RSVP-by deadline for the invitation.
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-017
    priority: MAY
    kind: protocol
    statement: >-
      An `Invite(EmbargoEvent)` activity MAY carry an activity-level `end_time`.
    rationale: >-
      Every AS2 activity inherits `end_time` from `as_Object`, so a sender can state
      the RSVP-by deadline with no vocabulary extension. The field stays optional:
      without it, the CM-18-023 policy window sets the deadline (CM-28-019). See
      ADR-0065.
    verification: >-
      `test_em_propose_embargo_rsvp_deadline_sets_end_time` and
      `test_em_propose_embargo_no_rsvp_deadline_end_time_is_none` in
      `test/wire/as2/factories/test_embargo_factories.py` build an embargo Invite
      with and without its `end_time`.
    relationships:
    - rel_type: extends
      spec_id: CM-28-001
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-018
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor that reads an `Invite(EmbargoEvent)` MUST NOT read its activity-level
      `end_time` as the embargo's expiry.
    rationale: >-
      An embargo invitation carries two `end_time` fields one nesting level apart:
      the Invite's is the RSVP-by deadline, and the nested `EmbargoEvent`'s is when
      the embargo ends. A reader that takes one for the other lapses the invitation
      or the embargo at the wrong instant. See ADR-0065.
    verification: >-
      `test_invite_rsvp_deadline_distinct_from_embargo_end_time` in
      `test/wire/as2/test_extractor.py` asserts that the extracted RSVP deadline is
      the Invite's `end_time`, not the embargo's.
    relationships:
    - rel_type: extends
      spec_id: CM-28-001
    adr:
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-002
    priority: MUST
    kind: protocol
    statement: >-
      When an `Invite(EmbargoEvent)` carries an `end_time`, that value MUST be
      authoritative for the invitation's expiry, superseding the receiver's local
      policy window. The resulting deadline stays subject to the EP-07-006 ceiling.
    rationale: >-
      An explicit wire value lets both parties calculate the same lapse time from the
      same field, with no more messages. A window that only the receiver knows does not
      let the two parties agree if an invitation is still open. See ADR-0065.
    note: >-
      Amended by ADR-0096. "Authoritative" settles precedence between the wire value and the
      receiver's local policy window; it does not exempt the wire value from
      EP-07-011, which clamps any computed deadline down to the embargo's own
      `end_time`. CM-28-011 binds the same
      ceiling to the CM-18-023 fallback path.
      An explicit `Invite.end_time` that outlives the
      embargo is still clamped.
    verification: Integration tests in `test/demo/` confirm that when `Invite.end_time` is
      present it is used as the authoritative invitation expiry, and that the effective
      deadline is clamped down to the embargo's `end_time` where it would otherwise
      overshoot
      it.
    relationships:
    - rel_type: refines
      spec_id: CM-18-002
    - rel_type: depends_on
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-019
    priority: MUST
    kind: protocol
    statement: >-
      When an `Invite(EmbargoEvent)` carries no `end_time`, the CM-18-023 policy
      window MUST set the invitation's expiry. The resulting deadline stays subject
      to the EP-07-006 ceiling.
    rationale: >-
      An Invite without a deadline still needs one, and a sender that predates
      ADR-0065 sends none. The policy window keeps the behaviour those invitations
      had before the wire value existed. See ADR-0065 and ADR-0096.
    verification: >-
      `test_prepare_for_dispatch_applies_configured_rsvp_window` in
      `test/adapters/driving/fastapi/test_inbox_handler.py` asserts that an Invite
      with no `end_time` gets the configured window from its `published` time.
    relationships:
    - rel_type: extends
      spec_id: CM-28-002
    - rel_type: depends_on
      spec_id: EP-07-006
    adr:
    - ADR-0065
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-003
    priority: MUST
    kind: protocol
    statement: >-
      The actor holding `CASE_MANAGER` MUST be the enforcement authority for embargo
      invite expiry.
    note: >-
      The `EmbargoTimerExpired` Sentinel (#1893) is an OPTIONAL proactive
      accelerator that narrows the gap between the deadline and the recorded
      lapse. It MUST NOT be a prerequisite for CM-28 conformance.
    rationale: >-
      Centralising enforcement at the CASE_MANAGER matches the case-communication model
      (PCR-08) and the CASE_MANAGER's role as canonical ledger author (ADR-0019, ADR-0021).
      See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that the CASE_MANAGER holding
      `CVDRole.CASE_MANAGER` is the entity that records a PEC `DECLINED` transition when an
      embargo invitation lapses.
    adr:
    - ADR-0065
    stories:
    - story_2022_023
    - story_2022_014
  - id: CM-28-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record an expired invitation as the consent row's
      `TIMED_OUT` state, by the `TIME_OUT` trigger (`INVITED → TIMED_OUT`), never as
      `DECLINED`.
    rationale: >-
      A participant that did not answer made no decision, and code, logs, demos and replicas read
      the consent row, not ledger provenance (ADR-0118). An expired participant is re-invitable
      (CM-18-003), excluded from embargoed content like any non-signatory
      (CM-10-004), and returned to `AGREED` by a late Accept the CASE_MANAGER
      honours — a signatory only if that embargo is in force (EMB-17-002,
      MSM-07-003). ADR-0118 reverses ADR-0065's choice to record a lapsed
      invitation as `DECLINED`.
    note: >-
      "Invitation" here is an `Invite(EmbargoEvent)`. An expired stub Invite
      (`Invite(Actor)[target=VulnerabilityCaseStub]`) carries embargo terms but changes
      no participant state, consent included (CM-11-040): an unanswered stub is
      not a refusal to join, and the CASE_MANAGER may re-invite on the same
      record (CM-11-015, ADR-0114).
    verification: >-
      A unit test confirms that the CASE_MANAGER's expiry evaluation moves an `INVITED` participant
      past its deadline to `TIMED_OUT`, not `DECLINED`.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0065
    - ADR-0118
    stories:
    - story_2022_027
    - story_2022_014
  - id: CM-28-020
    priority: MUST
    kind: protocol
    statement: >-
      A consent row MUST reach `DECLINED` only by an explicit refusal.
    rationale: >-
      Reserving `DECLINED` for an explicit refusal lets the consent row tell "never
      responded" from "explicitly declined". Code, logs, demos and replicas read the
      row, not ledger provenance, so the row must carry the difference (ADR-0118).
    verification: >-
      `test_a_late_reject_times_out_then_declines` in
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` asserts
      that an overdue row is `TIMED_OUT` by the sweep and becomes `DECLINED` only
      on the invitee's explicit `Reject`.
    relationships:
    - rel_type: extends
      spec_id: CM-28-004
    adr:
    - ADR-0118
    stories:
    - story_2022_027
    - story_2022_014
  - id: CM-28-005
    priority: MUST
    kind: protocol
    statement: >-
      An expired embargo invitation MUST be distinguishable from an explicit refusal both in the participant's consent row (`TIMED_OUT` versus `DECLINED`, CM-28-004) and in the canonical case
      ledger (CM-28-009).
    rationale: >-
      The canonical ledger is the project's history mechanism (ADR-0019), so expiry-versus-refusal
      is recoverable from it; since ADR-0118 the consent row carries the distinction too, so a
      reader that consults only the participant record also sees it. See ADR-0065, ADR-0118.
    verification: >-
      Inspection of `vultron/core/` confirms that an expiry is recorded as the
      CASE_MANAGER's `Update(EmbargoConsent)` carrying a `TIMED_OUT` row, never as
      the invitee's `Reject(Invite(EmbargoEvent))`, whose row is `DECLINED`, and
      that the participant records `TIMED_OUT` rather than `DECLINED`.
    adr:
    - ADR-0065
    - ADR-0118
    stories:
    - story_2022_045
    - story_2022_074
  - id: CM-28-006
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST normalise an inbound `Invite.end_time` to UTC before it
      compares the value with the current time (CS-13-001).
    note: >-
      CS-13-001 governs datetimes the application *produces*; an inbound
      `end_time` is produced by a remote peer and may legitimately carry a
      non-UTC offset (e.g. `+05:00`). Normalising on receipt keeps deadline
      comparison correct without requiring peers to send `Z`. ADR-0032
      (`validate_datetime` on `as_Object`) ensures all datetime fields —
      including `end_time` — are UTC-aware before leaving the wire layer, so
      naive values are never forwarded to the extractor or core.
    rationale: >-
      A deadline compared in the wrong timezone lapses at the wrong instant,
      breaking the bilateral determinism CM-28-002 exists to provide. ADR-0032's
      edge normalisation (naive → UTC) prevents this without per-field guarding
      in the extractor. See CS-13-001 through CS-13-005 and ADR-0065.
    verification: >-
      `test_inbound_invite_with_offset_less_end_time_parses_to_utc` in
      `test/core/models/test_embargo_event.py` and `test_naive_deadline_is_read_as_utc`
      in `test/core/models/test_case_participant.py` confirm that an inbound end time
      reaches core UTC-aware.
    relationships:
    - rel_type: refines
      spec_id: CS-13-009
    adr:
    - ADR-0065
    - ADR-0032
  - id: CM-28-021
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST normalise a naive (not timezone-aware) `Invite.end_time`
      to UTC at the wire edge (ADR-0032).
    rationale: >-
      Normalising at the edge means every downstream comparison is against a
      timezone-aware value, with no per-field guard in the extractor. A naive value
      that reached core would compare in the wrong timezone and lapse at the wrong
      instant (CM-28-002).
    verification: >-
      `test_invite_rsvp_deadline_normalized_when_naive_end_time` in
      `test/wire/as2/test_extractor.py` confirms that a naive `Invite.end_time` is
      normalised to UTC by `validate_datetime` at the wire edge and produces a valid
      `rsvp_deadline`, not rejected or dropped.
    relationships:
    - rel_type: implements
      spec_id: CM-28-006
    adr:
    - ADR-0032
    - ADR-0065
  - id: CM-28-007
    priority: MUST
    kind: project
    statement: >-
      Embargo invite expiry MUST be evaluated lazily: expiry is derived from `(end_time, now)`
      whenever a participant's consent rows are read or an inbound `Accept`/`Reject` for the invitation
      is processed.
    rationale: >-
      Lazy derivation from an explicit deadline is deterministic and requires no new
      infrastructure. No scheduler exists in production, and the Sentinel invocation
      model remains an open question (notes/coordination-agents.md). See ADR-0065.
    verification: Inspection of `vultron/core/` confirms that embargo invite expiry is evaluated
      lazily at read or process time from `(end_time, now)` rather than via a scheduled job.
    relationships:
    - rel_type: refines
      spec_id: CM-28-003
    adr:
    - ADR-0118
    - ADR-0065
  - id: CM-28-008
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms embargo invite expiry is evaluated lazily against the stored
      deadline when a later event reads the row, with no scheduler or Sentinel runtime
      on the correctness path.
    statement: >-
      Implementations MUST NOT require a scheduler or Sentinel runtime for embargo invite
      expiry correctness.
    rationale: >-
      No scheduler exists in production; making correctness depend on one would render
      conformance impossible without new infrastructure. The Sentinel is an optional
      accelerator only. See ADR-0065.
    relationships:
    - rel_type: refines
      spec_id: CM-28-003
    adr:
    - ADR-0065
  - id: CM-28-009
    priority: MUST
    kind: protocol
    statement: >-
      When an RSVP deadline passes unanswered, the CASE_MANAGER MUST record the expiry
      as its own `Update(EmbargoConsent)` with the invitee's full `TIMED_OUT` row,
      committed as sent. The entry differs from the invitee's
      `Reject(Invite(EmbargoEvent))`, whose row is `DECLINED`.
    rationale: >-
      The expiry is the occasion and the `Update` is the CASE_MANAGER's act on it,
      a real AS2 activity (ADR-0140). The `TIMED_OUT` row it carries makes
      expiry-versus-refusal distinguishable in the ledger (CM-28-005), and it is
      how a replica learns the `TIMED_OUT` state without computing it (CM-28-014).
      A second, invitee-attributed entry would record an act nobody sent. See
      ADR-0065, ADR-0118.
    verification: >-
      `test/architecture/test_no_hand_built_payload_snapshots.py` confirms that
      core builds no activity-shaped snapshot by hand, and
      `test/core/use_cases/received/test_embargo_activation_copy.py::TestInviteTimeOut`
      confirms that an expiry commits one CASE_MANAGER `Update(EmbargoConsent)`
      carrying the `TIMED_OUT` row.
    relationships:
    - rel_type: refines
      spec_id: CM-28-005
    adr:
    - ADR-0065
    - ADR-0118
    - ADR-0124
    stories:
    - story_2022_045
    - story_2022_074
  - id: CM-28-022
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT record an invitation's expiry as an activity
      attributed to the invitee, which sent nothing.
    rationale: >-
      An invitee-attributed entry would record an act that nobody sent, and a reader
      of the ledger would take the silence for the invitee's answer. The expiry is
      the CASE_MANAGER's own act on its own clock (ADR-0140). See ADR-0065,
      ADR-0118.
    verification: >-
      `test_the_expiry_is_the_timed_out_row` in
      `test/core/use_cases/received/test_embargo_activation_copy.py` confirms that
      an expiry commits one entry only, the CASE_MANAGER's
      `Update(EmbargoConsent)`.
    relationships:
    - rel_type: extends
      spec_id: CM-28-009
    adr:
    - ADR-0065
    - ADR-0118
    stories:
    - story_2022_045
    - story_2022_074
  - id: CM-28-010
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection of the consent-row model confirms it carries no reason field recording
      expiry versus refusal provenance.
    statement: >-
      The expiry-versus-refusal provenance MUST NOT be duplicated onto a consent row as
      a reason field.
    rationale: >-
      A `reason` discriminator on a consent row — which holds only the embargo id and the
      state — would be a second source of truth able to drift from the ledger. The canonical
      ledger is the sole record of provenance (ADR-0019). See ADR-0065.
    relationships:
    - rel_type: refines
      spec_id: CM-28-005
    adr:
    - ADR-0065
  - id: CM-28-011
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CM-18-023 policy window MUST NOT be applied so as to place the effective RSVP
      deadline after the embargo's own `end_time`. Where the window would overshoot, the
      deadline is the embargo's `end_time`.
    rationale: >-
      The policy window is a fixed duration (by default, 7 days) from the `published`
      timestamp of the invitation. It does not refer to the embargo that the invitation
      concerns. On a short embargo, the window causes a pocket veto after the embargo
      ends. It records an expiry for an invitation whose embargo is already over.
      EP-07-006 gives the general rule. This requirement applies it to the specific
      fallback path that CM-18-023 defines. See ADR-0096.
    verification: >-
      A unit test confirms that when the CM-18-002 policy window would place the deadline
      after the embargo's `end_time`, the embargo's `end_time` is used instead.
    relationships:
    - rel_type: refines
      spec_id: CM-18-002
    adr:
    - ADR-0096
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-012
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER relays an `Invite(EmbargoEvent)` to a participant
      (EP-09-002) it MUST set the Invite's `end_time` to that Invite's `published` time
      plus the configured RSVP window, subject to the EP-07-002 minimum and the
      EP-07-006 ceiling. The Invites of one relay round are emitted in sequence and need
      not share one deadline.
    rationale: >-
      If the wire carries no deadline, each receiving store uses the EP-07-001 window
      from its own `ActorConfig`. Two replicas can then disagree about when the same
      invitation closes. The relaying CASE_MANAGER is the enforcement authority
      (CM-28-003). It states the deadline one time, and every participant reads the same
      value from the same object. ASK-03-004 requires the same of an ask (ADR-0065,
      ADR-0113).
    verification: >-
      A test of the relay asserts every emitted Invite carries `end_time` equal to its
      `published` plus the configured window, clamped per EP-07-002, EP-07-006 and
      EP-07-011. Until the implementation lands the test is a strict `xfail`
      naming its tracking issue.
    relationships:
    - rel_type: refines
      spec_id: CM-28-002
    - rel_type: depends_on
      spec_id: EP-09-002
    - rel_type: depends_on
      spec_id: EP-07-002
    - rel_type: depends_on
      spec_id: EP-07-006
    adr:
    - ADR-0113
    - ADR-0065
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-013
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record an Invite's RSVP deadline on the invitee's `INVITED`
      row for that embargo, in an `Update(EmbargoConsent)` entry right after the
      Invite's (CLP-07-013).
    rationale: >-
      The deadline is case state about the invitee. As with all other case state, the
      CASE_MANAGER writes it one time, and it gets to replicas through the ledger
      (ADR-0108, ADR-0124). A deadline that a receiver writes would be in one store
      only. Replicas could then disagree about whether the invitation is open
      (ADR-0113).
    verification: >-
      A test asserts the invitee's `INVITED` row for the embargo carries the deadline in the
      CASE_MANAGER's store when the Invite emission is committed:
      `test/core/behaviors/embargo/nodes/test_relay.py::TestRelayEmbargoInviteToEachNode`
      (`test_each_invite_carries_the_managers_deadline_and_records_it`,
      `test_the_committed_entry_carries_the_deadline_for_replay`),
      and the deadline tests in `test/core/services/embargo_lifecycle/test_consent.py`
      (`test_a_fresh_invite_restamps_an_invited_rows_deadline`,
      `test_a_fresh_invite_without_a_deadline_drops_a_stale_one`).
    relationships:
    - rel_type: depends_on
      spec_id: CM-28-012
    adr:
    - ADR-0113
    - ADR-0065
    - ADR-0124
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-023
    priority: MUST
    kind: protocol
    statement: >-
      Every replica MUST record an Invite's RSVP deadline by copying the
      CASE_MANAGER's CM-28-013 `Update(EmbargoConsent)` entry (EP-09-007, ADR-0124).
    rationale: >-
      The deadline is case state about the invitee, so it reaches replicas through
      the ledger like all other case state (ADR-0108, ADR-0124). A replica that
      copies the entry holds the same deadline as the CASE_MANAGER, so the two agree
      on whether the invitation is open (ADR-0113).
    verification: >-
      `test_replica_records_invitee_deadline_from_relayed_invite_entry` in
      `test/core/behaviors/sync/test_announce_tree.py` asserts that a replica
      records the invitee's deadline when the entry is replayed.
    relationships:
    - rel_type: depends_on
      spec_id: CM-28-013
    - rel_type: depends_on
      spec_id: EP-09-007
    adr:
    - ADR-0113
    - ADR-0124
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-024
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant MUST NOT derive or store an RSVP deadline on receipt of an
      Invite (EP-09-003).
    rationale: >-
      A deadline that a receiver writes would be in one store only, and replicas
      could then disagree about whether the invitation is open. The CASE_MANAGER
      writes the deadline once (CM-28-013), and replicas copy it (CM-28-023;
      ADR-0113).
    verification: >-
      `test_participant_stores_no_deadline_on_receipt` in
      `test/core/use_cases/received/test_embargo_revision_relay.py` and
      `test_invite_with_deadline_stores_no_rsvp_deadline` in
      `test/core/use_cases/received/test_embargo_invite_lapse.py` assert that a
      participant that receives the Invite directly stores no deadline.
    relationships:
    - rel_type: extends
      spec_id: CM-28-013
    - rel_type: refines
      spec_id: EP-09-003
    adr:
    - ADR-0113
    - ADR-0124
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-014
    priority: MUST
    kind: protocol
    statement: >-
      Only the CASE_MANAGER evaluates invite expiry (CM-28-003). Its
      `Update(EmbargoConsent)` carrying the invitee's `TIMED_OUT` row (CM-28-009) MUST
      be committed by the CASE_MANAGER before the row is written (ADR-0124, CLP-07-013),
      and reaches replicas as that ledger entry (CM-28-016). A replica learns an expiry
      from that entry, copying the row, and never computes one.
    rationale: >-
      Only the CASE_MANAGER can write a ledger entry. Thus an expiry that another store
      calculates has one of two results. It is an entry that the store has no authority
      to commit, or it is a private difference that no replica shares. The CASE_MANAGER
      commits the expiry first, and replicas copy it by replay. Thus the consent row of
      every replica is equal to that of the CASE_MANAGER, and one clock decides
      (ADR-0113, ADR-0124).
    verification: >-
      A test runs the late-`Accept` path as a non-manager and asserts no expiry entry is committed;
      a test replays the CASE_MANAGER's `update_embargo_consent` entry carrying the
      `TIMED_OUT` row into a replica and asserts the participant reads `TIMED_OUT`
      only once that entry is copied:
      `test/core/use_cases/received/test_embargo_invite_lapse.py::TestExpiryIsTheManagersAlone::test_non_manager_commits_no_expiry_entry`,
      `test/core/behaviors/sync/test_announce_tree.py::TestAnnounceLogEntryAppliesEmbargoInviteRelay::test_replica_reads_expired_from_expiry_entry`
      and `test/core/use_cases/received/test_embargo_activation_copy.py::TestInviteTimeOut`.
    relationships:
    - rel_type: refines
      spec_id: CM-28-009
    - rel_type: depends_on
      spec_id: RSH-08-004
    - rel_type: depends_on
      spec_id: BT-17-001
    adr:
    - ADR-0118
    - ADR-0113
    - ADR-0065
    - ADR-0124
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-016
    priority: MUST
    kind: project
    statement: >-
      In this codebase the CASE_MANAGER role gate (BT-17-001) MUST guard the
      CASE_MANAGER's commit of the invite-expiry `Update(EmbargoConsent)` (CM-28-014).
    rationale: >-
      How this codebase keeps the expiry entry the CASE_MANAGER's alone; split from
      CM-28-014 so CM-28-014 states only who records an expiry and what replicas
      learn from it (MS-12-010).
    verification: >-
      `test/core/use_cases/received/test_embargo_invite_lapse.py::TestExpiryIsTheManagersAlone::test_non_manager_commits_no_expiry_entry`
      confirms a non-manager commits no expiry entry.
    relationships:
    - rel_type: implements
      spec_id: CM-28-014
    - rel_type: depends_on
      spec_id: BT-17-001
  - id: CM-28-030
    priority: MUST
    kind: project
    statement: >-
      In this codebase a replica MUST apply the invite-expiry
      `Update(EmbargoConsent)` entry (CM-28-014) through the consent slot of
      `create_announce_log_entry_tree` (RSH-08-004).
    rationale: >-
      How this codebase copies the CASE_MANAGER's expiry entry onto replicas. One
      slot applies every consent entry, so a replica reads `TIMED_OUT` only from the
      entry and never computes an expiry itself.
    verification: >-
      `test/core/behaviors/sync/test_announce_tree.py::TestAnnounceLogEntryAppliesEmbargoInviteRelay::test_replica_reads_expired_from_expiry_entry`
      confirms a replica reads `TIMED_OUT` only once that entry is copied.
    relationships:
    - rel_type: implements
      spec_id: CM-28-014
    - rel_type: depends_on
      spec_id: RSH-08-004
  - id: CM-28-015
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST sweep a case's overdue invitations before it commits the
      Case Owner's decision on an embargo proposal (MSM-07-008, MSM-07-009). A sweep
      expires each `INVITED` consent row past its RSVP deadline whose embargo register
      entry is an open proposal or the embargo in force. It expires
      each such row through its CM-28-009 `Update(EmbargoConsent)` and `TIME_OUT`.
    rationale: >-
      Without a sweep, the CASE_MANAGER checks expiry only on a late `Accept` and when
      the Case Owner closes (CM-23-014). An invitee that never answers is then never
      recorded as timed out. The Case Owner then decides without knowledge of the
      timeout (EP-09-006, MSM-07-007). Embargo activities read the consent rows
      (CM-28-007), so a sweep at that point keeps expiry lazy (CM-28-008).
    verification: >-
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` lets an
      invitation pass its deadline unanswered, then delivers to the CASE_MANAGER the
      owner's `Accept(EmbargoEvent)[target=VulnerabilityCase]` and the owner's
      `Reject(EmbargoEvent)[target=VulnerabilityCase]`, and asserts for each that the
      CASE_MANAGER's `Update(EmbargoConsent)` carrying the `TIMED_OUT` row is
      committed before the activity's own entry and the invitee's row reads
      `TIMED_OUT`. It asserts a row whose deadline has not passed stays `INVITED`, a
      store that is not the CASE_MANAGER sweeps nothing, and a repeat sweep commits
      no second expiry entry.
    relationships:
    - rel_type: refines
      spec_id: CM-28-007
    - rel_type: depends_on
      spec_id: CM-28-009
    - rel_type: depends_on
      spec_id: CM-28-014
    - rel_type: depends_on
      spec_id: CLP-10-025
    adr:
    - ADR-0118
    - ADR-0135
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-025
    priority: MUST_NOT
    kind: project
    statement: >-
      The CASE_MANAGER MUST NOT sweep a consent row of a replaced, rejected,
      cancelled or ended embargo.
    rationale: >-
      Such a row is frozen: an answer to a version that no longer stands can change
      nothing (CM-18-005). Expiring it would record a lapse on an invitation whose
      embargo is already gone.
    verification: >-
      `test_a_row_of_a_replaced_embargo_is_frozen` in
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` asserts
      that an overdue `INVITED` row of a replaced embargo is left unchanged.
    relationships:
    - rel_type: extends
      spec_id: CM-28-015
    adr:
    - ADR-0118
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-026
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST run the CM-28-015 sweep only after the door guards admit
      the activity, its sender gate (HP-01-006) included.
    rationale: >-
      The sweep is a clock decision (CLP-10-025, ADR-0135). Running it after the
      door guards means a sender with no standing makes the CASE_MANAGER write
      nothing.
    verification: >-
      `test_a_non_owners_decision_is_refused_with_no_expiry` in
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` delivers
      the owner's decision from a non-owner and asserts it is `REFUSED` with no
      expiry entry committed.
    relationships:
    - rel_type: extends
      spec_id: CM-28-015
    - rel_type: depends_on
      spec_id: CLP-10-025
    adr:
    - ADR-0135
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-027
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST run the CM-28-015 sweep before the activity's own
      refusals (MSM-07-008). Examples are an embargo that is not an open proposal, or
      a public, exploited or attacked CS.
    rationale: >-
      An overdue row is a fact from the CASE_MANAGER's clock, not evidence from the
      activity. Sweeping before the activity's own refusals records the expiries
      even when the activity is then refused (ADR-0135).
    verification: >-
      `test_a_decision_on_no_open_proposal_is_refused_after_the_expiry` in
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` delivers
      the owner's decision naming an embargo that is not an open proposal and
      asserts it is `REFUSED` with the expiry entries committed.
    relationships:
    - rel_type: extends
      spec_id: CM-28-015
    - rel_type: depends_on
      spec_id: CLP-10-025
    adr:
    - ADR-0135
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-028
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST also run the CM-28-015 sweep whenever it processes any
      other received embargo activity for the case.
    rationale: >-
      Embargo activities read the consent rows (CM-28-007), so a sweep at each one
      keeps expiry lazy (CM-28-008). Without it, an invitee that never answers is
      recorded as timed out only on a late `Accept` or at closure (CM-23-014).
    verification: >-
      `test_a_participants_reject_of_its_invite_sweeps_first` in
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` delivers
      another participant's `Reject(Invite(EmbargoEvent))` and asserts the expiry
      is committed before the activity's own entry, and
      `test_every_received_embargo_tree_with_a_case_takes_the_sweep` asserts that
      every received embargo tree naming a case takes the sweep in its
      clock-decision stage.
    relationships:
    - rel_type: extends
      spec_id: CM-28-015
    adr:
    - ADR-0118
    - ADR-0135
    stories:
    - story_2022_014
    - story_2022_027
  - id: CM-28-029
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST also run the CM-28-015 sweep in every embargo trigger
      that the actor holding `CVDRole.CASE_MANAGER` runs, the Case Owner's own
      trigger included (EP-09-008).
    rationale: >-
      The Case Owner's own decision trigger can run on the actor that holds the
      CASE_MANAGER role. If a trigger skipped the sweep, the owner would decide
      without knowing which invitations timed out (EP-09-006, MSM-07-007).
    verification: >-
      `TestOwnerTrigger` in
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` runs the
      owner's embargo-decision trigger on the actor holding `CVDRole.CASE_MANAGER`
      and asserts the expiry precedes the decision, and
      `test_an_embargo_trigger_adds_the_overdue_invite_sweep` in
      `test/core/use_cases/triggers/test_base.py` asserts that an embargo trigger's
      clock-decision stage holds the sweep.
    relationships:
    - rel_type: extends
      spec_id: CM-28-015
    adr:
    - ADR-0135
    stories:
    - story_2022_014
    - story_2022_027

- id: CM-27
  title: Case Collection Mutation Discipline
  description: >-
    Requirements governing post-construction mutation of the case collections
    whose items exist in incompatible wire and core shapes. `validate_assignment`
    does not cover in-place mutation — `list.append` is not an attribute
    assignment, so Pydantic never observes it — so these collections need a
    separate prohibition. Codified by ADR-0064. Source: CONCERN-2261.
  specs:
  - id: CM-27-001
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/architecture/test_validate_assignment_ratchet.py` scans every core
      module for a direct `case_participants` or `case_statuses` write —
      attribute assignment or in-place list mutation — outside the canonical
      mutator module and fails on any hit; its backlog test pins the enumerated
      set in both directions so a new violation and a stale entry both fail.
    statement: >-
      Core code under `vultron/core/` MUST NOT change `case_participants` or
      `case_statuses` on a `VulnerabilityCase` after construction except through its
      canonical mutators. Direct writes such as `case.case_participants.append(...)` and
      `case.case_statuses = [...]` are what it rules out. The mutator methods
      themselves, in `vultron/core/models/case.py`, are exempt.
    rationale: >-
      A wire-shaped participant or status in a list of core types does not cause an
      error when code reads it. It reads as absent, and readers use an initial state in
      its place. This silently resets the case's state. `validate_assignment` cannot
      prevent this, because `append` is not an assignment. Thus the only guard is to
      send every change through a mutator that validates. PRM-03-001 gives the same
      prohibition for `case_roles`.
    relationships:
    - rel_type: refines
      spec_id: ARCH-21-001
    adr:
    - ADR-0064
  - id: CM-27-002
    priority: MUST
    kind: project
    statement: >-
      Passing `case_participants=[...]` or `case_statuses=[...]` as a constructor
      argument when creating a `VulnerabilityCase` is permitted and does not
      violate CM-27-001; the prohibition applies only to post-construction
      mutation.
    rationale: >-
      Constructor arguments are validated, which is precisely the guarantee
      CM-27-001 exists to restore. This clarification prevents over-application
      of the rule, mirroring PRM-03-002.
    verification: Inspection of `vultron/core/models/case.py` confirms that constructor-time
      `case_participants` and `case_statuses` arguments pass through Pydantic validation,
      consistent with the post-construction mutation prohibition in CM-27-001.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
    adr:
    - ADR-0064
  - id: CM-27-003
    priority: MUST
    kind: project
    statement: >-
      `VulnerabilityCase` MUST expose a canonical mutator for appending a case
      status, so that CM-27-001 can be satisfied without direct list mutation.
      `add_participant()` already provides this for `case_participants`;
      removal keeps the record on the roster (CM-31-001), so the roster has no
      deleting mutator.
    rationale: >-
      A prohibition with no permitted alternative cannot be implemented. Without a
      status mutator, code that records a new case status must append to `case_statuses`
      directly, which CM-27-001 forbids. `add_case_status()` on `VulnerabilityCase` is
      that mutator.
    verification: Inspection of `vultron/core/models/case.py` confirms that `VulnerabilityCase`
      exposes a canonical mutator method for appending a case status to `case_statuses`.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
    adr:
    - ADR-0064
- id: CM-29
  title: Case Status Recency Resolution
  description: Rules for determining which CaseStatus snapshot is the most recent
    when multiple snapshots exist in the case_statuses history.
  specs:
  - id: CM-29-001
    priority: MUST
    kind: project
    statement: >-
      `VulnerabilityCase.current_status` MUST return the `CaseStatus` with the latest
      time, where a status's time is its `updated` if present, else its `published`.
    rationale: >-
      The status timestamps are the only record of when each status was made, so
      recency is read from them and from nothing else. `updated` comes first because
      it records the latest change to a status. A receiver refuses a status with no
      `published` (CLP-15-010), so every status has a time.
    verification: >-
      `test_status_recency_key_prefers_updated_over_published` and
      `test_status_recency_key_falls_back_to_published` in
      `test/core/models/test_helpers.py` unit test the ordering key
      `status_recency_key` in `vultron/core/models/_helpers.py`, where both the
      `current_status` and the wire `as_CaseStatus` readers converge.
      `test_case_status_requires_published` in
      `test/core/models/test_case_status.py` confirms a `CaseStatus` cannot be
      built without a `published`.
    relationships:
    - rel_type: refines
      spec_id: CM-27-001
  - id: CM-29-003
    priority: MUST
    kind: project
    statement: >-
      Among `CaseStatus` entries with equal times, `VulnerabilityCase.current_status`
      MUST return the one appended last.
    rationale: >-
      Received statuses carry the sender's time, so equal times are ordinary. Append
      order is the only tiebreaker that is not an implementation detail (CM-29-002),
      and without it a status appended with the same time as the one before it would
      never become current.
    verification: >-
      `test_current_status_tie_goes_to_the_last_appended` in
      `test/core/models/test_case.py` and in
      `test/wire/as2/vocab/test_vulnerability_case.py` append two statuses with
      equal times and assert the second is current.
    relationships:
    - rel_type: extends
      spec_id: CM-29-001
  - id: CM-29-002
    priority: MUST_NOT
    kind: project
    statement: >-
      `VulnerabilityCase.current_status` MUST NOT use the `id_` field as a sort
      tiebreaker when it determines the most-recent `CaseStatus`.
    rationale: >-
      If `id_` breaks ties between statuses with equal times, the order depends on
      the id scheme. Auto-seeded statuses have `urn:uuid:` ids, which sort above
      `https://` ids, so an initial auto-seeded status would win over a received
      status with the same time. An id scheme is an implementation detail, not a
      measure of time.
    verification: >-
      `test_current_status_ignores_id_scheme_when_times_are_equal` in
      `test/wire/as2/vocab/test_vulnerability_case.py` gives a `urn:uuid:` status
      and an `https://` status the same `published`, appends the `https://` one
      last, and asserts it is current.
    relationships:
    - rel_type: extends
      spec_id: CM-29-001
  - id: CM-29-004
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST reject at message validation an inbound activity carrying a
      `VulnerabilityCase` with no `caseStatuses`.
    rationale: >-
      Every case has a current status (CM-29-001), and the sender holds it. A
      receiver that seeded a missing history would stamp its own clock on the
      case's first status, a time no sender claimed (CLP-15-007), and that status
      could outrank one the sender timed earlier. A case named by its `id` and
      `type` alone is a reference, not a case, so this does not apply to it.
    verification: >-
      `test_parse_refuses_a_case_with_no_case_statuses` in
      `test/wire/as2/test_nested_timestamps.py` asserts `parse_activity` refuses a
      case whose `caseStatuses` is absent or empty, and
      `test_authored_case_without_statuses_is_seeded` in the same file confirms a
      case this process builds is still seeded.
    stories:
    - story_2022_075
    relationships:
    - rel_type: refines
      spec_id: CM-29-001
    - rel_type: refines
      spec_id: CLP-15-007
- id: CM-30
  title: Sender Entitlement for Case Content Changes
  description: >-
    Who may remove a note from a case or attach a report to it. Neither message has a
    trigger today; these entries name the sender a receiver accepts (HP-01-006).
  specs:
  - id: CM-30-001
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on `Remove(Note)[target=VulnerabilityCase]` only when the
      sender is the note's author and an active participant (CM-10-004), or the case's
      Case Owner.
    rationale: >-
      A note is a participant's contribution to the case record. If any sender could
      remove any note, a participant could delete evidence or advice that it disagrees
      with. An author can withdraw its own note. The Case Owner decides what the case
      holds, so it can remove any note. No other participant has a reason to remove a
      note.
    verification: >-
      `test_remove_note_by_its_active_author_is_applied` and
      `test_remove_note_by_author_who_left_is_refused` in
      `test/core/use_cases/received/test_note.py` assert that the CASE_MANAGER
      applies the Remove from the note's active author and refuses it once the
      author has left.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0115
  - id: CM-30-003
    priority: MUST
    kind: protocol
    statement: >-
      A participant replica MUST apply a `Remove(Note)[target=VulnerabilityCase]`
      only when the CASE_MANAGER sent it (PCR-03-001).
    rationale: >-
      Replicas take case changes from the CASE_MANAGER only (PCR-03-001). A replica
      that applied a removal from another sender would let that sender delete a note
      that the CASE_MANAGER keeps.
    verification: >-
      `test_remove_note_at_replica_from_non_manager_is_refused` in
      `test/core/use_cases/received/test_note.py` asserts that a replica refuses a
      Remove from a sender that is not the CASE_MANAGER.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-30-001
    adr:
    - ADR-0115
  - id: CM-30-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a `Remove(Note)[target=VulnerabilityCase]` from any
      sender that CM-30-001 does not name, with the note left in the case.
    rationale: >-
      A refusal that still removed the note would give the unentitled sender what it
      asked for. The `REFUSED` result tells the sender that nothing changed.
    verification: >-
      `test_note_removal_by_stranger_is_refused` in
      `test/core/use_cases/received/test_sender_entitlement.py` sends the Remove from
      an actor that is neither the author nor the Case Owner and asserts `REFUSED`
      with the note still in the case.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-30-001
    adr:
    - ADR-0115
  - id: CM-30-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on `Add(VulnerabilityReport)[target=VulnerabilityCase]`
      only when the sender is the case's Case Owner.
    rationale: >-
      A report defines what the case is about. A new report makes the scope of the case
      larger and adds to the content that every participant receives. That is the
      decision of the Case Owner. If another sender could add a report, a participant
      could change the scope of the case alone.
    verification: >-
      `test_report_addition_by_non_owner_is_refused` and
      `test_report_addition_by_a_closed_owner_is_refused` in
      `test/core/use_cases/received/test_sender_entitlement.py` assert that the
      CASE_MANAGER acts on the Add only from the Case Owner.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0115
  - id: CM-30-005
    priority: MUST
    kind: protocol
    statement: >-
      A participant replica MUST apply an
      `Add(VulnerabilityReport)[target=VulnerabilityCase]` only when the CASE_MANAGER
      sent it (PCR-03-001).
    rationale: >-
      Replicas take case changes from the CASE_MANAGER only (PCR-03-001). A replica
      that applied an addition from another sender would widen the case's scope on
      that replica alone.
    verification: >-
      `test_report_at_replica_from_non_manager_is_refused` in
      `test/core/use_cases/received/case/test_lifecycle.py` asserts that a replica
      refuses the Add from a sender that is not the CASE_MANAGER.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-30-002
    adr:
    - ADR-0115
  - id: CM-30-006
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an
      `Add(VulnerabilityReport)[target=VulnerabilityCase]` from any sender other than
      the Case Owner, with the case's reports unchanged.
    rationale: >-
      A refusal that still attached the report would give the unentitled sender what
      it asked for. The `REFUSED` result tells the sender that nothing changed.
    verification: >-
      `test_report_from_non_owner_is_refused_and_commits_nothing` in
      `test/core/use_cases/received/case/test_lifecycle.py` sends the Add from a
      non-owner and asserts `REFUSED` with the report not attached.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-30-002
    adr:
    - ADR-0115
- id: CM-31
  title: Participant Removal and Reinstatement
  description: >-
    Removing a participant withdraws its entitlement to case content and keeps its record. The Case
    Owner requests removal and reinstatement; the CASE_MANAGER applies them, records each as one ledger
    entry, and tells the affected participant directly (ADR-0116).
  specs:
  - id: CM-31-001
    priority: MUST
    kind: protocol
    statement: >-
      An actor that applies a participant's removal MUST record a removal fact on the
      participant's `CaseParticipant`.
    rationale: >-
      Removal is a decision about entitlement to case content, not about membership.
      Thus it is a fact on the record that the active check reads (ADR-0116).
    verification: >-
      `test_remove_case_participant_from_case` in
      `test/core/use_cases/received/test_case_participant.py` and
      `test_removal_fact_is_the_owners_activity_id` in
      `test/core/use_cases/received/test_participant_removal.py` apply a Case
      Owner's `Remove(CaseParticipant)` at the CASE_MANAGER and assert the record
      carries the removal fact.
    relationships:
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-015
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor that applies a participant's removal MUST NOT delete the participant's
      record from `case_participants`.
    rationale: >-
      If the record is deleted, the case loses the history of who took part. Ledger
      entries then name an actor that is not on the roster (ADR-0116).
    verification: >-
      `test_removal_keeps_the_record_on_the_roster` in
      `test/core/use_cases/received/test_participant_removal_planned.py` applies a
      Case Owner's `Remove(CaseParticipant)` at the CASE_MANAGER and asserts the
      participant is still in `case_participants` and `actor_participant_index`.
    relationships:
    - rel_type: extends
      spec_id: CM-31-001
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-016
    priority: MUST
    kind: protocol
    statement: >-
      An actor that applies a participant's removal MUST keep the participant's status
      history and the ledger entries it authored.
    rationale: >-
      The status history and the authored entries are the record of what the
      participant did in the case. Removal withdraws entitlement from now on; it
      does not rewrite the past (ADR-0116).
    verification: >-
      `test_removal_keeps_the_status_history_and_the_ledger` in
      `test/core/use_cases/received/test_participant_removal_planned.py` removes a
      participant with a status history and asserts the history and every earlier
      ledger entry remain.
    relationships:
    - rel_type: extends
      spec_id: CM-31-001
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-017
    priority: MUST
    kind: protocol
    statement: >-
      Every actor MUST treat a removed participant as inert (CM-10-004).
    rationale: >-
      A removed participant has lost its entitlement to case content. If any actor
      still treated it as active, it would keep receiving embargoed content.
    verification: >-
      `test_removed_participant_is_inert_whatever_its_consent` in
      `test/core/models/test_case_active_participant.py` and
      `test_removed_participant_gets_no_case_content` in
      `test/core/participants/test_recipients.py` assert that a removed participant
      is not active and is sent no case content.
    relationships:
    - rel_type: extends
      spec_id: CM-31-001
    - rel_type: uses_definition
      spec_id: CM-10-004
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-002
    priority: MUST
    kind: architecture
    statement: >-
      This codebase MUST compute whether a participant is active by one case-level
      check over the CM-10-004 stored facts, never over RM `CLOSED` (#4100). Those
      facts are that the participant joined, by case initialization or by accepting
      the stub Invite, and is not removed. While an embargo is active, they include
      that its consent row for that embargo is `AGREED`.
    rationale: >-
      Whether an embargo is active is case state a participant record cannot see, so
      the full answer lives on the case. One check means every send site gets the
      same answer.
    verification: >-
      Inspection confirms that the shared recipient selection (CM-10-007) calls the
      one case-level check.
    relationships:
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0116
  - id: CM-31-018
    priority: MUST_NOT
    kind: architecture
    statement: >-
      This codebase MUST NOT store whether a participant is active.
    rationale: >-
      An inferred status that is stored goes stale whenever one of its inputs changes
      without rewriting it; the precedent is signatory and lapsed consent (CM-18-001).
    verification: >-
      Inspection confirms no stored field holds the active answer, and
      `test_no_participant_property_reads_as_active` in
      `test/core/models/test_case_active_participant.py` asserts that no
      `CaseParticipant` field reads as "active".
    relationships:
    - rel_type: extends
      spec_id: CM-31-002
    adr:
    - ADR-0116
  - id: CM-31-019
    priority: MUST_NOT
    kind: architecture
    statement: >-
      A participant-level property in this codebase MUST NOT compute a partial
      answer under a name that reads as "active".
    rationale: >-
      A partial participant-level property would read as "active" at a send site and
      leak embargoed content to a non-signatory.
    verification: >-
      `test_no_participant_property_reads_as_active` in
      `test/core/models/test_case_active_participant.py` asserts that no
      `CaseParticipant` property or field has a name that reads as "active".
    relationships:
    - rel_type: extends
      spec_id: CM-31-002
    adr:
    - ADR-0116
  - id: CM-31-003
    priority: MUST
    kind: protocol
    statement: >-
      `VulnerabilityCase` MUST carry a computed `activeParticipants` collection on the
      wire holding exactly the participants the CM-31-002 check finds active, computed
      from the participant records (CM-31-014).
    rationale: >-
      `case_participants` stays the full roster that role resolution and `actor_participant_index`
      read (CM-19-001). Publishing the active set as its own collection makes
      `Remove(CaseParticipant)` literally true: the participant leaves that collection.
    verification: >-
      `test_active_participants_lists_the_active_records_in_roster_order` in
      `test/core/models/test_case_active_participant.py` asserts
      `activeParticipants` lists active participants only.
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-020
    priority: MUST
    kind: protocol
    statement: >-
      A receiver reading a case MUST recompute its `activeParticipants` collection
      rather than refuse it as an unknown key.
    rationale: >-
      Core types refuse unknown keys on input, so a computed field in the dump would
      refuse the case's own serialized form unless input handles it.
    verification: >-
      `test_case_publishes_active_participants_and_round_trips` in
      `test/core/use_cases/received/test_participant_removal_planned.py` asserts
      that a case dumped by alias validates back to an equal case.
    relationships:
    - rel_type: extends
      spec_id: CM-31-003
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-021
    priority: MUST
    kind: protocol
    statement: >-
      A receiver reading a case MUST refuse a supplied `activeParticipants` value
      that contradicts the one it recomputes (ARCH-23-005).
    rationale: >-
      A supplied collection that disagrees with the participant records it travels
      with would give two answers to who is active. The records are the facts, so
      the contradicting value is refused.
    verification: >-
      `test_contradicting_active_participants_is_refused` in
      `test/core/models/test_case_active_participant.py` asserts that a supplied
      view that disagrees with the carried records is refused.
    relationships:
    - rel_type: extends
      spec_id: CM-31-003
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-014
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST NOT store a case's `activeParticipants` collection (CM-31-003):
      it is computed from the participant records whenever the case is serialized.
    rationale: >-
      How this codebase keeps CM-31-003's collection from drifting from the participant
      records; split from it so CM-31-003 states only what the case carries on the wire
      and what a receiver does with it (MS-12-010).
    verification: >-
      `test/adapters/driven/test_db_record.py::test_computed_active_participants_is_not_in_the_stored_row`
      confirms the stored row carries no `activeParticipants`, and
      `test/core/models/test_case_active_participant.py::test_active_participants_is_published_by_alias_and_round_trips`
      confirms it is published by alias and recomputed when the case is read back.
    relationships:
    - rel_type: implements
      spec_id: CM-31-003
    - rel_type: constrains
      spec_id: ARCH-23-005
  - id: CM-31-004
    priority: MUST
    kind: protocol
    statement: >-
      `Remove(CaseParticipant)[target=VulnerabilityCase]` is the Case Owner's request to
      the CASE_MANAGER to remove a participant from active participation. The
      CASE_MANAGER MUST refuse such a request in three cases. The sender does not hold
      `CASE_OWNER`, the named participant holds `CASE_MANAGER` or `CASE_OWNER`, or the
      request names no participant of the case.
    rationale: >-
      The Case Owner decides who takes part in the case; the CASE_MANAGER applies case changes and
      decides none (ADR-0108). The CASE_MANAGER role is never unfilled (CM-24-006), and the Case Owner
      leaves only by transferring ownership (CM-21). A participant that wants to stop taking part
      sends `Leave(VulnerabilityCase)` (CM-23), not `Remove`.
    verification: >-
      Received-side tests assert a removal from a non-owner, of the CASE_MANAGER, and of the Case
      Owner is refused, and a removal from the Case Owner is applied.
    relationships:
    - rel_type: depends_on
      spec_id: PCR-03-006
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-022
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST report a removal of an already-removed participant as
      skipped.
    rationale: >-
      A repeated removal changes nothing, so it is neither applied nor refused. A
      skipped result tells the Case Owner that the participant is already removed,
      and the CASE_MANAGER commits no second entry and sends no second notice.
    verification: >-
      `test_a_second_removal_is_skipped` in
      `test/core/use_cases/received/test_participant_removal_planned.py` and
      `test_second_removal_commits_nothing_and_sends_no_second_notice` in
      `test/core/use_cases/received/test_participant_removal.py` assert that a
      repeat removal is skipped.
    relationships:
    - rel_type: extends
      spec_id: CM-31-004
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-023
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT remove a participant on its own initiative.
    rationale: >-
      The Case Owner decides who takes part in the case; the CASE_MANAGER applies
      case changes and decides none (ADR-0108).
    verification: >-
      `test_only_the_owners_removal_records_a_removal_fact` in
      `test/core/use_cases/received/test_participant_removal_planned.py` asserts
      that the only callers of `CaseParticipant.record_removal` apply the Case
      Owner's received `Remove(CaseParticipant)` or its ledger entry.
    relationships:
    - rel_type: extends
      spec_id: CM-31-004
    adr:
    - ADR-0116
    - ADR-0108
    stories:
    - story_2022_023
  - id: CM-31-005
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record an accepted removal by committing the Case Owner's
      received `Remove(CaseParticipant)` as its entry, on receipt (CLP-10-006).
    rationale: >-
      The Remove states the change, so it is the change's entry (CLP-07-013), authored
      by the actor that made it. The ledger therefore shows the removal as the Case
      Owner's decision rather than the CASE_MANAGER acting alone (ADR-0108).
    verification: >-
      `test_removal_is_one_canonical_ledger_entry_by_the_owner` in
      `test/core/use_cases/received/test_participant_removal_planned.py` asserts
      that an accepted removal grows the ledger by an entry whose snapshot is the
      Case Owner's activity.
    relationships:
    - rel_type: depends_on
      spec_id: CLP-10-006
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-024
    priority: MUST
    kind: protocol
    statement: >-
      `Remove(CaseParticipant)` MUST be a ledgered activity, with a canonical ledger
      signature.
    rationale: >-
      Without the canonical signature a removal cannot be committed, so it never
      reaches a replica.
    verification: >-
      `test_removal_is_one_canonical_ledger_entry_by_the_owner` in
      `test/core/use_cases/received/test_participant_removal_planned.py` asserts
      that `("Remove", "CaseParticipant")` is a canonical signature.
    relationships:
    - rel_type: extends
      spec_id: CM-31-005
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-025
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT commit a second entry of its own for a removal that
      it records under CM-31-005.
    rationale: >-
      The Case Owner's Remove is already the change's entry. A second entry would
      record the same move twice and show it as the CASE_MANAGER's own act.
    verification: >-
      `test_removal_is_one_canonical_ledger_entry_by_the_owner` in
      `test/core/use_cases/received/test_participant_removal_planned.py` asserts
      that an accepted removal grows the ledger by exactly one entry.
    relationships:
    - rel_type: extends
      spec_id: CM-31-005
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-006
    priority: MUST
    kind: protocol
    statement: >-
      After a removal commits, the CASE_MANAGER MUST send the removed participant a
      direct `Remove(CaseParticipant)` naming it. The notice's `actor` is the
      CASE_MANAGER and its `attributedTo` the Case Owner (CM-24).
    rationale: >-
      Learning of removal only from silence is indistinguishable from a network fault, and the removed
      party needs to know it is still bound and how it will hear of the embargo's end.
    verification: >-
      `test_removed_participant_is_sent_a_direct_remove_naming_it` in
      `test/core/use_cases/received/test_participant_removal_planned.py` asserts the
      CASE_MANAGER's outbox holds a `Remove(CaseParticipant)` addressed to the
      removed participant.
    relationships:
    - rel_type: depends_on
      spec_id: CM-31-005
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-026
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT ledger its CM-31-006 removal notice.
    rationale: >-
      The notice is delivery, not a second record of the move. The Case Owner's
      Remove is already the move's entry (CM-31-005).
    verification: >-
      `test_notice_is_delegated_names_the_participant_and_is_not_ledgered` in
      `test/core/use_cases/received/test_participant_removal.py` asserts that the
      notice is not a ledger entry.
    relationships:
    - rel_type: extends
      spec_id: CM-31-006
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-027
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST include the removed participant in the removal entry's
      fan-out.
    rationale: >-
      The ledger entry keeps the removed party's replica continuous up to the
      removal, so that replica records its own removal like every other replica.
    verification: >-
      `test_removal_entry_fans_out_to_the_removed_participant` in
      `test/core/use_cases/received/test_participant_removal_planned.py` asserts an
      `Announce(CaseLedgerEntry)` of the removal is addressed to the removed
      participant.
    relationships:
    - rel_type: extends
      spec_id: CM-31-006
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-028
    priority: MUST
    kind: protocol
    statement: >-
      The removal entry MUST be the last canonical entry that the CASE_MANAGER sends
      the removed participant, by fan-out or by replay, until it is reinstated.
    rationale: >-
      A removed participant has lost its entitlement to case content. An entry sent
      after the removal would leak case content to it.
    verification: >-
      `test_no_later_entry_reaches_the_removed_participant` and
      `test_replay_does_not_answer_the_removed_participant` in
      `test/core/use_cases/received/test_participant_removal.py` assert that an entry
      committed afterwards is not addressed to it, by fan-out or by replay.
    relationships:
    - rel_type: extends
      spec_id: CM-31-006
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-007
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST apply a removal from its ledger entry, recording the same removal
      fact the CASE_MANAGER recorded.
    rationale: >-
      Replicas take case state from the ledger. The entry is what changes every
      replica, the removed party's included.
    verification: >-
      A test announces a removal entry to a replica and asserts the participant's record remains,
      carries the removal fact, and is not active on the replica.
    relationships:
    - rel_type: depends_on
      spec_id: RSH-08-004
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-029
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A replica MUST NOT apply a removal from a directly received
      `Remove(CaseParticipant)` (RSH-08-003).
    rationale: >-
      The direct notice tells the removed party what happened; it is not the change.
      A replica that applied it would take case state from outside the ledger.
    verification: >-
      `test_replica_stores_the_managers_notice_and_writes_nothing` in
      `test/core/use_cases/received/test_participant_removal.py` asserts that a
      replica stores the CASE_MANAGER's direct notice and writes no participant
      state.
    relationships:
    - rel_type: extends
      spec_id: CM-31-007
    - rel_type: refines
      spec_id: RSH-08-003
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
  - id: CM-31-008
    priority: MUST
    kind: protocol
    statement: >-
      Removal MUST NOT change the participant's embargo consent rows. A removed
      signatory remains bound by the embargo it accepted.
    rationale: >-
      Releasing a removed participant from the embargo would reward the conduct that got it removed.
      Consent is the participant's own statement (CM-18-005); removal is a separate fact.
    verification: >-
      A received-side test removes a signatory and asserts its consent rows are unchanged.
    relationships:
    - rel_type: extends
      spec_id: CM-18-005
    adr:
    - ADR-0116
    stories:
    - story_2022_014
    - story_2022_023
  - id: CM-31-009
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers each signatory that the ledger fan-out does not reach: one
      removed (CM-31-001), or one at RM `CLOSED` that the CM-23-004 fan-out skips. When
      the active embargo is terminated, the CASE_MANAGER MUST send each such signatory
      a direct `Remove(EmbargoEvent)`. Termination includes the case becoming public.
    rationale: >-
      A participant that stopped receiving case content while bound stays bound, and
      without this it never learns that the obligation ended early. A past-dated
      `Announce(EmbargoEvent)` is not used: its meaning would depend on the receiver's
      clock, and an early end is an event, not a date that passed.
    verification: >-
      `test_owner_termination_sends_et_to_each_unreached_signatory` and
      `test_termination_notifies_nobody_who_is_not_bound_or_is_reached` in
      `test/core/use_cases/received/test_embargo_ending_notices.py` terminate the
      embargo on a case with a removed signatory and a departed signatory, and
      assert each is sent the notice and no ledger entry; a declined or never-joined
      participant is sent nothing.
    relationships:
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0116
    - ADR-0093
    stories:
    - story_2022_014
  - id: CM-31-030
    priority: MUST
    kind: protocol
    statement: >-
      When a shorter revision replaces the active embargo, the CASE_MANAGER MUST send
      each signatory that CM-31-009 covers a direct `Announce(EmbargoEvent)` with the
      new terms. No notice is owed for a longer revision, or for expiry on the agreed
      date.
    rationale: >-
      A participant bound by the embargo must learn that its obligation shortened,
      and a paused replica cannot learn it from the ledger. A longer revision does not
      bind a participant that never agreed to it, and expiry on the agreed date is
      already known to it. A revision that ends at the same time as the embargo it
      replaces is on the EP-05-003 carry-over arm, so it is sent like a shorter one.
    verification: >-
      `test_shorter_revision_is_announced_to_each_unreached_signatory`,
      `test_longer_revision_sends_nothing` and `test_embargo_ending_notice_decision`
      in `test/core/use_cases/received/test_embargo_ending_notices.py` assert that a
      shorter or equal revision is announced to each unreached signatory and a longer
      one sends nothing.
    relationships:
    - rel_type: extends
      spec_id: CM-31-009
    adr:
    - ADR-0116
    - ADR-0093
    stories:
    - story_2022_014
  - id: CM-31-031
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT put any other case content in a CM-31-009 or CM-31-030
      notice.
    rationale: >-
      The notice exists only to tell a bound participant that the embargo ended or
      shortened. The recipient has stopped receiving case content, so anything more
      would leak content it is not entitled to.
    verification: >-
      `test_an_ending_notice_carries_no_other_case_content` in
      `test/core/use_cases/received/test_embargo_ending_notices.py` asserts that each
      notice names only its recipient and carries no case object but the embargo.
    relationships:
    - rel_type: extends
      spec_id: CM-31-009
    adr:
    - ADR-0116
    stories:
    - story_2022_014
  - id: CM-31-010
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a participant whose ledger stream is paused: withheld under
      CM-10-005, removed (CM-31-001), or skipped at RM `CLOSED` (CM-23-004). It MUST
      apply a CM-31-009 or CM-31-030 notice that the CASE_MANAGER sends for the case.
    rationale: >-
      A paused replica cannot take the change from the ledger, so the notice is its
      only channel.
    verification: >-
      `test_paused_replica_applies_the_managers_termination` and
      `test_paused_replica_applies_the_managers_shorter_revision` in
      `test/core/use_cases/received/test_embargo_ending_notices.py` apply the notice
      at a removed participant's replica and assert the embargo ended or shortened.
    relationships:
    - rel_type: refines
      spec_id: RSH-08-003
    adr:
    - ADR-0116
    stories:
    - story_2022_014
  - id: CM-31-032
    priority: MUST
    kind: protocol
    statement: >-
      A participant whose ledger stream is paused (CM-31-010) MUST ignore a CM-31-009
      or CM-31-030 notice from any sender other than the CASE_MANAGER.
    rationale: >-
      The exception is to the channel, not the authority: the notice still originates
      from the CASE_MANAGER (PCR-03-001).
    verification: >-
      `test_paused_replica_ignores_a_termination_from_a_non_manager` and
      `test_paused_replica_ignores_a_revision_from_a_non_manager` in
      `test/core/use_cases/received/test_embargo_ending_notices.py` assert that the
      same notice from a non-manager changes nothing.
    relationships:
    - rel_type: extends
      spec_id: CM-31-010
    adr:
    - ADR-0116
    stories:
    - story_2022_014
  - id: CM-31-033
    priority: MUST
    kind: protocol
    statement: >-
      After a paused participant becomes active again, replaying the ledger entry
      that matches an applied CM-31-009 or CM-31-030 notice MUST change nothing
      further.
    rationale: >-
      The notice already made the change, so the entry, which states the same
      change, must not apply it twice when the participant's ledger stream resumes.
    verification: >-
      `test_replaying_the_termination_after_reinstatement_changes_nothing` in
      `test/core/use_cases/received/test_embargo_ending_notices.py` asserts that a
      later replay of the entry leaves the replica unchanged.
    relationships:
    - rel_type: extends
      spec_id: CM-31-010
    adr:
    - ADR-0116
    stories:
    - story_2022_014
  - id: CM-31-011
    priority: MUST
    kind: protocol
    statement: >-
      `Add(CaseParticipant)[target=VulnerabilityCase]` is the Case Owner's request to
      the CASE_MANAGER to reinstate a removed participant. The CASE_MANAGER MUST handle
      it through the CM-31-004 to CM-31-007 pipeline. That is Case Owner only, one
      ledger entry, a direct notice, and replicas applying it from the entry.
    rationale: >-
      Owners make mistakes and disputes resolve, so removal is reversible. Reinstatement
      reuses the removal pipeline, so it is the Case Owner's decision, recorded once and
      reaching every replica the same way.
    verification: >-
      `test_reinstatement_is_one_entry_and_a_delegated_notice` and
      `test_add_from_a_non_owner_is_refused` in
      `test/core/use_cases/received/test_participant_reinstatement.py` assert the
      Case Owner's `Add` reinstates a removed participant with one entry and a
      delegated notice, and that a non-owner's `Add` is refused.
    relationships:
    - rel_type: depends_on
      spec_id: CM-31-004
    adr:
    - ADR-0116
    stories:
    - story_2022_052
  - id: CM-31-034
    priority: MUST
    kind: protocol
    statement: >-
      A reinstatement MUST clear the participant's removal fact.
    rationale: >-
      The removal fact is what makes the participant inert (CM-31-017). Clearing it
      lets the active check count the participant again.
    verification: >-
      `test_clears_the_removal_fact` in
      `test/core/behaviors/case/nodes/test_case_participant_received.py` and
      `test_reinstatement_clears_the_removal_fact_on_the_replicas_record` in
      `test/core/behaviors/sync/nodes/test_participant_removal_effect.py` assert
      the fact is cleared at the CASE_MANAGER and on a replica.
    relationships:
    - rel_type: extends
      spec_id: CM-31-011
    adr:
    - ADR-0116
    stories:
    - story_2022_052
  - id: CM-31-035
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A reinstatement MUST NOT require the participant to accept again.
    rationale: >-
      The participant never withdrew, so it does not rejoin; `Leave` remains open to
      it. A participant reinstated into a case whose embargo it has not accepted
      stays inert, and its CM-10-006 backfill waits for its consent.
    verification: >-
      `test_reinstatement_asks_for_no_new_acceptance` in
      `test/core/use_cases/received/test_participant_reinstatement.py` asserts that
      the reinstated participant is not asked to accept again.
    relationships:
    - rel_type: extends
      spec_id: CM-31-011
    adr:
    - ADR-0116
    stories:
    - story_2022_052
  - id: CM-31-036
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an `Add(CaseParticipant)[target=VulnerabilityCase]`
      naming a participant that is not removed or that never joined.
    rationale: >-
      Joining requires accepting a stub Invite (ADR-0114), and `Add` must not become a
      way around that. `Add` means reinstatement only, so a participant that is not
      removed has nothing to reinstate.
    verification: >-
      `test_add_naming_an_invitee_that_never_joined_is_refused` in
      `test/core/use_cases/received/test_participant_reinstatement.py` and
      `test_add_naming_a_participant_that_is_not_removed_is_refused` in
      `test/core/use_cases/received/test_participant_removal_planned.py` assert that
      both `Add` requests are refused.
    relationships:
    - rel_type: extends
      spec_id: CM-31-011
    adr:
    - ADR-0116
    - ADR-0114
    stories:
    - story_2022_052
  - id: CM-31-012
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT emit `Add(CaseParticipant)`, or commit an
      `add_case_participant` ledger entry, when an invitee accepts the stub Invite.
      The invitee's `Accept` (`accept_invite_actor_to_case`) is already the ledger entry
      for the consent row it signs and the `joined` mark.
    rationale: >-
      CM-17-004 does not call for it, the Accept message is already the entry for its effects, and a
      replica usually refuses the direct message for want of the participant record it names. It also
      records one move twice, and `Add(CaseParticipant)` now means reinstatement only (CM-31-011).
    verification: >-
      A test drives an invitee's stub-Invite acceptance at the CASE_MANAGER and asserts no
      `Add(CaseParticipant)` is enqueued and no `add_case_participant` entry is
      committed.
    relationships:
    - rel_type: refines
      spec_id: CM-17-004
    adr:
    - ADR-0116
    stories:
    - story_2022_052
  - id: CM-31-041
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a VENDOR-only invitee that accepts the stub Invite. The
      CASE_MANAGER MUST commit its VF `Vf` status entry (CM-11-009) after it announces
      the case to the invitee and backfills the prior ledger (#2898).
    rationale: >-
      The Accept is not the entry for the VF move, so the CASE_MANAGER records it as
      its own `add_participant_status_to_participant` entry. Committing it after the
      announce and the backfill lets the invitee's replica apply it on top of the
      case it already holds.
    verification: >-
      `test_the_accept_commits_only_a_vendors_status_entry` in
      `test/core/behaviors/case/nodes/test_invitee_accept_entries.py` finds a status
      entry for a vendor only, and
      `test_case_announce_and_backfill_precede_the_first_committing_effect` in
      `test/core/behaviors/case/test_accept_invite_tree.py` asserts the announce and
      the backfill come first.
    relationships:
    - rel_type: extends
      spec_id: CM-31-012
    - rel_type: refines
      spec_id: CM-11-009
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-31-037
    priority: MUST
    kind: protocol
    statement: >-
      A replica MUST apply the stub-Invite Accept entry's consent-row and `joined`
      writes as the CASE_MANAGER does, setting `updated` to the Accept's `published`
      as received.
    rationale: >-
      The Accept is the one entry for both writes (CM-31-012), so a replica that
      applied them differently would hold a participant record that differs from the
      CASE_MANAGER's. Taking `updated` from the Accept as received keeps the record
      equal on every replica (ADR-0103, ADR-0124).
    verification: >-
      `test_replicas_hold_the_managers_whole_record_after_invite_and_accept` in
      `test/core/use_cases/received/test_stub_invite_replay.py` compares the whole
      participant record, status ids and timestamps included, between the
      CASE_MANAGER and each replica after the Accept, and
      `test_the_accept_entry_signs_consent_and_marks_joined` in
      `test/core/behaviors/sync/test_announce_tree.py` asserts the replica writes.
    relationships:
    - rel_type: extends
      spec_id: CM-31-012
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-31-038
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A replica seeded with the case MUST NOT move a record it holds backwards when it
      replays an older entry over the seed (ADR-0124). Moving backwards means clearing
      `joined`, or changing a consent row by a move that CM-18-003 does not allow.
    rationale: >-
      A replica seeded with the case already holds a later state than an older entry
      describes. Replaying that entry must not undo what the seed holds, or the
      replica would fall behind the CASE_MANAGER.
    verification: >-
      `test_a_stale_accept_replayed_over_a_seed_that_is_ahead_changes_nothing` in
      `test/core/behaviors/sync/test_announce_tree.py` asserts that a stale Accept
      replayed over a seed that is ahead changes nothing.
    relationships:
    - rel_type: extends
      spec_id: CM-31-012
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-31-039
    priority: MUST
    kind: protocol
    statement: >-
      When a replica holds no record for the invitee, its apply of the stub-Invite
      Accept entry MUST fail.
    rationale: >-
      The Accept entry changes an existing record; it does not create one. A replica
      that created a record from the Accept would hold a participant the CASE_MANAGER
      never seated.
    verification: >-
      `test_a_reply_entry_with_no_record_fails_and_stores_nothing` in
      `test/core/behaviors/sync/test_announce_tree.py` asserts that the apply fails
      and stores nothing.
    relationships:
    - rel_type: extends
      spec_id: CM-31-012
    adr:
    - ADR-0114
    - ADR-0124
    stories:
    - story_2022_052
  - id: CM-31-013
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT send a removed participant a stub Invite, a full-case
      Invite or an embargo Invite. The CM-31-009 and CM-31-030 notices are its only
      exception.
    rationale: >-
      Invites reach inert participants because they ask them to join or consent (CM-10-007). A removed
      participant was taken out by the Case Owner's decision; inviting it to vote on embargo revisions
      would undo that decision.
    verification: >-
      `test_invitation_recipients_leave_out_a_removed_participant` in
      `test/core/use_cases/received/test_participant_reinstatement.py` and
      `test_removed_participant_is_not_invited_to_an_embargo_revision` in
      `test/core/use_cases/received/test_participant_removal_planned.py` assert the
      Invite recipient selection excludes a removed participant.
    relationships:
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0116
    stories:
    - story_2022_023
  - id: CM-31-040
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Owner reinstates a participant that has not accepted the case's
      active embargo, the CASE_MANAGER MUST send it that embargo's Invite.
    rationale: >-
      A reinstated participant that is not a signatory stays inert until it consents,
      so it must be asked.
    verification: >-
      `test_reinstated_non_signatory_gets_the_embargo_invite_and_no_content` and
      `test_reinstatement_into_a_case_with_no_active_embargo_sends_no_invite` in
      `test/core/use_cases/received/test_participant_reinstatement.py` assert that
      reinstating a non-signatory to the active embargo enqueues that embargo's
      Invite to it, and that with no active embargo none is sent.
    relationships:
    - rel_type: extends
      spec_id: CM-31-013
    - rel_type: depends_on
      spec_id: CM-31-011
    adr:
    - ADR-0116
    stories:
    - story_2022_023
    - story_2022_052
- id: CM-32
  title: Case Split — Child Case Creation, Links, Inheritance, and Sibling Notices
  description: >-
    How the parent case's Case Owner splits off a child case through the parent's CASE_MANAGER,
    what the child records and inherits, how its participants stay apart from the parent, and how
    the cases of one split family tell each other about embargo changes (ADR-0125, VP-10).
  specs:
  - id: CM-32-001
    priority: MUST
    kind: protocol
    statement: >-
      To split a case, the parent case's Case Owner MUST send `Create(CaseProposal)` to
      the parent's CASE_MANAGER, with the activity's `context` naming the parent case.
    rationale: >-
      The parent's Owner decides what the parent's coordination becomes, as it does for an
      ownership transfer or a merge (ADR-0053, ADR-0105). The parent `context` is what tells a
      split apart from a report-born proposal, whose sender entitlement differs (HP-01-006).
    verification: >-
      A test marked `CM-32-001` sends a split proposal from the Owner, with `context`
      naming the parent case, and asserts a child case is created.
    stories:
    - story_2022_104
    - story_2022_105
    relationships:
    - rel_type: refines
      spec_id: CP-05-002
    adr:
    - ADR-0125
  - id: CM-32-017
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a split proposal whose sender does not hold
      `CASE_OWNER` on the parent case, creating no case and leaving the parent
      unchanged.
    rationale: >-
      Only the parent's Owner may decide to split the parent (CM-32-001). A refusal that
      created a case, or changed the parent, would let any participant reshape a case it
      does not own.
    verification: >-
      A test marked `CM-32-017` sends a split proposal from a parent participant that
      does not hold `CASE_OWNER` and asserts `REFUSED`, with no child case stored and
      the parent's `child_cases` empty.
    stories:
    - story_2022_104
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-001
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0125
  - id: CM-32-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST answer a split proposal (CP-05) to the Owner with
      `Reject(CaseProposal)`, or with `Accept(CaseProposal)` naming the child in
      `result` and then `Create(VulnerabilityCase)`.
    rationale: >-
      Reusing the proposal answer gives the split the admission decision and the one-act
      creation the creation flow already has, rather than a second creation path to keep
      in step with it.
    verification: >-
      A test marked `CM-32-002` delivers one split proposal and asserts an
      `Accept(CaseProposal)` whose `result` names the child case, and one
      `Create(VulnerabilityCase)` for it, both addressed to the Owner.
    stories:
    - story_2022_104
    relationships:
    - rel_type: depends_on
      spec_id: CP-05-003
    adr:
    - ADR-0125
  - id: CM-32-018
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT create a second child case for a redelivered split
      proposal with the same proposal identifier (CP-05-013).
    rationale: >-
      A split proposal is a `Create(CaseProposal)`, so it takes the duplicate handling
      the creation flow already has. A second child for one request would split one
      family into two.
    verification: >-
      A test marked `CM-32-018` delivers one split proposal twice and asserts one child
      case.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-002
    - rel_type: depends_on
      spec_id: CP-05-006
    adr:
    - ADR-0125
  - id: CM-32-003
    priority: MUST
    kind: protocol
    statement: >-
      The parent's CASE_MANAGER MUST create the child case in its own store.
    rationale: >-
      The split creates a case like any other (CM-22-001, ADR-0041). Creating it in the
      store that already holds the parent keeps the whole family at one CASE_MANAGER
      (CM-32-019).
    verification: >-
      A test marked `CM-32-003` splits a case and asserts the child case is stored in
      the parent CASE_MANAGER's store.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    adr:
    - ADR-0125
    - ADR-0117
  - id: CM-32-019
    priority: MUST
    kind: protocol
    statement: >-
      The parent's CASE_MANAGER MUST be the CASE_MANAGER of each child case it creates.
    rationale: >-
      The child has a CASE_MANAGER from creation (CM-24-006). Hosting the whole family
      at one CASE_MANAGER (CM-32-016) is what lets siblings be read from the parent
      (CM-32-006).
    verification: >-
      A test marked `CM-32-019` splits a case and asserts the CASE_MANAGER participant
      of the child is the parent's CASE_MANAGER.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-003
    adr:
    - ADR-0125
  - id: CM-32-020
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST set the child case's `attributed_to` to the Case Owner that
      requested the split.
    rationale: >-
      As in any case creation, the proposer owns the case it asked for (CM-22-001). The
      splitter is the Owner the child's ledger and roster start from.
    verification: >-
      A test marked `CM-32-020` splits a case and asserts the child's `attributed_to` is
      the splitter.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-003
    adr:
    - ADR-0125
  - id: CM-32-021
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST derive the child case's genesis hash from the child's own
      ID, creation time and Owner (CLP-08-002), never from the parent's.
    rationale: >-
      The child has a ledger of its own that shares no chain with the parent's. A
      genesis hash taken from the parent would tie the two chains together.
    verification: >-
      A test marked `CM-32-021` splits a case and asserts the child's genesis hash
      differs from the parent's and matches the CLP-08-002 derivation over the child's
      own inputs.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-003
    - rel_type: depends_on
      spec_id: CLP-08-002
    adr:
    - ADR-0125
    - ADR-0117
  - id: CM-32-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST create a child case with `parent_cases` holding exactly the
      parent case's ID, and with `child_cases` and `sibling_cases` empty.
    rationale: >-
      The child must know the case its embargo came from, so its CASE_MANAGER can route VP-10
      notices.
    verification: >-
      A test marked `CM-32-004` splits a case and asserts the child's `parent_cases` is the parent ID
      alone and its other two link fields are empty, on the CASE_MANAGER and on the Owner's replica.
    stories:
    - story_2022_104
    adr:
    - ADR-0125
  - id: CM-32-022
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record a split's case cross-references as case IDs, never as
      embedded cases.
    rationale: >-
      Related cases are the exception ADR-0017 made to the full-object rule. An embedded
      parent would also carry the parent's content into the child (CM-32-009).
    verification: >-
      A test marked `CM-32-022` splits a case and asserts that the link fields of the
      child and the parent hold case IDs, not embedded case objects.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-004
    adr:
    - ADR-0125
  - id: CM-32-005
    priority: MUST
    kind: protocol
    statement: >-
      After it commits the child case's creation entry, the CASE_MANAGER MUST add the
      child's ID to the parent's `child_cases`, committed as one parent ledger entry.
    rationale: >-
      Ordering the parent entry after the child's creation means the parent never names
      a case that does not exist. One write per split keeps the links consistent.
    verification: >-
      A test marked `CM-32-005` splits a case and asserts the parent's ledger gains one
      entry naming the child, committed after the child's creation entry.
    stories:
    - story_2022_104
    relationships:
    - rel_type: depends_on
      spec_id: CLP-02-001
    adr:
    - ADR-0125
    - ADR-0124
  - id: CM-32-023
    priority: MUST
    kind: protocol
    statement: >-
      A replica of the parent case MUST take the child link from the parent ledger entry
      of CM-32-005.
    rationale: >-
      A replica copies the case from the CASE_MANAGER's ledger and never writes the case
      itself (ADR-0124). A link a replica wrote on its own could name a child the
      CASE_MANAGER never committed.
    verification: >-
      A test marked `CM-32-023` replays the parent's ledger on a parent replica and
      asserts the replica holds the child in `child_cases`.
    stories:
    - story_2022_104
    relationships:
    - rel_type: depends_on
      spec_id: CM-32-005
    adr:
    - ADR-0125
    - ADR-0124
  - id: CM-32-024
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT write `sibling_cases` on any case as part of a split.
    rationale: >-
      No existing sibling changes when a new child appears, because siblings are read
      from the parent (CM-32-006). That leaves `sibling_cases` free for the merge spec
      (ADR-0105).
    verification: >-
      A test marked `CM-32-024` splits a case and asserts that no case's `sibling_cases`
      changed.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-005
    adr:
    - ADR-0125
  - id: CM-32-006
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST read a split family as a parent case with the cases its
      `child_cases` lists. A child's siblings are the other cases in its parent's
      `child_cases`. A case that is both a child and a parent belongs to both families.
      A notice it owes under CM-32-013 or CM-32-014 goes to every other member case of
      each.
    rationale: >-
      The parent stays open after a split, so it is coordinated alongside its children and
      counts as their sibling for VP-10-002 and VP-10-003. Reading siblings from the parent
      needs no stored sibling list, because one CASE_MANAGER hosts the parent and every child
      (CM-32-019, CM-32-016).
    verification: >-
      A test marked `CM-32-006` splits one case twice and splits the first child again, and
      asserts the notice recipient cases computed for the first child are the parent, the
      second child and the grandchild.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: VP-10-002
    - rel_type: refines
      spec_id: VP-10-003
    adr:
    - ADR-0125
  - id: CM-32-025
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When it merges cases, the CASE_MANAGER MUST NOT record a merged case in any case's
      `child_cases`.
    rationale: >-
      Only a split writes `child_cases` (CM-32-005), so a merged case never joins a
      split family. Keeping merges out of `child_cases` leaves the merge spec the other
      two link fields (ADR-0105).
    verification: >-
      A test marked `CM-32-025` merges two cases and asserts that no case's
      `child_cases` names a merged case.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-006
    adr:
    - ADR-0125
  - id: CM-32-007
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a split whose parent case has an active embargo. The CASE_MANAGER
      MUST give the child a new `EmbargoEvent`, scoped to the child, with the active
      embargo's end time, active from creation.
    rationale: >-
      VP-10-005 transfers the embargo; ADR-0125 limits the transfer to its terms. A new embargo
      object keeps consent per (participant, embargo) (ADR-0122): a child participant consents to
      the child's embargo, and its answer says nothing about the parent's.
    verification: >-
      A test marked `CM-32-007` splits a case with an active embargo and asserts the
      child's register holds one active embargo with a new ID and the parent's end time.
    stories:
    - story_2022_105
    relationships:
    - rel_type: refines
      spec_id: VP-10-005
    - rel_type: supersedes
      spec_id: CM-14-010
    adr:
    - ADR-0125
    - ADR-0122
  - id: CM-32-026
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER gives a child case a new embargo under CM-32-007, it MUST
      write the child Owner's consent row for that embargo as `AGREED`.
    rationale: >-
      The Owner asked for the split and so agrees to the terms the child inherits. Its
      `AGREED` row is what makes it read as the new embargo's signatory (ADR-0122).
    verification: >-
      A test marked `CM-32-026` splits a case with an active embargo and asserts the
      Owner's consent row on the child's embargo is `AGREED`.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-007
    adr:
    - ADR-0125
    - ADR-0122
  - id: CM-32-027
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When it splits a case with an active embargo, the CASE_MANAGER MUST NOT carry the
      parent embargo's consent rows over to the child.
    rationale: >-
      Consent is per (participant, embargo) (ADR-0122). A parent participant's answer to
      the parent's embargo says nothing about the child's.
    verification: >-
      A test marked `CM-32-027` splits a case with an active embargo and asserts the
      child's embargo has no consent row but the Owner's.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-007
    adr:
    - ADR-0125
    - ADR-0122
  - id: CM-32-028
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When it splits a case with an active embargo, the CASE_MANAGER MUST NOT give the
      child the parent's open embargo proposals or revisions.
    rationale: >-
      ADR-0125 limits the transfer to the active embargo's terms. A proposal still open
      in the parent belongs to the parent's negotiation.
    verification: >-
      A test marked `CM-32-028` splits a case with an active embargo and an open
      revision and asserts the child holds no open proposal.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-007
    adr:
    - ADR-0125
  - id: CM-32-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When the parent case has no active embargo at the split, the CASE_MANAGER MUST NOT
      give the child an embargo.
    rationale: >-
      The child inherits the parent's embargo state, not a default: a parent whose embargo has ended
      or was never agreed must not gain an embargoed child the parent's participants never agreed to.
    verification: >-
      A test marked `CM-32-008` splits a case whose embargo has exited and asserts the child's EM
      state is `NONE` with an empty embargo register.
    stories:
    - story_2022_105
    relationships:
    - rel_type: refines
      spec_id: VP-10-005
    adr:
    - ADR-0125
  - id: CM-32-029
    priority: MUST_NOT
    kind: protocol
    statement: >-
      When a split's parent case has no active embargo, the CASE_MANAGER MUST NOT run
      the creation-time default embargo initialization (CM-14-010, EP-04-012) for the
      child.
    rationale: >-
      The default would give the child an embargo that CM-32-008 forbids. The parent's
      participants never agreed to an embargoed child.
    verification: >-
      A test marked `CM-32-029` splits a case whose embargo has exited and asserts no
      default embargo is proposed or activated for the child.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-008
    - rel_type: supersedes
      spec_id: CM-14-010
    adr:
    - ADR-0125
  - id: CM-32-009
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT give a child case any of the parent's reports, notes,
      ledger entries, participants, case statuses, vulnerability records or case
      references.
    rationale: >-
      The split exists to keep the child's participants apart from the parent's content. Creating
      the child empty and adding only what the splitter wrote makes isolation the default; copying
      and pruning would disclose whatever the pruning missed.
    verification: >-
      A test marked `CM-32-009` splits a case holding a report, a note, several ledger entries and
      several participants, and asserts that none of them appears in the child.
    stories:
    - story_2022_104
    adr:
    - ADR-0125
  - id: CM-32-030
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST begin a child case's ledger at the child's own genesis hash.
    rationale: >-
      A child ledger that chained from a parent entry would carry the parent's history
      into the child (CM-32-009).
    verification: >-
      A test marked `CM-32-030` splits a case and asserts that the child's first ledger
      entry chains from the child's genesis hash.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-009
    adr:
    - ADR-0125
  - id: CM-32-010
    priority: MUST
    kind: protocol
    statement: >-
      The Case Owner MUST include in its split proposal a new `VulnerabilityReport`
      attributed to itself, and the stub summary for the child's stub Invites
      (CM-17-010).
    rationale: >-
      Every case has a report (CM-05-002). A report the splitter writes for the child is the
      child's fresh description. The splitter, not the CASE_MANAGER, decides how much an
      invitee not yet bound by the embargo may learn from the stub (CM-17-010).
    verification: >-
      A test marked `CM-32-010` sends a split proposal carrying a new report and a stub
      summary and asserts a child case is created.
    stories:
    - story_2022_104
    relationships:
    - rel_type: depends_on
      spec_id: CM-05-002
    adr:
    - ADR-0125
  - id: CM-32-031
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST make the split proposal's report the child case's only
      report.
    rationale: >-
      The splitter's report is the child's description. Any other report would come from
      the parent (CM-32-009).
    verification: >-
      A test marked `CM-32-031` splits a case and asserts the child holds the split
      proposal's report alone.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-010
    adr:
    - ADR-0125
  - id: CM-32-032
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST put the split proposal's stub summary in each stub Invite it
      sends for the child case.
    rationale: >-
      The splitter chose what an invitee not yet bound by the embargo may learn
      (CM-17-010). A summary the CASE_MANAGER chose for itself could reveal more.
    verification: >-
      A test marked `CM-32-032` splits a case and invites a participant to the child,
      and asserts the stub Invite carries the split proposal's stub summary.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-010
    - rel_type: depends_on
      spec_id: CM-17-010
    adr:
    - ADR-0125
  - id: CM-32-033
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a split proposal whose report is one of the parent
      case's reports, or that carries no stub summary.
    rationale: >-
      Refusing a parent report keeps the parent's description out of the child
      (CM-32-009). With no stub summary, the child's stub Invites could carry nothing
      the splitter chose (CM-17-010).
    verification: >-
      A test marked `CM-32-033` sends a split proposal carrying a parent report, and one
      carrying no stub summary, and asserts `REFUSED` with no child each time.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-010
    adr:
    - ADR-0125
  - id: CM-32-011
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST initialize a child case by the sequence of CM-14-001, with
      CM-32-007 or CM-32-008 in place of its embargo step (CM-14-010).
    rationale: >-
      A child is a case like any other, so it starts from the same sequence. Its embargo
      comes from the parent, not from the creation-time default.
    verification: >-
      A test marked `CM-32-011` splits a case and asserts the child's initialization
      entries follow CM-14-001, with an embargo only when CM-32-007 applies.
    stories:
    - story_2022_104
    relationships:
    - rel_type: supersedes
      spec_id: CM-14-001
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-034
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST skip the reporter steps of case initialization (CM-14-011,
      CM-14-012) when it initializes a child case.
    rationale: >-
      The child has no outside reporter; the Owner wrote its description.
    verification: >-
      A test marked `CM-32-034` splits a case and asserts that no reporter participant
      is seated in the child.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-011
    - rel_type: supersedes
      spec_id: CM-14-011
    - rel_type: supersedes
      spec_id: CM-14-012
    adr:
    - ADR-0125
  - id: CM-32-035
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST seat only itself and the Owner when it initializes a child
      case, the Owner holding `CASE_OWNER` at `RM.RECEIVED` (CM-14-009). These two are
      the participants seated by case initialization for CM-10-004.
    rationale: >-
      Every other participant joins the child by accepting its stub Invite (ADR-0114),
      so it gets the child's content only once it is active (CM-10-004).
    verification: >-
      A test marked `CM-32-035` splits a case and asserts the child's roster holds
      exactly the CASE_MANAGER and the Owner, the Owner holding `CASE_OWNER` at
      `RM.RECEIVED`.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-011
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-036
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT give the splitter the Reporter role for authoring the
      child's report.
    rationale: >-
      The splitter wrote the child's description as its Owner, not as an outside
      reporter. A Reporter role would claim a report the child never received from
      outside.
    verification: >-
      A test marked `CM-32-036` splits a case and asserts there is no `REPORTER` role on
      the Owner's participant record in the child.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-011
    adr:
    - ADR-0125
  - id: CM-32-037
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT invite a participant to a child case before it commits
      the child's creation entry (CM-14-007).
    rationale: >-
      An Invite sent before the creation entry would name a case the ledger does not yet
      hold, as for any case (CM-14-007).
    verification: >-
      A test marked `CM-32-037` splits a case and asserts that no Invite for the child
      is queued before the child's creation entry is committed.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: CM-14-007
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-012
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT add a participant to the parent case's roster because of
      a child-case activity.
    rationale: >-
      Joining the child is joining the child only. A participant in both cases, such as the Owner,
      is a participant of each separately.
    verification: >-
      A test marked `CM-32-012` invites a vendor to a child case, has it accept, and
      asserts the vendor is absent from the parent roster.
    stories:
    - story_2022_104
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-038
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The parent case's recipient selection (CM-10-007) MUST NOT return a participant of
      the child case that is not separately a participant of the parent.
    rationale: >-
      The recipient selection is the one place that decides who gets case content
      (CM-10-007). A child participant it returned would get the parent's content.
    verification: >-
      A test marked `CM-32-038` invites a vendor to a child case, has it accept, commits
      a parent ledger entry, and asserts the vendor is absent from the entry's
      recipients.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: CM-10-007
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-039
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT send a parent ledger entry to a child-case participant
      that is not separately a participant of the parent.
    rationale: >-
      Parent content reaches a participant in both cases only as a parent participant.
      Keeping the child apart from the parent's content is why the split exists.
    verification: >-
      A test marked `CM-32-039` invites a vendor to a child case, has it accept, commits
      a parent ledger entry, and asserts nothing for that entry is queued to the vendor.
    stories:
    - story_2022_104
    relationships:
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0125
    - ADR-0114
  - id: CM-32-013
    priority: MUST
    kind: protocol
    statement: >-
      This rule covers a child case's CASE_MANAGER that commits an embargo proposal or
      revision ending earlier than the end time the child inherited. Before the proposal
      is activated, it MUST commit a split-family embargo notice to each other member
      case's ledger in the child's family (CM-32-006).
    rationale: >-
      This is how VP-10-002 is carried out. An earlier end in one child can reveal the
      vulnerability in the products the others cover (VP-10, split discussion), so the other
      cases hear of it while it is still a proposal.
    verification: >-
      A test marked `CM-32-013` proposes an earlier end time in a child and asserts a notice
      entry in each other family member's ledger.
    stories:
    - story_2022_105
    relationships:
    - rel_type: implements
      spec_id: VP-10-002
    adr:
    - ADR-0125
    - ADR-0113
  - id: CM-32-040
    priority: MUST
    kind: protocol
    statement: >-
      A split-family embargo notice under CM-32-013 MUST carry the child's ID, the
      proposed end time and the proposer's rationale.
    rationale: >-
      The other cases need to know which case wants the earlier end, how much earlier,
      and why, to weigh the risk to their own products.
    verification: >-
      A test marked `CM-32-040` proposes an earlier end time in a child and asserts each
      notice entry carries the child's ID, the proposed end time and the rationale.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-013
    adr:
    - ADR-0125
  - id: CM-32-041
    priority: MUST
    kind: protocol
    statement: >-
      For a proposal under CM-32-013, the child's CASE_MANAGER MUST commit the
      proposer's rationale to the child's ledger.
    rationale: >-
      The reason for the earlier end is then on record in the case that asked for it, as
      well as in the cases it was sent to.
    verification: >-
      A test marked `CM-32-041` proposes an earlier end time in a child and asserts a
      child ledger entry carrying the rationale.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-013
    adr:
    - ADR-0125
  - id: CM-32-042
    priority: MUST
    kind: protocol
    statement: >-
      The rationale of a proposal under CM-32-013 is the proposing activity's `content`.
      The child's CASE_MANAGER MUST refuse such a proposal whose `content` is empty.
    rationale: >-
      The activity's `content` carries the rationale because embargo proposals have no
      rationale field of their own. With no rationale, the notice would tell the other
      cases nothing about why.
    verification: >-
      A test marked `CM-32-042` proposes an earlier end time in a child with empty
      `content` and asserts the proposal is refused.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-013
    adr:
    - ADR-0125
  - id: CM-32-014
    priority: MUST
    kind: protocol
    statement: >-
      When the active embargo of any member of a split family changes — a revision is
      activated or the embargo is terminated — the family's CASE_MANAGER MUST commit a
      split-family embargo notice to the ledger of every other member case of the family
      (CM-32-006), carrying the changed member's ID, its new end time or the fact of
      termination, and the rationale when the change's proposal gave one.
    rationale: >-
      This is how VP-10-003 is carried out. Participants address case messages only to their
      CASE_MANAGER (PCR-08-001), and every member case has the same CASE_MANAGER (CM-32-016),
      so a change agreed in one case reaches the others' participants through their own
      ledgers rather than from participant to participant.
    verification: >-
      A test marked `CM-32-014` activates a revision in one child, and separately terminates
      its embargo, and asserts a notice entry in the parent's and each sibling's ledger each
      time.
    stories:
    - story_2022_105
    relationships:
    - rel_type: implements
      spec_id: VP-10-003
    adr:
    - ADR-0125
  - id: CM-32-015
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER of a member case MUST be the only actor that commits a
      split-family embargo notice to that case's ledger.
    rationale: >-
      Committing the notice to the receiving ledger delivers it through the shared
      recipient selection (CM-10-004). The participants of one case thus learn of
      another's change without ever being addressed by it.
    verification: >-
      A test marked `CM-32-015` commits a notice about a sibling and asserts one entry
      in the receiving ledger, committed by that case's CASE_MANAGER and fanned out to
      that case's active participants.
    stories:
    - story_2022_105
    relationships:
    - rel_type: implements
      spec_id: VP-10-003
    - rel_type: refines
      spec_id: CM-10-004
    adr:
    - ADR-0125
  - id: CM-32-043
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT change the receiving case's EM state or any consent row
      when it commits a split-family embargo notice.
    rationale: >-
      A notice informs and proposes nothing: a case's embargo changes only through its own
      negotiation (ADR-0125).
    verification: >-
      A test marked `CM-32-043` commits a notice about a sibling and asserts the
      receiving case's EM state and consent rows are unchanged.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-015
    adr:
    - ADR-0125
  - id: CM-32-044
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT put content of the reported case in a split-family
      embargo notice beyond three items. These are that case's ID, its new end time or
      the fact of termination, and the rationale.
    rationale: >-
      The participants of the receiving case may not be participants of the reported
      one. They learn of its change, and nothing else of that case.
    verification: >-
      A test marked `CM-32-044` commits a notice about a sibling and asserts no field in
      the notice beyond the three it may carry.
    stories:
    - story_2022_105
    relationships:
    - rel_type: extends
      spec_id: CM-32-015
    adr:
    - ADR-0125
  - id: CM-32-016
    priority: MUST_NOT
    kind: protocol
    statement: >-
      While a case belongs to a split family, its CASE_MANAGER role MUST NOT be
      delegated to any actor but the CASE_MANAGER of the other members.
    rationale: >-
      Siblings are read from the parent (CM-32-006), and notices are ledger commits by the one
      CASE_MANAGER hosting the family (CM-32-013, CM-32-014). A member moved to another
      CASE_MANAGER could neither find its siblings nor reach them. ADR-0125 leaves a family
      spread across CASE_MANAGERs to a later decision.
    verification: >-
      A test marked `CM-32-016` requests delegation of a child case's CASE_MANAGER role to
      another actor and asserts the child's CASE_MANAGER is unchanged.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-24-006
    adr:
    - ADR-0125
  - id: CM-32-045
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a delegation that CM-32-016 forbids, leaving the
      case's CASE_MANAGER unchanged.
    rationale: >-
      A refusal tells the requester that the delegation did not happen, rather than
      leaving it to find out from a family split across CASE_MANAGERs.
    verification: >-
      A test marked `CM-32-045` requests delegation of a child case's CASE_MANAGER role
      to another actor and asserts it is refused.
    stories:
    - story_2022_104
    relationships:
    - rel_type: extends
      spec_id: CM-32-016
    adr:
    - ADR-0125
- id: CM-33
  title: Role Delegation Offers
  description: >-
    How a role offer, `Offer(CaseParticipantRole)` (ADR-0039), and its answer travel through
    the CASE_MANAGER, which records both. The offer adds a role to an actor that is already a
    participant; the roles an Invite carries at joining are CM-17. The routing follows PCR-08
    and the ownership-transfer model (CM-21).
  specs:
  - id: CM-33-001
    priority: MUST
    kind: protocol
    statement: >-
      A Case Owner offering a role MUST address `Offer(CaseParticipantRole)` to the
      case's CASE_MANAGER only, never to the target.
    rationale: >-
      A participant sends case-scoped messages only to the CASE_MANAGER (PCR-08-001). An
      Offer that goes directly to the target bypasses the CASE_MANAGER. The CASE_MANAGER
      then cannot check the answer against a recorded Offer, and cannot ledger it.
    verification: >-
      A test marked `CM-33-001` triggers a Case Owner's role Offer and asserts it is
      queued addressed to the CASE_MANAGER only.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: implements
      spec_id: PCR-08-001
    adr:
    - ADR-0039
  - id: CM-33-007
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER admits a role Offer, it MUST commit a `CaseLedgerEntry` for
      that Offer.
    rationale: >-
      The recorded Offer is what the CASE_MANAGER checks the target's answer against
      (CM-33-005). An Offer it never ledgered could not be answered.
    verification: >-
      A test marked `CM-33-007` delivers a Case Owner's role Offer to the CASE_MANAGER
      and asserts an entry for the Offer.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-001
    adr:
    - ADR-0039
  - id: CM-33-008
    priority: MUST
    kind: protocol
    statement: >-
      After it commits an admitted role Offer, the CASE_MANAGER MUST forward the Offer
      to the target, with `inReplyTo` set to the recorded Offer's id. The forward's
      `actor` is the CASE_MANAGER and its `attributed_to` the Case Owner (CM-24-001,
      CM-24-002).
    rationale: >-
      The target takes case messages from the CASE_MANAGER only (PCR-03-001), so it
      learns of the Offer from the forward. The `inReplyTo` lets the CASE_MANAGER
      resolve an answer to the forward back to the Offer it recorded (CM-33-005).
    verification: >-
      A test marked `CM-33-008` delivers a Case Owner's role Offer to the CASE_MANAGER
      and asserts an Offer forward to the target carrying `inReplyTo`, with the
      CASE_MANAGER as `actor` and the Case Owner as `attributed_to`.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-001
    - rel_type: refines
      spec_id: CM-24-005
    adr:
    - ADR-0039
  - id: CM-33-009
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT grant an offered role when it receives the role Offer.
      It grants the role when it commits the Accept (CM-02-016).
    rationale: >-
      An Offer is a proposal, not the grant. A role granted on the Offer would hold even
      if the target declined it.
    verification: >-
      A test marked `CM-33-009` delivers a Case Owner's role Offer to the CASE_MANAGER
      and asserts the target's roles are unchanged.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-001
    adr:
    - ADR-0039
  - id: CM-33-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a received `Offer(CaseParticipantRole)` whose sender
      is not the case's Case Owner, committing no ledger entry and sending no forward.
    rationale: >-
      A role grant decides who runs part of the case. That is the decision of the Case
      Owner, as ownership transfer is (CM-02-005).
    verification: >-
      A test marked `CM-33-002` delivers a role Offer from a participant that is not the Case
      Owner and asserts `REFUSED` with no entry committed and nothing queued.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: CM-02-005
    adr:
    - ADR-0039
    - ADR-0115
  - id: CM-33-010
    priority: MAY
    kind: protocol
    statement: >-
      Where its policy delegates role offers to it, a CASE_MANAGER MAY commit a role
      Offer on its own case and send it to the target. The checks of CM-33-003 apply to
      that Offer.
    rationale: >-
      A Case Owner can delegate its decisions to the CASE_MANAGER in advance. The Offer
      is then the CASE_MANAGER's own, so it has no Case Owner's Offer to forward.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-002
    adr:
    - ADR-0039
  - id: CM-33-011
    priority: MAY
    kind: protocol
    statement: >-
      An implementation MAY omit the CASE_MANAGER-originated role Offer path of
      CM-33-010.
    rationale: >-
      The Case Owner path alone lets every case grant roles. Thus a path that starts at
      the CASE_MANAGER adds convenience, not capability, and an implementation can omit
      it.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-010
    adr:
    - ADR-0039
  - id: CM-33-003
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a role Offer in any of five cases. In two, the Offer
      carries no readable CVD role, or it offers `CASE_OWNER` or `CASE_MANAGER`. In
      three, its target is not a participant in the case, already holds the offered
      role, or is the CASE_MANAGER itself.
    rationale: >-
      A grant only adds a role. Thus an accepted CASE_OWNER or CASE_MANAGER offer would
      give the case two holders of a role that it has exactly one of (CM-21-001,
      CM-02-001). Ownership moves by ownership transfer (CM-21). The CASE_MANAGER role
      moves only by delegation (CM-24-006), never by a role Offer, because it carries
      ledger authority. The CASE_MANAGER takes no other role by Offer. The forward of
      CM-33-008 would go to itself (BT-17-008), and the answer of CM-33-004 would also
      go to itself.
    verification: >-
      A test marked `CM-33-003` delivers a role Offer for each refused shape, including one
      whose `CaseParticipantRole` carries no role and one whose target is the CASE_MANAGER,
      and asserts `REFUSED`.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: constrains
      spec_id: CM-02-016
    - rel_type: refines
      spec_id: CM-02-001
    adr:
    - ADR-0039
  - id: CM-33-012
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT commit a ledger entry for a role Offer that it refuses
      under CM-33-003.
    rationale: >-
      The ledger records what the case admitted. An entry for a refused Offer would read
      as an open Offer that the target could answer.
    verification: >-
      A test marked `CM-33-012` delivers a role Offer for each refused shape and asserts
      no entry committed.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-003
    adr:
    - ADR-0039
  - id: CM-33-013
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT forward a role Offer that it refuses under CM-33-003.
    rationale: >-
      A forward invites the target to answer. A forwarded refused Offer would ask the
      target about a grant the case will never make.
    verification: >-
      A test marked `CM-33-013` delivers a role Offer for each refused shape and asserts
      no Offer forward is queued.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-003
    adr:
    - ADR-0039
  - id: CM-33-014
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor handling a role Offer MUST NOT read a missing CVD role as any default
      role.
    rationale: >-
      If a missing role were read as a default, the case would grant a role that nobody
      offered.
    verification: >-
      A test marked `CM-33-014` asks the offer-case-participant-role trigger for an
      Offer with no role and asserts the request is refused; another delivers a role
      Offer with no role to the CASE_MANAGER and asserts `REFUSED`.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-003
    adr:
    - ADR-0039
  - id: CM-33-004
    priority: MUST
    kind: protocol
    statement: >-
      An actor named as the target of a role Offer MUST refuse it, sending no answer,
      when the CASE_MANAGER did not send it.
    rationale: >-
      A replica takes case changes from the CASE_MANAGER only (PCR-03-001). An Offer
      from any other actor was never recorded by the CASE_MANAGER, so an answer to it
      could not be ledgered.
    verification: >-
      A test marked `CM-33-004` delivers a role Offer to the target from the Case Owner
      directly and asserts `REFUSED` with nothing queued; another delivers the
      CASE_MANAGER's forward to the target and asserts one answer queued.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: PCR-03-001
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0039
  - id: CM-33-015
    priority: MUST
    kind: protocol
    statement: >-
      The target of a role Offer MUST address its `Accept` or `Reject` to the
      CASE_MANAGER only, never to the Case Owner that made the Offer.
    rationale: >-
      The answer is a case-scoped message (PCR-08-001). An answer that goes only to the
      Case Owner is never ledgered.
    verification: >-
      A test marked `CM-33-015` delivers the CASE_MANAGER's forward to the target and
      asserts one answer queued, addressed to the CASE_MANAGER only.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: implements
      spec_id: PCR-08-001
    - rel_type: extends
      spec_id: CM-33-004
    adr:
    - ADR-0039
  - id: CM-33-005
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on an answer to a role Offer only when its sender is the
      target of an open Offer it recorded. An Offer is open until the ledger holds an
      Accept or Reject entry for it (CLP-11-001).
    rationale: >-
      The answer decides if the role is granted. Thus only the actor that received the
      Offer can give the answer, and only one time. The check uses the Offer that the
      CASE_MANAGER recorded, never the copy in the answer. CM-11-017 and CM-21-011 do
      the same check.
    verification: >-
      Tests marked `CM-33-005` deliver to the CASE_MANAGER, after a recorded role Offer,
      an Accept from a participant that is not its target, asserting `REFUSED` with no
      role granted, and a Reject after the target's Accept closed the Offer, asserting
      `REFUSED` with no change.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: depends_on
      spec_id: CM-33-001
    adr:
    - ADR-0039
    - ADR-0115
  - id: CM-33-016
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an answer that CM-33-005 does not let it act on,
      committing no ledger entry and changing no role.
    rationale: >-
      An entry or a role change made for a refused answer would grant, or record as
      decided, an Offer its target never answered.
    verification: >-
      A test marked `CM-33-016` delivers an Accept from a participant that is not the
      Offer's target, and a Reject after the Offer closed, and asserts no entry
      committed and no role change each time.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-005
    adr:
    - ADR-0039
  - id: CM-33-017
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST resolve an answer that names its forward to the recorded
      role Offer through the forward's `inReplyTo`.
    rationale: >-
      The target answers the forward it received, which the CASE_MANAGER sent, not the
      Case Owner's Offer. Only the stored forward's `inReplyTo` links that answer to the
      recorded Offer.
    verification: >-
      A test marked `CM-33-017` delivers the target's Accept naming the CASE_MANAGER's
      forward and asserts the Offer is closed and the role granted.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-005
    adr:
    - ADR-0039
  - id: CM-33-018
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST report a redelivery of the answer that closed a role Offer
      as `SKIPPED` (HP-01-003).
    rationale: >-
      A redelivery is the same answer again, not a new one. Reporting it `REFUSED` would
      tell the target its answer was declined after it was admitted.
    verification: >-
      A test marked `CM-33-018` redelivers the closing Accept, and the closing Reject,
      and asserts `SKIPPED` with no new entry each time.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-005
    adr:
    - ADR-0039
  - id: CM-33-006
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER admits an answer to a role Offer under CM-33-005, it MUST
      commit a `CaseLedgerEntry` for it (`accept_case_participant_role` or
      `reject_case_participant_role`).
    rationale: >-
      A participant's answer to an Offer is a case event (CLP-02-016), so it is ledgered
      as all other case events are.
    verification: >-
      A test marked `CM-33-006` delivers the target's Accept of a recorded role Offer
      and asserts the `accept_case_participant_role` entry; and the same for a Reject,
      with the `reject_case_participant_role` entry.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: implements
      spec_id: CLP-02-012
    - rel_type: implements
      spec_id: PCR-08-003
    - rel_type: depends_on
      spec_id: CM-33-005
    adr:
    - ADR-0039
  - id: CM-33-019
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER commits an answer to a role Offer under CM-33-006, it MUST
      broadcast `Announce(CaseLedgerEntry)` to the case's participants.
    rationale: >-
      Replicas learn of a granted role only when they replay the announced entry
      (CM-02-016, RSH-08-004). Thus if the answer is not announced, the roles in every
      replica are out of date.
    verification: >-
      A test marked `CM-33-019` delivers the target's Accept of a recorded role Offer,
      and separately its Reject, and asserts a queued `Announce` each time.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-006
    adr:
    - ADR-0039
  - id: CM-33-020
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER commits an `Accept` of a role Offer, it MUST grant the role
      on its own replica, as CM-02-016 requires.
    rationale: >-
      The CASE_MANAGER's replica is the one its later checks read, such as whether the
      target already holds a role (CM-33-003).
    verification: >-
      A test marked `CM-33-020` delivers the target's Accept of a recorded role Offer
      and asserts the role on the target's participant record.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-006
    adr:
    - ADR-0039
  - id: CM-33-021
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT change any role when it commits a `Reject` of a role
      Offer.
    rationale: >-
      A Reject declines the Offer, so the target's roles stay as they were.
    verification: >-
      A test marked `CM-33-021` delivers the target's Reject of a recorded role Offer
      and asserts the target's roles are unchanged.
    stories:
    - story_2022_035
    - story_2022_088
    relationships:
    - rel_type: extends
      spec_id: CM-33-006
    adr:
    - ADR-0039
