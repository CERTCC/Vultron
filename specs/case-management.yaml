id: CM
title: Case Management
description: Requirements for VulnerabilityCase lifecycle management, CaseActor responsibilities, and the RM/EM/CS/VFD state
  model. Covers actor isolation at the protocol level, the distinction between participant-specific and participant-agnostic
  state, case initialization sequencing, embargo acceptance ownership, and the invitation acceptance lifecycle.
version: 1.2.0
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: CM-01
  title: Actor Isolation
  specs:
  - id: CM-01-001
    priority: MUST
    kind: protocol
    statement: Each actor MUST have an isolated protocol state domain
  - id: CM-01-002
    priority: MUST
    kind: protocol
    statement: Each actor's RM state MUST be maintained independently per case
- id: CM-02
  title: CaseActor Lifecycle
  specs:
  - id: CM-02-001
    priority: MUST
    kind: protocol
    statement: Each VulnerabilityCase MUST have exactly one associated CaseActor
  - id: CM-02-002
    priority: MUST
    kind: protocol
    statement: CaseActor MUST be the authoritative source of truth for case state
  - id: CM-02-003
    priority: MUST
    kind: protocol
    statement: CaseActor MUST persist until the associated VulnerabilityCase is closed
  - id: CM-02-004
    priority: MUST
    kind: protocol
    statement: CaseActor MUST know the case owner
  - id: CM-02-005
    priority: MUST
    kind: protocol
    statement: CaseActor MUST restrict certain activities to the case owner
    scope:
    - production
  - id: CM-02-006
    priority: MUST
    kind: protocol
    statement: CaseActor MUST enforce case-level authorization for all case mutations
    scope:
    - production
  - id: CM-02-007
    priority: MUST
    kind: protocol
    statement: '`VulnerabilityCase` MUST include a `notes: list[as_NoteRef]` field to record case-scoped notes created via
      `AddNoteToCase` activities'
  - id: CM-02-008
    priority: MUST
    kind: protocol
    statement: When a `VulnerabilityCase` is created from an originating `VulnerabilityReport` Offer, the vendor (case recipient
      / owner) MUST be recorded as the initial primary participant
  - id: CM-02-009
    priority: MUST
    kind: protocol
    statement: The CaseActor MUST apply its own trusted timestamp to every state-changing event it receives, regardless of
      any timestamp supplied by the sending participant
    rationale: The CaseActor's clock is the only trusted source of time for event ordering within a case; using participant-supplied
      timestamps would allow different copies of a case (held by different actors) to disagree on event order, undermining
      auditability and the single-source-of-truth guarantee
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
  - id: CM-02-010
    priority: MUST
    kind: protocol
    statement: The CaseActor and the case owner (named actor) MUST have distinct actor identities — each with their own actor
      ID — even when co-located on the same server
    rationale: Enforcing distinct identities ensures that all case-state transitions pass through the wire protocol regardless
      of deployment topology, preserving audit integrity and enabling future separation onto independent containers without
      protocol changes
    relationships:
    - rel_type: refines
      spec_id: CM-01-001
    - rel_type: depends_on
      spec_id: CM-02-001
- id: CM-03
  title: Case State Model
  specs:
  - id: CM-03-001
    priority: MUST
    kind: protocol
    statement: 'The system MUST implement the three interacting state machines: RM (Report Management), EM (Embargo Management),
      and CS (Case State)'
    relationships:
    - rel_type: implements
      spec_id: VP-01-001
    - rel_type: implements
      spec_id: VP-13-001
    - rel_type: implements
      spec_id: VP-14-001
  - id: CM-03-002
    priority: MUST
    kind: protocol
    statement: RM state MUST be participant-specific
    relationships:
    - rel_type: implements
      spec_id: VP-01-002
    - rel_type: implements
      spec_id: VP-02-002
    - rel_type: implements
      spec_id: VP-03-001
  - id: CM-03-003
    priority: MUST
    kind: protocol
    statement: A shared EM state MUST be tracked at the case level in `CaseStatus.em_state` to represent the collective embargo
      agreement
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: implements
      spec_id: VP-14-001
  - id: CM-03-008
    priority: MUST
    kind: protocol
    statement: Each `CaseParticipant` MUST track their own embargo consent state via the `ParticipantStatus.embargo_adherence`
      field
    relationships:
    - rel_type: implements
      spec_id: VP-04-002
  - id: CM-03-004
    priority: MUST
    kind: protocol
    statement: CS (PXA sub-state) MUST be participant-agnostic (shared per case)
  - id: CM-03-005
    priority: MUST
    kind: protocol
    statement: VFD (Vendor Fix Deployment) state MUST be participant-specific
  - id: CM-03-006
    priority: MUST
    kind: protocol
    statement: Collection fields that hold status histories MUST be pluralized and documented as history collections
  - id: CM-03-007
    priority: MUST
    kind: protocol
    statement: RM state transitions MUST use the established protocol activity types without introducing new activity types
      for reverse transitions
    rationale: Keeps the RM symbol set minimal and produces clean audit histories; `Undo` conflates historical negation with
      a new forward transition
    relationships:
    - rel_type: implements
      spec_id: VP-02-004
- id: CM-04
  title: State Transition Correctness
  specs:
  - id: CM-04-001
    priority: MUST
    kind: protocol
    statement: Handlers processing RM state transitions MUST update `ParticipantStatus.rm_state` for the sending actor's CaseParticipant
    relationships:
    - rel_type: implements
      spec_id: VP-02-002
    - rel_type: implements
      spec_id: VP-02-003
    - rel_type: implements
      spec_id: VP-03-001
    - rel_type: implements
      spec_id: VP-13-005
  - id: CM-04-002
    priority: MUST
    kind: protocol
    statement: Handlers processing VFD state transitions MUST update `ParticipantStatus.vfd_state` for the sending actor's
      CaseParticipant
  - id: CM-04-003
    priority: MUST
    kind: protocol
    statement: 'Handlers processing EM state transitions MUST update the appropriate EM state field based on who is accepting
      and the current state:'
    relationships:
    - rel_type: implements
      spec_id: VP-06-001
    - rel_type: implements
      spec_id: VP-09-001
    - rel_type: implements
      spec_id: VP-11-001
    - rel_type: implements
      spec_id: VP-11-002
    - rel_type: implements
      spec_id: VP-14-001
    - rel_type: implements
      spec_id: VP-14-002
    - rel_type: depends_on
      spec_id: CM-03-008
  - id: CM-04-004
    priority: MUST
    kind: protocol
    statement: Handlers processing PXA state transitions (public disclosure, exploit publication, attack observation) MUST
      update `CaseStatus.pxa_state`
    relationships:
    - rel_type: implements
      spec_id: VP-03-002
    - rel_type: implements
      spec_id: VP-14-003
    - rel_type: implements
      spec_id: VP-14-004
  - id: CM-04-005
    priority: MUST
    kind: protocol
    statement: Handlers that implement VFD or PXA transitions MUST validate the requested transition against the authoritative
      current state before persisting it
  - id: CM-04-006
    priority: MUST_NOT
    kind: protocol
    statement: State transition handlers MUST NOT mix participant-specific and participant-agnostic state updates incorrectly
    relationships:
    - rel_type: implements
      spec_id: VP-13-009
    - rel_type: depends_on
      spec_id: CM-03-008
  - id: CM-04-007
    priority: MUST
    kind: protocol
    statement: RM transition validation MUST treat `RM.CLOSED` as terminal before applying any same-state no-op shortcut.
      A repeated `CLOSED -> CLOSED` update MUST be treated as a terminal no-op that does not append new participant status
      records, trigger broadcast, or create new case-ledger entries.
    rationale: Checking equality first can let duplicate close retries flow into downstream append/broadcast paths as fresh
      state changes.
- id: CM-05
  title: Object Model Relationships
  specs:
  - id: CM-05-001
    priority: MUST
    kind: protocol
    statement: 'The system MUST distinguish the following domain objects as separate, non-interchangeable types:'
  - id: CM-05-002
    priority: MUST_NOT
    kind: protocol
    statement: A `VulnerabilityCase` MUST reference at least one `VulnerabilityReport`; a case with zero reports MUST NOT
      exist
    relationships:
    - rel_type: implements
      spec_id: VP-02-015
    - rel_type: implements
      spec_id: VP-02-020
  - id: CM-05-003
    priority: SHOULD
    kind: protocol
    statement: A `VulnerabilityCase` SHOULD reference at least one `VulnerabilityRecord` before closure; cases with no associated
      record at closure SHOULD log a warning
  - id: CM-05-004
    priority: MAY
    kind: protocol
    statement: A `VulnerabilityCase` MAY have zero or more associated `CaseReference` objects
  - id: CM-05-005
    priority: MUST
    kind: protocol
    statement: '`CaseReference` objects MUST include at minimum a `url` field; SHOULD include a `name` field (human-readable
      title); MAY include a `tags` field (array of one or more type descriptors, e.g., `"patch"`, `"vendor-advisory"`, `"third-party-advisory"`,
      `"exploit"`, `"release-notes"`)'
  - id: CM-05-006
    priority: MAY
    kind: protocol
    statement: One report MAY describe multiple vulnerabilities; one case MAY group multiple reports (e.g., when overlapping
      participants are involved)
  - id: CM-05-007
    priority: MAY
    kind: protocol
    statement: Multiple `CaseReference` objects MAY arise from a single case (e.g., coordinated simultaneous disclosure by
      multiple vendors)
  - id: CM-05-008
    priority: MUST_NOT
    kind: protocol
    statement: '`VulnerabilityRecord` identifiers MUST be treated as opaque strings; the system MUST NOT restrict identifier
      values to CVE ID format or any other specific namespace'
    rationale: Different organizations use different identifier namespaces (CVE, CERT/CC VU#, vendor-assigned IDs, etc.);
      requiring a specific format excludes valid records and prevents multi-namespace support
  - id: CM-05-009
    priority: SHOULD
    kind: protocol
    statement: A `VulnerabilityRecord` SHOULD support a list of alias identifiers from different namespaces for the same vulnerability
    rationale: Multiple IDs from different namespaces may refer to the same underlying vulnerability (e.g., a CVE ID and a
      CERT/CC VU# ID)
  - id: CM-05-010
    priority: MUST
    kind: protocol
    statement: When a `VulnerabilityRecord` is a `CVERecord` (i.e., it carries a CVE ID), its data MUST conform to the CVE
      JSON schema (<https://github.com/CVEProject/cve-schema>)
- id: CM-06
  title: Case Update Broadcast
  specs:
  - id: CM-06-001
    priority: MUST
    kind: protocol
    statement: When the CaseActor updates canonical case state, it MUST notify all current case participants
    relationships:
    - rel_type: implements
      spec_id: VP-02-019
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: implements
      spec_id: VP-08-001
  - id: CM-06-002
    priority: MUST
    kind: protocol
    statement: Participants receiving a case update notification MUST treat the update as authoritative only when it originates
      from the CaseActor
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
  - id: CM-06-003
    priority: MUST
    kind: protocol
    statement: Case update notifications MUST include the updated CaseActor URL so participants can fetch the current case
      state if needed
    scope:
    - production
  - id: CM-06-004
    priority: MUST
    kind: protocol
    statement: Participants MUST authenticate case update notifications before accepting them as authoritative
    scope:
    - production
  - id: CM-06-005
    priority: MUST
    kind: protocol
    statement: When a note is added to a case, the CaseActor MUST broadcast the note to all case participants (excluding the
      note author)
    relationships:
    - rel_type: depends_on
      spec_id: OX-03-001
    - rel_type: depends_on
      spec_id: CM-02-001
- id: CM-07
  title: CVD Action Rules API
  specs:
  - id: CM-07-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD expose an endpoint that returns the set of valid actions available to a case participant
      given the current case state and their role
    relationships:
    - rel_type: refines
      spec_id: AR-07-001
    - rel_type: refines
      spec_id: AR-07-002
  - id: CM-07-002
    priority: MUST
    kind: protocol
    statement: The action rules response MUST include the participant's role and the current RM, EM, CS, and VFD states relevant
      to that participant
  - id: CM-07-003
    priority: MUST
    kind: protocol
    statement: The action rules response MUST list valid next actions as structured objects including the action name and
      any required parameters
- id: CM-08
  title: Domain Model Architecture
  specs:
  - id: CM-08-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD maintain a clear separation between the wire representation, domain model, and persistence
      model for CVD objects
  - id: CM-08-002
    priority: MUST_NOT
    kind: protocol
    statement: Domain objects MUST NOT directly inherit from ActivityStreams base types; explicit `from_core()` / `to_core()`
      translation methods MUST be provided at the wire boundary (see `specs/architecture.yaml` ARCH-12-001 through ARCH-12-007
      and `notes/domain-model-separation.md`)
- id: CM-09
  title: Redacted Case View
  specs:
  - id: CM-09-001
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD support a `RedactedVulnerabilityCase` type for sharing case information with invited-but-not-yet-accepted
      participants
    scope:
    - production
  - id: CM-09-002
    priority: MUST
    kind: protocol
    statement: The ID of a `RedactedVulnerabilityCase` MUST be cryptographically unrelated to the full `VulnerabilityCase`
      ID
    rationale: Prevents an attacker who obtains a redacted case ID from inferring the full case ID
    scope:
    - production
  - id: CM-09-003
    priority: MUST
    kind: protocol
    statement: Each invitee MUST receive a distinct `RedactedVulnerabilityCase` ID
    rationale: Prevents cross-correlation of redacted IDs to infer participant list size or identities
    scope:
    - production
  - id: CM-09-004
    priority: MAY
    kind: protocol
    statement: For the prototype, the `Invite` activity MAY reference the case by full case ID only, deferring the redacted
      view to a later phase
- id: CM-10
  title: Per-Participant Embargo Acceptance
  specs:
  - id: CM-10-001
    priority: MUST
    kind: protocol
    statement: '`CaseParticipant` MUST track which embargo(es) a participant has explicitly accepted'
    relationships:
    - rel_type: implements
      spec_id: VP-05-001
  - id: CM-10-002
    priority: MUST
    kind: protocol
    statement: Embargo acceptances MUST be timestamped by the CaseActor at the time of receipt, not using the participant's
      claimed timestamp
    rationale: The CaseActor applies the only trusted timestamp; the participant's reported time cannot be verified
    relationships:
    - rel_type: depends_on
      spec_id: CM-02-002
    - rel_type: implements
      spec_id: CM-02-009
  - id: CM-10-003
    priority: SHOULD
    kind: protocol
    statement: 'The `CaseParticipant` model SHOULD include an `accepted_embargo_ids: list[str]` field recording the IDs of
      `EmbargoEvent` objects the participant has explicitly accepted'
  - id: CM-10-004
    priority: MUST
    kind: protocol
    statement: Before sharing case updates with a participant, the system MUST verify that the participant has accepted the
      current active embargo
- id: CM-11
  title: Invitation Acceptance Lifecycle
  specs:
  - id: CM-11-001
    priority: MUST
    kind: protocol
    statement: >-
      When an actor accepts a case invitation, the CaseActor MUST record the accepting actor's
      RM state as RM.RECEIVED — not RM.ACCEPTED. `Accept(Invite)` signals willingness to join
      the case and, when an active embargo is in scope, consent to the embargo. It does NOT
      constitute validation of the vulnerability report. The accepting actor has received only
      a case stub at that point and has not yet seen the full case (report details, vulnerability
      description, etc.). The full VALID/INVALID and ACCEPTED/DEFERRED triage cycle is a
      distinct subsequent step that the invitee runs after the case replica has been replicated
      to them.
    note: >-
      This corrects the prior statement ("MUST advance to ACCEPTED"), which conflated two
      distinct protocol acts: joining the case and validating its content. The correction
      applies only to post-initialization invitees — the initial reporter and receiver
      participants are established during case creation at their correct RM states.
    rationale: >-
      An actor who accepts an invitation has seen only a redacted or stub view of the
      `VulnerabilityCase`. Recording them at RM.ACCEPTED before they have reviewed the
      full case violates the RM state machine semantics (a participant cannot accept what
      they have not seen). The `Accept(Invite)` message means "I am willing to participate
      and I accept the embargo terms"; it does not mean "I have validated the vulnerability
      and committed to remediation." Only after the full case replica is delivered and the
      invitee has run their triage cycle (RECEIVED → VALID or INVALID → ACCEPTED or DEFERRED)
      should their RM state advance past RECEIVED.
    relationships:
    - rel_type: implements
      spec_id: VP-03-012
    - rel_type: depends_on
      spec_id: CM-03-001
  - id: CM-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      After accepting a case invitation and receiving the full case replica, the accepting
      actor SHOULD run the standard RM triage cycle: validating the reported vulnerability
      (RM.VALID or RM.INVALID), then deciding to engage or defer (RM.ACCEPTED or RM.DEFERRED).
      Each transition SHOULD be communicated to the CaseActor via the appropriate RM status
      message so the CaseActor can update its representation of the invitee's RM state.
    note: Prior text read "After auto-engagement (CM-11-001), the accepting actor SHOULD emit an RmEngageCaseActivity
      to notify the case owner." That text assumed CM-11-001 advanced the state to ACCEPTED;
      under the corrected CM-11-001 the engagement notification is part of the triage cycle
      described here.
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
    - rel_type: depends_on
      spec_id: CM-11-001
  - id: CM-11-004
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST NOT treat an invited participant as having committed to the case
      (RM.ACCEPTED) until it receives the corresponding RM status message from the invitee
      confirming that state transition.
    rationale: >-
      Only the invitee can confirm they have validated the vulnerability and chosen to
      engage. The CaseActor cannot infer acceptance from the `Accept(Invite)` alone
      because at that point the invitee has not yet received the full case content.
    relationships:
    - rel_type: depends_on
      spec_id: CM-11-001
  - id: CM-11-003
    priority: MUST
    kind: protocol
    statement: >-
      When processing a `Reject(Invite(actor, case))` activity, the use case MUST resolve
      `case_id` from the nested Invite's `target` field (`inner_target_id`) rather than from
      the top-level `target` of the Reject activity; the top-level `target` is not populated
      by `extract_event` for this activity pattern and will always be `None`.
    note: >-
      `Accept(Invite(actor, case))` follows the same nesting — `AcceptInviteActorToCaseReceivedEvent`
      already exposes a `case_id` property as `inner_target_id`. The symmetric property must
      be present on `RejectInviteActorToCaseReceivedEvent` and used in
      `RejectInviteActorToCaseReceivedUseCase.execute()`. Failure to read `inner_target_id`
      causes the use case to early-return without committing the canonical `CaseLedgerEntry`
      for the rejection (pre-existing gap introduced in #1293, documented in #1747).
    rationale: >-
      The `Reject(Invite(actor, case))` wire activity wraps the Invite as its `object_`; the
      case reference is therefore on `object_.target`, which `extract_event` maps to
      `inner_target`. There is no top-level `target` on the Reject itself.
- id: CM-12
  title: Case Creation Timing
  specs:
  - id: CM-12-001
    priority: MUST
    kind: protocol
    statement: A `VulnerabilityCase` MUST be created when an `Offer(Report)` activity is received by the vendor actor
    note: >-
      Superseded by CM-22-001 (ADR-0041): the vendor actor MUST NOT create the
      `VulnerabilityCase` directly.  The vendor stores the report and waits for
      `Create(VulnerabilityCase)` from the CaseActor.  CM-12-001 applies only in
      single-actor deployments where the vendor IS the CaseActor.
    relationships:
    - rel_type: supersedes
      spec_id: CM-22-001
      note: CM-22-001 (ADR-0041) is the authoritative replacement for multi-actor deployments
  - id: CM-12-002
    priority: MUST
    kind: protocol
    statement: At case creation, the system MUST create two initial `VultronParticipant` records in the order defined by CM-14-001
    relationships:
    - rel_type: depends_on
      spec_id: CM-03-001
    - rel_type: depends_on
      spec_id: CM-02-008
    - rel_type: part_of
      spec_id: CM-14-001
  - id: CM-12-003
    priority: MUST
    kind: protocol
    statement: When a case is created from an `Offer(Report)`, the case owner MUST queue a `Create(Case)` activity to notify
      the reporter that a case has been opened
    relationships:
    - rel_type: depends_on
      spec_id: OX-02-001
  - id: CM-12-004
    priority: MUST
    kind: protocol
    statement: If a default embargo policy is configured, a default embargo MUST be initialized at case creation (RM.RECEIVED)
      following the sequence in CM-14-001
    relationships:
    - rel_type: refines
      spec_id: DUR-07-002
      note: which now applies at case receipt
    - rel_type: part_of
      spec_id: CM-14-001
  - id: CM-12-005
    priority: MUST
    kind: protocol
    statement: '`InvalidateReportReceivedUseCase`, `CloseReportReceivedUseCase`, and `ValidateReportReceivedUseCase` MUST
      dereference the incoming report ID to the associated case ID before delegating to the corresponding case-level use case'
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
- id: CM-13
  title: Embargo Acceptance Ownership
  specs:
  - id: CM-13-001
    priority: MUST
    kind: protocol
    statement: When processing an `Accept(Invite(EmbargoEvent))` or embargo-accept trigger, the handler MUST determine whether
      the accepting actor is the case owner (`VulnerabilityCase.attributed_to == actor_id`) and apply the correct state transitions
      accordingly
    rationale: The case owner's acceptance is the authoritative signal for advancing the shared EM state. Non-owner participants
      update only their own consent state.
  - id: CM-13-002
    priority: MUST
    kind: protocol
    statement: If the accepting actor is the case owner, the handler MUST transition the shared `CaseStatus.em_state` to `ACTIVE`
  - id: CM-13-003
    priority: MUST
    kind: protocol
    statement: If the accepting actor is NOT the case owner, the handler MUST update only that participant's own `ParticipantStatus.embargo_adherence`
      consent state to `SIGNATORY`; it MUST NOT advance the shared EM state
    rationale: Non-owner participants do not hold a pocket veto; their individual acceptance does not constitute case-level
      embargo activation
  - id: CM-13-004
    priority: MUST
    kind: protocol
    statement: If `VulnerabilityCase.attributed_to` is `None` (legacy or single-actor case), the handler MUST treat the triggering
      actor as the case owner for the purposes of EM state transitions
    rationale: Backward compatibility with cases created before the `attributed_to` field was introduced; prevents single-actor
      embargo triggers from silently failing
  - id: CM-13-005
    priority: MUST
    kind: protocol
    statement: 'Embargo accept/reject handlers MUST be idempotent: if the participant''s consent state is already `SIGNATORY`
      (for accept) or `DECLINED` (for reject), the handler MUST succeed silently without re-running state machine transitions
      or emitting invalid-transition warnings'
  - id: CM-13-006
    priority: MUST
    kind: project
    statement: When a case is created with a default embargo that reaches `EM.ACTIVE` at creation time, the case owner MUST
      be initialized as a `SIGNATORY` in the same BT node or an immediately following sibling node in the same BT subtree
    rationale: The case creator is the case owner by default; seeding them as a signatory prevents the case owner from being
      locked out of their own active embargo until a separate accept step occurs. The consent state must be set via the PEC
      state machine (not by direct field assignment) to preserve state machine invariants.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-004
  - id: CM-13-007
    priority: MUST
    kind: protocol
    statement: Note attachment idempotency MUST be checked by testing whether the note's `id_` is present in `VulnerabilityCase.notes`,
      NOT by testing whether the note object exists in the DataLayer
    rationale: A note may be stored in the DataLayer by one path and never attached to `case.notes` by another path. Checking
      DataLayer existence produces false idempotency.
  - id: CM-13-008
    priority: MUST
    kind: protocol
    statement: When reusing an existing report-phase `ParticipantStatus` record on embargo accept/reject retries, handlers
      MUST preserve a non-null existing consent value and MUST NOT overwrite it with the default `NO_EMBARGO` value.
    rationale: Retry/idempotent paths must not silently downgrade previously established consent snapshots.
- id: CM-14
  title: Case Initialization Sequence
  description: Defines the canonical ordered sequence of initialization steps that MUST occur when a VulnerabilityCase is
    created at Offer(Report) receipt (CM-12-001). All steps MUST complete before the case is considered fully initialized.
  specs:
  - id: CM-14-001
    priority: MUST
    kind: protocol
    statement: 'The case initialization sequence MUST execute in the following order: (1) create the `VulnerabilityCase` with
      the receiving actor set as `attributed_to`; (2) create the case-owner `VultronParticipant` (RM.RECEIVED, `CVDRole.CASE_OWNER`);
      (3) initialize the default embargo to `EM.ACTIVE` and seed the case owner as `SIGNATORY`, if a default embargo policy
      is configured; (4) queue a `Create(Case)` activity addressed to the reporter and flush the outbox; (5) add the reporter
      as a `VultronParticipant` (RM.ACCEPTED, `CVDRole.FINDER`/`REPORTER`) and seed them as `SIGNATORY` on any active embargo;
      (6) commit a case ledger entry (triggering `Announce(CaseLedgerEntry)` fan-out to all participants).'
    rationale: Step 2 precedes step 3 so that the embargo is always created by a participant (the case owner). The Create(Case)
      notification in step 4 is flushed before the reporter is added in step 5 so the reporter's system receives the case
      object before any subsequent Announce(CaseLedgerEntry) fan-out that references it.
    note: >-
      Superseded by CM-22 (ADR-0041) for multi-actor deployments: in the
      CaseActor-authoritative model the `VulnerabilityCase` is created by the
      CaseActor (not the receiving vendor), so `attributed_to` is the CaseActor's
      actor ID, not the receiving actor's.  CM-14-001 applies only in single-actor
      deployments where the vendor IS the CaseActor.
    relationships:
    - rel_type: depends_on
      spec_id: CM-12-001
    - rel_type: refines
      spec_id: CM-12-002
    - rel_type: refines
      spec_id: CM-12-004
    - rel_type: supersedes
      spec_id: CM-22-001
      note: CM-22-001 (ADR-0041) replaces the attributed_to=receiving_actor semantics for multi-actor deployments
  - id: CM-14-002
    priority: MUST
    kind: protocol
    statement: The case-owner `VultronParticipant` MUST be created before the default embargo is initialized, so that the
      embargo is always associated with an existing participant
    rationale: An embargo without any participant lacks an owning actor. Creating the owner participant first ensures that
      the embargo is initialized in the context of an actor who can be responsible for it.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
  - id: CM-14-003
    priority: MUST
    kind: protocol
    statement: When the case initialization sequence creates a default embargo, the case owner MUST be seeded as `SIGNATORY`
      on that embargo immediately after the embargo reaches `EM.ACTIVE` state
    rationale: The case owner initiated the embargo by accepting the default policy on behalf of the case. Requiring a separate
      accept step would leave the case owner as a non-signatory on their own active embargo.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: refines
      spec_id: CM-13-006
  - id: CM-14-004
    priority: MUST
    kind: protocol
    statement: The `Create(Case)` notification MUST be queued and the outbox flushed before the reporter is added as a `VultronParticipant`
      in step 5 of CM-14-001
    rationale: The reporter's system must receive and store the case object before any Announce(CaseLedgerEntry) fan-out that
      lists them as a participant. Reversing this order causes "case not found" errors on the reporter side when the log entry
      arrives referencing a case the reporter has not yet seen.
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-003
  - id: CM-14-005
    priority: MUST
    kind: protocol
    statement: When the reporter is added as a `VultronParticipant` during case initialization, they MUST be seeded as `SIGNATORY`
      on any active embargo
    rationale: 'The reporter already possesses the vulnerability information before the case is created. Requiring an explicit
      embargo acceptance before sharing case content would create a paradoxical deadlock: the reporter has the information
      that the embargo is meant to protect, yet cannot receive case updates until they accept the embargo. Seeding them as
      SIGNATORY reflects their implicit consent, expressed by submitting the report.'
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
  - id: CM-14-006
    priority: SHOULD
    kind: protocol
    statement: If the reporter included an embargo proposal with their `Offer(Report)`, the case initialization SHOULD reconcile
      the reporter's proposed duration against the receiver's default embargo policy and initialize the embargo at the shorter
      of the two durations
    note: 'No wire-format mechanism currently exists for a reporter to include an embargo proposal in an `Offer(Report)`.
      This requirement is forward-looking and cannot be exercised until that mechanism is implemented. See notes/embargo-default-semantics.md
      "Known Gap: No Reporter Embargo Proposal Mechanism" and specs/embargo-policy.yaml EP-04-003.'
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
    - rel_type: depends_on
      spec_id: CM-12-004
  - id: CM-14-007
    priority: MUST
    kind: protocol
    statement: Additional participants MUST NOT be invited and embargo modifications MUST NOT be initiated until the case
      initialization sequence defined in CM-14-001 (including any applicable conditional steps) is complete
    rationale: 'The initialization sequence establishes the minimum valid case state: a case object, an owner, an optional
      embargo, and a reporter. Inviting third parties or modifying the embargo before this baseline is in place creates race
      conditions and protocol violations.'
    relationships:
    - rel_type: depends_on
      spec_id: CM-14-001
- id: CM-15
  title: Case Creation Policy
  description: Requirements for the configurable auto_create_case policy on ActorConfig, which controls whether a VulnerabilityCase
    is created automatically upon receipt of an Offer(Report).
  specs:
  - id: CM-15-001
    priority: MUST
    kind: protocol
    statement: 'ActorConfig MUST expose an `auto_create_case` boolean field (default: True). When a receiver''s auto_create_case
      is False, processing an inbound Offer(Report) MUST store the VulnerabilityReport and the Offer(Report) activity but
      MUST NOT create a VulnerabilityCase and MUST leave the receiver''s outbox unchanged. The gate MAY be enforced either
      as a routing-level short-circuit in SubmitReportReceivedUseCase or as an in-tree condition node at the root of create_receive_report_case_tree;
      the observable outcome (no case, no outbound activities) is what is normative, not the enforcement location.'
    rationale: Receivers that follow the Option 3 protocol path (send Read(Offer(Report)) before deciding to accept or reject)
      require the ability to delay case creation. The default (True) preserves the original ADR-0015 Option 4 "always create
      at RM.RECEIVED" behavior for all existing actors and demos. Case creation is protocol-significant behavior (BT-15-001),
      so the canonical gate lives in the behavior tree as a condition node; the use-case short-circuit is an equivalent optimization
      that avoids invoking the BT for a decision already known at dispatch time. Either placement yields the same observable
      outcome, so the requirement is specified in terms of behavior rather than call path.
    relationships:
    - rel_type: refines
      spec_id: CM-12-001
    adr:
    - ADR-0015
- id: CM-16
  title: Actor Suggestion Routing (Recommend-Actor Flow)
  specs:
  - id: CM-16-001
    priority: MUST
    kind: protocol
    statement: A participant wishing to suggest that another actor be invited to the case MUST send `Offer(object=Actor, target=Case)`
      to the CaseActor's inbox, not directly to the Case Owner's inbox.
    rationale: All case-scoped protocol messages MUST route through the CaseActor so the event can be recorded in the canonical
      case ledger before any downstream action is taken (ADR-0021, PCR-08-001).
    relationships:
    - rel_type: implements
      spec_id: PCR-08-001
    adr:
    - ADR-0021
  - id: CM-16-002
    priority: MUST
    kind: protocol
    statement: When the CaseActor receives `Offer(object=Actor, target=Case)`, it MUST commit a `CaseLedgerEntry` for the
      received Offer and fan out the entry to all participants BEFORE taking any downstream action.
    rationale: Ledger entries record events that have already occurred; pre-committing a decision before communicating it
      is not permitted (CLP-10-006 commit ordering).
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
  - id: CM-16-003
    priority: MUST
    kind: project
    statement: 'After recording the received `Offer(Actor)`, the CaseActor MUST assign a non-empty default role list for the
      suggested actor via an Evaluator BT node (ADR-0024 shape: Evaluator). The Evaluator MUST return FAILURE if it cannot
      produce a non-empty role list; the downstream consumer node MUST NOT silently substitute a default for an empty list
      written by the Evaluator (ADR-0032 BT-HELPER-01).'
    note: 'The Evaluator node is a call-out point (ADR-0025 abstraction; ADR-0024 shape: Evaluator) that MAY be replaced by
      a more sophisticated role-inference implementation in future. The non-empty invariant is enforced at write time so the
      downstream consumer never needs to treat an empty list as a sentinel. See CM-16-011 and CM-16-012 for the recommended
      and permitted default values.'
  - id: CM-16-011
    priority: SHOULD
    kind: protocol
    statement: The default role list SHOULD be `[CVDRole.VENDOR]` for actors whose type cannot be determined from context,
      because in CVD cases the most likely role for a newly added participant is Vendor.
  - id: CM-16-012
    priority: MAY
    kind: protocol
    statement: The default role list MAY be `[CVDRole.OTHER]` when the Evaluator can determine that the suggested actor does
      not fit any known CVD role but still requires case membership (e.g., a security researcher with no vendor affiliation).
      `CVDRole.OTHER` is the most conservative choice because it makes no assumption about the actor's function in the CVD
      process.
  - id: CM-16-013
    priority: MAY
    kind: protocol
    statement: The Evaluator's default role assignment MAY be overridden by actor-level configuration (e.g., a policy that
      maps known actor URIs to specific roles) or by the Case Owner at accept time when the Case Owner selects different roles
      for the suggested participant.
    rationale: The Case Owner has ultimate authority over who participates in their case and in what role. The Evaluator's
      output is a suggested starting point to reduce friction, not a binding decision. The Case Owner can always update role
      assignments to whatever they determine is appropriate.
  - id: CM-16-004
    priority: MUST
    kind: protocol
    statement: The CaseActor MUST transform the received `Offer(Actor)` into `Offer(object=CaseParticipant{attributed_to=actor,
      case_roles=roles}, target=Case)` and send it to the Case Owner's inbox, with `origin` set to the ID of the original
      recommender's Offer activity.
    rationale: The Case Owner makes a membership decision about a CaseParticipant (actor + roles), not about a bare Actor
      identity. The `origin` field preserves the causal chain without a side-channel data store.
  - id: CM-16-005
    priority: MAY
    kind: protocol
    statement: The recommender's `Offer(Actor)` MAY include a `content` or `summary` field explaining why the actor is being
      suggested. The CaseActor SHOULD forward this text as the `content` of the transformed `Offer(CaseParticipant)` it sends
      to the Case Owner.
  - id: CM-16-006
    priority: MUST
    kind: protocol
    statement: After receiving `Accept(Offer(CaseParticipant))` from the Case Owner, the CaseActor MUST (1) commit a ledger
      entry for the Accept, (2) fan out the ledger entry, (3) send `AcceptActorRecommendation` to the original recommender
      with `in_reply_to` set to the ID of the original recommender's `Offer` activity, and (4) send `Invite(CaseStub[+embargo])`
      to the suggested actor per CM-17.
    relationships:
    - rel_type: implements
      spec_id: CM-17-001
  - id: CM-16-007
    priority: MUST
    kind: protocol
    statement: After receiving `Reject(Offer(CaseParticipant))` from the Case Owner, the CaseActor MUST (1) commit a ledger
      entry for the Reject, (2) fan out the ledger entry, and (3) send `RejectActorRecommendation` to the original recommender
      with `in_reply_to` set to the ID of the original recommender's `Offer` activity.
  - id: CM-16-008
    priority: MUST
    kind: protocol
    statement: When a second `Offer(Actor X, Case)` arrives while a pending decision for Actor X is still outstanding (no
      Accept or Reject yet received from the Case Owner), the CaseActor MUST record the duplicate recommendation in the ledger
      and MUST send a `Note` to the Case Owner's inbox indicating that a reinforcing suggestion was received, including the
      second recommender's identity and any `content` from the Offer. The CaseActor MUST NOT send a second transformed Offer
      to the Case Owner.
  - id: CM-16-009
    priority: MUST
    kind: protocol
    statement: When a second `Offer(Actor X, Case)` arrives after an Invite has already been sent to Actor X (i.e., the invite
      is in-flight or the actor is already a participant), the CaseActor MUST record the recommendation in the ledger, fan
      out the entry, and auto-send `AcceptActorRecommendation` (with `in_reply_to` = original recommender's Offer ID) back
      to the second recommender. The CaseActor MUST NOT send a duplicate Invite to Actor X.
  - id: CM-16-010
    priority: MUST
    kind: protocol
    statement: In every step of the actor suggestion flow, the CaseActor MUST commit the ledger entry for a protocol event
      AFTER the corresponding message has been sent or received, never before.
    rationale: Pre-announcing a decision in the ledger before communicating the decision creates a window where the ledger
      shows an effect without its cause.
- id: CM-17
  title: Invitation Flow — Enrichment and Roles
  specs:
  - id: CM-17-001
    priority: MUST
    kind: protocol
    statement: The `Invite` activity sent by the CaseActor to a new actor MUST include a case stub as the `object`, with the
      case stub containing at minimum the case ID and type. This requirement is extended by CM-17-002 and CM-17-003.
  - id: CM-17-002
    priority: MUST
    kind: protocol
    statement: When `CaseStatus.em_state == ACTIVE` at the time the Invite is sent, the case stub MUST include at minimum
      the `activeEmbargo` reference (ID + `end_time`) and the embedded `CaseStatus.em_state` field so the invitee can give
      informed consent before accepting.
    rationale: 'The invite-accept cycle is the only consent signal for late-joining participants when an active embargo already
      exists. Accepting without seeing embargo terms is not meaningfully informed consent (issue #1289, MV-10-006).'
    relationships:
    - rel_type: implements
      spec_id: MV-10-006
  - id: CM-17-003
    priority: MUST
    kind: project
    statement: 'The `Invite` activity MUST embed the intended `case_roles: list[CVDRole]` for the invitee. Roles reach `EmitInviteActorToCaseNode`
      via the blackboard key ``suggested_roles`` (flat, unnamespaced). There are two distinct source paths: (1) **Direct-trigger
      path** — the Case Owner explicitly calls `invite-actor-to-case` with a `roles` list; `SvcInviteActorToCaseUseCase` writes
      that list to ``suggested_roles`` via `_extra_execute_kwargs()` before BT execution. (2) **Suggest-actor received path**
      — the CaseActor receives `Accept(Offer(CaseParticipant))`; `AcceptOfferCaseParticipantReceivedUseCase` does NOT write
      ``suggested_roles``; the `Invite` is emitted with `roles=None` and the invitee''s `CaseParticipant.case_roles` is populated
      on `Accept(Invite)` by reading roles from the persisted Invite wire object (CM-17-004). In the suggest-actor path, roles
      originate from the Case Owner''s Accept response (CM-16-006) or the CaseActor''s default role assignment (CM-16-003).'
    rationale: 'All invited participants getting `caseRoles=[]` is a protocol defect (issue #1288). The participant record
      created on `Accept(Invite)` MUST reflect the roles the Case Owner intended, whether those roles arrived via a direct
      trigger request or via the suggest-actor round-trip.'
  - id: CM-17-004
    priority: MUST
    kind: protocol
    statement: When the CaseActor receives `Accept(Invite)` from the invitee, it MUST (1) commit a ledger entry for the Accept,
      (2) fan out the ledger entry to ALL existing participants, (3) create a `CaseParticipant` record for the invitee at
      `RM.RECEIVED` with the roles from the Invite, (4) sign embargo consent if `em_state == EM.ACTIVE` (CM-10-001), (5) send
      `Announce(VulnerabilityCase)` with the current full case snapshot to the invitee, and (6) backfill all prior `CaseLedgerEntry`
      records to the invitee in log-index order.
    note: >-
      Step (3) previously read `RM.ACCEPTED`. That contradicted CM-11-001, which requires the CaseActor to record
      `RM.RECEIVED` on `Accept(Invite)` — `Accept(Invite)` signals willingness to join, not validation of the report.
      The implementation follows CM-11-001 (`CreateInviteeParticipantAtReceivedNode` in
      `vultron/core/behaviors/case/accept_invite_tree.py`); this text was not updated when CM-11-001 was corrected.
      The ordering of steps (3), (4), and (5) is load-bearing: the gate on full case delivery is admission to the
      case plus embargo consent, NOT completion of RM triage. The invitee is created at `RM.RECEIVED` (3), embargo
      consent is signed if an embargo is active (4), and only then is the full case snapshot sent (5). See MV-10-005
      as corrected, and MV-10-006 for the accept-implies-consent rule.
    relationships:
    - rel_type: implements
      spec_id: CM-11-001
    - rel_type: implements
      spec_id: CM-10-001
    - rel_type: implements
      spec_id: PCR-08-010
  - id: CM-17-005
    priority: MUST_NOT
    kind: protocol
    statement: The invitee MUST NOT appear in the case participant list until their `Accept(Invite)` has been received and
      processed by the CaseActor. A pending invitation (Invite sent, no response yet) is tracked only as a ledger entry, not
      as a participant record.
    rationale: A participant record implies an active RM state (`RM.RECEIVED` per CM-17-004) and the associated permissions.
      Creating one before the invitee has consented would grant protocol access prematurely.
  - id: CM-17-006
    priority: MUST
    kind: protocol
    statement: The CaseActor MUST commit a `CaseLedgerEntry` for the emitted `Invite` activity (recording the fact of its
      emission) AFTER the Invite has been queued for delivery to the invitee. The commit MUST NOT precede the emission.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-006
- id: CM-18
  title: Participant Embargo Consent State Machine
  specs:
  - id: CM-18-001
    priority: MUST
    kind: protocol
    statement: 'Each participant''s embargo consent MUST be tracked as a `ParticipantEmbargoConsent` (PEC) value with five
      possible states: `NO_EMBARGO` (no embargo is in scope for this participant), `INVITED` (invite sent, awaiting response),
      `SIGNATORY` (accepted the current terms), `LAPSED` (was `SIGNATORY`; the case embargo entered `REVISE`, so prior consent
      no longer covers the revised terms), and `DECLINED` (explicitly refused, or timed out without responding).'
    rationale: 'The five-state PEC machine formalizes the "pocket veto" mechanism: a participant who is invited but never
      responds is recorded as `DECLINED` when the timer fires, rather than blocking progress indefinitely.
      Source: `notes/participant-embargo-consent.md`.
      `LAPSED` is NOT the timer path — it is reached only from `SIGNATORY` via the `REVISE` trigger (CM-18-002, CM-18-003).
      Confusing `LAPSED` with the pocket-veto timeout is a known documentation pitfall; both timer paths
      (`INVITED → DECLINED`, `LAPSED → DECLINED`) terminate in `DECLINED`.
      Per ADR-0048, `NO_EMBARGO` denotes the *absence of an embargo in scope*, not a "not yet consented" pre-consent state:
      it is correct for a participant in a case with `EM.NONE`, and it is the `RESET` destination when an embargo is
      terminated. It MUST NOT be read as implying that consent is pending or that an invitation is owed.'
    adr:
    - ADR-0048
  - id: CM-18-002
    priority: MUST
    kind: protocol
    statement: 'The `INVITED → DECLINED` and `LAPSED → DECLINED` transitions MAY be driven by a timer expiry (pocket veto)
      rather than requiring an explicit participant action. The timer period SHOULD be a configurable policy window (default:
      7 days). The pocket veto materialises when the timer fires without a prior acceptance; the system records the transition
      to `DECLINED` as if the participant had declined. The `SIGNATORY → LAPSED` transition is NOT timer-based: it fires when
      the embargo enters the `REVISE` state, invalidating prior consent for the new terms.'
    rationale: 'Per `notes/participant-embargo-consent.md`: `LAPSED` means "embargo terms changed; prior consent no longer
      applies." `DECLINED` includes both explicit refusals and timeout-based implicit refusals. Confusing `LAPSED` with the
      timer path is a known documentation pitfall.'
  - id: CM-18-003
    priority: MUST
    kind: project
    statement: 'The valid PEC state transitions are: `NO_EMBARGO | LAPSED | DECLINED → INVITED` (INVITE trigger); `NO_EMBARGO
      | INVITED | LAPSED → SIGNATORY` (ACCEPT trigger); `NO_EMBARGO | INVITED | LAPSED → DECLINED` (DECLINE trigger);
      `SIGNATORY → LAPSED` (REVISE trigger); and `* → NO_EMBARGO` (RESET trigger, embargo terminated). Any other transition
      MUST be rejected as a protocol error.'
    rationale: 'The `LAPSED` and `DECLINED` states are not terminal: a participant who lapsed or declined can be re-invited
      (e.g., when embargo terms change). `SIGNATORY → LAPSED` occurs when the embargo enters REVISE and the participant''s
      prior consent no longer covers the revised terms. Per ADR-0048, `ACCEPT` and `DECLINE` are valid directly from
      `NO_EMBARGO`, because consent is not always mediated by an invitation: a Finder who sets the embargo on their own case
      has no inviter; participants added during case initialization already have an embargo in scope (ADR-0041); and the
      reporter''s consent is implicit in submitting the report (CM-14-005). Requiring a synthetic `INVITED` step for these
      paths would record an invitation event that never occurred. `DECLINE` is valid from `NO_EMBARGO` for symmetry, so a
      participant added to an embargoed case can refuse without a formal invitation. See
      `vultron/core/states/participant_embargo_consent.py`.'
    relationships:
    - rel_type: refines
      spec_id: CM-18-001
    adr:
    - ADR-0048
  - id: CM-18-004
    priority: MUST_NOT
    kind: protocol
    statement: A participant's PEC state MUST NOT move from `SIGNATORY` to `INVITED` directly (bypassing `LAPSED`). The only
      path back to `INVITED` from resolved states is via `LAPSED → INVITED` (after a REVISE trigger) or `DECLINED → INVITED`
      (re-invite after explicit decline). `SIGNATORY → INVITED` is not a valid transition.
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
  - id: CM-18-005
    priority: MUST
    kind: project
    statement: A participant's PEC state MUST be changed by applying a `PEC_Trigger` through `PecDimension.transition()` and
      persisting the resulting `ParticipantStatus`. Code MUST NOT set `CaseParticipant.embargo_consent_state` by direct field
      assignment as the means of recording a consent change.
    rationale: '`PecDimension.transition()` (ADR-0036, SDO-01-001) validates the trigger against the PEC machine and raises
      `VultronInvalidStateTransitionError` on an illegal transition, making consent writes fail-closed regardless of upstream
      BT guard coverage. Direct assignment to the scalar `embargo_consent_state` field bypasses both the state machine and
      `_sync_latest_status_metadata()`, so the participant''s latest `ParticipantStatus` retains its previous `consent.state`.
      Observed on `main` at ten consent-write sites: the participant reads `SIGNATORY` while the emitted ledger snapshot carries
      the self-contradictory pair `{"embargoAdherence": true, "emConsentState": "NO_EMBARGO"}`. Three of the ten assign the
      scalar field with no FSM involvement; the other seven route the trigger through `apply_pec_trigger()` and are still
      non-conforming, because validating the trigger does not persist the `ParticipantStatus`. Per ADR-0048.'
    relationships:
    - rel_type: refines
      spec_id: CM-18-003
    adr:
    - ADR-0048
  - id: CM-18-006
    priority: MUST
    kind: project
    statement: A PEC state change that is protocol-significant MUST be recorded in the canonical case ledger as an
      `Add(ParticipantStatus)` entry whose `payloadSnapshot` carries the participant's post-transition PEC value. The snapshot's
      `emConsentState` MUST agree with the participant's `embargo_consent_state`, and `embargoAdherence` MUST be `true` if and
      only if that state is `SIGNATORY`.
    rationale: 'PEC state lives on `ParticipantStatus.consent`, so `Add(ParticipantStatus)` is the correct ledger entry type
      for a consent change; no separate embargo-event entry type is needed. Requiring agreement between the snapshot and the
      participant record prevents the contradictory-snapshot defect described in CM-18-005 from reaching ledger consumers,
      which read `emConsentState` to render per-participant consent (DRPT-02-008). Per ADR-0048.'
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-005
    - rel_type: depends_on
      spec_id: CM-18-008
    adr:
    - ADR-0048
    - ADR-0056
  - id: CM-18-008
    priority: MUST
    kind: project
    statement: '`ParticipantStatus.embargo_adherence` MUST be implemented as a computed property (e.g., Pydantic `@computed_field`)
      that returns `True` if and only if `consent.state == PEC.SIGNATORY`. It MUST NOT be declared as a stored field. The wire
      projection (`as_ParticipantStatus.from_core()`) MUST derive the value from the consent state rather than copying a stored
      field.'
    rationale: >
      A stored boolean field can drift from the PEC state it is meant to project and its fail-open default (`True`)
      violates the principle that unset consent should not be treated as active consent. Making `embargo_adherence` a
      computed property eliminates the drift risk permanently and makes the fail-closed invariant unbypassable.
      Resolved by ADR-0056, closing the open question recorded in the draft specification §6.4.6.
    relationships:
    - rel_type: refines
      spec_id: CM-18-006
    adr:
    - ADR-0056
  - id: CM-18-007
    priority: MUST
    kind: project
    statement: 'The case-initialization sequence MUST establish the default embargo before fixing each participant''s PEC state,
      so that each participant''s initial `ParticipantStatus` carries its true post-initialization consent value. Case
      initialization MUST commit exactly one `add_participant_status_to_participant` ledger entry per participant: it MUST NOT
      commit a `NO_EMBARGO` placeholder entry followed by a corrective consent entry.'
    rationale: 'Because `ACCEPT` is valid directly from `NO_EMBARGO` (CM-18-003, ADR-0048), an initialization participant reaches
      its consent state in a single transition, so a placeholder entry is unnecessary. Emitting two entries per participant would
      also shift every downstream `log_index`; PR #1746 was reverted for exactly that, having broken `fvcv-extension` VFD
      replication timing. Holding initialization to one entry per participant keeps `log_index` order stable and preserves the
      ADR-0041 property that `log_index` order is causal order.'
    relationships:
    - rel_type: depends_on
      spec_id: CM-18-006
    - rel_type: depends_on
      spec_id: CM-14-003
    adr:
    - ADR-0048
- id: CM-19
  title: Participant Index Discipline
  specs:
  - id: CM-19-001
    priority: MUST
    kind: protocol
    statement: '`case_participants` (the persisted set of `CaseParticipant` records) is the authoritative source of participant
      membership. `actor_participant_index` (the in-memory dict mapping actor IDs to participants) is a cache derived from
      it. Divergence between these two structures is a hard error, not a recoverable state.'
    rationale: A divergence means the cache has entries the authority doesn't know about (or vice versa), producing silently
      incorrect routing and access-control decisions.
  - id: CM-19-002
    priority: MUST
    kind: protocol
    statement: Any code path that modifies `case_participants` (add, remove, update) MUST also update `actor_participant_index`
      atomically within the same transaction or method call. The index MUST NOT be allowed to lag the authority.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
  - id: CM-19-003
    priority: MUST
    kind: protocol
    statement: Code that needs a participant by actor ID MUST read from `actor_participant_index` (the cache). Code that needs
      the canonical participant set (e.g., for broadcast or audit) MUST read from `case_participants`. Using the cache for
      canonical iteration is prohibited because cache population order is undefined.
    relationships:
    - rel_type: refines
      spec_id: CM-19-001
- id: CM-20
  title: Coordinator-as-Participant Role Constraints
  specs:
  - id: CM-20-001
    priority: MUST
    kind: protocol
    statement: A Coordinator invited to a case as a regular participant MUST hold `CVDRole.COORDINATOR` in their `case_roles`
      list and MUST NOT hold `CVDRole.CASE_MANAGER`. The `CASE_MANAGER` role is reserved for the CaseActor service (CBT-01-003)
      and MUST NOT be assigned to any organizational or human participant joining a case as a facilitation actor rather than
      as the case management service.
    rationale: '`CASE_OWNER` is the role that confers case administration authority (CM-02-001, CM-02-004, CM-02-005). `CASE_MANAGER`
      is a distinct role reserved exclusively for the CaseActor service; it grants write authority to the canonical ledger
      (CLP-09) and MUST NOT be held by any participant actor regardless of their organizational role. These two constraints
      are independent: a Coordinator participant lacks both `CASE_OWNER` (they are not the case administrator) and `CASE_MANAGER`
      (they are not the case management service).'
    relationships:
    - rel_type: refines
      spec_id: CBT-01-003
  - id: CM-20-002
    priority: MUST
    kind: protocol
    statement: When a Coordinator is suggested via the `Offer(Actor, Case)` path (CM-16) and the Case Owner approves the invitation,
      the roles assigned to the Coordinator participant MUST include `CVDRole.COORDINATOR` and MUST NOT include `CVDRole.CASE_MANAGER`
      or `CVDRole.CASE_OWNER`.
    rationale: Invitation and case ownership transfer are distinct protocol operations. An `Offer(Actor, Case)` invite adds
      a participant; it does not transfer `CASE_OWNER` authority (CM-02-001) or the `CASE_MANAGER` service role (CM-20-001).
      Role assignments at invite time must reflect the invited actor's actual function in the case, not their organizational
      identity.
    relationships:
    - rel_type: refines
      spec_id: CM-20-001
    - rel_type: refines
      spec_id: CM-16-004
  - id: CM-20-003
    priority: MUST
    kind: protocol
    statement: When a Coordinator participant (holding `CVDRole.COORDINATOR` without `CVDRole.CASE_MANAGER`) suggests that
      another actor be added to the case via `Offer(Actor, Case)`, the suggestion MUST route through the CaseActor inbox per
      ADR-0026 (CM-16-001). The Case Owner — not the Coordinator — MUST remain the sole decision-maker for approving or rejecting
      the invitation (CM-02-001).
    rationale: 'A Coordinator-as-participant should be able to exercise their facilitation role (suggesting additional vendors)
      without requiring ownership transfer. The CaseActor-routed suggest flow (ADR-0026) already provides this: the Coordinator
      sends `Offer(Actor, Case)` to the CaseActor, which records and forwards it to the Case Owner for approval.'
    relationships:
    - rel_type: refines
      spec_id: CM-16-001
    - rel_type: refines
      spec_id: CM-20-001
    adr:
    - ADR-0026
- id: CM-21
  title: Ownership Transfer Protocol Effects
  specs:
  - id: CM-21-001
    priority: MUST
    kind: protocol
    statement: >-
      A `VulnerabilityCase` MUST have at most one participant holding
      `CVDRole.CASE_OWNER` at any point in time.  If a participant already
      holds `CVDRole.CASE_OWNER` when a new owner is designated, the system
      MUST remove `CVDRole.CASE_OWNER` from the previous owner's
      `CaseParticipant` record before or atomically with granting it to the
      new owner.
    rationale: >-
      `CASE_OWNER` confers exclusive case administration authority
      (CM-02-004, CM-02-005).  Two simultaneous holders would create
      conflicting authority: both could terminate embargoes, authorise
      invitations, and mutate case state independently.  The invariant must
      be enforced at the data-layer level, not just assumed by convention.
    relationships:
    - rel_type: refines
      spec_id: CM-02-004
    - rel_type: refines
      spec_id: CM-02-005
  - id: CM-21-002
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity
      is processed, the system MUST add `CVDRole.CASE_OWNER` to the accepting
      actor's `CaseParticipant.case_roles` and MUST update
      `VulnerabilityCase.attributed_to` to the accepting actor's ID.
    rationale: >-
      `PublicDisclosureBranchNode` (and any other role-gated protocol node)
      determines case-owner authority by reading `CaseParticipant.case_roles`,
      not by comparing actor IDs against `attributed_to`.  Updating only
      `attributed_to` without also updating the participant record leaves the
      new owner unable to trigger embargo teardown, case closure, and other
      CASE_OWNER-gated operations.  Both fields MUST be kept in sync.
    rationale_detail: >-
      This was the root cause of the FCCV-handoff CI failure (2026-07-23):
      `AcceptCaseOwnershipTransferNode` updated `attributed_to` but did not
      add `CVDRole.CASE_OWNER` to C2's participant record, so
      `_sender_is_case_owner()` returned False and embargo teardown was
      skipped.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
  - id: CM-21-003
    priority: MUST
    kind: protocol
    statement: >-
      When an `Accept(Offer(VulnerabilityCase))` ownership-transfer activity
      is processed, the system MUST remove `CVDRole.CASE_OWNER` from the
      previous owner's `CaseParticipant.case_roles`.  The previous owner
      MUST retain any other roles they held (e.g. `CVDRole.COORDINATOR`,
      `CVDRole.VENDOR`) and MUST remain a participant in the case.
    rationale: >-
      Transferring ownership does not evict the previous owner from the case;
      they continue to participate but no longer hold administrative authority.
      Stripping only `CASE_OWNER` (and not other roles) preserves their
      standing as a Coordinator, Vendor, or other role while satisfying the
      at-most-one invariant (CM-21-001).
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: TRIG-11-002
  - id: CM-21-004
    priority: MUST
    kind: project
    statement: >-
      The strip of `CVDRole.CASE_OWNER` from the previous holder (CM-21-003),
      the update of `VulnerabilityCase.attributed_to`, and the grant of
      `CVDRole.CASE_OWNER` to the new holder (CM-21-002) MUST be committed to
      storage as a single atomic transaction.  If any part of the write fails,
      the entire set MUST be rolled back so that no partial state is observable.
    rationale: >-
      Without atomicity a crash or exception between the strip and the grant
      produces a case with zero `CASE_OWNER` holders — a state worse than two
      simultaneous holders because it cannot be recovered by any subsequent
      normal protocol message.  The invariant in CM-21-001 ("at most one at any
      point in time") logically implies that the case MUST have exactly one
      `CASE_OWNER` at all times; this spec makes the storage-transaction
      requirement explicit so that DataLayer implementations cannot satisfy
      CM-21-001 through sequential saves.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-003
  - id: CM-21-005
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Offer(VulnerabilityCase)` (ownership-transfer variant)
      MUST address the activity to the CaseActor's inbox (`to: [case_actor_id]`)
      rather than directly to the transferee.  The CaseActor MUST forward the
      Offer to the transferee's inbox after recording it.
    rationale: >-
      Routing the Offer through the CaseActor enables it to commit a
      `CaseLedgerEntry` for the offer-in-flight and broadcast
      `Announce(CaseLedgerEntry)` to all participants (including those not
      involved in the transfer, such as a Finder or second Vendor).  Direct
      actor-to-actor delivery bypasses the canonical log and leaves non-involved
      participants unaware that a transfer is being negotiated.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    adr:
    - ADR-0053
  - id: CM-21-006
    priority: MUST
    kind: protocol
    statement: >-
      An actor emitting `Accept(Offer(VulnerabilityCase))` (ownership-transfer
      variant) MUST address the activity to the CaseActor's inbox
      (`to: [case_actor_id]`) rather than directly to the offerer.
    rationale: >-
      Routing the Accept through the CaseActor is required for the
      `AcceptCaseOwnershipTransferReceivedUseCase` to run on the authoritative
      CaseActor and trigger the post-transfer CaseLedgerEntry cascade
      (CM-21-007).  Addressing the Accept to the offerer's inbox means the use
      case only runs there; the CaseActor never learns of the completed transfer
      and cannot broadcast it.
    relationships:
    - rel_type: refines
      spec_id: CM-21-001
    - rel_type: refines
      spec_id: CM-21-005
    adr:
    - ADR-0053
  - id: CM-21-007
    priority: MUST
    kind: protocol
    statement: >-
      After `AcceptCaseOwnershipTransferReceivedUseCase` successfully applies
      the ownership-role changes (CM-21-002, CM-21-003, CM-21-004), the
      CaseActor MUST commit a `CaseLedgerEntry` recording the completed transfer
      and MUST broadcast `Announce(CaseLedgerEntry)` to all case participants.
    rationale: >-
      The CaseLedgerEntry broadcast is the only mechanism by which participants
      not involved in the transfer (e.g., a Finder or second Vendor) learn that
      the case owner has changed.  Without it, those participants have no
      reliable way to determine who is currently responsible for the case,
      leading to messages being directed to the wrong actor and coordination
      breakdown.  This requirement closes the surface-level symptom described
      in CONCERN-1755.
    relationships:
    - rel_type: refines
      spec_id: CM-21-002
    - rel_type: refines
      spec_id: CM-21-006
    adr:
    - ADR-0053
- id: CM-22
  title: CaseActor-Authoritative Case Creation
  description: >-
    Requirements on the CaseActor's obligations when accepting a CaseProposal,
    per ADR-0041.  These replace the vendor-authored case-creation described in
    ADR-0015 and govern how the CaseActor initializes CaseStatus, participants,
    and embargo in its DataLayer before emitting `Create(VulnerabilityCase)`.
  specs:
  - id: CM-22-001
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST create the `VulnerabilityCase` object in its own
      DataLayer with `attributed_to` equal to the CaseActor's own actor ID when
      accepting a `Create(as_CaseProposal)`.
    rationale: >-
      ADR-0041 supersedes ADR-0015.  `attributed_to` names the authoritative
      creator of the case; only the CaseActor is the authoritative creator
      (ADR-0023).  Assigning `attributed_to` to the vendor violates AS2
      semantics and the chain-of-custody model in `chain.py`.
    relationships:
    - rel_type: implements
      spec_id: CP-09-001
    adr:
    - ADR-0023
    - ADR-0041
    lint_suppress:
    - dangling_adr_ref
  - id: CM-22-002
    priority: MUST
    kind: protocol
    statement: >-
      After creating the `VulnerabilityCase`, the CaseActor MUST create
      `CaseParticipant` records for at minimum: (a) the receiver (vendor) with
      `CVDRole.CASE_OWNER` and `RM.RECEIVED`, and (b) the reporter with
      `RM.ACCEPTED`.  These records MUST be written before `Create(VulnerabilityCase)`
      is emitted to the vendor.
    rationale: >-
      The `Create(VulnerabilityCase)` payload embeds participants inline so the
      vendor's `CreateCaseReceivedUseCase._store_embedded_participants` can seed
      its local replica.  Absent participant records at emission time produce an
      empty replica and break role-guard checks (CP-09-002, CP-09-004).
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-002
  - id: CM-22-003
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST commit all canonical ledger entries for case
      initialization (`create_case`, `add_report_to_case`, participant-status
      entries, `add_case_status_to_case`) natively in its own DataLayer.  These
      entries MUST NOT be authored by the vendor and back-filled via
      `WritePrologueLedgerEntriesNode` or any equivalent mechanism.
    rationale: >-
      `_validate_canonical_entry` (in `sync/nodes/canonical_entry.py`) rejects
      entries where the
      `actor_id` does not match `_CASE_AUTHORED_SIGNATURES`.  Vendor-authored
      entries fail this check (the root cause of Issue #1767).  Native
      CaseActor authorship is the only compliant path.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
  - id: CM-22-004
    priority: MUST
    kind: protocol
    statement: >-
      The CaseActor MUST initialize the default embargo for the new case before
      emitting `Create(VulnerabilityCase)` to the vendor.
    rationale: >-
      Embargo state is protocol-significant.  Deferring initialization to the
      vendor or to a later message would produce a window in which
      embargo-gated operations are undefined (ADR-0041, CP-09-003).  The
      CaseActor holds the default embargo policy and is the only actor that
      can initialize it authoritatively at case creation.
    relationships:
    - rel_type: refines
      spec_id: CM-22-001
    - rel_type: implements
      spec_id: CP-09-003
    adr:
    - ADR-0041

- id: CM-23
  title: RM Case Closure via Leave(VulnerabilityCase)
  description: >-
    Requirements for the canonical RM case closure path: Leave(VulnerabilityCase)
    is the sole mechanism for advancing a participant's RM state to CLOSED.
    Add(ParticipantStatus, rm_state=RM.CLOSED) is not a valid closure trigger.
    See ADR-0050 (Leave is canonical for RM closure) and ADR-0051
    (CaseActor RM lifecycle).
  specs:
  - id: CM-23-001
    priority: MUST
    kind: protocol
    statement: >-
      RM case closure MUST flow through Leave(VulnerabilityCase) → Case Actor
      ledger commit → broadcast → each replica advances the leaving participant's
      RM state to RM.CLOSED on receipt of the Announce(CaseLedgerEntry).
      Add(ParticipantStatus, rm_state=RM.CLOSED) MUST NOT be used as a closure
      trigger.
    rationale: >-
      The Leave round-trip makes the Case Actor the authority for closure and
      prevents ghost-departures from lost messages: a participant cannot
      silently reach RM.CLOSED on peers without the Case Actor having committed
      and broadcast a ledger entry.  See ADR-0050.
    adr:
    - ADR-0050
  - id: CM-23-002
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Actor receives Leave(VulnerabilityCase) from the Case Owner,
      it MUST execute the following sequence:
      (1) advance the Case Owner participant to RM.CLOSED,
      (2) advance the Case Actor's own CaseParticipant to RM.CLOSED,
      (3) emit a final case_fully_closed CaseLedgerEntry as the last ledger entry
          for the case,
      (4) fan-out the final entry to all participants not already at RM.CLOSED.
    rationale: >-
      The Case Owner's departure is the authoritative termination event for a
      case.  Making the Case Actor's own RM.CLOSED the penultimate step and
      case_fully_closed the final entry gives all replicas an unambiguous
      terminal anchor in the ledger chain.  See ADR-0050, ADR-0051.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
    - ADR-0051
  - id: CM-23-003
    priority: MUST
    kind: protocol
    statement: >-
      When the Case Actor receives Leave(VulnerabilityCase) from a non-owner
      participant, it MUST advance only that participant's RM state to RM.CLOSED
      and commit a CaseLedgerEntry recording the departure.  The case MUST remain
      open for the remaining participants.
    rationale: >-
      Non-owner departure is a participant-scoped event, not a case termination
      event.  Treating a non-owner Leave identically to an owner Leave would
      prematurely close the case and violate the Case Owner's authority over the
      case lifecycle.  See ADR-0050.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
    adr:
    - ADR-0050
  - id: CM-23-004
    priority: MUST
    kind: protocol
    statement: >-
      Case Actor fan-out of CaseLedgerEntry MUST NOT send entries to participants
      whose latest ParticipantStatus has rm_state=RM.CLOSED.
    rationale: >-
      Once a participant reaches RM.CLOSED they have departed the case and no
      longer need (or should receive) case updates.  Continuing to send them
      entries wastes bandwidth and may trigger erroneous processing on stale
      replicas.
    relationships:
    - rel_type: refines
      spec_id: CM-23-001
  - id: CM-23-005
    priority: MUST
    kind: protocol
    statement: >-
      The Case Actor MUST track its own RM lifecycle via a CaseParticipant
      record with ParticipantStatus entries that advance through
      RM.RECEIVED, RM.VALID, and RM.ACCEPTED during case initialization,
      and RM.CLOSED on case termination (owner Leave).  Each transition
      MUST be recorded as a CaseLedgerEntry.
    rationale: >-
      Uniform RM lifecycle tracking across all participants (including the
      coordinator) enables case-level RM state to be read consistently from
      the ledger without special-casing the Case Actor.  See ADR-0051.
    relationships:
    - rel_type: refines
      spec_id: CM-23-002
    adr:
    - ADR-0051
  - id: CM-23-006
    priority: MUST
    kind: protocol
    statement: >-
      For the Case Actor's CaseParticipant, the RM states have the following
      case-actor-specific meanings:
      RM.RECEIVED = a CaseProposal has been received and is being evaluated;
      RM.VALID = the CaseProposal is correctly formatted and actionable by this
      Case Actor, and case creation has begun;
      RM.ACCEPTED = the case has been successfully created and is being
      coordinated;
      RM.CLOSED = the Case Owner has left the case and the case is fully closed.
    rationale: >-
      The RM state machine models a lifecycle that applies to any actor
      processing a case, but its transition labels (RECEIVED, VALID, ACCEPTED,
      CLOSED) map to case-level events for the coordinator rather than to
      report-validation events as for other participants.  See ADR-0051.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    adr:
    - ADR-0051
  - id: CM-23-007
    priority: MUST
    kind: protocol
    statement: >-
      During case initialization (after accepting a CaseProposal), the Case
      Actor MUST emit CaseLedgerEntry records for each of its own RM transitions:
      (a) CaseActor→RM.RECEIVED when the CaseProposal arrives,
      (b) CaseActor→RM.VALID when the proposal is validated and case creation
          begins,
      (c) CaseActor→RM.ACCEPTED when the VulnerabilityCase is successfully
          created and initialized.
    rationale: >-
      Ledger entries for the Case Actor's own RM transitions create a traceable,
      timestamped protocol-significant history of case initialization, consistent
      with CM-02-009 (CaseActor applies its own timestamp to every state-changing
      event).  See ADR-0051.
    relationships:
    - rel_type: refines
      spec_id: CM-23-005
    - rel_type: refines
      spec_id: CM-02-009
    adr:
    - ADR-0051

- id: CM-24
  title: CaseActor-Delegated Activity Authorship Contract
  description: >-
    Requirements for how trigger use cases assign `actor` and `attributed_to`
    when the CaseActor emits an Activity on behalf of a requesting participant
    (delegated message).  The reference implementation is
    SvcInviteActorToCaseUseCase._prepare().  Codified from CONCERN-2170.
  specs:
  - id: CM-24-001
    priority: MUST
    kind: protocol
    statement: >-
      When a trigger use case causes the CaseActor to emit a protocol Activity
      on behalf of a requesting participant (delegated message), the `actor`
      field of the emitted Activity MUST be set to the CaseActor's actor ID,
      not the requesting participant's actor ID.
    rationale: >-
      Receiving actors authenticate messages by matching the `actor` field
      against known case participants.  An Activity whose `actor` names a
      non-CaseActor participant is not recognised as a CaseActor-authorised
      delegation and may be rejected or misrouted.  Bug ISSUE-2142
      (ownership-transfer offer delivery timeout) is direct evidence:
      the Coordinator rejected an Offer whose `actor` named the Finder.
    relationships:
    - rel_type: refines
      spec_id: CM-02-009
  - id: CM-24-002
    priority: MUST
    kind: protocol
    statement: >-
      When a delegated Activity is emitted by the CaseActor, the
      `attributed_to` field MUST be set to the requesting participant's actor
      ID so that receivers can recover the originating identity.
    rationale: >-
      `attributed_to` is the AS2-standard field for recording who delegated an
      action.  Without it, the intent of the message cannot be attributed to the
      correct participant, and audit trails are incomplete.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
  - id: CM-24-003
    priority: MUST
    kind: protocol
    statement: >-
      When no dedicated CaseActor exists for a case (no participant with
      CVDRole.CASE_MANAGER in the actor_participant_index), the Activity is sent
      directly by the requesting participant.  In this case `actor` MUST be the
      requesting participant's actor ID and `attributed_to` MUST be None.
    rationale: >-
      Without a CaseActor the delegation channel does not exist.  Forcing
      `actor=None` or a fallback CaseActor ID would produce an invalid wire
      message.  The SvcInviteActorToCaseUseCase reference implementation
      demonstrates this fallback at actor.py:160-166.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
  - id: CM-24-004
    priority: MUST
    kind: architecture
    statement: >-
      Trigger use cases that emit delegated Activities MUST queue the
      constructed Activity in the CaseActor's outbox, not in the requesting
      participant's outbox.  self._actor_id MUST be set to case_actor_id in
      _prepare() so that the BT bridge runs under the CaseActor's identity.
    rationale: >-
      The CaseActor's outbox is the delivery path to other participants.
      Queuing a delegated Activity in the requesting actor's outbox bypasses
      the CaseActor as the authoritative intermediary and breaks the
      CaseLedgerEntry audit trail.
    relationships:
    - rel_type: refines
      spec_id: CM-24-001
  - id: CM-24-005
    priority: MUST
    kind: architecture
    statement: >-
      All trigger use cases that emit delegated Activities MUST use a shared
      helper (e.g. _prepare_delegated_context() or equivalent) that enforces
      the CM-24-001 through CM-24-004 invariants.  No callsite may independently
      reconstruct the delegated-authorship pattern without going through this
      shared helper.
    rationale: >-
      Independent reconstruction of the actor/attributed_to assignment at each
      callsite is structurally fragile.  CONCERN-2170 documents two callsites
      that deviated: SvcOfferCaseOwnershipTransferUseCase (wrong actor, no
      attributed_to) proved the pattern is re-broken every time a new callsite
      is added.  A shared helper eliminates the entire class of defect.
