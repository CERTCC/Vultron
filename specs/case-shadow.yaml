id: SHD
title: Case Shadow Tool
description: >-
  Rules for the case shadow: a standalone, read-only tool that reads one case from an
  outside system on request, translates it, and shows Vultron's analysis of it,
  and how that tool is packaged. The first outside system is VINCE; its data
  rules are in `vince-shadow-data.yaml`.
scope:
- prototype
- production
tags:
- security
groups:
- id: SHD-01
  title: Read-Only Advisor
  specs:
  - id: SHD-01-001
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The shadow tool MUST NOT contain a code path that delivers an activity to
      an inbox.
    rationale: >-
      This version of the case shadow advises the people working a case and does not act
      in it. With no
      delivery path, nothing can reach a participant, whatever its settings.
    verification: >-
      An import test asserts that no module of the shadow tool imports, directly
      or transitively, the outbox, an activity emitter, or an HTTP delivery
      adapter. A run against the recorded transport of SHD-01-002 also fails on
      any request to a host other than the configured outside system.
  - id: SHD-01-002
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The shadow tool MUST NOT write to an outside system.
    rationale: >-
      A case shadow beside an outside system that holds the case of record must leave
      that record exactly as its users left it.
    verification: >-
      A test asserts the case shadow reads cases only through a `CaseReader`
      (CRD-01-001), and a run against a recorded transport fails on any request
      that is not a read.
  - id: SHD-01-003
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The shadow tool MUST NOT keep an outside-system case, or its translation,
      after the request that read it ends.
    rationale: >-
      A translation is rebuilt whenever it is needed. A copy kept beyond its
      request is a second store of embargoed data that nobody planned to
      protect. Transient working files within a request are allowed.
    verification: >-
      A test runs one request over a synthetic case whose content holds a marker
      string, then asserts the marker is in no file under the tool's working and
      temporary directories or `~/.streamlit`, and that a second request in the
      same process cannot read the first request's translation from a Streamlit
      cache or session state.
  - id: SHD-01-004
    priority: MUST
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The shadow tool MUST show every outside-system fact its reader could not
      translate, beside the analysis of the case.
    relationships:
    - rel_type: depends_on
      spec_id: CRD-01-005
    rationale: >-
      An analysis that silently leaves out part of the case looks complete when
      it is not. Shown facts tell the analyst what the scores do not cover.
    verification: >-
      A dashboard test feeds a reader result with one untranslated fact and
      asserts the page shows it.
- id: SHD-02
  title: Packaging
  specs:
  - id: SHD-02-001
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0192
    statement: >-
      The case shadow's Compose service MUST NOT mount a persistent volume.
    rationale: >-
      With nowhere persistent to write, a bug cannot leave a copy of a case
      behind when the container stops.
    verification: >-
      A test loads the Compose file and asserts the `shadow` service declares no
      volume, and inspects the image to assert it declares no `VOLUME`.
  - id: SHD-02-002
    priority: MUST
    kind: project
    adr:
    - ADR-0192
    statement: >-
      The case shadow's Compose service MUST publish its port on the loopback
      interface only.
    rationale: >-
      The page shows embargoed case data. Publishing it on loopback keeps it off
      the network the host sits on.
    verification: >-
      A test loads the Compose file and asserts the `shadow` service publishes at
      least one port, binds every published port to `127.0.0.1`, and does not
      set `network_mode: host`.
  - id: SHD-02-003
    priority: MUST
    kind: project
    adr:
    - ADR-0192
    statement: >-
      The case shadow MUST read the outside system's credential only from the
      environment it runs in.
    rationale: >-
      The credential is a secret, so it is kept outside the code, the repository
      and every configuration file. An image or a compose file is shared and
      often committed, and a credential that only the running environment holds
      has no path into either.
    verification: >-
      A test builds the image with a marker credential in the build environment
      and asserts no image layer contains it, asserts the Compose file names the
      credential only through `${VAR}` interpolation, and asserts the tool reads
      it from the environment and refuses to read a case without it.
  - id: SHD-02-004
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0192
    statement: >-
      Code outside the shadow tool MUST NOT import Streamlit.
    rationale: >-
      Streamlit is sanctioned for the shadow tool only. Keeping it there keeps
      the protocol packages free of a user-interface dependency.
    verification: >-
      An import test asserts that no module outside the shadow tool's package
      imports `streamlit`.
