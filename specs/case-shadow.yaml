id: SHD
title: Case Shadow Tool
description: >-
  Rules for the case shadow tool: a standalone, read-only tool that reads one case
  from an outside system on request, translates it, and shows Vultron's
  analysis of it, and how that tool is packaged. The first outside system is
  VINCE; its data rules are in `vince-shadow-data.yaml`.
scope:
- prototype
- production
tags:
- security
groups:
- id: SHD-01
  title: Read-Only Advisor
  specs:
  - id: SHD-01-001
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The case shadow tool MUST NOT contain a code path that delivers an activity to
      an inbox.
    rationale: >-
      This version of the case shadow tool advises the people working a case and does
      not act in it. With no delivery path, nothing can reach a participant,
      whatever its settings.
    verification: >-
      An import test asserts that no module of the case shadow tool imports, directly
      or transitively, the outbox, an activity emitter, or an HTTP delivery
      adapter. A run against the recorded transport of SHD-01-002 also fails on
      any request to a host other than the chosen outside system or the Vultron
      node, configured or typed on the page.
  - id: SHD-01-002
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The case shadow tool MUST NOT write to an outside system.
    rationale: >-
      A case shadow tool beside an outside system that holds the case of record must
      leave that record exactly as its users left it.
    verification: >-
      A test asserts the case shadow tool reads cases only through a `CaseReader`
      (CRD-01-001), and a run against a recorded transport fails on any request
      that is not a read.
  - id: SHD-01-003
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The case shadow tool MUST NOT leave a case it read, or its translation, on
      the host after its process exits.
    rationale: >-
      A copy left on the host is a second store of embargoed data that nobody
      planned to protect. Holding a case in memory while the process runs is
      allowed, so the tool can follow a live case as its ledger grows, and so is
      a transient working file that is gone when the process exits. A later need
      for the case is met by reading it again. The tool's Compose service has no
      persistent volume to write to (SHD-02-001).
    verification: >-
      A test runs the tool over a synthetic case whose content holds a marker
      string, lets the process exit, then asserts the marker is in no file under
      the tool's working and temporary directories or `~/.streamlit`. The test
      asserts the same when a read fails partway and when the process is stopped
      with SIGTERM while it holds the case.
  - id: SHD-01-004
    priority: MUST
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The case shadow tool MUST show every outside-system fact its case reader could
      not translate, beside the analysis of the case.
    relationships:
    - rel_type: depends_on
      spec_id: CRD-01-005
    rationale: >-
      An analysis that silently leaves out part of the case looks complete when
      it is not. Shown facts tell the analyst what the scores do not cover.
    verification: >-
      A dashboard test feeds a case reading with one untranslated fact and
      asserts the page shows it.
- id: SHD-02
  title: Packaging
  specs:
  - id: SHD-02-001
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0192
    statement: >-
      The case shadow tool's Compose service MUST NOT mount a persistent volume.
    rationale: >-
      With nowhere persistent to write, a bug cannot leave a copy of a case
      behind when the container stops.
    verification: >-
      A test loads the Compose file and asserts the `shadow` service declares no
      volume, and inspects the image to assert it declares no `VOLUME`.
  - id: SHD-02-002
    priority: MUST
    kind: project
    adr:
    - ADR-0192
    statement: >-
      The case shadow tool's Compose service MUST publish its port on the loopback
      interface only.
    rationale: >-
      The page shows embargoed case data. Publishing it on loopback keeps it off
      the network the host sits on.
    verification: >-
      A test loads the Compose file and asserts the `shadow` service publishes at
      least one port, binds every published port to `127.0.0.1`, and does not
      set `network_mode: host`.
  - id: SHD-02-003
    priority: MUST
    kind: project
    adr:
    - ADR-0192
    statement: >-
      The case shadow tool MUST read the outside system's credential only from the
      environment it runs in.
    rationale: >-
      The credential is a secret, so it is kept outside the code, the repository
      and every configuration file. An image or a compose file is shared and
      often committed, and a credential that only the running environment holds
      has no path into either.
    verification: >-
      A test builds the image with a marker credential in the build environment
      and asserts no image layer contains it, asserts the Compose file names the
      credential only through `${VAR}` interpolation, and asserts the tool reads
      it from the environment and refuses to read a case without it.
  - id: SHD-02-004
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0192
    statement: >-
      Code outside the case shadow tool MUST NOT import Streamlit.
    rationale: >-
      Streamlit is sanctioned for the case shadow tool only. Keeping it there keeps
      the protocol packages free of a user-interface dependency.
    verification: >-
      An import test asserts that no module outside the case shadow tool's package
      imports `streamlit`.
- id: SHD-03
  title: Move Advice
  specs:
  - id: SHD-03-001
    priority: MUST
    kind: project
    adr:
    - ADR-0200
    statement: >-
      The case shadow tool's move advice MUST give each open move one outcome shift
      for each vendor of the case, notified or not, each read from that vendor's
      own projection of the case onto each desideratum's smallest model, so that
      the advice never joins several vendors' sequences into one (CEH-05-006).
    rationale: >-
      A vendor's scope is the unit of move advice. Each vendor's values come from
      its own projection, so the advice reads several vendors as the
      event-history layer exposes them. A vendor not yet notified is a scope
      too: the spike of #6450 shows that a score over the notified vendors alone
      marks a notice as a loss.
    see_also:
    - spec_id: CEH-05-006
      reason: >-
        The same boundary at the event-history layer; the advice keeps it, but
        it is not a case of that rule.
    verification: >-
      `test/measure/advice/test_shifts.py::test_notifying_a_vendor_raises_only_that_vendors_end_part`
      asserts a notice moves only the notified vendor's scope, and
      `test/measure/advice/test_shifts.py::test_a_vendors_own_fix_changes_no_other_vendors_scope`
      asserts a vendor's own fix leaves every other vendor's scope unchanged.
  - id: SHD-03-002
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0200
    statement: >-
      The case shadow tool's move advice MUST NOT put the open moves in order by one
      score that combines the vendors' scores.
    rationale: >-
      In the spike of #6450, each of five scalar aggregates (median, mean,
      maximin, mean then spread, Nash product) fails pathology cases that the
      bands pass: a scalar names no vendor's harm, and four of the five rank an
      embargo move above notifying a vendor.
    verification: >-
      `test/measure/advice/test_bands.py::test_the_advice_gives_no_combined_score`
      asserts a move's advice holds no case score, and
      `test/measure/advice/test_bands.py::test_a_higher_vendor_sum_does_not_put_a_move_first`
      asserts a harm-free move comes before a trade-off move with a higher sum.
- id: SHD-04
  title: Live Vultron Case Reader
  specs:
  - id: SHD-04-001
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The live Vultron case reader MUST NOT send a node any request other than a
      GET of a case's ledger list endpoint or its ledger event-stream endpoint.
    relationships:
    - rel_type: refines
      spec_id: SHD-01-001
    rationale: >-
      The reader reads a running node's case; any other request could change the
      case or act in it, which the case shadow tool never does. The ledger read
      endpoints are the node's demo-only, prototype-mode list and event-stream
      endpoints; an access-controlled read surface for a production node is a
      separate decision.
    verification: >-
      A run against a recorded transport fails on any request that is not a GET,
      or whose path is not a node's case ledger list or event-stream endpoint.
  - id: SHD-04-002
    priority: MUST
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The live Vultron case reader MUST raise a domain error naming the node and
      the case when it cannot read the case from the node.
    rationale: >-
      The read fails when the node cannot be reached, does not serve the case
      ledger read endpoints, which exist only on a node in prototype mode, or
      holds no such case. An error that names the node and the case tells the
      analyst where to look, instead of a dashboard that shows an empty case.
    verification: >-
      A test gives the reader an unreachable node, a node that answers 404 for
      the endpoint, and a node that holds no such case, and asserts each raises
      the domain error with the node and case in its message.
  - id: SHD-04-003
    priority: MUST
    kind: project
    adr:
    - ADR-0190
    statement: >-
      Each case reading the live Vultron case reader returns MUST hold every
      ledger entry the node has sent for the case, in log-index order.
    rationale: >-
      An analysis built on part of a ledger looks complete when it is not. A
      followed case is read again whole as each entry arrives, so every reading
      the dashboard shows is a whole ledger, exactly as a file reading is.
    verification: >-
      A test streams three valid entries and asserts the readings hold one, two
      and three entries, each in log-index order.
  - id: SHD-04-004
    priority: MUST
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The live Vultron case reader MUST refuse a case reading whole when any
      entry the node sent for it is not a valid ledger entry.
    relationships:
    - rel_type: refines
      spec_id: SHD-04-003
    rationale: >-
      Dropping the bad entry would give a partial ledger that looks whole. The
      file reader refuses a bad row the same way.
    verification: >-
      A test streams one valid entry and then one invalid entry, and asserts the
      reading after the invalid entry is refused with an error naming that
      entry.
  - id: SHD-04-005
    priority: MUST
    kind: project
    adr:
    - ADR-0190
    statement: >-
      The case shadow tool MUST keep showing a followed case's last accepted
      reading, marked, after a later reading is refused or the stream ends.
    relationships:
    - rel_type: depends_on
      spec_id: SHD-04-004
    rationale: >-
      A refused entry or a stopped node does not make the case's earlier standing
      wrong. Keeping it on the page, marked, tells the analyst what they are
      looking at without blanking the dashboard.
    verification: >-
      A dashboard test follows a case whose stream sends a valid entry, then an
      invalid one, then a close event, and asserts the page keeps the first
      reading, shows the error, and then marks the reading as no longer live. A
      second run whose connection drops without a close event asserts the page
      keeps the last accepted reading and marks it as no longer live.
- id: SHD-05
  title: Action Rules
  specs:
  - id: SHD-05-001
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      An action rule MUST read one vendor's position. The position is the vendor's
      RM, CS and PEC states and the case's EM state.
    rationale: >-
      Move advice scores each move for one vendor's scope, read from that
      vendor's own projection (SHD-03-001). A rule that reads the same position
      can be checked against that advice. A rule over CS alone cannot say that a
      move suits an RM or EM state. The PEC states are the vendor's consent to
      the embargo in force and to an open proposal.
    verification: >-
      A test builds a rule for each of the four parts and asserts that each one
      matches a position that holds the named state and no position that does
      not.
  - id: SHD-05-002
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      An action rule for a role other than the vendor MUST match once for each
      vendor whose position matches it, and name that vendor.
    rationale: >-
      A rule is advice and fires nothing, so it does not need a threshold over
      the vendors. Naming the vendor tells the analyst which vendor the advice is
      about, and the trigger that acts on it still aggregates over the
      participants.
    verification: >-
      A test gives a coordinator rule a case with two vendors, of which one
      matches, and asserts one match that names the matching vendor.
  - id: SHD-05-003
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The case shadow tool MUST treat a rule as undecided where it constrains a
      part of the position that the case reading does not hold.
    rationale: >-
      A reading that records no state for a part, such as no embargo consent,
      says nothing about it. A rule shown as matched or unmatched there would
      read an unknown as false, which CRD-02-005 rules out for the facts a case
      reader declares unobservable.
    verification: >-
      A test gives a rule with a PEC part a reading that holds no consent state,
      and asserts the rule is undecided, neither matched nor unmatched.
  - id: SHD-05-004
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      Each action rule MUST name its acting CVD role, one action, and at least
      one desideratum that the action serves. Each desideratum comes from the
      move-advice desiderata list.
    rationale: >-
      A reason that names desiderata tells the analyst what the rule is for, and
      lets the comparison check the rule against the advice. A tag such as
      "Exit criteria met" names no desideratum.
    verification: >-
      A test constructs a rule with no role, with no action, and with no
      desideratum, and asserts each is refused; a second test asserts that every
      desideratum each authored rule names is in the move-advice desiderata list.
  - id: SHD-05-005
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      An action rule whose action is a move MUST name the move as move advice
      names it, by its state machine and its trigger.
    rationale: >-
      The comparison joins a rule and the advice for the same move on one name.
      A second name for a move would leave the two unjoined, and the rule would
      read as unscored.
    verification: >-
      A test asserts that the move name of each authored rule whose action is a
      move is the name of a move that move advice can list.
  - id: SHD-05-006
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The authored action-rule table MUST hold exactly one CS-only rule for each
      pattern and action pair of `CS_ACTION_RULES`.
    rationale: >-
      The CS action rules are held equal to the legacy test oracle over the 32
      valid compound states (CSB-17-001). An authored table that drops or adds
      a CS pair would give advice that the oracle no longer checks.
    verification: >-
      A test compares the set of pattern and action pairs of the authored
      table's CS-only rules with the set that `CS_ACTION_RULES` holds, and
      asserts they are equal.
  - id: SHD-05-007
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      Each generated action rule MUST take its verdict from move advice as the
      move's band for one vendor. That band is harm-free when the vendor's
      deciding part is positive, and unhelpful otherwise.
    rationale: >-
      The generated rules are the evidence that an authored rule is checked
      against. A second scorer could drift from the advice. The deciding part is
      the vendor's end part, or its embargo part when the end part is zero, as
      the bands use, and the band combines no vendors' scores (SHD-03-002).
    verification: >-
      A test asserts that the generated verdict at each valid position of one
      vendor equals the band that move advice gives the move in a case where
      that vendor is the only scope.
  - id: SHD-05-008
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      This codebase MUST provide one command that rebuilds the generated action
      rules and their docs page.
    rationale: >-
      A person who edits the rules by hand could hide a blind spot of the
      chance model. One command makes the generated rules follow the advice.
    verification: >-
      A test runs the command into a temporary directory and asserts it writes
      the generated rules and the docs page.
  - id: SHD-05-009
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      A check MUST fail when the committed generated action rules or their docs
      page differ from what the command builds from the current move advice.
    relationships:
    - rel_type: depends_on
      spec_id: SHD-05-008
    rationale: >-
      A change to move advice that leaves the generated rules unchanged would
      compare the authored rules with advice that no longer holds.
    verification: >-
      A currency test builds the generated rules and the page and asserts they
      equal the committed files.
  - id: SHD-05-010
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The comparison MUST give one of five results for each matching rule and
      verdict at a position. The results are agreement, rule disagreement,
      misplaced rule, unclaimed move and unscored rule.
    rationale: >-
      An agreement is an authored claim on a move that is harm-free for the
      vendor, and a rule disagreement one on a move that is unhelpful for it. A
      misplaced rule names a move the state machines do not allow there. An
      unclaimed move is harm-free and named by no rule. An unscored rule names
      an action with no band. Each result tells the analyst something
      different, so none may fold into another.
    verification: >-
      A test builds one position for each of the five results and asserts the
      comparison gives that result there, and that an unhelpful move no rule
      names gives no result.
  - id: SHD-05-011
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The comparison MUST join an authored rule to move advice on the move name
      and on the participant the move is for.
    rationale: >-
      A move name carries no participant. For an RM or CS move the participant
      is the matched vendor whose state the move changes; for an EM move it is
      the participant in the rule's role that move advice lists as able to make
      it. Without the participant, a rule about one vendor could join the advice
      for another.
    verification: >-
      A test gives a case with two vendors the same move for each, with
      different bands, and asserts each rule joins the band of its own vendor.
  - id: SHD-05-012
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      Each agreement and each rule disagreement MUST carry the deciding part of
      the vendor's shift and the change in each desideratum the rule names.
    rationale: >-
      The verdict is a band from all of the vendor's desiderata. A rule that
      names an end desideratum can agree with a move whose band comes from its
      embargo part only, and these two values let the analyst see that.
    verification: >-
      A test asserts that an agreement carries the deciding part and one change
      for each desideratum its rule names.
  - id: SHD-05-013
    priority: MUST_NOT
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The comparison MUST NOT change an authored action rule or a generated
      action rule.
    rationale: >-
      Neither the rules nor the chance model is ground truth. A rule
      disagreement marks a wrong rule or a blind spot of the model, and only a
      person can tell which, so a comparison that resolved it would hide one
      of the two.
    verification: >-
      A test runs the comparison over a table with a known rule disagreement and
      asserts both tables are unchanged afterwards.
  - id: SHD-05-014
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      Each rule disagreement of an authored rule that cites a chance-model blind
      spot MUST carry the issue that the rule cites.
    rationale: >-
      A person who judges a disagreement a blind spot of the model keeps it
      shown, with the issue that tracks the blind spot, so the analyst sees
      that it is known and why.
    verification: >-
      A test pins the embargo-extension disagreement of #6492: an authored rule
      that serves `D ≺ P` by an extension, citing #6492, against the unhelpful
      band move advice gives it, and asserts the disagreement carries #6492.
- id: SHD-06
  title: Action Rules on the Page
  specs:
  - id: SHD-06-001
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The case shadow tool MUST show the authored rules that match each vendor's
      position beside the move bands. The position is the one at the point the
      analyst looks at.
    rationale: >-
      The analyst reads a person's claim beside the model's evidence. A rule that
      is not on the page cannot be checked against the bands it sits next to.
    verification: >-
      A dashboard test opens a case at a point where a known rule matches and
      asserts the page shows that rule, for its vendor, beside the bands.
  - id: SHD-06-002
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The case shadow tool MUST compare each rule it shows with the move's band
      for the matched vendor, read from the case's own outcome shifts.
    relationships:
    - rel_type: depends_on
      spec_id: SHD-05-007
    rationale: >-
      A live case can have vendors that a move helps and vendors that it harms.
      Comparing with the matched vendor's own band shows a trade-off move as an
      agreement for one vendor and a rule disagreement for another.
    verification: >-
      A dashboard test opens a two-vendor case with a trade-off move that a rule
      claims for both vendors, and asserts one agreement and one rule
      disagreement.
  - id: SHD-06-003
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The case shadow tool MUST flag each rule disagreement and each misplaced
      rule it shows.
    rationale: >-
      A disagreement marks a wrong rule or a blind spot of the model, and a
      misplaced rule marks an authoring error. Either one, left unflagged, reads
      as advice that agrees with the bands.
    verification: >-
      A dashboard test opens a case at the #6492 extension position and asserts
      the page flags the rule disagreement.
  - id: SHD-06-004
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The measuring-CVD docs MUST hold a generated page that lists the generated
      action rules and the comparison's result at every valid position of one
      vendor.
    rationale: >-
      The page states move advice as rules that a person can review one by one,
      and shows every disagreement in one place, not only the ones a live case
      reaches. The command of SHD-05-008 builds it.
    verification: >-
      The currency test of SHD-05-009 asserts the committed page equals the one
      the command builds, and `docs-links` checks it is in the built site.
  - id: SHD-06-005
    priority: MUST
    kind: project
    adr:
    - ADR-0216
    statement: >-
      The CVD action rules page `docs/topics/other_uses/action_rules.md` MUST
      name, for each rule, the desiderata that the authored table names for it.
    rationale: >-
      The page is the source the authored rules were carried from. If it kept
      its tags while the authored table named desiderata, the two tables would
      disagree about why each rule exists.
    verification: >-
      A test reads `docs/topics/other_uses/action_rules.md` and asserts that the
      desiderata in each rule's reason equal the ones the authored table names for
      that rule.
