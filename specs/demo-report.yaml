id: DRPT
title: Demo Scenario Report Tool
description: >-
  Requirements for a read-only command-line tool that parses the JSONL case-ledger
  replica files produced by demo scenario runs and renders a selective, human-readable
  report of who did what, with what activity, and in what order. Covers input discovery,
  the distilled intermediate data model, markdown and HTML rendering, the per-actor
  replica-presence matrix, friendly naming, and test requirements.
scope:
- prototype
tags:
- demo
groups:
- id: DRPT-01
  title: Tool Structure and Invocation
  specs:
  - id: DRPT-01-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The report tool MUST be a standalone module at `vultron/demo/report.py`,
      importable as `vultron.demo.report`.
    rationale: >-
      A standalone module keeps the read-only reporting utility decoupled from
      the demo-run CLI (DC-01) while remaining colocated with the demo code that
      produces the ledger files.
  - id: DRPT-01-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The `vultron.demo.report` module MUST provide an `if __name__ == "__main__"`
      entry point, so that `python -m vultron.demo.report` runs the tool.
    rationale: >-
      A direct entry point lets a developer run the report on a devlogs directory
      without installing the package and without the demo CLI.
    relationships:
    - rel_type: extends
      spec_id: DRPT-01-001
  - id: DRPT-01-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST accept an input directory path. Without one, it uses the
      `DEVLOGS_DIR` environment variable, or `devlogs/` under the repository root
      when that variable is unset.
    rationale: >-
      The demo run writes each replica under `DEVLOGS_DIR`, and the invariant checks
      in `test/ci/invariants/` read the same place. When the tool uses the same
      default directory, it reads the output of a demo run with no extra arguments.
  - id: DRPT-01-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST discover its input files by a recursive glob of
      `**/*-case-ledger.jsonl` beneath the input directory.
    rationale: >-
      The demo run writes each replica to
      `{DEVLOGS_DIR}/{demo_name}/{actor_name}/{case_id_slug}-case-ledger.jsonl`.
      The same file pattern finds every replica of a run, and it does not read the
      other files in the directory.
    relationships:
    - rel_type: extends
      spec_id: DRPT-01-002
  - id: DRPT-01-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST derive each entry's actor name from the name of the directory that
      contains its JSONL file (e.g. `reporter`, `vendor`, `case-actor`).
    rationale: >-
      A ledger entry is the same in every replica, so it does not show which actor's
      replica holds it. The demo run writes the replica of each actor into a directory
      with the name of that actor. Thus the directory name is a reliable source for the
      actor name.
  - id: DRPT-01-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST exit with status code 0 on success and a non-zero status
      code when the input directory is missing, contains no matching JSONL
      files, or a file cannot be parsed.
    rationale: >-
      Scripts and CI jobs use the exit status to decide if the report was made. If the
      tool exits with zero when it has no input or cannot parse a file, a missing or
      damaged report is not seen.
  - id: DRPT-01-005
    priority: SHOULD
    kind: project
    statement: >-
      The tool SHOULD also have a `vultron-demo-report` console-script entry point in
      the `[project.scripts]` table of `pyproject.toml` that resolves to
      `vultron.demo.report:main`.
    rationale: >-
      A console script matches the other demo entry points (`vultron-demo`,
      `vultrabot_*`), and a user can run the tool after install without `python -m`.
    verification: >-
      `test/demo/test_report.py::TestConsoleScript::test_entry_point_registered_and_resolves_to_main`
      asserts that the `vultron-demo-report` console script is registered and loads
      `vultron.demo.report:main`.
    relationships:
    - rel_type: extends
      spec_id: DRPT-01-001
  - id: DRPT-01-008
    priority: MUST
    kind: project
    statement: >-
      `vultron.demo.report:main` MUST run when it is called with no arguments, and
      then read its arguments from `sys.argv`.
    rationale: >-
      The console-script wrapper calls `main()` with no arguments. A `main` that needs
      an argument fails as soon as the console script starts.
    verification: >-
      `test/demo/test_report.py::TestConsoleScript::test_main_callable_with_no_args`
      calls `main()` with no arguments and a patched `sys.argv`, and asserts exit code
      0 and the default report file.
    relationships:
    - rel_type: extends
      spec_id: DRPT-01-005
  - id: DRPT-01-009
    priority: MUST
    kind: project
    statement: >-
      `vultron.demo.report:main` MUST return the process exit code.
    rationale: >-
      The console-script wrapper uses the return value of `main()` as the exit status.
      A `main` that returns no code cannot report a failure.
    verification: >-
      `test/demo/test_report.py::TestCli::test_exit_zero_and_file_written` and
      `test/demo/test_report.py::TestCli::test_missing_dir_nonzero_exit` assert that
      `main` returns 0 on success and a non-zero code for a missing input directory.
    relationships:
    - rel_type: extends
      spec_id: DRPT-01-005
- id: DRPT-02
  title: Distilled Timeline Model
  specs:
  - id: DRPT-02-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST define a first-class `pydantic.BaseModel` (v2) distilled event
      type, such as `CaseTimelineEvent`, for one canonical timeline event in
      friendly-readable form.
    rationale: >-
      One typed model between the parser and the renderers keeps the JSONL parsing
      details in one place, and a test can check the parsed events without a renderer.
  - id: DRPT-02-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The markdown renderer and the HTML renderer MUST consume the distilled event
      model, not raw JSONL dicts.
    rationale: >-
      When both renderers read the same typed model, they show the same fields with
      the same meaning. A renderer that reads raw dicts repeats the parsing and can
      drift from the other renderer.
    relationships:
    - rel_type: depends_on
      spec_id: DRPT-02-001
  - id: DRPT-02-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each distilled event MUST surface, where available in the source entries:
      the acting actor, the semantic type (or extracted message semantics), the
      target object reference, the timestamp (`receivedAt`), the resulting
      RM/EM/CS state transition(s) from the payload snapshot, the `log_index`,
      and a short (truncated) `entry_hash` for chain traceability.
    rationale: >-
      A reader of the report must see who did what, to which object, when, and what
      case state changed as a result. The `log_index` and a short `entry_hash` let a
      reader find the matching entry in the ledger files.
  - id: DRPT-02-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The parser MUST tolerate both camelCase and snake_case field spellings in
      source entries (e.g. `logIndex`/`log_index`, `entryHash`/`entry_hash`,
      `payloadSnapshot`/`payload_snapshot`), consistent with the tolerance
      already present in `test/ci/invariants/common.py`.
    rationale: >-
      Ledger files can spell the same field in camelCase or in snake_case. If the parser
      reads only one spelling, it drops data, with no error, from files that use the
      other one, and the report shows an incomplete case.
  - id: DRPT-02-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST merge the entries of all discovered actors into a single
      canonical timeline, and de-duplicate replicated entries by `entry_hash`.
    rationale: >-
      Replicas hold copies of the same canonical entries; de-duplication yields
      the single case story rather than N near-identical per-actor logs.
  - id: DRPT-02-015
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST order the canonical timeline by `log_index` ascending.
    rationale: >-
      `log_index` is the order in which the CASE_MANAGER committed the entries. A
      timeline in that order tells the case story in the sequence it happened.
    relationships:
    - rel_type: extends
      spec_id: DRPT-02-004
  - id: DRPT-02-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      For each canonical timeline event, the tool MUST compute a per-actor
      replica-presence indicator recording which discovered actors' replicas
      contain that entry (by `entry_hash`), so replica convergence and
      divergence are visible at a glance.
    rationale: >-
      Each actor holds a replica of the case ledger. If a replica does not contain an
      entry, that actor has not received that case event. The presence indicator for
      each actor shows these gaps without a manual comparison of the files.
  - id: DRPT-02-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      When the discovered entries span more than one case (distinct `case_id`
      values — as when the default `devlogs/` root accumulates multiple demo
      runs), the tool MUST partition the timeline by `case_id`.
    rationale: >-
      `log_index` restarts at 0 for each case and same-named actor directories
      recur across demo runs, so a single merged timeline over multiple cases
      interleaves unrelated events and conflates replica presence across cases.
      DRPT-02-004's "single canonical timeline" is well-defined only within one
      case; partitioning by `case_id` preserves that guarantee when the input
      directory holds more than one.
    relationships:
    - rel_type: refines
      spec_id: DRPT-02-004
  - id: DRPT-02-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      When the discovered entries span more than one case, the tool MUST NOT
      interleave events from different cases.
    rationale: >-
      Interleaving events from distinct cases produces a meaningless merged
      timeline because `log_index` is case-local and replica presence is
      case-specific.
    testable: true

  - id: DRPT-02-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The distilled event model MUST carry the `case_id` field.
    rationale: >-
      Downstream partitioning and per-case rendering require each event to
      identify which case it belongs to.
    testable: true

  - id: DRPT-02-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST group timeline events by `case_id`, so that the events of each
      case are contiguous.
    rationale: >-
      Case-contiguous ordering prevents a comparison of `log_index` values across
      cases, because `log_index` is case-local.
    testable: true
  - id: DRPT-02-016
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Within each case group, the tool MUST order events by `log_index` ascending.
    rationale: >-
      The `log_index` order within a case keeps the causal sequence of that case.
    relationships:
    - rel_type: extends
      spec_id: DRPT-02-011
    testable: true

  - id: DRPT-02-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The replica-presence matrix MUST be computed per case.
    rationale: >-
      Replica presence is meaningful only within a single case; computing it
      across cases conflates unrelated actor participation.
    testable: true

  - id: DRPT-02-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each renderer MUST present one clearly labelled section (or table) per
      case.
    rationale: >-
      Separate per-case sections make case boundaries visible to the reader
      and prevent misinterpretation of per-case metadata such as time range
      and replica presence.
    testable: true

- id: DRPT-03
  title: Friendly Naming
  specs:
  - id: DRPT-03-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Human-readable output MUST render actors and target objects by short, friendly
      names, such as "Reporter", "report" or "note".
    rationale: >-
      A reader can follow "Reporter submitted report" at a glance. A reader cannot
      follow a long URI or a UUID in the same position.
  - id: DRPT-03-009
    priority: MUST_NOT
    kind: project
    verification_debt: '#2573'
    statement: >-
      An event summary MUST NOT use a bare URI or an opaque UUID identifier as its
      primary noun.
    rationale: >-
      A URI or a UUID as the subject or object of a summary hides who did what. The
      friendly name of DRPT-03-001 goes in that position instead.
    relationships:
    - rel_type: extends
      spec_id: DRPT-03-001
  - id: DRPT-03-010
    priority: SHOULD
    kind: project
    statement: >-
      The tool SHOULD derive actor labels from the actor directory name.
    rationale: >-
      The demo run writes the replica of each actor into a directory with the name of
      that actor (DRPT-01-003). That name is short and reads as a role, such as
      `reporter` or `vendor`.
    relationships:
    - rel_type: extends
      spec_id: DRPT-03-001
  - id: DRPT-03-011
    priority: MAY
    kind: project
    statement: >-
      Human-readable output MAY keep a full identifier as secondary detail, such as a
      tooltip, a title attribute or a trailing reference column.
    rationale: >-
      The full identifier stays available as secondary detail, so a reader can still
      find the exact object while the summary uses its friendly name.
    relationships:
    - rel_type: refines
      spec_id: DRPT-03-001
  - id: DRPT-03-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST build a URI-to-display-name map during timeline construction
      by scanning all payload snapshots for actor objects (type
      `Organization`, `Person`, `Service`, `Application`, `Group`, `Actor`)
      that carry both an `id` (URI) and a non-empty `name` field.
    rationale: >-
      Actor URIs may be UUID-based when the actor was created with a generated
      identifier rather than a slug.  Without name resolution, `friendly_actor_name`
      produces labels like "A1e7 421f B727" that violate DRPT-03-009's prohibition
      on opaque identifiers.  The `name` field is present on inline actor objects
      in wire payloads (e.g. `Organization` objects in `Invite` or `Accept`
      activities), making payload-scan the correct extraction point.
    relationships:
    - rel_type: extends
      spec_id: DRPT-03-001
  - id: DRPT-03-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Event summaries MUST map the semantic type to a concise active-voice phrase
      (subject verb object) by looking up the matching `SemanticEntry` in
      `SEMANTIC_REGISTRY` and rendering `entry.phrase` via `str.format_map()`.
    rationale: >-
      `SEMANTIC_REGISTRY` already holds a phrase for each message semantic (SE-07-001).
      When the tool uses that phrase, every semantic in the registry has a summary, and
      the summary cannot become different from the registry.
    relationships:
    - rel_type: refines
      spec_id: DRPT-03-001
  - id: DRPT-03-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      When it renders a phrase template, the tool MUST fill the `{actor}`, `{object}`
      and `{target}` slots from the resolved display labels of the event record.
    rationale: >-
      The resolved display labels are the friendly names of DRPT-03-001. Slots filled
      from them give a summary such as "Reporter submitted report".
    relationships:
    - rel_type: refines
      spec_id: DRPT-03-002
  - id: DRPT-03-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST render a missing slot, such as `{context}` when no context was
      recorded, as an em-dash (`"—"`) instead of raising a `KeyError`.
    rationale: >-
      `CaseLedgerEventRecord` is constructed from JSONL data and may not carry
      all slot values present in a live `VultronEvent`. A `defaultdict` fallback
      ensures phrases for multi-party semantics (e.g. `{actor} invited {object}
      to {target}`) degrade gracefully to `"{actor} invited {object} to —"` when
      the destination is absent rather than surfacing a runtime error.
    relationships:
    - rel_type: extends
      spec_id: DRPT-03-004

  - id: DRPT-03-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST NOT maintain a local phrase table parallel to the
      `SEMANTIC_REGISTRY`.
    rationale: >-
      A local duplicate phrase table diverges from the registry over time;
      prohibiting it ensures all phrase coverage comes from `SemanticEntry`
      definitions per SE-07-001.
    testable: true

  - id: DRPT-03-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      When no `SEMANTIC_REGISTRY` entry exists for a semantic type (e.g. data
      from a future protocol version), the tool MUST fall back to a humanized
      form of the raw semantic-type string.
    rationale: >-
      Graceful fallback prevents rendering failures when new semantic types are
      introduced before the registry is updated.
    testable: true

  - id: DRPT-03-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Actor labels MUST use the resolved display name from the
      URI-to-display-name map when available.
    rationale: >-
      Resolved display names prevent opaque UUID-based actor labels in output,
      satisfying DRPT-03-009's prohibition on bare identifiers.
    testable: true

  - id: DRPT-03-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Actor labels MUST fall back to the URI path-segment heuristic only when
      no entry is found in the URI-to-display-name map.
    rationale: >-
      The heuristic fallback provides a best-effort human-readable label for
      actors whose name was not captured in any payload snapshot.
    testable: true

- id: DRPT-04
  title: Rendering
  specs:
  - id: DRPT-04-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST render a markdown table report (one row per canonical
      timeline event) covering the distilled fields, including a per-actor
      replica-presence matrix column group.
    rationale: >-
      A markdown table is easy to read in a terminal, on GitHub and in a CI log. One
      row for each event, with the presence of each actor in columns, shows the case
      history and the replica gaps together.
  - id: DRPT-04-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST render a self-contained static HTML report file with all
      styling inlined (no external CSS, JS, fonts, or network assets), so the
      artifact renders identically offline and can be archived or shared as a
      single file.
    rationale: >-
      A report with no external assets shows the same content offline, in a CI artifact
      or in an archive. The tool writes the HTML in Python, so the report needs no
      JavaScript build step, its output is deterministic, and tests can check it.
  - id: DRPT-04-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the HTML report, the per-actor replica-presence matrix MUST be rendered
      as a per-actor checkbox/emoji cell per event, showing a present/absent
      indicator for each actor column (e.g. an event present in three of four
      actors' replicas shows three checks across four columns).
    rationale: >-
      A check mark or an empty cell for each actor shows at a glance which replicas
      contain an event. A count alone does not show which actor is missing it.
  - id: DRPT-04-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST let the user select the output format, for example with
      `--format markdown|html`.
    rationale: >-
      Different readers need different formats: markdown for a terminal or for GitHub,
      and HTML for a browser.
  - id: DRPT-04-017
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The tool MUST write the report to a file at a configurable path.
    rationale: >-
      A report written to a file can be kept as a CI artifact or shared after the run.
      A configurable path lets a CI job put it where the artifact upload looks.
    relationships:
    - rel_type: extends
      spec_id: DRPT-04-004
  - id: DRPT-04-005
    priority: SHOULD
    kind: project
    statement: >-
      After it writes an HTML report, the tool SHOULD open the report in the default
      browser with `webbrowser.open()`.
    rationale: >-
      A user who runs the tool on a desktop wants to see the report at once.
    verification: >-
      `test/demo/test_report.py::TestCli::test_html_opens_browser_without_no_open`
      asserts that an HTML run without `--no-open` calls `webbrowser.open()`.
  - id: DRPT-04-018
    priority: MUST
    kind: project
    statement: >-
      The tool MUST provide a flag, such as `--no-open`, that suppresses the browser
      launch.
    rationale: >-
      In CI and in other non-interactive runs there is no browser, so a run must be
      able to stop the launch.
    verification: >-
      `test/demo/test_report.py::TestCli::test_no_open_suppresses_browser` asserts
      that an HTML run with `--no-open` never calls `webbrowser.open()`.
    relationships:
    - rel_type: extends
      spec_id: DRPT-04-005
  - id: DRPT-04-006
    priority: SHOULD
    kind: project
    statement: >-
      Each per-case section SHOULD display the time range of its events as
      `Time range: {first} – {last}`, where `{first}` and `{last}` are the
      minimum and maximum `receivedAt` timestamps (full ISO 8601 strings) among
      the case's canonical events.
    rationale: >-
      When reviewing reports from CI runs or comparing across scenarios,
      knowing the time range at a glance (e.g. "15:31:20Z – 15:31:27Z") is
      more useful than counting rows. Per-case placement is necessary because
      `log_index` restarts at 0 per case and cases may span non-overlapping
      time windows (DRPT-02-006).
    relationships:
    - rel_type: extends
      spec_id: DRPT-04-001
    - rel_type: extends
      spec_id: DRPT-04-002
  - id: DRPT-04-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The Time column header MUST be labelled "ΔT".
    rationale: >-
      Absolute timestamps repeat the date and timezone on every row, making it
      hard to see the pacing of events. A delta-T column lets readers
      immediately spot where the protocol paused or accelerated. DRPT-04-006
      already provides the absolute-time anchor (first/last timestamps in the
      section header), so the table body can omit redundant full timestamps
      without losing traceability.
    relationships:
    - rel_type: extends
      spec_id: DRPT-04-001
    - rel_type: extends
      spec_id: DRPT-04-002
    - rel_type: extends
      spec_id: DRPT-04-006

  - id: DRPT-04-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The time range line MUST be omitted when no events in the case carry a
      `receivedAt` timestamp.
    rationale: >-
      Rendering a time range with no data would display a meaningless or
      error-prone placeholder.
    testable: true

  - id: DRPT-04-009
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      When all events in a case share the same `receivedAt` timestamp, both
      time range bounds MUST be shown (`{ts} – {ts}`).
    rationale: >-
      Showing both bounds even when equal makes the format unambiguous and
      avoids special-casing that could hide single-event cases.
    testable: true

  - id: DRPT-04-010
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In markdown output, the time range MUST appear as a bullet line between
      the case heading and the event table.
    rationale: >-
      Consistent placement ensures the time range is visible as a
      section-level annotation rather than embedded in the table.
    testable: true

  - id: DRPT-04-011
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In HTML output, the time range MUST appear as a `<p class="meta">`
      element between the `<h2>` heading and the `<table>`.
    rationale: >-
      The `meta` class allows consistent styling of section-level metadata
      across cases in the HTML report.
    testable: true

  - id: DRPT-04-012
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Each Time cell MUST display a delta from the previous row's `receivedAt`
      timestamp as an adaptive duration string: `+Ns` when under 60 seconds,
      `+Nm Ns` when under one hour, and `+Nh Nm Ns` for one hour or more (no
      day component).
    rationale: >-
      Adaptive formatting makes small and large deltas equally readable without
      wasting space on zero-valued time components.
    testable: true

  - id: DRPT-04-013
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      The first row that carries a `receivedAt` timestamp MUST show `+0s` in
      the Time cell.
    rationale: >-
      The first timed row anchors the delta sequence; showing `+0s` makes the
      anchor explicit rather than leaving the first cell empty.
    testable: true

  - id: DRPT-04-014
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Rows without a `receivedAt` value MUST show `—` in the Time cell.
    rationale: >-
      An em-dash distinguishes missing-timestamp rows from rows with a genuine
      zero delta.
    testable: true

  - id: DRPT-04-015
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the HTML renderer, the full ISO 8601 `receivedAt` string MUST be
      retained as a `title=` tooltip on the Time `<td>` element.
    rationale: >-
      The tooltip preserves the absolute timestamp for hover inspection without
      cluttering the table cell.
    testable: true

  - id: DRPT-04-016
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      In the markdown renderer, the absolute `receivedAt` timestamp MUST NOT
      appear in the Time column table cell body.
    rationale: >-
      The per-case time-range line (DRPT-04-006) provides the absolute-time
      anchor; repeating full timestamps in every cell is redundant.
    testable: true

- id: DRPT-05
  title: Testing
  specs:
  - id: DRPT-05-001
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Unit tests MUST cover JSONL-to-distilled-model parsing against fixtures that
      include both camelCase and snake_case field spellings.
    rationale: >-
      The parser is the part of the tool that is most likely to lose data without an
      error. Fixtures with both field spellings find a spelling the parser drops.
  - id: DRPT-05-008
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Unit tests MUST assert field extraction, merge and de-duplication by
      `entry_hash`, and the per-actor replica-presence computation.
    rationale: >-
      Checks of extraction, merge and presence find the data loss that a renderer
      test cannot see.
    relationships:
    - rel_type: extends
      spec_id: DRPT-05-001
  - id: DRPT-05-002
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Unit tests MUST cover both renderers: given a fixed list of distilled
      events, assert the markdown table structure and assert that the HTML
      output is well-formed and self-contained (references no external assets).
    rationale: >-
      The renderers produce the output that a reader sees. Fixed input events let a
      test check the table structure and the self-contained HTML (DRPT-04-002) without
      a demo run.
  - id: DRPT-05-003
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      A CLI smoke test MUST invoke the entry point against a tiny fixture
      directory, assert exit code 0, assert an output file is written, and
      assert that `--no-open` suppresses any browser launch.
    rationale: >-
      The unit tests call functions directly. A smoke test of the entry point checks
      the parts that a user runs: argument parsing, the exit status, the output file,
      and the flag that stops the browser launch.
  - id: DRPT-05-004
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Unit tests MUST cover actor name resolution (DRPT-03-003): assert that
      `collect_actor_names` extracts URI-to-name mappings from inline actor
      objects in payload snapshots, that `build_timeline` populates
      `actor_display_name` on events whose actor URI is in the map, and that
      `actor_label` returns the display name rather than a hex-fragment label
      for UUID-based actor URIs.
    rationale: >-
      Name resolution has three steps: collect the names, set them on the events, and
      use them in the label. If one step fails, the label falls back to a hex fragment
      of the UUID, and the report still renders. A test of each step finds the step
      that failed.
    relationships:
    - rel_type: verifies
      spec_id: DRPT-03-003
  - id: DRPT-05-005
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Unit tests MUST cover the `_format_delta` helper directly: assert `+0s`
      when `prev_received_at` is `None` and `received_at` is set (first-row
      anchor), assert `—` when `received_at` is `None`, assert `—` when both
      are `None`, and assert correct adaptive formatting for sub-minute
      (`+Ns`), sub-hour (`+Nm Ns`), and multi-hour (`+Nh Nm Ns`) deltas.
    rationale: >-
      The delta format has several cases: the first row, missing timestamps, and three
      ranges of duration. A direct test of `_format_delta` checks each case, including
      the cases that a fixture with real events does not reach.
    relationships:
    - rel_type: verifies
      spec_id: DRPT-04-007

  - id: DRPT-05-006
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      Renderer tests MUST assert that the Time column in the table body
      contains delta strings (e.g. `+0s`) rather than ISO 8601 timestamps.
    rationale: >-
      Verifies that neither renderer leaks absolute timestamps into the Time
      cell body, per DRPT-04-016.
    testable: true

  - id: DRPT-05-007
    priority: MUST
    kind: project
    verification_debt: '#2573'
    statement: >-
      HTML renderer tests MUST assert that the full ISO 8601 `receivedAt`
      timestamp is retained as a `title=` tooltip on the Time `<td>` element.
    rationale: >-
      Verifies DRPT-04-015: the absolute timestamp is preserved for hover
      inspection even though it does not appear in the cell body.
    testable: true
