id: RF
title: Response Format
description: >-
  The Vultron protocol uses ActivityStreams activities for both requests and responses. When
  handlers process inbound activities, they generate response activities (Accept, Reject,
  Update, etc.) sent to the originating actor or other participants.
version: 1.0.0
scope:
- prototype
- production
tags:
- wire-format
groups:
- id: RF-01
  title: Response Activity Structure
  specs:
  - id: RF-01-001
    priority: MUST
    kind: protocol
    statement: Response activities MUST conform to ActivityStreams 2.0
    verification: Integration tests in `test/demo/` confirm that response activities produced by handlers are valid AS2
      objects, and unit tests in `test/wire/as2/vocab/test_actvitities/test_activities.py` confirm they inherit from the
      AS2 base hierarchy.
    stories:
    - story_2022_017
    - story_2022_039
    - story_2022_058
    - story_2022_060
- id: RF-02
  title: Accept Response
  specs:
  - id: RF-02-001
    priority: MUST
    kind: protocol
    statement: Accept responses MUST use `Accept` activity type
    verification: Unit tests in `test/wire/as2/factories/test_case_factories.py` confirm that accept-response factories
      return objects with `type_` equal to `'Accept'`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-004
    stories:
    - story_2022_016
    - story_2022_047
    - story_2022_048
    - story_2022_050
    - story_2022_051
    - story_2022_054
    - story_2022_059
  - id: RF-02-002
    priority: MUST
    kind: protocol
    statement: >-
      Accept responses MUST include `object` field referencing accepted activity or object
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      constructing an `Accept` response without an `object` field raises a Pydantic validation error at construction
      time.
    lint_suppress:
    - missing_story_reference
  - id: RF-02-003
    priority: MUST
    kind: protocol
    statement: >-
      Accepting an Offer of an object MUST reference the Offer activity in the `object` field
      of the Accept response
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      `Accept` responses built from an `Offer` carry the full `Offer` activity object in the `object` field.
    lint_suppress:
    - missing_story_reference
  - id: RF-02-004
    priority: MUST
    kind: protocol
    statement: >-
      When accepting an offered object, the `object` field of the `Accept` activity MUST reference
      the Offer activity itself (e.g., `OfferCaseOwnershipTransfer`, `RecommendActor`), not
      the underlying object being offered. The Offer activity MUST be passed as an inline
      typed object (e.g., `RmSubmitReportActivity`, `EmProposeEmbargoActivity`), not as a
      bare string ID — bare string IDs are rejected at construction time
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      passing a bare string ID as the `object` of an `Accept` activity raises a validation error at construction time.
    lint_suppress:
    - missing_story_reference
  - id: RF-02-005
    priority: MUST
    kind: protocol
    statement: >-
      When accepting an Invite, the `object` field of the `Accept` activity MUST reference
      the Invite activity itself as a full inline typed object (e.g., `RmInviteToCaseActivity`,
      `EmInviteToEmbargoOnCaseActivity`), not the case, embargo, or any other domain object
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that an
      `Accept` response to an `Invite` carries the full inline invite object and that a bare string ID raises a
      validation error.
    relationships:
    - rel_type: refines
      spec_id: RF-02-002
    lint_suppress:
    - missing_story_reference
- id: RF-03
  title: Reject Response
  specs:
  - id: RF-03-001
    priority: MUST
    kind: protocol
    statement: Reject responses MUST use `Reject` activity type
    verification: Unit tests in `test/wire/as2/factories/test_case_factories.py` confirm that reject-response factories
      return objects with `type_` equal to `'Reject'`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-004
    stories:
    - story_2022_048
    - story_2022_054
  - id: RF-03-002
    priority: SHOULD
    kind: protocol
    statement: Reject responses SHOULD include reason in `content` field
  - id: RF-03-003
    priority: MUST
    kind: protocol
    statement: >-
      Rejecting an Offer of an object MUST reference the Offer activity in the `object` field
      of the Reject response
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      `Reject` responses built from an `Offer` carry the full `Offer` activity object in the `object` field.
    lint_suppress:
    - missing_story_reference
  - id: RF-03-004
    priority: MUST
    kind: protocol
    statement: >-
      When rejecting an offered object, the `object` field of the `Reject` activity MUST reference
      the Offer activity itself, not the underlying object being offered. The Offer activity
      MUST be passed as an inline typed object, not as a bare string ID — bare string IDs
      are rejected at construction time
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      passing a bare string ID as the `object` of a `Reject` activity raises a validation error at construction time.
    lint_suppress:
    - missing_story_reference
- id: RF-04
  title: TentativeReject Response
  specs:
  - id: RF-04-001
    priority: MUST
    kind: protocol
    statement: TentativeReject responses MUST use `TentativeReject` activity type
    verification: Unit tests in `test/wire/as2/factories/test_embargo_factories.py` confirm that `TentativeReject`
      response factories produce objects with `type_` equal to `'TentativeReject'`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-004
    lint_suppress:
    - missing_story_reference
  - id: RF-04-002
    priority: SHOULD
    kind: protocol
    statement: TentativeReject responses SHOULD include reason in `content` field
  - id: RF-04-003
    priority: MUST
    kind: protocol
    statement: >-
      Tentatively Rejecting an Offer of an object MUST reference the Offer activity in the
      `object` field of the TentativeReject response
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      `TentativeReject` responses built from an `Offer` carry the full `Offer` activity object in the `object` field.
    lint_suppress:
    - missing_story_reference
  - id: RF-04-004
    priority: MUST
    kind: protocol
    statement: >-
      When tentatively rejecting an offered object, the `object` field of the `Tentative Reject`
      activity MUST reference the Offer activity itself, not the underlying object being offered.
      The Offer activity MUST be passed as an inline typed object, not as a bare string ID
      — bare string IDs are rejected at construction time
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      passing a bare string ID as the `object` of a `TentativeReject` activity raises a validation error at construction
      time.
    lint_suppress:
    - missing_story_reference
- id: RF-05
  title: Error Response
  specs:
  - id: RF-05-001
    priority: SHOULD
    kind: protocol
    statement: Error responses SHOULD use ActivityStreams error extensions
    relationships:
    - rel_type: implements
      spec_id: VP-03-010
    - rel_type: implements
      spec_id: VP-03-011
    - rel_type: implements
      spec_id: VP-11-005
- id: RF-06
  title: Response Delivery
  specs:
  - id: RF-06-001
    priority: MUST
    kind: protocol
    statement: Response activities MUST be delivered to the relevant actors' inboxes
    verification: Integration tests in `test/demo/` confirm that response activities (Accept, Reject, etc.) appear in the
      intended recipients' inboxes after processing the original inbound activity.
    lint_suppress:
    - missing_story_reference
  - id: RF-06-002
    priority: MUST
    kind: protocol
    statement: >-
      Response activities MUST be addressed to the INITIATING actor's inbox, not to the inbox
      that received the original activity
    rationale: >-
      Activities are state-change assertions; the initiator must receive the response to update
      their model of the case state
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that response activities are
      addressed to and delivered at the initiating actor's inbox, not the inbox that received the original activity.
    stories:
    - story_2022_040
- id: RF-07
  title: Response Timing
  specs:
  - id: RF-07-001
    priority: MUST_NOT
    kind: protocol
    statement: Response generation MUST NOT delay inbox acknowledgment
- id: RF-08
  title: Response Correlation
  specs:
  - id: RF-08-001
    priority: MUST
    kind: protocol
    statement: Response activities MUST include `inReplyTo` field
    verification: Unit tests in `test/wire/as2/factories/test_case_factories.py` and
      `test/wire/as2/factories/test_embargo_factories.py` confirm that response activity factories automatically
      populate `in_reply_to` from the source activity's `id_`.
    relationships:
    - rel_type: implements
      spec_id: VP-03-009
    - rel_type: implements
      spec_id: VP-11-004
    - rel_type: implements
      spec_id: VP-11-005
    stories:
    - story_2022_016
    - story_2022_059
  - id: RF-08-002
    priority: MUST
    kind: protocol
    statement: >-
      The `inReplyTo` field requirement MUST be enforced at the Pydantic model level via a
      `model_validator` on `Accept`, `Reject`, and other response activity classes, not by
      call-site convention. The validator MUST reject a response object that has a `None` or
      missing `inReplyTo` at construction time.
    rationale: >-
      Call-site convention (setting `inReplyTo` manually at every factory call site) is
      fragile: new factory paths can forget it, and there is no compile-time or model-validation
      enforcement. A `model_validator` makes the invariant intrinsic to the type and
      impossible to bypass silently.
    verification: Unit tests in `test/wire/as2/factories/test_case_factories.py` confirm that constructing an `Accept`
      or `Reject` activity with `None` or missing `in_reply_to` raises a Pydantic validation error enforced by the
      `model_validator` on the class.
    relationships:
    - rel_type: refines
      spec_id: RF-08-001
    lint_suppress:
    - missing_story_reference
- id: RF-09
  title: Idempotent Responses
  specs:
  - id: RF-09-001
    priority: MUST
    kind: protocol
    statement: Response generation MUST be idempotent
    verification: Integration tests in `test/demo/` confirm that processing the same inbound activity twice produces the
      same response without additional state changes, and `test/adapters/driving/fastapi/test_outbox_handle_item_delivery.py`
      confirms that re-delivering an outbox item does not cause duplicate side effects.
    relationships:
    - rel_type: depends_on
      spec_id: ID-02-001
    lint_suppress:
    - missing_story_reference
