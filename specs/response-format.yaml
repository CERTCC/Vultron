id: RF
title: Response Format
description: >-
  The Vultron protocol uses ActivityStreams activities for both requests and responses. When
  handlers process inbound activities, they generate response activities (Accept, Reject,
  Update, etc.) sent to the originating actor or other participants.
scope:
- prototype
- production
tags:
- wire-format
groups:
- id: RF-01
  title: Response Activity Structure
  specs:
  - id: RF-01-001
    priority: MUST
    kind: foundation
    statement: Response activities MUST conform to ActivityStreams 2.0
    rationale: >-
      Responses travel through the same AS2 inbox pipeline as every other activity. A
      response that does not conform to AS2 cannot be parsed or matched to a semantic by
      its receiver, so the initiator would never learn the answer.
    verification: >-
      `test_response_round_trips_through_the_as2_parser` in
      `test/wire/as2/factories/test_report_factories.py` confirms that an Accept, a
      Reject and a TentativeReject response serialize with the AS2 context and parse
      back to their AS2 activity types through the inbound parser.
    stories:
    - story_2022_017
    - story_2022_039
    - story_2022_058
    - story_2022_060
    tags:
    - as2
- id: RF-02
  title: Accept Response
  specs:
  - id: RF-02-001
    priority: MUST
    kind: protocol
    statement: Accept responses MUST use `Accept` activity type
    rationale: >-
      A receiver recognizes an acceptance by the activity type, and `Accept` is the AS2
      term peers match on. Any other type would not be read as an acceptance.
    verification: Unit tests in `test/wire/as2/factories/test_case_factories.py` confirm that accept-response factories
      return objects with `type_` equal to `'Accept'`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-004
    stories:
    - story_2022_016
    - story_2022_047
    - story_2022_048
    - story_2022_050
    - story_2022_051
    - story_2022_054
    - story_2022_059
  - id: RF-02-002
    priority: MUST
    kind: protocol
    statement: >-
      Accept responses MUST include `object` field referencing accepted activity or object
    rationale: >-
      An Accept with no object does not say what it accepts. An initiator with several
      requests outstanding could not tell which one changed state.
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      constructing an `Accept` response without an `object` field raises a Pydantic validation error at construction
      time.
    stories:
    - story_2022_048
    - story_2022_054
  - id: RF-02-004
    priority: MUST
    kind: protocol
    statement: >-
      When accepting an offered object, the `object` of the `Accept` activity MUST be the
      Offer activity itself, carried inline or by reference, not the underlying object being
      offered.
    rationale: >-
      An Accept of the offered object is ambiguous when that object has been offered
      more than once, and receivers match an acceptance as `Accept(Offer)`. Naming the
      Offer says which proposal was accepted. Inline or by reference leaves the form to
      the implementation (AKM-05-003).
    verification: >-
      In `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py`,
      `test_accept_refuses_the_offered_object_in_place_of_the_offer` confirms that an
      `Accept` given the offered object instead of the Offer raises a validation error, and
      `TestInlineTypedObjectAccepted` confirms that an `Accept` of the Offer is accepted.
    stories:
    - story_2022_048
    - story_2022_054
  - id: RF-02-006
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the Offer inline as the `object` of an `Accept`, as an
      inline typed activity object such as `RmSubmitReportActivity` or
      `EmProposeEmbargoActivity`.
    rationale: >-
      How this codebase meets RF-02-004; split from it so RF-02-004 states only what other
      participants observe (MS-12-010). Carrying the Offer inline rather than by reference
      is a shortcut of this prototype reference implementation, not a protocol rule.
    verification: >-
      Unit tests in
      `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      an `Accept` carries its inline typed Offer (`TestInlineTypedObjectAccepted`).
    relationships:
    - rel_type: implements
      spec_id: RF-02-004
  - id: RF-02-008
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST reject a bare string ID as the `object` of an `Accept` of an
      Offer at construction time.
    rationale: >-
      A check at construction time stops a wrong shape before any code sends it. An
      `Accept` built with a bare ID would reach the peer without the inline Offer that
      RF-02-006 requires.
    verification: >-
      `TestBareStringObjectRejected` in
      `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirms
      that passing a bare string ID as the `object` of an `Accept` activity raises a
      validation error at construction time.
    relationships:
    - rel_type: implements
      spec_id: RF-02-006
  - id: RF-02-005
    priority: MUST
    kind: protocol
    statement: >-
      When accepting an Invite, the `object` of the `Accept` activity MUST be the Invite
      activity itself, carried inline or by reference, not the case, embargo, or any other
      domain object.
    rationale: >-
      An Accept of the case or embargo does not say which Invite it answers, and several
      Invites can be open at once. Receivers match the answer as `Accept(Invite)`, so
      naming the Invite selects the right use case and closes that Invite.
    verification: >-
      In `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py`,
      `test_accept_refuses_the_offered_object_in_place_of_the_offer` confirms that the case
      or embargo in place of the Invite raises a validation error, and
      `TestInlineTypedObjectAccepted` confirms that an `Accept` of the Invite is accepted.
    relationships:
    - rel_type: refines
      spec_id: RF-02-002
    stories:
    - story_2022_048
    - story_2022_054
  - id: RF-02-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the Invite inline as the `object` of an `Accept` of an
      Invite. The Invite is a full inline typed activity object, such as
      `RmInviteToCaseActivity` or `EmInviteToEmbargoOnCaseActivity`.
    rationale: >-
      How this codebase meets RF-02-005; split from it so RF-02-005 states only what other
      participants observe (MS-12-010). Carrying the Invite inline rather than by reference
      is a shortcut of this prototype reference implementation, not a protocol rule.
    verification: >-
      In `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py`,
      `TestInlineTypedObjectAccepted` confirms that an `Accept` of an `Invite` carries
      the full inline Invite.
    relationships:
    - rel_type: implements
      spec_id: RF-02-005
  - id: RF-02-009
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST reject a bare string ID as the `object` of an `Accept` of an
      Invite at construction time.
    rationale: >-
      A check at construction time stops a wrong shape before any code sends it. An
      `Accept` built with a bare ID would reach the invitee's peers without the inline
      Invite that RF-02-007 requires.
    verification: >-
      In `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py`,
      `TestBareStringObjectRejected` confirms that a bare string ID as the `object` of
      an `Accept` of an `Invite` raises a validation error.
    relationships:
    - rel_type: implements
      spec_id: RF-02-007
- id: RF-03
  title: Reject Response
  specs:
  - id: RF-03-001
    priority: MUST
    kind: protocol
    statement: Reject responses MUST use `Reject` activity type
    rationale: >-
      A receiver recognizes a refusal by the activity type, and `Reject` is the AS2 term
      peers match on. Any other type would not be read as a refusal.
    verification: Unit tests in `test/wire/as2/factories/test_case_factories.py` confirm that reject-response factories
      return objects with `type_` equal to `'Reject'`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-004
    stories:
    - story_2022_048
    - story_2022_054
  - id: RF-03-002
    priority: SHOULD
    kind: protocol
    statement: Reject responses SHOULD include reason in `content` field
    rationale: >-
      A bare Reject tells the initiator that its proposal failed but not why, so it
      cannot correct the proposal or decide whether to escalate. A reason gives the
      participant something to act on; it is a SHOULD because a refusal can stand
      without one.
    stories:
    - story_2026_006
  - id: RF-03-003
    priority: MUST
    kind: protocol
    statement: >-
      When rejecting an offered object, the `object` of the `Reject` activity MUST be the
      Offer activity itself, carried inline or by reference, not the underlying object being
      offered.
    rationale: >-
      The Offer is the proposal the initiator tracks. Referencing it ties the Reject to
      that one proposal, so the initiator can close it, even when the same object has
      been offered more than once. Inline or by reference leaves the form to the
      implementation (AKM-05-003).
    verification: >-
      In `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py`,
      `test_reject_refuses_the_offered_object_in_place_of_the_offer` confirms that a
      `Reject` given the offered object instead of the Offer raises a validation error, and
      `TestInlineTypedObjectAccepted` confirms that a `Reject` of the Offer is accepted.
    stories:
    - story_2022_048
    - story_2022_054
  - id: RF-03-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the Offer inline as the `object` of a `Reject`, refusing a
      bare string ID there at construction time.
    rationale: >-
      How this codebase meets RF-03-003; split from it so RF-03-003 states only what
      other participants observe (MS-12-010). Carrying the Offer inline lets the
      receiver read the Offer's type without a dereference, a shortcut of this
      prototype reference implementation rather than a protocol rule (AKM-05-003).
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      passing a bare string ID as the `object` of a `Reject` activity raises a validation error at construction time.
    relationships:
    - rel_type: implements
      spec_id: RF-03-003
- id: RF-04
  title: TentativeReject Response
  specs:
  - id: RF-04-001
    priority: MUST
    kind: protocol
    statement: TentativeReject responses MUST use `TentativeReject` activity type
    rationale: >-
      A TentativeReject is a provisional refusal, which the receiver handles differently
      from a final Reject. Only a distinct activity type lets the receiver tell the two
      apart.
    verification: >-
      `test_rm_invalidate_report_returns_tentative_reject` in
      `test/wire/as2/factories/test_report_factories.py` confirms that the
      `TentativeReject` response factory produces an `as_TentativeReject`.
    relationships:
    - rel_type: implements
      spec_id: VP-06-004
    stories:
    - story_2022_014
  - id: RF-04-002
    priority: SHOULD
    kind: protocol
    statement: TentativeReject responses SHOULD include reason in `content` field
    rationale: >-
      A provisional refusal invites a revised proposal. Without a reason the initiator
      cannot tell what would make the proposal acceptable; it is a SHOULD because a
      refusal can stand without one.
    stories:
    - story_2026_006
  - id: RF-04-003
    priority: MUST
    kind: protocol
    statement: >-
      When tentatively rejecting an offered object, the `object` of the `TentativeReject`
      activity MUST be the Offer activity itself, carried inline or by reference, not the
      underlying object being offered.
    rationale: >-
      The Offer is the proposal the initiator tracks. Referencing it ties the
      TentativeReject to that one proposal, even when the same object has been offered
      more than once. Inline or by reference leaves the form to the implementation
      (AKM-05-003).
    verification: >-
      In `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py`,
      `test_tentative_reject_refuses_the_offered_object_in_place_of_the_offer` confirms
      that a `TentativeReject` given the offered object instead of the Offer raises a
      validation error, and `TestInlineTypedObjectAccepted` confirms that a
      `TentativeReject` of the Offer is accepted.
    stories:
    - story_2022_014
  - id: RF-04-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST carry the Offer inline as the `object` of a `TentativeReject`,
      refusing a bare string ID there at construction time.
    rationale: >-
      How this codebase meets RF-04-003; split from it so RF-04-003 states only what
      other participants observe (MS-12-010). Carrying the Offer inline lets the
      receiver read the Offer's type without a dereference, a shortcut of this
      prototype reference implementation rather than a protocol rule (AKM-05-003).
    verification: Unit tests in `test/wire/as2/vocab/test_actvitities/test_inline_object_required.py` confirm that
      passing a bare string ID as the `object` of a `TentativeReject` activity raises a validation error at construction
      time.
    relationships:
    - rel_type: implements
      spec_id: RF-04-003
- id: RF-05
  title: Error Response
  specs:
  - id: RF-05-001
    priority: SHOULD
    kind: protocol
    statement: Error responses SHOULD use ActivityStreams error extensions
    rationale: >-
      The protocol defines error messages whose recipients inquire about the error
      (VP-03-010, VP-03-011, VP-11-005). Expressed in the AS2 vocabulary, an error
      travels and is parsed through the same inbox pipeline as every other activity,
      with no second channel.
    relationships:
    - rel_type: implements
      spec_id: VP-03-010
    - rel_type: implements
      spec_id: VP-03-011
    - rel_type: implements
      spec_id: VP-11-005
    stories:
    - story_2026_011
- id: RF-06
  title: Response Delivery
  specs:
  - id: RF-06-001
    priority: MUST
    kind: foundation
    statement: Response activities MUST be delivered to the relevant actors' inboxes
    rationale: >-
      ActivityPub delivers every activity to the inboxes of its addressees; a response
      is no exception. Which actor a response goes to is Vultron's rule (RF-06-002).
    verification: Integration tests in `test/demo/` confirm that response activities (Accept, Reject, etc.) appear in the
      intended recipients' inboxes after processing the original inbound activity.
    stories:
    - story_2022_039
    - story_2022_040
    tags:
    - activitypub
  - id: RF-06-002
    priority: MUST
    kind: protocol
    statement: >-
      Response activities MUST be addressed to the INITIATING actor's inbox, not to the inbox
      that received the original activity
    rationale: >-
      Activities are state-change assertions; the initiator must receive the response to update
      their model of the case state
    verification: Integration tests in `test/demo/test_case_proposal_round_trip.py` confirm that response activities are
      addressed to and delivered at the initiating actor's inbox, not the inbox that received the original activity.
    stories:
    - story_2022_040
- id: RF-07
  title: Response Timing
  specs:
  - id: RF-07-001
    priority: MUST_NOT
    kind: project
    statement: Response generation MUST NOT delay inbox acknowledgment
    rationale: >-
      A sender whose POST waits on response generation can time out and retry, which
      produces duplicate deliveries, and a slow handler would hold the inbox for other
      senders. A response travels as its own activity (RF-06-001), so the acknowledgment
      needs nothing from it.
    verification: >-
      Inspection of `post_actor_inbox` in
      `vultron/adapters/driving/fastapi/routers/actors/_routes.py` confirms the endpoint
      schedules `run_inbox_pipeline`, which runs the handlers and then drains the outbox,
      with `BackgroundTasks.add_task` and returns without awaiting it;
      `test/adapters/driving/fastapi/test_inbox_orchestration_offloop.py::test_event_loop_keeps_serving_while_a_payload_is_processed`
      confirms the inbox keeps serving requests while a payload is processed.
- id: RF-08
  title: Response Correlation
  specs:
  - id: RF-08-001
    priority: MUST
    kind: protocol
    statement: Response activities MUST include `inReplyTo` field
    rationale: >-
      A participant can have several requests outstanding. `inReplyTo` names the
      activity a response answers, so the initiator matches the response to its request
      without inferring it from the object.
    verification: Unit tests in `test/wire/as2/factories/test_case_factories.py` and
      `test/wire/as2/factories/test_embargo_factories.py` confirm that response activity factories automatically
      populate `in_reply_to` from the source activity's `id_`.
    relationships:
    - rel_type: implements
      spec_id: VP-03-009
    - rel_type: implements
      spec_id: VP-11-004
    - rel_type: implements
      spec_id: VP-11-005
    stories:
    - story_2022_016
    - story_2022_059
  - id: RF-08-002
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST enforce the `inReplyTo` rule with a `model_validator` on
      `Accept`, `Reject` and the other response activity classes, not by call-site
      convention.
    rationale: >-
      Call-site convention (setting `inReplyTo` manually at every factory call site) is
      fragile: new factory paths can forget it, and there is no compile-time or model-validation
      enforcement. A `model_validator` makes the invariant intrinsic to the type and
      impossible to bypass silently.
    verification: >-
      `test_a_response_built_without_in_reply_to_names_what_it_answers` in
      `test/architecture/test_response_in_reply_to.py` builds every response class
      in `vultron/wire/as2/vocab/activities/` from its vocab example with no
      `inReplyTo` and checks that the class itself sets it. The classes that do not
      yet are listed by name in its `_KNOWN_GAP` record, owned by #5641.
      `test_rm_accept_invite_to_case_in_reply_to_auto_set` and
      `test_rm_reject_invite_to_case_in_reply_to_auto_set` in
      `test/wire/as2/factories/test_case_factories.py` check the two Invite replies.
    relationships:
    - rel_type: refines
      spec_id: RF-08-001
  - id: RF-08-003
    priority: MUST_NOT
    kind: project
    statement: >-
      The `inReplyTo` validator MUST NOT let a response activity be constructed with a
      `None` or missing `inReplyTo`.
    rationale: >-
      A response with no `inReplyTo` does not say which activity it answers. When the
      validator stops it at construction time, no code can send it.
    verification: >-
      `test_a_response_built_without_in_reply_to_names_what_it_answers` in
      `test/architecture/test_response_in_reply_to.py` builds every response class
      with no `inReplyTo` and checks that the result carries one or that
      construction fails on the missing field. The classes listed in its
      `_KNOWN_GAP` record (#5641) do not meet this yet, and
      `test_a_known_gap_class_still_builds_without_in_reply_to` keeps that record
      current.
    relationships:
    - rel_type: extends
      spec_id: RF-08-002
- id: RF-09
  title: Idempotent Responses
  specs:
  - id: RF-09-001
    priority: MUST
    kind: protocol
    statement: Response generation MUST be idempotent
    rationale: >-
      Delivery is at-least-once, so a receiver sees some activities more than once. If
      each copy produced a new response, the initiator would receive duplicate or
      conflicting answers and could apply the same state change twice.
    verification_debt: '#3612'
    relationships:
    - rel_type: depends_on
      spec_id: ID-02-001
    stories:
    - story_2026_014
