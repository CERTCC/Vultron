id: SYNC
title: Case Event Log Synchronization
description: >-
  Requirements for the append-only canonical recorded case ledger, replication transport,
  conflict handling, per-peer state tracking, and retry semantics for distributed case
  state synchronization across Participant Actors.
scope:
- prototype
- production
tags:
- protocol
- persistence
groups:
- id: SYNC-00
  title: Ledger Sync Phase Concepts
  specs:
  - id: SYNC-00-001
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: The AppendOnlyLedger phase MUST establish the local append-only case ledger with hash-chain indexing.
    rationale: >-
      Every later phase sends, checks or repairs this ledger. Without a local
      append-only ledger with a hash chain, a replica has nothing to compare and
      nothing to repair against.
  - id: SYNC-00-005
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Each entry in the AppendOnlyLedger MUST be immutable once committed.
    rationale: Immutability is the foundation of hash-chain integrity; a mutable entry would invalidate all successor
      entries and undermine replay determinism.
  - id: SYNC-00-006
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: Each entry in the AppendOnlyLedger MUST be cryptographically linked to its predecessor via a content hash,
      providing the integrity foundation for all subsequent replication phases.
    rationale: The hash link makes tampering detectable; any modification to an entry breaks the chain from that point
      forward, allowing receivers to detect corruption during replication.
  - id: SYNC-00-002
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: >-
      The LedgerFanout phase MUST implement one-way replication from the actor holding the
      CASE_MANAGER role to all Participant Actors via `Announce(CaseLedgerEntry)` messages.
      A participant replica MUST be treated as synchronized when and only when its log tail
      hash matches the CASE_MANAGER's authoritative tail hash.
    rationale: >-
      Participants need their own copy of the case ledger to know the case state.
      One-way replication from the CASE_MANAGER keeps one source of truth, so replicas
      cannot disagree about which entry is canonical. The tail hash covers the whole
      chain, so equal tail hashes prove equal ledgers. A count or an index alone cannot
      prove this.
  - id: SYNC-00-003
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: The LedgerReconciliation phase MUST extend LedgerFanout with a full synchronisation loop, retry, and
      backoff.
    rationale: >-
      Fan-out alone sends each entry once. The transport can lose a message, so a
      replica can fall behind with no way to catch up. The reconciliation loop finds
      and fills that gap. Backoff keeps the retries from overloading a peer that is
      slow or offline.
  - id: SYNC-00-007
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: When a participant's replica falls behind, the LedgerReconciliation mechanism MUST detect the gap.
    rationale: Gap detection is the precondition for triggered retry; without it, a lagging replica would remain
      silently diverged.
  - id: SYNC-00-008
    priority: MUST
    kind: architecture
    verification_debt: '#2569'
    statement: When a participant's replica falls behind, the LedgerReconciliation mechanism MUST retry entry delivery
      until the participant's tail hash converges to the CASE_MANAGER's tail hash.
    rationale: Convergence to the authoritative tail hash is the definition of a synchronised replica; retrying until
      convergence ensures eventual consistency.
  - id: SYNC-00-004
    priority: SHOULD
    kind: architecture
    statement: >-
      The PeerLedgerSync phase SHOULD enable multi-peer synchronisation between actors
      with equal standing. Where LedgerFanout assumes one actor holds CASE_MANAGER
      authority, PeerLedgerSync SHOULD allow two or more actors to reconcile their
      ledgers with each other to support federated and ownership-transfer scenarios.
    rationale: >-
      A case can move to a new owner, and a federated deployment can have more than one
      actor with authority. Fan-out from one CASE_MANAGER cannot reconcile two ledgers
      that each hold entries. A peer-to-peer phase gives those deployments a way to
      converge.
- id: SYNC-01
  title: Append-Only Log
  specs:
  - id: SYNC-01-001
    priority: MUST
    kind: protocol
    statement: The canonical recorded case ledger MUST be append-only; log entries MUST be immutable once appended
    rationale: >-
      The ledger is the record of what happened in the case. If an entry can change or
      go away, the hash chain breaks, replicas disagree, and nobody can audit the case
      history. Append-only entries let every replica apply the same history and reach
      the same case state.
    verification: >-
      Unit tests confirm that appended log entries are immutable and that any
      modification attempt is rejected.
    relationships:
    - rel_type: refines
      spec_id: SYNC-00-005
      note: Restates the immutability of SYNC-00-005 for the canonical case ledger
    stories:
    - story_2022_074
  - id: SYNC-01-002
    priority: MUST
    kind: protocol
    statement: Each log entry MUST carry a monotonically increasing, gapless index scoped to its case
    rationale: >-
      The index gives every entry one position in the case's causal order (ADR-0079).
      Because the index has no gaps, a receiver knows that an entry is missing when the
      next index it gets is too high (SYNC-14-001). A duplicate or skipped index would
      hide a lost entry or let two entries claim one position.
    adr:
    - ADR-0079
    verification: >-
      Unit tests confirm that each appended log entry carries a monotonically
      increasing index scoped to its case with no gaps or duplicates.
    stories:
    - story_2022_074
  - id: SYNC-01-003
    priority: MUST
    kind: protocol
    statement: Each log entry MUST include a cryptographic hash of its own content and MUST reference the hash of its immediate
      predecessor, forming a forward-linked hash chain (Merkle chain style)
    rationale: >-
      The content hash lets a receiver check that an entry's content matches the hash
      the entry states. The link to the predecessor's hash fixes the entry's place in
      the chain. A receiver can then detect an entry whose content does not match its
      hash and an entry in the wrong place.
    verification: >-
      Unit tests confirm that each log entry's entry_hash and prev_log_hash fields are
      correctly populated and form a valid forward-linked hash chain.
    stories:
    - story_2022_045
    - story_2022_089
  - id: SYNC-01-004
    priority: MUST
    kind: protocol
    statement: >-
      Canonical recorded log entries MUST be written only by the CASE_MANAGER.
    rationale: >-
      One writer gives one canonical order of entries. If two actors could write
      canonical entries, their ledgers could fork, and no rule could say which fork is
      the case history.
    verification: >-
      Integration tests in `test/demo/` confirm that all canonical log entry writes
      pass through the CASE_MANAGER's single authoritative write path.
    stories:
    - story_2022_045
    - story_2022_106
  - id: SYNC-01-005
    priority: MUST
    kind: protocol
    statement: The hash-chain log entry format MUST be designed to be forward-compatible with a future Merkle Tree implementation
    rationale: >-
      A Merkle tree would let a peer prove that one entry is in the ledger without
      sending the whole chain. If the entry format blocks that change, a migration
      would have to rewrite every stored ledger, which an append-only ledger forbids.
    verification: >-
      Inspection of the log entry schema confirms that hash-chain fields
      (entry_hash, prev_log_hash, log_index) are present and structured for
      forward-compatibility with a Merkle Tree implementation.
    lint_suppress:
    - missing_story_reference
- id: SYNC-02
  title: Replication Transport
  specs:
  - id: SYNC-02-001
    priority: MUST
    kind: protocol
    statement: Log replication between the CASE_MANAGER and Participant Actors MUST use ActivityStreams `Announce` activities
      as the transport envelope for canonical recorded log content
    rationale: >-
      Vultron actors talk through ActivityStreams messages, so ledger replication uses
      the same inbox, outbox and parsing path as other case messages. `Announce` tells
      the recipient about an object that already exists, which is what passing on a
      committed entry does.
    verification: >-
      Integration tests in `test/demo/` confirm that log replication messages are
      wrapped in ActivityStreams Announce activities delivered to Participant Actors.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-02-002
    priority: MUST
    kind: protocol
    statement: Each replication message MUST identify the sender, target recipient, the log entry hash, and the predecessor
      hash
    rationale: >-
      The receiver needs the sender to check that the message comes from the
      CASE_MANAGER. It needs the two hashes to find the entry's place in its chain
      before it applies anything (SYNC-03-001). Naming the recipient makes each message
      belong to one peer, so the CASE_MANAGER can track each peer's replication state
      (SYNC-04-001).
    verification: >-
      Integration tests in `test/demo/` confirm that each Announce(CaseLedgerEntry)
      identifies the sender, recipient, entry hash, and predecessor hash.
    stories:
    - story_2022_045
    - story_2022_089
  - id: SYNC-02-003
    priority: MUST
    kind: protocol
    statement: >-
      Replication MUST originate from the replication leader (the actor holding the
      CASE_MANAGER role) and be sent individually to every active participant
      (CM-10-004).
    rationale: >-
      Only the CASE_MANAGER holds the canonical ledger, so only it can send entries that
      a replica can trust. A separate message to each active participant lets the
      CASE_MANAGER track and repair each peer on its own (SYNC-04-001). Case content
      goes only to active participants, so an inert participant receives no ledger
      entries (CM-10-004, ADR-0114).
    verification: >-
      Integration tests in `test/demo/` confirm that replication originates from the
      actor holding the CASE_MANAGER role, is addressed to each active participant
      individually, and is not addressed to an inert participant.
    adr:
    - ADR-0114
    stories:
    - story_2022_045
    - story_2022_046
    - story_2022_088
  - id: SYNC-02-004
    priority: MUST
    kind: protocol
    statement: >-
      The `object` of each `Announce(CaseLedgerEntry)` activity MUST be the `CaseLedgerEntry`
      itself, carried inline or by reference, with every field the recipient needs to
      validate the hash chain (including the entry hash and its predecessor's hash).
    rationale: >-
      The recipient checks the hash chain before it applies the entry (SYNC-03-001,
      SYNC-03-006). It can do that check only when it has every field the hashes cover.
      The inline form and the by-reference form give the recipient the same entry, so
      the protocol allows either.
    verification: >-
      Integration tests in `test/demo/` confirm that Announce(CaseLedgerEntry) carries
      the CaseLedgerEntry with entry_hash and prev_log_hash.
    stories:
    - story_2022_045
  - id: SYNC-02-005
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST embed the full inline `CaseLedgerEntry` in the `object` of each
      `Announce(CaseLedgerEntry)` and MUST NOT use a URI-only reference there.
    rationale: >-
      An inline entry lets the recipient check the hash chain without a request back to
      the sender. This codebase never fetches a ledger entry that a message names by
      reference, so without the inline entry a recipient in this codebase could not
      apply the Announce at all. An entry fetched by reference passes the same checks,
      so another implementation may send a reference (SYNC-02-004).
    verification: >-
      `test/adapters/driving/fastapi/test_outbox_handle_item_delivery.py::test_handle_outbox_item_preserves_inline_case_ledger_entry_fields`
      confirms the delivered Announce(CaseLedgerEntry) carries the full inline entry,
      with entry_hash and prev_log_hash, rather than a URI-only reference;
      `test/core/use_cases/received/test_sync.py::TestAnnounceLedgerEntryReceivedUseCase::test_inline_case_ledger_entry_round_trip`
      confirms parsing keeps the inline entry's fields.
    relationships:
    - rel_type: implements
      spec_id: SYNC-02-004
- id: SYNC-03
  title: Conflict Handling
  specs:
  - id: SYNC-03-001
    priority: MUST
    kind: protocol
    statement: A receiver MUST reject a replication message whose predecessor hash does not match the receiver's current log
      tail hash
    rationale: >-
      An entry that does not extend the receiver's tail is in the wrong place for this
      replica. If the receiver applies it, the replica holds a chain that the
      CASE_MANAGER never wrote. The rejection tells the CASE_MANAGER where the
      replica's chain ends, so it can send the missing entries.
    verification: >-
      Integration tests in `test/demo/` confirm that a receiver rejects any
      replication message whose predecessor hash does not match its current log
      tail hash.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-03-002
    priority: MUST
    kind: protocol
    statement: On receiving a rejection, the sender MUST retry replication starting from the entry following the last accepted
      hash reported by the receiver
    rationale: >-
      The rejection names the last entry that the replica holds. Sending from the entry
      after it fills the gap with the fewest messages. Sending from any other point
      either skips entries the replica needs or sends entries it already has.
    verification: >-
      Integration tests in `test/demo/` confirm that after a rejection the sender
      retries replication starting from the entry following the receiver's last
      accepted hash.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-03-003
    priority: MUST_NOT
    kind: protocol
    statement: 'Replication MUST be idempotent: repeated delivery of the same log entry MUST NOT produce duplicate entries
      in the receiver''s log'
    rationale: >-
      The outbox retries and replays send entries again, so a receiver often gets one
      entry more than once. A duplicate in the log would break the gapless index and
      the hash chain, and its effects would apply twice (ID-02-001).
    verification: >-
      Integration tests in `test/demo/` confirm that delivering the same log entry
      multiple times produces exactly one entry in the receiver's log with no
      duplicates.
    relationships:
    - rel_type: implements
      spec_id: ID-02-001
      note: idempotency.md
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-03-005
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on `Reject(CaseLedgerEntry)` only when the sender is an
      active participant in the case (CM-10-004). From any other sender it MUST refuse
      the message, record no replication state for the sender, and replay no entry and
      no case to it.
    rationale: >-
      A rejection that states no ledger position, or the position of an empty chain,
      makes the CASE_MANAGER replay the whole ledger and send the case. Without this
      check, any sender could get embargoed case content just by asking. The replay
      cooldown limits how often a replay occurs, not who gets it.
    verification: >-
      A test marked `SYNC-03-005`
      sends the Reject from a non-participant and asserts `REFUSED` with an empty outbox.
    stories:
    - story_2022_035
    - story_2022_045
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
    - rel_type: refines
      spec_id: SYNC-03-002
    adr:
    - ADR-0115
  - id: SYNC-03-006
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST recompute the hash of a received `CaseLedgerEntry` from its
      content and compare it with the entry's stated `entryHash` before buffering,
      applying or storing the entry. An entry that states no hash, or whose content does
      not reproduce it, MUST be refused, and MUST NOT be buffered, applied or stored.
    rationale: >-
      The predecessor check (SYNC-03-001) proves only that an entry claims the right
      place in the chain. It does not prove that the content matches the entry's hash. A
      refused entry gets no `Reject(CaseLedgerEntry)`, because a replay would send the
      same entry again. The receiver's tail does not move, so the next entry does not
      extend it and causes a Reject in the usual way. The receiver reports the refusal
      with a processing fault instead (SYNC-03-007).
    verification: >-
      Tests marked `SYNC-03-006` deliver an entry whose content no longer matches its
      hash and assert it is not stored and not buffered.
    stories:
    - story_2022_045
    - story_2022_088
    relationships:
    - rel_type: refines
      spec_id: SYNC-01-003
    - rel_type: refines
      spec_id: SYNC-08-001
  - id: SYNC-03-007
    priority: MUST
    kind: protocol
    statement: >-
      A participant that refuses a `CaseLedgerEntry` under SYNC-03-006 MUST send
      `Create(ProcessingFault)` with failure class `LedgerEntryRefused/HashMismatch` to
      the case's CASE_MANAGER, naming the refused `Announce(CaseLedgerEntry)` by
      reference. The fault's id MUST be derived from the refused `Announce` and the
      failure class.
    rationale: >-
      The entry was received but could not be processed, which ASK-07-001 and MSM-05-001
      answer with a processing fault. Without it only the replica's log shows the
      refusal, while the CASE_MANAGER's replay resends the same entry. A hash mismatch
      is not a divergence: a fresh case copy cannot repair it, because the replica still
      cannot store the entry, so it takes this fault and not SYNC-16-001's. Like that
      fault, it is replication signalling and is never ledgered (SYNC-16-002).
    relationships:
    - rel_type: refines
      spec_id: SYNC-03-006
    - rel_type: refines
      spec_id: ASK-07-001
    verification: >-
      `test/core/behaviors/sync/test_hash_mismatch_fault.py` delivers an entry whose
      content does not reproduce its hash and asserts the replica queues the fault to
      the CASE_MANAGER and stores nothing.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-03-008
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives the SYNC-03-007 fault from an active participant of
      the case (CM-10-004), it MUST NOT send anything, re-seed the peer or record
      replication state because of the fault. From any other sender it MUST refuse the
      fault.
    rationale: >-
      A hash mismatch comes from deterministic content: a fault in rendering or parsing
      the wire form, or a broken stored entry the send-side check (SYNC-03-009) did not
      see because fan-out checked its in-memory copy. Neither a replay nor a re-seed can
      repair it; only a code fix or an operator can. The reject-and-replay loop it
      leaves is already bounded by the replay cooldown (SYNC-15-003, SYNC-15-013).
    relationships:
    - rel_type: refines
      spec_id: SYNC-03-007
    - rel_type: refines
      spec_id: SYNC-16-002
    verification: >-
      `test/core/behaviors/sync/test_hash_mismatch_fault.py::test_hash_mismatch_fault_from_an_active_participant_changes_nothing`
      asserts `SKIPPED`, an empty outbox, unchanged replication state and no new
      ledger entry for a fault from an active participant of a seeded case.
      `::test_hash_mismatch_fault_from_a_non_participant_is_refused` asserts `REFUSED`
      and the same for one from a sender that is not a participant of that case.
    stories:
    - story_2022_045
  - id: SYNC-03-010
    priority: MUST
    kind: project
    statement: >-
      When this codebase's CASE_MANAGER receives the SYNC-03-007 fault from an active
      participant of the case (CM-10-004), it MUST log the fault at ERROR, MUST
      recompute the hash of its own stored copy of the named entry as SYNC-03-006 does,
      and MUST log whether that copy is intact, or that it holds no copy of the named
      entry.
    rationale: >-
      The fault's purpose is to make the problem visible where the ledger is kept, and
      the self-check says which side is broken (SYNC-03-008).
    verification: >-
      `test/core/behaviors/sync/test_hash_mismatch_fault.py::test_hash_mismatch_fault_from_an_active_participant_is_logged_at_error`
      asserts one ERROR record naming the case, the `Announce`, the entry, the sender
      and the self-check result (intact, not intact, or no stored copy) for a fault
      from an active participant of a seeded case.
    relationships:
    - rel_type: implements
      spec_id: SYNC-03-008
  - id: SYNC-03-009
    priority: MUST
    kind: protocol
    statement: >-
      Before the CASE_MANAGER sends a `CaseLedgerEntry` in `Announce(CaseLedgerEntry)`,
      whether by fan-out, replay or backfill, it MUST recompute the entry's hash from its
      content as SYNC-03-006 does. An entry that states no hash, or whose content does
      not reproduce it, MUST NOT be sent and MUST be logged at ERROR with the case, the
      entry, its `log_index` and the recipients, and the CASE_MANAGER MUST NOT send any
      later entry of the same send. This takes precedence over SYNC-03-002, SYNC-17-004
      and CM-10-006, which otherwise oblige it to send every entry in a range.
    rationale: >-
      A broken entry in the CASE_MANAGER's own store is found where it starts, not after
      a replica refuses it (SYNC-03-006) and reports it (SYNC-03-007), and broken content
      never leaves the CASE_MANAGER. Holding the entry back stalls the replica at it, as
      sending it would. The replica's `Reject` loop stays bounded without the replay
      cooldown: a replay that starts at the broken entry, as the replica's stalled
      `Reject` makes it, sends nothing, so it records no position (SYNC-15-011), and
      the replica sends one `Reject` per later fan-out, with nothing replayed to amplify
      it. A later entry is not sent because the replica could
      only hold it as a forward gap (SYNC-14-001). The receiver's check stays, because a
      fault in rendering or parsing the wire form still shows up first at the receiver.
    relationships:
    - rel_type: refines
      spec_id: SYNC-03-006
    - rel_type: refines
      spec_id: SYNC-08-001
    - rel_type: constrains
      spec_id: SYNC-03-002
    - rel_type: constrains
      spec_id: SYNC-17-004
    - rel_type: constrains
      spec_id: CM-10-006
    verification: >-
      `test/core/behaviors/sync/test_send_side_hash_check.py` gives a send a ledger with
      an entry whose content does not reproduce its hash, and one with an entry that
      states no hash, and asserts that the entries before it are queued, that it and
      every later entry are not, and that the hold-back is logged at ERROR.
      `test/core/behaviors/sync/nodes/test_send_side_hash_check_sites.py` runs the same
      cases through each send path and asserts that the sending node returns `FAILURE`,
      except the fan-out's held-back catch-up of a paused peer, which skips that peer
      and returns `SUCCESS` (decided on #5120), and
      `test/architecture/test_send_announce_log_entry_has_one_caller.py` asserts no other
      code in `vultron/core/` calls `send_announce_log_entry`.
    stories:
    - story_2022_045
- id: SYNC-04
  title: Per-Peer Replication State
  specs:
  - id: SYNC-04-001
    priority: MUST
    kind: protocol
    statement: The replication leader MUST track per-peer state including at minimum the last acknowledged log entry hash
      for each peer
    rationale: >-
      The leader must know how far each peer has got. Without that record, it cannot
      tell a peer that is behind from one that is current. It also cannot decide where
      a replay starts or whether the replay cooldown applies (SYNC-15-008).
    verification: >-
      Integration tests in `test/demo/` confirm that the replication leader maintains
      a per-peer state record containing at minimum the last acknowledged log
      entry hash for each peer.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-04-002
    priority: MUST
    kind: project
    statement: Per-peer replication state MUST be persisted via the DataLayer so that it survives a leader restart
    rationale: >-
      If a restart loses the per-peer state, the leader forgets which peers are behind
      and how recently it replayed to them. The replay cooldown then starts again from
      zero, and a stuck peer can again cause replays without limit (SYNC-15-003).
    verification: >-
      Integration tests in `test/demo/` confirm that per-peer replication state
      survives a leader restart by verifying the acknowledged hash is restored
      from the DataLayer.
    stories:
    - story_2022_045
    - story_2022_088
- id: SYNC-05
  title: Retry and Backoff
  specs:
  - id: SYNC-05-001
    priority: SHOULD
    kind: protocol
    statement: The replication sender SHOULD implement retry with exponential backoff on delivery failure
    rationale: >-
      A peer can be offline or overloaded for some time. Retries at a fixed interval
      add load to that peer when it can least take it. Exponential backoff keeps
      retries frequent for a short fault and rare for a long one.
    verification: >-
      Integration tests in `test/demo/` confirm that the replication sender retries
      failed deliveries with exponential backoff between attempts.
    stories:
    - story_2022_088
  - id: SYNC-05-002
    priority: SHOULD
    kind: project
    statement: Retry and backoff parameters SHOULD be configurable
    rationale: >-
      Network latency and peer load differ between deployments, tests and production.
      One fixed set of values is too slow for some deployments and too aggressive for
      others.
    verification: >-
      Inspection of the replication adapter confirms that retry count and backoff
      interval are exposed as configurable parameters.
  - id: SYNC-05-003
    priority: MUST
    kind: project
    statement: Default values for retry and backoff parameters MUST be documented
    rationale: >-
      An operator must know the default values to decide whether to change them. A test
      author also needs them to know how long a recovery can take.
    verification: >-
      Inspection of the replication adapter documentation or configuration schema
      confirms that default retry and backoff parameter values are documented.
  - id: SYNC-05-004
    priority: MUST
    kind: project
    statement: >-
      The per-recipient HTTP POST timeout MUST be a configurable parameter of the
      delivery adapter with a documented default value. The default MUST be set high
      enough to tolerate a recipient that is briefly busy under normal protocol load
      (e.g. draining its own outbox); a value of 5 seconds or less is insufficient
      under CI-representative multi-actor load.
    rationale: >-
      A busy recipient, for example one that sends its own outbox, can take several
      seconds to answer. A short timeout marks a working delivery as a failure, and the
      retries add more load to that recipient. A value of 5 seconds or less fails this
      way under multi-actor load such as CI. A configurable timeout lets each
      deployment fit its load (SYNC-05-002). Other implementations can set this adapter
      limit differently, so it is `project` (ADR-0134).
    verification: >-
      Inspection of the delivery adapter confirms that the per-recipient HTTP POST
      timeout is exposed as a configurable parameter with a documented default value
      greater than 5 seconds.
    relationships:
    - rel_type: refines
      spec_id: SYNC-05-002
    adr:
    - ADR-0066
    stories:
    - story_2022_088
- id: SYNC-06
  title: Leadership and Ownership
  specs:
  - id: SYNC-06-001
    priority: SHOULD
    kind: protocol
    statement: Replication leadership SHOULD be treated as distinct from case ownership
    rationale: >-
      The Case Owner decides about the case, and the replication leader writes and sends
      the ledger. The Case Owner can hold the CASE_MANAGER role or give it to another
      actor, and a multi-node CASE_MANAGER can change its leader with no change of
      owner. If the two concepts are one, a change of either one forces a change of the
      other.
    verification: >-
      Inspection of the protocol design confirms that replication leadership is
      modelled as a distinct concept from case ownership.
  - id: SYNC-06-002
    priority: SHOULD
    kind: process
    statement: The conditions under which replication leadership changes SHOULD be documented in `notes/sync-ledger-replication.md`
    rationale: >-
      A change of leadership changes who may write the ledger. Contributors who change
      replication code must know when that can occur, so the conditions are written in
      one place.
    verification: >-
      Inspection of `notes/sync-ledger-replication.md` confirms that the conditions
      under which replication leadership changes are documented.
  - id: SYNC-06-003
    priority: MUST
    kind: protocol
    statement: >-
      In a single-node deployment, the actor holding the CASE_MANAGER role MUST be
      treated as the permanent replication leader with exclusive write authority for
      its cases; no leader-election procedure is required.
    rationale: >-
      A single-node deployment is a degenerate Raft cluster of one: there is always a
      quorum (1/1) and no election can occur, so the CASE_MANAGER is permanently the
      leader without consensus overhead. This is the expected topology for the
      prototype phase.
    verification: >-
      Integration tests in `test/demo/` confirm that in a single-node deployment the
      CASE_MANAGER actor is the sole permanent replication leader and no
      leader-election procedure is triggered.
    stories:
    - story_2022_046
    - story_2022_106
  - id: SYNC-06-004
    priority: SHOULD
    kind: project
    statement: >-
      A future multi-node CASE_MANAGER cluster (Phase 3) SHOULD provide high-availability write
      authority via Raft consensus. This is a distinct replication tier from participant
      replication: participant replication (LedgerFanout) is pull-based fan-out via
      `Announce(CaseLedgerEntry)`, whereas the multi-node CASE_MANAGER cluster uses Raft
      consensus to elect a single write authority among CASE_MANAGER nodes. The two tiers
      operate independently and SHOULD NOT be conflated.
    rationale: >-
      Participant replication and a highly available CASE_MANAGER solve different
      problems. Participant replication sends committed entries to other actors. A Raft
      cluster decides which CASE_MANAGER node may commit. If the two tiers are mixed, a
      participant could seem to take part in the choice of the case's writer, which the
      single-writer rule forbids (SYNC-01-004).
    verification: >-
      Inspection of design documentation confirms that the multi-node Phase 3 Raft
      cluster and participant LedgerFanout replication are described as two
      distinct tiers that must not be conflated.
- id: SYNC-09
  title: Commit Discipline
  specs:
  - id: SYNC-09-001
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST treat a log entry as committed only after it has been
      durably written to the authoritative log and its content hash has been recorded;
      an entry that has not met these conditions MUST NOT be applied to the case state
      machine.
    rationale: >-
      If an actor applies an entry that is not yet durable, a crash can leave state
      changes with no entry that records them. The replica then holds state that its
      ledger cannot explain, and a replay cannot rebuild it.
    verification: >-
      Integration tests in `test/demo/` confirm that log entries are not applied to
      case state until after the entry has been durably written with its content hash
      recorded in the authoritative log.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-09-002
    priority: MUST
    kind: protocol
    statement: >-
      A node MUST commit the `CaseLedgerEntry` that records a Vultron message it
      sends only after the message has been written to its own outbox, and MUST NOT
      commit it before that write. `Announce(CaseLedgerEntry)` is the one message
      sent after its commit: it delivers a committed entry, and is not an act the
      ledger records.
    rationale: >-
      A ledger entry records a complete act, and a send is complete when the message is
      in the sender's outbox, which owns delivery and retries. An entry committed
      before the send records an intention that may never become true, and its fan-out
      can reach a replica before the message it records. A retry after a failed commit
      rebuilds the activity under its first id. The outbox does not queue it again
      while it is pending (OX-06-002), and the receiver drops a copy it already has
      (ID-02-001).
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py::TestStubInviteIsRecordedAfterItIsSent`,
      `test/core/use_cases/received/actor/test_invite.py::TestInviteActorUseCases::test_the_full_case_invite_is_recorded_after_the_accepts_entries`,
      `test/core/behaviors/embargo/nodes/test_relay.py::TestRelayEmbargoInviteToEachNode::test_each_invite_is_queued_before_it_is_committed`,
      `test/core/use_cases/triggers/embargo/test_terminate.py::test_manager_teardown_is_queued_before_it_is_committed`
      and
      `test/core/use_cases/triggers/case/test_create.py::TestCreateCaseTriggerLedger::test_the_create_is_queued_before_the_creation_entries`
      record each outbox write and each commit in order and assert that every sent
      activity is queued before the entry recording it.
    adr:
    - ADR-0119
    stories:
    - story_2022_045
    - story_2022_081
  - id: SYNC-09-003
    priority: MUST
    kind: project
    statement: The CASE_MANAGER's behavior tree execution MUST be gated on holding the replication leadership role.
    rationale: In single-node deployments this gate is trivially satisfied. In multi-node deployments it prevents a
      deposed leader from continuing to write to the ledger after a new leader is elected.
    verification: >-
      Integration tests in `test/demo/` confirm that the CASE_MANAGER's behavior tree
      refuses to execute case actions when the replication leadership role is not held.
    stories:
    - story_2022_046
    - story_2022_106
  - id: SYNC-09-004
    priority: MUST
    kind: project
    statement: In a multi-node deployment, the CASE_MANAGER's replication leadership gate MUST be checked against the
      Raft leader state.
    rationale: Raft leader state is the authoritative source of leadership in a multi-node cluster; checking any other
      mechanism risks split-brain writes.
    verification: >-
      Inspection of the leadership gate implementation confirms that in a multi-node
      deployment it reads the Raft leader state as its authoritative source rather than
      any other mechanism.
    stories:
    - story_2022_046
    - story_2022_106
- id: SYNC-07
  title: Testing
  specs:
  - id: SYNC-07-001
    priority: MUST
    kind: project
    statement: 'Unit tests MUST cover append-only semantics: entries are immutable, hashes are unique, and predecessor hash
      references are set correctly'
    rationale: >-
      Immutable entries, unique hashes and correct predecessor links are what every
      other replication rule depends on. A fault in them breaks every replica, so unit
      tests must find it before integration tests do.
    verification: >-
      Unit tests confirm append-only semantics: entries are immutable once committed,
      content hashes are unique, and each entry's prev_log_hash correctly
      references its predecessor.
  - id: SYNC-07-002
    priority: MUST
    kind: project
    statement: 'Integration tests MUST cover the full single-peer replication cycle: leader appends an entry, sends an `Announce`
      activity, and the receiver validates the predecessor hash and appends the entry'
    rationale: >-
      Each step can pass its own unit test while the steps fail together, for example
      when the sender and the receiver disagree on the wire form. Only a test of the
      full cycle shows that an entry gets from the leader into a replica.
    verification: >-
      Integration tests in `test/demo/` confirm the full single-peer replication
      cycle: leader appends an entry, sends an Announce, and the receiver
      validates the predecessor hash and appends the entry.
  - id: SYNC-07-003
    priority: MUST
    kind: project
    statement: 'Tests MUST cover conflict and idempotency scenarios: mismatched predecessor hash, duplicate delivery, and
      leader retry after rejection'
    rationale: >-
      A mismatched hash, a duplicate delivery and a retry after a rejection are the
      normal results of an unordered transport that can lose messages. These paths run
      less often than the normal path, so a fault in them can stay hidden without a
      test.
    verification: >-
      Integration tests in `test/demo/` confirm conflict and idempotency scenarios:
      mismatched predecessor hash is rejected, duplicate delivery produces no
      duplicates, and the leader retries after rejection.
  - id: SYNC-07-004
    priority: MUST
    kind: project
    verification: >-
      `test/core/models/test_pending_assertion.py` covers each behaviour in its own
      suite: `TestAddAndIsSuppress`, `TestClear`, `TestTimeout`, `TestZeroTimeout` and
      `TestExpireTimedOut`.
    statement: >-
      Unit tests MUST cover pending-assertion suppression semantics: add,
      is_suppressed, clear, timeout expiry, zero-timeout disable, and the
      expire_timed_out sweep helper.
    rationale: >-
      The pending-assertion store decides whether a participant sends an assertion
      again. A fault in it either sends duplicates to the CASE_MANAGER or stops a
      resend that the case needs. Each operation has its own edge case, such as a zero
      timeout that turns suppression off, so each needs its own test.
  - id: SYNC-07-005
    priority: MUST
    kind: project
    verification: >-
      `test/core/models/test_pending_assertion.py::TestRegistry` covers distinct
      per-actor stores, the configurable timeout applied on first creation, and
      `_reset_stores` cleanup.
    statement: >-
      Unit tests MUST cover per-actor pending-assertion store isolation via
      the module-level registry: distinct store instances per actor, configurable
      timeout applied on first creation, and _reset_stores cleanup.
    rationale: >-
      Several actors can run in one process, for example in tests and in the demo. If
      two actors share one store, a pending assertion of one actor suppresses a send of
      the other. A store that a test leaves behind can also change the result of a
      later test.
- id: SYNC-08
  title: System Invariants
  specs:
  - id: SYNC-08-001
    priority: MUST
    kind: protocol
    statement: 'Append-only integrity: log entries MUST be immutable once committed and MUST be uniquely identified by their
      content hash'
    rationale: >-
      Replays and the drain find an entry by its hash. If two different entries could
      have the same hash, or an entry could change after commit, a replica could apply
      the wrong entry and still pass the chain check.
    verification: >-
      Unit tests confirm that log entries are immutable once committed and that each
      entry is uniquely identified by its content hash.
    relationships:
    - rel_type: refines
      spec_id: SYNC-00-005
      note: Restates the immutability of SYNC-00-005 as a system invariant
    stories:
    - story_2022_045
    - story_2022_089
  - id: SYNC-08-002
    priority: MUST
    kind: protocol
    statement: 'Deterministic projection: given an identical canonical recorded log prefix, all compliant implementations
      MUST derive identical state'
    rationale: >-
      Each replica gets its case state from the ledger. The ledger keeps replicas in
      step only if the same entries always give the same state, on every
      implementation. Any other input, such as the local clock or the arrival order,
      would let two replicas with the same ledger disagree.
    verification: >-
      Unit tests confirm that two compliant implementations processing an identical
      canonical log prefix derive identical case state after replay.
    stories:
    - story_2022_045
    - story_2022_088
    - story_2022_106
  - id: SYNC-08-003
    priority: MUST_NOT
    kind: protocol
    statement: 'Idempotent replay: reprocessing any canonical recorded log prefix (including duplicates) MUST NOT change the
      resulting state'
    rationale: >-
      Replays, retries and restarts make an actor process some entries more than once.
      If a second pass changed the state, recovery itself would corrupt the case.
    verification: >-
      Unit tests confirm that reprocessing any canonical log prefix, including with
      duplicate entries, produces the same resulting state as a single-pass replay.
  - id: SYNC-08-004
    priority: MUST_NOT
    kind: protocol
    statement: 'Monotonic visibility: participants MUST NOT regress their acknowledged log position'
    rationale: >-
      The CASE_MANAGER uses each peer's acknowledged position to decide what to send
      and when to replay. A position that moves back would make it send again entries
      the peer already holds, and could reset the replay cooldown. An acknowledged
      entry stays in the peer's append-only ledger, so a lower position is never true.
    verification: >-
      Integration tests in `test/demo/` confirm that participants never acknowledge a
      log position lower than one previously acknowledged.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-08-005
    priority: MUST
    kind: protocol
    statement: 'Reject-on-divergence: entries that do not extend the current hash chain MUST be rejected and MUST trigger
      resynchronization'
    rationale: >-
      "Rejected" means "not applied and not persisted as the current tail"; it
      does NOT require discarding the entry. A forward-gap entry (a valid entry
      whose predecessor has not yet arrived) MAY be retained in the non-ledger
      holding area of SYNC-14 pending its predecessor, and MUST still trigger
      resynchronization (the Reject remains the backstop for genuinely lost
      entries). See ADR-0037 (docs/adr/0037-buffer-out-of-order-ledger-entries.md).
    verification: >-
      Integration tests in `test/demo/` confirm that an entry whose predecessor hash
      does not match the current chain tail is rejected and triggers
      resynchronization.
    adr:
    - ADR-0037
    stories:
    - story_2022_045
    - story_2022_088
- id: SYNC-10
  title: Catch-Up Gate Before New Actions
  specs:
  - id: SYNC-10-001
    priority: MUST
    kind: protocol
    statement: >-
      After actor process restart or recovery, an actor with case state in scope MUST re-establish
      case-ledger freshness with the CASE_MANAGER before taking new protocol-significant case actions
    rationale: >-
      After a restart, an actor can have missed entries while it was down. If it acts
      on that old view, it can propose or answer from a case state that the missed
      entries have changed. Catching up first makes its next action rest on the current
      case history (ADR-0018).
    verification: >-
      `test/core/behaviors/sync/test_commit_tree.py::test_commit_tree_blocked_when_ledger_has_gap`
      confirms that the gate blocks when the committed prefix has a gap (simulating
      post-restart state where the DataLayer has entries 0 and 2 but is missing
      entry 1). The behavior tree returns FAILURE and no new entry is persisted.
    stories:
    - story_2022_045
    - story_2022_088
    adr:
    - ADR-0018
  - id: SYNC-10-002
    priority: MUST
    kind: protocol
    statement: >-
      While catch-up freshness is not established, the actor MUST block or defer new
      protocol-significant case actions and surface an explicit stale-or-catching-up
      condition
    rationale: >-
      An action taken from a stale view can conflict with entries the actor has not
      seen, and blocking the action prevents this. A visible stale condition tells an
      operator or a test why the action did not run, so a stuck catch-up does not look
      like a silent failure.
    verification: >-
      `test/core/behaviors/sync/test_commit_tree.py::test_commit_tree_blocked_when_ledger_has_gap`
      confirms that `CheckLedgerFreshnessNode` returns FAILURE (blocking the mint
      sequence) when the ledger has a gap, and that the WARNING emitted by
      `CheckLedgerFreshnessNode` surfaces the stale-or-catching-up condition
      (SYNC-10-002).
    stories:
    - story_2022_088
    adr:
    - ADR-0018
  - id: SYNC-10-003
    priority: SHOULD
    kind: protocol
    statement: >-
      Catch-up freshness checks SHOULD use the actor's last acknowledged canonical hash and
      replay mechanisms so that action gating is based on canonical log position, not local
      wall-clock assumptions
    rationale: >-
      Clocks on different actors do not agree, and the time since the last message does
      not show whether an entry is missing. The hash of the last canonical entry is the
      same on every replica that holds the same prefix, so it is a reliable test of
      freshness.
    adr:
    - ADR-0018
  - id: SYNC-10-004
    priority: MUST
    kind: protocol
    statement: >-
      The catch-up gate MUST require a contiguous canonical log prefix from genesis through
      the actor's currently acknowledged tip; any gap in that prefix MUST block
      protocol-significant case actions
    rationale: >-
      A gap means that a committed effect is missing from the replica's case state. An
      action based on that state can contradict the missing entry. The hash chain shows
      a gap directly, so the gate can test for it without a request to the
      CASE_MANAGER.
    verification: >-
      Integration tests in `test/demo/` confirm that the catch-up gate blocks protocol
      actions when any gap exists in the canonical log prefix between genesis and the
      actor's acknowledged tip.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-10-005
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The catch-up gate MUST NOT require the actor's acknowledged tip to equal the CASE_MANAGER's
      current ledger tip; lagging behind the leader tip is allowed if the actor's own
      acknowledged prefix is contiguous from genesis
    rationale: >-
      Fan-out is asynchronous, so a participant is often a few entries behind the
      CASE_MANAGER. If the gate required the latest tip, an active case would block
      almost every action. A contiguous prefix is enough to make the actor's own view
      consistent, and the later entries reach it in time.
- id: SYNC-11
  title: Participant-Local Pending Assertion Suppression
  specs:
  - id: SYNC-11-001
    priority: SHOULD
    kind: project
    statement: >-
      A participant actor SHOULD maintain an actor-local, in-memory pending-assertion store
      that records outbound assertion activities (e.g., Add(Note)) emitted toward the
      CASE_MANAGER but not yet confirmed by a canonical Announce(CaseLedgerEntry) round-trip;
      the suppression window is configurable and zero disables suppression
    rationale: >-
      A participant's assertion takes some time to come back as a committed entry. In
      that time, the participant's own logic can decide again to send the same
      assertion. Without a record of what is pending, the CASE_MANAGER receives
      duplicates. A configurable window lets a deployment match it to its round-trip
      time, and zero turns the feature off.
  - id: SYNC-11-002
    priority: SHOULD
    kind: project
    statement: >-
      After a participant successfully enqueues an assertion activity toward the CASE_MANAGER,
      the participant SHOULD record the (case_id, semantic_type, activity_id) triple in its
      pending-assertion store so that duplicate near-term re-emits of the same assertion are
      suppressed while the round-trip is pending
    rationale: >-
      The triple identifies the pending assertion exactly enough to match a later send
      of the same assertion. Recording it only after the enqueue succeeds means that a
      failed send is never suppressed.
  - id: SYNC-11-003
    priority: SHOULD
    kind: project
    statement: >-
      When a participant receives a matching Announce(CaseLedgerEntry) whose log_object_id
      equals a pending assertion's object_id, the participant's pending-assertion store
      SHOULD clear the matching entry so that future re-emits of the same triple are no
      longer suppressed
    rationale: >-
      The matching entry proves that the CASE_MANAGER committed the assertion. After
      that, a later send of the same triple is a new decision, not a duplicate, so the
      store must not suppress it.
  - id: SYNC-11-004
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/core/behaviors/embargo/nodes/test_terminate.py::TestTeardownAsk::test_the_manager_reaching_the_ask_is_a_wiring_fault`
      confirms the CASE_MANAGER reaching the embargo-teardown ask records no pending
      assertion; inspection confirms no other CASE_MANAGER commit path reads or writes
      the pending-assertion store.
    statement: >-
      The CASE_MANAGER MUST NOT use the pending-assertion store for its own ledger commits;
      the CASE_MANAGER's DataLayer idempotency check already guards against duplicate commits
      by the single authoritative writer
    rationale: >-
      The CASE_MANAGER commits its own entries, so it has no round trip to wait for.
      Its DataLayer idempotency check already stops duplicate commits. A second
      mechanism on that path could suppress a commit that the case needs.
  - id: SYNC-11-005
    priority: SHOULD
    kind: project
    statement: >-
      A pending assertion that exceeds its configured timeout window SHOULD be marked
      timed-out and SHOULD no longer suppress future re-emits, allowing operator retry or
      the catch-up gate to resubmit the assertion
    rationale: >-
      An assertion can be lost in transit or refused, and then no matching entry comes
      back. Without a timeout, the store would suppress every later send of it, and the
      participant could never make the assertion again.
- id: SYNC-12
  title: Effects-Before-Persist Invariant
  specs:
  - id: SYNC-12-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST apply all domain effects derived from a CaseLedgerEntry (embargo
      teardown, participant-status update, note attachment, invite-accept) BEFORE persisting
      the entry to its local ledger; if any effect fails, the entry MUST NOT be persisted
    rationale: >-
      A stored entry is the replica's proof that the entry's effects were applied
      (SYNC-12-002). If the replica stored the entry first and an effect then failed,
      the already-stored check (SYNC-12-003) would skip that effect on every later
      delivery. The replica would keep a case state that its ledger does not explain.
    verification: >-
      Integration tests in `test/demo/` confirm that domain effects (embargo teardown,
      participant-status update, note attachment, invite-accept) are applied before a
      CaseLedgerEntry is persisted and that a failed effect prevents persistence.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-12-002
    priority: MUST
    kind: protocol
    statement: >-
      The presence of a CaseLedgerEntry in a participant's local ledger MUST imply that all
      domain effects for that entry were successfully applied; a persisted entry with
      unapplied effects is a protocol violation
    rationale: >-
      The already-stored check (SYNC-12-003) and the drain both rely on this meaning.
      If a stored entry could have missing effects, nothing would ever apply them, and
      the replica would differ from the CASE_MANAGER permanently.
    verification: >-
      Integration tests in `test/demo/` confirm that any CaseLedgerEntry found in the
      local ledger corresponds to one whose domain effects were all successfully applied
      before persistence.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-12-003
    priority: MUST
    kind: protocol
    statement: >-
      When a participant receives a CaseLedgerEntry that is already present in its local
      ledger, the participant MUST skip both effects and persist (treat as already-done);
      re-applying effects to a stored entry is not permitted because the entry's effects
      were applied exactly once before the initial persist
    rationale: >-
      Duplicate delivery is normal under retries and replays. The effects of a stored
      entry were applied once, before the entry was stored (SYNC-12-001). Applying them
      again would repeat state changes such as a status update or an embargo teardown.
    verification: >-
      Integration tests in `test/demo/` confirm that a duplicate Announce(CaseLedgerEntry)
      for an already-stored entry triggers neither effect application nor a second persist.
    stories:
    - story_2022_045
    - story_2022_088
- id: SYNC-13
  title: Ledger Write Ownership and Layer Boundary
  description: >-
    SYNC-12's already-stored gate (SYNC-12-003) uses the presence of a CaseLedgerEntry in
    an actor's DataLayer as the sole evidence that the entry's effects were already applied.
    That inference is only sound if the ONLY thing that ever writes a CaseLedgerEntry to the
    DataLayer is the core write path that also applies the effects. If any other layer (e.g.
    a wire/adapter parse or rehydration helper) creates a CaseLedgerEntry record, the gate
    fires SUCCESS on first delivery and the effects are silently skipped. These requirements
    make the write-ownership boundary that SYNC-12 depends on explicit.
  specs:
  - id: SYNC-13-001
    priority: MUST
    kind: project
    statement: >-
      A CaseLedgerEntry record is written to an actor's DataLayer ONLY by that actor's core
      ledger write path — the CASE_MANAGER's authoritative append (SYNC-01-004) for its own
      case, or a participant's PersistReceivedLogEntry step (SYNC-12-001) for a replica.
      Presence of a CaseLedgerEntry in the DataLayer is defined to mean "this actor's core
      has committed the entry and applied its effects."
    rationale: >-
      The already-stored check (SYNC-12-003) reads a stored entry as proof that its
      effects were applied. That proof holds only when the code that stores the entry
      is the code that applies its effects. If another path stores an entry, the check
      succeeds on first delivery and the effects never run.
    verification: >-
      Integration tests in `test/demo/` confirm that no code path other than the
      CASE_MANAGER's authoritative append or the participant's PersistReceivedLogEntry step
      writes a CaseLedgerEntry to the DataLayer.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-12-002
      note: SYNC-12-002 relies on this write-ownership guarantee to hold
    stories:
    - story_2022_045
  - id: SYNC-13-002
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/adapters/driving/fastapi/test_ingress_ledger_entry_routing.py::test_ingress_routes_ledger_entry_without_prestoring_entry`
      confirms the FastAPI ingress adapter does not persist the inline
      `CaseLedgerEntry`; inspection confirms no other adapter, wire, transport or
      parsing module saves one.
    statement: Adapter, wire, transport, and message-parsing code MUST NOT create, save, or otherwise persist a
      `CaseLedgerEntry` to the DataLayer.
    rationale: Ingress code delivers the message; it does not write the ledger. Any ingress write would bypass the
      write-ownership guarantee that SYNC-12 depends on and silently skip effects on first delivery.
  - id: SYNC-13-005
    priority: MUST
    kind: protocol
    statement: >-
      `CaseLedgerEntry` records for a case's authoritative ledger MUST be authored only
      by the case's CASE_MANAGER; no other actor may write authoritative case ledger
      entries.
    rationale: The CASE_MANAGER's single authoritative write path is the enforcement mechanism for the ledger's
      append-only integrity and the write-ownership guarantee required by SYNC-12.
    verification: >-
      Integration tests in `test/demo/` confirm that CaseLedgerEntry creation for the
      primary case is confined to the CASE_MANAGER's authoritative write path and no other
      component creates such records.
    relationships:
    - rel_type: refines
      spec_id: SYNC-01-004
      note: Restates the single-writer rule of SYNC-01-004 for `CaseLedgerEntry` records
    stories:
    - story_2022_045
    - story_2022_046
  - id: SYNC-13-006
    priority: MUST
    kind: protocol
    statement: >-
      Participants MUST obtain replica `CaseLedgerEntry` records solely from received
      `Announce(CaseLedgerEntry)` activities.
    rationale: Channelling all replica writes through the receive behavior tree ensures that effects are applied in
      the correct order and that the already-stored gate (SYNC-12-003) is the sole idempotency mechanism.
    verification: >-
      Integration tests in `test/demo/` confirm that participant replicas only acquire
      CaseLedgerEntry records through the Announce(CaseLedgerEntry) receive behavior tree.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-13-003
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/adapters/driving/fastapi/test_ingress_ledger_entry_routing.py::test_ingress_routes_ledger_entry_without_prestoring_entry`
      confirms routing resolves an inbound `Announce(CaseLedgerEntry)` from the
      in-memory entry without pre-storing it.
    statement: >-
      Message ingress MUST NOT use the canonical ledger/DataLayer store as a scratch or
      lookup cache for routing, semantic classification, or rehydration of an inbound
      Announce(CaseLedgerEntry). The inline CaseLedgerEntry parsed from the wire envelope
      MUST be carried forward in-memory (or via a dedicated, non-ledger holding area)
      so that semantic routing and effect application do not depend on pre-storing the entry.
    rationale: >-
      If ingress stores an inbound entry to classify or rehydrate it, the entry is in
      the DataLayer before its effects run. The already-stored check (SYNC-12-003) then
      skips the effects on first delivery (SYNC-13-001). An in-memory entry lets
      routing work without that write.
  - id: SYNC-13-004
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST treat an inbound Announce(CaseLedgerEntry) as the announcement of
      a ledger entry on first delivery, without needing any stored record of the entry;
      whether the entry is already stored (SYNC-12-003) MUST be the only test that
      distinguishes first delivery from repeat delivery.
    rationale: >-
      On first delivery the receiver has no stored record of the entry, so routing
      cannot depend on one. One test for repeat delivery keeps all implementations in
      agreement about when effects run. A second test could disagree with it and skip
      or repeat effects.
    verification: >-
      Integration tests in `test/demo/` confirm that an inbound Announce(CaseLedgerEntry)
      is routed to ANNOUNCE_CASE_LEDGER_ENTRY on first delivery, without a DataLayer
      lookup.
    stories:
    - story_2022_045
  - id: SYNC-13-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST resolve an inbound Announce(CaseLedgerEntry) to the log-entry
      semantic (ANNOUNCE_CASE_LEDGER_ENTRY) on first delivery using the typed inline object
      obtained during parsing, without a DataLayer round-trip.
    rationale: >-
      This codebase never fetches a ledger entry that a message names by reference, so
      the inline object is the only input the classifier has. Classification from it
      works because this codebase sends the entry inline (SYNC-02-005). A classifier
      that needed a stored entry would fail on the first delivery of each entry, which
      the receiver has not stored yet.
    verification: >-
      `test/core/use_cases/received/test_sync.py::TestAnnounceLedgerEntryReceivedUseCase::test_semantic_type_is_correct` confirms an inbound
      Announce(CaseLedgerEntry) carrying the typed inline entry is classified as
      ANNOUNCE_CASE_LEDGER_ENTRY from the parsed activity alone, with nothing stored.
    relationships:
    - rel_type: implements
      spec_id: SYNC-13-004
- id: SYNC-14
  title: Out-of-Order Entry Buffering and Drain
  description: >-
    Announce(CaseLedgerEntry) is delivered over a transport with no ordering guarantee, and
    Vultron may not be the only implementation on the wire, so a replica can receive an entry
    before its hash-chain predecessor. Dropping such an entry and relying on a reject/replay
    round-trip does not converge under adversarial reordering, because replay re-announces
    entries individually over the same unordered transport (they can reorder and be dropped
    again). These requirements make replica convergence independent of delivery order by
    holding the received Announce of a forward-gap entry in a non-ledger holding area and
    replaying it, in hash-chain order, once the entry that closes the gap is committed.
    What is held and replayed is the Announce that was received, never one the replica
    builds. Rationale: ADR-0037 (docs/adr/0037-buffer-out-of-order-ledger-entries.md),
    ADR-0135.
  specs:
  - id: SYNC-14-001
    priority: MUST
    kind: protocol
    statement: >-
      When a participant receives a valid Announce(CaseLedgerEntry) whose prev_log_hash does
      not match its current chain tail but whose log_index is strictly greater than
      tail_index + 1 (a forward gap), the participant MUST NOT permanently discard the entry;
      it MUST retain the Announce(CaseLedgerEntry) that carried it, as the body that arrived
      (VM-08-002), in a holding area pending arrival of its predecessor. It MUST NOT retain
      the entry apart from that Announce.
    rationale: >-
      The hash chain makes it safe to hold an entry for any length of time. The replica
      applies a held entry only after it commits an entry whose `entry_hash` equals the
      held entry's `prev_log_hash`, so a fork or a rewrite cannot act as the
      predecessor. The replica holds the Announce and not the entry alone, so the drain
      applies what the replica received. An entry held alone can only reach the inbox
      again inside an Announce that the replica makes up, which names a sender that
      never sent it.
    adr:
    - ADR-0037
    - ADR-0135
    verification: >-
      `test/core/use_cases/received/test_sync.py` asserts that a forward-gap
      Announce(CaseLedgerEntry) is held as the body intake archived, with no ledger entry
      stored; integration tests in `test/demo/` confirm a forward-gap entry is retained
      rather than permanently discarded.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-14-002
    priority: MUST
    kind: protocol
    statement: >-
      A forward-gap entry whose Announce is held MUST still trigger resynchronization (SYNC-08-005)
      — the participant MUST send Reject(CaseLedgerEntry) carrying its last accepted hash so
      the CASE_MANAGER replays entries that are genuinely lost (never delivered) rather than
      merely reordered.
    rationale: >-
      Holding an entry covers an entry that arrives out of order. It does not cover an
      entry that was lost. The Reject tells the CASE_MANAGER where the replica's chain
      ends, so the lost entry is sent again. Without it, a replica with a lost entry
      would hold its later entries permanently.
    adr:
    - ADR-0037
    verification: >-
      Integration tests in `test/demo/` confirm that holding a forward-gap entry causes a
      Reject(CaseLedgerEntry) carrying the last accepted hash to be sent to the CASE_MANAGER.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-14-003
    priority: MUST
    kind: protocol
    statement: >-
      After a participant commits a CaseLedgerEntry, it MUST drain the holding area: for each
      newly committed tail, it MUST locate the held Announce (if any) whose entry's
      prev_log_hash equals the new tail's entry_hash, apply that entry, and repeat, cascading
      until no held Announce extends the current tail.
    rationale: >-
      A held entry can apply only after its predecessor. Each commit can make one held
      entry appliable, and that entry can make the next one appliable. If the drain
      stopped after one step, entries that arrived early would stay held until some
      other delivery came.
    adr:
    - ADR-0037
    verification: >-
      Integration tests in `test/demo/` confirm that committing a CaseLedgerEntry triggers a
      cascading drain of held entries whose prev_log_hash chains from the new tail.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-14-004
    priority: MUST
    kind: protocol
    statement: >-
      Draining a held entry MUST apply the entry's domain effects before
      persisting it (SYNC-12-001).
    rationale: >-
      A drained entry becomes a stored entry like any other. The already-stored check
      relies on every stored entry having its effects applied, so the drain must keep
      the same order (SYNC-12-001).
    adr:
    - ADR-0037
    verification: >-
      Integration tests in `test/demo/` confirm that the drain path applies domain effects
      before persisting each drained entry, satisfying the effects-before-persist invariant.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-12-001
      note: The drain MUST preserve the effects-before-persist invariant per applied entry
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-14-007
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: The drain path MUST NOT re-apply effects for an entry already present in the local ledger (SYNC-12-003).
    rationale: Re-applying effects for a previously committed entry would cause duplicate state transitions and violate
      the idempotency guarantee established by SYNC-12-003.
      A replayed Announce reaches the same already-stored check as any delivery
      (SYNC-14-008), so an entry committed between its hold and its replay is
      skipped, not applied again.
  - id: SYNC-14-008
    priority: MUST
    kind: protocol
    statement: >-
      Applying a drained entry MUST follow the same apply-then-persist rules as in-order
      delivery, starting from the held Announce as in-order delivery starts from the
      received one.
    rationale: >-
      A separate drain path can drift away from the in-order path. A drained entry
      could then apply its effects after it is stored, or skip a check that in-order
      delivery makes. One shared path keeps the effects-before-persist rule true for
      every entry (SYNC-12).
    verification: >-
      Inspection of the drain implementation confirms that it calls the same
      apply-then-persist function as the in-order delivery path rather than a separate
      code path.
    stories:
    - story_2022_045
  - id: SYNC-14-009
    priority: MUST
    kind: project
    statement: >-
      When a held Announce(CaseLedgerEntry) becomes appliable, either because a
      participant committed its entry's predecessor or because the participant
      seeded the case (SYNC-15-005), the drain MUST replay that held Announce
      through the receiving actor's own inbox processing as a delivery of its
      own, through the inbox's sole entry point (IO-02-003) and under the
      receiving actor, rather than running its tree inside the delivery that
      made it appliable. The replay MUST be the Announce that was received,
      parsed again from the body held for it, so it carries the first
      delivery's received evidence (VM-08-002); the participant MUST NOT build
      an Announce of its own, or attribute one to the CASE_MANAGER or to any
      sender that did not send it. The replayed Announce's own tree replays the
      next one, so the cascade (SYNC-14-003) needs no loop in the use case.
    rationale: >-
      One delivery runs one tree (CLP-10-005), so a drain that ran its successor inline
      would run several trees in one delivery. A drain inside the tree would run one
      tree inside another, and an internal error in the inner tree would then not be
      reported. A delivery of its own goes through the same path as in-order delivery
      (SYNC-14-008, ADR-0135). The replay must be the Announce that arrived, because
      intake archives what it receives as received evidence. A receiver that did not
      receive an Announce cannot make one up.
    verification: >-
      `test/core/use_cases/received/test_sync.py` asserts that committing an
      entry whose successor's Announce is held replays that Announce, by its
      own id and with its own sender and received body, and runs no second
      tree in the same `execute()`;
      `test/core/use_cases/received/actor/test_announce.py` asserts the same
      for an Announce held before the case was seeded; and
      `test/adapters/driving/fastapi/test_ledger_replay_pipeline.py` asserts an
      out-of-order pair and a pre-genesis pair converge through the replay,
      with an intake archive that holds each delivered body once, as it
      arrived, and no record of an Announce nobody sent.
    relationships:
    - rel_type: refines
      spec_id: SYNC-14-008
    - rel_type: refines
      spec_id: SYNC-15-005
    - rel_type: refines
      spec_id: CLP-10-005
    - rel_type: refines
      spec_id: SYNC-14-001
    adr:
    - ADR-0135
  - id: SYNC-14-005
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms the out-of-order holding area holds received Announces, apart
      from the ledger, and that a held entry is persisted as a `CaseLedgerEntry` only when
      its replayed Announce is applied.
    statement: >-
      The out-of-order holding area MUST NOT be the canonical ledger: it MAY keep
      the held Announce in the receiver's DataLayer only as records of its own
      kind, never as a CaseLedgerEntry, and a held entry MUST NOT be persisted as
      a CaseLedgerEntry until it is drained (i.e. until its predecessor is
      present), so that presence of a CaseLedgerEntry in the DataLayer continues
      to mean "committed and effects applied" (SYNC-13-001).
    rationale: >-
      A stored `CaseLedgerEntry` means that the entry is committed and its effects are
      applied (SYNC-13-001). A held entry has neither. If the holding area stored a
      held entry as a ledger entry, the already-stored check would skip its effects
      when it drains.
    adr:
    - ADR-0037
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-13-001
      note: >-
        Holding an entry as a CaseLedgerEntry would break the presence-means-committed
        invariant
  - id: SYNC-14-006
    priority: SHOULD
    kind: project
    statement: >-
      The holding area SHOULD be bounded in size per case; when full it SHOULD evict the
      held Announce whose entry is farthest ahead of the current gap (highest log_index),
      body and all, and log a warning, or decline to hold the new one when its entry is
      itself the farthest ahead. Eviction is recoverable because SYNC-14-002 already
      sent a Reject, so eviction MUST NOT be relied upon to trigger recovery by itself.
    rationale: >-
      A peer that sends many entries, or a long gap, could fill the receiver's store
      without limit. The entry farthest ahead is the last one the drain needs, so
      evicting it loses the least. Eviction is safe because the Reject (SYNC-14-002)
      already asked for a replay, and the replay sends the entry again.
    adr:
    - ADR-0037
    verification: >-
      `test/core/use_cases/received/test_sync.py` (`TestHeldAnnounceBound`)
      asserts that a full holding area drops the farthest-ahead Announce with
      its body and a warning, and declines one farther still.
- id: SYNC-15
  title: Genesis-Unavailable Buffer-and-Reject
  description: >-
    A participant replica receives Announce(CaseLedgerEntry) activities from the CASE_MANAGER
    over an unordered transport.  If the CASE_MANAGER delivers a ledger entry before the
    Create/Announce(VulnerabilityCase) activity has been processed by the participant (a
    delivery race under HTTP BackgroundTasks), the replica cannot reconstruct the per-case
    genesis hash (CLP-08-005) and must not silently drop the entry.  Silently dropping causes
    the entry to be permanently lost because the CASE_MANAGER never learns that delivery failed
    and never replays.  A pre-genesis entry is therefore held in the same non-ledger holding
    area used for forward gaps (SYNC-14) and drained once the case seed anchors the genesis
    hash, making convergence independent of whether the case or its ledger entries arrive
    first (issue #2186, #2180).  A Reject is still sent as the loss backstop, triggering the
    same replay path as the hash-mismatch case (SYNC-08-005, SYNC-14-002) for an entry that is
    genuinely lost rather than merely early.  The backstop is asked once per wait, not once
    per held entry, and the CASE_MANAGER answers once per need; both limits are rate limits,
    never stops (SYNC-15-016 to SYNC-15-022, ADR-0168).  The forward-gap hold of SYNC-14 alone
    does not cover this window: it only holds entries for a case whose genesis
    anchor is already known, so a distinct pre-genesis hold and a drain triggered
    by the case seed are required.
    Rationale for the buffer-and-drain path (SYNC-15-004, SYNC-15-005): ADR-0059
    (docs/adr/0059-buffer-pre-genesis-ledger-entries.md).
  specs:
  - id: SYNC-15-001
    priority: MUST
    kind: protocol
    statement: >-
      When a participant receives an Announce(CaseLedgerEntry) but cannot reconstruct
      the per-case genesis hash because it does not yet hold the VulnerabilityCase
      (CLP-08-005), the participant MUST NOT silently discard the entry; unless an earlier
      such Reject for the same case lets it withhold one (SYNC-15-016), it MUST send a
      Reject(CaseLedgerEntry) with last_accepted_hash="" to the CASE_MANAGER so that the
      CASE_MANAGER replays all entries from the beginning once the case is delivered.
    rationale: >-
      An empty `last_accepted_hash` means "I hold no entries; replay from genesis." The
      CASE_MANAGER's replay path (SYNC-03-002) replays every entry after the hash it
      receives. An empty string matches no entry, so it replays the full ledger.
      Without the Reject, the CASE_MANAGER never learns that the delivery failed, and
      the replica stays without the entry permanently. One Reject asks for the whole
      ledger, so a second one asks for nothing new (ADR-0168).
    verification: >-
      Integration tests in `test/demo/` confirm that receiving a ledger entry before the
      VulnerabilityCase is present triggers a Reject(CaseLedgerEntry) with
      last_accepted_hash="" to the CASE_MANAGER.
    relationships:
    - rel_type: depends_on
      spec_id: CLP-08-005
      note: The missing-case failure originates from the genesis-hash requirement in CLP-08-005
    - rel_type: depends_on
      spec_id: SYNC-08-005
      note: Reject-on-divergence applies equally to the genesis-unavailable case
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: A participant MUST NOT persist a `CaseLedgerEntry` when the per-case genesis hash is unavailable.
    rationale: >-
      Without the genesis hash, the replica cannot check that the entry belongs to this
      case's chain. A stored entry also means that its effects were applied
      (SYNC-13-001). Storing an unchecked entry would put an entry in the ledger that
      may not be canonical, and its effects would never apply.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-12-001
      note: "Effects-before-persist invariant applies; an entry whose genesis is unknown cannot be safely committed"
  - id: SYNC-15-006
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: A `CaseLedgerEntry` received when the per-case genesis hash is unavailable MUST NOT be treated as
      committed.
    rationale: Treating a pre-genesis entry as committed would populate the already-stored gate (SYNC-12-003)
      prematurely, causing effects to be skipped when the entry is later drained after the genesis is seeded.
  - id: SYNC-15-007
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: The domain effects of a `CaseLedgerEntry` received when the per-case genesis hash is unavailable MUST
      NOT be applied (SYNC-12-001).
    rationale: Applying effects before the genesis hash is known means the effects cannot be attributed to a
      verified chain position; if the genesis hash later reveals the entry is a fork, already-applied effects
      cannot be rolled back.
  - id: SYNC-15-003
    priority: SHOULD
    kind: protocol
    statement: The CASE_MANAGER SHOULD bound the rate at which it replays entries to a peer whose acknowledged
      replication position has not advanced.
    rationale: >-
      A peer that cannot anchor its hash chain rejects every entry replayed to it. Each
      Reject causes a replay, and each replayed entry causes another Reject. Without a
      bound, this loop grows without limit and can starve the CASE_MANAGER's other
      work. The bound is a rate limit and not a stop, because a later Reject must still
      get a replay when a replayed entry is lost.
    note: >-
      The bound must be a rate limit rather than permanent suppression: if a replayed
      entry is lost in transit, a later Reject at the same position must still
      eventually trigger a fresh replay, or the peer would never converge.  The
      zero-entry carve-out (SYNC-15-011) follows from the same requirement — recording
      a position at which nothing was delivered would start a cooldown that suppresses
      the first replay genuinely owed to that peer once the ledger grows.
      Genesis (`last_accepted_hash == ""`) SHOULD use a shorter cooldown than a
      mid-chain stall: a peer at genesis holds no entries at all and its convergence is
      owned by SYNC-15-001 and SYNC-15-015, which seed the VulnerabilityCase and then
      rely on the following replay to deliver the history, so rate-limiting that replay
      as aggressively as a mid-chain stall starves the bootstrap it exists to complete.
      Genesis cannot be exempted outright, however, because a peer that cannot anchor
      its chain reports genesis on every Reject.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-08-005
      note: >-
        Bounds the replay that the SYNC-08-005 resynchronization triggers; the
        reject-on-divergence contract itself is unchanged
    - rel_type: depends_on
      spec_id: SYNC-03-002
      note: The replay-from-hash path whose rate this rule limits
    - rel_type: refines
      spec_id: SYNC-15-001
      note: >-
        The genesis Reject that SYNC-15-001 mandates is the highest-volume source of
        no-progress replays
    verification: >-
      Integration tests in `test/demo/` confirm that the CASE_MANAGER applies a cooldown
      to replays for a peer whose acknowledged position has not advanced, preventing
      amplification loops.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-008
    priority: MUST
    kind: project
    statement: >-
      The CASE_MANAGER MUST record, per peer, the position (the `entry_hash` a replay resumed
      from, or `""` for genesis) of the last replay in which at least one entry was actually
      sent, together with the time it was sent.
    rationale: Recording the position and timestamp of the last non-empty replay is the data the cooldown check
      needs to determine whether a subsequent Reject at the same position falls within the cooldown window.
    verification: >-
      Integration tests in `test/demo/` confirm that the CASE_MANAGER persists per-peer
      the entry_hash position and timestamp of the last non-empty replay.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-009
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: A Reject reporting an unchanged replication position within the cooldown MUST NOT trigger another
      replay.
    rationale: >-
      A peer that cannot anchor its hash chain rejects every entry replayed to it,
      which makes a loop that sustains itself. A Reject at the same position inside the
      cooldown carries no new information, so suppressing its replay breaks the loop. A
      Reject after the cooldown still gets a replay, so a lost replay is repaired.
  - id: SYNC-15-010
    priority: MUST
    kind: project
    statement: A Reject reporting an advanced replication position MUST always trigger a replay.
    rationale: An advanced position means the peer successfully committed at least one entry since the last replay;
      withholding replay at that point would stall convergence.
    verification: >-
      Integration tests in `test/demo/` confirm that a Reject whose last_accepted_hash is
      ahead of the previously recorded peer position triggers a replay without waiting for
      any cooldown.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-011
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: A replay in which zero entries were sent MUST NOT update the recorded position, because no delivery
      was attempted at that position.
    rationale: >-
      A replay that sent nothing gave the peer nothing to act on. Recording its
      position would start a cooldown, and that cooldown would suppress the first
      replay the peer actually needs when the ledger grows.
  - id: SYNC-15-004
    priority: MUST
    kind: protocol
    statement: >-
      When a participant receives a valid Announce(CaseLedgerEntry) but cannot
      reconstruct the per-case genesis hash because it does not yet hold the
      VulnerabilityCase (CLP-08-005), the participant MUST NOT rely solely on the
      reject/replay round-trip; it MUST retain the Announce that carried the entry, as
      received, in the same non-ledger holding area used for forward gaps (SYNC-14-001),
      keyed by the entry's prev_log_hash, pending arrival of the case seed. Unlike a
      forward gap (SYNC-14-001) this hold applies without a tail_index comparison — no
      chain tail exists in the pre-genesis window — so every entry for the missing case
      is held, including the genesis entry (log_index 0) whose prev_log_hash equals the
      per-case genesis hash.
    rationale: >-
      The reject and replay recovery (SYNC-15-001) does not converge when deliveries
      arrive out of order, for the same reason that forward gaps are held (SYNC-14). The
      replay sends entries one by one over the same unordered transport, so each early
      entry is rejected again. This adds load, and each round can lose an entry. Holding
      the entry lets it drain in order once the case is seeded.
    adr:
    - ADR-0059
    verification: >-
      Integration tests in `test/demo/` confirm that a ledger entry received before the
      VulnerabilityCase is seeded is held in the non-ledger holding area and
      drained once the case seed anchors the genesis hash.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-14-001
      note: >-
        Reuses the same non-ledger holding area and prev_log_hash keying as the
        forward-gap hold
    - rel_type: depends_on
      spec_id: SYNC-14-005
      note: A pre-genesis entry MUST NOT be persisted as a CaseLedgerEntry while held
    - rel_type: refines
      spec_id: SYNC-15-001
      note: >-
        The Reject is retained as the loss backstop; holding is the primary
        convergence path
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-005
    priority: MUST
    kind: protocol
    statement: >-
      After a participant seeds the VulnerabilityCase (via Create or Announce(VulnerabilityCase)),
      which anchors the deterministic per-case genesis hash (CLP-08), it MUST drain the holding
      area for that case: it MUST locate the held Announce (if any) whose entry's
      prev_log_hash equals the per-case genesis hash, replay it (SYNC-14-009) so
      its entry is applied-then-persisted via the same path as in-order delivery
      (SYNC-14-004), and cascade in hash-chain order (SYNC-14-003) until no held
      Announce extends the current tail.
    rationale: >-
      A participant can compute the genesis hash from the case object alone: it comes
      from the case id, the creation time and the Case Owner's actor id (CLP-08-002).
      Seeding the case therefore anchors the chain, and the participant need not wait
      for a second delivery of the genesis entry. Draining on seed turns the pre-genesis
      hold (SYNC-15-004) into convergence.
    adr:
    - ADR-0059
    verification: >-
      Integration tests in `test/demo/` confirm that seeding the VulnerabilityCase triggers a
      cascading drain of pre-genesis held entries in hash-chain order via the
      apply-then-persist path.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-14-003
      note: Reuses the cascading drain defined for forward gaps
    - rel_type: depends_on
      spec_id: SYNC-14-004
      note: The drained entry MUST apply effects before persisting, on the same path as in-order delivery
    - rel_type: depends_on
      spec_id: SYNC-15-004
      note: Drains exactly the entries that SYNC-15-004 held during the pre-genesis window
    stories:
    - story_2022_012
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-012
    priority: MUST_NOT
    kind: project
    statement: >-
      The CASE_MANAGER MUST NOT enqueue a replay `Announce(CaseLedgerEntry)` for an
      (entry, peer) pair while an earlier `Announce` of that same entry to that same peer
      is still pending in its outbox.
    rationale: >-
      A `Reject` that arrives after the peer's gap has drained still reports an
      advanced position, so SYNC-15-010 replays. The replayed entries are often still
      in the outbox from the last replay. Queuing them again puts duplicate Announces
      in front of the next entry's fan-out to every other peer. This rule stops only a
      second copy of the same row, and the replay itself still occurs (ADR-0112).
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-003
    adr:
    - ADR-0112
    verification: >-
      `test/adapters/driven/test_sync_adapter_pending_dedup.py` confirms the sync adapter
      queues an (entry, peer) Announce once while it is pending and again once it has been
      popped; `test/core/behaviors/sync/nodes/test_replay.py` confirms a replay through the
      adapter adds only the entries not already pending and records no position when it
      adds none.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-013
    priority: MUST
    kind: project
    statement: >-
      Each consecutive non-empty replay the CASE_MANAGER sends to a peer from an unchanged
      replication position MUST lengthen the cooldown before the next one (doubling it, up
      to a fixed ceiling), and a replay from a different position MUST reset the cooldown
      to its base value.
    rationale: >-
      A fixed cooldown ends the Reject and replay loop only when one round trip
      completes inside it. On a loaded host, or with a peer that can never anchor its
      chain, the loop runs for as long as the peer rejects. A cooldown that doubles soon
      makes replays to a stuck peer rare, whatever the round-trip time. The ceiling
      makes sure that a stuck peer still gets a replay at a fixed interval, so the
      cooldown is a rate limit and not a stop (SYNC-15-003 note).
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-003
    - rel_type: depends_on
      spec_id: SYNC-15-008
      note: The per-peer record carries the count of replays at its position
    verification: >-
      `test/core/behaviors/sync/nodes/test_replay_guard.py` (`TestNoProgressBackoff`)
      confirms the cooldown doubles per replay, resets on progress and stays capped;
      `test/demo/test_rvcv_handoff_demo.py` (`TestUnanchoredPeerRejectStormIsBounded`)
      confirms the loop to two unanchored peers settles under a clock that makes every
      round slower than the base cooldown.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-014
    priority: MUST_NOT
    kind: project
    statement: >-
      The CASE_MANAGER MUST NOT send the genesis `Announce(VulnerabilityCase)` pre-seed
      (SYNC-15-015) in answer to a genesis Reject whose replay the cooldown suppresses.
    rationale: >-
      The pre-seed exists to anchor the replay that follows it. While the cooldown
      suppresses that replay, the peer already holds the case sent with the last one. A
      pre-seed for each Reject would keep one message moving for each Reject in the
      loop that SYNC-15-003 limits.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-003
    verification: >-
      `test/core/behaviors/sync/test_reject_tree.py`
      (`test_genesis_announce_skipped_when_replay_rate_limited`) confirms five genesis
      Rejects in one cooldown send the case once.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-015
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER answers a `Reject(CaseLedgerEntry)` with
      `last_accepted_hash=""` with a replay, it MUST first send
      `Announce(VulnerabilityCase)` to the rejecting peer.
    rationale: >-
      A peer that rejects from genesis does not hold the case, so it cannot compute
      the per-case genesis hash (CLP-08-005). Without the case, the peer fails the
      chain check on each replayed entry and rejects it again. The case lets the peer
      anchor its chain and drain the entries it holds (SYNC-15-005), so the replay
      that follows can apply.
    verification: >-
      `test/core/behaviors/sync/test_reject_tree.py`
      (`test_genesis_reject_queues_announce_vulnerability_case`) confirms a genesis
      Reject sends `Announce(VulnerabilityCase)` to the rejecting peer;
      `test_create_reject_log_entry_tree_returns_sequence` confirms the pre-seed runs
      before the replay; `test_non_genesis_reject_skips_announce_vulnerability_case`
      confirms a Reject from a later position sends no case.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-016
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A participant that has sent the CASE_MANAGER a `Reject(CaseLedgerEntry)` with
      `last_accepted_hash=""` for a case it still does not hold SHOULD NOT send another
      for that case until a bounded interval has passed since the last one.
    rationale: >-
      One genesis Reject asks for the case and the whole ledger. The participant holds
      every early entry and drains them when the case arrives (SYNC-15-004,
      SYNC-15-005), so a Reject for each further early entry asks for nothing the first
      did not. On a loaded host the CASE_MANAGER answered each of them with a full
      replay, and the duplicates delayed unrelated messages by about 20 seconds
      (#5552).
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-001
    adr:
    - ADR-0168
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-017
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A participant that withholds genesis Rejects under SYNC-15-016 MUST send one
      for the first entry of the still-missing case it receives after the interval has
      passed, as a new activity rather than a redelivery of an earlier Reject.
    rationale: >-
      The genesis Reject is the only recovery for a participant whose replay was lost,
      so withholding it may delay recovery but never end it. A redelivery of an earlier
      Reject carries that Reject's id, and the CASE_MANAGER drops a known id as a
      repeat (ID-04-005), so a request after the interval must be its own activity.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-016
    adr:
    - ADR-0168
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-018
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A rate limit an actor applies to replays or to replay requests about the same
      case and position MUST NOT suppress one permanently; once a bounded interval has
      passed, it MUST let the next one through.
    rationale: >-
      Every limit in this group trades recovery time for quiet. A limit that never
      lets a later request or replay through would turn a lost replay into a replica
      that never converges.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-003
    adr:
    - ADR-0168
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-019
    priority: MAY
    kind: protocol
    statement: >-
      The CASE_MANAGER MAY decline to answer a `Reject(CaseLedgerEntry)` with
      `last_accepted_hash=""` whose rejected entry was included in a replay from genesis
      it sent the same peer within a bounded interval; declining sends neither the case
      nor any entry.
    rationale: >-
      A Reject the CASE_MANAGER handles after it already replayed that entry from
      genesis to the same peer asks for a replay that is already on its way. The
      CASE_MANAGER cannot rely on every participant to limit its own requests
      (SYNC-15-016), because other implementations share the wire, so it may limit
      them itself.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-003
    adr:
    - ADR-0168
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-15-020
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The interval of SYNC-15-016 MUST be the replay cooldown's ceiling of SYNC-15-013,
      600 seconds, read from the one constant that sets that ceiling.
    rationale: >-
      The participant's interval bounds the worst-case wait after a lost replay. Using
      the ceiling the CASE_MANAGER already applies to a stuck peer keeps one number for
      "how long a stuck replica may wait", and a shared constant keeps the two from
      drifting apart.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-016
    - rel_type: depends_on
      spec_id: SYNC-15-013
    adr:
    - ADR-0168
  - id: SYNC-15-021
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A participant MUST record, per case it does not hold, the time it last sent a
      genesis Reject for that case, in its own store as a record of its own kind, and
      MUST delete that record when it seeds the case.
    rationale: >-
      The participant decides SYNC-15-016 when an early entry arrives, so it needs the
      time of its last request then; no existing record carries it, since a held
      Announce has no timestamp. Keeping it in the store survives a restart, and
      deleting it on seed keeps a later genesis wait for the same case from inheriting
      an old time.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-016
    adr:
    - ADR-0168
  - id: SYNC-15-022
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The CASE_MANAGER MUST record, per peer, the highest `log_index` its last non-empty
      replay from genesis sent, and MUST decline under SYNC-15-019 a genesis Reject
      whose rejected entry is at or below that index while less than the replay
      cooldown's ceiling of SYNC-15-013 has passed since that replay; a declined Reject
      MUST NOT update the recorded position or its replay count.
    rationale: >-
      The genesis cooldown starts at 2 seconds, so on a loaded host every queued genesis
      Reject passed it and drew a full replay (#5552). A Reject of an entry the last
      replay resent is answered by that replay. A later entry still replays under the
      cooldown, and after the ceiling any Reject does (SYNC-15-018). An unchanged record
      keeps a declined Reject from lengthening the next cooldown.
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-019
    - rel_type: depends_on
      spec_id: SYNC-15-008
    adr:
    - ADR-0168
- id: SYNC-16
  title: Divergence Recovery
  description: >-
    Under the copy model (ADR-0124) a replica applies each entry through one apply
    function that refuses an entry whose starting state does not match the replica's
    case file. When the refused entry already extends the replica's stored chain, no
    replay can fill the gap: the replica's case file has diverged from the
    CASE_MANAGER's, and the reject and replay path resends the same refused entry
    forever. A divergence is a defect, not a steady state, so the replica reports it and
    the CASE_MANAGER repairs it with a fresh case copy that names the ledger position it
    reflects. The fault is replication signalling, like the gap Reject, and is never
    ledgered. Rationale: ADR-0142.
  specs:
  - id: SYNC-16-001
    priority: MUST
    kind: protocol
    statement: >-
      When a participant refuses a `CaseLedgerEntry` whose `prev_log_hash` matches its
      chain tail because the entry's starting state does not match its case file, and its
      case file is not already past the entry, it MUST send `Create(ProcessingFault)`
      with failure class `LedgerEntryRefused/CaseDiverged` to the case's CASE_MANAGER,
      naming the refused `Announce(CaseLedgerEntry)` by reference. It MUST keep holding
      the refused entry as SYNC-14-001 holds a forward gap.
    rationale: >-
      The entry was received but could not be processed, which MSM-05-001 assigns to a
      processing fault. Without it the CASE_MANAGER sees only gap Rejects, and its
      replay resends the entry the replica refuses. An entry whose content is invalid
      in itself, such as the impossible participant status of RSH-09-006, is not a
      divergence: a fresh copy cannot repair it, so it takes that requirement's fault
      instead of this one.
    relationships:
    - rel_type: refines
      spec_id: ASK-07-001
    adr:
    - ADR-0142
    verification: >-
      `test/core/use_cases/received/test_embargo_consent_copy.py` drives a refused copy
      entry that extends the chain and asserts the replica queues the fault to the
      CASE_MANAGER alone and keeps holding the entry;
      `test/core/behaviors/sync/test_divergence_recovery.py` pins the failure class.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-16-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A processing fault that reports a failure to apply a `CaseLedgerEntry` MUST NOT be
      committed to the case ledger, by the participant or by the CASE_MANAGER. The
      CASE_MANAGER's response to it is per-peer replication state (SYNC-04), except for
      the hash-mismatch fault, which changes nothing (SYNC-03-008).
    rationale: >-
      It reports on replication, as `Reject(CaseLedgerEntry)` does. Ledgering it loops:
      the diverged replica cannot apply the entry that records its own fault, and a
      failure to apply that entry would be another fault to ledger.
    relationships:
    - rel_type: refines
      spec_id: CLP-04-007
    - rel_type: constrains
      spec_id: RSH-09-006
    adr:
    - ADR-0142
    verification: >-
      `test/core/use_cases/received/test_embargo_consent_copy.py` and
      `test/core/behaviors/sync/test_hash_mismatch_fault.py` assert no case ledger
      gains an entry when the fault is sent or received.
    stories:
    - story_2022_045
  - id: SYNC-16-003
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER receives the SYNC-16-001 fault from an active participant of
      the case (CM-10-004), it MUST send that participant `Announce(VulnerabilityCase)`
      of its current case. From any other sender it MUST refuse the fault, send nothing
      and record no replication state for the sender.
    rationale: >-
      The CASE_MANAGER's case is authoritative (PCR-03-001), and a copy carrying its
      ledger position (SYNC-16-005) lets the replica replace its case file and backfill
      (SYNC-16-006, SYNC-16-007). The sender gate is the active-participant standing
      (CM-10-004, CM-23-020), not the gap Reject's (SYNC-03-005): that one admits a
      closed participant, but a copy of the current case would cross the closure
      cutoff such a participant is held to (CM-23-004), so its diverged replica is not
      repaired this way.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-16-005
    adr:
    - ADR-0142
    verification: >-
      `test/core/use_cases/received/test_case_diverged_reseed.py` asserts the
      CASE_MANAGER answers the fault from an active participant with the case, and
      refuses it, with nothing recorded or sent, from a stranger and from a
      participant that is not active; `test/demo/test_sync_ledger_replication.py`
      shows a diverged replica converging across two isolated actor apps.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-16-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST bound the rate at which it re-seeds a peer under
      SYNC-16-003. It MUST record, per peer, the time and ledger tail of the last
      re-seed, and a fault received within the cooldown MUST NOT trigger another
      re-seed; a fault after it MUST.
    rationale: >-
      A diverged replica faults once per replayed entry it refuses. A rate limit stops a
      re-seed storm without stranding a peer whose re-seed was lost, which a permanent
      suppression would (SYNC-15-003 makes the same choice for replay).
    relationships:
    - rel_type: refines
      spec_id: SYNC-16-003
    adr:
    - ADR-0142
    verification: >-
      `test/core/use_cases/received/test_case_diverged_reseed.py` asserts a second
      fault within the cooldown sends no case, and one after it does.
    stories:
    - story_2022_045
  - id: SYNC-16-005
    priority: MUST
    kind: protocol
    statement: >-
      Each `VulnerabilityCase` MUST store its ledger position (`ledgerPosition`), the
      position its case file is a projection of: the `log_index` and `entry_hash` of the
      last entry applied to it, or, before any, index -1 and the per-case genesis hash.
      Committing an entry, or storing one as a replica, MUST move the position to that
      entry atomically with storing the entry, unless the position is already past it
      or names it, which MUST leave the position unchanged. A ledger entry whose
      `payloadSnapshot` carries the case MUST carry it at the position before that
      entry. The position MUST travel with the case on its wire form, so a copy names
      the position it reflects, and a received case that carries none MUST be refused.
    rationale: >-
      A case copy is the case as applying the ledger up to some entry leaves it
      (ADR-0124); the position names that entry, so a receiver can tell a current
      copy from a stale one. Stored on the case, it is right on a replica too, whose
      case can be ahead of its own chain after it replaces its case with a copy.
      Moving it with the entry it names keeps the two from disagreeing, and a
      snapshot taken before the entry keeps any entry's hash from depending on
      itself. Never moving it back keeps a case a copy put ahead of its chain at
      the copy's position while the chain catches up (SYNC-16-007); a different entry at
      the position's index is a conflict, not one it already reflects.
    relationships:
    - rel_type: refines
      spec_id: PCR-02-001
    adr:
    - ADR-0142
    verification: >-
      `test/core/behaviors/sync/test_case_ledger_position.py` asserts that a case
      stored after a commit or a replica's store names that entry, that the store and
      the move commit together, that a case-carrying snapshot names the position
      before its entry, and that a stored or received case without the field is
      refused; `test/core/behaviors/sync/test_divergence_recovery.py` asserts that
      storing an entry behind the position leaves it; the rebuild check in
      `test/demo/_helpers.py`, run after every exchange demo test such as
      `test/demo/test_establish_embargo_demo.py`, asserts the CASE_MANAGER's and
      every replica's case names its chain tail after each demo.
    stories:
    - story_2022_088
  - id: SYNC-16-006
    priority: MUST
    kind: protocol
    statement: >-
      A participant that receives `Announce(VulnerabilityCase)` from the case's
      CASE_MANAGER for a case it already holds, a repeat of an earlier Announce
      included, MUST compare the copy's ledger position (SYNC-16-005) with its own:
      the later of its chain's tail and its case's stored position. If its own is
      already past the copy's, it MUST leave its case file unchanged, as for a repeat
      delivery. If it holds an entry at the position's index, or its case names one
      there, whose hash differs, it MUST leave its case file unchanged and refuse the
      copy. Otherwise it MUST replace its case file with the copy, taking the copy's
      position.
    rationale: >-
      The transport is unordered and the outbox retries, so an old copy can arrive late;
      replacing with it would drop the effects of the entries the replica already holds
      past the copy. A different entry at the same index means the chains themselves
      disagree, which no copy repairs. The case's stored position counts as well as
      the chain, because after a replacement the case can be ahead of the chain, and
      a copy older than the replacing one must not move it back.
    relationships:
    - rel_type: refines
      spec_id: PCR-02-004
    adr:
    - ADR-0142
    verification: >-
      `test/core/behaviors/sync/test_divergence_recovery.py` covers the stale,
      conflicting and current copy, and a copy behind or conflicting with the
      last replacing copy;
      `test/core/use_cases/received/actor/test_announce.py` covers a repeat of the
      same Announce.
    stories:
    - story_2022_088
  - id: SYNC-16-007
    priority: MUST
    kind: protocol
    statement: >-
      After replacing its case file under SYNC-16-006 with a copy whose position is
      ahead of its chain, a participant MUST send `Reject(CaseLedgerEntry)` carrying its
      own tail. A participant whose case is at a position ahead of its chain, after
      such a replacement or a first seed from a copy (PCR-02-003), MUST store each entry
      it receives at or before that position, whether replayed or drained from its
      holding area (SYNC-14-003), as an idempotent no-op, not refuse it, and MUST NOT
      move the case's position back for it (SYNC-16-005). It MUST refuse, not store, an
      entry at the position's index whose hash differs from the one the position
      names, and log the conflict at ERROR. When its chain stores no
      entry, the `Reject` MUST name no rejected entry, MUST state the empty chain's
      `ledgerPosition` (index -1, SYNC-18-001) and MUST name the case as its `target`,
      asking for a replay from genesis; a receiver MUST refuse a `Reject` that names no
      entry and states no position, or a position other than the empty chain's, and the
      CASE_MANAGER MUST answer the empty-chain form as it answers any replay from
      genesis (SYNC-15-015).
    rationale: >-
      Those entries are already reflected in the copy. The refused entry the replica
      held under SYNC-16-001 drains first, before any replay arrives, so a rule that
      covered only replayed entries would refuse it again. Storing them advances the chain
      to the copy's position, after which the entries that follow apply normally, so the
      replica ends where seed-plus-replay leaves it (ADR-0114). A first seed is the same
      case: the copy already reflects the entries the joining replica's backfill
      brings. The entries before the position carry no hash the case names, so a
      chain that diverged among them shows only at the position's index; refusing the
      entry there keeps the chain from naming one entry and the case another. A replica
      with no entry has none for the `Reject` to name; waiting for
      the next fan-out would stall it on a quiet case, so it names the case instead and
      asks for everything.
    relationships:
    - rel_type: depends_on
      spec_id: SYNC-16-006
    - rel_type: refines
      spec_id: SYNC-03-002
    adr:
    - ADR-0142
    - ADR-0156
    verification: >-
      `test/core/behaviors/sync/test_divergence_recovery.py` replaces a short replica's
      case and asserts its chain reaches the CASE_MANAGER's tail with matching case
      files, that a replica with no entry sends the `Reject` that names none, that such
      a `Reject` stating no position, or one past the empty chain, is refused at parse,
      and that a first seed ahead of the
      chain stores the backfilled entries as no-ops at the copy's position, and that an
      entry at the position's index with another hash is refused at ERROR, unstored;
      `test/core/use_cases/received/test_case_copy_replacement.py` backfills a replaced
      replica without moving its position back, and replays a replica with no entry
      from genesis to the CASE_MANAGER's tail.
    stories:
    - story_2022_045
    - story_2022_088
    lint_suppress:
    - compound_statement  # one empty-chain rule (ADR-0156)
  - id: SYNC-16-008
    priority: SHOULD
    kind: project
    statement: >-
      The CASE_MANAGER SHOULD log at ERROR a SYNC-16-001 fault for an entry at or before
      the tail of the last re-seed it sent that peer only when the peer's acknowledged
      position is at or past that tail and the fault's claimed `published` time is
      after the time the peer claimed for that acknowledgement. Any other such fault
      is ordinary recovery, logged below ERROR and left to the rate-bounded re-seed
      (SYNC-16-004).
    rationale: >-
      A peer that acknowledged the copy's position has applied a case that already
      reflects the entry, so a refusal it sends afterwards means the CASE_MANAGER's own
      case disagrees with its ledger: a defect, not recovery, and it must not read as
      routine. Without the acknowledgement the same fault is ordinary recovery: the
      copy may have been lost in transit, or the entry replayed before the copy
      arrived. A fault the peer sent before acknowledging is recovery too: a replay
      refused before the copy arrived, delivered late because arrival order is not
      guaranteed (SYNC-19). A tie counts as recovery: `published` has whole-second
      precision, so a refusal and the acknowledgement that follows it can share a
      second; a defect fault sent in that same second reads as recovery once. The
      two times compared are both the peer's own claims, so
      they share its clock and no skew between machines enters the comparison. The
      acknowledgement's time is the peer's first statement of that position, so a
      later restatement cannot hide a fault sent after it; a peer that moves on to a
      later position takes that statement's time, so a defect fault sent in between
      reads as recovery once, and the defect shows at ERROR on the next repeat. A
      missing time on either side shows no order and keeps the ERROR. Logging recovery
      at ERROR would mark a self-healing path as a failure.
    relationships:
    - rel_type: refines
      spec_id: SYNC-16-004
    adr:
    - ADR-0142
    verification: >-
      `test/core/use_cases/received/test_case_diverged_reseed.py` asserts the ERROR
      record when the peer acknowledged the re-seed's position before the fault's
      time or with no time against it, a WARNING when the fault's time is at or
      before the acknowledgement's, a WARNING and a re-seed after the cooldown when
      the peer did not acknowledge, and no ERROR for an entry past the last re-seed;
      `test/core/behaviors/sync/nodes/test_chain.py` asserts the acknowledgement's
      claimed time is kept, the earliest for a restated position.
    stories:
    - story_2022_045
- id: SYNC-17
  title: Participant Position Statements
  description: >-
    A participant's replica can fall behind with nothing to show it: when the last
    `Announce(CaseLedgerEntry)` before a quiet period is lost, no later entry arrives
    with a gap, so no `Reject(CaseLedgerEntry)` is sent and the reject-and-replay loop
    never starts. The CASE_MANAGER cannot see the lag either, because nothing tells it
    how far a participant has got. The participant therefore states its position, when
    it chooses, in a `Read(CaseLedgerEntry)`, and the CASE_MANAGER answers a position
    behind its tail by replaying. The position stated on every case activity
    (SYNC-18) composes the same answer. This is how the
    LedgerReconciliation phase detects a gap and retries until convergence
    (SYNC-00-003, SYNC-00-007, SYNC-00-008). Rationale: ADR-0155.
  specs:
  - id: SYNC-17-001
    priority: MAY
    kind: protocol
    statement: >-
      A participant MAY send the case's CASE_MANAGER `Read(CaseLedgerEntry)` whose
      `object` is the last canonical entry it has applied for that case, by reference.
      A participant that has applied no entry for the case has no entry to name and
      sends no `Read(CaseLedgerEntry)`.
    rationale: >-
      ActivityStreams defines `Read` as the actor having read the object, so the
      activity states a fact and asks for nothing. A `Reject(CaseLedgerEntry)` would
      claim a refusal that did not happen.
    adr:
    - ADR-0155
    verification: >-
      A test marked `SYNC-17-001` builds the activity with the wire factory and asserts
      its type is `Read` and its `object` is the entry's id.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-17-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST act on a participant's stated ledger position in
      `Read(CaseLedgerEntry)` (SYNC-17-001) only when the sender is an active
      participant in the case (CM-10-004). From any other sender it MUST record no
      replication state for the sender, send nothing in answer, and report `REFUSED`.
    rationale: >-
      An inert or closed participant's replica stops on purpose, so its stated position
      always lags, and answering it would send withheld case content (SYNC-03-005).
      CM-10-006's backfill catches up a participant that becomes active again. The
      Invite resend is no answer to the position and runs apart from this check
      (SYNC-20-001, ADR-0163): an unconsented participant on the roster is resent the
      Invites it was already sent, which carry no withheld content, and its statement
      is otherwise refused.
    relationships:
    - rel_type: refines
      spec_id: CM-10-004
    - rel_type: refines
      spec_id: HP-01-006
    adr:
    - ADR-0114
    - ADR-0155
    verification: >-
      Tests marked `SYNC-17-002` send `Read(CaseLedgerEntry)` with a lagging position
      from a removed participant and from an unconsented participant, and assert
      `REFUSED`, no replication state for the sender and no `Announce(CaseLedgerEntry)`
      queued to it.
    stories:
    - story_2022_045
  - id: SYNC-17-003
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER acts on a stated position (SYNC-17-002) that names an entry
      in its ledger, it MUST record that entry's hash as the sender's acknowledged
      position in its per-peer replication state (SYNC-04-001).
    rationale: >-
      The CASE_MANAGER has no other record of how far a quiet participant has got
      (SYNC-04-001). The stated entry is a fact the participant reports about itself,
      so recording it gives the replay a correct start and the cooldown a correct
      position.
    relationships:
    - rel_type: refines
      spec_id: SYNC-04-001
    adr:
    - ADR-0155
    verification: >-
      A test marked `SYNC-17-003` delivers `Read(CaseLedgerEntry)` from an active
      participant and asserts the sender's replication state holds the named hash.
    stories:
    - story_2022_045
  - id: SYNC-17-004
    priority: MUST
    kind: protocol
    statement: >-
      When the position the CASE_MANAGER acts on (SYNC-17-002) is behind its ledger
      tail, it MUST send the sender every canonical entry after that position, in log
      order, as `Announce(CaseLedgerEntry)`, under the same replay rate bound (SYNC-15-003,
      SYNC-15-013) and outbox de-duplication (SYNC-15-012) as a `Reject`-triggered
      replay. When the position is the tail it MUST send nothing.
    rationale: >-
      This is the retry that SYNC-00-008 requires. It runs whenever the participant
      reads, so a lost last entry is recovered without waiting for a new commit. A
      `Read` can predate entries already on their way to the sender, so a stated lag
      can be transient; the replay rate bound, not the outbox de-duplication, is what
      limits the replays such a race causes.
    relationships:
    - rel_type: refines
      spec_id: SYNC-00-007
    - rel_type: refines
      spec_id: SYNC-00-008
    - rel_type: refines
      spec_id: SYNC-03-002
    adr:
    - ADR-0155
    verification: >-
      Tests marked `SYNC-17-004` drop the last `Announce(CaseLedgerEntry)` to a
      participant, send no further entry and no `Reject`, and assert that the
      participant's `Read(CaseLedgerEntry)` brings its tail to the CASE_MANAGER's. They
      also assert that a position at the tail queues nothing, and that a second lagging
      position inside the replay cooldown queues no second replay.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-17-005
    priority: MUST
    kind: protocol
    statement: >-
      When a stated position names an entry the CASE_MANAGER's ledger does not hold, or
      an index at which its entry has a different hash, the CASE_MANAGER MUST log it at
      WARNING with the sender and the position, record no replication state and send
      nothing.
    rationale: >-
      Such a position is not a lag, and replaying from a guessed point would send a
      suffix the replica cannot anchor. A replica whose case file has diverged reports
      it by SYNC-16-001.
    adr:
    - ADR-0155
    verification: >-
      Tests marked `SYNC-17-005` send `Read(CaseLedgerEntry)` naming an unknown entry,
      and a position whose index holds an entry with a different hash. Each asserts the
      WARNING record, an empty outbox and no replication state for the sender.
    stories:
    - story_2022_045
  - id: SYNC-17-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT commit a ledger entry for a `Read(CaseLedgerEntry)` or
      for its answer to one.
    rationale: >-
      Stating a position changes nothing in the case file, so it is an observation and
      not a case event (ADR-0152). Ledgering it would add an entry every time a
      participant checks, which itself would leave every other participant behind.
    adr:
    - ADR-0152
    - ADR-0155
    verification: >-
      Tests marked `SYNC-17-006` deliver `Read(CaseLedgerEntry)` at the tail and behind
      it, and assert each leaves the CASE_MANAGER's ledger unchanged.
    stories:
    - story_2022_045
  - id: SYNC-17-007
    priority: SHOULD
    kind: project
    statement: >-
      The reference implementation's participant SHOULD send `Read(CaseLedgerEntry)`
      for each case it holds after a restart, and SHOULD support sending it on a
      configurable interval that is off by default, with that default documented beside
      the retry defaults (SYNC-05-003).
    rationale: >-
      When to check is the participant's own policy (ADR-0155). A restart is the moment
      it is most likely to have missed an entry; a periodic check costs traffic that a
      deployment should choose.
    adr:
    - ADR-0155
    verification: >-
      A test marked `SYNC-17-007` restarts a participant holding a case and asserts one
      `Read(CaseLedgerEntry)` naming its tail is queued to the CASE_MANAGER.
  - id: SYNC-17-008
    priority: SHOULD
    kind: protocol
    statement: >-
      Once an `Announce(VulnerabilityCase)` has seeded a participant's replica of a case
      it did not hold (PCR-02-003), the participant SHOULD send the case's CASE_MANAGER
      one `Read(CaseLedgerEntry)` (SYNC-17-001) naming the entry at the ledger position
      the seeded case is at (SYNC-16-005).
    rationale: >-
      A joiner that dropped an Invite before its case copy arrived (CBT-03-003) may have
      nothing else to send, so the CASE_MANAGER never learns that its replica is ready.
      The statement tells it, and the CASE_MANAGER can then resend each Invite the
      participant has not answered (ADR-0163). The seeded case reflects every entry up
      to the copy's position, and the replica stores none of them yet (SYNC-16-007), so
      that position is the replica's tail. A copy that updates a held replica tells the
      CASE_MANAGER nothing new, and SYNC-16-007 already asks for what it lacks.
    adr:
    - ADR-0163
    verification: >-
      Tests marked `SYNC-17-008` deliver `Announce(VulnerabilityCase)` to a participant
      that holds no replica and assert one `Read(CaseLedgerEntry)` naming the copy's
      position is queued to the CASE_MANAGER, and deliver it to a participant that
      already holds the case and assert none is queued.
- id: SYNC-18
  title: Sender Ledger Position on Case Activities
  description: >-
    Every case activity states the ledger position its sender held when it built the
    activity, so the case ledger records what each actor knew when it acted. The
    position is a record, not a gate: an actor that lags the CASE_MANAGER's latest
    entry may still act (SYNC-10-005), and a stale answer to a replaced object is
    already refused by the object it names (CM-18-003). A lagging position is answered
    as a `Read(CaseLedgerEntry)` is (SYNC-17), and a position the CASE_MANAGER's ledger
    does not hold is a split chain, which it repairs. Rationale: ADR-0156.
  specs:
  - id: SYNC-18-001
    priority: MUST
    kind: protocol
    statement: >-
      An activity about a case whose ledger its sender holds, sent by any actor, MUST
      carry the sender's ledger tail for that case as the activity's `ledgerPosition`: an
      object whose `logIndex` and `entryHash` name the last entry the sender had
      committed, or had stored as a replica, when it built the activity; for an empty
      ledger, index -1 and the per-case genesis hash. A `Read(CaseLedgerEntry)` carries
      it as the position of the entry it names, which is that tail (SYNC-17-001). An
      activity sent before its sender holds the case's ledger, an activity whose object
      already states a ledger position (`Announce(CaseLedgerEntry)`,
      `Announce(VulnerabilityCase)`, `Create(VulnerabilityCase)`,
      `Update(VulnerabilityCase)`), and a `Create(ProcessingFault)` MUST NOT carry
      one.
    rationale: >-
      One rule for every sender and message type gives every ledgered act its
      provenance, and a new message type needs no decision about whether it counts. A
      stub-Invite reply or a report `Offer` comes from an actor with no ledger to
      state. An entry and a case copy already state their own positions, and
      `Create(VulnerabilityCase)` and `Update(VulnerabilityCase)` are copies too.
      `Join`, `Ignore`, `Leave` and `Offer` of a case name the case and act on it, so
      they carry the sender's position. A `Create(ProcessingFault)` is about the
      processing of one activity, not about a case. Any receiver sends one, including
      for an activity it could not parse and so cannot place in any case (ASK-07-001),
      and it names no case (ASK-07-004). This applies to the replica's faults too. The
      property is the `ledgerPosition` term that a case copy already carries
      (SYNC-16-005), so one fact keeps one wire form.
    relationships:
    - rel_type: refines
      spec_id: SYNC-16-005
    adr:
    - ADR-0156
    verification: >-
      `test/core/use_cases/received/test_activity_ledger_tail.py` asserts that a
      participant's `Add(Note)` and a CASE_MANAGER-sent one, built by each sender's
      trigger adapter, carry `ledgerPosition`, that one built by an actor that holds no
      ledger for the case does not, and that an `Announce(CaseLedgerEntry)` does not;
      `test/wire/as2/factories/test_ledger_position.py` asserts which activities the
      stamp skips.
    stories:
    - story_2022_045
    - story_2022_088
    lint_suppress:
    - compound_statement  # one rule and its exclusions (ADR-0156)
  - id: SYNC-18-002
    priority: MUST
    kind: protocol
    statement: >-
      `ledgerPosition` MUST be the sender's ledger tail for the case at the moment the
      activity is built, and MUST be produced only by `vultron.wire.as2.factories`. A
      resent activity MUST carry the position it was first sent with.
    rationale: >-
      The position describes the moment of the act, so a later resend that restamped
      it would misstate what the sender knew. The outbox already relays the sealed
      body (OX-07-001), which keeps the first position.
    relationships:
    - rel_type: refines
      spec_id: SYNC-18-001
    adr:
    - ADR-0156
    verification: >-
      `test/core/use_cases/received/test_activity_ledger_tail.py` advances the sender's
      ledger past genesis and asserts the stamped position equals its tail when the
      activity was built, and that rebuilding the activity after the tail moved hands
      back the body it was first sealed with. The resend clause holds through the
      outbox's sealed-body relay (OX-07-001), which its own tests cover.
    stories:
    - story_2022_045
  - id: SYNC-18-003
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST parse `ledgerPosition` as the core `LedgerPosition` at the parse
      edge, and MUST refuse an activity that SYNC-18-001 requires to carry one when
      its `ledgerPosition` is missing or does not parse, naming the activity and writing
      nothing. A `Reject(CaseLedgerEntry)` that names an entry and carries no position
      MUST NOT be refused for it: it comes from a peer that does not hold the case yet,
      which the CASE_MANAGER seeds and replays from genesis (SYNC-15-015).
    rationale: >-
      Core code then receives a non-optional position (ADR-0032), and every ledgered
      act carries one. A receiver cannot tell from a `Reject(CaseLedgerEntry)` alone
      whether its sender holds the case, and the peer that does not is the one the
      replay from genesis exists to repair.
    relationships:
    - rel_type: refines
      spec_id: SYNC-18-001
    adr:
    - ADR-0156
    verification: >-
      `test/core/use_cases/received/test_activity_ledger_tail.py` delivers an
      unstamped `Add(Note)` and one whose `ledgerPosition` does not parse, and asserts
      each is refused with a reason naming the activity, and that no ledger entry is
      written; `test/wire/as2/test_ledger_position_scope.py` asserts that every
      received event class either requires the position or is listed out of scope
      with its reason.
    stories:
    - story_2022_045
    lint_suppress:
    - compound_statement  # one parse-edge rule (ADR-0156)
  - id: SYNC-18-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT refuse, hold or defer an activity because its
      `ledgerPosition` is behind the CASE_MANAGER's own ledger tail, and MUST log such a
      lag at DEBUG with the activity and actor. A reply to the full-case Invite is
      the one exception, judged against its Invite's floor (CM-11-012).
    rationale: >-
      Under asynchronous fan-out an active participant is routinely a few entries
      behind, and SYNC-10-005 lets it act while it lags. A stale answer to a replaced
      embargo is already refused, because its consent row accepts no trigger
      (CM-18-003), so refusing on the position alone would refuse ordinary acts and
      catch nothing new.
    relationships:
    - rel_type: refines
      spec_id: SYNC-10-005
    adr:
    - ADR-0156
    verification: >-
      `test/core/use_cases/received/test_activity_ledger_tail.py` delivers an
      `Add(Note)` stamped behind the CASE_MANAGER's tail and asserts it is applied and
      the lag is logged at DEBUG with the activity and actor ids.
    stories:
    - story_2022_045
  - id: SYNC-18-005
    priority: MUST
    kind: protocol
    statement: >-
      When an activity's `ledgerPosition` names an index the CASE_MANAGER's ledger holds
      with a different entry hash, or an index past its own tail, the CASE_MANAGER
      MUST judge the activity as it would without the position, MUST log the split at
      ERROR, and, when the sender is an active participant of the case (CM-10-004),
      MUST send it `Announce(VulnerabilityCase)` of its current case under the rate
      bound of SYNC-16-004. It MUST NOT re-seed any other sender.
    rationale: >-
      The CASE_MANAGER is the single writer, so no participant can hold an entry it
      did not commit; such a position means the sender's chain has split. The fresh
      copy repairs it with the path SYNC-16-003 already uses for a reported
      divergence. A `Read(CaseLedgerEntry)` naming such a position is answered with
      nothing instead (SYNC-17-005); that difference, and whether the act itself should
      be refused, are open (`notes/sync-ledger-replication.md`).
    relationships:
    - rel_type: refines
      spec_id: SYNC-16-003
    adr:
    - ADR-0156
    verification: >-
      `test/core/use_cases/received/test_activity_ledger_tail.py` delivers an
      `Add(Note)` whose position names a wrong hash, and one whose position is past the
      tail, and asserts each is applied, the split is logged at ERROR and a case copy is
      queued to the sender; the same activity from a removed participant queues no case
      copy.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-18-006
    priority: MUST
    kind: protocol
    statement: >-
      The `ledgerPosition` of an admitted activity MUST be recorded in its ledger entry
      as part of the received body (CLP-07-011), and MUST NOT be removed from it.
    rationale: >-
      The entry is the received envelope with a postmark (ADR-0107), so the position
      is ledgered with the act it describes and replicas receive it unchanged.
    relationships:
    - rel_type: refines
      spec_id: CLP-07-011
    adr:
    - ADR-0156
    verification: >-
      `test/core/use_cases/received/test_activity_ledger_tail.py` asserts the
      entry's `payload_snapshot` holds the received `ledgerPosition`.
    stories:
    - story_2022_045
  - id: SYNC-18-007
    priority: MUST
    kind: protocol
    statement: >-
      When an activity's `ledgerPosition` names an entry in the CASE_MANAGER's ledger
      and the sender is an active participant of the case (CM-10-004), the CASE_MANAGER
      MUST answer the position as it answers one stated in `Read(CaseLedgerEntry)`: it
      MUST record the entry's hash as the sender's acknowledged position (SYNC-17-003)
      and, when the position is behind its tail, send the entries after it under the
      replay rate bound and de-duplication of SYNC-17-004. From any other sender it MUST
      record no replication state and send nothing in answer to the position. Neither
      the record nor the replay changes the activity's own outcome.
    rationale: >-
      A stamp states the same fact as a `Read(CaseLedgerEntry)`, so one answer serves
      both (ADR-0155): a participant that sends anything also tells the CASE_MANAGER how
      far it has got, and one that lost the last entry is repaired by its next act. A
      removed, unconsented or closed participant lags on purpose, so answering it would
      send withheld case content (SYNC-17-002).
    relationships:
    - rel_type: extends
      spec_id: SYNC-17-003
    - rel_type: extends
      spec_id: SYNC-17-004
    adr:
    - ADR-0156
    verification: >-
      `test/core/use_cases/received/test_activity_ledger_tail.py` delivers an
      `Add(Note)` stamped behind the CASE_MANAGER's tail and asserts it is applied, the
      sender's acknowledged position is the stamped entry and the missing entries are
      queued to it; the same activity from a removed participant records no
      replication state and queues no entry.
    stories:
    - story_2022_045
- id: SYNC-19
  title: Arrival-Order Independence and Eventual Consistency
  description: >-
    The transport promises no delivery order (ADR-0037), and other implementations may
    share the wire, so every message a case actor receives can arrive before, between or
    after the messages it relates to. The protocol's guarantee is eventual consistency:
    the case ledger's `log_index` is the causal order (CLP-14-001), and hash-chain
    apply plus gap repair bring every replica to the CASE_MANAGER's case file. No
    decision may lean on an arrival order the ledger does not define. Rationale:
    ADR-0161.
  specs:
  - id: SYNC-19-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A coordination decision MUST NOT depend on an arrival order that the case ledger
      does not define. The CASE_MANAGER's observation order is the case's causal order
      (CLP-14-001): when it takes concurrent assertions from different senders in the
      order it observes them, its ledger records that order and every replica learns
      the same outcome. Every other decision MUST be the same whatever order its
      messages arrive in: what a participant applies, stores or answers, given a
      message the CASE_MANAGER sent outside the ledger and the ledger entries it relates
      to; and what the CASE_MANAGER records, given two assertions one sender sent before
      the first was committed.
    rationale: >-
      Arrival order differs between recipients, between implementations and between
      runs. A decision that reads it gives different coordination outcomes for the same
      messages, and the ledger cannot explain the difference. The CASE_MANAGER cannot
      observe the order one sender sent two messages in, so that order is lost unless
      the decision does not need it.
    note: >-
      The second clause covers one sender's changed embargo answer: CM-13-005 and
      CM-18-003 record a changed `Accept` or `Reject` of one Invite as it arrives, so
      two answers sent back to back are recorded in arrival order until the CASE_MANAGER
      can tell which was sent last (#5202).
    relationships:
    - rel_type: depends_on
      spec_id: CLP-14-001
    adr:
    - ADR-0161
    - ADR-0037
    verification: >-
      `test/core/use_cases/received/test_arrival_order.py` delivers an embargo revision's
      proposal entry, its relayed `Invite(EmbargoEvent)` and the Invite's emission
      entry to a participant in every order and asserts one final case file, one
      proposal index and one answer; its strict-`xfail` tests reproduce each order
      dependency still open.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-19-002
    priority: MUST
    kind: protocol
    statement: >-
      Eventual consistency MUST be the ordering guarantee the protocol makes: every
      active participant's replica that receives the CASE_MANAGER's committed ledger
      entries, in any order, MUST reach the CASE_MANAGER's case file through hash-chain
      apply (SYNC-03-001, SYNC-14) and gap repair (SYNC-00-007, SYNC-00-008, SYNC-16,
      SYNC-17). A message the CASE_MANAGER sends outside `Announce(CaseLedgerEntry)` MUST
      NOT leave a replica in a final state that the ledger entries it relates to do not
      determine.
    rationale: >-
      Replicas see the case at different times, so a stronger guarantee would need a
      delivery order the transport does not give. A direct message that wrote state the
      ledger later cannot correct would let two replicas holding the same ledger
      disagree for good.
    relationships:
    - rel_type: refines
      spec_id: SYNC-08-002
    adr:
    - ADR-0161
    verification: >-
      `test/core/use_cases/received/test_arrival_order.py` asserts that a participant
      that receives a revision Invite and its ledger entries in every order ends with
      no difference from the CASE_MANAGER's case file.
    stories:
    - story_2022_045
    - story_2022_088
  - id: SYNC-19-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      Per-recipient delivery order MUST NOT be a protocol guarantee. A receiver MUST NOT
      rely on a sender delivering its messages in the order it sent them, and a sender
      MUST NOT rely on its own ordered delivery for a receiver's correctness. An
      implementation MAY deliver in order per recipient as an optimization (OX-01-005).
    rationale: >-
      Another implementation may share the wire with no ordered outbox, and even an
      ordered outbox loses that order when an `Announce` is lost and replayed later, so a
      rule that holds only under ordered delivery fails in exactly the cases recovery
      exists for.
    relationships:
    - rel_type: constrains
      spec_id: OX-01-005
    adr:
    - ADR-0161
    - ADR-0112
    verification: >-
      `test/core/use_cases/received/test_arrival_order.py` delivers the CASE_MANAGER's
      messages for one revision in orders other than the one its outbox sends, and
      asserts that each order is realized and every order ends the same. A receiver
      that relied on per-recipient order, or a sender whose messages are correct only
      when delivered in its own order, fails that test, so the one check covers both
      clauses.
    stories:
    - story_2022_045
- id: SYNC-20
  title: Resending Unanswered Invites
  description: >-
    An Invite can be lost before its addressee can answer it. A joiner's relayed
    `Invite(EmbargoEvent)` or full-case Invite that arrives before its case copy waits
    in the pre-bootstrap queue, and is dropped when the queue's window ends
    (CBT-03-003); any Invite can be lost in delivery. A participant that states its
    ledger position tells the CASE_MANAGER its replica holds the case, which is the
    moment a resent Invite can be answered. So the CASE_MANAGER resends each Invite the
    participant still owes an answer to, as first sent and rate-bounded per Invite and
    participant. Rationale: ADR-0163.
  specs:
  - id: SYNC-20-001
    priority: MUST
    kind: protocol
    statement: >-
      When a participant on the case's roster that is not removed (CM-31-001) and whose
      closure is not recorded states a ledger position that names an entry in the
      CASE_MANAGER's ledger, in `Read(CaseLedgerEntry)` (SYNC-17-001) or as an
      activity's `ledgerPosition` (SYNC-18-001), the CASE_MANAGER MUST resend each
      Invite that participant owes an answer to (SYNC-20-002), whether or not the
      participant is active (CM-10-004).
    rationale: >-
      A position statement is the first sign that the replica holds the case, so a
      resent Invite can now be answered (ADR-0163). The resend is not an answer to the
      position, so it runs apart from SYNC-17-002 and SYNC-18-007: a joiner that lost
      its Invite to the embargo in force has not consented, so it is inert, and is the
      one to ask again. A resent Invite was already sent and is not case content
      (CM-10-007), so nothing withheld leaks.
    relationships:
    - rel_type: refines
      spec_id: SYNC-17-002
    - rel_type: refines
      spec_id: SYNC-18-007
    - rel_type: depends_on
      spec_id: CM-10-007
    adr:
    - ADR-0163
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` delivers
      `Read(CaseLedgerEntry)` from an active joiner, from an inert joiner and from a
      removed participant, and a stamped `Accept` from a joiner, and asserts the owed
      Invites are queued for the first two and the last, and nothing for the removed
      one. `test/adapters/driving/fastapi/test_invite_resend_after_queue_expiry.py`
      drives the inert joiner's recovery through both actors' inbox pipelines.
    stories:
    - story_2022_045
  - id: SYNC-20-002
    priority: MUST
    kind: protocol
    statement: >-
      An Invite the CASE_MANAGER sent a participant MUST be treated as owed an answer
      while that answer can still count, and at no other time: an
      `Invite(EmbargoEvent)` whose embargo is still a proposal or is the embargo in
      force, whose consent row for the participant is `INVITED` (CM-18-001), and whose
      RSVP deadline has not passed (CM-28-001); and the full-case Invite (CM-11-010)
      until the CASE_MANAGER's ledger records the participant's reply to it. Of several
      Invites for one embargo, only the last one sent is owed, and the Invite that the
      activity stating the position answers is not owed.
    rationale: >-
      Only an answer that can still change something is worth asking for again; an
      answered Invite, a decided or withdrawn proposal and a passed deadline cannot. An
      Invite for the embargo in force is still owed: a reinstated participant
      (CM-31-013), or a joiner whose proposal was activated first, is asked to sign it.
      The stating activity may be the answer itself, committed after its position is
      read, so its Invite is excluded by name.
    relationships:
    - rel_type: refines
      spec_id: SYNC-20-001
    adr:
    - ADR-0163
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` asserts that an answered
      embargo Invite, one for a rejected or withdrawn proposal, one past its RSVP
      deadline and a replied full-case Invite are not resent, and that the Invite a
      stamped `Accept` answers is not resent with it.
    stories:
    - story_2022_045
  - id: SYNC-20-003
    priority: MUST
    kind: protocol
    statement: >-
      A resent Invite MUST be the activity as first sent: the same id, `ledgerPosition`
      and RSVP deadline (SYNC-18-002), delivered from the body sealed when it was first
      sent (OX-07-001), never a new Invite built for the resend. So an Invite whose
      sealed body the CASE_MANAGER does not hold is not resent.
    rationale: >-
      A receiver that already handled the Invite treats a redelivery as a no-op
      (IE-10-001), and one that dropped it handles it as new. Resending never extends a
      deadline, so silence before the deadline is still a pocket veto, and the
      full-case Invite's ledger floor (CM-11-012) is unchanged.
    relationships:
    - rel_type: refines
      spec_id: SYNC-18-002
    - rel_type: depends_on
      spec_id: OX-07-001
    adr:
    - ADR-0163
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` asserts a resent Invite is
      queued under its first id with its sealed body unchanged, that a full-case reply
      at the resent Invite's floor is accepted, and that an Invite with no sealed body
      is logged and not sent.
    stories:
    - story_2022_045
  - id: SYNC-20-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT resend an Invite to a participant while an earlier send
      of that Invite is still pending in its outbox; such a skipped resend does not count
      toward its cooldown (SYNC-20-005).
    rationale: >-
      An Invite still waiting in the outbox has not been lost, so a second copy would
      only queue behind it. Not counting the skip keeps a later, real resend from
      waiting out a cooldown no delivery started. This is the replay's rule for a pending
      `Announce` (SYNC-15-012).
    relationships:
    - rel_type: refines
      spec_id: OX-06-002
    adr:
    - ADR-0163
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` states a position while the
      Invite's first send is pending and asserts one queued row and no resend record.
    stories:
    - story_2022_045
  - id: SYNC-20-005
    priority: MUST
    kind: protocol
    statement: >-
      Each consecutive resend of one Invite to one participant MUST double the cooldown
      before the next resend of that Invite to that participant, from a base value up to
      a fixed ceiling; a position stated inside the cooldown resends nothing.
    rationale: >-
      A participant that leaves an Invite unanswered on purpose states its position
      again and again. A doubling cooldown soon makes the resends rare, and the ceiling
      still resends at a fixed interval until the deadline passes, as the replay bound
      does (SYNC-15-013).
    relationships:
    - rel_type: refines
      spec_id: SYNC-15-013
    adr:
    - ADR-0163
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` states a position repeatedly
      and asserts no resend inside the base cooldown, a resend after it, no resend after
      the base once two were sent, a resend after twice the base, and that the cooldown
      stops at its ceiling.
    stories:
    - story_2022_045
  - id: SYNC-20-006
    priority: MUST
    kind: project
    statement: >-
      The resend cooldown's base and ceiling (SYNC-20-005) MUST be configurable, with
      their defaults documented beside the retry defaults (SYNC-05-003).
    rationale: >-
      How often to ask again is a deployment trade-off between recovery time and
      traffic, and an operator must know the defaults to change them.
    relationships:
    - rel_type: refines
      spec_id: SYNC-05-003
    adr:
    - ADR-0163
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` asserts the defaults, that
      they equal the replay cooldown's base and ceiling, and that a ceiling below its
      base is refused. The documented defaults are a review check of
      `docs/reference/draft-vultron-replication-spec.md` §10.
  - id: SYNC-20-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A resent Invite MUST NOT be committed as a ledger entry, nor change the outcome of
      the activity that stated the position.
    rationale: >-
      The Invite's emission was ledgered when it was first sent, so a resend changes
      nothing in the case file and is not a case event (ADR-0152). The activity that
      stated the position is judged on its own merits, as SYNC-18-007 requires of the
      rest of the answer to its position.
    relationships:
    - rel_type: refines
      spec_id: SYNC-17-006
    adr:
    - ADR-0163
    - ADR-0152
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` asserts a resend leaves the
      ledger unchanged, and that a stamped `Accept` that triggers one is applied with
      only its own entries committed.
    stories:
    - story_2022_045
  - id: SYNC-20-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT resend an Invite to a sender that is not on the case's
      roster, that was removed (CM-31-001), or whose closure the case records.
    rationale: >-
      A removed participant was taken out by the Case Owner's decision, and inviting it
      again would undo that decision (CM-31-013). A closed participant may act on
      nothing further (CM-23-018), and an actor off the roster was never sent an Invite
      to answer.
    relationships:
    - rel_type: refines
      spec_id: SYNC-20-001
    - rel_type: depends_on
      spec_id: CM-31-013
    adr:
    - ADR-0163
    verification: >-
      `test/core/use_cases/received/test_invite_resend.py` states a removed
      participant's position and asserts nothing is queued, and asserts that a
      participant owing two Invites owes none once it is closed and that an actor
      off the roster owes none; `test/core/behaviors/sync/test_position_statements.py`
      asserts a closed participant's `Read(CaseLedgerEntry)` is refused at the door.
    stories:
    - story_2022_045
