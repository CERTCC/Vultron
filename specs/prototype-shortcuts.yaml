id: PROTO
title: Prototype Shortcuts
description: >-
  Permissible shortcuts and relaxed constraints for the prototype stage, supporting
  iterative development while preserving traceability of production requirements.
scope:
- prototype
- production
tags:
- tooling
groups:
- id: PROTO-01
  title: Authentication
  specs:
  - id: PROTO-01-001
    priority: MAY
    kind: project
    statement: Omit cryptographic authentication for agent-to-agent communication.
    rationale: >-
      Cryptographic authentication needs key management and signature checks, and these
      do not change the protocol behavior under test. The prototype runs in local test
      and demo setups, so it can omit authentication and test the protocol logic first.
      The shortcut is for the prototype only. A production node must authenticate
      case update notifications (CM-06-004).
    relationships:
    - rel_type: supersedes
      spec_id: CM-06-004
- id: PROTO-02
  title: Federation
  specs:
  - id: PROTO-02-001
    priority: MAY
    kind: project
    statement: Assume all actors are local to a single ActivityPub server.
    rationale: >-
      Many tests and some demos host every actor in one server process. In those setups,
      the prototype does not need to find or reach actors on other servers, so the work
      stays on the CVD protocol logic.
  - id: PROTO-02-002
    priority: MAY
    kind: project
    statement: >-
      Post direct messages to an actor's inbox without federation or cross-server routing.
    rationale: >-
      ActivityPub federation adds actor discovery, server-to-server delivery rules and
      remote failure handling. The protocol logic needs only that a message gets to the
      recipient's inbox. A direct post does that with much less code, and the protocol
      behavior stays the same.
- id: PROTO-03
  title: Performance
  specs:
  - id: PROTO-03-001
    priority: SHOULD_NOT
    kind: project
    statement: Use algorithms with exponential or worse time complexity.
    rationale: >-
      Exponential time can make a small case or a test stop with no clear cause. Even in
      a prototype, that cost blocks tests and demos, so a simple algorithm that does not
      grow exponentially is the better choice.
  - id: PROTO-03-002
    priority: SHOULD
    kind: project
    statement: >-
      Prefer the simplest algorithm when multiple options exist, even if less efficient.
    rationale: >-
      In the prototype, code changes often as the design changes. Simple code is easier
      to read, review and change. The data sets are small, so a less efficient algorithm
      costs little.
  - id: PROTO-03-003
    priority: SHOULD
    kind: project
    statement: >-
      Implement straightforward optimizations that do not significantly increase complexity.
    rationale: >-
      Some optimizations cost almost nothing to read and keep, for example a set lookup
      in place of a list scan. They keep tests and demos fast and add no design risk, so
      there is no reason to wait for production.
  - id: PROTO-03-004
    priority: SHOULD
    kind: project
    statement: >-
      Document known unimplemented optimizations in implementation notes for future reference.
    rationale: >-
      An optimization that is known but not done can be forgotten. A note records it, so
      the work can start when production needs it, with no new investigation.
- id: PROTO-04
  title: Production Deferral
  specs:
  - id: PROTO-04-001
    priority: SHOULD
    kind: project
    statement: >-
      Specification files SHOULD mark a production-only requirement `PROD_ONLY` by
      giving it `scope: [production]`, so production-only requirements can be
      systematically identified and deferred during the prototype stage.
    rationale: >-
      The prototype omits some production requirements, such as authentication and
      federation. Without a mark, a reader cannot tell a deferred requirement from one
      that the prototype fails to meet. The mark lets a reader list the deferred
      requirements and leave them out of prototype work.
    lint_suppress:
    - phantom_symbol_ref
  - id: PROTO-04-002
    priority: SHOULD
    kind: project
    statement: >-
      Review specifications to identify requirements that should carry the `PROD_ONLY` tag.
    rationale: >-
      Production-only requirements occur in many spec files, and an author can forget
      the mark. A review finds the requirements that need it, so prototype work does not
      go to them and readers do not count them as gaps.
    lint_suppress:
    - phantom_symbol_ref
- id: PROTO-05
  title: Case Prioritization
  specs:
  - id: PROTO-05-001
    priority: MAY
    kind: project
    statement: >-
      Use a stub always-engage policy (`AlwaysPrioritizePolicy`) in place of a real prioritization
      framework.
    rationale: >-
      Case prioritization, for example with SSVC, is a policy decision outside the
      protocol state machines. A stub that always engages lets every case go through the
      full workflow, so tests and demos reach all protocol states with no real decision
      framework.
- id: PROTO-08
  title: Backward Compatibility and Change Completeness
  specs:
  - id: PROTO-08-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Add backward-compatibility shims when refactoring, renaming, moving, or removing code.
      Shims include re-export stubs, import aliases, wrapper functions, and deprecation stubs
      that exist solely to preserve old import paths or call signatures.
    rationale: >-
      Without shims a failing import immediately signals a missed call site; with a shim the
      missed update is invisible and accumulates as technical debt
  - id: PROTO-08-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Complete every code change fully — all call sites for a renamed, moved, or removed symbol
      MUST be updated in the same commit as the symbol change.
    rationale: >-
      If a rename leaves some call sites unchanged, the code is broken between commits,
      and a bisect or a revert can stop on a broken commit. When the symbol and all its
      call sites change in one commit, each commit stays consistent.
  - id: PROTO-08-003
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Preserve an old API, import path, field name, or function signature solely for backward
      compatibility.
    rationale: >-
      The prototype has no external consumers of its code API. An old name kept only for
      compatibility gives two names for one thing, and readers and agents can use the
      wrong one. When the old name goes, every caller uses the current name.
  - id: PROTO-08-004
    priority: SHOULD
    kind: project
    statement: >-
      Follow a documented deprecation cycle with migration guidance when external consumers
      of the API exist.
    rationale: >-
      When external code depends on the API, a sudden removal breaks that code with no
      warning. A documented deprecation cycle gives those consumers time and
      instructions to change before the old form goes.
    scope:
    - production
- id: PROTO-07
  title: Performance Testing
  specs:
  - id: PROTO-07-001
    priority: MAY
    kind: project
    statement: >-
      Performance tests and performance assertions MAY be skipped or marked as expected failures
      during the prototype stage
    rationale: >-
      Premature performance work distracts from correctness and architectural clarity; defer
      until exiting the prototype phase
    scope:
    - production
