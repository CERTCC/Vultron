id: MV
title: Message Validation
description: >-
  Requirements for validating ActivityStreams 2.0 activities at the inbox handler boundary,
  covering ActivityStreams structure and semantic validation. Invalid activities are rejected
  with appropriate error responses before dispatch.
version: 1.0.0
scope:
- prototype
- production
tags:
- messaging
- wire-format
groups:
- id: MV-01
  title: Activity Structure Validation
  specs:
  - id: MV-01-001
    priority: MUST
    kind: protocol
    statement: Incoming payloads MUST conform to ActivityStreams 2.0 structure
    verification: >-
      Integration tests in `test/demo/` confirm that the inbox handler rejects
      payloads missing required AS2 fields (e.g., `type`) with an HTTP 4xx response
      before dispatch.
    stories:
    - story_2022_012
    - story_2022_038
  - id: MV-01-005
    priority: MUST
    kind: protocol
    statement: >-
      The activity-type dispatch implementation MUST handle missing or null fields
      without raising unhandled exceptions.
    verification: >-
      A unit test confirms that passing activities with `None` or absent `type`,
      `actor`, and `object` fields to the dispatch router returns a dispatch result
      rather than raising an unhandled exception.
    lint_suppress:
    - missing_story_reference
  - id: MV-01-006
    priority: MUST
    kind: protocol
    statement: 'The activity-type dispatch implementation MUST treat unrecognized activity types as dispatching to `UNKNOWN`.'
    rationale: >-
      Mapping unknown types to UNKNOWN rather than failing allows the system to log
      and route unrecognised activities without crashing the dispatch pipeline.
    verification: >-
      A unit test confirms that an activity whose `type` is not in the registered
      dispatch map resolves to the `UNKNOWN` handler rather than raising an error.
    relationships:
    - rel_type: refines
      spec_id: MV-01-005
    lint_suppress:
    - missing_story_reference
  - id: MV-01-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The activity-type dispatch implementation MUST NOT propagate internal dispatch
      errors to callers.
    rationale: >-
      Propagating internal errors exposes implementation details to senders and can
      cause the inbox handler to return unexpected error responses.
    relationships:
    - rel_type: refines
      spec_id: MV-01-005
- id: MV-02
  title: Schema Validation
  specs:
  - id: MV-02-001
    priority: MUST
    kind: project
    statement: The system MUST use Pydantic models to validate activities
    relationships:
    - rel_type: implements
      spec_id: VP-15-001
  - id: MV-02-002
    priority: MUST
    kind: project
    statement: The system MUST reject activities that fail Pydantic validation with HTTP 422
  - id: MV-02-003
    priority: MUST
    kind: project
    statement: Validation error responses MUST include detailed error information
  - id: MV-02-004
    priority: MUST
    kind: project
    statement: The system MUST log validation failures at WARNING level
- id: MV-03
  title: Required Field Validation
  specs:
  - id: MV-03-001
    priority: MUST
    kind: protocol
    statement: The system MUST validate required fields based on activity type
    verification: >-
      A unit test confirms that activity-type-specific validators raise
      `ValidationError` when required per-type fields are absent from an otherwise
      valid AS2 payload.
    lint_suppress:
    - missing_story_reference
- id: MV-04
  title: Object Type Validation
  specs:
  - id: MV-04-001
    priority: MUST
    kind: protocol
    statement: The system MUST validate that object types are recognized Vultron types
    verification: >-
      A unit test confirms that an activity carrying an `object` whose `type` is not
      in the Vultron vocabulary is rejected with a validation error before dispatch.
    lint_suppress:
    - missing_story_reference
  - id: MV-04-002
    priority: SHOULD
    kind: protocol
    statement: >-
      For Create-style activities that create sub-objects (e.g., `CreateParticipant`), the
      activity `name` field SHOULD be a descriptive human-readable string identifying the
      actor, created object ID, and context (case ID)
- id: MV-05
  title: URI Validation
  specs:
  - id: MV-05-001
    priority: MUST
    kind: protocol
    statement: The system MUST validate that ID and reference fields contain valid URIs
    verification: >-
      A unit test confirms that the activity validator rejects activities whose `id`,
      `actor`, or `object` reference fields contain non-URI strings, and accepts
      well-formed URIs.
    lint_suppress:
    - missing_story_reference
  - id: MV-05-002
    priority: MUST
    kind: protocol
    statement: The system MUST treat ActivityStreams object IDs as opaque URIs
    verification: >-
      Inspection of `vultron/core/` confirms that no code parses or deconstructs
      object IDs beyond URI validation; IDs are stored and compared as opaque
      strings.
    lint_suppress:
    - missing_story_reference
- id: MV-09
  title: Outbound Activity Object Integrity
  specs:
  - id: MV-09-001
    priority: MUST
    kind: protocol
    statement: >-
      Outbound Vultron activities MUST carry a fully inline typed object in their
      `object_` field; a bare URI reference or `as_Link` is not permitted because
      the recipient has no access to the sender's DataLayer and cannot resolve the
      reference to determine the activity's semantic type.
    verification: >-
      Enforced at runtime in `vultron/adapters/driving/fastapi/outbox_delivery.py`;
      `VultronValidationError` is raised when `object_` is a bare string URI rather
      than a typed object.
    lint_suppress:
    - missing_story_reference
  - id: MV-09-002
    priority: MUST
    kind: protocol
    statement: >-
      The outbox handler MUST raise `VultronOutboxObjectIntegrityError` and abort delivery
      if an outbound activity's `object_` field is a bare string or `as_Link` after any DataLayer
      expansion attempt.
    verification: >-
      A unit test confirms that submitting an outbound activity with `object_` set to a
      bare string raises `VultronOutboxObjectIntegrityError` before any delivery attempt.
    lint_suppress:
    - missing_story_reference
  - id: MV-09-003
    priority: MUST
    kind: protocol
    statement: >-
      Vultron activity classes where semantic dispatch depends on the `object_` type MUST
      require `object_` at construction time — no `None` default is permitted.  An omitted
      or `None` `object_` renders the activity semantically meaningless because `ActivityPattern._match_field`
      returns `False` for `None`, causing every pattern that inspects `object_.type` to fail,
      which forces dispatch to `UNKNOWN`.
    verification: >-
      Inspection of activity class definitions in `vultron/wire/` confirms that classes
      whose dispatch logic inspects `object_.type` declare `object_` as a required field
      with no `None` default.
    lint_suppress:
    - missing_story_reference
- id: MV-10
  title: Stub Objects
  specs:
  - id: MV-10-001
    priority: MUST
    kind: protocol
    statement: >-
      Stub objects MUST carry at minimum an `id` field (full URI) and a `type` field; they
      MAY carry a `summary` field for human-readable context
    verification: >-
      A unit test confirms that the stub-object validator rejects objects missing either
      `id` or `type`, and accepts objects containing only those two required fields plus
      an optional `summary`.
    lint_suppress:
    - missing_story_reference
  - id: MV-10-002
    priority: MUST
    kind: protocol
    statement: 'Stub objects are ONLY permitted in the following field positions of an ActivityStreams activity: `actor`, `object`, `target`, and `origin`.'
    verification: >-
      Inspection of the inbound message validator confirms that stub detection runs only
      on `actor`, `object`, `target`, and `origin` fields; stubs in other field positions
      are treated as full-object validation failures.
    lint_suppress:
    - missing_story_reference
  - id: MV-10-003
    priority: MUST_NOT
    kind: protocol
    statement: The DataLayer MUST NOT overwrite a full domain object with a stub object
    rationale: >-
      A recipient may receive a stub for an object they already have in full; discarding preserves
      data completeness
  - id: MV-10-004
    priority: MUST_NOT
    kind: protocol
    statement: Inbound stubs MUST NOT be used to create new domain records
  - id: MV-10-005
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST satisfy BOTH of the following conditions before the case owner delivers
      full case details to them: 1. `ParticipantStatus.rm_state` is at least `RECEIVED` (the
      participant has accepted the case invitation and been admitted to the case) 2.
      `ParticipantStatus.embargo_adherence == True` (participant is a signatory to the active
      embargo), OR there is no active embargo (`CaseStatus.em_state == NONE`)
    note: >-
      Condition 1 previously read `rm_state == ACCEPTED`. That was incorrect and mutually
      unsatisfiable with the rest of the invitation lifecycle: CM-11-001 records an invitee at
      `RM.RECEIVED` on `Accept(Invite)`, and CM-11-002 has them reaching `ACCEPTED` only AFTER
      receiving the full case replica and running triage. Requiring `ACCEPTED` before delivery
      meant a participant could never obtain the full case they need in order to reach `ACCEPTED`.
      The condition's own parenthetical ("participant accepted the case invitation") describes
      `RM.RECEIVED`, confirming the intent was "is admitted to the case", not "has completed triage".
      The embargo condition (2) is the substantive gate on case content, per MV-10-006 and CM-18.
      The implementation follows this ordering: `accept_invite_tree` creates the invitee at
      `RM.RECEIVED`, auto-signs embargo consent when `EM.ACTIVE`, and only then emits
      `Announce(VulnerabilityCase)` with the full snapshot.
    verification: >-
      Integration tests in `test/demo/test_invite_actor_demo.py` confirm that the case
      replica is delivered to a new participant only after their `rm_state` reaches
      `RECEIVED` and embargo consent is auto-signed.
    relationships:
    - rel_type: depends_on
      spec_id: MV-10-006
    lint_suppress:
    - missing_story_reference
  - id: MV-10-006
    priority: MUST
    kind: protocol
    statement: >-
      When a participant `Accept`s an `Invite(case)` and the case has an active embargo (`CaseStatus.em_state
      == ACTIVE`), the acceptance MUST imply consent to the active embargo, transitioning
      that participant's consent state to `SIGNATORY`
    verification: >-
      Integration tests in `test/demo/test_invite_actor_demo.py` confirm that
      `AcceptInviteToEmbargoOnCaseReceivedUseCase` transitions the accepting
      participant's PEC state to `SIGNATORY` when `em_state == ACTIVE`.
    relationships:
    - rel_type: depends_on
      spec_id: CM-03-008
    lint_suppress:
    - missing_story_reference
