id: MV
title: Message Validation
description: >-
  Requirements for validating ActivityStreams 2.0 activities at the inbox handler boundary,
  covering ActivityStreams structure and semantic validation. Invalid activities are rejected
  with appropriate error responses before dispatch.
scope:
- prototype
- production
tags:
- messaging
- wire-format
groups:
- id: MV-01
  title: Activity Structure Validation
  specs:
  - id: MV-01-001
    priority: MUST
    kind: foundation
    statement: Incoming payloads MUST conform to ActivityStreams 2.0 structure
    rationale: >-
      Vultron messages are ActivityStreams 2.0 activities, so a payload that is not a
      well-formed AS2 activity has no defined meaning for the receiver. Refusing it at
      the parse threshold keeps malformed input away from semantic extraction and the
      handlers, which can then rely on AS2 structure.
    verification: >-
      Integration tests in `test/demo/` confirm that the inbox handler rejects
      payloads missing required AS2 fields (e.g., `type`) with an HTTP 4xx response
      before dispatch.
    note: >-
      Two distinct type lookups act on an inbound activity, and this requirement
      governs the first. Vocabulary-level type resolution (the AS2 `WIRE_TYPE_MAP` /
      `VOCABULARY`, consulted by `parse_activity`) is refused at the parse
      threshold: an activity whose `type` is absent from the AS2 vocabulary is
      rejected with `VultronParseUnknownTypeError` → HTTP 422 and never reaches
      dispatch. The separate "route to `UNKNOWN`" behaviour (MV-01-006) applies to
      the later semantic pattern registry lookup, not to vocabulary resolution
      (ISSUE-3217).
    stories:
    - story_2022_012
    - story_2022_038
    adr:
    - ADR-0005
    tags:
    - as2
  - id: MV-01-005
    priority: MUST
    kind: project
    statement: >-
      The semantic-dispatch stage — the type lookup that runs after `parse_activity`
      has already accepted the activity against the AS2 vocabulary — MUST handle
      missing or null fields without raising unhandled exceptions.
    rationale: >-
      An activity can pass the vocabulary check and still omit a field the patterns
      read. If a lookup on a missing field raised, one sparse message would fail the
      dispatch path in place of being routed as unrecognized.
    verification: >-
      A unit test confirms that passing activities with `None` or absent `type`,
      `actor`, and `object` fields to the dispatch router returns a dispatch result
      rather than raising an unhandled exception.
    note: >-
      "Dispatch" here is the semantic-pattern stage, not vocabulary resolution:
      malformed inputs that fail AS2 vocabulary resolution are already rejected at
      parse (MV-01-001), so this requirement and its refinements MV-01-006/007
      govern only activities that have passed the parse threshold (ISSUE-3217).
  - id: MV-01-006
    priority: MUST
    kind: project
    statement: >-
      The semantic-dispatch stage MUST treat an activity whose type matches no
      entry in the semantic pattern registry (`SEMANTIC_REGISTRY`, consulted by
      `find_matching_semantics`) as resolving to `MessageSemantics.UNKNOWN`. This
      is distinct from vocabulary-level resolution: an activity whose `type` is
      absent from the AS2 vocabulary is rejected at parse (MV-01-001) and never
      reaches this stage.
    rationale: >-
      Two registries look the activity up on the same value, so a bare "unrecognized
      type" is ambiguous between them. Reject-at-parse and route-to-`UNKNOWN` are both
      correct answers to differently scoped questions, and naming the registry is what
      tells them apart. Routing an unmatched semantic pattern to `UNKNOWN` lets the
      system log and continue in place of failing the dispatch pipeline.
    note: >-
      A vocabulary-recognised type can still resolve to `UNKNOWN` semantics — e.g.
      an `Accept` whose nested object was silently downgraded, so it matches no
      pattern. That is this path, not the parse rejection, and the two look
      identical in logs; naming the registry keeps an investigation pointed at the
      right layer (ISSUE-3217).
    verification: >-
      A unit test confirms that an activity whose `type` is not in the
      `SEMANTIC_REGISTRY` resolves to `MessageSemantics.UNKNOWN` rather than
      raising an error.
    relationships:
    - rel_type: refines
      spec_id: MV-01-005
  - id: MV-01-007
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/core/behaviors/inbox/test_process_payload.py::TestProcessPayloadRejectsInvalidInput::test_dispatch_failure_returns_rejected`
      confirms an internal dispatch error becomes a rejected outcome rather than
      propagating to the caller.
    statement: >-
      The semantic-dispatch stage MUST NOT propagate internal dispatch
      errors to callers.
    rationale: >-
      Propagating internal errors exposes implementation details to senders and can
      cause the inbox handler to return unexpected error responses.
    relationships:
    - rel_type: refines
      spec_id: MV-01-005
- id: MV-02
  title: Schema Validation
  specs:
  - id: MV-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The system MUST use Pydantic models to validate activities
    rationale: >-
      A Pydantic model declares one schema per activity type and checks it at
      construction, so every activity a handler sees already has the field types and
      required fields its type promises. Hand-written checks would drift from the
      classes they guard.
    relationships:
    - rel_type: implements
      spec_id: VP-15-001
  - id: MV-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The system MUST reject activities that fail Pydantic validation with HTTP 422
    rationale: >-
      A 422 tells the sender that its message was readable but not a valid activity,
      so it can correct the content in place of retrying the same message. Processing
      an invalid activity would let handlers act on data the schema says is wrong.
  - id: MV-02-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Validation error responses MUST include detailed error information
    rationale: >-
      A sender can correct a refused activity only if it knows which field failed and
      why. A bare refusal leaves a peer implementer guessing.
  - id: MV-02-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The system MUST log validation failures at WARNING level
    rationale: >-
      A validation failure means a peer sent something Vultron could not use. The
      receiver recovers by refusing it, but an operator needs to see it, and the log
      is the receiver's only record of a message it refused.
- id: MV-03
  title: Required Field Validation
  specs:
  - id: MV-03-001
    priority: MUST
    kind: protocol
    statement: The system MUST validate required fields based on activity type
    rationale: >-
      Each activity type needs particular fields to mean anything: an `Accept` with no
      `object` accepts nothing. Checking them per type refuses such an activity at the
      edge, so handlers need not guard against a missing field their activity type
      promises.
    verification: >-
      A unit test confirms that activity-type-specific validators raise
      `ValidationError` when required per-type fields are absent from an otherwise
      valid AS2 payload.
    lint_suppress:
    - missing_story_reference
  - id: MV-03-002
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST treat a required field that is present but blank as absent,
      and MUST report it with the same error as an omitted field. A blank value is
      an empty string or one containing only whitespace. A value that is present
      and non-blank but unparseable MUST be reported as a schema fault instead,
      not as a missing field.
    rationale: >-
      A blank value carries no information, so it is the same omission as a missing
      key (CS-08-001: if present, then non-empty), and one omission must draw one
      error and one status code however it is spelled. A guard that tested only the
      key would pass a blank `published` on to schema validation, which replaces
      CLP-15-006's explanation with a Pydantic dump. A non-blank value that does not
      parse is a different fault, so it stays on the schema path.
    verification: >-
      Unit tests in `test/wire/as2/test_parser.py` confirm that every blank
      spelling of `type` and `published` — empty, spaces, tabs, newlines — raises
      the same missing-field error as omitting the field, that
      `test/adapters/driving/fastapi/routers/actors/test_inbox.py` maps a blank
      `type` to HTTP 400 as an omitted `type` already was, and that non-blank
      unparseable values such as `"not-a-date"`, `0` and `[]` still raise the
      validation error.
    relationships:
    - rel_type: refines
      spec_id: MV-03-001
    adr:
    - ADR-0090
    lint_suppress:
    - missing_story_reference
- id: MV-04
  title: Object Type Validation
  specs:
  - id: MV-04-001
    priority: MUST
    kind: protocol
    statement: The system MUST validate that object types are recognized Vultron types
    rationale: >-
      The object's type decides an activity's semantic type and so its handler. An
      object of a type outside the Vultron vocabulary cannot be routed or validated,
      so accepting it would only move the failure to a handler that cannot act on it.
    verification: >-
      A unit test confirms that an activity carrying an `object` whose `type` is not
      in the Vultron vocabulary is rejected with a validation error before dispatch.
    lint_suppress:
    - missing_story_reference
  - id: MV-04-002
    priority: SHOULD
    kind: protocol
    statement: >-
      For Create-style activities that create sub-objects (e.g.,
      `Create(CaseParticipant)`), the activity `name` field SHOULD be a descriptive
      human-readable string identifying the actor, created object ID, and context (case
      ID)
    rationale: >-
      The ids in a `Create` of a sub-object do not tell a person reading a log or a
      timeline who created what in which case. A descriptive `name` lets an operator
      read the activity without resolving its ids.
  - id: MV-04-003
    priority: MUST_NOT
    kind: project
    statement: >-
      When an inline object's `type` resolves to a known wire vocabulary class, a
      receiver MUST NOT substitute a less specific type for it if validation
      against that class fails. The receiver MUST reject the enclosing activity as
      malformed instead. Resolution of an inline object's type MUST consider only
      wire-branch classes; an unresolved type leaves the object for its parent
      field to validate.
    rationale: >-
      Substituting a weaker type is silent data loss: an `Accept(Invite(...))` with
      one corrupt inner field would parse as a bare `as_Link`, extract as `UNKNOWN`
      and draw a 202. Refusal is safe only when resolution considers wire classes
      alone: a lookup that fell back to `CORE_TYPE_MAP` (ARCH-12-003) would resolve an
      inline actor's `inbox` to a core instance its wire parent rejects (ARCH-22-001),
      so valid messages would be refused. The core fallback is opt-in (VM-06-008).
    verification: >-
      Unit tests in `test/wire/as2/test_parser.py` confirm that an
      `Accept(Invite(...))` whose inner object carries an unparseable timestamp is
      rejected rather than parsed as an `as_Link`, and that an inline actor whose
      `inbox` and `outbox` use the core-only `OrderedCollection` type keeps its
      `as_VultronOrganization` subtype.
    relationships:
    - rel_type: refines
      spec_id: MV-04-001
    adr:
    - ADR-0090
- id: MV-05
  title: URI Validation
  specs:
  - id: MV-05-001
    priority: MUST
    kind: foundation
    statement: The system MUST validate that ID and reference fields contain valid URIs
    rationale: >-
      ActivityStreams 2.0 gives every `id` and every reference as an IRI, so a value
      that is not one is not a well-formed activity. Vultron inherits the rule.
    verification: >-
      A unit test confirms that the activity validator rejects activities whose `id`,
      `actor`, or `object` reference fields contain non-URI strings, and accepts
      well-formed URIs.
    stories:
    - story_2022_034
    - story_2022_030
    tags:
    - as2
  - id: MV-05-002
    priority: MUST
    kind: protocol
    statement: The system MUST treat ActivityStreams object IDs as opaque URIs
    rationale: >-
      An `id` identifies an object and carries no other meaning, so a receiver that
      reads structure into it depends on how one sender mints its identifiers.
      ActivityStreams 2.0 and ActivityPub require an `id` to be an IRI (MV-05-001) but
      say nothing about opacity, so the rule is not inherited: it is Vultron's own,
      binding every implementation that receives another's identifiers. A case stub's
      `id` is the case's ID with `/stub` appended, and still no receiver derives the
      case from it (CM-11-003).
    verification: >-
      Inspection of `vultron/core/` confirms that no code parses or deconstructs
      object IDs beyond URI validation; IDs are stored and compared as opaque
      strings.
    stories:
    - story_2022_030
- id: MV-09
  title: Outbound Activity Object Integrity
  specs:
  - id: MV-09-001
    priority: MUST
    kind: protocol
    statement: >-
      The `object` of an outbound Vultron activity MUST let its recipient determine the
      activity's semantic type: it is carried inline as a typed object, or by a reference
      the recipient can dereference to a typed object (AKM-05-003, AKM-05-004).
    rationale: >-
      A recipient routes an activity by its object's type (SE-01-001). An object it
      can neither read inline nor dereference leaves it unable to classify the
      activity, so the message cannot be acted on.
    verification: >-
      Satisfied in this codebase through AKM-03-003, which carries every `object` inline:
      `vultron/adapters/driving/fastapi/outbox_delivery.py` raises
      `VultronValidationError` when `object_` is a bare string URI rather than a typed
      object.
    stories:
    - story_2022_039
    - story_2022_106
  - id: MV-09-002
    priority: MUST
    kind: project
    statement: >-
      The outbox handler MUST raise `VultronOutboxObjectIntegrityError` and abort delivery
      if the sealed body of an outbound initiating activity carries a bare string or an
      `as_Link` as its `object`. The handler MUST NOT attempt to expand the reference from the
      DataLayer first: it is a dumb relay (VM-08-003), so a reference in `object` is refused as a
      factory defect, not repaired at delivery time.
    rationale: >-
      The outbox relays the body the act sealed, so inlining the object is the
      factory's job. Expanding a reference at delivery would make the sent body differ
      from the one the act recorded, and would hide the factory defect that produced
      the reference.
    verification: >-
      A unit test confirms that an outbound activity whose sealed body has `object` set to a
      bare string raises `VultronOutboxObjectIntegrityError` before any delivery attempt and
      without any DataLayer read beyond the sealed body itself.
  - id: MV-09-003
    priority: MUST
    kind: project
    statement: >-
      Vultron activity classes where semantic dispatch depends on the `object_` type MUST
      require `object_` at construction time — no `None` default is permitted.  An omitted
      or `None` `object_` renders the activity semantically meaningless because `ActivityPattern._match_field`
      returns `False` for `None`, causing every pattern that inspects `object_.type` to fail,
      which forces dispatch to `UNKNOWN`.
    rationale: >-
      A pattern that inspects the object's type fails on a missing object, so an
      activity built without one always dispatches to `UNKNOWN`. Requiring the field
      at construction turns that silent misrouting into an error where the activity is
      built.
    verification: >-
      Inspection of activity class definitions in `vultron/wire/` confirms that classes
      whose dispatch logic inspects `object_.type` declare `object_` as a required field
      with no `None` default.
- id: MV-10
  title: Stub Objects
  specs:
  - id: MV-10-001
    priority: MUST
    kind: protocol
    statement: >-
      A stub object MUST carry at minimum an `id` field (full URI), a `type` field and
      a non-empty `summary` field giving human-readable context, and a receiver MUST
      refuse a stub whose `summary` is absent or blank. The stub form is
      permitted ONLY for a case, as the distinct `VulnerabilityCaseStub` type of
      CM-11-013, and a receiver MUST classify a stub by its `type`. For every other
      object type, a sender that does not inline the full object MUST reference it by
      URI (or by an ActivityStreams `Link`), not by a partial inline object. The one
      exception is the actor reference of AKM-05-005: an actor the sender knows only by
      URI MAY travel as an inline object carrying exactly its `id` and `type`.
    rationale: >-
      The stub form is a narrow affordance, not a substitute for a full object. It
      serves one need: an invitee must decide whether to join a case before it may
      receive the case (MV-10-005), so the stub stands in for the case until the
      participant is active (CM-10-004). No other type has that need or is
      implemented. The summary is what tells the invitee what it is being asked to
      join; what it says is the sender's choice (CM-17-010).
    note: >-
      Partial inline objects of other types were never designed — a parser fallback
      swallowed their validation failures and handed the parent a raw dict, which
      MV-04-003 now refuses. Reading MV-10-001 as a general licence for partial inline
      objects would entrench a workaround for a capability Vultron lacks: dereferencing a
      URI in another actor's message into the resolved object. Design discussion:
      `notes/selective-disclosure.md`. The actor reference of AKM-05-005 is not a stub:
      it claims no field beyond the two the sender knows, and keeps the `type` a
      receiver routes `Offer(Actor)` and `Invite(Actor)` by (ADR-0159).
    verification: >-
      A unit test confirms that an inline object with `type: VulnerabilityCaseStub`
      resolves to the stub class, that a sparse inline object with `type:
      VulnerabilityCase` is validated as a case rather than read as a stub, and that a
      partial inline object of any other recognised wire type is refused under MV-04-003
      rather than degraded.
      `test/wire/as2/test_unknown_key_disposition.py::test_a_stub_without_a_summary_is_refused`
      asserts a stub with an absent, empty, or blank `summary` is refused at message
      validation; all three parametrize cases pass since #4165 was implemented. Bare URI
      references and `Link` objects remain accepted in all four positions named by MV-10-002.
    relationships:
    - rel_type: constrains
      spec_id: MV-04-003
    adr:
    - ADR-0090
    - ADR-0114
    - ADR-0159
    stories:
    - story_2022_039
  - id: MV-10-002
    priority: MUST
    kind: protocol
    statement: >-
      A `VulnerabilityCaseStub` object is ONLY permitted in the following field
      positions of an ActivityStreams activity: `actor`, `object`, `target`, and
      `origin`.
    rationale: >-
      Scopes the position rule to the one permitted stub type (MV-10-001). A reference in
      any of these positions may also be a bare URI or a `Link`; those forms are always
      acceptable and are unaffected by MV-04-003's refusal of malformed inline objects.
    verification: >-
      Inspection of the inbound message validator confirms that stub detection runs only
      on `actor`, `object`, `target`, and `origin` fields; stubs in other field positions
      are treated as full-object validation failures.
    lint_suppress:
    - missing_story_reference
    adr:
    - ADR-0114
    - ADR-0090
  - id: MV-10-003
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection of the DataLayer write paths confirms a stub object is never saved over
      an existing full domain object of the same id.
    statement: The DataLayer MUST NOT overwrite a full domain object with a stub object
    rationale: >-
      A recipient may receive a stub for an object they already have in full; discarding preserves
      data completeness
  - id: MV-10-004
    priority: MUST_NOT
    kind: project
    statement: Inbound stubs MUST NOT be used to create new domain records
    rationale: >-
      A stub carries only an id, a type and a summary, so a record built from it would
      be a hollow copy that later reads treat as the real object. The full case
      arrives only once the participant is active (MV-10-005), and a record created
      from the stub would bypass that gate.
    verification: >-
      `test/core/use_cases/received/actor/test_invite.py::TestInviteActorUseCases::test_a_received_stub_invite_stores_no_case`
      delivers a stub Invite, asserts it was processed, and asserts no
      `VulnerabilityCase` record exists afterwards.
  - id: MV-10-005
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST be active (CM-10-004) before the CASE_MANAGER delivers full
      case details to it.
    rationale: >-
      Full case details can include embargoed vulnerability information. Delivering
      them only to an active participant means that only an actor that has joined the
      case, and so answered its embargo, receives them (CM-10-004).
    verification_debt: '#3612'
    adr:
    - ADR-0114
    relationships:
    - rel_type: depends_on
      spec_id: MV-10-006
    stories:
    - story_2022_088
    - story_2022_023
    - story_2022_045
  - id: MV-10-006
    priority: MUST
    kind: protocol
    statement: >-
      When a participant accepts the stub Invite (`Accept(Invite(Actor,
      VulnerabilityCaseStub))`) and the case has an active embargo, the acceptance MUST
      imply consent to the active embargo, marking that participant's consent row
      for it `AGREED` (CM-11-001).
    rationale: >-
      An invitee decides from the stub whether to join, and joining a case under an
      active embargo means taking part under that embargo. Reading the acceptance as
      consent means no participant becomes active without a recorded answer to the
      embargo, which the delivery gate of MV-10-005 relies on.
    verification_debt: '#3612'
    relationships:
    - rel_type: depends_on
      spec_id: CM-03-008
    adr:
    - ADR-0114
    stories:
    - story_2022_023
    - story_2022_026
    - story_2022_052
- id: MV-11
  title: Inbound Unknown-Key Disposition
  specs:
  - id: MV-11-001
    priority: MUST
    kind: project
    statement: >-
      The parse edge (`parse_activity` in `vultron/wire/as2/parser.py`) MUST decide what
      happens to an unrecognised key on inbound data for every object at every depth — the
      activity envelope, an inline object whose `type` resolves to a wire class, an inline
      object whose `type` resolves to a core class, an inline `Link`, and an inline object
      with no `type` — by partitioning the arriving keys against the resolved class's declared
      spellings before validating it. A declared spelling is a field name, the camelCase alias
      the class generates for it, an explicit validation alias, or `@context`. The disposition
      MUST NOT depend on which branch the resolved class belongs to.
    rationale: >-
      Without one rule at the parse edge, an unknown key's fate depends on which class
      its object resolves to: a core class with `extra="forbid"` (ARCH-12-003) refuses
      it with a 422, while a wire class with Pydantic's default `extra="ignore"` drops
      it silently. Neither outcome is a receive-side decision; both come from
      configuration whose purpose is elsewhere. Under one object model (ADR-0099) the
      parser is the inbound wire-to-core seam, so it is the one place a receive-side
      rule can be stated once and hold everywhere (ADR-0032: validate at the edge;
      ARCH-21-002: inbound wire data stays lenient).
    verification: >-
      `test/wire/as2/test_unknown_key_disposition.py` drives `parse_activity` with an unknown
      key in each of the positions this requirement names and asserts the same disposition in
      every one: refused when the key is a near miss (MV-11-002), set aside and reported when
      it is foreign (MV-11-003). The partition is `vultron/wire/as2/unknown_keys.py` (#3921).
    relationships:
    - rel_type: depends_on
      spec_id: MV-04-003
      note: MV-04-003 decides which class an inline object resolves to; this requirement decides what happens to the keys that class does not declare.
    - rel_type: refines
      spec_id: ARCH-25-007
    adr:
    - ADR-0099
    - ADR-0032
  - id: MV-11-002
    priority: MUST
    kind: project
    statement: >-
      A receiver MUST refuse the whole activity, with the schema-fault response MV-02-002
      requires, when an unrecognised inbound key is a near miss for a declared spelling of the
      resolved class or matches a retired name. A key is a near miss when lowercasing it and
      removing every non-alphanumeric character yields the same string as a declared spelling
      treated the same way (so `Actor`, `attributed-to` and `ATTRIBUTEDTO` are near misses of
      `actor` and `attributedTo`). A spelling the resolved class accepts on input is declared,
      never a near miss: both roots validate by field name as well as by alias (CS-14-001,
      CS-14-002), so the snake_case field name `attributed_to` is a declared spelling of
      `attributedTo`. The JSON-LD keywords `@id` and `@type` are near misses of `id` and `type`
      by design, not an accident of the normalisation: AS2 spells these fields `id` and `type`
      with no `@` prefix, because the normative AS2 context aliases the keywords and AS2 Core
      section 2.1 requires the serialized form to be consistent with compaction under that
      context, so a document carrying `@id` or `@type` is legal JSON-LD but not a conforming
      AS2 document (MV-01-001). `@context` is the only JSON-LD keyword that is a declared
      spelling; a receiver MUST NOT declare `@id` or `@type` as an alias or exempt them from
      the near-miss test. The refusal MUST name the arriving key and the declared or
      retired spelling it resembles. The near-miss test MUST be exactly this normalisation plus
      the retired-name list: edit distance, prefix matching, or any other similarity measure
      MUST NOT be used.
    rationale: >-
      A near miss is a key the sender meant Vultron to read. Proceeding without it
      loses the sender's data with only a log line, while refusing tells the sender
      which field to fix. The normalisation is deliberately shallow: AS2 has many two-
      and three-letter property names within one character of each other, so an
      edit-distance model would misfire constantly, and a richer notion of "near" is
      not worth the cost (ARCH-25-008; ADR-0099). A retired name is not a spelling of
      anything, so it is on the list by name rather than by normalisation. The JSON-LD
      keywords are named so the refusal is understood as a decision: a peer that emits
      `@id`/`@type` skipped compaction or compacted under a context without the AS2
      aliases, and it meant the `id`/`type` Vultron reads. Setting the keywords aside
      would strip the object's identity and type and cascade into other refusals;
      declaring them as aliases would make Vultron a partial JSON-LD processor with no
      principled place to stop (full-IRI property names and `@value` objects are
      equally legal JSON-LD). Refusing tells the peer the compact spelling to send.
    verification: >-
      `test/wire/as2/test_unknown_key_disposition.py` asserts that a case variant and a
      separator variant (`attributed-to`) on the envelope and on an inline object, and a retired
      name on an inline object (the retired-name list holds status-dimension keys, which never
      sit on the envelope), each raise `VultronParseValidationError` whose message names both
      the arriving key and the spelling it resembles; that the JSON-LD keywords `@id` and
      `@type` on the envelope and on an inline object each raise the same parse-edge refusal
      naming `id` or `type`, not a Pydantic dump; that a snake_case field name is accepted
      as a declared spelling with nothing reported; and that no module under
      `vultron/wire/as2/` contains an edit-distance or similarity helper (`difflib`,
      Levenshtein, or equivalent).
    relationships:
    - rel_type: refines
      spec_id: MV-11-001
    - rel_type: depends_on
      spec_id: MV-02-002
    - rel_type: depends_on
      spec_id: MV-01-001
    adr:
    - ADR-0099
  - id: MV-11-003
    priority: MUST
    kind: project
    statement: >-
      An unrecognised inbound key that is not a near miss and not a retired name MUST be set
      aside and reported, not refused: the activity proceeds on its declared fields, and the
      receiver logs one INFO record per set-aside key carrying `activity_id`, the sender's
      `actor_id`, the dotted field path of the object the key sat on, and the key itself. A
      set-aside key MUST NOT be carried into the parsed object or appear in any dump of it;
      the raw body remains available as received evidence (VM-08-002).
    rationale: >-
      AS2 is designed to be extended, and refusing a peer's whole message for one
      property Vultron does not read is a federation cost with no benefit to the
      protocol. Silence is not acceptable either: an operator needs to see what peers
      send that Vultron ignores, and a spelling defect on Vultron's own side that
      escapes the near-miss test shows up here first. Carrying the key on the object
      would leak it into the stored form, which `extra="forbid"` refuses when the
      object is validated again, so the report is the only trace and the received
      evidence is the only copy.
    verification: >-
      `test/wire/as2/test_unknown_key_disposition.py` asserts, for an unknown key in each
      position MV-11-001 names, that `parse_activity` returns an activity, that the parsed
      object and its `by_alias` dump do not contain the key, and that exactly one INFO record
      names the key, the path, the activity id and the sender.
    relationships:
    - rel_type: refines
      spec_id: MV-11-001
    - rel_type: depends_on
      spec_id: SL-02-001
    - rel_type: depends_on
      spec_id: SL-02-002
    - rel_type: refines
      spec_id: ARCH-25-007
    adr:
    - ADR-0099
    - ADR-0086
  - id: MV-11-004
    priority: MUST
    kind: architecture
    statement: >-
      Setting inbound unknown keys aside at the parse edge MUST NOT loosen `extra="forbid"` on
      any core type (ARCH-12-003). The parse edge is the only door inbound data enters by, so a
      core class never sees an inbound unknown key; an unknown key on in-process or stored data
      remains a refusal. The retired-name list MV-11-002 consults MUST live in the wire layer
      and be consulted only at the parse edge; core types MUST NOT carry a per-class
      retired-key reject-guard (SDO-03-005).
    rationale: >-
      The two rules answer different questions. `extra="forbid"` asks "did this
      process build or store an object with a key it does not know?", which is always
      a bug. The parse edge asks "did a peer send a property Vultron does not read?",
      which is usually an extension. Keeping them separate lets the receive side be
      liberal while the stored side still refuses every unknown key, so lenient intake
      cannot let a silently dropped or misspelled field reach storage. A retired-key
      guard on a core class would duplicate the wire-side list in a second place that
      can drift from it.
    verification: >-
      `test/architecture/test_core_extra_forbid.py` continues to assert every `CoreObject`
      subclass forbids extras with no exemption list. A grep of `vultron/core/models/` finds no
      `mode="before"` validator that rejects a retired key by name: #3921 deleted
      `ParticipantStatus._reject_retired_vfd_keys`, and
      `test_no_core_module_names_a_retired_key` (`test/wire/as2/test_unknown_key_disposition.py`)
      fails if any string constant under `vultron/core/` names a key on the wire-side
      `RETIRED_NAMES` list.
    relationships:
    - rel_type: derives_from
      spec_id: ARCH-12-003
    - rel_type: refines
      spec_id: SDO-03-005
    - rel_type: refines
      spec_id: ARCH-25-007
    adr:
    - ADR-0099
  - id: MV-11-005
    priority: MUST_NOT
    kind: architecture
    statement: >-
      After `parse_activity` returns, the receive path MUST NOT re-validate an inline object
      from the raw request body. The parsed object graph is the authority for what arrived in
      each slot; the raw body is received evidence, kept for audit, not a second source to
      parse from.
    rationale: >-
      A re-parse from the raw body sees the keys the parse edge set aside and, on a
      core class, fails on them; a fallback to a base class on that failure would
      store the wrong class silently. The parser itself resolves each inline object to
      its specific class (MV-04-003), so a second parse has nothing to recover.
    verification: >-
      `test/architecture/test_no_receive_path_reparse.py` fails on any `model_validate` or
      `model_validate_json` call under `vultron/adapters/driving/` or `vultron/core/` whose
      argument is built from `received_evidence` or from a raw-body name, directly or through
      a local assigned from one. `test/adapters/driving/fastapi/test_inbox_staging.py` asserts
      that ingress stages the class the parser produced, including a case stub and a case
      whose foreign key was set aside (#3922).
    relationships:
    - rel_type: depends_on
      spec_id: MV-11-003
    - rel_type: depends_on
      spec_id: MV-04-003
    adr:
    - ADR-0099
