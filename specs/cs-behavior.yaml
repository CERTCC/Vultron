- id: CSB-11
  title: Enter CS Fix Deployed (D)
  trigger:
    type: state_entered
    value: CS.D
  specs:
  - id: CSB-11-001
    priority: SHOULD
    kind: protocol
    statement: >-
      When a Participant enters CS Fix Deployed (q^cs ∈ VFD···) with an active
      embargo (q^em ∈ {A, R}), the Case Owner, or the CASE_MANAGER it delegates
      to, SHOULD terminate the embargo by emitting ET.
    rationale: >-
      VP-14-010 recommends terminating any existing embargo once the fix has
      been deployed. Constraint C-35: embargo termination SHOULD follow fix
      deployment. Ending an embargo is the Case Owner's decision, or the
      delegated CASE_MANAGER's, so the Participant that deploys the fix reports
      its CS change and does not emit ET itself (EMB-03-003, ADR-0118,
      EP-09-008). The Case Owner can hold the CASE_MANAGER role itself.
    verification: >-
      Integration tests in `test/demo/` confirm that after a Participant enters
      CS Fix Deployed with an active embargo, the Case Owner or the CASE_MANAGER
      emits ET and EM reaches EXITED.
    testable: true
    preconditions:
    - cs_pattern: "VFD..."
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern VFD...
    steps:
    - order: 1
      actor: Case Owner or CASE_MANAGER
      action: Emit ET to terminate the active embargo
      expected: ET queued for participants; EM begins transitioning to EXITED
    postconditions:
    - description: ET emitted; EM is EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-010
      note: >-
        By the time a fix has been deployed, any existing embargo SHOULD
        terminate
    stories:
    - story_2022_014

  - id: CSB-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Fix Deployed SHOULD emit CD to announce the
      transition to other case Participants.
    rationale: >-
      State-change notifications support shared situation awareness. CD informs
      other Participants that the fix is deployed, allowing them to coordinate
      publication and embargo termination decisions.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Fix
      Deployed emits CD to case participants.
    testable: true
    preconditions:
    - cs_pattern: "VFD..."
      description: CS matches pattern VFD...
    steps:
    - order: 1
      actor: participant
      action: Emit CD to announce Fix Deployed CS transition
      expected: CD queued for case participants
    postconditions:
    - description: CD emitted; other Participants informed of D transition
    stories:
    - story_2022_062

- id: CSB-12
