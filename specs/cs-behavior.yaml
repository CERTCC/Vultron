    testable: true
    preconditions:
    - cs_pattern: "...PX."
      description: CS matches pattern ...PX.
    steps:
    - order: 1
      actor: receiver
      action: Emit CK to acknowledge receipt of CX (no state change)
      expected: CK queued for sender; CS and EM states unchanged
    postconditions:
    - description: CK emitted; no state change
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-005
      note: 'CX shorthand wire-type mapping'

  - id: CSB-05-006
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and not yet exploit-public (q^cs ∈ ···px·) and EM Proposed
      (q^em ∈ P) receiving CX MUST transition EM to None (q^em P → N).
    rationale: >-
      Exploit publication makes further embargo negotiation moot; the pending
      proposal is abandoned per VP-09-001.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CX with EM Proposed
      and CS ···px· transitions EM from PROPOSED to NONE.
    testable: true

  - id: CSB-05-007
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and not yet exploit-public (q^cs ∈ ···px·) and EM Proposed
