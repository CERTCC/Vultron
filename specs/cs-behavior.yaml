- id: CSB-15
  title: Trigger-Side VFD Role Preconditions
  description: >-
    Precondition requirements for self-reported CS trigger endpoints
    (notify-fix-ready, notify-fix-deployed, notify-published). These complement the
    receive-side CSB-02, CSB-03, and CSB-04 groups by specifying which CVD roles may
    initiate each VFD transition locally and what state each trigger endpoint MUST set.
  specs:
  - id: CSB-15-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST hold the VENDOR role in the case to report its own fix-ready
      transition (f → F). A participant without the VENDOR role has no vendor-fix (vf)
      path, and MUST NOT report or record that transition.
    rationale: >-
      Fix readiness (F event) represents that the actor has produced a fix. Only
      actors who develop or maintain the affected product (Vendors) can produce a
      fix; Deployers operate existing deployments and do not produce fixes. Finders,
      Reporters, and Coordinators likewise MUST NOT self-report fix readiness.
    adr:
    - ADR-0075
    verification: >-
      `test/core/states/test_participant_transitions.py` confirms the participant
      transition rules refuse a vendor-path or deployer-path assertion from an actor
      that lacks the matching role.
    testable: true
    preconditions:
    - description: A participant is about to report its own f → F transition
    steps:
    - order: 1
      actor: participant
      action: Check that the participant holds the VENDOR role in the case
      expected: The check passes for a Vendor; the transition is refused otherwise
    - order: 2
      actor: participant
      action: If the check passes, record its vf state as F and report it
      expected: The participant's status shows F; the report goes to the CASE_MANAGER
    postconditions:
    - description: Only a VENDOR participant records or reports F

    stories:
    - story_2022_107
    - story_2022_036
  - id: CSB-15-005
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST refuse, in the trigger tree and before writing anything, a
      fix-ready transition (CSB-15-001) requested by an actor whose recorded case roles
      lack VENDOR. The participant status model MUST NOT itself reject a stray `vf`
      dimension: enforcement sits in the trigger guard and in the receive path's refusal
      of a whole status (RSH-09-003), which judge the actor by its recorded roles rather
      than the roles a status claims.
    rationale: >-
      The status a sender builds only claims roles; the case records which roles the
      sender holds. A raise when the status is built would judge a sender by the roles
      its status claims. The trigger guard and the receive path judge it by the roles
      the case records, which is the authority for roles.
    verification: >-
      `test/core/behaviors/case/nodes/test_vfd_role_guards.py`
      (`test_vendor_guard_failure_for_deployer_only_actor`,
      `test_vendor_guard_failure_for_coordinator_actor`) confirms the trigger guard
      refuses a non-Vendor, and `test/core/models/test_participant_status_shape.py`
      (`test_stray_vf_on_non_vendor_is_not_rejected_by_the_model`) confirms the model
      does not raise.
    relationships:
    - rel_type: implements
      spec_id: CSB-15-001
  - id: CSB-15-002
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST hold the DEPLOYER role in the case to report its own
      fix-deployed transition (d → D). A participant without the DEPLOYER role has no
      deployer (d) path, and MUST NOT report or record that transition.
    rationale: >-
      Fix deployment (D event) represents applying a fix in one's own environment.
      Only actors who are responsible for operating deployed instances (Deployers) can
      perform this action. A shipping-product Vendor who does not control downstream
      deployment holds only the VENDOR role, not DEPLOYER, and has no deployer path.
    adr:
    - ADR-0075
    verification: >-
      `test/core/use_cases/triggers/case/test_add_participant_status.py` confirms that a
      deployer-path assertion from an actor without the DEPLOYER role is refused and
      writes no status.
    testable: true
    preconditions:
    - description: A participant is about to report its own d → D transition
    steps:
    - order: 1
      actor: participant
      action: Check that the participant holds the DEPLOYER role in the case
      expected: The check passes for a Deployer; the transition is refused for a
        VENDOR-only or any other non-DEPLOYER participant
    - order: 2
      actor: participant
      action: If the check passes, record its d state as D and report it
      expected: The participant's status shows D; the report goes to the CASE_MANAGER
    postconditions:
    - description: Only a DEPLOYER participant records or reports D

    stories:
    - story_2022_107
    - story_2022_036
  - id: CSB-15-006
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST refuse, in the trigger tree and before writing anything, any
      deployer-path (d) assertion (CSB-15-002) requested by an actor whose recorded case
      roles lack DEPLOYER. The participant status model MUST NOT itself reject a stray
      `d` dimension, for the reason CSB-15-005 gives for `vf`.
    rationale: >-
      A non-Deployer that asserts the not-deployed state `d` still claims a dimension it
      does not have. If the gate covered only `D`, such a participant could still write
      the deployer dimension, and readers would treat it as a deployer. The gate
      therefore covers `d` as well as `D`.
    verification: >-
      `test/core/use_cases/triggers/case/test_add_participant_status.py`
      (`test_deploy_requires_deployer_role_at_write_node`,
      `test_d_not_deployed_requires_deployer_role_at_write_node`) and
      `test/core/behaviors/case/nodes/test_vfd_role_guards.py`
      (`test_deployer_guard_failure_for_vendor_only_actor`) confirm the refusal, and
      `test/core/models/test_participant_status_shape.py`
      (`test_stray_d_on_non_deployer_is_not_rejected_by_the_model`) confirms the model
      does not raise.
    relationships:
    - rel_type: implements
      spec_id: CSB-15-002
  - id: CSB-15-003
    priority: MUST
    kind: protocol
    statement: >-
      A participant reporting that the vulnerability is public MUST record only the P
      event (pxa → Pxa) in its participant status. The D event (fix deployed) is
      participant-specific and distinct from the P event (public awareness), so a report
      of P MUST NOT also advance the d dimension.
    rationale: >-
      Conflating P and D transitions causes non-deployer actors (Finders, Reporters,
      Coordinators) to incorrectly acquire deployment state when they announce public
      disclosure. The P event is participant-agnostic; the D event is valid only for a
      DEPLOYER participant that has separately completed deployment (CSB-15-002).
    verification: >-
      `test/core/use_cases/triggers/case/test_add_participant_status.py`
      (`test_notify_published_status_is_its_declared_occasion`) confirms the status a
      public-awareness report sends records P and carries no vf or d claim.
    testable: true
    preconditions:
    - description: A participant reports that the vulnerability is public
    steps:
    - order: 1
      actor: participant
      action: Record P (Pxa) in its participant status
      expected: Public awareness recorded
    - order: 2
      actor: participant
      action: Leave the vf and d dimensions unchanged (do not advance d to D)
      expected: vf and d reflect prior state; D event not triggered by P event
    postconditions:
    - description: >-
        The participant status records P; its vf and d dimensions are unchanged; a
        participant reporting fix deployment reports it separately, and must hold the
        DEPLOYER role (CSB-15-002)

    stories:
    - story_2022_069
    - story_2022_107
  - id: CSB-15-004
    priority: MUST
    kind: protocol
    statement: >-
      A participant that holds the DEPLOYER role but not the VENDOR role MUST be permitted
      to make the d→D transition only when at least one participant holding the VENDOR role
      in the same case has reached F (fix ready). Such a participant has no vendor-fix (VF)
      state of its own and is at d before the transition; the transition moves it to D,
      recording deployment of a fix another participant produced.
    rationale: >-
      A participant with the DEPLOYER role and no VENDOR role has a deployer path and no
      vendor path (ADR-0075). It can deploy only a fix that exists, so its d→D move
      waits until at least one VENDOR participant in the case is at F. Its d dimension
      starts at d and moves to D when that gate passes. The gate asks only that some
      VENDOR is at F, because the protocol does not record which vendor a deployer
      depends on, and a rule that named the vendor would need that record.
    adr:
    - ADR-0075
    verification: >-
      Integration tests confirm that the fix-deployed trigger refuses a DEPLOYER-only
      actor when no VENDOR participant in the case is at F (causal gate not satisfied),
      and advances its d state to D when at least one VENDOR participant is at F.
    testable: true
    preconditions:
    - description: >-
        The participant holds the DEPLOYER role but not VENDOR in the case (no vendor
        path; deployer path at d); at least one other participant holds the VENDOR role
        and is at F
    steps:
    - order: 1
      actor: participant
      action: >-
        Check that the participant holds DEPLOYER and not VENDOR, and that at least one
        participant in the case holds VENDOR and is at F (causal gate)
      expected: All checks pass; d → D transition allowed
    - order: 2
      actor: participant
      action: Record its d state as D and report it
      expected: >-
        d is D (it was d); the participant still has no vendor path; the report goes to
        the CASE_MANAGER
    postconditions:
    - description: >-
        The DEPLOYER-only participant records D with no vendor path throughout; at least
        one VENDOR participant is at F in the same case
    relationships:
    - rel_type: refines
      spec_id: CSB-15-002
      note: >-
        CSB-15-002 gates d→D on the DEPLOYER role; CSB-15-004 adds the causal
        precondition requiring at least one VENDOR participant to be at F first
    tags:
    - state-machine
    - protocol
    lint_suppress:
    - missing_story_reference
- id: CSB-16
  title: CS Write-Boundary Transition Validation
  description: >-
    Requirements for CS state write paths (VFD and PXA) to validate
    source→target transition validity before persisting a ParticipantStatus
    snapshot. Complements CSB-15 (trigger-side role preconditions) and
    SDO-02-002 (dimension object transition contract) by requiring that
    the BT write node itself is fail-closed regardless of upstream guard
    coverage.
  specs:
  - id: CSB-16-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST advance its own vendor-path (vf) or deployer-path (d)
      dimension only along a transition the respective sub-machine permits (CS_vf for
      the vendor path, CS_d for the deployer path). Restating the current state is a
      status confirmation and is permitted. A backward move or an illegal jump MUST NOT
      be recorded.
    rationale: >-
      A participant's status is its own claim about the case, and every other
      participant reads it. A jump the sub-machine does not permit therefore misstates
      the history of the vulnerability (SDO-02-004). The vendor and deployer paths are
      separate sub-machines (ADR-0075), so a participant that holds both roles is held
      to each path independently. The rule covers a participant's own writes. A receiver
      applies a weaker forward-only check to the status of a peer, because a peer can
      advance several steps between two messages.
    adr:
    - ADR-0075
    verification: >-
      `test/core/use_cases/triggers/case/test_add_participant_status.py`
      (`test_ac1_invalid_vf_jump_raises_and_persists_nothing`,
      `test_backward_d_raises_and_persists_nothing`) confirms an illegal vf jump and a
      backward d move are each refused with no status recorded, and
      `test/bt/test_case_states/test_transitions.py` exercises the permitted vf and d
      transitions.
    testable: true
    preconditions:
    - description: >-
        A participant is about to record a new vf state (Vendor path) or d state
        (Deployer path) for itself
    steps:
    - order: 1
      actor: participant
      action: Read its current vf state (if a Vendor) or d state (if a Deployer)
      expected: Current dimension state available; a participant without the role has
        no such dimension
    - order: 2
      actor: participant
      action: >-
        For each dimension it holds: if the target is the current state, proceed; if
        the sub-machine permits current → target, proceed; otherwise refuse
      expected: Only permitted transitions or same-state confirmations are recorded
    postconditions:
    - description: >-
        No participant status with an illegal vf or d jump is recorded
    relationships:
    - rel_type: implements
      spec_id: SDO-02-004
    - rel_type: refines
      spec_id: BTND-10-001

    stories:
    - story_2022_088
    - story_2022_074
  - id: CSB-16-003
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST validate a local vf or d write (CSB-16-001) at the write
      boundary — the BT node or helper that writes the participant status — and not
      only in upstream guards. An illegal transition MUST make the node return
      `Status.FAILURE`, or the helper raise, without writing to the DataLayer. The
      received path's weaker forward-only check is out of scope.
    rationale: >-
      A guard can be too weak, missing or bypassed, and then an invalid jump reaches the
      write node. A check at the write boundary fails closed whatever the guards cover,
      so no invalid vf or d state reaches the store.
    verification: >-
      `test/core/use_cases/triggers/case/test_add_participant_status.py`
      (`test_invalid_vf_jump_blocked_at_write_node`,
      `test_same_state_vf_write_allowed_at_write_node`,
      `test_ac1_invalid_vf_jump_raises_and_persists_nothing`) confirms an illegal vf
      jump is refused at the write node and by the helper with nothing persisted, and
      that a same-state write succeeds.
    relationships:
    - rel_type: implements
      spec_id: CSB-16-001
  - id: CSB-16-002
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST advance a PXA state it records, in its own participant status
      or in the case status, only along a transition the PXA state machine permits.
      Restating the current state is permitted. A backward move MUST NOT be recorded.
    rationale: >-
      PXA events are forward-only (p→P, x→X, a→A). Public awareness, a public exploit or
      observed attacks cannot become untrue later. A backward PXA write would show a
      false regression in the case record, and every participant reads that record. The
      rule that limits the vf and d paths to permitted transitions (CSB-16-001) applies
      to PXA for the same reason.
    verification: >-
      `test/core/use_cases/triggers/case/test_add_participant_status.py`
      (`test_ac3_backward_pxa_raises_and_persists_nothing`) confirms a backward PXA move
      is refused and no status is recorded.
    testable: true
    preconditions:
    - description: A participant is about to record a new PXA state
    steps:
    - order: 1
      actor: participant
      action: Read the current PXA state
      expected: Current PXA state available
    - order: 2
      actor: participant
      action: >-
        If the target is the current state, proceed; if the PXA state machine permits
        current → target, proceed; otherwise refuse
      expected: Only permitted transitions or same-state confirmations are recorded
    postconditions:
    - description: No status with an illegal PXA regression is recorded
    relationships:
    - rel_type: implements
      spec_id: SDO-02-004
    - rel_type: refines
      spec_id: BTND-10-001

    stories:
    - story_2022_088
    - story_2022_074
  - id: CSB-16-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST validate a local PXA write (CSB-16-002) at the write boundary —
      the BT node or helper that writes the case or participant status. A backward move
      MUST make the node return `Status.FAILURE`, or the helper raise, without writing
      to the DataLayer.
    rationale: >-
      A backward PXA move would say that public awareness, a public exploit or observed
      attacks are no longer true, which cannot happen. The guards can miss such a move,
      as they can miss a vf or d jump (CSB-16-003). The write boundary refuses it and
      persists nothing, so the store never holds a backward PXA state.
    verification: >-
      `test/core/use_cases/triggers/case/test_add_participant_status.py`
      (`test_ac3_backward_pxa_raises_and_persists_nothing`) confirms the helper raises
      on a backward PXA move and persists nothing.
    relationships:
    - rel_type: implements
      spec_id: CSB-16-002
- id: CSB-17
  title: CS Compound State and History Validity
  description: >-
    CS-internal validity invariants over the compound (VFD x PXA) case state
    and over whole case histories. Where CSB-16 validates a single write at
    the persistence boundary, CSB-17 defines which compound states exist,
    which single-event transitions between them are causally possible, and
    which orderings of the six CS events a real case could have produced.
    Mined from the legacy `vultron.core.case_states` hypercube model and
    re-expressed against the current CS enums; see ADR-0060.
  specs:
  - id: CSB-17-001
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST treat exactly 32 compound CS states as valid: the
      cross product of the 4 valid VFD states (vfd, Vfd, VFd, VFD) and the 8
      PXA states.
    rationale: >-
      The VFD dimension is a linear chain, not a free product of three bits:
      readiness presupposes awareness and deployment presupposes readiness.
      Enumerating only the reachable combinations makes the two impossible
      combinations unrepresentable rather than merely rejected at runtime,
      which is why `CS_vfd` has four members and not eight.
    verification: >-
      Inspection of `vultron/core/states/` confirms that the CS compound enum has
      exactly 32 members, one per valid combination of the 4 VFD states and 8
      PXA states.
    testable: true
    postconditions:
    - description: The CS enum has exactly 32 members, one per valid compound state
    relationships:
    - rel_type: refines
      spec_id: SM-09-002
      note: >-
        SM-09-002 states the vF/fD prohibition as a rejection rule; this
        refines it to a structural guarantee by enumerating only the 32
        reachable combinations, so the impossible ones are unrepresentable.
    adr:
    - ADR-0060
    stories:
    - story_2022_045
    - story_2022_074

  - id: CSB-17-002
    priority: MUST
    kind: protocol
    statement: >-
      A CS transition MUST change exactly one of the six CS dimensions, and
      MUST change it from the not-yet-happened value to the happened value.
    rationale: >-
      CS events are irreversible and are observed one at a time; a compound
      state change of Hamming distance greater than one conflates two distinct
      events and loses their ordering, which is exactly the information history
      validity depends on. These two conditions alone admit 72 transitions;
      applying the ephemeral-state rule of CSB-17-003 leaves exactly 58 valid
      CS transitions.
    verification: >-
      A unit test confirms that the transition validator accepts exactly the 58 valid
      single-event transitions and rejects all multi-dimension, reversal, and
      VFD-prerequisite-skip cases.
    testable: true
    preconditions:
    - description: A (source, destination) pair of compound CS states
    steps:
    - order: 1
      actor: validator
      action: >-
        Identify the single dimension that differs between source and
        destination; reject if more than one differs. If none differs, the
        write is a same-state re-assertion, which CSB-16-001 and CSB-16-002
        permit as a status confirmation: accept it only when the caller has
        opted in (the allow_null parameter), and reject it otherwise, because a
        transition validator's default answer for "no change" must be "that is
        not a transition".
      expected: A single CS event accounts for the change, or the caller has
        explicitly asked for same-state writes to pass
    - order: 2
      actor: validator
      action: >-
        Delegate to the changed dimension's own transition table
        (is_valid_vfd_transition or is_valid_pxa_transition).
      expected: Monotonicity and VFD prerequisite ordering are enforced
    - order: 3
      actor: validator
      action: >-
        Apply the ephemeral-state rule of CSB-17-003 to the source state.
      expected: A transition out of a vP or pX state fires only the event that
        state requires
    postconditions:
    - description: Only Hamming-distance-1 monotone transitions are accepted
    relationships:
    - rel_type: constrains
      spec_id: CSB-16-001
      note: >-
        Adds the one-dimension-at-a-time and monotonicity constraints that a
        per-dimension write validator cannot see. The same-state write CSB-16
        permits is preserved via the opt-in described in step 1.
    - rel_type: constrains
      spec_id: CSB-16-002
    - rel_type: depends_on
      spec_id: CSB-17-003
      note: The 58-transition count holds only with the ephemeral rule applied.
    adr:
    - ADR-0060

    stories:
    - story_2022_045
    - story_2022_074
  - id: CSB-17-003
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST treat the compound states vP (public aware while
      the vendor is unaware) and pX (exploit public while the public is
      unaware) as ephemeral.
    rationale: >-
      Neither condition can persist in reality: public awareness reaches the
      vendor, and a published exploit makes the public aware. Modelling these
      as ephemeral rather than invalid preserves the causal ordering of the
      events while forbidding the case from progressing in any other direction
      first. The pX ephemeral rule is the pX to PX invariant of CSB-13-001
      generalised from the entry cascade to every successor of a pX state.
    verification: >-
      A unit test confirms that vP and pX are classified as ephemeral states each with
      exactly one valid forced successor and that no other successor is accepted.
    testable: true
    preconditions:
    - description: The case is in one of the 12 ephemeral compound CS states
    postconditions:
    - description: Each ephemeral state has exactly one valid successor state
    relationships:
    - rel_type: extends
      spec_id: CSB-13-001
    - rel_type: refines
      spec_id: SM-09-001
      note: >-
        SM-09-001 governs the persistence boundary: an incoming status write
        carrying vP or pX MUST be promoted to the forced form before it is
        stored. CSB-17-003 governs trajectory validation, where the same two
        conditions are modelled as ephemeral states with exactly one legal
        successor. The two are consistent because they apply at different
        boundaries: no vP or pX state is ever persisted, but such a state is
        still a legal intermediate point in a replayed history, and CSB-17-004
        therefore permits a history prefix to end in one.
    adr:
    - ADR-0060

    lint_suppress:
    - missing_story_reference
  - id: CSB-17-004
    priority: SHOULD
    kind: protocol
    statement: >-
      A consumer validating a reported CS history SHOULD validate it causally
      by replaying the event sequence through CSB-17-002 and CSB-17-003 from
      the initial state vfdpxa, rather than checking states point-in-time or
      comparing wall-clock timestamps. A complete history contains all six CS
      events exactly once; there are exactly 70 valid complete histories out of
      720 orderings.
    rationale: >-
      Validity of a case trajectory is a property of the whole ordered
      sequence, not of any single state: VFDPXA and VFDXAP visit only valid
      states, but only the first is a possible case history. Wall-clock
      timestamps cannot substitute, because they may be missing, skewed, or
      recorded by different participants. SHOULD rather than MUST because a
      consumer holding only a current state, with no event log to replay,
      cannot do better.
    verification: >-
      A unit test confirms that replaying all 70 valid complete CS event histories
      passes validation and that at least one invalid ordering (e.g., X before V)
      is rejected.
    testable: true
    preconditions:
    - description: An ordered sequence of CS events, possibly incomplete
    steps:
    - order: 1
      actor: validator
      action: Reject any event that occurs more than once in the sequence
      expected: Each CS event happens at most once
    - order: 2
      actor: validator
      action: >-
        Replay the sequence from vfdpxa, requiring each step to satisfy
        CSB-17-002 and CSB-17-003 given every event that preceded it.
      expected: Causally impossible orderings are rejected
    postconditions:
    - description: A complete valid history terminates in VFDPXA
    adr:
    - ADR-0060

  - id: CSB-17-005
    priority: MUST
    kind: protocol
    statement: >-
      An incomplete CS history MUST be validated as a prefix.
    rationale: >-
      Real cases are usually still in progress, so requiring six events would
      reject every live case. Ending in an ephemeral state is unavoidable at the
      prefix level: CSB-17-003's forced successor has not happened yet when the
      prefix is cut, which is different from persisting an ephemeral state —
      SM-09-001 still forbids that. Pinning acceptance to CSB-17-004's prefix
      closure keeps both directions honest: a validator that merely never
      rejects a genuine prefix could still accept dead ends.
    verification: >-
      A unit test confirms that every valid prefix of the 70 complete CS histories is
      accepted and that dead-end prefixes with no valid completion are rejected.
    testable: true
    preconditions:
    - description: An ordered sequence of CS events with fewer than six entries
    steps:
    - order: 1
      actor: validator
      action: >-
        Apply CSB-17-004's replay to the sequence without requiring that it
        terminate in VFDPXA.
      expected: >-
        The prefix is accepted iff it is a prefix of at least one valid
        complete history
    postconditions:
    - description: >-
        A prefix ending in an ephemeral state is accepted, and its forced
        successor per CSB-17-003 is the only legal continuation
    relationships:
    - rel_type: refines
      spec_id: CSB-17-004
    - rel_type: depends_on
      spec_id: CSB-17-003
    adr:
    - ADR-0060

    stories:
    - story_2022_045
    - story_2022_074
  - id: CSB-17-006
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST NOT allow a fix to be ready while the vendor is
      unaware (the vF compound state is impossible).
    rationale: >-
      Fix readiness presupposes vendor awareness; the vF combination is
      structurally excluded from the 32 valid compound CS states.
    verification: >-
      Inspection of `vultron/core/states/` confirms no enum member encodes vF; a unit
      test confirms that a vfd→VFd transition skipping V is rejected as an
      illegal VFD jump.
    testable: true
    stories:
    - story_2022_045
    - story_2022_074

  - id: CSB-17-007
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST NOT allow a fix to be deployed that was never
      ready (the fD compound state is impossible).
    rationale: >-
      Fix deployment presupposes fix readiness; the fD combination is
      structurally excluded from the 32 valid compound CS states.
    verification: >-
      Inspection of `vultron/core/states/` confirms no enum member encodes fD; a unit
      test confirms that a vfd→VFD transition skipping V and F is rejected as an
      illegal VFD jump.
    testable: true
    stories:
    - story_2022_045
    - story_2022_074

  - id: CSB-17-008
    priority: MUST
    kind: protocol
    statement: >-
      A CS transition that changes two or more dimensions at once, that
      reverses a dimension, or that skips a VFD prerequisite MUST be rejected.
    rationale: >-
      Each of the three prohibited forms conflates or reorders distinct causal
      events; rejecting them enforces the one-event-at-a-time and monotonicity
      invariants.
    verification: >-
      A unit test confirms that multi-dimension transitions, reversed-dimension
      transitions, and VFD-prerequisite skips are each individually rejected by
      the compound transition validator.
    testable: true

    stories:
    - story_2022_045
    - story_2022_074
  - id: CSB-17-009
    priority: MUST
    kind: protocol
    statement: From a vP state the next CS event MUST be V.
    rationale: >-
      The forced-successor rule is the operational consequence of CSB-17-003's
      ephemeral classification: each ephemeral state has exactly one valid
      continuation, enforcing the vP→VP invariant.
    verification: >-
      A unit test confirms that from a vP state only the V event is accepted as the
      next CS transition and all five other CS events are rejected.
    testable: true

    lint_suppress:
    - missing_story_reference
  - id: CSB-17-012
    priority: MUST
    kind: protocol
    statement: From a pX state the next CS event MUST be P.
    rationale: >-
      The forced-successor rule for pX states enforces the pX→PX invariant;
      pX is ephemeral and P is the only valid continuation.
    verification: >-
      A unit test confirms that from a pX state only the P event is accepted as
      the next CS transition and all five other CS events are rejected.
    testable: true
    relationships:
    - rel_type: refines
      spec_id: CSB-17-003

    lint_suppress:
    - missing_story_reference
  - id: CSB-17-013
    priority: MUST
    kind: protocol
    statement: >-
      Any CS event other than the forced successor MUST be rejected when the
      current state is ephemeral (vP or pX).
    rationale: >-
      Accepting any other event would break the vP→VP and pX→PX invariants
      that the forced-successor rule exists to enforce.
    verification: >-
      A unit test confirms that the forced-successor rule rejects all CS events
      except the single valid continuation from any ephemeral (vP or pX)
      compound CS state.
    testable: true
    relationships:
    - rel_type: refines
      spec_id: CSB-17-003

    lint_suppress:
    - missing_story_reference
  - id: CSB-17-010
    priority: MUST
    kind: protocol
    statement: >-
      Prefix validation MUST NOT require all six CS events to be present; a
      prefix MAY end in an ephemeral state.
    rationale: >-
      Real cases are still in progress at validation time; requiring all six
      events would reject every live case, and an ephemeral-ending prefix is
      valid as long as its forced successor has not yet been observed.
    verification: >-
      A unit test confirms that prefix validation accepts partial CS event
      sequences, including those ending in ephemeral states, and does not
      require all six CS events to be present.
    testable: true

    stories:
    - story_2022_045
    - story_2022_074
  - id: CSB-17-011
    priority: MUST
    kind: protocol
    statement: >-
      Every accepted incomplete CS history prefix MUST have at least one valid
      completion among the 70 valid complete histories of CSB-17-004.
    rationale: >-
      Pinning acceptance to the prefix closure of CSB-17-004 prevents a
      validator from accepting dead-end prefixes that cannot lead to any valid
      complete history.
    verification: >-
      A unit test confirms that every accepted partial CS history can be extended
      to at least one of the 70 valid complete CS event histories, and that
      dead-end prefixes with no valid completion are rejected.
    testable: true

    stories:
    - story_2022_045
    - story_2022_074
- id: CSB-18
  title: Cross-Machine State Entailments
  description: >-
    Invariants that span two state machines simultaneously. These are
    causal entailments, not local transition constraints: they capture states
    that are logically contradictory given the sequence of events that
    produced them. CSB-18-001 is enforced at emit time via
    ValidateTriggerTransitionsNode and on the receive path via
    composite_state_violations() (composite_state_invariants.py).
    CSB-18-002 through CSB-18-004 (PXA↔EM) are enforced on the receive
    path via ThreatTerminationBranchNode in add_participant_status_tree;
    violation_pxa_em_entailment() (composite_state_invariants.py) is the
    post-cascade diagnostic caller via PxaEmInvariantDiagnosticNode
    (CONCERN-3008, issue #3115).
  specs:
  - id: CSB-18-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the VFD F-bit set (q^cs ∈
      VFd··· or VFD···) while the participant's RM state is outside
      {ACCEPTED, DEFERRED, CLOSED}. A fix cannot be ready before the
      vulnerability has been accepted for action.
    rationale: >-
      The F bit records that the vendor has a fix. A vendor makes a fix only after it
      accepts the report for action. An F bit with an RM state before acceptance (START,
      RECEIVED, INVALID or VALID) is therefore causally impossible. The true rule is
      about history: the participant passed through ACCEPTED at some time. A participant
      status holds only the current RM state, so the check uses the RM states that
      ACCEPTED can reach. DEFERRED and CLOSED can also be reached without ACCEPTED, so
      the check is sound but not complete. The set keeps them because a peer can move
      through ACCEPTED to DEFERRED or CLOSED and report a ready fix in one message. A
      check of ACCEPTED alone would refuse that valid update. Only the RM history of the
      participant can give a complete check.
    testable: true
    preconditions:
    - description: Any participant state snapshot is available for inspection
    verification: >-
      Call composite_state_violations(rm, vf, d) for each participant; assert an
      empty list is returned for all valid combined states. Unit tests in
      test/core/behaviors/status/test_participant_status_acceptance.py
      confirm both paths refuse an F or D bit set against a pre-acceptance RM,
      and that a batched advance through acceptance reported in one message is
      accepted whole. Tests in test/core/states/test_composite_state_invariants.py
      derive RM_STATES_CONSISTENT_WITH_FIX from the RM transition graph, so a new
      transition out of RM.ACCEPTED cannot silently invalidate the
      approximation, and pin which of its members are ambiguous.
    relationships:
    - rel_type: constrains
      spec_id: CSB-16-001
  - id: CSB-18-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the PXA P-bit set
      (q^cs ∈ ···P··) while an active embargo exists (q^em ∈ {ACTIVE,
      REVISE}). Public awareness of a vulnerability while an embargo is
      active is causally impossible in a well-functioning coordination — the
      P event causes embargo termination, so EM cannot remain ACTIVE once P
      has occurred.
    rationale: >-
      The P event (public awareness) makes the embargo end. An embargo that stays ACTIVE
      or REVISE after P is recorded is therefore a causal contradiction, and it
      misstates the case to every participant that reads it. The emit path does not
      refuse a P report while an embargo is active, because that report is what causes
      the embargo to end.
    testable: true
    preconditions:
    - description: A PXA state and an EM state are both available for the same case
    verification: >-
      Call violation_pxa_em_entailment(pxa, em) for each participant; assert
      None is returned for all valid combined states.
  - id: CSB-18-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the PXA X-bit set
      (q^cs ∈ ···X·) while an active embargo exists (q^em ∈ {ACTIVE,
      REVISE}). Public exploit availability while an embargo is active is
      causally impossible — the X event entails embargo termination.
    rationale: >-
      A public exploit lets attackers use the vulnerability, so secrecy no longer
      protects users. An embargo that stays ACTIVE or REVISE after X tells participants
      to keep a secret that attackers already have. It also holds back information that
      defenders need now, and it misstates the case to every participant that reads it.
    testable: true
    preconditions:
    - description: A PXA state and an EM state are both available for the same case
    verification: >-
      Call violation_pxa_em_entailment(pxa, em) for each participant; assert
      None is returned for all valid combined states.
    relationships:
    - rel_type: refines
      spec_id: CSB-18-002
  - id: CSB-18-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the PXA A-bit set
      (q^cs ∈ ···A) while an active embargo exists (q^em ∈ {ACTIVE,
      REVISE}). Observed attacks while an embargo is active is causally
      impossible — the A event entails embargo termination.
    rationale: >-
      Observed attacks show that the vulnerability is in use. An embargo that stays
      ACTIVE or REVISE after A holds back the information that defenders need to protect
      themselves while the attacks go on. It also misstates the case to every
      participant that reads it.
    testable: true
    preconditions:
    - description: A PXA state and an EM state are both available for the same case
    verification: >-
      Call violation_pxa_em_entailment(pxa, em) for each participant; assert
      None is returned for all valid combined states.
    relationships:
    - rel_type: refines
      spec_id: CSB-18-002
- id: CSB-19
  title: CS Ordering Invariants Under Out-of-Order Ledger Delivery
  description: Normative requirements for how CS ordering invariants interact
    with the ADR-0037 out-of-order ledger hold. Clarifies when invariant
    guards are evaluated relative to the hold and the drain.
  specs:
  - id: CSB-19-001
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      CS ordering invariants (ephemeral-state guard, history-prefix validity,
      CP-before-ET ordering) MUST be evaluated at drain time — that is,
      against the causal-order replay of the held Announces (ADR-0037,
      SYNC-14-009) — not at the time of original out-of-order receipt.
    rationale: >-
      An out-of-order `Announce(CaseLedgerEntry)` carrying a CS update is
      held by `BufferOutOfOrderEntryNode` before any domain effects are
      applied; the CS state machine is not touched at hold time.
      When the gap fills, the drain replays each held Announce through the
      full announce receive BT in log_index order (ADR-0037, CLP-14-001),
      so CS guards see the entries in correct causal sequence. Evaluating
      guards at original receipt would produce false violations whenever the
      predecessor CS entry has not yet arrived.
    adr:
    - ADR-0037
    - ADR-0079
    relationships:
    - rel_type: depends_on
      spec_id: CSB-12-001
    lint_suppress:
    - missing_story_reference
  - id: CSB-19-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A held out-of-order CS ledger entry MUST NOT trigger an ephemeral-state
      violation or history-prefix validation failure at the time it is held.
      Such checks MUST be deferred until the entry is replayed in causal order
      during the drain.
    rationale: >-
      An ephemeral-state entry (e.g., a pX-state CaseStatus arriving before its
      P-state predecessor) is structurally valid in isolation; the violation
      would only be real if the predecessor never arrives. Flagging it at hold
      time produces a false positive and may cause the entry to be incorrectly
      rejected, breaking convergence.
    relationships:
    - rel_type: refines
      spec_id: CSB-19-001
    lint_suppress:
    - missing_story_reference
  - id: CSB-19-003
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The CP-before-ET ordering constraint (CSB-12-001: CS→P MUST be recorded
      before ET is emitted) is preserved under out-of-order ledger delivery
      because the CASE_MANAGER commits entries in causal order (CLP-14-001). The
      P-state ledger entry always carries a lower log_index than the ET entry
      that follows it; the drain therefore always processes P before ET
      when both are held.
    rationale: >-
      CSB-12-001 is enforced at the CASE_MANAGER write-side: the CASE_MANAGER commits
      the P-state entry before committing the ET entry. This means the P-state
      entry's log_index is strictly lower than the ET entry's log_index. The
      ADR-0037 drain replays in log_index order, so the constraint cannot be
      violated by reordered delivery alone. No receiver-side re-enforcement
      of the temporal constraint is required; the causal order in the ledger
      is sufficient.
