    testable: true

- id: CSB-06
  title: Receive CA (Attacks Observed)
  description: Behaviors triggered when a participant receives a CA (Attacks Observed) message, recording active exploitation of the vulnerability and initiating embargo teardown if an active embargo exists.
  trigger:
    type: message_received
    value: CA
  specs:
  - id: CSB-06-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM None or Exited
      (q^em ∈ {N, X}) receiving CA MUST transition their local CS to both
      Public Aware and Attacks Observed (q^cs ···p·a → ···P·A) and emit CK.
    rationale: >-
      CA in state ···p·a implies constraint C-16: attack observation without
      prior public awareness triggers the CS→P transition alongside CS→A.
      When EM is None or Exited, no embargo teardown is needed.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA in CS ···p·a with
      EM None or Exited atomically sets both P and A bits (···P·A) and emits CK.
    testable: true
    preconditions:
    - cs_pattern: "...p.a"
      em_state:
        - NONE
        - EXITED
      description: EM state is None or Exited; CS matches pattern ...p.a
    steps:
    - order: 1
      actor: receiver
      action: >-
        Transition local CS to Public Aware and Attacks Observed (···P·A)
      expected: Receiver CS public bit P and attacks bit A both set
    - order: 2
      actor: receiver
      action: Emit CK to acknowledge receipt of CA
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···P·A; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-006
      note: 'CA shorthand wire-type mapping'

  - id: CSB-06-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Proposed
      (q^em ∈ P) receiving CA MUST transition their local CS to ···P·A.
    rationale: >-
      Attacks observed alongside previously non-public CS triggers CS→P, which
      terminates a pending embargo proposal. Constraint C-16 applies.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA in CS ···p·a with
      EM Proposed transitions CS to ···P·A, sets EM to NONE, and emits CK.
    testable: true
    preconditions:
    - cs_pattern: "...p.a"
      em_state:
        - PROPOSED
      description: EM state is Proposed; CS matches pattern ...p.a
    steps:
    - order: 1
      actor: receiver
      action: >-
        Transition local CS to Public Aware and Attacks Observed (···P·A)
      expected: Receiver CS public bit P and attacks bit A both set
    - order: 2
      actor: receiver
      action: Transition EM from PROPOSED to NONE (embargo proposal abandoned)
      expected: Receiver EM state is NONE
    - order: 3
      actor: receiver
      action: Emit CK to acknowledge receipt of CA
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···P·A; EM is NONE; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when information becomes public
    - rel_type: satisfies
      spec_id: MSM-03-006
      note: 'CA shorthand wire-type mapping'

  - id: CSB-06-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Active or Revise
      (q^em ∈ {A, R}) receiving CA MUST transition their local CS to ···P·A.
    rationale: >-
      Attacks observed without prior public awareness triggers CS→P (constraint
      C-16) which in turn requires embargo termination per VP-09-001. The C-14
      ordering: record CS transition first, then initiate teardown.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA in CS ···p·a with
      EM Active or Revise transitions CS to ···P·A, emits ET, then emits CK, with
      the CS transition recorded before teardown (C-14).
    testable: true
    preconditions:
    - cs_pattern: "...p.a"
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern ...p.a
    steps:
    - order: 1
      actor: receiver
      action: >-
        Transition local CS to Public Aware and Attacks Observed (···P·A)
      expected: Receiver CS public bit P and attacks bit A both set
    - order: 2
      actor: receiver
      action: Emit ET to initiate embargo termination
      expected: ET queued for participants; EM begins transitioning to EXITED
    - order: 3
      actor: receiver
      action: Emit CK to acknowledge receipt of CA
      expected: CK queued for sender
    postconditions:
    - description: >-
        Receiver CS is ···P·A; ET emitted; EM is EXITED; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when information becomes public
    - rel_type: satisfies
      spec_id: VP-11-006
      note: SHOULD terminate embargo when attacks are known to have occurred
    - rel_type: satisfies
      spec_id: MSM-03-006
      note: 'CA shorthand wire-type mapping'

  - id: CSB-06-004
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS already public
      but attacks not yet observed (q^cs ∈ ···P·a) receiving CA MUST
      transition their local CS attacks bit to A (q^cs ···P·a → ···P·A) and
      emit CK.
    rationale: >-
      When public awareness already exists, CA transitions only the attacks bit.
      The public bit is already set; no new P transition is needed.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA in CS ···P·a
      transitions the attacks bit to A (···P·A) and enqueues CK without a new P
      transition.
    testable: true
    preconditions:
    - cs_pattern: "...P.a"
      description: CS matches pattern ...P.a
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS attacks bit to A (···P·A)
      expected: Receiver CS attacks bit A set; public bit P remains set
    - order: 2
      actor: receiver
      action: Emit CK to acknowledge receipt of CA
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···P·A; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-006
      note: 'CA shorthand wire-type mapping'

  - id: CSB-06-005
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS attacks already
      observed (q^cs ∈ ···P·A) receiving a duplicate CA MUST emit CK without
      any CS or EM state transition.
    rationale: >-
      All C* messages warrant acknowledgment. Duplicate CA does not re-trigger
      CS or EM transitions.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA when CS is already
      ···P·A enqueues CK and leaves all CS and EM states unchanged.
    testable: true
    preconditions:
    - cs_pattern: "...P.A"
      description: CS matches pattern ...P.A
    steps:
    - order: 1
      actor: receiver
      action: Emit CK to acknowledge receipt of CA (no state change)
      expected: CK queued for sender; CS and EM states unchanged
    postconditions:
    - description: CK emitted; no state change
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-006
      note: 'CA shorthand wire-type mapping'

  - id: CSB-06-006
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Proposed
      (q^em ∈ P) receiving CA MUST transition EM to None (q^em P → N).
    rationale: >-
      The CS→P transition triggered by attacks observation makes further embargo
      negotiation moot; the pending proposal is abandoned per VP-09-001.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA with EM Proposed
      and CS ···p·a transitions EM from PROPOSED to NONE.
    testable: true

  - id: CSB-06-007
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Proposed
      (q^em ∈ P) receiving CA MUST emit CK to acknowledge receipt.
    rationale: >-
      All C* messages warrant acknowledgment per VP-12 messaging norms.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA with EM Proposed
      and CS ···p·a enqueues CK to the sender.
    testable: true

  - id: CSB-06-008
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Active or Revise
      (q^em ∈ {A, R}) receiving CA MUST initiate embargo termination by emitting
      ET.
    rationale: >-
      VP-09-001 requires immediate embargo termination when public awareness
      occurs; constraint C-16 triggers CS→P on attacks observation.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA with EM Active or
      Revise and CS ···p·a enqueues ET to initiate embargo termination.
    testable: true

  - id: CSB-06-009
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Active or Revise
      (q^em ∈ {A, R}) receiving CA MUST emit CK to acknowledge receipt.
    rationale: >-
      All C* messages warrant acknowledgment per VP-12 messaging norms.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA with EM Active or
      Revise and CS ···p·a enqueues CK to the sender.
    testable: true

  - id: CSB-06-010
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Active or Revise
      (q^em ∈ {A, R}) receiving CA MUST record the CS transition to ···P·A
      before embargo teardown is initiated (constraint C-14).
    rationale: >-
      C-14 ordering requires the CS state change to be recorded first so that
      the canonical ledger correctly reflects cause before effect.
    verification: >-
      Integration tests in `test/demo/` confirm that the CS state records ···P·A
      before ET is emitted when CA is received with EM Active or Revise and
      non-public CS (C-14 ordering satisfied).
    testable: true

- id: CSB-07
  title: Receive CE (CS Error)
  description: Behaviors triggered when a participant receives a CE (CVD Case State Error) signal, which has no dedicated semantic dispatch value and is handled outside the standard AS2 pattern-matching pipeline.
  trigger:
    type: message_received
    value: CE
  specs:
  - id: CSB-07-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) receiving CE SHOULD
      emit CK to acknowledge receipt and SHOULD emit GI to inquire about the
      nature of the CS error.
    rationale: >-
      CE signals a protocol error in the CS process. Acknowledging with CK and
      following up with GI allows the sender to explain the error and enables
      recovery. CE does not trigger a CS state transition.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CE enqueues CK and GI
      without modifying any CS state.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted)
    steps:
    - order: 1
      actor: receiver
      action: Emit CK to acknowledge receipt of CE
      expected: CK queued for sender
    - order: 2
      actor: receiver
      action: Emit GI to inquire about the nature of the error
      expected: GI queued for sender
    postconditions:
    - description: CK and GI emitted; CS state unchanged
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-007
      note: 'CE shorthand wire-type mapping'

- id: CSB-08
  title: Receive CK (CS Acknowledgment)
  description: Behaviors triggered when a participant receives a CK (CVD Case State Acknowledgment) passthrough signal, which has no dedicated semantic dispatch value and requires no state transition.
  trigger:
    type: message_received
    value: CK
  specs:
  - id: CSB-08-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant receiving CK MAY process it as a passthrough acknowledgment
      with no state transition and no required response.
    rationale: >-
      CK is a pure acknowledgment message. It confirms the sender received a
      prior C* message. No state change or response is required from the
      receiver.
    verification: >-
      Inspection of the message-handling code confirms that CK is dispatched as a
      passthrough with no state transition triggered and no response enqueued.
    testable: false
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-008
      note: 'CK shorthand wire-type mapping'

- id: CSB-09
  title: Enter CS Vendor Aware (V)
  trigger:
    type: state_entered
    value: CS.V
  specs:
  - id: CSB-09-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Vendor Participant entering CS Vendor Aware (q^cs ∈ Vfdpxa) with EM
      None (q^em ∈ N) SHOULD begin embargo negotiations promptly.
    rationale: >-
      VP-14-005 recommends starting the EM process as soon as possible once a
      Vendor is aware. Constraint C-32: EM SHOULD begin promptly on Vfdpxa entry
      when no embargo exists.
    verification: >-
      Integration tests in `test/demo/` confirm that a vendor participant entering CS
      Vfdpxa with EM None is prompted to initiate embargo negotiations.
    testable: false
    preconditions:
    - cs_pattern: "Vfd..."
      em_state:
        - NONE
      role:
        - vendor
      description: EM state is None; Participant holds the Vendor role; CS matches pattern Vfd...
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-005
      note: >-
        Once a case has reached Vendor Aware, if the EM process has not started,
        it SHOULD begin as soon as possible

  - id: CSB-09-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Vendor Aware SHOULD emit CV to announce the
      transition to other case Participants.
    rationale: >-
      State-change notifications support shared situation awareness. CV informs
      other Participants that a Vendor is now aware, enabling them to coordinate
      embargo and fix timing accordingly.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Vendor
      Aware emits CV to case participants.
    testable: true
    preconditions:
    - cs_pattern: "Vfd..."
      description: CS matches pattern Vfd...
    steps:
    - order: 1
      actor: participant
      action: Emit CV to announce Vendor Aware CS transition
      expected: CV queued for case participants
    postconditions:
    - description: CV emitted; other Participants informed of V transition
    relationships:
    - rel_type: satisfies
      spec_id: VP-12-001
      note: >-
        CV messages SHOULD be sent only by Participants with direct knowledge
        of the notification

- id: CSB-10
  title: Enter CS Fix Ready (F)
  trigger:
    type: state_entered
    value: CS.F
  specs:
  - id: CSB-10-001
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant entering CS Fix Ready (q^cs ∈ VFd···) SHOULD NOT start new
      embargo negotiations. If an embargo proposal is pending (q^em ∈ P), the
      Participant SHOULD reject it.
    rationale: >-
      VP-14-007 discourages starting or completing new embargo negotiations once
      a fix is ready. Constraint C-34: fix readiness is late in the process for
      beginning embargo negotiations.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Fix
      Ready does not start new embargo negotiations and rejects any pending
      proposal.
    testable: false
    preconditions:
    - cs_pattern: "VFd..."
      description: CS matches pattern VFd...
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-007
      note: >-
        Once a case has reached Fix Ready, new embargo negotiations SHOULD NOT
        start and pending embargoes SHOULD be rejected

  - id: CSB-10-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Fix Ready SHOULD emit CF to announce the
      transition to other case Participants.
    rationale: >-
      State-change notifications support shared situation awareness. CF informs
      other Participants that a fix is available, enabling them to coordinate
      embargo extension or termination decisions.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Fix
      Ready emits CF to case participants.
    testable: true
    preconditions:
    - cs_pattern: "VFd..."
      description: CS matches pattern VFd...
    steps:
    - order: 1
      actor: participant
      action: Emit CF to announce Fix Ready CS transition
      expected: CF queued for case participants
    postconditions:
    - description: CF emitted; other Participants informed of F transition

- id: CSB-11
  title: Enter CS Fix Deployed (D)
  trigger:
    type: state_entered
    value: CS.D
  specs:
  - id: CSB-11-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Fix Deployed (q^cs ∈ VFD···) with an active
      embargo (q^em ∈ {A, R}) SHOULD terminate the embargo by emitting ET.
    rationale: >-
      VP-14-010 recommends terminating any existing embargo once the fix has
      been deployed. Constraint C-35: embargo termination SHOULD follow fix
      deployment.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Fix
      Deployed with an active embargo emits ET and that EM reaches EXITED.
    testable: true
    preconditions:
    - cs_pattern: "VFD..."
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern VFD...
    steps:
    - order: 1
      actor: participant
      action: Emit ET to terminate the active embargo
      expected: ET queued for participants; EM begins transitioning to EXITED
    postconditions:
    - description: ET emitted; EM is EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-010
      note: >-
        By the time a fix has been deployed, any existing embargo SHOULD
        terminate

  - id: CSB-11-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Fix Deployed SHOULD emit CD to announce the
      transition to other case Participants.
    rationale: >-
      State-change notifications support shared situation awareness. CD informs
      other Participants that the fix is deployed, allowing them to coordinate
      publication and embargo termination decisions.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Fix
      Deployed emits CD to case participants.
    testable: true
    preconditions:
    - cs_pattern: "VFD..."
      description: CS matches pattern VFD...
    steps:
    - order: 1
      actor: participant
      action: Emit CD to announce Fix Deployed CS transition
      expected: CD queued for case participants
    postconditions:
    - description: CD emitted; other Participants informed of D transition

- id: CSB-12
  title: Enter CS Public Aware (P)
  trigger:
    type: state_entered
    value: CS.P
  specs:
  - id: CSB-12-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant entering CS Public Aware (q^cs → ···P··) with an active
      embargo (q^em ∈ {A, R}) SHALL terminate the embargo immediately by
      emitting ET. The CS state transition MUST be recorded before the embargo
      teardown is initiated (constraint C-14).
    rationale: >-
      VP-09-001 and VP-14-001 require immediate embargo termination upon public
      disclosure. Constraint C-14 requires observably correct ordering: the CS
      state change is recorded first, then the teardown begins. This ensures
      the canonical ledger correctly reflects cause (P transition) before effect
      (embargo termination).
    verification: >-
      Integration tests in `test/demo/` confirm that entering CS Public Aware with an
      active embargo records the CS transition before emitting ET, and that EM
      reaches EXITED (C-14 ordering satisfied).
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern ...P..
    steps:
    - order: 1
      actor: participant
      action: Record CS Public Aware transition in local state
      expected: Receiver CS public bit set to P
    - order: 2
      actor: participant
      action: Emit ET to terminate the embargo
      expected: ET queued for participants; EM begins transitioning to EXITED
    postconditions:
    - description: >-
        CS public bit is P; ET emitted; EM is EXITED; CS transition recorded
        before teardown (C-14)
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when information becomes public
    - rel_type: satisfies
      spec_id: VP-14-001
      note: Once Public Awareness, any existing embargo SHALL terminate

  - id: CSB-12-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant entering CS Public Aware MUST NOT seek new embargoes or
      accept new embargo proposals for this case.
    rationale: >-
      VP-14-001 prohibits seeking new embargoes once public awareness has
      occurred. This applies to all future EP messages for this case.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant with CS ···P··
      rejects new embargo proposals and does not seek new embargoes for the case.
    testable: false
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-001
      note: Once Public Awareness, new embargoes SHALL NOT be sought

  - id: CSB-12-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Public Aware SHOULD emit CP to announce the
      transition to other case Participants if CP was not already the triggering
      event (i.e., the transition was triggered locally or by a different message
      type).
    rationale: >-
      State-change notifications support shared situation awareness. CP informs
      other Participants that the vulnerability is now public. This item applies
      when the P transition is triggered by a local event (e.g., own publication)
      rather than by receiving CP from another Participant.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Public
      Aware via a local or non-CP trigger emits CP to case participants.
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    steps:
    - order: 1
      actor: participant
      action: Emit CP to announce Public Aware CS transition
      expected: CP queued for case participants
    postconditions:
    - description: CP emitted; other Participants informed of P transition

- id: CSB-13
  title: Enter CS Exploit Public (X)
  trigger:
    type: state_entered
    value: CS.X
  specs:
  - id: CSB-13-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant entering CS in state ···px· (public not yet set, exploit
      now set) MUST also trigger CS→P (the pX→PX invariant) before or
      simultaneously with the exploit transition. This compound transition
      MUST be treated as atomic: both P and X bits are set together.
    rationale: >-
      The ephemeral state ···pX· (exploit public without public awareness)
      cannot exist as a stable state. Constraint C-15 requires the transition
      to be ···px· → ···PX·, not ···px· → ···pX· → ···PX·. Observable
      consequence: CX emitted from ···px· state must be accompanied by CP.
      The precondition uses the post-transition pattern ···pX· (X uppercase,
      P lowercase) since state_entered fires after the X bit is set.
    verification: >-
      Integration tests in `test/demo/` confirm that entering CS with the X bit newly
      set while P is unset atomically promotes to ···PX· and emits both CX and CP.
    testable: true
    preconditions:
    - cs_pattern: "...pX."
      description: CS matches pattern ...pX.
    steps:
    - order: 1
      actor: participant
      action: >-
        Transition CS to ···PX· (set both public bit P and exploit bit X
        atomically)
      expected: Receiver CS public bit P and exploit bit X both set
    - order: 2
      actor: participant
      action: Emit CX to announce exploit public transition
      expected: CX queued for case participants
    - order: 3
      actor: participant
      action: Emit CP to announce public aware transition (C-15 constraint)
      expected: CP queued for case participants
    postconditions:
    - description: CS is ···PX·; CX and CP both emitted; pX→PX invariant satisfied

  - id: CSB-13-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant entering CS Exploit Public (q^cs → ···PX·) with an active
      embargo (q^em ∈ {A, R}) SHALL terminate the embargo immediately by
      emitting ET. The CS state transition MUST be recorded before the embargo
      teardown is initiated (constraint C-14).
    rationale: >-
      VP-09-001 and VP-14-002 require immediate embargo termination upon exploit
      publication. The C-14 ordering applies: CS state recorded before teardown
      begins.
    verification: >-
      Integration tests in `test/demo/` confirm that entering CS ···PX· with an active
      embargo records the CS transition before emitting ET and that EM reaches EXITED.
    testable: true
    preconditions:
    - cs_pattern: "...PX."
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern ...PX.
    steps:
    - order: 1
      actor: participant
      action: Record CS Exploit Public transition in local state
      expected: Receiver CS exploit bit set to X
    - order: 2
      actor: participant
      action: Emit ET to terminate the embargo
      expected: ET queued for participants; EM begins transitioning to EXITED
    postconditions:
    - description: >-
        CS exploit bit is X; ET emitted; EM is EXITED; CS transition recorded
        before teardown (C-14)
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: >-
        Embargoes SHALL terminate immediately when exploit becomes public
    - rel_type: satisfies
      spec_id: VP-14-002
      note: Once Exploit Publication, any existing embargo SHALL terminate

  - id: CSB-13-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant entering CS Exploit Public MUST NOT seek new embargoes or
      accept new embargo proposals for this case.
    rationale: >-
      VP-14-002 prohibits seeking new embargoes once exploit publication has
      occurred.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant with CS ···PX·
      rejects new embargo proposals and does not initiate new embargo negotiations.
    testable: false
    preconditions:
    - cs_pattern: "....X."
      description: CS matches pattern ....X.
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-002
      note: Once Exploit Publication, new embargoes SHALL NOT be sought

- id: CSB-14
  title: Enter CS Attacks Observed (A)
  trigger:
    type: state_entered
    value: CS.A
  specs:
  - id: CSB-14-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Attacks Observed (q^cs → ·····A) with an
      active embargo (q^em ∈ {A, R}) SHOULD terminate the embargo by emitting
      ET. The CS state transition SHOULD be recorded before the embargo
      teardown is initiated (constraint C-14).
    rationale: >-
      VP-09-003 and VP-14-013 recommend early embargo termination when attacks
      are observed. Unlike P and X, the attacks case is SHOULD (not SHALL) to
      allow for judgment in cases where other factors may apply.
    verification: >-
      Integration tests in `test/demo/` confirm that a participant entering CS Attacks
      Observed with an active embargo records the A transition and emits ET.
    testable: true
    preconditions:
    - cs_pattern: ".....A"
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern .....A
    steps:
    - order: 1
      actor: participant
      action: Record CS Attacks Observed transition in local state
      expected: Receiver CS attacks bit set to A
    - order: 2
      actor: participant
      action: Emit ET to terminate the embargo
      expected: ET queued for participants; EM begins transitioning to EXITED
    postconditions:
    - description: CS attacks bit is A; ET emitted; EM is EXITED
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-003
      note: >-
        Embargoes SHOULD terminate early when there is evidence of active
        exploitation
    - rel_type: satisfies
      spec_id: VP-11-006
      note: >-
        SHOULD terminate embargo when attacks are known to have occurred
    - rel_type: satisfies
      spec_id: VP-14-013
      note: Once Attacks observed, any existing embargo SHOULD terminate

  - id: CSB-14-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Attacks Observed with CS not yet public
      (q^cs ∈ ···p·A) SHOULD also trigger CS→P and emit CP to announce public
      awareness.
    rationale: >-
      Constraint C-16: attacks observed on an otherwise non-public case SHOULD
      trigger the P transition. Active attacks constitute de-facto public
      awareness of the vulnerability's existence.
    verification: >-
      Integration tests in `test/demo/` confirm that entering CS Attacks Observed in a
      non-public state (···p·A) triggers the P transition and emits both CP and CA.
    testable: true
    preconditions:
    - cs_pattern: "...p.A"
      description: CS matches pattern ...p.A
    steps:
    - order: 1
      actor: participant
      action: Transition CS to Public Aware and Attacks Observed (···P·A)
      expected: Receiver CS public bit P and attacks bit A both set
    - order: 2
      actor: participant
      action: Emit CP to announce Public Aware transition
      expected: CP queued for case participants
    - order: 3
      actor: participant
      action: Emit CA to announce Attacks Observed transition
      expected: CA queued for case participants
    postconditions:
    - description: CS is ···P·A; CP and CA emitted

  - id: CSB-14-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant entering CS Attacks Observed MUST NOT seek new embargoes
      for this case.
    rationale: >-
      VP-14-003 prohibits seeking new embargoes once attacks have been observed.
    testable: false
    preconditions:
    - cs_pattern: ".....A"
      description: CS matches pattern .....A
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: satisfies
      spec_id: VP-14-003
      note: Once Attacks observed, new embargoes SHALL NOT be sought

  - id: CSB-14-004
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering CS Attacks Observed SHOULD emit CA to announce the
      transition to other case Participants.
    rationale: >-
      State-change notifications support shared situation awareness. CA informs
      other Participants that active exploitation has been observed, enabling
      them to re-evaluate embargo and disclosure decisions. VP-12-002 recommends
      that fix development accelerate and embargo teardown begin.
    testable: true
    preconditions:
    - cs_pattern: ".....A"
      description: CS matches pattern .....A
    steps:
    - order: 1
      actor: participant
      action: Emit CA to announce Attacks Observed CS transition
      expected: CA queued for case participants
    postconditions:
    - description: CA emitted; other Participants informed of A transition
    relationships:
    - rel_type: satisfies
      spec_id: VP-12-002
      note: >-
        Once attacks have been observed, fix development SHOULD accelerate and
        embargo teardown process SHOULD begin

- id: CSB-15
  title: Trigger-Side VFD Role Preconditions
  description: >-
    Precondition requirements for self-reported CS trigger endpoints
    (notify-fix-ready, notify-fix-deployed, notify-published). These complement the
    receive-side CSB-02, CSB-03, and CSB-04 groups by specifying which CVD roles may
    initiate each VFD transition locally and what state each trigger endpoint MUST set.
  specs:
  - id: CSB-15-001
    priority: MUST
    kind: protocol
    statement: >-
      An Actor self-reporting a fix-ready transition (f→F, vfd_state=VFd) via the
      trigger path MUST hold CVDRole.VENDOR in the case; the transition MUST be
      blocked (FAILURE) when CVDRole.VENDOR is absent.
    rationale: >-
      Fix readiness (F event) represents that the actor has produced a fix. Only
      actors who develop or maintain the affected product (Vendors) can produce a
      fix; Deployers operate existing deployments and do not produce fixes. Finders,
      Reporters, and Coordinators likewise MUST NOT self-report fix readiness.
      Without this guard, non-vendor actors can incorrectly advance their participant
      VFD state, producing misleading case state records.
    verification: >-
      Integration tests in `test/demo/` confirm that the fix-ready trigger returns
      FAILURE for actors without CVDRole.VENDOR and creates ParticipantStatus
      with vfd_state=VFd only for VENDOR actors.
    testable: true
    preconditions:
    - description: Actor requests vfd_state=VFd via the trigger path
    steps:
    - order: 1
      actor: trigger
      action: Check that the requesting actor holds CVDRole.VENDOR in the case
        participant record
      expected: Role check passes for VENDOR; FAILURE returned otherwise
    - order: 2
      actor: trigger
      action: If role check passes, create ParticipantStatus with vfd_state=VFd
      expected: Status record created; activity emitted to Case Manager
    postconditions:
    - description: Only VENDOR actors may record vfd_state=VFd; all others receive FAILURE
    relationships:
    - rel_type: constrains
      spec_id: CSB-02-001
      note: Trigger-side precondition complementing receive-side CF handling

  - id: CSB-15-002
    priority: MUST
    kind: protocol
    statement: >-
      An Actor self-reporting a fix-deployed transition (d→D, vfd_state=VFD) via the
      trigger path MUST hold CVDRole.DEPLOYER in the case; the transition MUST be blocked
      (FAILURE) when CVDRole.DEPLOYER is absent.
    rationale: >-
      Fix deployment (D event) represents applying a fix in one's own environment.
      Only actors who are responsible for operating deployed instances (Deployers) can
      perform this action. A shipping-product Vendor who does not control downstream
      deployment holds only CVDRole.VENDOR, not CVDRole.DEPLOYER, and MUST stop at VFd.
      Without this guard, vendor-only actors reach VFD, misrepresenting the protocol's
      distinction between fix availability and fix deployment.
    verification: >-
      Integration tests in `test/demo/` confirm that the fix-deployed trigger returns
      FAILURE for actors without CVDRole.DEPLOYER and creates ParticipantStatus
      with vfd_state=VFD only for DEPLOYER actors.
    testable: true
    preconditions:
    - description: Actor requests vfd_state=VFD via the trigger path
    steps:
    - order: 1
      actor: trigger
      action: Check that the requesting actor holds CVDRole.DEPLOYER in the case
        participant record
      expected: Role check passes for DEPLOYER; FAILURE returned for VENDOR-only or
        any other non-DEPLOYER actor
    - order: 2
      actor: trigger
      action: If role check passes, create ParticipantStatus with vfd_state=VFD
      expected: Status record created; activity emitted to Case Manager
    postconditions:
    - description: Only DEPLOYER actors may record vfd_state=VFD; all others receive FAILURE
    relationships:
    - rel_type: constrains
      spec_id: CSB-03-001
      note: Trigger-side precondition complementing receive-side CD handling

  - id: CSB-15-003
    priority: MUST
    kind: protocol
    statement: >-
      The notify-published trigger endpoint MUST set only pxa_state=Pxa in the
      ParticipantStatus record. The D event (fix deployed) is participant-specific
      and distinct from the P event (public awareness); notify-published MUST NOT
      also modify vfd_state.
    rationale: >-
      Conflating P and D transitions (as notify-published did by setting both
      vfd_state=VFD and pxa_state=Pxa) causes non-deployer actors (Finders,
      Reporters, Coordinators) to incorrectly acquire VFD state when they announce
      public disclosure. The pxa (P event) is participant-agnostic; the VFD (D event)
      is only valid for DEPLOYER-role actors who have separately completed deployment.
    verification: >-
      Integration tests in `test/demo/` confirm that notify-published sets only
      pxa_state=Pxa in the ParticipantStatus record and leaves vfd_state unmodified.
    testable: true
    preconditions:
    - description: Actor calls the notify-published trigger endpoint
    steps:
    - order: 1
      actor: trigger
      action: Set pxa_state=Pxa in the ParticipantStatus record
      expected: Public awareness recorded
    - order: 2
      actor: trigger
      action: Leave vfd_state unchanged (do not set vfd_state=VFD)
      expected: vfd_state reflects prior state; D event not triggered by P event
    postconditions:
    - description: >-
        ParticipantStatus records pxa_state=Pxa; vfd_state is not modified by
        this trigger; actors wishing to report VFD must call notify-fix-deployed
        separately (and must hold CVDRole.DEPLOYER per CSB-15-002)
    relationships:
    - rel_type: constrains
      spec_id: CSB-04-001
      note: >-
        P event trigger must not imply D event; separates participant-agnostic
        public awareness from participant-specific fix deployment

- id: CSB-16
  title: CS Write-Boundary Transition Validation
  description: >-
    Requirements for CS state write paths (VFD and PXA) to validate
    source→target transition validity before persisting a ParticipantStatus
    snapshot. Complements CSB-15 (trigger-side role preconditions) and
    SDO-02-002 (dimension object transition contract) by requiring that
    the BT write node itself is fail-closed regardless of upstream guard
    coverage.
  specs:
  - id: CSB-16-001
    priority: MUST
    kind: protocol
    statement: >-
      A BT node or helper that writes a VFD state (CS_vfd) to a ParticipantStatus
      snapshot MUST validate that the (current_vfd_state → target_vfd_state)
      transition is permitted by the VFD state machine before persisting.
      A same-state write is permitted (status confirmation). A backward move or
      illegal jump (e.g. vfd → VFD skipping Vfd) MUST cause the node to return
      Status.FAILURE without writing to the DataLayer.
    rationale: >-
      Upstream BT guards (e.g. CheckCSFixNotYetDeployed) are necessary but
      insufficient: a guard that is too weak, missing, or bypassed allows an
      invalid VFD state jump to reach the write node unchecked. Validating at
      the write boundary makes illegal VFD transitions fail-closed regardless
      of guard coverage. Source: concern #1896, which surfaced when the
      CheckCSFixNotYetDeployed guard was too weak in issue #1825.
      Scope: applies to local write nodes only. The received-wire path
      (add_participant_status_tree) uses a weaker monotonic-forward check
      intentionally — remote peers may advance through multiple VFD steps
      between status messages; strict adjacency applies only to local writes.
    verification: >-
      A unit test confirms that the VFD write boundary returns Status.FAILURE for
      illegal jumps (e.g. vfd→VFD skipping Vfd) and that no ParticipantStatus
      record is persisted for an invalid transition.
    testable: true
    preconditions:
    - description: A non-None CS_vfd target state is passed to a ParticipantStatus write node
    steps:
    - order: 1
      actor: write_node
      action: Read the participant's current VFD state from the DataLayer
      expected: Current CS_vfd state available
    - order: 2
      actor: write_node
      action: >-
        If target == current, proceed. If is_valid_vfd_transition(current, target)
        is True, proceed. Otherwise return Status.FAILURE.
      expected: Only valid transitions or same-state writes reach the DataLayer
    postconditions:
    - description: No ParticipantStatus with an illegal VFD jump is persisted
    relationships:
    - rel_type: implements
      spec_id: SDO-02-004
    - rel_type: refines
      spec_id: BTND-10-001

  - id: CSB-16-002
    priority: MUST
    kind: protocol
    statement: >-
      A BT node or helper that writes a PXA state (CS_pxa) to a CaseStatus or
      ParticipantStatus snapshot MUST validate that the (current_pxa_state →
      target_pxa_state) transition is permitted by the PXA state machine before
      persisting. A same-state write is permitted. A backward move MUST cause
      the node to return Status.FAILURE without writing to the DataLayer.
    rationale: >-
      PXA state transitions are forward-only (p→P, x→X, a→A). An invalid
      backward PXA write would produce a misleading public-disclosure regression
      in the case record. The same fail-closed boundary that protects VFD applies
      equally to PXA. Source: concern #1896.
    verification: >-
      A unit test confirms that the PXA write boundary returns Status.FAILURE for any
      backward PXA move and that no ParticipantStatus record is persisted for the
      rejected transition.
    testable: true
    preconditions:
    - description: A non-None CS_pxa target state is passed to a ParticipantStatus write node
    steps:
    - order: 1
      actor: write_node
      action: Read the participant's current PXA state
      expected: Current CS_pxa state available
    - order: 2
      actor: write_node
      action: >-
        If target == current, proceed. If is_valid_pxa_transition(current, target)
        is True, proceed. Otherwise return Status.FAILURE.
      expected: Only valid transitions or same-state writes reach the DataLayer
    postconditions:
    - description: No ParticipantStatus with an illegal PXA regression is persisted
    relationships:
    - rel_type: implements
      spec_id: SDO-02-004
    - rel_type: refines
      spec_id: BTND-10-001

- id: CSB-17
  title: CS Compound State and History Validity
  description: >-
    CS-internal validity invariants over the compound (VFD x PXA) case state
    and over whole case histories. Where CSB-16 validates a single write at
    the persistence boundary, CSB-17 defines which compound states exist,
    which single-event transitions between them are causally possible, and
    which orderings of the six CS events a real case could have produced.
    Mined from the legacy `vultron.core.case_states` hypercube model and
    re-expressed against the current CS enums; see ADR-0060.
  specs:
  - id: CSB-17-001
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST treat exactly 32 compound CS states as valid: the
      cross product of the 4 valid VFD states (vfd, Vfd, VFd, VFD) and the 8
      PXA states.
    rationale: >-
      The VFD dimension is a linear chain, not a free product of three bits:
      readiness presupposes awareness and deployment presupposes readiness.
      Enumerating only the reachable combinations makes the two impossible
      combinations unrepresentable rather than merely rejected at runtime,
      which is why `CS_vfd` has four members and not eight.
    verification: >-
      Inspection of `vultron/core/states/` confirms that the CS compound enum has
      exactly 32 members, one per valid combination of the 4 VFD states and 8
      PXA states.
    testable: true
    postconditions:
    - description: The CS enum has exactly 32 members, one per valid compound state
    relationships:
    - rel_type: refines
      spec_id: SM-09-002
      note: >-
        SM-09-002 states the vF/fD prohibition as a rejection rule; this
        refines it to a structural guarantee by enumerating only the 32
        reachable combinations, so the impossible ones are unrepresentable.
    adr:
    - ADR-0060

  - id: CSB-17-002
    priority: MUST
    kind: protocol
    statement: >-
      A CS transition MUST change exactly one of the six CS dimensions, and
      MUST change it from the not-yet-happened value to the happened value.
    rationale: >-
      CS events are irreversible and are observed one at a time; a compound
      state change of Hamming distance greater than one conflates two distinct
      events and loses their ordering, which is exactly the information history
      validity depends on. These two conditions alone admit 72 transitions;
      applying the ephemeral-state rule of CSB-17-003 leaves exactly 58 valid
      CS transitions.
    verification: >-
      A unit test confirms that the transition validator accepts exactly the 58 valid
      single-event transitions and rejects all multi-dimension, reversal, and
      VFD-prerequisite-skip cases.
    testable: true
    preconditions:
    - description: A (source, destination) pair of compound CS states
    steps:
    - order: 1
      actor: validator
      action: >-
        Identify the single dimension that differs between source and
        destination; reject if more than one differs. If none differs, the
        write is a same-state re-assertion, which CSB-16-001 and CSB-16-002
        permit as a status confirmation: accept it only when the caller has
        opted in (the allow_null parameter), and reject it otherwise, because a
        transition validator's default answer for "no change" must be "that is
        not a transition".
      expected: A single CS event accounts for the change, or the caller has
        explicitly asked for same-state writes to pass
    - order: 2
      actor: validator
      action: >-
        Delegate to the changed dimension's own transition table
        (is_valid_vfd_transition or is_valid_pxa_transition).
      expected: Monotonicity and VFD prerequisite ordering are enforced
    - order: 3
      actor: validator
      action: >-
        Apply the ephemeral-state rule of CSB-17-003 to the source state.
      expected: A transition out of a vP or pX state fires only the event that
        state requires
    postconditions:
    - description: Only Hamming-distance-1 monotone transitions are accepted
    relationships:
    - rel_type: constrains
      spec_id: CSB-16-001
      note: >-
        Adds the one-dimension-at-a-time and monotonicity constraints that a
        per-dimension write validator cannot see. The same-state write CSB-16
        permits is preserved via the opt-in described in step 1.
    - rel_type: constrains
      spec_id: CSB-16-002
    - rel_type: depends_on
      spec_id: CSB-17-003
      note: The 58-transition count holds only with the ephemeral rule applied.
    adr:
    - ADR-0060

  - id: CSB-17-003
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST treat the compound states vP (public aware while
      the vendor is unaware) and pX (exploit public while the public is
      unaware) as ephemeral.
    rationale: >-
      Neither condition can persist in reality: public awareness reaches the
      vendor, and a published exploit makes the public aware. Modelling these
      as ephemeral rather than invalid preserves the causal ordering of the
      events while forbidding the case from progressing in any other direction
      first. The pX ephemeral rule is the pX to PX invariant of CSB-13-001
      generalised from the entry cascade to every successor of a pX state.
    verification: >-
      A unit test confirms that vP and pX are classified as ephemeral states each with
      exactly one valid forced successor and that no other successor is accepted.
    testable: true
    preconditions:
    - description: The case is in one of the 12 ephemeral compound CS states
    postconditions:
    - description: Each ephemeral state has exactly one valid successor state
    relationships:
    - rel_type: extends
      spec_id: CSB-13-001
    - rel_type: refines
      spec_id: SM-09-001
      note: >-
        SM-09-001 governs the persistence boundary: an incoming status write
        carrying vP or pX MUST be promoted to the forced form before it is
        stored. CSB-17-003 governs trajectory validation, where the same two
        conditions are modelled as ephemeral states with exactly one legal
        successor. The two are consistent because they apply at different
        boundaries: no vP or pX state is ever persisted, but such a state is
        still a legal intermediate point in a replayed history, and CSB-17-004
        therefore permits a history prefix to end in one.
    adr:
    - ADR-0060

  - id: CSB-17-004
    priority: SHOULD
    kind: protocol
    statement: >-
      A consumer validating a reported CS history SHOULD validate it causally
      by replaying the event sequence through CSB-17-002 and CSB-17-003 from
      the initial state vfdpxa, rather than checking states point-in-time or
      comparing wall-clock timestamps. A complete history contains all six CS
      events exactly once; there are exactly 70 valid complete histories out of
      720 orderings.
    rationale: >-
      Validity of a case trajectory is a property of the whole ordered
      sequence, not of any single state: VFDPXA and VFDXAP visit only valid
      states, but only the first is a possible case history. Wall-clock
      timestamps cannot substitute, because they may be missing, skewed, or
      recorded by different participants. SHOULD rather than MUST because a
      consumer holding only a current state, with no event log to replay,
      cannot do better.
    verification: >-
      A unit test confirms that replaying all 70 valid complete CS event histories
      passes validation and that at least one invalid ordering (e.g., X before V)
      is rejected.
    testable: true
    preconditions:
    - description: An ordered sequence of CS events, possibly incomplete
    steps:
    - order: 1
      actor: validator
      action: Reject any event that occurs more than once in the sequence
      expected: Each CS event happens at most once
    - order: 2
      actor: validator
      action: >-
        Replay the sequence from vfdpxa, requiring each step to satisfy
        CSB-17-002 and CSB-17-003 given every event that preceded it.
      expected: Causally impossible orderings are rejected
    postconditions:
    - description: A complete valid history terminates in VFDPXA
    adr:
    - ADR-0060

  - id: CSB-17-005
    priority: MUST
    kind: protocol
    statement: >-
      An incomplete CS history MUST be validated as a prefix.
    rationale: >-
      Real cases are usually still in progress, so requiring six events would
      reject every live case. Ending in an ephemeral state is unavoidable at the
      prefix level: CSB-17-003's forced successor has not happened yet when the
      prefix is cut, which is different from persisting an ephemeral state —
      SM-09-001 still forbids that. Pinning acceptance to CSB-17-004's prefix
      closure keeps both directions honest: a validator that merely never
      rejects a genuine prefix could still accept dead ends.
    verification: >-
      A unit test confirms that every valid prefix of the 70 complete CS histories is
      accepted and that dead-end prefixes with no valid completion are rejected.
    testable: true
    preconditions:
    - description: An ordered sequence of CS events with fewer than six entries
    steps:
    - order: 1
      actor: validator
      action: >-
        Apply CSB-17-004's replay to the sequence without requiring that it
        terminate in VFDPXA.
      expected: >-
        The prefix is accepted iff it is a prefix of at least one valid
        complete history
    postconditions:
    - description: >-
        A prefix ending in an ephemeral state is accepted, and its forced
        successor per CSB-17-003 is the only legal continuation
    relationships:
    - rel_type: refines
      spec_id: CSB-17-004
    - rel_type: depends_on
      spec_id: CSB-17-003
    adr:
    - ADR-0060

  - id: CSB-17-006
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST NOT allow a fix to be ready while the vendor is
      unaware (the vF compound state is impossible).
    rationale: >-
      Fix readiness presupposes vendor awareness; the vF combination is
      structurally excluded from the 32 valid compound CS states.
    verification: >-
      Inspection of `vultron/core/states/` confirms no enum member encodes vF; a unit
      test confirms that a vfd→VFd transition skipping V is rejected as an
      illegal VFD jump.
    testable: true

  - id: CSB-17-007
    priority: MUST
    kind: protocol
    statement: >-
      An implementation MUST NOT allow a fix to be deployed that was never
      ready (the fD compound state is impossible).
    rationale: >-
      Fix deployment presupposes fix readiness; the fD combination is
      structurally excluded from the 32 valid compound CS states.
    verification: >-
      Inspection of `vultron/core/states/` confirms no enum member encodes fD; a unit
      test confirms that a vfd→VFD transition skipping V and F is rejected as an
      illegal VFD jump.
    testable: true

  - id: CSB-17-008
    priority: MUST
    kind: protocol
    statement: >-
      A CS transition that changes two or more dimensions at once, that
      reverses a dimension, or that skips a VFD prerequisite MUST be rejected.
    rationale: >-
      Each of the three prohibited forms conflates or reorders distinct causal
      events; rejecting them enforces the one-event-at-a-time and monotonicity
      invariants.
    verification: >-
      A unit test confirms that multi-dimension transitions, reversed-dimension
      transitions, and VFD-prerequisite skips are each individually rejected by
      the compound transition validator.
    testable: true

  - id: CSB-17-009
    priority: MUST
    kind: protocol
    statement: From a vP state the next CS event MUST be V.
    rationale: >-
      The forced-successor rule is the operational consequence of CSB-17-003's
      ephemeral classification: each ephemeral state has exactly one valid
      continuation, enforcing the vP→VP invariant.
    verification: >-
      A unit test confirms that from a vP state only the V event is accepted as the
      next CS transition and all five other CS events are rejected.
    testable: true

  - id: CSB-17-012
    priority: MUST
    kind: protocol
    statement: From a pX state the next CS event MUST be P.
    rationale: >-
      The forced-successor rule for pX states enforces the pX→PX invariant;
      pX is ephemeral and P is the only valid continuation.
    verification: >-
      A unit test confirms that from a pX state only the P event is accepted as
      the next CS transition and all five other CS events are rejected.
    testable: true
    relationships:
    - rel_type: refines
      spec_id: CSB-17-003

  - id: CSB-17-013
    priority: MUST
    kind: protocol
    statement: >-
      Any CS event other than the forced successor MUST be rejected when the
      current state is ephemeral (vP or pX).
    rationale: >-
      Accepting any other event would break the vP→VP and pX→PX invariants
      that the forced-successor rule exists to enforce.
    verification: >-
      A unit test confirms that the forced-successor rule rejects all CS events
      except the single valid continuation from any ephemeral (vP or pX)
      compound CS state.
    testable: true
    relationships:
    - rel_type: refines
      spec_id: CSB-17-003

  - id: CSB-17-010
    priority: MUST
    kind: protocol
    statement: >-
      Prefix validation MUST NOT require all six CS events to be present; a
      prefix MAY end in an ephemeral state.
    rationale: >-
      Real cases are still in progress at validation time; requiring all six
      events would reject every live case, and an ephemeral-ending prefix is
      valid as long as its forced successor has not yet been observed.
    verification: >-
      A unit test confirms that prefix validation accepts partial CS event
      sequences, including those ending in ephemeral states, and does not
      require all six CS events to be present.
    testable: true

  - id: CSB-17-011
    priority: MUST
    kind: protocol
    statement: >-
      Every accepted incomplete CS history prefix MUST have at least one valid
      completion among the 70 valid complete histories of CSB-17-004.
    rationale: >-
      Pinning acceptance to the prefix closure of CSB-17-004 prevents a
      validator from accepting dead-end prefixes that cannot lead to any valid
      complete history.
    verification: >-
      A unit test confirms that every accepted partial CS history can be extended
      to at least one of the 70 valid complete CS event histories, and that
      dead-end prefixes with no valid completion are rejected.
    testable: true

- id: CSB-18
  title: Cross-Machine State Entailments
  description: >-
    Invariants that span two state machines simultaneously. These are
    causal entailments, not local transition constraints: they capture states
    that are logically contradictory given the sequence of events that
    produced them. Violations are detected and reported by
    vultron/core/states/cross_machine_invariants.py but are NOT enforced at
    emit time — they are diagnosed post-hoc.
  specs:
  - id: CSB-18-001
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the VFD F-bit set (q^cs ∈
      VFd··· or VFD···) while the participant's RM state is outside
      {ACCEPTED, DEFERRED, CLOSED}. A fix cannot be ready before the
      vulnerability has been accepted for action.
    rationale: >-
      The F-bit records that a vendor-fix is available. A vendor can only have
      a fix ready if they have accepted the report for action (RM ∈ {ACCEPTED,
      DEFERRED, CLOSED}). RM states RECEIVED/INVALID/VALID precede acceptance,
      so F-bit + pre-acceptance RM is a causal impossibility.
      Implemented in violation_rm_vfd_entailment() (cross_machine_invariants.py).
      Source: ISSUE-2372.
    testable: true
    preconditions:
    - description: Any participant state snapshot is available for inspection
    verification: >-
      Call violation_rm_vfd_entailment(rm, vfd) for each participant; assert
      None is returned for all valid combined states.
    relationships:
    - rel_type: constrains
      spec_id: CSB-16-001
  - id: CSB-18-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the PXA P-bit set
      (q^cs ∈ ···P··) while an active embargo exists (q^em ∈ {ACTIVE,
      REVISE}). Public awareness of a vulnerability while an embargo is
      active is causally impossible in a well-functioning coordination — the
      P event causes embargo termination, so EM cannot remain ACTIVE once P
      has occurred.
    rationale: >-
      The P event (public disclosure) causes embargo termination per the
      protocol state machine. An embargo that persists after P has been
      recorded is a causal contradiction: the P event entails embargo
      termination, not mere transition ambiguity. This is a causal
      entailment, not a timing race — it is NOT enforced at emit time
      because the sequence of events is what makes it contradictory.
      Implemented in violation_pxa_em_entailment() (cross_machine_invariants.py).
      Source: ISSUE-2372.
    testable: true
    preconditions:
    - description: A PXA state and an EM state are both available for the same case
    verification: >-
      Call violation_pxa_em_entailment(pxa, em) for each participant; assert
      None is returned for all valid combined states.
  - id: CSB-18-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the PXA X-bit set
      (q^cs ∈ ···X·) while an active embargo exists (q^em ∈ {ACTIVE,
      REVISE}). Public exploit availability while an embargo is active is
      causally impossible — the X event entails embargo termination.
    rationale: >-
      Same causal logic as CSB-18-002. The X event (exploit public) triggers
      embargo termination; EM cannot remain ACTIVE after X has been recorded.
      This is a causal entailment diagnosed post-hoc, not enforced at emit.
      Implemented in violation_pxa_em_entailment() (cross_machine_invariants.py).
    testable: true
    preconditions:
    - description: A PXA state and an EM state are both available for the same case
    verification: >-
      Call violation_pxa_em_entailment(pxa, em) for each participant; assert
      None is returned for all valid combined states.
    relationships:
    - rel_type: refines
      spec_id: CSB-18-002
  - id: CSB-18-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant's composite state MUST NOT have the PXA A-bit set
      (q^cs ∈ ···A) while an active embargo exists (q^em ∈ {ACTIVE,
      REVISE}). Observed attacks while an embargo is active is causally
      impossible — the A event entails embargo termination.
    rationale: >-
      Same causal logic as CSB-18-002 and CSB-18-003. The A event (attacks
      observed) triggers embargo termination; EM cannot remain ACTIVE after A
      has been recorded. This is a causal entailment diagnosed post-hoc, not
      enforced at emit.
      Implemented in violation_pxa_em_entailment() (cross_machine_invariants.py).
    testable: true
    preconditions:
    - description: A PXA state and an EM state are both available for the same case
    verification: >-
      Call violation_pxa_em_entailment(pxa, em) for each participant; assert
      None is returned for all valid combined states.
    relationships:
    - rel_type: refines
      spec_id: CSB-18-002
