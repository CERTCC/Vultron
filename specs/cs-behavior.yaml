- id: CSB-04
  title: Receive CP (Public Aware)
  description: Behaviors triggered when a participant receives a CP (Public Aware) message, recording public disclosure of the vulnerability and initiating embargo teardown if an active embargo exists.
  trigger:
    type: message_received
    value: CP
  specs:
  - id: CSB-04-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      (q^cs ∈ ···p··) and EM None or Exited (q^em ∈ {N, X}) receiving CP MUST
      transition their local CS to Public Aware (q^cs ···p·· → ···P··) and emit
      CK to acknowledge receipt.
    rationale: >-
      CP is a global (participant-agnostic) CS transition. All receivers must
      update their own CS state. When EM is None or Exited, no embargo teardown
      is needed.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CP with EM None or
      Exited transitions local CS to ···P·· and emits CK without triggering
      embargo teardown.
    testable: true
    preconditions:
    - cs_pattern: "...p.."
      em_state:
        - NONE
        - EXITED
      description: EM state is None or Exited; CS matches pattern ...p..
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS to Public Aware (···P··)
      expected: Receiver CS public bit set to P
    - order: 2
      actor: receiver
      action: Emit CK to acknowledge receipt of CP
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is public-aware; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-004
      note: 'CP shorthand wire-type mapping'

  - id: CSB-04-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      (q^cs ∈ ···p··) and EM Proposed (q^em ∈ P) receiving CP MUST transition
      their local CS to Public Aware.
    rationale: >-
      Public awareness terminates a pending embargo proposal per VP-09-001 and
      VP-11-002. The embargo cannot be negotiated once the information is public.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CP with EM Proposed
      transitions local CS to ···P··, sets EM to NONE, and emits CK.
    testable: true
    preconditions:
    - cs_pattern: "...p.."
      em_state:
        - PROPOSED
      description: EM state is Proposed; CS matches pattern ...p..
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS to Public Aware (···P··)
      expected: Receiver CS public bit set to P
    - order: 2
      actor: receiver
      action: Transition EM from PROPOSED to NONE (embargo proposal abandoned)
      expected: Receiver EM state is NONE
    - order: 3
      actor: receiver
      action: Emit CK to acknowledge receipt of CP
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is public-aware; EM is NONE; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when information becomes public
    - rel_type: satisfies
      spec_id: MSM-03-004
      note: 'CP shorthand wire-type mapping'

  - id: CSB-04-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      (q^cs ∈ ···p··) and EM Active or Revise (q^em ∈ {A, R}) receiving CP MUST
      transition their local CS to Public Aware.
    rationale: >-
      VP-09-001 and VP-11-002 require immediate embargo termination when public
      awareness occurs. The ordering — CS transition recorded before embargo
      teardown — satisfies constraint C-14 from the behavioral spec design note:
      record CS state change first, then initiate teardown.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CP with EM Active or
      Revise transitions CS to ···P··, emits ET before CK, and that the CS
      transition is recorded before embargo teardown (C-14).
    testable: true
    preconditions:
    - cs_pattern: "...p.."
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern ...p..
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS to Public Aware (···P··)
      expected: Receiver CS public bit set to P
    - order: 2
      actor: receiver
      action: Emit ET to initiate embargo termination
      expected: ET queued for participants; EM begins transitioning to EXITED
    - order: 3
      actor: receiver
      action: Emit CK to acknowledge receipt of CP
      expected: CK queued for sender
    postconditions:
    - description: >-
        Receiver CS is public-aware; ET emitted; EM is EXITED; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when information becomes public
    - rel_type: satisfies
      spec_id: VP-11-002
      note: >-
        SHALL terminate embargo when information about vulnerability or exploit
        is public
    - rel_type: satisfies
      spec_id: VP-11-003
      note: >-
        SHALL initiate embargo termination upon becoming aware of publicly
        available information
    - rel_type: satisfies
      spec_id: MSM-03-004
      note: 'CP shorthand wire-type mapping'

  - id: CSB-04-004
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) already in CS Public
      Aware (q^cs ∈ ···P··) receiving a duplicate CP MUST emit CK without any
      CS or EM state transition.
    rationale: >-
      All C* messages warrant acknowledgment. Duplicate CP does not re-trigger
      CS or EM transitions.
    verification: >-
      Integration tests in `test/demo/` confirm that a duplicate CP (CS already
      ···P··) emits CK and leaves all CS and EM states unchanged.
    testable: true
    preconditions:
    - cs_pattern: "...P.."
      description: CS matches pattern ...P..
    steps:
    - order: 1
      actor: receiver
      action: Emit CK to acknowledge receipt of CP (no state change)
      expected: CK queued for sender; CS and EM states unchanged
    postconditions:
    - description: CK emitted; no state change
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-004
      note: 'CP shorthand wire-type mapping'

  - id: CSB-04-005
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      (q^cs ∈ ···p··) and EM Proposed (q^em ∈ P) receiving CP MUST transition
      EM to None (q^em P → N).
    rationale: >-
      Public awareness makes further embargo negotiation moot; the pending
      proposal is abandoned per VP-09-001.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CP with EM Proposed
      and CS ···p·· transitions EM from PROPOSED to NONE.
    testable: true

  - id: CSB-04-006
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      (q^cs ∈ ···p··) and EM Proposed (q^em ∈ P) receiving CP MUST emit CK to
      acknowledge receipt.
    rationale: >-
      All C* messages warrant acknowledgment per VP-12 messaging norms.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CP with EM Proposed
      and CS ···p·· enqueues CK to the sender.
    testable: true

  - id: CSB-04-007
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      (q^cs ∈ ···p··) and EM Active or Revise (q^em ∈ {A, R}) receiving CP MUST
      initiate embargo termination by emitting ET.
    rationale: >-
      VP-09-001 and VP-11-002 require immediate embargo termination when public
      awareness occurs.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CP with EM Active or
      Revise and CS ···p·· enqueues ET to initiate embargo termination.
    testable: true

  - id: CSB-04-008
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      (q^cs ∈ ···p··) and EM Active or Revise (q^em ∈ {A, R}) receiving CP MUST
      emit CK to acknowledge receipt.
    rationale: >-
      All C* messages warrant acknowledgment per VP-12 messaging norms.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CP with EM Active or
      Revise and CS ···p·· enqueues CK to the sender.
    testable: true

- id: CSB-05
  title: Receive CX (Exploit Public)
  description: Behaviors triggered when a participant receives a CX (Exploit Public) message, recording public availability of an exploit and initiating embargo teardown if an active embargo exists.
  trigger:
    type: message_received
    value: CX
  specs:
  - id: CSB-05-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and not yet exploit-public (q^cs ∈ ···px·) and EM None or Exited
      (q^em ∈ {N, X}) receiving CX MUST transition their local CS to both
      Public Aware and Exploit Public (q^cs ···px· → ···PX·) and emit CK to
      acknowledge receipt.
    rationale: >-
      CX in state ···px· implies the pX→PX invariant (constraint C-15): exploit
      public without prior public awareness is an ephemeral state that
      immediately resolves to both P and X. The CS transition is atomic.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CX in CS ···px· with
      EM None or Exited atomically sets both P and X bits (···PX·) and emits CK.
    testable: true
    preconditions:
    - cs_pattern: "...px."
      em_state:
        - NONE
        - EXITED
      description: EM state is None or Exited; CS matches pattern ...px.
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS to Public Aware and Exploit Public (···PX·)
      expected: Receiver CS public bit P and exploit bit X both set
    - order: 2
      actor: receiver
      action: Emit CK to acknowledge receipt of CX
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···PX·; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-005
      note: 'CX shorthand wire-type mapping'

  - id: CSB-05-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and not yet exploit-public (q^cs ∈ ···px·) and EM Proposed
      (q^em ∈ P) receiving CX MUST transition their local CS to ···PX·.
    rationale: >-
      Exploit publication terminates a pending embargo proposal per VP-09-001.
      The pX→PX invariant applies (constraint C-15).
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CX in CS ···px· with
      EM Proposed transitions CS to ···PX·, sets EM to NONE, and emits CK.
    testable: true
    preconditions:
    - cs_pattern: "...px."
      em_state:
        - PROPOSED
      description: EM state is Proposed; CS matches pattern ...px.
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS to Public Aware and Exploit Public (···PX·)
      expected: Receiver CS public bit P and exploit bit X both set
    - order: 2
      actor: receiver
      action: Transition EM from PROPOSED to NONE (embargo proposal abandoned)
      expected: Receiver EM state is NONE
    - order: 3
      actor: receiver
      action: Emit CK to acknowledge receipt of CX
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···PX·; EM is NONE; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when information becomes public
    - rel_type: satisfies
      spec_id: MSM-03-005
      note: 'CX shorthand wire-type mapping'

  - id: CSB-05-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and not yet exploit-public (q^cs ∈ ···px·) and EM Active or Revise
      (q^em ∈ {A, R}) receiving CX MUST transition their local CS to ···PX·.
    rationale: >-
      VP-09-001 and VP-11-002 require immediate embargo termination when exploit
      publication occurs. The pX→PX invariant applies. C-14 ordering: record
      CS transition first, then initiate teardown.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CX in CS ···px· with
      EM Active or Revise transitions CS to ···PX·, emits ET, then emits CK,
      with the CS transition recorded before teardown (C-14).
    testable: true
    preconditions:
    - cs_pattern: "...px."
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern ...px.
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS to Public Aware and Exploit Public (···PX·)
      expected: Receiver CS public bit P and exploit bit X both set
    - order: 2
      actor: receiver
      action: Emit ET to initiate embargo termination
      expected: ET queued for participants; EM begins transitioning to EXITED
    - order: 3
      actor: receiver
      action: Emit CK to acknowledge receipt of CX
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···PX·; ET emitted; EM is EXITED; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when exploit publication occurs
    - rel_type: satisfies
      spec_id: VP-11-002
      note: SHALL terminate embargo when exploit is public
    - rel_type: satisfies
      spec_id: MSM-03-005
      note: 'CX shorthand wire-type mapping'

  - id: CSB-05-004
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS already public
      but not yet exploit-public (q^cs ∈ ···Px·) receiving CX MUST transition
      their local CS exploit bit to X (q^cs ···Px· → ···PX·) and emit CK.
    rationale: >-
      When public awareness already exists, CX transitions only the exploit bit.
      No new embargo teardown is triggered since the embargo should already have
      been terminated when P was reached.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CX in CS ···Px·
      transitions the exploit bit to X (···PX·) and enqueues CK without triggering
      embargo teardown.
    testable: true
    preconditions:
    - cs_pattern: "...Px."
      description: CS matches pattern ...Px.
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS exploit bit to X (···PX·)
      expected: Receiver CS exploit bit X set; public bit P remains set
    - order: 2
      actor: receiver
      action: Emit CK to acknowledge receipt of CX
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···PX·; CK emitted
