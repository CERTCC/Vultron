    - story_2022_023
  - id: CSB-05-003
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and not yet exploit-public (q^cs ∈ ···px·) and EM Active or Revise
      (q^em ∈ {A, R}) receiving CX MUST transition their local CS to ···PX·.
    rationale: >-
      VP-09-001 and VP-11-002 require immediate embargo termination when exploit
      publication occurs. The pX→PX invariant applies. The CS transition is
      recorded before teardown begins (CSB-05-010).
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CX in CS ···px· with
      EM Active or Revise transitions CS to ···PX·, that the CASE_MANAGER emits
      ET, then CK is emitted, with the CS transition recorded before
      teardown.
    testable: true
    preconditions:
    - cs_pattern: "...px."
      em_state:
        - ACTIVE
        - REVISE
      description: EM state is Active or Revise; CS matches pattern ...px.
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS to Public Aware and Exploit Public (···PX·)
      expected: Receiver CS public bit P and exploit bit X both set
    - order: 2
      actor: CASE_MANAGER
      action: >-
        Emit ET to initiate embargo termination (CSB-05-008); a receiver
        that does not hold the CASE_MANAGER role emits no ET
      expected: ET queued for participants; EM begins transitioning to EXITED
    - order: 3
      actor: receiver
      action: Emit CK to acknowledge receipt of CX
      expected: CK queued for sender
    postconditions:
    - description: >-
        Receiver CS is ···PX·; the CASE_MANAGER has emitted ET; EM is EXITED;
        CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: VP-09-001
      note: Embargoes SHALL terminate immediately when exploit publication occurs
    - rel_type: satisfies
