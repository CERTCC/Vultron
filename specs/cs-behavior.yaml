id: CSB
title: CVD Case State Behavioral Requirements
description: >-
  Event-Condition-Action behavioral requirements for CVD Case State (CS) transitions.
  Each group is triggered by either a received CS message or a local CS state transition,
  and specifies typed preconditions, ordered steps, and postconditions that implementations
  must satisfy. CS cascade chains that trigger embargo teardown reference EM behavior
  directly and are developed in concert with the EM behavioral requirements.
version: 0.1.1
tags:
- behavioral
- state-machine
- protocol
scope:
- prototype
- production
groups:
- id: CSB-01
  title: Receive CV (Vendor Aware)
  description: Behaviors triggered when a participant receives a CV (Vendor Aware) message, updating the sender's CS state model to reflect vendor awareness of the vulnerability.
  trigger:
    type: message_received
    value: CV
  specs:
  - id: CSB-01-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) receiving CV MUST
      update their model of the sending Participant's CS state to Vendor Aware
      (q^cs ∈ Vfd···) and emit CK to acknowledge receipt.
    rationale: >-
      CV announces a Vendor-specific CS transition. The receiver does not change
      their own CS state; they update their awareness model for the sender. The
      CK acknowledges receipt per VP-12 messaging norms.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CV in an active RM
      state updates the sender's CS model to Vfd··· and enqueues CK without
      changing the receiver's own CS state.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted)
    steps:
    - order: 1
      actor: receiver
      action: >-
        Update model of sender's CS state to Vendor Aware (Vfd···) — receiver's
        own CS state is unchanged
      expected: Receiver's awareness model for sender reflects CS=Vfd
    - order: 2
      actor: receiver
      action: Emit CK to acknowledge receipt of CV
      expected: CK queued for sender
    postconditions:
    - description: Sender's CS state recorded as Vfd; CK emitted; receiver CS unchanged
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-001
      note: 'CV shorthand wire-type mapping'

