- id: CSB-06
  title: Receive CA (Attacks Observed)
  description: Behaviors triggered when a participant receives a CA (Attacks Observed) message, recording active exploitation of the vulnerability and initiating embargo teardown if an active embargo exists.
  trigger:
    type: message_received
    value: CA
  specs:
  - id: CSB-06-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM None or Exited
      (q^em ∈ {N, X}) receiving CA MUST transition their local CS attacks bit
      to A (q^cs ···p·a → ···p·A) and emit CK.
    rationale: >-
      An observed attack is evidence of exploitation, not public information
      about the vulnerability: an attack can be seen on one network while
      nothing about the vulnerability has been published. A CS transition
      changes one dimension (CSB-17-002), and ···p·A is a state a case can
      rest in (CSB-17-003), so the public bit waits for its own P event.
      When EM is None or Exited, no embargo teardown is needed.
    verification: >-
      Integration tests in `test/demo/` confirm that receiving CA in CS ···p·a with
      EM None or Exited sets the attacks bit (···p·A), leaves the public bit
      unset, and emits CK.
    testable: true
    preconditions:
    - cs_pattern: "...p.a"
      em_state:
        - NONE
        - EXITED
      description: EM state is None or Exited; CS matches pattern ...p.a
    steps:
    - order: 1
      actor: receiver
      action: Transition local CS attacks bit to A (···p·A)
      expected: Receiver CS attacks bit A set; public bit p remains unset
    - order: 2
      actor: receiver
      action: Emit CK to acknowledge receipt of CA
      expected: CK queued for sender
    postconditions:
    - description: Receiver CS is ···p·A; CK emitted
    relationships:
    - rel_type: satisfies
      spec_id: MSM-03-006
      note: 'CA shorthand wire-type mapping'

    stories:
    - story_2022_019
    - story_2022_081
    - story_2022_088
  - id: CSB-06-002
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in a non-Closed RM state (q^rm ∉ C) with CS not yet public
      and attacks not yet observed (q^cs ∈ ···p·a) and EM Proposed
      (q^em ∈ P) receiving CA MUST transition their local CS attacks bit to A
      (q^cs ···p·a → ···p·A).
    rationale: >-
