id: IO
title: Inbox Orchestration
description: Testable requirements for the core BT-backed inbox orchestration module, covering the InboxOutcome model, BT
  sequence invariants, adapter injection rules, caller interface constraints, and error/outcome behavior.
scope:
- prototype
- production
tags:
- messaging
- behavior-tree
groups:
- id: IO-01
  title: InboxOutcome Model
  specs:
  - id: IO-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The inbox orchestration module MUST define an InboxOutcome Pydantic model as the sole return type of process_payload.
    rationale: A typed return model makes outcome inspection safe and self-documenting for all callers (FastAPI, CLI, tests).
    tags:
    - messaging
    - protocol
  - id: IO-01-002
    priority: MUST
    kind: project
    statement: >-
      InboxOutcome MUST include a status field typed as the InboxOutcomeStatus
      StrEnum, whose members are processed, deferred, and rejected.
    rationale: >-
      Three statuses cover the outcome space: dispatched, held for replay, and not
      processable. Deferred has two producers, the pre-dispatch defer check (case not
      yet known) and a handler returning DEFERRED, and both keep working.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` drives each
      disposition through `process_payload` and asserts each resulting status as an
      `InboxOutcomeStatus` member.
    tags:
    - messaging
  - id: IO-01-006
    priority: MUST
    kind: project
    statement: >-
      When dispatch ran, the inbox pipeline MUST derive InboxOutcome's status from the
      handler's HandlerResult disposition (UCORG-05-017), not from dispatch merely not
      raising. APPLIED and SKIPPED yield processed, DEFERRED yields deferred, and
      REFUSED yields rejected.
    rationale: >-
      A dispatch that does not raise can still be a refusal, so the status must come
      from the handler's own verdict. The mapping lives only in the pipeline's
      dispatch node, so handlers never name this vocabulary (HP-01-004). A dispatch
      where no handler ran is never processed (UCORG-05-012). `DeferCheckNode` and
      `DereferenceCheckNode` (AKM-05-010) also defer, before dispatch. Only a
      handler's DEFERRED goes through this mapping.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` drives each
      disposition and unhandled semantics through the real dispatch adapters and
      `process_payload`, and asserts the resulting status.
    tags:
    - messaging
    relationships:
    - rel_type: uses_definition
      spec_id: IO-01-002
    - rel_type: uses_definition
      spec_id: UCORG-05-017
    adr:
    - ADR-0095
  - id: IO-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: InboxOutcome MUST include a context_id field (nullable string) carrying the case or activity context identifier,
      when available.
    rationale: Callers need context identity for logging, telemetry, and pending-queue management.
    tags:
    - messaging
  - id: IO-01-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      InboxOutcome MUST include a failure_reason field (nullable string) that carries a
      human-readable explanation when the status is rejected or deferred.
    rationale: >-
      Explicit failure reasons support triage without log scraping.
    tags:
    - messaging
    - observability
  - id: IO-01-007
    priority: MUST
    kind: project
    statement: >-
      When a handler returns REFUSED, the inbox pipeline MUST set InboxOutcome's
      failure_reason to the handler's HandlerResult reason.
    rationale: >-
      A REFUSED HandlerResult always carries a reason (ADR-0095). When the outcome
      carries that reason, every handler refusal is explained.
    verification: >-
      `test_refused_handler_yields_rejected_with_its_reason` in
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` asserts that a
      refusal's reason reaches the outcome.
    tags:
    - messaging
    - observability
    relationships:
    - rel_type: refines
      spec_id: IO-01-004
  - id: IO-01-005
    priority: MUST
    kind: project
    statement: >-
      InboxOutcome MUST include an `unhandled` field (boolean, default false). The field
      is true only for a rejected outcome whose semantic type no use case handles ("no
      use case found", SE-05-002).
    rationale: >-
      A receiver that does not handle a message has not found the message invalid
      (ADR-0140 item 5). The flag lets a caller tell that outcome from other
      rejections. The flag is set from the dispatcher's own verdict, not read from the
      reason text.
    verification: >-
      `test_unhandled_semantics_is_reported_not_raised` in
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` drives an activity
      whose semantic type has no use case through the inbox pipeline and confirms a
      rejected outcome with `unhandled` true.
      `test/core/behaviors/inbox/test_process_payload.py` confirms that the field
      defaults to false and is true only for a rejection.
    relationships:
    - rel_type: uses_definition
      spec_id: SE-05-002
    tags:
    - messaging
    - observability
  - id: IO-01-008
    priority: MUST
    kind: project
    statement: >-
      The driving adapter MUST log an `unhandled` outcome (IO-01-005) at INFO, not at
      the WARNING it uses for other rejections (UCORG-05-013).
    rationale: >-
      A recognized but unhandled activity is a normal operation, not a recoverable
      anomaly (SL-03-001). A WARNING for it would hide the real anomalies among
      routine records.
    verification: >-
      `test_pipeline_reports_no_use_case_found_at_info_only` in
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` confirms that no
      record at WARNING or above is logged by any logger for such an outcome.
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-013
    - rel_type: uses_definition
      spec_id: IO-01-005
    tags:
    - messaging
    - observability
- id: IO-02
  title: BT Orchestration Module
  specs:
  - id: IO-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The inbox orchestration module MUST be located at `vultron/core/behaviors/inbox/`.
    rationale: Placement in core/ satisfies the hexagonal architecture constraint that core imports no framework
      (ARCH-01-001, ADR-0009) and enables the module
      to be used by FastAPI, CLI, and test adapters equally.
    tags:
    - code-style
    references:
    - docs/adr/0009-hexagonal-architecture.md
    - docs/adr/0020-inbox-bt-orchestration.md
    adr:
    - ADR-0009
  - id: IO-02-001b
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: The inbox orchestration module MUST NOT import from `vultron/adapters/` or any web framework package.
    rationale: >-
      Core holds the inbox policy so that every driving adapter and every test uses the
      same policy. An import from `vultron/adapters/` or a web framework binds core to
      one adapter. A test or a second adapter then cannot run the policy without that
      adapter (ARCH-01-001).
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
    tags:
    - code-style
    adr:
    - ADR-0009
  - id: IO-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'The BT implementation MUST enforce the following fixed node ordering via BT Sequence nodes: (1) parse inbound
      payload, (2) rehydrate Activity, (3) extract MessageSemantics, (4) defer-eligibility check, (5) dispatch to use-case
      path, (6) build typed outcome.'
    rationale: Fixed BT ordering makes the inbound pipeline auditable and prevents callers from accidentally invoking steps
      out of order.
    tags:
    - behavior-tree
    - protocol
  - id: IO-02-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `process_payload` function MUST be the sole caller-facing entry point of the inbox orchestration module.
    rationale: Encapsulating intermediate steps preserves depth and prevents shallow reimplementations of parts of the pipeline.
    tags:
    - protocol
  - id: IO-02-003b
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Intermediate behavior-tree nodes used internally by `process_payload` MUST NOT be exported as
      public API symbols.
    rationale: >-
      If the internal nodes are public, a caller can run some steps of the pipeline and
      skip others, such as the defer check or the outcome step. Only `process_payload`
      runs every step in its fixed order (IO-02-002), so only it is public.
    relationships:
    - rel_type: refines
      spec_id: IO-02-003
    tags:
    - protocol
  - id: IO-02-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: The inbox orchestration module MUST NOT instantiate or call a use-case class directly inside a behavior-tree node `update()` method.
    rationale: Use cases create BTs; BT nodes are leaves. Calling a use case from a node creates a prohibited BT-UseCase-BT
      chain (BT-06-006).
    tags:
    - behavior-tree
    - code-style
- id: IO-03
  title: Adapter Injection
  specs:
  - id: IO-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      process_payload MUST accept exactly two injected adapters: an ingress payload
      adapter (raw input to as_Activity) and a dispatch adapter (VultronEvent to
      use-case execution).
    rationale: >-
      Two adapters with clear names make the two required inputs of the pipeline
      explicit. Each additional adapter is one more interface for every caller to supply
      and for the module to hide.
    tags:
    - tooling
    references:
    - docs/adr/0020-inbox-bt-orchestration.md
  - id: IO-03-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The dispatch adapter (IO-03-001) MUST return the handler's HandlerResult
      (UCORG-05-010), which is the only channel by which the verdict reaches
      InboxOutcome.
    rationale: >-
      The dispatch adapter returns the HandlerResult, so a handler does not have to
      write the verdict to a blackboard key. InboxOutcome's vocabulary stays out of
      handlers (HP-01-004).
    tags:
    - tooling
    relationships:
    - rel_type: refines
      spec_id: UCORG-05-010
    - rel_type: extends
      spec_id: IO-03-001
  - id: IO-03-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Pending-queue management MUST be provided to the inbox orchestration module via an injected port dependency.
    rationale: Injecting the pending-queue port keeps core/ free of adapter dependencies and aligns with hexagonal architecture.
    tags:
    - tooling
    - code-style
  - id: IO-03-002b
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: The inbox orchestration module MUST NOT access pending-queue storage directly from `vultron/adapters/`.
    rationale: >-
      Pending-queue storage is an adapter detail. If the inbox orchestration module
      reads that storage directly, it depends on an adapter, against ARCH-01-001, and a
      test cannot give it a different queue. In this module, the injected port
      (IO-03-002) is the only path to the queue.
    relationships:
    - rel_type: refines
      spec_id: IO-03-002
    tags:
    - tooling
    - code-style
  - id: IO-03-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The FastAPI inbox path MUST supply adapter implementations to `process_payload` at construction time.
    rationale: Policy logic in the router binds it to the web framework, against the hexagonal layering that keeps policy in a
      framework-free core (ARCH-01-001, ADR-0009), and makes the orchestration untestable without a running
      FastAPI app.
    tags:
    - tooling
    adr:
    - ADR-0009
  - id: IO-03-003b
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      The FastAPI inbox path MUST NOT contain inbox policy logic, apart from the
      synchronous guard that IO-03-007 allows.
    rationale: >-
      Policy in the router binds it to the web framework, against the hexagonal layering
      that keeps policy in a framework-free core (ARCH-01-001, ADR-0009). It also makes
      the orchestration untestable without a running FastAPI app.
    relationships:
    - rel_type: refines
      spec_id: IO-03-006
    tags:
    - tooling
    adr:
    - ADR-0009
    see_also:
    - spec_id: IO-03-007
      reason: 'context for the reader'
  - id: IO-03-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      All inbox policy logic MUST reside in the core inbox orchestration module, apart
      from the synchronous guard that IO-03-007 allows.
    rationale: >-
      One home for inbox policy lets a test drive all of it without a web framework,
      and keeps the core free of framework code (ARCH-01-001, ADR-0009).
    tags:
    - tooling
    adr:
    - ADR-0009
  - id: IO-03-007
    priority: MAY
    kind: project
    statement: >-
      A synchronous guard MAY live at the route level when synchronous refusal is
      required (IE-11-001, ADR-0068). Such a guard refuses an inbound Activity before
      the HTTP 202 is returned and before the background task is scheduled.
    rationale: >-
      Such a guard must act before the background task is scheduled, so it must sit
      at the route. ADR-0068 documents this tradeoff.
    relationships:
    - rel_type: supersedes
      spec_id: IO-03-006
    tags:
    - tooling
    adr:
    - ADR-0068
    see_also:
    - spec_id: IE-11-001
      reason: 'context for the reader'
  - id: IO-03-004
    priority: MUST_NOT
    kind: project
    statement: >-
      The ingress payload adapter MUST NOT write an inline object of a received activity
      to the receiver's DataLayer as a record readable by its id. This holds on receipt
      and for a deferred replay.
    rationale: >-
      A stored inline object is the receiver's own record of that object. A stored case
      is the receiver's replica, so if the receiver stores a case at receipt, a sender's
      snapshot can name the sender as CASE_MANAGER and pass the trust check that must
      refuse it (PCR-03-004, CBT-01-011). A handler therefore sees the receiver's
      record of any id it holds, never the carried copy, so a guard keys on the stored
      record (HP-08-006).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_staging.py` asserts that the routed
      activity carries its inline object while the receiver's store holds none.
      `test/adapters/driving/fastapi/test_inbox_outcome_chain.py` drives an untrusted
      `Announce(VulnerabilityCase)` and retired `Create`s through the real inbox and
      asserts nothing from the inline object is stored.
    tags:
    - tooling
    adr:
    - ADR-0111
  - id: IO-03-008
    priority: MAY
    kind: project
    statement: >-
      To rebuild the routed activity, the ingress payload adapter MAY stage the inline
      objects in a holding area outside the receiving actor's DataLayer. The holding
      area answers a read only when the DataLayer holds nothing under the id, and keeps
      nothing past the delivery.
    rationale: >-
      Routing still needs the inline object, because the rebuilt activity names it by
      id, and a bare id matches no pattern (SE-01-006). The receiver's record wins over
      the carried copy, so a carried case cannot replace the replica that the receiver
      rebuilds from the ledger.
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_staging.py` asserts that the
      receiver's own copy wins over the staged one.
    relationships:
    - rel_type: implements
      spec_id: IO-03-004
    tags:
    - tooling
    adr:
    - ADR-0111
  - id: IO-03-009
    priority: MAY
    kind: project
    statement: >-
      For an activity the inbox defers, the ingress payload adapter MAY keep the
      activity itself, as the received body the parser sealed (VM-08-002). It keeps the
      body beside the staged rows on the activity's one record, keyed by the activity
      and marked as owing a replay, which the replay or the queue's expiry releases.
      The record goes with the release, because a message still owed a replay has not
      been archived (ADR-0154).
      The activity names there the case it waits on, so what waits for a case is read
      from the waiting activities and kept in no second list. A held out-of-order
      `Announce(CaseLedgerEntry)` (SYNC-14-001) is kept the same way, released by its
      replay or by the holding area's bound (SYNC-14-006).
    rationale: >-
      The record holds the activity too, because no copy under its sender's id is
      there to replay (DL-06-006). One record per message, rather than a holding record
      beside an archive, is what lets the receiver answer "have I seen this?" with one
      read, and keeps a queued id from outliving the body behind it (ADR-0154).
    verification: >-
      `test/adapters/driving/fastapi/test_inbox_staging.py` asserts that a deferred
      activity is held whole, its body and rows, for its replay and released by the
      replay or by expiry. `test/core/services/test_received_holding.py` asserts that
      releasing a hold hands the body to the replay, that discarding one drops it, that
      an archived or refused activity is never held again, and that what waits on a
      case is read from the waiting records in arrival order.
    relationships:
    - rel_type: implements
      spec_id: IO-03-004
    - rel_type: uses_definition
      spec_id: VM-08-002
    - rel_type: uses_definition
      spec_id: SYNC-14-001
    - rel_type: uses_definition
      spec_id: SYNC-14-006
    tags:
    - tooling
    adr:
    - ADR-0111
- id: IO-04
  title: Caller Interface
  specs:
  - id: IO-04-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `process_payload` MUST always return an `InboxOutcome` instance, regardless of payload
      validity.
    rationale: Typed outcomes allow callers to handle all cases uniformly without exception-driven control flow at the integration
      boundary.
    tags:
    - protocol
    - error-handling
  - id: IO-04-001b
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      `process_payload` MUST NOT raise an exception for a protocol-invalid payload.
    rationale: >-
      The FastAPI inbox background task, the inbox queue drain (which also replays
      deferred activities) and the tests all call `process_payload`. If a
      protocol-invalid payload raises, each caller needs its own handler for the raise,
      and a caller that has none loses the outcome.
    relationships:
    - rel_type: refines
      spec_id: IO-04-001
    tags:
    - protocol
    - error-handling
  - id: IO-04-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      `process_payload` MUST encode every error condition in the `InboxOutcome` it
      returns.
    rationale: >-
      An outcome value gives every caller the same result for every payload, so no
      caller has to read logs or catch a raise to learn what failed.
    relationships:
    - rel_type: implements
      spec_id: IO-04-001b
    tags:
    - protocol
    - error-handling
  - id: IO-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Tests for `process_payload` MUST assert on `InboxOutcome.status` and
      `InboxOutcome.failure_reason` fields.
    rationale: Interface-level test assertions are resilient to internal refactors and validate the contract rather than the
      implementation.
    tags:
    - testing
  - id: IO-04-002b
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      Tests for `process_payload` MUST NOT patch internal behavior-tree node helper methods to
      verify pipeline behavior.
    rationale: >-
      A test that patches a node helper checks the internal structure, not the behavior
      of the pipeline. It passes when the pipeline is wrong and fails when a correct
      change moves the helper. The outcome fields (IO-04-002) are what callers rely on.
    relationships:
    - rel_type: extends
      spec_id: IO-04-002
    tags:
    - testing
  - id: IO-04-003
    priority: SHOULD
    kind: project
    statement: Both a production ASGI adapter and an in-memory test adapter SHOULD implement the ingress payload adapter interface,
      so that the same process_payload seam is used in both runtime and test contexts.
    rationale: Shared interface across runtime and test adapters validates real-world behavior and reduces adapter-specific
      test scaffolding.
    tags:
    - testing
    - tooling
