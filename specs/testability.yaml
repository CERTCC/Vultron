id: TB
title: Testability
description: >-
  The Vultron inbox handler must be thoroughly testable at unit, integration, and system levels.
  Testability enables confidence in correctness, supports refactoring, and documents expected
  behavior.
scope:
- prototype
- production
tags:
- testing
groups:
- id: TB-01
  title: Testing Framework
  specs:
  - id: TB-01-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The system MUST use pytest as the testing framework
    rationale: >-
      One test framework lets one command run every test, in CI and on a developer
      machine. The suite depends on pytest features: fixtures, markers, `pytest-xdist`
      workers and `pytest-timeout` ceilings (TB-14-001). Tests written for a second
      framework would need their own runner and could not use these features.
  - id: TB-01-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test configuration MUST be defined in `pyproject.toml`
    rationale: >-
      pytest reads its settings from one file. With the markers, the timeouts and the
      default options in `pyproject.toml`, a local run and a CI run use the same
      settings. pytest reads a `pytest.ini` file before `pyproject.toml`, so a second
      file would replace the shared settings.
- id: TB-02
  title: Test Coverage
  specs:
  - id: TB-02-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Unit tests MUST achieve 80%+ line coverage
    rationale: >-
      Code that no test runs can break with no test failing. Line coverage shows which
      code that is. A floor of 80% for unit tests keeps most code under test, and it
      still permits code that a unit test cannot easily reach.
  - id: TB-02-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Critical paths MUST achieve 100% line coverage
    rationale: >-
      A defect on a critical path, such as message dispatch or a case state change, can
      corrupt case data or stop the protocol. Full line coverage of these paths makes
      sure that a change to any of their lines runs at least one test.
- id: TB-03
  title: Integration Test Coverage
  specs:
  - id: TB-03-001
    priority: MUST
    kind: project
    statement: Integration tests MUST cover inbox POST → handler invocation flow
    rationale: >-
      Unit tests check the parser, the dispatcher and each use case alone. Only a test
      that posts to the inbox shows that they work together: that a valid activity
      reaches the correct use case and changes the DataLayer as expected.
    verification: Integration tests confirm that a `POST /inbox/` with a valid AS2 activity triggers the correct handler
      invocation and produces the expected DataLayer side effects.
    stories:
    - story_2022_002
    - story_2022_039
  - id: TB-03-002
    priority: MUST
    kind: project
    statement: Integration tests MUST cover validation → error response flow
    rationale: >-
      A sender that posts a bad payload needs an error it can act on. An unhandled
      server error gives no reason, and it looks like a server fault. Only a test
      through the HTTP stack shows the status and the body that the sender gets.
    verification: Integration tests confirm that a `POST /inbox/` with a malformed or invalid payload returns a
      structured error response (HTTP 400 or 422) rather than an unhandled server error.
    stories:
    - story_2022_089
  - id: TB-03-003
    priority: MUST
    kind: project
    statement: Integration tests MUST verify async processing behavior
    rationale: >-
      The inbox answers with HTTP 202 and processes the activity in a background task.
      A test that checks only the response cannot see that processing. The test must
      also check the DataLayer after the task ends, or a failure in the task stays
      hidden.
    verification: Integration tests confirm that inbox processing returns HTTP 202 for activities dispatched to background
      processing, and that the resulting DataLayer state is updated after the handler completes asynchronously.
    stories:
    - story_2022_002
    - story_2022_088
- id: TB-04
  title: Test Organization
  specs:
  - id: TB-04-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test structure MUST mirror source code structure
    rationale: >-
      When the test tree has the same layout as the source tree, a reader finds the
      tests for a module at the matching path under `test/`. A change to a module then
      shows which tests to run and to update, and a module with no tests is easy to
      see.
  - id: TB-04-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test files MUST use descriptive names starting with `test_`
    rationale: >-
      pytest collects only files whose names match its file pattern, and this
      repository uses the default, `test_*.py`. A test file with a different name never
      runs, so its tests can never fail. A descriptive name also tells a reader which
      area a failure is in.
  - id: TB-04-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Unit and integration tests MUST be in separate directories or marked with pytest markers
    rationale: >-
      Integration tests are slower and need more setup than unit tests. The
      `integration` marker lets the default options in `pyproject.toml` leave them out
      (`-m 'not integration'`), so the unit suite stays fast. A run with `-m ""`
      includes both.
- id: TB-05
  title: Test Data Management
  specs:
  - id: TB-05-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The system MUST provide reusable test fixtures
    rationale: >-
      Many tests need the same setup, such as a DataLayer, actors or a case. A shared
      fixture defines that setup once. Copies of a setup drift apart when the code
      changes, and the tests that use them then check different things.
  - id: TB-05-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test data MUST be generated via factories, not hardcoded
    rationale: >-
      Hard-coded test data goes stale when a model gets a new required field or
      validator, and each copy must then be fixed by hand. A factory builds valid
      objects in one place, so one change updates every test that uses it.
  - id: TB-05-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test fixtures MUST be defined in `conftest.py` files
    rationale: >-
      pytest gives every test in a directory, and in the directories below it, the
      fixtures from that directory's `conftest.py`, with no import. Fixtures kept there
      are easy to find and to share, so tests do not define the same fixture again.
  - id: TB-05-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Tests MUST use proper domain objects, not simplified mock data
    rationale: >-
      Tests with string IDs can pass while production code fails; proper objects exercise
      actual validation and serialization
  - id: TB-05-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test semantic types MUST match the activity structure being tested
    rationale: >-
      Semantic type validation is enforced by the `use_case_map()` key lookup at dispatch time;
      mismatched tests bypass actual code paths
- id: TB-06
  title: Test Isolation
  specs:
  - id: TB-06-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Tests MUST be independent and runnable in any order
    rationale: >-
      A test that depends on another test, or on the order of tests, passes or fails
      because of the schedule and not because of the code. Under `pytest-xdist`, the
      order of tests and the worker that runs each test change between runs. Only
      independent tests give the same result every time.
  - id: TB-06-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Tests MUST use test database or mocked database
    rationale: >-
      A test that writes to a real deployment's database can change or delete data that
      is not test data. It can also fail because of data that an earlier run left. A
      test database or a mock holds only what the test puts in it. The test session
      sets `VULTRON_DATABASE__DB_URL` to an in-memory SQLite database by default.
  - id: TB-06-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test state MUST be reset between tests
    rationale: >-
      State that one test leaves, such as a cached config, a registry entry or
      blackboard keys, changes what the next test sees. The next test can then pass or
      fail because of the earlier one. A reset gives each test the same start.
  - id: TB-06-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Test fixtures MUST clean up created data after test completion
    rationale: Prevents test database bloat and ensures isolation
  - id: TB-06-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Behavior Tree tests MUST clear the py_trees blackboard between tests
    rationale: >-
      py_trees blackboard is a global singleton; without clearing, state from one test leaks
      into subsequent tests
  - id: TB-06-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: All tests MUST be deterministic and produce the same result on every run
    rationale: >-
      Flaky tests erode confidence in the test suite, mask real failures, and slow development.
      A flaky test MUST be fixed or removed; it MUST NOT be left in the suite.
  - id: TB-06-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Integration tests that exercise multi-actor message flows MUST give each simulated
      actor its own isolated `DataLayer` instance. Tests that share a single `DataLayer`
      across multiple actors bypass the outbox→inbox delivery path and test in-memory
      state sharing instead of protocol communication.
    rationale: >-
      The outbox→inbox delivery path is a critical protocol boundary. A shared DataLayer
      removes it: actor A's outbox write is immediately visible to actor B without going
      through any delivery mechanism, making the test a unit test of shared state rather
      than an integration test of the protocol.
    relationships:
    - rel_type: refines
      spec_id: TB-06-001
  - id: TB-06-008
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      BT factories that have probabilistic defaults (e.g., always-succeed or always-fail
      stubs for nodes backed by configurable policies) MUST expose a module-level
      deterministic factory constant for use in tests. Tests MUST use the deterministic
      factory, not the production random-policy factory, to avoid stochastic test failures.
    rationale: >-
      A test that calls a production BT factory configured with a probability distribution
      may pass or fail depending on random outcomes. The deterministic factory ensures
      the test exercises a specific code path every time. Convention: name the constant
      `_always_succeed_factory` or `_always_fail_factory` at module level.
    relationships:
    - rel_type: refines
      spec_id: TB-06-006
- id: TB-07
  title: Mocking and Stubbing
  specs:
  - id: TB-07-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: External services MUST be mocked in unit tests
    rationale: >-
      A unit test that calls a real external service depends on the network and on that
      service. It is slow, and it fails when the service is unavailable. A mock keeps
      the test about the unit's own logic.
  - id: TB-07-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Database access MUST be stubbed in unit tests
    rationale: >-
      A unit test checks the logic of one unit. When that unit reads and writes through
      a stub, a failure points at the unit and not at the storage layer, and the test
      does not depend on database setup.
  - id: TB-07-003
    priority: MAY
    kind: project
    statement: Integration tests MAY use real database with test data
    rationale: >-
      Some behavior exists only when data is stored: serialization, round trips and
      queries. An integration test with a real database and test data checks that
      behavior, which a stub cannot show.
- id: TB-08
  title: Test Documentation
  specs:
  - id: TB-08-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Tests MUST use descriptive names explaining what is tested
    rationale: >-
      A test name is the first thing a reader sees when a test fails. A name that
      states the behavior under test tells the reader what broke without reading the
      test body.
  - id: TB-08-002
    priority: SHOULD
    kind: project
    statement: Complex tests SHOULD include docstrings
    rationale: >-
      A complex test sets up state and checks results that the code alone does not
      explain. A docstring states the scenario and the expected result, so a reader can
      tell whether a failure is a defect in the code or a stale test.
  - id: TB-08-003
    priority: SHOULD
    kind: project
    statement: Tests SHOULD serve as usage examples
    rationale: >-
      Tests show how to call the code with real inputs, and they fail when the code
      changes. A test that reads as an example is documentation that stays current,
      because the test fails when it goes out of date.
- id: TB-09
  title: Test Maintainability
  specs:
  - id: TB-09-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Each test function MUST exercise a single scenario. Test bodies MUST NOT contain
      conditional branching logic (if/else). Exception-assertion patterns using
      pytest.raises as a context manager are permitted; bare try/except blocks that
      catch and suppress unexpected errors are not.
    rationale: >-
      A test with branches checks different things on different runs, and a reader
      cannot tell which branch ran. A bare `try`/`except` can hide the error the test
      must report. One scenario per test, with no branches, makes each failure point at
      one behavior.
  - id: TB-09-002
    priority: SHOULD
    kind: project
    statement: Test duplication SHOULD be avoided via fixtures and helpers
    rationale: >-
      Duplicated setup must be changed in every copy when the code changes, and a
      missed copy tests old behavior. A shared fixture or helper changes in one place
      (CS-22-001).
  - id: TB-09-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Tests MUST be refactored along with production code
    rationale: >-
      A refactor changes how the code works. A test that is not changed with it either
      fails, or it passes against code that it does not describe. Changing the tests
      together with the code keeps the suite a correct description of the code.
- id: TB-11
  title: Test Infrastructure Consistency
  specs:
  - id: TB-11-001
    priority: MUST
    kind: project
    statement: >-
      When a pytest mark is renamed or added, ALL of the following MUST be
      updated in the same changeset: (a) the `markers` list in `pyproject.toml`,
      (b) any `.github/workflows/` YAML files that reference the mark by name
      (e.g., `-m "mark_name"` in `pytest` invocations), and (c) any test files
      that apply the mark.
    rationale: >-
      When `pyproject.toml`, a workflow and the test files name a mark differently, a
      run selects the wrong tests. If a workflow selects by a mark name that no test
      uses, pytest collects no tests and exits with code 5. CI then fails with "no
      tests ran", which looks like a problem with the environment, not with a name. A
      change that updates all three places together prevents this.
    verification: >-
      After any pytest mark rename: grep `.github/workflows/` for the old mark
      name and confirm zero matches; confirm `pyproject.toml` registers the new
      name; run `pytest -m "new_mark_name" --collect-only` and confirm non-zero
      test collection.
    relationships:
    - rel_type: refines
      spec_id: TB-01-002
      note: Mark consistency between source, config, and CI is part of test
        infrastructure correctness
- id: TB-10
  title: Architecture Boundary Tests
  specs:
  - id: TB-10-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      Architecture ratchet tests MUST use bidirectional equality: `assert actual_violations
      == KNOWN_VIOLATIONS`. A subset check (`assert actual ⊆ KNOWN`) is prohibited because
      it allows the violation set to grow without failing the test. When a violation is
      resolved, its entry MUST be removed from `KNOWN_VIOLATIONS` in the same commit.
    rationale: >-
      With a subset check, a violation that is fixed can stay on the known list. A
      later change can then bring the same violation back, and the test still passes.
      An equality check fails as soon as a listed violation is fixed, so the list is
      cleaned in the same commit and always matches the code (ARCH-18-001).
    relationships:
    - rel_type: implements
      spec_id: ARCH-18-001
- id: TB-12
  title: BT Test Harness
  specs:
  - id: TB-12-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      BT leaf and composite node tests MUST use the `BTTestScenario` harness in
      `test/core/behaviors/bt_harness.py`.
    rationale: >-
      `BTTestScenario` runs a node through the real `BTBridge` steps (setup,
      initialise, update and shutdown) with the acting actor's own DataLayer. A test
      that builds the blackboard by hand can give a node state that the real tree never
      gives it. Such a test can pass while the node fails in production.
    relationships:
    - rel_type: refines
      spec_id: TB-03-001
  - id: TB-12-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Each BT scenario test MUST run the BT tree exactly once per test case. Running the
      same tree instance multiple times in a single test produces accumulated blackboard
      state that masks isolation failures. Each test case MUST get a fresh tree instance.
    rationale: >-
      A tree instance keeps its blackboard state and node statuses after a run. A
      second run of the same instance starts from that state, so it can pass because of
      what the first run left. A fresh tree for each test case starts every run from
      the same state.
    relationships:
    - rel_type: refines
      spec_id: TB-12-001
  - id: TB-12-003
    priority: SHOULD
    kind: project
    statement: >-
      A BT integration test SHOULD complete within 5 seconds of honest work per
      test case on an idle machine.
    rationale: >-
      This is a design budget that keeps BT scenarios small, not a ceiling. The
      per-test timeout tiers (TB-14-001) sit well above it so that load on a CI
      runner or dev box never trips them on honest work, which means no timeout
      enforces this budget.
    relationships:
    - rel_type: refines
      spec_id: TB-12-001
  - id: TB-12-004
    priority: SHOULD
    kind: project
    statement: >-
      When a BT scenario's root `Sequence` fails, the test SHOULD assert the status of
      each leaf, not only the root status.
    rationale: >-
      A `Sequence` with `memory=True` reports `FAILURE` when any child fails, also when
      the children before it succeeded. A root status alone does not show which
      children succeeded and which failed, so a test can pass with the wrong child
      failing. Leaf statuses show where the tree stopped.
    relationships:
    - rel_type: refines
      spec_id: TB-12-001
  - id: TB-12-005
    priority: SHOULD
    kind: project
    statement: >-
      A BT test that exceeds the TB-12-003 budget SHOULD be redesigned (e.g.,
      reducing dataset size, mocking external I/O) rather than given its own longer
      `@pytest.mark.timeout`.
    rationale: >-
      A per-test override hides a slow scenario from the budget it breaks.
      Redesigning the test keeps the scenario small. A timeout tier that fires on
      honest work across many tests is a different problem, covered by TB-14-003.
    relationships:
    - rel_type: refines
      spec_id: TB-12-003
- id: TB-13
  title: Architecture Ratchet Corpus
  specs:
  - id: TB-13-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    lint_suppress:
    - phantom_path_ref
    statement: >-
      All architecture ratchet tests in `test/architecture/` that scan the source tree
      MUST obtain file paths and source text from a shared module-level corpus helper
      (`test/architecture/_corpus.py`) rather than calling `pathlib.Path.rglob` or
      reading files directly.
    rationale: >-
      Each architecture test scans the source tree. If each test reads and parses the
      files itself, the suite pays that cost once per test, and the cost grows with
      each new test. `test/architecture/_corpus.py` reads the files once, when the
      module is imported, and every test uses that copy. Module import happens at
      collection, outside the per-test timeout (TB-14-001).
  - id: TB-13-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Architecture ratchet tests MUST apply a substring prefilter before calling
      `ast.parse()`.
    rationale: >-
      `ast.parse()` costs much more per file than a substring check. Most files cannot
      match a given architecture test, because they do not contain the module path or
      the name that the test looks for. A substring check first lets the test parse
      only the files that can match.
    relationships:
    - rel_type: refines
      spec_id: TB-13-001
  - id: TB-13-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    lint_suppress:
    - phantom_path_ref
    statement: >-
      No file in `test/architecture/` MAY call `ast.parse()` or `pathlib.Path.rglob`
      directly. A meta-ratchet in `test/architecture/test_ratchet_hygiene.py` MUST
      fail when any sibling file contains a bare `ast.parse(` or `.rglob(` call
      outside of `_corpus.py`.
    rationale: >-
      Without a check, a new architecture test can read or parse files on its own and
      bring back the cost that the shared corpus removes.
      `test/architecture/test_ratchet_hygiene.py` fails on a bare `ast.parse(` or
      `.rglob(` in any file of the directory except `_corpus.py`. It searches the
      source text for those strings and parses nothing, so it obeys its own rule.
    relationships:
    - rel_type: refines
      spec_id: TB-13-001
  - id: TB-13-004
    priority: SHOULD
    kind: project
    statement: >-
      Each architecture ratchet test SHOULD complete in under 0.5 seconds.
    rationale: >-
      Architecture tests scan the whole source tree, and the unit suite runs them on
      every run, so a slow one adds its cost to each run. The shared corpus (TB-13-001)
      and the substring check (TB-13-002) make the budget reachable. The per-test
      timeout (TB-14-001) is much higher and does not enforce this budget.
  - id: TB-13-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A test that relies on shared global state MUST reset that state or carry an
      `xdist_group` mark shared with the tests that change it. Shared global state
      includes the `py_trees` blackboard and module-level singletons.
    rationale: >-
      `pytest-xdist` runs tests on several workers, in an order that changes between
      runs. A test that depends on global state that another test changed then fails at
      random (TB-06-006). A reset, such as the autouse fixture in `test/conftest.py`
      that clears the `py_trees` blackboard, removes the dependency. An `xdist_group`
      mark, which `--dist loadgroup` obeys, keeps tests that must share state on one
      worker.
    relationships:
    - rel_type: refines
      spec_id: TB-06-001
  - id: TB-13-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A file that does not contain the target fragment string as a plain substring
      MUST be skipped entirely by architecture ratchet tests.
    rationale: >-
      Skipping files without a matching substring avoids the ~1 ms per-file
      `ast.parse()` cost for files that cannot match the ratchet pattern.
    relationships:
    - rel_type: refines
      spec_id: TB-13-002
  - id: TB-13-008
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: >-
      Architecture ratchet tests MUST NOT call `ast.parse()` on files that do not
      contain the target fragment string as a plain substring.
    rationale: >-
      `ast.parse()` is the dominant per-file cost (~1 ms each); calling it on
      non-matching files wastes CI time proportional to corpus size.
    relationships:
    - rel_type: refines
      spec_id: TB-13-002
- id: TB-14
  title: Test Run Timeouts
  specs:
  - id: TB-14-001
    priority: MUST
    kind: project
    statement: >-
      Every test MUST run under a per-test `pytest-timeout` ceiling configured in
      `pyproject.toml`, with a wider tier applied at collection time to every
      `integration`-marked test. A test's own `@pytest.mark.timeout` MUST override
      the tier.
    rationale: >-
      A ceiling turns a hung test into a named failure. Integration tests do more
      honest work under a wider spread of load, so one ceiling for both is either
      too tight for one or too loose for the other. The tier depends on the
      `integration` marker that directory hooks add, so it is applied after them.
    verification: >-
      `test/test_integration_timeout_tier.py` checks the resolved timeout of each
      item in a real collection of `test/demo/` and in a synthetic session.
  - id: TB-14-002
    priority: MUST
    kind: project
    statement: >-
      A per-test timeout trip MUST fail only the test that tripped it. The session
      MUST go on with the remaining tests, and its summary MUST name every failure.
    rationale: >-
      A trip that ends the process loses the names of failures already recorded and
      never runs the tests after it, so a red run gives no signal. Under
      `pytest-xdist` the ended process is a worker, which TB-14-004 must then
      handle. The `signal` timeout method meets this; the `thread` method does not.
    verification: >-
      `test/test_integration_timeout_tier.py` runs a hanging test before a failing
      and a passing one under the configured `timeout_method`, and checks that a
      trip leaves the BT global lock free.
    relationships:
    - rel_type: refines
      spec_id: TB-14-001
  - id: TB-14-003
    priority: SHOULD
    kind: project
    statement: >-
      When a timeout tier fires on honest work rather than on a hang, the tier
      SHOULD be raised, rather than each affected test given its own
      `@pytest.mark.timeout` or recorded as flaky.
    rationale: >-
      A ceiling is a hang detector, not a performance budget. Contention on CI
      runners and loaded dev boxes inflates honest tests far past their idle cost,
      and a too-tight tier reads as flakiness that is re-diagnosed again and again.
    relationships:
    - rel_type: refines
      spec_id: TB-14-001
  - id: TB-14-004
    priority: MUST
    kind: project
    statement: >-
      A `pytest-xdist` run MUST fail, and name the test the worker was running,
      when a worker process dies. It MUST NOT wait for a replacement worker to
      finish the dead worker's tests.
    rationale: >-
      Under `--dist loadgroup` xdist re-queues a dead worker's finished work units
      as well as its unfinished ones, and a replacement worker handed a unit with
      nothing to run never reports, so the run waits forever.
      `--max-worker-restart=0` in `addopts` stops the replacement.
    verification: >-
      `test/test_xdist_worker_crash.py` runs a session with the repo's `addopts`
      in which one test calls `os._exit`, and checks that it fails promptly.
  - id: TB-14-005
    priority: MUST
    kind: project
    statement: >-
      Every local gate command written for agents, and the CI test job, MUST run
      under a wall-clock ceiling, so that a hang no per-test timeout can reach ends
      the run with a known exit status.
    rationale: >-
      A signal-based per-test timeout cannot interrupt a C call that holds the GIL,
      and a stuck xdist controller runs no test at all. Without an outer ceiling
      such a run waits until the agent's tool timeout or GitHub's job default.
      Agents run in the Linux devcontainer. Human how-to pages under
      `docs/developer/` keep the bare command, because stock macOS has no
      `timeout`.
    verification: >-
      `test/metadata/test_targeted_tests.py` checks that the printed gate command
      starts with `GATE_CEILING`. `test/metadata/test_gate_ceiling.py` checks every
      redirected pytest gate in agent-facing files for the ceiling, and the CI test
      job for `timeout-minutes`.
- id: TB-15
  title: Test Starting Points on the Scenario Tree
  specs:
  - id: TB-15-001
    priority: MUST
    kind: project
    statement: >-
      A multi-actor integration test MUST start from a named starting point, a
      declared step on a demo scenario path.
    rationale: >-
      Sibling tests that replay the same steps to reach their starting state pay
      for those steps again and test them again. A run per commit on hundreds of
      pull requests a week makes that cost real. One tree for demos and tests
      means each case state is defined once.
    verification: >-
      A guard test collects every test that uses a multi-actor network and fails
      on any test that obtains its network other than by loading a named
      starting point.
    relationships:
    - rel_type: depends_on
      spec_id: DEMOCI-11-014
    - rel_type: depends_on
      spec_id: DEMOCI-11-017
  - id: TB-15-002
    priority: MUST
    kind: project
    statement: >-
      The test harness MUST run the steps that reach a named starting point once
      per test session, when it builds that point. Under parallel test workers, a
      session is one worker's run.
    rationale: >-
      A test then pays only for its own acts. The test that takes a step from one
      starting point to the next is the one test that exercises that step.
    verification: >-
      A harness test counts the tree runs while two tests load one starting point,
      and checks the point's steps ran once.
    relationships:
    - rel_type: refines
      spec_id: TB-15-001
  - id: TB-15-003
    priority: MUST
    kind: project
    statement: >-
      The test harness MUST build each named starting point with the seeded id
      source and clock that the scenario recordings use.
    rationale: >-
      Every copy is then identical on every run. A copy whose ids or timestamps
      vary between runs makes the tests that load it nondeterministic
      (TB-06-006). Sharing the recordings' seeding keeps a starting point and the
      recording of the same step comparable.
    verification: >-
      A harness test builds one starting point twice and checks that the two copies
      hold the same records, ids and timestamps included.
    relationships:
    - rel_type: refines
      spec_id: TB-15-001
  - id: TB-15-004
    priority: MUST
    kind: project
    statement: >-
      The ledger rebuild check MUST prove a named starting point rebuilds from
      its ledger once, when the point is built.
    rationale: >-
      Replaying the starting point's whole ledger after every test that loads it
      re-checks steps already checked.
    verification: >-
      A harness test counts the rebuild replays of a starting point loaded by two
      tests, and checks it was replayed once.
    relationships:
    - rel_type: refines
      spec_id: TB-15-002
  - id: TB-15-005
    priority: MUST
    kind: project
    statement: >-
      For a test that loads a named starting point, the ledger rebuild check MUST
      replay only the test's own entries. It replays them onto the point's rebuilt
      store.
    rationale: >-
      The point's own entries were proven once (TB-15-004), so replaying only the
      test's entries on top of the rebuilt point still covers the whole chain.
    verification: >-
      A harness test commits one entry after a loaded starting point and checks the
      rebuild check replays one entry, not the point's whole ledger.
    relationships:
    - rel_type: depends_on
      spec_id: TB-15-004
  - id: TB-15-006
    priority: SHOULD
    kind: project
    statement: >-
      A test of a state no scenario path reaches SHOULD load the nearest named
      starting point and then apply its own change.
    rationale: >-
      A diverged replica or a forced commit failure is not a story, so no
      declared step reaches it. Building a whole case outside the ledger for it
      repeats setup the tree already provides.
    relationships:
    - rel_type: refines
      spec_id: TB-15-001
  - id: TB-15-007
    priority: MUST
    kind: project
    statement: >-
      A test that loads a named starting point MUST get its own copy of each
      actor's store at that point.
    rationale: >-
      A shared store would let one test's writes change what another test starts
      from. Copies keep each test independent (TB-06-001, TB-06-003).
    verification: >-
      A harness test loads one starting point into two tests and checks that a write
      in one is absent from the other.
    relationships:
    - rel_type: refines
      spec_id: TB-15-001
