id: TB
title: Testability
description: >-
  The Vultron inbox handler must be thoroughly testable at unit, integration, and system levels.
  Testability enables confidence in correctness, supports refactoring, and documents expected
  behavior.
version: 1.0.0
scope:
- prototype
- production
tags:
- testing
groups:
- id: TB-01
  title: Testing Framework
  specs:
  - id: TB-01-001
    priority: MUST
    kind: project
    statement: The system MUST use pytest as the testing framework
  - id: TB-01-002
    priority: MUST
    kind: project
    statement: Test configuration MUST be defined in `pyproject.toml`
- id: TB-02
  title: Test Coverage
  specs:
  - id: TB-02-001
    priority: MUST
    kind: project
    statement: Unit tests MUST achieve 80%+ line coverage
  - id: TB-02-002
    priority: MUST
    kind: project
    statement: Critical paths MUST achieve 100% line coverage
- id: TB-03
  title: Integration Test Coverage
  specs:
  - id: TB-03-001
    priority: MUST
    kind: protocol
    statement: Integration tests MUST cover inbox POST → handler invocation flow
    verification: Integration tests confirm that a `POST /inbox/` with a valid AS2 activity triggers the correct handler
      invocation and produces the expected DataLayer side effects.
    lint_suppress:
    - missing_story_reference
  - id: TB-03-002
    priority: MUST
    kind: protocol
    statement: Integration tests MUST cover validation → error response flow
    verification: Integration tests confirm that a `POST /inbox/` with a malformed or invalid payload returns a
      structured error response (HTTP 400 or 422) rather than an unhandled server error.
    lint_suppress:
    - missing_story_reference
  - id: TB-03-003
    priority: MUST
    kind: protocol
    statement: Integration tests MUST verify async processing behavior
    verification: Integration tests confirm that inbox processing returns HTTP 202 for activities dispatched to background
      processing, and that the resulting DataLayer state is updated after the handler completes asynchronously.
    lint_suppress:
    - missing_story_reference
- id: TB-04
  title: Test Organization
  specs:
  - id: TB-04-001
    priority: MUST
    kind: project
    statement: Test structure MUST mirror source code structure
  - id: TB-04-002
    priority: MUST
    kind: project
    statement: Test files MUST use descriptive names starting with `test_`
  - id: TB-04-003
    priority: MUST
    kind: project
    statement: >-
      Unit and integration tests MUST be in separate directories or marked with pytest markers
- id: TB-05
  title: Test Data Management
  specs:
  - id: TB-05-001
    priority: MUST
    kind: project
    statement: The system MUST provide reusable test fixtures
  - id: TB-05-002
    priority: MUST
    kind: project
    statement: Test data MUST be generated via factories, not hardcoded
  - id: TB-05-003
    priority: MUST
    kind: project
    statement: Test fixtures MUST be defined in `conftest.py` files
  - id: TB-05-004
    priority: MUST
    kind: project
    statement: Tests MUST use proper domain objects, not simplified mock data
    rationale: >-
      Tests with string IDs can pass while production code fails; proper objects exercise
      actual validation and serialization
  - id: TB-05-005
    priority: MUST
    kind: project
    statement: Test semantic types MUST match the activity structure being tested
    rationale: >-
      Semantic type validation is enforced by the `USE_CASE_MAP` key lookup at dispatch time;
      mismatched tests bypass actual code paths
- id: TB-06
  title: Test Isolation
  specs:
  - id: TB-06-001
    priority: MUST
    kind: project
    statement: Tests MUST be independent and runnable in any order
  - id: TB-06-002
    priority: MUST
    kind: project
    statement: Tests MUST use test database or mocked database
  - id: TB-06-003
    priority: MUST
    kind: project
    statement: Test state MUST be reset between tests
  - id: TB-06-004
    priority: MUST
    kind: project
    statement: Test fixtures MUST clean up created data after test completion
    rationale: Prevents test database bloat and ensures isolation
  - id: TB-06-005
    priority: MUST
    kind: project
    statement: Behavior Tree tests MUST clear the py_trees blackboard between tests
    rationale: >-
      py_trees blackboard is a global singleton; without clearing, state from one test leaks
      into subsequent tests
  - id: TB-06-006
    priority: MUST
    kind: project
    statement: All tests MUST be deterministic and produce the same result on every run
    rationale: >-
      Flaky tests erode confidence in the test suite, mask real failures, and slow development.
      A flaky test MUST be fixed or removed; it MUST NOT be left in the suite.
  - id: TB-06-007
    priority: MUST
    kind: project
    statement: >-
      Integration tests that exercise multi-actor message flows MUST give each simulated
      actor its own isolated `DataLayer` instance. Tests that share a single `DataLayer`
      across multiple actors bypass the outbox→inbox delivery path and test in-memory
      state sharing instead of protocol communication.
    rationale: >-
      The outbox→inbox delivery path is a critical protocol boundary. A shared DataLayer
      removes it: actor A's outbox write is immediately visible to actor B without going
      through any delivery mechanism, making the test a unit test of shared state rather
      than an integration test of the protocol.
    relationships:
    - rel_type: refines
      spec_id: TB-06-001
  - id: TB-06-008
    priority: MUST
    kind: project
    statement: >-
      BT factories that have probabilistic defaults (e.g., always-succeed or always-fail
      stubs for nodes backed by configurable policies) MUST expose a module-level
      deterministic factory constant for use in tests. Tests MUST use the deterministic
      factory, not the production random-policy factory, to avoid stochastic test failures.
    rationale: >-
      A test that calls a production BT factory configured with a probability distribution
      may pass or fail depending on random outcomes. The deterministic factory ensures
      the test exercises a specific code path every time. Convention: name the constant
      `_always_succeed_factory` or `_always_fail_factory` at module level.
    relationships:
    - rel_type: refines
      spec_id: TB-06-006
- id: TB-07
  title: Mocking and Stubbing
  specs:
  - id: TB-07-001
    priority: MUST
    kind: project
    statement: External services MUST be mocked in unit tests
  - id: TB-07-002
    priority: MUST
    kind: project
    statement: Database access MUST be stubbed in unit tests
  - id: TB-07-003
    priority: MAY
    kind: project
    statement: Integration tests MAY use real database with test data
- id: TB-08
  title: Test Documentation
  specs:
  - id: TB-08-001
    priority: MUST
    kind: project
    statement: Tests MUST use descriptive names explaining what is tested
  - id: TB-08-002
    priority: SHOULD
    kind: project
    statement: Complex tests SHOULD include docstrings
  - id: TB-08-003
    priority: SHOULD
    kind: project
    statement: Tests SHOULD serve as usage examples
- id: TB-09
  title: Test Maintainability
  specs:
  - id: TB-09-001
    priority: MUST
    kind: project
    statement: >-
      Each test function MUST exercise a single scenario. Test bodies MUST NOT contain
      conditional branching logic (if/else). Exception-assertion patterns using
      pytest.raises as a context manager are permitted; bare try/except blocks that
      catch and suppress unexpected errors are not.
  - id: TB-09-002
    priority: SHOULD
    kind: project
    statement: Test duplication SHOULD be avoided via fixtures and helpers
  - id: TB-09-003
    priority: MUST
    kind: project
    statement: Tests MUST be refactored along with production code
- id: TB-11
  title: Test Infrastructure Consistency
  specs:
  - id: TB-11-001
    priority: MUST
    kind: project
    statement: >-
      When a pytest mark is renamed or added, ALL of the following MUST be
      updated in the same changeset: (a) the `markers` list in `pyproject.toml`,
      (b) any `.github/workflows/` YAML files that reference the mark by name
      (e.g., `-m "mark_name"` in `pytest` invocations), and (c) any test files
      that apply the mark.
    rationale: >-
      A mark renamed in test files but not in a workflow YAML causes `pytest` to
      select 0 tests matching the old name and exit with code 5 (no tests
      collected). CI treats a non-zero exit code as a failure, but the failure
      message ("no tests ran") is easily misread as an environment issue rather
      than a naming mismatch. Issue #934 observed this after renaming
      `case_log_invariants` to `case_ledger_invariants` across test files while
      leaving the workflow YAML referencing the old name.
    verification: >-
      After any pytest mark rename: grep `.github/workflows/` for the old mark
      name and confirm zero matches; confirm `pyproject.toml` registers the new
      name; run `pytest -m "new_mark_name" --collect-only` and confirm non-zero
      test collection.
    relationships:
    - rel_type: refines
      spec_id: TB-07-001
      note: Mark consistency between source, config, and CI is part of test
        infrastructure correctness
- id: TB-10
  title: Architecture Boundary Tests
  specs:
  - id: TB-10-001
    priority: SHOULD
    kind: process
    statement: >-
      Once the `core` and `wire` packages are fully separated (see `specs/architecture.yaml`
      and `archived_notes/architecture-review.md`), architecture boundary tests SHOULD be
      added to enforce layer separation rules
    rationale: >-
      Automated boundary tests catch accidental cross-layer imports earlier than code review.
    scope:
    - production
  - id: TB-10-002
    priority: MUST
    kind: process
    statement: >-
      Architecture ratchet tests MUST use bidirectional equality: `assert actual_violations
      == KNOWN_VIOLATIONS`. A subset check (`assert actual ⊆ KNOWN`) is prohibited because
      it allows the violation set to grow without failing the test. When a violation is
      resolved, its entry MUST be removed from `KNOWN_VIOLATIONS` in the same commit.
    rationale: >-
      See ARCH-18-001 for the architecture-level rule. This entry specifies the test
      implementation obligation.
    relationships:
    - rel_type: implements
      spec_id: ARCH-18-001
- id: TB-12
  title: BT Test Harness
  specs:
  - id: TB-12-001
    priority: MUST
    kind: project
    statement: >-
      BT leaf and composite node tests MUST use the `BTTestScenario` deep-module test
      harness. The `setup_node_blackboard()` helper is an anti-pattern for integration
      tests of BT nodes: it creates shallow, manually wired blackboard state that
      diverges from the tree structure the node expects in production.
    rationale: >-
      `BTTestScenario` instantiates the full tree (or a representative subtree) and
      exercises nodes in their actual execution context, catching structural assumptions
      (e.g., parent Sequence providing the blackboard namespace) that `setup_node_blackboard()`
      tests cannot detect.
    relationships:
    - rel_type: refines
      spec_id: TB-03-001
  - id: TB-12-002
    priority: MUST
    kind: project
    statement: >-
      Each BT scenario test MUST run the BT tree exactly once per test case. Running the
      same tree instance multiple times in a single test produces accumulated blackboard
      state that masks isolation failures. Each test case MUST get a fresh tree instance.
    relationships:
    - rel_type: refines
      spec_id: TB-12-001
  - id: TB-12-003
    priority: MUST
    kind: project
    statement: BT integration tests MUST complete within 5 seconds per test case.
    relationships:
    - rel_type: refines
      spec_id: TB-12-001
  - id: TB-12-004
    priority: SHOULD
    kind: project
    statement: >-
      When a BT test scenario produces a `SUBFAILED` status (partial-success in a
      `memory=True` Sequence), the test SHOULD explicitly assert the expected leaf
      statuses rather than asserting only the root status. `SUBFAILED` on the root
      masks which children succeeded and which failed.
    relationships:
    - rel_type: refines
      spec_id: TB-12-001
  - id: TB-12-005
    priority: MUST
    kind: project
    statement: >-
      Tests that exceed the 5-second limit MUST be redesigned (e.g., reducing dataset
      size, mocking external I/O) rather than raising the timeout.
    rationale: >-
      Raising the timeout papers over performance regressions rather than fixing them;
      redesigning the test preserves the 5-second budget.
    relationships:
    - rel_type: refines
      spec_id: TB-12-003
  - id: TB-12-006
    priority: MUST
    kind: project
    statement: >-
      The `pytest-timeout` `timeout = 5` configuration MUST apply to all BT tests.
    rationale: >-
      A blanket timeout prevents runaway tests from blocking CI without requiring
      per-test annotation.
    relationships:
    - rel_type: refines
      spec_id: TB-12-003
- id: TB-13
  title: Architecture Ratchet Corpus
  specs:
  - id: TB-13-001
    priority: MUST
    kind: project
    lint_suppress:
    - phantom_path_ref
    statement: >-
      All architecture ratchet tests in `test/architecture/` that scan the source tree
      MUST obtain file paths and source text from a shared module-level corpus helper
      (`test/architecture/_corpus.py`) rather than calling `pathlib.Path.rglob` or
      reading files directly.
    rationale: >-
      Scanning 1 179 Python files at module-import time (exempt from the 5 s per-test
      timeout) costs ~1 s for source reads and populates an 18 MB string cache. All
      subsequent ratchets share those bytes for free. Direct `rglob` calls inside test
      functions compete for disk I/O inside the timeout window and accumulate as more
      ratchets are added. Source: CONCERN-2020.
  - id: TB-13-002
    priority: MUST
    kind: project
    statement: >-
      Architecture ratchet tests MUST apply a substring prefilter before calling
      `ast.parse()`.
    rationale: >-
      `ast.parse()` is the dominant per-file cost (~1 ms each). A plain `in` substring
      check is ~1 µs. For import-boundary ratchets the prefilter string is the module
      path being guarded (e.g., `"vultron.wire.as2.vocab.activities"`); for
      attribute-name ratchets it is the attribute string (e.g., `"ASGITransport"`).
      Measured reduction: `test_vocab_activities_boundary` 3.8 s → 0.04 s.
      Source: CONCERN-2020.
    relationships:
    - rel_type: refines
      spec_id: TB-13-001
  - id: TB-13-003
    priority: MUST
    kind: project
    lint_suppress:
    - phantom_path_ref
    statement: >-
      No file in `test/architecture/` MAY call `ast.parse()` or `pathlib.Path.rglob`
      directly. A meta-ratchet in `test/architecture/test_ratchet_hygiene.py` MUST
      fail when any sibling file contains a bare `ast.parse(` or `.rglob(` call
      outside of `_corpus.py`.
    rationale: >-
      The meta-ratchet makes the shared-corpus pattern self-enforcing. Without it, the
      next ratchet author can inadvertently reintroduce the pattern the corpus was
      designed to eliminate, and the problem silently recurs with each new ratchet.
      The hygiene check itself MUST use plain substring scanning on source strings
      (via `_corpus.py`) rather than calling `ast.parse()` directly — otherwise it
      would violate the rule it enforces.
      Source: CONCERN-2020.
    relationships:
    - rel_type: refines
      spec_id: TB-13-001
  - id: TB-13-004
    priority: SHOULD
    kind: project
    statement: >-
      The full pytest suite (all markers, `uv run pytest -m ""`) SHOULD complete in
      under 90 seconds on the reference CI runner. Individual architecture ratchet
      tests SHOULD each complete in under 0.5 seconds.
    rationale: >-
      The full-suite wall-clock is the metric that matters for developer feedback
      loops and CI cost. Per-test timeouts are a safety net, not a performance budget.
      The 90 s target is aspirational — well below the current ~170 s baseline and
      achievable only after the shared corpus + xdist parallelisation work lands. It
      leaves headroom for future test additions above any fully-optimised baseline.
      Source: CONCERN-2020.
  - id: TB-13-005
    priority: SHOULD
    kind: project
    statement: >-
      The test suite SHOULD be validated for `pytest-xdist` (`-n auto`) compatibility
      before parallel execution is enabled in CI.
    rationale: >-
      `pytest-xdist` is already a declared dependency. Enabling `-n auto` on a
      fully compatible suite can reduce full-suite wall-clock by 50–70% on multi-core
      runners.
      Source: CONCERN-2020.
  - id: TB-13-006
    priority: MUST
    kind: project
    statement: >-
      Tests that rely on shared global state (e.g., `py_trees` blackboard,
      module-level singletons) MUST be identified and either isolated or marked
      `xdist`-unsafe before `pytest-xdist` parallel execution is enabled in CI.
    rationale: >-
      Unguarded shared state causes non-deterministic failures under xdist.
      Source: CONCERN-2020.
    relationships:
    - rel_type: refines
      spec_id: TB-13-005
  - id: TB-13-007
    priority: MUST
    kind: project
    statement: >-
      A file that does not contain the target fragment string as a plain substring
      MUST be skipped entirely by architecture ratchet tests.
    rationale: >-
      Skipping files without a matching substring avoids the ~1 ms per-file
      `ast.parse()` cost for files that cannot match the ratchet pattern.
    relationships:
    - rel_type: refines
      spec_id: TB-13-002
  - id: TB-13-008
    priority: MUST_NOT
    kind: project
    statement: >-
      Architecture ratchet tests MUST NOT call `ast.parse()` on files that do not
      contain the target fragment string as a plain substring.
    rationale: >-
      `ast.parse()` is the dominant per-file cost (~1 ms each); calling it on
      non-matching files wastes CI time proportional to corpus size.
    relationships:
    - rel_type: refines
      spec_id: TB-13-002
