id: VM
title: Vocabulary Model
description: 'Requirements governing how ActivityStreams 2.0 vocabulary types are defined, registered, configured, and deserialized
  in the Vultron wire layer. The vocabulary model is the foundation of the inbound pipeline: every activity must be deserialized
  into a known vocabulary type before semantic extraction can assign it a domain meaning.'
scope:
- prototype
- production
tags:
- wire-format
groups:
- id: VM-01
  title: Vocabulary Registration
  specs:
  - id: VM-01-001
    priority: MUST
    kind: project
    statement: Every concrete wire-layer AS2 class (object, activity, or link) MUST be registered in the shared `VOCABULARY`
      registry automatically at class-definition time
    rationale: >-
      The parser can resolve a `type` value only to a class that a registry holds. A
      class that a developer must register by hand is unknown to the parser when that
      step is forgotten, and an inbound activity of that type is refused. Registration
      when the class is defined removes that manual step, so a new class cannot be
      defined and still be missing from the registry.
    verification: Unit tests in `test/wire/as2/vocab/base/test_registry.py` confirm that a concrete `as_Object` subclass
      with a `Literal` `type_` annotation is present in `VOCABULARY` immediately after class definition, with no explicit
      registration call.
  - id: VM-01-003
    priority: MUST
    kind: project
    statement: New vocabulary types MUST be importable at startup without explicit registration calls in application code
    rationale: >-
      Registration happens when a module is imported (VM-01-005). A vocabulary module
      that no code path imports registers nothing, and the parser then refuses its
      types. Importing `vultron.wire.as2.vocab.objects` or
      `vultron.wire.as2.vocab.activities` imports every module in that package, so the
      set of known types does not depend on which single modules the application
      imported first.
    verification: >-
      Unit tests in `test/wire/as2/vocab/base/test_registry_completeness.py` confirm
      that importing the `vultron.wire.as2.vocab.objects` and
      `vultron.wire.as2.vocab.activities` packages imports every module in each package
      and populates all expected vocabulary types in `VOCABULARY`, with no explicit
      registration call in application code.
  - id: VM-01-004
    priority: MUST
    kind: project
    statement: >-
      The `VOCABULARY` registry MUST map each wire class from a key that is its full
      wire class name, such as `as_VultronPerson`.
    rationale: >-
      The two registries answer different questions, so they carry different key forms:
      `VOCABULARY` answers "which class is named this?", `WIRE_TYPE_MAP` answers "which class
      does this wire `type` value deserialize to?" (VM-01-008). The `as_` prefix is never
      part of an AS2 `type` value, so nothing external depends on this key form
      (ARCH-23-003).
    verification: >-
      `test/architecture/test_vocab_registry_keys.py` asserts every `VOCABULARY` key equals its
      registered class's `__name__`, behind the same population guard the `WIRE_TYPE_MAP` ratchets
      use.
    adr:
    - ADR-0082
  - id: VM-01-016
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT read a `VOCABULARY` key as an AS2 `type` value.
    rationale: >-
      A `VOCABULARY` key is a Python class name, which no peer emits as a `type`. A
      lookup that accepts one lets an inbound `"type": "as_Activity"` resolve to a
      class, so a message no AS2 sender could write is parsed. A class's `type_`
      annotation does not refuse it for every class: `as_Activity.type_` is a bare
      `str`.
    note: >-
      Resolving an inbound `"type": "..."` value is `WIRE_TYPE_MAP`'s job (VM-01-008),
      and `find_in_vocabulary` consults no other wire registry.
    verification: >-
      `test/wire/as2/test_vocabulary_key_is_not_a_wire_type.py` tries every
      `VOCABULARY` key as the `type` of an inbound activity and as a type lookup, and
      asserts each one is refused.
    adr:
    - ADR-0082
    relationships:
    - rel_type: derives_from
      spec_id: VM-01-004
  - id: VM-01-009
    priority: MUST
    kind: project
    statement: >-
      `VOCABULARY` keys MUST be disjoint from core vocabulary keys (ARCH-23-002).
    rationale: >-
      The class-name form is what keeps these keys disjoint from `CORE_VOCABULARY`, so
      no wire class shadows a core type.
    verification: >-
      A test in `test/wire/as2/vocab/base/test_registry.py` asserts
      `set(VOCABULARY) & set(CORE_VOCABULARY) == set()` once both registries are fully
      populated (ARCH-23-002).
    adr:
    - ADR-0082
    relationships:
    - rel_type: refines
      spec_id: ARCH-23-002
  - id: VM-01-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Vocabulary type registration MUST happen automatically at package import time,
      with no explicit per-type registration call at any call site.
    rationale: >-
      A registration call that each call site must make is a step that a call site can
      omit. When it is omitted, the type is unknown only on that path, and the defect
      shows only for the activities that take it. Registration as an import side effect
      makes the registry the same for every caller.
    relationships:
    - rel_type: refines
      spec_id: VM-01-001
  - id: VM-01-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'A `VocabNamespace` enum (values: `AS`, `VULTRON`) MUST be defined in `vultron/wire/as2/vocab/base/enums.py`
      and used to annotate the provenance of each vocabulary class'
    rationale: >-
      The namespace tag tells which vocabulary a class belongs to: ActivityStreams or
      Vultron. VM-10-002 states the default `@context` of a class in terms of the tag,
      and the generator of the JSON-LD context document reads the tag to choose the
      classes it lists. One enum in one module gives those readers one value to compare,
      instead of a string that each reader can spell differently.
  - id: VM-01-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST check registration completeness against the wire `type` that a
      class presents, not against the module it lives in. A class's presented `type` is
      its `type_` field default, or its class name without any `as_` prefix when that
      default is `None`.
    rationale: >-
      A registration check that looks at modules can skip a module for the same reason
      that the module failed to register. A module with no own `type_` annotation looks
      like a module of aliases or abstract classes, and that missing annotation is the
      defect the check looks for. A check on the `type` value that each class presents
      does not depend on how a module is written, so it finds a class that presents a
      distinct wire `type` but registered nothing.
    note: >-
      The check reads the field default and not an instance, because a class with
      required fields cannot be built without arguments.
    verification: >-
      A test enumerates every `as_Base` subclass, computes the `type` each presents, and
      asserts that a class presenting its own class-name-derived value resolves to itself
      through the wire lookup or appears in the declared exemption set with a stated reason.
    relationships:
    - rel_type: verifies
      spec_id: VM-01-001
  - id: VM-01-010
    priority: MUST
    kind: project
    statement: >-
      A test MUST assert that each `as_Base` subclass whose presented `type` equals its
      own class-name-derived value is reachable in a wire registry under that value.
    rationale: >-
      A class that presents a distinct wire `type` but registered nothing cannot be
      reached by an inbound payload that carries the value it emits.
    verification: >-
      `test_every_class_presenting_its_own_type_is_reachable_under_it` in
      `test/wire/as2/vocab/base/test_registry.py` walks every `as_Base` subclass and
      asserts that each one presenting its own class-name-derived `type` resolves to
      itself through `WIRE_TYPE_MAP`, or is in the exemption set.
    relationships:
    - rel_type: implements
      spec_id: VM-01-007
  - id: VM-01-011
    priority: MUST
    kind: project
    statement: >-
      The test of VM-01-010 MUST hold its exceptions in a declared exemption set that
      names, for each member, the requirement or reason that exempts it.
    rationale: >-
      Each exemption names its reason, so a reviewer can see why a class is exempt.
      Abstract roots such as `as_Object` and `as_VultronObject` present their own name
      and are unregistered by design, so they are members of the exemption set.
    verification: >-
      `_UNREGISTERED_WIRE_TYPES` in `test/wire/as2/vocab/base/test_registry.py` maps
      each exempt class to its reason, and `test_every_exemption_is_live` asserts that
      each member still needs its exemption.
    relationships:
    - rel_type: extends
      spec_id: VM-01-010
  - id: VM-01-008
    priority: MUST
    kind: project
    statement: >-
      The `WIRE_TYPE_MAP` registry MUST key each class by the wire `type` value that it
      emits. That value is its declared `type_` default or, absent one, its class name
      without the `as_` prefix, as VM-03-001 assigns at construction.
    rationale: >-
      A key that is no object's `type` value cannot be reached from the wire. A key
      derived from the emitted value is the value an inbound payload carries.
    verification: >-
      `test/architecture/test_vocab_registry_keys.py` forces full registration, then asserts every
      `WIRE_TYPE_MAP` key equals `wire_type_value()` of its registered class, and that every
      declared wire `type` value resolves to some registered class. A population guard precedes
      them, since registration is an import side effect (VM-01-005) and the assertions would
      otherwise pass vacuously.
    relationships:
    - rel_type: uses_definition
      spec_id: VM-03-001
      note: The class-name fallback must match the value `set_type_from_class_name` assigns.
  - id: VM-01-012
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT register a class in `WIRE_TYPE_MAP` under its class name
      when that name is not the `type` value it emits.
    rationale: >-
      A class-name key lets a caller with a class name resolve a wire class by a
      coincidence of names, which ARCH-23-002 forbids: a class-name key such as
      `VultronPerson` is also the name of a core type.
    verification: >-
      `test_every_wire_type_map_key_is_its_class_wire_type_value` in
      `test/architecture/test_vocab_registry_keys.py` asserts every `WIRE_TYPE_MAP` key
      equals `wire_type_value()` of its registered class.
    relationships:
    - rel_type: extends
      spec_id: VM-01-008
  - id: VM-01-013
    priority: MUST
    kind: project
    statement: >-
      Exactly one class MUST own a given `type` value in `WIRE_TYPE_MAP`. The sole
      exception is a sanctioned shadow, which the verifying ratchet enumerates.
    rationale: >-
      One owner for each `type` value gives the inbound lookup one answer for each
      value.
    note: >-
      The sanctioned shadows are the five `as_Vultron*` actor subtypes. They deliberately
      replace their base AS2 actor classes as the owner of `Person`, `Organization`,
      `Service`, `Application` and `Group`, so an inbound actor keeps its Vultron
      extension fields.
    verification: >-
      `test_no_unsanctioned_wire_type_collisions` in
      `test/architecture/test_vocab_registry_keys.py` asserts that no two registrable
      classes share a `type` value outside `_SANCTIONED_SHADOWS`, and that each
      sanctioned shadow owns its key.
    relationships:
    - rel_type: extends
      spec_id: VM-01-008
  - id: VM-01-014
    priority: MUST
    kind: project
    statement: >-
      A class that shares another class's `type` value MUST declare itself an alias with
      `_wire_type_alias = True`, unless it is a sanctioned shadow (VM-01-013).
    rationale: >-
      The alias flag is how a class that is not what its `type` value should
      deserialize to steps aside, so the owner of that value keeps the key.
    verification: >-
      `test_no_unsanctioned_wire_type_collisions` and
      `test_no_test_class_owns_a_wire_type_key` in
      `test/architecture/test_vocab_registry_keys.py` fail a class that shares a `type`
      value without the alias flag.
    relationships:
    - rel_type: implements
      spec_id: VM-01-013
  - id: VM-01-015
    priority: MUST_NOT
    kind: project
    statement: >-
      A class declared as an alias MUST NOT hold a `WIRE_TYPE_MAP` key. It is still
      listed in `VOCABULARY` under its class name (VM-01-004), but no wire `type`
      value resolves to it (VM-01-016).
    rationale: >-
      An alias is not what its `type` value deserializes to, so a key of its own would
      give the inbound lookup a second answer for that value.
    verification: >-
      `test_declared_aliases_do_not_own_a_registry_key` and
      `test_an_alias_declaration_keeps_the_class_out_of_the_registry` in
      `test/architecture/test_vocab_registry_keys.py` assert that no class declaring
      `_wire_type_alias` holds a key.
    relationships:
    - rel_type: uses_definition
      spec_id: VM-01-014
    see_also:
    - spec_id: VM-01-004
      reason: 'context for the reader'
    - spec_id: VM-01-016
      reason: 'context for the reader'
- id: VM-02
  title: Base Model Configuration
  specs:
  - id: VM-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Every wire-layer AS2 Pydantic model MUST inherit from `as_Base` a `model_config`
      that sets a camelCase alias generator, `validate_by_name` and
      `validate_by_alias`, and no strict mode.
    rationale: >-
      One inherited configuration makes every wire class read and write field names in
      the same forms: camelCase names on the wire (VM-07-002) and Python names in code.
      A class with its own configuration can send snake_case keys or refuse a field
      given by its Python name, and only the activities that use that class show the
      defect. Strict mode stays off because it would refuse lenient inbound data that
      the wire branch exists to accept, such as an ISO string for a datetime field.
    note: >-
      A class can inherit the configuration through an intermediate class, such as
      `as_Object`, that inherits from `as_Base`.
    relationships:
    - rel_type: refines
      spec_id: CS-14-001
  - id: VM-02-002
    priority: MUST
    kind: project
    statement: The `@context` field (`as_context`) MUST use explicit `validation_alias="@context"` and `serialization_alias="@context"`
      because `@` is not a valid Python identifier character and cannot be handled by the camelCase alias generator
    rationale: >-
      `@` cannot occur in a Python identifier, and the camelCase alias generator cannot
      produce `@context` from a field name. Without the explicit aliases, the field is
      sent as `context_`, and a receiver does not find the JSON-LD context that
      VM-10-001 requires a message to declare.
    verification: Unit test `test_as_base_context_alias_accepted` in `test/wire/as2/vocab/base/test_wire_base_hierarchy.py`
      confirms that `@context` is accepted via the explicit alias, and inspection of `vultron/wire/as2/vocab/base/base.py`
      confirms the `validation_alias` and `serialization_alias` declarations.
    relationships:
    - rel_type: extends
      spec_id: VM-02-001
  - id: VM-02-003
    priority: MUST
    kind: project
    statement: Wire-layer models MUST provide `to_json()`, `to_dict()`, and `from_json()` convenience methods that exclude
      `None` values and serialize using aliases by default
    rationale: >-
      When each caller chooses its own serialization options, the same object can give
      different JSON on different code paths, for example with `null` fields on one path
      and none on the other. Shared methods with the project defaults give one output
      for one object, and they keep these output rules in one place.
    verification: >-
      Unit tests in `test/wire/as2/vocab/test_vocab_case_examples.py` confirm that
      `to_json()` produces alias-keyed JSON with `None` fields excluded and that
      `from_json()` correctly round-trips the resulting string.
      `test_to_dict_emits_aliased_keys_without_none_values` and
      `test_to_dict_has_the_keys_to_json_emits` in
      `test/wire/as2/vocab/base/test_wire_base_hierarchy.py` confirm that `to_dict()`
      keys its output by the same aliases and omits `None` values.
- id: VM-03
  title: Type Auto-Inference
  specs:
  - id: VM-03-001
    priority: MUST
    kind: project
    statement: The `as_type` field on every concrete wire-layer class MUST be set automatically at construction time if not
      supplied by the caller
    rationale: >-
      A receiver selects the class for an inbound object by its `type` value, and the
      parser refuses an activity with no recognizable `type` (MV-01-001). If a sender
      had to set `type` by hand, an object built without it would be sent with no
      `type`, and the receiver would refuse it. Setting it at construction means that
      every object that this implementation sends carries a `type`.
    verification: Unit tests `test_as_base_type_set_from_class_name` and `test_as_object_type_set_from_class_name` in
      `test/wire/as2/vocab/base/test_wire_base_hierarchy.py` confirm that `type_` is populated from the stripped class
      name when no explicit value is provided to the constructor.
  - id: VM-03-002
    priority: MUST
    kind: project
    statement: >-
      A wire-layer class that presents its own class-name-derived AS2 `type` value MUST
      narrow `type_` to a `Literal[...]` of that value. A class that VM-01-011's
      exemption set names is exempt.
    rationale: >-
      Auto-registration treats an own `type_` annotation as the sign that a class is
      concrete, and it keys the entry on the class name (VM-01-004). VM-03-001 fills
      `type_` from the class name when a class inherits no default. So a class with
      neither an annotation nor an inherited default presents a distinct wire `type` but
      registers nothing, and the parser cannot resolve that `type` to a wire class. The
      annotation is then the one declaration of a distinct wire type, which VM-01-007
      checks.
    note: >-
      An exempt class is an abstract root such as `as_Object`, which must stay
      unregistered so an unresolved inline object is left to it.
    verification: >-
      A test asserts that a wire class presenting its own class-name-derived `type` value
      declares that value as a `Literal` — the per-class form of the hierarchy-wide
      invariant VM-01-007 verifies.
    relationships:
    - rel_type: extends
      spec_id: VM-03-001
    - rel_type: implements
      spec_id: VM-01-001
    - rel_type: uses_definition
      spec_id: VM-01-011
  - id: VM-03-004
    priority: MUST_NOT
    kind: project
    statement: >-
      A semantic alias that must not be listed in `VOCABULARY` under its own class
      name MUST NOT declare its own `type_` annotation.
    rationale: >-
      Any own `type_` declaration lists the class in `VOCABULARY` under its class
      name. The prohibition covers only aliases that must not be listed there. A class
      that shares another class's `type` but must stay listed declares
      `_wire_type_alias` instead (VM-01-014). A listing is not a lookup: no wire
      `type` value resolves through `VOCABULARY` (VM-01-016).
    note: >-
      Such an alias is the `_XxxActivity` pattern, which presents an ancestor's `type`.
    verification: >-
      A test asserts that an `_XxxActivity` alias declares no own `type_` annotation.
      `test_no_unsanctioned_wire_type_collisions` in
      `test/architecture/test_vocab_registry_keys.py` also fails an alias that declares
      one, since the declaration registers it under its ancestor's `type` value.
  - id: VM-03-003
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/wire/as2/vocab/base/test_registry.py::TestSetTypeFromClassName` confirms the
      class-name-derived type strips the `as_` prefix.
    statement: '`as_type` values MUST NOT start with `"as_"` in serialized wire output'
    rationale: >-
      The `as_` prefix marks a Python wire class name (ARCH-14-001). It is not part of
      any ActivityStreams or Vultron `type` value. Another implementation that gets
      `as_Note` finds no such type in either vocabulary and cannot read the object. The
      registry also keys `WIRE_TYPE_MAP` by the value without the prefix (VM-01-008).
    relationships:
    - rel_type: constrains
      spec_id: VM-03-001
- id: VM-04
  title: ID Generation
  specs:
  - id: VM-04-001
    priority: MUST
    kind: project
    statement: All wire-layer objects MUST have a globally unique `as_id` field set at construction time by `generate_new_id()`
      if not supplied
    rationale: >-
      Other objects refer to an object by its `id`, the DataLayer stores it under that
      `id`, and receivers use it to detect a repeated delivery. An object without an
      `id` cannot be referenced, stored or checked for a repeat. A value set at
      construction means that no object exists without one. A random UUID in a
      `urn:uuid:` URI gives an ID in full URI form (OID-01-001) that needs no server
      configuration.
    verification: Unit tests `test_as_base_id_uses_wire_default` in
      `test/wire/as2/vocab/base/test_wire_base_hierarchy.py` and
      `test_two_objects_have_different_ids` in `test/wire/as2/vocab/test_base_utils.py`
      confirm that each new instance receives a unique
      `urn:uuid:`-prefixed identifier without an explicit argument.
    relationships:
    - rel_type: implements
      spec_id: OID-01-001
- id: VM-05
  title: Vocabulary Extension
  specs:
  - id: VM-05-001
    priority: MUST
    kind: project
    statement: >-
      A new Vultron-specific domain type MUST be defined in `vultron/core/models/`. It
      inherits from `CoreObject` if it has an AS2 shape, or from `CoreRecord` if it is a
      non-AS2 bookkeeping record.
    rationale: >-
      ADR-0099 makes AS2 a serialization of the core model rather than a parallel hierarchy, so a
      domain type defined as a wire class would reintroduce the second hierarchy that decision
      removed.
    verification: >-
      Code review of the new type's location and base class.
    adr:
    - ADR-0099
  - id: VM-05-003
    priority: MUST
    kind: project
    statement: >-
      A new Vultron-specific domain type MUST define `type_` as a `Literal[str]` field
      that matches its wire type name.
    rationale: >-
      The `Literal` field is what makes registration through `__init_subclass__` fire
      automatically: in `CORE_VOCABULARY` for a `CoreObject`, and in `CORE_TYPE_MAP`
      for a `CoreRecord`-only type.
    verification: >-
      `test_core_record_types_in_core_type_map` in
      `test/architecture/test_hierarchy_invariants.py` checks the resulting
      registrations.
    relationships:
    - rel_type: extends
      spec_id: VM-05-001
    adr:
    - ADR-0099
  - id: VM-05-004
    priority: MUST
    kind: project
    statement: >-
      A wire-facing `as_` name for a new Vultron-specific domain type MUST be an alias of
      the core class (ARCH-25-003), not a separate class.
    rationale: >-
      A separate wire class for a domain type would reintroduce the second hierarchy
      that ADR-0099 removed. See ARCH-14-001 for the `as_` naming rule.
    verification: >-
      Code review confirms that the `as_` name is bound to the core class.
    relationships:
    - rel_type: extends
      spec_id: VM-05-001
    - rel_type: refines
      spec_id: ARCH-25-003
    adr:
    - ADR-0099
  - id: VM-05-005
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST write a separate `as_` wire class only for unpaired AS2
      vocabulary with no core counterpart. Such a class inherits from an AS2 base, such
      as `as_Object` or `as_Activity`. It sits in the vocabulary subpackage for its
      category, such as `vocab/objects/` or `vocab/activities/`, where that
      subpackage's `__init__.py` discovers it.
    rationale: >-
      Unpaired AS2 vocabulary has no core class to alias, so it is the one place a wire
      class of its own is needed.
    verification: >-
      Code review of the new class's location and base class.
      `test_all_vocabulary_are_as_base_subclasses` in
      `test/architecture/test_hierarchy_invariants.py` checks the resulting
      registrations.
    adr:
    - ADR-0099
  - id: VM-05-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Adding a new vocabulary type that represents a domain concept MUST be accompanied
      by: (a) a corresponding domain-layer Pydantic model in `vultron/core/`,
      (b) a handler use case in `vultron/core/use_cases/`, and (c) at least one
      round-trip serialization test.
    rationale: >-
      A vocabulary type with no use case gives the receiver nothing to act on. With no
      pattern, the activity is classified `UNKNOWN` and refused. With a pattern but no
      use case, the dispatcher reports "no use case found" and refuses it (SE-05-002). A
      round-trip test detects a field whose wire name or type does not survive
      serialization and parsing.
- id: VM-06
  title: Rehydration
  specs:
  - id: VM-06-001
    priority: MUST
    kind: project
    statement: Before any wire-layer activity is passed to semantic extraction, callers MUST attempt to rehydrate all nested
      URI string references into fully typed objects via `rehydrate(obj, dl)`
    rationale: >-
      Semantic extraction matches an activity on the types of its nested objects. A
      nested object that is still a bare URI does not satisfy a type constraint
      (SE-01-006), so an activity whose objects the receiver already holds would not
      match its pattern. Rehydration first replaces the references that the DataLayer
      can resolve with the stored objects, so the pattern sees their real types.
    verification: Integration tests in `test/adapters/driven/test_sqlite_rehydration.py` confirm that `rehydrate()` is
      called before semantic extraction, expanding nested URI strings into fully typed objects retrieved from the DataLayer.
    relationships:
    - rel_type: implements
      spec_id: SE-01-002
      note: semantic-extraction.md
  - id: VM-06-002
    priority: MUST
    kind: project
    statement: '`rehydrate()` MUST receive the active `DataLayer` instance via the `dl` parameter'
    rationale: >-
      Each actor has its own store (DL-07-002, DL-07-003), so a reference resolves only
      in the store of the actor that received the activity. A `dl` parameter makes the
      caller name that store. A global or default store could resolve the reference
      against the wrong actor's data, or against no data.
    verification: >-
      Inspection of `vultron/wire/as2/rehydration/resolve.py` confirms that
      `rehydrate()` accepts and uses the `dl` parameter to resolve URI strings; tests in
      `test/adapters/driven/test_sqlite_rehydration.py` verify that resolved objects are
      fetched from the supplied DataLayer.
  - id: VM-06-003
    priority: MUST
    kind: project
    statement: >-
      Rehydration MUST also rehydrate each URI string reference in a rehydrated object's
      nested fields, recursively, up to `MAX_REHYDRATION_DEPTH` levels.
    rationale: >-
      A pattern can constrain an object inside an object, as in `Accept(Invite(...))`.
      If rehydration expanded only the top level, the inner reference would stay a bare
      URI and the pattern would not match. The depth limit stops unbounded recursion on
      a reference cycle or a very deep structure.
    verification: >-
      Inspection of `vultron/wire/as2/rehydration/resolve.py` confirms that the
      rehydration loop is bounded by `MAX_REHYDRATION_DEPTH` and recurses into newly
      materialized objects to expand nested URI strings at each level.
  - id: VM-06-004
    priority: MUST
    kind: project
    statement: >-
      Rehydration MUST keep a URI it cannot resolve, carry on without raising, and log
      it: at WARNING in `dl.hydrate()`, at DEBUG in `rehydrate()`. This covers a
      reference in a slot that admits a URI, to an object the DataLayer does not hold.
      Of those slots, `rehydrate()` resolves only an activity's nested `object`.
    rationale: >-
      An unresolved reference is normal: the object can be on another server or not
      yet received, and raising would refuse a valid activity. Keeping the URI lets a
      later step treat the object as unresolved (SE-01-006, VAM-01-009, AKM-05-007).
      In `dl.hydrate()` this actor stored the reference, so a missing object is a data
      gap an operator must see. In the inbound `rehydrate()` it is the ordinary
      cross-container case, and the inbox fetches the object next.
    verification: >-
      For the store path, unit tests `test_hydrate_keeps_unresolvable_string_ids` and
      `test_hydrate_warns_for_unresolvable_string_ids` in
      `test/adapters/driven/test_sqlite_rehydration.py` confirm that `dl.hydrate()`
      leaves an unresolvable URI as a string, logs a WARNING naming it, and raises
      nothing. For the inbound path,
      `test_rehydrate_keeps_unresolved_nested_object_and_logs_debug` in
      `test/wire/as2/test_rehydration_materialisation.py` confirms that `rehydrate()`
      keeps an unresolved nested `object` URI, names it in a DEBUG record, logs no
      WARNING, and raises nothing.
  - id: VM-06-005
    priority: MUST
    kind: project
    statement: If a rehydrated object's `as_type` is not found in the vocabulary registry, rehydration MUST raise `KeyError`
      or `ValueError` rather than returning a partially constructed object
    rationale: >-
      A partly built object carries a shape that no registered class defines, and
      pattern matching and use cases would then act on fields that are missing or wrong.
      Raising stops the activity at rehydration, where the unknown `type` is the
      reported fault, and no later step acts on a guess.
    verification: >-
      Inspection of `vultron/wire/as2/rehydration/resolve.py` confirms that a vocabulary
      lookup failure for an unknown `as_type` propagates as `KeyError` or `ValueError`
      rather than returning a partially constructed object.
  - id: VM-06-007
    priority: MUST
    kind: project
    statement: >-
      This rule covers an object-only slot: one whose declared type is an `as_Object`
      subclass that admits no `str` branch, such as `as_CaseStatus` or
      `list[as_Activity]`. For a bare IRI in such a slot, `rehydrate()` MUST resolve the
      IRI through the supplied `DataLayer`.
    note: >-
      `rehydrate()` in `vultron/wire/as2/rehydration/` is the sole owner of
      ID-to-object materialisation. A bare IRI is not a value an object-only slot can
      hold. A core dimension field admits no `str` either, but it serializes to a bare
      state value (SDO-01-004), not to a reference, so it is out of scope. Slots that do
      admit `str` (every `ActivityStreamRef[T]`) are out of scope too and keep
      VM-06-004's defer behaviour.
    rationale: >-
      ARCH-25-009 requires an object slot to hold the whole object. A bare IRI in a slot
      that cannot hold a string must become the real object or be refused.
      `rehydrate()` already holds the DataLayer (VM-06-002), so it can read the real
      object and the real actor.
    verification: Unit tests in `test/wire/as2/test_rehydration_materialisation.py` confirm that a bare ID in an
      object-only slot ends up holding the resolved object, that a slot supplied
      under its AS2 alias is materialised
      rather than skipped, and that a URI-admitting slot and a core dimension slot
      are both untouched.
    adr:
    - ADR-0099
    relationships:
    - rel_type: refines
      spec_id: VM-06-001
    - rel_type: depends_on
      spec_id: VM-06-002
      note: Materialisation needs the `dl` parameter that requirement mandates.
    - rel_type: refines
      spec_id: ARCH-25-029
  - id: VM-06-009
    priority: MUST
    kind: project
    statement: >-
      When `rehydrate()` cannot resolve a bare IRI in an object-only slot (VM-06-007),
      it MUST refuse with a `VultronReferenceResolutionError` that names the field and
      the IRI. It refuses both when the IRI resolves to nothing and when it resolves to
      an object that is not an AS2 object.
    note: >-
      `VultronReferenceResolutionError` is a `ValueError` subclass. An object that is
      not an AS2 object cannot occupy a wire slot, and it is the normal `dl.read()`
      result for a paired type while DL-05-004 returns core objects.
    rationale: >-
      A slot that cannot hold a string must hold the real object or the activity must
      be refused, so a failed resolution has no other outcome.
    verification: >-
      Unit tests in `test/wire/as2/test_rehydration_materialisation.py` confirm that an
      unresolvable reference raises rather than leaving a bare string, and that a
      reference resolving to a non-AS2 object is refused.
    relationships:
    - rel_type: uses_definition
      spec_id: VM-06-007
    adr:
    - ADR-0099
  - id: VM-06-010
    priority: MUST_NOT
    kind: project
    statement: >-
      `rehydrate()` MUST NOT fabricate a placeholder object for a bare IRI in an
      object-only slot (VM-06-007).
    rationale: >-
      A placeholder is not the object the IRI names, so the activity would act on an
      object that does not exist.
    verification: >-
      Unit tests in `test/wire/as2/test_rehydration_materialisation.py` confirm that an
      unresolvable reference raises rather than leaving a stub.
    relationships:
    - rel_type: uses_definition
      spec_id: VM-06-007
    adr:
    - ADR-0099
  - id: VM-06-011
    priority: MUST_NOT
    kind: project
    statement: >-
      `rehydrate()` MUST NOT synthesize a value for any field that a placeholder for a
      bare IRI would have required.
    rationale: >-
      A placeholder needs values for its required fields, such as an `actor`, and an
      invented `actor` attributes the activity to an actor that did not perform it.
    verification: >-
      `test_materialised_activity_carries_its_own_actor` in
      `test/wire/as2/test_rehydration_materialisation.py` confirms that the
      materialised activity carries its own actor rather than a synthesized one.
    relationships:
    - rel_type: extends
      spec_id: VM-06-010
    adr:
    - ADR-0099
  - id: VM-06-012
    priority: MUST_NOT
    kind: project
    statement: >-
      `rehydrate()` MUST NOT substitute, in an object-only slot (VM-06-007), a shape
      that the slot cannot hold.
    rationale: >-
      A substituted shape either fails validation later, away from its cause, or is
      read as an object of the wrong kind.
    verification: >-
      `test_reference_resolving_to_a_non_object_is_still_refused` in
      `test/wire/as2/test_rehydration_materialisation.py` confirms that a reference
      resolving to a non-AS2 object is refused rather than substituted.
    relationships:
    - rel_type: uses_definition
      spec_id: VM-06-007
    adr:
    - ADR-0099
  - id: VM-06-008
    priority: MUST
    kind: project
    statement: >-
      A wire-branch caller that resolves an AS2 `type` value MUST use a lookup that
      returns only classes the wire registry holds. Those are `as_Base` subclasses, and
      classes registered in `WIRE_TYPE_MAP` as their own wire form (ADR-0099).
    rationale: >-
      A core-map hit for a wire-branch caller is a coincidence of names, not a wire
      counterpart (ARCH-23-002). Registry membership, not `as_Base` ancestry, is the
      test: the canonical `VulnerabilityCase` is a core class registered as its own wire
      form (ADR-0099).
    verification: >-
      A test asserts that the wire-branch lookup raises for a name registered only in
      `CORE_TYPE_MAP`, and that the inbox re-parse path does not produce a core
      class for an
      inbound object whose `type` is registered only there.
    relationships:
    - rel_type: implements
      spec_id: MV-04-004
    adr:
    - ADR-0090
    - ADR-0099
  - id: VM-06-013
    priority: MUST
    kind: project
    statement: >-
      The core-type-map fallback (ARCH-12-010) MUST be reachable only by a caller that
      asks for it explicitly, never as the default answer to a wire-branch caller.
    rationale: >-
      A permissive default gives that answer to every caller that does not filter it,
      and a filter in one caller does not protect the others. A wire-only default gives
      a new caller the safe answer with no extra code.
    verification: >-
      `TestCoreTypeMapFallback` in `test/wire/as2/vocab/base/test_registry.py` asserts
      that the default lookup refuses every core-only name, and that a lookup with
      `include_core=True` still finds them.
    relationships:
    - rel_type: uses_definition
      spec_id: ARCH-12-010
      note: ARCH-12-010's registration duty stands; what changes is which callers reach the map it fills.
    adr:
    - ADR-0090
  - id: VM-06-014
    priority: MUST
    kind: project
    statement: >-
      A caller that may legitimately receive either branch MUST state that in its call,
      rather than inherit it from the lookup's default. Such a caller is a persistence
      read path that reconstructs whatever was stored.
    rationale: >-
      A stated need is visible at the call site, so a reviewer can see which callers
      reach the core map and why.
    verification: >-
      A test asserts that every call site other than the wire-only ones names its need
      for the core fallback explicitly. Inspection confirms the persistence read paths
      in `vultron/adapters/driven/db_record/` and
      `vultron/adapters/driven/datalayer_sqlite/hydration/coercion.py` pass
      `include_core=True`.
    relationships:
    - rel_type: extends
      spec_id: VM-06-013
    adr:
    - ADR-0090
- id: VM-07
  title: Serialization Rules
  specs:
  - id: VM-07-001
    priority: MUST
    kind: project
    statement: Serialized wire-layer objects MUST exclude `None` fields.
    rationale: >-
      Under the rule "if present, then non-empty" (CS-08-001), a `null` value means
      the same as no value. A sender that emits `null` gives receivers a second form
      of one absence to handle, and a receiver that reads it as a value can act on
      it. Leaving the field out gives one form.
    verification: Unit tests `test_render_excludes_none_fields` in `test/adapters/driven/test_wire_render_adapter.py` and
      `test_exclude_none_true` in `test/adapters/driving/fastapi/test_responses.py` confirm that `None` fields are absent
      from serialized output.
  - id: VM-07-005
    priority: MUST
    kind: project
    statement: Serialized wire-layer objects MUST exclude empty string fields.
    rationale: >-
      Under CS-08-001 a blank string means the same as no value, so a sender that
      emits `""` gives receivers another form of one absence, and a receiver that
      reads it as a value can act on it.
    note: >-
      This codebase meets it by refusing a blank when an object is built
      (`NonEmptyString`, CS-08-002), not by stripping blanks at serialization, which
      would change stored data silently.
    verification: >-
      `test/wire/as2/test_wire_text_fields_reject_blank.py` asserts every wire
      string field refuses a blank, building or parsing an object with a blank
      `name`, `summary`, `content` or `mediaType` is refused, and no serialized
      example activity holds an empty string.
    relationships:
    - rel_type: extends
      spec_id: VM-07-001
  - id: VM-07-002
    priority: MUST
    kind: foundation
    statement: >-
      Serialized messages MUST use the ActivityStreams 2.0 property names, which are
      camelCase, never another spelling such as Python snake_case field names.
    rationale: >-
      ActivityStreams 2.0 defines its property names in camelCase, and the Vultron
      context defines the Vultron properties in the same form. A receiver that reads a
      message by those names does not find a snake_case key, so the value is lost. Using
      the defined names is what lets another implementation read the message.
    verification: Unit tests `test_render_returns_camel_case_keys` in `test/adapters/driven/test_wire_render_adapter.py`
      and `test_camelcase_keys` in `test/adapters/driving/fastapi/test_responses.py` confirm that JSON output uses
      camelCase keys rather than Python snake_case names.
    tags:
    - as2
  - id: VM-07-003
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms no `object_to_record()` call site passes an object whose
      `as_type` starts with `"as_"`.
    statement: '`object_to_record()` MUST NOT be called on an object whose `as_type` starts with `"as_"`'
    rationale: >-
      `object_to_record()` stores an object in the table that its `type` value names,
      and a later read finds the class by that value. An `as_` value is a Python class
      name, not a wire `type` value (VM-03-003). A record stored under it would be in a
      different table from the other objects of its type, so a read or a query by the
      real `type` value would not find it.
  - id: VM-07-004
    priority: MUST
    kind: project
    statement: '`serialize_as_any=True` MUST be declared on any Pydantic model field that holds an object whose concrete runtime
      type is a subtype of the field''s declared type, at **both** the persistence serialization boundary and the wire delivery
      serialization boundary. Omitting `serialize_as_any=True` at either boundary causes the serializer to use the declared
      (base) type''s schema, silently dropping all subtype-specific fields.'
    rationale: >-
      By default, Pydantic v2 serializes a field by its declared type. A field typed as
      `as_Object` that holds an `as_VulnerabilityCaseStub` is serialized with the
      `as_Object` schema, so the stub's own fields (`caseId`, `activeEmbargo`,
      `caseStatus`) are dropped with no error. Both the persistence boundary and the
      delivery boundary need the flag: a correct stored copy still gives wrong wire
      output if the delivery serializer drops the fields.
    verification: Unit test `test_handle_outbox_item_preserves_inline_case_ledger_entry_fields` in
      `test/adapters/driving/fastapi/test_outbox_handle_item_delivery.py` confirms that subtype-specific fields are
      preserved in serialized wire output when `serialize_as_any=True` is set at both the persistence and delivery
      serialization boundaries.
- id: VM-08
  title: Static Object Integrity
  specs:
  - id: VM-08-001
    priority: SHOULD
    kind: project
    statement: Objects intended to be static once created (e.g., vocabulary registry entries, canonical example objects) SHOULD
      use immutable (frozen) configuration so that any attempt to modify them at runtime raises an exception
    rationale: >-
      Registry entries and canonical example objects are shared by every caller that
      reads them. If one caller changes such an object in place, every later caller sees
      the change, and the defect shows far from its cause. A frozen object raises at the
      change, where the cause is.
  - id: VM-08-002
    priority: MUST
    kind: project
    statement: >-
      A received wire Activity MUST carry the JSON body that arrived as its received
      evidence, held apart from the parsed object graph. The evidence is that body as
      the parser decoded and re-serialized it, before anything expands, validates or
      hydrates it.
    rationale: >-
      The received artifact is the evidence of what arrived, and the ledger replicates it via
      `Announce(CaseLedgerEntry)`. A class-level `frozen=True` cannot hold it: `frozen` does not
      reach nested models, and since ARCH-25-003 the nested objects are mutable core
      classes. The evidence is therefore a value taken at parse, not a property of the graph.
    verification: >-
      `test/wire/as2/test_received_evidence.py` asserts the evidence is taken before the
      parser's inline expansion.
    adr:
    - ADR-0074
    - ADR-0099
    - ADR-0107
  - id: VM-08-005
    priority: MUST_NOT
    kind: project
    statement: >-
      A received wire Activity's evidence MUST NOT change when the parsed activity, any
      object nested in it, or the caller's body is mutated.
    rationale: >-
      Evidence that changes with the parsed graph no longer records what arrived, so the
      ledger would replicate a body no sender delivered.
    verification: >-
      `test/architecture/test_wire_artifact_immutability.py` parses every example activity as a
      sender delivers it and, for each class reachable in the parsed tree, overwrites the fields
      of every instance of that class and asserts `received_evidence` still equals the delivered
      body. `test/wire/as2/test_received_evidence.py` asserts the evidence is
      unaffected by
      mutating the parsed object or the caller's body.
    relationships:
    - rel_type: extends
      spec_id: VM-08-002
    adr:
    - ADR-0074
    - ADR-0099
  - id: VM-08-006
    priority: MUST
    kind: project
    statement: >-
      When routing or use-case execution needs a more hydrated form of a received
      activity, this codebase MUST produce that form as a separate object.
    rationale: >-
      Hydrating the parsed activity in place would change the object that the evidence
      was taken beside, so the hydrated form is a copy.
    verification: >-
      `test/adapters/driving/fastapi/test_ingress_received_evidence.py` asserts ingress
      rehydration builds a routing copy that carries the evidence.
    relationships:
    - rel_type: extends
      spec_id: VM-08-002
    adr:
    - ADR-0074
  - id: VM-08-007
    priority: MUST
    kind: project
    statement: >-
      A more hydrated form of a received activity MUST carry the received activity's
      evidence unchanged.
    rationale: >-
      The routing copy is what the use case and the ledger see, so it must claim the
      same arrival as the activity it was built from.
    verification: >-
      `test/adapters/driving/fastapi/test_ingress_received_evidence.py` asserts ingress
      rehydration carries the evidence, bare references included, onto the routing copy.
    relationships:
    - rel_type: extends
      spec_id: VM-08-006
    adr:
    - ADR-0074
  - id: VM-08-008
    priority: MUST
    kind: project
    statement: >-
      A replay of a deferred activity, or a load of an archived one, MUST be parsed again
      from the received body held for it. It carries that body as its evidence.
    rationale: >-
      The deferred record and intake's archive keep the sealed body (IO-03-009,
      CLP-10-017), so a replay carries the first delivery's evidence and a load sees the
      body that arrived (ADR-0149).
    verification: >-
      `test/adapters/driving/fastapi/test_ingress_received_evidence.py` asserts that a
      replay of a deferred activity carries the evidence of its own delivery.
    relationships:
    - rel_type: refines
      spec_id: VM-08-002
    adr:
    - ADR-0149
  - id: VM-08-009
    priority: MUST
    kind: project
    statement: >-
      A resend of an archived activity with the same body MUST be routed as the archived
      copy, parsed from the body intake archived. It carries that body, the first
      delivery's, as its evidence.
    rationale: >-
      The archived copy routed for a resend is the first delivery's sealed body, so
      carrying it as evidence claims exactly the event that arrived first. The repeat
      guards then decide, so a committed act is a repeat and an act that never
      committed, such as a failed one, runs as a first delivery and records that body
      (ADR-0151). A resend of a different body under a held id is refused, not routed
      (IE-10-002), so an id's evidence has one answer.
    verification: >-
      `test/adapters/driving/fastapi/test_ingress_received_evidence.py` asserts that a
      resend of an archived activity is routed with the archived body as its evidence.
    relationships:
    - rel_type: refines
      spec_id: VM-08-002
    adr:
    - ADR-0149
  - id: VM-08-010
    priority: MUST_NOT
    kind: project
    statement: >-
      An activity routed or rebuilt from anything other than a delivery's sealed body
      carries no received evidence. This codebase MUST NOT give it the evidence of a
      different delivery.
    note: >-
      Such an activity is a resend of the held body under the id of a still-deferred
      activity, routed as the held copy before its replay, or an activity the receiver
      built itself and holds as a stored row.
    rationale: >-
      A resend is another delivery, so its own body never becomes the evidence of the
      copy routed in its place: that would claim the wrong event.
    verification: >-
      `test/adapters/driving/fastapi/test_ingress_received_evidence.py` asserts that a
      resend of a still-deferred activity is routed without evidence.
    relationships:
    - rel_type: extends
      spec_id: VM-08-002
    adr:
    - ADR-0149
  - id: VM-08-003
    priority: MUST
    kind: protocol
    statement: >-
      The copy of an activity recorded in the case ledger (the entry's `payloadSnapshot`)
      MUST be identical to the activity delivered to participants.
    rationale: >-
      Ledger integrity requires that what is recorded and what is delivered are identical.
      A participant that holds both the delivered activity and the ledger entry can check
      this through the hash chain, so a ledger that records one form while recipients
      receive another is visible to them.
    verification: >-
      `test_the_emitter_receives_the_blob_the_adapter_returned_to_core` in
      `test/adapters/driving/fastapi/test_outbox_sealed_body_delivery.py` confirms that the
      delivered body is the sealed body byte for byte, and
      `test_a_replica_follows_the_managing_owners_termination_by_trigger` in
      `test/core/use_cases/received/test_embargo_relay_replay.py` confirms that the
      committed entry's `payloadSnapshot` equals that sealed body.
    adr:
    - ADR-0074
    stories:
    - story_2026_015
  - id: VM-08-004
    priority: MUST
    kind: project
    statement: >-
      The factory MUST produce an emitted wire Activity blob as a complete, frozen object
      before any port or adapter receives it.
    rationale: >-
      VM-08-003 states what participants can observe: the ledger copy is identical to
      the delivered activity. This requirement and its siblings state how this codebase
      meets it. The factory alone makes the activity complete.
    verification: >-
      `test_the_activity_is_sealed_complete` in
      `test/adapters/driven/trigger_activity_adapter/test_sealed_body_audit.py` checks
      that each trigger-port activity is sealed complete.
    adr:
    - ADR-0074
    relationships:
    - rel_type: implements
      spec_id: VM-08-003
  - id: VM-08-011
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST use the exact blob returned to core as both the delivery payload
      and `CaseLedgerEntry.payloadSnapshot`.
    rationale: >-
      The delivery payload and the ledger copy are then one blob, so they cannot differ.
    verification: >-
      Inspection of outbound emit nodes confirms that `payload_snapshot` is set to the exact
      blob returned by the factory port, without further transformation.
    adr:
    - ADR-0074
    relationships:
    - rel_type: implements
      spec_id: VM-08-003
  - id: VM-08-012
    priority: MUST_NOT
    kind: project
    statement: >-
      A port or adapter MUST NOT enrich, mutate or re-derive an emitted blob after it
      leaves the factory.
    rationale: >-
      A change after the factory would make the delivered activity differ from the blob
      that core recorded.
    verification: >-
      Inspection confirms outbox delivery passes the blob through unchanged — no `object_`
      mutation sites remain.
    adr:
    - ADR-0074
    relationships:
    - rel_type: implements
      spec_id: VM-08-003
- id: VM-09
  title: Unknown Message Handling
  specs:
  - id: VM-09-001
    priority: MAY
    kind: protocol
    statement: >-
      A receiver MAY keep a message that it cannot parse, or whose semantics are
      unknown, for human or agent review.
    rationale: >-
      A receiver can get a message that it cannot parse or interpret, for example from a
      peer that runs a newer version of the protocol. If the receiver drops it,
      information that may matter to the case is lost and nobody can see that it
      arrived. Keeping it for human or agent review lets a person decide what it means.
      This is a MAY because the protocol does not define a meaning for such a message.
    note: >-
      The statement names no store for the kept message. A Case Event records a state
      change, and such a message changes no state. It may also belong to no case. The
      case ledger is not a process log either (CLP-07).
    stories:
    - story_2026_013
- id: VM-10
  title: Vocabulary Namespace and JSON-LD Context
  specs:
  - id: VM-10-001
    priority: MUST
    kind: protocol
    statement: >-
      Outbound Vultron wire messages MUST declare the Vultron JSON-LD context by setting
      `@context` to `"https://certcc.github.io/Vultron/ns/context.jsonld"`. Using only
      the ActivityStreams namespace (`https://www.w3.org/ns/activitystreams`) is not
      sufficient: Vultron-specific types (`VulnerabilityCase`, `EmbargoEvent`, etc.) are
      not defined in that namespace and cannot be resolved by receivers without the
      Vultron context declaration.
    rationale: >-
      Derived from ADR-0069 (docs/adr/0069-vultron-namespace-uri.md). The Vultron vocabulary
      extends ActivityStreams with CVD-specific types; those types must be declared in a
      dereferenceable JSON-LD context so that external implementations can resolve them.
      The context document at the Vultron namespace URI imports the AS2 namespace, so
      implementations need only cite the Vultron context URI.
    verification: Inspection of `vultron/wire/as2/vocab/objects/base.py` confirms that the class with `_vocab_ns =
      VocabNamespace.VULTRON` sets `context_` to `"https://certcc.github.io/Vultron/ns/context.jsonld"` as the default
      field value, ensuring all outbound Vultron objects carry the correct `@context` declaration.
    adr:
    - ADR-0069
    stories:
    - story_2022_039
  - id: VM-10-002
    priority: MUST
    kind: project
    statement: >-
      Wire-layer classes whose `_vocab_ns` is `VocabNamespace.VULTRON` MUST default
      `context_` to the Vultron context URI (`https://certcc.github.io/Vultron/ns/context.jsonld`)
      rather than the ActivityStreams namespace URI.
    rationale: >-
      `as_VultronObject` is the base class for all Vultron-specific wire types. Overriding
      `context_` there ensures that every Vultron object serializes with the correct
      `@context` without requiring call-site changes.
    verification: Inspection of `vultron/wire/as2/vocab/objects/base.py` confirms that `as_VultronObject` (with
      `_vocab_ns = VocabNamespace.VULTRON`) overrides `context_` to
      `"https://certcc.github.io/Vultron/ns/context.jsonld"`, so every concrete Vultron wire type serializes with the
      correct `@context` without call-site changes.
    adr:
    - ADR-0069
    relationships:
    - rel_type: implements
      spec_id: VM-10-001
    stories:
    - story_2022_039
  - id: VM-10-003
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiver MUST NOT require dereferencing the Vultron JSON-LD context URI
      (VM-10-001) to process a message.
    rationale: >-
      A receiver reads Vultron's compact JSON form and needs no JSON-LD expansion, so the
      context URI is an identifier, not an input. A fetch per message would also make
      processing depend on the network and on the host serving the context. Today the
      URI does not resolve at all: the context document is withheld until it is served
      at the wire-versioned path ADR-0106 defines, so a receiver that fetched it would
      fail on every sender's message.
    verification: >-
      A test marked `VM-10-003` in `test/wire/as2/test_parser.py` blocks network
      access, then parses an inbound activity whose activity and nested objects declare
      the Vultron context, and asserts semantic extraction succeeds. Parsing and
      extraction are the receiver's only steps that read `@context`.
    adr:
    - ADR-0069
    - ADR-0106
    relationships:
    - rel_type: uses_definition
      spec_id: VM-10-001
    stories:
    - story_2022_039
