id: VM
title: Vocabulary Model
description: 'Requirements governing how ActivityStreams 2.0 vocabulary types are defined, registered, configured, and deserialized
  in the Vultron wire layer. The vocabulary model is the foundation of the inbound pipeline: every activity must be deserialized
  into a known vocabulary type before semantic extraction can assign it a domain meaning.'
scope:
- prototype
- production
tags:
- wire-format
groups:
- id: VM-01
  title: Vocabulary Registration
  specs:
  - id: VM-01-001
    priority: MUST
    kind: project
    statement: Every concrete wire-layer AS2 class (object, activity, or link) MUST be registered in the shared `VOCABULARY`
      registry automatically at class-definition time
    rationale: >-
      The parser can resolve a `type` value only to a class that a registry holds. A
      class that a developer must register by hand is unknown to the parser when that
      step is forgotten, and an inbound activity of that type is refused. Registration
      when the class is defined removes that manual step, so a new class cannot be
      defined and still be missing from the registry.
    verification: Unit tests in `test/wire/as2/vocab/base/test_registry.py` confirm that a concrete `as_Object` subclass
      with a `Literal` `type_` annotation is present in `VOCABULARY` immediately after class definition, with no explicit
      registration call.
  - id: VM-01-002
    priority: MUST
    kind: project
    statement: The `VOCABULARY` singleton MUST be the sole authoritative source for type lookup during dynamic deserialization
    rationale: >-
      If two lookups can answer the same `type` value, the same body can deserialize to
      different classes on different code paths, and a defect in one path is not seen in
      the other. One lookup gives every caller the same answer. The registry keys and
      the lookup order are set by VM-01-004 and VM-01-008, and VM-06-008 sets which
      callers may also reach the core map.
    verification: Unit tests in `test/wire/as2/vocab/base/test_registry.py` confirm that `find_in_vocabulary()` returns the
      correct registered class for a known type and raises `KeyError` for any unregistered type name.
  - id: VM-01-003
    priority: MUST
    kind: project
    statement: New vocabulary types MUST be importable at startup without explicit registration calls in application code
    rationale: >-
      Registration happens when a module is imported (VM-01-005). A vocabulary module
      that no code path imports registers nothing, and the parser then refuses its
      types. Importing the vocabulary package imports every vocabulary module, so the
      set of known types does not depend on which modules the application happened to
      import first.
    verification: Unit tests in `test/wire/as2/vocab/base/test_registry_completeness.py` confirm that importing
      `vultron.wire.as2.vocab` populates all expected vocabulary types in `VOCABULARY` without any explicit registration
      call in application code.
  - id: VM-01-004
    priority: MUST
    kind: project
    statement: >-
      The `VOCABULARY` registry MUST be keyed by the full wire class name (`as_VultronPerson`),
      and MUST map each such key to that class.  A `VOCABULARY` key is a class-name lookup and
      MUST NOT be read as an AS2 `type` value; resolving an inbound `"type": "..."` value is
      `WIRE_TYPE_MAP`'s job (VM-01-008).  `VOCABULARY` keys MUST be disjoint from core
      vocabulary keys (ARCH-23-002).
    rationale: >-
      The two registries answer different questions, so they carry different key forms:
      `VOCABULARY` answers "which class is named this?", `WIRE_TYPE_MAP` answers "which class
      does this wire `type` value deserialize to?" (VM-01-008).  The class-name form is what
      keeps these keys disjoint from `CORE_VOCABULARY`, so no wire class shadows a core type.
      The `as_` prefix is never part of an AS2 `type` value, so nothing external depends on
      this key form (ARCH-23-003).
    verification: >-
      `test/architecture/test_vocab_registry_keys.py` asserts every `VOCABULARY` key equals its
      registered class's `__name__`, behind the same population guard the `WIRE_TYPE_MAP` ratchets
      use.  A test in `test/wire/as2/vocab/base/test_registry.py` asserts
      `set(VOCABULARY) & set(CORE_VOCABULARY) == set()` once both registries are fully populated
      (ARCH-23-002).
    adr:
    - ADR-0082
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-23-002
      note: Disjoint wire and core registry keys are what this requirement's key form delivers.
  - id: VM-01-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Vocabulary type registration MUST occur automatically at package import time; no explicit per-type registration
      call MUST be required at call sites.
    rationale: >-
      A registration call that each call site must make is a step that a call site can
      omit. When it is omitted, the type is unknown only on that path, and the defect
      shows only for the activities that take it. Registration as an import side effect
      makes the registry the same for every caller.
    relationships:
    - rel_type: refines
      spec_id: VM-01-001
  - id: VM-01-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'A `VocabNamespace` enum (values: `AS`, `VULTRON`) MUST be defined in `vultron/wire/as2/vocab/base/enums.py`
      and used to annotate the provenance of each vocabulary class'
    rationale: >-
      The namespace tag tells which vocabulary a class belongs to: ActivityStreams or
      Vultron. Other rules read it. A Vultron class defaults its `@context` to the
      Vultron context URI (VM-10-002), and the generator of the JSON-LD context document
      reads it to choose the classes it lists. One enum in one module gives those
      readers one value to compare, instead of a string that each reader can spell
      differently.
  - id: VM-01-007
    priority: MUST
    kind: project
    statement: >-
      Registration completeness MUST be verified against the wire `type` a class actually
      presents, not against the module it lives in.  A test MUST assert that every
      `as_Base` subclass whose presented `type` equals its own class-name-derived value is
      reachable in a wire registry under that value, and MUST hold the exceptions in a
      declared exemption set that names, per member, the requirement or reason that
      exempts it.  A class's presented `type` is its `type_` field default, or its class
      name with any `as_` prefix removed when that default is `None`.
    rationale: >-
      A registration check that looks at modules can skip a module for the same reason
      that the module failed to register. A module with no own `type_` annotation looks
      like a module of aliases or abstract classes, and that missing annotation is the
      defect the check looks for. A check on the `type` value that each class presents
      does not depend on how a module is written, so it finds a class that presents a
      distinct wire `type` but registered nothing. Each exemption names its reason, so a
      reviewer can see why a class is exempt. The check reads the field default and not
      an instance, because a class with required fields cannot be built without
      arguments. Abstract roots such as `as_Object`, `as_VultronObject` and
      `as_VultronActorMixin` present their own name and are unregistered by design, so
      they are members of the exemption set.
    verification: >-
      A test enumerates every `as_Base` subclass, computes the `type` each presents, and
      asserts that a class presenting its own class-name-derived value resolves to itself
      through the wire lookup or appears in the declared exemption set with a stated reason.
    relationships:
    - rel_type: verifies
      spec_id: VM-01-001
    - rel_type: depends_on
      spec_id: VM-03-002
      note: The `Literal` annotation is what makes "distinct wire type" declarable rather than inferred.
  - id: VM-01-008
    priority: MUST
    kind: project
    statement: >-
      The `WIRE_TYPE_MAP` registry MUST be keyed by the wire `type` value the registered class
      emits — its declared `type_` default, or, absent one, its class name with the `as_` prefix
      removed, matching what VM-03-001 assigns at construction.  A class MUST NOT be registered
      under its class name when that name is not the `type` value it emits.  Exactly one class
      MUST own a given `type` value: a class that shares another's `type` value MUST declare
      itself an alias (`_wire_type_alias = True`) and MUST NOT hold a `WIRE_TYPE_MAP` key, while
      remaining reachable by class name through `VOCABULARY` (VM-01-004).  The sole exception
      is a sanctioned shadow, enumerated in the verifying ratchet: the five `as_Vultron*` actor
      subtypes deliberately replace their base AS2 actor classes as the owner of `Person`,
      `Organization`, `Service`, `Application` and `Group`, so an inbound actor keeps its
      Vultron extension fields.
    rationale: >-
      A key that is no object's `type` value cannot be reached from the wire. It also
      lets a caller with a class name resolve a wire class by a coincidence of names,
      which ARCH-23-002 forbids: the key `VultronPerson` for `as_VultronPerson` is also
      the name of a core type. A key derived from the emitted value removes both
      problems. One owner for each `type` value gives the inbound lookup one answer for
      each value.
    verification: >-
      `test/architecture/test_vocab_registry_keys.py` forces full registration, then asserts every
      `WIRE_TYPE_MAP` key equals `wire_type_value()` of its registered class, that every declared
      wire `type` value resolves to some registered class, that no class declaring
      `_wire_type_alias` holds a key, and that no two registrable classes share a `type` value
      outside the enumerated sanctioned shadows.  A population guard precedes them, since
      registration is an import side effect (VM-01-005) and the assertions would otherwise pass
      vacuously.
    relationships:
    - rel_type: depends_on
      spec_id: VM-03-001
      note: The class-name fallback must match the value `set_type_from_class_name` assigns.
    - rel_type: depends_on
      spec_id: VM-01-005
      note: Import-time registration is why the verification must force population first.
- id: VM-02
  title: Base Model Configuration
  specs:
  - id: VM-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      All wire-layer AS2 Pydantic models MUST inherit `model_config` from `as_Base`
      (or an intermediate class that inherits from `as_Base`), which provides:
      (a) a camelCase alias generator, (b) `populate_by_name=True`, and
      (c) strict-mode validation.
    rationale: >-
      One inherited configuration makes every wire class read and write field names in
      the same forms: camelCase names on the wire (VM-07-002) and Python names in code.
      A class with its own configuration can send snake_case keys or refuse a field
      given by its Python name, and only the activities that use that class show the
      defect.
  - id: VM-02-002
    priority: MUST
    kind: project
    statement: The `@context` field (`as_context`) MUST use explicit `validation_alias="@context"` and `serialization_alias="@context"`
      because `@` is not a valid Python identifier character and cannot be handled by the camelCase alias generator
    rationale: >-
      `@` cannot occur in a Python identifier, and the camelCase alias generator cannot
      produce `@context` from a field name. Without the explicit aliases, the field is
      sent as `context`, and a receiver does not find the JSON-LD context that VM-10-001
      requires a message to declare.
    verification: Unit test `test_as_base_context_alias_accepted` in `test/wire/as2/vocab/base/test_wire_base_hierarchy.py`
      confirms that `@context` is accepted via the explicit alias, and inspection of `vultron/wire/as2/vocab/base/base.py`
      confirms the `validation_alias` and `serialization_alias` declarations.
    relationships:
    - rel_type: refines
      spec_id: VM-02-001
  - id: VM-02-003
    priority: MUST
    kind: project
    statement: Wire-layer models MUST provide `to_json()`, `to_dict()`, and `from_json()` convenience methods that exclude
      `None` values and serialize using aliases by default
    rationale: >-
      When each caller chooses its own serialization options, the same object can give
      different JSON on different code paths, for example with `null` fields on one path
      and none on the other. Shared methods with the project defaults give one output
      for one object, and they keep these output rules in one place.
    verification: Unit tests in `test/wire/as2/vocab/test_vocab_case_examples.py` confirm that `to_json()` produces
      alias-keyed JSON with `None` fields excluded and that `from_json()` correctly round-trips the resulting string.
- id: VM-03
  title: Type Auto-Inference
  specs:
  - id: VM-03-001
    priority: MUST
    kind: project
    statement: The `as_type` field on every concrete wire-layer class MUST be set automatically at construction time if not
      supplied by the caller
    rationale: >-
      A receiver selects the class for an inbound object by its `type` value, and the
      parser refuses an activity with no recognizable `type` (MV-01-001). If a sender
      had to set `type` by hand, an object built without it would be sent with no
      `type`, and the receiver would refuse it. Setting it at construction means that
      every object that this implementation sends carries a `type`.
    verification: Unit tests `test_as_base_type_set_from_class_name` and `test_as_object_type_set_from_class_name` in
      `test/wire/as2/vocab/base/test_wire_base_hierarchy.py` confirm that `type_` is populated from the stripped class
      name when no explicit value is provided to the constructor.
  - id: VM-03-002
    priority: MUST
    kind: project
    statement: >-
      A wire-layer class that presents its own class-name-derived AS2 `type` value MUST
      narrow the `type_` field to a `Literal[...]` matching that value, unless VM-01-007's
      exemption set names it (an abstract root such as `as_Object`, which must stay
      unregistered so an unresolved inline object is left to it).  A semantic alias
      that must not be reachable under its own class name — the `_XxxActivity` pattern,
      which presents an ancestor's `type` — MUST NOT declare its own `type_` annotation,
      because any such declaration registers the class under its class name.
    rationale: >-
      Auto-registration treats an own `type_` annotation as the sign that a class is
      concrete, and it keys the entry on the class name (VM-01-001). VM-03-001 fills
      `type_` from the class name when a class inherits no default. So a class with
      neither an annotation nor an inherited default presents a distinct wire `type` but
      registers nothing, and the parser cannot resolve that `type` to a wire class. As a
      MUST, the annotation is the single declaration of a distinct wire type, and
      VM-01-007 can check it. The prohibition covers only aliases that must not be
      reachable by class name. Classes such as `as_VultronPerson` present an ancestor's
      `type` but narrow `type_` on purpose, so that they register under their own class
      name.
    verification: >-
      A test asserts that a wire class presenting its own class-name-derived `type` value
      declares that value as a `Literal`, and that an `_XxxActivity` alias declares no own
      `type_` annotation — the per-class form of the hierarchy-wide invariant VM-01-007
      verifies.
    relationships:
    - rel_type: refines
      spec_id: VM-03-001
    - rel_type: refines
      spec_id: VM-01-001
  - id: VM-03-003
    priority: MUST_NOT
    kind: project
    verification: >-
      `test/wire/as2/vocab/base/test_registry.py::TestSetTypeFromClassName` confirms the
      class-name-derived type strips the `as_` prefix.
    statement: '`as_type` values MUST NOT start with `"as_"` in serialized wire output'
    rationale: >-
      The `as_` prefix marks a Python wire class name (ARCH-14-001). It is not part of
      any ActivityStreams or Vultron `type` value. Another implementation that gets
      `as_Note` finds no such type in either vocabulary and cannot read the object. The
      registry also keys `WIRE_TYPE_MAP` by the value without the prefix (VM-01-008).
    relationships:
    - rel_type: constrains
      spec_id: VM-03-001
- id: VM-04
  title: ID Generation
  specs:
  - id: VM-04-001
    priority: MUST
    kind: project
    statement: All wire-layer objects MUST have a globally unique `as_id` field set at construction time by `generate_new_id()`
      if not supplied
    rationale: >-
      Other objects refer to an object by its `id`, the DataLayer stores it under that
      `id`, and receivers use it to detect a repeated delivery. An object without an
      `id` cannot be referenced, stored or checked for a repeat. A value set at
      construction means that no object exists without one. A random UUID in a
      `urn:uuid:` URI gives an ID in full URI form (OID-01-001) that needs no server
      configuration.
    verification: Unit tests `test_as_base_id_uses_wire_default` in
      `test/wire/as2/vocab/base/test_wire_base_hierarchy.py` and
      `test_two_objects_have_different_ids` in `test/wire/as2/vocab/test_base_utils.py`
      confirm that each new instance receives a unique
      `urn:uuid:`-prefixed identifier without an explicit argument.
    relationships:
    - rel_type: implements
      spec_id: OID-01-001
- id: VM-05
  title: Vocabulary Extension
  specs:
  - id: VM-05-001
    priority: MUST
    kind: project
    statement: >-
      When adding a new Vultron-specific domain type, the new class MUST: 1. Be defined in
      `vultron/core/models/`, inheriting from `CoreObject` if it has an AS2 shape, or from
      `CoreRecord` if it is a non-AS2 bookkeeping record; 2. Define `type_` as a `Literal[str]`
      field matching the wire type name, so that registration via `__init_subclass__` fires
      automatically (`CORE_VOCABULARY` for a `CoreObject`, `CORE_TYPE_MAP` for a
      `CoreRecord`-only type). If a wire-facing `as_` name is wanted for it, that name MUST be an
      alias of the core class (ARCH-25-003), not a separate class. A separate `as_` wire
      class MUST be written only for unpaired AS2 vocabulary with no core counterpart; such a class
      inherits from an AS2 base (`as_Object`, `as_Activity`, etc.), is placed in the vocabulary
      subpackage that matches its category (`vocab/objects/`, `vocab/activities/`), and is
      reachable via the dynamic discovery in that subpackage's `__init__.py`.
    rationale: >-
      ADR-0099 makes AS2 a serialization of the core model rather than a parallel hierarchy, so a
      domain type defined as a wire class would reintroduce the second hierarchy that decision
      removed. See ARCH-14-001 for the `as_` naming rule.
    verification: >-
      Code review of the new type's location and base class.
      `test_core_record_types_in_core_type_map` and `test_all_vocabulary_are_as_base_subclasses`
      in `test/architecture/test_hierarchy_invariants.py` check the resulting registrations.
    adr:
    - ADR-0099
  - id: VM-05-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Adding a new vocabulary type that represents a domain concept MUST be accompanied
      by: (a) a corresponding domain-layer Pydantic model in `vultron/core/`,
      (b) a handler use case in `vultron/core/use_cases/`, and (c) at least one
      round-trip serialization test.
    rationale: >-
      A vocabulary type that the parser accepts but that no domain model represents and
      no use case handles reaches dispatch with no behavior, so the activity is accepted
      and then does nothing. A round-trip test detects a field whose wire name or type
      does not survive serialization and parsing.
- id: VM-06
  title: Rehydration
  specs:
  - id: VM-06-001
    priority: MUST
    kind: project
    statement: Before any wire-layer activity is passed to semantic extraction, callers MUST attempt to rehydrate all nested
      URI string references into fully typed objects via `rehydrate(obj, dl)`
    rationale: >-
      Semantic extraction matches an activity on the types of its nested objects. A
      nested object that is still a bare URI does not satisfy a type constraint
      (SE-01-006), so an activity whose objects the receiver already holds would not
      match its pattern. Rehydration first replaces the references that the DataLayer
      can resolve with the stored objects, so the pattern sees their real types.
    verification: Integration tests in `test/adapters/driven/test_sqlite_rehydration.py` confirm that `rehydrate()` is
      called before semantic extraction, expanding nested URI strings into fully typed objects retrieved from the DataLayer.
    relationships:
    - rel_type: refines
      spec_id: SE-01-002
      note: semantic-extraction.md
  - id: VM-06-002
    priority: MUST
    kind: project
    statement: '`rehydrate()` MUST receive the active `DataLayer` instance via the `dl` parameter'
    rationale: >-
      Each actor has its own store (DL-07-004), so a reference resolves only in the
      store of the actor that received the activity. A `dl` parameter makes the caller
      name that store. A global or default store could resolve the reference against the
      wrong actor's data, or against no data.
    verification: Inspection of `vultron/wire/as2/rehydration.py` confirms that `rehydrate()` accepts and uses the `dl`
      parameter to resolve URI strings; tests in `test/adapters/driven/test_sqlite_rehydration.py` verify that resolved
      objects are fetched from the supplied DataLayer.
  - id: VM-06-003
    priority: MUST
    kind: project
    statement: 'Rehydration MUST be recursive: if a rehydrated object itself contains URI string references in its nested
      fields, those MUST also be rehydrated up to `MAX_REHYDRATION_DEPTH` levels'
    rationale: >-
      A pattern can constrain an object inside an object, as in `Accept(Invite(...))`.
      If rehydration expanded only the top level, the inner reference would stay a bare
      URI and the pattern would not match. The depth limit stops unbounded recursion on
      a reference cycle or a very deep structure.
    verification: Inspection of `vultron/wire/as2/rehydration.py` confirms that the rehydration loop is bounded by
      `MAX_REHYDRATION_DEPTH` and recurses into newly materialized objects to expand nested URI strings at each level.
  - id: VM-06-004
    priority: MUST
    kind: project
    statement: >-
      If a URI string reference cannot be resolved (object not in DataLayer),
      rehydration MUST: (a) leave the field as the original URI string value,
      (b) log a WARNING identifying the unresolvable URI, and (c) continue
      rehydrating remaining fields rather than raising an exception.
    rationale: >-
      A reference that the local DataLayer cannot resolve is a normal case: the object
      can be on another server, or not yet received. Raising would refuse an activity
      that is valid. Keeping the URI lets a later step treat the object as unresolved
      (SE-01-006) and fetch it. The log entry tells an operator which reference stayed
      unresolved.
    verification: Unit tests `test_hydrate_keeps_unresolvable_string_ids` and `test_hydrate_warns_for_unresolvable_string_ids`
      in `test/adapters/driven/test_sqlite_rehydration.py` confirm that an unresolvable URI is left as a string, a WARNING
      is emitted, and no exception is raised.
    relationships:
    - rel_type: implements
      spec_id: SE-01-003
      note: semantic-extraction.md
    - rel_type: refines
      spec_id: ARCH-25-009
  - id: VM-06-005
    priority: MUST
    kind: project
    statement: If a rehydrated object's `as_type` is not found in the vocabulary registry, rehydration MUST raise `KeyError`
      or `ValueError` rather than returning a partially constructed object
    rationale: >-
      A partly built object carries a shape that no registered class defines, and
      pattern matching and use cases would then act on fields that are missing or wrong.
      Raising stops the activity at rehydration, where the unknown `type` is the
      reported fault, and no later step acts on a guess.
    verification: Inspection of `vultron/wire/as2/rehydration.py` confirms that a vocabulary lookup failure for an unknown
      `as_type` propagates as `KeyError` or `ValueError` rather than returning a partially constructed object.
  - id: VM-06-006
    priority: MUST
    kind: project
    statement: A vocabulary override (replacing the default `VultronVocabulary` with a custom one) MUST preserve at least
      one registration from each base module that the production codebase depends on. An override that silently clears all
      base registrations is equivalent to a blank vocabulary and will cause rehydration failures for all standard Vultron
      activity types.
    rationale: The vocabulary registry is global. Test or demo code that installs a minimal override without re-registering
      base types causes downstream rehydration to raise `KeyError` for every standard type. The invariant ensures overrides
      are additive-by-default.
    verification: Inspection of `vultron/wire/as2/vocab/base/registry.py` confirms that the default vocabulary retains
      all base-module registrations; a test that installs a blank override and calls `rehydrate()` with a standard Vultron
      type should raise `KeyError`, confirming that incomplete overrides break rehydration.
    relationships:
    - rel_type: refines
      spec_id: VM-06-001
  - id: VM-06-007
    priority: MUST
    kind: project
    statement: >-
      `rehydrate()` in `vultron/wire/as2/rehydration.py` is the sole owner of ID-to-object
      materialisation. When a slot's declared type admits a model but admits no `str` branch —
      `as_CaseStatus`, `list[as_Activity]` — a bare IRI is not a value it can hold, so
      `rehydrate()` MUST resolve that IRI through the supplied `DataLayer` and MUST refuse with
      a `VultronReferenceResolutionError` (a `ValueError` subclass) naming the field and the IRI
      when it cannot. Refusal covers both failure modes: the IRI resolving to nothing, and the
      IRI resolving to an object that is not an AS2 object and therefore cannot occupy a wire
      slot — which is the normal `dl.read()` result for a paired type while DL-05-004 returns
      core objects. It MUST NOT fabricate a placeholder object, MUST NOT synthesize a value for
      any field the placeholder would have required, and MUST NOT substitute a shape the slot
      cannot hold. Only slots whose declared type is an `as_Object` subclass are in scope: a core
      dimension field admits no `str` either but serializes to a bare state value (SDO-01-004),
      not to a reference. Slots that do admit `str` (every `ActivityStreamRef[T]`) are out of
      scope here and keep VM-06-004's defer behaviour.
    rationale: >-
      ARCH-25-009 requires an object slot to hold the whole object. A bare IRI in a slot
      that cannot hold a string must become the real object or be refused. A placeholder
      built in its place needs values for its required fields, such as an `actor`, and
      an invented `actor` attributes the activity to an actor that did not perform it.
      `rehydrate()` already holds the DataLayer (VM-06-002), so it can read the real
      object and the real actor.
    verification: Unit tests in `test/wire/as2/test_rehydration_materialisation.py` confirm that a bare ID in an
      object-only slot ends up holding the resolved object, that an unresolvable reference raises rather than leaving a
      bare string or a stub, that a reference resolving to a non-AS2 object is refused rather than substituted, that a
      slot supplied under its AS2 alias is materialised rather than skipped, that a URI-admitting slot and a core
      dimension slot are both untouched, and that the materialised activity carries its own actor rather than a
      synthesized one.
    adr:
    - ADR-0099
    relationships:
    - rel_type: refines
      spec_id: VM-06-001
    - rel_type: depends_on
      spec_id: VM-06-002
      note: Materialisation needs the `dl` parameter that requirement mandates.
    - rel_type: refines
      spec_id: ARCH-25-009
  - id: VM-06-008
    priority: MUST
    kind: project
    statement: >-
      A wire-branch caller resolving an AS2 `type` value MUST use a lookup that returns only
      classes the wire registry holds: `as_Base` subclasses, or classes registered in
      `WIRE_TYPE_MAP` as their own wire form (ADR-0099).  The core-type-map fallback (ARCH-12-010) MUST be reachable
      only from a caller that has asked for it explicitly; it MUST NOT be the default
      answer a wire-branch caller receives.  A caller that may legitimately receive either
      branch — the persistence read paths that reconstruct whatever was stored — MUST state
      that in its call rather than inherit it from the function's default.
    rationale: >-
      A core-map hit for a wire-branch caller is a coincidence of names, not a wire
      counterpart (ARCH-23-002). A permissive default gives that answer to every caller
      that does not filter it, and a filter in one caller does not protect the others. A
      wire-only default gives a new caller the safe answer with no extra code. Registry
      membership, not `as_Base` ancestry, is the test: the canonical `VulnerabilityCase`
      is a core class registered as its own wire form (ADR-0099).
    verification: >-
      A test asserts that the wire-branch lookup raises for a name registered only in
      `CORE_TYPE_MAP`, that the inbox re-parse path does not produce a core class for an
      inbound object whose `type` is registered only there, and that every remaining call site either uses the
      wire-only lookup or names its need for the core fallback explicitly.
    relationships:
    - rel_type: refines
      spec_id: MV-04-003
    - rel_type: constrains
      spec_id: ARCH-12-010
      note: ARCH-12-010's registration duty stands; what changes is which callers reach the map it fills.
    adr:
    - ADR-0090
- id: VM-07
  title: Serialization Rules
  specs:
  - id: VM-07-001
    priority: MUST
    kind: project
    statement: Serialized wire-layer objects MUST exclude `None` fields and MUST exclude empty string fields
    rationale: >-
      Under the rule "if present, then non-empty" (CS-08-001), a blank value means the
      same as no value. A sender that emits `null` or `""` gives receivers two more
      forms of one absence to handle, and a receiver that reads them as values can act
      on them. Leaving the field out gives one form.
    verification: Unit tests `test_render_excludes_none_fields` in `test/adapters/driven/test_wire_render_adapter.py` and
      `test_exclude_none_true` in `test/adapters/driving/fastapi/test_responses.py` confirm that `None` fields are absent
      from serialized output.
  - id: VM-07-002
    priority: MUST
    kind: foundation
    statement: >-
      Serialized messages MUST use the ActivityStreams 2.0 property names, which are
      camelCase, never another spelling such as Python snake_case field names.
    rationale: >-
      ActivityStreams 2.0 defines its property names in camelCase, and the Vultron
      context defines the Vultron properties in the same form. A receiver that reads a
      message by those names does not find a snake_case key, so the value is lost. Using
      the defined names is what lets another implementation read the message.
    verification: Unit tests `test_render_returns_camel_case_keys` in `test/adapters/driven/test_wire_render_adapter.py`
      and `test_camelcase_keys` in `test/adapters/driving/fastapi/test_responses.py` confirm that JSON output uses
      camelCase keys rather than Python snake_case names.
    tags:
    - as2
  - id: VM-07-003
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms no `object_to_record()` call site passes an object whose
      `as_type` starts with `"as_"`.
    statement: '`object_to_record()` MUST NOT be called on an object whose `as_type` starts with `"as_"`'
    rationale: >-
      `object_to_record()` stores an object in the table that its `type` value names,
      and a later read finds the class by that value. An `as_` value is a Python class
      name, not a wire `type` value (VM-03-003). A record stored under it would be in a
      different table from the other objects of its type, so a read or a query by the
      real `type` value would not find it.
  - id: VM-07-004
    priority: MUST
    kind: project
    statement: '`serialize_as_any=True` MUST be declared on any Pydantic model field that holds an object whose concrete runtime
      type is a subtype of the field''s declared type, at **both** the persistence serialization boundary and the wire delivery
      serialization boundary. Omitting `serialize_as_any=True` at either boundary causes the serializer to use the declared
      (base) type''s schema, silently dropping all subtype-specific fields.'
    rationale: >-
      By default, Pydantic v2 serializes a field by its declared type. A field typed as
      `as_Object` that holds an `as_VulnerabilityCaseStub` is serialized with the
      `as_Object` schema, so the stub's own fields (`caseId`, `activeEmbargo`,
      `caseStatus`) are dropped with no error. Both the persistence boundary and the
      delivery boundary need the flag: a correct stored copy still gives wrong wire
      output if the delivery serializer drops the fields.
    verification: Unit test `test_handle_outbox_item_preserves_inline_case_ledger_entry_fields` in
      `test/adapters/driving/fastapi/test_outbox_handle_item_delivery.py` confirms that subtype-specific fields are
      preserved in serialized wire output when `serialize_as_any=True` is set at both the persistence and delivery
      serialization boundaries.
    relationships:
    - rel_type: refines
      spec_id: VM-07-001
- id: VM-08
  title: Static Object Integrity
  specs:
  - id: VM-08-001
    priority: SHOULD
    kind: project
    statement: Objects intended to be static once created (e.g., vocabulary registry entries, canonical example objects) SHOULD
      use immutable (frozen) configuration so that any attempt to modify them at runtime raises an exception
    rationale: >-
      Registry entries and canonical example objects are shared by every caller that
      reads them. If one caller changes such an object in place, every later caller sees
      the change, and the defect shows far from its cause. A frozen object raises at the
      change, where the cause is.
  - id: VM-08-002
    priority: MUST
    kind: project
    statement: >-
      A received wire Activity MUST carry, as its received evidence, the JSON body that arrived,
      as decoded and re-serialized by the parser before anything expands, validates, or hydrates
      it, and held independently of the parsed object graph. The evidence MUST NOT change when the
      parsed activity, any object nested in it, or the caller's body is mutated.
      If a more hydrated form is required for routing or use-case execution, it MUST be produced
      as a separate object, and it MUST carry the same evidence unchanged.
      A replay of a deferred activity, or a load of an archived one, is parsed
      again from the received body held for it, and carries that body as its
      evidence. A resend of an archived activity with the same body is routed as the
      archived copy, parsed from the body intake archived, and carries that body, the
      first delivery's, as its evidence. An activity routed or rebuilt from anything
      other than a delivery's sealed body (a resend of the held body under the id of a
      still-deferred activity, routed as the held copy before its replay, or an
      activity the receiver built itself and holds as a stored row) carries no
      received evidence, and it MUST NOT be given the evidence of a
      different delivery.
    rationale: >-
      The received artifact is the evidence of what arrived, and the ledger replicates it via
      `Announce(CaseLedgerEntry)`. A class-level `frozen=True` cannot hold it: `frozen` does not
      reach nested models, and since ARCH-25-003 the nested objects are mutable core
      classes. The evidence is therefore a value taken at parse, not a property of the graph.
      The deferred record and intake's archive keep the sealed body (IO-03-004,
      CLP-10-017), so a replay carries the first delivery's evidence and a load
      sees the body that arrived (ADR-0149). A resend is another delivery, so its
      own body never becomes the evidence of the copy routed in its place: that
      would claim the wrong event. The archived copy routed for a resend is the
      first delivery's sealed body, so carrying it as evidence claims exactly the
      event that arrived first; the repeat guards then decide, so a committed act is
      a repeat and an act that never committed, such as a failed one, runs as a
      first delivery and records that body (ADR-0151). A resend of a
      different body under a held id is refused, not routed (IE-10-002), so an id's
      evidence has one answer.
    verification: >-
      `test/architecture/test_wire_artifact_immutability.py` parses every example activity as a
      sender delivers it and, for each class reachable in the parsed tree, overwrites the fields
      of every instance of that class and asserts `received_evidence` still equals the delivered
      body. `test/wire/as2/test_received_evidence.py` asserts the evidence is taken before the
      parser's inline expansion and is unaffected by mutating the parsed object or the caller's
      body. `test/adapters/driving/fastapi/test_ingress_received_evidence.py` asserts ingress
      rehydration carries the evidence, bare references included, onto the
      routing copy, that a replay of a deferred activity carries the evidence of
      its own delivery, that a resend of a still-deferred activity is routed
      without it, and that a resend of an archived activity is routed with the
      archived body as its evidence.
    adr:
    - ADR-0074
    - ADR-0099
    - ADR-0107
    - ADR-0149
    relationships:
    - rel_type: refines
      spec_id: VM-08-001
  - id: VM-08-003
    priority: MUST
    kind: protocol
    statement: >-
      The copy of an activity recorded in the case ledger (the entry's `payloadSnapshot`)
      MUST be identical to the activity delivered to participants.
    rationale: >-
      Ledger integrity requires that what is recorded and what is delivered are identical.
      A participant that holds both the delivered activity and the ledger entry can check
      this through the hash chain, so a ledger that records one form while recipients
      receive another is visible to them.
    verification: >-
      `test_the_emitter_receives_the_blob_the_adapter_returned_to_core` in
      `test/adapters/driving/fastapi/test_outbox_sealed_body_delivery.py` confirms that the
      delivered body is the sealed body byte for byte, and
      `test_a_replica_follows_the_managing_owners_termination_by_trigger` in
      `test/core/use_cases/received/test_embargo_relay_replay.py` confirms that the
      committed entry's `payloadSnapshot` equals that sealed body.
    adr:
    - ADR-0074
    relationships:
    - rel_type: refines
      spec_id: VM-08-001
    lint_suppress:
    - missing_story_reference
  - id: VM-08-004
    priority: MUST
    kind: project
    statement: >-
      An emitted wire Activity blob MUST be produced by the factory as a complete, frozen object
      before being handed to any port or adapter. The exact blob returned to core MUST be used
      as both the delivery payload and `CaseLedgerEntry.payloadSnapshot`. No port or adapter
      MAY enrich, mutate, or re-derive the blob after it leaves the factory.
    rationale: >-
      VM-08-003 states what participants can observe: the ledger copy is identical to
      the delivered activity. This requirement states how this codebase meets it. The
      factory alone makes the activity complete, and no port or adapter changes it
      afterward. The delivery payload and the ledger copy are then one blob, so they
      cannot differ.
    verification: >-
      Inspection of outbound emit nodes confirms that `payload_snapshot` is set to the exact
      blob returned by the factory port, without further transformation. Outbox delivery
      passes the blob through unchanged — no `object_` mutation sites remain.
    adr:
    - ADR-0074
    relationships:
    - rel_type: implements
      spec_id: VM-08-003
- id: VM-09
  title: Unknown Message Handling
  specs:
  - id: VM-09-001
    priority: MAY
    kind: protocol
    statement: Messages that cannot be parsed or whose semantics are unknown MAY still be forwarded to the case event log
      to create an entry for human or agent review
    rationale: >-
      A receiver can get a message that it cannot parse or interpret, for example from a
      peer that runs a newer version of the protocol. If the receiver drops it,
      information that may matter to the case is lost and nobody can see that it
      arrived. Keeping it for human or agent review lets a person decide what it means.
      This is a MAY because the protocol does not define a meaning for such a message.
- id: VM-10
  title: Vocabulary Namespace and JSON-LD Context
  specs:
  - id: VM-10-001
    priority: MUST
    kind: protocol
    statement: >-
      Outbound Vultron wire messages MUST declare the Vultron JSON-LD context by setting
      `@context` to `"https://certcc.github.io/Vultron/ns/context.jsonld"`. Using only
      the ActivityStreams namespace (`https://www.w3.org/ns/activitystreams`) is not
      sufficient: Vultron-specific types (`VulnerabilityCase`, `EmbargoEvent`, etc.) are
      not defined in that namespace and cannot be resolved by receivers without the
      Vultron context declaration.
    rationale: >-
      Derived from ADR-0069 (docs/adr/0069-vultron-namespace-uri.md). The Vultron vocabulary
      extends ActivityStreams with CVD-specific types; those types must be declared in a
      dereferenceable JSON-LD context so that external implementations can resolve them.
      The context document at the Vultron namespace URI imports the AS2 namespace, so
      implementations need only cite the Vultron context URI.
    verification: Inspection of `vultron/wire/as2/vocab/objects/base.py` confirms that the class with `_vocab_ns =
      VocabNamespace.VULTRON` sets `context_` to `"https://certcc.github.io/Vultron/ns/context.jsonld"` as the default
      field value, ensuring all outbound Vultron objects carry the correct `@context` declaration.
    adr:
    - ADR-0069
    relationships:
    - rel_type: refines
      spec_id: VM-02-002
    stories:
    - story_2022_039
  - id: VM-10-002
    priority: MUST
    kind: project
    statement: >-
      Wire-layer classes whose `_vocab_ns` is `VocabNamespace.VULTRON` MUST default
      `context_` to the Vultron context URI (`https://certcc.github.io/Vultron/ns/context.jsonld`)
      rather than the ActivityStreams namespace URI.
    rationale: >-
      `as_VultronObject` is the base class for all Vultron-specific wire types. Overriding
      `context_` there ensures that every Vultron object serializes with the correct
      `@context` without requiring call-site changes.
    verification: Inspection of `vultron/wire/as2/vocab/objects/base.py` confirms that `as_VultronObject` (with
      `_vocab_ns = VocabNamespace.VULTRON`) overrides `context_` to
      `"https://certcc.github.io/Vultron/ns/context.jsonld"`, so every concrete Vultron wire type serializes with the
      correct `@context` without call-site changes.
    adr:
    - ADR-0069
    relationships:
    - rel_type: implements
      spec_id: VM-10-001
    stories:
    - story_2022_039
