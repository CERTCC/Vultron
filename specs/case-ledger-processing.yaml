id: CLP
title: Case Ledger Processing
description: Requirements for participant assertions, CASE_MANAGER canonicalization,
  local case audit ledgering, recorded-history projection, and replication-facing
  CaseLedgerEntry objects. Covers the commit authorization model, per-case genesis
  hash derivation, the canonical entry criteria that separate the case ledger from
  the process log, the CASE_MANAGER inbox routing path that enables ledger entry authorship,
  and the causal-ordering model that makes log_index order the authoritative causal
  sequence.
scope:
- prototype
- production
tags:
- protocol
- persistence
groups:
- id: CLP-01
  title: Assertion Intake
  specs:
  - id: CLP-01-001
    priority: MUST
    kind: protocol
    statement: Non-CASE_MANAGER activities that participate in a report, proto-case,
      or case workflow MUST be treated as participant assertions awaiting CASE_MANAGER
      processing
    rationale: >-
      A participant can only claim that it did something. Only the CASE_MANAGER can
      make that claim part of the shared case history. If a receiver treats a
      participant's activity as settled fact, two receivers can disagree about the same
      case. Treating it as an assertion keeps one place where the case history is
      decided.
    verification: Integration tests in `test/demo/` confirm that activities sent by
      non-CASE_MANAGER participants are routed through assertion intake and buffered
      as participant assertions before the CASE_MANAGER processes them into canonical
      ledger entries.
    stories:
    - story_2026_040
  - id: CLP-01-002
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A receiver MUST read a participant's ordinary activity in a case or proto-case
      flow as an assertion from the sender's role and the message's path alone; the
      protocol defines no separate "asserted mode" marker for it.
    rationale: >-
      The sender's role and the path of the message already show that a participant's
      activity is an assertion. A separate marker adds a field that every sender must
      set and every receiver must check, and a missing marker would then change the
      meaning of an ordinary message.
    stories:
    - story_2026_011
  - id: CLP-01-003
    priority: MUST
    kind: protocol
    statement: The CASE_MANAGER MUST be the only actor that emits canonical case-history
      entries used by replicas
    rationale: >-
      Replicas agree only when they copy one history. If more than one actor can write
      entries that replicas apply, two actors can write different entries at the same
      position, and the replicas fork. One writer gives one order with no consensus
      step.
    verification: 'Integration tests in `test/demo/` confirm that every `CaseLedgerEntry`
      in the canonical ledger is authored by the CASE_MANAGER: the `actor` on the enclosing
      `Announce(CaseLedgerEntry)` transport always matches `case_actor_id`.'
    stories:
    - story_2026_023
    - story_2022_106
  - id: CLP-01-004
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: Participant replicas MUST NOT project shared case state directly from
      peer assertions
    rationale: >-
      A peer's activity is an assertion that the CASE_MANAGER has not yet admitted. A
      replica that applies it directly can hold state that the ledger never records, so
      it drifts from every other replica. Replicas stay equal only when each change
      comes from a ledger entry.
    stories:
    - story_2026_002
- id: CLP-02
  title: Canonical `CaseLedgerEntry`
  specs:
  - id: CLP-02-001
    priority: MUST
    kind: protocol
    statement: For each case-resolvable assertion the CASE_MANAGER admits at the
      case layer, it MUST append a canonical `CaseLedgerEntry`
    rationale: >-
      The ledger is the case history that every replica copies. An admitted assertion
      with no entry changes the case at the CASE_MANAGER only, and no replica can learn
      of it. One entry for each admitted assertion keeps the replicas complete.
    verification: Integration tests in `test/demo/` confirm that after each protocol-significant
      activity is processed at the case layer, the CASE_MANAGER's ledger grows by exactly
      one new `CaseLedgerEntry` for that case.
    stories:
    - story_2026_069
    - story_2022_074
  - id: CLP-02-002
    priority: MUST
    kind: protocol
    statement: '`CaseLedgerEntry` MUST be a canonical content object distinct from
      any transport envelope used to replicate it'
    rationale: >-
      The transport envelope changes from one delivery to the next. It has a different
      id, recipient and time each time. The hash chain must cover content that is the
      same for every holder. If the entry and its envelope are one object, a redelivery
      changes the content that the hash covers.
    verification: Inspection of `vultron/core/models/case_ledger_entry.py` confirms
      that `CaseLedgerEntry` is a standalone Pydantic model that shares no inheritance
      with the `Announce` transport wrapper and can be serialized and validated independently.
    stories:
    - story_2026_072
  - id: CLP-02-003
    priority: MUST
    kind: protocol
    statement: >-
      `CaseLedgerEntry` MUST include the asserted activity payload as its
      `payloadSnapshot`, containing all fields required for deterministic replay: the
      received body for an activity the CASE_MANAGER received, or the body it delivered
      for one it emits (CLP-07-011, VM-08-003).
    rationale: >-
      A replica rebuilds the case only from what the entry carries. If the entry holds
      a reference or a summary in place of the activity, a replica must find the rest
      somewhere else, and two replicas can find different things. The full activity
      lets every replica replay the same change.
    verification: '`test/adapters/driven/trigger_activity_adapter/test_ledger_records.py` confirms that
      each `CaseLedgerEntry` the CASE_MANAGER authors contains a non-empty `payloadSnapshot`
      that round-trips through `model_validate` on the corresponding wire vocabulary class,
      and `test/core/use_cases/received/test_verbatim_received_snapshot.py` confirms the
      same of a received entry.'
    adr:
    - ADR-0107
    stories:
    - story_2026_057
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-07-011
    see_also:
    - spec_id: VM-08-003
      reason: 'context for the reader'
  - id: CLP-02-004
    priority: MUST
    kind: protocol
    statement: >-
      Every `CaseLedgerEntry` records a canonical admitted assertion; a
      `CaseLedgerEntry` MUST NOT carry a disposition, a reason code or a reason detail,
      because the ledger contains only admitted entries (see CLP-04-007).
    rationale: >-
      A refusal never becomes an entry (CLP-04-007), so a disposition field could only
      ever hold one value. A field like this invites code to write refused entries and
      readers to filter them. Without it, every entry is a change that every replica
      must apply.
    verification: Inspection of `vultron/core/models/case_ledger_entry.py` confirms
      that `CaseLedgerEntry` declares no `disposition`, `reason_code`, or
      `reason_detail` field.
    stories:
    - story_2026_071
    relationships:
    - rel_type: derives_from
      spec_id: CLP-04-007
  - id: CLP-02-005
    priority: MUST
    kind: protocol
    verification: >-
      `test/architecture/test_received_tree_refusal_notice.py` builds every
      received tree as it runs and asserts that each one that commits to a case
      and has a precondition guard holds exactly one refusal notice among the
      refusal effects of its guard stage, unless it was built with a registered
      `RefusalNoticeExemption`; it pins which tree passes each exemption, each
      with its reason and the node that answers instead, and pins with a
      reason every received tree that commits nothing.
      `test/core/use_cases/received/test_refusal_notice.py` drives production
      trees end to end: a refused RM regression and a refused `Add(Note)` at
      the CASE_MANAGER each queue one `Reject` of the refused activity to its
      sender and commit nothing of it, and a sender-guard refusal queues none.
    statement: >-
      When a precondition guard at the CASE_MANAGER refuses an incoming assertion, the
      CASE_MANAGER MUST send a `Reject` protocol activity to the asserting participant
      (CLP-05-001). The refusal itself is never written to the ledger (CLP-04-007). A
      refusal at a door guard gets no `Reject` — the post-close boundary (CM-23-013),
      the addressee check (HP-01-005), the path stage (HP-01-039) or the closed-sender
      door (CM-23-018) — and neither does a refusal by the sender guard (HP-01-006).
    rationale: >-
      The refused participant must learn that it was refused and why, so it can stop
      waiting for its entry. A refusal changes nothing in the case, and a ledgered
      refusal would put a non-event into every replica's hash chain. A sender that is
      not entitled to make the assertion is owed no answer (HP-01-006, ADR-0141). A
      closed case's CASE_MANAGER acts like an exited process, and a `Reject` of a late
      activity could read as a protocol decision (CM-23-013, ADR-0131).
    adr:
    - ADR-0131
    - ADR-0141
    stories:
    - story_2026_040
    relationships:
    - rel_type: uses_definition
      spec_id: CM-23-013
    - rel_type: uses_definition
      spec_id: HP-01-005
    - rel_type: uses_definition
      spec_id: CM-23-018
    - rel_type: uses_definition
      spec_id: HP-01-006
    see_also:
    - spec_id: CLP-04-007
      reason: 'context for the reader'
    - spec_id: HP-01-039
      reason: >-
        a link would close a loop through HP-01-039, HP-01-038, HP-01-035 and CLP-10-010
  - id: CLP-02-006
    priority: MUST
    kind: protocol
    statement: '`CaseLedgerEntry` MUST include a `log_index` field corresponding to
      SYNC-01-002.'
    rationale: >-
      A replica uses the index to find its position in the ledger and to see a missing
      entry. Without an index on each entry, a replica cannot tell a gap from the end
      of the ledger.
    verification: Inspection of `vultron/core/models/case_ledger_entry.py` confirms
      that `CaseLedgerEntry` declares a `log_index` field, and integration tests confirm
      it is populated on every committed entry.
    stories:
    - story_2022_074
    relationships:
    - rel_type: uses_definition
      spec_id: SYNC-01-002
  - id: CLP-02-008
    priority: MUST
    kind: protocol
    statement: >-
      The `log_index` field of a `CaseLedgerEntry` MUST be assigned by the CASE_MANAGER
      alone, when it commits the entry.
    rationale: Centralising log_index assignment in the single authoritative write
      path prevents gaps, duplicates, and out-of-order index values that would break
      hash-chain integrity.
    verification: Unit tests for `CommitCaseLedgerEntryNode` confirm that `log_index`
      is assigned within the authoritative commit node and that no external code path
      sets this field directly on the entry before commit.
    stories:
    - story_2026_028
    - story_2022_074
  - id: CLP-02-009
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: The `log_index` field of a `CaseLedgerEntry` MUST NOT be assigned by
      external parties.
    rationale: Allowing external parties to set log_index would enable index spoofing,
      enabling forked or replayed ledger entries that corrupt the canonical append-only
      history.
    stories:
    - story_2026_023
  - id: CLP-02-007
    priority: MAY
    kind: protocol
    statement: '`CaseLedgerEntry` MAY include an optional `term` field reserved for
      Raft cluster use.'
    rationale: >-
      In Raft, each entry carries the term of the leader that wrote it, and nodes
      compare terms to find entries from an old leader. A reserved field lets a cluster
      add that value without a change to the entry format that single-node deployments
      also read.
  - id: CLP-02-010
    priority: SHOULD
    kind: project
    statement: In single-node deployments, the `term` field of a `CaseLedgerEntry`
      SHOULD be omitted or set to `null`.
    rationale: A single-node deployment has no Raft cluster; populating `term` in
      that context adds noise without meaning.
  - id: CLP-02-011
    priority: MUST
    kind: project
    statement: In multi-node CASE_MANAGER cluster deployments, the `term` field of a
      `CaseLedgerEntry` MUST be populated with the current Raft term at time of append.
    rationale: The Raft term anchors each ledger entry to the leader epoch in which
      it was written, enabling followers to detect stale leader writes during leader-change
      scenarios.
    verification: Integration tests confirm that `CaseLedgerEntry` objects produced
      in a multi-node CASE_MANAGER cluster deployment carry a non-null `term` field equal
      to the Raft term at the time of append.
    stories:
    - story_2026_028
    - story_2022_106
  - id: CLP-02-012
    priority: MUST
    kind: protocol
    statement: >-
      Every text that describes the case ledger MUST use "Accept" and "Reject" only as
      the names of the AS2 activities. The CASE_MANAGER's verdict on whether an
      assertion enters the ledger is *admitted* or *refused*. The rules that keep
      refusals off the ledger (CLP-02-005, CLP-04-007) govern that verdict,
      not the `Reject` activity.
    rationale: >-
      The same word cannot name both the ledger verdict and an AS2 activity. If it does,
      a reader takes "a refusal is not ledgered" to mean "a Reject is not ledgered", and
      builds a handler that drops a participant's decline.
    verification: >-
      `test/architecture/test_ledger_verdict_wording.py` scans the specs, notes, docs
      and code for the ledger verdict worded as accepted or rejected, and fails on each
      use outside the glossary entry that declares the phrases.
    stories:
    - story_2026_071
    see_also:
    - spec_id: CLP-02-005
      reason: 'context for the reader'
    - spec_id: CLP-04-007
      reason: 'context for the reader'
  - id: CLP-02-016
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER admits a participant's `Reject` or `TentativeReject` of a
      request, it MUST commit a `CaseLedgerEntry` for it under CLP-02-001. The request
      is an `Offer` or an `Invite`, and the matching `Accept` gets an entry the same
      way.
    rationale: >-
      A participant's decline is a case event: it closes a request and reply pair, and
      the ledger must record that (CLP-11-001). If the decline has no entry, every
      replica keeps the request open.
    verification: >-
      `test_ownership_transfer_reject_commits_an_entry` in
      `test/architecture/test_ledger_fidelity_planned.py` confirms the
      ownership-transfer `Reject` handler reaches a canonical commit.
      `test_transferee_reject_is_ledgered_and_broadcast` in
      `test/core/use_cases/received/actor/test_ownership.py` and
      `test_reject_is_committed_and_announced_with_no_grant` in
      `test/core/use_cases/received/actor/test_role_offer_routing.py` confirm the
      admitted `Reject` commits an entry.
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-02-012
    - rel_type: refines
      spec_id: CLP-02-001
    stories:
    - story_2026_069
  - id: CLP-02-013
    priority: MUST
    kind: protocol
    statement: >-
      Each activity the CASE_MANAGER admits at the case layer is a case event, which it
      MUST ledger (CLP-02-001), unless this list exempts it. Activities processed before
      a case exists are not case events, such as report submission and case proposal
      intake. RK is not one: it answers the reporter's Offer outside the case and never
      goes to the CASE_MANAGER (RMB-08-005). A replica's receipt of
      `Announce(CaseLedgerEntry)` is not one, because it applies an entry and asserts
      none. Activities about the ledger itself are not case events: the CASE_MANAGER's
      refusal notice (CLP-05-001) and a replica's `Reject(CaseLedgerEntry)` that asks
      for redelivery. A replica's receipt of `Announce(VulnerabilityCase)` is not one,
      which CLP-10-034 leaves unledgered (ADR-0111). An activity only the CASE_MANAGER
      sends is not a case event where a participant receives it. Examples are the
      bootstrap `Create(VulnerabilityCase)`, its `Announce(EmbargoEvent)` notice, and
      its `Accept` or `Reject` of a recommender's `Offer(Actor)`. A participant never
      commits (CLP-01-003), so such an activity is ledgered, if it is a case event,
      where the CASE_MANAGER sends it. The bootstrap `Create(VulnerabilityCase)` is the
      case's genesis entry itself (CLP-07-011). A `Create(ProcessingFault)` NACK
      (ADR-0080) is not one, because it reports on message handling and changes nothing
      in the case. A late embargo `Accept` is not one when the case has no embargo for
      it to bind (EMB-17-015). It changes nothing at any receiver (ADR-0152). Nor is a
      message whose meaning the receiver does not recognize, or whose object it cannot
      resolve.
    rationale: >-
      A closed list makes each activity with no entry a recorded decision, not the
      choice of one handler. A coverage test then has a fixed set of grounds for an
      exemption. A handler that runs only at a participant has no commit to reach. An
      activity that changes nothing at any receiver is an observation, not an act. An
      entry for it would record a fact that every holder of the ledger can already
      derive.
    verification: >-
      The CLP-09-003 coverage test, marked `CLP-02-013`, exempts a routed use case
      only on one of these grounds or by naming an open issue. The no-op late
      `Accept` is a path within a committing use case, so EMB-17-004's tests
      assert it commits nothing.
    relationships:
    - rel_type: refines
      spec_id: CLP-02-001
    - rel_type: uses_definition
      spec_id: CLP-05-001
    - rel_type: uses_definition
      spec_id: CLP-07-011
    adr:
    - ADR-0152
    - ADR-0157
    stories:
    - story_2026_069
    see_also:
    - spec_id: CLP-01-003
      reason: 'context for the reader'
    - spec_id: CLP-10-034
      reason: 'context for the reader'
    - spec_id: EMB-17-015
      reason: 'context for the reader'
    - spec_id: RMB-08-005
      reason: 'context for the reader'
  - id: CLP-02-017
    priority: MUST
    kind: protocol
    statement: >-
      An author MUST add a new kind of activity that carries no ledger entry to the
      CLP-02-013 list before any handler leaves it unledgered.
    rationale: >-
      A closed list makes each activity with no entry a recorded decision, not the
      choice of one handler. A coverage test then has a fixed set of grounds for an
      exemption.
    verification: >-
      `test_every_ground_is_listed_in_clp_02_013_first` in
      `test/architecture/test_ledger_commit_coverage.py` pins the coverage test's
      exemption grounds to the kinds the CLP-02-013 statement lists, so a new ground
      fails until the statement names it.
    relationships:
    - rel_type: extends
      spec_id: CLP-02-013
    adr:
    - ADR-0152
    stories:
    - story_2026_069
  - id: CLP-02-014
    priority: MUST
    kind: protocol
    statement: >-
      `CaseLedgerEntry` MUST carry the entry's semantic type under the wire key
      `semanticType`.
    rationale: >-
      The field holds a semantic type, the registry's label for the entry's payload
      (ADR-0140), and the glossary lists "event type" as a term to avoid for it.
    verification: >-
      `test_entry_serializes_semantic_type_under_semantic_type_key` in
      `test/core/models/test_case_ledger_entry_semantic_type.py` confirms that a
      `CaseLedgerEntry` serializes its semantic type under `semanticType`.
    adr:
    - ADR-0140
    stories:
    - story_2026_011
  - id: CLP-02-018
    priority: MUST
    kind: protocol
    statement: >-
      The entry hash of a `CaseLedgerEntry` MUST cover the entry's semantic type under
      the key `semantic_type`.
    rationale: >-
      Every holder recomputes the entry hash to verify the chain. If the hash did not
      cover the semantic type, a holder could relabel an entry and still pass the check,
      and two holders could disagree on what an entry means.
    verification: >-
      `test_chain_record_hashes_semantic_type_under_field_name` in
      `test/core/models/test_case_ledger_entry_semantic_type.py` confirms that a
      `HashChainLedgerRecord` hashes the value under `semantic_type` and verifies its
      own hash.
    relationships:
    - rel_type: extends
      spec_id: CLP-02-014
    adr:
    - ADR-0140
    stories:
    - story_2026_023
  - id: CLP-02-015
    priority: MUST
    kind: project
    statement: >-
      This codebase's `CaseLedgerEntry` and `HashChainLedgerRecord` MUST name their
      semantic-type field `semantic_type` (CLP-02-014).
    rationale: >-
      Received events carry the same value as `VultronEvent.semantic_type`, so one name
      serves both sides.
    verification: >-
      `test_chain_record_hashes_semantic_type_under_field_name` in
      `test/core/models/test_case_ledger_entry_semantic_type.py` confirms that a
      `HashChainLedgerRecord` carries the value as `semantic_type`.
    relationships:
    - rel_type: implements
      spec_id: CLP-02-014
    adr:
    - ADR-0140
- id: CLP-03
  title: Audit Scope and Continuity
  specs:
  - id: CLP-03-001
    priority: MUST
    kind: protocol
    statement: Only assertions that can be resolved to a specific case MUST be appended
      to the case audit ledger
    rationale: >-
      Every entry belongs to the hash chain of one case. An assertion that no case can
      claim has no chain to join, and an entry for it would break the rule that a
      ledger holds only the history of its own case.
    verification: Integration tests in `test/demo/` confirm that activities lacking
      a resolvable case ID are dropped before reaching `CommitCaseLedgerEntryNode`
      and produce no `CaseLedgerEntry` in the ledger.
    stories:
    - story_2026_071
    - story_2022_074
  - id: CLP-03-002
    priority: MUST
    kind: protocol
    statement: Malformed, unauthenticated, or otherwise unrouteable inbound messages
      that cannot be attached to a report or case MUST be handled outside the case
      audit ledger
    rationale: >-
      A message that the receiver cannot attach to a case tells the case nothing. It is
      a transport or sender problem, and the receiver's own log is the place to record
      it. If it went into a case ledger, any sender could add noise to a case it has no
      part in.
    verification: Integration tests in `test/demo/` confirm that malformed or unauthenticated
      inbound messages are handled in a pre-ledger error path and that no `CaseLedgerEntry`
      is written for them.
    stories:
    - story_2026_071
    - story_2022_089
- id: CLP-04
  title: Canonical Ledger and Replication
  specs:
  - id: CLP-04-001
    priority: MUST
    kind: protocol
    statement: The authoritative history of a case MUST be the append-only canonical
      ledger; every entry in it records a protocol-significant admitted assertion.
      The ledger contains no refused or locally-scoped entries (see CLP-04-007).
    rationale: >-
      Replicas agree only when they share one source of history. If any other record
      could also define the case history, two holders could each follow a different
      source and disagree with no way to decide which is correct.
    verification: >-
      `test_close_report_on_an_open_case_is_refused` in
      `test/core/use_cases/received/test_close_report_on_case.py` confirms that a
      refused assertion leaves no `CaseLedgerEntry`, and
      `test_no_case_ledger_gains_an_entry_for_a_divergence_fault` in
      `test/core/use_cases/received/test_embargo_consent_copy.py` confirms that a
      locally scoped processing fault reaches no case ledger.
    stories:
    - story_2026_071
    - story_2026_023
    see_also:
    - spec_id: CLP-04-007
      reason: 'context for the reader'
  - id: CLP-04-002
    priority: MUST
    kind: protocol
    statement: Case-state reconstruction MUST use only the canonical case ledger;
      refused assertions are never committed to the ledger and therefore require
      no filter during reconstruction.
    rationale: >-
      A replica that rebuilds case state from any other source can get a different
      answer from every other replica. Because the ledger holds no refusals, a replay
      needs no filter, and so no filter rule can differ between implementations.
    verification: Integration tests in `test/demo/` confirm that case-state
      reconstruction reads exclusively from the canonical case ledger.
    stories:
    - story_2026_057
  - id: CLP-04-003
    priority: MUST
    kind: protocol
    statement: Replicated hash chains, Merkle proofs, and replay state MUST be computed
      over the canonical case ledger; because the ledger contains only admitted
      canonical entries, no disposition filtering is required during chain computation.
    rationale: >-
      Two holders must compute the same hash for the same history. If each holder first
      had to filter entries, a different filter rule would give a different hash for
      the same case. A ledger with only admitted entries removes that step.
    verification: >-
      The case-ledger invariant harness (`test/ci/invariants/universal_harness.py`)
      checks, for every replica of every scenario, that each entry's `prevLogHash` is
      the `entryHash` of the entry before it
      (`test_invariant_1_local_hash_chain_consistent`), and that all replicas agree on
      the `entryHash` at each shared `logIndex`
      (`test_invariant_2_cross_actor_hash_agreement`).
    stories:
    - story_2026_023
    - story_2022_089
  - id: CLP-04-004
    priority: MUST
    kind: protocol
    statement: CASE_MANAGER fan-out replication MUST deliver the canonical `CaseLedgerEntry`
      content, wrapped in an ActivityStreams transport envelope such as `Announce`
    rationale: >-
      A replica must check the entry hash against the content that the CASE_MANAGER
      committed. If fan-out sends a rebuilt or summarized form, the replica cannot
      verify the chain. The envelope only carries the entry, so the entry stays the
      same for every recipient.
    verification: Integration tests in `test/demo/` confirm that each canonical ledger
      entry replicated from the CASE_MANAGER arrives at participants wrapped in an `Announce(CaseLedgerEntry)`
      ActivityStreams activity.
    stories:
    - story_2026_075
    - story_2022_041
  - id: CLP-04-005
    priority: SHOULD
    kind: protocol
    statement: When a participant includes log-position context with an assertion,
      it SHOULD use the last canonical hash or position the sender holds from the
      canonical case ledger
    rationale: >-
      A participant and the CASE_MANAGER compare positions to find a replica that lags.
      A position from any other source, such as the participant's own pending records,
      names a point that the canonical chain does not have.
    stories:
    - story_2026_005
  - id: CLP-04-006
    priority: MUST
    kind: protocol
    statement: >-
      Implementations MUST derive case participant membership and case state only from
      the canonical recorded log, never from any other source.
    rationale: >-
      Membership and case state decide who receives case content and what each
      participant may do. If any other source could set them, two replicas at the same
      ledger position could disagree about who is in the case.
    verification: Integration tests in `test/demo/` confirm that participant membership
      lists and case state values are derived exclusively from the canonical recorded
      log rather than from any other data source such as the outbox or actor-local
      state.
    stories:
    - story_2026_057
  - id: CLP-04-007
    priority: MUST
    kind: protocol
    statement: >-
      The case ledger MUST contain only canonical admitted entries, never a refusal
      from any processing path.
    rationale: >-
      Every replica applies every entry. A refusal in the ledger would make each replica
      tell a refusal from a change, and an implementation that fails to do this would
      apply a change that never happened. The hash chain would also depend on traffic
      that the CASE_MANAGER did not admit. A refusal is recorded in the process log. A
      refusal by a precondition guard is also answered with a refusal notice
      (CLP-02-005).
    verification: >-
      `test/core/models/test_case_ledger.py::test_entry_carries_no_disposition_fields`
      asserts that a `CaseLedgerEntry` has no disposition, reason-code or reason-detail
      field and refuses one, and
      `test/core/use_cases/received/test_close_report_on_case.py::test_close_report_on_an_open_case_is_refused`
      asserts a refused assertion adds no ledger entry.
    stories:
    - story_2026_071
    - story_2026_023
    - story_2026_002
  - id: CLP-04-008
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST surface through structured logging each refusal (CLP-04-007),
      including a received `CaseLedgerEntry` whose hash its content does not reproduce
      (SYNC-03-006) and a case copy that conflicts with the replica's chain
      (SYNC-16-006), both at ERROR, and each received processing fault reporting a
      failure to apply a `CaseLedgerEntry` (SYNC-16-002). Its freshness-gate and
      tail-reconstruction helpers (`is_ledger_fresh_for_case`, `reconstruct_tail_hash`)
      read the ledger directly and apply no disposition filter.
    rationale: >-
      A refusal leaves no ledger entry (CLP-04-007), so the log is the only record that
      it happened. A hash refusal or a conflicting case copy means a replica and the
      CASE_MANAGER disagree, which needs an operator, so it is logged at ERROR. The
      freshness and tail helpers must read the ledger as stored, because a filter there
      could hide an entry the chain depends on.
    verification: >-
      `test/core/behaviors/sync/test_announce_tree.py::test_replica_refuses_entry_whose_hash_does_not_match_content`
      asserts the ERROR record of a hash refusal;
      `test/core/use_cases/received/test_processing_fault_received.py::test_received_fault_is_logged_naming_its_sender_and_fault`
      asserts the WARNING record of a received fault;
      `test/core/behaviors/sync/test_divergence_recovery.py::test_a_copy_that_conflicts_with_the_chain_is_refused_at_error`
      asserts the ERROR record of a conflicting copy; and
      `test/core/test_sync_helpers.py` confirms the two helpers over a ledger of
      canonical entries only.
    relationships:
    - rel_type: uses_definition
      spec_id: SYNC-03-006
    - rel_type: uses_definition
      spec_id: SYNC-16-002
    - rel_type: uses_definition
      spec_id: SYNC-16-006
    see_also:
    - spec_id: CLP-04-007
      reason: 'logging a refusal is not how refusals are kept off the ledger'
- id: CLP-05
  title: Refusal Handling
  description: >-
    What the CASE_MANAGER does with an assertion it refuses to admit to the ledger.
    "Refused" is the CASE_MANAGER's ledger verdict, not the AS2 `Reject` activity: a
    participant's `Reject` answering a request is a case event and is admitted and
    ledgered like any other (CLP-02-012).
  specs:
  - id: CLP-05-001
    priority: MUST
    kind: protocol
    verification: >-
      `test/core/use_cases/received/test_refusal_notice.py` asserts that the factory
      queues one notice of this shape on a precondition refusal at the CASE_MANAGER,
      with the refused activity embedded as received, and that an event naming no
      refused activity is refused at construction;
      `test/wire/as2/test_refusal_notice_wire.py` asserts the notice carries the refused
      activity inline.
    statement: >-
      The refusal notice that CLP-02-005 requires MUST be a `Reject` whose object is the
      refused activity, inline. It names that activity's id in `inReplyTo`, is addressed
      to the asserting participant alone, and carries the refusing guard's reason in
      `summary`.
    rationale: >-
      A refused sender should learn that it was refused and why, and stop
      waiting for its assertion to be committed. One shape for every refused
      activity needs one emitter and one receiving use case (CS-22-001). A
      `Reject` of an `Invite` or an `Offer` already means a decline, and a
      decline and a refusal leave the sender in the same place, so the shapes
      need not differ.
    note: >-
      The notice is the refusal's one answer. A refused `Add(CaseStatus)` or
      `Add(ParticipantStatus)` gets no `Create(ProcessingFault)` beside it,
      since a guard's refusal is "received and understood but declined"
      (MSM-05-001; #4756). The replica's ImpossibleState fault for a ledger
      entry it cannot apply (RSH-09-006) is a different failure and stays.
    adr:
    - ADR-0141
    stories:
    - story_2026_040
    relationships:
    - rel_type: refines
      spec_id: CLP-02-005
  - id: CLP-05-004
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST derive the id of a refusal notice from its own id and the
      refused activity's id.
    rationale: >-
      A derived id lets a redelivery of the refused activity find the notice already
      sent, so the participant gets one notice, not one per delivery (HP-01-014).
    verification: >-
      `test_a_precondition_refusal_queues_one_refusal_notice` in
      `test/core/use_cases/received/test_refusal_notice.py` asserts the notice's id is
      derived from the CASE_MANAGER and the refused activity.
    relationships:
    - rel_type: extends
      spec_id: CLP-05-001
    adr:
    - ADR-0141
    stories:
    - story_2026_014
  - id: CLP-05-005
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST send one refusal notice for every refusal by a precondition
      guard (CLP-10-022).
    rationale: >-
      A refused sender should learn that it was refused and why, and stop waiting for
      its assertion to be committed.
    verification: >-
      `test_a_precondition_refusal_queues_one_refusal_notice` in
      `test/core/use_cases/received/test_refusal_notice.py` asserts one notice is queued
      to the asserting participant on a precondition refusal.
    relationships:
    - rel_type: refines
      spec_id: CLP-02-005
    adr:
    - ADR-0141
    stories:
    - story_2026_040
  - id: CLP-05-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT send a refusal notice for a refusal at a door guard
      (the post-close boundary, the addressee check, the path stage or the
      closed-sender door) or by the sender guard (HP-01-006). Nor does it send one for
      a repeat of an activity it already processed.
    rationale: >-
      A sender that is not entitled to make the assertion is owed no answer (HP-01-006,
      ADR-0141). A repeat was already answered, so a second notice adds nothing and
      could contradict an effect already in place.
    verification: >-
      `test_a_sender_guard_refusal_queues_no_notice`,
      `test_a_skipped_repeat_answer_under_a_new_id_queues_no_notice` and
      `test_a_redelivery_queues_no_second_notice` in
      `test/core/use_cases/received/test_refusal_notice.py` assert that no notice is
      queued in each case.
    adr:
    - ADR-0141
    stories:
    - story_2026_040
    relationships:
    - rel_type: refines
      spec_id: CLP-02-005
    - rel_type: uses_definition
      spec_id: HP-01-006
  - id: CLP-05-007
    priority: MUST
    kind: protocol
    statement: >-
      A participant that receives a refusal notice MUST close the pending assertion it
      recorded for the refused activity.
    rationale: >-
      The notice is the answer the participant waits for. If the pending record stays
      open, it blocks a correct new assertion until it times out.
    verification: >-
      `test_the_participant_closes_its_pending_assertion` in
      `test/core/use_cases/received/test_refusal_notice.py` asserts the pending
      assertion is closed.
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-05-001
    adr:
    - ADR-0141
    stories:
    - story_2026_040
  - id: CLP-05-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant that receives a refusal notice MUST NOT write case state, or send
      the assertion again, because of it (CLP-06-005).
    rationale: >-
      A refusal changes nothing in the case, so a write would put state into the replica
      that no entry records. A re-send would repeat a refused assertion with no new
      decision behind it.
    verification: >-
      `test_the_participant_writes_no_case_state_and_sends_nothing` in
      `test/core/use_cases/received/test_refusal_notice.py` asserts the participant
      writes no case state and queues nothing.
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-05-001
    adr:
    - ADR-0141
    stories:
    - story_2026_040
    see_also:
    - spec_id: CLP-06-005
      reason: 'context for the reader'
  - id: CLP-05-009
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST process the CASE_MANAGER's `Reject` of its own `Invite` or
      `Offer` as the decline of that request, which closes the pending entry.
    rationale: >-
      A `Reject` of an `Invite` or an `Offer` has the same shape as a decline of that
      request. A decline and a refusal leave the sender in the same place, because
      either way the request had no effect, so the shapes need not differ.
    verification: >-
      `test_a_reject_of_an_invite_or_an_offer_is_not_the_notice` in
      `test/wire/as2/test_refusal_notice_wire.py` asserts the notice's pattern takes no
      `Reject` of an `Invite` or an `Offer`;
      `test_case_managers_reject_closes_the_pending_proposal` in
      `test/core/use_cases/received/test_pending_refusal.py` asserts the CASE_MANAGER's
      `Reject(Invite(EmbargoEvent))` closes the proposer's pending entry.
    adr:
    - ADR-0141
    stories:
    - story_2026_040
  - id: CLP-05-003
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection confirms local tracking and duplicate-detection markers are held in
      per-actor stores such as `PendingAssertionStore` and that no code path constructs
      a `CaseLedgerEntry` for one.
    statement: >-
      Implementations MUST NOT record local-only tracking markers or duplicate-detection
      markers as `CaseLedgerEntry` objects of any kind; such markers belong in ephemeral
      per-actor state, not in the canonical ledger.
    rationale: >-
      A duplicate marker or a local tracking marker is one actor's working state. If it
      is an entry, it replicates to every participant and becomes part of the hash
      chain. Then the chain depends on the timing of one actor's processing and not on
      the case history.
    stories:
    - story_2026_002
- id: CLP-06
  title: Pending Assertion Suppression
  specs:
  - id: CLP-06-001
    priority: SHOULD
    kind: protocol
    statement: Participant actors SHOULD maintain actor-local pending assertion state
      for recently emitted case-scoped assertions that are awaiting canonical `CaseLedgerEntry`
      confirmation
    rationale: >-
      A participant waits for its own assertion to come back as an entry. If it does
      not record that it is waiting, its behavior can send the same assertion again
      before the entry arrives. A short local record stops these duplicate sends.
    adr:
    - ADR-0018
    stories:
    - story_2026_014
  - id: CLP-06-002
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms no participant-membership or case-state reconstruction path
      reads the pending-assertion store; reconstruction reads the canonical ledger only.
    statement: >-
      This codebase MUST NOT treat pending assertion state as canonical case history,
      such as by reading it to reconstruct participant membership or case state.
    rationale: >-
      A pending assertion is only the participant's guess about what the CASE_MANAGER
      will admit. The CASE_MANAGER can refuse it. If a replica reads its own pending
      records as history, it shows a change that the ledger may never record.
    adr:
    - ADR-0018
  - id: CLP-06-003
    priority: MUST
    kind: project
    statement: >-
      Implementations that provide pending assertion suppression MUST make its timeout
      configurable.
    rationale: >-
      The time for an entry to come back depends on the deployment and the network. A
      fixed value is too short for some deployments and too long for others. A default
      gives a working start, and the setting lets an operator tune it.
    verification: >-
      A unit test in `test/core/models/test_pending_assertion.py` confirms that a
      constructor argument overrides the pending assertion suppression store's timeout
      with any positive value.
    adr:
    - ADR-0018
  - id: CLP-06-007
    priority: SHOULD
    kind: project
    statement: >-
      The default timeout of pending assertion suppression SHOULD be 180 seconds.
    rationale: >-
      A default gives a working start. 180 seconds covers an entry's usual round trip
      with room to spare, so a normal delay does not time out.
    verification: >-
      A unit test in `test/core/models/test_pending_assertion.py` confirms that the
      store's timeout defaults to 180 seconds.
    relationships:
    - rel_type: extends
      spec_id: CLP-06-003
    adr:
    - ADR-0018
  - id: CLP-06-004
    priority: MUST
    kind: project
    statement: >-
      When a pending assertion reaches its timeout without a matching canonical
      confirmation, this codebase MUST move it to a timed-out state.
    rationale: >-
      An assertion that gets no entry and no refusal notice is a fault that someone
      must look at. If it stays pending, it stops later sends with no visible reason.
      The timed-out state releases it, and the error log shows the operator that
      something failed.
    verification: >-
      A unit test in `test/core/models/test_pending_assertion.py` confirms that when a
      pending assertion's suppression window elapses without a matching canonical
      confirmation, the entry moves to a timed-out state.
    adr:
    - ADR-0018
  - id: CLP-06-008
    priority: MUST
    kind: project
    statement: >-
      When a pending assertion times out without a matching canonical confirmation, this
      codebase MUST log the timeout at ERROR.
    rationale: >-
      An assertion that gets no entry and no refusal notice is a fault that someone must
      look at. The error log shows the operator that something failed.
    verification: >-
      A unit test in `test/core/models/test_pending_assertion.py` confirms that a
      timed-out pending assertion emits an error-level log message.
    relationships:
    - rel_type: extends
      spec_id: CLP-06-004
    adr:
    - ADR-0018
  - id: CLP-06-005
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms the pending-assertion timeout path only marks the entry timed
      out and logs, and never queues a fresh assertion emission.
    statement: >-
      Pending assertion timeout handling MUST NOT send an assertion again itself; only a
      later behavior evaluation decides whether to send it.
    rationale: >-
      An automatic retry can send an assertion that the participant does not want at
      that time, or that is wrong for the case at that time. The behavior tree knows
      the current state and decides again. A timer does not know the current state.
    adr:
    - ADR-0018
  - id: CLP-06-006
    priority: MUST
    kind: project
    statement: A pending assertion entry MUST be cleared when a matching canonical
      `CaseLedgerEntry` is observed, or when the CASE_MANAGER's refusal notice for
      the assertion arrives (CLP-05-001)
    rationale: >-
      A pending record that stays after the answer arrives stops the participant from
      sending a correct new assertion. Both the entry and the refusal notice end the
      wait, so both must clear the record.
    verification: A unit test confirms that when an announced `CaseLedgerEntry`
      matching a pending assertion arrives, that assertion entry is immediately
      removed from the pending store; for the refusal notice,
      `test/core/use_cases/received/test_pending_refusal.py::test_case_managers_reject_closes_the_pending_proposal`
      confirms the CASE_MANAGER's `Reject(Invite(EmbargoEvent))` removes the
      proposer's pending entry.
    adr:
    - ADR-0018
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-05-001
- id: CLP-07
  title: Canonical Entry Criteria and Ledger/Process-Log Separation
  specs:
  - id: CLP-07-001
    priority: MUST
    kind: protocol
    statement: >-
      A `CaseLedgerEntry` committed to the canonical case ledger MUST correspond to
      exactly one CASE_MANAGER-accepted protocol-significant assertion. A state change
      the CASE_MANAGER itself writes is such an assertion, with the CASE_MANAGER as
      asserter. An example is the RM transitions it records for a leaving participant
      (CM-23-022).
    rationale: >-
      Each entry is one fact that every replica applies once. An entry that records no
      admitted assertion, or that records more than one, makes replicas apply something
      the CASE_MANAGER never decided, or lose part of what it decided. A change the
      CASE_MANAGER writes itself is also a fact, so it needs an entry like any other.
    verification: Integration tests in `test/demo/` confirm that each protocol-significant
      assertion accepted by the CASE_MANAGER produces exactly one new `CaseLedgerEntry`
      in the canonical ledger, with no duplicate entries for the same protocol event.
    adr:
    - ADR-0019
    stories:
    - story_2026_070
    see_also:
    - spec_id: CM-23-022
      reason: 'context for the reader'
  - id: CLP-07-011
    priority: MUST
    kind: protocol
    statement: >-
      The `payloadSnapshot` of a `CaseLedgerEntry` MUST be the verbatim AS2 activity
      that was asserted, with no field of it dropped, re-serialized, inlined, patched or
      merged. For an activity the CASE_MANAGER received, it is the JSON body as received
      (VM-08-002). For one the CASE_MANAGER emits, it is the body it delivered
      (VM-08-003). An activity the CASE_MANAGER sends and ledgers is one activity. So
      the case's genesis entry is the `Create(VulnerabilityCase)` it sends for the case,
      not a second activity built for the ledger. The metadata the CASE_MANAGER adds
      lives on the entry, outside the snapshot: the index, the hashes, the commit and
      receipt times, and `case_id`.
    rationale: >-
      The payload snapshot is the replication substrate, and the entry hash covers it, so
      what it holds is what every replica treats as the event. A snapshot rebuilt from the
      receiver's object graph records the receiver's reconstruction, not what the sender
      claimed, and every rewrite is one more thing a replica must reproduce exactly to
      verify a hash (ADR-0107).
    verification: >-
      `test/adapters/driven/trigger_activity_adapter/test_ledger_records.py` confirms that
      for every `CaseLedgerEntry` the CASE_MANAGER authors, the `payloadSnapshot` field
      contains a valid AS2 activity that revalidates through its wire vocabulary class via
      `model_validate` without transformation.
      `test/core/use_cases/received/test_verbatim_received_snapshot.py` confirms that a
      received entry's snapshot equals the received body, key order included, revalidates
      through its wire class without transformation, and is what a replica records.
      `test_the_delivered_create_is_the_genesis_entry` in
      `test/core/use_cases/received/test_one_genesis_create.py` and
      `test_the_sent_create_is_the_genesis_entry` in
      `test/core/use_cases/triggers/case/test_create.py` confirm that, on both
      creation paths, the queued `Create(VulnerabilityCase)` body equals the genesis
      entry's snapshot (ADR-0157).
    adr:
    - ADR-0107
    - ADR-0157
    stories:
    - story_2026_072
    relationships:
    - rel_type: uses_definition
      spec_id: VM-08-002
    - rel_type: refines
      spec_id: VM-08-003
  - id: CLP-07-012
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: The `payloadSnapshot` of a `CaseLedgerEntry` MUST NOT be empty.
    rationale: An empty payload snapshot breaks deterministic
      replay and makes it impossible for replica nodes to reconstruct the case state
      from the canonical log.
    adr:
    - ADR-0019
    stories:
    - story_2026_005
  - id: CLP-07-002
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit at most one `CaseLedgerEntry` for each logical state
      change. It never commits both an admitted participant assertion and an entry of
      its own for the same change. An act and the state transitions the CASE_MANAGER
      records as its consequence are different facts, not the same state change. For
      example, the `close_case` entry records a received Leave (CM-23-021). The status
      entries after it record the RM transitions the Leave caused (CM-23-022).
    rationale: >-
      A replica applies each entry. Two entries for one change make it apply the change
      twice, and the ledger then shows two facts where there is one. An act and the
      transitions it causes are different facts, so each one gets its own entry.
    verification: Integration tests in `test/demo/` confirm that each logical state
      change produces at most one `CaseLedgerEntry`; no test scenario produces both
      an admitted-participant-assertion entry and a separately-synthesized CASE_MANAGER
      entry for the same state change. The case-ledger invariant harness
      (`test/ci/invariants/universal_harness.py`) asserts, for every replica of every
      scenario, that no two entries carry the same `payloadSnapshot.id`, and
      `test/ci/invariants/test_common.py` confirms that the check flags an Invite
      committed twice (ADR-0109).
    adr:
    - ADR-0109
    - ADR-0124
    - ADR-0019
    stories:
    - story_2026_070
    see_also:
    - spec_id: CM-23-021
      reason: 'context for the reader'
    - spec_id: CM-23-022
      reason: 'context for the reader'
  - id: CLP-07-013
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit every change it makes to the case file as its own
      `CaseLedgerEntry`, never making a change that has no committed entry. The act's
      entry comes first. When the act's own activity states a change, that entry is the
      change's entry, and applying it writes only what the activity states. Examples are
      `Add(Note)[target=VulnerabilityCase]` carrying the note, and an invitee's `Accept`
      of the stub Invite marking its own consent and joining. A decision the
      CASE_MANAGER takes from local policy or the clock may change the case file. Such a
      decision is committed as the change it makes, before the change is made. A
      decision that changes nothing is not committed, such as noticing that a deadline
      has passed or that a closure is complete (ADR-0152). Moving the case's ledger
      position (`ledgerPosition`) to an entry as it is committed (SYNC-16-005) is part
      of applying that entry. It is not a change to the case file of its own, and takes
      no entry.
    rationale: >-
      Two replicas at the same ledger position must hold the same case file, and a
      replica infers nothing. If a change is not in the ledger, it did not happen
      (ADR-0124). One act can cause several changes, such as a stub Invite and the
      participant record it creates for the invitee. If only the act is recorded, each
      replica must create the record itself, with its own ids and clock times. Full
      records are ledger content that the hash chain must cover (CLP-07-006).
    verification: >-
      A rebuild-from-ledger check replays the CASE_MANAGER's ledger into an empty
      store and asserts that the roster, every participant record (consent rows
      and every participant status included, ids and times too), the case
      statuses and the embargo register, each termination's cause included,
      equal the CASE_MANAGER's. It runs after every in-process exchange demo and
      every per-actor-store scenario; the multi-container scenario demos are
      covered by those in-process equivalents.
      `test/core/use_cases/received/test_rebuild_from_ledger.py`,
      `test/demo/test_rebuild_from_ledger.py` and
      `test/demo/test_establish_embargo_demo.py` pin it. A test per
      consequence-producing act asserts that the act's own entry carries its whole
      register step and that one entry per other changed record (each consent row
      as its own `Create` or `Update`) follows it.
    relationships:
    - rel_type: extends
      spec_id: CLP-07-002
    - rel_type: uses_definition
      spec_id: SYNC-16-005
    adr:
    - ADR-0124
    - ADR-0152
    stories:
    - story_2026_070
  - id: CLP-07-021
    priority: MUST
    kind: protocol
    statement: >-
      Each change an act causes, beyond what the act's own activity states, MUST follow
      the act's entry as its own CASE_MANAGER-authored entry. The entries follow in the
      order the CASE_MANAGER writes them. Each one's `payloadSnapshot` carries the
      object in full (CLP-07-006). It is a `Create` of a record the CASE_MANAGER brings
      into existence, or an `Update` of a changed record.
    rationale: >-
      One act can cause several changes, such as a stub Invite and the participant
      record it creates for the invitee. If only the act is recorded, each replica must
      create the record itself, with its own ids and clock times, and replicas at one
      ledger position then differ. Full records are ledger content that the hash chain
      must cover (CLP-07-006).
    verification: >-
      `test_the_default_embargo_follows_the_genesis_entry_in_full` in
      `test/core/use_cases/received/test_rebuild_from_ledger.py` asserts the
      CASE_MANAGER's own entry carries the record in full right after the act's entry.
      `test_a_new_row_is_a_create_and_a_changed_row_an_update` in
      `test/core/behaviors/embargo/test_decided_entries.py` asserts a new record is a
      `Create` and a changed one an `Update`.
    relationships:
    - rel_type: extends
      spec_id: CLP-07-013
    adr:
    - ADR-0124
    stories:
    - story_2026_070
    see_also:
    - spec_id: CLP-07-006
      reason: 'context for the reader'
  - id: CLP-07-014
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT commit case bookkeeping to the case ledger. Case
      bookkeeping is the records the CASE_MANAGER keeps alongside a case while it works
      it, such as who recommended whom, offer records and pending markers. It is not
      part of the case file.
    rationale: >-
      The case file is what replicates, and "same ledger position, same case file"
      covers only the case file. If bookkeeping is stored on the case or read to
      compute a case-file value, replicas at the same position can disagree on a value
      that no entry carried.
    verification: >-
      `test_case_bookkeeping_is_not_a_case_field` in
      `test/architecture/test_ledger_fidelity_planned.py` asserts no case bookkeeping
      field is a field of `VulnerabilityCase`, and
      `test/core/models/test_actor_recommendation_record.py` asserts the recommendation
      record is not part of the case and has no wire rendering.
    adr:
    - ADR-0124
    stories:
    - story_2026_071
  - id: CLP-07-022
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER and every replica MUST NOT read case bookkeeping (CLP-07-014) to
      compute any case-file value.
    rationale: >-
      The case file is what replicates, and "same ledger position, same case file"
      covers only the case file. If a case-file value is computed from bookkeeping,
      replicas at the same position can disagree on a value that no entry carried.
    verification: >-
      `test_a_negotiated_revision_rebuilds_from_the_ledger_alone` in
      `test/core/use_cases/received/test_rebuild_from_ledger.py` rebuilds the case file
      from the ledger alone, with no case bookkeeping, and asserts it equals the
      CASE_MANAGER's.
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-07-014
    - rel_type: refines
      spec_id: CLP-04-006
    adr:
    - ADR-0124
    stories:
    - story_2026_057
  - id: CLP-07-015
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST commit an act's entries atomically, together with the
      case-file changes they carry and every consequence the act commits. So when any of
      them fails, none of them is written. Such consequences include a re-issued stub
      Invite, a relayed Invite with its invitee's row, a closure step's status entry,
      and a notice it queues. For a received act, the act's own entry is one of those
      entries.
    rationale: >-
      An act commits its own entry and one entry for each change it causes
      (CLP-07-013). If they commit one at a time, a failure part-way keeps the act and
      loses some of its consequences, a state no single act produces. Nothing commits
      the missing parts later: a repeated trigger starts a new act, and an idempotency
      guard stops a redelivered one. So an act succeeds or fails as a whole (ADR-0146).
      A received act's own entry is in the same transaction (ADR-0151), so a failed
      received act keeps nothing and a later delivery runs it again.
    verification: >-
      A test fails the second commit of a two-entry act and asserts the CASE_MANAGER
      keeps no entry, no queued activity and no row change from it; a test fails the
      case-file save after the commits and asserts no entry is kept; a test commits a
      two-entry act and asserts a replica that copies its announcements holds the
      CASE_MANAGER's rows; tests fail the stub re-issue after a termination and an
      accept, and the relay after the CASE_MANAGER's own proposal and a received one,
      and assert the act keeps none of its consequences. Tests fail a received
      withdrawal's row commit and a received proposal's relay and assert the received
      act's own entry is not kept, and that a redelivery of the proposal is applied, in
      process and through the FastAPI inbox (#4933). Tests fail the relay to a joiner
      and a reinstated participant's embargo Invite and assert the act keeps no joined
      mark, consent row, outbox entry or ledger entry, and that a redelivery through the
      FastAPI inbox is processed afresh, as is a failed role-Offer forward's; tests fail
      a Leave's closure step and assert no close_case entry is kept.
    relationships:
    - rel_type: extends
      spec_id: CLP-07-013
    adr:
    - ADR-0146
    - ADR-0151
    stories:
    - story_2026_078
  - id: CLP-07-023
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse an embargo act, before it writes anything, when any
      of the act's entries will not apply.
    rationale: >-
      An entry that will not apply would fail part-way through the act's commits.
      Finding it before the first write keeps the act whole, so a failed embargo act
      leaves nothing behind (ADR-0146).
    verification: >-
      `test_timely_guard_trial_applies_the_step_the_remove_names` in
      `test/core/behaviors/embargo/test_end_time_nodes.py` asserts that a step that will
      not apply refuses the act before any commit.
    relationships:
    - rel_type: extends
      spec_id: CLP-07-015
    adr:
    - ADR-0146
    stories:
    - story_2026_078
  - id: CLP-07-016
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST run an act's commits and every later node of the act's tree in
      one DataLayer transaction (CLP-07-015). For a received act, the guarded commit of
      the received activity runs in the same transaction as the consequences the act's
      tree commits after it.
    rationale: >-
      One transaction is the default of every received tree that commits to a case, and
      a tree does not need to ask for it. A new tree therefore cannot lose it by
      accident.
    verification: >-
      An architecture test in
      `test/architecture/test_embargo_consequences_in_one_act.py` asserts every received
      tree that commits runs its own entry and every node after it in one
      `ActTransaction`, or names a registered exemption, held to equality with a pinned
      set in both directions (#4983); `test/core/behaviors/test_act_transaction.py`
      asserts a later child's failure keeps nothing.
    relationships:
    - rel_type: implements
      spec_id: CLP-07-015
    adr:
    - ADR-0146
  - id: CLP-07-024
    priority: MAY
    kind: project
    statement: >-
      A received tree MAY commit outside the act's transaction (CLP-07-016) only when it
      names a registered, reasoned exemption.
    rationale: >-
      A named exemption makes each tree that commits outside the transaction a recorded
      decision with a reason, which the architecture test pins.
    verification: >-
      `test/architecture/test_embargo_consequences_in_one_act.py` holds the registered
      exemptions to equality with a pinned set in both directions.
    relationships:
    - rel_type: supersedes
      spec_id: CLP-07-016
    adr:
    - ADR-0146
  - id: CLP-07-025
    priority: MUST
    kind: project
    statement: >-
      For an embargo act, this codebase MUST trial-apply every entry before the act's
      first commit (CLP-07-023).
    rationale: >-
      A trial apply before the first commit finds an embargo entry that will not apply
      while nothing is written yet.
    verification: >-
      `test_timely_guard_trial_applies_the_step_the_remove_names` in
      `test/core/behaviors/embargo/test_end_time_nodes.py` asserts the trial apply runs
      before any commit.
    relationships:
    - rel_type: implements
      spec_id: CLP-07-023
    adr:
    - ADR-0146
  - id: CLP-07-003
    priority: MUST
    kind: protocol
    statement: >-
      The `payloadSnapshot.actor` of a `CaseLedgerEntry` MUST name the original
      asserting actor, never the CASE_MANAGER in a participant asserter's place. The
      CASE_MANAGER's identity appears on the transport envelope and in recording
      metadata. When the CASE_MANAGER also holds a participant role in the case, its
      identity in `payloadSnapshot.actor` is the correct asserter identity. A state
      change the CASE_MANAGER writes itself names the CASE_MANAGER, its true asserter.
      The RM status entries after a `close_case` entry (CM-23-022) are of this kind. The
      leaving participant's own act stays attributed to them in the `close_case` entry
      (CM-23-021).
    rationale: >-
      Replicas apply each entry as the act of the actor that the snapshot names. If the
      CASE_MANAGER puts its own identity there, the act is attributed to the wrong
      participant, and its effects land on the wrong record. Authority is a role, not an
      identity (ADR-0088), so a CASE_MANAGER that also holds a participant role can
      assert as that participant.
    verification: >-
      `test_case_manager_as_participant_commits_without_error` in
      `test/core/behaviors/case/nodes/test_lifecycle.py` confirms that a CASE_MANAGER
      who also participates in a case can add entries (e.g. `Add(Note)`) without error.
      A further test there confirms that the status entries committed after a
      `close_case` entry carry the CASE_MANAGER as `payloadSnapshot.actor` and commit
      without error, while the `close_case` entry itself names the leaving participant.
    adr:
    - ADR-0088
    - ADR-0019
    stories:
    - story_2026_072
    - story_2022_089
    see_also:
    - spec_id: CM-23-021
      reason: 'context for the reader'
    - spec_id: CM-23-022
      reason: 'context for the reader'
  - id: CLP-07-017
    priority: MUST
    kind: protocol
    statement: >-
      In an entry that records a received activity, `payloadSnapshot.actor` MUST name
      the same actor as the received activity's `actor`. The two are compared as
      normalized actor ids. A state change the CASE_MANAGER writes itself has no
      received activity, so this comparison does not apply to it.
    rationale: >-
      Any other mismatch shows that one identity was put in place of another. Comparing
      normalized ids keeps a trailing slash from reading as a different actor.
    verification: >-
      `test_actor_identity_mismatch_returns_failure` in
      `test/core/behaviors/case/nodes/test_lifecycle.py` verifies that
      `lifecycle.CommitCaseLedgerEntryNode` raises `VultronCanonicalEntryError` when
      `payloadSnapshot.actor` does not match the inbound activity's `actor_id`, and
      `test_slash_spelled_snapshot_actor_commits` there that it commits when the two
      differ only by a trailing slash.
    relationships:
    - rel_type: refines
      spec_id: CLP-07-003
    adr:
    - ADR-0088
    - ADR-0019
    stories:
    - story_2026_072
    - story_2022_089
  - id: CLP-07-004
    priority: MUST_NOT
    kind: protocol
    verification: >-
      Inspection confirms no code path commits a `CaseLedgerEntry` for a diagnostic,
      demo checkpoint, verification marker or other per-actor observability event; such
      events go to the process log.
    statement: >-
      The canonical case ledger MUST NOT contain runtime diagnostics, demo checkpoints,
      synthetic verification markers, troubleshooting events, or any per-actor observability
      content; such content belongs in each actor's own logs.
    rationale: >-
      The ledger replicates to every participant and the hash chain covers it.
      Diagnostics and checkpoints depend on one actor's runtime. If they enter the
      ledger, replicas must filter them, and the chain changes when the timing of a run
      changes. An actor's own log can hold any detail with no effect on the protocol.
    adr:
    - ADR-0019
    stories:
    - story_2026_002
  - id: CLP-07-005
    priority: SHOULD
    kind: project
    statement: The CASE_MANAGER commit boundary SHOULD enforce CLP-07-001 through CLP-07-004
      with a runtime guard that rejects non-canonical entries before they enter the
      hash chain, failing fast rather than silently polluting replicated history
    rationale: >-
      A guard at the commit boundary stops a non-canonical entry before it enters the
      hash chain. After that point every replica holds the entry and no fix can remove
      it. The guard's signature set must list every activity a CASE_MANAGER
      legitimately ledgers, such as `Offer(CaseParticipantRole)` (ADR-0039). A missing
      signature makes the guard refuse a valid assertion.
    adr:
    - ADR-0019
    relationships:
    - rel_type: implements
      spec_id: CLP-07-001
    - rel_type: implements
      spec_id: CLP-07-004
    - rel_type: implements
      spec_id: CLP-07-002
    - rel_type: implements
      spec_id: CLP-07-003
  - id: CLP-07-006
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST record each nested object of a `payloadSnapshot` exactly as
      the asserted activity carried it, never inlining, resolving or replacing a
      reference. An entry the CASE_MANAGER authors carries in full every object it
      records. A received entry is the received body (CLP-07-011). So an object is
      inline where its sender inlined it, as a sender does every object its recipient
      cannot be expected to hold. It is bare where its sender named an object the case's
      replicas already hold (AKM-02-002). A replica that does not hold an object named
      by reference dereferences it.
    rationale: >-
      A protocol rule, not this prototype's inline-object shortcut (AKM-03-003): the entry
      hash covers the `payloadSnapshot` and nothing outside it, so an object carried in
      full is under the hash every participant verifies, and an object named by id is
      only identified by it. Filling a reference in at the CASE_MANAGER would put the
      receiver's reconstruction in place of what was sent, and a replica could not tell
      the sender's claim from the fill-in (ADR-0107).
    verification: >-
      `test/adapters/driven/trigger_activity_adapter/test_ledger_records.py` confirms
      that nested objects such as `EmbargoEvent`, `VulnerabilityReport`, and `Note`
      appear as fully inlined AS2 objects in the snapshots the CASE_MANAGER authors.
      `test/core/use_cases/received/test_verbatim_received_snapshot.py` confirms that a
      byte-for-byte change to a received body changes the recorded snapshot and that a
      change to the receiver's store does not, and that a bare case reference is
      recorded bare.
    adr:
    - ADR-0107
    - ADR-0124
    stories:
    - story_2026_072
    see_also:
    - spec_id: AKM-02-002
      reason: 'context for the reader'
    - spec_id: CLP-07-011
      reason: 'context for the reader'
  - id: CLP-07-018
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT refuse an entry for a bare reference anywhere but the
      snapshot's own `object`, whose type is half of the entry's signature.
    rationale: >-
      A sender may name by id any object the case's replicas already hold (AKM-02-002),
      so a bare reference elsewhere is a valid entry. Only the snapshot's own `object`
      must be inline, because its type selects the entry's signature.
    verification: >-
      `test_bare_target_equal_to_the_case_uri_is_accepted`,
      `test_bare_target_naming_the_case_is_accepted_when_nested`,
      `test_a_bare_reference_nested_in_the_object_is_recorded_as_received` and
      `test_bare_object_is_still_refused` in
      `test/core/behaviors/sync/nodes/test_canonical_entry.py` confirm a bare `target`,
      at the top level or nested, and a bare reference nested in the object are
      accepted, and a bare `object` is refused.
    relationships:
    - rel_type: derives_from
      spec_id: CLP-07-006
    adr:
    - ADR-0107
    stories:
    - story_2026_072
  - id: CLP-07-007
    priority: MUST
    kind: protocol
    statement: >-
      Once a case exists, the builder of a case-scoped activity MUST set its `context`
      to the case URI, never to a report URI. A `ParticipantStatus` activity is one such
      activity.
    rationale: >-
      The obligation falls on whoever builds the activity. A received snapshot is the
      body as sent (CLP-07-011), so the CASE_MANAGER neither writes a `context` in nor
      rewrites one; the commit boundary refuses a `context` naming another case, and
      the entry names its case on the envelope (`case_id`), so a snapshot that names no
      `context`, such as the Offer that opened the case, is still that case's entry.
    verification: Integration tests in `test/demo/` confirm that `CaseLedgerEntry`
      objects created after report-to-case promotion carry the case URI (not the report
      URI) as the `payloadSnapshot.context` field for case-scoped entries such as
      `ParticipantStatus`.
    stories:
    - story_2026_062
    - story_2022_030
  - id: CLP-07-009
    priority: MUST
    kind: project
    statement: >-
      A `payloadSnapshot` MUST be in the wire (AS2) shape, so that the wire vocabulary
      class for its `type_` can revalidate it without translation. So must every object
      carried inline in one (CLP-07-006). A received activity's snapshot is the received
      body itself (CLP-07-011). It is already in the wire shape, and nothing renders it.
    rationale: >-
      The snapshot is the replication content, and receivers must rebuild it
      (CLP-01-003, CLP-01-004, CLP-07-011). A core object that is dumped directly gives
      core field names or the wrong structure, which a receiver cannot read. The
      rendering port is the one place that produces the wire shape, so every type is
      rendered the same way.
    verification: For each canonical entry produced by the test suite, `payloadSnapshot`
      and each inlined nested object revalidate through their wire vocabulary class
      via `model_validate`, with no key renaming applied first.
    relationships:
    - rel_type: derives_from
      spec_id: CLP-07-011
    adr:
    - ADR-0063
    see_also:
    - spec_id: CLP-07-006
      reason: 'context for the reader'
  - id: CLP-07-020
    priority: MUST
    kind: project
    statement: >-
      When this codebase captures a core domain object in a `payloadSnapshot`, it MUST
      produce the wire shape through the core→wire rendering port (ARCH-20-001). It
      never dumps the core object with `by_alias=True` or rewrites dumped keys in core.
    rationale: >-
      A core object that is dumped directly gives core field names or the wrong
      structure, which a receiver cannot read. The rendering port is the one place that
      produces the wire shape, so every type is rendered the same way.
    verification: >-
      `test/architecture/test_core_by_alias_dumps.py` fails on a `by_alias=True` call
      site under `vultron/core/` outside its pinned set, and
      `test_no_camel_case_dict_keys_in_core` in
      `test/adapters/driven/trigger_activity_adapter/test_ledger_records.py` fails on a
      camelCase key written into a dict in core.
    relationships:
    - rel_type: implements
      spec_id: CLP-07-009
    - rel_type: refines
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
  - id: CLP-07-010
    priority: MUST_NOT
    kind: project
    statement: Core snapshot-construction code MUST NOT special-case individual field
      names to reach the wire spelling (e.g. moving a nested `rm.state` to a flat `rmState`). Structural differences between the core and wire shapes
      are the responsibility of the rendering port (ARCH-20-001).
    rationale: A per-field patch in core is a partial reimplementation of the translator
      that drifts as either shape evolves, and it is invisible to the adapter layer's
      own round-trip tests. Each such patch also silently defines the canonical shape
      for exactly one type, leaving every other nested type unhandled.
    verification: No module under `vultron/core/` assigns a camelCase key into a snapshot
      dict.
    adr:
    - ADR-0063
    - ADR-0082
    relationships:
    - rel_type: refines
      spec_id: ARCH-20-001
- id: CLP-08
  title: Per-Case Genesis Hash Derivation and Origin Binding
  specs:
  - id: CLP-08-001
    priority: MUST
    kind: protocol
    statement: >-
      Each case ledger MUST use a per-case genesis hash, never a globally-shared
      constant, as the predecessor hash of its first entry.
    rationale: 'A shared global constant provides no cryptographic origin-binding:
      a ledger with all entries stripped is indistinguishable from a legitimately
      new empty ledger, and the well-known constant enables sync DoS amplification
      by allowing full-replay requests without any case-specific knowledge'
    verification: Unit tests in `test/core/models/test_case_ledger.py` confirm that
      `CaseLedger.tail_hash` returns the case-specific genesis hash (not a global
      constant) when no recorded entries exist, and that a second case produces a
      different genesis hash.
    stories:
    - story_2026_073
    - story_2022_089
  - id: CLP-08-002
    priority: MUST
    kind: protocol
    statement: >-
      The per-case genesis hash MUST be derived as `SHA-256(case_id + "|" + created_at +
      "|" + owner_actor_id)`, where `case_id` is the canonical case URI, `created_at` is
      the case creation UTC timestamp (the case's `published`) in ISO 8601 format, and
      `owner_actor_id` is the actor id of the Case Owner, the case's `attributedTo` when
      the case is created. The same derivation applies on every creation path, including
      a case the CASE_MANAGER creates from the owner's `CaseProposal`.
    rationale: Including all three values cryptographically anchors the chain's
      starting point to the specific case's origin identity and timestamp,
      allowing any party who knows the case metadata to independently verify the
      ledger's genesis. The owner is the anchor because the CaseActor that may
      create the case is the owner's delegated proxy, so a case created by its
      owner and one created for the owner from a `CaseProposal` (CP-09-001,
      CM-02-008) start from the same identity. The decision is recorded in
      ADR-0117.
    verification: A unit test confirms that `compute_genesis_hash(case_id,
      created_at, owner_actor_id)` returns the SHA-256 hex digest of the
      concatenated string `case_id + "|" + format_timestamp(created_at) + "|" +
      owner_actor_id`, the time in the fixed six-digit form (CS-13-007). A unit
      test confirms that a case created from a
      `CaseProposal` and a case its owner constructs with the same `case_id`,
      `created_at` and owner carry the same hash, and that the owner's replica
      built from the `Create(VulnerabilityCase)` keeps the sender's hash
      unchanged.
    adr:
    - ADR-0117
    stories:
    - story_2026_073
    - story_2022_089
  - id: CLP-08-003
    priority: MUST
    kind: protocol
    statement: The case-specific genesis hash MUST be stored on `VulnerabilityCase`
      as a required field computed at case creation time, so that receivers can verify
      that a ledger starts correctly for this case
    rationale: >-
      A receiver checks the first entry of a ledger against the genesis hash. If the
      case does not carry the hash, each receiver must compute it again from fields it
      may not hold in the same form, and two receivers can get different values. A
      field set at creation gives every receiver the same value.
    verification: Inspection of `vultron/core/models/` confirms that `VulnerabilityCase`
      declares `genesis_hash` as a required field, and integration tests confirm it
      is populated with the per-case genesis hash at case creation time.
    stories:
    - story_2026_073
  - id: CLP-08-004
    priority: MUST
    kind: protocol
    statement: >-
      A case ledger that holds no recorded entries MUST report the case-specific genesis
      hash as its tail hash, never a globally-shared constant sentinel.
    rationale: >-
      A shared constant is the same for every case. An empty ledger that reports it
      cannot show which case it belongs to, and the empty ledger of one case looks the
      same as the empty ledger of any other case. The per-case hash makes an empty
      ledger specific to its case.
    verification: Unit tests in `test/core/models/test_case_ledger.py` confirm that
      `CaseLedger.tail_hash` returns the per-case genesis hash when the recorded entry
      list is empty and returns the hash of the last recorded entry otherwise.
    stories:
    - story_2026_073
  - id: CLP-08-005
    priority: MUST
    kind: protocol
    statement: >-
      A replay or backfill request that supplies a `from_hash` MUST start from the
      case-specific genesis hash, or from the hash of a known recorded entry.
    rationale: >-
      A starting hash tells the CASE_MANAGER where the requester's copy ends. Only the
      genesis hash and the hashes of real entries name a position in the chain.
    verification: >-
      `test_last_accepted_hash_from_the_ledger_position` in
      `test/core/use_cases/received/test_reject_sync.py` confirms a requester states the
      entry hash of its ledger position, and
      `test_an_empty_ledgers_stated_position_starts_from_genesis` in
      `test/core/test_sync_helpers.py` confirms a requester holding no entry states the
      case-specific genesis hash.
    stories:
    - story_2026_047
  - id: CLP-08-008
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST treat a replay or backfill request whose `from_hash` names
      no recorded entry as a request to replay from the start.
    rationale: >-
      A value that names no known position cannot be trusted, so a full replay from the
      start is the only safe answer. The genesis hash is no entry's own hash, so it also
      replays from the start.
    verification: >-
      `test_a_position_that_names_no_entry_replays_from_the_start` in
      `test/core/behaviors/sync/nodes/test_replay.py` confirms that a replay request
      whose position is the genesis hash, or a hash that names no recorded entry,
      replays the ledger from its first entry.
    relationships:
    - rel_type: refines
      spec_id: CLP-08-005
    stories:
    - story_2026_047
  - id: CLP-08-006
    priority: MUST
    kind: protocol
    statement: The case URI used for origin-binding MUST contain a cryptographically
      random UUID component in its path segment to satisfy the non-spoofability guarantee
      of the per-case genesis hash (e.g., `https://example.org/cases/<uuid>`).
    rationale: A cryptographically random path segment makes the genesis hash unique
      and unguessable per case, so a ledger with all entries stripped is distinguishable
      from a legitimately new empty ledger.
    verification: Static analysis (grep) confirms that the case URI factory generates
      case URIs containing a UUID4 component in the path segment; unit tests assert
      that newly created case URIs parse to a valid UUID4.
    stories:
    - story_2026_073
    - story_2022_030
  - id: CLP-08-007
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: Implementations MUST NOT use sequentially predictable or human-chosen
      path segments in the case URI when origin-binding integrity is required.
    rationale: Predictable or human-chosen path segments allow an attacker to pre-compute
      a valid genesis hash and construct a forged chain. See `notes/case-ledger-authority.md`
      for future improvement paths (secret nonce, CASE_MANAGER keypairs).
    stories:
    - story_2026_023
- id: CLP-09
  title: Commit Authorization and Coverage
  specs:
  - id: CLP-09-001
    priority: MUST
    kind: project
    statement: >-
      Every call site of the canonical commit operation MUST reach it only through a
      role-gated composition, never through a comparison of actor identities. At
      invocation, that composition checks that the active actor holds
      `CVDRole.CASE_MANAGER` for the case.
    rationale: >-
      Any call site that can commit without a check can write an entry from an actor
      that is not the CASE_MANAGER, and that forks the chain. A check that compares
      identities fails when one actor holds more than one role, because authority comes
      from the role (ADR-0088). A role check inside the tree runs for each call site,
      and the tests can see it.
    verification: Unit tests for `GuardedCommitCaseLedgerEntryBT` confirm that the
      commit node only executes when the active actor's role list includes `CVDRole.CASE_MANAGER`,
      and integration tests in `test/demo/` confirm no unauthorized commit reaches
      the ledger.
    stories:
    - story_2026_023
    - story_2022_046
    relationships:
    - rel_type: refines
      spec_id: BT-10-004
  - id: CLP-09-002
    priority: MUST_NOT
    kind: project
    statement: The canonical commit operation MUST NOT be invoked directly (bare,
      unguarded) from any production call site outside the guarded-commit composition
      itself.
    rationale: >-
      A commit that does not go through the guard can write an entry from an actor that
      is not the CASE_MANAGER. That forks the chain. When there is one path to the
      commit, a check in one place covers every call site.
    verification: A dedicated test enumerates known commit call sites (or greps for
      the unguarded commit node's class name) and fails if any usage outside the guarded-commit
      factory's own implementation is found.
  - id: CLP-09-003
    priority: MUST
    kind: project
    statement: >-
      Every protocol-significant use case or BT subtree (per BT-06-001) MUST reach a
      canonical commit for its act. It reaches one more for each further change it makes
      to the case file (CLP-07-013).
    rationale: >-
      A use case that reaches no commit changes the case at the CASE_MANAGER only, and
      no replica learns of it. A manual audit finds such gaps late and one at a time. A
      test over every routed use case finds a missing commit when it is added, as the
      dispatch tests do for routing (DR-02-002, UCORG-02-002).
    verification: >-
      A test under `test/architecture/`, marked `CLP-09-003`, enumerates every use case
      reachable via `use_case_map()` and asserts, using the static commit inventory in
      `test/architecture/_ledger_commit_inventory.py`, that each one reaches a canonical
      commit or carries a CLP-02-013 exemption.
    stories:
    - story_2026_069
    - story_2022_074
    relationships:
    - rel_type: uses_definition
      spec_id: BT-06-001
    - rel_type: derives_from
      spec_id: CLP-07-013
  - id: CLP-09-005
    priority: MUST
    kind: project
    statement: >-
      A coverage test MUST enumerate the protocol-significant entries, such as
      everything reachable from `use_case_map()`, and assert that each one reaches a
      commit (CLP-09-003).
    rationale: >-
      A manual audit finds a missing commit late and one at a time. A test over every
      routed use case finds it when the use case is added, as the dispatch tests do for
      routing (DR-02-002, UCORG-02-002).
    verification: >-
      `test_every_routed_use_case_reaches_a_commit_or_is_exempt` in
      `test/architecture/test_ledger_commit_coverage.py` enumerates every use case
      `use_case_map()` routes to and asserts each one reaches a commit or is exempt.
    relationships:
    - rel_type: verifies
      spec_id: CLP-09-003
    stories:
    - story_2026_069
    - story_2022_074
  - id: CLP-09-006
    priority: MUST
    kind: project
    statement: >-
      The coverage test (CLP-09-005) MUST exempt a use case only on a CLP-02-013 ground,
      or by naming an open issue that tracks its missing commit.
    rationale: >-
      An exemption with no ground hides a missing commit from the test that exists to
      find it. A CLP-02-013 ground or an open issue makes every exemption a recorded
      decision.
    verification: >-
      `test_exemptions_name_a_ground_or_an_issue` in
      `test/architecture/test_ledger_commit_coverage.py` fails an exemption that names
      neither a CLP-02-013 ground nor an open issue.
    relationships:
    - rel_type: extends
      spec_id: CLP-09-005
    - rel_type: uses_definition
      spec_id: CLP-02-013
    stories:
    - story_2026_069
  - id: CLP-09-004
    priority: MUST
    kind: project
    statement: >-
      One use-case class may run as more than one receiving actor for one logical
      activity, such as a relayed copy delivered to a second participant. This codebase
      MUST then evaluate commit authorization per invocation, against the active actor's
      role. It never assumes the authorization from the use-case class's identity, or
      from an earlier authorized invocation.
    rationale: >-
      One use case can run more than once for one activity, for example at the
      CASE_MANAGER and at a participant that receives a relayed copy. Only the
      CASE_MANAGER may commit. If the check runs once and its result is reused, a later
      run as a participant can commit too, and the chain forks.
    verification: Unit tests such as
      `test/core/use_cases/received/test_note_routing_guard.py` run the same
      use-case class with the CASE_MANAGER and with another participant as the
      receiver of one activity and confirm that only the CASE_MANAGER invocation
      produces a canonical ledger entry.
    stories:
    - story_2026_023
    - story_2022_046
- id: CLP-10
  title: CASE_MANAGER Inbox Routing for Canonical Ledger Entry Authorship
  description: Requirements for the end-to-end routing path that delivers protocol-significant
    activities to the CASE_MANAGER's inbox so the CASE_MANAGER can author canonical ledger
    entries. Covers outbound addressing rules, the rule that the CASE_MANAGER commits its
    own emissions in the emitting tree rather than addressing a copy to itself
    (ADR-0109), and the rule that a received-side use case runs its tree only as the
    receiving actor.
  specs:
  - id: CLP-10-001
    priority: MUST
    kind: protocol
    statement: >-
      Every protocol-significant act a participant originates MUST send at least one
      activity to the case's CASE_MANAGER. The CASE_MANAGER can then author a canonical
      ledger entry for it. A participant reaches the CASE_MANAGER only by sending it the
      participant's own activity, never by acting as the CASE_MANAGER (CM-24-010,
      CM-24-011, ADR-0109). The CASE_MANAGER is a participant with extra duties, so its
      own acts reach the ledger too, as CLP-10-031 and CLP-10-032 state.
    rationale: >-
      The CASE_MANAGER is the only writer of the ledger, and it writes only what it
      receives or sends. An act that sends nothing to the CASE_MANAGER has no entry,
      and no replica learns of it. When the CASE_MANAGER originates an act, it commits
      the entry in the tree that sends the activity. A copy to itself would come back
      through its inbox and could be committed a second time. Only the container that
      hosts the CASE_MANAGER may act as it (ADR-0109).
    note: A tree that emits under a `CVDRole.CASE_MANAGER` gate and wraps the emit in
      `create_receive_activity_tree` with a `case_id` commits the entry itself
      (CLP-10-013), so a self-addressed copy would add no record — see EMB-19-001 for
      the worked case, where addressing the manager also made the announce reach
      nobody.
    verification: For each entry in `EXPECTED_SEMANTIC_TYPES`, a test verifies that the
      CASE_MANAGER's canonical ledger contains at least one entry with that `semanticType`
      after a full rv demo run.
    adr:
    - ADR-0021
    - ADR-0109
    stories:
    - story_2026_059
    - story_2022_046
    see_also:
    - spec_id: CLP-10-032
      reason: 'context for the reader'
    - spec_id: CM-24-010
      reason: 'context for the reader'
    - spec_id: CM-24-011
      reason: 'context for the reader'
  - id: CLP-10-031
    priority: MUST
    kind: protocol
    statement: >-
      When the CASE_MANAGER originates a protocol-significant activity, it MUST commit
      the canonical entry itself as it sends the activity. Inviting an actor to the case
      is one such activity.
    rationale: >-
      The CASE_MANAGER is the only writer of the ledger, and it writes only what it
      receives or sends. When it originates an act, it commits the entry in the tree
      that sends the activity, so the act has its entry with no round trip.
    verification: >-
      `test_note_is_recorded_and_announced_to_the_owner` in
      `test/core/behaviors/case/nodes/test_suggest_actor_owner_recipient.py` asserts the
      CASE_MANAGER's own note is committed to the ledger as it is announced.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-001
    adr:
    - ADR-0109
    stories:
    - story_2026_069
  - id: CLP-10-032
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST NOT address a copy of an activity it originates to itself in
      any addressing field.
    rationale: >-
      A copy to itself would come back through its inbox and could be committed a second
      time. Only the container that hosts the CASE_MANAGER may act as it (ADR-0109).
    verification: >-
      `test_the_manager_queues_nothing_to_itself` in
      `test/core/behaviors/embargo/nodes/test_abandon.py` asserts the CASE_MANAGER's
      tree queues no copy to itself.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-031
    adr:
    - ADR-0109
    stories:
    - story_2026_075
  - id: CLP-10-003
    priority: MUST_NOT
    kind: project
    statement: >-
      A received-side use case MUST NOT run a BT, or call the canonical commit
      operation, as any actor but `receiving_actor_id`. Passing a separately resolved
      `case_actor_id` to `BTBridge.execute_with_setup` from the wrong DataLayer context
      is identity spoofing of this kind.
    rationale: >-
      A use case runs in the store of the actor that received the activity. If it runs
      a tree as another actor, it writes that actor's state into a store that does not
      belong to it. The outbox items then carry the wrong sender, and the hash chain
      can fork. The receiving actor is the only identity the use case may act as.
    verification: A static grep check (or dedicated test) asserts that no received-side
      use case module passes a separately resolved actor ID to `BTBridge.execute_with_setup`
      — only `receiving_actor_id` (or a name that is provably equal to it) may appear
      as the `actor_id` argument.
    adr:
    - ADR-0021
  - id: CLP-10-004
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An `Announce(CaseLedgerEntry)` replication envelope MUST NOT itself be recorded as the
      `payloadSnapshot` of a canonical ledger entry; it is the envelope that carries
      canonical entries to participants, not a ledger event.
    rationale: >-
      The `Announce(CaseLedgerEntry)` envelope only delivers entries. An entry whose
      payload is the envelope would itself need an envelope to deliver it. Each
      delivery would then add one more entry with no end, and the hash chain would
      change with every delivery.
    verification: >-
      `test_exemptions_name_routed_use_cases_that_do_not_commit` in
      `test/architecture/test_ledger_commit_coverage.py` confirms that the received use
      case for `announce_case_ledger_entry` is exempt as a replica applying an entry and
      reaches no ledger commit, so an `Announce(CaseLedgerEntry)` is never committed as a
      canonical entry's `payloadSnapshot`.
    stories:
    - story_2026_002
  - id: CLP-10-023
    priority: MUST_NOT
    kind: project
    statement: >-
      The `announce_case_ledger_entry` semantic type MUST NOT appear in `EXPECTED_SEMANTIC_TYPES`
      for the case-actor canonical log.
    rationale: >-
      The invariant suite checks that the canonical log holds each expected semantic
      type. If that list named the ledger announcement, the suite would demand an entry
      whose snapshot is an `Announce(CaseLedgerEntry)`. CLP-10-004 forbids that entry,
      so the suite would then reward a broken ledger and fail a correct one.
    verification: >-
      `test_invariant_5_expected_semantic_types_present` (after parameterization) does not
      include `announce_case_ledger_entry` as a required semantic type for the case-actor
      replica.
    relationships:
    - rel_type: derives_from
      spec_id: CLP-10-004
  - id: CLP-10-005
    priority: MUST
    kind: project
    statement: >-
      A received-side use case MUST run exactly one BT per inbox delivery. A call that
      `execute()` reaches through any function or method defined under
      `vultron/core/use_cases/` or `vultron/core/services/`, resolved transitively,
      counts as a call by `execute()`. The catch-all for unrecognized semantics
      (`UnknownUseCase`) runs no tree. It is not a use case: it refuses the activity
      before any case is known. A buffered ledger entry that a commit or a case
      seed makes appliable is its own delivery (SYNC-14-009), never a second run in this
      one.
    rationale: >-
      Behavior trees exist to compose steps, and the tree is where the guards, the stage
      order and the checks can see each step. Python code that runs a second tree, or
      that chooses between trees, puts a protocol decision outside the tree. A helper
      that `execute()` calls is part of `execute()`, so the rule follows it. One tree
      from one factory keeps each decision where the architecture tests can check it
      (ADR-0022, ADR-0135).
    verification: '`test/architecture/test_single_bt_execution_received_side.py` greps
      every module under `vultron/core/use_cases/` for imports of `create_guarded_commit_case_ledger_entry_tree`;
      any match outside the guarded-commit factory''s own module is a violation. Known
      violations are tracked as a ratchet set (`KNOWN_VIOLATIONS`) that must shrink
      to empty as each use case migrates to the single-tree shape. Its hard invariant
      counts every `execute_with_setup()` call that an `execute()` under
      `vultron/core/use_cases/received/` reaches, directly or through functions and
      methods under `vultron/core/use_cases/` or `vultron/core/services/` resolved
      transitively over the call shapes `_use_case_call_graph.py` lists as followed
      (the walk shared with `test_no_dl_mutations_in_execute.py`), with a `self`
      or `super()` method dispatched in the concrete class''s method resolution
      order, sums calls on alternative branches, and asserts at most one, with no
      exemption set; a received `execute()` that reaches none is named in the exact
      `RUNS_NO_TREE` set, and every class `use_case_map()` routes to must appear in
      the count. Trigger-side `execute()` bodies are counted body-only, since their
      helpers are governed by BT-15-001. Detector self-tests on synthetic sources
      assert that a helper call, a helper two calls deep, two calls on alternative
      branches, a subclass override and a `super()` call are each counted, and that a
      call inside a BT node the tree runs is not. A reviewer MUST still confirm no
      other domain-significant code remains in `execute()` when closing each
      migration.'
    adr:
    - ADR-0021
    - ADR-0022
    - ADR-0135
  - id: CLP-10-028
    priority: MUST
    kind: project
    statement: >-
      A received-side use case's `execute()` MUST do exactly three things: build one BT
      via a tree-factory function in `vultron/core/behaviors/`, call
      `BTBridge.execute_with_setup()` exactly once with
      `actor_id=resolve_receiving_actor_id(self._dl, request.receiving_actor_id)` to run
      it, and handle the result (log or extract output per the Procedural Glue
      Exception).
    rationale: >-
      A fixed shape makes every received use case read the same way, so the one tree
      CLP-10-005 requires is easy to find and the receiving actor is resolved in one
      place for every delivery (ADR-0022).
    verification: >-
      `test/architecture/test_single_bt_execution_received_side.py` counts every
      `execute_with_setup()` call a received `execute()` reaches and asserts at most one;
      a reviewer confirms the rest of the shape when closing each migration.
    relationships:
    - rel_type: refines
      spec_id: CLP-10-005
    adr:
    - ADR-0022
  - id: CLP-10-029
    priority: MUST
    kind: project
    statement: >-
      Work that needs more than one tree MUST be composed into the one tree by its
      factory, never chosen between or run in sequence by Python control flow in the use
      case. Such work includes a door check, a clock decision (CLP-10-025), a refusal and
      an alternative branch.
    rationale: >-
      Python code that runs a second tree, or that chooses between trees, puts a protocol
      decision outside the tree, where the guards, the stage order and the architecture
      tests cannot see it (ADR-0135).
    verification: >-
      `test/architecture/test_single_bt_execution_received_side.py` sums the
      `execute_with_setup()` calls on alternative branches of a received `execute()` and
      asserts at most one; its detector self-tests assert that two calls on alternative
      branches are each counted.
    relationships:
    - rel_type: refines
      spec_id: CLP-10-005
    - rel_type: uses_definition
      spec_id: CLP-10-025
    adr:
    - ADR-0135
  - id: CLP-10-030
    priority: MUST_NOT
    kind: project
    statement: >-
      A received-side use case's `execute()` MUST NOT do domain-significant work beyond
      running its one tree. That work includes a direct DataLayer mutation, a second
      `execute_with_setup()` call, and a direct import or call of
      `create_guarded_commit_case_ledger_entry_tree` or any other guarded-commit factory.
    rationale: >-
      Work done in `execute()` runs outside the tree's guards and stage order. A guarded
      commit called from `execute()` lets procedural code decide whether the commit runs
      (ADR-0021, ADR-0022).
    verification: >-
      `test/architecture/test_single_bt_execution_received_side.py` greps every module
      under `vultron/core/use_cases/` for imports of
      `create_guarded_commit_case_ledger_entry_tree` outside the factory's own module,
      against a `KNOWN_VIOLATIONS` ratchet that must shrink to empty;
      `test_no_dl_mutations_in_execute.py` fails on a DataLayer write reached from
      `execute()` (CLP-10-020).
    relationships:
    - rel_type: extends
      spec_id: CLP-10-005
    adr:
    - ADR-0021
    - ADR-0022
  - id: CLP-10-007
    priority: MUST
    kind: project
    statement: Any operation that is procedural code in `execute()` (including the
      use case's main operation) MUST be expressed as a node in the single BT tree
      built by the tree-factory function.
    rationale: >-
      Work that runs as procedural code outside the tree is invisible to the tree's
      guards and to the checks that read the tree. A node in the tree runs in the stage
      order, after the guards, and the tests can find it.
    verification: Inspection of every `execute()` method in `vultron/core/use_cases/received/`
      confirms that domain-significant operations are expressed as BT nodes within
      the single tree-factory function and that no procedural domain logic appears
      directly in `execute()`.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-005
  - id: CLP-10-008
    priority: MUST
    kind: project
    statement: The guarded-commit subtree MUST be composed as a child of the tree-factory
      function, not invoked as a separate `execute_with_setup()` call.
    rationale: >-
      A commit that runs as a separate tree lets procedural code decide whether it
      runs, outside the guards and the stage order. As a child of the one tree, the
      commit runs in its stage, after the guards that judge the activity.
    verification: '`test/architecture/test_single_bt_execution_received_side.py` confirms
      that no received-side `execute()` method reaches `BTBridge.execute_with_setup()`
      more than once, directly or through use-case or core-services helpers,
      enforcing that the guarded-commit subtree is composed into the single tree
      rather than invoked separately.'
    relationships:
    - rel_type: refines
      spec_id: CLP-10-005
  - id: CLP-10-006
    priority: MUST
    kind: project
    statement: In any receive-side BT tree that includes a `GuardedCommitCaseLedgerEntryBT`
      subtree (composed via `create_guarded_commit_case_ledger_entry_tree`), the commit
      subtree MUST appear after the intake node, after the ledger-position answer
      (SYNC-18-007), after the clock-decision stage (CLP-10-025), and after all pure
      precondition-guard nodes, and before any protocol-effect nodes. The intake
      node is the single shared
      node that archives the received activity as received (CLP-10-017). A
      precondition-guard node is one that only reads state and returns
      FAILURE on mismatch, making no writes. A protocol-effect node is any other node
      that writes to the DataLayer, mutates actor or participant state, or enqueues an
      outbox item; the intake node is not a protocol-effect node, and neither is a
      clock decision (CLP-10-025), which commits its own entry, nor the
      ledger-position answer, which records the sender's replication state and may
      queue a replay or a re-seed `Announce(VulnerabilityCase)` but commits no
      ledger entry and never decides the act's disposition. A refusal effect
      (CLP-10-022) is a protocol-effect node that runs only when a precondition
      guard has refused, so the tree fails before the commit; it never runs on a
      delivery the guards accept, and so never precedes a commit.
    rationale: >-
      Receipt is a fact whether or not the CASE_MANAGER admits the assertion, so the
      record of what arrived is written before any step judges it (ADR-0111). The
      commit comes after the guards, so a refused activity commits nothing. Effects
      come after the commit, so an admitted assertion's effects follow the ledger
      record of their cause. A refusal effect runs only on a refused path, which has no
      ledger record and no other effect.
    verification: '`test/architecture/test_receive_side_intake_first.py` asserts
      that every receive-side tree factory under `vultron/core/behaviors/` returns
      the result of `create_receive_activity_tree` (including the factories that
      composed `create_case_manager_gated_tree` directly before #3870), so the tree
      has the intake node as its first child; `test_receive_side_bt_commit_ordering.py`
      asserts the guarded commit comes after every guard and no protocol-effect node
      ahead of the commit, counting `refusal_effects` as effects, that nothing
      writes ahead of the commit outside intake, the clock decisions, a
      diversion, a refusal reply or the ledger-position answer (a writer being
      a marked emit or state-write node or an unmarked writer
      `test_received_tree_state_writes_are_gated.py` pins, with no exception),
      that trees whose commit is nested are
      a pinned set, and that the ledger-position answer commits nothing and
      writes only replication state, a replay and a re-seed;
      `test/core/behaviors/case/nodes/test_refusal_stage.py`
      asserts no refusal effect runs on an admitted delivery.'
    adr:
    - ADR-0111
    - ADR-0022
    - ADR-0135
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-10-017
    - rel_type: uses_definition
      spec_id: CLP-10-025
    - rel_type: uses_definition
      spec_id: SYNC-18-007
    - rel_type: uses_definition
      spec_id: CLP-10-022
  - id: CLP-10-010
    priority: MUST
    kind: project
    statement: 'In any receive-side BT tree that includes a `GuardedCommitCaseLedgerEntryBT`
      subtree, the ordering MUST be: (1) intake, (2) door guards, in order: the
      post-close write boundary (CM-23-013), the addressee check (HP-01-005), the
      path stage (ADR-0153) and
      the sender guard (HP-01-006), (2a) the ledger-position answer (SYNC-18-004,
      SYNC-18-005, SYNC-18-007), (3) clock decisions
      (CLP-10-025), (4) precondition guards, (5) commit, (6) all protocol effects.
      Clock decisions are the only commits before stage (5), other than a
      diversion (CLP-10-026), which answers its delivery in place of stages (5)
      and (6). On a delivery the guards admit, the ledger-position answer is the
      only write before stage (5) besides intake, the clock decisions and a
      diversion: it records replication state and may queue a replay or re-seed,
      commits nothing and leaves the disposition of the act to the later stages. Refusal
      effects (CLP-10-022) belong to stage (4): they run only
      after a precondition guard refuses, and the tree then ends without
      reaching (5) or (6). A tree whose message type declares the paths it
      handles carries the path stage. It asks the receiver''s role once and picks the
      manager, participant-replica or no-case path. It refuses a path the declaration
      omits, and it writes nothing.'
    rationale: Intake records what arrived. The canonical case ledger records the cause
      (the received activity the CASE_MANAGER accepted) and replicates it to all
      participants, so cause precedes effects. A clock decision is the CASE_MANAGER's
      own act, ledgered even when the activity is then admitted (CM-21-014), so it
      runs before the guards that read it, and after the door guards so an
      unentitled sender never makes it write (ADR-0135). The ledger-position answer
      runs before the guards because it answers the sender's stated position
      whatever the act's own outcome (SYNC-18-007), and after the door guards for
      the same reason as a clock decision. The path stage runs among the door guards
      because the role question decides whether the message is this receiver's to act
      on at all, and ahead of the sender guard so the guard reads the path instead of
      asking the same question a second time (HP-01-012).
    verification: Covered by the structural test named in CLP-10-006;
      `test/core/behaviors/case/test_received_path_stage.py` pins the path stage's
      place among the door guards.
    adr:
    - ADR-0111
    - ADR-0135
    - ADR-0153
    relationships:
    - rel_type: uses_definition
      spec_id: CM-23-013
    - rel_type: uses_definition
      spec_id: HP-01-005
    - rel_type: uses_definition
      spec_id: HP-01-006
    - rel_type: uses_definition
      spec_id: SYNC-18-004
    - rel_type: uses_definition
      spec_id: SYNC-18-005
    - rel_type: uses_definition
      spec_id: SYNC-18-007
    - rel_type: uses_definition
      spec_id: CLP-10-022
    - rel_type: uses_definition
      spec_id: CLP-10-025
  - id: CLP-10-011
    priority: MUST
    kind: project
    statement: A receive-side BT tree that applies any protocol effect before committing
      the triggering activity inverts causal ordering and MUST be corrected.
    rationale: >-
      The ledger records the cause and replicates it to all participants. If effects
      run first, the ledger can show an effect with no cause, and replicas see a change
      with no entry that explains it. That makes the ledger unreliable for audit. The
      entry records that the CASE_MANAGER admitted the activity. A later effect that
      fails is an operational problem, not a reason to omit that entry.
    verification: A structural test in `test/architecture/` inspects each receive-side
      BT tree returned by every tree-factory function in `vultron/core/behaviors/`.
      For any tree containing `CommitCaseLedgerEntryNode` (or the guarded composite
      wrapping it), the test asserts that no sibling node appearing before the commit
      node in the `children` list is a protocol-effect node (i.e., any node whose
      class name does not match the known precondition-guard allowlist). The test
      fails if any receive-side tree violates commit-first ordering.
  - id: CLP-10-009
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: In a receive-side BT composed via `create_receive_activity_tree`, every
      node that can return FAILURE to refuse an inbound assertion (a rejection validator)
      MUST appear in `precondition_guards`; a rejection validator placed in an effect
      stage (`replica_effects` or `manager_effects`) aborts the Sequence after
      GuardedCommit has already written a canonical ledger
      entry, producing canonical/replica divergence (ISSUE-2254). Feedback a refusal
      owes the sender is passed as `refusal_effects` (CLP-10-022), never as an
      emit placed beside the refusing guard.
    rationale: >-
      A guard that runs after the commit can refuse an activity that the ledger already
      records. The CASE_MANAGER then holds an entry for a change it did not apply, and
      the replicas apply that change. A refusal must come before the commit to keep the
      ledger and the case file the same.
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-10-022
  - id: CLP-10-012
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: A separate `ValidateRMTransitionNode` in an effect stage
      (`replica_effects` or `manager_effects`) MUST NOT be
      used in the receive-side path; `CheckParticipantStatusAcceptableNode` judges
      an inbound `ParticipantStatus` before the commit (RSH-09-001)
      and a redundant validator after the commit creates divergence.
    rationale: >-
      A validator after the commit can refuse a change that the ledger already records,
      so the CASE_MANAGER's case file and the replicas differ. The check that judges an
      inbound `ParticipantStatus` already runs before the commit (RSH-09-001). A second
      check after the commit adds only that risk.
    see_also:
    - spec_id: RSH-09-001
      reason: 'context for the reader'
  - id: CLP-10-013
    priority: MUST
    kind: project
    statement: >-
      A receive-side tree built by `create_receive_activity_tree` MUST pass `case_id`
      when its received activity's `(type, object)` pair is a canonical payload
      signature (`_CANONICAL_PAYLOAD_SIGNATURES`). The CASE_MANAGER then commits one
      canonical ledger entry for each admitted activity.
    rationale: >-
      An entry is committed only for an activity with a canonical signature. A tree for
      such an activity that passes no `case_id` commits nothing, and no replica learns
      of the admitted act.
    verification: >-
      A tree for a canonical signature passes `case_id` and the ordering ratchet finds
      the commit after the guards. A receive-side test per committing tree asserts the
      CASE_MANAGER commits the entry once, any other receiver skips it, and a refused
      activity leaves no entry.
    adr:
    - ADR-0111
  - id: CLP-10-033
    priority: MUST
    kind: project
    statement: >-
      A receive-side tree MUST pass `case_id=None` and omit the commit stage when its
      received activity has no canonical payload signature. An example is the
      `Announce(CaseLedgerEntry)` replication envelope (CLP-10-004).
    rationale: >-
      A tree that commits an activity with no canonical signature makes the
      canonical-entry check refuse it, and the handler reports a refusal for a valid
      delivery.
    verification: >-
      `test_exemptions_name_routed_use_cases_that_do_not_commit` in
      `test/architecture/test_ledger_commit_coverage.py` confirms the received use case
      for `announce_case_ledger_entry` reaches no ledger commit.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-013
    adr:
    - ADR-0111
    see_also:
    - spec_id: CLP-10-004
      reason: 'context for the reader'
  - id: CLP-10-034
    priority: MUST
    kind: project
    statement: >-
      The receive-side trees for `Announce(VulnerabilityCase)` and for the bootstrap
      `Create(VulnerabilityCase)` a participant receives MUST pass `case_id=None`,
      although both are canonical signatures. Only the CASE_MANAGER sends them, and only
      a participant replica receives them (PCR-03-004). The case's genesis entry is
      committed where the CASE_MANAGER creates the case (CLP-02-013).
    rationale: >-
      A participant never commits. The CASE_MANAGER records the case's creation where it
      creates the case, so a commit stage in these trees could only refuse a valid
      delivery.
    verification: >-
      `test_announce_case_tree_has_no_commit_stage` and
      `test_bootstrap_create_case_tree_has_no_commit_stage` in
      `test/core/use_cases/received/test_receive_tree_ledger_commit.py` assert the
      `Announce(VulnerabilityCase)` and bootstrap `Create(VulnerabilityCase)` trees have
      no commit child.
    relationships:
    - rel_type: supersedes
      spec_id: CLP-10-013
    adr:
    - ADR-0111
    see_also:
    - spec_id: CLP-02-013
      reason: 'context for the reader'
    - spec_id: PCR-03-004
      reason: 'context for the reader'
  - id: CLP-10-014
    priority: MUST
    kind: project
    statement: >-
      A store MUST NOT mint a canonical case-ledger index unless it is the store that
      holds that case's canonical log.
    rationale: >-
      A log index is a claim on one position in one hash chain. If two stores claim the
      same position, they fork the chain, and the fork cannot be repaired.
    verification: A test executes `CommitLogEntryBT` under an `actor_id` at a foreign
      authority and asserts that it raises with no `CaseLedgerEntry` written and no
      fan-out sent, and under a same-authority `actor_id` asserts the guard stands aside.
    exceptions:
    - A store that cannot name its own actor — a test double, or any implementation
      that reports no `actor_id` — is never foreign, and such callers commit exactly
      as they did before per-actor storage.
    tags:
    - persistence
    - protocol
    adr:
    - ADR-0073
    - ADR-0109
  - id: CLP-10-035
    priority: MUST
    kind: project
    statement: >-
      `CommitLogEntryBT` MUST raise, having written nothing, when the actor it executes
      as is not one the running container hosts.
    rationale: >-
      A participant on another container asks the CASE_MANAGER to act by a message
      (CM-24-010). So no sanctioned path runs a tree in a store other than its actor's
      own (BT-05-005, ADR-0109). A tree that does so is a programming error, and the
      guard raises.
    verification: >-
      `test_commit_tree_raises_for_a_foreign_ledger` in
      `test/core/behaviors/sync/test_commit_tree.py` executes `CommitLogEntryBT` under
      an `actor_id` at a foreign authority and asserts that it raises with no
      `CaseLedgerEntry` written and no fan-out sent.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-014
    adr:
    - ADR-0073
    - ADR-0109
  - id: CLP-10-015
    priority: MUST
    kind: protocol
    statement: >-
      When a receiver must identify a *subject* that an incoming message names (the invitee
      of an embargo invitation, the actor whose consent an accept or reject records, or the
      target of any participant-scoped action), it MUST take that identity from the received
      activity, never from its own identity as the receiving actor. The two coincide in the
      ordinary single-recipient case and diverge whenever a message is relayed on a
      participant's behalf.
    rationale: >-
      The receiving actor and the subject of a message are the same in the usual
      single-recipient case. They differ when a message is relayed on a participant's
      behalf, sent from the command line, or replayed from the log. If the receiver
      uses its own identity as the subject, it records consent for the wrong
      participant, or sends an action to the wrong one. A conforming peer then sees a
      change on an actor that the message never named.
    verification: >-
      `TestInviteeIsTheAddressee` and `TestInviteeIdProperty` in
      `test/core/use_cases/received/test_embargo_invite_lapse.py` confirm that the
      resolved invitee is taken from the activity's addressees and not from the
      receiving actor when the two differ.
    tags:
    - protocol
    adr:
    - ADR-0022
    stories:
    - story_2026_037
  - id: CLP-10-024
    priority: MUST
    kind: project
    statement: >-
      A received-side use case MUST NOT use `resolve_receiving_actor_id()` as the subject a
      received message names. `resolve_receiving_actor_id()` is legitimate only as the
      `actor_id` passed to `execute_with_setup()` (CLP-10-005), that is, whose store runs
      the tree.
    rationale: >-
      `resolve_receiving_actor_id()` names the actor whose store runs the tree, not the
      actor the message is about. When the CASE_MANAGER relays a message for a
      participant, the two differ. A use case that takes the subject from this helper
      then records the consent or the invitation against the wrong actor (CLP-10-015).
    verification: >-
      `TestInviteeIsTheAddressee` and `TestInviteeIdProperty` in
      `test/core/use_cases/received/test_embargo_invite_lapse.py` confirm that the resolved
      invitee is taken from the activity's addressees and not from the receiving actor when
      the two differ.
    relationships:
    - rel_type: refines
      spec_id: CLP-10-015
    adr:
    - ADR-0022
    see_also:
    - spec_id: CLP-10-005
      reason: 'context for the reader'
  - id: CLP-10-016
    priority: MUST
    kind: protocol
    statement: >-
      Subject-identity resolution (CLP-10-015) MUST give a result that does not change
      when the `to:` list is reordered.
    note: >-
      Where a message names its subject as its sole `to:` recipient, there is
      no position to choose: the invitee of an `Invite(EmbargoEvent)` is that
      recipient, and an Invite naming none or several is refused (EP-09-026).
    rationale: >-
      The order of the `to:` list carries no meaning. A pick by position resolves a
      message with several recipients to the same subject in every replica. Each
      recipient after the first would then apply the message to the record of another
      participant.
    verification: >-
      `test_multi_recipient_invite_is_refused_at_a_recipient` in
      `test/core/use_cases/received/test_embargo_invite_lapse.py` delivers an
      `Invite(EmbargoEvent)` whose second recipient is the receiving actor and
      asserts it is refused with nothing written, rather than resolved to
      either recipient.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-015
    tags:
    - protocol
    adr:
    - ADR-0022
    - ADR-0113
    stories:
    - story_2026_037
  - id: CLP-10-017
    priority: MUST
    kind: project
    statement: >-
      Every receive-side BT tree MUST begin with the shared intake node that
      `create_receive_activity_tree` supplies.
    rationale: >-
      Receipt is a fact whether or not the receiver admits the assertion, so the record
      of what arrived is written before any step judges it. One shared node gives every
      received tree the same first step (ADR-0111).
    verification: >-
      `test/architecture/test_receive_side_intake_first.py` asserts the intake node is
      the first child of every tree `create_receive_activity_tree` returns and that
      every receive-side factory returns that tree.
    adr:
    - ADR-0111
    - ADR-0149
  - id: CLP-10-036
    priority: MUST
    kind: project
    statement: >-
      The intake node MUST idempotently archive the received activity exactly as
      received, as a `ReceivedActivityRecord`. The record holds the received body as the
      parser sealed it (VM-08-002), and nothing derived from it. The receiver derives
      its id (`ReceivedActivityRecord.build_id`), never using the id the sender chose.
      The record carries the sender's activity id for the reverse lookup.
    rationale: >-
      The archive is the sealed body (ADR-0149), because a summary drops what core does
      not name. The receiver mints the row id, so a sender cannot take an id that the
      receiver derives for its own record.
    verification: >-
      A unit test for the intake node archives a received activity, asserts the activity
      is readable through `ReceivedActivityRecord.build_id` and not under the sender's
      id, asserts a second run writes nothing, and asserts a sender activity whose id
      equals a receiver-derived record id does not block the later `create()` of that
      record. `test/core/behaviors/case/nodes/test_intake.py` also asserts the archive
      is exactly the body the parser sealed.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-017
    - rel_type: uses_definition
      spec_id: VM-08-002
    adr:
    - ADR-0111
    - ADR-0149
  - id: CLP-10-037
    priority: MUST
    kind: project
    statement: >-
      The intake node MUST fail as a wiring fault (ARCH-15-001), archiving nothing, when
      an activity reaches it with no received body and nothing held.
    rationale: >-
      An archive with no body would record something other than what arrived. The
      missing body is a wiring bug, so intake fails loudly rather than archive a guess.
    verification: >-
      `test/core/behaviors/case/nodes/test_intake.py` asserts that an event with no body
      fails intake unless the receiver already holds the activity.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-036
    - rel_type: refines
      spec_id: ARCH-15-001
    adr:
    - ADR-0149
  - id: CLP-10-038
    priority: MUST_NOT
    kind: project
    statement: >-
      The intake node MUST NOT write anything but the archive, such as a core record
      from an object inlined in the activity. An effect node writes such a record after
      the precondition guards, from the copy the event carries. Examples are a note, a
      report, a status, an embargo event and a case replica.
    rationale: >-
      An object inside an activity is only a message shaped like that object. If intake
      wrote it as a record before the guards, any sender could seed a case replica or a
      ledger entry ahead of the trust and chain checks (PCR-03-004).
    verification: >-
      A unit test for the intake node archives a received activity that inlines an
      object and asserts no record of the inlined object (and no case replica) was
      created.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-017
    adr:
    - ADR-0111
  - id: CLP-10-018
    priority: MUST
    kind: project
    statement: >-
      A refusal of an inbound assertion MUST leave the archive that intake wrote in the
      receiver's DataLayer, never removing or altering it.
    rationale: Receipt is a fact and refusal is a verdict on the assertion, not on the
      record of receipt. The refusal itself belongs in the process log, never the
      ledger (CLP-04-007). A receiver that declines to create a case and still keeps
      the report and the Offer (CM-15-002) does so as an effect of that policy
      branch, from the event's copy, not because intake stored them.
    verification: A received-side handler test posts an activity that a precondition
      guard refuses, asserts the handler disposition is REFUSED, and asserts the
      activity is readable from the receiver's DataLayer afterward.
    adr:
    - ADR-0111
  - id: CLP-10-019
    priority: MUST_NOT
    kind: project
    statement: >-
      A received-side use case MUST NOT store the received activity through any path but
      the intake node. Such other paths include a handler-local helper, a per-tree store
      node, and a call in `execute()`.
    rationale: >-
      A second store path can store the activity in a different form, or store it twice.
      One shared intake node is the DRY form (CS-22-001), and every received tree gets
      it from the shared factory.
    verification: '`test/architecture/test_no_dl_mutations_in_execute.py` (CLP-10-020)
      flags any DataLayer write an `execute()` body reaches through a use-case-layer
      helper, so a handler-local store path fails the build unless enumerated in
      `KNOWN_VIOLATIONS`.'
    adr:
    - ADR-0111
  - id: CLP-10-039
    priority: MUST_NOT
    kind: project
    statement: >-
      A received-side use case MUST NOT write a core record from a received object
      anywhere but an effect node of its tree.
    rationale: >-
      A core record written in an effect node comes after the guards, so a refused
      activity writes none (ADR-0111).
    verification: >-
      `test/architecture/test_no_dl_mutations_in_execute.py` (CLP-10-020) flags any
      DataLayer write an `execute()` body reaches through a use-case-layer helper, and
      `test/core/behaviors/case/nodes/test_intake.py` asserts intake writes no record of
      an inlined object.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-019
    adr:
    - ADR-0111
  - id: CLP-10-020
    priority: MUST
    kind: process
    statement: >-
      `test/architecture/test_no_dl_mutations_in_execute.py` MUST flag a DataLayer write
      that a received-side `execute()` body reaches through a helper. A helper is any
      function or method defined under `vultron/core/use_cases/`, resolved transitively.
      A received-side `execute()` is that of a use case under
      `vultron/core/use_cases/received/`.
    rationale: >-
      A write that a helper does for `execute()` is still a write by `execute()`. A test
      that sees only the writes in the `execute()` body misses them, so it would pass
      code that the rule forbids. A write inside a BT node is allowed, so the resolution
      stops at the use-case package boundary. Trigger-side `execute()` and `_prepare()`
      bodies follow BT-15-001, not this rule.
    verification: >-
      Detector self-tests in the same module write synthetic sources to a temporary
      directory and assert that a helper containing a DataLayer write and called from
      `execute()` is flagged, that a helper two calls deep is flagged, and that a write
      inside a BT node the tree runs is not.
    adr:
    - ADR-0111
    relationships:
    - rel_type: verifies
      spec_id: CLP-10-030
  - id: CLP-10-040
    priority: MUST
    kind: process
    statement: >-
      `test/architecture/test_no_dl_mutations_in_execute.py` MUST list the remaining
      violations (CLP-10-020) as an exact `KNOWN_VIOLATIONS` set.
    rationale: >-
      An exact set is a ratchet. A new violation fails the build, and a fixed one must
      leave the set, so the list never hides a regression (ARCH-18-001).
    verification: >-
      The ratchet assertion in `test/architecture/test_no_dl_mutations_in_execute.py` is
      bidirectional equality against `KNOWN_VIOLATIONS` (ARCH-18-001).
    relationships:
    - rel_type: extends
      spec_id: CLP-10-020
    - rel_type: refines
      spec_id: ARCH-18-001
    adr:
    - ADR-0111
  - id: CLP-10-021
    priority: MUST
    kind: project
    statement: >-
      A received-side use case that tests whether a message is addressed to
      the receiving actor MUST compare actor ids with a trailing-slash-tolerant
      comparison (`is_addressed_to()` or `same_actor_id()` in
      `vultron/core/predicates/addressing.py`), never an exact string match.
    rationale: >-
      `to:` and `cc:` arrive as the sender wrote them, and the receiving actor id is
      canonical. An exact match misses a recipient written with a trailing slash, and
      the receiver refuses an activity that was addressed to it.
      `Offer(VulnerabilityReport)` can have several recipients and reads its
      eligibility from `to:` (HP-09-001), so this mistake refuses a valid report.
    verification: >-
      `test_submit_report_trailing_slash_recipient_creates_case` in
      `test/core/use_cases/received/test_submit_report_received.py` addresses
      an `Offer(VulnerabilityReport)` to the receiver with a trailing slash and
      asserts the case is created; `test/core/predicates/test_addressing.py` pins the
      comparison.
    tags:
    - protocol
  - id: CLP-10-022
    priority: MUST
    kind: project
    statement: >-
      `create_receive_activity_tree` MUST itself add the refusal notice (CLP-05-001) as
      the first refusal effect of each tree that commits to a case. This applies to
      every such tree that has a precondition guard. A tree is exempt only when it names
      a registered exemption that says what answers its refusals instead.
    rationale: >-
      A refusal the receiver can answer in the moment should be answered. Per-tree
      copies of the notice would repeat the structure (CS-22-001), so the factory adds
      it once for every tree.
    note: >-
      The redelivery skip (CLP-10-044) keys on intake finding the activity already
      archived, not on a record that the refusal effects ran: a refusal effect writes no
      state of the assertion, so no such record exists. The note exception (CLP-10-048)
      exists because a note reaches the sender only as a ledger entry: a participant
      refuses a direct `Add(Note)` (HP-01-005, #4829). A redelivery whose first delivery
      never reached the refusal effects (the sender guard refused it, the receiver was
      not yet the CASE_MANAGER, or the effect failed) is therefore not answered either.
    verification: >-
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the factory adds
      the refusal notice first and honours only a registered exemption
      (`TestRefusalNotice`); `test/architecture/test_received_tree_refusal_notice.py`
      asserts every received tree that commits and has a precondition guard holds one
      notice or a registered exemption.
    adr:
    - ADR-0111
    - ADR-0141
    relationships:
    - rel_type: implements
      spec_id: CLP-05-005
    - rel_type: uses_definition
      spec_id: CLP-05-001
  - id: CLP-10-041
    priority: MUST
    kind: project
    statement: >-
      A receive-side tree MUST pass the factory, as `refusal_effects`, any further
      feedback it owes the sender when a precondition guard refuses.
    rationale: >-
      An emit beside the guard would precede the commit on an admitted delivery
      (CLP-10-006). The factory's refusal stage runs the feedback only on a refused
      path, such as the note for a backward RM declaration (RSH-06-004).
    verification: >-
      `TestRefusedRegressionIsNoted` in
      `test/core/behaviors/report/test_rm_declaration_adjudication.py` asserts the
      end-to-end behaviour of a refusal effect a tree passes, the RSH-06-004 note.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-042
    priority: MUST
    kind: project
    statement: >-
      The factory MUST run the refusal effects only when a precondition guard refuses.
      It never runs them when a door guard refuses — the post-close boundary, the
      addressee check, the path stage or the closed-sender door — when the sender guard
      refuses, or when the guards pass. Nor does it run them when a guard's failure is
      an idempotent repeat, which the handler reports `SKIPPED`.
    rationale: >-
      An unentitled sender is owed no answer (HP-01-006). A repeat whose effect is in
      place was not refused, so a `Reject` of it would contradict that effect.
    verification: >-
      `test/core/behaviors/case/nodes/test_refusal_stage.py` asserts the effects never
      run on an admitted delivery, run once on a refusal and are skipped on a guard's
      idempotent repeat; `test_a_sender_guard_refusal_queues_no_notice` and
      `test_a_skipped_repeat_answer_under_a_new_id_queues_no_notice` in
      `test/core/use_cases/received/test_refusal_notice.py` assert no notice for a
      sender-guard refusal or a repeat embargo answer under a new activity id.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-043
    priority: MUST
    kind: project
    statement: >-
      The factory MUST run the refusal effects only at the case's CASE_MANAGER.
    rationale: >-
      Only the CASE_MANAGER adjudicates and answers (BT-17-008). A replica that ran them
      would answer a refusal it did not make.
    verification: >-
      `test_refusal_effects_are_gated_on_the_case_manager` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the refusal
      effects are gated on the CASE_MANAGER, and `test_a_replica_queues_no_notice` in
      `test/core/use_cases/received/test_refusal_notice.py` asserts a replica queues no
      notice.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-044
    priority: MUST_NOT
    kind: project
    statement: >-
      The factory MUST NOT run the refusal effects again for a redelivery that intake
      found already archived.
    rationale: >-
      The first delivery already answered the refusal. A second answer for a redelivery
      would tell the sender twice about one refusal.
    verification: >-
      `test_a_redelivery_skips_the_refusal_effects` in
      `test/core/behaviors/case/nodes/test_refusal_stage.py` and
      `test_a_redelivery_queues_no_second_notice` in
      `test/core/use_cases/received/test_refusal_notice.py` assert a redelivery runs no
      refusal effect.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-045
    priority: MUST
    kind: project
    statement: >-
      The factory MUST run each refusal effect whether or not an earlier one failed.
    rationale: >-
      One failed effect should not cost the sender the others. The refusal notice comes
      first, so a later effect must not depend on it.
    verification: >-
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the factory wraps
      each refusal effect on its own, and
      `test_a_notice_that_cannot_be_built_does_not_stop_the_next_effect` in
      `test/core/use_cases/received/test_refusal_notice.py` asserts a failed notice does
      not stop the next effect.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-046
    priority: MUST
    kind: project
    statement: >-
      The factory MUST leave the tree failing with the guard's refusal. So nothing of
      the refused assertion is committed, and the handler reports `REFUSED` for the
      guard's reason.
    rationale: >-
      The refusal effects answer the refusal; they do not change it. If an effect's
      result replaced the guard's, the handler could report a refused assertion as
      applied, or with the wrong reason.
    verification: >-
      `test_a_refusal_runs_the_refusal_effects_and_still_fails` and
      `test_a_failed_refusal_effect_keeps_the_guards_reason` in
      `test/core/behaviors/case/nodes/test_refusal_stage.py` assert the tree still fails
      with the guard's reason.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-047
    priority: MUST
    kind: project
    statement: >-
      Every refusal effect MUST be emit-capable.
    rationale: >-
      A refusal effect exists to answer the sender, so a node that cannot emit has no
      place among them. The factory refuses one at build time.
    verification: >-
      `test_a_refusal_effect_that_does_not_emit_is_refused` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the factory
      refuses a refusal effect that is not emit-capable.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-048
    priority: MUST_NOT
    kind: project
    statement: >-
      A refusal effect MUST NOT contain a state-write node, because a refusal commits
      nothing of the assertion. The one exception is the CASE_MANAGER's own note
      (`_CommitCaseManagerNoteBase`, RSH-06-004). It commits itself as its own
      `add_note_to_case` entry before it attaches the note to the case.
    rationale: >-
      A refusal changes no state the ledger does not record. A state write in a refusal
      effect would change the case with no entry for it.
    verification: >-
      `test_a_refusal_effect_that_writes_state_is_refused` and
      `test_a_state_writer_nested_in_a_refusal_effect_is_refused` in
      `test/core/behaviors/case/test_receive_activity_tree.py` assert the factory
      refuses a refusal effect that holds a state writer; `TestRefusedRegressionIsNoted`
      in `test/core/behaviors/report/test_rm_declaration_adjudication.py` covers the
      note exception.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-022
    - rel_type: uses_definition
      spec_id: RSH-06-004
    adr:
    - ADR-0111
    - ADR-0141
  - id: CLP-10-025
    priority: MUST
    kind: project
    statement: >-
      A receive-side tree MUST pass each decision the CASE_MANAGER takes from its own
      clock or local policy to `create_receive_activity_tree` as a clock decision. This
      covers each such decision that the CASE_MANAGER must record before it judges the
      received activity, such as an invitation expiry (CLP-07-013, CM-28-009). A
      decision that changes nothing in the case file records nothing, and is not a clock
      decision. An ownership-transfer Offer's expiry is one (CM-21-043, ADR-0152).
    rationale: >-
      An expiry must be in the ledger even when the activity that revealed it is then
      admitted, so it cannot be a refusal effect or wait for the activity's commit. A
      separate tree would break the one-tree rule (CLP-10-005). A named stage keeps the
      decision in the one tree (ADR-0135).
    verification: >-
      `test_every_received_embargo_tree_with_a_case_takes_the_sweep` in
      `test/core/use_cases/received/test_embargo_overdue_invite_sweep.py` asserts every
      received embargo tree that names a case passes the invitation-expiry decision to
      the factory as a clock decision.
    relationships:
    - rel_type: implements
      spec_id: CLP-07-013
    - rel_type: constrains
      spec_id: CM-28-015
    adr:
    - ADR-0135
    see_also:
    - spec_id: CM-21-043
      reason: 'context for the reader'
    - spec_id: CM-28-009
      reason: 'context for the reader'
  - id: CLP-10-049
    priority: MUST
    kind: project
    statement: >-
      The factory MUST run the clock decisions after the door guards and before the
      precondition guards (CLP-10-010).
    rationale: >-
      The stage runs after the sender guard, so a sender with no standing cannot cause a
      termination. It runs before the guards that read what it records.
    verification: >-
      `test_decisions_run_after_the_door_guards_and_before_the_guards` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the factory
      places the clock decisions after the sender guard and before the precondition
      guards.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    - rel_type: refines
      spec_id: CLP-10-010
    adr:
    - ADR-0135
  - id: CLP-10-050
    priority: MUST
    kind: project
    statement: >-
      The factory MUST run the clock decisions only at the case's CASE_MANAGER
      (BT-17-001).
    rationale: >-
      Only the CASE_MANAGER commits ledger entries. A replica that ran a clock decision
      would write a case change no entry records.
    verification: >-
      `test_decisions_are_gated_on_the_case_manager` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the clock
      decisions are gated on the CASE_MANAGER.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    - rel_type: refines
      spec_id: BT-17-001
    adr:
    - ADR-0135
  - id: CLP-10-051
    priority: MUST
    kind: project
    statement: >-
      This rule covers each receive-side tree that names a case and has a sender guard
      and the post-close boundary. Each such tree MUST take the embargo end-time check
      (EMB-13-003) as a clock decision. The factory adds it with no argument from the
      tree. A tree still exempt from a sender check takes it once it declares its sender
      rule (HP-01-007).
    rationale: >-
      Any activity on an overdue case can reveal that its embargo has ended. The factory
      adds the check itself, so a new tree cannot forget it, and the sender guard keeps
      a non-participant from causing a termination.
    verification: >-
      `test_a_case_tree_with_a_sender_guard_takes_the_end_time_decision` and
      `test_a_tree_without_a_sender_guard_takes_no_case_decision` in
      `test/core/behaviors/case/test_receive_activity_tree.py` assert which trees take
      the end-time decision; `test_a_non_participants_activity_commits_no_termination`
      in `test/core/use_cases/triggers/embargo/test_end_time_termination.py` asserts a
      non-participant's activity naming an overdue case commits no termination, and a
      participant's does.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    - rel_type: uses_definition
      spec_id: EMB-13-003
    - rel_type: uses_definition
      spec_id: HP-01-007
    adr:
    - ADR-0135
  - id: CLP-10-052
    priority: MUST
    kind: project
    statement: >-
      A clock decision MUST commit only CASE_MANAGER-authored entries, one for each AS2
      activity needed to express what it decided. It also commits the case-file changes
      those entries record, and nothing about the received activity. An expiry is one
      entry. An end-time termination is the `Remove(EmbargoEvent)` and each status
      update and re-issued stub Invite it needs.
    rationale: >-
      The decision runs before the guards. If it committed the activity's own effects, a
      refused activity would leave a change in the ledger (ADR-0135).
    verification: >-
      `test_receive_side_bt_commit_ordering.py` accepts a commit ahead of the guards
      only inside the clock-decision stage, and there only from the decision's own
      CASE_MANAGER commit nodes;
      `test_the_termination_commits_one_entry_per_as2_activity_in_order` in
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py` asserts one
      entry per AS2 activity of the termination.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    adr:
    - ADR-0135
  - id: CLP-10-053
    priority: MUST
    kind: project
    statement: >-
      A clock decision MUST order its entries so that no prefix of them leaves an
      embargo register entry `TERMINATED` while another is `PROPOSED` (EP-08-004,
      ADR-0122). The `Remove` carries the whole register step, the cancellation of every
      open proposal included.
    rationale: >-
      A replica that applies only the first entries of the decision must still hold a
      register that obeys EP-08-004. The `Remove` cancels every proposal in the same
      step, so no prefix breaks it.
    verification: >-
      `test_the_termination_commits_one_entry_per_as2_activity_in_order` in
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py` asserts the
      termination's entries are the `Remove` then the status update, with no proposal
      left `PROPOSED`; `test/core/use_cases/triggers/test_stub_invite_lifetime.py`
      asserts the re-issued stub `Invite` is committed after them.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    - rel_type: derives_from
      spec_id: EP-08-004
    adr:
    - ADR-0135
    - ADR-0122
  - id: CLP-10-054
    priority: MUST
    kind: project
    statement: >-
      A clock decision MUST take its evidence only from the CASE_MANAGER's clock, its
      local policy, and the case's ledger and file. It never takes it from the received
      activity.
    rationale: >-
      A sender controls what its activity claims. If the activity were the evidence, a
      sender could decide a deadline by the time it writes.
    verification: >-
      `test/core/use_cases/received/actor/test_ownership_deadline.py` asserts that an
      expiry verdict does not change when only the received activity's claimed
      `published` time changes.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    adr:
    - ADR-0135
  - id: CLP-10-055
    priority: MAY
    kind: project
    statement: >-
      The received activity MAY prompt a clock decision and name what the decision
      concerns.
    rationale: >-
      The CASE_MANAGER decides lazily, when an activity about the case arrives, so the
      activity can be the occasion of a decision without being its evidence.
    verification: >-
      `test_note_from_a_participant_ends_an_overdue_embargo` in
      `test/core/use_cases/received/test_note_and_announce_sender_rules.py` asserts that
      a participant's note prompts the end-time decision for its case.
    adr:
    - ADR-0135
  - id: CLP-10-056
    priority: MAY
    kind: project
    statement: >-
      A clock decision's entry MAY carry the received activity's claimed `published`
      time as received (CLP-15-003). The time records when the activity claims to have
      been sent, and decides nothing.
    rationale: >-
      A reader of the ledger can then see when the prompting activity claims it was
      sent, beside the CASE_MANAGER's own commit stamp.
    verification: >-
      `test/core/use_cases/received/actor/test_ownership_deadline.py` asserts the
      claimed `published` time does not change the verdict.
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-15-003
    adr:
    - ADR-0135
  - id: CLP-10-057
    priority: MUST
    kind: project
    statement: >-
      A clock decision with nothing to record MUST succeed, so the tree continues. An
      example is a decision where no deadline has passed.
    rationale: >-
      Most deliveries find no deadline passed. If such a decision failed, it would
      refuse every activity that arrived on time.
    verification: >-
      `test_a_decision_that_records_nothing_succeeds` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the tree
      continues when a decision records nothing.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    adr:
    - ADR-0135
  - id: CLP-10-058
    priority: MUST
    kind: project
    statement: >-
      A clock decision whose commit the ledger refuses MUST log the refusal at WARNING.
    rationale: >-
      The decision is left unrecorded, which an operator should see. The guards still
      refuse what it forbids, so the case is safe, and WARNING fits a recoverable
      condition.
    verification: >-
      `test_a_refused_commit_warns_and_the_tree_continues` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the WARNING
      record.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    adr:
    - ADR-0135
  - id: CLP-10-059
    priority: MUST_NOT
    kind: project
    statement: >-
      A clock decision whose commit the ledger refuses MUST NOT end the tree. The
      precondition guards still refuse what the unrecorded decision forbids
      (EMB-17-001).
    rationale: >-
      A gapped ledger can refuse the decision's commit. Ending the tree would then
      refuse an activity the guards would admit, for a fault that is not the sender's.
    verification: >-
      `test_a_refused_commit_warns_and_the_tree_continues` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the tree
      continues, and `test_a_refused_end_time_commit_lets_the_received_tree_run` in
      `test/core/use_cases/triggers/embargo/test_end_time_termination.py` asserts it for
      a gapped ledger.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    adr:
    - ADR-0135
    see_also:
    - spec_id: EMB-17-001
      reason: 'context for the reader'
  - id: CLP-10-060
    priority: MUST
    kind: project
    statement: >-
      An internal error in a clock decision MUST end the tree as an internal error
      (ADR-0095), never be absorbed as a refusal.
    rationale: >-
      An internal error is a bug. If it read as a refusal, the sender would be told its
      activity was refused and the bug would stay hidden.
    verification: >-
      `test_an_internal_error_ends_the_tree_as_an_internal_error` in
      `test/core/behaviors/case/test_receive_activity_tree.py` asserts the tree ends as
      an internal error.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-025
    adr:
    - ADR-0135
    - ADR-0095
  - id: CLP-10-026
    priority: MUST
    kind: project
    statement: >-
      A receive-side tree MUST pass each answer it gives in place of a commit to
      `create_receive_activity_tree` as a diversion among its precondition guards. Such
      an answer is an act of the receiver's own that answers a delivery instead of
      committing the received activity. Examples are the CASE_MANAGER's answer to a late
      embargo `Accept` (EMB-17), and a receiver's `Reject` of the Invite once P/X/A is
      set (EMB-01-002, EMB-02-004, EMB-03-004). The tree, not the use case, then chooses
      the answer (CLP-10-005). A tree with diversions still answers the refusals its
      guards make with the refusal notice (CLP-02-005).
    rationale: >-
      Some deliveries get an answer from the receiver in place of the admitted path. If
      the use case chooses between trees to give that answer, the choice is outside the
      tree, which the one-tree rule forbids (ADR-0135). These answers are not refusal
      effects. The late-Accept answer commits and writes consent. The P/X/A `Reject` of
      the Invite is owed by a participant too, and its derived id lets a redelivery
      find it already sent (HP-01-014). A diversion keeps each answer in the one tree,
      where tests and readers can see it.
    verification: >-
      The embargo Accept and Invite handler tests, such as
      `test/core/use_cases/received/test_embargo_answer_routing.py`, assert each
      diverted delivery's verdict and effects;
      `test_a_tree_with_diversions_takes_the_refusal_notice` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` asserts a tree with
      diversions still takes the refusal notice, and
      `test_a_guard_refusal_after_an_untaken_diversion_runs_the_effects` in
      `test/core/behaviors/case/nodes/test_refusal_stage.py` asserts a guard's refusal
      after a diversion that does not hold runs the refusal effects.
    relationships:
    - rel_type: refines
      spec_id: CLP-10-005
    - rel_type: refines
      spec_id: CLP-10-010
    adr:
    - ADR-0135
    see_also:
    - spec_id: CLP-02-005
      reason: 'context for the reader'
    - spec_id: EMB-01-002
      reason: 'context for the reader'
    - spec_id: EMB-02-004
      reason: 'context for the reader'
    - spec_id: EMB-03-004
      reason: 'context for the reader'
  - id: CLP-10-061
    priority: MUST
    kind: project
    statement: >-
      A diversion MUST have a read-only condition.
    rationale: >-
      The condition runs before the commit on every delivery, including those it does
      not divert. A condition that wrote state would change the case for a delivery that
      the admitted path then handles.
    verification: >-
      `test_a_condition_must_be_read_only` and
      `test_a_condition_that_fails_lets_the_tree_go_on` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` assert the factory
      refuses a condition that writes, and that a condition that does not hold lets the
      tree continue.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    adr:
    - ADR-0135
  - id: CLP-10-062
    priority: MUST
    kind: project
    statement: >-
      When a diversion's condition holds, the diversion's effects MUST answer the
      delivery.
    rationale: >-
      The diversion exists to give the receiver's own answer in place of the admitted
      path. A diversion that took a delivery and answered nothing would leave the sender
      waiting.
    verification: >-
      `test_a_condition_that_holds_answers_and_ends_the_tree` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` asserts a diversion that
      holds runs its effects.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    adr:
    - ADR-0135
  - id: CLP-10-063
    priority: MUST
    kind: project
    statement: >-
      When a diversion's condition holds, the tree MUST end before the received
      activity's commit. So that commit and the admitted path's effects never run for
      the delivery.
    rationale: >-
      A diverted delivery has been answered in another way. If the admitted path also
      ran, one delivery would get two contradictory outcomes.
    verification: >-
      `test_a_condition_that_holds_answers_and_ends_the_tree` and
      `test_an_answer_that_fails_still_ends_the_tree` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` assert the tree ends
      before the commit.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    adr:
    - ADR-0135
  - id: CLP-10-064
    priority: MUST_NOT
    kind: project
    statement: >-
      A diversion MUST NOT commit the received activity.
    rationale: >-
      A diversion answers in place of admitting the activity. A commit of the activity
      would admit it while the diversion refused it.
    verification: >-
      `test_no_diversion_commits_the_received_activity` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` asserts the factory
      refuses a diversion that holds the activity's commit.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    adr:
    - ADR-0135
  - id: CLP-10-065
    priority: MUST
    kind: project
    statement: >-
      A diversion that commits or writes case state MUST run only at the case's
      CASE_MANAGER (BT-17-001).
    rationale: >-
      Only the CASE_MANAGER writes canonical case state. A replica that ran such a
      diversion would write a change no entry records.
    verification: >-
      `test_the_case_manager_diverts` and
      `test_another_store_is_refused_before_the_diversion` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` assert a diversion in
      a manager-only declaration never diverts at another store, because the path
      stage refuses that receiver first (HP-01-038).
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    - rel_type: refines
      spec_id: BT-17-001
    adr:
    - ADR-0135
  - id: CLP-10-066
    priority: MUST
    kind: project
    statement: >-
      A diversion that commits MUST commit only its own CASE_MANAGER-authored entry and
      the change that entry records.
    rationale: >-
      The late-Accept answer commits and writes consent, which must be in the ledger.
      Anything more would put the received activity's own effects ahead of the guards.
    verification: >-
      `test_a_manager_only_declarations_diversion_commit_is_allowed` and
      `test_a_two_path_declarations_diversion_commit_is_flagged` in
      `test/architecture/test_receive_side_bt_commit_ordering.py` accept a commit ahead
      of the guarded commit only inside the clock-decision stage or a diversion in a
      tree declaring the CASE_MANAGER path alone.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    adr:
    - ADR-0135
  - id: CLP-10-067
    priority: MUST
    kind: project
    statement: >-
      A diversion that answers as the receiver, wherever the door guards admitted the
      delivery, MUST write no case or participant state (RSH-08-003).
    rationale: >-
      Such a diversion runs at participants as well as at the CASE_MANAGER, and a
      participant takes case state only from the ledger (RSH-08-003). The P/X/A `Reject`
      of the Invite is owed by a participant too.
    verification: >-
      `test_a_receiver_diversion_writes_no_case_state` and
      `test_a_receiver_diversion_commits_no_entry` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` assert the factory
      refuses a receiver diversion that writes case state or commits.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    adr:
    - ADR-0135
    see_also:
    - spec_id: RSH-08-003
      reason: 'context for the reader'
  - id: CLP-10-068
    priority: MAY
    kind: project
    statement: >-
      A diversion that answers as the receiver MAY store the activity it answers, so
      that it can build its answer from it.
    rationale: >-
      The answer embeds or names the activity it answers. Storing it lets the answer be
      built from what arrived, and its derived id lets a redelivery find the answer
      already sent (HP-01-014).
    verification: >-
      `test_a_receiver_diversion_with_a_covering_exemption_builds` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` builds a receiver
      diversion that answers from the activity it holds.
    adr:
    - ADR-0135
  - id: CLP-10-069
    priority: MUST
    kind: project
    statement: >-
      Every emit in a diversion that answers as the receiver MUST be covered by a named
      exemption (BT-17-008).
    rationale: >-
      An emit outside the CASE_MANAGER gate needs a stated reason, or any tree could
      speak for an actor it does not run as (BT-17-008).
    verification: >-
      `test_a_receiver_diversion_needs_an_exemption_to_emit` and
      `test_a_receiver_diversion_with_a_covering_exemption_builds` in
      `test/core/behaviors/case/nodes/test_diversion_stage.py` assert the factory
      refuses an uncovered emit and builds a covered one.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    - rel_type: uses_definition
      spec_id: BT-17-008
    adr:
    - ADR-0135
  - id: CLP-10-070
    priority: MUST
    kind: project
    statement: >-
      The factory MUST run no refusal effect for a diverted delivery (CLP-10-022),
      because the diversion has already answered it.
    rationale: >-
      A refusal notice after a diversion's answer would tell the sender two different
      things about one delivery.
    verification: >-
      `test_a_diverted_delivery_runs_no_refusal_effect` in
      `test/core/behaviors/case/nodes/test_refusal_stage.py` asserts a diverted delivery
      runs no refusal effect, and
      `test/core/use_cases/received/test_embargo_refusal_notice.py` asserts an Accept
      answered with a `Reject` of the Invite gets no refusal notice.
    relationships:
    - rel_type: extends
      spec_id: CLP-10-026
    - rel_type: uses_definition
      spec_id: CLP-10-022
    adr:
    - ADR-0135
  - id: CLP-10-027
    priority: MUST
    kind: project
    statement: >-
      In this codebase, every protocol-significant trigger tree MUST emit at least one
      outbound activity addressed to `case_manager_id` (CLP-10-001).
    rationale: >-
      The CASE_MANAGER is the only writer of the case ledger, so an assertion that never
      reaches it is never committed and the act is lost.
    verification: >-
      `test/core/use_cases/test_validate_report_ledger_routing.py::TestTriggerEmitsToCaseActorOutbox::test_emit_addressed_to_case_actor_id`
      asserts a trigger tree addresses its outbound activity to `case_manager_id`.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-001
    adr:
    - ADR-0021
    - ADR-0109
  - id: CLP-10-071
    priority: MUST
    kind: project
    statement: >-
      A tree the CASE_MANAGER runs to originate an activity MUST emit from its own
      store, and commit the canonical entry in the emitting tree (CLP-10-031). An
      example is `invite_actor_to_case`.
    rationale: >-
      The CASE_MANAGER's store holds the canonical ledger, so its own act is committed
      where it is sent, with no copy addressed to itself.
    verification: >-
      `test_note_is_recorded_and_announced_to_the_owner` in
      `test/core/behaviors/case/nodes/test_suggest_actor_owner_recipient.py` runs the
      CASE_MANAGER's own note in its store and asserts the note is committed there and
      its `Announce` queued from that store.
    relationships:
    - rel_type: implements
      spec_id: CLP-10-031
    adr:
    - ADR-0109
  - id: CLP-10-072
    priority: MUST_NOT
    kind: project
    statement: >-
      A participant whose container does not host the CASE_MANAGER MUST NOT execute a
      tree locally as the CASE_MANAGER (CM-24-011).
    rationale: >-
      Running a tree as the CASE_MANAGER in a container that does not host it would
      write canonical state into a store no replica reads.
    verification: >-
      `test/core/use_cases/triggers/test_actor_triggers.py::TestSvcInviteActorToCaseUseCase::test_invite_is_queued_in_the_owners_outbox_only`
      and
      `::TestSvcOfferCaseOwnershipTransferUseCase::test_offer_is_queued_in_the_owners_outbox_only`
      assert the owner's trigger queues its own activity and nothing as the
      CASE_MANAGER.
    relationships:
    - rel_type: refines
      spec_id: CLP-10-001
    - rel_type: refines
      spec_id: CM-24-011
    adr:
    - ADR-0109
- id: CLP-11
  title: Protocol Request/Reply State Detection
  description: Requirements for querying whether a protocol-level request/reply pair
    (e.g., Offer(CaseParticipant) → Accept/Reject) is still open or has been closed.
    These rules establish the canonical pattern for duplicate-emission suppression
    and CASE_MANAGER decision-gate checks.
  specs:
  - id: CLP-11-001
    priority: MUST
    kind: protocol
    statement: >-
      This codebase MUST determine whether a protocol request/reply pair has been
      authorized from the case ledger, never from the actor's outbox. An example pair is
      an `Offer(CaseParticipant)` that awaits an `Accept` or a `Reject`.
    rationale: 'The outbox is a delivery queue: entries are removed when the activity
      is sent and MUST NOT be used to infer protocol state. The case ledger is the
      canonical append-only protocol history and survives actor restarts. Any code
      that reads the outbox to determine whether a request is still in-flight is architecturally
      incorrect and MUST be replaced.'
    note: >-
      Narrowed by ADR-0080. This requirement governs the *authorization* question
      ("was this permitted?"), which only the ledger may answer. It does not forbid an
      actor-scoped working-set register of outstanding asks (ASK-04), which answers the
      distinct question "what am I waiting on, and what do I owe?" — and which
      DL-06-002 requires be recorded as core state rather than re-derived. A register
      MUST NOT be consulted for authorization (ASK-02-004).
    verification: >-
      `test/adapters/driven/datalayer_sqlite/test_find_protocol_pair.py::TestFindProtocolPairAnswering`
      confirms whether a request has been answered is read from the case's ledger
      entries, and that no code path reads the outbox or an outstanding-ask register to
      make this determination.
    adr:
    - ADR-0080
    stories:
    - story_2026_034
  - id: CLP-11-002
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms `find_protocol_pair()` and `PendingAssertionStore` remain
      separate, with neither delegating to nor wrapping the other.
    statement: '`find_protocol_pair()` (durable, DataLayer-backed) and `PendingAssertionStore`
      (ephemeral, in-memory suppression) MUST NOT be unified. They serve distinct
      purposes: `find_protocol_pair` determines canonical open/closed state from the
      ledger; `PendingAssertionStore` suppresses duplicate near-term re-emits while
      waiting for the `CaseLedgerEntry` round-trip. Merging them would conflate durable
      protocol state with short-lived emit-suppression state.'
    rationale: >-
      The ledger record is durable and decides whether a request is open. The
      suppression record is short-lived and only stops a repeat send. If they are one
      store, code can read a short-lived record as protocol state, or keep durable
      state in memory that a restart removes.
    note: >-
      Clarified by ADR-0080. This prohibition is on unifying the *registers*, not on
      sharing their machinery. The create / close-on-named-event / time-out lifecycle,
      its reaping and its enumeration are implemented once and instantiated separately
      per use (ASK-04-007) — the durable ask register may block, the ephemeral
      suppressor may not (CLP-06-002, CLP-06-005).
    adr:
    - ADR-0080
  - id: CLP-11-003
    priority: MUST
    kind: project
    statement: >-
      `ProtocolPair` MUST be the shared value type for both `find_protocol_pair()` and
      `PendingAssertionStore`.
    rationale: >-
      Both stores answer questions about the same request and reply. One type lets code
      move between them with no conversion.
    verification: >-
      Inspection confirms that `CasePersistence.find_protocol_pair()` in
      `vultron/core/ports/case_persistence.py` returns a `ProtocolPair`, and that
      `PendingAssertionStore` in `vultron/core/models/pending_assertion/store.py` keys
      its
      entries by `ProtocolPair`.
  - id: CLP-11-006
    priority: MUST
    kind: project
    statement: >-
      Code that constructs or queries a `ProtocolPair` MUST use the named reply-type
      constants (`OFFER_CASE_PARTICIPANT_REPLY_TYPES`,
      `INVITE_ACTOR_TO_CASE_REPLY_TYPES`), never reply semantic-type strings written at
      the call site.
    rationale: >-
      Named constants keep every call site on one list of reply types, so a new reply
      type is added in one place.
    verification: >-
      Static analysis (grep) confirms that all call sites constructing or querying a
      `ProtocolPair` use the named constants `OFFER_CASE_PARTICIPANT_REPLY_TYPES` or
      `INVITE_ACTOR_TO_CASE_REPLY_TYPES` rather than inline semantic-type strings.
    relationships:
    - rel_type: extends
      spec_id: CLP-11-003
  - id: CLP-11-004
    priority: SHOULD
    kind: project
    statement: >-
      When `find_protocol_pair()` searches for a reply entry, it SHOULD use the
      `semantic_type` field of `CaseLedgerEntry` (derived from `MessageSemantics.value`)
      as the primary key, scoped to `case_id`.
    rationale: >-
      The semantic type of an entry names the reply exactly, and the case scope keeps
      the search inside one ledger. A search that follows `in_reply_to` chains depends
      on how each sender set that field.
  - id: CLP-11-007
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT expose `in_reply_to` chain-following as a public port
      primitive. It stays an internal detail of the implementation.
    rationale: >-
      A port that exposes chain-following makes every adapter copy that detail, and
      binds callers to how each sender set `in_reply_to`.
    verification: >-
      Inspection confirms that the `CasePersistence` port in
      `vultron/core/ports/case_persistence.py` declares no method that follows
      `in_reply_to` chains, and that `find_protocol_pair()` takes no `in_reply_to`
      argument.
    relationships:
    - rel_type: extends
      spec_id: CLP-11-004
  - id: CLP-11-005
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST answer whether a request/reply pair has been authorized
      (CLP-11-001) through `CasePersistence.find_protocol_pair()`, which queries the
      case ledger.
    rationale: >-
      One query over the case ledger gives every caller the same answer to whether a
      request was already answered. Separate checks over other stored records can
      disagree with the ledger and with each other.
    verification: >-
      `test/adapters/driven/datalayer_sqlite/test_find_protocol_pair.py` confirms that
      `find_protocol_pair()` answers from the `CaseLedgerEntry` log.
    relationships:
    - rel_type: implements
      spec_id: CLP-11-001
    adr:
    - ADR-0080
- id: CLP-13
  title: Idempotency Guard Silence
  description: Requirements ensuring that BT idempotency guards (duplicate-detection
    conditions that abort processing when an event has already been handled) do NOT
    write ledger entries.  The canonical case ledger records protocol
    assertions; internal guard no-ops are process-log content only (ADR-0019).
  specs:
  - id: CLP-13-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: A BT idempotency guard that detects a duplicate and returns ``Status.FAILURE``
      to abort processing MUST NOT write a ``CaseLedgerEntry``.
    rationale: >-
      A duplicate that a guard stops is not a protocol event. An entry for it appears
      in the shared history as an act that changed nothing, with no actor and no
      transition. The ledger records the event or stays silent (ADR-0019), so the
      duplicate belongs in the process log.
    relationships:
    - rel_type: refines
      spec_id: CLP-07-001
    adr:
    - ADR-0019
  - id: CLP-13-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Idempotency guard behaviour MUST be encapsulated in a reusable ``SilentIdempotencyGuardMixin``
      (or equivalent composable BT pattern) so that the silent-failure-on-duplicate
      invariant is expressed once and tested once, not re-implemented per call site.
    rationale: >-
      Separate duplicate checks at each call site drift apart. A new call site can then
      write a ledger entry on a no-op by mistake. One shared pattern holds the
      silent-on-duplicate rule in one place, and one test covers it.
    relationships:
    - rel_type: implements
      spec_id: CLP-13-001
  - id: CLP-13-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: When an idempotency guard fires and returns ``Status.FAILURE``, it
      MUST emit a Python ``logger.info`` or ``logger.debug`` message recording the
      duplicate detection.  No other observable side effect (ledger write, outbox
      enqueue, DataLayer mutation) is permitted.
    rationale: >-
      A silent guard leaves no entry, so an operator needs a log line to see that a
      duplicate arrived and why nothing happened. A low log level keeps an ordinary
      redelivery from looking like a fault. Any other side effect would make the
      duplicate change state, which the guard exists to stop.
    relationships:
    - rel_type: extends
      spec_id: CLP-13-001
- id: CLP-14
  title: CaseLedger Causal Ordering — CASE_MANAGER Timestamp Invariants
  description: Normative requirements establishing that log_index order is the canonical
    causal order from the CASE_MANAGER's perspective, and the temporal invariants that
    conformance tests can verify against any ledger. See ADR-0079 for the decision
    record and rationale.
  specs:
  - id: CLP-14-001
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A case ledger MUST record entries in the order the CASE_MANAGER observes them. So
      if it observes event A before event B, log_index(A) is less than log_index(B). The
      log_index sequence is the authoritative causal order; timestamp order is
      supporting evidence only.
    rationale: The CASE_MANAGER is the single authoritative writer (CLP-01-003, ADR-0041).
      A single-writer regime produces a total order by construction, so no distributed
      consensus mechanism is needed. ADR-0079 formalises this design intent as a normative
      requirement; DEMOMA-22-005 depends on it.
    adr:
    - ADR-0079
    relationships:
    - rel_type: extends
      spec_id: SYNC-01-002
    stories:
    - story_2026_028
  - id: CLP-14-002
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The `published` timestamp on the `CaseLedgerEntry` envelope MUST be non-null. This
      is the CASE_MANAGER's commit stamp, as distinct from the claimed
      `payloadSnapshot.published`.
    rationale: >-
      A null entry timestamp makes the ordering checks impossible, and it breaks any
      consumer that orders entries by time. An entry carries two timestamps. A rule for
      the envelope stamp that is applied to the claimed stamp, or the reverse, gives a
      check that never fires or that refuses valid entries, so the rule names its
      field.
    adr:
    - ADR-0079
    stories:
    - story_2026_028
  - id: CLP-14-011
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST stamp each entry's envelope `published` with its own
      authoritative clock at commit time.
    rationale: >-
      One writer stamping from one clock gives stamps that support the causal order
      (CLP-14-001). A stamp copied from the claimed time would carry a participant's
      clock into the ordering checks.
    verification: >-
      `test_create_log_entry_node_stamps_the_envelope_and_keeps_the_claimed_time` in
      `test/core/behaviors/sync/nodes/test_chain.py` asserts the envelope stamp is the
      CASE_MANAGER's commit time while the claimed time is kept.
    relationships:
    - rel_type: extends
      spec_id: CLP-14-002
    adr:
    - ADR-0079
    stories:
    - story_2022_074
  - id: CLP-14-003
    priority: MUST
    kind: protocol
    statement: >-
      The envelope `published` timestamps (the CASE_MANAGER's commit stamps) on
      consecutive recorded entries MUST be monotonically non-decreasing in log_index
      order. So no entry carries an envelope `published` earlier than the entry with the
      immediately preceding log_index. This rule does not apply to the claimed
      `payloadSnapshot.published`, whose cross-entry order CLP-15-003 constrains only
      per participant.
    rationale: >-
      A timestamp that goes backward contradicts the causal order. If entry N has a
      later log index than entry N-1 but an earlier stamp, observers cannot use the
      stamps to support the order that the CASE_MANAGER recorded. The rule covers only
      the envelope stamp, because one writer stamps every entry from one clock. On the
      claimed stamps it would compare the clocks of two participants, which ADR-0079
      rejects as option C, and it would refuse a valid assertion when two clocks
      disagree.
    verification: '`check_clp14_timestamp_invariants` in `test/ci/invariants/common.py`,
      run by every scenario through `universal_harness.py`, compares consecutive
      recorded entries in log_index order.'
    adr:
    - ADR-0079
    relationships:
    - rel_type: extends
      spec_id: CLP-14-001
    stories:
    - story_2026_028
    see_also:
    - spec_id: CLP-15-003
      reason: 'context for the reader'
  - id: CLP-14-004
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      All entries in a single case ledger MUST share the same `case_id`.
    rationale: A ledger mixing entries from multiple cases makes causal comparisons
      meaningless and breaks hash-chain verification (which is scoped per case).
    adr:
    - ADR-0079
    stories:
    - story_2026_023
  - id: CLP-14-012
    priority: MUST
    kind: protocol
    statement: >-
      A holder of a case ledger MUST refuse as malformed an entry whose `case_id` does
      not match the ledger's `case_id`.
    rationale: >-
      A ledger mixing entries from several cases makes causal comparisons meaningless
      and breaks hash-chain verification, which is scoped per case. Refusing the entry
      keeps it out of the chain.
    verification: >-
      Holds by construction: a holder files each entry in the ledger of the case its
      `case_id` names, so no ledger can take another case's entry.
      `test_clp_14_012_an_entry_joins_only_the_ledger_its_case_id_names` in
      `test/core/models/test_clp_14_15_invariants.py` asserts another case's entry
      moves only that case's ledger.
    relationships:
    - rel_type: implements
      spec_id: CLP-14-004
    adr:
    - ADR-0079
    stories:
    - story_2026_005
  - id: CLP-14-005
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: log_index values MUST be unique within a single case ledger. No two
      entries for the same case_id may share a log_index value.
    rationale: Duplicate indices would make it impossible to identify which entry
      is causal-order position N, breaking any test or consumer that relies on log_index
      to determine ordering.
    adr:
    - ADR-0079
    relationships:
    - rel_type: derives_from
      spec_id: SYNC-01-002
    stories:
    - story_2026_028
  - id: CLP-14-006
    priority: MUST
    kind: protocol
    statement: >-
      Every `CaseLedgerEntry`'s envelope `published` timestamp MUST be on or after the
      parent `VulnerabilityCase`'s own `published` timestamp, never before the case's
      creation.
    rationale: >-
      The CASE_MANAGER is the single writer and creates the case before committing any
      entries. An entry predating the case indicates a clock error or commit-path bug;
      treating it as a protocol violation catches the defect at the boundary. The
      envelope stamp holds by construction and is verified by the conformance harness.
    verification: >-
      `check_clp14_timestamp_invariants` in `test/ci/invariants/common.py`, run by every
      scenario through `universal_harness.py`, and
      `test_clp_14_006_harness_flags_entry_predating_case_creation` in
      `test/core/models/test_clp_14_15_invariants.py`.
    adr:
    - ADR-0079
    stories:
    - story_2026_028
  - id: CLP-14-013
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST refuse a recorded assertion whose claimed
      `payloadSnapshot.published` precedes the parent case's `published` timestamp by
      more than the configured clock-skew tolerance (CLP-14-009).
    rationale: >-
      A claimed time well before the case's creation shows a clock error or a malformed
      assertion. The check needs a tolerance because the participant's clock is not the
      CASE_MANAGER's. A zero-tolerance comparison across two clocks would refuse
      well-formed assertions from any participant whose clock lags, the wall-clock
      coupling ADR-0079 rejected as option C.
    verification: >-
      `_validate_entry_timestamps` in
      `vultron/core/behaviors/sync/nodes/canonical_entry.py`, exercised through
      `CreateLogEntryNode` by
      `test_create_log_entry_node_rejects_payload_published_before_case_created` and
      `test_create_log_entry_node_tolerates_small_skew_before_case_created` in
      `test/core/behaviors/sync/nodes/test_chain_timestamp_guard.py`.
    relationships:
    - rel_type: extends
      spec_id: CLP-14-006
    - rel_type: uses_definition
      spec_id: CLP-14-009
    adr:
    - ADR-0079
    stories:
    - story_2022_074
  - id: CLP-14-007
    priority: SHOULD
    kind: protocol
    statement: >-
      The CASE_MANAGER SHOULD refuse a payload assertion whose
      `payloadSnapshot.published` is more than a configurable tolerance ahead of the
      CASE_MANAGER's clock at receipt.
    rationale: A payload timestamped in the future relative to the CASE_MANAGER's clock
      indicates a participant clock error or a malformed assertion. Accepting it silently
      would produce ledger entries where the payload claims to have been published
      after the ledger envelope was stamped — a contradiction of the observation model
      in ADR-0079. A small tolerance accommodates legitimate clock drift without rejecting
      well-formed messages from participants whose clocks are slightly ahead.
    adr:
    - ADR-0079
    stories:
    - story_2026_023
  - id: CLP-14-014
    priority: SHOULD
    kind: protocol
    statement: >-
      The default future tolerance (CLP-14-007) SHOULD be no more than five minutes, to
      match common clock-skew conventions.
    rationale: >-
      A small tolerance accommodates legitimate clock drift without refusing well-formed
      messages from participants whose clocks are slightly ahead.
    verification: >-
      `test_clp_14_009_clock_skew_tolerance_configurable` in
      `test/core/models/test_clp_14_15_invariants.py` pins the five-minute default.
    relationships:
    - rel_type: extends
      spec_id: CLP-14-007
    adr:
    - ADR-0079
    stories:
    - story_2026_023
  - id: CLP-14-008
    priority: SHOULD
    kind: protocol
    statement: >-
      The CASE_MANAGER SHOULD refuse a payload assertion whose
      `payloadSnapshot.published` timestamp is more than a configurable staleness window
      in the past relative to the CASE_MANAGER's clock.
    rationale: A payload with a timestamp far in the past suggests the participant
      is replaying old activities, potentially to reconstruct or manipulate ledger
      history. Rejecting stale payloads limits the window in which a replayed or delayed
      assertion can be inserted into the canonical ledger.
    adr:
    - ADR-0079
    stories:
    - story_2026_023
  - id: CLP-14-015
    priority: SHOULD
    kind: protocol
    statement: >-
      The default staleness window (CLP-14-008) SHOULD be seven days.
    rationale: >-
      Seven days bounds the window in which a replayed or delayed assertion can enter
      the ledger, while still admitting an assertion that a slow participant sends late.
    verification: >-
      `test_clp_14_009_clock_skew_tolerance_configurable` in
      `test/core/models/test_clp_14_15_invariants.py` pins the seven-day default.
    relationships:
    - rel_type: extends
      spec_id: CLP-14-008
    adr:
    - ADR-0079
    stories:
    - story_2026_023
  - id: CLP-14-009
    priority: MAY
    kind: project
    statement: Implementations MAY expose the future tolerance (CLP-14-007), the
      staleness window (CLP-14-008) and the clock-skew tolerance applied to the
      claimed-timestamp checks (CLP-14-013, CLP-15-003) as configurable parameters
      so that deployments with known clock conditions can tune the thresholds.
    rationale: >-
      Each threshold compares a participant's clock with the CASE_MANAGER's clock. How
      far apart those clocks are is a fact of the deployment, and the protocol cannot
      know it. So every such threshold needs the same setting, and none of them may be
      fixed in code.
    verification: '`test/core/models/test_clp_14_15_invariants.py` pins the defaults;
      `test/core/behaviors/sync/nodes/test_chain_timestamp_guard.py` asserts a
      `VULTRON_LEDGER__*` override actually binds and changes the outcome.'
    adr:
    - ADR-0079
    relationships:
    - rel_type: uses_definition
      spec_id: CLP-14-007
    - rel_type: uses_definition
      spec_id: CLP-14-008
    see_also:
    - spec_id: CLP-15-003
      reason: 'context for the reader'
  - id: CLP-14-010
    priority: MUST
    kind: protocol
    statement: >-
      The CASE_MANAGER MUST assign `log_index` values as a gapless sequence: 0 for the
      genesis entry, and its predecessor's index plus one for every later entry.
    rationale: >-
      Receivers find a missing entry by index arithmetic. An entry whose log index is
      greater than tail_index + 1 shows a forward gap (SYNC-14-001), and a replica that
      lags is valid only while its local prefix has no gaps. Both tests work only if
      the CASE_MANAGER never leaves a gap. CLP-14-001 requires only that indices
      increase, and CLP-14-005 requires only that they are unique. Neither excludes a
      sparse ledger.
    verification: '`check_clp14_timestamp_invariants` in `test/ci/invariants/common.py`
      reports a CLP-14-010 violation for any index missing between 0 and the highest
      recorded index. Every scenario runs this check through `universal_harness.py`.'
    adr:
    - ADR-0079
    relationships:
    - rel_type: refines
      spec_id: SYNC-01-002
    stories:
    - story_2026_028
- id: CLP-15
  title: Participant Assertion Timestamp Obligations
  description: Normative requirements on what well-behaved participants MUST do when
    emitting assertions to the CASE_MANAGER, so that the CASE_MANAGER's observation-order
    model (ADR-0079, CLP-14) yields a ledger that faithfully reflects real-world causal
    order within a single participant's event stream.
  specs:
  - id: CLP-15-001
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST emit the protocol activities for a case to the CASE_MANAGER in
      causal order. So if activity A causally precedes activity B in its own event
      stream, it emits A before B.
    rationale: The CASE_MANAGER uses arrival order as the authoritative sequence. If
      a participant emits B before A despite A causing B, the CASE_MANAGER's ledger will
      record the wrong causal order. The participant is responsible for correct ordering;
      the CASE_MANAGER cannot reconstruct causality it did not observe.
    note: This binds the participant only. It is NOT per-assertion enforceable by the
      CASE_MANAGER, and a CASE_MANAGER MUST NOT attempt to enforce it as one — CLP-15-005
      forbids reconstructing participant-internal causal order, and a stateless
      commit-boundary check cannot distinguish a causal violation from ordinary
      transport reordering (ADR-0037). Four `xfail(strict=True)` stubs were written
      against the enforcement reading and could never have passed (ISSUE-2824).
    verification: '`check_causal_edges` (DEMOMA-22-005) compares declared causal edges
      against observed ledger order across a whole scenario — the only vantage point
      from which an emission-order obligation is observable. Covered by
      `test/core/models/test_clp_14_15_invariants.py::test_clp_15_001_002_out_of_order_emission_detected_at_ledger_order`.'
    adr:
    - ADR-0079
    stories:
    - story_2026_029
  - id: CLP-15-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A participant MUST NOT batch causally ordered activities and submit them to the
      CASE_MANAGER in an order that reverses their causal dependencies. For example, it
      never submits A → B → C as C, A, B.
    rationale: Batched out-of-order submission produces a malformed ledger from the
      CASE_MANAGER's perspective. This is a protocol violation on the participant's part,
      not a CASE_MANAGER failure.
    note: Binds the participant only; not per-assertion enforceable by the CASE_MANAGER.
      See CLP-15-001 notes and CLP-15-005.
    verification: '`check_causal_edges` (DEMOMA-22-005), as for CLP-15-001.'
    adr:
    - ADR-0079
    relationships:
    - rel_type: refines
      spec_id: CLP-15-001
    stories:
    - story_2026_029
  - id: CLP-15-003
    priority: MUST
    kind: protocol
    statement: >-
      Within one participant's event stream, the participant MUST give each activity a
      `published` timestamp no earlier than that of every activity that causally
      precedes it.
    rationale: A participant that assigns earlier timestamps to later events produces
      a payloadSnapshot whose timestamp order contradicts the submission order. Even
      if the CASE_MANAGER's own entry timestamps are correct, the snapshot timestamps
      become evidence against the order recorded in the ledger.
    note: 'The obligation is the participant''s. A CASE_MANAGER MAY report an observed
      regression in a participant''s claimed timestamps, and SHOULD do so at a severity
      that distinguishes a regression within the configured clock-skew tolerance
      (CLP-14-009) from one beyond it. It MUST NOT refuse the assertion on this signal
      alone: the CASE_MANAGER observes arrival order, not causal order, so it cannot tell
      a genuine CLP-15-003 violation from transport reordering (ADR-0037) of two
      assertions that are not causally related. Refusing would also discard the
      assertion entirely, because the guarded commit precedes the effect nodes
      (CLP-10-006) — an outcome CLP-15-005 rules out.'
    verification: '`_validate_entry_timestamps` in
      `vultron/core/behaviors/sync/nodes/canonical_entry.py` reports the two bands;
      `test/core/behaviors/sync/nodes/test_chain_timestamp_guard.py` asserts the entry
      is still recorded and that the report level tracks the tolerance.'
    adr:
    - ADR-0079
    relationships:
    - rel_type: extends
      spec_id: CLP-15-001
    stories:
    - story_2026_029
  - id: CLP-15-004
    priority: SHOULD
    kind: protocol
    statement: A participant SHOULD assign published timestamps that reflect the actual
      time the event occurred, not the time the batch was submitted or a retry was
      attempted.
    rationale: Backdated or forward-dated timestamps degrade the forensic value of
      the ledger even when causal order is preserved. Timestamps that reflect actual
      occurrence time allow CaseActors and auditors to detect anomalies like stale
      replays (CLP-14-008).
    adr:
    - ADR-0079
    stories:
    - story_2026_029
    relationships:
    - rel_type: extends
      spec_id: CLP-15-006
  - id: CLP-15-006
    priority: MUST
    kind: protocol
    statement: >-
      A participant MUST include a `published` timestamp on every protocol activity it
      emits.
    rationale: >-
      ActivityStreams makes `published` optional. Each check that reads the claimed time
      needs the sender's value (CLP-14-007, CLP-14-008), so a sender that omits it makes
      those checks impossible.
    verification: >-
      `test_a_built_activity_carries_published_by_default` in
      `test/wire/as2/vocab/base/test_base_timestamps.py` asserts that an activity built
      with no `published` is stamped by the `as_Object` field default, which every
      activity class inherits.
    adr:
    - ADR-0079
    stories:
    - story_2026_029
  - id: CLP-15-008
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST refuse at message validation, as malformed, an inbound activity
      that carries no `published`, never substituting its own clock for the missing
      value.
    rationale: >-
      A receiver that fills in the field cannot later tell a time the sender claimed
      from one it made. Each check that reads the claimed time then compares the
      receiver's clock with itself and never fires (CLP-14-007, CLP-14-008). A receiver
      that creates its own outbound activity stamps its own clock, which is correct.
    verification: >-
      `parse_activity` in `vultron/wire/as2/parser.py` raises
      `VultronParseMissingPublishedError`, which the FastAPI inbox adapter maps to HTTP
      422. Covered by `test/wire/as2/test_parser.py`, including a non-vacuity test that
      pins the sender's value against the receiver's clock.
    relationships:
    - rel_type: extends
      spec_id: CLP-15-006
    adr:
    - ADR-0079
    stories:
    - story_2022_074
  - id: CLP-15-005
    priority: MUST
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      The CASE_MANAGER MUST record the sequence it observed in the order it received it.
      It never reorders that sequence to reconstruct a participant's internal causal
      order, which it cannot verify. Its ledger is authoritative for what it observed,
      not a guarantee of real-world causal fidelity when external participants
      self-report events.
    rationale: Even a compliant participant's clock may drift, and a non-compliant
      participant may submit events in arbitrary order. The CASE_MANAGER's role is to
      record faithfully what arrived, in the order it arrived, while applying the
      timestamp sanity checks in CLP-14-007 and CLP-14-008. Attempting to reorder
      entries based on payload timestamps would require trusting externally-supplied
      data to override the CASE_MANAGER's own observation — a violation of the single-writer
      authority model.
    adr:
    - ADR-0079
    stories:
    - story_2026_028
    relationships:
    - rel_type: refines
      spec_id: CLP-14-001
  - id: CLP-15-007
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST carry the `published` and `updated` timestamps of every object
      nested in an inbound activity as received. A timestamp the sender omitted stays
      absent: the receiver never substitutes its own clock for it, at parsing,
      extraction, storage or rendering.
    rationale: >-
      AS2 makes object timestamps optional. A value that the receiver makes is later
      indistinguishable from the sender's claim. For example, each receiver would derive
      its own genesis hash for one case, and order received statuses by arrival.
    verification: '`as_Base.carry_absent_times_on_inbound` reads an omitted clock-defaulted
      timestamp as `None` for any class validated under the inbound context `parse_activity`
      passes, the extractor builders pass timestamps through unchanged, and
      `project_wire_snapshot_to_core` does the same when a replica rebuilds a core object
      from a stored snapshot. Covered by `test/wire/as2/test_nested_timestamps.py` and
      `test/core/behaviors/sync/nodes/test_participant_status_effect.py`.'
    adr:
    - ADR-0103
    - ADR-0079
    - ADR-0032
    stories:
    - story_2026_029
  - id: CLP-15-009
    priority: MUST
    kind: protocol
    statement: >-
      When a decision requires a nested timestamp that is absent, the receiver MUST
      refuse the message at message validation.
    rationale: >-
      An absent time harms only a decision that needs it, so that decision refuses the
      message early and clearly. Every other consumer accepts the absence.
    verification: >-
      `test_case_needing_its_time_for_genesis_is_refused_at_parse` and
      `test_embargo_without_end_time_is_refused_at_parse` in
      `test/wire/as2/test_nested_timestamps.py` assert that a message missing a nested
      time a decision needs is refused at parse.
    relationships:
    - rel_type: extends
      spec_id: CLP-15-007
    adr:
    - ADR-0103
    - ADR-0079
    stories:
    - story_2022_074
  - id: CLP-15-010
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST reject at message validation an inbound activity carrying a
      `CaseStatus` with no `published`, wherever the status sits in it.
    rationale: >-
      Every status carries its author's time (SM-05-003), and its `published`
      follows its place in the case history (CM-29-005). A receiver that filled in
      a missing time would claim one no sender made (CLP-15-007), so the status is
      refused at message validation (CLP-15-009), as CLP-15-008 refuses an
      activity with no time.
      Participant statuses are not covered: nothing reads their time.
    verification: >-
      `test_parse_refuses_inline_case_status_without_published`,
      `test_parse_refuses_case_status_without_published_in_case_statuses` and
      `test_parse_refuses_case_status_without_published_in_a_participant_status`
      in `test/wire/as2/test_nested_timestamps.py` assert `parse_activity` raises
      `VultronParseMissingPublishedError` naming the status's position, and
      `test_post_untimed_case_status_to_actor_inbox_returns_422` in
      `test/adapters/driving/fastapi/routers/test_actors.py` asserts the inbox
      answers 422.
    adr:
    - ADR-0103
    relationships:
    - rel_type: refines
      spec_id: CLP-15-009
    stories:
    - story_2022_075
