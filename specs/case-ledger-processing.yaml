id: CLP
title: Case Ledger Processing
description: Requirements for participant assertions, CaseActor canonicalization, local case audit ledgering, recorded-history
  projection, and replication-facing CaseLedgerEntry objects. Covers the commit authorization model, per-case genesis hash
  derivation, the canonical entry criteria that separate the case ledger from the process log, and the CaseActor inbox routing
  path that enables ledger entry authorship.
version: 1.2.0
scope:
- prototype
- production
tags:
- protocol
- persistence
groups:
- id: CLP-01
  title: Assertion Intake
  specs:
  - id: CLP-01-001
    priority: MUST
    kind: protocol
    statement: Non-CaseActor activities that participate in a report, proto-case, or case workflow MUST be treated as participant
      assertions awaiting CaseActor processing
    verification: Integration tests in `test/demo/` confirm that activities sent by non-CaseActor participants
      are routed through assertion intake and buffered as participant assertions before the CaseActor processes
      them into canonical ledger entries.
  - id: CLP-01-002
    priority: MUST_NOT
    kind: protocol
    statement: The protocol MUST NOT require a separate "asserted mode" marker on ordinary participant activities for case/proto-case
      flows
  - id: CLP-01-003
    priority: MUST
    kind: protocol
    statement: The CaseActor MUST be the only actor that emits canonical case-history entries used by replicas
    verification: 'Integration tests in `test/demo/` confirm that every `CaseLedgerEntry` in the canonical ledger
      is authored by the CaseActor: the `actor` on the enclosing `Announce(CaseLedgerEntry)` transport always
      matches `case_actor_id`.'
  - id: CLP-01-004
    priority: MUST_NOT
    kind: protocol
    statement: Participant replicas MUST NOT project shared case state directly from peer assertions
- id: CLP-02
  title: Canonical `CaseLedgerEntry`
  specs:
  - id: CLP-02-001
    priority: MUST
    kind: protocol
    statement: For each case-resolvable assertion processed at the case layer, the CaseActor MUST append a canonical `CaseLedgerEntry`
    verification: Integration tests in `test/demo/` confirm that after each protocol-significant activity is
      processed at the case layer, the CaseActor's ledger grows by exactly one new `CaseLedgerEntry` for
      that case.
  - id: CLP-02-002
    priority: MUST
    kind: protocol
    statement: '`CaseLedgerEntry` MUST be a canonical content object distinct from any transport envelope used to replicate
      it'
    verification: Inspection of `vultron/core/models/case_ledger_entry.py` confirms that `CaseLedgerEntry` is
      a standalone Pydantic model that shares no inheritance with the `Announce` transport wrapper and can be
      serialized and validated independently.
  - id: CLP-02-003
    priority: MUST
    kind: protocol
    statement: '`CaseLedgerEntry` MUST include the asserted activity payload, or a normalized immutable snapshot of it, containing
      all fields required for deterministic replay'
    verification: '`test/core/behaviors/case/test_ledger_snapshots.py` confirms that each committed
      `CaseLedgerEntry` contains a non-empty `payloadSnapshot` that round-trips through `model_validate` on
      the corresponding wire vocabulary class.'
  - id: CLP-02-004
    priority: MUST
    kind: protocol
    statement: '`CaseLedgerEntry` MUST include a disposition field with at least `recorded` and `rejected`'
    verification: Inspection of `vultron/core/models/case_ledger_entry.py` confirms that the `disposition`
      field is a typed literal or enum accepting at least `"recorded"` and `"rejected"` as valid values.
  - id: CLP-02-005
    priority: SHOULD
    kind: protocol
    statement: Rejected `CaseLedgerEntry` objects SHOULD include a machine-readable reason code and MAY include human-readable
      detail
  - id: CLP-02-006
    priority: MUST
    kind: protocol
    statement: '`CaseLedgerEntry` MUST include a `log_index` field corresponding to SYNC-01-002.'
    verification: Inspection of `vultron/core/models/case_ledger_entry.py` confirms that `CaseLedgerEntry`
      declares a `log_index` field, and integration tests confirm it is populated on every committed entry.
  - id: CLP-02-008
    priority: MUST
    kind: protocol
    statement: The `log_index` field of a `CaseLedgerEntry` MUST be set by the CaseActor's single authoritative write path.
    rationale: Centralising log_index assignment in the single authoritative write path prevents gaps, duplicates, and
      out-of-order index values that would break hash-chain integrity.
    verification: Unit tests for `CommitCaseLedgerEntryNode` confirm that `log_index` is assigned within the
      authoritative commit node and that no external code path sets this field directly on the entry before
      commit.
  - id: CLP-02-009
    priority: MUST_NOT
    kind: protocol
    statement: The `log_index` field of a `CaseLedgerEntry` MUST NOT be assigned by external parties.
    rationale: Allowing external parties to set log_index would enable index spoofing, enabling forked or replayed
      ledger entries that corrupt the canonical append-only history.
  - id: CLP-02-007
    priority: MAY
    kind: protocol
    statement: '`CaseLedgerEntry` MAY include an optional `term` field reserved for Raft cluster use.'
  - id: CLP-02-010
    priority: SHOULD
    kind: protocol
    statement: In single-node deployments, the `term` field of a `CaseLedgerEntry` SHOULD be omitted or set to `null`.
    rationale: A single-node deployment has no Raft cluster; populating `term` in that context adds noise without meaning.
  - id: CLP-02-011
    priority: MUST
    kind: protocol
    statement: In multi-node CaseActor cluster deployments, the `term` field of a `CaseLedgerEntry` MUST be populated
      with the current Raft term at time of append.
    rationale: The Raft term anchors each ledger entry to the leader epoch in which it was written, enabling followers
      to detect stale leader writes during leader-change scenarios.
    verification: Integration tests confirm that `CaseLedgerEntry` objects produced in a multi-node CaseActor
      cluster deployment carry a non-null `term` field equal to the Raft term at the time of append.
- id: CLP-03
  title: Audit Scope and Continuity
  specs:
  - id: CLP-03-001
    priority: MUST
    kind: protocol
    statement: Only assertions that can be resolved to a specific report, proto-case, or case MUST be appended to the case
      audit ledger
    verification: Integration tests in `test/demo/` confirm that activities lacking a resolvable report,
      proto-case, or case ID are dropped before reaching `CommitCaseLedgerEntryNode` and produce no
      `CaseLedgerEntry` in the ledger.
  - id: CLP-03-002
    priority: MUST
    kind: protocol
    statement: Malformed, unauthenticated, or otherwise unrouteable inbound messages that cannot be attached to a report or
      case MUST be handled outside the case audit ledger
    verification: Integration tests in `test/demo/` confirm that malformed or unauthenticated inbound messages
      are handled in a pre-ledger error path and that no `CaseLedgerEntry` is written for them.
  - id: CLP-03-003
    priority: MUST
    kind: protocol
    statement: The assertion-recording model MUST support continuity from report receipt through the case lifecycle so that
      all history — including the proto-case stage (RM.RECEIVED / RM.INVALID) — is captured in the case audit ledger
    verification: Integration tests in `test/demo/test_receive_report_demo.py` confirm that `CaseLedgerEntry`
      objects are present for the initial report-receipt stage (RM.RECEIVED) before any case has been
      promoted, establishing audit continuity from first contact.
- id: CLP-04
  title: Recorded Projection and Replication
  specs:
  - id: CLP-04-001
    priority: MUST
    kind: protocol
    statement: The authoritative recorded history of a case MUST be a filtered projection of `CaseLedgerEntry` objects whose
      disposition is `recorded`
    verification: '`test/demo/test_ledger_dump.py` confirms that the recorded history projection contains only
      `CaseLedgerEntry` objects with `disposition="recorded"` and that no `disposition="rejected"` entries
      appear in it.'
  - id: CLP-04-002
    priority: MUST
    kind: protocol
    statement: Case-state reconstruction MUST use only the recorded projection and MUST ignore rejected entries
    verification: Integration tests in `test/demo/` confirm that case-state reconstruction reads exclusively
      from the recorded projection; when a rejected entry is present in the ledger, the reconstructed state
      matches the state derived from recorded-only entries.
  - id: CLP-04-003
    priority: MUST
    kind: protocol
    statement: Replicated hash chains, Merkle proofs, and replay state MUST be computed over recorded `CaseLedgerEntry` objects
      only
    verification: Integration tests in `test/demo/test_sync_ledger_replication.py` confirm that hash chain
      verification (`verify_hash_chain`) is computed only over recorded `CaseLedgerEntry` objects and passes
      for a correctly formed ledger.
  - id: CLP-04-004
    priority: MUST
    kind: protocol
    statement: CaseActor fan-out replication MUST deliver the canonical `CaseLedgerEntry` content, wrapped in an ActivityStreams
      transport envelope such as `Announce`
    verification: Integration tests in `test/demo/` confirm that each canonical ledger entry replicated from the
      CaseActor arrives at participants wrapped in an `Announce(CaseLedgerEntry)` ActivityStreams activity.
  - id: CLP-04-005
    priority: SHOULD
    kind: protocol
    statement: When a participant includes log-position context with an assertion, it SHOULD use the sender's last accepted
      canonical hash or position from the recorded projection
  - id: CLP-04-006
    priority: MUST
    kind: protocol
    statement: 'The canonical recorded log MUST be the authoritative source of truth for case participant membership and case state; implementations MUST NOT derive participant membership or case state from any other source.'
    verification: Integration tests in `test/demo/` confirm that participant membership lists and case state
      values are derived exclusively from the canonical recorded log rather than from any other data source
      such as the outbox or actor-local state.
- id: CLP-05
  title: Rejection Handling
  specs:
  - id: CLP-05-001
    priority: SHOULD
    kind: protocol
    statement: CaseActor rejection outcomes SHOULD be sent directly to the asserting participant rather than broadcast to
      all participants
  - id: CLP-05-002
    priority: MUST_NOT
    kind: protocol
    statement: Normal case-update fan-out MUST NOT replicate rejected `CaseLedgerEntry` objects to all case participants
  - id: CLP-05-003
    priority: SHOULD
    kind: protocol
    statement: The system SHOULD provide a convenient way to retrieve the recorded-only history projection without requiring
      consumers to manually filter rejected entries from the broader audit log
- id: CLP-06
  title: Pending Assertion Suppression
  specs:
  - id: CLP-06-001
    priority: SHOULD
    kind: protocol
    statement: Participant actors SHOULD maintain actor-local pending assertion state for recently emitted case-scoped assertions
      that are awaiting canonical `CaseLedgerEntry` confirmation
  - id: CLP-06-002
    priority: MUST_NOT
    kind: protocol
    statement: Pending assertion state MUST NOT be treated as canonical case history and MUST NOT be used as the authoritative
      source for participant membership or case state reconstruction
  - id: CLP-06-003
    priority: MUST
    kind: protocol
    statement: Implementations that provide pending assertion suppression MUST support a configurable timeout; the default
      timeout SHOULD be 180 seconds
    verification: A unit test confirms that the pending assertion suppression store's timeout defaults to 180
      seconds and that a constructor argument overrides the default to any positive value.
  - id: CLP-06-004
    priority: MUST
    kind: protocol
    statement: When a pending assertion reaches timeout without matching canonical confirmation, it MUST transition to a timed-out
      state and the system MUST emit an error log
    verification: A unit test confirms that when a pending assertion's suppression window elapses without a
      matching canonical confirmation, the entry transitions to a timed-out state and the system emits an
      error-level log message.
  - id: CLP-06-005
    priority: MUST_NOT
    kind: protocol
    statement: Pending assertion timeout handling MUST NOT automatically retry assertion emission; follow-up emission decisions
      MUST be made by subsequent behavior evaluation
  - id: CLP-06-006
    priority: MUST
    kind: protocol
    statement: A pending assertion entry MUST be cleared when a matching canonical `CaseLedgerEntry(recorded|rejected)` is
      observed
    verification: A unit test confirms that when a `CaseLedgerEntry` with either `disposition="recorded"` or
      `disposition="rejected"` arrives matching a pending assertion, that assertion entry is immediately
      removed from the pending store.
- id: CLP-07
  title: Canonical Entry Criteria and Ledger/Process-Log Separation
  specs:
  - id: CLP-07-001
    priority: MUST
    kind: protocol
    statement: A `CaseLedgerEntry` committed to the canonical case ledger MUST correspond to exactly one CaseActor-accepted
      protocol-significant assertion.
    verification: Integration tests in `test/demo/` confirm that each protocol-significant assertion accepted by
      the CaseActor produces exactly one new `CaseLedgerEntry` in the canonical ledger, with no duplicate
      entries for the same protocol event.
  - id: CLP-07-011
    priority: MUST
    kind: protocol
    statement: The `payloadSnapshot` of a `CaseLedgerEntry` MUST be the verbatim AS2 activity that was asserted, or a
      deterministic canonical normalization of it.
    rationale: The payload snapshot is the replication substrate; receivers must be able to reconstitute the asserted
      activity from the snapshot alone without an out-of-band lookup.
    verification: '`test/core/behaviors/case/test_ledger_snapshots.py` confirms that for every committed
      `CaseLedgerEntry`, the `payloadSnapshot` field contains a valid AS2 activity that revalidates through
      its wire vocabulary class via `model_validate` without transformation.'
  - id: CLP-07-012
    priority: MUST_NOT
    kind: protocol
    statement: The `payloadSnapshot` of a `CaseLedgerEntry` MUST NOT be empty for non-rejection entries.
    rationale: An empty payload snapshot for a recorded entry breaks deterministic replay and makes it impossible for
      replica nodes to reconstruct the case state from the canonical log.
  - id: CLP-07-002
    priority: MUST
    kind: protocol
    statement: Each logical state change MUST produce at most one canonical `CaseLedgerEntry`; the CaseActor MUST NOT commit
      both an accepted-participant-assertion entry and a separately-synthesized CaseActor entry for the same state change
    verification: Integration tests in `test/demo/` confirm that each logical state change produces at most one
      `CaseLedgerEntry`; no test scenario produces both an accepted-participant-assertion entry and a
      separately-synthesized CaseActor entry for the same state change.
  - id: CLP-07-003
    priority: MUST
    kind: protocol
    statement: The `payloadSnapshot.actor` field of a `CaseLedgerEntry(recorded)` MUST preserve the original asserting actor's
      identity; the CaseActor's own identity appears only on the `Announce(CaseLedgerEntry)` transport envelope and in CaseLedgerEntry
      recording metadata, never as a substitute for the asserter
    verification: Integration tests in `test/demo/` confirm that the `actor` field of every recorded
      `CaseLedgerEntry.payloadSnapshot` identifies the original asserting participant, not the CaseActor, even
      when the CaseActor is the one appending the entry.
  - id: CLP-07-004
    priority: MUST_NOT
    kind: protocol
    statement: The canonical case ledger MUST NOT contain runtime diagnostics, demo checkpoints, synthetic verification markers,
      troubleshooting events, or any per-actor observability content; such content belongs in the per-actor process log governed
      by `specs/structured-logging.yaml`
  - id: CLP-07-005
    priority: SHOULD
    kind: protocol
    statement: The CaseActor commit boundary SHOULD enforce CLP-07-001 through CLP-07-004 with a runtime guard that rejects
      non-canonical entries before they enter the hash chain, failing fast rather than silently polluting replicated history
  - id: CLP-07-006
    priority: MUST
    kind: protocol
    statement: Nested protocol objects referenced from a `payloadSnapshot` (e.g., `EmbargoEvent`, `VulnerabilityReport`, `Note`,
      `ParticipantStatus`) MUST be embedded inline as full objects in the snapshot; ID-string substitutions that require an
      out-of-band DataLayer lookup to resolve MUST NOT be used in canonical snapshots
    verification: '`test/core/behaviors/case/test_ledger_snapshots.py` confirms that nested objects such as
      `EmbargoEvent`, `VulnerabilityReport`, and `Note` appear as fully inlined AS2 objects in committed
      snapshots, with no bare ID strings remaining for those types.'
  - id: CLP-07-007
    priority: MUST
    kind: protocol
    statement: '`payloadSnapshot` context values MUST use the case URI once a case exists; report URIs MUST NOT appear as
      the context for ParticipantStatus or other case-scoped snapshots after the report→case promotion has occurred'
    verification: Integration tests in `test/demo/` confirm that `CaseLedgerEntry` objects created after
      report-to-case promotion carry the case URI (not the report URI) as the `payloadSnapshot.context`
      field for case-scoped entries such as `ParticipantStatus`.
  - id: CLP-07-008
    priority: MUST
    kind: project
    statement: If a canonicalization path resolves an ID-string nested reference for `payloadSnapshot` inlining, it MUST verify
      that the resolved object's context matches the parent snapshot context before replacement. On context mismatch, the
      entry MUST be rejected rather than inlining cross-case data.
    rationale: Blind `dl.read(id)` replacement can leak unrelated local objects into canonical snapshots when inbound activities
      carry attacker-controlled IDs.
  - id: CLP-07-009
    priority: MUST
    kind: project
    statement: A `payloadSnapshot` — and every object inlined into one under CLP-07-006 — MUST be in the wire (AS2) shape,
      such that the wire vocabulary class for its `type_` can revalidate it without translation. When the object being captured
      is a core domain object rather than a received activity, the wire shape MUST be produced through the core→wire rendering
      port (ARCH-20-001), never by dumping the core object with `by_alias=True` or by rewriting dumped keys in core.
    rationale: 'CLP-07-001 requires the snapshot to be reconstitutable by receivers, and CLP-01-003/CLP-01-004 make it the
      replication substrate. Two distinct failure modes existed: core objects with no `alias_generator` were inlined in snake_case
      (unreconstitutable), and `ParticipantStatus` was dumped with a core `by_alias=True` that cannot produce the wire''s flat
      `emConsentState`, so core hand-patched the dict afterwards. Both are removed by routing through the rendering port.'
    verification: For each canonical entry produced by the test suite, `payloadSnapshot` and each inlined nested object revalidate
      through their wire vocabulary class via `model_validate`, with no key renaming applied first.
    relationships:
    - rel_type: refines
      spec_id: CLP-07-001
    - rel_type: depends_on
      spec_id: ARCH-20-001
    adr:
    - ADR-0063
  - id: CLP-07-010
    priority: MUST_NOT
    kind: project
    statement: Core snapshot-construction code MUST NOT special-case individual field names to reach the wire spelling (e.g.
      moving a nested `consent.state` to a flat `emConsentState`). Structural differences between the core and wire shapes
      are the responsibility of the wire class's `from_core()` projection.
    rationale: A per-field patch in core is a partial reimplementation of `from_core()` that drifts as either shape evolves,
      and it is invisible to the wire layer's own round-trip tests. Each such patch also silently defines the canonical shape
      for exactly one type, leaving every other nested type unhandled.
    verification: No module under `vultron/core/` assigns a camelCase key into a snapshot dict.
    relationships:
    - rel_type: refines
      spec_id: CLP-07-009
    adr:
    - ADR-0063
- id: CLP-08
  title: Per-Case Genesis Hash Derivation and Origin Binding
  specs:
  - id: CLP-08-001
    priority: MUST
    kind: protocol
    statement: Each case ledger MUST use a per-case genesis hash as the predecessor hash for its first entry; a globally-shared
      constant MUST NOT be used as the genesis predecessor hash across all cases
    rationale: 'A shared global constant provides no cryptographic origin-binding: a ledger with all entries stripped is indistinguishable
      from a legitimately new empty ledger, and the well-known constant enables sync DoS amplification by allowing full-replay
      requests without any case-specific knowledge'
    verification: Unit tests in `test/core/models/test_case_ledger.py` confirm that `CaseLedger.tail_hash`
      returns the case-specific genesis hash (not a global constant) when no recorded entries exist, and
      that a second case produces a different genesis hash.
  - id: CLP-08-002
    priority: MUST
    kind: protocol
    statement: The per-case genesis hash MUST be derived as `SHA-256(case_id + "|" + created_at.isoformat() + "|" + case_actor_id)`,
      where `case_id` is the canonical case URI, `created_at` is the case creation UTC timestamp in ISO 8601 format, and `case_actor_id`
      is the URI of the CaseActor created for this case
    rationale: Including all three values cryptographically anchors the chain's starting point to the specific case's origin
      identity and timestamp, allowing any party who knows the case metadata to independently verify the ledger's genesis
    verification: A unit test confirms that `compute_genesis_hash(case_id, created_at, case_actor_id)` returns
      the SHA-256 hex digest of the concatenated string
      `case_id + "|" + created_at.isoformat() + "|" + case_actor_id`.
  - id: CLP-08-003
    priority: MUST
    kind: protocol
    statement: The case-specific genesis hash MUST be stored on `VulnerabilityCase` as a required field computed at case creation
      time, so that receivers can verify that a ledger starts correctly for this case
    verification: Inspection of `vultron/core/models/` confirms that `VulnerabilityCase` declares `genesis_hash`
      as a required field, and integration tests confirm it is populated with the per-case genesis hash at
      case creation time.
  - id: CLP-08-004
    priority: MUST
    kind: protocol
    statement: '`CaseLedger.tail_hash` MUST return the case-specific genesis hash when no recorded entries exist; it MUST
      NOT return a globally-shared constant sentinel'
    verification: Unit tests in `test/core/models/test_case_ledger.py` confirm that `CaseLedger.tail_hash`
      returns the per-case genesis hash when the recorded entry list is empty and returns the hash of the
      last recorded entry otherwise.
  - id: CLP-08-005
    priority: MUST
    kind: protocol
    statement: Sync replay and backfill requests that supply a `from_hash` value MUST use the case-specific genesis hash (or
      the hash of a known recorded entry) as the starting point; implementations MUST treat any unrecognized `from_hash` value
      as a request to replay from the beginning of the recorded projection
    verification: Integration tests in `test/demo/test_sync_ledger_replication.py` confirm that a sync replay
      request using the case-specific genesis hash as `from_hash` delivers the full recorded projection, and
      that an unrecognized `from_hash` falls back to replaying from the beginning.
  - id: CLP-08-006
    priority: MUST
    kind: protocol
    statement: The case URI used for origin-binding MUST contain a cryptographically random UUID component in its path
      segment to satisfy the non-spoofability guarantee of the per-case genesis hash (e.g.,
      `https://example.org/cases/<uuid>`).
    rationale: A cryptographically random path segment makes the genesis hash unique and unguessable per case, so a
      ledger with all entries stripped is distinguishable from a legitimately new empty ledger.
    verification: Static analysis (grep) confirms that the case URI factory generates case URIs containing a
      UUID4 component in the path segment; unit tests assert that newly created case URIs parse to a valid
      UUID4.
  - id: CLP-08-007
    priority: MUST_NOT
    kind: protocol
    statement: Implementations MUST NOT use sequentially predictable or human-chosen path segments in the case URI when
      origin-binding integrity is required.
    rationale: >-
      Predictable or human-chosen path segments allow an attacker to pre-compute a valid genesis hash and construct a
      forged chain. See `notes/case-ledger-authority.md` for future improvement paths (secret nonce, CaseActor keypairs).
- id: CLP-09
  title: Commit Authorization and Coverage
  specs:
  - id: CLP-09-001
    priority: MUST
    kind: protocol
    statement: Every call site that invokes the canonical commit operation MUST reach it only through a role-gated composition
      that verifies, at the time of invocation, that the active actor holds `CVDRole.CASE_MANAGER` for the case; this MUST
      be a role-based check, not an identity comparison, even where the CaseActor and the role holder happen to coincide today
    rationale: 'An audit of `CommitCaseLedgerEntryNode` call sites (Epic #788, issue #1021) found that only one of roughly
      ten call sites guarded the commit, and it did so with an ad hoc Python-level identity check outside the BT rather than
      a role check inside it. The other call sites committed unconditionally. Stating this as one vague authorization line
      (see BT-10-004) was not specific enough to prevent the gap from accumulating call site by call site.'
    verification: Unit tests for `GuardedCommitCaseLedgerEntryBT` confirm that the commit node only executes
      when the active actor's role list includes `CVDRole.CASE_MANAGER`, and integration tests in `test/demo/`
      confirm no unauthorized commit reaches the ledger.
  - id: CLP-09-002
    priority: MUST_NOT
    kind: protocol
    statement: The canonical commit operation MUST NOT be invoked directly (bare, unguarded) from any production call site
      outside the guarded-commit composition itself.
    verification: A dedicated test enumerates known commit call sites (or greps for the unguarded commit node's class name)
      and fails if any usage outside the guarded-commit factory's own implementation is found.
  - id: CLP-09-003
    priority: MUST
    kind: protocol
    statement: Every protocol-significant use case or BT subtree (per BT-06-001) MUST produce exactly one canonical commit;
      a coverage test MUST enumerate protocol-significant entries (e.g., everything reachable from `USE_CASE_MAP`) and assert
      each one reaches a commit, rather than relying on manual audit to discover missing commits
    rationale: '`validate_report`, `ack_report`, and `close_case` produced no canonical ledger entry at all on `main` for
      an unknown span of time (issue #998/#1022). Dispatch completeness is already enforced structurally for `USE_CASE_MAP`
      (DR-02-002, UCORG-02-002); commit completeness had no equivalent structural check and was found only by a manual re-audit.'
    verification: A coverage test enumerates all use cases reachable via `USE_CASE_MAP` and asserts that each
      one produces at least one `CaseLedgerEntry` with `disposition="recorded"` in a representative demo run.
  - id: CLP-09-004
    priority: MUST
    kind: protocol
    statement: When the same use-case class may be invoked with more than one receiving-actor identity for a single logical
      activity (e.g., a relayed copy delivered to a second participant), authorization for the commit MUST be evaluated per
      invocation against the active actor's role, and MUST NOT be assumed from the use-case class's identity or from the fact
      that earlier invocations were authorized
    rationale: 'The `ack_report` flow in the two/three-actor demo invokes the same use case once with the case actor as receiver
      and once with the finder as a relay target; only the case-actor invocation may commit. This is the same shape of bug
      that produced the original hash-chain fork in issue #923, and it recurs at every new dual-invocation call site unless
      authorization is re-evaluated per invocation rather than per use-case class.'
    verification: Integration tests in `test/demo/test_acknowledge_demo.py` confirm that when the same use-case
      class is invoked for both the CaseActor and a relay target for the same activity, only the CaseActor
      invocation produces a canonical ledger entry.
- id: CLP-10
  title: CaseActor Inbox Routing for Canonical Ledger Entry Authorship
  description: Requirements for the end-to-end routing path that delivers protocol-significant activities to the CaseActor's
    inbox so the CaseActor can author canonical ledger entries. Covers outbound addressing rules, HTTP loopback self-delivery
    (OX-12-004), and the pre-flight guard that prevents non-CaseActor invocations from committing ledger entries.
  specs:
  - id: CLP-10-001
    priority: MUST
    kind: protocol
    statement: Every protocol-significant trigger tree MUST emit at least one outbound activity addressed to `case_manager_id`
      (the CaseActor's actor ID) so that the CaseActor's inbox receives the activity and can author a canonical ledger entry.
      This requirement applies to ALL participants — the CaseActor is a participant with extra duties; it is not excluded
      from CLP-10-001. When the CaseActor itself originates an activity (e.g., `invite_actor_to_case`), it MUST include its
      own actor ID in the outbound activity's `cc:` field so that HTTP loopback self-delivery (OX-12-004) triggers the
      CaseActor's received-side use case and the `GuardedCommitCaseLedgerEntryBT` fires in the correct inbox context.
    rationale: 'Before ADR-0021, several trigger trees (e.g., `validate_report`, `ack_report`, `close_case`) emitted no activity
      addressed to the CaseActor. The CaseActor therefore had no protocol event to commit, and the canonical ledger was missing
      those event types entirely. The HTTP loopback self-delivery mechanism (OX-12-004) already handles routing when the
      target actor ID is the CaseActor''s own inbox; the missing piece was the emit node itself. The self-routing requirement
      also applies when the CaseActor is the originator: `invite_actor_to_case_trigger_bt` emitted an `Invite` addressed only
      to the invitee — the CaseActor never received its own activity and the canonical ledger had no `invite_actor_to_case`
      entry. Using `cc:` rather than `to:` for the self-copy preserves the semantics that the invitee is the primary recipient
      while still routing the activity through the CaseActor''s inbox for archival. See OX-08-004 for the updated addressing
      policy and ADR-0021 for the full end-to-end path.'
    note: >-
      The self-`cc:` clause binds only where the canonical entry depends on inbox loopback. A tree that
      emits under a `CVDRole.CASE_MANAGER` gate and wraps the emit in `create_receive_activity_tree`
      with a `case_id` commits the entry itself (CLP-10-013), so the entry already exists and a
      self-addressed copy adds no record — see EMB-19-001 for the worked case, where addressing the
      manager also made the announce reach nobody.
    verification: For each entry in `EXPECTED_EVENT_TYPES`, a test verifies that the CaseActor's canonical ledger contains
      at least one entry with that `eventType` after a full FV demo run.
    adr:
    - ADR-0021
  - id: CLP-10-002
    priority: MUST
    kind: project
    statement: A received-side use case MUST include a pre-flight guard that compares `receiving_actor_id` to `case_actor_id`
      before executing any canonical ledger commit operation; if `receiving_actor_id != case_actor_id`, the commit step MUST
      be skipped entirely
    rationale: The correct pattern (established in `status.py`'s `_commit_log_cascade_bt`) is to commit only when the actor
      running the use case IS the CaseActor. When a non-CaseActor inbox receives the same activity (e.g., a relay copy to
      a finder), the use case runs but skips the commit. The CaseActor's own inbox delivery (via CLP-10-001) is responsible
      for the canonical write.
    verification: Unit tests for each received-side use case that participates in ledger authorship assert that `create_guarded_commit_case_ledger_entry_tree`
      (or the BT bridge) is NOT called when `receiving_actor_id` differs from the resolved `case_actor_id`.
  - id: CLP-10-003
    priority: MUST_NOT
    kind: project
    statement: A received-side use case MUST NOT execute a BT or call the canonical commit operation with `actor_id` set to
      any actor other than `receiving_actor_id`; resolving a foreign `case_actor_id` and passing it to `BTBridge.execute_with_setup`
      from the wrong DataLayer context is an identity-spoofing violation and MUST NOT occur
    rationale: '`note.py` and `embargo.py` contained this exact violation before ADR-0021: they resolved the CaseActor ID
      from the DataLayer and ran the guarded-commit BT with `actor_id=case_actor_id` even when the active DataLayer belonged
      to the vendor actor. This produced outbox entries attributed to the wrong actor and caused hash-chain divergence. See
      AGENTS.md § "Received-Side Use Cases MUST NOT Spoof Another Actor''s Identity" for the general rule; CLP-10-003 is the
      specific application to the canonical ledger commit path.'
    verification: A static grep check (or dedicated test) asserts that no received-side use case module passes a separately
      resolved actor ID to `BTBridge.execute_with_setup` — only `receiving_actor_id` (or a name that is provably equal to
      it) may appear as the `actor_id` argument.
    adr:
    - ADR-0021
  - id: CLP-10-004
    priority: MUST_NOT
    kind: protocol
    statement: The `announce_case_ledger_entry` event type MUST NOT appear in `EXPECTED_EVENT_TYPES` for the case-actor canonical
      log; `Announce(CaseLedgerEntry)` is the replication envelope that carries canonical entries to participants and cannot
      itself be a `payloadSnapshot` inside a canonical entry
    rationale: 'Including `announce_case_ledger_entry` in `EXPECTED_EVENT_TYPES` creates a circular requirement: the CaseActor
      would need to commit a ledger entry whose payload is the `Announce` activity used to broadcast ledger entries, which
      is self-referential and unachievable without corrupting the hash chain. The `Announce(CaseLedgerEntry)` wire envelope
      is a transport artifact, not a protocol-significant domain event; it belongs to the SYNC replication layer (SYNC-02-002),
      not the canonical ledger content layer.'
    verification: '`test_invariant_5_expected_event_types_present` (after parameterization) does not include `announce_case_ledger_entry`
      as a required event type for the case-actor replica.'
  - id: CLP-10-005
    priority: MUST
    kind: project
    statement: 'A received-side use case''s `execute()` method MUST do exactly three things: build one BT via a tree-factory
      function in `vultron/core/behaviors/`, call `BTBridge.execute_with_setup()` exactly once with `actor_id=receiving_actor_id`
      to run it, and handle the result (log/extract output per the existing Procedural Glue Exception). `execute()` MUST NOT
      perform any other domain-significant work — no direct DataLayer mutation, no second `execute_with_setup()` call, and
      no direct import or call of `create_guarded_commit_case_ledger_entry_tree` (or any other guarded-commit factory).'
    rationale: 'CLP-10-002/CLP-10-003 (ADR-0021) correctly require a pre-flight guard before committing, and correctly require
      the guard to compare against `receiving_actor_id`. An audit (issue #1036, broadened to also resolve issue #1047) found
      three distinct ways the single-tree intent was violated, all closed by the same rule: (1) `embargo.py` (3 use cases)
      and `report.py`/`status.py` (3 use cases) ran a genuine second, independently Python-gated `execute_with_setup()` call
      under a different actor identity for the commit — literal actor-switching, reproducing the "post-BT procedural cascade"
      anti-pattern (see `notes/bt-integration.md`) for the commit step specifically; in `embargo.py`''s case the main tree
      already (uselessly) embeds the same guarded-commit branch under the wrong actor, so the first execution is a guaranteed
      no-op. (2) `note.py` and `actor/case_manager_role.py` (deleted, issue #2429) called the commit factory exactly once but
      preceded it with domain-significant procedural code (DataLayer mutation, broadcast, trigger-activity calls) for the main
      operation, outside any BT — `execute()` was not "build one tree, run it, handle the result" even though only one
      `execute_with_setup()` call existed. (3) `case/lifecycle.py`
      already executes a single tree under the correct actor but constructs it ad hoc inside `execute()` instead of via a
      `behaviors/` factory function. See ADR-0022 for the full per-site breakdown.'
    verification: '`test/architecture/test_single_bt_execution_received_side.py` greps every module under `vultron/core/use_cases/`
      for imports of `create_guarded_commit_case_ledger_entry_tree`; any match outside the guarded-commit factory''s own module
      is a violation. Known violations are tracked as a ratchet set (`KNOWN_VIOLATIONS`) that must shrink to empty as each
      use case migrates to the single-tree shape. The grep is a proxy for the broader "execute() does nothing but build-run-handle
      one tree" rule; it catches every known violation but a reviewer MUST still confirm no other domain-significant code
      remains in `execute()` when closing each migration.'
    adr:
    - ADR-0021
    - ADR-0022
  - id: CLP-10-007
    priority: MUST
    kind: protocol
    statement: Any operation that is procedural code in `execute()` (including the use case's main operation) MUST be expressed
      as a node in the single BT tree built by the tree-factory function.
    verification: Inspection of every `execute()` method in `vultron/core/use_cases/received/` confirms that
      domain-significant operations are expressed as BT nodes within the single tree-factory function and
      that no procedural domain logic appears directly in `execute()`.
    relationships:
    - rel_type: refines
      spec_id: CLP-10-005
  - id: CLP-10-008
    priority: MUST
    kind: protocol
    statement: The guarded-commit subtree MUST be composed as a child of the tree-factory function, not invoked as a separate
      `execute_with_setup()` call.
    verification: '`test/architecture/test_single_bt_execution_received_side.py` confirms that no received-side
      `execute()` method calls `BTBridge.execute_with_setup()` more than once, enforcing that the
      guarded-commit subtree is composed into the single tree rather than invoked separately.'
    relationships:
    - rel_type: refines
      spec_id: CLP-10-005
    - rel_type: refines
      spec_id: CLP-10-002
  - id: CLP-10-006
    priority: MUST
    kind: project
    statement: 'In any receive-side BT tree that includes a `GuardedCommitCaseLedgerEntryBT` subtree (composed via
      `create_guarded_commit_case_ledger_entry_tree`), the commit subtree MUST appear after all pure precondition-guard
      nodes and before any protocol-effect nodes. A precondition-guard node is one that only reads state and returns
      FAILURE on mismatch, making no writes; a protocol-effect node is any node that writes to the DataLayer, mutates
      actor or participant state, or enqueues an outbox item.'
  - id: CLP-10-010
    priority: MUST
    kind: project
    statement: 'In any receive-side BT tree that includes a `GuardedCommitCaseLedgerEntryBT` subtree, the ordering
      MUST be: (1) precondition guards, (2) commit, (3) all protocol effects.'
    rationale: The canonical case ledger records the cause (the received activity) and replicates it to all
      participants. Recording cause before applying effects ensures the audit log is causally coherent.
  - id: CLP-10-011
    priority: MUST
    kind: project
    statement: A receive-side BT tree that applies any protocol effect before committing the triggering activity inverts
      causal ordering and MUST be corrected.
    rationale: >-
      Audit issue #1068 found inverted ordering consistently across receive-side BTs. Participants replicating via
      Announce(CaseLedgerEntry) would observe effect entries with no prior cause entry, making forensic and audit use
      of the ledger unreliable.
    rationale: 'The canonical case ledger records the cause (the received activity) and replicates it to all participants.
      If protocol effects (state transitions, outbox enqueues, participant updates) run before the ledger records the triggering
      activity, the case ledger may show effects without the causes that produced them. Participants replicating the ledger
      via `Announce(CaseLedgerEntry)` would observe an effect entry with no prior cause entry — making forensic and audit
      use of the ledger unreliable. Audit issue #1068 found this inverted ordering consistently across receive-side BTs in
      `vultron/core/behaviors/` and `vultron/core/use_cases/received/`. The ledger entry records that the activity was received
      and accepted by the CaseActor — this is independent of whether subsequent effects succeed (a failed effect is an operational
      concern, not a reason to omit the received-activity record).'
    verification: A structural test in `test/architecture/` inspects each receive-side BT tree returned by every tree-factory
      function in `vultron/core/behaviors/`. For any tree containing `CommitCaseLedgerEntryNode` (or the guarded composite
      wrapping it), the test asserts that no sibling node appearing before the commit node in the `children` list is a protocol-effect
      node (i.e., any node whose class name does not match the known precondition-guard allowlist). The test fails if any
      receive-side tree violates commit-first ordering.
  - id: CLP-10-009
    priority: MUST
    kind: project
    statement: 'In a receive-side BT composed via `create_receive_activity_tree`, every node that can return FAILURE to
      refuse an inbound assertion (a rejection validator) MUST appear in `precondition_guards`; a rejection validator
      placed in `effect_nodes` aborts the Sequence after GuardedCommit has already written a canonical ledger entry,
      producing canonical/replica divergence (ISSUE-2254).'
  - id: CLP-10-012
    priority: MUST_NOT
    kind: project
    statement: A separate `ValidateRMTransitionNode` in `effect_nodes` MUST NOT be used in the receive-side path;
      `FilterParticipantStatusDimensionsNode` satisfies the per-dimension adjudication requirement for an inbound
      `ParticipantStatus` and a redundant validator after the commit creates divergence.
    rationale: >-
      `add_participant_status_tree` previously contained `ValidateRMTransitionNode` after `GuardedCommit`, masked by a
      `_rm_was_carried_forward()` workaround. Both were corrected in ISSUE-2254.
  - id: CLP-10-013
    priority: MUST
    kind: project
    statement: Every receive-side tree that uses `create_receive_activity_tree` MUST also pass `case_id` so that a
      canonical ledger entry is committed for each accepted activity.
    rationale: A tree that omits `case_id` omits the cause entry from the ledger, breaking the causal completeness
      guarantee that the canonical log is supposed to provide.
    rationale: 'A rejection validator (FAILURE-on-mismatch, read-only) belongs before the commit; an effects node (writes,
      enqueues, state mutations) belongs after. Mixing the two — placing a rejection validator in effect_nodes — creates a
      window where the ledger records receipt of an activity the local actor then refuses to apply, violating the audit guarantee
      that every ledger entry corresponds to a locally applied protocol event. `add_participant_status_tree` previously
      contained `ValidateRMTransitionNode` after `GuardedCommit`, masked by a `_rm_was_carried_forward()` workaround.
      `add_case_status_tree` previously used a plain `py_trees.Sequence` with no commit at all. Both were corrected in ISSUE-2254.'
    relationships:
      - rel_type: refines
        spec_id: CLP-10-006
- id: CLP-11
  title: Protocol Request/Reply State Detection
  description: Requirements for querying whether a protocol-level request/reply pair (e.g., Offer(CaseParticipant) → Accept/Reject)
    is still open or has been closed. These rules establish the canonical pattern for duplicate-emission suppression and CaseActor
    decision-gate checks.
  specs:
  - id: CLP-11-001
    priority: MUST
    kind: protocol
    statement: Open/closed state for a protocol request/reply pair (e.g., `Offer(CaseParticipant)` awaiting `Accept` or `Reject`)
      MUST be determined by querying the case ledger via `CasePersistence.find_protocol_pair()`, not by inspecting the outbox.
    rationale: 'The outbox is a delivery queue: entries are removed when the activity is sent and MUST NOT be used to infer
      protocol state. The case ledger is the canonical append-only protocol history and survives actor restarts. Any code
      that reads the outbox to determine whether a request is still in-flight is architecturally incorrect and MUST be replaced.'
    verification: A unit test confirms that `CasePersistence.find_protocol_pair()` queries the `CaseLedgerEntry`
      log to determine open/closed state, and that no code path reads the outbox to make this determination.
  - id: CLP-11-002
    priority: MUST_NOT
    kind: protocol
    statement: '`find_protocol_pair()` (durable, DataLayer-backed) and `PendingAssertionStore` (ephemeral, in-memory suppression)
      MUST NOT be unified. They serve distinct purposes: `find_protocol_pair` determines canonical open/closed state from
      the ledger; `PendingAssertionStore` suppresses duplicate near-term re-emits while waiting for the `CaseLedgerEntry`
      round-trip. Merging them would conflate durable protocol state with short-lived emit-suppression state.'
  - id: CLP-11-003
    priority: MUST
    kind: protocol
    statement: '`ProtocolPair` MUST be the shared value type for both `find_protocol_pair()` and `PendingAssertionStore`.
      Named reply-type constants (`OFFER_CASE_PARTICIPANT_REPLY_TYPES`, `INVITE_ACTOR_TO_CASE_REPLY_TYPES`) MUST be used when
      constructing or querying a `ProtocolPair` to avoid hard-coding reply event-type strings at call sites.'
    verification: Static analysis (grep) confirms that all call sites constructing or querying a `ProtocolPair`
      use the named constants `OFFER_CASE_PARTICIPANT_REPLY_TYPES` or `INVITE_ACTOR_TO_CASE_REPLY_TYPES`
      rather than inline event-type strings.
  - id: CLP-11-004
    priority: SHOULD
    kind: protocol
    statement: When searching for a reply entry in `find_protocol_pair()`, the implementation SHOULD use the `event_type`
      field of `CaseLedgerEntry` (derived from `MessageSemantics.value`) as the primary key, scoped to `case_id`. `in_reply_to`
      chain-following is an internal implementation detail and MUST NOT be exposed as a public port primitive.
- id: CLP-12
  title: CaseActor-Authored Signature Completeness
  description: >-
    Requirements on the set of canonical-entry signatures the CaseActor is
    authorized to author (`_CASE_AUTHORED_SIGNATURES` in `canonical_entry.py`), ensuring
    all case-initialization operations are expressible without falling back to
    vendor authorship or back-fill workarounds.
  specs:
  - id: CLP-12-001
    priority: MUST
    kind: project
    statement: '`Add(CaseStatus)` ledger entries authored by the CaseActor MUST be accepted as canonical entries by the
      ledger validation step.'
    rationale: >-
      Issue #1767: `("Add", "CaseStatus")` appeared in `_CANONICAL_PAYLOAD_SIGNATURES`
      but was absent from `_CASE_AUTHORED_SIGNATURES`, causing the ledger validator
      to reject CaseActor-authored `add_case_status_to_case` entries. Fix required
      by ADR-0041's native-initialization model (CM-22-003).
    relationships:
    - rel_type: implements
      spec_id: CM-22-003
    adr:
    - ADR-0041
  - id: CLP-12-002
    priority: MUST
    kind: project
    statement: >-
      `_CASE_AUTHORED_SIGNATURES` MUST be a complete superset of all
      `("verb", "object-type")` pairs emitted by the CaseActor during native
      case initialization (create_case, add_report_to_case,
      add_participant_status_to_participant × N, add_case_status_to_case).
      Any pair present in `_CANONICAL_PAYLOAD_SIGNATURES` that the CaseActor
      natively authors MUST also appear in `_CASE_AUTHORED_SIGNATURES`.
    rationale: >-
      A CaseActor that cannot author its own initialization entries must resort
      to vendor-side workarounds (the pattern that ADR-0015 introduced and
      ADR-0041 supersedes).  Maintaining completeness of the authorized
      signature set is therefore a prerequisite for the corrected
      CaseActor-authoritative model.
    relationships:
    - rel_type: refines
      spec_id: CLP-12-001
    adr:
    - ADR-0015
    - ADR-0041

- id: CLP-13
  title: Idempotency Guard Silence
  description: >-
    Requirements ensuring that BT idempotency guards (duplicate-detection
    conditions that abort processing when an event has already been handled)
    do NOT write ledger entries of any disposition.  The canonical case ledger
    records protocol assertions; internal guard no-ops are process-log content
    only (ADR-0019).
  specs:
  - id: CLP-13-001
    priority: MUST_NOT
    kind: project
    statement: >-
      A BT idempotency guard that detects a duplicate and returns
      ``Status.FAILURE`` to abort processing MUST NOT write a
      ``CaseLedgerEntry`` of any disposition (``"recorded"`` or
      ``"rejected"``).
    rationale: >-
      Concern #1754: when ``CheckInviteeNotAlreadyParticipantNode`` fired
      (actor already a participant), it caused a downstream
      ``disposition="rejected"`` ledger entry to be written.  That entry
      appeared in demo reports as "Invited an actor to the case [rejected]"
      with no actor name and no state transition — a misleading non-event
      in the canonical audit trail.  ADR-0019 states the ledger "should
      either record the event or stay silent."  An already-handled
      duplicate is a guard no-op, not a protocol event; it belongs in the
      process log (Python ``logging``), not in the replicated ledger.
    relationships:
    - rel_type: refines
      spec_id: CLP-07-001
    adr:
    - ADR-0019
  - id: CLP-13-002
    priority: MUST
    kind: project
    statement: >-
      Idempotency guard behaviour MUST be encapsulated in a reusable
      ``SilentIdempotencyGuardMixin`` (or equivalent composable BT pattern)
      so that the silent-failure-on-duplicate invariant is expressed once
      and tested once, not re-implemented per call site.
    rationale: >-
      Concern #1754 audit revealed multiple ad-hoc duplicate-detection
      checks scattered across BT trees.  Centralising the pattern prevents
      future call sites from inadvertently re-introducing ledger writes on
      guard no-ops.
    relationships:
    - rel_type: implements
      spec_id: CLP-13-001
  - id: CLP-13-003
    priority: MUST
    kind: project
    statement: >-
      When an idempotency guard fires and returns ``Status.FAILURE``, it
      MUST emit a Python ``logger.info`` or ``logger.debug`` message
      recording the duplicate detection.  No other observable side effect
      (ledger write, outbox enqueue, DataLayer mutation) is permitted.
    rationale: >-
      Separating the positive logging obligation (CLP-13-003, priority: MUST)
      from the prohibition on ledger writes (CLP-13-001, priority: MUST_NOT)
      makes each requirement independently testable and visible to tooling
      that filters by priority level.
    relationships:
    - rel_type: implements
      spec_id: CLP-13-001
