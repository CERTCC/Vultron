id: CSAF
title: CSAF Documents in Reports
description: >-
  Requirements for a Common Security Advisory Framework (CSAF) 2.1 document that
  travels as an attachment of a VulnerabilityReport: how it is carried and
  recognized, the one occasion on which a receiver may read it as the sender's
  statement (the initial Offer of a report), how its fields map onto the inputs of
  the case created from that report, and how this codebase checks documents
  against a CSAF 2.1 draft that is still changing. Producing a CSAF document from a
  case (a projection) is out of scope (#5134).
scope:
- prototype
- production
tags:
- wire-format
- protocol
groups:
- id: CSAF-01
  title: Carrying a CSAF Document in a Report
  specs:
  - id: CSAF-01-001
    priority: MUST
    kind: protocol
    statement: >-
      A sender that includes a CSAF document with a `VulnerabilityReport` MUST
      carry it as a `Document` object in the report's `attachment`, with the
      JSON text of the CSAF document as the `content` of that `Document`.
    rationale: >-
      AS2 `content` is a string, so the report's own `content` cannot hold a JSON
      object, and the report's text stays readable by a receiver that does not
      read CSAF. An attachment list also lets one report carry the CSAF document
      beside other files, in the way ActivityPub servers attach media to a note.
      Inline `content` keeps the document inside the signed activity (SIG-01-003)
      and inside the copy that the case ledger records.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_trigger_submit_report_csaf.py::test_a_valid_csaf_document_is_sent_as_an_attached_json_document`
      submits a report with a CSAF document and checks that the sent report carries it
      as a `Document` in `attachment`, its JSON text as that `Document`'s `content`, and
      the request's text as the report's own `content`;
      `::test_the_stored_report_keeps_the_attachment` checks the same of the
      Reporter's stored report.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-01-002
    priority: MUST
    kind: protocol
    statement: >-
      The `Document` that carries a CSAF document MUST have the `mediaType`
      `application/json`.
    rationale: >-
      CSAF registers no media type of its own, and the distribution feeds that the
      CSAF draft defines label each CSAF document `application/json`. A media type
      that only Vultron invented would mean nothing to other tools.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_trigger_submit_report_csaf.py::test_a_valid_csaf_document_is_sent_as_an_attached_json_document`
      checks that the attached `Document` has the `mediaType` `application/json`.
    relationships:
    - rel_type: extends
      spec_id: CSAF-01-001
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-01-003
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST recognize an attached document as CSAF 2.1 from the document
      itself, by its `$schema` value and its `document.csaf_version` value.
    rationale: >-
      `application/json` does not tell CSAF apart from other JSON. The CSAF 2.1
      schema fixes both values, so they identify the format, and
      `document.category` then names the profile.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf.py::test_only_the_csaf_attachment_is_recognized_as_csaf`
      delivers a report with a JSON document that is not CSAF and a CSAF 2.1
      document attached, and checks that only the second gets a claims record.
      `test/wire/csaf/test_reader.py::test_a_document_that_does_not_say_csaf_21_is_not_recognized`
      checks that a document with another `$schema` or `document.csaf_version` is
      not recognized.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
- id: CSAF-02
  title: The Sender's Statement at the Initial Report
  specs:
  - id: CSAF-02-001
    priority: MAY
    kind: protocol
    statement: >-
      A receiver MAY fill a value that an initial `Offer(VulnerabilityReport)` and
      its report leave unstated from a CSAF document of category
      `csaf_vulnerability_report` attached to that report. The Offer is initial
      when its report belongs to no case at the receiver.
    rationale: >-
      At the first report the CSAF document is the sender's own account of the
      report, made for this exchange by the CSAF Vulnerability Report profile, so
      it can supply what the Vultron fields leave out. Reading it stays optional:
      a receiver that treats the document as opaque still handles the report.
    note: >-
      The receiver is the coordinating function that received the report: the
      report receiver that proposes the case and the CASE_MANAGER that creates it
      are two of its roles. In this codebase the CASE_MANAGER reads the document
      on the Offer its `Create(CaseProposal)` carries (CP-01-008, CP-01-021) when
      the proposal creates a new case, and records what became of each value; the
      proposer's own record keeps every value display only, so no record says a
      value shaped a case it did not shape. A proposer may also fill the values
      itself and carry them on the proposal; nothing here forbids it. When a
      report carries several `csaf_vulnerability_report` documents, the first
      one fills the case and the others stay display only.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_missing_name_and_summary_come_from_the_csaf_document`
      offers a report with no case yet, a `csaf_vulnerability_report` attachment
      and no name, and checks that the case a separate CASE_MANAGER creates takes
      its inputs from the document;
      `::test_only_the_creating_side_marks_what_shaped_the_case` checks that the
      receiver's record keeps every value display only while the CASE_MANAGER's
      record marks what the case took.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-02-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiver MUST NOT change case data from a CSAF document other than the one
      that CSAF-02-001 names: a document on another activity, on a report that
      already belongs to a case, in a vulnerability item, or of another category.
    rationale: >-
      Participants produce CSAF documents from their copies of a case and share
      draft advisories in CSAF. Such a document is a result of the case, so
      reading it back as a statement would let a projection rewrite the case it
      describes. The case changes only through Vultron's own activities. A
      `Create(CaseProposal)` that carries the initial Offer (CP-01-008) is not
      another activity in this sense: the proposer and the CASE_MANAGER are two
      roles of the one coordinating function that received the report, so the
      CSAF document on that Offer is still the initial report reaching it.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_document_of_another_category_changes_no_case_data`
      and
      `::test_csaf_on_a_report_that_already_has_a_case_changes_no_case_data` send
      a CSAF document of another category, and one on a report that already has a
      case, and check that the case data does not change and no outcome is marked;
      `::test_csaf_on_the_proposal_itself_changes_no_case_data` checks that a
      document on a proposal's own report, with no carried Offer, fills nothing.
    adr:
    - ADR-0184
    stories:
    - story_2026_100
    relationships:
    - rel_type: uses_definition
      spec_id: CSAF-02-001
  - id: CSAF-02-003
    priority: MUST
    kind: protocol
    statement: >-
      When the Offer or its report states a value and the attached CSAF document
      states a value for the same thing, the receiver MUST use the value of the
      Offer or the report.
    rationale: >-
      The Vultron fields are the sender's statement in the protocol, and the CSAF
      document is the material the report describes. One rule for every field
      keeps a receiver from weighing two answers, for example a `proposedEmbargo`
      against a `disclosure_date`.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_vultron_field_beats_the_csaf_value`
      offers a report whose name
      and `proposedEmbargo` differ from its CSAF document, and checks that the case
      takes the Vultron values and the record marks the CSAF values overridden;
      `::test_an_offer_embargo_that_has_run_out_sets_no_csaf_date_aside` checks
      that a `proposedEmbargo` already ended states no value, so the document's
      date is applied.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-02-004
    priority: SHOULD
    kind: protocol
    statement: >-
      A sender SHOULD give the report's name, its summary and the Offer's
      `proposedEmbargo` values that agree with the CSAF document it attaches.
    rationale: >-
      A sender is free to fill the Vultron fields as it chooses, and CSAF-02-003
      makes them win. Values that agree with the attachment keep the two accounts
      of one report from contradicting each other.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_trigger_submit_report_csaf.py::test_a_missing_name_summary_and_embargo_end_come_from_the_document`
      checks that the name, summary and proposed embargo end that the sender fills
      agree with the attached document.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-02-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiver MUST NOT take a value that the CSAF document does not contain as
      a statement by the sender, including a default that the CSAF schema declares.
    rationale: >-
      An omitted field states nothing, so the case input falls back to what the
      receiver does for a report with no CSAF document. A schema default, such as
      the TLP label `CLEAR`, is filled in by a parser and was never sent.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf.py::test_an_omitted_field_with_a_schema_default_has_no_stored_value`
      delivers a document whose reference omits the `category` that the schema
      defaults to `external`, and checks that the stored record holds no value for
      it.
      `test/wire/csaf/test_reader.py::test_a_schema_default_is_not_claimed_from_an_invalid_document_either`
      checks the same of a schema-invalid document.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-02-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiver MUST NOT refuse an `Offer(VulnerabilityReport)` because its
      attached CSAF document cannot be read or fails the CSAF 2.1 schema.
    rationale: >-
      The report is valid or invalid by the receiver's report-validation decision,
      not by the form of one attachment, and refusing would leave a real
      vulnerability unreported. The receiver reads what it can (CSAF-04-003).
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf.py::test_a_broken_csaf_attachment_never_refuses_the_report`
      delivers a schema-invalid CSAF document, an attachment that is not JSON and
      one whose `document` is not an object, and checks that each Offer is
      applied, its report kept with the attachment and its case proposed.
      `test/core/use_cases/received/test_submit_report_csaf.py::test_an_attachment_that_is_no_file_never_refuses_the_report`
      delivers a `Note`, a `Link` and a bare URI beside the CSAF document, and checks
      that each Offer is applied and the CSAF document still read.
      `test/wire/csaf/test_reader.py::test_a_branch_tree_deeper_than_the_recursion_limit_is_still_read`
      checks that a product tree deeper than the interpreter's recursion limit is
      read, not raised on.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-02-007
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A sender SHOULD NOT attach a CSAF document that fails the CSAF 2.1 schema.
    rationale: >-
      A sender is strict in what it sends and a receiver lenient in what it
      accepts (CSAF-02-006). A schema-valid document lets every receiver read it
      the same way.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_trigger_submit_report_csaf.py::test_a_schema_invalid_document_is_refused_naming_each_fault`
      checks that a schema-invalid document is refused and nothing is sent.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
- id: CSAF-03
  title: Case Inputs From the Initial Report
  specs:
  - id: CSAF-03-001
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that fills case inputs from a CSAF document (CSAF-02-001) MUST
      take a `vulnerabilities[].disclosure_date` later than the time of receipt as
      the end of the sender's proposed embargo, when the Offer carries no
      `proposedEmbargo`.
    rationale: >-
      The CSAF 2.1 draft says that a future disclosure date indicates the intended
      date for disclosure, also called the embargo date, and the Vulnerability
      Report profile uses it to coordinate that date. It then competes with the
      receiver's own default as any proposed embargo does (EP-04-003).
    note: >-
      In this codebase the time of receipt is the instant the CASE_MANAGER
      receives the `Create(CaseProposal)` that carries the Offer: the report
      receiver's own receipt time travels on no message, and the CASE_MANAGER
      reads no clock of another actor. The two instants differ only by the
      proposal's delivery. A case that starts with P, X or A takes no embargo
      (EP-04-020), so no disclosure date is then taken as its end.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_future_disclosure_date_proposes_the_embargo_end`
      attaches a
      document with a future `disclosure_date` to an Offer with no
      `proposedEmbargo`, and checks that the case's embargo ends on that date;
      `::test_the_reference_time_is_the_case_managers_receipt_of_the_proposal`
      checks that the date is measured against the CASE_MANAGER's receipt.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
    relationships:
    - rel_type: uses_definition
      spec_id: CSAF-02-001
  - id: CSAF-03-002
    priority: MUST
    kind: protocol
    statement: >-
      When several vulnerabilities in the document have a future
      `disclosure_date`, the receiver MUST take the earliest of them as the end of
      the proposed embargo of CSAF-03-001.
    rationale: >-
      One case has one embargo. The earliest date honors every vulnerability's
      intended disclosure, in the same way that the shorter term wins between two
      parties (EP-04-003).
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_the_earliest_future_disclosure_date_wins`
      attaches a document
      whose vulnerabilities have two future disclosure dates, and checks that the
      embargo ends on the earlier one.
    relationships:
    - rel_type: extends
      spec_id: CSAF-03-001
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-03-003
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that fills case inputs from a CSAF document MUST take a
      `disclosure_date` no later than the time of receipt, on any vulnerability, as
      a statement that the vulnerability is public (P).
    rationale: >-
      The CSAF 2.1 draft defines a past disclosure date as the time the
      vulnerability was disclosed to the public. A case cannot hold an embargo for
      one vulnerability while another in the same report is public, so a case
      created with P set starts with no embargo (EP-04-020).
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_past_disclosure_date_states_the_vul_is_public`
      attaches a
      document with a `disclosure_date` before the time of receipt, and checks that
      the case starts with P set and no embargo.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-03-004
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that fills case inputs from a CSAF document MUST take an SSVC
      Exploitation value of `PoC`, on any vulnerability, as a statement that an
      exploit is public (X), and a value of `Active` as a statement that attacks
      are occurring (A).
    rationale: >-
      The SSVC Exploitation decision point maps onto the CS model in both
      directions (the SSVC crosswalk): `None` means neither X nor A, `PoC` means X
      without A, and `Active` means A. `None` therefore states nothing to set.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_ssvc_exploitation_poc_sets_x_and_active_sets_a`
      attaches
      documents with SSVC Exploitation `PoC`, `Active` and `None`, and checks that
      the case starts with X, with A, and with neither.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-03-005
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that fills case inputs from a CSAF document MUST take an entry in
      `vulnerabilities[].first_known_exploitation_dates`, on any vulnerability, as a
      statement that attacks are occurring (A).
    rationale: >-
      Each entry records when an exploitation happened, which is an observed
      attack in the CS model.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_first_known_exploitation_date_sets_a`
      attaches a document with
      a `first_known_exploitation_dates` entry, and checks that the case starts
      with A set.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-03-006
    priority: SHOULD
    kind: protocol
    statement: >-
      A case created from a report SHOULD start with the report's name and
      summary as its own.
    rationale: >-
      The report is the first account of the case, and other CVD tools start a
      case from the report in the same way. The case can change its name and
      summary later.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_case_starts_with_its_reports_name_and_summary`
      offers a named
      report with a summary, and checks that the case a separate CASE_MANAGER
      creates has that name and summary.
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-03-007
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that fills case inputs from a CSAF document MUST take a name that
      the report leaves unstated from `document.title`, and a summary that the
      report leaves unstated from the document-level note of category `summary`,
      or else of category `description`.
    rationale: >-
      Every CSAF document has a title that names the whole document, and a
      document-level note describes the whole report, so neither depends on which
      of several vulnerabilities a reader picks.
    verification: >-
      `test/core/use_cases/received/test_case_from_csaf_report.py::test_a_missing_name_and_summary_come_from_the_csaf_document`
      and
      `::test_the_description_note_is_the_summary_when_there_is_no_summary_note`
      offer a report with no name or summary, and check that the case takes
      `document.title` and the document-level `summary` note, and the
      `description` note when there is no `summary` note.
    relationships:
    - rel_type: extends
      spec_id: CSAF-03-006
    adr:
    - ADR-0184
    stories:
    - story_2026_099
  - id: CSAF-03-008
    priority: SHOULD
    kind: protocol
    statement: >-
      A receiver that fills case inputs from a CSAF document SHOULD give the case a
      vulnerability item for each entry in `vulnerabilities[]`, with the entry's `cve`,
      `ids`, `title`, `notes` and `references`.
    rationale: >-
      A vulnerability item takes the identity fields of a CSAF vulnerability entry
      (CM-05-018), so each entry becomes an item with no translation. The identifiers are
      what later messages and projections refer to (CM-05-003, ADR-0187).
    verification: >-
      `test/architecture/test_csaf_report_content_planned.py::test_each_csaf_vulnerability_becomes_a_vulnerability_item`
      holds a strict xfail probe until a behavioral test marked with this ID lands. That
      test replaces the probe: a receive-path test attaches a document with two
      vulnerabilities, and checks that the case gets a vulnerability item for each, with
      its `cve`, `ids`, `title`, `notes` and `references`.
    adr:
    - ADR-0184
    - ADR-0187
    stories:
    - story_2026_099
    tracking_issue: '#6093'
  - id: CSAF-03-009
    priority: SHOULD
    kind: protocol
    statement: >-
      A receiver that fills case inputs from a CSAF document SHOULD give the case a
      case reference for each entry in `document.references[]`, with the entry's `url`
      and its `summary` as the reference's `name`.
    rationale: >-
      A document-level reference is about the whole report, so it belongs to the case;
      a vulnerability's own references go on its vulnerability item (CSAF-03-008). The
      profile uses references for evidence of exploitation (CM-05-004, CM-05-005,
      ADR-0187).
    verification: >-
      `test/architecture/test_csaf_report_content_planned.py::test_each_csaf_reference_becomes_a_case_reference`
      holds a strict xfail probe until a behavioral test marked with this ID lands. That
      test replaces the probe: a receive-path test attaches a document with
      document-level references, and checks that the case gets a case reference with
      the URL and summary of each.
    adr:
    - ADR-0184
    - ADR-0187
    stories:
    - story_2026_099
    tracking_issue: '#6093'
- id: CSAF-04
  title: Receiving and Sending CSAF in This Codebase
  specs:
  - id: CSAF-04-001
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST check each attached CSAF 2.1 document against the full
      CSAF 2.1 schema at receipt, and record a verdict of schema-valid or
      schema-invalid with each schema error.
    rationale: >-
      The receiver wants to know at receipt whether the document holds together,
      and the errors tell its human what is wrong.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf.py::test_receipt_stores_the_schema_verdict_and_its_errors`
      delivers a schema-valid and a schema-invalid CSAF document and reads the
      stored verdict and its errors.
      `test/core/models/test_report_claims.py::test_a_schema_invalid_verdict_needs_its_errors`
      checks that a verdict and its errors cannot disagree.
  - id: CSAF-04-002
    priority: MUST_NOT
    kind: project
    statement: >-
      The verdict of CSAF-04-001 MUST NOT call a document valid CSAF.
    rationale: >-
      CSAF validity also needs the mandatory tests of the CSAF draft, which a schema
      cannot express. Measured against the test documents of the CSAF Technical
      Committee, the schema catches few of the documents that fail a mandatory
      test.
    verification: >-
      `test/core/models/test_report_claims.py::test_the_verdict_is_one_of_two_values`
      refuses any verdict value but schema-valid and schema-invalid, and
      `test/core/use_cases/received/test_submit_report_csaf.py::test_the_stored_verdict_is_only_ever_schema_valid_or_schema_invalid`
      reads the values that receipts store.
    relationships:
    - rel_type: extends
      spec_id: CSAF-04-001
  - id: CSAF-04-003
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST read the fields of CSAF-03 from a schema-invalid document
      one field at a time, skip each field it cannot read, and log each skipped
      field at INFO.
    rationale: >-
      A fault in one part of a document says nothing about the rest of it, and
      CSAF-02-006 keeps the report itself.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf.py::test_a_schema_invalid_document_is_read_field_by_field_and_logs_each_skip`
      delivers a schema-invalid document with a malformed `disclosure_date` and a
      readable SSVC Exploitation value, and checks that the readable one is read
      and the skip is logged at INFO with the activity and its sender.
      `test/wire/csaf/test_reader.py::test_each_unreadable_field_is_skipped_and_named`
      checks the skip of each kind of unreadable field.
  - id: CSAF-04-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST store with each received report that has a CSAF
      attachment the verdict, each value it read, and what became of each value:
      applied, overridden by a Vultron field, or kept for display only.
    rationale: >-
      A human who validates the report sees what the document claimed and which
      claims shaped the case. Fields that set no case input, such as the TLP label,
      `involvement` and `acknowledgments`, are kept for that display.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf.py::test_the_report_keeps_a_record_of_what_its_csaf_claimed`
      reads the stored record, checks that each value read starts display only,
      and stores an overridden and an applied outcome on it.
      `test/core/models/test_report_claims.py::test_each_outcome_is_recorded_and_survives_the_store`
      checks that each outcome survives the store.
  - id: CSAF-04-005
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT send the record of CSAF-04-004 to another actor.
    rationale: >-
      The record is the receiver's own judgment. Each actor that receives the
      report forms its own.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf.py::test_the_claims_record_is_never_sent`
      checks that no sealed outbox body after receipt carries the record or its
      verdict and outcome values.
    relationships:
    - rel_type: extends
      spec_id: CSAF-04-004
  - id: CSAF-04-006
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST record a case-split signal with the report when the
      vulnerabilities of its CSAF document differ in public status, in P, X or A,
      or in their future disclosure dates.
    rationale: >-
      One case takes the most cautious value (CSAF-03-002 to CSAF-03-005), which
      can hold back a vulnerability whose state differs. The Case Owner decides
      whether to split the case.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf_signals.py::test_vulnerabilities_that_differ_in_exploitation_raise_a_split_signal`
      and `::test_vulnerabilities_that_differ_in_public_status_raise_a_split_signal`
      attach documents whose vulnerabilities differ in X and A, and in public
      status and future disclosure date, and read the stored case-split signal;
      `::test_agreeing_vulnerabilities_raise_no_split_signal` checks that agreeing
      ones raise none. `test/core/services/test_report_case_inputs.py` checks the
      signal's differences one by one.
  - id: CSAF-04-007
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST record a candidate-parties signal with the report when the
      vendors of the products that its CSAF document lists as known affected are
      more than one, or include a vendor whose name differs from the receiving
      actor's `name`.
    rationale: >-
      Affected products name the parties that a case needs, for example when a
      coordinator or one of several vendors receives the report. Party discovery
      then suggests those actors to the case (BT-20-003). A vendor name becomes an
      actor only through a directory that does not exist yet, so the receiver's
      own `name` is the one comparison that needs none.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf_signals.py::test_two_affected_vendors_raise_a_candidate_parties_signal`
      and `::test_one_affected_vendor_other_than_the_receiver_is_a_candidate`
      attach a document with two affected vendors, and one with a single affected
      vendor whose name is not the receiver's, and read the stored
      candidate-parties signal of each;
      `::test_the_receiver_as_the_only_affected_vendor_raises_no_signal` checks
      that the receiver's own name raises none.
  - id: CSAF-04-008
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT split a case, suggest an actor or invite an actor
      because of a signal of CSAF-04-006 or CSAF-04-007.
    rationale: >-
      A split and an invitation are decisions of the Case Owner. A signal only
      shows that one may be needed.
    verification: >-
      `test/core/use_cases/received/test_submit_report_csaf_signals.py::test_vulnerabilities_that_differ_in_exploitation_raise_a_split_signal`
      and `::test_two_affected_vendors_raise_a_candidate_parties_signal` check
      that the receipt that stores a signal sends only its case proposal: no
      split, suggestion or invitation follows it.
    relationships:
    - rel_type: extends
      spec_id: CSAF-04-006
    - rel_type: extends
      spec_id: CSAF-04-007
  - id: CSAF-04-009
    priority: MUST
    kind: project
    statement: >-
      The submit-report trigger MUST refuse, with HTTP 422 naming each fault, a
      CSAF document that fails the CSAF 2.1 schema or whose category is not
      `csaf_vulnerability_report`.
    rationale: >-
      This is the sender's side of CSAF-02-007. A refusal that names each fault
      tells the Reporter what to correct before anything is sent.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_trigger_submit_report_csaf.py::test_a_schema_invalid_document_is_refused_naming_each_fault`
      and `::test_a_document_of_another_category_is_refused` post a schema-invalid
      document and one of another category, check that the 422 body names each fault
      and that nothing is stored or queued;
      `::test_every_fault_is_named_not_only_the_first` checks that a document with
      several faults has each one named, and
      `::test_a_document_larger_than_a_receiver_reads_is_refused` that one over the
      size a receiver reads is refused.
      `test/core/services/test_submitted_csaf.py` checks each kind of fault.
  - id: CSAF-04-010
    priority: MUST
    kind: project
    statement: >-
      The submit-report trigger MUST fill a report name, a report summary or a
      `proposedEmbargo` that its request leaves unstated from the attached CSAF
      document, by the mapping of CSAF-03.
    rationale: >-
      This is the sender's side of CSAF-02-004, so a receiver gets explicit
      Vultron fields and needs to read the CSAF document only for what they omit.
    verification: >-
      `test/adapters/driving/fastapi/routers/test_trigger_submit_report_csaf.py::test_a_missing_name_summary_and_embargo_end_come_from_the_document`
      posts a CSAF document with no report name, summary or proposed embargo end and
      reads them on the sent Offer;
      `::test_a_stated_name_summary_and_embargo_end_are_kept` checks that stated
      values win, `::test_a_document_whose_title_reads_as_nothing_is_refused` that a
      report left with no name is refused, and
      `::test_a_document_that_sets_exploitation_proposes_no_embargo_end` that a
      document setting P, X or A proposes no embargo end.
- id: CSAF-05
  title: Following the CSAF 2.1 Draft
  specs:
  - id: CSAF-05-001
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST check CSAF documents against one pinned revision of the
      CSAF 2.1 draft, recorded once with its source repository, commit and draft
      stage.
    rationale: >-
      Every CSAF 2.1 draft uses the same `$schema` value, so a document cannot say
      which draft it follows. The crosswalk pages, the pinned local copy of the
      schemas and the models generated from them read the one record, so they
      cannot disagree about the draft.
    verification: >-
      `test/metadata/test_csaf_pin.py::test_the_crosswalk_names_the_pinned_commit`
      checks that the crosswalk version include names the commit, draft stage and
      repository of the pin record, `third_party/csaf/pin.json`.
      `test_the_pin_maps_every_file_of_the_pinned_local_copy` in the same module
      checks that the record lists exactly the files of the pinned local copy.
  - id: CSAF-05-002
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST keep a pinned local copy of the CSAF 2.1 schema and of the
      schemas it references, and generate its CSAF models from that copy.
    rationale: >-
      The CSAF schema references the CVSS and SSVC schemas by URL. A local copy
      makes the models reproducible without network access.
    verification: >-
      `test/metadata/test_csaf_regenerate.py::test_models_generate_from_the_pinned_local_copy_offline`
      generates the models with every socket connection refused, and
      `test_an_unpinned_remote_reference_is_refused_not_fetched` checks that a URL
      the pin record does not map fails regeneration instead of being fetched.
  - id: CSAF-05-003
    priority: MUST
    kind: project
    statement: >-
      A test MUST fail when regenerating the CSAF models from the pinned local copy
      does not reproduce the committed models.
    rationale: >-
      Without the test, a hand edit or a schema change without regeneration leaves
      the models out of step with the schema they claim to follow.
    verification: >-
      `test/metadata/test_csaf_regenerate.py::test_regeneration_reproduces_the_committed_models`
      regenerates the models from the pinned local copy through a temporary
      staging directory, with network access refused, and compares them byte for
      byte with `vultron/wire/csaf/models/`, counting a stray module as stale.
  - id: CSAF-05-004
    priority: MUST_NOT
    kind: project
    statement: >-
      The test suite MUST NOT depend on the test documents of the CSAF Technical
      Committee.
    rationale: >-
      Those documents are governed by the OASIS IPR policy and change with the
      draft. An optional script that reads a local clone checks them when the pin
      moves.
    verification: >-
      `test/architecture/test_csaf_report_content_planned.py::test_the_suite_never_reads_the_tc_test_documents`
      checks that no other test module names a path under the test data
      directory of the CSAF Technical Committee's repository. The optional script
      is `uv run csaf-corpus --clone <dir>` (`vultron/metadata/csaf/corpus.py`),
      tested on a stand-in clone of hand-written documents.
  - id: CSAF-05-005
    priority: MUST
    kind: process
    statement: >-
      A scheduled job MUST open an issue when an upstream change to the CSAF 2.1
      draft would change the generated models, the profile text or the list of
      mandatory tests.
    rationale: >-
      CSAF 2.1 is a draft that its Technical Committee can still change. Most
      upstream commits change neither the schema nor the profiles, so a filter on
      what the models and profiles depend on keeps the job from reporting them.
    verification: >-
      `test/metadata/test_csaf_draft_watch.py::test_a_description_only_revision_reports_no_change`
      and `test_a_revision_that_changes_a_property_reports_a_change` in the same
      module feed the comparison script, `uv run csaf-draft-watch`
      (`vultron/metadata/csaf/draft_watch/`), an upstream schema that differs
      from the pinned local copy only in a description and one that differs in a
      property, and check that only the second reports a change. The workflow is
      `.github/workflows/csaf-draft-watch.yml`.
  - id: CSAF-05-006
    priority: MUST_NOT
    kind: process
    statement: >-
      The job of CSAF-05-005 MUST NOT open a second issue or comment on its open
      issue while that issue stays open.
    rationale: >-
      One open issue says that the pin is behind. Repeating it adds noise and no
      information.
    verification: >-
      `test/ci/test_csaf_draft_watch_issue.py::test_an_open_issue_with_the_marker_makes_the_step_write_nothing`
      runs the job's issue step, `.github/scripts/csaf-draft-watch-issue.sh`,
      against a fake `gh` with an open issue carrying the `csaf-draft-watch`
      label, and checks that it creates, edits and comments on nothing.
    relationships:
    - rel_type: extends
      spec_id: CSAF-05-005
  - id: CSAF-05-007
    priority: MUST
    kind: process
    statement: >-
      The issue of CSAF-05-005 MUST say which of the CSAF fields that this codebase
      reads the upstream change affects.
    rationale: >-
      A change to a field that sets a case input needs a review of its mapping, and
      a change elsewhere needs only a regeneration.
    verification: >-
      `test/metadata/test_csaf_draft_watch.py::test_a_changed_disclosure_date_is_listed_as_a_read_field`
      changes the `disclosure_date` property in an upstream schema and checks that
      the comparison script lists it as a read field in the issue body.
    relationships:
    - rel_type: extends
      spec_id: CSAF-05-005
