id: SR
title: Spec Registry
description: >-
  Requirements for the structured spec registry: YAML spec files governed by Pydantic models,
  with linting, pytest integration, and context-generation tooling. The registry provides a
  single source of truth for spec IDs, prefixes, titles, and cross-reference validation.
scope:
- prototype
- production
tags:
- tooling
- documentation
groups:
- id: SR-01
  title: YAML File Format
  specs:
  - id: SR-01-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Specifications MUST be maintained as YAML files in `specs/` following the topic-file naming
      convention. Markdown spec files are not permitted.
    rationale: >-
      One machine-readable format lets the registry loader, spec-lint and `spec-dump`
      validate and query every requirement. These tools cannot read a requirement in
      Markdown. Its ID, priority and links stay unchecked, and agents cannot load it by
      topic.
  - id: SR-01-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Each YAML file MUST have a top-level `id` field containing the file-level prefix string (e.g., `"HP"`).
    rationale: >-
      The file-level prefix is the start of every requirement ID in the file. When the
      file declares it one time, the linter can check each group ID and spec ID against
      it (SR-01-007, SR-01-013). An ID then tells a reader which file holds it.
  - id: SR-01-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A YAML spec file MUST NOT have a top-level `version` field.
    rationale: >-
      A hand-maintained per-file version had no rule for when it changed and no check
      that it did, so it was a published claim nothing could falsify (MS-16-002). The
      release tag pins spec content and the requirement ID is the citation address
      (ADR-0106).
    adr:
    - ADR-0106
  - id: SR-01-014
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Each YAML spec file MUST have a `title` field and a `description` field.
    rationale: >-
      The title names the topic in the docs and in `spec-dump` output. The description
      tells a reader what the topic covers. Without them, a reader cannot tell what a
      topic file is for.
  - id: SR-01-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Each YAML spec file MUST contain a `groups` list.
    rationale: >-
      Agents load requirements by group, and the spec backstop reports by group. Thus
      every requirement must be in a group. Tools cannot select or cite the
      requirements of a file with no groups.
  - id: SR-01-015
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Each group in a YAML spec file MUST have `id`, `title` and `specs` fields.
    rationale: >-
      Tools select and cite a group by its ID, and the docs and the spec map show its
      title. The `specs` field holds the requirements of the group. A group without one
      of these fields cannot be selected, cited or shown.
    relationships:
    - rel_type: extends
      spec_id: SR-01-004
  - id: SR-01-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Each individual spec entry MUST have `id`, `priority`, `statement`, and `rationale` fields.
    rationale: >-
      These four fields make an entry a usable requirement. They give an address, a
      binding strength, the rule and the reason for the rule. If one field is missing,
      readers cannot cite the entry, weigh it or understand it (MS-10-012).
  - id: SR-01-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Spec IDs MUST be globally unique across all loaded YAML files.
    rationale: >-
      Tests, code comments, ADRs and other specs use the requirement ID to cite a
      requirement. A duplicate ID makes each of these citations ambiguous. Also, the
      registry index can hold only one of the two entries.
  - id: SR-01-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'Group IDs within a file MUST match the file-level prefix (e.g., group `HP-01` must live in file with `id:
      HP`).'
    rationale: >-
      The group ID prefix tells a reader which file holds a group. A group under the
      prefix of a different topic breaks that lookup, and navigation by ID becomes
      unreliable.
  - id: SR-01-008
    priority: SHOULD
    kind: project
    statement: Each spec entry SHOULD include a `testable` boolean field (default `true`).
    rationale: >-
      An untestable mark tells reviewers and the coverage tooling not to expect a test
      for the entry. The linter can then ask for behavioral steps instead (SR-04-005).
      An explicit default keeps entries without the field testable.
  - id: SR-01-009
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Spec entries MUST include a `kind` field from the `SpecKind` StrEnum; one of
      `protocol`, `foundation`, `architecture`, `project`, `process`.
    rationale: >-
      The kind decides who must obey a requirement, which docs page shows it and which
      checks apply to it (ADR-0134). With a free-text value, a misspelled kind removes
      the requirement from every check that selects by kind.
  - id: SR-01-010
    priority: SHOULD
    kind: project
    statement: Spec entries SHOULD include a `scope` field listing one or more `Scope` StrEnum values (`prototype`, `production`);
      default `[production]`.
    rationale: >-
      Scope lets an agent that works on the prototype skip requirements that apply only
      to production, and the reverse. A fixed enum stops a typo from creating a scope
      that no filter selects.
  - id: SR-01-011
    priority: SHOULD
    kind: project
    statement: Spec entries SHOULD include a `tags` list using values from the `SpecTag` StrEnum vocabulary.
    rationale: >-
      Tags let `spec-dump --tag` and the docs select requirements by subject across
      topics. A controlled vocabulary prevents near-duplicate tags that each select only
      part of one subject.
  - id: SR-01-012
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Each relationship in a spec entry MUST have a `rel_type` field and a `spec_id`
      field.
    rationale: >-
      Tools cannot orient or resolve a relationship with no type or no target. The
      type gives the direction of the link (SR-13), and the target names the other
      requirement.
  - id: SR-01-016
    priority: SHOULD
    kind: project
    statement: >-
      A spec entry SHOULD include a `relationships` list when a reader needs to trace it
      to another requirement.
    rationale: >-
      The edges graph comes from the recorded relationships, so a reader can trace a
      change in one requirement to the requirements that it affects. A requirement
      with no recorded link is invisible to that trace.
  - id: SR-01-013
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'Spec IDs within a group MUST match the group ID prefix (e.g., spec `HP-01-001` must live in group with `id:
      HP-01`). This extends SR-01-007 to the spec level and ensures that the three-part ID (`FILE-GROUP-SPEC`) is internally
      consistent.'
    rationale: >-
      A reader who sees `PD-03-001` expects to find it in group `PD-03`. If it is in a
      different group, navigation by ID and cross-references mislead the reader. When
      the spec ID matches its group ID, the three parts of the ID agree.
    tags:
    - documentation
    - tooling
- id: SR-02
  title: Pydantic Schema
  specs:
  - id: SR-02-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'The `vultron/metadata/specs/` module MUST define Pydantic models for all registry structures: `SpecFile`,
      `SpecGroup`, `StatementSpec`, `BehavioralSpec`, `Relationship`.'
    rationale: >-
      Typed models make the loader reject a malformed spec file when it parses the file,
      with an error that names the field. Every tool that reads the corpus then uses
      validated objects and does not check raw dictionaries again.
  - id: SR-02-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'Fixed vocabularies MUST be implemented as `StrEnum` subclasses: `RFC2119Priority`, `RelationType`, `SpecKind`,
      `Scope`, `SpecTag`, `AdrStatus`.'
    rationale: >-
      A `StrEnum` gives each fixed vocabulary one definition. The schema validates
      against it and the tools import it. A misspelled value then fails at load time and
      does not silently create a new category.
  - id: SR-02-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`RFC2119Priority` MUST include at minimum: `MUST`, `MUST_NOT`, `SHOULD`, `SHOULD_NOT`, `MAY`.'
    rationale: >-
      The corpus uses these five RFC 2119 levels as binding strengths. The linter, the
      coverage guard and the backstop tier all branch on priority, so each level must be
      a valid value.
  - id: SR-02-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `RelationType` MUST include at minimum: `implements`, `supersedes`, `extends`,
      `depends_on`, `conflicts`, `refines`, `derives_from`, `verifies`, `part_of`,
      `constrains`, `satisfies`, `uses_definition`.
    rationale: >-
      Each relationship type has a defined meaning and a defined upstream end (SR-13).
      The enum lets the schema reject an undefined type. Thus each link has a direction
      that the graph tooling can orient.
  - id: SR-02-005
    priority: MUST
    kind: project
    statement: >-
      `SpecKind` MUST include all five portability tiers: `protocol`, `foundation`,
      `architecture`, `project`, `process`.
    rationale: >-
      The kind records who must obey a requirement: every implementation, every
      implementation of an inherited standard, or only this codebase or process
      (ADR-0134). The checks that protect implementers and the docs routing both branch
      on the kind. Thus each of the five tiers must be a valid value, and no other value
      can be valid.
    verification: >-
      `test/metadata/specs/test_schema.py::test_spec_kind_contains_exactly_five_tiers` fails when
      a tier is missing, misspelled, or added without amending this requirement.
    adr:
    - ADR-0038
    - ADR-0134
  - id: SR-02-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`Scope` MUST include: `prototype`, `production`.'
    rationale: >-
      Scope separates the obligations of the prototype from the obligations of a
      production implementation. An agent then loads only the requirements that its
      target must meet.
  - id: SR-02-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`SpecTag` MUST be a controlled vocabulary StrEnum, defined in `vultron/metadata/specs/schema.py`.'
    rationale: >-
      The schema module defines the tag vocabulary. This gives the linter (SR-04-006)
      and the selection tooling one list to check against, so a tag cannot come into use
      before the list declares it.
  - id: SR-02-008
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A `SpecIdStr` type alias MUST enforce the ID pattern
      `^[A-Z]{2,8}(-\d{2}(-\d{3}[a-z]?)?)?$` via Pydantic `StringConstraints`.
      The optional lowercase letter suffix (e.g., `LST-05-002b`) designates a
      sub-requirement split from a parent spec.
    rationale: >-
      A fixed ID pattern makes each requirement, group and topic ID easy to recognize in
      prose, so tools can find and resolve citations (SR-04-008). The suffix lets a
      split requirement keep the address of its parent, so existing citations stay
      valid.
  - id: SR-02-009
    priority: MUST
    kind: project
    statement: '`StatementSpec` MUST have fields: `id` (`SpecIdStr`), `priority` (`RFC2119Priority`), `kind` (`SpecKind`,
      required), `statement` (non-empty str), `rationale` (non-empty str), and optional fields: `testable`, `scope`, `tags`,
      `relationships`, `adr`, `lint_suppress`.'
    rationale: >-
      These are the fields every consumer of the corpus reads, from spec-lint to
      `spec-dump`, so the schema is what guarantees each requirement has them. A
      required `rationale` keeps the reason for each rule next to the rule
      (MS-10-012).
    verification: >-
      `test/metadata/specs/test_schema.py` checks the required fields
      (`test_statement_spec_kind_omitted_rejected`,
      `test_statement_spec_rationale_omitted_rejected`,
      `test_statement_spec_empty_statement_rejected`,
      `test_statement_spec_empty_rationale_rejected`), the optional defaults
      (`test_statement_spec_absent_fields`) and the full field set
      (`test_statement_spec_full`).
  - id: SR-02-010
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`BehavioralSpec` MUST extend `StatementSpec` with optional fields: `preconditions`, `steps`, `postconditions`.'
    rationale: >-
      Behavioral requirements need ordered steps, preconditions and postconditions, and
      a plain statement cannot hold them. An extension of `StatementSpec` keeps the
      shared fields, and the checks on them, the same for both forms.
  - id: SR-02-011
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The `lint_suppress` field on a spec MUST accept a list of `LintWarningCode` StrEnum values to suppress named
      linter warnings for that spec.
    rationale: >-
      Some advisory warnings are wrong for a specific requirement. A typed suppression
      on the spec silences only that warning on that entry. It also records that the
      exception is deliberate, and a misspelled code fails validation.
  - id: SR-02-012
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `SpecGroup` MUST have the fields `id` (`SpecIdStr`), `title` and `specs` (a
      non-empty list), and the optional fields `description`, `scope` and `trigger`.
    rationale: >-
      Every tool that reads a group needs its ID, its title and its requirements, so
      the schema makes sure that each group has them when it loads. The optional fields
      hold a description, a default scope and the trigger of a behavioral group.
  - id: SR-02-023
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: '`SpecGroup` MUST NOT have a `kind` field.'
    rationale: >-
      Kind decides which checks apply to a requirement, so each item declares it where a
      reader can see it (SR-02-027). A kind on the group could give one item a wrong
      tier, and nobody would see the mismatch.
  - id: SR-02-013
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `SpecFile` MUST have the fields `id` (str), `title`, `description`, `scope`
      (required) and `groups` (a non-empty list), and the optional field `tags`.
    rationale: >-
      These fields identify and describe a topic file, and scope sets the default for
      the file. Every tool that reads a file needs them, so the schema makes sure that
      each file has them when it loads.
  - id: SR-02-024
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: '`SpecFile` MUST NOT have a `kind` field.'
    rationale: >-
      Kind belongs on each item (SR-02-027). A kind on the file could give an item a
      wrong tier, and a reader of the item would not see it.
  - id: SR-02-025
    priority: MUST_NOT
    kind: project
    statement: >-
      `SpecFile` MUST NOT declare a `version` field, so that its `extra="forbid"`
      configuration (SR-02-022) rejects a file that has one (SR-01-003).
    rationale: >-
      No check confirms a file version (SR-01-003). When the schema declares no such
      field, the loader rejects a file that has one, and the rule needs no separate
      check.
    verification: >-
      `test/metadata/specs/test_schema.py::test_spec_file_rejects_version_field` asserts
      that `SpecFile` validation fails on a `version` key.
    relationships:
    - rel_type: implements
      spec_id: SR-01-003
  - id: SR-02-014
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A `scope` value at `SpecFile` or `SpecGroup` level MUST serve as the default for
      the spec items under it.
    rationale: >-
      A whole file usually has one scope, so a default prevents repetition.
  - id: SR-02-026
    priority: MAY
    kind: project
    statement: >-
      An individual spec item MAY set its own `scope`, which overrides the default.
    rationale: >-
      One requirement in a file can apply to a different target than the rest. An
      override on the item lets that requirement differ without a change to the file or
      group default (SR-02-014).
  - id: SR-02-027
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Every individual spec item MUST declare its own `kind`, which it does not inherit
      from its file or group.
    rationale: >-
      A reader cannot see an inherited tier at the item. Such a tier can put a
      requirement under the wrong checks.
  - id: SR-02-015
    priority: SHOULD
    kind: project
    statement: '`Relationship` SHOULD include an optional `note` field for free-text annotation of the relationship.'
    rationale: >-
      A relationship type tells how two requirements relate. It does not always tell
      which part of one requirement affects the other. A short note on the link records
      this, so neither statement must hold the explanation.
  - id: SR-02-016
    priority: SHOULD
    kind: project
    statement: '`BehaviorStep` SHOULD include fields: `order` (int), `actor` (str), `action` (str), and optional `expected`
      (str).'
    rationale: >-
      Ordered steps with a named actor let a reader or a conformance test follow a
      behavioral requirement one action at a time. The optional expected result tells
      what each step must produce.
  - id: SR-02-017
    priority: MUST
    kind: project
    statement: >-
      The spec schema MUST define a `TriggerType` StrEnum enumerating the categories of
      behavioral trigger: `message_received` (a protocol message type), `state_entered`
      (an RM, EM, or CS state value), and `scenario_start` (a named demo or integration
      scenario). Enumerating kinds allows conformance tooling to classify trigger groups
      without parsing prose.
    rationale: >-
      A behavioral group tells what starts it, and conformance tooling must read that
      information. A closed set of categories lets the tooling classify groups without
      parsing prose. It also makes a misspelled category a validation error, not a
      silent new category.
    verification: >-
      `TriggerType` StrEnum in `vultron/metadata/specs/schema.py` defines exactly three
      members: `message_received`, `state_entered`, and `scenario_start`.
  - id: SR-02-018
    priority: MUST
    kind: project
    statement: >-
      A `Trigger` object MUST carry a `type: TriggerType` field and a `value` string
      naming the specific message type (e.g. `EP`) or protocol state (e.g. `RM.VALID`)
      that activates the behavior; for `scenario_start` triggers `value` names the
      scenario (e.g. `rv`, `rvv`).
    rationale: >-
      The type says what kind of event starts a behavior and the value names the
      specific event. Together they let conformance tooling match a trigger against a
      message or state without parsing prose.
    verification: >-
      `Trigger` model in `vultron/metadata/specs/schema.py` has required fields
      `type: TriggerType` and `value: str`.
  - id: SR-02-019
    priority: MUST
    kind: project
    statement: >-
      A `Precondition` object MUST carry a `description` string that states the
      precondition in prose.
    rationale: >-
      A prose description is for human readers. A reader cannot understand a
      precondition with no description.
    verification: >-
      `Precondition` model in `vultron/metadata/specs/schema.py` has a required
      `description: str` field.
  - id: SR-02-028
    priority: MAY
    kind: project
    statement: >-
      A `Precondition` object MAY carry the typed state fields `rm_state`, `em_state`,
      `role` and `cs_pattern`. They hold a list of RM states, a list of EM states, a
      list of CVDRoles and a CS hypercube pattern string.
    rationale: >-
      The optional typed state fields let conformance tooling test a precondition
      directly against the RM, EM, role and CS enums, without parsing the prose
      description.
    verification: >-
      `Precondition` model in `vultron/metadata/specs/schema.py` has optional typed
      state fields `rm_state`, `em_state`, `role`, and `cs_pattern`.
  - id: SR-02-020
    priority: SHOULD
    kind: project
    statement: A spec item SHOULD use the optional `adr` field (list of `AdrIdStr`, pattern `^ADR-\d{4}$`) to record structured
      ADR provenance; the export emits each as a `derives_from` edge to the ADR ID so an amended ADR can be traced to its
      dependent specs via the edges graph, and the linter hard-errors on a dangling target.
    rationale: >-
      Prose citations in `rationale` are invisible to the edges graph, so "which specs inherit this ADR's premise?" was not
      a mechanical query. The structured field closes that gap (MS-11-004). See ADR-0043.
    adr:
    - ADR-0043
  - id: SR-02-021
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `StatementSpec` MUST support these optional fields beyond the core set, and
      `BehavioralSpec` inherits them: `verification`, `note`, `tracking_issue`,
      `verification_debt`, `references`, `exceptions`, `trigger`, `deprecated` and
      `superseded_by`. The `verification` field (NonEmptyStr) is a machine-executable or
      human-reviewable check that confirms the requirement is met. The `note` field
      (NonEmptyStr) is a correction notice or clarifying annotation. The
      `tracking_issue` field (str) holds the GitHub issue references that track planned
      implementation. The `verification_debt` field (`#N`) names the issue that owns
      verifying a `MUST`-tier requirement with no `verification` (MS-10-006). The
      `references` field (list[str]) holds file paths or URIs to supporting documents.
      The `exceptions` field (list[NonEmptyStr]) lists permitted exceptions to the rule
      that the requirement states. The `trigger` field (Trigger) is the activating event
      of a behavioral spec item. The `deprecated` field (bool) defaults to False. The
      `superseded_by` field (SpecIdStr | None) is the ID of the replacement requirement.
    rationale: >-
      Without these fields in the schema, the loader would reject (SR-02-022) or ignore
      annotations that requirements need. These annotations tell how a requirement is
      checked, who owns its missing check, its exceptions, its trigger and its
      supporting references. Typed fields let tooling validate each one. Because the
      schema declares `deprecated` and `superseded_by`, spec-lint can recognize them. It
      refuses them with a pointer to the retirement archive (MS-09-001), and does not
      fail on an unknown key.
    relationships:
    - rel_type: refines
      spec_id: SR-02-009
  - id: SR-02-022
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Every Pydantic model in `vultron/metadata/specs/schema.py` (`Relationship`, `Trigger`,
      `Precondition`, `BehaviorStep`, `Postcondition`, `StatementSpec`, `BehavioralSpec`,
      `SpecGroup`, `SpecFile`) MUST declare `model_config = ConfigDict(extra="forbid")`.
    rationale: >-
      Without `extra="forbid"`, the loader silently ignores an unrecognized YAML key. A
      misspelled field, or a field that the schema does not define, then loses its
      content with no error. A failure on unknown keys changes that silent data loss
      into a validation error, and each new field must go through the schema.
    relationships:
    - rel_type: refines
      spec_id: SR-02-009
- id: SR-03
  title: Registry Loader
  specs:
  - id: SR-03-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The `vultron/metadata/specs/` module MUST provide a `load_registry(spec_dir)` function that loads all `*.yaml`
      files from the given directory into a `SpecRegistry`.
    rationale: >-
      One loader that reads the whole directory gives every consumer the same validated
      corpus. If each tool parsed the YAML in its own way, the tools could disagree
      about which requirements exist.
  - id: SR-03-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`SpecRegistry` MUST maintain an index of all specs by ID and enforce global uniqueness, raising `ValueError`
      on duplicate IDs.'
    rationale: >-
      Cross-references and citations resolve through the ID index. With a duplicate ID,
      the index keeps one entry and silently drops the other. An error at load time
      stops the corpus before any tool reads it.
  - id: SR-03-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`SpecRegistry` MUST provide a `get(spec_id)` method returning the `Spec` for a given ID, raising `KeyError`
      on unknown IDs.'
    rationale: >-
      Callers find a requirement by the ID that they have. An unknown ID is a caller
      error, such as a typo or a retired requirement. An exception makes the error
      visible, where an empty result hides it.
  - id: SR-03-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`SpecRegistry` MUST provide a `validate_cross_references()` method returning a list of error strings for any
      dangling relationship targets.'
    rationale: >-
      A relationship that names no existing requirement makes the graph show a
      dependency on nothing. Because the loader returns the dangling targets, the linter
      can report all of them as hard errors at one time (SR-04-002).
  - id: SR-03-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The loader MUST work regardless of the caller's working directory by accepting an explicit `spec_dir` path.
    rationale: >-
      Pre-commit hooks, tests, CLI tools and agents run the loader, each from a
      different directory. An explicit path gives the same result from every location.
  - id: SR-03-006
    priority: SHOULD
    kind: project
    statement: '`SpecRegistry` SHOULD maintain a group index in addition to the spec index.'
    rationale: >-
      Agents load requirements by group, and the backstop reports by group. A group
      index lets those tools find a group by ID without a scan of every file.
  - id: SR-03-007
    priority: SHOULD
    kind: project
    statement: The loader SHOULD provide a `_find_repo_root()` helper (mirroring the notes loader) for callers that do not
      supply an explicit path.
    rationale: >-
      Callers that run in the repository must not have to calculate the spec directory.
      A shared root finder gives them the same default that every other metadata loader
      uses.
  - id: SR-03-008
    priority: MUST
    kind: project
    statement: >-
      `load_registry` MUST attribute each file that fails its YAML parse or its
      `SpecFile` validation to the path of that file (MS-17-001).
    rationale: >-
      `load_registry` backs every spec consumer — the linter, the pre-commit hook,
      `spec-dump`, the coverage report, the docs renderer, the pytest marker check — so
      an unattributed failure here is the one an author is most likely to meet.
      Attributing the parse alone would leave the more common fault unnamed: an invalid
      enum value (`kind`, `priority`, `rel_type`) is reported as a positional path into
      the parsed structure, which locates a requirement no better than a bare line
      number does.
    verification: >-
      Unit tests corrupt a temporary spec directory two ways — a YAML syntax fault and
      an invalid enum value — and assert each raised error names the offending file.
    relationships:
    - rel_type: implements
      spec_id: MS-17-001
  - id: SR-03-010
    priority: MUST
    kind: project
    statement: >-
      `load_registry` MUST get that file attribution from the shared helper that
      MS-17-003 names, not from a wrapper of its own.
    rationale: >-
      One helper gives every metadata loader the same attribution format. A private
      wrapper in `load_registry` would drift from the other loaders, and an author would
      meet two error formats for one kind of fault.
    verification: >-
      `test/architecture/test_metadata_loader_attribution.py::test_no_private_attribution_wrapper_outside_the_helper`
      fails on a private attribution wrapper in any module under `vultron/metadata/`,
      `load_registry` included.
    relationships:
    - rel_type: implements
      spec_id: MS-17-003
  - id: SR-03-009
    priority: MUST
    kind: project
    statement: >-
      When more than one file in `specs/` fails to load, `load_registry` MUST report
      every failing file in a single error, not only the first.
    rationale: >-
      The loader rejects the corpus as a unit, so a caller told one reason at a time
      gains nothing from the round trip — the principle EH-07-001 states for validation
      boundaries. The linter that wraps this loader already collects and prints all of
      its own findings together, so stopping at the first file makes the loader the one
      part of the tool that reports less than it knows. The case that matters is a bulk
      spec edit breaking several files at once.
    verification: >-
      A unit test corrupts two files in a temporary spec directory and asserts that both
      names appear in the single raised error.
    relationships:
    - rel_type: derives_from
      spec_id: EH-07-001
      note: applies the report-every-violation rule to a file-walking loader
  - id: SR-03-011
    priority: MUST
    kind: project
    statement: >-
      `load_registry` MUST carry each individual failure as structured data on the
      exception it raises, not only as a joined message.
    rationale: >-
      A caller that acts on each failing file needs the failures one by one. Without
      structured data, it must parse the message text, which breaks when the message
      format changes.
    verification: >-
      `test_every_failing_file_is_reported_structurally` in
      `test/metadata/specs/test_registry_attribution.py` and `TestFailureCollector` in
      `test/metadata/test_file_loading.py` assert that the individual failures can be
      read from the exception without parsing its message.
    relationships:
    - rel_type: extends
      spec_id: SR-03-009
- id: SR-04
  title: Linter
  specs:
  - id: SR-04-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The `vultron/metadata/specs/lint.py` module MUST provide a `lint(spec_dir)` function that returns exit code
      `0` (clean) or `1` (errors found).
    rationale: >-
      A fixed exit code lets the pre-commit hook and CI block a commit or a build on
      spec errors without parsing the linter's output.
  - id: SR-04-002
    priority: MUST
    kind: project
    statement: 'The linter MUST report as hard errors: duplicate spec IDs, dangling relationship targets, group-ID/file-prefix
      mismatches, and invalid YAML structure.'
    rationale: >-
      Each of these faults makes the corpus wrong for every consumer. A duplicate ID
      makes citations ambiguous. A dangling target puts a link to nothing in the graph.
      A prefix mismatch breaks navigation by ID. Invalid structure stops the file from
      loading. None of these faults is safe to commit, so each must block the commit.
    verification: >-
      A unit test asserts that each listed fault produces a hard error in the linter's own
      output format and exit code 1. Reporting a fault by propagating a parser traceback does
      not satisfy this requirement, because the traceback names neither the file nor the
      requirement (MS-17-002).
  - id: SR-04-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The linter MUST be invokable both as `uv run spec-lint` (console entry point) and as
      `python -m vultron.metadata.specs.lint [spec_dir]` (module invocation).
    rationale: >-
      Agents and developers run the console entry point. The pre-commit hook runs the
      module form, which also works in environments where the entry point is not
      installed.
  - id: SR-04-009
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: Both invocation forms of the spec linter MUST produce identical output for the same input.
    rationale: >-
      Users and the pre-commit hook run different forms of the same check. If the
      outputs were different, one form could pass a corpus that the other form rejects.
    relationships:
    - rel_type: refines
      spec_id: SR-04-003
  - id: SR-04-010
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: When `spec_dir` is omitted from the module invocation, the linter MUST default to
      `specs/` relative to the current working directory.
    rationale: >-
      The pre-commit hook and developers run the linter from the repository root, where
      `specs/` is the corpus. A default directory keeps the usual command short. It does
      not hide which directory the linter checked.
    relationships:
    - rel_type: refines
      spec_id: SR-04-003
  - id: SR-04-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The linter MUST respect `lint_suppress` fields on individual specs when checking advisory warnings.
    rationale: >-
      A suppression on a spec records a deliberate exception. If the linter ignored the
      suppression, authors would see the same accepted warning on every run and stop
      reading the warnings.
  - id: SR-04-005
    priority: SHOULD
    kind: project
    statement: 'The linter SHOULD emit advisory warnings (non-blocking) for: specs with `testable: false` and no behavioral
      steps (suppressible via `lint_suppress: [testable_without_steps]`), rationale text exceeding 500 characters, and specs
      with no tags.'
    rationale: >-
      These patterns usually show a weak requirement, but they are sometimes correct. A
      warning thus starts a review and does not block the commit. A long rationale often
      contains a second requirement, or history that belongs in a different location.
  - id: SR-04-006
    priority: SHOULD
    kind: project
    statement: The linter SHOULD check that tag values in spec entries are members of the `SpecTag` StrEnum vocabulary.
    rationale: >-
      An undeclared tag selects nothing in `spec-dump --tag` or in the docs. Thus the
      requirement silently disappears from the subject of its tag.
  - id: SR-04-007
    priority: SHOULD
    kind: project
    statement: The linter SHOULD check that `scope` at the spec level is not broader than the containing group or file scope.
    rationale: >-
      A spec that claims a broader scope than its group or file contradicts the default
      that it must make narrower. A scope filter then includes or drops the spec when a
      reader does not expect it.
  - id: SR-04-008
    priority: MUST
    kind: project
    statement: >-
      Every spec ID cited in a Python source file (production code, test file, or
      docstring/comment) MUST resolve to an entry in the spec registry; a citation of
      a non-existent spec ID is a hard error caught by the pre-commit lint gate
      (`_check_phantom_spec_id_citations`). Files under `test/metadata/specs/` are
      exempted because they legitimately use synthetic fixture IDs.
    rationale: >-
      A citation of a spec ID that does not exist looks like a settled requirement. The
      next reviewer must then disprove a mandate, not judge a design choice, so the
      citation misleads more than no citation. Where no requirement covers the behavior,
      a prose description is the correct record. Fixture IDs under
      `test/metadata/specs/` are synthetic by design, so they are exempt.
    verification: >-
      `uv run spec-lint` exits 1 when any `.py` file under `vultron/` or `test/`
      (outside `test/metadata/specs/`) cites a spec ID absent from the registry, and
      exits 0 when all cited IDs resolve. Covered by the phantom-spec-id tests in
      `test/metadata/specs/test_lint.py`.
  - id: SR-04-011
    priority: MUST_NOT
    kind: project
    statement: >-
      A module under `vultron/` MUST NOT cite a requirement from the Testability
      topic (`TB-` prefix) as one it implements. `Implements:` citations are
      topic-scoped: resolving in the registry (SR-04-008) is necessary but not
      sufficient, and a resolving citation of a topic that governs tests is a
      defect, not traceability.
    rationale: >-
      Each ID cited under `vultron/` resolves to some requirement. Thus an existence
      check (SR-04-008) cannot find a citation of the wrong topic. The Testability topic
      governs tests, not modules. A module that names a `TB-` requirement as the
      requirement it implements points readers at the wrong rule, but it passes the
      existence check. A check scoped by topic finds that error.
    verification: >-
      `test/architecture/test_implements_citations_topic_scoped.py` fails, naming
      file and line, on any `TB-NN-NNN` token under `vultron/`, and fails when an
      `Implements:` ID under `vultron/adapters/driving/fastapi/routers/` is absent
      from the registry.
- id: SR-05
  title: Pytest Integration
  specs:
  - id: SR-05-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'The project MUST register a `spec` pytest marker in `conftest.py`: `@pytest.mark.spec("SR-01-001")`.'
    rationale: >-
      A registered marker lets each test name the requirement that it verifies. The
      coverage report and the coverage guard read this marker. The test configuration
      changes warnings into errors, so an unregistered marker causes a collection error
      for each test module that uses it.
  - id: SR-05-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `pytest_collection_modifyitems` MUST validate each `spec` marker value against the loaded `SpecRegistry` and emit
      `UnknownSpecIdWarning` (a `UserWarning` subclass, non-blocking per SR-05-007) for any unknown spec ID.
    rationale: >-
      A marker that names a nonexistent requirement claims coverage for nothing, and a
      typo looks the same as a valid citation. Validation at collection time names the
      bad ID. The warning class is under `vultron/metadata/specs/`. Thus
      `filterwarnings` can select it by a stable path, and production code does not
      import pytest.
  - id: SR-05-003
    priority: SHOULD
    kind: project
    statement: The pytest integration SHOULD load the registry once per session (not per test) to avoid I/O overhead.
    rationale: >-
      The registry is the same for each test in a session. One load prevents a new parse
      of the whole corpus for each test.
  - id: SR-05-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A test that verifies a `kind: protocol` or `kind: foundation` requirement MUST
      carry `@pytest.mark.spec("<ID>")` naming that requirement.
    rationale: >-
      Protocol- and foundation-kind requirements are conformance-critical. Without a
      marker, coverage for those requirements is unverifiable and the CI coverage guard
      (SR-05-005) cannot enforce it. `foundation` is covered with `protocol` because
      every rule an implementer must obey needs a test, whether Vultron defines it or
      inherits it (ADR-0134).
    adr:
    - ADR-0134
  - id: SR-05-008
    priority: SHOULD
    kind: project
    statement: >-
      A test that verifies a requirement of any other kind SHOULD carry
      `@pytest.mark.spec("<ID>")` naming that requirement, so that coverage can be
      reported by spec ID.
    rationale: >-
      A marker lets `spec-coverage` and the spec backstop link a test to the requirement
      it proves. For the lower-stakes kinds, a SHOULD keeps adoption opt-in, so no
      guard blocks a change for a missing marker.
    adr:
    - ADR-0134
  - id: SR-05-005
    priority: MUST
    kind: project
    statement: >-
      CI MUST fail a pull request that adds an uncovered `protocol` or `foundation`
      requirement. An ID is added when no `@pytest.mark.spec` marker covers it at the
      head, but it was covered, or of neither kind, at the merge base. A requirement
      that leaves both kinds, or is retired, is not an addition.
    rationale: >-
      A SHOULD-only marker rule produced near-zero adoption with no enforcement signal.
      `foundation` is guarded with `protocol` because every rule an implementer must
      obey needs a test (ADR-0134). Treating the two as one set means that a relabel
      from `protocol` to `foundation` is not a way around the guard.
    verification: >-
      `test/architecture/test_spec_coverage_ratchet.py::test_no_pr_adds_an_uncovered_implementer_spec`
      fails on each ID uncovered since the merge base and runs in CI with full history,
      and `test/metadata/specs/test_growth_guard.py` exercises the guard on fixture
      repositories for a new unmarked protocol spec, a new unmarked foundation spec, a
      removed last marker, an unchanged corpus, a relabel in and out, a relabel from
      protocol to foundation with and without a marker, a retired spec, and the logged
      skip when no base ref is available.
    adr:
    - ADR-0134
  - id: SR-05-009
    priority: MUST
    kind: project
    statement: >-
      When the coverage check of SR-05-005 fails a pull request, it MUST list each added
      uncovered ID.
    rationale: >-
      The author must add a marker for each added ID. A failure that names no ID makes
      the author search the whole corpus for the cause.
    verification: >-
      `test/metadata/specs/test_growth_guard.py` asserts the exact set of added IDs for
      a new unmarked spec and for a removed last marker.
    relationships:
    - rel_type: extends
      spec_id: SR-05-005
    adr:
    - ADR-0134
  - id: SR-05-010
    priority: MUST_NOT
    kind: project
    statement: >-
      The coverage check of SR-05-005 MUST NOT compare the uncovered set against a
      committed count.
    rationale: >-
      Markers record coverage per item, so the check compares the uncovered set at the
      base with the set at the head, and commits no number. A one-sided ceiling collects
      silent slack, and a two-sided pin races every concurrent PR
      (`notes/testing-pitfalls.md`). `spec-coverage` prints the live uncovered total.
    verification: >-
      `test/metadata/specs/test_growth_guard.py::test_coverage_committed_change_is_compared_from_merge_base`
      asserts that the check compares the head with the merge base.
    relationships:
    - rel_type: extends
      spec_id: SR-05-005
    adr:
    - ADR-0134
  - id: SR-05-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `pytest_collection_modifyitems` MUST handle three registry cases apart: no corpus,
      an unloadable corpus and an unexpected failure.
    rationale: >-
      A gate that silently skips reports the same clean pass as a corpus with no unknown
      IDs. Thus one malformed spec file could disable marker validation for a whole
      session. Each case needs its own response, so the hook must tell them apart
      (SR-05-011, SR-05-012, SR-05-013).
    relationships:
    - rel_type: refines
      spec_id: SR-05-002
      note: >-
        SR-05-002 specifies the marker check; SR-05-006 specifies what happens when the
        registry it needs is unavailable
  - id: SR-05-011
    priority: MUST
    kind: project
    statement: >-
      When `specs/` is absent, or present with no spec files,
      `pytest_collection_modifyitems` MUST return silently.
    rationale: >-
      With no corpus there is nothing to validate against and nothing is wrong, so a
      warning would be a false alarm.
    verification: >-
      `test/metadata/specs/test_spec_marker_gate.py::TestNoCorpusStaysSilent` asserts no
      warning and no validation for an absent and for an empty spec directory.
    relationships:
    - rel_type: part_of
      spec_id: SR-05-006
  - id: SR-05-012
    priority: MUST
    kind: project
    statement: >-
      When `specs/` exists but `load_registry` raises, `pytest_collection_modifyitems`
      MUST emit a `SpecRegistryUnavailableWarning` and return without validating
      markers. The warning names the spec directory, the underlying cause and the
      requirement whose gate is down.
    rationale: >-
      The session must still run, because a malformed spec file must not block the tests
      that diagnose it. For this reason, the hook gives a warning that is non-blocking
      (SR-05-007) and does not raise. The warning keeps the disabled gate visible.
    verification: >-
      `test/metadata/specs/test_spec_marker_gate.py::TestUnloadableCorpusIsVisible` and
      `::TestWarnSpecRegistryUnavailable` assert the warning, its content and that no
      marker is validated.
    relationships:
    - rel_type: part_of
      spec_id: SR-05-006
  - id: SR-05-013
    priority: MUST_NOT
    kind: project
    statement: >-
      `pytest_collection_modifyitems` MUST NOT catch an exception type outside the
      documented load-failure set.
    rationale: >-
      An unexpected exception type shows a bug in the loader, not a bad spec file. A
      catch-all handler would hide that bug (CS-23-001).
    verification: >-
      `test/metadata/specs/test_spec_marker_gate.py::TestUnexpectedFailureStillSurfaces::test_unexpected_exception_type_propagates`
      asserts that an unexpected exception type propagates.
    relationships:
    - rel_type: part_of
      spec_id: SR-05-006
  - id: SR-05-014
    priority: MUST
    kind: project
    statement: >-
      The `except` clause of `pytest_collection_modifyitems` MUST name only the
      narrowest concrete types that a corpus which exists but does not load can raise
      (CS-23-001).
    rationale: >-
      Narrow types are what keep an unexpected exception uncaught (SR-05-013). A blanket
      `except Exception` is a defect, because it catches every bug in the loader.
    verification: >-
      `test/metadata/specs/test_spec_marker_gate.py::TestUnexpectedFailureStillSurfaces::test_the_catch_is_not_blanket`
      asserts that the clause is not a blanket catch.
    relationships:
    - rel_type: implements
      spec_id: SR-05-013
    - rel_type: refines
      spec_id: CS-23-001
      note: >-
        applies the narrow-catch rule to the pytest collection hook, which sits outside
        CS-23-001's `vultron/` scope
  - id: SR-05-007
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Every warning that the pytest integration relies on being non-blocking MUST have a
      matching `always::` entry in the `filterwarnings` list of `pyproject.toml`.
    rationale: >-
      The `"error"` entry of `filterwarnings` turns every other warning into a failure.
      Without an exemption, a non-blocking warning would change into a collection
      abort.
    relationships:
    - rel_type: refines
      spec_id: SR-05-002
      note: supplies the "non-blocking" mechanism SR-05-002 and SR-05-006 both depend on
  - id: SR-05-015
    priority: MUST
    kind: project
    statement: >-
      Each such `always::` entry MUST come after the `"error"` entry in
      `filterwarnings`.
    rationale: >-
      pytest applies ini `filterwarnings` in list order through
      `warnings.filterwarnings()`, which puts each filter at the front of the list. Thus
      a later entry wins, and an `always::` entry before `"error"` has no effect. This
      order is the reverse of what readers expect.
    verification: >-
      `test/metadata/specs/test_spec_marker_gate.py::TestWarningIsNotEscalated::test_the_always_entry_outranks_the_error_rule`
      asserts the order of the two entries.
    relationships:
    - rel_type: extends
      spec_id: SR-05-007
  - id: SR-05-016
    priority: MUST
    kind: project
    statement: >-
      A test MUST verify each such entry by emitting the warning in a sub-session under
      the project's real filter list. A check of the position of the entry alone does
      not verify it.
    rationale: >-
      Only a behavioral check under the real filter list can find an error in the
      order. `pytest.warns` and `catch_warnings` replace the ini filters, and a position
      assertion passes when the behavior is broken.
    verification: >-
      `test/metadata/specs/test_spec_marker_gate.py::TestWarningIsNotEscalated::test_the_error_rule_does_not_escalate_the_warning`
      emits the warning in a sub-session under the real filter list.
    relationships:
    - rel_type: verifies
      spec_id: SR-05-015
- id: SR-06
  title: Pre-commit Hook
  specs:
  - id: SR-06-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: A `spec-lint` pre-commit hook MUST be defined that fires on any staged change to a `specs/*.yaml` file.
    rationale: >-
      Without a hook, only CI or the next agent that loads the corpus finds a spec
      error. The linter runs on each staged spec change, so it finds the error before
      the commit.
  - id: SR-06-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The hook MUST run `python -m vultron.metadata.specs.lint specs/` and block the commit on exit code `1`.
    rationale: >-
      A hook that only reports lets a broken corpus go into a commit. A block on exit
      code 1 keeps each commit loadable by the tools that depend on it.
  - id: SR-06-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: 'The hook MUST be configured with `pass_filenames: false` so the full registry is always validated, not just
      the changed file.'
    rationale: >-
      Cross-references, ID uniqueness and relationship loops go across files. A lint of
      only the changed file can miss an error that the change causes in a different
      file, such as a removed ID that a different file still cites.
- id: SR-07
  title: Context Generation Tool
  specs:
  - id: SR-07-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The `vultron/metadata/specs/` module MUST provide a context generation tool that accepts a `SpecRegistry` and
      produces output for agent consumption.
    rationale: >-
      The full corpus is much larger than the context of an agent. A tool that renders a
      requested part of the registry gives agents validated content in a form that they
      can load.
  - id: SR-07-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The tool MUST support a **markdown renderer** that regenerates a `.md` view of a spec file from its YAML source.
    rationale: >-
      Reviewers and readers of the published documentation read prose, not YAML. When
      the Markdown comes again from the YAML, the readable view stays the same as the
      authoritative source.
  - id: SR-07-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: The tool MUST support a **JSON exporter** that serializes the full registry or individual spec files to JSON.
    rationale: >-
      Other tools and agents parse JSON reliably. An export from the validated registry
      gives them the same requirements that spec-lint checked, not a separate parse of
      the YAML.
  - id: SR-07-004
    priority: SHOULD
    kind: project
    statement: The markdown renderer SHOULD produce output compatible with the existing `meta-specifications.md` style guide.
    rationale: >-
      A rendered view that follows the documented spec style looks like the rest of the
      documentation. A reader then does not have to learn a second layout.
  - id: SR-07-005
    priority: SHOULD
    kind: project
    statement: The JSON exporter SHOULD support filtering by `kind`, `scope`, `tags`, or `priority` to allow agents to request
      only relevant subsets.
    rationale: >-
      Most tasks need only a small part of the corpus. A filter by attribute lets an
      agent load the requirements that apply to its work, without the rest.
  - id: SR-07-006
    priority: SHOULD
    kind: project
    statement: >-
      The `spec-dump` CLI SHOULD support a `--kind` flag that takes comma-separated
      `SpecKind` values. The flag filters the LLM-optimized JSON output to the matching
      requirements.
    rationale: >-
      Different work must obey different tiers. Protocol work needs `protocol` and
      `foundation`, and tooling work needs `project`. A kind filter selects a tier
      directly.
  - id: SR-07-018
    priority: MUST
    kind: project
    statement: >-
      When `--kind` names an unknown kind, `spec-dump` MUST exit with code 2 and print
      an error that lists the valid values.
    rationale: >-
      An empty result would tell the reader that no requirements apply. An error that
      shows the valid choices tells the reader that the value was wrong.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py::test_cli_unknown_kind_lists_foundation_as_valid`
      asserts the error and the list of valid values.
  - id: SR-07-007
    priority: MUST
    kind: project
    statement: >-
      The `spec-dump` CLI MUST support an `--index` flag that prints a plain-text spec map instead
      of JSON: one line per topic (`ID  Title  (N reqs)`) followed by one indented line per group
      (`  GROUP-ID  group title (N)`), counting only requirements that match the other flags.
    rationale: >-
      The unfiltered JSON dump is several megabytes, far larger than an agent context window. A
      map of topics and groups lets an agent choose what to load before loading it.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts the topic and group line formats, that
      filters narrow the counts, and that the output is not JSON.
  - id: SR-07-008
    priority: MUST
    kind: project
    statement: >-
      The `spec-dump` CLI MUST support the comma-separated selectors `--topic`,
      `--group` and `--ids`, and a `--deps` flag that adds every selected requirement's
      transitive dependencies.
    rationale: >-
      Targeted loads replace the full dump.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts multi-topic, group, ID and
      dependency expansion through both `to_llm_json` and the CLI.
  - id: SR-07-019
    priority: MUST
    kind: project
    statement: >-
      `spec-dump` MUST combine the `--topic`, `--group` and `--ids` selectors as a
      union.
    rationale: >-
      A union lets one call load a primary topic together with specific groups or IDs
      from other topics.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py::TestToLlmJsonSelection::test_selectors_are_a_union`
      asserts union selection.
    relationships:
    - rel_type: extends
      spec_id: SR-07-008
  - id: SR-07-009
    priority: SHOULD
    kind: project
    statement: >-
      The `spec-dump` CLI SHOULD expose `--tag` (comma-separated; all tags must match), `--scope`,
      and `--priority` flags that narrow the selected requirements, alongside `--kind`.
    rationale: >-
      These attributes go across topics. A filter on them lets an agent take only the
      binding or in-scope requirements from a selection.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts each flag narrows the output.
  - id: SR-07-010
    priority: MUST
    kind: project
    statement: >-
      The `spec-dump` CLI MUST support a `--cross-cutting` flag that adds the topics in
      the `CROSS_CUTTING_TOPICS` constant of `vultron.metadata.specs` to the selection.
    rationale: >-
      Several skills load the cross-cutting topics with every task. One flag gives every
      skill the same list.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts that the flag unions those
      topics with the other selectors.
  - id: SR-07-020
    priority: MUST
    kind: project
    statement: >-
      The `CROSS_CUTTING_TOPICS` constant MUST be the single definition of the
      cross-cutting topic list.
    rationale: >-
      Copies of the list that each skill keeps by hand become different over time. One
      definition behind the flag keeps them the same.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py::TestCli::test_cross_cutting_constant_is_the_only_definition`
      fails when a module under `vultron/` other than the constant's own spells out the
      topic list.
    relationships:
    - rel_type: extends
      spec_id: SR-07-010
  - id: SR-07-011
    priority: MUST
    kind: project
    statement: >-
      The `spec-dump` CLI MUST exit with code 2 and write an error to stderr that names the
      offending values when a `--topic`, `--group`, `--ids`, `--tag`, `--scope`, or `--priority`
      value is unknown, or when a flag is given without its value.
    rationale: >-
      An empty result for a mistyped ID looks the same as "no requirements apply", which is the
      wrong conclusion for an agent to draw silently.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts exit code 2 and the stderr message for
      each flag.
  - id: SR-07-012
    priority: SHOULD
    kind: project
    statement: >-
      The `spec-dump` CLI SHOULD support a `--slim` flag that reduces each requirement to `id`,
      `priority`, `statement`, and `note` (when set), keeps only relationship edges whose both
      ends are in the output.
    rationale: >-
      `note` stays because it records which side an obligation binds; dropping it leads to
      requirements implemented at the wrong layer.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts the slim record fields and edge
      pruning.
  - id: SR-07-013
    priority: SHOULD
    kind: project
    statement: >-
      When `spec-dump` runs without `--index` and without any selector or filter flag,
      it SHOULD still print the full JSON dump to stdout.
    rationale: >-
      `spec-audit` needs the full corpus.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py::TestCli::test_unfiltered_dump_warns_on_stderr`
      asserts the full output.
  - id: SR-07-021
    priority: SHOULD
    kind: project
    statement: >-
      On such a run, `spec-dump` SHOULD write one warning line to stderr that states the
      output size and suggests `--index` and the selector flags.
    rationale: >-
      An agent that runs the bare command by habit needs to learn that the output does
      not fit in its context.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts the single stderr line, and
      that filtered and `--index` runs do not warn.
    relationships:
    - rel_type: extends
      spec_id: SR-07-013
  - id: SR-07-014
    priority: MUST
    kind: project
    statement: >-
      The `spec-dump` CLI MUST support a `--text` flag that renders the selected
      requirements as indented text. The text holds a topic header, a group header, then
      one `ID PRIORITY statement` line per requirement.
    rationale: >-
      The JSON dump is a single line, so an agent that prints a load of any size sees a
      truncated prefix of one unreadable token; observed agent runs piped every load
      through `jq` to read it at all. One line per requirement truncates gracefully and
      costs fewer bytes than the JSON.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts the header, topic, group, and
      requirement line formats, and that statements are collapsed to one line.
  - id: SR-07-022
    priority: MUST
    kind: project
    statement: >-
      `spec-dump` MUST reject `--text` without a selector, with exit status 2.
    rationale: >-
      A `--text` run without a selector would print the whole corpus as text. Requiring
      a selector keeps `--text` from reproducing the full-dump wall.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py::TestRequirementsText::test_cli_text_without_a_selector_exits_2`
      asserts the exit status.
    relationships:
    - rel_type: extends
      spec_id: SR-07-014
  - id: SR-07-015
    priority: MUST
    kind: project
    statement: >-
      The selection that `--text` requires MUST be a set selector (`--topic`, `--group`,
      `--ids`, `--adr` or `--cross-cutting`) that names at least one value.
    rationale: >-
      Only a set selector bounds the output to the requirements that an agent asked for.
      Without one, `--text` prints the wall that SR-07-022 exists to prevent.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py::TestRequirementsText::test_cli_text_flag`
      and `test/metadata/specs/test_spec_dump_adr_selector.py::test_adr_counts_as_a_set_selector_for_text`
      assert that a set selector satisfies `--text`.
    relationships:
    - rel_type: refines
      spec_id: SR-07-022
    tags:
    - tooling
  - id: SR-07-023
    priority: MUST_NOT
    kind: project
    statement: >-
      An attribute filter such as `--kind` or `--priority` MUST NOT satisfy the
      selection that `--text` requires.
    rationale: >-
      Attribute filters keep whole topics, so counting one as a selection let `--text
      --kind protocol` print 285 KB. That is the wall the selector requirement exists to
      prevent.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts that `--text` with only an
      attribute filter exits 2.
    relationships:
    - rel_type: refines
      spec_id: SR-07-015
    tags:
    - tooling
  - id: SR-07-024
    priority: MUST
    kind: project
    statement: >-
      `spec-dump` MUST exit with status 2 when a set selector names no values, such as
      `--topic ""`.
    rationale: >-
      An empty list means "select nothing" to the exporter but "no selection" to the
      size guard, so `--topic ""` printed an empty dump under a warning about an
      unfiltered one. The empty list is a typo, and the tool should say so.
    verification: >-
      `test/metadata/specs/test_spec_dump_cli.py` asserts that an empty set selector
      exits 2 in both text and JSON modes;
      `test/metadata/specs/test_spec_dump_adr_selector.py` asserts the same for an empty
      `--adr`.
    tags:
    - tooling
  - id: SR-07-016
    priority: MUST
    kind: project
    statement: >-
      The `glossary-index` entry point MUST render one line per `##` section of
      `docs/reference/glossary.md`. The line carries the line range and the terms of the
      section, and the aliases to avoid for each term.
    rationale: >-
      The glossary is ~82 KB, most of it definitions a given task never touches; the
      index is ~12 KB and carries the naming guard, which is the part every session
      needs. Line ranges are what let `deepen-context` read one section instead of the
      file.
    verification: >-
      `test/metadata/docs/test_glossary_index.py` asserts the line format, the alias
      rendering, and that a section with a heading at end of file does not raise.
    tags:
    - documentation
    - tooling
  - id: SR-07-025
    priority: MUST
    kind: project
    statement: >-
      `glossary-index` MUST attribute each term table to the section whose line range
      contains it, not to a section with a matching heading.
    rationale: >-
      Two sections can share a heading. Matching on heading text instead of position
      gave two such sections each other's terms.
    verification: >-
      `test/metadata/docs/test_glossary_index.py::test_sections_sharing_a_heading_keep_their_own_terms`
      asserts that duplicate headings keep their own terms.
    relationships:
    - rel_type: refines
      spec_id: SR-07-016
    tags:
    - documentation
    - tooling
  - id: SR-07-017
    priority: MUST
    kind: project
    statement: >-
      The `spec-dump` CLI MUST support an `--adr` set selector, a comma-separated list
      of `ADR-NNNN` ids. It selects every requirement whose `adr:` field names one of
      those ids, as a union with the other selectors.
    rationale: >-
      `deepen-context` routes through decision records by reading the `adr:` edge
      backwards instead of reading a record body (ADR-0127, MS-11-008), and agents do
      not read raw spec YAML.
    verification: >-
      `test/metadata/specs/test_spec_dump_adr_selector.py` asserts selection by one and
      by two records, the union with `--ids` and `--deps`, JSON and `--text` output, and
      `--adr` alone satisfying `--text`.
    relationships:
    - rel_type: refines
      spec_id: SR-07-008
    adr:
    - ADR-0127
    tags:
    - tooling
  - id: SR-07-026
    priority: MUST
    kind: project
    statement: >-
      `spec-dump` MUST exit with status 2, naming the value, when an `--adr` value is
      malformed or names no record. A value is malformed when it is not an `ADR-NNNN`
      id. The record search covers the `docs/adr/` beside the spec directory, archived
      records included.
    rationale: >-
      A typo in a record ID would otherwise give an empty selection, which reads as
      "this record governs nothing". The error names the value, so the agent can correct
      it.
    verification: >-
      `test/metadata/specs/test_spec_dump_adr_selector.py` asserts exit 2 for each
      malformed value, for an id that names no record, and when no record directory sits
      beside the spec directory.
    relationships:
    - rel_type: extends
      spec_id: SR-07-017
    adr:
    - ADR-0127
    tags:
    - tooling
  - id: SR-07-027
    priority: MUST
    kind: project
    statement: >-
      `spec-dump` MUST write a note to stderr for each named record that no requirement
      cites in `adr:`. The note names the record and points at its prose citations under
      `specs/` and `notes/`.
    rationale: >-
      Some live records are reached only by prose citation, so an empty selection for
      one of them would read as "this record governs nothing". The note says where its
      rule is stated instead.
    verification: >-
      `test/metadata/specs/test_spec_dump_adr_selector.py::test_record_no_requirement_cites_is_noted_not_silent`
      asserts the stderr note for an uncited record.
    relationships:
    - rel_type: extends
      spec_id: SR-07-017
    adr:
    - ADR-0127
    tags:
    - tooling
  - id: SR-07-028
    priority: MUST
    kind: project
    statement: >-
      When `spec-dump` writes such a note, it MUST still print the selection.
    rationale: >-
      The note adds to the output and replaces nothing. A run that also names cited
      records must still give their requirements.
    verification: >-
      `test/metadata/specs/test_spec_dump_adr_selector.py::test_record_no_requirement_cites_is_noted_not_silent`
      asserts non-empty output for an uncited record.
    relationships:
    - rel_type: extends
      spec_id: SR-07-027
    adr:
    - ADR-0127
    tags:
    - tooling
- id: SR-09
  title: Docs Renderer Kind Routing
  specs:
  - id: SR-09-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `render_for_kind(kind, registry)` function MUST route each spec item of kind
      `architecture`, `project`, or `process` to the docs page that matches its `kind`
      field.
    rationale: >-
      Each item declares its own kind, with no inheritance from group or file, so a
      requirement renders on the page for its own tier. No group or file value can put
      it on the wrong page.
    adr:
    - ADR-0147
    tags:
    - documentation
    - tooling
  - id: SR-09-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The docs renderer MUST render each `protocol` or `foundation` spec item in the
      Requirements Catalog of the Protocol Specification (DF-12-001), not on a kind
      page.
    rationale: >-
      Protocol and foundation items apply to every implementation, so they render in the
      catalog of the Protocol Specification, with the normative specification text
      (ADR-0147).
    relationships:
    - rel_type: extends
      spec_id: SR-09-001
    adr:
    - ADR-0147
    tags:
    - documentation
    - tooling
  - id: SR-09-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      A group with items of mixed kinds MUST appear on each docs page that matches the
      `kind` of at least one of its items. The Requirements Catalog's `protocol` and
      `foundation` pages count as pages for this rule (DF-12-001).
    rationale: >-
      A mixed group holds items for more than one page, so each of those pages needs the
      group context. The protocol and foundation pages of the catalog use the same rule,
      so a mixed group also splits there (ADR-0147).
    adr:
    - ADR-0147
    tags:
    - documentation
    - tooling
  - id: SR-09-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      On each docs page, the renderer MUST omit the items of a group whose `kind` does
      not match that page. The Requirements Catalog's `protocol` and `foundation` pages
      count as pages for this rule (DF-12-001).
    rationale: >-
      If a page rendered the whole group everywhere the group appears, items would
      repeat and some items would show the wrong portability tier. When each page hides
      the items of other kinds, the page stays accurate.
    relationships:
    - rel_type: extends
      spec_id: SR-09-002
    adr:
    - ADR-0147
    tags:
    - documentation
    - tooling
  - id: SR-09-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The spec linter MUST emit a hard error (exit 1) when any spec item is missing a `kind` field.
      There is no inheritance fallback; `kind` is required on every individual spec item.
    rationale: >-
      Mandatory per-item kind prevents the category-page placement errors and agent confusion that
      arose from implicit inheritance. Failing fast at lint time ensures the registry stays clean.
    tags:
    - documentation
    - tooling
- id: SR-08
  title: Migration
  specs:
  - id: SR-08-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: All existing `specs/*.md` files MUST be migrated to `specs/*.yaml` using a lossless conversion that preserves
      all requirement text, IDs, and relationships.
    rationale: >-
      Code, tests, ADRs and other specs cite requirement IDs, wording and relationships.
      A lossy conversion would break those citations or silently change what a
      requirement says.
  - id: SR-08-003
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      YAML files in `specs/` are the sole authoritative source for project specifications. No other
      format or location holds normative spec content.
    rationale: >-
      Two normative sources for one requirement can disagree, and a reader cannot tell
      which source applies. One authoritative location lets the linter and the tools use
      the YAML as the complete corpus.
  - id: SR-08-004
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: '`specs/README.md` MUST be retained as Markdown; it is documentation, not a requirement file.'
    rationale: >-
      `specs/README.md` tells how the corpus is organized and how to use it. It holds no
      requirements, so the YAML-only rule (SR-08-003) does not apply to it. Readers who
      look through `specs/` still need an entry point that humans can read.
  - id: SR-08-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: All in-project skills, prompts, and agent instructions that reference `specs/*.md` files by path or extension
      MUST be updated to use `specs/*.yaml` paths or the context-generation tool output before the migration is considered
      complete.
    rationale: >-
      A skill or prompt that points at a Markdown spec path sends agents to a file that
      does not hold the requirements. The agents then work without the requirements that
      they must load, and nothing reports the problem.
  - id: SR-08-006
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: The original `specs/*.md` requirement files MUST NOT be deleted until the YAML files
      have passed the spec linter with zero errors.
    rationale: >-
      Until the YAML loaded correctly, the Markdown files were the only copy of the
      requirements. An earlier deletion could lose requirement text that the conversion
      dropped.
  - id: SR-08-008
    priority: MUST_NOT
    kind: project
    verification_debt: '#2574'
    statement: The original `specs/*.md` requirement files MUST NOT be deleted until all agent and
      skill references have been updated to use `specs/*.yaml` paths.
    rationale: >-
      If the Markdown files are deleted while a skill still points at them, that skill
      loads nothing. No error shows that the requirements are missing.
    relationships:
    - rel_type: refines
      spec_id: SR-08-005
  - id: SR-08-007
    priority: SHOULD
    kind: project
    statement: A migration script SHOULD be provided to convert a single `specs/*.md` file to the YAML format as a starting
      point; manual review and cleanup is expected.
    rationale: >-
      Manual conversion of files is slow and causes errors. A script makes a correct
      first version, and the expected manual review finds what the script gets wrong.
- id: SR-10
  title: Spec Statement Semantics
  specs:
  - id: SR-10-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec statement MUST describe an invariant property of the finished system. Such
      a property states what must always be true, what the system must always do, or
      what it must never do.
    rationale: >-
      Specs are transferable knowledge for any implementer. Only a property that always
      holds stays true for every reader at every time.
    tags:
    - documentation
  - id: SR-10-005
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec statement MUST NOT describe a migration step, a one-time task, or a
      before-and-after transition.
    rationale: >-
      A statement like "X must be replaced by Y" is meaningless once the replacement is
      done, and misleading before it is. The correct home for migration tasks is an
      issue tracker. If a migration produces a lasting architectural rule, that rule,
      not the migration instruction, belongs in the spec.
    relationships:
    - rel_type: extends
      spec_id: SR-10-001
    tags:
    - documentation
  - id: SR-10-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      A spec statement MUST be written in the present tense and describe the system as it
      must perpetually be.
    rationale: >-
      Temporal or conditional framing ("once X holds, Y must go away") creates specs whose
      satisfaction is permanent after a single event. Such specs cannot be re-tested on
      subsequent builds and do not communicate ongoing constraints to future maintainers
      or implementers.
    tags:
    - documentation
    relationships:
    - rel_type: refines
      spec_id: SR-10-001
  - id: SR-10-004
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      Phrases that signal migration-task framing — "must be replaced by", "must be removed",
      "must be updated to", "once X is done", "after migration" — MUST NOT appear in a spec
      statement unless they refer to a runtime state transition (e.g. a state machine trigger),
      not a code change.
    rationale: >-
      These phrases usually show that a statement records a code change, not an
      invariant (SR-10-001). A ban on them outside runtime state transitions makes such
      statements easy to find. The corpus then describes the system as it must be.
    tags:
    - documentation
    relationships:
    - rel_type: refines
      spec_id: SR-10-002
  - id: SR-10-003
    priority: SHOULD
    kind: process
    statement: >-
      A spec author SHOULD delete a spec whose statement has become vacuously satisfied.
      A statement is vacuously satisfied when the migration it described is complete and
      no ongoing constraint survives.
    rationale: >-
      A vacuously satisfied spec creates false confidence: it always passes any check,
      so it neither constrains nor informs. Deletion keeps the registry honest.
    tags:
    - documentation
    relationships:
    - rel_type: refines
      spec_id: SR-10-001
  - id: SR-10-006
    priority: SHOULD
    kind: process
    statement: >-
      When a residual constraint survives the migration, the spec author SHOULD rewrite
      the statement to express only that constraint, without any migration-task
      language.
    rationale: >-
      A partially-stale spec that mixes a completed migration instruction with a
      surviving rule misleads readers about which clause is still normative. A rewrite
      keeps only the clause that still binds.
    tags:
    - documentation
    relationships:
    - rel_type: refines
      spec_id: SR-10-005
- id: SR-11
  title: Story Traceability
  specs:
  - id: SR-11-001
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      `StatementSpec` MUST support an optional `stories` field that holds a non-empty
      list of `StoryIdStr` values (pattern `^story_\d{4}_\d{3}$`). The values name the
      user stories that motivated the requirement.
    rationale: >-
      Bidirectional traceability between requirements and stakeholder user stories is a
      NASA systems engineering criterion. Without back-references in spec files, tracing
      "which stakeholder need does this requirement serve?" requires consulting the
      manually-maintained `docs/reference/user_stories/traceability.md` matrix, which
      drifts as specs evolve. Embedding story references in the spec files makes the
      spec the authoritative source and enables automated change-impact analysis.
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0072
  - id: SR-11-005
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The schema MUST apply the `_nonempty_if_present` validator to the `stories` field.
    rationale: >-
      An empty `stories:` list would claim a trace to user stories and name none. The
      validator rejects that list at load time, so a present field always names a
      story.
    relationships:
    - rel_type: extends
      spec_id: SR-11-001
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0072
  - id: SR-11-002
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      Each story ID in a `stories:` field MUST match the pattern `^story_\d{4}_\d{3}$`,
      such as `story_2022_001`.
    rationale: >-
      A fixed pattern lets the schema reject a malformed or misspelled story ID at load
      time. Thus each story reference resolves against the story catalog.
    relationships:
    - rel_type: refines
      spec_id: SR-11-001
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0072
  - id: SR-11-006
    priority: MUST
    kind: project
    verification_debt: '#2574'
    statement: >-
      The `StoryIdStr` type in `vultron/metadata/specs/schema.py` MUST enforce that
      pattern through Pydantic `StringConstraints`.
    rationale: >-
      A constrained type checks the pattern wherever a story ID is validated. A check in
      each tool would be repeated, and one copy could differ from the others.
    relationships:
    - rel_type: implements
      spec_id: SR-11-002
    tags:
    - documentation
    - tooling
    adr:
    - ADR-0072
  - id: SR-11-003
    priority: MUST
    kind: process
    statement: >-
      The spec linter MUST report as a hard error each `kind: protocol` spec with
      `priority: MUST` that has no `stories:` entry.
    note: >-
      Deliberately MUST-only for now, which is the one exception MS-02-003 records.
      #3601 adjudicated the protocol MUST_NOTs with no `stories:`; #2717 holds the
      confirmed list, and the gate extends to `priority: MUST_NOT` as #2717's
      closing step once their stories exist.
    tracking_issue: '#2717 (MUST_NOT extension)'
    verification: >-
      `test/metadata/specs/test_lint.py::test_protocol_must_no_stories_is_hard_error`
      and `::test_protocol_must_with_stories_passes` cover the error and the pass.
    rationale: >-
      Protocol-level MUST requirements are the strongest obligations of an implementer.
      A hard-error gate makes each of them traceable to at least one stakeholder need.
      The gate covers only `protocol`, because no user stories exist yet
      for behavior that Vultron inherits from ActivityStreams, ActivityPub and HTTP
      (`kind: foundation`). The gate covers the kinds that the story catalog can support
      (ADR-0134).
    adr:
    - ADR-0072
    - ADR-0134
    relationships:
    - rel_type: refines
      spec_id: SR-11-001
    tags:
    - documentation
    - tooling
  - id: SR-11-007
    priority: MUST
    kind: process
    statement: >-
      The spec linter MUST let a spec suppress that hard error with
      `lint_suppress: [missing_story_reference]`.
    rationale: >-
      Some implementation-detail MUSTs have no direct story. The suppression gives them
      an exception and records on the spec that the exception is deliberate.
    verification: >-
      `test/metadata/specs/test_lint.py::test_protocol_must_suppress_missing_story_reference`
      covers the suppression.
    adr:
    - ADR-0072
    relationships:
    - rel_type: extends
      spec_id: SR-11-003
    tags:
    - documentation
    - tooling
  - id: SR-11-004
    priority: SHOULD
    kind: process
    statement: >-
      The spec linter SHOULD emit an advisory warning for each `kind: protocol` spec
      with `priority: SHOULD`, `priority: SHOULD_NOT` or `priority: MAY` that has no
      `stories:` entry.
    rationale: >-
      Lower-priority protocol requirements still apply to implementers who choose to
      follow them, so a missing story is worth a flag. A warning, not an error, matches
      their weaker binding.
    adr:
    - ADR-0072
    - ADR-0134
    verification: >-
      `test/metadata/specs/test_lint.py::test_protocol_should_no_stories_is_advisory`,
      `::test_protocol_should_not_no_stories_is_advisory`, and
      `::test_protocol_may_no_stories_is_advisory` cover the three priorities;
      `::test_protocol_should_with_stories_no_story_warn` covers the pass.
    relationships:
    - rel_type: refines
      spec_id: SR-11-003
    - rel_type: refines
      spec_id: MS-02-003
      note: SHOULD_NOT is the SHOULD tier
    tags:
    - documentation
    - tooling
  - id: SR-11-008
    priority: SHOULD
    kind: process
    statement: >-
      The spec linter SHOULD let a spec suppress that warning with
      `lint_suppress: [missing_story_reference]`.
    rationale: >-
      The suppression records a deliberate exception on the spec, so the warning does
      not repeat for a requirement that has no story by design.
    verification: >-
      `test/metadata/specs/test_lint.py::test_protocol_should_suppress_advisory_story_warn`
      covers the suppression.
    adr:
    - ADR-0072
    relationships:
    - rel_type: extends
      spec_id: SR-11-004
    tags:
    - documentation
    - tooling
- id: SR-12
  title: Spec Selection Backstop
  specs:
  - id: SR-12-001
    priority: MUST
    kind: project
    statement: >-
      By default, `spec-backstop` MUST treat as changed each `.py` file that is
      untracked or that differs from the merge base of `--base` and `HEAD`. The diff
      runs to the working tree, and `--base` defaults to `origin/main`.
    rationale: >-
      Agents choose which requirements to load by judgment. A check computed from the
      diff catches under-selection without trusting that judgment. The working tree is
      included because an agent runs the check before it commits.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts diff-hunk parsing and, in a
      temporary git repository, that committed, uncommitted, and untracked changes are
      all collected.
    tags:
    - tooling
  - id: SR-12-014
    priority: MUST
    kind: project
    statement: >-
      When `--paths` is given, `spec-backstop` MUST use the named files as the changed
      set, each treated as fully changed.
    rationale: >-
      Before any code exists, an agent names the files that the work will touch. The
      check then runs on those files, while a missed requirement is still cheap to act
      on.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_cli_paths_json` asserts `--paths`
      handling.
    relationships:
    - rel_type: extends
      spec_id: SR-12-001
    tags:
    - tooling
  - id: SR-12-002
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST treat as a changed symbol each top-level function, class, or
      assignment whose line span, decorators included, intersects a diff hunk.
    rationale: >-
      Symbol-level matching is much narrower than module-level matching. A module such
      as `vultron/core/behaviors/bridge.py` is imported by dozens of test files, but
      only the tests that import the edited names govern the edit.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts decorator spans and
      module-level-only hunks.
    tags:
    - tooling
  - id: SR-12-015
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST count a changed method as a change to its class.
    rationale: >-
      Tests import a class, not its methods. A method change attributed to its class
      reaches the tests that import that class.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_changed_symbols` asserts
      method-to-class attribution.
    relationships:
    - rel_type: refines
      spec_id: SR-12-002
    tags:
    - tooling
  - id: SR-12-016
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST count every top-level symbol of a fully changed file as
      changed.
    rationale: >-
      A file named with `--paths`, or a new file, has no hunks to intersect. Every
      symbol it defines is part of the change.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_changed_symbols` asserts whole-file
      mode.
    relationships:
    - rel_type: refines
      spec_id: SR-12-002
    tags:
    - tooling
  - id: SR-12-003
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST report as required, in its `MUST` tier, the spec groups that
      each of four signals links to the change. The first signal is the
      `@pytest.mark.spec` IDs in test files that import a changed symbol by name. The
      second is those IDs in mirror-path test files of a changed module. The third is
      those IDs in the changed parts of changed test files. The fourth is the
      requirements whose statement names a changed module's path or dotted name, or a
      long changed symbol, as a whole word. A changed symbol is long when it has six or
      more characters or is in CamelCase.
    rationale: >-
      Each signal is a deterministic link between the change and a requirement.
      Directory prefixes and short symbol names are excluded because they match too many
      unrelated statements.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts each of the four signals, and that
      a directory prefix and a short symbol name do not match.
    tags:
    - tooling
  - id: SR-12-004
    priority: SHOULD
    kind: project
    statement: >-
      `spec-backstop` SHOULD report as advisory, in its INFO tier, the spec groups of
      test files that import a changed module by any name.
    rationale: >-
      A module import is weak evidence. Listing it without enforcing it gives the agent
      a place to look without adding false alarms.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts that a module-only importer yields
      an INFO group.
    tags:
    - tooling
  - id: SR-12-017
    priority: SHOULD
    kind: project
    statement: >-
      `spec-backstop` SHOULD omit from the INFO tier every group that is already in the
      `MUST` tier.
    rationale: >-
      A group listed in both tiers would be read twice and could look advisory. The
      `MUST` tier already asks the agent to resolve it.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_analyze_tiers` asserts that a group in
      both tiers appears only in `MUST`.
    relationships:
    - rel_type: extends
      spec_id: SR-12-004
    tags:
    - tooling
  - id: SR-12-005
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST report each hit at the spec-group level, listing the
      requirement IDs that matched and the deduplicated evidence for them.
    rationale: >-
      Agents load specs by topic and group, so a group-level report maps directly onto
      the manifest. The evidence lets the agent judge a hit instead of loading it
      blindly.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts the human-readable MUST and INFO
      sections.
    tags:
    - tooling
  - id: SR-12-018
    priority: MUST
    kind: project
    statement: >-
      When `--json` is given, `spec-backstop` MUST emit the same report as JSON.
    rationale: >-
      A calling script needs the report in a form that it can parse without reading the
      text layout.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_cli_paths_json` asserts the JSON keys.
    relationships:
    - rel_type: extends
      spec_id: SR-12-005
    tags:
    - tooling
  - id: SR-12-006
    priority: MUST
    kind: project
    statement: >-
      When `--manifest` names a file, or `-` for stdin, `spec-backstop` MUST read the
      topic, group and requirement IDs on its `Loaded` lines as loaded. It reads those
      IDs on its `Considered, skipped` lines as dismissed.
    rationale: >-
      A dismissal with a reason is an explicit judgment and satisfies the check, so the
      tool must tell it apart from a load.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_parse_manifest` asserts the parse, and
      that IDs in reason text are not parsed.
    tags:
    - tooling
  - id: SR-12-019
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST exit with code 1 and list every `MUST`-tier group that the
      manifest does not resolve. A group is resolved when it or its topic is loaded,
      when it is dismissed, or when each of its matched requirement IDs is listed.
    rationale: >-
      A group that the manifest does not mention at all is the under-selection the check
      exists to catch. The exit code lets a caller gate on it.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts each resolution rule
      (`test_unresolved_groups`) and the exit codes through the CLI
      (`test_cli_manifest_exit_codes`).
    relationships:
    - rel_type: depends_on
      spec_id: SR-12-006
    tags:
    - tooling
  - id: SR-12-007
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST write to stderr a note naming each changed source file that
      produced no `MUST`-tier signal.
    rationale: >-
      An empty MUST tier for a file with no tests and no spec mentions is not evidence
      that no requirement applies. The note stops the agent from reading silence as
      coverage.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts the note for a file with no signal
      and its absence for a file with one.
    tags:
    - tooling
  - id: SR-12-008
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST exit with code 2 and write an error to stderr when it runs outside a
      git repository in diff mode, when the `--base` ref cannot be resolved, or when the
      manifest file cannot be read.
    rationale: >-
      Exit code 1 means unresolved groups. A setup failure must not look like either a pass or
      a finding.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts exit code 2 for an unknown base ref and
      for a missing manifest file.
    tags:
    - tooling
  - id: SR-12-009
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST move to the INFO tier the symbol-import hits of a changed
      symbol that more than `--hub-threshold` test files import. The threshold defaults
      to `HUB_THRESHOLD`, which is 10.
    rationale: >-
      A hub such as `BTBridge` is imported by most behaviour tests, so symbol-import
      matching on it puts about 75 groups in MUST and the check stops discriminating.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts the demotion above the threshold,
      no demotion at it, and the `--hub-threshold` flag.
    relationships:
    - rel_type: refines
      spec_id: SR-12-003
    tags:
    - tooling
  - id: SR-12-020
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST keep the mirror-path and statement-mention hits of a hub
      symbol in the `MUST` tier.
    rationale: >-
      A mirror-path test or a statement that names the symbol is a direct link to the
      change, however many files import the symbol. Only the import signal loses its
      meaning for a hub.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_hub_symbol_import_hits_demoted_to_info`
      asserts that mirror and mention hits stay in `MUST`.
    relationships:
    - rel_type: refines
      spec_id: SR-12-003
    tags:
    - tooling
  - id: SR-12-021
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST print each hub symbol with its importer count in the report.
    rationale: >-
      Naming the hubs keeps the demotion visible, so an agent does not read the shorter
      list as coverage.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts the hub line in the text output
      (`test_render_text_names_hubs`) and the `hubs` key in the JSON output
      (`test_cli_hub_threshold_flag`).
    relationships:
    - rel_type: extends
      spec_id: SR-12-009
    tags:
    - tooling
  - id: SR-12-010
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST tier a group by the priority of the requirements that
      matched. A group whose matched requirements are all `SHOULD`, `SHOULD_NOT` or
      `MAY` goes to the INFO tier. Thus only a `MUST` or `MUST_NOT` requirement can
      leave the manifest unresolved.
    rationale: >-
      An unresolved MUST group blocks the build, so the blocking set has to be
      requirements that themselves bind. A SHOULD-only group such as TRIG-05 forced a
      spec load with no obligation behind it.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts a SHOULD-only group lands in INFO,
      a group with one MUST among SHOULDs stays in MUST, and the advisory evidence
      wording.
    relationships:
    - rel_type: refines
      spec_id: SR-12-004
    tags:
    - tooling
  - id: SR-12-011
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST move to the INFO tier the marker-derived hits of a test file
      whose spec markers span more than `MONOLITH_GROUP_SPAN` requirement groups.
    rationale: >-
      A 17-group catch-all suite put 13 unrelated groups in MUST from one import. The
      median test file here spans 2 groups and the 90th percentile spans 6, so a
      threshold of 8 demotes only genuine whole-subsystem suites.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts the marker demotion above the span,
      and that a file at the span still promotes.
    relationships:
    - rel_type: refines
      spec_id: SR-12-003
    tags:
    - tooling
  - id: SR-12-022
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST exclude the module-level boilerplate names `logger` and
      `log`, and their case variants, from the changed-symbol set.
    rationale: >-
      `logger` is assigned in nearly every module, so it matched every requirement that
      mentions `logger.info`.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_logger_is_not_a_changed_symbol`
      asserts that `logger` is not a changed symbol.
    relationships:
    - rel_type: refines
      spec_id: SR-12-002
    tags:
    - tooling
  - id: SR-12-023
    priority: MUST
    kind: project
    statement: >-
      When a diff contains no Python source, `spec-backstop` MUST report that a passing
      exit status is not coverage.
    rationale: >-
      A docs-only diff exits 0 with no signal at all, which reads as a pass.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_no_python_source_says_exit_zero_is_not_coverage`
      asserts the no-source note in the text output.
    tags:
    - tooling
  - id: SR-12-012
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST pin the diff prefixes it parses by passing `--src-prefix=a/`
      and `--dst-prefix=b/` to `git diff`.
    rationale: >-
      `diff.mnemonicPrefix` renames the prefixes, and every file then parses as
      unchanged. Measured, 6 changed files and 4 MUST groups became 0 and 0, exit 0
      against any manifest.
    verification: >-
      `test/metadata/specs/test_backstop.py` asserts git mode finds the same changes
      under `diff.mnemonicPrefix` and `diff.noprefix`.
    relationships:
    - rel_type: refines
      spec_id: SR-12-001
    tags:
    - tooling
  - id: SR-12-024
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST accept a `--paths` entry that does not exist yet.
    rationale: >-
      `--paths` names files the work will create, so a missing file cannot be a setup
      error.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_paths_accepts_a_file_that_does_not_exist_yet`
      asserts that a nonexistent `--paths` entry is analysed as an empty file.
    relationships:
    - rel_type: refines
      spec_id: SR-12-014
    tags:
    - tooling
  - id: SR-12-025
    priority: MUST
    kind: project
    statement: >-
      `spec-backstop` MUST report each changed path that it did not analyse because the
      path is outside `vultron/` and `test/`.
    rationale: >-
      A path outside both trees was dropped without a word, so its change read as
      covered.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_unanalysed_path_is_reported` asserts
      that an unanalysed path appears in the text and JSON reports.
    tags:
    - tooling
  - id: SR-12-013
    priority: MUST
    kind: project
    statement: >-
      A free-text reason after an em-dash in a manifest entry MUST run to the next `;`,
      or to a sentence-ending `.` before a fresh ID.
    rationale: >-
      The asymmetry decides the rule: over-reading a reason costs a false alarm the
      author can answer, while under-reading it silently drops the check.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_entries_after_a_reason_are_still_read`
      asserts that `;`- and sentence-separated entries after a reason are still read.
    relationships:
    - rel_type: refines
      spec_id: SR-12-006
    tags:
    - tooling
  - id: SR-12-026
    priority: MUST_NOT
    kind: project
    statement: >-
      A `,` inside such a reason MUST NOT start a new manifest entry.
    rationale: >-
      Splitting a reason on every comma read prose as a dismissal: `BT-01 — irrelevant,
      CM-02 covers it` marked CM-02 dismissed, so an unresolved MUST group for CM-02
      passed the gate.
    verification: >-
      `test/metadata/specs/test_backstop.py::test_comma_in_a_reason_does_not_dismiss_the_next_id`
      asserts that a comma inside a reason does not dismiss the ID that follows it.
    relationships:
    - rel_type: derives_from
      spec_id: SR-12-013
    tags:
    - tooling

- id: SR-13
  title: Relationship Type Semantics and Direction
  description: >-
    What each `rel_type` asserts, which end of a relationship is upstream, which end
    records it, and the spec-lint checks that keep the requirements graph free of
    loops so that "what does a change to this requirement affect?" has one answer.
  specs:
  - id: SR-13-001
    priority: MUST
    kind: process
    statement: >-
      An `implements` relationship recorded on A naming B MUST mean that A states
      the concrete mechanism by which B is met; B is the more general requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `implements` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-002
    priority: MUST
    kind: process
    statement: >-
      A `supersedes` relationship recorded on A naming B MUST mean that A replaces
      B, wholly or in a case A names, so that where A applies B no longer binds; B
      is the earlier, upstream requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `supersedes` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-003
    priority: MUST
    kind: process
    statement: >-
      An `extends` relationship recorded on A naming B MUST mean that A adds
      obligations to B without narrowing or changing what B already requires; B is
      the more general requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `extends` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-004
    priority: MUST
    kind: process
    statement: >-
      A `depends_on` relationship recorded on A naming B MUST mean that A cannot
      be met unless B is also met; B is the upstream requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `depends_on` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-005
    priority: MUST
    kind: process
    statement: >-
      A `conflicts` relationship recorded on A naming B MUST mean that A and B
      cannot both be met as written; neither end is upstream.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `conflicts` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-006
    priority: MUST
    kind: process
    statement: >-
      A `refines` relationship recorded on A naming B MUST mean that A restates B
      for a narrower case or with more precision, so that meeting A in that case
      meets B; B is the more general requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `refines` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-007
    priority: MUST
    kind: process
    statement: >-
      A `derives_from` relationship recorded on A naming B MUST mean that A states
      a consequence that follows from B without being a narrower case of B; B is
      the upstream requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `derives_from` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-008
    priority: MUST
    kind: process
    statement: >-
      A `verifies` relationship recorded on A naming B MUST mean that A states a
      check that confirms B is met; B is the upstream requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `verifies` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-009
    priority: MUST
    kind: process
    statement: >-
      A `part_of` relationship recorded on A naming B MUST mean that A is one
      component of B, which is met only when all of its parts are met; B is the
      more general requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `part_of` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-010
    priority: MUST
    kind: process
    statement: >-
      A `constrains` relationship recorded on A naming B MUST mean that A bounds
      how B may be met without B being a narrower case of A; A is the more general
      requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `constrains` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-011
    priority: MUST
    kind: process
    statement: >-
      A `satisfies` relationship recorded on A naming B MUST mean that meeting A
      is sufficient to meet B; B is the upstream requirement.
    rationale: >-
      Eleven type names with no stated meaning let two authors record one fact with
      opposite verbs, which puts loops into the graph. A definition that names the
      upstream end gives every edge one direction to point.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `satisfies` differ.
    tags:
    - documentation
    - tooling
  - id: SR-13-012
    priority: MUST
    kind: process
    statement: >-
      A relationship MUST be recorded in only one of the two requirements it links:
      in the downstream requirement for every type but `constrains` and `conflicts`,
      in the constraining requirement for `constrains`, and in either one for
      `conflicts`. Neither requirement may then name the other under any type.
    rationale: >-
      A link recorded at both ends is one fact kept twice, and the two copies drift:
      authors wrote the second copy with an opposite verb, which closed a loop. The
      links that name a requirement can be found by filtering
      `relation_graph.recorded_relationships()` on their target, so a second copy adds
      nothing.
    verification: >-
      `test/metadata/specs/test_lint.py::test_lint_fails_on_a_link_recorded_at_both_ends`
      fails when two requirements that each name the other pass spec-lint.
    tags:
    - documentation
    - tooling
  - id: SR-13-013
    priority: MUST
    kind: process
    statement: >-
      Where a requirement is a narrower case of another, the link MUST be recorded as
      `refines` on the narrower requirement, and the more general one MUST NOT record
      `constrains` naming it.
    rationale: >-
      `refines` and `constrains` are mirror images: "A refines B" and "B constrains A"
      state one fact from opposite ends. Naming one of them for that fact keeps the
      corpus from holding both. `constrains` stays for a general rule that bounds a
      requirement which is not a case of it.
    verification: >-
      `test/metadata/specs/test_relation_graph.py::test_mirror_image_double_recording_is_reported`
      fails when `A refines B` and `B constrains A` pass spec-lint together.
    relationships:
    - rel_type: refines
      spec_id: SR-13-012
    tags:
    - documentation
    - tooling
    lint_suppress:
    - compound_statement  # one fact stated from its two ends
  - id: SR-13-014
    priority: MUST
    kind: project
    statement: >-
      spec-lint MUST report as a hard error each loop in the requirements graph whose
      arcs run from each relationship's downstream end to its upstream end. A loop is a
      strongly connected component of more than one requirement, or a requirement whose
      relationships name itself.
    rationale: >-
      "What does a change to this requirement affect?" walks the graph against its
      arrows, and a loop makes every member upstream of every other. Orienting by
      upstream end, not by which end recorded the link, also catches a `constrains`
      recorded backwards, which the recorded edges alone hide.
    verification: >-
      `test/metadata/specs/test_lint.py::test_lint_fails_on_a_relationship_loop` asserts
      spec-lint exits 1 naming the loop, and
      `test/metadata/specs/test_relation_graph.py` asserts that a two-node loop, a
      three-node loop and a self-loop each produce one error, that a `constrains`
      recorded the wrong way closes a loop, and that
      `test_real_specs_have_no_relationship_loops` finds none in `specs/`.
    relationships:
    - rel_type: depends_on
      spec_id: SR-13-012
    - rel_type: refines
      spec_id: SR-04-002
    tags:
    - tooling
  - id: SR-13-020
    priority: MUST
    kind: project
    statement: >-
      Each loop error that spec-lint reports MUST name every requirement in the loop.
    rationale: >-
      An author must break the loop at one of its links. An error that names only some
      members hides the links that the author must check.
    verification: >-
      `test/metadata/specs/test_relation_graph.py` asserts that the two-node, three-node
      and self-loop errors name every member
      (`test_two_node_loop_is_reported_naming_both_members`,
      `test_three_node_loop_is_reported_naming_every_member`).
    relationships:
    - rel_type: extends
      spec_id: SR-13-014
    tags:
    - tooling
  - id: SR-13-015
    priority: MUST
    kind: project
    statement: >-
      spec-lint MUST report as a hard error each pair of requirements whose
      relationships name each other, naming both requirements and every relationship
      between them.
    rationale: >-
      A pair recorded at both ends is not always a loop: `A refines B` with
      `B constrains A` points both arcs the same way. The pair check enforces
      SR-13-012 directly.
    verification: >-
      `test/metadata/specs/test_lint.py::test_lint_fails_on_a_link_recorded_at_both_ends`
      asserts spec-lint exits 1 naming both requirements, and
      `test/metadata/specs/test_relation_graph.py::test_mirror_image_double_recording_is_reported`,
      `test_both_ends_recorded_is_reported` and `test_real_specs_record_each_link_once`
      assert the error text and that `specs/` has no such pair.
    relationships:
    - rel_type: depends_on
      spec_id: SR-13-012
    - rel_type: refines
      spec_id: SR-04-002
    tags:
    - tooling
  - id: SR-13-016
    priority: MUST
    kind: project
    statement: >-
      The `RelationType` docstring MUST list each member's definition from one table in
      `vultron/metadata/specs/schema.py` that also records each member's upstream end.
    rationale: >-
      The definitions are needed both by readers of the specs and by the code that
      orients the graph. One table keeps the two from drifting, where a second prose
      copy would not.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_type_docstring_lists_every_definition`
      fails on a docstring that misses a definition.
    relationships:
    - rel_type: depends_on
      spec_id: SR-02-004
    tags:
    - tooling
  - id: SR-13-021
    priority: MUST
    kind: project
    statement: >-
      A test MUST fail when that table and the definitions SR-13-001 through SR-13-011
      and SR-13-017 differ.
    rationale: >-
      Checking the table against the requirements keeps the code's definitions the same
      as the ones the specs state.
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails
      on a missing, extra or reworded definition, and
      `test_upstream_end_matches_the_end_sr_13_names` fails when a table entry's
      upstream end is not the end its statement names.
    relationships:
    - rel_type: extends
      spec_id: SR-13-016
    tags:
    - tooling
  - id: SR-13-017
    priority: MUST
    kind: process
    statement: >-
      A `uses_definition` relationship recorded on A naming B MUST mean that A uses
      a term or notion that B defines, so that a change to what B defines changes
      what A requires; B is the upstream requirement.
    rationale: >-
      A requirement that writes "an active participant (CM-10-004)" uses the CM-10-004
      meaning of active. Thus a change to CM-10-004 changes that requirement. No other
      type tells this. A can often be met when B is not met, so `depends_on` does not
      apply. Many requirements use a term that a different requirement defines, so the
      graph needs a type for this use (ADR-0160).
    verification: >-
      `test/metadata/specs/test_schema.py::test_relation_definitions_match_sr_13` fails when
      this statement and the `RELATION_DEFINITIONS` entry for `uses_definition` differ.
    adr:
    - ADR-0160
    tags:
    - documentation
    - tooling
  - id: SR-13-018
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      Where no relationship type's definition holds between two requirements, a
      relationship MUST NOT be recorded between them under any type.
    rationale: >-
      A link that asserts nothing true gives a false answer to the question "what does a
      change to this requirement affect?". If the link is not there, the worst result is
      a missed answer. The prose of the statement still cites the other requirement
      where a reader needs it. Usually this error is a `refines` or `depends_on` link
      between siblings or unrelated requirements, used as a loose "related to".
    adr:
    - ADR-0160
    tags:
    - documentation
