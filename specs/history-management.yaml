id: HM
title: History File Management
description: Defines the structure, location, entry format, and tooling for managing project history entries. For
  `implementation` and `idea` types whose `--source` resolves to a GitHub issue number, `append-history` posts the
  entry body as a comment on the corresponding GitHub issue rather than writing a file. `learning` and `priority`
  types continue to write per-entry write-once files under `plan/history/`, managed by the `append-history` CLI tool.
scope:

- prototype
- production
tags:
- tooling
- documentation
groups:
- id: HM-01
  title: History File Location and Structure
  specs:
  - id: HM-01-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      History entries for `learning` and `priority` types MUST reside under
      `plan/history/` as per-entry write-once files.
    rationale: >-
      Later sessions and the `learn` skill read learning and priority records, so these
      records need a fixed location that tooling can find. Each entry is one file that
      the tool never rewrites. Thus concurrent branches can each add a record without a
      merge conflict on a shared file.
  - id: HM-01-006
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: The top-level `plan/` directory MUST NOT contain any `*HISTORY.md` files.
    rationale: >-
      Orientation reads `plan/*.md` (HM-04-001). A history file at the top level of
      `plan/` would thus put the full project history into the starting context of every
      agent. History stays only under `plan/history/`, which orientation does not read.
  - id: HM-01-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Each `learning` or `priority` history entry MUST be stored as an individual write-once file at the path
      `plan/history/YYMM/<type>/<entry-id>.md`, where `YYMM` is the two-digit year and two-digit month when the entry
      was created, `<type>` is the entry type (see HM-02-002), and `<entry-id>` is the originating task or idea identifier
      (e.g., `TASK-BTND5`). When that path is already taken — one work item may produce several learnings — the entry
      MUST be written to `<entry-id>-<slug>.md`, where `<slug>` is the incoming file's `YYYYMMDD-SLUG` stem (BW-01-003).
      An existing entry file MUST NOT be overwritten in either case. `implementation` and `idea` entries whose
      `--source` resolves to a GitHub issue number use the GitHub comment output mode (HM-08) instead.
    rationale: >-
      `<entry-id>` comes from `source`, and `source` is not unique: one work item can
      produce several learnings (BW-01-009). BW-01-003 and BW-01-010 give incoming files
      distinct `YYYYMMDD-SLUG` names so that they do not collide. If the archive path
      used only `source`, the tool could not archive the second learning of a work
      item. A taken path thus needs a
      different fallback name, and the write-once rule keeps the existing record.
    relationships:
    - rel_type: depends_on
      spec_id: BW-01-003
    - rel_type: depends_on
      spec_id: BW-01-010
  - id: HM-01-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: After each `append-history` invocation, the tool MUST regenerate a local `plan/history/YYMM/README.md` index
      from entry frontmatter (see HM-03-006). This file is a **gitignored local cache** — it MUST NOT be committed to the
      repository. To view the history index, use `uv run show-history [--month YYMM | --all]`.
    rationale: >-
      Each branch that archives an entry changes the index. A committed index would thus
      cause a conflict on almost every concurrent merge. The tool derives the index
      fully from entry frontmatter, so a local regeneration can rebuild it at any time.
      Version control adds no value to it.
  - id: HM-01-005
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: Once an entry file has been merged to `main`, it MUST NOT be modified. History entries are immutable records.
      An entry MAY still be corrected while it remains unmerged on the branch that created it, because until then no record
      has been published. The `plan/history/YYMM/README.md` index may be regenerated locally but is gitignored.
    rationale: >-
      History entries are evidence of what the project did and decided, so no one may
      rewrite a published record later. Before the merge to `main`, the record is not
      published. A branch whose plan changes during review can then correct its entry.
      It does not have to choose between a wrong record and a broken rule. Immutability
      starts at the merge, so the rule gives both results.
    note: 'One-time exception: the IDEA-26043001/2/3 migration (2026-05) rewrote all existing merged entries to replace the
      legacy `date:` field with a tz-aware `timestamp:` field. That migration is the only authorised exception for entries
      already on `main`.'
  - id: HM-01-007
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      History entries for `implementation` and `idea` types whose `--source` resolves
      to a GitHub issue number MUST be posted as a comment on the corresponding GitHub
      issue (see HM-08).
    rationale: >-
      GitHub comment mode keeps implementation and idea records co-located with the
      issue they describe, avoiding file churn in plan/history/.
    relationships:
    - rel_type: refines
      spec_id: HM-01-001
  - id: HM-01-008
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      History entries for `implementation` and `idea` types whose `--source` resolves
      to a GitHub issue number MUST NOT be written as files under `plan/history/`.
    rationale: >-
      Writing these entries as files would duplicate content already posted as GitHub
      comments and pollute the plan/history/ directory with redundant records.
    relationships:
    - rel_type: refines
      spec_id: HM-01-001
- id: HM-02
  title: Entry File Format
  specs:
  - id: HM-02-001
    priority: MUST
    kind: process
    statement: 'Every history entry file MUST begin with a YAML frontmatter block containing at least the following fields:
      `title` (human-readable summary), `type` (one of the valid HistoryEntryType values), `timestamp` (tz-aware ISO 8601
      datetime string in UTC, e.g., `"2026-05-01T15:30:00+00:00"`), and `source` (the originating identifier such as an IDEA-ID
      or TASK-ID). The legacy `date` field (ISO 8601 date string) is accepted for reading pre-migration entries but MUST NOT
      be written by the tool for new entries.'
    rationale: >-
      The indexes, `show-history` and the archiver read these four fields from each
      entry. An entry without one of the fields thus breaks every reader. A tz-aware
      timestamp puts entries from contributors in different time zones in one correct
      order. A date without a time cannot do this.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that
      `HistoryEntryFrontmatter` raises `ValidationError` when any of `title`, `type`,
      `timestamp`, or `source` is absent.
  - id: HM-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Valid `type` values MUST be defined as a `StrEnum` named `HistoryEntryType` in `vultron/metadata/history/types.py`.
      Current values are `idea`, `implementation`, `learning`, and `priority`.
    rationale: >-
      Every reader and writer gets the valid entry types from one enum in one module.
      Thus the CLI, the frontmatter model and the index always agree on which types
      exist.
  - id: HM-02-005
    priority: MUST
    kind: project
    statement: Adding a new history entry type MUST only require adding a member to the `HistoryEntryType` enum; no other
      code changes are required for the tool to accept the new type.
    rationale: >-
      If the type set had copies in several places, a new type would need an edit to
      each copy. A missed copy would reject valid entries. All code derives the types
      from the enum, so the enum is the only edit.
    verification: >-
      Inspection of `vultron/metadata/history/` confirms that the tool and
      `HistoryEntryFrontmatter` derive the accepted type set exclusively from
      `HistoryEntryType` members, with no hardcoded type lists elsewhere.
    relationships:
    - rel_type: refines
      spec_id: HM-02-002
  - id: HM-02-003
    priority: MUST
    kind: process
    statement: The Markdown body following the frontmatter MUST contain the full human-readable text of the history entry
      (e.g., the archived idea text, the completed task summary, or the priority change record).
    rationale: >-
      The frontmatter only indexes an entry. The body is the record that a later reader
      needs. If the body only points to a different location, the entry loses its
      content when that location changes or goes away.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that parsing a
      well-formed entry file returns a non-empty `body` string from the Markdown content
      following the frontmatter.
  - id: HM-02-004
    priority: MUST
    kind: process
    statement: The `plan/history/YYMM/README.md` index MUST be auto-generated by the `append-history` tool (see HM-03-006)
      and MUST NOT be manually edited. Its content is derived exclusively from the frontmatter of entry files in the same
      monthly directory. The file is gitignored and serves only as a local convenience cache.
    rationale: >-
      The index is derived data. The next regeneration removes a manual edit, and until
      then the edit can show content that no entry file supports. The tool builds the
      index only from frontmatter, so the index always agrees with the entries.
    verification: >-
      Inspection of `vultron/metadata/history/cli.py` confirms the README is written by
      the tool after each `append-history` run, and the `plan/history/` README pattern is
      listed in `.gitignore`.
- id: HM-03
  title: append-history CLI Tool
  specs:
  - id: HM-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The tool MUST be invokable as `uv run append-history <type>` where `<type>` is one of the valid `HistoryEntryType`
      values (see HM-02-002).
    rationale: >-
      With one typed entry point, skills write history the same way each time, and the
      tool validates the type before it writes anything.
  - id: HM-03-009
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Passing an unrecognised `<type>` to `append-history` MUST produce a clear error message and exit non-zero.
    rationale: >-
      If the type has a typo, the tool can file the entry in the wrong place or fail
      without a reason. A clear error and a non-zero exit stop the calling skill before
      it reports success.
    relationships:
    - rel_type: refines
      spec_id: HM-03-001
  - id: HM-03-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'When no `--file` argument is given, the tool MUST read entry content from standard input (stdin). This enables
      pipeline use: `echo "..." | uv run append-history idea`.'
    rationale: >-
      Skills generate entry bodies in the shell, so reading stdin lets them pipe the
      body directly without creating a temporary file.
  - id: HM-03-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The tool MUST accept a `--file <path>` argument as an alternative to stdin. When `--file` is given, content
      is read from the specified file rather than stdin.
    rationale: >-
      Some bodies are long or are already in a file. Shell quoting into stdin can break
      such bodies. A file argument prevents this problem.
  - id: HM-03-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The tool MUST determine the target month directory using the current system
      clock (`datetime.date.today()`) during normal operation.
    rationale: >-
      The tool takes the month from the clock, so the directory always agrees with the
      time the entry is written. Thus an agent cannot file an entry under the wrong
      month, on purpose or by mistake.
  - id: HM-03-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The tool MUST create `plan/history/YYMM/` and `plan/history/YYMM/<type>/` if they do not already exist before
      writing the entry file.
    rationale: >-
      The first entry of each month and of each type goes into a directory that does not
      exist yet. The tool creates the directory, so callers do not need a separate setup
      step. A write never fails because a directory is missing.
  - id: HM-03-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: After writing a new entry file, the tool MUST regenerate `plan/history/YYMM/README.md` by scanning the known-type
      subdirectories (`idea/`, `implementation/`, `learning/`, `priority/`), reading each entry file's frontmatter, and writing
      a summary table sorted by timestamp descending.
    rationale: >-
      A table with the newest entries first gives a quick local view of the records for
      a month. The reader does not have to open each file. The tool scans only the
      known-type subdirectories, so unrelated files with different frontmatter cannot
      break the regeneration.
    note: The scan is restricted to known HistoryEntryType subdirectories to avoid parsing non-standard frontmatter in other
      subdirs (e.g. report/). The gitignore constraint is specified in HM-01-003.
  - id: HM-03-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `append-history` tool's Python module MUST reside under `vultron/metadata/history/` as a sibling of `vultron/metadata/specs/`.
    rationale: >-
      The history tool is project metadata tooling, as are the spec and notes tools.
      These tools do not depend on the protocol code. When they stay together under
      `vultron/metadata/`, that layer stays separate from the application packages.
  - id: HM-03-010
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `append-history` entry point function MUST be `vultron.metadata.history.cli:main`.
    rationale: >-
      Skills, docs and the script registration all use this entry point by name. A fixed
      function name keeps these references correct when the internal structure of the
      module changes.
    relationships:
    - rel_type: refines
      spec_id: HM-03-007
  - id: HM-03-008
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The tool MUST be registered in `pyproject.toml` under `[project.scripts]` as
      `append-history = "vultron.metadata.history.cli:main"`.
    rationale: >-
      The `[project.scripts]` registration makes `uv run append-history` work, and every
      skill uses that command.
  - id: HM-03-011
    priority: MAY
    kind: project
    statement: >-
      A backfill-only date override MAY exist for migration tooling so legacy entries
      can be written into historical `YYMM` directories.
    rationale: >-
      Entries from older history formats must go into the month that they record, not
      the month of the migration. Migration tooling thus needs a way to set the date.
    relationships:
    - rel_type: refines
      spec_id: HM-03-004
  - id: HM-03-012
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Normal skill and agent guidance MUST use the default current-date flow.
    rationale: >-
      When every agent uses the default flow, the clock sets the month directory.
      Entries from concurrent sessions then go into the correct month. If each agent
      chose the month, some entries would go into the wrong directory.
    relationships:
    - rel_type: refines
      spec_id: HM-03-004
  - id: HM-03-013
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: Normal skill and agent guidance MUST NOT require agents to choose a target month manually.
    rationale: >-
      An agent can make a mistake when it chooses a month by hand, and the tool already
      derives the month from the clock. A rule that requires the choice would bring back
      the error that the tool prevents.
    relationships:
    - rel_type: refines
      spec_id: HM-03-004
- id: HM-04
  title: Agent Context Boundaries
  specs:
  - id: HM-04-001
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: '`plan/history/` MUST NOT be included in the default "read plan context" step that agents perform at the start
      of every workflow. Agents MUST read only `plan/*.md` (excluding `plan/history/`) during their standard orientation phase.'
    rationale: >-
      `plan/history/` grows without limit. If orientation read it, the agent would use
      its context budget on finished work that the current task seldom needs.
      Orientation thus reads only current plans.
  - id: HM-04-002
    priority: SHOULD
    kind: process
    statement: Agents SHOULD read `plan/history/` only when specifically investigating historical changes, auditing completed
      work, or extracting lessons from prior implementation phases.
    rationale: >-
      History helps with audits and lessons, but it is large, so a default read uses
      much context. When agents read it only for a historical question, only the
      sessions that need it pay that cost.
  - id: HM-04-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The `orient-agent` skill documentation MUST explicitly state that its plan-context reading covers `plan/*.md`
      but NOT `plan/history/`. Agents following this skill MUST NOT recursively read `plan/history/` during orientation.
    rationale: >-
      Agents do the steps of `orient-agent` exactly as written, so the skill must state
      the history boundary. If the skill does not state it, an agent that reads all of
      `plan/` puts the full history into its context.
- id: HM-05
  title: Skill and AGENTS.md Integration
  specs:
  - id: HM-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The `build` skill MUST use `uv run append-history implementation` to write completion summaries.
    rationale: >-
      When the tool writes a completion summary, the summary gets validated frontmatter
      and goes to the configured output mode (a file or an issue comment). A summary
      written in a different way skips both, and readers cannot find it in the usual
      way.
  - id: HM-05-002
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The `plan-issue` skill MUST use `uv run append-history idea` to archive processed ideas.
    rationale: >-
      When the tool archives a processed idea, the idea gets the same validated format
      and the same known location as all other history records.
  - id: HM-05-003
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: The `learn` skill MUST NOT read `plan/*HISTORY.md` files directly. When historical context is needed, the `learn`
      skill MUST invoke `deepen-context` and let that skill mediate which plan files are relevant to load.
    rationale: >-
      Legacy history files are large, and most of their content is not related to a
      given learning batch. `deepen-context` selects what to load, so `learn` does not
      read the full history by default.
- id: HM-06
  title: Timestamp Field and Future-Date Rejection
  specs:
  - id: HM-06-001
    priority: MUST
    kind: process
    statement: Every new history entry MUST include a `timestamp` field containing a tz-aware ISO 8601 datetime string in
      UTC (e.g., `"2026-05-01T15:30:00+00:00"`).
    rationale: >-
      A tz-aware UTC timestamp puts entries from contributors in different time zones in
      the correct order. A date alone or a local time cannot do this.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that
      `HistoryEntryFrontmatter` raises `ValidationError` when the `timestamp` field is
      absent.
  - id: HM-06-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `append-history` tool MUST populate the `timestamp` field automatically from the current system clock when
      creating new entries.
    rationale: >-
      A timestamp that the caller types can be wrong. The tool takes the timestamp from
      the clock at write time, so the timestamp shows when the entry was really written.
    relationships:
    - rel_type: implements
      spec_id: HM-06-001
  - id: HM-06-002
    priority: MUST
    kind: project
    statement: '`HistoryEntryFrontmatter` MUST require a `timestamp` field (timezone-aware ISO 8601 datetime in UTC). Validation
      MUST fail with a clear error if `timestamp` is absent or malformed.'
    rationale: >-
      Readers sort and file entries by `timestamp`. They cannot place an entry with a
      missing or unparseable timestamp. Validation finds the problem when the entry is
      written.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that absent,
      naive-datetime, and malformed `timestamp` values each raise `ValidationError` with
      a descriptive error message.
  - id: HM-06-004
    priority: MUST
    kind: project
    statement: '`HistoryEntryFrontmatter` MUST reject any `timestamp` value that is more than 60 seconds in the future (relative
      to the current UTC system clock). This tolerance accounts for clock drift between the time the timestamp is computed
      and when the Pydantic model is validated.'
    rationale: >-
      A future timestamp puts the index in the wrong order and records an event that did
      not occur yet. The 60-second tolerance covers the short delay between the time the
      tool computes the timestamp and the time it validates it.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that a `timestamp`
      set 61+ seconds ahead of `datetime.now(UTC)` raises `ValidationError`, while a
      timestamp within 60 seconds is accepted.
  - id: HM-06-005
    priority: MUST
    kind: process
    statement: All `timestamp` values MUST be timezone-aware.
    rationale: >-
      A timestamp without a time zone is ambiguous, so readers cannot reliably put two
      entries from different zones in order.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that a `timestamp`
      without a UTC offset raises `ValidationError`.
  - id: HM-06-008
    priority: MUST
    kind: project
    statement: Naive datetime values (those without a UTC offset) MUST be rejected with a clear error message.
    rationale: >-
      The tool cannot convert a naive datetime to UTC unless it guesses the time zone of
      the writer. A clear error tells the writer how to correct the value.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that a naive ISO
      8601 string (e.g., `"2026-05-01T15:30:00"`) raises `ValidationError` containing a
      message identifying the timezone requirement.
    relationships:
    - rel_type: refines
      spec_id: HM-06-005
  - id: HM-06-009
    priority: MUST
    kind: project
    statement: All stored and compared timestamps MUST be normalised to UTC.
    rationale: >-
      Comparisons of timestamps with different offsets can easily go wrong. The month
      directory and the index columns both use the UTC value. When all values are in
      UTC, every comparison uses one representation.
    verification: >-
      A unit test in `test/metadata/test_history_models.py` confirms that a `timestamp`
      with a non-UTC offset is normalised to UTC, and that sorting entries by `timestamp`
      produces correct chronological order.
    relationships:
    - rel_type: refines
      spec_id: HM-06-005
  - id: HM-06-006
    priority: MUST
    kind: project
    statement: The `plan/history/YYMM/README.md` index MUST display both a `Date` column (YYYY-MM-DD extracted from `timestamp`)
      and a `Time (UTC)` column (HH:MM extracted from `timestamp`). Entries MUST be sorted by `timestamp` in descending order.
    rationale: >-
      Agents often write several entries on one day, so the date alone cannot show their
      order. A UTC time column and a newest-first sort show the most recent work first,
      in the sequence it occurred.
    verification: >-
      A unit test in `test/metadata/test_append_history.py` confirms that the generated
      `README.md` contains `Date` and `Time (UTC)` column headers and that entries are
      sorted newest-first by `timestamp`.
- id: HM-07
  title: CLI Interface for Frontmatter Construction
  specs:
  - id: HM-07-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `append-history <type>` command MUST accept `--title` and `--source` as required named arguments.
    rationale: >-
      The title and the source make an entry easy to find. Because they are required
      named arguments, the tool writes no entry without them.
  - id: HM-07-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The tool MUST construct the YAML frontmatter block internally from the `--title`, `--source`, and auto-generated
      `timestamp` arguments; callers MUST NOT supply frontmatter content.
    rationale: >-
      When callers write frontmatter by hand, its format becomes different from the
      model, and the entries fail validation later. The tool builds the frontmatter from
      validated arguments, so the frontmatter of each entry is correct by construction.
    relationships:
    - rel_type: refines
      spec_id: HM-07-001
  - id: HM-07-002
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Callers of `append-history` MUST NOT include a YAML frontmatter block in the content they supply via stdin
      or `--file`.
    rationale: >-
      If a caller supplies a frontmatter block, the body gets a second block, or the
      block conflicts with the block that the tool builds. When callers supply only body
      text, the tool is the only author of frontmatter.
    relationships:
    - rel_type: refines
      spec_id: HM-07-005
  - id: HM-07-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The tool MUST accept a hidden `--timestamp` argument for backfill use only (e.g., migrating pre-existing entries).
    rationale: >-
      A migration of pre-existing entries must keep their original times, and the clock
      cannot supply these times. The argument is hidden, so it is not part of the normal
      interface that skills use.
  - id: HM-07-006
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `--timestamp` override argument MUST accept an ISO 8601 datetime string with a UTC offset.
    rationale: >-
      The override must give the same tz-aware value as the clock path. Thus it accepts
      only an ISO 8601 string with a UTC offset.
    relationships:
    - rel_type: refines
      spec_id: HM-07-003
  - id: HM-07-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The standard future-date validation (HM-06-004) MUST apply to values supplied via the `--timestamp` override
      argument.
    rationale: >-
      The override sets the time. It does not skip validation. The same future-date
      check applies, so backfilled entries obey the same rules as all other entries.
    relationships:
    - rel_type: refines
      spec_id: HM-07-003
    - rel_type: implements
      spec_id: HM-06-004
  - id: HM-07-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Skill documentation (`plan-issue`, `build`, `learn`) and `notes/history-management.md` MUST use the `--title`/`--source`
      interface for `append-history`. The frontmatter-in-stdin pattern MUST NOT be used.
    rationale: >-
      Agents copy the command that skills and notes show. If the documentation shows the
      frontmatter-in-stdin pattern, agents learn a form that the tool rejects.
- id: HM-08
  title: GitHub Comment Output Mode
  specs:
  - id: HM-08-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: When `append-history` is invoked with type `implementation` or `idea` and `--source` is a value that resolves
      to a GitHub issue number (i.e., the string `ISSUE-N` for any positive integer N, or a bare positive integer), the tool
      MUST post the entry body as a comment on issue N in the CERTCC/Vultron repository using `gh issue comment`, rather than
      writing a file under `plan/history/`.
    rationale: >-
      An implementation or idea record for an issue is most useful on that issue, where
      all readers of the issue find it. The tool posts the record there, so the record
      stays with its work item. The project then does not commit a file for each
      completed task.
  - id: HM-08-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: When `append-history` falls through to GitHub comment mode (HM-08-001), it MUST print the URL of the newly
      created comment to stdout so callers can record it.
    rationale: >-
      The comment URL is the only reference to the record. Callers such as
      `archive-history` need it to link the record from the work that they report.
  - id: HM-08-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: When `append-history` is invoked with type `implementation` or `idea` and `--source` does NOT resolve to a
      GitHub issue number (e.g., source is `IDEA-26042702`, `TASK-BTND5`, or any other non-numeric format), the tool MUST
      fall back to writing a file under `plan/history/` as in the pre-HM-08 behaviour.
    rationale: >-
      Not every source identifies an issue, and an entry with no issue for a comment
      still needs a record. A file under `plan/history/` gives it a record, in the
      archive that the other entry types already use.
  - id: HM-08-004
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: The `archive-history` skill MUST NOT call `git add plan/history/` or commit any file when the entry was posted
      as a GitHub comment (HM-08-001). The `git add` and commit steps are only needed for file-mode entries.
    rationale: >-
      In comment mode the tool writes no file. A `git add` and a commit would thus fail,
      or they would commit unrelated staged changes.
  - id: HM-08-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The comment body posted to GitHub MUST contain the full entry body text (same content that would have been
      the Markdown body in the file-based format), prefixed with a one-line heading showing the entry type and title.
    rationale: >-
      In comment mode the comment is the full record, so it must contain the same
      content as a file entry. The heading shows the entry type and title, so a reader
      can identify the entry among the other comments on the issue.
  - id: HM-08-006
    priority: SHOULD
    kind: project
    statement: The `archive-history` skill documentation SHOULD be updated to reflect that when `append-history` outputs a
      GitHub comment URL (rather than a file path), the commit/push steps are skipped for that entry.

    rationale: >-
      Callers of `archive-history` do the steps that its documentation gives. Without
      this guidance, they would try to stage and push a file that comment mode did not
      write.
