id: SDO
title: Status Dimension Objects
description: Normative requirements for per-machine dimension objects decomposed from CaseStatus and ParticipantStatus. Each
  independent state machine (EM, PXA, RM, VFD, PEC) is represented by a lightweight Pydantic BaseModel that holds its state
  enum and owns immutable transition() validation and guard methods.
version: 0.1.0
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: SDO-01
  title: Dimension Object Base Contract
  specs:
  - id: SDO-01-001
    priority: MUST
    kind: project
    statement: Each status dimension (EM, PXA, RM, VFD, PEC) MUST be implemented as a lightweight Pydantic BaseModel subclass
      (not a CoreObject subclass) that holds exactly one state enum field and owns the transition validation and guard methods
      for that machine.
    rationale: Dimension objects are embedded value objects; they have no independent identity and do not require CORE_VOCABULARY
      registration or AS2 id_. See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-01-002
    priority: MUST_NOT
    kind: protocol
    statement: Dimension objects MUST NOT be registered in CORE_VOCABULARY or given an id_ field.
    rationale: They are always embedded in CaseStatus or ParticipantStatus, which already carries identity. Independent registration
      would create unnecessary schema complexity. See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-01-003
    priority: MUST
    kind: project
    statement: 'The five dimension objects MUST be named: EmDimension (EM state), PxaDimension (CS_pxa state), RmDimension
      (RM state), VfdDimension (CS_vfd state), and PecDimension (PEC state).'
    rationale: The "Dimension" suffix avoids collision with existing VfdState and PxaState NamedTuples in vultron/core/states/cs.py.
      See ADR-0036.
    adr:
    - ADR-0036
- id: SDO-02
  title: transition() Contract
  specs:
  - id: SDO-02-001
    priority: MUST
    kind: protocol
    statement: Each dimension object MUST implement a transition(trigger) method that validates the trigger against the current
      state, applies the state machine rules, and returns a NEW dimension object with the updated state.
    rationale: Immutable transitions are consistent with Pydantic's design philosophy and with the append-only status history
      model. Callers replace the embedded field rather than mutating the existing object. See ADR-0036.
    verification: Unit tests confirm that calling `transition(trigger)` on each dimension object returns a new instance
      with the updated state without mutating the original object.
    adr:
    - ADR-0036
    stories:
    - story_2022_088
  - id: SDO-02-002
    priority: MUST
    kind: protocol
    statement: A dimension object's transition() MUST raise a descriptive exception (VultronInvalidStateTransitionError or
      a subclass) when the trigger is not valid for the current state.
    rationale: Fail-fast at the boundary; never return None or silently no-op on an invalid transition. See ADR-0032 and ARCH-15-001.
    verification: Unit tests confirm that `transition(invalid_trigger)` raises `VultronInvalidStateTransitionError` for
      each dimension object when the trigger is not valid for the current state.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-15-001
    adr:
    - ADR-0032
    stories:
    - story_2022_088
  - id: SDO-02-003
    priority: MUST_NOT
    kind: protocol
    statement: transition() MUST NOT mutate self. The caller MUST use the returned dimension object as the updated state.
    rationale: Mutation of embedded Pydantic models is fragile and inconsistent with the append-only history model. See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-02-004
    priority: MUST
    kind: protocol
    statement: >-
      Dimension objects MUST reject construction with an invalid
      (current_state → target_state) transition at construction time, regardless of
      call site. A same-state write (target == current) is always permitted; a None
      target (preserve current) requires no validation.
    rationale: >-
      Constructing a dimension object by target state bypasses the transition()
      validation contract established in SDO-02-001/SDO-02-002. BT write nodes
      that build snapshots this way must apply the same validity check themselves.
      See issue #1896 and BTND-10-001.
    verification: Unit tests confirm that constructing a dimension object with an invalid target state raises
      `VultronInvalidStateTransitionError`, while a same-state write succeeds without error.
    relationships:
    - rel_type: refines
      spec_id: SDO-02-002
      note: Extends the transition() contract to direct-construction call sites
    - rel_type: refines
      spec_id: BTND-10-001
    stories:
    - story_2022_088
  - id: SDO-02-005
    priority: MUST
    kind: project
    statement: >-
      The SDO-02-004 transition-rejection invariant MUST be enforced via Pydantic
      field or model validators so that validation occurs at model construction time,
      not via caller-side pre-checks.
    relationships:
    - rel_type: implements
      spec_id: SDO-02-004
- id: SDO-03
  title: CaseStatus and ParticipantStatus Field Shape
  specs:
  - id: SDO-03-001
    priority: MUST
    kind: protocol
    statement: 'CaseStatus MUST replace its flat enum fields (em_state: EM, pxa_state: CS_pxa) with embedded dimension object
      fields: em: EmDimension and pxa: PxaDimension.'
    rationale: Flat enum fields provide no transition validation or guard methods. Dimension objects make illegal transitions
      unrepresentable. See ADR-0036.
    verification: 'Inspection of `vultron/core/models/` confirms `CaseStatus` declares `em: EmDimension` and `pxa:
      PxaDimension` fields with no residual flat `em_state` or `pxa_state` fields.'
    adr:
    - ADR-0036
    stories:
    - story_2022_088
    - story_2022_062
  - id: SDO-03-002
    priority: MUST
    kind: protocol
    statement: 'ParticipantStatus MUST replace its flat enum fields (rm_state: RM, vfd_state: CS_vfd, em_consent_state: PEC
      | None) with embedded dimension object fields: rm: RmDimension, vfd: VfdDimension, and consent: PecDimension | None.'
    rationale: Same rationale as SDO-03-001. See ADR-0036.
    verification: 'Inspection of `vultron/core/models/` confirms `ParticipantStatus` declares `rm: RmDimension`, `vfd:
      VfdDimension`, and `consent: PecDimension | None` with no residual flat enum fields.'
    adr:
    - ADR-0036
    stories:
    - story_2022_088
    - story_2022_107
  - id: SDO-03-003
    priority: MUST_NOT
    kind: protocol
    statement: The old flat enum fields (em_state, pxa_state, rm_state, vfd_state, em_consent_state) MUST NOT be retained
      as aliases or shim properties after the migration is complete.
    rationale: Keeping both representations creates an extended half-migrated state and perpetuates the flat-enum problem.
      See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-03-004
    priority: MUST
    kind: project
    statement: 'CaseStatus and ParticipantStatus MUST remain round-trippable through the DataLayer after the dimension-object
      migration: a persisted record MUST rehydrate correctly to the new dimension-object shape.'
    rationale: DataLayer round-trip compatibility is a binding design constraint per LST-05-003 and ADR-0033. The dimension
      fields serialize as nested dicts that rehydrate via Pydantic model_validate. See ADR-0036.
    relationships:
    - rel_type: depends_on
      spec_id: LST-05-003
    adr:
    - ADR-0033
    - ADR-0036
  - id: SDO-03-005
    priority: MUST
    kind: project
    statement: Because unknown keys are ignored by default in Pydantic v2, removing a flat-field migration shim from `CaseStatus`
      or `ParticipantStatus` MUST NOT leave a retired flat key (`rm_state`/`rmState`, `vfd_state`/`vfdState`, `em_consent_state`/`emConsentState`,
      `em_state`/`emState`, `pxa_state`/`pxaState`) silently discardable. The guarantee MUST be the `extra="forbid"` model
      configuration that ARCH-12-003 requires of every core-branch type, not a per-class `model_validator(mode="before")`
      reject-guard; such a guard MUST NOT be added or retained for this purpose.
    rationale: 'With `extra="ignore"`, a flat `rm_state` key would be silently discarded and `rm.state` would default to `RM.START`
      — a whole RM ladder lost with no error, which is the defect class of issue #2232 and a violation of ARCH-15-001/ARCH-15-002.
      `extra="forbid"` is strictly stronger than a reject-guard enumerating the known flat keys: it also catches typos and
      stale keys from an older schema, needs no per-class maintenance, and covers every registered core type rather than the
      two named here. Because Pydantic itself raises, the failure surfaces as a pydantic `ValidationError` rather than
      `VultronValidationError`, and no wire→core recovery is attempted (ADR-0081 supersedes the ADR-0062 backstop).'
    verification: '`ParticipantStatus.model_validate({"rm_state": "RECEIVED"})` and the camelCase equivalent both raise pydantic
      `ValidationError`; neither yields a model whose `rm.state` is `RM.START`. No `CaseStatus` or `ParticipantStatus` class
      declares a `model_validator(mode="before")` reject-guard for those keys.'
    relationships:
    - rel_type: depends_on
      spec_id: SDO-03-003
      note: SDO-03-003 requires the shims to go; this requirement constrains how they are removed safely.
    - rel_type: depends_on
      spec_id: ARCH-12-003
      note: ARCH-12-003 supplies the `extra="forbid"` configuration that replaces the per-class reject-guard.
    - rel_type: refines
      spec_id: ARCH-15-002
    adr:
    - ADR-0062
    - ADR-0063
    - ADR-0081
- id: SDO-04
  title: Wire Projection and Migration Scope
  specs:
  - id: SDO-04-001
    priority: MUST
    kind: protocol
    statement: The wire-layer shapes as_CaseStatus and as_ParticipantStatus, and the adapter-side translators that pair them
      with their core counterparts, MUST be updated in the same implementation as the core model changes so that translation
      in both directions correctly handles the dimension-object field shape.
    rationale: Deferring wire changes creates an extended period of core/wire divergence requiring shim adapters. Both layers
      are in scope per ADR-0036, and per ADR-0081 the translation itself is a third artifact on the adapter side that must
      move with them.
    verification: Inspection confirms the adapter-side `CaseStatus` and `ParticipantStatus` translators project the dimension-object
      field shape in both directions without accessing flat enum fields.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-12-005
      note: ARCH-12-005 locates the translation on the adapter side rather than as methods on the wire classes.
    adr:
    - ADR-0036
    - ADR-0081
    stories:
    - story_2022_062
    - story_2022_088
  - id: SDO-04-002
    priority: MUST
    kind: project
    statement: All call sites in vultron/ and test/ (excluding vultron/bt/) that access the old flat enum fields (em_state,
      pxa_state, rm_state, vfd_state, em_consent_state) MUST be migrated to use the new dimension object accessors (e.g. .em.state,
      .rm.state) in the same implementation.
    rationale: A partial migration leaves the codebase in an incoherent state with two representations active simultaneously.
      See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-04-003
    priority: MUST_NOT
    kind: project
    statement: The vultron/bt/ legacy simulation layer MUST NOT be migrated to dimension objects as part of this implementation.
    rationale: vultron/bt/ uses the custom BT engine and is not part of the active prototype. It accesses RM/EM/PEC state
      enums directly and is explicitly excluded from prototype handler work per codebase conventions. See notes/codebase-structure.md.
