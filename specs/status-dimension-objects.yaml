id: SDO
title: Status Dimension Objects
description: Normative requirements for per-machine dimension objects decomposed from CaseStatus and ParticipantStatus. Each
  independent state machine (EM, PXA, RM, VF, D) is represented by a lightweight Pydantic BaseModel that holds its state
  enum and owns immutable transition() validation and guard methods.
scope:
- prototype
- production
tags:
- protocol
- state-machine
groups:
- id: SDO-01
  title: Dimension Object Base Contract
  specs:
  - id: SDO-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Each status dimension (EM, PXA, RM, VF, D) MUST be implemented as a lightweight Pydantic BaseModel subclass
      (not a CoreObject subclass) that holds exactly one state enum field and, except EM, owns the transition validation and
      guard methods for that machine. EM has no transitions of its own, and `EmDimension` holds the copy of the EM state that the
      case derives from its embargo register (ADR-0122).
    rationale: Dimension objects are embedded value objects; they have no independent identity and do not require CORE_VOCABULARY
      registration or AS2 id_. See ADR-0036.
    adr:
    - ADR-0036
    - ADR-0075
    - ADR-0122
  - id: SDO-01-002
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms no dimension object class is registered in `CORE_VOCABULARY`
      or declares an `id_` field.
    statement: Dimension objects MUST NOT be registered in CORE_VOCABULARY or given an id_ field.
    rationale: They are always embedded in CaseStatus or ParticipantStatus, which already carries identity. Independent registration
      would create unnecessary schema complexity. See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'The dimension objects MUST be named: EmDimension (EM state), PxaDimension (CS_pxa state), RmDimension
      (RM state), VfDimension (CS_vf state, the vendor path) and DDimension (CS_d state, the deployer path). Participant
      embargo consent is not a status dimension: it is a per-embargo row set on the participant (CM-18-001, ADR-0122).'
    rationale: The "Dimension" suffix avoids collision with the existing VfState, DState and PxaState NamedTuples in
      vultron/core/states/cs.py. ADR-0075 split the former vendor-fix-deployed machine into the VF and D machines, so
      each has its own dimension object. See ADR-0036.
    adr:
    - ADR-0036
    - ADR-0075
  - id: SDO-01-004
    priority: MUST
    kind: project
    statement: >-
      A dimension object MUST serialize to its bare state value, not to a one-key
      `{"state": ...}` mapping.
    rationale: >-
      A dimension holds one data field, `state`; the rest is behaviour, and behaviour
      does not serialize. The mapping form would put a container on the wire whose
      only content is the thing it contains. This is what lets the core class emit the
      payload the wire class emitted, so the wire form is unchanged.
    note: >-
      The enclosing model carries the wire spelling as a field alias — `rm` with
      `serialization_alias="rmState"` — so the serialized result is
      `{"rmState": "START"}`.
    verification: >-
      `RmDimension().model_dump(mode="json") == "START"`, and core
      `ParticipantStatus` serializes to the same AS2 payload as `as_ParticipantStatus`.
      Covered by `test/core/models/test_dimension_bare_serialization.py`.
    relationships:
    - rel_type: refines
      spec_id: SDO-01-001
    - rel_type: refines
      spec_id: ARCH-25-005
    adr:
    - ADR-0036
    - ADR-0099
  - id: SDO-01-005
    priority: MUST
    kind: project
    statement: >-
      A dimension object MUST accept on input both its bare state value and a one-key
      `{"state": ...}` mapping.
    rationale: >-
      Accepting both forms keeps callers that construct `{"state": ...}` working, and
      it keeps rows stored in either form readable.
    verification: >-
      `RmDimension.model_validate("ACCEPTED")` and
      `RmDimension.model_validate({"state": "ACCEPTED"})` both succeed. Covered by
      `test/core/models/test_dimension_bare_serialization.py`.
    relationships:
    - rel_type: extends
      spec_id: SDO-01-004
    adr:
    - ADR-0036
    - ADR-0099
- id: SDO-02
  title: transition() Contract
  specs:
  - id: SDO-02-001
    priority: MUST
    kind: project
    statement: Each dimension object except `EmDimension` MUST implement a transition(trigger) method that validates the trigger
      against the current state, applies the state machine rules, and returns a NEW dimension object with the updated state.
      `EmDimension` has none, because EM changes only by an embargo register step (ADR-0122).
    rationale: Immutable transitions are consistent with Pydantic's design philosophy and with the append-only status history
      model. Callers replace the embedded field rather than mutating the existing object. See ADR-0036.
    verification: Unit tests confirm that calling `transition(trigger)` on each dimension object returns a new instance
      with the updated state without mutating the original object.
    adr:
    - ADR-0036
    stories:
    - story_2022_088
  - id: SDO-02-002
    priority: MUST
    kind: project
    statement: A dimension object's transition() MUST raise a descriptive exception (VultronInvalidStateTransitionError or
      a subclass) when the trigger is not valid for the current state.
    rationale: Fail-fast at the boundary; never return None or silently no-op on an invalid transition. See ADR-0032 and ARCH-15-001.
    verification: Unit tests confirm that `transition(invalid_trigger)` raises `VultronInvalidStateTransitionError` for
      each dimension object when the trigger is not valid for the current state.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-15-001
    adr:
    - ADR-0032
    stories:
    - story_2022_088
  - id: SDO-02-003
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms each dimension object's `transition()` returns a new instance
      and leaves `self` unchanged.
    statement: >-
      A dimension object's `transition()` MUST NOT mutate `self`.
    rationale: Mutation of embedded Pydantic models is fragile and inconsistent with the append-only history model. See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-02-006
    priority: MUST
    kind: project
    statement: >-
      A caller of a dimension object's `transition()` MUST use the returned dimension
      object as the updated state.
    rationale: >-
      `transition()` leaves the original unchanged (SDO-02-003), so a caller that
      keeps the original object keeps the old state and loses the step.
    verification: >-
      Inspection confirms each caller of a dimension object's `transition()` in
      `vultron/` and `test/core/models/test_dimensions.py` uses the returned instance.
    adr:
    - ADR-0036
  - id: SDO-02-004
    priority: MUST
    kind: project
    statement: >-
      Dimension objects MUST reject construction with an invalid
      (current_state → target_state) transition at construction time, regardless of
      call site. A same-state write (target == current) is always permitted; a None
      target (preserve current) requires no validation.
    rationale: >-
      Constructing a dimension object by target state bypasses the transition()
      validation contract established in SDO-02-001/SDO-02-002, so without a check at
      construction any call site that builds a snapshot this way, BT write nodes among
      them (BTND-10-001), can record a step the state machine forbids. A same-state
      write changes nothing, so it needs no check.
    verification: Unit tests confirm that constructing a dimension object with an invalid target state raises
      `VultronInvalidStateTransitionError`, while a same-state write succeeds without error.
    relationships:
    - rel_type: refines
      spec_id: SDO-02-002
      note: Extends the transition() contract to direct-construction call sites
    - rel_type: refines
      spec_id: BTND-10-001
    stories:
    - story_2022_088
  - id: SDO-02-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The SDO-02-004 transition-rejection invariant MUST be enforced via Pydantic
      field or model validators so that validation occurs at model construction time,
      not via caller-side pre-checks.
    rationale: >-
      A caller-side pre-check protects only the call sites that remember to make it. A
      validator on the model runs on every construction, including call sites added
      later, so no path can build a dimension object at an illegal target state.
    relationships:
    - rel_type: implements
      spec_id: SDO-02-004
- id: SDO-03
  title: CaseStatus and ParticipantStatus Field Shape
  specs:
  - id: SDO-03-001
    priority: MUST
    kind: project
    statement: 'CaseStatus MUST replace its flat enum fields (em_state: EM, pxa_state: CS_pxa) with embedded dimension object
      fields: em: EmDimension and pxa: PxaDimension.'
    rationale: Flat enum fields provide no transition validation or guard methods. Dimension objects make illegal transitions
      unrepresentable. See ADR-0036.
    verification: 'Inspection of `vultron/core/models/` confirms `CaseStatus` declares `em: EmDimension` and `pxa:
      PxaDimension` fields with no residual flat `em_state` or `pxa_state` fields.'
    adr:
    - ADR-0036
    stories:
    - story_2022_088
    - story_2022_062
  - id: SDO-03-002
    priority: MUST
    kind: project
    statement: 'ParticipantStatus MUST carry its participant-level state as embedded dimension object fields, not flat
      enum fields: an always-present rm: RmDimension, an optional vf: VfDimension (present for a VENDOR participant) and an
      optional d: DDimension (present for a DEPLOYER participant); a participant with both roles carries both. It carries
      no embargo consent (CM-18-001, ADR-0122).'
    rationale: Same rationale as SDO-03-001. VF and D are separate machines (ADR-0075), and each applies only to the
      role that owns it, so each is optional. See ADR-0036.
    verification: 'Inspection of `vultron/core/models/` confirms `ParticipantStatus` declares `rm: RmDimension`, `vf:
      VfDimension | None` and `d: DDimension | None`, with no residual flat enum fields and no consent field.'
    adr:
    - ADR-0036
    - ADR-0075
    stories:
    - story_2022_088
    - story_2022_107
  - id: SDO-03-003
    priority: MUST_NOT
    kind: project
    statement: The old flat enum fields (em_state, pxa_state, rm_state, vfd_state, em_consent_state) MUST NOT be retained
      as aliases or shim properties after the migration is complete.
    verification: '`TestCaseStatusCarriesNoFlatShim` in `test/core/models/test_dimensions.py` asserts that `CaseStatus`
      defines no `em_state` or `pxa_state` property or field and refuses either key on input through `extra="forbid"`;
      `test_flat_case_status_spelling_is_a_near_miss_of_its_wire_spelling` and `test_retired_name_on_inline_object_is_refused`
      in `test/wire/as2/test_unknown_key_disposition.py` pin the parse-edge refusal of the flat CaseStatus spellings and
      of `vfd_state`. `TestParticipantStatusCarriesNoFlatShim` in
      `test/core/models/test_participant_status_shape.py`
      and `test_flat_participant_status_spelling_is_a_near_miss_of_its_wire_spelling`
      pin the same for the
      `ParticipantStatus` spellings `rm_state`, `vf_state` and `d_state` (#4377).'
    rationale: Keeping both representations creates an extended half-migrated state and perpetuates the flat-enum problem.
      See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-03-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      After the dimension-object migration, a `CaseStatus` or `ParticipantStatus`
      MUST round-trip through the DataLayer.
    rationale: >-
      DataLayer round-trip compatibility is a binding design constraint per LST-05-003
      and ADR-0033. A dimension field serializes as its bare state value and rehydrates
      via Pydantic model_validate (SDO-01-004, ADR-0099). See ADR-0036.
    relationships:
    - rel_type: depends_on
      spec_id: LST-05-003
    adr:
    - ADR-0033
    - ADR-0036
  - id: SDO-03-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The DataLayer MUST rehydrate a persisted `CaseStatus` or `ParticipantStatus`
      record to the dimension-object shape.
    rationale: >-
      A record stored before the migration must still read back as the new shape.
      Input accepts both the bare value and the one-key mapping (SDO-01-005), so a
      stored row in either shape rehydrates.
    relationships:
    - rel_type: extends
      spec_id: SDO-03-004
    adr:
    - ADR-0033
    - ADR-0036
  - id: SDO-03-005
    priority: MUST
    kind: project
    statement: >-
      When this codebase removes a flat-field migration shim from `CaseStatus` or
      `ParticipantStatus`, it MUST NOT leave a retired flat key silently discardable.
      The retired flat keys are `rm_state`, `vf_state`, `d_state`,
      `vfd_state`/`vfdState`, `em_consent_state`/`emConsentState`, `em_state` and
      `pxa_state`.
    rationale: >-
      Pydantic v2 ignores unknown keys by default. With `extra="ignore"`, a flat
      `rm_state` key would be silently discarded and `rm.state` would default to
      `RM.START` — a whole RM ladder lost with no error, which is the defect class of
      issue #2232 and a violation of ARCH-15-001/ARCH-15-002.
    note: >-
      The camelCase `rmState`, `vfState`, `dState`, `emState` and `pxaState` are the
      wire aliases of the dimension fields (SDO-01), not retired keys.
    verification: >-
      `TestParticipantStatusCarriesNoFlatShim` in
      `test/core/models/test_participant_status_shape.py` asserts that
      `ParticipantStatus.model_validate` with `rm_state`, `vf_state` or `d_state`
      raises a pydantic `ValidationError` (`extra_forbidden`) rather than yielding a
      default state, and that the wire spellings `rmState`, `vfState` and `dState` are
      read into the dimension. `TestCaseStatusCarriesNoFlatShim` in
      `test/core/models/test_dimensions.py` pins the same for `em_state` and
      `pxa_state`.
    relationships:
    - rel_type: depends_on
      spec_id: SDO-03-003
      note: SDO-03-003 requires the shims to go; this requirement constrains how they are removed safely.
    - rel_type: refines
      spec_id: ARCH-15-002
    adr:
    - ADR-0062
    - ADR-0063
    - ADR-0082
    - ADR-0099
  - id: SDO-03-008
    priority: MUST
    kind: project
    statement: >-
      `CaseStatus` and `ParticipantStatus` MUST refuse a retired flat key through the
      `extra="forbid"` model configuration that ARCH-12-003 requires of every
      core-branch type.
    rationale: >-
      `extra="forbid"` is strictly stronger than a reject-guard that enumerates the
      known flat keys. It also catches typos and stale keys from an older schema,
      needs no per-class maintenance, and covers every registered core type rather
      than the two named here. Because Pydantic itself raises, the failure surfaces as
      a pydantic `ValidationError` rather than `VultronValidationError`.
    verification: >-
      `TestParticipantStatusCarriesNoFlatShim` in
      `test/core/models/test_participant_status_shape.py` asserts that a retired flat
      key raises a pydantic `ValidationError` with the `extra_forbidden` type, and
      `TestCaseStatusCarriesNoFlatShim` in `test/core/models/test_dimensions.py` pins
      the same for `CaseStatus`.
    relationships:
    - rel_type: implements
      spec_id: SDO-03-005
    - rel_type: depends_on
      spec_id: ARCH-12-003
      note: ARCH-12-003 supplies the `extra="forbid"` configuration that replaces the per-class reject-guard.
    adr:
    - ADR-0099
  - id: SDO-03-009
    priority: MUST_NOT
    kind: project
    statement: >-
      This codebase MUST NOT add or keep a per-class `model_validator(mode="before")`
      reject-guard on `CaseStatus` or `ParticipantStatus` to refuse a retired flat
      key.
    rationale: >-
      `extra="forbid"` already refuses the key (SDO-03-008), so a reject-guard only
      duplicates it and needs upkeep for each key. No wire→core recovery is attempted:
      there is no backstop (ADR-0082), and `extra="forbid"` is the guard (ADR-0099).
    verification: >-
      `TestParticipantStatusCarriesNoFlatShim` in
      `test_no_reject_guard_validator` in
      `test/core/models/test_participant_status_shape.py` and in
      `test/core/models/test_dimensions.py` asserts that `ParticipantStatus` and
      `CaseStatus` declare no reject-guard before-validator.
    relationships:
    - rel_type: extends
      spec_id: SDO-03-008
    adr:
    - ADR-0082
    - ADR-0099
  - id: SDO-03-006
    priority: MUST
    kind: project
    statement: >-
      A `CaseStatus`'s EM copy MUST be immutable once the status is constructed.
    note: >-
      A status with a different EM is built by construction or by the copy
      `CaseStatus.with_em` makes, never by mutation; the owning `VulnerabilityCase`
      stamps its current status that way from its embargo register. The copy's label is
      derived again from its states, so it never names the EM it replaced (#5124).
    rationale: EM is derived from the case's embargo register (ADR-0122); the status holds only a stamped copy. An in-place
      write makes the copy disagree with the register, and EMB-18-001 forbade it with no enforcement. Freezing fails every
      write path at runtime, including dynamic ones a source ratchet would miss, while the case's copy-based stamp still
      works. EmDimension has no transitions, so freezing removes no behavior (#4321).
    verification: Unit tests show that `status.em = EmDimension(...)` and `status.em.state = EM.X` each raise pydantic
      `ValidationError`, that `CaseStatus` defines no `em_state` attribute so `status.em_state = EM.X` raises pydantic `ValidationError`,
      and that a case whose register changes still stamps the derived EM onto its current status.
    relationships:
    - rel_type: refines
      spec_id: EMB-18-001
      note: EMB-18-001 forbids assigning `case.current_status.em`; this requirement makes the assignment impossible.
    - rel_type: depends_on
      spec_id: SDO-03-001
    adr:
    - ADR-0122
  - id: SDO-03-010
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST make `EmDimension` a frozen model and `CaseStatus.em` a frozen
      field. Then assigning `status.em`, `status.em.state` or any flat EM spelling
      raises.
    rationale: >-
      Freezing fails every write path at runtime, including dynamic ones a source
      ratchet would miss. `EmDimension` has no transitions, so freezing removes no
      behavior (#4321).
    verification: >-
      `test/core/models/test_dimensions.py` shows that `status.em = EmDimension(...)`,
      `status.em.state = EM.X` and a flat EM assignment such as
      `status.em_state = EM.X` each raise pydantic `ValidationError`.
    relationships:
    - rel_type: implements
      spec_id: SDO-03-006
    adr:
    - ADR-0122
- id: SDO-04
  title: Wire Projection and Migration Scope
  specs:
  - id: SDO-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All call sites in vultron/ and test/ (excluding vultron/bt/) that access the old flat enum fields (em_state,
      pxa_state, rm_state, vfd_state, em_consent_state) MUST be migrated to use the new dimension object accessors (e.g. .em.state,
      .rm.state) in the same implementation.
    rationale: A partial migration leaves the codebase in an incoherent state with two representations active simultaneously.
      See ADR-0036.
    adr:
    - ADR-0036
  - id: SDO-04-003
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: The vultron/bt/ legacy simulation layer MUST NOT be migrated to dimension objects as part of this implementation.
    rationale: vultron/bt/ uses the custom BT engine and is not part of the active prototype. It accesses RM/EM/PEC state
      enums directly and is explicitly excluded from prototype handler work per codebase conventions. See notes/codebase-structure.md.
