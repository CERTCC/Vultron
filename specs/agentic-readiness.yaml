id: AR
title: Agentic Readiness
description: Requirements for API and CLI design that enable reliable interaction by automated agents and AI systems. Covers
  machine-parseable interfaces, structured response formats, and observable behavior that supports agentic workflows.
scope:
- prototype
- production
tags:
- tooling
groups:
- id: AR-01
  title: API Discoverability
  specs:
  - id: AR-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The API MUST expose a machine-readable OpenAPI JSON schema at `/openapi.json`
    rationale: >-
      An agent or a client generator reads the OpenAPI schema to learn the endpoints,
      their parameters and their response types. Without a machine-readable schema,
      each client must be written by hand from prose, and it goes out of date when the
      server changes. FastAPI builds the schema from the route declarations, so the
      schema follows the code.
  - id: AR-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The API MUST expose rendered documentation UI at `/docs` and `/redoc` in development environments
    rationale: >-
      A rendered page lets a developer read the endpoints and try a request in a
      browser, with no client to write. Limiting the requirement to development
      environments lets a production deployment turn the pages off.
  - id: AR-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Every endpoint MUST have a unique, stable `operationId` following the `{resource}_{action}` naming convention
    rationale: >-
      A client generator names each client method after the `operationId`, and an
      agent's tool definitions can use it too. A unique id prevents two methods with
      the same name. A stable id keeps generated clients and tool definitions working
      when the server code changes. FastAPI otherwise derives the id from the handler
      function name, the path and the method, so renaming a function or moving a route
      changes the id. A fixed naming pattern lets
      a reader find the id from the resource and the action.
  - id: AR-01-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All possible HTTP response codes for each endpoint MUST be declared in the OpenAPI spec with typed response
      models
    rationale: >-
      An agent chooses its next step from the response code. If the schema leaves out a
      code, the agent cannot expect that code or parse its body. A typed response model
      for each code lets a client check every answer it can get.
    scope:
    - production
- id: AR-02
  title: State and Workflow Transitions
  specs:
  - id: AR-02-001
    priority: SHOULD
    kind: project
    statement: Resources with a `status` field SHOULD include a `next_allowed_actions` list identifying valid state transitions
      from the current state
    rationale: >-
      Without a list of next actions, an agent must know the state machine to choose a
      valid request, and it learns of a wrong choice only from an error. A
      `next_allowed_actions` list tells the agent which requests the server accepts in
      the current state.
    scope:
    - production
  - id: AR-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All valid states and state transitions for state machine resources MUST be documented
    rationale: >-
      Clients, agents and reviewers need the full set of states and transitions to
      predict what a request does and to check the implementation against it. A
      transition that is not documented can be found only by reading the code or by
      trial and error.
  - id: AR-02-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Endpoints with prerequisites MUST return a structured error using the `error` field value `"PreconditionFailedError"`
      when invoked out of sequence
    rationale: >-
      An agent that calls an endpoint too early must know that the order was wrong, not
      that its request was bad. A fixed `error` value, `"PreconditionFailedError"`,
      lets the agent find this case and do the missing step first (EH-05-001).
    scope:
    - production
    relationships:
    - rel_type: depends_on
      spec_id: EH-05-001
- id: AR-03
  title: Stable Error Types
  specs:
  - id: AR-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The API MUST use the `error` field (per EH-05-001) as a stable, machine-parseable
      error type identifier
    rationale: >-
      Agents choose what to do from the type of an error. The human-readable message
      can change its words between versions, so a program cannot depend on it. The
      `error` value, a code from the `VultronError` hierarchy (EH-05-001), stays the
      same when the message changes.
    relationships:
    - rel_type: depends_on
      spec_id: EH-05-001
- id: AR-04
  title: Long-Running Operations
  specs:
  - id: AR-04-001
    priority: SHOULD
    kind: architecture
    statement: Long-running operations SHOULD return a job or task object immediately with a stable `id` and `status` field
    rationale: >-
      A request that waits for a long operation can time out in the client, in a proxy
      or in the server. The client then does not know whether the operation ran. A job
      object with a stable `id` and `status`, returned at once, lets the client follow
      the operation and not start it a second time.
    scope:
    - production
  - id: AR-04-002
    priority: SHOULD
    kind: architecture
    statement: A separate polling endpoint or webhook mechanism SHOULD be available to report operation completion
    rationale: >-
      A job object (AR-04-001) is useful only if the client can find out when the job
      ends. A polling endpoint or a webhook gives the client that answer without an
      open connection for the whole operation.
    scope:
    - production
- id: AR-05
  title: Pagination
  specs:
  - id: AR-05-001
    priority: SHOULD
    kind: architecture
    statement: Collection endpoints SHOULD expose `limit` and `offset` (or `cursor`) query parameters with documented defaults
      and maximums
    rationale: >-
      A collection can grow without limit, so one request for all of it can return more
      data than the client or the server can handle. Paging parameters with documented
      defaults and maximums let an agent read a collection in parts of a known size.
- id: AR-06
  title: Bulk Operations
  specs:
  - id: AR-06-001
    priority: MAY
    kind: architecture
    statement: Resources that agents may need to create, update, or delete in quantity MAY expose batch endpoints (e.g., `POST
      /v1/items/batch`)
    rationale: >-
      An agent that changes many resources with one request each pays the cost of each
      request. A batch endpoint does the same work in one request. The requirement is
      optional because most resources are not changed in large numbers.
    scope:
    - production
- id: AR-10
  title: Actor Discovery Profile
  specs:
  - id: AR-10-001
    priority: MUST
    kind: project
    statement: The API MUST expose `GET /actors/{actor_id}/profile` returning an ActivityStreams actor profile document for
      actor discovery and federation
    rationale: >-
      The route path is this server's REST choice. A peer finds an actor from its
      `id` and the endpoints its actor document names (IE-02-001), never from a path
      convention, so another implementation may serve the document anywhere. Only
      this codebase must obey the path, so it is `project` (ADR-0134).
    verification: 'Integration tests confirm that `GET /actors/{actor_id}/profile` returns an ActivityStreams actor profile
      with `Content-Type: application/activity+json`.'
    stories:
    - story_2022_028
    - story_2022_034
  - id: AR-10-002
    priority: MUST
    kind: foundation
    statement: The profile endpoint MUST return HTTP 404 when the actor is not found
    rationale: >-
      HTTP defines 404 Not Found as the answer to a request for a resource the server
      does not have (HTTP-03-005). Vultron inherits the rule.
    verification: >-
      `test_get_actor_profile_not_found_returns_404` in
      `test/adapters/driving/fastapi/routers/test_actors.py` confirms that
      `GET /actors/{unknown_id}/profile` returns HTTP 404.
    tags:
    - http
  - id: AR-10-003
    priority: MUST
    kind: project
    statement: The profile endpoint MUST support both full actor URI and short actor ID (e.g., `vendorco`) as the `actor_id`
      path parameter
    rationale: >-
      Accepting a short ID in the path is a convenience of this server's REST routes
      (AR-10-001); on the wire an actor is named by its full `id` (MV-05-001). Only
      this codebase must obey it, so it is `project` (ADR-0134).
    verification: Integration tests confirm that both a short actor ID (e.g., `vendorco`) and a full actor URI resolve
      to the same actor profile document via `GET /actors/{actor_id}/profile`.
    stories:
    - story_2022_034
- id: AR-07
  title: CVD Action Rules API
  specs:
  - id: AR-07-001
    priority: SHOULD
    kind: project
    statement: The system SHOULD expose an endpoint that returns the set of valid CVD actions available to a participant given
      current case state and their role
    rationale: >-
      The CVD actions that a participant can take depend on the case state and on the
      participant's role. Without an endpoint, each client must copy these rules and
      keep its copy current. An answer from the server keeps the rules in one place.
  - id: AR-07-002
    priority: MUST
    kind: project
    statement: >-
      The action rules response MUST be a machine-parseable JSON object that includes:
      (a) the current case state, (b) the requesting participant's CVD role, (c) a list
      of valid action identifiers available in the current state, and (d) for each
      unavailable action, the reason it is disallowed.
    rationale: >-
      An agent needs the case state and the role to understand the answer. It needs the
      valid action identifiers to choose an action, and a reason for each action that
      is not available to explain the answer or to plan the next step. A JSON object
      lets a program read each of these parts.
    verification: Integration tests confirm that the action rules endpoint returns a JSON object containing the current
      case state, the participant's CVD role, available action identifiers, and per-unavailable-action reason strings.
    stories:
    - story_2022_088
    - story_2022_086
  - id: AR-07-003
    priority: MUST
    kind: project
    statement: The action rules endpoint MUST be reflected in the OpenAPI schema per AR-01-001
    rationale: >-
      Clients find endpoints and their response formats in the OpenAPI schema
      (AR-01-001). An endpoint that is missing from the schema is not visible to
      generated clients or to agents that read the schema.
    verification: Inspection of the `GET /openapi.json` response confirms the action rules endpoint path and response
      schema are present in the OpenAPI spec.
    scope:
    - production
    relationships:
    - rel_type: depends_on
      spec_id: CM-07-001
    - rel_type: depends_on
      spec_id: CM-07-002
    - rel_type: depends_on
      spec_id: CM-07-003
- id: AR-08
  title: CLI Interface
  specs:
  - id: AR-08-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The CLI MUST be installable as a Python package entry point defined in `pyproject.toml`
    rationale: >-
      An entry point in `pyproject.toml` installs the CLI as a command when the package
      is installed. Agents and scripts can then run it by name, with no path to a
      script and no `python -m`.
    scope:
    - production
  - id: AR-08-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Every CLI command MUST support a structured JSON output mode (e.g., `--output json`) emitting machine-parseable
      JSON to stdout
    rationale: >-
      An agent reads command output with a program. Output for people changes its
      format and is hard to parse safely. A JSON mode gives the agent a fixed format on
      stdout.
    scope:
    - production
  - id: AR-08-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: CLI commands MUST exit with code `0` on success, `1` on handled error, and `2` on usage or argument error
    rationale: >-
      A script or an agent chooses its next step from the exit code. Fixed codes let it
      tell success, a handled error and a wrong call apart without reading the output.
      Code 2 for a usage error is also the code that `argparse` and Click use.
    scope:
    - production
  - id: AR-08-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: CLI commands wrapping API calls MUST surface the `error` field and `request_id` from API error responses in
      their JSON error output
    rationale: >-
      The `error` field tells an agent what failed, and the `request_id` lets a person
      find the request in the server logs. A CLI that drops these fields leaves the
      agent only a message to guess from.
    scope:
    - production
  - id: AR-08-005
    priority: SHOULD
    kind: project
    statement: Long-running CLI commands SHOULD support `--wait` / `--no-wait` flags; `--no-wait` returns the job object immediately
    rationale: >-
      An agent may want to wait until a long operation ends, or it may want to start
      the operation and do other work. `--wait` and `--no-wait` let the caller choose.
      `--no-wait` returns the job object (AR-04-001), so the caller can check the
      operation later.
    scope:
    - production
