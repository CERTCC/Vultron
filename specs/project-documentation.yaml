id: PD
title: Project Documentation Structure
description: This specification defines the purpose, scope, and maintenance requirements for key project documentation files
  that guide AI agents and human developers.
scope:
- prototype
- production
tags:
- documentation
groups:
- id: PD-01
  title: File Size Guidelines
  specs:
  - id: PD-01-001
    priority: SHOULD
    kind: project
    statement: Large modules with multiple responsibilities SHOULD be refactored into smaller cohesive modules
    rationale: >-
      A module with many responsibilities is hard to read and hard to load as context,
      because a reader must go through code that is not related to the task. Many
      changes touch it, so parallel changes to it conflict more often. Small modules
      that each have one purpose keep each change small and easy to review.
  - id: PD-01-002
    priority: SHOULD
    kind: project
    statement: >-
      `notes/*.md` files SHOULD NOT exceed 500 lines. Files that outgrow this limit SHOULD be split
      along topic-cluster boundaries into separate focused files, each covering a single coherent "Load
      when" scenario.
    rationale: >-
      Large notes files force agents to filter through irrelevant content to find the specific context
      they need, increasing context window waste and the risk of missing relevant guidance. Splitting
      at topic-cluster boundaries keeps each file narrowly focused on one "Load when" scenario.
  - id: PD-01-003
    priority: SHOULD
    kind: project
    statement: >-
      A `notes/*.md` file whose content spans multiple "Load when" scenarios that never co-occur in
      the same task context SHOULD be split into separate files, one per scenario cluster.
    rationale: >-
      When a notes file covers several distinct agent tasks, any single load brings in guidance
      irrelevant to the current task. Single-scenario files make context loading precise and
      predictable.
- id: PD-03
  title: Documentation Currency
  specs:
  - id: PD-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`notes/*.md` files MUST be updated when implementation phases they describe are completed'
    rationale: >-
      Agents load `notes/` as guidance for work that is not done yet. A note that
      still shows completed work as open sends an agent to do the work again, or to
      build against a design that the delivered code replaced.
  - id: PD-03-002
    priority: SHOULD
    kind: project
    statement: 'Stale `notes/*.md` sections (cards) or whole files that are purely historical and contain no durable design
      guidance SHOULD be archived via `append-history note` to `plan/history/YYMM/note/`, rather than deleted. Source ID
      convention: `NOTES-<file-stem>--<section-slug>`. The `learn` skill Phase 5 drives section-level archival.'
    rationale: >-
      A historical section in `notes/` uses context on every load and can mislead an
      agent about current design. A delete removes the text, but the archive keeps it
      in the project history, where a reader can still find it. The fixed source ID
      connects each archive entry to the file and section that it came from.
  - id: PD-03-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'Notes sections (or whole files) that are fully superseded by delivered code, ADRs, or spec entries MUST be
      archived via `append-history note` to `plan/history/YYMM/note/` promptly, rather than left as stale context. When all
      sections of a file are archived, the file MUST be removed from `notes/` and its entry deleted from `notes/README.md`.'
    rationale: >-
      A section that delivered code, an ADR or a spec replaced now disagrees with its
      replacement. An agent that loads both cannot tell which one is current. A file
      with no sections left, or an index entry for a removed file, sends a reader to
      nothing.
  - id: PD-03-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'When archiving a notes section via `append-history note`, the entry body MUST include: archiving reason,
      superseding pointer (code path, spec ID, or docs page), `---` separator, and the original section content verbatim.
      Source ID MUST follow the `NOTES-<file-stem>--<section-slug>` convention.'
    rationale: >-
      The reason and the pointer tell a reader why the text left `notes/` and where
      the current rule is. The verbatim content keeps the old text available without
      a search of the version history. One source ID convention lets a reader and the
      tools find the entry for a given section.
  - id: PD-03-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Module paths referenced in `notes/` MUST be updated to reflect canonical current locations whenever those paths
      change
    rationale: >-
      An agent follows a path in a note to find the code. A path that is not current
      sends the agent to a file that does not exist, or makes it create a second
      module at the old location.
  - id: PD-03-006
    priority: SHOULD
    kind: project
    statement: Workflow or tooling PRs SHOULD update maintainer-facing documentation in the same PR; when this is not feasible,
      the PR MUST include a linked follow-up docs issue before merge.
    rationale: >-
      Maintainers and agents follow the maintainer documentation to run each workflow
      and tool. If a change alters a tool and not its documentation, the next user
      follows steps that do not work now. A linked follow-up issue keeps the gap
      visible when the update cannot be in the same PR.
  - id: PD-03-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      When an implementation or bug-fix PR changes behavior, interfaces, or architecture described in
      `docs/`, the PR MUST include the corresponding `docs/` updates or a linked follow-up
      `type:Concern` issue. Inline update is preferred for edits to existing pages, adding a single
      new page, or rewriting a single existing page. A deferred Concern is acceptable only when the
      required update would simultaneously rewrite multiple `docs/` pages.
    rationale: >-
      A `docs/` page that does not agree with the code misleads its readers, and
      nobody sees the difference until it is large. The author of the change has the
      context now, so an update in the same PR costs less than an update in a later
      session. A rewrite of several pages can be too large for one PR, so only that
      case can go to a Concern, which keeps the gap tracked.
  - id: PD-03-008
    priority: MUST
    kind: project
    statement: >-
      Agents MUST invoke the `check-docs-sync` skill on every implementation or bug-fix PR after
      the PR is pushed (while CI runs in the cloud), before the finalize steps (archive-history,
      learnings), to identify and apply any required `docs/` updates in the same PR. The session
      MUST NOT end until the PR body's `Docs:` field records the outcome — the pages updated, "no
      docs impact" with a reason, or the deferred issue — replacing the placeholder `create-pr`
      writes.
    verification: >-
      `build` and `bugfix` finalize invoke `check-docs-sync` after `create-pr` and edit the PR body
      to replace the `Docs:` placeholder; `create-pr` writes the placeholder into every
      implementation and bug-fix PR body; no merged implementation or bug-fix PR body contains the
      placeholder.
    rationale: >-
      When the check runs after the push, the docs work and CI run at the same time.
      A step that leaves no record can be skipped with no trace, and then a page that
      is not correct merges without notice. The `Docs:` field records the
      outcome on the PR. A placeholder that stays in the field shows an unfinished
      check on the PR, where PD-03-009 enforces it.
  - id: PD-03-009
    priority: MUST
    kind: project
    statement: >-
      `pr-triage` MUST independently determine which `docs/` pages an implementation or bug-fix
      PR's diff affects, whether or not the diff touches `docs/`, and compare that determination
      with the PR body's `Docs:` field. A missing or still-placeholder `Docs:` field is a FAIL
      finding; an affected page the PR neither updated nor deferred is an IMPROVE finding; a
      deferral MUST name an existing follow-up `type:Concern` issue that lists the affected pages,
      and is valid only where PD-03-007 permits deferring (an update that would rewrite multiple
      `docs/` pages at once).
    verification: >-
      `pr-triage`'s notes-and-docs currency review determines affected `docs/` pages from the diff
      without a `docs/`-modified precondition, and its criteria emit FAIL for a missing or
      placeholder `Docs:` field, IMPROVE for an affected page neither updated nor deferred, and a
      finding for a deferral that names no existing multi-page `type:Concern` issue.
    rationale: >-
      A docs check that runs only when the PR already changed `docs/` can never find a
      page that the author forgot. Only the review check reaches PRs that a person
      wrote and the fix rounds of `pr-execute`. The reviewer makes its own decision
      and does not trust the `Docs:` line of the author. Thus it can find a "no docs
      impact" that the author wrote without a check.
    relationships:
    - rel_type: depends_on
      spec_id: PD-03-007
    - rel_type: depends_on
      spec_id: PD-03-008
- id: PD-04
  title: Documentation Build Validation
  specs:
  - id: PD-04-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`mkdocs build --strict` MUST pass without warnings before any changes to `docs/` directory files are staged
      for commit'
    rationale: >-
      A warning from a docs build often shows a broken link, a page that is not in
      the navigation, or an include that failed. `--strict` makes each warning fail
      the build. Then the problem stops the commit, and it does not get to the
      published site.
  - id: PD-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Validation MUST occur after markdown linting (via `.claude/skills/format-markdown/SKILL.md`) and before test
      runs, in the build-and-test workflow documented in `.claude/skills/build-docs/SKILL.md`
    rationale: >-
      The markdown linter can fix files, and the build must check the final text, so
      the build runs after the linter. The docs build is fast compared with the test
      suite, so a docs error stops the workflow before the long test run.
  - id: PD-04-003
    priority: SHOULD
    kind: project
    statement: Agents SHOULD run `uv run mkdocs build --strict` locally when modifying `docs/` files to catch issues before
      staging for commit, reducing CI failures and improving development velocity
    rationale: >-
      A local build finds a docs error in a short time. The same error found in CI
      costs a push and a wait for the CI run.
- id: PD-05
  title: Append-Only History Write Protocol
  specs:
  - id: PD-05-001
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: Agents MUST append new entries exclusively to the **end** of `plan/*HISTORY.md` files. Inserting content at
      an arbitrary line number, a specific section heading, or anywhere other than the very end of the file is **prohibited**.
    rationale: >-
      A history file keeps its entries in time order. An insert at a line number or
      under a heading breaks that order, and it can put the new text inside another
      entry. Several writers that each add to the end do not write over each other.
  - id: PD-05-002
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: 'Agents MUST NOT perform a conditional existence check (e.g., `ls`, `test -f`, `os.path.exists`) before appending.
      Instead, agents MUST unconditionally ensure the file exists using a simple guard (e.g., `touch plan/HISTORY.md`), then
      proceed directly to the append step. The prohibited pattern is the `ls → if not found: create; if found: append` decision
      tree.'
    rationale: >-
      A check followed by a create or an append gives two paths, and each path is a
      place for a mistake, for example a create that writes over a file that exists.
      `touch` does nothing to a file that exists and creates a file that is missing.
      Thus one path covers both cases.
  - id: PD-05-003
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: Agents MUST NOT read the full content of an append-only file in order to append a new entry. Only the final
      lines need to be inspected (using `view_range` with the tail of the file) to locate the exact end-of-file position.
    rationale: >-
      An append-only file grows with no limit. To read all of it only to add text at
      the end uses context for no purpose. The tail is sufficient to find the end of
      the file.
  - id: PD-05-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: 'Agents MUST use the following canonical append procedure: 1. Ensure the file exists: `touch <file>` (no-op
      if already present). 2. Write the new entry to a temporary file, then append that file to the target using `bash("cat
      /tmp/entry.md >> plan/HISTORY.md")` — or use Python `open(file, ''a'')` for content that contains shell-special characters.
      Do NOT use the `edit` tool for appending, because `edit` requires a unique `old_str` anchor that is not guaranteed in
      files with repeated structural patterns. 3. Verify the entry was written correctly: read the tail with `bash("tail -30
      <file>")` to confirm the content appears as expected.'
    rationale: >-
      The `edit` tool needs an anchor that occurs one time only. A history file
      repeats the same structure, so an anchor can match the wrong location or fail to
      match. An append with `>>` or mode `'a'` always writes at the end. The read of
      the tail confirms that the entry is correct.
  - id: PD-05-005
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: Agents MUST NOT edit, reorder, or remove any existing entry from a `plan/*HISTORY.md` file. Once written, a
      history entry is permanent.
    rationale: >-
      The history is the record of what the project did. If an agent can change or
      remove an entry, the record stops being evidence, and later readers cannot
      trust it.
- id: PD-06
  title: Plan Section Organization
  specs:
  - id: PD-06-004
    priority: MUST_NOT
    kind: process
    verification_debt: '#2571'
    statement: >-
      Priority ordering is the sole responsibility of the `Schedule` field
      (Focus/Now/Next/Later/Someday) on Epics in GitHub Project #24 (PAD-02-001);
      a non-Epic issue takes its nearest Epic's tier. GitHub Issue titles MUST NOT
      encode priority information as numeric prefixes or rely on ordering to imply
      priority.
    rationale: >-
      The `Schedule` field on the board is the one source of priority order. A
      priority in an issue title is a second ranking, and nothing keeps it in
      agreement with the board. The two rankings then become different, and a reader
      cannot tell which one is correct.
  - id: PD-06-005
    priority: SHOULD
    kind: process
    statement: >-
      Every non-Epic issue on GitHub Project #24 SHOULD be wired to the Epic it
      belongs to (as a sub-issue), so its priority is traceable to the thematic
      group it advances. PAD-01-007 makes this a MUST for every open non-Epic
      issue.
    rationale: >-
      Only Epics carry a `Schedule` tier (PD-06-004), so a non-Epic issue gets its
      priority from its Epic. An issue that is not a sub-issue of an Epic has no
      priority that a reader can trace, and nobody can tell which theme it advances.
- id: PD-09
  title: Task Granularity and GitHub Issues Coordination
  specs:
  - id: PD-09-001
    priority: SHOULD
    kind: process
    statement: Each GitHub Issue SHOULD be scoped to approximately one Pull Request worth of work — a set
      of changes that can be reviewed and merged in a single PR.
    rationale: This sizing keeps individual issues reviewable, linkable, and trackable within the GitHub
      Issues UI. Issues that span multiple PRs are difficult to close cleanly and obscure progress
      visibility.
    tags:
    - documentation
  - id: PD-09-002
    priority: SHOULD
    kind: process
    statement: When an Issue would require more than one Pull Request to complete, it SHOULD either be
      split into multiple PR-sized Issues or elevated to a parent Epic Issue with GitHub sub-issues
      representing each PR-sized chunk.
    rationale: An issue that spans multiple PRs cannot be closed atomically. Splitting or elevating
      preserves the one-PR-per-issue invariant without forcing artificial scope reduction.
    tags:
    - documentation
  - id: PD-09-003
    priority: SHOULD
    kind: process
    statement: Multi-step work items requiring coordinated effort across several Issues or external
      visibility SHOULD have a parent Epic GitHub Issue. GitHub sub-issues SHOULD be used to link the
      Epic to the individual Task Issues.
    rationale: GitHub sub-issues provide granular traceability within the GitHub UI, making progress
      visible to collaborators.
    tags:
    - documentation
  - id: PD-09-004
    priority: MUST
    kind: process
    verification_debt: '#2571'
    statement: >-
      An Epic whose scope includes changes to the canonical CaseLedgerEntry commit path
      (commit call sites, commit authorization/gating, or per-actor ledger content) MUST include a
      closing sub-issue that reviews a fresh multi-actor demo run's per-actor ledger logs before the
      Epic is closed. Passing the aggregate invariant test suite alone is NOT sufficient closure
      evidence for such an Epic. Concretely, an Epic is "in scope" for this rule if any change
      within it touches `CommitCaseLedgerEntryNode`, `create_guarded_commit_case_ledger_entry_tree`,
      or `create_commit_log_entry_tree` in `vultron/core/behaviors/`, or any call site that invokes
      these directly.
    rationale: >-
      The aggregate invariant suite (the per-scenario harnesses in `test/ci/invariants/`) can pass on `main`
      throughout a ledger-path Epic while protocol-correctness bugs — such as hash-chain forks and
      RM oscillation loops — remain invisible. Such bugs are only detectable from a direct
      side-by-side review of each actor's JSONL log. Without a standing rule requiring this review
      at closure, later commit-path changes (e.g., a new authorization gate touching multiple call
      sites) can reintroduce the same class of bug undetected.
    tags:
    - documentation
  - id: PD-09-005
    priority: SHOULD
    kind: process
    statement: >-
      Before scheduling an Epic whose goal is to deprecate or remove an existing artifact
      (a field, a class, a write path), an exhaustive inventory of read and write call sites for that
      artifact, across all layers, including any wire-layer or adapter-layer duplicates, SHOULD be
      attached to the Epic issue at creation time.
    rationale: >-
      Wire-layer or adapter-layer duplicates of the artifact being removed are routinely discovered
      mid-epic rather than at scoping time, and they end up as late-arriving prerequisites that block
      the epic's final removal step. An upfront inventory surfaces these dependencies before work
      begins rather than after most of the epic is already complete.
    tags:
    - documentation
- id: PD-10
  title: Line Length Outside docs/
  description: >-
    Prose outside `docs/` wraps at 88 characters (AGENTS.md § Markdown
    Formatting); `docs/` keeps one sentence per line with no limit (SG-38).
    Markdown is held to it by markdownlint; spec YAML and Python doc lines,
    whose corpus predates the limit, are held to it per added line.
  specs:
  - id: PD-10-001
    priority: MUST
    kind: process
    statement: >-
      Markdown files outside `docs/` MUST keep lines to 88 characters or fewer,
      except in tables and code blocks and where the overflow is one unbreakable
      token such as a URL. markdownlint's `MD013` MUST enforce the limit in
      every directory except `docs/` and the archives `plan/history/`,
      `plan/retired-specs/` and `archived_notes/`.
    rationale: >-
      A line limit that only people check is applied unevenly, and each miss becomes a
      review finding. `MD013` checks every line in the linted directories.
      `plan/history/` is append-only (HM-01-005) and `plan/retired-specs/` keeps
      retired text as it was (MS-09-005), so nobody can wrap their lines again. The
      same is true for the retired notes in `archived_notes/`. `docs/` has its own
      rule of one sentence for each line (SG-38).
    verification: >-
      `test/metadata/test_line_length.py::TestMarkdownlintConfig` pins `MD013`
      at 88 with tables and code blocks exempt at the root, and off in the
      four exempt directories; the markdownlint pre-commit hook runs it over
      the tree.
    tags:
    - documentation
    - tooling
  - id: PD-10-002
    priority: MUST_NOT
    kind: process
    statement: >-
      A change MUST NOT add a line over 88 characters with whitespace past the
      limit to a `specs/*.yaml` file, or to a comment or docstring of a Python
      file under `vultron/`, `test/`, `integration_tests/`, `scripts/` or
      `.agents/`.
    rationale: >-
      Both corpora hold thousands of longer lines written before the limit was
      checked, so a whole-file rule cannot be turned on. Holding each added or
      edited line to the limit moves the corpus toward it with no baseline file
      for concurrent changes to race on.
    verification: >-
      `test/metadata/test_line_length.py` covers what counts as an overlong
      line and as a Python doc line; PD-10-003's guards enforce it.
    tags:
    - documentation
    - tooling
  - id: PD-10-003
    priority: MUST
    kind: process
    statement: >-
      A pull-request growth guard MUST fail on each line PD-10-002 forbids that
      the branch adds, compared with the merge base, and `spec-lint
      --changed-since <ref>` MUST report each such spec YAML line. The limit
      MUST be one number shared by the guard, the root markdownlint `MD013`
      setting and ruff's `max-doc-length`.
    rationale: >-
      The guard runs in CI for every pull request; the `spec-lint` flag lets
      `create-pr` catch a spec line before a docs pull request is pushed.
    verification: >-
      `test/architecture/test_line_length_ratchet.py` holds the guards,
      `test/metadata/specs/test_branch_checks.py::TestAddedYamlLines` covers
      the flag, and `test/metadata/test_line_length.py::TestLimitsAgree` pins
      the three settings to `LINE_LIMIT`.
    relationships:
    - rel_type: depends_on
      spec_id: PD-10-002
    tags:
    - documentation
    - tooling
