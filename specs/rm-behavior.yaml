- id: RMB-06
  title: Receive RC (Report Closed)
  description: Behaviors triggered when a participant receives an RC (Report Closed) message, updating the sender's RM state model to Closed and acknowledging receipt.
  trigger:
    type: message_received
    value: RC
  specs:
  - id: RMB-06-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in an active RM state (q^rm ∈ {R,I,V,D,A}) receiving RC
      SHOULD update their record of the sender's RM state to Closed.
    rationale: >-
      RC announces that the sender has completed their work on the report.
      Maintaining this record supports shared situation awareness and
      potential auto-close evaluation.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted)
    steps:
    - order: 1
      actor: receiver
      action: Update local model of sender RM state to CLOSED
      expected: Sender RM state recorded as CLOSED in receiver's model
    postconditions:
    - description: >-
        Receiver RM state unchanged; sender's recorded RM state is CLOSED
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-01-006
      note: 'RC shorthand wire-type mapping'
    stories:
    - story_2022_075

  - id: RMB-06-002
    priority: MAY
    kind: protocol
    statement: >-
      After receiving RC from all other active Participants, a Participant
      MAY evaluate whether local closure criteria are satisfied and, if so,
      initiate closure of their own RM state.
    rationale: >-
      When all other parties have closed, remaining open is often unnecessary.
      This auto-close judgment is based on local policy and current EM state.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in RM Received/Invalid/Deferred/Accepted
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-01-006
      note: 'RC shorthand wire-type mapping'
    stories:
    - story_2022_066

  - id: RMB-06-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in RM Start (q^rm ∈ S) receiving RC SHOULD answer it with
      `Create(ProcessingFault)` (ASK-07-001). The fault tells the sender that the
      receiver holds no report the RC could be about. RE has no wire activity of
      its own (MSM-05-001).
    rationale: >-
      Receiving any R* message other than RS while in RM Start is an error
      condition.
    testable: true
    preconditions:
    - rm_state:
        - START
      description: Participant is in RM Start
    steps:
    - order: 1
      actor: receiver
      action: Emit Create(ProcessingFault) to signal the unexpected message
      expected: ProcessingFault queued for sender; no RE message exists
    postconditions:
    - description: ProcessingFault emitted; receiver RM state unchanged (START)
    relationships:
    - rel_type: refines
      spec_id: VP-03-010
      note: Processing fault when R* received while in RM Start
    - rel_type: uses_definition
      spec_id: MSM-01-006
      note: 'RC shorthand wire-type mapping'
    stories:
    - story_2026_006
    see_also:
    - spec_id: ASK-07-001
      reason: >-
        the `Create(ProcessingFault)` clause, reached through the link to VP-03-010
    - spec_id: MSM-05-001
      reason: 'context for the reader'

- id: RMB-07
  title: Receive RE (Report Error)
  description: Behaviors triggered when a participant receives an RE (Report Management Error) signal, which has no dedicated semantic dispatch value and is handled outside the standard AS2 pattern-matching pipeline.
  trigger:
    type: message_received
    value: RE
  specs:
  - id: RMB-07-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in an active RM state (q^rm ∈ {R,I,V,D,A}) that receives
      `Create(ProcessingFault)` about an RM activity it sent SHOULD inquire (GI)
      about the nature of the error when the fault does not say what went
      wrong. RE has no wire activity of its own (MSM-05-001).
    rationale: >-
      The fault says the sender could not process an RM activity, but not
      always why. GI opens a dialogue to resolve the problem. No RK is sent: RK
      acknowledges only a report submission and never goes to the CASE_MANAGER
      (RMB-08-003).
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted)
    steps:
    - order: 1
      actor: receiver
      action: >-
        Emit GI to inquire about the nature of the error, when the fault does
        not say what went wrong
      expected: GI queued for sender
    postconditions:
    - description: GI emitted; receiver RM state unchanged
    relationships:
    - rel_type: refines
      spec_id: VP-03-011
      note: Inquire about the error with GI; RK is not sent (RMB-08-003)
    - rel_type: uses_definition
      spec_id: MSM-01-007
      note: 'RE shorthand wire-type mapping'
    stories:
    - story_2022_039
    see_also:
    - spec_id: MSM-05-001
      reason: 'context for the reader'

  - id: RMB-07-002
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A Participant in RM Start (q^rm ∈ S) that receives
      `Create(ProcessingFault)` about an RM activity MUST NOT answer it with
      `Create(ProcessingFault)` (ASK-07-019). RE has no wire activity of its own
      (MSM-05-001).
    rationale: >-
      A fault about a report the receiver does not hold means the two actors
      disagree about the case, but another fault cannot settle that. If both
      actors are in RM Start, each answering fault would prompt another without
      end, because each one is a new activity.
    testable: true
    verification: >-
      `test/core/use_cases/received/test_processing_fault_received.py::test_a_fault_about_a_report_not_held_is_answered_with_nothing`
      confirms the received-fault use case, at a receiver holding no report,
      queues nothing for the sender whatever the fault's class, and
      `test/core/behaviors/inbox/test_process_payload.py::TestARaisedDispatchIsAnsweredWithAFault::test_a_raised_fault_is_not_answered_with_a_fault`
      confirms the inbox sends no fault when that use case raises.
    preconditions:
    - rm_state:
        - START
      description: Participant is in RM Start
    steps:
    - order: 1
      actor: receiver
      action: Receive Create(ProcessingFault) about an RM activity and send no fault
      expected: No ProcessingFault queued for the sender
    postconditions:
    - description: No fault emitted; receiver RM state unchanged (START)
    relationships:
    - rel_type: refines
      spec_id: ASK-07-019
      note: The RM Start case of the rule that a fault is never answered with a fault
    - rel_type: uses_definition
      spec_id: MSM-01-007
      note: 'RE shorthand wire-type mapping'
    stories:
    - story_2026_006
    see_also:
    - spec_id: MSM-05-001
      reason: 'context for the reader'

- id: RMB-08
  title: Receive RK (Report Acknowledgment)
  description: Behaviors triggered when a participant receives an RK (Report Management Acknowledgment) message confirming receipt of a prior RM message.
  trigger:
    type: message_received
    value: RK
  specs:
  - id: RMB-08-001
    priority: MAY
    kind: protocol
    statement: >-
      A Participant in an active RM state (q^rm ∈ {R,I,V,D,A}) receiving RK
      MAY take no further action; RK is an acknowledgment and requires no
      response.
    rationale: >-
      RK closes the acknowledgment loop. Emitting RK in response to RK would
      create an infinite acknowledgment chain. The protocol specifies no
      mandatory response to RK from an active-state receiver.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted)
    relationships:
    - rel_type: derives_from
      spec_id: VP-03-009
      note: RK itself is never acknowledged with another RK
    - rel_type: uses_definition
      spec_id: MSM-01-008
      note: 'RK shorthand wire-type mapping'
    stories:
    - story_2022_016

  - id: RMB-08-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in RM Start (q^rm ∈ S) receiving RK SHOULD answer it with
      `Create(ProcessingFault)` (ASK-07-001). The fault tells the sender that the
      receiver holds no report the RK could be about. RE has no wire activity of
      its own (MSM-05-001).
    rationale: >-
      RK arriving in START means the sender believes the receiver has already
      acknowledged a message the receiver has never seen. A processing fault is
      the protocol's error response for any R* message received while in RM
      Start per VP-03-010.
    testable: true
    preconditions:
    - rm_state:
        - START
      description: Participant is in RM Start
    steps:
    - order: 1
      actor: receiver
      action: Emit Create(ProcessingFault) to signal the unexpected message
      expected: ProcessingFault queued for sender; no RE message exists
    postconditions:
    - description: >-
        ProcessingFault emitted; no RK in reply to RK (RMB-08-001); receiver RM
        state unchanged (START)
    relationships:
    - rel_type: refines
      spec_id: VP-03-010
      note: Processing fault when R* received while in RM Start
    - rel_type: uses_definition
      spec_id: MSM-01-008
      note: 'RK shorthand wire-type mapping'
    stories:
    - story_2026_006
    see_also:
    - spec_id: ASK-07-001
      reason: >-
        the `Create(ProcessingFault)` clause, reached through the link to VP-03-010
    - spec_id: MSM-05-001
      reason: 'context for the reader'

  - id: RMB-08-003
    priority: MUST
    kind: protocol
    statement: >-
      An actor that an `Offer(VulnerabilityReport)` was addressed to MUST send the RK
      that acknowledges it to the reporter, the Offer's actor. It may send the RK at
      any time after it receives the report, whether or not a case exists for it.
    rationale: >-
      The reporter checks who may acknowledge its Offer against its own record of that
      Offer (RMB-08-004). The store of each addressee also holds a record. RK answers
      the reporter's Offer and is outside the case, so it is the stated exception to
      PCR-08-001 and to the routing topology of VP-18-001, VP-18-002 and VP-18-003.
    verification: >-
      Tests marked `RMB-08-003` confirm that the ack-report trigger addresses
      RK to the reporter alone, with or without a case.
    testable: true
    steps:
    - order: 1
      actor: receiver of the report
      action: Emit RK addressed to the Offer's actor
      expected: RK queued for the reporter only
    postconditions:
    - description: The reporter holds the RK
    relationships:
    - rel_type: refines
      spec_id: VP-03-009
      note: RK acknowledging RS
    - rel_type: supersedes
      spec_id: PCR-08-001
      note: the stated RK exception to CASE_MANAGER-only addressing
    - rel_type: supersedes
      spec_id: VP-18-001
      note: the stated RK exception to the CASE_MANAGER routing path
    - rel_type: supersedes
      spec_id: VP-18-002
      note: the stated RK exception to the no-direct-delivery rule
    - rel_type: supersedes
      spec_id: VP-18-003
      note: the stated RK exception to CASE_MANAGER-mediated delivery
    stories:
    - story_2022_016
    - story_2022_012
  - id: RMB-08-005
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT send an RK that acknowledges a report submission to the
      CASE_MANAGER.
    rationale: >-
      The CASE_MANAGER has no record of the addressees of the Offer, so it cannot
      check an RK that it receives (RMB-08-004). An RK sent to it can also reach
      parties that did not receive the report.
    verification: >-
      Tests marked `RMB-08-005` confirm that the ack-report trigger addresses RK to
      the reporter alone and to no CASE_MANAGER, with or without a case.
    testable: true
    postconditions:
    - description: The CASE_MANAGER received no RK
    relationships:
    - rel_type: extends
      spec_id: RMB-08-003
    stories:
    - story_2022_016
  - id: RMB-08-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      A receiver of an RK that acknowledges a report submission MUST NOT forward it.
    rationale: >-
      RK answers the reporter's Offer outside the case. A forwarded RK can reach
      parties that did not receive the report.
    verification: >-
      Tests marked `RMB-08-006` confirm that the received AckReport handler forwards
      nothing.
    testable: true
    steps:
    - order: 1
      actor: any receiver of RK
      action: Record the RK at intake
      expected: No RK forwarded
    relationships:
    - rel_type: extends
      spec_id: RMB-08-003
    stories:
    - story_2022_016
  - id: RMB-08-007
    priority: MUST_NOT
    kind: protocol
    statement: >-
      An actor MUST NOT write a case ledger entry for an RK that acknowledges a report
      submission.
    rationale: >-
      RK is outside the case, so it is not a case event. A ledgered RK would also
      replicate to parties that did not receive the report.
    verification: >-
      Tests marked `RMB-08-007` confirm that the received AckReport handler writes no
      ledger entry, with or without a case, and that the RK snapshot is no canonical
      ledger signature.
    testable: true
    steps:
    - order: 1
      actor: any receiver of RK
      action: Record the RK at intake
      expected: No ledger entry written
    relationships:
    - rel_type: extends
      spec_id: RMB-08-003
    stories:
    - story_2022_016
  - id: RMB-08-004
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST refuse an RK for a report submission (RMB-08-003, HP-01-006)
      unless its own record of the Offer names the sender as an addressee.
      The Offer is the `Offer(VulnerabilityReport)` that the RK acknowledges.
    rationale: >-
      The reporter sent the Offer, so only its record of the `to` of the Offer tells
      correctly who received it. The sender of the RK wrote the copy in the RK, and that
      copy can name any actor. If the reporter accepts an RK on the word of its sender,
      any actor can claim that it has the report. A receiver with no record of the
      Offer cannot find the sender in it, so it refuses too.
    verification: >-
      Tests marked `RMB-08-004` drive the received AckReport handler with the
      Offer's addressee, which is admitted, with another actor, and with a store
      that holds no record of the Offer, both of which are `REFUSED`.
    testable: true
    steps:
    - order: 1
      actor: reporter
      action: Check the RK sender against its recorded Offer's addressees
      expected: Admitted when the sender is an addressee; REFUSED otherwise
    relationships:
    - rel_type: refines
      spec_id: HP-01-006
      note: the RK sender clause
    - rel_type: uses_definition
      spec_id: RMB-08-003
    stories:
    - story_2022_016
  - id: RMB-08-008
    priority: MUST
    kind: protocol
    statement: >-
      A receiver that refuses an RK (RMB-08-004) MUST write nothing past intake and
      send nothing for it.
    rationale: >-
      A refused RK makes no claim the receiver accepts, so any write past intake or
      any message would act on a claim it refused.
    verification: >-
      Tests marked `RMB-08-008` confirm that a refused RK leaves nothing written past
      intake and an empty outbox.
    testable: true
    postconditions:
    - description: A refused RK leaves only its intake record
    relationships:
    - rel_type: extends
      spec_id: RMB-08-004
    stories:
    - story_2022_016

- id: RMB-09
  title: Enter RM Received
  trigger:
    type: state_entered
    value: RM.RECEIVED
  specs:
  - id: RMB-09-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering RM Received SHOULD initiate a report validation
      process to determine whether the report is Valid or Invalid. A Participant
      that joined a case through an Invite validates the case instead, once it
      has joined, by replying to the full-case Invite (CM-11-011); an invitee
      that has not joined has nothing to validate.
    rationale: >-
      Received is the intake state that exists specifically to await validation.
      Failing to validate leaves the report stuck and blocks all subsequent
      coordination steps that depend on the validation outcome.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
      description: Participant is in RM Received
    steps:
    - order: 1
      actor: participant
      action: >-
        Initiate validation process (credibility check followed by validity
        check)
      expected: Validation process underway
    postconditions:
    - description: >-
        Validation process initiated; report will transition to VALID or
        INVALID on completion
    relationships:
    - rel_type: refines
      spec_id: VP-02-006
      note: Subject each Received report to a validation process
    - rel_type: uses_definition
      spec_id: CM-11-011
    adr:
    - ADR-0121
    stories:
    - story_2022_006

  - id: RMB-09-002
    priority: MAY
    kind: protocol
    statement: >-
      A Participant entering RM Received MAY temporarily hold the report
      pending additional information if the initial validation cannot be
      completed with available data.
    rationale: >-
      Reports may arrive with insufficient detail for immediate validation.
      Holding in Received preserves the option to revalidate when the Reporter
      provides more information.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - rm_state:
        - RECEIVED
      description: Participant is in RM Received
    relationships:
    - rel_type: refines
      spec_id: VP-02-012
      note: MAY temporarily hold reports pending additional information
    stories:
    - story_2022_077

- id: RMB-10
  title: Enter RM Valid
  trigger:
    type: state_entered
    value: RM.VALID
  specs:
  - id: RMB-10-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant entering RM Valid MUST initiate a prioritization evaluation
      to determine whether to Accept or Defer the report.
    rationale: >-
      A Valid report waits on a decision to Accept or Defer it. Entering
      Valid without initiating prioritization leaves the report with no path
      forward.
    verification: A unit test confirms that a participant entering `RM.VALID` initiates a prioritization evaluation,
      resulting in a transition to either `RM.ACCEPTED` or `RM.DEFERRED`.
    testable: true
    preconditions:
    - rm_state:
        - VALID
      description: Participant is in RM Valid
    steps:
    - order: 1
      actor: participant
      action: Initiate prioritization evaluation (e.g., SSVC scoring)
      expected: Prioritization process started; outcome is ACCEPTED or DEFERRED
    postconditions:
    - description: Prioritization underway; report will transition to ACCEPTED or DEFERRED
    relationships:
    - rel_type: refines
      spec_id: VP-02-014
      note: SHOULD perform a prioritization evaluation for Valid reports

    stories:
    - story_2022_086
    - story_2022_087
  - id: RMB-10-002
    priority: MUST_NOT
    kind: protocol
    verification_debt: '#3612'
    statement: >-
      A Participant in RM Valid MUST NOT close the report directly from the
      Valid state (q^rm V → C) without first transitioning through Accepted
      or Deferred (constraint C-03).
    rationale: >-
      Closing directly from Valid skips the mandatory prioritization step.
      Reports with no further action should be Deferred first and then
      Closed, preserving the prioritization record.
    testable: true
    preconditions:
    - rm_state:
        - VALID
      description: Participant is in RM Valid
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-02-004
      note: Participants MUST NOT close cases from the Valid state
    stories:
    - story_2022_086

  - id: RMB-10-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering RM Valid SHOULD emit RV to announce the
      validation result to other Participants.
    rationale: >-
      State-change notifications support shared situation awareness. Other
      Participants tracking this report depend on RV to update their model of
      the sender's RM state.
    testable: true
    preconditions:
    - rm_state:
        - VALID
      description: Participant is in RM Valid
    steps:
    - order: 1
      actor: participant
      action: Emit RV to announce RM Valid transition
      expected: RV queued for case participants
    postconditions:
    - description: RV emitted; other Participants informed of Valid transition
    relationships:
    - rel_type: refines
      spec_id: VP-03-004
      note: SHOULD send RV when validation ends in valid determination
    - rel_type: refines
      spec_id: VP-03-012
      note: SHOULD send a message for each RM state transition
    stories:
    - story_2022_062

  - id: RMB-10-004
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering RM Valid SHOULD create or update a case object
      to track the report's progress through the CVD process.
    rationale: >-
      Valid reports represent confirmed vulnerability coordination work. A case
      object enables participant management, embargo coordination, and state
      tracking across all involved parties.
    testable: true
    preconditions:
    - rm_state:
        - VALID
      description: Participant is in RM Valid
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-02-015
      note: SHOULD create a case for reports entering the Valid state
    stories:
    - story_2022_074

- id: RMB-11
  title: Enter RM Invalid
  trigger:
    type: state_entered
    value: RM.INVALID
  specs:
  - id: RMB-11-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering RM Invalid SHOULD emit RI to announce the
      invalid determination to other Participants.
    rationale: >-
      State-change notifications support shared situation awareness. Other
      Participants tracking this report depend on RI to update their model of
      the sender's validation outcome.
    testable: true
    preconditions:
    - rm_state:
        - INVALID
      description: Participant is in RM Invalid
    steps:
    - order: 1
      actor: participant
      action: Emit RI to announce RM Invalid transition
      expected: RI queued for case participants
    postconditions:
    - description: RI emitted; other Participants informed of Invalid transition
    relationships:
    - rel_type: refines
      spec_id: VP-03-003
      note: SHOULD send RI when validation ends in invalid determination
    - rel_type: refines
      spec_id: VP-03-012
      note: SHOULD send a message for each RM state transition
    stories:
    - story_2022_062

  - id: RMB-11-003
    priority: MAY
    kind: protocol
    statement: >-
      A Participant in RM Invalid MAY revalidate the report when new
      information becomes available, transitioning back through the validation
      process toward RM Valid.
    rationale: >-
      Invalid reports may become valid if additional information is provided
      by the Reporter or discovered independently. Revalidation preserves
      coordination options without requiring a new RS.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - rm_state:
        - INVALID
      description: Participant is in RM Invalid
    relationships:
    - rel_type: refines
      spec_id: VP-02-033
      note: MAY periodically revalidate Invalid reports
    stories:
    - story_2022_077

  - id: RMB-11-004
    priority: MAY
    kind: protocol
    statement: >-
      A Participant in RM Invalid MAY close the report if no further action
      is expected and no active embargo is in force (q^em ∉ {A,R}).
    rationale: >-
      Invalid reports with no prospect of revalidation should eventually be
      closed. Active embargo constraints on closure still apply.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - rm_state:
        - INVALID
      description: Participant is in RM Invalid
    relationships:
    - rel_type: refines
      spec_id: VP-02-035
      note: Participants MAY close Invalid reports
    stories:
    - story_2022_066

- id: RMB-12
  title: Enter RM Deferred
  trigger:
    type: state_entered
    value: RM.DEFERRED
  specs:
  - id: RMB-12-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering RM Deferred SHOULD emit RD to announce the
      deferral decision to other Participants.
    rationale: >-
      State-change notifications support shared situation awareness. Other
      Participants depend on RD to update their model of the sender's
      prioritization decision and to calibrate their own coordination plans.
    testable: true
    preconditions:
    - rm_state:
        - DEFERRED
      description: Participant is in RM Deferred
    steps:
    - order: 1
      actor: participant
      action: Emit RD to announce RM Deferred transition
      expected: RD queued for case participants
    postconditions:
    - description: RD emitted; other Participants informed of Deferred transition
    relationships:
    - rel_type: refines
      spec_id: VP-03-005
      note: SHOULD send RD when prioritization ends in deferred decision
    - rel_type: refines
      spec_id: VP-03-012
      note: SHOULD send a message for each RM state transition
    - rel_type: refines
      spec_id: VP-02-024
      note: Vendors SHOULD communicate prioritization choices including deferral
    stories:
    - story_2022_062

  - id: RMB-12-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in RM Deferred SHOULD monitor for new information
      (updated threat intelligence, exploitation activity, or vendor progress)
      that could justify reprioritization toward Accepted.
    rationale: >-
      Deferred does not mean permanently shelved. Changed conditions may
      restore the urgency needed to resume active work on the report.
    testable: true
    preconditions:
    - rm_state:
        - DEFERRED
      description: Participant is in RM Deferred
    lint_suppress:
    - testable_without_steps
    stories:
    - story_2022_087

  - id: RMB-12-003
    priority: MAY
    kind: protocol
    statement: >-
      A Participant in RM Deferred MAY set a policy timer to automatically
      move the report to Closed after a defined period of inactivity.
    rationale: >-
      Indefinitely deferred reports accumulate as open coordination debt.
      A timer enforces eventual cleanup consistent with local policy without
      requiring manual review of every dormant case.
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - rm_state:
        - DEFERRED
      description: Participant is in RM Deferred
    relationships:
    - rel_type: refines
      spec_id: VP-02-031
      note: MAY set a policy timer on Deferred reports
    stories:
    - story_2026_004

- id: RMB-13
  title: Enter RM Accepted
  trigger:
    type: state_entered
    value: RM.ACCEPTED
  specs:
  - id: RMB-13-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant MUST be in RM Accepted (q^rm ∈ A) before sending RS to
      another Participant to initiate CVD coordination (constraint C-04).
      Sending RS from any other RM state is prohibited.
    rationale: >-
      Sending RS from a non-Accepted state would initiate coordination before
      the sender has committed to working the report. Accepted represents the
      sender's confirmed engagement and readiness to coordinate.
    verification: A unit test confirms that attempting to send RS from any RM state other than `ACCEPTED` returns
      `Status.FAILURE` or raises an error without emitting the RS activity.
    testable: true
    preconditions:
    - rm_state:
        - ACCEPTED
      description: Participant is in RM Accepted
    stories:
    - story_2022_006
    - story_2022_013
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-03-001
      note: MUST be in RM Accepted to send RS
    - rel_type: refines
      spec_id: VP-02-003
      note: Participants initiating CVD with others MUST do so from Accepted state

  - id: RMB-13-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering RM Accepted SHOULD emit RA to announce the
      accept decision to other Participants.
    rationale: >-
      State-change notifications support shared situation awareness. Other
      Participants depend on RA to know that the sender has committed to
      active work and may soon send RS to initiate coordination.
    testable: true
    preconditions:
    - rm_state:
        - ACCEPTED
      description: Participant is in RM Accepted
    steps:
    - order: 1
      actor: participant
      action: Emit RA to announce RM Accepted transition
      expected: RA queued for case participants
    postconditions:
    - description: RA emitted; other Participants informed of Accepted transition
    relationships:
    - rel_type: refines
      spec_id: VP-03-006
      note: SHOULD send RA when prioritization ends in accept decision
    - rel_type: refines
      spec_id: VP-03-012
      note: SHOULD send a message for each RM state transition
    - rel_type: refines
      spec_id: VP-02-024
      note: Vendors SHOULD communicate prioritization choices including acceptance
    stories:
    - story_2022_062

  - id: RMB-13-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in RM Accepted SHOULD perform active work on the report
      (e.g., fix development, remediation guidance, coordination with other
      Participants via RS).
    rationale: >-
      Accepted is the active engagement state. Entering Accepted without
      performing work reduces coordination effectiveness and may violate
      implicitly agreed timelines within an active embargo.
    testable: true
    preconditions:
    - rm_state:
        - ACCEPTED
      description: Participant is in RM Accepted
    lint_suppress:
    - testable_without_steps
    stories:
    - story_2022_086

- id: RMB-14
  title: Enter RM Closed
  trigger:
    type: state_entered
    value: RM.CLOSED
  specs:
  - id: RMB-14-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant entering RM Closed SHOULD emit RC to announce the closure
      to other Participants.
    rationale: >-
      State-change notifications support shared situation awareness. Other
      Participants depend on RC to know the sender has completed their work
      and to evaluate whether to initiate their own closure.
    testable: true
    preconditions:
    - rm_state:
        - CLOSED
      description: Participant is in RM Closed
    steps:
    - order: 1
      actor: participant
      action: Emit RC to announce RM Closed transition
      expected: RC queued for case participants
    postconditions:
    - description: RC emitted; other Participants informed of Closed transition
    relationships:
    - rel_type: refines
      spec_id: VP-03-007
      note: SHOULD send RC when report is closed
    - rel_type: refines
      spec_id: VP-03-012
      note: SHOULD send a message for each RM state transition
    stories:
    - story_2022_062

  - id: RMB-14-002
    priority: MAY
    kind: protocol
    statement: >-
      A Participant in RM Closed (q^rm ∈ C) MAY ignore further R* messages
      received on the closed report without sending a response. Non-R* traffic
      (EM, CS, GI) on a closed case is covered by VP-03-013, and the
      CASE_MANAGER's kill switch once the case is fully closed by CM-23-013.
    rationale: >-
      Closed is a terminal state. A response to more R* messages creates work for a
      report that is complete. The limit for the CASE_MANAGER is wider: after the Case
      Owner closes the case, it records no message of any class (CM-23-013, ADR-0085).
      Thus this rule controls only what a closed participant does with the R* messages
      that it continues to receive.
    adr:
    - ADR-0085
    testable: false
    lint_suppress:
    - testable_without_steps
    preconditions:
    - rm_state:
        - CLOSED
      description: Participant is in RM Closed
    relationships:
    - rel_type: refines
      spec_id: VP-03-013
      note: Recipients MAY ignore messages received on Closed cases
    stories:
    - story_2022_068
    see_also:
    - spec_id: CM-23-013
      reason: 'context for the reader'

  - id: RMB-14-003
    priority: SHOULD_NOT
    kind: protocol
    statement: >-
      A Participant SHOULD NOT close a report (q^rm ∈ {R,I,D,A} → C) while an
      active embargo is in force (q^em ∈ {A,R}) unless they first communicate
      their closure intent, and whether their Embargo Consent continues, to other
      Participants.
    rationale: >-
      Closing while an embargo is active may signal withdrawal from the
      coordinated timeline without proper notification, potentially undermining
      the agreed disclosure date for all parties.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - DEFERRED
        - ACCEPTED
      em_state:
        - ACTIVE
        - REVISE
      description: Participant is in RM Received/Invalid/Deferred/Accepted; EM state is Active or Revise
    lint_suppress:
    - testable_without_steps
    relationships:
    - rel_type: refines
      spec_id: VP-13-007
      note: >-
        SHOULD communicate intent to adhere or terminate compliance when closing
        during an active embargo
    - rel_type: supersedes
      spec_id: VP-13-005
    stories:
    - story_2022_067

  - id: RMB-14-004
    priority: MUST
    kind: protocol
    statement: >-
      The RM transition function MUST permit closing from *Received*
      (q^rm R → C), as well as I → C, A → C and D → C. A `Reject` sent from RM
      Received, of a report Offer, a stub Invite (CM-11-007) or a full-case Invite
      (CM-11-011), is the R → C transition.
    rationale: >-
      `Reject` means close and `TentativeReject` means invalid, so a hard no
      from *Received* needs its own edge rather than a bypass of the transition
      table.
    verification: >-
      The RM transition table test asserts R → C is permitted, and
      `docs/topics/process_models/rm/formal_model.md` states the same
      transition function.
    adr:
    - ADR-0114
    stories:
    - story_2022_006
    relationships:
    - rel_type: uses_definition
      spec_id: CM-11-007
    - rel_type: uses_definition
      spec_id: CM-11-011
  - id: RMB-14-008
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The RM transition function MUST NOT permit closing from *Valid* (VP-02-004).
    rationale: >-
      *Valid* keeps no close edge: a participant that found a report valid decides to
      engage or defer before it leaves (ADR-0114).
    verification: >-
      The RM transition table test (`test/core/states/test_rm_close_from_received.py`)
      asserts V → C is not permitted, and
      `docs/topics/process_models/rm/formal_model.md` states the same transition
      function.
    relationships:
    - rel_type: refines
      spec_id: VP-02-004
    adr:
    - ADR-0114
    stories:
    - story_2022_006
  - id: RMB-14-005
    priority: MUST
    kind: protocol
    statement: >-
      Every RM closure MUST be written as transitions the RM transition function
      permits, with no closure path that overrides the transition table.
    rationale: >-
      An override that skips the RM transition table lets a closure write a state that
      no permitted sequence reaches. The write-boundary check (RMB-15-001) and every
      replica then disagree with that state. R to C is in the table (RMB-14-004), and
      Valid goes through Deferred (RMB-14-009). Thus every closure is an ordinary
      transition, and no closure path needs the override (ADR-0114).
    verification: >-
      An architecture test confirms no closure path calls `force_rm_state`.
    adr:
    - ADR-0114
    stories:
    - story_2022_006
  - id: RMB-14-009
    priority: MUST
    kind: protocol
    statement: >-
      An actor MUST record a participant at RM Valid that leaves the case
      (`Leave(VulnerabilityCase)`, CM-23-038) as V → D → C.
    rationale: >-
      V → C is not in the RM transition table (RMB-14-008), so a closure from Valid
      that keeps to the table (RMB-14-005) goes through Deferred.
    verification: >-
      `test/core/states/test_rm_close_from_received.py` and
      `test/core/use_cases/received/test_close_case_role_semantics.py` confirm a
      `Leave` from RM Valid records V → D → C.
    relationships:
    - rel_type: refines
      spec_id: RMB-14-005
    - rel_type: refines
      spec_id: CM-23-038
    adr:
    - ADR-0114
    stories:
    - story_2022_006
  - id: RMB-14-006
    priority: MUST_NOT
    kind: protocol
    statement: >-
      The RM state machine MUST NOT define any transition out of RM.CLOSED to a
      different RM state. RM.CLOSED is terminal: once a participant's RM state
      reaches CLOSED, no further RM progression is possible for that participant
      on that case.
    rationale: >-
      `RM.CLOSED` being terminal is what gives the closure act finality. A
      participant that anticipates returning to the case SHOULD instead move to
      `RM.DEFERRED` (resumable via DEFERRED → ACCEPTED) rather than close; once
      closed, the participant has no path back in, because a re-invite to a
      participant at `RM.CLOSED` is refused (CM-11-043, ADR-0085). Rejoin
      mechanics are deferred to a future design; the interim workaround is
      defer-not-close (RMB-14-007).
    verification: >-
      A test asserts `is_valid_rm_transition(RM.CLOSED, X)` is `False` for every
      RM state X, including RM.CLOSED itself, confirming no transition edge leaves
      the CLOSED state.
    adr:
    - ADR-0085
    stories:
    - story_2022_066
  - id: RMB-14-007
    priority: SHOULD
    kind: protocol
    statement: >-
      A participant that anticipates returning to active coordination on a case
      SHOULD move to RM.DEFERRED (the resumable parking state) rather than
      RM.CLOSED. RM.DEFERRED supports both DEFERRED → ACCEPTED (resume) and
      DEFERRED → CLOSED (abandon) transitions; RM.CLOSED supports neither.
    rationale: >-
      Because RM.CLOSED is terminal (RMB-14-006), a participant that closes and
      later wants back in has no protocol path. RM.DEFERRED preserves optionality:
      the participant can accept the case later or close it once it confirms there
      is nothing more to do (ADR-0085). Full rejoin mechanics (reactivation via
      re-invitation, multiple lifecycle arcs per actor) are deferred to a future
      design Idea.
    testable: false
    lint_suppress:
    - testable_without_steps
    adr:
    - ADR-0085
    stories:
    - story_2022_006
- id: RMB-15
  title: RM Write-Boundary Transition Validation
  description: >-
    Requirements for RM state write paths to validate source→target transition
    validity before persisting a ParticipantStatus snapshot. Complements
    CSB-16 (VFD/PXA write-boundary validation) and SDO-02-002 (dimension
    object transition contract) by requiring that the BT write node itself
    is fail-closed regardless of upstream guard coverage.
  specs:
  - id: RMB-15-001
    priority: MUST
    kind: project
    statement: >-
      Before it persists an RM state to a ParticipantStatus snapshot, a BT node or
      helper MUST check the transition with is_valid_rm_transition().
      The check confirms that the RM state machine permits (current_rm_state →
      target_rm_state).
      A same-state write is permitted (status confirmation).
    note: >-
      This is the emit-side and write-boundary rule. On the receive side the
      CASE_MANAGER adjudicates a peer's RM declaration under RSH-06-006 instead: a
      non-adjacent forward move is accepted and flagged, not refused. It reaches the
      write node with adjacency validation explicitly relaxed for the dimension the
      adjudication accepted, and the write node still refuses a backward move.
    verification: A unit test confirms that a BT write node returns `Status.FAILURE` without writing to the DataLayer
      when passed an illegal RM state transition (e.g., START → CLOSED directly).
    rationale: >-
      Some sites write `ParticipantStatus.rm` directly, for example with
      `RmDimension(state=target)`, and do not use the `transition()` contract in
      SDO-02-002. The BT guards before the write node are necessary but not sufficient.
      A weak or missing guard lets an incorrect RM jump reach the write node with no
      check. A check at the write boundary refuses an incorrect RM transition, whatever
      the guards do.
    testable: true
    preconditions:
    - description: A non-None RM target state is passed to a ParticipantStatus write node
    steps:
    - order: 1
      actor: write_node
      action: Read the participant's current RM state from the DataLayer
      expected: Current RM state available
    - order: 2
      actor: write_node
      action: >-
        If target == current, proceed. If is_valid_rm_transition(current, target)
        is True, proceed. Otherwise return Status.FAILURE.
      expected: Only valid transitions or same-state writes reach the DataLayer
    postconditions:
    - description: No ParticipantStatus with an illegal RM state jump is persisted
    relationships:
    - rel_type: refines
      spec_id: BTND-10-001
  - id: RMB-15-002
    priority: MUST
    kind: project
    statement: >-
      On an illegal jump or a backward move, the BT node that writes the RM state MUST
      return `Status.FAILURE` without writing to the DataLayer.
    rationale: >-
      A FAILURE with no write leaves the stored RM state as it was, so a refused
      transition never reaches the DataLayer or a replica.
    verification: >-
      A unit test confirms that a BT write node returns `Status.FAILURE` without
      writing to the DataLayer when passed an illegal RM state transition (e.g.,
      START → CLOSED directly).
    relationships:
    - rel_type: extends
      spec_id: RMB-15-001
