      spec_id: MSM-01-003
      note: 'RV shorthand wire-type mapping'
    stories:
    - story_2026_006
    see_also:
    - spec_id: ASK-07-001
      reason: >-
        the `Create(ProcessingFault)` clause, reached through the link to VP-03-010
    - spec_id: MSM-05-001
      reason: 'context for the reader'

