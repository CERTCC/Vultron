id: RMB
title: Report Management Behavioral Requirements
description: >-
  Event-Condition-Action behavioral requirements for Report Management (RM). Each group
  is triggered by either a received RM message or a local RM state transition, and
  specifies typed preconditions, ordered steps, and postconditions that implementations
  must satisfy.
tags:
- behavioral
- state-machine
- protocol
scope:
- prototype
- production
groups:
- id: RMB-01
  title: Receive RS (Report Submission)
  description: Behaviors triggered when a participant receives an RS (Report Submission) message, including RM state transition from Start to Received and vendor CS awareness update.
  trigger:
    type: message_received
    value: RS
  specs:
  - id: RMB-01-001
    priority: MUST
    kind: protocol
    statement: >-
      A Participant in RM Start (q^rm ∈ S) receiving RS MUST transition their
      RM state to Received (q^rm S → R).
    rationale: >-
      RS is the sole RM message that directly changes the receiver's own RM
      state. All other RM messages announce sender state only.
    verification: A unit test confirms that a participant in `RM.START` whose inbox processes an RS activity has
      `rm.state == RM.RECEIVED` afterwards. The RK the receiver then sends is not
      queued on receipt; it goes
      through the `ack-report` trigger, and tests marked `RMB-08-003` cover it.
    testable: true
    preconditions:
    - rm_state:
        - START
      description: Participant is in RM Start
    steps:
    - order: 1
      actor: receiver
      action: Transition RM state from START to RECEIVED
      expected: Receiver RM state is RECEIVED
    - order: 2
      actor: receiver
      action: Emit RK to acknowledge receipt of RS
      expected: RK queued for sender
    postconditions:
    - description: Receiver RM state is RECEIVED; RK emitted to sender
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-01-001
      note: 'RS shorthand wire-type mapping'

    stories:
    - story_2022_002
    - story_2022_038
    - story_2022_016
  - id: RMB-01-002
    priority: MUST
    kind: protocol
    statement: >-
      A Vendor Participant in RM Start receiving RS that introduces a
      previously unknown vulnerability (q^cs ∈ vfd···) MUST transition their
      CS to vendor-aware (q^cs vfd··· → Vfd···) and emit CV to announce the
      transition.
    rationale: >-
      RS is the event that makes a Vendor aware of the vulnerability. The CS
      V-transition records this awareness and CV announces it to other
      Participants.
    verification: A unit test confirms that a vendor participant in `RM.START` with CS pattern `vfd...` transitions
      to `CS Vfd...` and emits CV when processing an RS. The RK is sent through the `ack-report` trigger, not
      on receipt (RMB-08-003).
    testable: true
    preconditions:
    - rm_state:
        - START
      role:
        - vendor
      cs_pattern: vfd...
      description: Participant is in RM Start; Participant holds the Vendor role; CS matches pattern vfd...
    steps:
    - order: 1
      actor: receiver
      action: Transition RM state from START to RECEIVED
      expected: Receiver RM state is RECEIVED
    - order: 2
      actor: receiver
      action: Transition CS from vfd··· to Vfd··· (V event)
      expected: CS vendor-aware bit set to V
    - order: 3
      actor: receiver
      action: Emit CV to announce the CS vendor-aware transition
      expected: CV queued for case participants
    - order: 4
      actor: receiver
      action: Emit RK to acknowledge receipt of RS
      expected: RK queued for sender
    postconditions:
    - description: Receiver RM state is RECEIVED; CS is vendor-aware; CV and RK emitted
    relationships:
    - rel_type: refines
      spec_id: VP-03-002
      note: Vendor MUST transition CS to Vfd on new RS
    - rel_type: uses_definition
      spec_id: MSM-01-001
      note: 'RS shorthand wire-type mapping'

    stories:
    - story_2022_038
    - story_2022_111
    - story_2022_081
  - id: RMB-01-003
    priority: SHOULD
    kind: protocol
    statement: >-
      A Vendor Participant already in an active RM state (q^rm ∈ {R,I,V,D,A})
      receiving RS for a vulnerability they were previously unaware of
      (q^cs ∈ vfd···) SHOULD transition CS to Vfd··· and emit CV, even though
      their RM state does not change.
    rationale: >-
      The CS V-transition captures vendor awareness regardless of when the
      Vendor first receives RS. A Vendor who joins a case mid-lifecycle must
      still record their own awareness event.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      role:
        - vendor
      cs_pattern: vfd...
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted); Participant holds the Vendor role; CS matches pattern vfd...
    steps:
    - order: 1
      actor: receiver
      action: Transition CS from vfd··· to Vfd··· (V event)
      expected: CS vendor-aware bit set to V
    - order: 2
      actor: receiver
      action: Emit CV to announce the CS vendor-aware transition
      expected: CV queued for case participants
    - order: 3
      actor: receiver
      action: Emit RK to acknowledge receipt of RS
      expected: RK queued for sender
    postconditions:
    - description: CS is vendor-aware; CV and RK emitted; receiver RM state unchanged
    relationships:
    - rel_type: refines
      spec_id: VP-03-002
      note: Vendor MUST transition CS to Vfd on receiving RS for new vulnerability
    - rel_type: uses_definition
      spec_id: MSM-01-001
      note: 'RS shorthand wire-type mapping'
    stories:
    - story_2022_107

  - id: RMB-01-004
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in an active RM state (q^rm ∈ {R,I,V,D,A}) receiving a
      duplicate RS (already Vendor-aware, q^cs ∈ V···) SHOULD emit RK to
      acknowledge receipt without changing RM or CS state.
    rationale: >-
      All R* messages warrant acknowledgment unless the report is Closed.
      Duplicate RS does not re-trigger RM or CS transitions.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted)
    steps:
    - order: 1
      actor: receiver
      action: Emit RK to acknowledge receipt of RS
      expected: RK queued for sender
    postconditions:
    - description: RK emitted; RM and CS states unchanged
    relationships:
    - rel_type: refines
      spec_id: VP-03-009
      note: RK acknowledgment of RS
    - rel_type: uses_definition
      spec_id: MSM-01-001
      note: 'RS shorthand wire-type mapping'
    stories:
    - story_2026_014

- id: RMB-02
  title: Receive RI (Report Invalid)
  description: Behaviors triggered when a participant receives an RI (Report Invalid) message, updating the sender's RM state model.
  trigger:
    type: message_received
    value: RI
  specs:
  - id: RMB-02-001
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in an active RM state (q^rm ∈ {R,I,V,D,A}) receiving RI
      SHOULD update their record of the sender's RM state to Invalid.
    rationale: >-
      RI is a status announcement — it does not change the receiver's own RM
      state but informs them of the sender's validation result. Maintaining
      this record supports shared situation awareness.
    testable: true
    preconditions:
    - rm_state:
        - RECEIVED
        - INVALID
        - VALID
        - DEFERRED
        - ACCEPTED
      description: Participant is in an active RM state (Received/Invalid/Valid/Deferred/Accepted)
    steps:
    - order: 1
      actor: receiver
      action: Update local model of sender RM state to INVALID
      expected: Sender RM state recorded as INVALID in receiver's model
    postconditions:
    - description: >-
        Receiver RM state unchanged; sender's recorded RM state is INVALID
    relationships:
    - rel_type: uses_definition
      spec_id: MSM-01-002
      note: 'RI shorthand wire-type mapping'
    stories:
    - story_2022_075

  - id: RMB-02-002
    priority: SHOULD
    kind: protocol
    statement: >-
      A Participant in RM Start (q^rm ∈ S) receiving RI SHOULD answer it with
      `Create(ProcessingFault)` (ASK-07-001). The fault tells the sender that the
      receiver holds no report the RI could be about. RE has no wire activity of
      its own (MSM-05-001).
    rationale: >-
      Receiving any R* message other than RS while in RM Start means the
      sender believes the receiver is coordinating a report the receiver has
      no knowledge of. A processing fault is the protocol's error response
      (VP-03-010).
    testable: true
    preconditions:
    - rm_state:
        - START
      description: Participant is in RM Start
    steps:
    - order: 1
      actor: receiver
      action: Emit Create(ProcessingFault) to signal the unexpected message
      expected: ProcessingFault queued for sender; no RE message exists
    postconditions:
    - description: ProcessingFault emitted; receiver RM state unchanged (START)
    relationships:
    - rel_type: refines
      spec_id: VP-03-010
      note: Processing fault when R* received while in RM Start
    - rel_type: uses_definition
      spec_id: MSM-01-002
      note: 'RI shorthand wire-type mapping'
    stories:
    - story_2026_006
    see_also:
    - spec_id: ASK-07-001
      reason: >-
        the `Create(ProcessingFault)` clause, reached through the link to VP-03-010
    - spec_id: MSM-05-001
      reason: 'context for the reader'

