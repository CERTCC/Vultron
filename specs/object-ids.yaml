id: OID
title: Object ID
description: Requirements for the format and handling of object identifiers throughout the Vultron system. Establishes full-URI
  IDs as the canonical form for all ActivityStreams objects and DataLayer records.
scope:
- prototype
- production
tags:
- wire-format
- protocol
groups:
- id: OID-01
  title: ID Format
  specs:
  - id: OID-01-001
    priority: MUST
    kind: foundation
    statement: All ActivityStreams object IDs MUST use full URI form
    rationale: >-
      ActivityPub requires every object it distributes to carry a publicly
      dereferenceable URI as its identifier, which a relative or bare identifier is
      not. ActivityStreams 2.0 alone only says relative references SHOULD NOT be
      used. Vultron inherits the ActivityPub rule.
    verification: Integration tests in `test/demo/` confirm that all `as_id` fields on created objects contain full URI
      strings with a scheme and authority component.
    relationships:
    - rel_type: implements
      spec_id: VP-16-002
    - rel_type: implements
      spec_id: VP-16-003
    stories:
    - story_2022_029
    - story_2022_030
    - story_2022_034
    - story_2026_016
    adr:
    - ADR-0010
    tags:
    - activitypub
  - id: OID-01-002
    priority: MUST
    kind: foundation
    statement: IDs MUST be unique within the issuing actor's deployment; cross-deployment uniqueness is achieved by requiring
      full URI form (OID-01-001) with a deployment-controlled authority component.
    rationale: >-
      Restates ActivityPub's identifier rule: an object's URI has an authority
      belonging to the server that originated it, so that server keeps it unique and
      uniqueness across deployments follows from the full URI form.
    verification: Inspection of `vultron/core/` confirms that ID generation embeds a UUID in full-URI form, guaranteeing
      uniqueness within the deployment.
    stories:
    - story_2022_029
    - story_2022_030
    tags:
    - activitypub
  - id: OID-01-003
    priority: MUST
    kind: project
    statement: The canonical base URI for locally created objects MUST be configurable via an environment variable (`VULTRON_BASE_URL`
      or equivalent)
    rationale: >-
      How a deployment sets the base of the IDs it mints is an operating choice of
      this codebase; a peer sees only the resulting IDs. Only this codebase must obey
      it, so it is `project` (ADR-0134).
    verification: >-
      `test_env_override_base_url` in `test/test_config.py` confirms that the base URI
      comes from `VULTRON_SERVER__BASE_URL` rather than a hardcoded value, and
      `TestCanonicalActorUri::test_falls_back_to_configured_base_url` in
      `test/adapters/driven/test_actor_hosts.py` confirms that a hosted actor's id is
      built on the configured base.
    stories:
    - story_2022_029
    adr:
    - ADR-0010
  - id: OID-01-004
    priority: MUST
    kind: project
    statement: >-
      This codebase MUST mint every new object ID through one helper that the core and
      wire layers share.
    rationale: >-
      If each layer built IDs its own way, objects could get IDs in different forms
      (bare UUID, `urn:uuid:`, base-URL HTTPS), and lookups by full URI would miss some
      of them (OID-02-004). One helper keeps every minted ID in one form. The wire layer
      may import `vultron/core/models` (ARCH-22-001), so a helper there can serve both
      layers.
    adr:
    - ADR-0010
    verification: >-
      `test/architecture/test_single_object_id_minter.py` confirms that the core and
      wire `id_` default factories are both
      `vultron.core.models._helpers.new_object_id`, and that no other module under
      `vultron/` names `uuid1` or `uuid4`, called or not, except the listed non-id
      uses.
  - id: OID-01-005
    priority: MUST
    kind: project
    statement: Actor IDs MUST be normalized to full URI form at the point of first establishment — actor creation, seed data
      loading, or session initialization
    rationale: >-
      When this codebase normalizes an actor ID is an internal choice. What a peer
      observes, an `id` that is a full IRI, is ActivityStreams' rule (MV-05-001). Only
      this codebase must obey the normalization point, so it is `project` (ADR-0134).
    verification: Integration tests confirm that after actor creation or seed data loading, the actor's `as_id` field is
      a full URI rather than a bare UUID or short identifier.
    relationships:
    - rel_type: depends_on
      spec_id: OID-01-003
    stories:
    - story_2022_034
    - story_2022_035
  - id: OID-01-006
    priority: MUST
    kind: project
    statement: >-
      A receiver MUST normalise each actor id that it extracts from a received activity
      to act on, by stripping a trailing slash. It does so at the point of extraction.
      To act on an id is to look it up, compare it with a stored id, or store it as a
      key.
    rationale: >-
      The values the receiver works with must have one spelling, or exact lookups miss
      records written in the other: a peer that spells its id with a trailing slash
      would not match its own CASE_OWNER records stored under the canonical spelling.
      Normalising where the value is extracted, not where it is compared, lets core
      trust one spelling (ADR-0032).
    verification: >-
      A received activity whose actor ids carry a trailing slash yields case records,
      written by the use case, that hold the ids without the slash.
    relationships:
    - rel_type: refines
      spec_id: OID-01-005
      note: >-
        Extends normalisation at first establishment to ids extracted from received
        activities.
    adr:
    - ADR-0032
  - id: OID-01-008
    priority: MUST
    kind: project
    statement: >-
      A receiver MUST store and ledger a received activity as received, with the actor
      ids spelled as the sender wrote them.
    rationale: >-
      File the letter as received; normalise only what you copy out of it (OID-01-006).
      The stored activity and the ledger postmark are evidence of what the sender wrote
      (ADR-0107), so they keep the sender's spelling.
    verification: >-
      A received activity whose actor ids carry a trailing slash is stored with the
      slash, and its ledger entry's `payloadSnapshot.actor` keeps the slash.
    adr:
    - ADR-0107
  - id: OID-01-007
    priority: MUST
    kind: project
    statement: >-
      The wire extractor MUST normalise a received activity's sender id before it builds
      the received event.
    rationale: >-
      The sender id reaches every received use case, so normalising it once at the edge
      replaces a trailing-slash-tolerant comparison at each of its uses. An id the
      sender wrote elsewhere in the activity keeps its spelling until it is extracted
      (OID-01-006), so comparing it with the sender id still needs `same_actor_id`
      (CLP-10-021). The normalising function must be importable from `vultron/wire/`
      and `vultron/core/models/`, which may not import `vultron/core/predicates/`
      (ARCH-22-001).
    verification: >-
      An extractor unit test shows a sender id written with a trailing slash reaches
      the event without it.
    relationships:
    - rel_type: refines
      spec_id: OID-01-006
    - rel_type: depends_on
      spec_id: ARCH-22-001
    adr:
    - ADR-0032
  - id: OID-01-009
    priority: MUST
    kind: project
    statement: >-
      A received event MUST refuse, at construction, a sender id that ends in a trailing
      slash.
    rationale: >-
      Refusing an unnormalised id at construction makes a path that skips the extractor
      (a trigger, a test fixture) fail where it builds the event, instead of storing the
      other spelling (ARCH-10-001).
    verification: >-
      A model test shows that constructing a received event with a sender id that ends
      in a trailing slash raises a validation error.
    relationships:
    - rel_type: depends_on
      spec_id: ARCH-10-001
    adr:
    - ADR-0032
  - id: OID-01-010
    priority: MUST
    kind: protocol
    statement: >-
      A receiver MUST treat two messages whose `actor` URIs are equal once a trailing
      slash is removed from each as coming from the same actor.
    rationale: >-
      Actor ids are full URIs (OID-01-001), and two implementations that disagree on
      which messages share an actor disagree on who did what. The equality is the one
      a receiver normalises to (OID-01-006). This rule states identity, not trust:
      whether a message really comes from the actor it names is the signing work
      (ADR-0164). Revisit it when signing lands, in case identity should follow the
      signing key.
    verification: >-
      A test marked `OID-01-010` in `test/wire/as2/test_extractor.py` extracts two
      activities whose `actor` differs only by a trailing slash and asserts both
      events name the same sender.
    relationships:
    - rel_type: uses_definition
      spec_id: OID-01-001
    adr:
    - ADR-0164
    stories:
    - story_2022_034
- id: OID-02
  title: DataLayer Handling
  specs:
  - id: OID-02-001
    priority: MUST
    kind: project
    statement: The DataLayer MUST store and retrieve objects using their full-URI `as_id` as the primary key
    rationale: >-
      The full URI is the object's identity on the wire and across deployments
      (OID-01-001, OID-01-002). A shortened key could collide between objects from
      different deployments and would need a translation at every lookup of a received
      id.
    verification: A unit test confirms that `DataLayer.save(obj)` and `DataLayer.get(obj.as_id)` round-trip correctly
      using the full-URI key.
  - id: OID-02-002
    priority: MUST
    kind: project
    statement: '`object_to_record()` MUST preserve the full-URI `as_id` when serializing objects to the DataLayer'
    rationale: >-
      A record that drops or shortens the id cannot be found again by the id peers use,
      and objects from different deployments that share a UUID could overwrite each
      other.
    verification: A unit test confirms that `object_to_record(obj)` includes the full-URI `as_id` value in the serialized
      record.
  - id: OID-02-003
    priority: MUST
    kind: project
    statement: '`record_to_object()` MUST reconstruct objects using the full-URI `as_id` stored in the record'
    rationale: >-
      The id on a rebuilt object is what core compares and what outbound activities
      carry. Rebuilding it from anything other than the stored full URI could give the
      object an identity different from the one its peers know.
    verification: A unit test confirms that `record_to_object(record)` produces an object whose `as_id` matches the full
      URI stored in the record.
  - id: OID-02-004
    priority: MUST_NOT
    kind: project
    verification: >-
      Inspection confirms DataLayer lookups key on full-URI ids and that no lookup path
      resolves a bare UUID.
    statement: >-
      A DataLayer lookup MUST NOT accept a bare UUID as a lookup key.
    rationale: >-
      Accepting a bare UUID as a key would give one object two keys and let a UUID match
      an object from another deployment with the same UUID. Refusing it keeps one
      spelling for each id in the store.
- id: OID-03
  title: Blackboard Key Handling
  specs:
  - id: OID-03-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: Behavior Tree blackboard keys derived from object IDs MUST NOT use the raw full URI as the key
    rationale: >-
      A full URI contains `/`, which py_trees reads as a blackboard namespace separator,
      so a raw URI used as a key is split into nested namespaces instead of naming one
      entry. Deriving the key from the id's final path segment avoids the misparse.
    adr:
    - ADR-0010
    relationships:
    - rel_type: refines
      spec_id: BT-03-003
- id: OID-04
  title: Migration Requirements
  specs:
  - id: OID-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Any migration of existing bare-UUID records MUST be accompanied by a migration script or documented manual
      steps
    rationale: >-
      A change in id form leaves existing records under keys that full-URI lookups do
      not find (OID-02-004). Without a script or written steps, an operator upgrading a
      deployment cannot bring stored records forward, and those records drop out of the
      system without an error.
    adr:
    - ADR-0010
