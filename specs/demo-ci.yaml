id: DEMOCI
title: Demo CI — GitHub Actions Demo Integration Workflow
description: >-
  Requirements for a GitHub Actions workflow that builds and runs Vultron demo
  containers on pull requests, and for hardening the demo runner to exit non-zero
  when the demo fails — closing the gap where tests pass while the demo produces
  silent failures. Includes requirements for the invariant harness to run as an
  independent CI gate so failures are visible even when the demo itself also fails.
scope:
  - prototype
  - production
tags:
- ci-cd
- demo
groups:
  - id: DEMOCI-01
    title: Demo Runner Failure Signalling
    specs:
      - id: DEMOCI-01-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo runner MUST exit with a non-zero exit code when the demo
          scenario fails, regardless of whether the Python process itself
          raised an unhandled exception.
        rationale: >-
          docker compose --exit-code-from demo-runner requires a non-zero exit
          to surface failures in CI; a process that logs errors but exits 0 is
          indistinguishable from a successful run at the CI level.

      - id: DEMOCI-01-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo runner MUST treat any HTTP 404 response from an actor
          endpoint as a demo failure.
        rationale: >-
          A 404 from an actor inbox or trigger endpoint means the target route
          does not exist, which is a protocol error, not a transient condition.

      - id: DEMOCI-01-003
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo runner MUST accumulate all errors encountered during the
          scenario and raise a typed DemoFailureError at the end of the
          scenario run, rather than halting at the first error.
        rationale: >-
          Accumulating errors produces a complete diagnostic picture of all
          failures in a single run; stopping at the first error obscures
          subsequent steps that may also be failing.

      - id: DEMOCI-01-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Error detection and accumulation MUST be implemented by the
          demo_step, demo_check, and demo_gate context managers in
          vultron/demo/utils/failures.py.
        rationale: >-
          All demo steps and checks already run inside these context managers. When the
          error accumulation is in the same place, every step and every check records
          its failure the same way, and no scenario needs its own error-handling code.
          `demo_gate` records a failure in the same way as `demo_check`, and it also
          stops the steps that need the failed precondition (DEMOCI-01-007).

      - id: DEMOCI-01-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          `DemoFailureError` MUST be a subclass of `VultronError`.
        rationale: >-
          A typed error lets the runner and the tests tell a demo failure apart from any
          other error. As a `VultronError`, it is in the same error hierarchy as the
          other project errors (EH-01-002).
        relationships:
          - rel_type: refines
            spec_id: EH-01-002

      - id: DEMOCI-01-012
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          This codebase MUST define `DemoFailureError` in `vultron/errors.py`.
        rationale: >-
          One module holds the project's error classes (EH-01-003). When
          `DemoFailureError` is defined there, the runner and the tests import it from
          the same place as every other project error.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-01-005

      - id: DEMOCI-01-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Every scenario entry-point function MUST call `reset_demo_failures()` as its
          first action.
        rationale: >-
          DEMOCI-01-003 and DEMOCI-01-004 specify how failures accumulate, but not where
          the accumulator starts. A scenario that does not reset it first can inherit
          the failure state of an earlier run.
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-01-003

      - id: DEMOCI-01-013
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Every scenario entry-point function MUST call `assert_demo_success()` as its
          last action before it returns.
        rationale: >-
          The call turns the accumulated failures into a `DemoFailureError`, so CI sees
          a failed run. With the reset of DEMOCI-01-006, it forms the bookends of the
          failure accumulator. A scenario that skips the call exits without reporting
          the failures it recorded.
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-01-003

      - id: DEMOCI-01-007
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          A causal precondition MUST be expressed with a `demo_gate` context
          manager, distinct from `demo_check`.
        rationale: >-
          Accumulate-and-continue is correct for verification assertions — report
          every failed check, not just the first — and wrong for preconditions,
          where continuing buries the real failure under secondary ones and makes
          the gate indistinguishable from a comment. Both behaviours are needed,
          so they need distinct names. See ADR-0058 and EDF-06-005.
        adr:
          - ADR-0058
        relationships:
          - rel_type: implements
            spec_id: EDF-06-005

      - id: DEMOCI-01-008
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          On failure, `demo_gate` MUST record the failure in the accumulator
          exactly as `demo_check` does.
        rationale: >-
          Gate failures must be accumulated so the exit-code contract of
          DEMOCI-01-001 and DEMOCI-01-003 applies uniformly, regardless of
          whether the failed check is a precondition or an advisory assertion.

      - id: DEMOCI-01-009
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          On failure, `demo_gate` MUST prevent execution of the steps that
          depend on the unmet precondition.
        rationale: >-
          Continuing past a failed precondition buries the root cause under
          secondary failures from steps that assumed the precondition was met.

      - id: DEMOCI-01-010
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          `demo_check` MUST remain advisory: it records a failure in the
          accumulator and continues execution.
        rationale: >-
          Advisory accumulation is the correct behaviour for verification
          assertions — every failed check should be reported in a single run
          rather than stopping at the first one.

      - id: DEMOCI-01-011
        priority: MUST
        kind: project
        statement: >-
          A scenario MUST run each poll or verification call that raises on timeout,
          such as `wait_for_*`, inside a `demo_step`, `demo_check` or `demo_gate`
          context. A call through a shared helper that opens the context itself also
          meets this rule.
        rationale: >-
          DEMOCI-01-003 requires all errors of a run to be reported together. A wait
          that raises outside a demo context escapes the failure accumulator and stops
          the scenario at the first timeout. Then the other failures of the run are not
          reported, and the one that is can point at the wrong cause. A bare call looks
          correct in a review, so an architecture test checks every piece of
          scenario-level code.
        verification: >-
          An architecture test scans every module under `vultron/demo/` for
          scenario-level code — a story fragment, which is a module-level
          function taking a `StoryState` wherever it lives (DEMOCI-11-019), and
          the retired `_phase_*` function it still recognizes — and reports every
          raising `wait_for_*` call that sits in neither a `demo_step`, a
          `demo_check` nor a `demo_gate`. It fails when it resolves no story
          fragment, and, every scenario being written as composition, it fails
          too when it resolves a `_phase_*` function: the scan keeps that arm
          so one written again is covered rather than silently exempt, and the
          assertion is what says it must not be. So a migration that moved the
          last one would not leave it passing over an empty set.
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-01-003
            note: >-
              Running a raising wait inside a demo context is how its timeout
              is accumulated instead of halting the scenario.

      - id: DEMOCI-01-014
        priority: MUST
        kind: project
        statement: >-
          A shared helper that encapsulates a raising poll MUST open the `demo_step`,
          `demo_check` or `demo_gate` context itself.
        rationale: >-
          Every caller of such a helper then inherits the wrap, and no caller can forget
          it. `wait_for_participants_on_replicas` and `wait_for_replica_ledger_coverage`
          are such helpers.
        verification: >-
          `test_polling_module_has_raising_and_wrapping_helpers` and
          `test_partial_wrap_is_classified_raising_not_wrapping` in
          `test/architecture/test_demo_scenario_waits_in_demo_context.py` count a helper
          as wrapping only when it wraps every raising call itself, and
          `test_scenario_level_code_wraps_raising_waits` fails a bare call to any other
          helper.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-01-011

  - id: DEMOCI-02
    title: GitHub Actions Demo Workflow
    specs:
      - id: DEMOCI-02-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          This codebase MUST hold a dedicated GitHub Actions workflow,
          `.github/workflows/demo-integration.yml`, that runs the demo integration
          tests.
        rationale: >-
          One workflow of its own gives the demo integration tests one place to run and
          one result on each PR, apart from the linting and unit-test pipeline.

      - id: DEMOCI-02-019
        priority: MUST_NOT
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo integration workflow MUST NOT be merged into python-app.yml.
        rationale: >-
          A separate workflow keeps the Docker Compose build time out of the existing
          linting and unit-test pipeline, and lets the two workflows run at the same
          time on a PR.
        relationships:
          - rel_type: derives_from
            spec_id: DEMOCI-02-001

      - id: DEMOCI-02-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo workflow MUST trigger on pull_request events targeting the
          main branch, on push events to the main branch (see DEMOCI-05), and
          on workflow_dispatch events.
        rationale: >-
          The pull_request trigger validates the ephemeral merge commit before
          a PR lands. The push-to-main trigger validates the actual merged
          main HEAD after a PR lands, closing the "green PRs, red main" gap
          where two individually-green PRs interact to break main with no
          post-merge signal (see DEMOCI-05).

      - id: DEMOCI-02-003
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Both the pull_request and push triggers MUST include the same paths
          filter, covering: vultron/** (excluding vultron/metadata/** and
          vultron/bt/**), docker/**, integration_tests/**, test/ci/**,
          pyproject.toml, uv.lock,
          .github/workflows/demo-integration.yml,
          .github/actions/build-demo-images/**, .github/scripts/retry.sh,
          and .github/demo-scenarios.json.
        rationale: >-
          These files can change the behavior of the demo containers, or the invariant
          checks that examine them. The filter skips the workflow when a change is only
          to docs or specs. The push filter and the pull_request filter must be the
          same, so that main checks every change that the pull request checked.
          `vultron/metadata/**` contains only tooling, which the actor services and the
          demo runner never import. `vultron/bt/**` is the legacy simulator. Only the
          `vultrabot` group in `vultron/demo/cli/vultrabot_commands.py` imports it
          (`test/architecture/test_demo_no_bt_imports.py`), and no CI scenario runs that
          group. The workflow file, the shared build action and the retry helper that
          the invariant job sources are in the filter, so a change to any of them runs
          the workflow. The CI matrix comes from
          `.github/demo-scenarios.json` (DEMOCI-06-004). Scenario code is already under
          `vultron/**`. The file is generated from the scenario registry (DEMOCI-11-004,
          DEMOCI-11-005), so a change to which scenarios run also changes the file, and
          the filter on it runs the workflow.

      - id: DEMOCI-02-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo workflow job MUST be skipped for Dependabot pull requests,
          detected via the condition
          `if: "!startsWith(github.head_ref, 'dependabot/')"`.
        rationale: >-
          Dependabot PRs arrive in waves (e.g., weekly dependency bumps) and
          are unlikely to break the demo; running the full container stack on
          each one wastes CI resources. The python-app.yml test suite still
          guards against broken dependencies on Dependabot PRs — which holds
          only because its path filter includes `uv.lock` (DEMOCI-02-016).

      - id: DEMOCI-02-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo workflow MUST build the Docker images using
          docker/docker-compose-multi-actor.yml and run the rv demo
          scenario (DEMO=rv) as the initial CI scenario.
        rationale: >-
          The multi-actor compose file starts the actor containers that the demos need.
          The `rv` scenario is the simplest scenario with two actors, so it gives a
          baseline that other scenarios add to (DEMOCI-03-001).

      - id: DEMOCI-02-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Demo failure MUST be detected via the exit code of the demo-runner
          container, using the docker compose flag
          `--abort-on-container-exit --exit-code-from demo-runner`.
        rationale: >-
          The exit status of the demo-runner container is the result of the demo
          (DEMOCI-01-001). Without these flags, `docker compose` keeps the other
          containers running after the demo ends, and its own exit status does not show
          if the demo failed.

      - id: DEMOCI-02-007
        priority: SHOULD
        kind: project
        statement: The workflow SHOULD use Docker layer caching to avoid rebuilding unchanged dependency layers on every run.
        rationale: >-
          A demo job builds several images. Layer caching can make the build shorter
          when only the source code changed. GitHub gives the cache tokens
          (`ACTIONS_RUNTIME_TOKEN`, `ACTIONS_CACHE_URL`) only to `uses:` steps, not to
          `run:` steps in a composite action. Thus a cache export must run in a `uses:`
          step.

      - id: DEMOCI-02-008
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The workflow MUST upload all container logs as a CI artifact when the demo job
          fails or is cancelled.
        rationale: >-
          Container logs are diagnostic data, so they are necessary only when a job does
          not pass. A job can be cancelled when a container stops responding and the job
          reaches its timeout. If the workflow does not collect the logs on that path,
          nobody can find the cause of the hang.

      - id: DEMOCI-02-020
        priority: MUST_NOT
        kind: project
        verification_debt: '#2573'
        statement: >-
          The workflow MUST NOT upload container logs when the demo job succeeds.
        rationale: >-
          When the job passes, the logs only add artifacts that nobody reads.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-02-008

      - id: DEMOCI-02-009
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo workflow job MUST have a timeout of 15 minutes
          (timeout-minutes: 15).
        rationale: >-
          The rv demo currently takes 3–5 minutes; a 15-minute cap
          prevents an indefinite CI hang if a container gets stuck, while
          providing sufficient headroom for slow runners.

      - id: DEMOCI-02-010
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The workflow MUST include a teardown step that runs
          `docker compose down -v` after the demo job (success or failure)
          to release Docker volumes and stop all containers.
        rationale: >-
          GitHub Actions self-hosted runners and persistent environments
          accumulate stale Docker state if teardown is skipped.

      - id: DEMOCI-02-011
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo-integration.yml workflow MUST define a `concurrency` group
          keyed on `${{ github.workflow }}-${{ github.ref }}`.
        rationale: >-
          When commits land quickly during iterative work, queued demo runs
          pile up and waste CI minutes while delaying feedback. A single
          concurrency group keyed on workflow + ref collapses bursts on any
          branch to the newest run. On main a 60-second debounce step
          (DEMOCI-02-014) throttles burst merges without requiring per-commit
          granularity — a time-range bisect across a typical 4–6 PR batch is
          sufficient to identify regressions.
        adr:
          - ADR-0052

      - id: DEMOCI-02-013
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The concurrency group MUST set `cancel-in-progress: true` on all
          triggers so that a newer push always cancels superseded in-progress
          and queued runs.
        rationale: >-
          Cancelling superseded runs reclaims CI minutes and reduces feedback
          latency on both PR branches and main. Burst-merge throttling on main
          is handled by the debounce action (DEMOCI-02-014) rather than by
          suppressing cancellation.
        adr:
          - ADR-0052

      - id: DEMOCI-02-014
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `.github/actions/debounce-main-push` composite action MUST be
          invoked immediately after `actions/checkout` in each job that
          performs expensive work (the `scenarios` job in demo-integration.yml,
          and each stage-1 job in python-app.yml). The action sleeps
          60 seconds only when `github.event_name == 'push'` and
          `github.ref == 'refs/heads/main'`; PR and `workflow_dispatch` runs
          are unaffected.
        rationale: >-
          With `cancel-in-progress: true` on all triggers, a burst of merges
          to main would each spin up a full runner fleet and immediately cancel
          the previous one, leaving only the last at full cost. The sleep
          ensures that rapid successive pushes cancel each other before any
          real work starts, so only the last commit in a burst actually pays
          the full suite cost. The guard on `github.ref` prevents the sleep
          from ever firing on PR or dispatch runs.
        adr:
          - ADR-0052

      - id: DEMOCI-02-015
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `cancel-in-progress` field MUST be the boolean literal `true`
          (not an expression). Per-trigger differentiation is handled by the
          debounce action (DEMOCI-02-014), not by the concurrency block.
        rationale: >-
          Using a literal avoids the maintenance burden and reader confusion of
          an inline expression. The debounce step is the single place that
          encodes push-to-main throttling logic.
        adr:
          - ADR-0052
        see_also:
          - spec_id: DEMOCI-02-014
            reason: 'context for the reader'

      - id: DEMOCI-02-012
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `docker compose down` teardown step MUST specify a per-container
          stop grace period of no more than 30 seconds (e.g. `--timeout 30`).
          Docker's default 10-second SIGTERM window followed by unbounded SIGKILL
          retries is not sufficient when a vendor container wedges; without an
          explicit cap, `compose down` can consume the remaining CI job budget.
        rationale: >-
          A container that stops responding can ignore SIGTERM. Without a stop limit,
          `compose down` can use the remaining time of the CI job. A 30-second limit
          for each container puts a bound on the teardown time. It also gives a
          container that operates correctly time to write its state before SIGKILL.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-02-010

      - id: DEMOCI-02-016
        priority: MUST
        kind: project
        statement: >-
          Both the push and pull_request triggers of
          `.github/workflows/python-app.yml` MUST include `uv.lock` in their
          paths filter.
        rationale: >-
          DEMOCI-02-004 skips the demo workflow on Dependabot pull requests because
          python-app.yml still tests them. A Dependabot update inside an existing
          version range changes only `uv.lock`. If `uv.lock` is not in the path filter,
          that update can merge with no test run at all.
        verification: >-
          `test/ci/test_python_app_path_filter.py` asserts `uv.lock` is in both
          path filters.

      - id: DEMOCI-02-021
        priority: MUST
        kind: project
        statement: >-
          Both the push and pull_request triggers of
          `.github/workflows/python-app.yml` MUST include
          `docs/reference/examples/**` in their paths filter.
        rationale: >-
          The committed vocab examples under `docs/reference/examples/` are an input
          to `test/architecture/test_vocab_examples_current.py`, which compares each
          one byte for byte with a fresh generation. They are the only such input
          that lives outside `vultron/` and `test/`, so without this entry a pull
          request that hand-edits or half-regenerates an example and nothing else
          matches no path filter and runs no test at all — the same failure mode
          DEMOCI-02-016 exists to prevent for `uv.lock` (#4506, #5776).
        verification: >-
          `test/ci/test_python_app_path_filter.py::test_python_app_workflow_runs_on_a_committed_example_change`
          asserts `docs/reference/examples/**` is in both path filters.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-02-016

      - id: DEMOCI-02-017
        priority: MUST
        kind: process
        statement: >-
          The step of the demo job that runs the demo MUST have its own
          `timeout-minutes`, at least 5 minutes shorter than the job timeout
          (DEMOCI-02-009).
        rationale: >-
          A job can reach its 15-minute cap after the demo passed, when the runner hangs
          in a post step that runs no project code. With a shorter bound on the
          demo step, a hung demo fails in that step, and a job that reaches the cap
          with the demo step green has hung after the demo. The difference also leaves
          time to collect the logs of a hung demo.
        verification: >-
          `test/ci/test_demo_integration_flake_guards.py::test_demo_step_has_a_bound_shorter_than_the_job_cap`.
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-02-009

      - id: DEMOCI-02-018
        priority: MUST
        kind: process
        statement: >-
          The demo image build MUST pull its Docker Hub images through a public
          registry mirror that needs no credential.
        rationale: >-
          Anonymous Docker Hub pulls share a quota per runner. When the quota is
          spent, the build fails with `429 Too Many Requests` before any project code
          runs, and a pull request goes red for a reason outside its diff. A
          login would need a secret, which a fork pull request does not get.
        verification: >-
          `test/ci/test_demo_integration_flake_guards.py` asserts the BuildKit
          registry mirror and builder image, and that the build action has no login.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-02-005

  - id: DEMOCI-03
    title: Extensibility for Additional Demo Scenarios
    specs:
      - id: DEMOCI-03-001
        priority: SHOULD
        kind: project
        statement: >-
          The demo workflow SHOULD be extended to include additional demo
          scenarios (e.g., three-actor, multi-vendor) as each scenario
          reaches a stable, reproducible state.
        rationale: >-
          Starting with the rv scenario lets CI run reliably while
          more complex scenarios are still being developed. Additional
          scenarios add coverage without blocking CI on unstable demos.

      - id: DEMOCI-03-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          When a new demo scenario is added to the codebase, it MUST be registered in
          the scenario registry in the same PR. The generated
          `.github/demo-scenarios.json` then includes it in the demo-integration.yml
          matrix (DEMOCI-11-001, DEMOCI-11-004).
        rationale: >-
          A scenario that CI does not run can stop working, and nobody sees it until a
          person runs the demo. The CI matrix is generated from the registry, so
          registration in the same pull request as the scenario gives the scenario a
          matrix entry when it merges.
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-11-001
        see_also:
          - spec_id: DEMOCI-11-004
            reason: 'context for the reader'

      - id: DEMOCI-03-003
        priority: SHOULD
        kind: project
        statement: >-
          Each demo scenario added to CI SHOULD be run as a separate job
          (or matrix entry) so that failures are independently reported and
          one scenario failure does not prevent other scenarios from running.
        rationale: >-
          When all scenarios run in one job, the first failure can stop the other
          scenarios, and the result does not show which scenario failed. A separate job
          or matrix entry for each scenario gives each scenario its own result. One
          failure then does not hide the results of the other scenarios.

      - id: DEMOCI-03-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Each registered scenario MUST run as its own entry of the `demo` job matrix in
          `demo-integration.yml`, with no edit to the workflow for that scenario.
        rationale: >-
          Parallel matrix entries keep the wall-clock time of CI bounded as scenarios
          are added, and give each scenario its own result. The `scenarios` job builds
          the matrix from the generated `.github/demo-scenarios.json` (DEMOCI-11-004).
          Registration with `@scenario` in the same PR (DEMOCI-03-002) is thus the only
          step that a new scenario needs (ADR-0098).
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-03-003
        adr:
          - ADR-0098

      - id: DEMOCI-03-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `demo` job of `demo-integration.yml` MUST run each matrix entry with
          `--abort-on-container-exit --exit-code-from demo-runner` (DEMOCI-02-006),
          `timeout-minutes: 15` (DEMOCI-02-009), and the log-upload and teardown steps
          of DEMOCI-02-008 and DEMOCI-02-010.
        rationale: >-
          One job definition serves every matrix entry, so each scenario gets the same
          failure signal, time limit and cleanup as `rv`. A scenario whose job differed
          could hang past the time limit, or leave its containers running for the next
          job.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-03-004
          - rel_type: refines
            spec_id: DEMOCI-02-006
          - rel_type: refines
            spec_id: DEMOCI-02-008
          - rel_type: refines
            spec_id: DEMOCI-02-009
          - rel_type: refines
            spec_id: DEMOCI-02-010

      - id: DEMOCI-03-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Each matrix entry of the demo CI workflow MUST declare a `test_file` field
          that names the invariant test file of its scenario, such as
          `test/ci/invariants/test_rv_invariants.py`.
        rationale: >-
          An explicit file path makes the link from a scenario to its invariant tests
          declarative and visible in each generated `.github/demo-scenarios.json` entry
          (DEMOCI-11-004), whose `test_file` is derived from the registered scenario
          name (DEMOCI-11-003).
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-03-004

      - id: DEMOCI-03-007
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The case-ledger invariant step MUST run pytest on the `test_file` path of its
          matrix entry, not on the `-m case_ledger_invariants` marker alone.
        rationale: >-
          The marker alone relies on each test file skipping when its devlogs directory
          is absent. That is an implicit, fragile coupling between the state of the
          filesystem and the selection of tests. The explicit path runs exactly the
          tests of the scenario that ran.
        relationships:
          - rel_type: depends_on
            spec_id: DEMOCI-03-005

  - id: DEMOCI-04
    title: Invariant Harness as an Independent CI Gate
    specs:
      - id: DEMOCI-04-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The case-ledger invariant harness for each demo scenario MUST run as
          a separate CI job (distinct from the demo-runner job), so that
          invariant failures produce an independent pass/fail status on the
          pull request that is visible even when the demo job also fails.
        rationale: >-
          When the demo run and the invariant checks are in the same job, a demo
          failure is the first thing a reviewer sees, and an invariant failure in the
          same output is easy to miss. A missing protocol phase can then stay hidden
          through many fix cycles. A separate job gives the invariant checks their own
          status, which a reviewer sees when the demo job also fails.

      - id: DEMOCI-04-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The invariant-harness job MUST declare a `needs:` dependency on the demo job
          of the same scenario matrix entry.
        rationale: >-
          The separate invariant job exists to give a result when the demo fails.
          `needs:` on the demo job makes it start only after the demo uploads its
          artifacts.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-04-001

      - id: DEMOCI-04-010
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The invariant-harness job MUST use `if: always()`, so that it runs whether the
          demo job passed or failed.
        rationale: >-
          Without `if: always()`, a failed demo job skips the invariant job, and the run
          that most needs an invariant result gets none.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-04-002

      - id: DEMOCI-04-011
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The workflow MUST skip the invariant-harness job when the demo job is
          cancelled (DEMOCI-04-007).
        rationale: >-
          A cancelled demo job is a third outcome, apart from pass and fail, and it
          uploads no artifact. An invariant job that ran after a cancellation would fail
          only at `download-artifact`, and report a failure that is not about the
          invariants.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-04-002

      - id: DEMOCI-04-003
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The invariant-harness job MUST download the scenario's case-log
          JSONL artifact produced by the demo job before running pytest, so
          that the harness reads the actual output of the demo run that
          completed in that workflow execution.
        rationale: >-
          The invariant job runs on a different runner from the demo job. The artifact
          is the only path from the output of the demo to the invariant checks. When
          the job uses the artifact from the same workflow run, the checks examine the
          demo output of that run, not an older or a local output.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-04-001

      - id: DEMOCI-04-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Each scenario's invariant test file, such as
          `test/ci/invariants/test_rv_invariants.py`, MUST include an
          expected-semantic-types list that covers every protocol phase the scenario is
          designed to exercise. The list is not limited to the universal phases
          (DEMOMA-16-001) that all scenarios share.
        rationale: >-
          A shared minimal list (validate_report,
          add_participant_status_to_participant, close_case, add_note_to_case,
          engage_case) does not guard against a scenario-specific
          phase (e.g. notes-exchange) regressing silently. Each scenario's
          expected-semantic-types list must reflect what that scenario is designed
          to prove end-to-end.
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOMA-16-001

      - id: DEMOCI-04-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The invariant-harness job MUST NOT run for Dependabot PRs, matching
          the demo job's exclusion (DEMOCI-02-004).
        rationale: >-
          A Dependabot pull request skips the demo job (DEMOCI-02-004), so no case-log
          artifact exists. If the invariant job runs, `actions/download-artifact` fails,
          and each Dependabot pull request shows a failed check that has no relation to
          its change. The requirement is this result, not a specific expression. The
          `scenarios` job applies the exclusion one time (DEMOCI-02-004), and the
          invariant job inherits it through `needs.scenarios.result`. When the check is
          in one place, no copy of it can become different. `always()` alone is not
          sufficient, because it runs the job when an upstream job was skipped
          (DEMOCI-04-006).
        relationships:
          - rel_type: constrains
            spec_id: DEMOCI-04-010
          - rel_type: uses_definition
            spec_id: DEMOCI-02-004

      - id: DEMOCI-04-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The Dependabot exclusion guard for the invariant-harness job MUST be
          enforced such that a bare `always()` condition cannot resurrect the
          job when an upstream job was skipped.
        rationale: >-
          `always()` alone runs the job even when an upstream job was skipped,
          which is exactly the spurious-failure case when Dependabot PRs skip
          the demo job but trigger the invariant-harness job.

      - id: DEMOCI-04-007
        priority: MUST
        kind: project
        statement: >-
          Because the Dependabot exclusion is applied once on the upstream
          `scenarios` job (DEMOCI-02-004, DEMOCI-06-008), the invariant-harness
          `if:` MUST pair `always()` with a check that the scenarios job succeeded
          AND a check that the demo job was not cancelled, i.e.
          `always() && needs.scenarios.result == 'success' &&
          needs.demo.result != 'cancelled'`.
        rationale: >-
          `always()` with the check on the `scenarios` result lets the invariant job run
          after a demo failure, but not when the `scenarios` job was skipped. The check
          on the demo result is for a different case. The concurrency group
          (DEMOCI-02-013) can cancel a push-to-main run before the demo job uploads its
          case-log artifact. Then `download-artifact` (DEMOCI-04-003) fails with
          "Artifact not found", and the cancellation becomes a job failure. The `notify`
          job (CISEC-05-001) then files a `ci:main-failure` issue for a failure that did
          not occur. When the invariant job is skipped after a cancellation, the run has
          no `failure` result, and `notify` leaves the result to the newer run. The pass
          path and the true failure path (DEMOCI-04-010) do not change. Sometimes one
          demo matrix job fails and a newer push then cancels the other matrix jobs.
          GitHub does not document whether the combined `needs.demo.result` is then
          `failure` or `cancelled`. If it is `failure`, the invariant job runs and
          `notify` files an issue, which is correct, because a real failure occurred.
        verification: >-
          The test `test_invariant_harness_skipped_when_demo_cancelled` in
          `test/ci/test_workflow_failure_notification.py` asserts the
          invariant-harness `if:` contains `needs.demo.result != 'cancelled'`.
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-04-011
          - rel_type: refines
            spec_id: CISEC-05-016
        see_also:
          - spec_id: DEMOCI-02-004
            reason: 'a "because" rationale'
          - spec_id: DEMOCI-06-008
            reason: 'a "because" rationale'

      - id: DEMOCI-04-008
        priority: MUST
        kind: process
        statement: >-
          Each attempt of the demo job MUST upload its case-log artifact under a
          name that carries the run attempt number.
        rationale: >-
          A re-run of a failed job uploads a second artifact in the same workflow run.
          With one name for both, the harness of the re-run can download the first
          attempt's log and fail a demo that passed.
        verification: >-
          `test/ci/test_demo_integration_flake_guards.py::test_each_demo_attempt_uploads_its_own_case_log_artifact`.
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-04-003

      - id: DEMOCI-04-009
        priority: MUST
        kind: process
        statement: >-
          The invariant-harness job MUST read the case-log artifact of the
          highest run attempt that is not later than its own.
        rationale: >-
          The highest attempt not later than the harness's own is the demo run the
          harness follows. When only the harness is re-run, the demo keeps the artifact
          of its earlier attempt, so the harness cannot require its own attempt number.
        verification: >-
          `test/ci/test_demo_integration_flake_guards.py::test_harness_picks_the_latest_demo_attempt_at_or_before_its_own`
          runs the harness step against a fake `gh`.
        relationships:
          - rel_type: depends_on
            spec_id: DEMOCI-04-008

  - id: DEMOCI-05
    title: Post-Merge Validation on the Default Branch
    specs:
      - id: DEMOCI-05-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The demo workflow MUST run the full demo + invariant-harness matrix
          against the main branch HEAD on push events to main (path-filtered
          per DEMOCI-02-003), producing a commit status on the merged result.
        rationale: >-
          The pull_request trigger checks only the temporary merge commit of the pull
          request with main at that time. It does not check the result when other pull
          requests merge at about the same time. Two pull requests that each pass alone
          can together break main. The path filter runs the pull_request trigger only
          when a later pull request changes a filtered path, so a broken main can stay
          untested until then. A push-to-main run checks the demos and the invariants
          on main itself after each burst of merges (DEMOCI-05-002).
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-02-002
          - rel_type: uses_definition
            spec_id: DEMOCI-02-003

      - id: DEMOCI-05-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Main-branch demo runs MUST produce a pass/fail signal for each burst
          of merges. A burst is defined as a sequence of merges separated by
          less than the debounce window (60 seconds, per DEMOCI-02-014); only
          the last commit in a burst runs to completion. Per-commit granularity
          on main is not required: a time-range bisect across a typical 4–6 PR
          batch is sufficient to identify regressions.
        rationale: >-
          A full demo run on each merge uses many runners, and in a burst of merges
          most of those runs are cancelled by the next merge. One result for each burst
          gives main a pass or fail signal at a lower cost. A burst is a small number
          of pull requests, so a search across the commits of one burst can still find
          the commit that caused a regression.
        adr:
          - ADR-0052
        relationships:
          - rel_type: supersedes
            spec_id: DEMOCI-05-001
          - rel_type: uses_definition
            spec_id: DEMOCI-02-014

      - id: DEMOCI-05-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The push-to-main trigger MUST carry the same Dependabot exclusion semantics as
          the `pull_request` trigger, where they apply.
        rationale: >-
          Push events to main do not come from `dependabot/` head refs, so the guard
          need not be repeated on the push path. The trigger still must not run a
          Dependabot change that the PR path would refuse.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-05-001

      - id: DEMOCI-05-005
        priority: MUST_NOT
        kind: project
        verification_debt: '#2573'
        statement: >-
          The workflow MUST NOT gate the on-main run behind a `github.head_ref`
          condition that would skip that run entirely.
        rationale: >-
          `github.head_ref` is empty on a push event. The Dependabot guard of
          DEMOCI-02-004 passes on an empty string, but a different condition on
          `github.head_ref` can skip the on-main run with no error. Then main has no
          demo result at all.
        relationships:
          - rel_type: constrains
            spec_id: DEMOCI-05-004

  - id: DEMOCI-06
    title: Demo Scenario Coverage Model — PR Validation Set vs. Full Post-Merge Set
    specs:
      - id: DEMOCI-06-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          A scenario coverage analysis MUST be performed that maps each of the
          demo scenarios to the distinct Vultron protocol phases and
          message-type milestones it exercises, producing a coverage matrix.
        rationale: >-
          The scenarios share common helper phases but each exercises a
          distinct set of protocol phases (e.g. invite_actor_to_case,
          offer_case_participant, accept_invite_actor_to_case). Milestone sets
          were often copied from simpler scenarios and may under-report what a
          scenario actually exercises. A complete per-scenario coverage matrix
          is prerequisite to designing a minimum PR validation set.

      - id: DEMOCI-06-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The scenario coverage analysis MUST inspect the milestone sets that each
          scenario script defines, and not assume that they are complete.
        rationale: >-
          Milestone sets were often copied from simpler scenarios and may under-report
          what a scenario exercises. Only the scripts show what each scenario covers, so
          the coverage matrix is accurate only when it is built from them.

      - id: DEMOCI-06-011
        priority: MAY
        kind: project
        statement: >-
          The scenario coverage analysis MAY update a scenario's milestone set where a
          copy from a simpler scenario has left it incomplete.
        rationale: >-
          An analysis that finds an incomplete set can fix it in place. Then the
          coverage matrix and the scenario agree, and the gap does not stay open for a
          later pass.

      - id: DEMOCI-06-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The validated coverage matrix MUST be recorded in
          `notes/demo-ci-scenario-coverage.md`.
        rationale: >-
          A notes file puts the coverage analysis where scenario authors read it. The
          matrix in the note is a checked copy, not the authority. DEMOCI-06-002 states
          the minimum PR validation set, and the registry declares the scenario set
          (DEMOCI-11-001).

      - id: DEMOCI-06-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The minimum PR validation scenario set is `rv`, `rvcv-handoff`,
          `rcvcv`, `rcv-reject`, `rcv-embargo`, and `rcvv-embargo`. Together
          these scenarios cover all distinct protocol semantic types exercised by
          the full scenario suite: the universal types (DEMOMA-16-001) plus
          `invite_actor_to_case`, `offer_case_participant`,
          `accept_invite_actor_to_case`, `accept_actor_recommendation`,
          `accept_case_ownership_transfer`, `reject_invite_actor_to_case`,
          `invite_to_embargo_on_case`, `accept_invite_to_embargo_on_case`,
          `activate_embargo_on_case`, and `remove_embargo_event_from_case`.
          The `demo-integration.yml` workflow MUST use this scenario set as
          the `pull_request` matrix and run only these scenarios on every PR
          commit.
        rationale: >-
          The invariant jobs start only when every demo job in the set has finished
          (ADR-0052), so each extra scenario can make the wait longer. The minimum set
          keeps every protocol semantic type of the full suite covered, at a lower cost
          for each pull request. `rv` covers the baseline with two actors.
          `rvcv-handoff` adds invite, accept and ownership transfer. `rcvcv` adds
          `offer_case_participant`, `accept_actor_recommendation` and invite and accept
          chains with three or more actors. `rcv-reject` adds
          `reject_invite_actor_to_case`, the only scenario where a Vendor rejects an
          invitation after it enters RM.RECEIVED. `rcv-embargo` and `rcvv-embargo` are
          the only sources of the embargo semantic types, by different paths. The
          coverage matrix is in `notes/demo-ci-scenario-coverage.md`. See ADR-0052.
        adr:
          - ADR-0052
        relationships:
          - rel_type: derives_from
            spec_id: DEMOCI-06-001
          - rel_type: uses_definition
            spec_id: DEMOMA-16-001

      - id: DEMOCI-06-003
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `demo-integration.yml` workflow MUST run the full scenario suite on a
          `push: branches: ["main"]` trigger, whatever subset runs for PR validation.
          The full suite is `rv`, `rvv`, `rvcv-extension`, `rvcv-handoff`,
          `rccv-extension`, `rccv-handoff`, `rcvcv`, `rcv`, `rcv-reject`, `rcv-embargo`
          and `rcvv-embargo`.
        rationale: >-
          The post-merge run is the safety net for cross-PR regressions. It covers all
          scenarios, so every scenario variant keeps giving a case-log invariant signal
          on the default branch, after its phases leave the PR validation set.
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-05-001

      - id: DEMOCI-06-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Per-event scenario selection (DEMOCI-06-002, DEMOCI-06-003) MUST be
          implemented by resolving the matrix before matrix expansion, not by a
          job-level `if:` condition that references the `matrix` context.
        rationale: >-
          GitHub evaluates a job-level `if:` before it expands the matrix, so the
          `matrix` context does not exist at that point. A file that refers to it is
          valid YAML, and `yaml.safe_load` accepts it. But GitHub refuses the whole
          workflow at startup: no jobs start, there are no logs, no annotations and no
          job status, and the run shows the file path in place of the workflow name.
          Almost nothing shows this failure. It can stop the workflow on every branch,
          main included, for many runs before somebody sees it. GitHub reports the
          startup failure before it applies the branch filter. Thus the failure also
          shows on branches that the workflow does not run on, where a reader can ignore
          it. When both matrices come from one JSON file, the `demo` and
          `invariant-harness` jobs also have no copies of the matrix that can become
          different. `actionlint` finds the illegal context reference in CI and in
          pre-commit (DEMOCI-08-001).
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-06-002
          - rel_type: implements
            spec_id: DEMOCI-06-003

      - id: DEMOCI-06-007
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          CI MUST resolve the scenario list from a single declarative file
          (`.github/demo-scenarios.json`), with each entry carrying a boolean
          `full_suite_only` field.
        rationale: >-
          When both matrices come from one file, the PR list and the post-merge list
          cannot become different, and `full_suite_only` is the one control for the
          selection by event. The file is generated from the scenario registry
          (DEMOCI-11-004), and the demo modules decide which scenarios exist
          (DEMOCI-11-001). This requirement is only about the file that CI reads the
          matrix from. That file must stay committed, because the `scenarios` job has
          no Python.

      - id: DEMOCI-06-008
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          A `scenarios` job MUST filter the scenario list in
          `.github/demo-scenarios.json` according to `github.event_name` and
          expose the result as a JSON job output.
        rationale: >-
          Centralising event-based filtering in a dedicated job ensures both
          downstream jobs consume the same filtered list and removes per-job
          `if:` conditions that would reference the matrix context.

      - id: DEMOCI-06-009
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `demo` and `invariant-harness` jobs MUST derive their matrices
          via `fromJSON()` of the `scenarios` job output.
        rationale: >-
          Using `fromJSON` of a shared upstream output guarantees both jobs
          expand the same scenario set and eliminates verbatim matrix
          duplication that could silently drift.

      - id: DEMOCI-06-010
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          A job-level `if:` condition referencing `matrix.*` MUST NOT be used
          to gate matrix entries.
        rationale: >-
          GitHub evaluates job-level `if:` conditions before expanding the
          matrix, so the `matrix` context is undefined at that point;
          referencing it causes a startup failure with no logs or per-job
          statuses.

  - id: DEMOCI-07
    title: Embargo Lifecycle Scenario CI Registration (rcv-embargo, rcvv-embargo)
    specs:
      - id: DEMOCI-07-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `rcv-embargo` scenario MUST be registered with
          `in_pr_set=True` (DEMOCI-11-001), so that its generated entry in
          `.github/demo-scenarios.json` (DEMOCI-11-004) carries
          `"full_suite_only": false`. The scenario runs on the first Reporter,
          Coordinator and Vendor slots of the fixed cast (DEMOCI-11-021) and
          the `case-actor` service.
        rationale: >-
          The embargo semantic types come only from the embargo scenarios
          (DEMOCI-06-002). In the PR set, `rcv-embargo` checks the embargo lifecycle on
          each pull request. The registry is the authority, and the JSON file is its
          generated copy.
        relationships:
          - rel_type: refines
            spec_id: DEMOMA-20-005
          - rel_type: refines
            spec_id: DEMOCI-11-001
          - rel_type: uses_definition
            spec_id: DEMOCI-11-021
        see_also:
          - spec_id: DEMOCI-11-004
            reason: 'context for the reader'

      - id: DEMOCI-07-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The `test_file` matrix entry for the `rcv-embargo` CI job MUST point
          to `test/ci/invariants/test_rcv_embargo_invariants.py`.
        rationale: >-
          An explicit file path makes the scenario-to-test relationship
          declarative per DEMOCI-03-005. The path is derived from the
          registered name by convention (DEMOCI-11-003) and written into the
          generated `.github/demo-scenarios.json` entry (DEMOCI-11-004).
        lint_suppress:
          - phantom_path_ref

      - id: DEMOCI-07-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The devlogs directory for the `rcv-embargo` CI run MUST use
          scenario-role names: `reporter`, `coordinator`, `vendor`, `case-actor`.
        rationale: >-
          Scenario-role names in devlogs match scenario code and make log
          archaeology easier and consistent with the post-DEMOMA-12 naming
          convention.

      - id: DEMOCI-07-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `rcvv-embargo` scenario MUST be registered with
          `in_pr_set=True` (DEMOCI-11-001), so that its generated entry in
          `.github/demo-scenarios.json` (DEMOCI-11-004) carries
          `"full_suite_only": false`. The scenario runs on the first Reporter,
          Coordinator and Vendor slots of the fixed cast (DEMOCI-11-021), one
          character-actor slot for Vendor2, and the `case-actor` service.
        rationale: >-
          The rcvv-embargo scenario needs a fourth actor beyond the three used
          by rcv-embargo; Vendor2 takes a character-actor slot of the
          multi-actor compose file, which CI starts as a whole. Devlog
          directories keep the scenario's own names (`vendor2`, not the slot
          name), so they name the part an actor plays here and make log
          archaeology easier.
        relationships:
          - rel_type: refines
            spec_id: DEMOMA-21-006
          - rel_type: refines
            spec_id: DEMOCI-11-001
          - rel_type: uses_definition
            spec_id: DEMOCI-11-021
        see_also:
          - spec_id: DEMOCI-11-004
            reason: 'context for the reader'

      - id: DEMOCI-07-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The `test_file` matrix entry for the `rcvv-embargo` CI job MUST point
          to `test/ci/invariants/test_rcvv_embargo_invariants.py`.
        rationale: >-
          An explicit file path makes the scenario-to-test relationship
          declarative per DEMOCI-03-005. The path is derived from the
          registered name by convention (DEMOCI-11-003) and written into the
          generated `.github/demo-scenarios.json` entry (DEMOCI-11-004).
        lint_suppress:
          - phantom_path_ref

      - id: DEMOCI-07-007
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The devlogs directory for the `rcvv-embargo` CI run MUST use
          scenario-role names: `reporter`, `coordinator`, `vendor`, `vendor2`,
          `case-actor`.
        rationale: >-
          Scenario-role names in devlogs match scenario code and make log
          archaeology easier and consistent with the RCVCV pattern
          (DEMOMA-19-007).

      - id: DEMOCI-07-003
        priority: SHOULD
        kind: project
        statement: >-
          A follow-up coverage analysis SHOULD be performed after `rcv-embargo`
          and `rcvv-embargo` are implemented and passing in CI, to evaluate
          whether the minimum PR set defined in DEMOCI-06-002 requires expansion
          to preserve full embargo lifecycle protocol coverage.
        rationale: >-
          The embargo semantic types (`invite_to_embargo_on_case`,
          `accept_invite_to_embargo_on_case`, `activate_embargo_on_case`,
          `remove_embargo_event_from_case`) are produced only by `rcv-embargo`
          and `rcvv-embargo`, so the minimum PR set preserves embargo coverage
          only while at least one of them is a member. The coverage matrix in
          `notes/demo-ci-scenario-coverage.md` is where that membership is
          checked against the harness semantic-type constants.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-06-001
          - rel_type: uses_definition
            spec_id: DEMOCI-06-002

      - id: DEMOCI-07-008
        priority: SHOULD
        kind: project
        tags:
          - ci-cd
          - demo
        statement: >-
          When the follow-up coverage analysis is performed, it SHOULD update
          `notes/demo-ci-scenario-coverage.md`, DEMOCI-06-002, and DEMOCI-06-003 to
          reflect its conclusions.
        rationale: >-
          The analysis findings must be propagated to all three documents so
          that the coverage matrix, minimum PR set, and full scenario suite
          list remain mutually consistent.
        see_also:
          - spec_id: DEMOCI-06-002
            reason: 'context for the reader'
          - spec_id: DEMOCI-06-003
            reason: 'context for the reader'

      - id: DEMOCI-07-009
        priority: SHOULD
        kind: project
        tags:
          - ci-cd
          - demo
        statement: >-
          If the embargo scenarios introduce protocol semantic types not covered
          by `rv`, `rvcv-handoff`, or `rcvcv`, the minimum PR set defined in
          DEMOCI-06-002 MUST be expanded.
        rationale: >-
          No scenario other than `rcv-embargo` and `rcvv-embargo` commits an
          embargo semantic type, so a minimum PR set without them leaves the
          embargo lifecycle unexercised on PRs.
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-06-002

      - id: DEMOCI-07-010
        priority: SHOULD
        kind: project
        tags:
          - ci-cd
          - demo
        statement: >-
          DEMOCI-06-003 SHOULD be updated to include `rcv-embargo` and `rcvv-embargo` in
          the full scenario suite list when they are wired into CI.
        rationale: >-
          DEMOCI-06-003 names the full scenario suite explicitly; once the
          embargo scenarios are wired in, the list must be updated so the
          post-merge validation run is complete.
        see_also:
          - spec_id: DEMOCI-06-003
            reason: 'context for the reader'

  - id: DEMOCI-08
    title: Workflow Static Analysis (actionlint)
    specs:
      - id: DEMOCI-08-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          GitHub Actions workflow files MUST be statically analysed by
          `actionlint` in CI, via a dedicated workflow
          (`.github/workflows/actions-lint.yml`) whose path filter is scoped to
          `.github/**`.
        rationale: >-
          A workflow can be syntactically valid YAML yet be rejected by GitHub
          at startup — the `matrix`-context-in-job-`if:` bug of DEMOCI-06-004 is
          the motivating case. Startup failures produce no logs, no annotations,
          and no job-level statuses, so nothing in the repository's own test or
          lint suite can detect them and the only symptom is a bare red X.
          `actionlint` resolves context availability per field and reports the
          illegal reference as a one-line error with the exact position.

          Pinning by version and checksum keeps CI reproducible and prevents a
          retagged or compromised upstream release from silently altering what
          executes in the pipeline.

      - id: DEMOCI-08-003
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The `actionlint` check MUST NOT be added to `python-app.yml`, whose
          path filter is scoped to `vultron/**` and `test/**` and therefore
          would not trigger on a workflow-only change.
        rationale: >-
          A workflow-only change (touching only `.github/**`) would not match
          `python-app.yml`'s path filter, so placing `actionlint` there would
          leave workflow changes unchecked.

      - id: DEMOCI-08-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          `actionlint` MUST be registered as a pre-commit hook so that workflow
          errors are caught before push.
        rationale: >-
          A pre-commit hook catches the illegal context reference before it
          reaches CI, closing the feedback loop that otherwise requires a push
          and a CI run to surface the error.

      - id: DEMOCI-08-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: The `actionlint` version used in CI MUST be pinned.
        rationale: >-
          Pinning by version keeps CI reproducible and prevents a retagged
          upstream release from silently altering what executes in the pipeline.

      - id: DEMOCI-08-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The CI download of `actionlint` MUST be verified against a pinned
          SHA256 checksum.
        rationale: >-
          A checksum verification prevents a compromised upstream release from
          silently altering what executes in the pipeline.

      - id: DEMOCI-08-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `actions-lint.yml` workflow MUST verify that
          `.github/demo-scenarios.json` is a non-empty array.
        rationale: >-
          The matrix is data, not inline YAML, so an error in it causes no YAML error.
          An empty array gives the `scenarios` job no scenario to run, and that job then
          fails on every pull request and on every push to main, far from the change
          that caused it. This check finds an empty array in the change that caused it,
          before any demo runs.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-08-001

      - id: DEMOCI-08-007
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The `actions-lint.yml` workflow MUST verify that every entry in
          `.github/demo-scenarios.json` has a non-empty string `demo` field, a
          non-empty string `test_file` field, and a boolean (not string)
          `full_suite_only` field.
        rationale: >-
          A missing `test_file` key expands into a job that runs `pytest ""`;
          a string `"false"` is truthy to `jq` and would drop a scenario from
          the PR set.

      - id: DEMOCI-08-008
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The `actions-lint.yml` workflow MUST verify that no `demo` name is
          duplicated in `.github/demo-scenarios.json`.
        rationale: >-
          A duplicated `demo` name collides on the upload-artifact name and
          one scenario's logs overwrite the other's.

      - id: DEMOCI-08-009
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The `actions-lint.yml` workflow MUST verify that at least one entry
          in `.github/demo-scenarios.json` has `full_suite_only: false`.
        rationale: >-
          An empty PR validation set would let `pull_request` runs report a
          vacuous success with zero scenarios executed — the same false-green
          class of failure that DEMOCI-06-004 exists to prevent.

      - id: DEMOCI-08-010
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The `actions-lint.yml` workflow MUST verify that every `test_file`
          path referenced in `.github/demo-scenarios.json` exists in the
          repository.
        rationale: >-
          A non-existent `test_file` path should be caught at schema-validation
          time rather than 15 minutes into a demo run.

  - id: DEMOCI-09
    title: Integration Branch Support
    specs:
      - id: DEMOCI-09-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `workflow_dispatch` trigger in `demo-integration.yml` MUST declare an
          optional `ref` input of `type: string` with an empty default. Its description
          says that it accepts a branch, tag or SHA to check out before the full demo
          suite runs.
        rationale: >-
          When related bug-fix PRs land on a shared integration branch (e.g.
          `fix/demo-ci`), the full demo suite must run against that branch without a
          dummy PR to `main`. A `workflow_dispatch` `ref` input starts that run with one
          click in the GitHub UI.

      - id: DEMOCI-09-003
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          All three `actions/checkout` steps of the workflow, in the `scenarios`, `demo`
          and `invariant-harness` jobs, MUST pass `ref: ${{ inputs.ref || github.ref }}`
          unconditionally.
        rationale: >-
          When `inputs.ref` is set, the suite runs against that ref. When it is empty or
          absent, as on every event other than `workflow_dispatch`, the expression falls
          through to `github.ref`. A conditional `if: inputs.ref != ''` guard instead
          would break the normal checkout with no error.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-09-001
      - id: DEMOCI-09-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          An integration branch such as `fix/demo-ci` is done when it has merged to
          `main` and all its child issues are closed. A maintainer MUST then remove its
          name from the `pull_request` and `push` trigger `branches:` arrays in
          `demo-integration.yml`.
        rationale: >-
          Stale branch entries in trigger arrays are dead configuration: the branch no
          longer exists, so the entries neither fire nor document anything. They can
          confuse a future maintainer about which branches are real targets.

      - id: DEMOCI-09-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          When a maintainer removes an integration branch's name from those trigger
          arrays, the maintainer MUST also remove each `# remove when merged` comment
          that names the branch.
        rationale: >-
          A comment that names a branch the triggers no longer list is as stale as the
          entry itself. Removing both at once keeps the trigger configuration consistent
          with the life of the integration branch.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-09-002

  - id: DEMOCI-10
    title: Case-Ledger Artifact Availability on Failure
    specs:
      - id: DEMOCI-10-001
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          Every demo scenario MUST export its case ledgers from a code path that runs
          whether or not its phases succeed. The shared scenario harness does so on both
          its exception path and its success path (DEMOMA-23-001).
        rationale: >-
          `demo_check` and `demo_step` record failures and do not raise. Thus an
          exception that leaves a scenario is a serious failure, and those runs need the
          ledgers most. A dump placed only after the last phase is skipped by such an
          exception, and the run uploads no ledger when it is most necessary.

      - id: DEMOCI-10-002
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The case-ledger dump MUST always write a `dump-manifest.json` under
          `devlogs/<demo-name>/`, even when it captured no ledgers at all.
        rationale: >-
          The `upload-artifact` step and the download of the `invariant-harness` job
          both need the artifact to exist. An always-present manifest makes the download
          succeed, and turns "nothing was uploaded" into a machine-readable statement of
          which actors were missing and why. The invariant harness can then report a
          real result instead of a download error.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-10-001

      - id: DEMOCI-10-015
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `dump-manifest.json` MUST record `demoName`, `caseId`, `ledgerFileCount`,
          `targetCount`, an optional top-level `reason`, and one `actors[]` entry per
          dump target. Each `actors[]` entry carries `actorName`, `routeKey`,
          `captured`, `entryCount`, `ledgerFile` and `reason`.
        rationale: >-
          The per-actor `reason` tells a dump that timed out apart from a scenario that
          never started. A timed-out dump records the error in the actor's `reason` with
          `captured: false`, while a pre-run CI sentinel (DEMOCI-10-006) records an
          empty `actors` array.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-10-002

      - id: DEMOCI-10-016
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The `dump-manifest.json` MUST record an `unreplicatedActors[]` list, empty when
          there is none. It holds one `{actorName, routeKey}` entry for each actor that
          acted in the case but holds no ledger replica to dump.
        rationale: >-
          An actor with no replica has no ledger file to name it. The list lets the
          invariant harness resolve the entries of that actor to a name (DEMOMA-22-005).
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-10-002

      - id: DEMOCI-10-003
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          `test/ci/invariants/common.py::load_devlogs()` MUST fail — not skip
          — when a `dump-manifest.json` is present under the scenario's devlogs
          directory but no `*-case-ledger.jsonl` file exists.
        rationale: >-
          For a developer who did not run the demo, no data means nothing to check, and
          a skip is correct. In CI, no data means that the scenario stopped. The
          manifest shows which of the two cases applies. Without this rule, the harness
          can pass for a scenario that wrote no ledger.
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-10-002

      - id: DEMOCI-10-008
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          `test/ci/invariants/common.py::load_devlogs()` MUST fail when a
          `dump-manifest.json` is present under the scenario's devlogs directory
          but is unparseable.
        rationale: >-
          An unparseable manifest indicates data corruption during the CI run;
          failing loudly surfaces this as a real harness error rather than a
          silent skip.

      - id: DEMOCI-10-009
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          `test/ci/invariants/common.py::load_devlogs()` MUST skip only when
          there is no evidence the demo ran: no `devlogs/` directory, no scenario
          sub-directory, or neither ledger files nor a manifest.
        rationale: >-
          Skipping is appropriate only when a developer has not run the demo
          locally; the manifest distinguishes that case from a CI run that
          produced no artifacts.

      - id: DEMOCI-10-004
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          A failure inside the case-ledger dump MUST NOT replace the exception
          that ended the scenario.
        rationale: >-
          The dump runs on the failure path, when the system already has a fault, so
          the dump can also fail. If the dump error replaces the first exception, the
          run keeps its artifacts but loses the cause of the failure. The cause is the
          information that the dump on the failure path is there to keep.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-10-001

      - id: DEMOCI-10-010
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          When the case-ledger dump fails, it MUST record its own failure
          through the accumulator and the manifest.
        rationale: >-
          Recording dump failures in the manifest makes them machine-readable
          and distinguishable from a scenario that never started.

      - id: DEMOCI-10-011
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          When the case-ledger dump fails, the original scenario exception MUST
          propagate unchanged.
        rationale: >-
          Propagating the original exception unchanged ensures the root-cause
          diagnosis is not replaced by a secondary dump failure.

      - id: DEMOCI-10-005
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The invariant-harness pytest session MUST exit non-zero when every collected
          test was skipped.
        rationale: >-
          When devlogs or a scenario directory are missing, `load_devlogs()` calls
          `pytest.skip()` in a fixture, and every test in the file skips. By default,
          pytest then exits with zero, and CI shows the invariant job as passed although
          it checked no invariant.

      - id: DEMOCI-10-017
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          A `pytest_sessionfinish` hook in `test/ci/invariants/conftest.py` MUST set
          `session.exitstatus = 1` when at least one test was reported and every
          reported outcome was `"skipped"`.
        rationale: >-
          The hook turns the empty pass of DEMOCI-10-005 into a failure. It acts only
          when some test was reported, so a session with no test at all keeps the exit
          status that pytest gives it.
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-10-005

      - id: DEMOCI-10-006
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          The CI demo job MUST write a pre-run sentinel `dump-manifest.json`
          under `devlogs/<demo-name>/` before it builds the demo images and
          launches the demo-runner container.
        rationale: >-
          `scenario_harness()` only runs when the demo-runner container starts
          and the scenario module imports successfully. Docker startup failures,
          import errors, and health-check `sys.exit(1)` calls all exit before
          `scenario_harness()` is entered, leaving `devlogs/<demo>/` empty.
          The `upload-artifact` step then publishes nothing, the
          `download-artifact` step fails with "Artifact not found", and the
          invariant-harness job reports a plumbing error instead of an invariant
          result. The sentinel step closes this gap: the artifact directory is
          non-empty regardless of how early the runner exits, so the download
          succeeds and `load_devlogs()` reports a real failure via the
          manifest-without-ledgers path (DEMOCI-10-003). Writing it before the
          image build covers a failed build too, so every attempt uploads its own
          artifact (DEMOCI-04-008).
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-10-002

      - id: DEMOCI-10-012
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          The pre-run sentinel `dump-manifest.json` MUST conform to the DEMOCI-10-015
          and DEMOCI-10-016 schema. It holds `caseId: null`, `ledgerFileCount: 0`,
          `targetCount: 0` and a `reason` string saying that the demo-runner has not
          started.
        rationale: >-
          The sentinel must be schema-conformant so the invariant-harness job
          can parse and interpret it via the manifest-without-ledgers path
          (DEMOCI-10-003).
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-10-015
          - rel_type: uses_definition
            spec_id: DEMOCI-10-016

      - id: DEMOCI-10-013
        priority: MUST
        kind: project
        verification_debt: '#2573'
        tags:
          - ci-cd
          - demo
        statement: >-
          When the demo-runner reaches `scenario_harness()`, the harness MUST
          overwrite the pre-run sentinel with the real dump manifest.
        rationale: >-
          Overwriting the sentinel ensures that a successful run does not leave
          misleading pre-run metadata as the artifact for the invariant-harness
          job to read.

      - id: DEMOCI-10-007
        priority: MUST
        kind: project
        verification_debt: '#2573'
        statement: >-
          When a `dump-manifest.json` under the scenario's devlogs directory has a
          non-null `caseId`, `test/ci/invariants/common.py::load_devlogs()` MUST return
          only the ledger entries whose `case_id` matches it.
        rationale: >-
          Local demo runs can leave JSONL files for different cases in the same
          `devlogs/` directory. Without a filter on the case, `load_devlogs()` joins
          them, and `test_invariant_1_local_hash_chain_consistent` reports `prevLogHash`
          mismatches that are not real. DEMOCI-10-015 makes the manifest record
          `caseId`, so `load_devlogs()` can keep only the entries of this run.
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-10-015

      - id: DEMOCI-10-014
        priority: MUST
        kind: project
        tags:
          - ci-cd
          - demo
        statement: >-
          When `test/ci/invariants/common.py::load_devlogs()` fails because a
          `dump-manifest.json` is present but no ledger files are, its failure message
          MUST name the layer that failed.
        rationale: >-
          A demo that stopped early still fails the harness (DEMOCI-10-003). But a
          message that calls an upstream demo fault "a real invariant failure" sends the
          person who examines it to the ledger, when the run tested nothing about the
          ledger. The manifest already holds the information that tells the cases apart
          (DEMOCI-10-015, DEMOCI-10-012).
        verification: >-
          `test/ci/invariants/test_common.py::TestLoadDevlogsManifestHandling` —
          `test_upstream_abort_is_not_called_a_real_invariant_failure`,
          `test_crashed_dump_is_not_called_an_upstream_abort_or_an_invariant_failure`
          and `test_missing_ledgers_for_an_existing_case_stay_a_real_invariant_failure`
          each assert the layer that the message names.
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-10-003

      - id: DEMOCI-10-018
        priority: MUST
        kind: project
        tags:
          - ci-cd
          - demo
        statement: >-
          For an upstream abort, the `load_devlogs()` message MUST say that the ledger
          invariants were not exercised and point at the demo-integration job for the
          cause. An upstream abort is a run whose every manifest records `caseId: null`
          and `targetCount: 0` with a reason other than the harness's crashed-dump
          backstop reason.
        rationale: >-
          Such a run aborted before a case existed, or wrote only the pre-run sentinel.
          The cause is in the demo job, so the message sends the reader there and not to
          the ledger.
        verification: >-
          `test/ci/invariants/test_common.py::TestLoadDevlogsManifestHandling::test_upstream_abort_is_not_called_a_real_invariant_failure`.
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-10-014

      - id: DEMOCI-10-019
        priority: MUST
        kind: project
        tags:
          - ci-cd
          - demo
        statement: >-
          For a manifest with the crashed-dump reason, the `load_devlogs()` message MUST
          say that the dump raised and that it is unknown whether a case existed.
        rationale: >-
          A dump that raised leaves no record of the case. The message states only what
          the manifest supports, and does not call the run an upstream abort or an
          invariant failure.
        verification: >-
          `test/ci/invariants/test_common.py::TestLoadDevlogsManifestHandling::test_crashed_dump_is_not_called_an_upstream_abort_or_an_invariant_failure`.
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-10-014

      - id: DEMOCI-10-020
        priority: MAY
        kind: project
        tags:
          - ci-cd
          - demo
        statement: >-
          Only when a manifest names a case MAY the `load_devlogs()` failure message call
          the outcome a ledger invariant failure.
        rationale: >-
          A manifest that names a case shows that the case existed and the dump ran, so
          missing ledgers then are a fault of the ledger layer.
        verification: >-
          `test/ci/invariants/test_common.py::TestLoadDevlogsManifestHandling::test_missing_ledgers_for_an_existing_case_stay_a_real_invariant_failure`.
        relationships:
          - rel_type: constrains
            spec_id: DEMOCI-10-014

  - id: DEMOCI-11
    title: Demo Scenario Registry and Derived Artifacts
    description: >-
      Requirements for the self-registering demo scenario registry introduced by
      ADR-0098. The scenario set was previously restated by hand in eight-plus
      places with nothing enforcing agreement, and had already drifted: a
      documented `vc` sub-command named a demo script that never existed. These
      requirements make the demo modules the sole declaration point and every
      scenario table a derived artifact.
    specs:
      - id: DEMOCI-11-001
        priority: MUST
        kind: project
        statement: >-
          Each demo scenario module or package under `vultron/demo/scenario/` MUST
          declare itself to the scenario registry at import time.
        rationale: >-
          Only the demo module can know that the demo exists. A declaration in the
          module itself cannot be left out when a new module is written, and a module
          that omits it shows as a scenario on disk that the registry lacks. A
          scenario that outgrows one file becomes a package, and the package is
          still the one place that knows the scenario exists.
        verification: >-
          `test/demo_unit/test_scenario_registry.py::test_registry_matches_modules_on_disk`
          asserts that the registered scenario set equals the set of `*_demo.py`
          modules and `*_demo/` packages in `vultron/demo/scenario/`, so a module or
          package that omits the declaration fails.
          `test/demo_unit/test_scenario_registry_package.py::test_a_package_scenario_registers_end_to_end`
          registers a package scenario whose `main()` is declared in a submodule.
        adr:
          - ADR-0098

      - id: DEMOCI-11-036
        priority: MUST
        kind: project
        statement: >-
          The scenario registry MUST be the only place that declares the set of
          implemented demo scenarios.
        rationale: >-
          Any separate list, such as a data file, an import list or a documentation
          table, can leave out a scenario or name one that does not exist, and nothing
          fails. When every list is generated from the registry, they cannot disagree.
        verification: >-
          `test/metadata/test_demo_scenario_artifacts.py::test_committed_artifacts_are_in_sync`
          fails when a committed scenario artifact differs from what the registry
          generates, and
          `test/demo_unit/test_scenario_cli_factory.py::test_registry_is_the_only_source_of_scenario_subcommands`
          fails when the CLI declares a scenario that the registry does not.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-001

      - id: DEMOCI-11-037
        priority: MUST_NOT
        kind: project
        statement: >-
          This codebase MUST NOT register a scenario that is specified but not yet
          built. Its spec group and the planned-scenario register declare it instead
          (DEMOCI-11-010).
        rationale: >-
          A specified scenario that is not built is a normal state. A list cannot show
          the difference between that state and an available scenario unless the
          registry holds only the built scenarios.
        verification: >-
          `test/metadata/test_demo_scenario_consistency.py::test_partition_holds_on_the_committed_tree`
          and `test_partition_reports_a_scenario_in_both_registers` fail when a scenario
          is both registered and in the planned register.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-001
          - rel_type: derives_from
            spec_id: DEMOCI-11-010

      - id: DEMOCI-11-002
        priority: MUST
        kind: project
        statement: >-
          Registry discovery MUST enumerate the scenario package with a `pkgutil`-style
          walk of `vultron/demo/scenario/` that returns each `*_demo` module and each
          `*_demo` package.
        rationale: >-
          Import-time registration observes only the modules that were imported. A walk
          of the package imports every module, so a new demo registers without any other
          edit. A scenario can be a package, and a walk that skipped packages would hide
          it.
        verification: >-
          `test/demo_unit/test_scenario_registry.py::test_discovery_walks_the_package`,
          and the set-equality test of DEMOCI-11-001, fail when discovery misses a
          module or a package.
          `test/demo_unit/test_scenario_registry_package.py::test_a_package_scenario_registers_end_to_end`
          fails when discovery skips a package.
        adr:
          - ADR-0098
        relationships:
          - rel_type: depends_on
            spec_id: DEMOCI-11-001

      - id: DEMOCI-11-038
        priority: MUST_NOT
        kind: project
        statement: >-
          Registry discovery MUST NOT rely on a hand-maintained list of imports.
        rationale: >-
          A hand-written import list brings back the silent omission that the registry
          exists to remove: the new demo is written, nobody adds it to the list, and
          every generated table looks complete and is wrong. The AS2 vocabulary registry
          has the same discovery hazard.
        verification: >-
          `test/demo_unit/test_scenario_registry.py::test_no_hand_maintained_import_list`
          asserts that no hand-maintained import list governs discovery.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-002

      - id: DEMOCI-11-003
        priority: MUST
        kind: project
        statement: >-
          The scenario registry MUST derive a scenario's demo script, invariant harness
          and narrative page paths from its registered name, and store none of them. The
          paths are `vultron/demo/scenario/<name_>_demo.py` or the package
          `vultron/demo/scenario/<name_>_demo/`,
          `test/ci/invariants/test_<name_>_invariants.py` and
          `docs/topics/scenarios/<name>.md`, where `<name_>` replaces hyphens with
          underscores.
        rationale: >-
          A stored path can be wrong about itself; a derived path either resolves
          or fails a check. Every registered scenario satisfies all three
          conventions, so no exception list is required, and introducing an
          override field would re-open the drift channel for every scenario
          rather than one. A scenario longer than one module can hold (CS-18-001)
          becomes a package of the same name, so its demo path is the module or the
          package, whichever exists, and the name alone still finds it.
        verification: >-
          `test/demo_unit/test_scenario_registry.py::test_derived_paths_resolve`
          asserts each registered scenario's three derived paths resolve on disk.
          `test/demo_unit/test_scenario_registry_package.py::test_a_package_scenario_registers_end_to_end`
          asserts a package scenario's derived paths resolve, and
          `test_both_forms_of_one_name_are_refused` fails when one name is both a
          module and a package.
        adr:
          - ADR-0098

      - id: DEMOCI-11-004
        priority: MUST
        kind: project
        statement: >-
          `.github/demo-scenarios.json` MUST be generated from the scenario registry.
        rationale: >-
          A hand-kept matrix file can disagree with the registry, and a scenario then
          runs in CI under a wrong name or not at all. A generated file, gated by its
          check mode (DEMOCI-11-005), always matches the registry.
        verification: >-
          The dumper's check mode fails when the committed JSON does not match the
          registry
          (`test/metadata/test_demo_scenario_artifacts.py::test_matrix_json_is_the_committed_projection_of_the_registry`).
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-06-007

      - id: DEMOCI-11-039
        priority: MUST
        kind: project
        statement: >-
          This codebase MUST keep `.github/demo-scenarios.json` committed.
        rationale: >-
          The `scenarios` job resolves the matrix with `jq` right after checkout, in a
          job with no Python environment. The matrix thus cannot be computed at run
          time, and the file cannot be build-time-only.
        verification: >-
          `test/metadata/test_demo_scenario_artifacts.py::test_matrix_json_is_the_committed_projection_of_the_registry`
          reads the committed file and fails when it is missing or differs.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-004

      - id: DEMOCI-11-040
        priority: MUST
        kind: project
        statement: >-
          Each entry of `.github/demo-scenarios.json` MUST carry only the keys that the
          CI matrix consumes: `demo`, `test_file` and `full_suite_only`.
        rationale: >-
          The entries are splatted into `matrix: include:`, so every extra key becomes a
          matrix variable visible to every step of two jobs.
        verification: >-
          `test/metadata/test_demo_scenario_artifacts.py::test_matrix_carries_only_the_keys_the_ci_matrix_consumes`.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-004

      - id: DEMOCI-11-041
        priority: MUST
        kind: project
        statement: >-
          Every entry of `.github/demo-scenarios.json` MUST set `full_suite_only` to an
          explicit boolean.
        rationale: >-
          The selection filter is `select(.full_suite_only == false)`, so an omitted
          field silently drops a PR-set scenario from the matrix instead of raising an
          error.
        verification: >-
          `test/metadata/test_demo_scenario_artifacts.py::test_matrix_full_suite_only_is_an_explicit_boolean`.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-004

      - id: DEMOCI-11-005
        priority: MUST
        kind: project
        statement: >-
          Every committed artifact generated from the scenario registry MUST be
          gated by a check mode wired into pre-commit, which fails when the
          committed artifact does not match the registry.
        rationale: >-
          A generated file that is committed but ungated is just a hand-edited
          file with extra steps. The repository already runs this arrangement for
          `docs/adr/index.md` via the `adr-index-sync` hook.
        verification: >-
          The pre-commit configuration registers the check, and a test asserts
          the check fails on a deliberately stale artifact.
        adr:
          - ADR-0098
        relationships:
          - rel_type: constrains
            spec_id: DEMOCI-11-004

      - id: DEMOCI-11-006
        priority: MUST_NOT
        kind: project
        statement: >-
          Documentation outside the MkDocs tree MUST NOT use `{% include-markdown %}` to
          source a scenario table.
        rationale: >-
          The `include-markdown` plugin expands only during a MkDocs build, and
          `mkdocs.yml` references neither `notes/` nor `test/ci/`. An include directive
          in either renders as literal text to every reader on GitHub and to every agent
          that reads the raw file.
        verification: >-
          `test/metadata/test_demo_scenario_consistency.py::test_no_stray_scenario_include_directives`
          asserts that no file outside the MkDocs tree contains an include-markdown
          directive for a scenario table.
        adr:
          - ADR-0098

      - id: DEMOCI-11-042
        priority: MUST
        kind: project
        statement: >-
          A scenario table in documentation outside the MkDocs tree MUST be generated
          into its file or checked in place against the registry (DEMOCI-11-007). A
          table is checked in place when it interleaves hand-written columns that the
          registry does not hold.
        rationale: >-
          Build-time rendering is the stronger guarantee, because no table is committed
          and drift is impossible. But it is available only inside the MkDocs tree, so a
          table outside it is generated or checked instead.
        verification: >-
          `test/metadata/test_demo_scenario_artifacts.py::test_committed_artifacts_are_in_sync`
          fails a generated table that differs from the registry, and
          `test/metadata/test_demo_scenario_consistency.py::test_notes_scenario_tables_agree_with_the_registry`
          fails a checked table that disagrees with it.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-006
          - rel_type: uses_definition
            spec_id: DEMOCI-11-007

      - id: DEMOCI-11-007
        priority: MUST
        kind: project
        statement: >-
          Hand-written prose that enumerates scenarios — including DEMOCI-06-002,
          DEMOCI-06-003, the per-scenario requirements of the DEMOMA-16 group,
          the hand-written columns of the `notes/` scenario tables, and the
          `mkdocs.yml` nav — MUST be checked for agreement with the scenario
          registry rather than rewritten to defer to it.
        rationale: >-
          A requirement that defers its content to code is a weak requirement,
          and the per-scenario DEMOMA-16 requirements exist so that each scenario
          has a citable spec ID. Generate what is derivable and check what is
          prose — the split `vultron/metadata/adr/index_gen.py` already makes when
          it generates the ADR index but only checks the nav, whose labels are
          hand-written. The per-scenario DEMOMA-16 requirements are not a
          contiguous ID range and MUST NOT be selected as one: DEMOMA-16-008 is
          the spec-to-test sync rule, DEMOMA-16-012 and DEMOMA-16-013 are RCVCV
          event-count requirements, and DEMOMA-16-014 and DEMOMA-16-015 are
          per-scenario requirements for scenarios that are specified but not yet
          built.
        verification: >-
          Tests assert that DEMOCI-06-002 names exactly the PR-set scenarios,
          that DEMOCI-06-003 names exactly the registered set, that every
          registered scenario has a per-scenario DEMOMA-16 requirement, that the
          hand-written columns of the `notes/` scenario tables cover every
          registered scenario, and that the `mkdocs.yml` nav references every
          scenario narrative page.
        adr:
          - ADR-0098
        see_also:
          - spec_id: DEMOCI-06-002
            reason: 'context for the reader'
          - spec_id: DEMOCI-06-003
            reason: 'context for the reader'

      - id: DEMOCI-11-008
        priority: MUST_NOT
        kind: project
        statement: >-
          A consumer of a scenario table MUST NOT restate the number of demo
          scenarios in prose. The table is the count.
        rationale: >-
          A count in prose is a second copy of the table. Each new scenario then needs
          an edit in each place that states the count, and a missed edit makes the
          prose wrong. This is MS-16-001 applied to the scenario set.
        verification: >-
          A test asserts no scenario-table consumer restates the registered
          scenario count in prose.
        adr:
          - ADR-0098

      - id: DEMOCI-11-009
        priority: MUST
        kind: project
        statement: >-
          `docs/topics/scenarios/index.md` MUST render its scenario table at
          build time from the registry. No scenario table may be committed in
          that page.
        rationale: >-
          The page sits inside the MkDocs tree, so `markdown-exec` can call the
          dumper during the build. That is a stronger guarantee than generation
          plus a `--check` hook (DEMOCI-11-005): with no committed table there is
          nothing to go stale, so drift is not detected but impossible. The
          weaker arrangement is used elsewhere only because CI and raw-file
          readers cannot run a MkDocs build. Stating this as a requirement is
          what makes the zero-drift claim ADR-0098 records for this page true
          rather than aspirational.
        verification: >-
          `test_index_page_commits_no_scenario_table` in
          `test/metadata/test_demo_scenario_artifacts.py` asserts the committed
          page contains no scenario table. The rendered table's links are checked
          on the built site, not by `mkdocs build --strict`, which never sees a
          link a build-time block prints: `uv run docs-links` (DOCBW-03-007) fails
          when an internal reference in `site/` resolves to no built path, and
          `test_narrative_links_are_built_site_urls` and
          `test_mkdocs_keeps_directory_urls` in the same module pin the link form
          and the `use_directory_urls` setting it depends on.
        adr:
          - ADR-0098

      - id: DEMOCI-11-010
        priority: MUST
        kind: project
        statement: >-
          Every demo scenario that has a spec group MUST appear in exactly one of two
          places. An implemented scenario is in the scenario registry, and a scenario
          that is specified but not yet built is in the planned-scenario register in
          `notes/demo-future-ideas.md`. Neither membership is inferred from the other.
        rationale: >-
          Scenario authors specify a scenario before they build it. But a specified
          scenario can then show in a table of available demos, and nothing tells it
          apart from a built one. Thus the registry holds only built scenarios, the
          planned register holds the rest, and a check confirms that each is in exactly
          one. The check also runs from the prose side, so the scenarios of
          DEMOMA-16-014 and DEMOMA-16-015 are not ignored.
        verification: >-
          A test asserts that the scenarios named by scenario spec groups partition
          exactly into the registered set and the planned register, with no scenario
          missing from both and none in both
          (`test/metadata/test_demo_scenario_consistency.py::test_partition_holds_on_the_committed_tree`).
        adr:
          - ADR-0098

      - id: DEMOCI-11-043
        priority: MUST
        kind: project
        statement: >-
          Each entry of the planned-scenario register MUST carry its tracking issue and
          its spec IDs.
        rationale: >-
          A planned entry that names no issue cannot be followed to the work that builds
          it, and one that names no spec IDs cannot be checked against the spec groups
          that the partition reads.
        verification: >-
          `test/metadata/test_demo_scenario_consistency.py::test_planned_register_rows_carry_an_issue_and_spec_ids`
          and `test_partition_reports_an_incomplete_planned_row`.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-010

      - id: DEMOCI-11-011
        priority: MUST
        kind: project
        statement: >-
          The demo CLI, `vultron/demo/cli/`, MUST generate its per-scenario
          sub-commands from the scenario registry.
        rationale: >-
          The registry is the one place that declares the scenarios. The container URL
          options differ for each scenario, and each scenario module declares them in a
          `ROLES` list of `ActorRole` values. One command factory reads that list, as in
          the `ActorSession` model (DEMOMA-26), and a test checks that the roles agree
          with the `main()` signature of the scenario (ADR-0098).
        verification: >-
          `test/demo_unit/test_scenario_cli_factory.py` builds each sub-command through
          the factory, and a ratchet test asserts that the declared role set of each
          scenario matches its `main()` keyword parameters.
        adr:
          - ADR-0098
        relationships:
          - rel_type: implements
            spec_id: DC-01-002

      - id: DEMOCI-11-044
        priority: MUST
        kind: project
        statement: >-
          The demo CLI MUST hold exactly one sub-command per registered scenario, and no
          scenario sub-command that the registry lacks.
        rationale: >-
          A CLI that can omit or add a scenario on its own is a second list. A
          registered scenario that it leaves out cannot be run from the CLI.
        verification: >-
          `test/demo_unit/test_scenario_registry.py::test_every_scenario_has_a_cli_subcommand`
          and
          `test/demo_unit/test_scenario_cli_factory.py::test_scenario_subcommands_are_exactly_the_registered_set`.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-011

      - id: DEMOCI-11-045
        priority: MUST_NOT
        kind: project
        statement: >-
          A scenario sub-command MUST NOT be hand-declared, such as with a
          `@main.command` block in `cli.py`.
        rationale: >-
          A hand-declared sub-command is a second list that can drift from the registry.
          A factory-built command and a hand-declared one look the same to click at run
          time, so the check reads the source.
        verification: >-
          `test/demo_unit/test_scenario_cli_factory.py::test_no_scenario_subcommand_is_hand_declared`
          asserts at the source level that no `@main.command` decorator in `cli.py`
          names a registered scenario.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-011

      - id: DEMOCI-11-012
        priority: MUST_NOT
        kind: project
        statement: >-
          A scenario narrative page, `docs/topics/scenarios/<name>.md`, and the index
          `docs/topics/scenarios/index.md` MUST NOT declare a `status` or `maturity`
          frontmatter key.
        rationale: >-
          A page cannot know if its scenario passes (MS-16-002). A `status: stable` key
          that nobody checks can show on a page when its scenario fails, while the
          demo-integration workflow gives the current answer (DEMOCI-06-003). The
          `maturity` key is refused too, because a page has no maturity tier (ADR-0106).
          Prose that claims a result is wrong for the same reason, but a review must
          find it.
        verification: >-
          `uv run demo-scenarios --check` (the pre-commit hook, DEMOCI-11-005) reports a
          narrative or index page whose frontmatter carries `status` or `maturity`.
          `test/metadata/test_demo_scenario_consistency.py::test_no_narrative_page_declares_a_maturity_claim`
          asserts the committed tree is clean, and
          `test_status_claim_check_reports_each_maturity_key` that the finding fires on
          a mutated fixture copy.
        adr:
          - ADR-0098
          - ADR-0106
        relationships:
          - rel_type: derives_from
            spec_id: MS-16-002

      - id: DEMOCI-11-046
        priority: MUST
        kind: project
        statement: >-
          Every markdown page under `docs/topics/scenarios/` other than the index MUST
          be the narrative page of a registered scenario, as DEMOCI-11-003 derives it.
          The check fails a page whose stem names no registered scenario. A shared
          `_`-prefixed `{% include-markdown %}` fragment is not a page (DF-09-007), and
          the check skips it.
        rationale: >-
          The demo-integration workflow runs every registered scenario (DEMOCI-06-003).
          A page for a scenario that is not registered thus describes a scenario that no
          CI run exercises.
        verification: >-
          `uv run demo-scenarios --check` reports a page under `docs/topics/scenarios/`
          that no registered scenario derives.
          `test/metadata/test_demo_scenario_consistency.py::test_every_narrative_page_names_a_registered_scenario`,
          `test_narrative_page_check_reports_a_stray_page` and
          `test_narrative_page_check_exempts_include_fragments` assert the committed
          tree, the finding and the fragment exemption.
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-003
        see_also:
          - spec_id: DF-09-007
            reason: 'context for the reader'

      - id: DEMOCI-11-013
        priority: MUST
        kind: project
        statement: >-
          Each branch point MUST be defined exactly once, as one branch-point table entry
          with its deciding role, presenter prompt and two or more choices. The table is
          the one in the scenario package, and it holds every branch point of the
          scenario tree.
        rationale: >-
          Live mode and offline mode must offer the same choices (ADR-0104). One table
          that holds each branch point once is the single source for both modes, so
          their prompts and choices cannot become different.
        verification: >-
          `test/demo_unit/test_scenario_tree.py::test_two_branch_points_may_not_share_an_id`,
          `test_committed_table_is_well_formed` and
          `test_malformed_branch_point_is_refused` assert that no two branch points
          share an identifier, and that every branch point names a role, a non-empty
          prompt and at least two choices.
        adr:
          - ADR-0098
          - ADR-0104

      - id: DEMOCI-11-047
        priority: MUST
        kind: project
        statement: >-
          Each branch-point choice MUST carry a presenter label and exactly one trigger:
          the next trigger of the branch point's role on the path.
        rationale: >-
          Live mode offers each choice as one trigger POST (ADR-0104). A presenter takes
          control of a role at a branch point, so the choice is what that role does next
          on the path.
        verification: >-
          `test/demo_unit/test_scenario_tree.py::test_every_choice_is_a_mounted_trigger`
          asserts that every choice names a trigger behavior exposed by the trigger
          routers (`/actors/{id}/trigger/{behavior}`) or the demo trigger router
          (`/actors/{id}/demo/{behavior}`), and `test_malformed_choice_is_refused`
          refuses a choice without its label or trigger. When a scenario reports
          reaching a declared step, the harness fails it if the calling actor does not
          hold the role of the branch point
          (`test/demo/test_scenario_harness.py::TestDecidingRole`). Before an actor is a
          participant, its role comes from the act that brings it in: submitting the
          report, or the Invite it answers.
        adr:
          - ADR-0098
          - ADR-0104
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-013

      - id: DEMOCI-11-048
        priority: MAY
        kind: project
        statement: >-
          Steps by other roles MAY run between a branch-point decision and the trigger of
          its choice.
        rationale: >-
          The scenario plays the other parties until the next branch point, so their
          steps can occur between a decision and its trigger.
        adr:
          - ADR-0098
          - ADR-0104

      - id: DEMOCI-11-049
        priority: MUST_NOT
        kind: project
        statement: >-
          A branch-point choice MUST NOT be a non-trigger action, such as a wait, a skip
          or a fall-through.
        rationale: >-
          A choice that is not a trigger has no live form. A decision not to act is thus
          written as the next trigger of the role on that path ("report the fix ready",
          not "invite nobody"), and a party that does nothing shows as what the other
          party does next.
        verification: >-
          `test/demo_unit/test_scenario_tree.py::test_every_choice_is_a_mounted_trigger`
          fails a choice that names no mounted trigger behavior.
        adr:
          - ADR-0098
          - ADR-0104
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-013

      - id: DEMOCI-11-050
        priority: MUST_NOT
        kind: project
        statement: >-
          The prompt and the choice labels MUST NOT be declared anywhere outside the
          branch-point table, including on `@scenario` and in `ui/`.
        rationale: >-
          Labels held in one table cannot become different between the live and offline
          modes. A second copy on the decorator or in the UI could drift from the table.
        verification: >-
          `test/demo_unit/test_scenario_tree.py::test_scenario_decorator_takes_no_path_prompt_or_choice_label`
          asserts that `@scenario` accepts no prompt or label argument. The UI's copy of
          the labels is the generated index, whose drift test (DEMOCI-11-016,
          `test/metadata/demo_scenarios/test_export_tree.py::test_committed_index_matches_a_fresh_export`)
          fails a hand edit.
        adr:
          - ADR-0098
          - ADR-0104
        relationships:
          - rel_type: derives_from
            spec_id: DEMOCI-11-013

      - id: DEMOCI-11-014
        priority: MUST
        kind: project
        statement: >-
          Each registered scenario MUST declare its full path — the ordered
          sequence of (branch point, choice) pairs from the tree's root to its
          ending, each naming an entry of the branch-point table
          (DEMOCI-11-013) — as the choices of its assembled story
          (DEMOCI-11-019).
        rationale: >-
          Sibling scenarios such as `rv` and `rvv` are not a prefix of each other, so a
          pointer to a parent scenario does not treat them the same. A full path treats
          siblings the same, and the tree is the merge of the paths. The story
          is where the path is declared because it is also what walks it, so
          there is one statement of it rather than two that can disagree.
        verification: >-
          A registry test asserts that every registered scenario has a path
          whose pairs each name an entry of the branch-point table, and that
          the path it registers is the choices of its story.
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-013

      - id: DEMOCI-11-022
        priority: MAY
        kind: project
        statement: >-
          A branch point MAY occur more than once on one scenario's path
          (DEMOCI-11-014).
        rationale: >-
          A tree node is a path prefix, not a branch-point identity, because the same
          decision can occur again on one path (a report can be invalidated and later
          validated).
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-014

      - id: DEMOCI-11-023
        priority: MUST
        kind: project
        statement: >-
          Discovery MUST fail when a path names an unknown branch point or
          choice, when two scenarios declare the same path, or when one
          scenario's path is a strict prefix of another's, so that every
          registered scenario is exactly one ending of the tree.
        rationale: >-
          A path that is a prefix of another path would make one scenario both an
          interior node and an ending, and two scenarios on one path would be one
          ending with two names. Failing at discovery stops a malformed tree before
          the index, the recordings or the UI read it.
        verification: >-
          A registry test asserts each failure on a mutated fixture registry, and
          that the committed registry builds one tree in which every registered
          scenario is a leaf.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-014
          - rel_type: uses_definition
            spec_id: DEMOCI-11-013

      - id: DEMOCI-11-015
        priority: SHOULD
        kind: project
        statement: >-
          A scenario's name SHOULD keep the letter grammar of the existing names. Its
          leading letters spell, in order, the roles that join the case. They are `r`
          Reporter, `v` Vendor, `c` Coordinator and `d` Deployer, with one new letter
          for each further role. An optional hyphenated suffix names the outcome. A
          Vendor that reports its own vul joins as a Vendor, so its name begins with
          `v`.
        rationale: >-
          A name is the stem of the module, the invariant harness, the narrative page,
          the `scenario_start` marker and the CI matrix entry, so a new name changes all
          of them. The grammar is a naming convention that review keeps, not a registry
          check: some joins occur in scripted steps that no choice records. The Finder
          letter `f` is retired with the Finder role (ADR-0078).
        adr:
          - ADR-0098
          - ADR-0078

      - id: DEMOCI-11-051
        priority: SHOULD_NOT
        kind: project
        statement: >-
          A scenario's name SHOULD NOT be generated from the choices of its path.
        rationale: >-
          A name generated from choices changes for every scenario below a new branch
          point. Each change renames the module, the harness, the page and the CI matrix
          entry of that scenario.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-015

      - id: DEMOCI-11-016
        priority: MUST
        kind: project
        statement: >-
          The scenario-tree index the demo UI reads MUST be generated from the
          branch-point table and registered paths, committed under `ui/src/data/`, and
          drift-checked per DEMOCI-11-005.
        rationale: >-
          The UI holds no copy of a protocol fact that a person keeps by hand (ADR-0128,
          ADR-0104). A generated index cannot become different from the registry without
          the drift test failing.
        verification: >-
          `test/metadata/demo_scenarios/test_export_tree.py::test_committed_index_matches_a_fresh_export`
          fails when the committed index differs from a fresh export, and
          `test_check_fails_on_a_stale_index_and_names_the_command` names the
          regeneration command.
        adr:
          - ADR-0098
          - ADR-0104
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-11-005
          - rel_type: depends_on
            spec_id: DEMOCI-11-014

      - id: DEMOCI-11-052
        priority: MUST
        kind: project
        statement: >-
          The scenario-tree index MUST carry the branch-point table, the tree as nested
          nodes from the root, and one entry per scenario. Each entry holds the
          scenario's label, path and recording files.
        rationale: >-
          The UI draws the tree and offers its choices from the index alone, so the
          index carries every part that the UI shows.
        verification: >-
          `test/metadata/demo_scenarios/test_export_tree.py::test_index_carries_the_branch_point_table`,
          `test_one_root_whose_endings_are_every_scenario_once` and
          `test_one_entry_per_scenario_with_label_and_path` assert the table, a single
          root node whose descendants include the ending of every registered scenario,
          and one entry per registered scenario.
        adr:
          - ADR-0098
          - ADR-0104
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-016

      - id: DEMOCI-11-053
        priority: MUST
        kind: project
        statement: >-
          The scenario-tree index MUST key the recording files of each scenario by both
          actor and case.
        rationale: >-
          Planned scenarios split, merge and consolidate cases, so the recording of one
          actor can cover several cases. A key on the actor alone does not fit those
          scenarios.
        verification: >-
          `test/metadata/demo_scenarios/test_export_tree.py::test_recordings_are_keyed_by_actor_then_case`.
        adr:
          - ADR-0098
          - ADR-0104
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-016

      - id: DEMOCI-11-017
        priority: MUST
        kind: project
        statement: >-
          A check MUST compare the recorded ledgers of every two registered
          scenarios, up to the branch point where their paths part. Each
          recording's step marks locate that branch point in it. No registered
          scenario and no pair of them is held out of the comparison.
        rationale: >-
          The comparison is what holds a declared branch honest: it fails when
          two scenarios do not run the same thing up to the point their paths
          say they diverge. Scoping it to a declared subset of the tree makes
          the pairs nobody listed the ones nobody checks, so the obligation is
          over every pair. A pair that parts at the root shares no ledger
          entries, because the root branch point is decided before the case
          exists; those pairs carry nothing and the pairs that part later are
          what the check rests on.
        verification: >-
          A test parametrizes the comparison over every pair the tree yields,
          asserting that count is the number of pairs of registered scenarios,
          and records per pair that one parting after the root compares a
          non-empty prefix.
        adr:
          - ADR-0098
        relationships:
          - rel_type: depends_on
            spec_id: DEMOCI-11-014

      - id: DEMOCI-11-018
        priority: MUST
        kind: project
        statement: >-
          The comparison of DEMOCI-11-017 MUST be byte for byte: the ledger
          entries before the branch point are the same bytes in both
          recordings, ids and timestamps included.
        rationale: >-
          Every scenario is written as composition, so a shared stretch is one
          copy of the code on one fixed cast under one seed (DEMOCI-11-020,
          DEMOCI-11-025): both recordings draw the same ids and read the clock
          the same number of times, and byte identity holds by construction.
          It is also the only form that catches a shared stretch writing the
          same objects in a different order. What a shared stretch must satisfy
          is in `notes/demo-scenario-tree.md` § "Composition".
        verification: >-
          `TestSharedPrefixes` in `test/demo_unit/test_recordings.py` compares
          every pair of registered scenarios byte for byte up to the branch
          point where each pair's paths part, and
          `TestTheByteComparisonFailsOnAChangedPrefix` in the same module
          fails the comparison on a fixture pair that differs in one byte
          before the branch point and on one whose shared entries are
          reordered.
        adr:
          - ADR-0098
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-11-017
          - rel_type: depends_on
            spec_id: DEMOCI-11-020
          - rel_type: depends_on
            spec_id: DEMOCI-11-025

      - id: DEMOCI-11-034
        priority: MUST
        kind: project
        statement: >-
          The flattened story of every registered scenario MUST be
          committed as a generated plot manifest. An entry lists the story's
          items in order: each choice by branch point, choice and deciding cast
          member, and each fragment by qualified name.
        rationale: >-
          A reorder inside a shared fragment moves every scenario of its family
          alike, so DEMOCI-11-018 still passes, and no PR check regenerates the
          recordings that would show it. The plot is read from the stories
          without running them, so it costs nothing at PR time. A deliberate
          reorder shows as a manifest diff; in a consolidation PR that diff is
          a sign the change may alter what a scenario passes or fails on, which
          DEMOMA-17-002 forbids. The manifest cannot see an edit inside a
          fragment's body; only a recording can.
        verification: >-
          A shape test asserts the manifest holds one entry per registered
          scenario, whose items equal its story's choices and fragment names
          in order.
        adr:
          - ADR-0098

      - id: DEMOCI-11-035
        priority: MUST
        kind: project
        statement: >-
          The drift check of DEMOCI-11-005 MUST fail when the committed plot
          manifest differs from the stories in the code.
        rationale: >-
          A manifest nobody compares with the code stops the reorder at no
          point; the check makes a changed story order fail until the manifest
          is regenerated and the change is visible in the PR's diff.
        verification: >-
          A drift test fails when the committed manifest differs from a fresh
          export, naming the regeneration command. A mutation test moves one
          `choose` past its fragment in a fixture story and asserts the drift
          check fails.
        adr:
          - ADR-0098
        relationships:
          - rel_type: refines
            spec_id: DEMOCI-11-005
          - rel_type: depends_on
            spec_id: DEMOCI-11-034

      - id: DEMOCI-11-019
        priority: MUST
        kind: project
        statement: >-
          A registered scenario's path MUST be read from the choices in its
          assembled story.
        rationale: >-
          A path typed beside the story is a second copy of the same fact, and
          the two copies can disagree. When the path is read from the story,
          the registry, the scenario-tree index and the step marks in the
          recordings all come from the code that runs.
        verification: >-
          A registry test builds the path of a fixture scenario from its story
          and asserts it equals that scenario's path in the tree built from
          the fixture registry.
        adr:
          - ADR-0098
        relationships:
          - rel_type: implements
            spec_id: DEMOCI-11-014

      - id: DEMOCI-11-024
        priority: MUST_NOT
        kind: project
        statement: >-
          The `@scenario` decorator MUST NOT take a path parameter.
        rationale: >-
          A parameter that accepts a path is the place where the second copy
          DEMOCI-11-019 removes would be written, and nothing would keep the
          two copies the same. Removing the parameter rather than refusing a
          scenario that uses it means the second copy cannot be written at
          all, so no check has to catch it.
        verification: >-
          `test_scenario_decorator_takes_no_path_prompt_or_choice_label` in
          `test/demo_unit/test_scenario_tree.py` pins the decorator's whole
          parameter set, so a re-added path parameter under any name fails it,
          and a registry test asserts a scenario cannot register without a
          story.
        adr:
          - ADR-0098
        relationships:
          - rel_type: derives_from
            spec_id: DEMOCI-11-019

      - id: DEMOCI-11-020
        priority: MUST
        kind: project
        statement: >-
          Every registered scenario MUST run on one fixed cast: the same
          container slot, port and actor id for each cast member in every
          scenario of the tree.
        rationale: >-
          Byte identity of a shared prefix (DEMOCI-11-018) needs more than one
          copy of the code. Two siblings that put the same actor in different
          slots record different bytes for the same story.
        verification: >-
          A test asserts that every registered scenario resolves each cast
          member to the same container slot, port and actor id.
        adr:
          - ADR-0098

      - id: DEMOCI-11-025
        priority: MUST
        kind: project
        statement: >-
          Every recording of a registered scenario MUST use the same tree-wide
          recording seed.
        rationale: >-
          Two siblings that seed their ids with different values record
          different bytes for the same story, so a shared prefix cannot be byte
          identical (DEMOCI-11-018).
        verification: >-
          The recorder test asserts that every recording uses the tree-wide
          seed.
        adr:
          - ADR-0098

      - id: DEMOCI-11-026
        priority: MUST_NOT
        kind: project
        statement: >-
          A cast container other than the first-Vendor and first-Coordinator
          slots MUST NOT declare default case roles.
        rationale: >-
          A character actor's CVD role comes from the act that seats it, so a
          container default would give it that role in every scenario and the
          same container could not be a Vendor in one and a Coordinator in
          another (DEMOCI-11-021). The first-Reporter slot and the CaseActor
          container are covered for a different reason: neither owns a case, so
          neither has a role to own one as. Only a container that can own a case
          declares its role (DEMOCI-11-032).
        verification: >-
          A test reads the compose file and asserts that the first-Reporter
          slot, every character-actor slot and the CaseActor service set no
          default-case-roles variable.
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-021

      - id: DEMOCI-11-027
        priority: MUST_NOT
        kind: project
        statement: >-
          A cast container's actor id MUST NOT name a CVD role.
        rationale: >-
          A role-named id reads as a claim about the part its actor plays, and
          the cast's point is that the part changes between scenarios while the
          container does not (DEMOCI-11-020).
        verification: >-
          A test asserts that the `/actors/` segment of every cast container's
          configured actor id is not the name of any CVD role. The host half of
          the id is pinned separately, to the container's own slot.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-020

      - id: DEMOCI-11-028
        priority: MUST
        kind: project
        statement: >-
          Every cast container and the dedicated CaseActor container MUST have
          a seed config whose local actor is the actor that container hosts.
        rationale: >-
          The seed config bootstraps a container's identity with no discovery
          step to fall back on, so a config naming another container's actor
          gives the demo two containers with one identity.
        verification: >-
          A test asserts that each container's configured seed config declares
          the actor id that container hosts, and that no seed config is left
          over from a retired container.
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-020

      - id: DEMOCI-11-029
        priority: MUST
        kind: project
        statement: >-
          Each cast container's seed config MUST list every other cast
          container and the dedicated CaseActor container as a peer.
        rationale: >-
          A container cannot address an actor it does not know, and the demo
          has no discovery step, so a missing peer stops a message that the
          protocol requires.
        verification: >-
          A test asserts that the peer ids of every seed config are exactly the
          other containers' actor ids.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-028

      - id: DEMOCI-11-030
        priority: MUST
        kind: project
        statement: >-
          The demo runner service MUST wait for every cast container and the
          dedicated CaseActor container to become healthy.
        rationale: >-
          A runner that starts before a container is healthy fails the
          scenario's first call to it, which reads as a protocol failure.
        verification: >-
          A test asserts that the runner's dependency list is exactly the cast
          and the CaseActor container, each with a health condition.
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-020

      - id: DEMOCI-11-031
        priority: MUST
        kind: project
        statement: >-
          The demo runner service MUST expose the base URL of every cast
          container and of the dedicated CaseActor container.
        rationale: >-
          A scenario reads each container's address from its own environment
          variable, so a missing one resolves to the local-development default
          and the scenario cannot reach the actor at all.
        verification: >-
          A test asserts that the runner's environment sets each container's
          base-URL variable to that container's address on the compose network.
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-020

      - id: DEMOCI-11-032
        priority: MUST
        kind: project
        statement: >-
          The first-Vendor and first-Coordinator cast slots MUST declare their
          own CVD role as their container's default case roles.
        rationale: >-
          These are the only cast containers that own a case, and a case is
          owned as a role (CP-01-013). Without the declaration a Coordinator
          that owns the case holds only `case_owner`, and the harness then
          fails every Coordinator step of the scenario (#5467, DEMOCI-11-047).
          Every other cast container declares none (DEMOCI-11-026).
        verification: >-
          A test reads the compose file and asserts that the first-Vendor slot
          declares the Vendor role and the first-Coordinator slot the
          Coordinator role.
        adr:
          - ADR-0098
        relationships:
          - rel_type: uses_definition
            spec_id: DEMOCI-11-021

      - id: DEMOCI-11-033
        priority: MUST_NOT
        kind: project
        statement: >-
          A character-actor container's seed config MUST NOT name its local
          actor for a CVD role.
        rationale: >-
          The display name is what the devlogs and the UI show for that actor,
          so a role name there makes the same claim a role-named actor id would
          (DEMOCI-11-027), in the one place a reader looks to find out who an
          actor is. A fixed-role slot may be named for its role, because it
          plays that part in every scenario; a character actor takes the name
          of its container.
        verification: >-
          A test asserts the display name each seed config declares, naming the
          fixed-role slots for their role and each character-actor slot for its
          container.
        adr:
          - ADR-0098

      - id: DEMOCI-11-021
        priority: MUST
        kind: project
        statement: >-
          When a registered scenario seats a Reporter, a Vendor or a
          Coordinator, the first one of each role MUST run in the first, second
          or third cast slot respectively.
        rationale: >-
          A fixed slot for the first Reporter, Vendor and Coordinator keeps a
          shared opening on the same containers in every scenario that tells
          it. A scenario that lacks one of these roles, such as `rv` with no
          Coordinator, leaves that slot unused. Every further cast member is a
          character actor that takes the role its scenario gives it, so a
          scenario that needs a second Vendor, a second Coordinator, a Deployer
          or a second Reporter adds no container.
        verification: >-
          A test asserts that, in every registered scenario, the first Reporter,
          first Vendor and first Coordinator it seats run in the first, second
          and third cast slots.
        adr:
          - ADR-0098
        relationships:
          - rel_type: extends
            spec_id: DEMOCI-11-020
