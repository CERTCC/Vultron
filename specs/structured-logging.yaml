id: SL
title: Structured Logging Requirements
description: >-
  Logging requirements for the Vultron API, covering log format, correlation IDs, log levels,
  state transition logging, error context, and authorization and data-access audit records.
scope:
- prototype
- production
tags:
- logging
- observability
groups:
- id: SL-01
  title: Log Format
  specs:
  - id: SL-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All log entries MUST include `timestamp` field in ISO 8601 format
    rationale: >-
      An operator puts logs from several actors and services together to follow one
      case. An ISO 8601 timestamp sorts and compares the same way in every log, whatever
      the time zone or locale of the host that wrote it.
    scope:
    - production
  - id: SL-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      All log entries MUST include `level` field (DEBUG, INFO, WARNING, ERROR, CRITICAL)
    rationale: >-
      Operators filter logs by severity to find failures among a large volume of normal
      output. A `level` field on each entry makes that filter possible without a parse
      of the message text.
    scope:
    - production
  - id: SL-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All log entries MUST include `component` field (module or function name)
    rationale: >-
      The `component` field tells a reader which module wrote an entry. Without it, a
      reader must guess from the message text where to look in the code.
    scope:
    - production
  - id: SL-01-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All log entries MUST include `message` field (human-readable text)
    rationale: >-
      A person reads the message to learn what happened. Structured fields serve tools,
      but they do not tell a person the event in words.
    scope:
    - production
  - id: SL-01-005
    priority: MUST
    kind: project
    adr:
    - ADR-0094
    statement: >-
      The message argument of a log call MUST be a literal template whose values are
      passed as lazy positional arguments (`logger.info("Actor %s engaged case %s",
      actor_id, case_id)`), never a string formatted before the call by an f-string,
      `str.format()`, `%`-formatting, or concatenation.
    rationale: >-
      Python's `logging` keeps the template (`msg`) and its values (`args`) apart on
      the record and formats them only when a handler emits. That split gives every
      recurring event one stable template to group, grep, and assert on; it defers
      rendering the arguments (`str()` and `%` conversion) until a record is known
      to be emitted; and it keeps a fault raised while rendering an argument inside
      the logging machinery instead of in the caller. Only rendering is deferred:
      an argument expression is still evaluated at the call, so a value produced by
      a call (a tree dump, a `logfmt()` render) still needs an `isEnabledFor` guard,
      while a guard that only avoided f-string formatting is removed. A
      pre-formatted string discards all three properties. Structured record fields
      (SL-02) are a separate mechanism and are not an alternative way to interpolate
      values into the message. Enforced by ruff rules `G001`-`G004` (ADR-0094).
    verification: >-
      `ruff check` with the `G` rule family selected and no `G004` entry in
      `[tool.ruff.lint] ignore` reports zero findings (IMPLTS-07-018). The `G`
      rules see only a formatting expression written inside the call, so a message
      pre-built into a name and then passed (`msg = f"..."; logger.info(msg)`) is
      outside their reach and is a review finding, not a ruff one.
    relationships:
    - rel_type: refines
      spec_id: SL-01-004
- id: SL-02
  title: Correlation IDs
  specs:
  - id: SL-02-001
    priority: MUST
    kind: project
    statement: Log entries MUST include `activity_id` field when activity is available
    rationale: >-
      One received activity can cause log entries in many modules. An `activity_id`
      field lets a reader collect all entries for one activity, across modules and
      actors, with one filter.
    verification: >-
      A test enters the processing context for an activity, writes a log record through
      a handler that carries the SL-02-003 filter, and asserts that the record has an
      `activity_id` attribute equal to the activity's `id_`.
    scope:
    - production
  - id: SL-02-002
    priority: MUST
    kind: project
    statement: Log entries MUST include `actor_id` field when actor is available
    rationale: >-
      One server can host several actors, and their log entries mix in one stream. An
      `actor_id` field lets a reader separate the entries for each actor and follow what
      one actor did.
    verification: >-
      A test enters the execution context for an actor, writes a log record through a
      handler that carries the SL-02-003 filter, and asserts that the record has an
      `actor_id` attribute equal to the actor's canonical URI.
    scope:
    - production
  - id: SL-02-003
    priority: MUST
    kind: project
    statement: >-
      A correlation field (`activity_id`, `actor_id`) MUST reach the log record as a
      record attribute populated from ambient context that is established once at the
      processing boundary (inbox receipt of an activity, BT execution on behalf of an
      actor) and applied to every record by a `logging.Filter`, not supplied per call
      through `extra=`.
    rationale: >-
      A per-call `extra=` must repeat the same value at every log site, and a site that
      omits it writes a record with no correlation. Context that is set once at the
      processing boundary and copied by a filter reaches every record written inside
      that boundary, also from code that knows nothing about correlation. The formatter
      decides how to show the fields: a text formatter can print them next to the
      message, and a structured formatter can write them as separate fields. No call
      site changes.
    verification: >-
      A test enters the boundary context, emits a record through a handler carrying
      the filter, and asserts the record object exposes `activity_id` and `actor_id`
      attributes; an AST scan of `vultron/` finds no log call passing `activity_id`
      or `actor_id` through `extra=`.
    relationships:
    - rel_type: refines
      spec_id: SL-02-001
    - rel_type: refines
      spec_id: SL-02-002
  - id: SL-02-004
    priority: MUST
    kind: project
    statement: >-
      Interpolating an identifier into the message text MUST NOT be treated as
      satisfying SL-02-001 or SL-02-002; the message may name the identifier for
      readability, but the record attribute is the carrier those requirements
      refer to.
    rationale: >-
      An identifier embedded in free text cannot be filtered, grouped, or asserted on
      without parsing the message, and the narrative INFO template (SL-04-006) names
      the actor for the human reader, not for correlation. Making the record
      attribute the only thing that counts keeps the two audiences from being
      conflated: the message serves the person reading the transcript, the
      attribute serves the tooling.
    verification: >-
      The tests that verify SL-02-001 and SL-02-002 assert on record attributes,
      never on substrings of `record.getMessage()`.
    relationships:
    - rel_type: refines
      spec_id: SL-02-001
    - rel_type: refines
      spec_id: SL-02-002
- id: SL-03
  title: Log Level Semantics
  specs:
  - id: SL-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'Log levels MUST follow standard Python `logging` severity semantics: DEBUG for diagnostic detail, INFO for normal protocol operations, WARNING for recoverable anomalies, ERROR for failures requiring attention, and CRITICAL for system-threatening failures.'
    rationale: >-
      Operators set a log level to choose how much output they see. When each level
      means the same thing in every module, a WARNING threshold shows all recoverable
      problems and failures and hides normal operation. The standard Python meanings are
      the ones that every library in the process already uses.
- id: SL-04
  title: State Transition Logging
  specs:
  - id: SL-04-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All state transitions MUST be logged at INFO level
    rationale: >-
      State transitions tell the protocol story. A reader of an actor's INFO log must
      see each change of RM, EM, CS and participant state, without the volume of DEBUG
      detail. The default log level is INFO, so a transition logged only at DEBUG does
      not appear.
  - id: SL-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: State transition logs MUST include before state
    rationale: >-
      A transition shows a change only when the reader knows the start state. With the
      before state in the entry, a reader can see an unexpected transition without a
      search through the earlier log.
  - id: SL-04-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: State transition logs MUST include after state
    rationale: >-
      The after state is the result of the transition. A reader needs it to know the
      actor's current state without a read of the code that ran.
  - id: SL-04-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: State transition logs MUST include triggering event (activity type + semantic)
    rationale: >-
      A reader who sees a state change must know what caused it. The activity type and
      its semantic tell the reader which message caused the transition, so the reader
      can find the same message in the sender's log.
  - id: SL-04-005
    priority: SHOULD
    kind: project
    statement: >-
      Demo scripts and stepwise workflows SHOULD use structured, consistent lifecycle logs
    rationale: >-
      People run the demos to learn the protocol. Lifecycle lines with one consistent
      form let a reader follow the demo steps in order and see at once which step or
      check failed.
  - id: SL-04-006
    priority: SHOULD
    kind: project
    statement: >-
      State transition log messages SHOULD follow the narrative template
      "Actor '<actor_id>' <verb> '<object_id>' (<STATE_A> → <STATE_B>)" so
      that reading an actor's INFO log tells the complete protocol story
      without requiring DEBUG. See notes/structured-logging.md for the
      full template inventory.
    rationale: >-
      One sentence form lets a reader scan an actor's INFO log as a story: who did what
      to which object, and how the state changed. Tests can also find a transition with
      one pattern. With this form, the INFO log is enough to follow the protocol, and a
      reader does not need DEBUG output.
  - id: SL-04-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Infrastructure log lines (persistence store/save/update, BT scaffolding,
      HTTP handler parsing echoes, pipeline completion repeats, FSM internal
      callbacks, per-recipient sync queue entries) MUST NOT be logged at INFO;
      they MUST be logged at DEBUG or lower.
    rationale: >-
      Infrastructure lines, such as a store write or a BT setup step, repeat for each
      activity and say nothing about the protocol. At INFO they hide the state
      transitions that the INFO log exists to show (SL-04-001). At DEBUG they stay
      available for diagnosis.
- id: SL-05
  title: Error Context
  specs:
  - id: SL-05-001
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include exception type and message
    rationale: >-
      The exception type and message tell an operator what failed without a debugger. An
      ERROR entry with no exception detail tells only that something failed.
  - id: SL-05-002
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include stack trace for unexpected exceptions
    rationale: >-
      An unexpected exception is a defect, and the stack trace shows where in the code
      it started. Without the trace, a person must reproduce the fault to find it. An
      expected error that the code handles does not need a trace.
  - id: SL-05-003
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include original activity ID if available
    rationale: >-
      When an ERROR entry names the activity, an operator can find the activity that
      caused the failure and read its other log entries. Without the ID, the operator
      must match the failure to an activity by time alone.
- id: SL-06
  title: Authorization Logging
  specs:
  - id: SL-06-001
    priority: SHOULD
    kind: project
    statement: Authorization decisions SHOULD be logged with decision (allowed/denied)
    rationale: >-
      A security review must show which actions the system allowed or denied. A log
      entry for each authorization decision gives that record, and a series of denials
      can show misuse while it occurs.
    scope:
    - production
  - id: SL-06-002
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include actor performing action
    rationale: >-
      An authorization record must name who asked. Without the actor, a reviewer cannot
      tell which actor made the request.
    scope:
    - production
  - id: SL-06-003
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include resource being accessed
    rationale: >-
      A reviewer must know what the actor tried to access. The resource tells which
      case, report or other object the decision protected.
    scope:
    - production
  - id: SL-06-004
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include denial reason if denied
    rationale: >-
      A denial with no reason is hard to tell apart from a configuration fault. The
      reason lets an operator see whether the system worked as designed or a rule needs
      a change.
    scope:
    - production
- id: SL-07
  title: Data Access Logging
  specs:
  - id: SL-07-001
    priority: SHOULD
    kind: project
    statement: >-
      Sensitive data operations SHOULD log operation type (CREATE, READ, UPDATE, DELETE)
    rationale: >-
      A record of sensitive data operations must show what each operation did. A read of
      embargoed vulnerability data has a different risk from an update or a delete, so
      the entry must give the operation type.
    scope:
    - production
  - id: SL-07-002
    priority: SHOULD
    kind: project
    statement: Data access logs SHOULD include resource type and ID
    rationale: >-
      The resource type and ID tell a reviewer which record an operation touched. The
      reviewer can then find all operations on one case or report.
    scope:
    - production
  - id: SL-07-003
    priority: SHOULD
    kind: project
    statement: Data access logs SHOULD include actor performing operation
    rationale: >-
      An audit record must name who did each operation. A reviewer can then hold each
      actor responsible for its access to sensitive data.
    scope:
    - production
- id: SL-08
  title: Performance Metrics
  specs:
  - id: SL-08-001
    priority: MAY
    kind: project
    statement: System MAY log performance metrics at DEBUG level
    rationale: >-
      Timing data helps find slow steps, but at INFO it hides the protocol story
      (SL-04-001). At DEBUG the data is available when an operator asks for it.
    scope:
    - production
