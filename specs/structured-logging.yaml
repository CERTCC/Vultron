id: SL
title: Structured Logging Requirements
description: >-
  Logging requirements for the Vultron API, covering log format, correlation IDs, log levels,
  state transition logging, error context, and authorization and data-access audit records.
version: 1.1.0
scope:
- prototype
- production
tags:
- logging
- observability
groups:
- id: SL-01
  title: Log Format
  specs:
  - id: SL-01-001
    priority: MUST
    kind: project
    statement: All log entries MUST include `timestamp` field in ISO 8601 format
    scope:
    - production
  - id: SL-01-002
    priority: MUST
    kind: project
    statement: >-
      All log entries MUST include `level` field (DEBUG, INFO, WARNING, ERROR, CRITICAL)
    scope:
    - production
  - id: SL-01-003
    priority: MUST
    kind: project
    statement: All log entries MUST include `component` field (module or function name)
    scope:
    - production
  - id: SL-01-004
    priority: MUST
    kind: project
    statement: All log entries MUST include `message` field (human-readable text)
    scope:
    - production
- id: SL-02
  title: Correlation IDs
  specs:
  - id: SL-02-001
    priority: MUST
    kind: protocol
    statement: Log entries MUST include `activity_id` field when activity is available
    verification: Integration tests confirm that log records produced during inbox activity processing include the
      `activity_id` field set to the processed activity's `as_id`.
    scope:
    - production
  - id: SL-02-002
    priority: MUST
    kind: protocol
    statement: Log entries MUST include `actor_id` field when actor is available
    verification: Integration tests confirm that log records produced during actor-scoped operations include the
      `actor_id` field set to the actor's canonical URI.
    scope:
    - production
- id: SL-03
  title: Log Level Semantics
  specs:
  - id: SL-03-001
    priority: MUST
    kind: project
    statement: 'Log levels MUST follow standard Python `logging` severity semantics: DEBUG for diagnostic detail, INFO for normal protocol operations, WARNING for recoverable anomalies, ERROR for failures requiring attention, and CRITICAL for system-threatening failures.'
- id: SL-04
  title: State Transition Logging
  specs:
  - id: SL-04-001
    priority: MUST
    kind: project
    statement: All state transitions MUST be logged at INFO level
  - id: SL-04-002
    priority: MUST
    kind: project
    statement: State transition logs MUST include before state
  - id: SL-04-003
    priority: MUST
    kind: project
    statement: State transition logs MUST include after state
  - id: SL-04-004
    priority: MUST
    kind: project
    statement: State transition logs MUST include triggering event (activity type + semantic)
  - id: SL-04-005
    priority: SHOULD
    kind: project
    statement: >-
      Demo scripts and stepwise workflows SHOULD use structured, consistent lifecycle logs
  - id: SL-04-006
    priority: SHOULD
    kind: project
    statement: >-
      State transition log messages SHOULD follow the narrative template
      "Actor '<actor_id>' <verb> '<object_id>' (<STATE_A> → <STATE_B>)" so
      that reading an actor's INFO log tells the complete protocol story
      without requiring DEBUG. See notes/structured-logging.md for the
      full template inventory.
  - id: SL-04-007
    priority: MUST
    kind: project
    statement: >-
      Infrastructure log lines (persistence store/save/update, BT scaffolding,
      HTTP handler parsing echoes, pipeline completion repeats, FSM internal
      callbacks, per-recipient sync queue entries) MUST NOT be logged at INFO;
      they MUST be logged at DEBUG or lower.
- id: SL-05
  title: Error Context
  specs:
  - id: SL-05-001
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include exception type and message
  - id: SL-05-002
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include stack trace for unexpected exceptions
  - id: SL-05-003
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include original activity ID if available
- id: SL-06
  title: Authorization Logging
  specs:
  - id: SL-06-001
    priority: SHOULD
    kind: project
    statement: Authorization decisions SHOULD be logged with decision (allowed/denied)
    scope:
    - production
  - id: SL-06-002
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include actor performing action
    scope:
    - production
  - id: SL-06-003
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include resource being accessed
    scope:
    - production
  - id: SL-06-004
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include denial reason if denied
    scope:
    - production
- id: SL-07
  title: Data Access Logging
  specs:
  - id: SL-07-001
    priority: SHOULD
    kind: project
    statement: >-
      Sensitive data operations SHOULD log operation type (CREATE, READ, UPDATE, DELETE)
    scope:
    - production
  - id: SL-07-002
    priority: SHOULD
    kind: project
    statement: Data access logs SHOULD include resource type and ID
    scope:
    - production
  - id: SL-07-003
    priority: SHOULD
    kind: project
    statement: Data access logs SHOULD include actor performing operation
    scope:
    - production
- id: SL-08
  title: Performance Metrics
  specs:
  - id: SL-08-001
    priority: MAY
    kind: project
    statement: System MAY log performance metrics at DEBUG level
    scope:
    - production
