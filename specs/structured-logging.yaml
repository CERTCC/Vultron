id: SL
title: Structured Logging Requirements
description: >-
  Logging requirements for the Vultron API, covering log format, correlation IDs, log levels,
  state transition logging, error context, and authorization and data-access audit records.
scope:
- prototype
- production
tags:
- logging
- observability
groups:
- id: SL-01
  title: Log Format
  specs:
  - id: SL-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All log entries MUST include `timestamp` field in ISO 8601 format
    scope:
    - production
  - id: SL-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      All log entries MUST include `level` field (DEBUG, INFO, WARNING, ERROR, CRITICAL)
    scope:
    - production
  - id: SL-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All log entries MUST include `component` field (module or function name)
    scope:
    - production
  - id: SL-01-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All log entries MUST include `message` field (human-readable text)
    scope:
    - production
  - id: SL-01-005
    priority: MUST
    kind: project
    adr:
    - ADR-0094
    statement: >-
      The message argument of a log call MUST be a literal template whose values are
      passed as lazy positional arguments (`logger.info("Actor %s engaged case %s",
      actor_id, case_id)`), never a string formatted before the call by an f-string,
      `str.format()`, `%`-formatting, or concatenation.
    rationale: >-
      Python's `logging` keeps the template (`msg`) and its values (`args`) apart on
      the record and formats them only when a handler emits. That split gives every
      recurring event one stable template to group, grep, and assert on; it defers
      rendering the arguments (`str()` and `%` conversion) until a record is known
      to be emitted; and it keeps a fault raised while rendering an argument inside
      the logging machinery instead of in the caller. Only rendering is deferred:
      an argument expression is still evaluated at the call, so a value produced by
      a call (a tree dump, a `logfmt()` render) still needs an `isEnabledFor` guard,
      while a guard that only avoided f-string formatting is removed. A
      pre-formatted string discards all three properties. Structured record fields
      (SL-02) are a separate mechanism and are not an alternative way to interpolate
      values into the message. Enforced by ruff rules `G001`-`G004` (ADR-0094).
    verification: >-
      `ruff check` with the `G` rule family selected and no `G004` entry in
      `[tool.ruff.lint] ignore` reports zero findings (IMPLTS-07-018). The `G`
      rules see only a formatting expression written inside the call, so a message
      pre-built into a name and then passed (`msg = f"..."; logger.info(msg)`) is
      outside their reach and is a review finding, not a ruff one.
    relationships:
    - rel_type: refines
      spec_id: SL-01-004
- id: SL-02
  title: Correlation IDs
  specs:
  - id: SL-02-001
    priority: MUST
    kind: protocol
    statement: Log entries MUST include `activity_id` field when activity is available
    verification: Integration tests confirm that log records produced during inbox activity processing include the
      `activity_id` field set to the processed activity's `as_id`.
    scope:
    - production
    lint_suppress:
    - missing_story_reference
  - id: SL-02-002
    priority: MUST
    kind: protocol
    statement: Log entries MUST include `actor_id` field when actor is available
    verification: Integration tests confirm that log records produced during actor-scoped operations include the
      `actor_id` field set to the actor's canonical URI.
    scope:
    - production
    lint_suppress:
    - missing_story_reference
  - id: SL-02-003
    priority: MUST
    kind: project
    statement: >-
      A correlation field (`activity_id`, `actor_id`) MUST reach the log record as a
      record attribute populated from ambient context that is established once at the
      processing boundary (inbox receipt of an activity, BT execution on behalf of an
      actor) and applied to every record by a `logging.Filter`, not supplied per call
      through `extra=`.
    rationale: >-
      A per-call `extra=` at every log site repeats the same value hundreds of times
      and is missed wherever a site forgets it, which is the duplication failure the
      template rule (SL-01-005) exists to avoid on the message side. Context set once
      at the boundary and copied by a filter reaches every record emitted inside that
      boundary, including records from code that knows nothing about correlation.
      Rendering stays the formatter's decision: a text formatter can print the
      attributes beside the message and a structured formatter can emit them as
      fields, without touching any call site.
    verification: >-
      A test enters the boundary context, emits a record through a handler carrying
      the filter, and asserts the record object exposes `activity_id` and `actor_id`
      attributes; an AST scan of `vultron/` finds no log call passing `activity_id`
      or `actor_id` through `extra=`.
    relationships:
    - rel_type: refines
      spec_id: SL-02-001
    - rel_type: refines
      spec_id: SL-02-002
  - id: SL-02-004
    priority: MUST
    kind: project
    statement: >-
      Interpolating an identifier into the message text MUST NOT be treated as
      satisfying SL-02-001 or SL-02-002; the message may name the identifier for
      readability, but the record attribute is the carrier those requirements
      refer to.
    rationale: >-
      An identifier embedded in free text cannot be filtered, grouped, or asserted on
      without parsing the message, and the narrative INFO template (SL-04-006) names
      the actor for the human reader, not for correlation. Making the record
      attribute the only thing that counts keeps the two audiences from being
      conflated: the message serves the person reading the transcript, the
      attribute serves the tooling.
    verification: >-
      The tests that verify SL-02-001 and SL-02-002 assert on record attributes,
      never on substrings of `record.getMessage()`.
    relationships:
    - rel_type: constrains
      spec_id: SL-02-001
    - rel_type: constrains
      spec_id: SL-02-002
- id: SL-03
  title: Log Level Semantics
  specs:
  - id: SL-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'Log levels MUST follow standard Python `logging` severity semantics: DEBUG for diagnostic detail, INFO for normal protocol operations, WARNING for recoverable anomalies, ERROR for failures requiring attention, and CRITICAL for system-threatening failures.'
- id: SL-04
  title: State Transition Logging
  specs:
  - id: SL-04-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All state transitions MUST be logged at INFO level
  - id: SL-04-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: State transition logs MUST include before state
  - id: SL-04-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: State transition logs MUST include after state
  - id: SL-04-004
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: State transition logs MUST include triggering event (activity type + semantic)
  - id: SL-04-005
    priority: SHOULD
    kind: project
    statement: >-
      Demo scripts and stepwise workflows SHOULD use structured, consistent lifecycle logs
  - id: SL-04-006
    priority: SHOULD
    kind: project
    statement: >-
      State transition log messages SHOULD follow the narrative template
      "Actor '<actor_id>' <verb> '<object_id>' (<STATE_A> → <STATE_B>)" so
      that reading an actor's INFO log tells the complete protocol story
      without requiring DEBUG. See notes/structured-logging.md for the
      full template inventory.
  - id: SL-04-007
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      Infrastructure log lines (persistence store/save/update, BT scaffolding,
      HTTP handler parsing echoes, pipeline completion repeats, FSM internal
      callbacks, per-recipient sync queue entries) MUST NOT be logged at INFO;
      they MUST be logged at DEBUG or lower.
- id: SL-05
  title: Error Context
  specs:
  - id: SL-05-001
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include exception type and message
  - id: SL-05-002
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include stack trace for unexpected exceptions
  - id: SL-05-003
    priority: SHOULD
    kind: project
    statement: ERROR level logs SHOULD include original activity ID if available
- id: SL-06
  title: Authorization Logging
  specs:
  - id: SL-06-001
    priority: SHOULD
    kind: project
    statement: Authorization decisions SHOULD be logged with decision (allowed/denied)
    scope:
    - production
  - id: SL-06-002
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include actor performing action
    scope:
    - production
  - id: SL-06-003
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include resource being accessed
    scope:
    - production
  - id: SL-06-004
    priority: SHOULD
    kind: project
    statement: Authorization logs SHOULD include denial reason if denied
    scope:
    - production
- id: SL-07
  title: Data Access Logging
  specs:
  - id: SL-07-001
    priority: SHOULD
    kind: project
    statement: >-
      Sensitive data operations SHOULD log operation type (CREATE, READ, UPDATE, DELETE)
    scope:
    - production
  - id: SL-07-002
    priority: SHOULD
    kind: project
    statement: Data access logs SHOULD include resource type and ID
    scope:
    - production
  - id: SL-07-003
    priority: SHOULD
    kind: project
    statement: Data access logs SHOULD include actor performing operation
    scope:
    - production
- id: SL-08
  title: Performance Metrics
  specs:
  - id: SL-08-001
    priority: MAY
    kind: project
    statement: System MAY log performance metrics at DEBUG level
    scope:
    - production
