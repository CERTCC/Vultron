id: EH
title: Error Handling
description: >-
  Requirements for handling error conditions in the Vultron inbox handler, covering the
  exception hierarchy and error categories. Governs graceful degradation, clear error
  messages, system stability, and debuggability.
scope:
- prototype
- production
tags:
- error-handling
groups:
- id: EH-01
  title: Exception Hierarchy
  specs:
  - id: EH-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The system MUST define custom exceptions for application-specific errors
    rationale: >-
      A caller must tell an application failure apart from a bug in a library or in
      Python itself. A custom exception names the failure in domain terms. A caller can
      then catch exactly the failures it knows how to handle and let the others show as
      bugs.
  - id: EH-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Custom exceptions MUST inherit from a base VultronError exception
    rationale: >-
      One base class lets a caller, such as the HTTP error handler, catch every
      application failure with one `except` clause. Exceptions from outside the
      hierarchy still show as bugs. This hierarchy belongs to the protocol domain. It
      does not cover the metadata tooling under `vultron/metadata/`, whose loaders raise
      `ValueError` by contract so that their callers can guard one exception pair
      (MS-17-004).
  - id: EH-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Custom exceptions MUST be centralized in `vultron/errors.py`
    rationale: >-
      Errors that several layers raise or catch need one home. `vultron/errors.py`
      imports only the standard library, so core, wire and adapter code can all import
      from it without an import from another layer. One module also shows the shared
      hierarchy in one place.
- id: EH-02
  title: Submodule Errors
  specs:
  - id: EH-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Submodule-specific errors MUST be defined in submodule `errors.py`
    rationale: >-
      An error that only one subsystem raises belongs next to the code that raises it. A
      local `errors.py` keeps the failures of that subsystem easy to find and keeps the
      shared module small.
  - id: EH-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Submodule errors MUST inherit from base custom exceptions in `vultron/errors.py`
    rationale: >-
      A handler that catches `VultronError` or one of its categories also catches a
      subsystem error that inherits from them. A subsystem can then add its own errors,
      and the callers that already handle the general case need no change.
- id: EH-03
  title: Error Categories
  specs:
  - id: EH-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      This codebase MUST define at least four error categories in `vultron/errors.py`.
      The first is `ValidationError`, for malformed or schema-invalid input. The second
      is `NotFoundError`, for a referenced domain object that does not exist. The third
      is `ProtocolError`, for an invalid state-machine transition or message semantics.
      The fourth is `SecurityError`, for an authentication or authorization failure.
    rationale: >-
      A caller decides what to do from the kind of failure, not from the message text.
      Bad input, a missing object, a protocol violation and a security failure each need
      a different response, for example a different HTTP status. Fixed categories give
      each of these responses one exception type to catch.
  - id: EH-03-002
    priority: MAY
    kind: project
    statement: >-
      This codebase MAY define more error categories in `vultron/errors.py` as it needs
      them.
    rationale: >-
      The four categories of EH-03-001 are a floor. A failure that needs its own
      response can get its own exception type, and no caller has to tell it apart by
      message text.
- id: EH-04
  title: Error Context
  specs:
  - id: EH-04-001
    priority: SHOULD
    kind: project
    statement: Exceptions SHOULD include contextual information
    rationale: >-
      A message alone often does not tell an operator which activity, actor or object
      failed. Context on the exception, such as the activity ID, lets the log and the
      HTTP response point to the item that failed. The operator can then find the fault
      faster.
- id: EH-05
  title: Error Response Format
  specs:
  - id: EH-05-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'HTTP error responses MUST include a structured JSON body with at minimum the following fields: `error` (string — machine-readable error code from the VultronError hierarchy), `message` (string — human-readable description), and `status` (integer — HTTP status code mirroring the response status).'
    rationale: >-
      A client must tell failures apart without reading prose. A fixed JSON body with a
      machine-readable code, a human-readable message and the status code gives every
      error response the same shape. One client parser can then handle all of them.
    relationships:
    - rel_type: depends_on
      spec_id: HTTP-03-001
  - id: EH-05-002
    priority: MUST
    kind: project
    statement: >-
      An HTTP error response that reports more than one distinct violation MUST include
      a `details` field, an array with one entry per violation.
    rationale: >-
      When a request has several violations and the response names only one, the caller
      fixes one problem, sends the request again and learns of the next. The rejection
      is atomic, so nothing changed between the attempts. `details` gives one entry for
      each violation, so a caller does not have to parse `message`. Such a parse breaks
      when the order of the internal checks changes.
    relationships:
    - rel_type: refines
      spec_id: EH-05-001
    - rel_type: depends_on
      spec_id: EH-07-001
    adr:
    - ADR-0086
    verification: >-
      `test_details_has_one_entry_per_violation` in
      `test/adapters/driving/fastapi/test_errors.py` translates a two-violation error
      and asserts a 422 whose `details` array has one entry per violation.
  - id: EH-05-003
    priority: MUST
    kind: project
    statement: >-
      Each entry of the `details` array (EH-05-002) MUST carry the violation's
      human-readable `message`.
    rationale: >-
      An entry without its own text tells the caller that a violation exists but not
      what it is. The caller would then have to match entries to parts of the joined
      `message`.
    verification: >-
      `test_each_entry_carries_its_message` in
      `test/adapters/driving/fastapi/test_errors.py` asserts each entry's `message`.
    relationships:
    - rel_type: extends
      spec_id: EH-05-002
    adr:
    - ADR-0086
  - id: EH-05-004
    priority: MUST
    kind: project
    statement: >-
      Each entry of the `details` array (EH-05-002) MUST state whether its violation is
      a root cause or is derived from another reported violation.
    rationale: >-
      One bad value often causes more violations. The label tells the caller which
      entries to fix first, so a long list stays readable (EH-07-002).
    verification: >-
      `test_each_entry_identifies_root_or_derived` in
      `test/adapters/driving/fastapi/test_errors.py` asserts the `classification` of
      each entry.
    relationships:
    - rel_type: extends
      spec_id: EH-05-002
    - rel_type: uses_definition
      spec_id: EH-07-002
    adr:
    - ADR-0086
  - id: EH-05-005
    priority: MUST
    kind: project
    statement: >-
      When an HTTP error response reports more than one violation, its `message` field
      MUST stay a human-readable rendering of the whole set.
    rationale: >-
      A caller that reads only `message` still sees every violation. Adding `details`
      then makes no text-only caller worse off.
    verification: >-
      `test_message_still_renders_the_whole_set` in
      `test/adapters/driving/fastapi/test_errors.py` asserts that `message` names both
      violations.
    relationships:
    - rel_type: refines
      spec_id: EH-05-001
    adr:
    - ADR-0086
- id: EH-06
  title: Error Logging
  specs:
  - id: EH-06-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All errors MUST be logged at the level defined by SL-03-001 log level semantics
    rationale: >-
      The log level of an error tells an operator how serious it is. One set of level
      rules (SL-03-001) keeps a recoverable fault from raising an alarm and keeps a real
      failure from being hidden at DEBUG.
    relationships:
    - rel_type: depends_on
      spec_id: SL-03-001
- id: EH-07
  title: Multi-Violation Rejection
  specs:
  - id: EH-07-001
    priority: MUST
    kind: project
    statement: >-
      A validation boundary that rejects its input as a unit MUST report every
      violation it can recognise in that input, not only the first. Rejecting
      atomically does not license reporting a single reason: no partial progress was
      accepted, so a caller told one reason at a time gains nothing from the round
      trip.
    rationale: >-
      Atomic rejection decides what the system writes. It does not decide what the
      system reports. A boundary that reports only the first violation makes the caller
      fix one problem at a time. Each attempt costs a round trip, and the boundary kept
      no partial work that could justify that cost.
    adr:
    - ADR-0086
    verification: >-
      A request invalid in two independent dimensions reports both violations, and
      persists nothing.
  - id: EH-07-002
    priority: MUST
    kind: project
    statement: >-
      When a validation boundary reports multiple violations, it MUST classify each
      violation as root or derived. A rule that reads one dimension is always root. A
      rule that reads more than one dimension is derived when a dimension it reads
      already carries a single-dimension violation. Otherwise it is root. Dimension
      overlap is a proxy for the real test, which is remediation. A violation is derived
      when the remediation the caller applies to the overlapping single-dimension
      violation also clears it. The proxy holds only while that premise does. For a
      transition fault, the expected remediation is to assert a legal value. That clears
      the entailment that read the illegal value. For a role gate, the expected
      remediation is to **withdraw the assertion**, not to acquire the role. A
      participant does not hold a dimension it has no role for (a non-DEPLOYER's `d` is
      absent, not initial; ADR-0075). An actor cannot grant itself a role. An author
      MUST check a new rule family whose expected remediation is neither of those
      against the remediation test before relying on the overlap proxy.
    rationale: >-
      One bad dimension often causes more violations. A list that does not rank them
      becomes a long list of errors that one fix mostly clears. The root and derived
      labels tell the caller which violations to fix first. The label uses dimension
      overlap and not a graph of which rule depends on which. Thus a new rule whose fix
      is a legal value or a withdrawn assertion gets the correct label with no extra
      work. A root violation that reads several dimensions is the most useful one: each
      dimension moved legally on its own, but the combination is not possible. The
      overlap rule is correct only while the expected fix holds, so the statement names
      that fix. For a role gate the fix is to withdraw the assertion. A participant has
      no value on a dimension it has no role for (ADR-0075), so a role gate cannot
      mislabel its consequences.
    relationships:
    - rel_type: refines
      spec_id: EH-07-001
    adr:
    - ADR-0086
    verification: >-
      A cross-dimension violation whose dimensions are each individually valid is
      labelled root; the same violation is labelled derived when one of its
      dimensions independently failed its own transition check.
    lint_suppress:
    # compound_statement: the second MUST bounds when the first's overlap
    # classification may be relied on; it adds no duty a separate check could
    # verify on its own.
    - compound_statement
  - id: EH-07-003
    priority: MUST
    kind: project
    statement: >-
      A `VultronError` subclass raised to report multiple violations MUST carry them as
      structured data on the exception. Then no caller has to parse a joined message to
      recover them.
    rationale: >-
      `DemoFailureError` already establishes this shape for the demo runner
      (DEMOCI-01-003). Reusing it rather than inventing a second aggregation
      mechanism keeps one pattern for accumulate-all-then-fail, and lets the
      structured list reach the HTTP layer (EH-05-002) without new plumbing.
    relationships:
    - rel_type: refines
      spec_id: EH-04-001
    - rel_type: refines
      spec_id: EH-01-002
    adr:
    - ADR-0086
    verification: >-
      `test_violations_are_available_without_parsing_the_message` in
      `test/test_errors.py` asserts the raised exception exposes one structured entry
      per violation.
  - id: EH-07-004
    priority: MUST
    kind: project
    statement: >-
      A `VultronError` subclass raised to report multiple violations MUST render the
      whole set in `str()`.
    rationale: >-
      The HTTP layer and the logs use `str()` of the exception. When `str()` names every
      violation, a reader of the text alone still sees the whole set (EH-05-005).
    verification: >-
      `test_str_renders_every_violation` in `test/test_errors.py` asserts that `str()`
      names every violation.
    relationships:
    - rel_type: extends
      spec_id: EH-07-003
    adr:
    - ADR-0086
