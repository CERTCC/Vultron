id: EH
title: Error Handling
description: >-
  Requirements for handling error conditions in the Vultron inbox handler, covering the
  exception hierarchy and error categories. Governs graceful degradation, clear error
  messages, system stability, and debuggability.
scope:
- prototype
- production
tags:
- error-handling
groups:
- id: EH-01
  title: Exception Hierarchy
  specs:
  - id: EH-01-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The system MUST define custom exceptions for application-specific errors
    rationale: >-
      A caller must tell an application failure apart from a bug in a library or in
      Python itself. A custom exception names the failure in domain terms. A caller can
      then catch exactly the failures it knows how to handle and let the others show as
      bugs.
  - id: EH-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Custom exceptions MUST inherit from a base VultronError exception
    rationale: >-
      One base class lets a caller, such as the HTTP error handler, catch every
      application failure with one `except` clause. Exceptions from outside the
      hierarchy still show as bugs. This hierarchy belongs to the protocol domain. It
      does not cover the metadata tooling under `vultron/metadata/`, whose loaders raise
      `ValueError` by contract so that their callers can guard one exception pair
      (MS-17-004).
  - id: EH-01-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Custom exceptions MUST be centralized in `vultron/errors.py`
    rationale: >-
      Errors that several layers raise or catch need one home. `vultron/errors.py`
      imports only the standard library, so core, wire and adapter code can all import
      from it without an import from another layer. One module also shows the shared
      hierarchy in one place.
- id: EH-02
  title: Submodule Errors
  specs:
  - id: EH-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Submodule-specific errors MUST be defined in submodule `errors.py`
    rationale: >-
      An error that only one subsystem raises belongs next to the code that raises it. A
      local `errors.py` keeps the failures of that subsystem easy to find and keeps the
      shared module small.
  - id: EH-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Submodule errors MUST inherit from base custom exceptions in `vultron/errors.py`
    rationale: >-
      A handler that catches `VultronError` or one of its categories also catches a
      subsystem error that inherits from them. A subsystem can then add its own errors,
      and the callers that already handle the general case need no change.
- id: EH-03
  title: Error Categories
  specs:
  - id: EH-03-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'The system MUST define at least the following error categories in `vultron/errors.py`: `ValidationError` (malformed or schema-invalid input), `NotFoundError` (referenced domain object does not exist), `ProtocolError` (invalid state-machine transition or message semantics), and `SecurityError` (authentication or authorization failure). Additional categories MAY be defined as needed.'
    rationale: >-
      A caller decides what to do from the kind of failure, not from the message text.
      Bad input, a missing object, a protocol violation and a security failure each need
      a different response, for example a different HTTP status. Fixed categories give
      each of these responses one exception type to catch.
- id: EH-04
  title: Error Context
  specs:
  - id: EH-04-001
    priority: SHOULD
    kind: project
    statement: Exceptions SHOULD include contextual information
    rationale: >-
      A message alone often does not tell an operator which activity, actor or object
      failed. Context on the exception, such as the activity ID, lets the log and the
      HTTP response point to the item that failed. The operator can then find the fault
      faster.
- id: EH-05
  title: Error Response Format
  specs:
  - id: EH-05-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: 'HTTP error responses MUST include a structured JSON body with at minimum the following fields: `error` (string — machine-readable error code from the VultronError hierarchy), `message` (string — human-readable description), and `status` (integer — HTTP status code mirroring the response status).'
    rationale: >-
      A client must tell failures apart without reading prose. A fixed JSON body with a
      machine-readable code, a human-readable message and the status code gives every
      error response the same shape. One client parser can then handle all of them.
    relationships:
    - rel_type: depends_on
      spec_id: HTTP-03-001
  - id: EH-05-002
    priority: MUST
    kind: project
    statement: >-
      An HTTP error response reporting more than one distinct violation MUST include
      a `details` field: an array with one entry per violation. Each entry MUST carry
      the violation's human-readable `message`, and MUST identify whether the
      violation is a root cause or is derived from another reported violation. The
      `message` field MUST remain a human-readable rendering of the whole set, so a
      caller reading only `message` still sees every violation.
    rationale: >-
      When a request has several violations and the response names only one, the caller
      fixes one problem, sends the request again and learns of the next. The rejection
      is atomic, so nothing changed between the attempts. `details` gives one entry for
      each violation, so a caller does not have to parse `message`. Such a parse breaks
      when the order of the internal checks changes. `message` still names every
      violation, so a caller that reads only the text loses nothing.
    relationships:
    - rel_type: refines
      spec_id: EH-05-001
    - rel_type: depends_on
      spec_id: EH-07-001
    adr:
    - ADR-0086
    verification: >-
      A request invalid in two independent dimensions returns a 422 whose `details`
      array has one entry per violation, and whose `message` names both.
- id: EH-06
  title: Error Logging
  specs:
  - id: EH-06-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All errors MUST be logged at the level defined by SL-03-001 log level semantics
    rationale: >-
      The log level of an error tells an operator how serious it is. One set of level
      rules (SL-03-001) keeps a recoverable fault from raising an alarm and keeps a real
      failure from being hidden at DEBUG.
    relationships:
    - rel_type: depends_on
      spec_id: SL-03-001
- id: EH-07
  title: Multi-Violation Rejection
  specs:
  - id: EH-07-001
    priority: MUST
    kind: project
    statement: >-
      A validation boundary that rejects its input as a unit MUST report every
      violation it can recognise in that input, not only the first. Rejecting
      atomically does not license reporting a single reason: no partial progress was
      accepted, so a caller told one reason at a time gains nothing from the round
      trip.
    rationale: >-
      Atomic rejection decides what the system writes. It does not decide what the
      system reports. A boundary that reports only the first violation makes the caller
      fix one problem at a time. Each attempt costs a round trip, and the boundary kept
      no partial work that could justify that cost.
    adr:
    - ADR-0086
    verification: >-
      A request invalid in two independent dimensions reports both violations, and
      persists nothing.
  - id: EH-07-002
    priority: MUST
    kind: project
    statement: >-
      When a validation boundary reports multiple violations, each violation MUST be
      classified as root or derived. A rule reading a single dimension is always
      root. A rule reading more than one dimension is derived when any dimension it
      reads already carries a single-dimension violation, and root otherwise.
      Dimension overlap is a proxy for the real test, which is remediation: a
      violation is derived when the remediation the caller is expected to apply to
      the overlapping single-dimension violation also clears it. The proxy holds
      only while that premise does. For a transition fault the expected remediation
      is asserting a legal value, which clears the entailment that read the illegal
      one. For a role gate the expected remediation is **withdrawing the
      assertion**, not acquiring the role — a participant does not hold a dimension
      it has no role for at all (a non-DEPLOYER's `d` is absent, not initial;
      ADR-0075) and an actor cannot grant itself a role. Any rule family added later
      whose expected remediation is neither of those MUST be checked against the
      remediation test before relying on the overlap proxy.
    rationale: >-
      One bad dimension often causes more violations. A list that does not rank them
      becomes a long list of errors that one fix mostly clears. The root and derived
      labels tell the caller which violations to fix first. The label uses dimension
      overlap and not a graph of which rule depends on which. Thus a new rule gets the
      correct label with no extra work, and the labels cannot go out of date. A root
      violation that reads several dimensions is the most useful one: each dimension
      moved legally on its own, but the combination is not possible. The statement makes
      the remediation premise explicit because the overlap rule is correct only while
      that premise holds. A reader who treats overlap as a pure graph property expects a
      role gate to mislabel its consequences. That expectation needs a participant on a
      dimension it has no role for, which ADR-0075 makes unreachable.
    relationships:
    - rel_type: refines
      spec_id: EH-07-001
    adr:
    - ADR-0086
    verification: >-
      A cross-dimension violation whose dimensions are each individually valid is
      labelled root; the same violation is labelled derived when one of its
      dimensions independently failed its own transition check.
  - id: EH-07-003
    priority: MUST
    kind: project
    statement: >-
      A `VultronError` subclass raised to report multiple violations MUST carry them
      as structured data on the exception, and MUST render the whole set in `str()`.
      Callers MUST NOT be required to parse a joined message to recover the
      individual violations.
    rationale: >-
      `DemoFailureError` already establishes this shape for the demo runner
      (DEMOCI-01-003). Reusing it rather than inventing a second aggregation
      mechanism keeps one pattern for accumulate-all-then-fail, and lets the
      structured list reach the HTTP layer (EH-05-002) without new plumbing.
    relationships:
    - rel_type: refines
      spec_id: EH-04-001
    - rel_type: refines
      spec_id: EH-01-002
    adr:
    - ADR-0086
    verification: >-
      The raised exception exposes one structured entry per violation, and `str()`
      names every one of them.
