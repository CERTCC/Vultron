id: AF
title: Activity Factory Functions
description: Requirements governing the factory function API for constructing outbound Vultron protocol activities. Factory
  functions are the sole public construction API for activity objects outside the wire vocabulary layer, replacing direct
  subclass instantiation to enforce consistent field population and layer separation.
scope:
- prototype
- production
tags:
- messaging
- wire-format
groups:
- id: AF-01
  title: Purpose and Scope
  specs:
  - id: AF-01-001
    priority: MUST
    kind: project
    statement: Factory functions MUST be the sole public construction API for outbound Vultron protocol activities
    rationale: >-
      When every outbound activity is built in one place, the rules for its fields are
      applied in one place. Code that instantiates an activity class directly can skip a
      field or a check that the factory applies. The recipient then gets an incomplete
      activity.
    verification: Architecture test in `test/architecture/` confirms that no module outside `vultron/wire/as2/vocab/activities/`
      and `vultron/wire/as2/factories/` directly instantiates a Vultron activity subclass.
  - id: AF-01-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Factory functions MUST return plain AS2 base types (e.g. `as_Offer`, `as_Accept`, `as_Create`) rather than
      Vultron activity subclasses
    rationale: >-
      Callers depend only on the standard AS2 types. The internal activity subclasses
      can then change without a change to any caller. Callers also cannot come to depend
      on behavior that only an internal subclass has.
  - id: AF-01-003
    priority: MUST
    kind: project
    statement: Factory function signatures MUST declare explicit, domain-typed parameters for all protocol-significant fields
    rationale: >-
      Explicit, typed parameters let the type checkers and the reader see what each
      factory needs. A generic dict or `Any` parameter hides a missing or wrong protocol
      field until run time, or until a recipient refuses the activity.
    verification: Inspection of `vultron/wire/as2/factories/` confirms that each factory function signature uses typed
      domain parameters (not generic dicts or `Any`) for all protocol-significant fields.
  - id: AF-01-004
    priority: SHOULD
    kind: project
    statement: Factory functions SHOULD accept `**kwargs` for optional AS2 fields that are not protocol-significant, forwarding
      them to the underlying AS2 constructor
    rationale: >-
      Fields such as `published` and `summary` apply to many activities and do not
      change what the activity means. When the factory passes them through `**kwargs`,
      each signature stays short, and no factory needs one parameter for each optional
      AS2 field.
  - id: AF-01-005
    priority: MUST
    kind: project
    statement: >-
      When the fields of a domain entity decide how a factory enriches the wire object,
      the factory MUST accept the complete domain object. An example is a case whose
      embargo state decides whether `activeEmbargo` appears in
      the stub.
    rationale: >-
      The core class is its own wire form (ARCH-25-003, ADR-0099), and ARCH-22-001 lets
      the wire layer import it. The factory thus needs no separate wire copy of the
      object, and it can read every field the object has.
    verification: >-
      The factory package's imports from `vultron.core` stay inside the ARCH-22-001
      allow-list (`test/architecture/test_wire_core_import_allowlist.py`).
    adr:
    - ADR-0099
  - id: AF-01-006
    priority: MUST
    kind: project
    statement: >-
      A factory that accepts a domain entity (AF-01-005) MUST derive the enrichment from
      that object's own fields.
    rationale: >-
      When two places compute the same enrichment, the results drift apart. When the
      factory derives it from the object's own fields, the wire object always agrees
      with the domain object.
    verification: >-
      Each factory that enriches from a domain entity reads only fields of the object it
      was handed, and the factory package's imports from `vultron.core` stay inside the
      ARCH-22-001 allow-list (`test/architecture/test_wire_core_import_allowlist.py`).
    relationships:
    - rel_type: extends
      spec_id: AF-01-005
    adr:
    - ADR-0099
  - id: AF-01-007
    priority: MUST_NOT
    kind: project
    statement: >-
      A caller MUST NOT hand a factory a hand-built partial stub in place of the domain
      object, such as an `as_VulnerabilityCaseStub` assembled field by field.
    rationale: >-
      A partial stub that a caller builds field by field can omit a field the object
      supplies, for example `end_time` on an embargo event. The recipient then gets less
      than the sender knows.
    verification: >-
      `test_no_production_module_outside_the_wire_layer_builds_a_case_stub` in
      `test/architecture/test_factory_wire_spelling_and_stubs.py` asserts that no module
      under `vultron/` outside `vultron/wire/as2/` names `as_VulnerabilityCaseStub`.
    adr:
    - ADR-0099
  - id: AF-01-008
    priority: MUST_NOT
    kind: project
    statement: >-
      A factory MUST NOT spell an AS2 field name by hand. The field alias a core object
      inherits (ARCH-12-013) is the only source of the wire spelling, and delivery
      renders through the port (ARCH-20-001).
    rationale: >-
      When the inherited alias is the only source of each wire spelling, a factory
      cannot spell a field differently from the rest of the system.
    verification: >-
      `test_no_factory_spells_an_as2_member_name_by_hand` in
      `test/architecture/test_factory_wire_spelling_and_stubs.py` fails on a camelCase
      string literal in `vultron/wire/as2/factories/` that is not a docstring.
    adr:
    - ADR-0099
    relationships:
    - rel_type: uses_definition
      spec_id: ARCH-12-013
    see_also:
    - spec_id: ARCH-20-001
      reason: 'context for the reader'
- id: AF-02
  title: Module Structure
  specs:
  - id: AF-02-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: All factory functions MUST live in the `vultron/wire/as2/factories/` package — a sibling of `vultron/wire/as2/vocab/`
    rationale: >-
      One package for every factory gives callers one import location. It also gives the
      import-boundary test (AF-06-001) one directory to allow. A factory outside that
      package would be a way to build activities that the test does not check.
  - id: AF-02-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      The `factories/` package MUST hold one module per protocol domain, one for each
      module in `vocab/activities/`, such as `embargo.py`, `report_management.py` and
      `case_management.py`.
    rationale: >-
      A factory module for each vocabulary module lets a reader find the factory for an
      activity from the module of its class.
  - id: AF-02-005
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A change that adds a `vocab/activities/` module MUST add its `factories/` module
      in the same change.
    rationale: >-
      A new vocabulary module with no factory module has activities that only direct
      instantiation can build, which AF-01-001 forbids.
    relationships:
    - rel_type: extends
      spec_id: AF-02-002
  - id: AF-02-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: '`factories/__init__.py` MUST re-export every factory function from all domain modules so callers can use a
      single `from vultron.wire.as2.factories import ...` import'
    rationale: >-
      One import path keeps call sites short. The package can also move a factory
      between its domain modules without a change to any caller.
- id: AF-03
  title: Function Naming
  specs:
  - id: AF-03-001
    priority: MUST
    kind: project
    statement: Factory function names MUST be the snake_case equivalent of the corresponding Vultron activity class name
    rationale: >-
      A predictable name lets a reader find the factory from the activity class, and the
      class from the factory. It also prevents two different names for the same
      activity.
    verification: >-
      Inspection of `vultron/wire/as2/factories/` confirms each factory function name
      is the `snake_case` form of its corresponding activity class name without the
      leading underscore (e.g., `em_propose_embargo_activity` for
      `_EmProposeEmbargoActivity`).
- id: AF-04
  title: Error Handling
  specs:
  - id: AF-04-001
    priority: MUST
    kind: project
    statement: Every factory function MUST wrap Pydantic `ValidationError` in `VultronActivityConstructionError`
    rationale: >-
      A caller must not need to know that the factories use Pydantic. One domain
      exception for every construction failure gives callers one type to catch. The
      Pydantic error stays attached as its cause, for diagnosis.
    verification: >-
      `test/wire/as2/factories/test_construct.py` asserts that `build_activity`, the
      one helper every factory builds through, raises the construction error with the
      `ValidationError` as its cause, for a constructor failure and for an argument
      expression that refuses; and that no factory-package function catches
      `ValidationError` itself outside a pinned exemption set.
  - id: AF-04-002
    priority: MUST
    kind: project
    statement: >-
      `vultron/wire/as2/factories/__init__.py` MUST re-export
      `VultronActivityConstructionError`, which `vultron/errors.py` defines.
    rationale: >-
      Callers import the factories from `vultron.wire.as2.factories`. When the package
      also exports the exception, a caller can catch construction failures without an
      import from a second module. The class is defined in `vultron/errors.py` with the
      rest of the shared hierarchy, under `VultronError` (EH-01-002).
    verification: >-
      `test_construction_error_reexported_from_package` in
      `test/wire/as2/factories/test_errors.py` asserts that the class the package
      exports is the one `vultron.errors` defines, and that the package's `__all__`
      lists it.
  - id: AF-04-003
    priority: SHOULD
    kind: project
    statement: Factory functions SHOULD log a `WARNING` before raising `VultronActivityConstructionError` so that construction
      failures are observable without requiring callers to catch the exception
    rationale: >-
      A caller can catch the exception and handle it, and the failure is then hidden. A
      WARNING at the point of failure records which factory failed and why, even when a
      caller hides the exception.
    verification: >-
      `test/wire/as2/factories/test_construct.py` asserts that `build_activity` logs a
      WARNING naming the factory before it raises, and that each report factory does.
- id: AF-05
  title: Internal Vocabulary Classes
  specs:
  - id: AF-05-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: Vultron activity subclasses in `vultron/wire/as2/vocab/activities/` MUST NOT be imported by any module outside
      that package or `vultron/wire/as2/factories/`
    rationale: >-
      The internal subclasses are implementation details of the factories. When outside
      code cannot import them, it cannot build activities without a factory (AF-01-001).
      The subclasses can also change without a change to any caller.
  - id: AF-05-002
    priority: MUST
    kind: project
    statement: Inside each factory function the corresponding internal class MUST be instantiated first; the result is returned
      typed as the plain AS2 base type
    rationale: >-
      The internal subclass holds the validation and the fixed fields of its activity,
      such as its type and the shape of its object. The factory instantiates the
      subclass first, so those rules apply. The factory then returns the plain AS2 type,
      which keeps callers on the public types (AF-01-002).
    verification: Inspection of `vultron/wire/as2/factories/` confirms that each factory function instantiates the
      internal Vultron subclass and returns it annotated as the plain AS2 base type (e.g., `as_Offer`, `as_Accept`).
  - id: AF-05-003
    priority: SHOULD
    kind: project
    statement: Internal Vultron activity classes SHOULD be prefixed with `_` or otherwise marked as private once factory functions
      exist for them, to signal that they are implementation details
    rationale: >-
      A leading underscore tells readers and linters that a name is private. On an
      internal activity class, it shows that callers must use the factory and not the
      class.
- id: AF-06
  title: Import Boundary Enforcement
  specs:
  - id: AF-06-001
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: A pytest test in `test/architecture/` MUST verify that no Python source file outside `vultron/wire/as2/vocab/activities/`
      and `vultron/wire/as2/factories/` contains an import from `vultron.wire.as2.vocab.activities`
    rationale: >-
      A rule about imports that no test checks erodes as soon as one module breaks it.
      An architecture test fails the build on the first import of an internal activity
      class from outside the allowed packages, so the factory boundary (AF-05-001) stays
      in place.
  - id: AF-06-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: The `test/architecture/` package MUST be a proper pytest package (`__init__.py` present) so that future architectural
      enforcement tests can be added alongside it
    rationale: >-
      pytest needs `__init__.py` to treat the directory as a package, so that test
      modules with the same file name in other directories do not collide. Architecture
      tests can then share helpers in the package and grow next to each other.
- id: AF-07
  title: TypeAlias Naming
  specs:
  - id: AF-07-003
    priority: SHOULD
    kind: project
    statement: >-
      A `TypeAlias` that a `vocab/activities/` module defines for its own use only
      SHOULD carry a leading underscore.
    rationale: >-
      A name used only in one module is private. A leading underscore keeps other
      modules from importing it and shows that it is not part of the public vocabulary.
- id: AF-09
  title: Activity Translator Port
  specs:
  - id: AF-09-001
    priority: MUST_NOT
    kind: project
    verification_debt: '#2575'
    statement: >-
      A core use case in `vultron/core/use_cases/` MUST NOT import from `vultron/wire/`
      directly.
    rationale: '`from_core()` is a wire-layer method. Calling it directly from core use-cases inverts the hexagonal architecture
      dependency direction: core→wire. The Activity Translator port pattern maintains the correct direction (core defines
      the port; wire implements it) while providing the same functional capability.'
    relationships:
    - rel_type: refines
      spec_id: ARCH-01-001
  - id: AF-09-003
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A core use case MUST turn domain objects into wire activities through the Activity
      Translator port. The port is a driven-adapter `Protocol` defined in
      `vultron/core/`, and an adapter in the wire layer implements it. It replaces the
      `from_core()` calls in `vultron/core/use_cases/`.
    rationale: >-
      The use case still needs wire activities after AF-09-001 removes its wire
      imports. The port gives it that capability, and core keeps the dependency
      direction: core defines the port and the wire layer implements it.
    relationships:
    - rel_type: implements
      spec_id: AF-09-001
  - id: AF-09-002
    priority: MUST
    kind: project
    verification_debt: '#2575'
    statement: >-
      A use case MUST receive the Activity Translator port by dependency injection and
      not create the wire-layer translator itself. The port arrives as a constructor
      parameter or factory argument.
    rationale: >-
      A use case that creates the translator itself must import the wire layer, which
      AF-09-001 forbids. Injection keeps that import out of core. It also lets a test
      give the use case a stub translator.
    relationships:
    - rel_type: extends
      spec_id: AF-09-003
